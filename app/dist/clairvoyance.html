 and contracted, the system as we know it was formed.<\/p>", "images": []}, {"pdf_page_index": 108, "pdf_page_number": 109, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Occult science accepts that theory, in its broad outline, as correctly representing the purely physical side of the evolution of our system, but it would add that if we confine our attention to this physical side only we shall have a very incomplete and incoherent idea of what really happened. It would postulate, to begin with, that the exalted Being who undertakes the formation of a system (whom we sometimes call the Logos of the system) first of all forms in His mind a complete conception of the whole of it with all its successive chains of worlds. By the very act of forming that conception He calls the whole into simultaneous objective existence on the plane of His thought—a plane of course far above all those of which we know anything—from which the various globes descend when required into whatever state of further objectivity may be respectively destined for them. Unless we constantly bear in mind this fact of the real existence of the whole system from the very beginning on a higher plane, we shall be perpetually misunderstanding the physical evolution which we see taking place down here.<\/p>", "images": []}, {"pdf_page_index": 109, "pdf_page_number": 110, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>But Occultism has more than this to teach us on the subject. It tells us not only that all this wonderful system to which we belong is called into existence by the Logos, both on lower and on higher planes, but also that its relation to Him is closer even than that, for it is absolutely a part of Him—a partial expression of Him upon the physical plane—and that the movement and energy of the whole system is His energy, and is all carried on within the limits of His aura. Stupendous as this conception is, it will yet not be wholly unthinkable to those of us who have made any study of the subject of the aura.<\/p>", "images": []}, {"pdf_page_index": 110, "pdf_page_number": 111, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>We are familiar with the idea that as a person progresses on the upward path his causal body, which is the determining limit of his aura, distinctly increases in size as well as in luminosity and purity of colour. Many of us know from experience that the aura of a pupil who has already made considerable advance on the Path is very much larger than that of one who is but just setting his foot upon its first step, while in the case of an Adept the proportional increase is far greater still. We read in quite exoteric Oriental scriptures of the immense extension of the aura of the Buddha; I think that three miles is mentioned on one occasion as its limit, but whatever the exact measurement may be, it is obvious that we have here another record of this fact of the extremely rapid growth of the causal body as man passes on his upward way. There can be little doubt that the rate of this growth would itself increase in geometrical progression, so that it need not surprise us to hear of an Adept on a still higher level whose aura is capable of including the entire world at once; and from this we may gradually lead our minds up to the conception that there is a Being so exalted as to comprehend within Himself the whole of our solar system. And we should remember that, enormous as this seems to us, it is but as the tiniest drop in the vast ocean of space.<\/p>", "images": []}, {"pdf_page_index": 111, "pdf_page_number": 112, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>So of the Logos (who has in Him all the capacities and qualities with which we can possibly endow the highest God we can imagine) it is literally true, as was said of old, that “of Him and through Him, and to Him are all things”, and “in Him we live and move and have our being.”<\/p><p>Now if this be so, it is clear that whatever happens within our system happens absolutely within the consciousness of its Logos, and so we at once see that the true record must be His memory; and furthermore, it is obvious that on whatever plane that wondrous memory exists, it cannot but be far above anything that we know, and consequently whatever records we may find ourselves able to read must be only a reflection of that great dominant fact, mirrored in the denser media of the lower planes.<\/p>", "images": []}, {"pdf_page_index": 112, "pdf_page_number": 113, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>On the astral plane it is at once evident that this is so—that what we are dealing with is only a reflection of a reflection, and an exceedingly imperfect one, for such records as can be reached there are fragmentary in the extreme, and often seriously distorted. We know how universally water is used as a symbol of the astral light, and in this particular case it is a remarkably apt one. From the surface of still water we may get a clear reflection of the surrounding objects, just as from a mirror; but at the best it is only a reflection—a representation in two dimensions of three-dimensional objects, and therefore differing in all its qualities, except colour, from that which it represents; and in addition to this, it is always reversed.<\/p><p>But let the surface of the water be ruffled by the wind and what do we find then? A reflection still, certainly, but so broken up and distorted as to be quite useless or even misleading as a guide to the shape and real appearance of the objects reflected. Here and there for a moment we might happen to get a clear reflection of some minute part of the scene—of a single leaf from a tree, for example; but it would need long labour and considerable knowledge of natural laws to build up anything like a true conception of the object reflected by putting together even a large number of such isolated fragments of an image of it.<\/p>", "images": []}, {"pdf_page_index": 113, "pdf_page_number": 114, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Now in the astral plane we can never have anything approaching to what we have imaged as a still surface, but on the contrary we have always to deal with one in rapid and bewildering motion; judge, therefore, how little we can depend upon getting a clear and definite reflection. Thus a clairvoyant who possesses only the faculty of astral sight can never rely upon ay picture of the past that comes before him as being accurate and perfect; here and there some part of it may be so, but he has no means of knowing which it is. If he is under the care of a competent teacher he may, by long and careful training, be shown how to distinguish between reliable and unreliable impressions, and to construct from the broken reflections some kind of image of the object reflected; but usually long before he has mastered those difficulties he will have developed the mental sight, which renders such labour unnecessary.<\/p>", "images": []}, {"pdf_page_index": 114, "pdf_page_number": 115, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>On the next plane, which we call the mental, conditions are very different. There the record is full and accurate, and it would be impossible to make any mistake in the reading. That is to say, if three clairvoyants possessing the powers of the mental plane agreed to examine a certain record there, what would be presented to their vision would be absolutely the same reflection in each case, and each would acquire a correct impression from it in reading it. It does not, however, follow that when they all compared notes later on the physical plane their reports would agree exactly. It is well known that, if three people who witness an occurrence down here in the physical world set to work to describe it afterwards, their accounts will differ considerably, for each will have noticed especially those items which most appeal to him, and will insensibly have made them the prominent features of the event, sometimes ignoring other points which were in reality much more important.<\/p>", "images": []}, {"pdf_page_index": 115, "pdf_page_number": 116, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Now in the case of an observation on the mental plane this personal equation would not appreciably affect the impressions received, for since each would thoroughly grasp the entire subject it would be impossible for him to see its parts out of due proportion; but, except in the case of carefully trained and experienced persons, this factor does come into play in transferring the impressions to the lower planes. It is in the nature of things impossible that any account given down here of a vision or experience on the mental plane can be complete, since nine-tenths of what is seen and felt there could not be expressed by physical words at all; and, since all expression must therefore be partial, there is obviously some possibility of selection as to the part expressed. It is for this reason that in all our Theosophical investigations of recent years so much stress has been laid upon the constant checking and verifying of clairvoyant testimony, nothing which rests upon the vision of one person only having been allowed to appear in our later books.<\/p>", "images": []}, {"pdf_page_index": 116, "pdf_page_number": 117, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>But even when the possibility of errors from this factor of personal equation has been reduced to a minimum by a careful system of counterchecking, there still remains the very serious difficulty which is inherent in the operation of bringing down impressions from a higher plane to a lower one. This is something analogous to the difficulty experienced by a painted in his endeavour to reproduce a three-dimensional landscape on a flat surface—that is, practically in two dimensions. Just as the artist needs long and careful training of eye and hand before he can produce a satisfactory representation of Nature, so does the clairvoyant need long and careful training before he can describe accurately on a lower plane what he sees on a higher one; and the probability of getting an exact description from an untrained person is about equal to that of getting a perfectly-finished landscape from one who has never learn how to draw.<\/p>", "images": []}, {"pdf_page_index": 117, "pdf_page_number": 118, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>It must be remembered, too, that the most perfect picture is in reality infinitely far from being a reproduction of the scene which it represents, for hardly a single line or angle in it can ever be the same as those in the object copied. It is simply a very ingenious attempt to make upon one only of our five senses, by means of lines and colours on a flat surface, an impression similar to that which would have been made if we had actually had before us the scene depicted. Except by a suggestion dependent entirely on our own previous experience, it can convey to us nothing of the roar of the sea, of the scent of the flowers, of the taste of the fruit, of of the softness or hardness of the surface drawn.<\/p><p>Of exactly similar nature, though far greater in degree, are the difficulties experienced by a clairvoyant in his attempt to describe upon the physical plane what he has seen upon the astral; and they are furthermore greatly enhanced by the fact that, instead of having merely to recall to the minds of his hearers conceptions with which they are already familiar, as the artist does when he paints men or animals, fields or trees, he has to endeavour by the very imperfect means at his disposal to suggest to them conceptions which in most cases are absolutely new to them.<\/p>", "images": []}, {"pdf_page_index": 118, "pdf_page_number": 119, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Small wonder then that, however vivid and striking his descriptions may seem to his audience, he himself should constantly be impressed with their total inadequacy, and should feel that his best efforts have entirely failed to convey any idea of what he really sees. And we must remember that in the case of the report given down here of a record read on the mental plane, this difficult operation of transference from the higher to the lower has taken place not once but twice, since the memory has been brought through the intervening astral plane. Even in a case where the investigator has the advantage of having developed his mental faculties so that he has the use of them while awake in the physical body, he is still hampered by the absolute incapacity of physical language to express what he sees.<\/p><p>Try for a moment to realize fully what is called the fourth dimension, of which we said something in an earlier chapter. It is easy enough to think of our own three dimensions—to image in our minds the length, breadth and height of any object; and we see that each of these three dimensions is expressed by a line at right angles to both of the others. The idea of the fourth dimension is that it might be possible to draw a fourth line which shall be at right angles to all three of those already existing.<\/p>", "images": []}, {"pdf_page_index": 119, "pdf_page_number": 120, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Now the ordinary mind cannot grasp this idea in the least, though some few who have a special study of the subject have gradually come to be able to realize one or two very simple four-dimensional figures.<\/p><p>Still, no words that they can use on this plane can bring any image of these figures before the mind of others, and if any reader who has not specially trained himself along that line will make the effort to visualize such a shape he will find it quite impossible. Now to express such a form clearly in physical words would be, in effect, to describe accurately a single object of the astral plane; but in examining the records on the mental plane we should have to face the additional difficulties of a fifth dimension! So that the impossibility of fully explaining these records will be obvious to even the most superficial observation.<\/p><p>We have spoken of the records as the memory of the Logos, yet they are very much more than a memory in an ordinary sense of the word. Hopeless as it may be to imagine how these images appear from His point of view, we yet known that as we rise higher and higher we must be drawing nearer to the true memory—must be seeing more nearly as He sees; so that great interest attaches to the experience of the clairvoyant with reference to these records when he stands upon the buddhic plane—the higher which his consciousness can reach even when away from the physical body until he attains the level of the Arhats.<\/p>", "images": []}, {"pdf_page_index": 120, "pdf_page_number": 121, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Here time and space no longer limit him; he no longer needs, as on the mental plane, to pass a series of events in review, for past, present and future are all alike simultaneously present to him, meaningless as that sounds down here. Indeed, infinitely below the consciousness of the Logos as even that exalted plane is, it is yet abundantly clear from what we see there that to Him the record must be far more than what we call a memory, for all that has happened in the past and all that will happen in the future is happening now before His eyes just as are the events of what we call the present time. Utterly incredible, widely incomprehensible, of course, to our limited understanding; yet absolutely true for all that.<\/p><p>Naturally we could not expect to understand at our present stage of knowledge how so marvellous a result is produced, and to attempt an explanation would only be to involve ourselves in a mist of words from which we should gain no real information. Yet a line of though recurs to my mind which perhaps suggests the direction in which it is possible that that explanation may lie; and whatever helps us to realize that so astounding a statement may after all not be wholly impossible will be of assistance in broadening our minds.<\/p>", "images": []}, {"pdf_page_index": 121, "pdf_page_number": 122, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Some thirty years ago I remember reading a very curious little book, called, I think, The Stars and the Earth, the objects of which was to endeavour to show how it was scientifically possible that to the mind of God the past and the present might be absolutely simultaneous. Its arguments struck me at the time as decidedly ingenious, and I will proceed to summarize them, as I think they will be found somewhat suggestive in a connection with the subject which we have been considering.<\/p><p>When we see anything, whether it be the book which we hold in our hands or a star millions of miles away, we do so by means of a vibration in the ether, commonly called a ray of light, which passes from the object seen to our eyes. Now the speed with which this vibration passes is so great—about 186,000 miles in a second—that when we are considering any object in our own world we may regard it as practically instantaneous. When, however, we come to deal with interplanetary distances we have to take the speed of light into consideration, for an appreciable period is occupied in traversing these vast spaces. For example it takes eight minutes and a quarter for light to travel to us from the sun, so that when we look at the solar orb we see it by means of a ray of light which left it more than eight minutes ago.<\/p>", "images": []}, {"pdf_page_index": 122, "pdf_page_number": 123, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>From this follows a very curious result. The ray of light by which we see the sun can obviously reports to us only the state of affairs which existed in that luminary when it started on its journey, and would not be in the least affected by anything that happened there after it left; so that we really see the sun not as he is, but as he was eight minutes ago. That is to say that if anything important took place in the sun—the formation of a new sunspot, for instance—an astronomer who was watching the orb through his telescope at the time would be quite unaware of the incident while it was happening, since the ray of light bearing the news would not reach him until more than eight minutes later.<\/p>", "images": []}, {"pdf_page_index": 123, "pdf_page_number": 124, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>The difference is more striking when we consider the fixed stars, because in their case the distances are so enormously greater. The pole star, for example, is so far off that light, travelling at the inconceivable speed above mentioned, takes a little more than fifty years to reach our eyes; and from that follows the strange but inevitable inference that we see the pole star no as and where it is at this moment, but as and where it was fifty years ago. Nay, if tomorrow some cosmic catastrophe were to shatter the pole star into fragments, we should still see it peacefully shining in the sky all the rest of our lives; our children would grow up to middle age and gather their children about them in turn before the news of that tremendous accident reached any terrestrial eye. In the same way there are other stars so far distance that light takes thousands of years to travel from them to us, and with reference to their condition our information is therefore thousands of years behind time.<\/p>", "images": []}, {"pdf_page_index": 124, "pdf_page_number": 125, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Now carry the argument a step farther. Suppose that we were able to place a man at the distance of 186,000 miles form the earth, and yet to endow him with the wonderful faculty of being able from that distance to see what was happening here as clearly as though he were still close beside us. It is evident that a man so placed would see everything a second later the time when it really happened, and so at the present moment he would be seeing what happened a second ago. Double the distance, and he would be two seconds behind time, and so on; remove him to the distance of the sun (still allowing him to preserve the same mysterious power of sight) and he would look down and watch you doing not what you are doing now, but what you were doing eight minutes and a quarter ago. Carry him away to the pole star, and he would see passing before his eyes the events of fifty years ago; he would be watching the childish gambols of those who at the very same moment were really middle-aged men. Marvellous as this may sound, it is literally and scientifically true, and cannot be denied.<\/p>", "images": []}, {"pdf_page_index": 125, "pdf_page_number": 126, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>The little book went on to argue logically enough that God, being almighty, must possess the wonderful power of sight which we have been postulating for our observed; and further, that being omnipresent, He must be at each of the stations which we mentioned, and also at every intermediate point, not successively but simultaneously. Granting these premises, the inevitable deduction follows that everything which has ever happened from the very beginning of the world must be at this very moment taking place before the eye of God—not a mere memory of it, but the actual occurrence itself being under His observation.<\/p><p>All this is materialistic enough, and on the plane of purely physical science, and we may therefore be assured that it is not the way in which the memory of the Logos acts; yet it is neatly worked out and absolutely incontrovertible, and as I have said before, it is not without its use, since it gives us a glimpse of some possibilities which otherwise might not occur to us.<\/p>", "images": []}, {"pdf_page_index": 126, "pdf_page_number": 127, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>But, it may be asked, how is it possible, amid the bewildering confusion of these records of the past, to find any particular picture when it is wanted? As a matter of fact, the untrained clairvoyant usually cannot do so without some special link to put him en rapport with the subject required. Psychometry is an instance in point, and it is quite probable that our ordinary memory is really only another presentment of the same idea. It seems as though there were a sort of magnetic attached or affinity between any particle of matter and the record which contains its history—an affinity which enables it to act as a kind of conductor between that record and the faculties of anyone who can read it.<\/p>", "images": []}, {"pdf_page_index": 127, "pdf_page_number": 128, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>For example, I once brought from Stonehenge a tiny fragment of stone, not larger than a pin’s head, and on putting this into an envelope and having it to a psychometer who had no idea what it was, she at once began to describe that wonderful ruin and the desolate country surrounding it, and then went on to picture vividly what were evidently scenes from its early history, showing that that infinitesimal fragment had been sufficient to put her into communication with the records connected with the spot from which it came. The scenes through which we pass in the course of our life seem to act in the same manner upon the cells of our brain as did the history of Stonehenge upon that particle of stone; they establish a connection with those cells by means of which our mind is put en rapport with that particular portion of the records, and so we “remember” what we have seen.<\/p>", "images": []}, {"pdf_page_index": 128, "pdf_page_number": 129, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Even a trained clairvoyant needs some link to enable him to find the record of an event of which he has no previous knowledge. If, for example, he wished to observe the landing of Julius Cæsar on the shores of England, there are several ways in which he might approach the subject. If he happened to have visited the scene of the occurrence, the simplest way would probably be to call up the image of that spot, and then run back through its records until he reached the period desired. If he had not seen the place, he might run back in time to the date of the event, and then search the Channel for a fleet of Roman galleys; or he might examine the records of Roman life at about that period, where he would have no difficulty in identifying so prominent a figure as Cæsar, or in tracing him when found through all his Gallic wars until he set his foot upon British land.<\/p>", "images": []}, {"pdf_page_index": 129, "pdf_page_number": 130, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>People often enquire as to the aspect of these records—whether they appear near or far away from the eye, whether the figures in them are large or small, whether the pictures follow one another as in a panorama or melt into another like dissolving views, and so on. One can only reply that their appearance varies to a certain extent according to the conditions under which they are seen. Upon the astral plane the reflection is most often a simple picture, though occasionally the figures seen would be endowed with motion; in this latter case, instead of a mere snapshot a rather longer and more perfect reflections has taken place.<\/p><p>On the mental plane they have two widely different aspects. When the visitor to that plane is not thinking specially of them in any way, the records simply for a background to whatever is going on, just as the reflections in a pier-glass at the end of a room might form a background to the life of the people in it. It must always be borne in mind that under these conditions they are really merely reflections from the ceaseless activity of a great Consciousness upon a far higher plane, and have very much the appearance of an endless succession of the recently invented cinematographs, or living photographs. They do not melt into one another like dissolving views, nor do a series of ordinary pictures follow one another; but the action of the reflection figures constantly goes on, as though one were watching the actors on a distant stage.<\/p>", "images": []}, {"pdf_page_index": 130, "pdf_page_number": 131, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>But if the trained investigator turns his attention specially to any one scene, or wishes to call it up before him, an extraordinary change at once takes place, for this is the plane of thought, and to think of anything is to bring it instantaneously before you. For example, if a man wills to see the records of that event to which we before referred—the landing of Julius Cæsar—he finds himself in a moment not looking at any picture, but standing on the shore among the legionaries, with the whole scene being enacted around him, precisely in every respect as he would have seen it if he had stood there in the flesh on that autumn morning in the year 55 b.c.. Since what he sees is but a reflection, the actors are of course entirely unconscious of him, nor can any effort of his change the course of their action in the smallest degree, except only that he can control the rate at which the drama shall pass before him—can have the events of a whole year rehearsed before his eyes in a single hour, or can at any moment stop the movement altogether, and hold any particular scene in view as a picture as long as he chooses.<\/p>", "images": []}, {"pdf_page_index": 131, "pdf_page_number": 132, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>In truth he observes not only what he would have seen if he had been there at the time in the flesh, but much more. He hears and understands all that the people say, and he is conscious of all their thoughts and motives; and one of the most interesting of the many possibilities which open up before one who has learnt to read the records is the study of the thought of ages long past—the thought of the cavemen and the lake-dwellers as well as that which ruled the mighty civilisations of Atlantis, of Egypt or Chaldæa. What splendid possibilities open up before the man who is in full possession of this power may easily be imagined. He has before him a field of historical research of most entrancing interest. Not only can he review at his leisure all history with which we are acquainted, correcting as he examines it the many errors and misconceptions which have crept into the accounts handed down to us; he can also range at will over the whole story of the world from its very beginning, watching the slow development of intellect in man, the descent of the Lords of the Flame, and the growth of the mighty civilisations which They founded.<\/p>", "images": []}, {"pdf_page_index": 132, "pdf_page_number": 133, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Nor is his study confined to the progress of humanity alone; he has before him, as in a museum, all the strange animal and vegetable forms which occupied the stage in days when the world was young; he can follow all the wonderful geological changes which have taken place, and watch the course of the great cataclysms which have altered the whole face of the earth again and again.<\/p><p>In one especial case an even closer sympathy with the past is possible to the reader of the records. If in the course of his enquiries he has to look upon some scene in which he himself has in a former birth taken part, he may deal with it in two ways: he can either regard it in in the usual manner as a spectator (though always, be it remembered, as a spectator whose insight and sympathy are perfect) or he may once more identify himself with that long-dead personality of his—may throw himself back for the time into that life of long ago, and absolutely experience over again the thoughts and the emotions, the pleasures and the pains of a prehistoric past. No wilder and more vivid adventures can be conceived than some of those through which he thus may pass; yet though it all he must never lose hold of the consciousness of his own individuality—must retain the power to return at will to his present personality.<\/p>", "images": []}, {"pdf_page_index": 133, "pdf_page_number": 134, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>It is often asked how it is possible for an investigator accurately to determine the date of any picture from the far-distance past which he disinters from the records. The fact is that it is sometimes rather tedious work to find an exact date, but the thing can usually be done if it is worth while to spend the time and trouble over it. It we are dealing with Greek or Roman times the simplest method is usually to look into the mind of the most intelligent person present in the picture, and see what date he supposes it to be; or the investigator might watch him writing a letter, or other document and observe what date, if any, was included in what was written. When once the Roman or Greek date is thus obtained, to reduce it to our own system of chronology is merely a matter of calculation.<\/p><p>Another way which is frequently adopted is to turn from the scene under examination to a contemporary picture in some great and well-known city such as Rome, and note what monarch is reigning there, or who are the consuls for the year; and when such data are discovered a glance at any good history will give the rest. Sometimes a date can be obtained by examining some public proclamation or some legal document; in fact in the times of which we are speaking the difficulty is easily surmounted.<\/p>", "images": []}, {"pdf_page_index": 134, "pdf_page_number": 135, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>The matter is by no means so simple, however, when we come to deal with periods much earlier than this—with a scene from early Egypt, Chaldæa, or China, or to go further back still, from Atlantis itself or any of its numerous colonies. A date can still be obtained easily enough from the mind of any educated man, but there is no longer any means of relating it to our own system of dates, since the man will be reckoning by eras of which we know nothing, or by the reigns of kings, whose history is lost in the night of time.<\/p><p>Our methods, nevertheless, are not yet exhausted. It must be remembered that it is possible for the investigator to pass the records before him at any speed that he may desire—at the rate of a year in a second if he will, or even very much faster still. Now there are one or two events in ancient history whose dates have already been accurately fixed—as, for example, the sinking of Poseidonis in the year 9,564 b.c. It is therefore obvious that if from the general appearance of the surroundings it seems probable that a picture seen is within measurable distance of one of these events, it can be related to that event by the simple process of running through the record rapidly, and counting the years between the two as they pass.<\/p>", "images": []}, {"pdf_page_index": 135, "pdf_page_number": 136, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Still, if those years ran into a thousand, as they might sometimes do, this plan would be insufferably tedious. In that case we are driven back upon the astronomical method. In consequence of the movement which is commonly called the precession of the equinoxes, though it might more accurately be described as a kind of second rotation of the earth, the angle between the equator and the ecliptic steadily but very slow varies. Thus, after long intervals of time we find the pole of the earth no longer pointing towards the same spot in the apparent sphere of the heavens, or in other words, our pole star is not, as at present, α Ursæ Minoris, but some other celestial body; and from this position of the pole of the earth, which can easily be ascertained by careful observation of the night-sky of the picture under consideration, an approximate date can be calculated without difficulty.<\/p><p>In estimating the date of occurrences which took place millions of years ago in earlier races, the period of a secondary rotation (or the precession of the equinoxes) is frequently used as a unit, but of course absolute accuracy is not usually required in such cases, round numbers being sufficient for all practical purposes in dealing with epochs so remote.<\/p>", "images": []}, {"pdf_page_index": 136, "pdf_page_number": 137, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>The accurate reading of the records, whether of one’s own past lives or those of others, must not, however, be thought of as an achievement possible to anyone without careful previous training. As has been already remarked, though occasional reflections may be had upon the astral plane, the power to use the mental sense is necessary before any reliable reading can be done. Indeed, to minimise the possibility of error, that sense ought to be fully at the command of the investigator while awake in the physical body; and to acquire that faculty needs years of ceaseless labour and rigid self-discipline.<\/p><p>Many people seem to expect that as soon as they have signed their application and joined the Theosophical Society they will at once remember at least three of our of their past births; indeed, some of them promptly begin to imagine recollections and declare that in their last incarnation they were Mary Queen of Scots, Cleopatra, or Julius Cæsar! Of course such extravagant claims simply bring discredit upon those who are so foolish as to make them; but unfortunately some of that discredit is liable to be reflected, however unjustly, upon the Society to which they belong, so that a man who feels seething within him the conviction that he was Homer or Shakespeare would do well to pause and apply commonsense tests on the physical plane before publishing the news to the world.<\/p>", "images": []}, {"pdf_page_index": 137, "pdf_page_number": 138, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>It is quite true that some people have had glimpses of scenes from their past lives in dreams, but naturally these are usually fragmentary and unreliable. I had myself in earlier life an experience of this nature. Among my dreams I found that one was constantly recurring—a dream of a house with a portico overlooking a beautiful bay, not far from a hill on the top of which rose a graceful building. I knew that house perfectly, and was as familiar with the position of its rooms and the view from its door as I was with those of my home, in this present Life. In those days I knew nothing bout reincarnation, so that it seemed to me simply a curious coincidence that this dream should repeat itself so often; and it was not until some time after I had joined the Society that, when one who knew was showing me some pictures of my last incarnation, I discovered that this persistent dream had been in a reality a partial recollection, and that the house which I knew so well was the one in I was born more than two thousands years ago.<\/p>", "images": []}, {"pdf_page_index": 138, "pdf_page_number": 139, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>But although there are several cases on record in which some well-remembered scene has thus come through from one life to another, a considerable development of occult faculty is necessary before an investigator can definitely trace a line of incarnations, whether they be his own or another man’s. This will be obvious if we remember the conditions of the problem which has o be worked out. To follow a person from this life to the one preceding it, it is necessary first of all to trace his present life backwards to his birth and then to follow up in reverse order the stages by which the Ego descended into incarnation.<\/p><p>This will obviously take us back eventually to the condition of the Ego upon the highest levels of the mental plane; so it will be seen that to perform this task effectually the investigator must be able to use the sense corresponding to that exalted level while awake in his physical body—in other words, his consciousness must be centred in the reincarnating Ego itself, and no longer in the lower personality. In that case, the memory of the Ego being aroused, his own past incarnations will be spread out before him like an open book, and he would be able, if he wished, to examine the conditions of another Ego upon that level and trace him backwards through the lower mental and astral lives which led up to it, until he came to the last physical death of that Ego, and through it to his previous life.<\/p>", "images": []}, {"pdf_page_index": 139, "pdf_page_number": 140, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>There is no way but this in which the chain of lives can be followed through with absolute certainty; and consequently we may at once put aside as conscious or unconscious impostors those people who advertise that they are able to race out anyone’s past incarnations for so many shillings a head. Needless to say, the true occultist does not advertise, and never under any circumstances accepts money for any exhibition of his powers.<\/p><p>Assuredly the student who wishes to acquire the power of following up a line of incarnations can do so only by learning from a qualified teacher how the work is to be done. There have been those who persistently asserted that it was only necessary for a man to feel good and devotional and “brotherly”, and all the wisdom of the ages would immediately flow in upon him; but a little common-sense will at once expose the absurdity of such a position. However good a child may be, if he wants to know the multiplication table he must set to work and learn it; and the case is precisely similar with the capacity to use spiritual faculties. The faculties themselves will not doubt manifest as the man evolves, but he can learn how use them reliable and to the best advantage only by steady hard work and persevering effort.<\/p>", "images": []}, {"pdf_page_index": 140, "pdf_page_number": 141, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>Take the case of those who wish to help others while on the astral plane during sleep; it is obvious that the more knowledge they possess here, the more valuable will their services be on that higher plane. For example, the knowledge of languages would be useful to them, for though on the mental plane men can communicate directly by thought-transference, whatever their languages may be, on the astral plane this is not so, and a thought must be definitely formulated in words before it is comprehensible. If, therefore, you wish to help a man on that plane, you must have some language in common by means of which you can communicate with him, and consequently the more languages you know the more widely useful you will be. In fact there is perhaps no kind of knowledge for which a use cannot be found in the work of the occultist.<\/p>", "images": []}, {"pdf_page_index": 141, "pdf_page_number": 142, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>It would be well for all students to bear in mind that occultism is the apotheosis of commonsense, and that every vision which comes to them is not necessarily a picture from the ākāshic records, nor every experience a revelation from on high. It is better far to err on the side of healthy skepticism than of over-credulity; and it is an admirable rule never to hunt about for an occult explanation of anything when a plain and obvious physical one is available. Our duty is to endeavour to keep our balance always, and never to lose our self-control, but to take a reasonable, commonsense view of whatever may happen to us; so shall we be better Theosophists, wiser occultists, and more useful helpers than we have ever been before.<\/p>", "images": []}, {"pdf_page_index": 142, "pdf_page_number": 143, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>As usual, we find examples of all degrees of the power to see into this memory of nature, from the trained man who can consult the record for himself at will, down to the person who gets nothing but occasional vague glimpses, or has even perhaps had only one such glimpse. But the man who possesses this faculty only partially and occasionally still finds it of the deepest interest. The psychometer, who needs an object physically connected with the past in order to bring it all into life again around him, and the crystal-gazer who can sometimes direct his less certain astral telescope to some historic scene of long ago, may both derive the greatest enjoyment from the exercise of their respective gifts, even thought they may not always understand exactly how their results are produced, and may not have them fully under control under all circumstances.<\/p><p>In many cases of the lower manifestations of these powers we find that they are exercised unconsciously; many a crystal-gazer watches scenes from the past without being able to distinguish them from visions of the present, and many a vaguely-psychic person finds pictures constantly arising before his eyes without ever realizing that he is in effect psychometrizing the various objects around him as he happens to touch them or stand near them.<\/p>", "images": []}, {"pdf_page_index": 143, "pdf_page_number": 144, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>An interesting variant of this class of psychics is the man who is able to psychometrize persons only, and not inanimate objects as is more usual. In most cases this faculty shows itself erratically, so that such a psychic will, when introduced to a stranger, often see in a flash some prominent event in that stranger’s earlier life, but on other similar occasions will receive no special impression. More rarely we meet with someone who gets details visions of the past life of everyone whom he encounters. Perhaps one of the best examples of this class was the German writer Zschokke, who describes in his autobiography this extraordinary power of which he found himself possessed. He says:<\/p><p>“It has happened to me occasionally at the first meeting with a total stranger, when I have been listening in silence to his conversation, that his past life up to the present moment, with many minute circumstances belonging to one or other particular scene in it, has come across me like a dream, but distinctly, entirely involuntarily and unsought, occupying in duration a few minutes.<\/p>", "images": []}, {"pdf_page_index": 144, "pdf_page_number": 145, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>“For a long time I was disposed to consider these fleeting visions as a trick of the fancy—the more so as my dream-vision displayed to me the dress and movements of the actors, the appearance of the room, the furniture, and other accidents of the scene; till on one occasion, in a awesome mood, I narrated to my family the secret history of a sempstress who had just before quitted the room. I had never seen the person before. Nevertheless the hearers were astonished, and laughed and would not be persuaded but that I had a previous acquaintance with the former life of the person, inasmuch as what I had stated was perfectly true.<\/p><p>“I was not less astonished to find that my dream-vision agreed with reality. I then gave more attention to the subject, and as often as propriety allowed of it, I related to those whose lives had so passed before me the substance of my dream-vision, to obtain from them its contradiction or confirmation. On every occasion its confirmation followed, not without amazement on the part of those who gave it.<\/p>", "images": []}, {"pdf_page_index": 145, "pdf_page_number": 146, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>“On a certain fair-day I went into the two of Waldshut accompanied by two young foresters, who are still alive It was evening, and, tired with our walk, we went into an inn called the ‘Vine’. We took our supper with a numerous company at the public table, when it happened that they made themselves merry over the peculiarities and simplicity of the Swiss in connection with the belief in mesmerism. Lavater’s physiognomical system and the like. One of my companions, whose national pride was touched by their raillery, begged me to make some reply, particularly in answer to a young man of superior appearance who sat opposite, and had indulged in unrestrained ridicule.<\/p>", "images": []}, {"pdf_page_index": 146, "pdf_page_number": 147, "label": "Chapter 7. Clairvoyance In Time: The Past", "html": "<p>‘It happened that the events of this person’s life had just previously passed before my mind. I turned to him with the question whether he would reply to me with truth and candour if I narrated to him the most secret passages of his history, he being as little known to me as I to him? That would, I suggested, go something beyond Lavater’s physiognomical skill. He promised if I told the truth to admit it openly. Then I narrated the events with which my dream vision had furnished me, and the stable learnt the history of the young tradesman’s life of his school years, his peccadilloes, and finally, of a little act of roguery committed by him on the strongbox of his employer. I described the uninhabited room with its white walls, where to the right of the brown door there had stood upon the table the small back money-chest, etc. The man, much struck, admitted the correctness of each circumstance—even, which I could not expect, of the last.”<\/p><p>And after narrating this incident, the worthy Zschokke calmly goes on to wonder whether perhaps after all this remarkable power, which he had so often displayed, might not really have been always the result of mere chance coincidence!<\/p>", "images": []}, {"pdf_page_index": 147, "pdf_page_number": 148, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Comparatively few accounts of persons possessing this faculty of looking back into the past are to be found in the literature of the subject, and it might therefore be supposed to be much less common than prevision, I suspect, however, that the truth is rather that it is much less commonly recognized. As I said before, it may very easily happen that a person may see a picture of the past without recognizing it as such, unless there happens to be in it something which attracts special attention, such as a figure in armour or in antique costume. A prevision also might not always be recognized as such at the time; but the occurrence of the event foreseen recalls it vividly at the same time that it manifests its nature, so that it is unlikely to be overlooked. It is probable, therefore, that occasional glimpses of these astral reflections of the ākāshic records are commoner than the published accounts would lead us to believe.<\/p><h3 class=\"pdf-heading\">Chapter 8. Clairvoyance In Time: The Future<\/h3>", "images": []}, {"pdf_page_index": 148, "pdf_page_number": 149, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Even if, in a dim sort of way, we feel ourselves able to grasp the idea that the whole of the past may be simultaneously and actively present in a sufficiently exalted consciousness, we are confronted by a far greater difficulty when we endeavour to realize how all the future may also be comprehended in that consciousness. If we could believe in the Mohammedan doctrine of kismet, or the Calvinistic theory of predestination, the conception would be easy enough, but knowing as we do that both these are grotesque distortions of the truth, we must look round for a more acceptable hypothesis.<\/p><p>There may still be some people who deny the possibility of prevision, but such denial simply shows their ignorance of the evidence on the subject. The large number of authenticated cases leaves no room for doubt as to the fact, but many of them are of such a nature as to render a reasonable explanation by no means easy to find. It is evident that the Ego possesses a certain amount of previsional faculty, and if the events foreseen were always of great importance, one might suppose that an extraordinary stimulus had enabled him for that occasion only to make a clear impression of what he saw upon his lower personality. No doubt that is the explanation of many of the cases in which death or grave disaster is foreseen, but there are a large number of instances on record to which it does not seem to apply, since the events foretold are frequently exceedingly trivial and unimportant.<\/p>", "images": []}, {"pdf_page_index": 149, "pdf_page_number": 150, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>A well-know story of second-sight in Scotland will illustrate when I mean. A man who had no belief in the occult was forewarned by a Higher seer of the approaching death of a neighbour. The prophecy was given with considerable wealth of detail, including a full description of the funeral, with the names of the four pallbearers and others who would be present. The auditor seems to have laughed at the whole story and promptly forgotten it, but the death of his neighbour at the time foretold recalled the warning to mind, and he determined to falsify part of the prediction at any rate by being one of the pallbearers himself. He succeeded in getting matters arranged as he wished, but just as the funeral was about to start he was called away from his post by some small matter which detained him only a minute or two. As he came hurrying back he saw with surprise that the procession had started without him, and that the prediction had been exactly fulfilled, for the four pallbearers were those who had been indicated in the vision.<\/p>", "images": []}, {"pdf_page_index": 150, "pdf_page_number": 151, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Now here is a very trifling matter, which could have been of no possible importance to anybody, definitely foreseen months beforehand; and although a man makes a determined effort to alter the arrangement indicated he fails entirely to affect it in the least. Certainly this looks very much like predestination, even down to the smallest detail, and it is only when we examine this question from higher planes that we are able to see our way to escape that theory. Of course, as I said before about another branch of the subject, a full explanation eludes us as yet, and obviously must do so until our knowledge is infinitely greater than it is now; the most that we can hope to do for the present is to indicate the line along which an explanation may be found.<\/p><p>There is no doubt whatever that, just as what is happening now is the result of causes set in motion in the past, so what will happen in the future will be the result of causes already in operation. Even down here we can calculate that if certain actions are performed certain results will follow, but our reckoning is constantly liable to be disturbed by the interference of factors which we have not been able to take into account. But if we raise our consciousness to the mental plane we can see very much farther into the results of our actions.<\/p>", "images": []}, {"pdf_page_index": 151, "pdf_page_number": 152, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>We can trace, for example, the effect of a casual word, not only upon the person to whom it was addressed, but through him on many others as it is passed on in widening circles, until it seems to have affected the whole country; and one glimpse of such a vision is far more efficient than any number of moral precepts in pressing upon us the necessity of extreme circumspection in thought, word, and deed. Not only can we from that plane see thus fully the result of every action, but we can also see where and in what way the results of other actions apparently quite unconnected with it will interfere with and modify it. In fact, it may be said that the results of all causes at present in action are clearly visible—that the future, as it would be if no entirely new causes should arise, lies open before our gaze.<\/p>", "images": []}, {"pdf_page_index": 152, "pdf_page_number": 153, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>New causes of course do arise, because man’s will is free; but in the case of all ordinary people the use which they will make of their freedom can be calculated beforehand with considerable accuracy. The average man has so little real will that he is very much the creature of circumstances; his action impervious lives places him amid certain surroundings, and their influence upon him is so very much the most important factor in his life-story that his future course may be predicted with almost mathematical certainty. With the developed man the case is different; for him also the main events of life are arranged by his past actions, but the way in which he will allow them to affect him, the methods by which he will deal with them and perhaps triumph over them—these are all his own, and they cannot be foreseen even on the mental plane except as probabilities.<\/p><p>Looking down on man’s life in this way from above, it seems as though his free will could be exercised only at certain crises in his career. He arrives at a point in his life where there are obviously two or three alternative courses open before him; he is absolutely free to choose which of them he pleases, and although someone who knew his nature thoroughly well might feel almost certain what his choice would be, such knowledge on his friend’s part is in no sense a compelling force.<\/p>", "images": []}, {"pdf_page_index": 153, "pdf_page_number": 154, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>But when he has chosen, he has to go through with it and take the consequences; having entered upon a particular path he may, in many cases, be forced to go on for a very long way before he has ay opportunity to turn aside. His position is somewhat like that of the driver of a train; when he comes to a junction he may have the points set either this way or that, and so can pass on to whichever line he pleases, but when he has passed on to one of them he is compelled to run on along the line which he has selected until he reaches another set of points, where again an opportunity of choice is offered to him.<\/p>", "images": []}, {"pdf_page_index": 154, "pdf_page_number": 155, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Now, in looking down from the mental plane, these points of new departure would be clearly visible, and all the results of each choice would like open before us, certain to be worked out even to the smallest detail. The only point which would remain uncertain would be the all-important one as to which choice the man would make. We should, in fact, have not one but several futures mapped out before our eyes, without necessarily being able to determine which of them would materialize itself into accomplished fact. In most instances we should see so throng a probability that we should not hesitate to come to a decision, but the case which I have described is certain theoretically possible. Still, even this much knowledge would enable us to do with safety a good deal of prediction; and it is not difficult for us to imagine that a far higher power than ours might always be able to foresee which way every choice would go, and consequently to prophesy with absolute certainty.<\/p>", "images": []}, {"pdf_page_index": 155, "pdf_page_number": 156, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>On the buddhic plane, however, no such elaborate process of conscious calculation is necessary, for, as I said before, in some manner which down here is totally inexplicable, the past, the present, and the future are there al existing simultaneously. One can only accept this fact, for its cause lies in the faculty of the plane, and the way in which this higher faculty works is naturally quite incomprehensible to the physical brain. Yet now and then one may meet with a hint that seems to bring us a trifle nearer to a dim possibility of comprehension. One such hint was given by Sir Olive Lodge in his address to the British Association at Cardiff. He said;<\/p>", "images": []}, {"pdf_page_index": 156, "pdf_page_number": 157, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“A luminous and helpful idea is that time is but a relative mode of regarding things; we progress through phenomena at a certain definite pace and this subjective advance we interpret in an objective manner, as if events moved necessarily in this order and at this precise rate. But that may be only one mode of regarding them. The events may be in some sense in existence always, both past and future, and it may be we who are arriving at them, not they which happening. The analogy of a traveller in a railway train is useful; if he could never leave the train nor alter its pace he would probably consider the landscapes as necessarily successive and be unable to conceive their coexistence... We perceive, therefore, a possible fourth dimensional aspect about time, the inexorableness of whose flow may be a natural part of our present limitations. And if we once grasp the idea that past and future may be actually existing, we can recognize that they may have a controlling influence on all present action, and the two together may constitute the ‘higher plane’ or totality of things after which, as it seems to me, we are impelled to seek, in connection with the directing of form or determinism, and the action of living beings consciously directed to a definite and preconceived end.”<\/p>", "images": []}, {"pdf_page_index": 157, "pdf_page_number": 158, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Time is not in reality the fourth dimension at all; yet to look at it for the moment from that point of view is some slight help towards grasping the ungraspable. Suppose that we hold a wooden cone at right angles to a sheet of paper, and slowly push it through its point first. A microbe living on the surface of that sheet of paper, and having no power of conceiving anything outside of that surface, could not only never see the cone as a whole, but could form no sort of conception of such a body at all. All that he would see would be the sudden appearance of a tiny circle, which would gradually and mysteriously grow larger and larger until it vanished from his world as suddenly and incomprehensibly as it had come into it.<\/p>", "images": []}, {"pdf_page_index": 158, "pdf_page_number": 159, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Thus, what were in reality a series of sections of the cone would appear to him to be successive stages in the life of a circle, and it would be impossible for him to grasp the idea that these successive stages could be seen simultaneously. Yet it is, of course, easy enough for us, looking down upon the transaction from another dimension, to see that the microbe is simply under a delusion arising from its own limitations, and that the cone exists as a whole all the while. Our own delusion as to past, present, and future is possibly not dissimilar, and the view that is gained of sequence of events from the buddhic plane corresponds to the view of the cone as a whole. Naturally, any attempt to work out this suggestion lands us in a series of startling paradoxes; but the fact remains a fact, nevertheless, and the time will come when it will be clear as noonday to our comprehension.<\/p><p>When the pupil’s consciousness is fully developed upon the buddhic plane, therefore, perfect prevision is possible to him, though he may not—nay, he certainly will not—be able to bring the whole result of this sight through fully and in order into this light. Still, a great deal of clear foresight is obviously within his power, however he likes to exercise it; and even when he is not exercising it, frequent flashes of foreknowledge come through into his ordinary life, so that he often has an instantaneous intuition as to how things will turn out even before their inception.<\/p>", "images": []}, {"pdf_page_index": 159, "pdf_page_number": 160, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Short of this perfect prevision we find, as in the previous cases, that all degrees of this type of clairvoyance exist, from the occasional vague premonitions which cannot in any true sense be called sight at all, up to frequent and fairly complete second-sight. The faculty to which this latter somewhat misleading name has been given is an extremely interesting one and would well repay more careful and systematic study than has ever higher to been given to it.<\/p><p>It is best know to us as a not infrequent possession of the Scottish Highlanders, though it is by no means confirmed to them. Occasional instances of it have appeared in almost every nation, but it has always been commonest among mountaineers and men of lonely life. With us in England it is often spoken of as though it were the exclusive appanage of the Celtic race, but in reality it has appeared among similarly situated peoples the world over. It is stated, for example, to be very common among the Westphalian peasantry.<\/p>", "images": []}, {"pdf_page_index": 160, "pdf_page_number": 161, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Sometimes the second-sight consists of a picture clearly foreshowing some coming event; more frequently, perhaps, the glimpse of the future is given by some symbolical appearance. It is noteworthy that the events foreseen are invariably unpleasant ones—death being the commonest of all; I do not recollect a single instance in which the second-sight has shown anything which was not of the most gloomy nature. It has a ghastly symbolism which is all its own—a symbolism of shrouds and corpse-candles, and other funereal horrors. In some cases it appears to be to a certain extent dependent on locality, for it is state that inhabitants of the Isle of Skye who possess the faulty often lose it when they leave the island, even though it be only to cross to the mainland. The gift of such sight is sometimes hereditary in a family for generations, but this is not an invariable rule, for it often appears sporadically in one member of a family otherwise free from its lugubrious influence.<\/p><p>An example in which an accurate vision of a coming even was seen some months beforehand by second-sight has already been given. Here is another and perhaps a more striking one, which I give exactly as it was related to me by one of the actors in the scene.<\/p><p>“We plunged into the jungle, and had walked on for about an hour without much success, when Cameron, who happened to be next to me, stopped suddenly, turned pale as death, and, pointing straight before him, cried in accents of horror:<\/p>", "images": []}, {"pdf_page_index": 161, "pdf_page_number": 162, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“‘See! see! merciful heaven, look there!’<\/p><p>“‘Where? what? what is it?’ we all shouted confusedly, as we rushed up to him and looked round in expectation of encountering a tiger—a cobra—we hardly knew what, but assuredly something terrible, since it had been sufficient to cause such evident emotion in our usually self-contained comrade. But neither tiger nor cobra was visible—nothing but Cameron pointing with ghastly, haggard face and staring eyeballs at something we could not see.<\/p><p>“‘Cameron! Cameron!’ cried I, seizing his arm, ‘for heaven’s sake, speak! What is the matter?’<\/p><p>“Scarcely were the words out of my mouth when a low, but very peculiar sound struck on my ear, and Cameron, dropping his pointing hand, said in a hoarse, strained voice, ‘There! you heard it? Thank God it’s over!’ and fell to the ground insensible.<\/p><p>“There was a momentary confusion while we unfastened his collard, and I dashed in his face some water which I fortunately had in my flask, while another tried to pour brandy between his clenched teeth; and under cover of it whispered to the man next to me (one of our greatest sceptics, by the way), ‘Beauchamp, did you hear anything?’<\/p><p>“‘Why, yes,’ he replied, ‘a curious sound, very; a sort of crash or rattle far away in the distance, yet very distinct; if the thing were not utterly impossible, I could have sworn it was the rattle of musketry’.<\/p><p>“‘Just my impression’, murmured I; ‘but hush! he is recovering’.<\/p>", "images": []}, {"pdf_page_index": 162, "pdf_page_number": 163, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“In a minute or two he was able to speak feebly, and began to thank us and apologize for giving trouble; and soon he sat up, leaning against a tree, and in a firm, though still low voice said:<\/p><p>“‘My dear friends, I feel I owe you an explanation of my extraordinary behaviour. It is an explanation that I would fain avoid giving; but it must come some time, and so may as well be given now. You may perhaps have noticed that when during our voyage you all join in scoffing at dreams, portents and visions, I invariably avoided giving any opinion on the subject. I did so because, while I had no desire to court ridicule or provoke discussion, I was unable to agree with you knowing only too well from my own dread experience that the world which men agree to call that of the supernatural is just as real as—nay, perhaps, even far more real than—this world we see about us. In other words, I, like many of my country men, am cursed with the gift of second-sight—that awful faculty which foretells in vision calamities that are shortly to occur’.<\/p>", "images": []}, {"pdf_page_index": 163, "pdf_page_number": 164, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“‘Such a vision I had just now, and its exceptional horror moved me as you have seen. I saw before me a corpse—not that of one who has died a peaceful natural death, but that of the victim of some terrible accident; a ghastly, shapeless mass, with a face swollen, crushed, unrecognisable. I saw this dreadful object placed in a coffin, and the funeral service performed over it. I saw the burial ground, I saw the clergyman; and though I had never seen either before, I can picture both perfectly in my mind’s eye now; I saw you, myself, Beauchamp, all of us and many more, standing round as mourners; I saw the soldiers raise their muskets after the service was over; I heard the volley they fired—and then I knew no more’.<\/p><p>“As he spoke of that volley of musketry I glanced across with a shudder at Beauchamp, and the look of stony horror on that handsome sceptic’s face was not to be forgotten.”<\/p><p>This is only one incident (and by no means the principal one) in a very remarkable story of psychic experience, but as for the moment we are concerned merely with the example of second-sight which it gives us, I need only say that later in the day the party of young soldiers discovered the body of their commanding officer in the terrible condition so graphically described by Mr. Cameron. The narrative continues:<\/p>", "images": []}, {"pdf_page_index": 164, "pdf_page_number": 165, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“When, on the following evening, we arrived at our destination, and our melancholy deposition had been taken down by the proper authorities, Cameron and I went out for a quiet walk, to endeavour with the assistance of the soothing influence of nature to shake off something of the gloom which paralyzed our spirits. Suddenly he clutched my arm, and pointing through some rude railings, said in a trembling voice. “Yes, there it is! that is the burial-ground I saw yesterday’. And when later on we were introduced to the chaplain of the post, I noticed, though my friends did not, the irrepressible shudder with which Cameron took his hand, and I knew that he had recognized the clergyman of his vision.”<\/p><p>As for the occult rational of all this, I presume Mr. Cameron’s vision was a pure case of second-sight, and if so the fact that the two men who were evidently nearest to him (certainly one—probably both—actually touching him) participated in it to the limited extent of hearing the concluding volley, while the others who were not so close did not, would show that the intensity with which the vision impressed itself upon the seer occasioned vibrations in his mind-body which were communicated to those of the persons in contact with him, as in ordinary thought-transference. Anyone who wishes to read the rest of the story will find it in the pages of Lucifer, vol. xx, page 457.<\/p>", "images": []}, {"pdf_page_index": 165, "pdf_page_number": 166, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Scores of examples of similar nature to these might easily be collected. With regard to the symbolical variety of this sight, it is commonly stated among those who possess it that if on meeting a living person they see a phantom shroud wrapped around him, it is a sure prognostication of his death. The date of the approaching decease is indicated either by the extent to which the shroud covers the body, or by the time of day at which the vision is seen; for if it be in the early morning they say that the man will die during the same day, but if it be in the evening, then it will be only some time within a year.<\/p><p>Another variant (and a remarkable one) of the symbolic form of second-sight is that in which the headless apparition of the person whose death is foretold manifests itself to the seer. An example of that class is given in Signs before Death as having happened in the family of Dr. Ferrier, though in that case, if I recollect rightly, the vision did not occur until the time of the death, or very near it.<\/p>", "images": []}, {"pdf_page_index": 166, "pdf_page_number": 167, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Turning from seers who are regularly in possession of a certain faculty, although its manifestations are only occasionally fully under their control, we are confronted by a large number of isolated instances of prevision in the case of people with whom it is not in any way a regular faculty. Perhaps the majority of these occur in dreams, although examples of the waking vision are by no means wanting. Sometimes the prevision refers to an event of distinct importance to the seer, and so justifies the action of the Ego in taking the trouble to impress it. In other cases, the even is one which is of no apparent importance, or is not in any way connected with the man to whom the vision comes. Sometimes it is clear that the intention of the Ego (or the communicating entity, whatever it may be) is to warn the lower self of the approach of some calamity, either in order that it may be prevented or, if that be not possible, that the shock may be minimized by preparation.<\/p>", "images": []}, {"pdf_page_index": 167, "pdf_page_number": 168, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>The even most frequently thus foreshadowed is, perhaps not unnaturally, death—sometimes the death of the seer himself, sometimes that of one dear to him. This type of prevision is so common in the literature of the subject, and its object is so obvious, that we need hardly cite examples of it; but one or two instances in which the prophetic sight, though clearly useful, was yet of a less sombre character, will prove not uninteresting to the reader. The following is culled from that storehouse of the student of the uncanny, Mrs. Crowe’s Night Side of Nature, page 72.<\/p><p>“A few years ago Dr. Watson, now residing at Glasgow, dreamt that he received a summons to attend a patient at a place some miles from where he was living; that he started on horseback, and that as he was crossing a moor he saw a bull making furiously at him, whose horns he only escaped by taking refuge on a spot inaccessible to the animal, where he waiting a long time till some people, observing his situation, came to his assistance and released him.<\/p>", "images": []}, {"pdf_page_index": 168, "pdf_page_number": 169, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“Whilst at breakfast on the following morning the summons came, and smiling at the odd coincidence (as he thought it), he started on horseback. He was quite ignorant of the road he had to go, but by and by he arrived at the moor, which he recognized, and presently the bull appeared, coming full tilt towards him. But his dream had shown him the place of refuge for which he instantly made, and there he spent three or four hours, besieged by the animal, till the country people set him free. Dr Watson declares that but for the dream he should not have known in what direction to run for safety.”<\/p><p>Another case, in which a much longer interval separated the warning and its fulfillment, is given by Dr. F. G. Lee, in Glimpses of the Supernatural, Volume 1, page 240.<\/p><p>“Mrs. Hannah Green, the housekeeper of a country family in Oxfordshire, dreamt one night that she had been left alone in the house upon a Sunday evening, and that hearing a knock at the door of the chief entrance she went to it and there found an ill-looking tramp armed with a bludgeon, who insisted on forcing himself into the house. She thought that she struggled for some time to prevent him so doing, but quite ineffectually, and that, being struck down by him and rendered insensible, he thereupon gained ingress to the mansion. On this she awoke.<\/p>", "images": []}, {"pdf_page_index": 169, "pdf_page_number": 170, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“As nothing happened for a considerable period the circumstance of the dream was soon forgotten, and, as she herself asserts, had altogether passed away from her mind. However, seven years afterwards this same housekeeper was left with two other servants to take charge of an isolated mansion at Kensington (subsequently the town residence of the family), when on a certain Sunday evening, her fellow-servants having gone out and left her alone, she was suddenly startled by a loud knock at the front door.<\/p><p>“All of a sudden the remembrance of her former dream returned to her with singular vividness and remarkable force, and she felt her lonely isolation greatly. Accordingly, having at once lighted a lamp on the hall table—during which act the loud knock was repeated with vigour—she took the precaution to go up to a landing on the star and throw up the window; and there to her intense terror she saw in the flesh the very man who years previously she had seen in her dream, armed with the bludgeon and demanding an entrance.<\/p><p>“With great presence of mind she went down to the chief entrance, made that and other doors and windows more secure, and then rang the various bells of the house violently, and placed lights in the upper rooms. It was concluded that by the acts the intruder was scared away.<\/p>", "images": []}, {"pdf_page_index": 170, "pdf_page_number": 171, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Evidently in this case also the dream was of practical use, as without it the worthy housekeeper would without doubt from sheer force of habit have opened the door in the ordinary way in answer to the knock.<\/p><p>It is not, however, only in dream that the Ego impresses his lower self with what he thinks it well for it to know. Many instances showing this might be taken from the books, but instead of quoting from them I will give a case related only a few weeks ago by a lady of my acquaintance—a case which, although not surrounded with any romantics incident, has at least the merit of being new.<\/p><p>My friend, then, has two quite young children, and a little while ago the elder of them caught (as was supposed) a bad cold, and suffered for some days from a complete stoppage in the upper part of the nose. The mother thought little of this, expecting it to pass off, until one day she suddenly saw before her in the air what she describes as a picture of a room, in the centre of which was a table on which her child was lying insensible or dead, with some people bending over her. The minutest details of the scene were clear to her, and she particularly noticed that the child wore a white nightdress, whereas she knew that all garments of that description possessed by her little daughter happened to be pink.<\/p>", "images": []}, {"pdf_page_index": 171, "pdf_page_number": 172, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>The vision impressed her considerably, and suggested to her for the first time that the child might be suffering from something more serious than a cold, so she carried her off to a hospital for examination. The surgeon who attended to her discovered the presence of dangerous growth in the nose, which he pronounced must be removed. A few days later the child was taken to the hospital for the operation, and was put to bed. When the mother arrived at the hospital she found she had forgotten to bring one of the child’s night-dresses, and so the nurses had to supply one, which was
