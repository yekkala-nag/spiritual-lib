white. In this white dress the operation was performed on the girl the next day, in the room that her mother saw in her vision, every circumstance being exactly reproduced.<\/p>", "images": []}, {"pdf_page_index": 172, "pdf_page_number": 173, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>In all these cases the prevision achieved its result, but the books are full of stories of warnings neglected or scouted, and of the disaster that consequently followed. In some cases the information is given to someone who has practically no power to interfere in the matter, as in the historic instance when John Williams, a Cornish mine-manager, foresaw in the minutest detail, eight or nine days before it took place, the assassination of Mr. Spencer Perceval, the then Chancellor of the Exchequer, in the lobby of the House of Commons. Even in this case, however, it is just possible that something might have been done, for we read that Mr. Williams was so much impressed that he consulted his friends as to whether he ought not to go up to London to warn Mr. Perceval. Unfortunately they dissuaded him, and the assassination took place. It does not seem very probable that, even if he had gone up to town and related his story, much attention would have been paid to him; still there is just the possibility that some precautions might have been taken which would have prevented the murder.<\/p>", "images": []}, {"pdf_page_index": 173, "pdf_page_number": 174, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>There is little to show us what particular action on higher planes led to this curious prophetic vision. The parties were entirely unknown to one another, so that it was not caused by any close sympathy between them. If it was an attempt made by some helper to avert the threatened doom, it seems strange that no one who was sufficiently impressible could be found nearer than Cornwall. Perhaps Mr. Williams, when on the astral plane during sleep, somehow came across this reflection of the future, and being naturally horrified thereby, passed it on to his lower mind in the hope that somehow something might be done to prevent it; but it is impossible to diagnose the case with certainty without examining the ākāshic records to see what actually took place.<\/p>", "images": []}, {"pdf_page_index": 174, "pdf_page_number": 175, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>A typical instance of the absolutely purposeless foresight is that related by Mr. Stead, in his Real Ghost Stories (page 83), of his friend Miss Freer, commonly known as Miss X. When staying at a country house this lady, being wide awake and fully conscious, once saw a dogcart drawn by a white horse standing at the hall door, with two strangers in it, one of whom got out of the cart and stood playing with a terrier. She noticed that he was wearing an ulster, and also particularly observed the fresh wheel-marks made by the cart on the gravel. Nevertheless there was no cart there at the time; but half an hour later two strangers did drive up in such an equipage, and every detail of the lady’s vision was accurately fulfilled. Mr. Stead goes on to cite another instance of equally purposeless prevision where seven years separated the dream (for in this case it was a dream) and its fulfillment.<\/p>", "images": []}, {"pdf_page_index": 175, "pdf_page_number": 176, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>All these instances (and they are merely random selections from many hundreds) show that a certain amount of prevision is undoubtedly possible to the Ego, and such cases would evidently be much more frequent if it were not for the exceeding density and lack of response in the lower vehicles of the majority of what we call civilized mankind—qualities chiefly attributable to the gross practical materialism of the present age. I am not thinking of any profession of materialistic belief as common, but of the fact that in all practical affairs of daily life nearly everyone is guided solely by considerations of worldly interest in some shape or other.<\/p>", "images": []}, {"pdf_page_index": 176, "pdf_page_number": 177, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>In many cases the Ego himself may be an undeveloped one and his prevision consequently very vague; in others he himself may see clearly but may find his lower vehicles so unimpressible that all he can succeed in getting through into his physical brain may be an indefinite presage of coming disaster. Again, there are cases in which a premonition is not the work of the Ego at all, but of some outside entity, who for some reasons takes a friendly interest in the person to whom the feeling comes. In the work which I quote above, Mr. Stead tells us of the certainty which he felt many months beforehand that he would be left in change of the Pall Mall Gazette, through from an ordinary point of view nothing seemed less probable. Whether that foreknowledge was the result of an impression made by his own Ego or of a friendly hint from someone else it is impossible to say without definite investigation, but his confidence in it was fully justified.<\/p>", "images": []}, {"pdf_page_index": 177, "pdf_page_number": 178, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>There is one more variety of clairvoyance in time which ought not to be left without mention. It is a comparatively rare one, but there are enough examples on record to claim our attention, though unfortunately the particulars given do not usually include those which we should require in order to be able to diagnose it with certainty. I refer to the cases in which spectral armies or phantom flocks of animals have been seen. In The Night Side of Nature (page 462 et seq.) we have accounts of several such visions. We are there told how at Havarah Park, near Ripley, a body of soldiers in white uniform, amounting to several hundreds, was seen by reputable people to go through various evolutions and then vanish; and how some years earlier a similar visionary army was seen in the neighbourhood of Inverness by a respectable farmer and his son.<\/p><p>In this case also the number of troops was very great, and the spectators had not the slightest doubt at first that they were substantial forms of flesh and blood. They counted at least sixteen pairs of columns, and had abundance of time to observe every particular. The front ranks marched seven abreast, and were accompanied by a good many women and children, who were carrying tin cans and other implements of cookery. The men were clothed in red, and their arms shone brightly in the sun. In the midst of them was an animal, a deer or horse, they could not distinguish which, that they were driving furiously forward with their bayonets.<\/p>", "images": []}, {"pdf_page_index": 178, "pdf_page_number": 179, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>The younger of the two men observed to the other that every now and then the rear ranks were obliged to run to overtake the van; and the elder one, who had been a soldier, remarked that that was always the case, and recommend him if he ever served to try to march in the front. There was only one mounted officer; he rode a grey dragoon horse, and wore a gold-laced hat and blue Hussar cloak, with wide open sleeves lined with red. The two spectators observed him so particularly that they said afterwards they should recognize him anywhere. They were, however, afraid of being ill-treated or forced to go along with the troops, whom they concluded to have come from Ireland, and landed at Hyntyre; and whilst they were climbing over a dyke to get out of their way, the whole thing vanished.<\/p><p>A phenomenon of the same sort was observed in the earlier part of this century at Paderborn in Westphalia, and seen by at least thirty people; but as, some years later, a review of twenty thousand men was held on the very same spot, it was concluded that the vision must have been some sort of second-sight—a faculty not uncommon in the district.<\/p><p>Such spectral hosts, however, are sometimes seen where an army of ordinary men could by no possibility have marched, either before or after. One of the most remarkable accounts of such apparitions is given by Miss Harriet Martineau, in her description of The English Lakes. She writes as follows:<\/p>", "images": []}, {"pdf_page_index": 179, "pdf_page_number": 180, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“This Souter or Soutra Fell is the mountain on which ghosts appeared in myriads, at intervals during ten years of the last century, presenting the same appearances to twenty-six chosen witnesses, and to all the inhabitants of all the cottages within view of the mountain, and for a space of two hours and a half at one time—the spectral show being closed by darkness! The mountain, be it remembered, is full of precipices, which defy all marching of bodies of men; and the north and west sides present a sheer perpendicular of 900 feet.<\/p>", "images": []}, {"pdf_page_index": 180, "pdf_page_number": 181, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“On Midsummer Eve, 1735, a farm servant of Mr. Lancaster, half a mile from the mountain, saw the eastern side of its summit covered with troops, which pursued their onward march for an hour. They came, indistinct bodies, from an eminence on the north and disappeared in a niche in the summit. When the poor fellow told his tale, he was insulted on all hands, as original observers usually are when they see anything wonderful. Two years after, also on a Midsummer Eve, Mr. Lancaster saw some men there, apparently following their horses, as if they had returned from hunting. He thought nothing of this; but he happened to look up again ten minutes after, and saw the figures, now mounted, and followed by an interminable array of troops, five abreast, marching from the eminence and over the cleft as before. All the family saw this, and the manœuvres of the force, as each company was kept in order by a mounted officer, who galloped this way and that. As the shades of twilight came on, the disciple appeared to relax, and the troops intermingled, and rode at unequal paces till all was lost in darkness. Now of course all the Lancasters were insulted, as their servant had been; but their justification was not long delayed.<\/p>", "images": []}, {"pdf_page_index": 181, "pdf_page_number": 182, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“On the Midsummer Eve of the fearful 1745, twenty-six persons, expressly summoned by the family, saw all that had been seen before, and more. Carriages were now interspersed with the troops; and everybody knew that no carriages had been, or could be, on the summit of Souter Fell. The multitude was beyond imagination; for the troops filled a space of a mile, and marched quickly till night hid them—still marching. There was nothing vaporous or indistinct about the appearance of the spectres. So real did they seem, that some of the people went up the next morning, to look for the hoof-marks of the horses; and awful it was to them to find not one footprint on heather or grass. The witnesses attested the whole story on oath before a magistrate; and fearful were the expectations held by the whole country-side about the coming events of the Scotch rebellion.<\/p>", "images": []}, {"pdf_page_index": 182, "pdf_page_number": 183, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>“It now comes out that two other persons had seen something of the sort in the interval viz., in 1743—but had concealed it, to escape the insults to which their neighbours were subjected. Mr. Wren, of Wilton Hall, and his farm servant, saw, one summer evening, a man and a dog on the mountain, pursuing some horses along a place so steep that a horse could hardly by any possibility keep a footing on it. Their speed was prodigious, and their disappearance at the south end of the fell so rapid, that Mr. Wren and the servant went up, the next morning, to find the body of the man who must have been killed. Of man, horse, or dog, they found not a trace; and they came down and held their tongues. When they did speak, they fared not much better for having twenty-six sworn comrades in their disgrace.<\/p><p>“As for the explanation, the editor of the Lonsdale Magazine declared (volume ii, page 313) that it was discovered that on the Midsummer Eve of 1745 the rebels were ‘exercising on the western cost of Scotland, whose movements had been reflected by some transparent vapour, similar to the Fata Morgana’. This is not much in the way of explanation; but it is, as far as we know, all that can be had at present. These facts, however, brought out a good many more; as the spectral march of the same kind seen in Leicestershire in 1707, and the tradition of the tramp of armies over Helvellyn, on the eve of the battle of Marston Moor.”<\/p>", "images": []}, {"pdf_page_index": 183, "pdf_page_number": 184, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>Other cases are cited in which flocks of spectral sheep have been seen on certain roads, and there are of course various German stories of phantom cavalcades of hunters and robbers.<\/p><p>Now in these cases, as so often happens in the investigation of occult phenomena, there are several possible causes, any one of which would be quite adequate to the production of the observed occurrences, but in the absence of fuller information it is hardly feasible to do more than guess as to which of these possible causes were in operation in any particular instance.<\/p><p>The explanation usually suggested (whenever the whole story is not ridiculed as a falsehood) is that what is seen is a reflection by mirage of the movements of a real body and troops, taking place at a considerable distance. I have myself seen the ordinary mirage on several occasions and know something therefore of its wonderful powers of deception; but it seems to me that we should need some entirely new variety of mirage, quite different form that at present known to science, to account for these tales of phantom armies, some of which pass the spectator within a few years.<\/p>", "images": []}, {"pdf_page_index": 184, "pdf_page_number": 185, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>First of all, they may be, as apparently in the Westphalian case above mentioned, simply instances of prevision on a gigantic scale—by whom arranged, and for what purpose, it is not easy to divine. Again, they may often belong to the past instead of the future, and be in fact the reflect in of scenes from the ākāshic records—though here again the reason and method of such reflection is not obvious.<\/p><p>There are plenty of tribes of nature-spirits perfectly capable, if for any reason they wished to do so, of producing such appearances by their wonderful power of glamour (See Theosophical Manual, No. V, page 86), and such action would be quite in keeping with their delight in mystifying and impressing human beings. Or it may even sometimes be kindly intended by them as a warning to their friends of events that they know to be about to take place. It seems as though some explanation along these lines would be the most reasonable method of accounting for the extraordinary series of phenomena described by Miss Martineau—that is, if the stories told to her can be relied upon.<\/p><p>Another possibility is that in some cases what have been taken for soldiers were simply the nature-spirits themselves going through some of the ordered evolutions in which they take so much delight, though it must be admitted that these are rarely of a character which could be mistaken for military manœuvres except by the most ignorant.<\/p>", "images": []}, {"pdf_page_index": 185, "pdf_page_number": 186, "label": "Chapter 8. Clairvoyance In Time: The Future", "html": "<p>The flocks of animals are probably inmost instances mere records, but there are cases where they, like the “wild huntsmen” of German story, belong to an entirely different class of phenomena which is altogether outside of our present subject. Students of the occult will be familiar with the fact that the circumstances surrounding any scene of intense terror or passion, such as an exceptionally horrible murder, are liable to be occasionally reproduced in a form which it needs a very slight development of psychic faculty to be able to see; and it has sometimes happened that various animals formed part of such surroundings, and consequently they also are periodically reproduced by the action of the guilty conscience of the murderer. (See Manual V, page 115).<\/p><p>Probably whatever foundation of fact underlies the various stories of spectral horsemen and hunting-troops may generally be referred to this category.<\/p><p>This is also the explanation, evidently, of some of the visions of ghostly armies, such as that remarkable reenactment of the battle of Edgehill which seems to have taken place at intervals for some months after the date of the real struggle, as testified by a justice of the peace, a clergyman, and other eyewitnesses in a curious contemporary pamphlet entitled Prodigious Noises of War and Battle, at Edgehill, near Keinton, in Northamptonshire.<\/p>", "images": []}, {"pdf_page_index": 186, "pdf_page_number": 187, "label": "Chapter 9. Methods Of Development", "html": "<p>According to the pamphlet this case was investigated at the time by some officers of the army, who clearly recognized many of the phantom figures that they saw. This looks decidedly like an instance of the terrible power of man’s unrestrained passions to reproduce themselves, and to cause in some strange way a kind of materialization of their record.<\/p><p>In some cases it is clear that the flocks of animals seen have been simply hordes of unclean artificial elementals taking that form in order to feed upon the loathsome emanations of peculiarly horrible places, such as would be the site of a gallows.<\/p><p>An instance of this kind is furnished by the celebrated “Gyb Ghosts”, or ghosts of the biggest, describe in More Glimpses of the World Unseen, page 109, as being repeatedly seen in the form of herds of misshapen swine-like creatures, rushing, rooting and fighting night after night on the site of that foul monument of crime. But these belong to the subject of apparitions rather than to that of clairvoyance.<\/p><h3 class=\"pdf-heading\">Chapter 9. Methods Of Development<\/h3><p>When a men becomes convinced of the reality of the valuable power of clairvoyance, his first question usually is, “How can I develop in my own case this faculty which is said to be latent in everyone?”<\/p>", "images": []}, {"pdf_page_index": 187, "pdf_page_number": 188, "label": "Chapter 9. Methods Of Development", "html": "<p>Now the fact is that there are many methods by which it may be developed, but only one which be at all safely recommended for general use—that of which we shall speak last of all. Among the less advanced nations of the world the clairvoyant state has been produced in various objectionable ways; among some of the non-Aryan tribes of India, but the use of intoxicating drugs or the inhaling of stupefying fumes; among the dervishes, by whirling in a mad dance of religious fervour until vertigo and insensibility supervene; among the followers of the abominable practice of the Voodoo cult, by frightful sacrifices and loathsome rites of black magic. Methods such as these are happily not in vogue in our race, yet even among us large numbers of dabblers in this ancient art adopt some plan of self-hypnotization, such as gazing at a bright spot or the repetition of some formula until a condition of semi-stupefaction is produced; while yet another school among them would endeavour to arrive at similar results by the use of some of the Indian systems of regulation of the breath.<\/p>", "images": []}, {"pdf_page_index": 188, "pdf_page_number": 189, "label": "Chapter 9. Methods Of Development", "html": "<p>All these methods are unequivocally to be condemned as quite unsafe for the practice of the ordinary man who has no idea of what he is doing—who is simply making vague experiments in an unknown world. Even the method of obtaining clairvoyance by allowing oneself to be mesmerized by another person is one from which I should myself shrink with the most decided distaste; and assuredly it should never be attempted except under conditions of absolute trust and affection between the magnetizer and the magnetized, and a perfection of purity in heart and soul, in mind and intention, such as is rarely to be seen among any but the greatest of saints.<\/p><p>Experiments in connection with the mesmeric trance are of the deepest interest, as offering (among other things) a possibility of proof of the fact of clairvoyance to the sceptic, yet except under such conditions as I have just mentioned—conditions, I quite admit, almost impossible to realize—I should never counsel anyone to submit himself as a subject for them.<\/p>", "images": []}, {"pdf_page_index": 189, "pdf_page_number": 190, "label": "Chapter 9. Methods Of Development", "html": "<p>Curative mesmerism, (in which, without putting the patient into the trance state at all, an effort is made to relieve his pain, to remove his disease, or to pour vitality into him by magnetic passes) stands on an entirely different footing; and if the mesmerizer, even though quite untrained, is himself in good health and animated by pure intentions, no harm is likely to be done to the subject. In so extreme a case as that of a surgical operation, a man might reasonably submit himself even to the mesmeric trance, but it is certainly not a condition with which one ought lightly to experiment. Indeed, I should most strongly advise any one who did me the honour to ask for my opinion on the subject, not to attempt any kind of experimental investigation into what are still to him the abnormal forces of nature, until he has first of all read carefully everything that has been written on the subject, or—which is by far the best of all—until he is under the guidance of a qualified teacher.<\/p><p>But where, it will be said, is the qualified teacher to be found? Not, most assuredly, among any who advertise themselves as teachers, who offer to impart for so many guineas or dollars the sacred mysteries of the ages, or hold “developing circles” to which casual applicants are admitted at so much per head.<\/p>", "images": []}, {"pdf_page_index": 190, "pdf_page_number": 191, "label": "Chapter 9. Methods Of Development", "html": "<p>Much has been said in this treatise of the necessity for careful training—of the immense advantages of the trained over the untrained clairvoyant; but that again brings us back to the same question—where is this definite training to be had?<\/p><p>The answer is that the training may be had precisely where it has always been to be found since the world’s history began—at the hands of the Great White Brotherhood of Adepts, which stands now, as it has always stood, at the back of human evolution, guiding and helping it under the sway of the great Cosmic Laws which represent to us the Will of the Eternal.<\/p><p>But how, it may be asked, is access to be gained to Them? How is the aspirant thirsting for knowledge to signify to Them his wish for instruction?<\/p>", "images": []}, {"pdf_page_index": 191, "pdf_page_number": 192, "label": "Chapter 9. Methods Of Development", "html": "<p>Once more, by the time-honoured methods only. There is no new patent whereby a man can qualify himself without trouble to become a pupil in that School—no royal road to the learning which has to be acquired in it. At the present day, just as in the mists of antiquity, the man who wishes to attract Their notice must enter upon the slow and toilsome path of self-development—must learn first of all to take himself in hand and make himself all that he ought to be. The steps of that path are no secret; I have given them in full details in Invisible Helpers, so I need not repeat them here. But it is no easy road to follow, and yet sooner or later all must follow it, for the Great Law of evolution sweeps mankind slowly but resistlessly towards its goal.<\/p><p>From those who are pressing into this path the great Masters select Their pupils, and it is only by qualifying himself to be taught that a man can put himself in the way of getting the teaching. Without that qualification membership in any Lodge or Society, whether secret or otherwise, will not advance his object in the slightest degree. It is true, as we all know, that it was at the instance of some of these Masters that our Theosophical Society was founded, and that from its ranks some have been chosen to pass into closer relations with Them. But that choice depends upon the earnestness of the candidate, not upon his mere membership of the Society or of anybody within it.<\/p>", "images": []}, {"pdf_page_index": 192, "pdf_page_number": 193, "label": "Chapter 9. Methods Of Development", "html": "<p>That, then, is the only absolutely safe way of developing clairvoyance—to enter with all one’s energy upon the path of moral and mental evolution, at one stage of which this and other of the higher faculties will spontaneously begin to show themselves. Yet there is one practice which is advise by all the religions alike—which if adopted carefully and reverently can do no harm to any human being, yet from which a very pure type of clairvoyance has sometimes been developed and that is the practice of meditation.<\/p><p>Let a man choose a certain time every day—a time when he can rely upon being quiet and undisturbed, though preferably in the daytime rather than at night—and set himself at that time to keep his mind for a few minutes entirely free from all earthly thoughts of any kind whatever and, when that is achieved, to direct the whole force of his being towards the highest spiritual ideal that he happens to know. He will find that to gain such perfect control of thought is enormously more difficult than he supposes, but when he attains it, it cannot but be in every way most beneficial to him, and as he grows more and more able to elevate and concentrate his thought, he may gradually find that new worlds are opening before his sight.<\/p>", "images": []}, {"pdf_page_index": 193, "pdf_page_number": 194, "label": "Chapter 9. Methods Of Development", "html": "<p>As a preliminary training towards the satisfactory achievement of such meditation, he will find it desirable to make a practice of concentration in the affairs of daily life—even in the smallest of them. If he writes a letter, let him think of nothing else but that letter until it is finished; if he reads a book, let him see to it that his thought is never allowed to wander from his author’s meaning. He must learn to hold his mind in check, and to be master of that also, as well as of his lower passions; he must patiently labour to acquire absolute control of his thoughts, so that he will always know exactly what he is thinking about, and why—so that he can use his mind, and turn it or hold it still, as a practised swordsman turns his weapon where he wilt.<\/p><p>Yet after all, if those who so earnestly desire clairvoyance could possess it temporarily for a day or even an hour, it is far from certain that they would choose to retain the gift. True, it opens before them new worlds of study, new powers of usefulness, and for this latter reason most of us feel it worth while; but it should be remembered that for one whose duty still calls him to live in the world it is by no means an unmixed blessing. Upon one in whom that vision is opened the sorrow and the misery, the evil and the greed of the world press as an ever-present burden, until in the earlier days of his knowledge he often feels inclined to echo the passionate adjuration contained in those rolling lines of Schiller’s:<\/p>", "images": []}, {"pdf_page_index": 194, "pdf_page_number": 195, "label": "Chapter 9. Methods Of Development", "html": "<p>Dein Orakel zu verkünden, warum warfest du mich hinIn die Stadt der ewig Blinden, mit dem aufgeschloss’nen Sinn?Frommt’s den Schleier aufzuheben, wo das nahe Schrecknis droht?Nur der Irrthum ist das Leben; dieses Wissen ist der Tod.Nimm, O nimm die traur’ge Klarheit mir vom Aug’ den blut’gen Schein!Schrecklich ist es deiner Wahrheit sterbliches Gefäss zu sein!<\/p><p>which may perhaps be translated, “Why hast thou cast me thus into the town of the ever-blind, to proclaim thine oracle by the opened sense? What profits it to lift the veil where the near darkness threatens? Only ignorance is life; this knowledge is death. Take back this sad clear-sightedness; take from mine eyes this cruel light! It is horrible to be the mortal channel of thy truth.” And again later he cries, “Give me back my blindness, the happy darkness of my senses; take back thy dreadful gift!”<\/p><p>But this of course is a feeling which passes, for the higher sight soon shows the pupil something beyond the sorrow—soon bears in upon his soul the overwhelming certainty that, whatever appearances down here may seem to indicate, all things are without shadows of doubt working together for the eventual good of all. He re reflects that the sin and the suffering are there, whether he is able to perceive them or not, and that when he can see them he is after all better able to give efficient help than he would be if he were working in the dark; and so by degrees he learns to bear his share of the heavy karma of the world.<\/p>", "images": []}, {"pdf_page_index": 195, "pdf_page_number": 196, "label": "Chapter 9. Methods Of Development", "html": "<p>Some misguide mortals there are who, having the good fortune to possess some slight touch of this higher power, are nevertheless so absolutely destitute of all right feeling in connection with it as to use it for the most sordid ends—actually even to advertise themselves as “test and business clairvoyants!.” Needless to say, such use of the faculty is a mere prostitution and degradation of it, showing that its unfortunate possessor has somehow got hold of it before the moral side of his nature has been sufficiently developed to stand the strain which it imposes. A perception of the amount of evil karma that may be generated by such action in a very short time changes one’s disgust into pity for the unhappy perpetrator of that sacrilegious folly.<\/p>", "images": []}, {"pdf_page_index": 196, "pdf_page_number": 197, "label": "Chapter 9. Methods Of Development", "html": "<p>It is sometimes object that the possession of clairvoyance destroys all privacy, and confers a limitless ability to explore the secrets of others. No doubt it does confer such an ability, but nevertheless the suggestion is an amusing one to any one who knows anything practically about the matter. Such an objection may possibly be well-founded as regards the very limited powers of the “test and business clairvoyant”, but the man who brings it forward against those who have had the faculty opened for them in the course of their instruction, and consequently possess it fully, is forgetting three fundamental facts: first, that it is quite inconceivable that anyone, having before him the splendid fields for investigation which true clairvoyance opens up, could ever have the slightest wish to pry into the trumpery little secrets of any individual man; secondly, that even if by some impossible chance our clairvoyant had such indecent curiosity about matters of petty gossip, there is, after all, such a thing as the honour of a gentleman, which, on that plane as on this, would of course prevent him from contemplating for an instant the idea of gratifying it; and thirdly, in case, by any unheard-of possibility, one might encounter some variety of low-class pitri with whom the above considerations would have no weight, full instructions are always given to every pupil, as soon as he develops any sign of faculty, as to the limitations which are placed upon its use.<\/p>", "images": []}, {"pdf_page_index": 197, "pdf_page_number": 198, "label": "Chapter 9. Methods Of Development", "html": "<p>Put briefly, these restrictions are that there shall be no prying, no selfish use of the power, and no displaying of phenomena. That is to say, that the same considerations which would govern the actions of a man of right feeling upon the physical plane are expected to apply upon the astral and mental planes also; that the pupil is never under any circumstances to use the power which his additional knowledge gives to him in order to promote his own worldly advantage, or indeed in connection with gain in any way; and that he is never to give what is called in spiritualistic circle “a test”—that is, to do anything which will incontestably prove to sceptics on the physical plane that he possesses what to them would appear to be an abnormal power.<\/p>", "images": []}, {"pdf_page_index": 198, "pdf_page_number": 199, "label": "Chapter 9. Methods Of Development", "html": "<p>With regard to this latter proviso people often say, “But why should he not? It would be so easy to confute and convince your sceptic, and it would do him good!” Such critics lose sight of the fact that, in the first place, none of those who know anything want to confute or convince sceptics, or trouble themselves in the slightest degree about the sceptic’s attitude one way or the other; and in the second, they fail to understand how much better it s for that sceptic that he should gradually grow into an intellectual appreciation of the facts of nature, instead of being suddenly introduced to them by a knockdown blow, as it were. But the subject was fully considered many years ago in Mr. Sinnett’s Occult World, and it is needless to repeat again the arguments there adduced.<\/p>", "images": []}, {"pdf_page_index": 199, "pdf_page_number": 200, "label": "Chapter 9. Methods Of Development", "html": "<p>It is very hard for some of our friends to realize that the silly gossip and idle curiosity which so entirely fill the lives of the brainless majority on earth can have no place in the more real life of the disciple; and so they sometimes enquire whether, even without any special wish to see, a clairvoyant might not casually observe some secret which another person was trying to keep, in the same way as one’s glance might casually fall upon a sentence in someone else’s letter which happened to be lying open upon the table. Of course he might, but what if he did? The man of honour would at once avert his eyes, in one case as in the other, and it would be as thought he had not seen. If objectors could but grasp the idea that no pupil cares about other people’s business, except when it comes within his province to try to help them, and that he has always a world of work of his own to attend to, they would not be so hopelessly far from understanding the facts of the wide life of the trained clairvoyant.<\/p>", "images": []}, {"pdf_page_index": 200, "pdf_page_number": 201, "label": "Chapter 9. Methods Of Development", "html": "<p>Even from the little that I have said with regard to the restrictions laid upon the pupil, it will be obvious that in very many cases he will know much more than he is at liberty to say. That is of course true in a far wider sense of the great Masters of Wisdom Themselves, and that is why those who have the privilege of occasionally entering Their presence pay so much respect to Their lightest word in subjects quite apart from the direct teaching. For opinion of a master, or even of one of His higher pupils, upon any subject is that of a man whose opportunity of judging accurately is out of all proportion to ours.<\/p>", "images": []}, {"pdf_page_index": 201, "pdf_page_number": 202, "label": "Chapter 9. Methods Of Development", "html": "<p>His position and His extended faculties are in reality the heritage of all mankind, and, far though we may now be from those grand powers, they will none the less certainly be ours one day. Yet how different a place will this old world be when humanity as a whole possesses the higher clairvoyance! Think what the difference will be to history when all can read the records; to science, when all the processes about which now men theorize can be watched through all their course; to medicine, when doctor and patients alike can see clearly and exactly all that is being done; to philosophy, when there is no longer any possibility of discussion as to its basis, because all alike can see a wider aspect of the truth; to labour, when all work will be joy, because every man will be put only to that which he can do best; to education, when the minds and hearts of the children are open to the teacher who is trying to form their character; to religion, when there is no longer any possibility of dispute as to its broad dogmas, since the truth about the states after death, and the Great Law that governs the world, will be patent to all eyes.<\/p>", "images": []}, {"pdf_page_index": 202, "pdf_page_number": 203, "label": "Chapter 9. Methods Of Development", "html": "<p>Above all, how far easier it will be then for the evolved men to help one another under those so much freer conditions. The possibilities that open before the mind are as glorious vistas stretching in all directions, so that our Seventh Round should indeed be a veritable golden age. Well for us that these grand faculties will not be possessed by all humanity until it has evolved to a far higher level in morality as well as in wisdom, else should we but repeat once more under still worse conditions the terrible downfall of the great Atlantean civilization, whose members failed to realize that increased power meant increased responsibility. Yet we ourselves were most of us among those very men; let us hope that we have learnt wisdom by that failure, and that when the possibilities of the wider life open before use once more, this time we shall bear the trial better.<\/p><p>THE END<\/p><p>↑ Back to top<\/p>", "images": []}]</script>

<script id="notes-data" type="application/json">{"Chapter 1. What Clairvoyance Is": {"s": "Defines clairvoyance as the power of seeing what is hidden from ordinary physical sight, explains its relation to the astral and mental planes, and distinguishes genuine faculty from common imitations.", "p": ["Clairvoyance = clear-seeing beyond the physical senses", "It operates through the astral and mental bodies", "Genuine faculty differs from trance mediumship and imagination"]}, "Chapter 2. Simple Clairvoyance: Full": {"s": "Describes full simple clairvoyance — seeing the astral or mental plane around one as clearly as the physical, including auras, thought-forms, and non-physical entities.", "p": ["Full clairvoyance shows the subtle plane as plainly as the physical", "Auras and thought-forms become directly visible", "Requires full waking consciousness and self-control"]}, "Chapter 3. Simple Clairvoyance: Partial": {"s": "Covers partial clairvoyance — fragmentary or occasional glimpses of the subtler worlds — and why such flashes are unreliable without training.", "p": ["Partial clairvoyance gives fragmentary glimpses", "Untrained glimpses are easily misread", "Discrimination and training make it dependable"]}, "Chapter 4. Clairvoyance In Space: Intentional": {"s": "Explains intentional clairvoyance at a distance — deliberately directing the subtler senses to a remote place, its methods, and its limits.", "p": ["The astral senses can be directed to a distant scene", "Intentional remote viewing requires concentration and practice", "Distance is no barrier, but accuracy varies with training"]}, "Chapter 5. Clairvoyance In Space: Semi-Intentional": {"s": "Discusses semi-intentional space-clairvoyance, where the vision arises in response to a strong wish, anxiety, or emotional link rather than deliberate direction.", "p": ["Vision arises from strong emotion or desire rather than will", "Common in crises — seeing loved ones at a distance", "The emotional link supplies the motive power"]}, "Chapter 6. Clairvoyance In Space: Unintentional": {"s": "Examines unintentional space-clairvoyance: spontaneous visions of distant events that come unsought, often in dreams or moments of passivity.", "p": ["Spontaneous visions arrive without intention", "Often occur in dream, illness, or relaxation", "Their value lies in verification, not cultivation"]}, "Chapter 7. Clairvoyance In Time: The Past": {"s": "Describes clairvoyance of the past: reading the akashic records — the indelible impressions of all events — and the degrees of accuracy possible.", "p": ["The past survives as records on the higher planes (akashic)", "Trained vision can read these records accurately", "Reflections of the records at lower levels are distorted"]}, "Chapter 8. Clairvoyance In Time: The Future": {"s": "Considers foreseeing the future: how far the future is determined, what can be seen of it, and the philosophical problem of free will and prevision.", "p": ["The future is only partly predetermined", "Prevision sees tendencies, not fixed events", "Free will operates within the web of causation"]}, "Chapter 9. Methods Of Development": {"s": "Outlines how clairvoyance may be developed: the dangers of hasty or selfish methods, and the safe, slow path of purification, concentration, and guidance by a competent teacher.", "p": ["Forced methods (drugs, séances) are dangerous", "The safe way is purification, concentration, and meditation", "A qualified teacher is essential for real development"]}}</script>

    const card = document.createElement('div');
    card.className = 'figure-card';
    const img = document.createElement('img');
    img.src = imgSrc(im.file);
    img.alt = im.caption;
    img.addEventListener('click', () => openLightbox(img.src, im.caption));
    const cap = document.createElement('div');
    cap.className = 'figure-cap';
    cap.textContent = im.caption;
    card.appendChild(img);
    card.appendChild(cap);
    figWrap.appendChild(card);

  document.getElementById('folio-label').textContent = 'Page ' + p.pdf_page_number + ' / ' + PAGES.length;
  document.getElementById('progress-label').textContent = 'Page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('progress-fill').style.width = (((current+1)/PAGES.length)*100).toFixed(1) + '%';

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === PAGES.length - 1;
  document.getElementById('next-btn').textContent = current === PAGES.length -1 ? 'End' : 'Next \u2192';

  document.getElementById('leaf').style.animation = 'none';
  void document.getElementById('leaf').offsetWidth;
  document.getElementById('leaf').style.animation = '';

  updateActiveTocItem();
  window.scrollTo({top:0, behavior:'smooth'});
  if (window.__afterRender) window.__afterRender();
}

function openLightbox(src, alt){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}

});

document.getElementById('prev-btn').addEventListener('click', () => {

});
document.getElementById('next-btn').addEventListener('click', () => {

});

document.addEventListener('keydown', (e) => {

// ---------- Read aloud (prefers Indian English voices) ----------
(function(){
  const listenBtn = document.getElementById('listen-toggle');
  const bar = document.getElementById('listen-bar');
  const voiceSel = document.getElementById('voice-select');
  const rateSel = document.getElementById('rate-select');
  const playBtn = document.getElementById('listen-play');
  const stopBtn = document.getElementById('listen-stop');
  const autoChk = document.getElementById('listen-auto');
  const status = document.getElementById('listen-status');

  if (!('speechSynthesis' in window)) {
    listenBtn.style.display = 'none';
    return;
  }

  let voices = [];
  let listening = false;
  let paused = false;
  let gen = 0;

  function score(v){
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l.indexOf('en-in') === 0) return 3;
    if (l === 'en-gb') return 2;
    return 1;
  }

  function loadVoices(){
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
    voices = (en.length ? en : all).slice().sort((a, b) => score(b) - score(a));
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const isIndian = (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0;
      opt.textContent = v.name + ' (' + v.lang + ')' + (isIndian ? ' — Indian accent' : '');
      voiceSel.appendChild(opt);
    });
    const idx = voices.findIndex(v => (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0);
    voiceSel.value = idx >= 0 ? idx : 0;
    if (!listening) {
      status.textContent = idx >= 0
        ? 'Indian English voice ready.'
        : 'No Indian English voice found on this device — closest English voice selected.';
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function pageText(){
    const p = PAGES[current];
    const div = document.createElement('div');
    div.innerHTML = p.html;
    let t = (div.textContent || '').replace(/\s+/g, ' ').trim();
    (p.images || []).forEach(im => { t += ' Figure on this page: ' + im.caption + '.'; });
    return t;
  }

  function chunk(text){
    const parts = text.match(/[^.!?\u2026]+[.!?\u2026]+["')\]]*\s*/g) || [text];
    const out = [];
    let buf = '';
    parts.forEach(s => {
      if ((buf + s).length > 220) { if (buf) out.push(buf); buf = s; }
      else buf += s;
    });
    if (buf) out.push(buf);
    return out;
  }

  function speak(){
    const text = pageText();
    if (!text) { status.textContent = 'Nothing to read on this page.'; return; }
    const myGen = ++gen;
    speechSynthesis.cancel();
    const pieces = chunk(text);
    const v = voices[parseInt(voiceSel.value, 10)];
    pieces.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateSel.value);
      if (i === pieces.length - 1) {
        u.onend = () => {
          if (!listening || myGen !== gen) return;
          if (autoChk.checked && current < PAGES.length - 1) { current++; render(); }
          else setUi(false);
        };
      }
      speechSynthesis.speak(u);
    });
    status.textContent = 'Reading page ' + (current + 1) + ' of ' + PAGES.length + '…';
  }

  function setUi(on){
    listening = on;
    paused = false;
    playBtn.innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Read aloud';
    stopBtn.disabled = !on;
    if (!on) status.textContent = 'Stopped.';
  }

  window.__afterRender = function(){
    if (listening) speak();
  };

  setInterval(() => {
    if (listening && !paused && speechSynthesis.speaking) speechSynthesis.resume();
  }, 10000);

  listenBtn.addEventListener('click', () => bar.classList.toggle('open'));
  playBtn.addEventListener('click', () => {
    if (!listening) { setUi(true); speak(); return; }
    if (paused) { speechSynthesis.resume(); paused = false; playBtn.innerHTML = '&#10074;&#10074; Pause'; }
    else { speechSynthesis.pause(); paused = true; playBtn.innerHTML = '&#9654; Resume'; }
  });
  stopBtn.addEventListener('click', () => { gen++; speechSynthesis.cancel(); setUi(false); });
  voiceSel.addEventListener('change', () => { if (listening) speak(); });
  rateSel.addEventListener('change', () => { if (listening) speak(); });
})();

</script>

<script>
(function(){
  var NOTES = {};
  var CHMAP = [];
  try { NOTES = JSON.parse(document.getElementById('notes-data').textContent); } catch(e) {}
  try { CHMAP = JSON.parse(document.getElementById('chapter-map').textContent); } catch(e) {}
  var term = '', matchPages = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function pageText(p){ var d=document.createElement('div'); d.innerHTML=p.html; return d.textContent || ''; }

  // ---------- SEARCH ----------
  var bar = document.getElementById('search-bar');
  var input = document.getElementById('search-input');
  var info = document.getElementById('search-info');

  function clearMarks(){
    var c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(function(mk){
      var t = document.createTextNode(mk.textContent);
      mk.parentNode.replaceChild(t, mk);
    });
    c.normalize();
  }
  function highlight(){
    clearMarks();
    if (!term || term.length < 2) return;
    var c = document.getElementById('content');
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var t = term.toLowerCase();
    nodes.forEach(function(n){
      var txt = n.nodeValue, low = txt.toLowerCase(), idx = low.indexOf(t);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(txt.slice(pos, idx)));
        var mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = txt.slice(idx, idx + term.length);
        frag.appendChild(mk);
        pos = idx + term.length;
        idx = low.indexOf(t, pos);
      }
      frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function infoText(){
    if (!term || term.length < 2) { info.textContent = ''; return; }
    if (!matchPages.length) { info.textContent = 'No matches'; return; }
    var pos = matchPages.indexOf(current);
    info.textContent = matchPages.length + (matchPages.length > 1 ? ' pages' : ' page') +
      (pos >= 0 ? ' — match ' + (pos + 1) + ' of ' + matchPages.length : '');
  }
  function doSearch(){
    term = input.value.trim();
    matchPages = [];
    if (term.length >= 2){
      var t = term.toLowerCase();
      PAGES.forEach(function(p, i){ if (pageText(p).toLowerCase().indexOf(t) >= 0) matchPages.push(i); });
    }
    if (matchPages.length){ current = matchPages[0]; render(); }
    else { highlight(); infoText(); }
  }
  function step(d){
    if (!matchPages.length) return;
    var pos = matchPages.indexOf(current);
    if (pos < 0) pos = 0;
    pos = (pos + d + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }
  var searchT = null;
  input.addEventListener('input', function(){ clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ clearTimeout(searchT); doSearch(); } });
  document.getElementById('search-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('search-next').addEventListener('click', function(){ step(1); });
  document.getElementById('search-close').addEventListener('click', function(){
    bar.classList.remove('open'); term=''; matchPages=[]; highlight(); infoText();
  });
  document.getElementById('search-toggle').addEventListener('click', function(){
    var open = bar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) input.focus();
  });

  // ---------- NOTES ----------
  var panel = document.getElementById('notes-panel');
  var body = document.getElementById('notes-body');
  function showNotes(){
    var ch = null;
    for (var i = current; i >= 0; i--){
      if (CHMAP[i] && NOTES[CHMAP[i]]) { ch = CHMAP[i]; break; }
    }
    if (!ch){
      for (var j = current; j < CHMAP.length; j++){
        if (CHMAP[j] && NOTES[CHMAP[j]]) { ch = CHMAP[j]; break; }
      }
    }
    if (!ch){
      body.innerHTML = '<p class="notes-empty">No chapter notes available for this section.</p>';
      return;
    }
    var n = NOTES[ch];
    var h = '<h3>' + esc(ch) + '</h3><h4>Summary</h4><p>' + esc(n.s) + '</p>';
    if (n.p && n.p.length){
      h += '<h4>Key points</h4><ul>' + n.p.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body.innerHTML = h;
  }
  document.getElementById('notes-toggle').addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    bar.classList.remove('open');
    if (open) showNotes();
  });

  // hooks after every render
  var prevA = window.__afterRender;
  window.__afterRender = function(){
    if (prevA) prevA();
    highlight();
    infoText();
    if (panel.classList.contains('open')) showNotes();
  };
})();
</script>

  var popup = null, term = '', lastUrl = '';

  function hideTip(){ tip.classList.remove('show'); }
  function hideBar(){ bar.classList.remove('show'); }

  function showTipForSelection(){
    var sel = window.getSelection();
    var txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    if (txt.length >= 2 && txt.length <= 160){
      term = txt;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      var top = r.top - 46;
      if (top < 8) top = r.bottom + 10;
      var left = r.left + r.width / 2;
      left = Math.max(90, Math.min(window.innerWidth - 90, left));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.classList.add('show');
    } else {
      hideTip();
    }
  }

  document.addEventListener('mouseup', function(e){
    if (tip.contains(e.target) || bar.contains(e.target)) return;
    setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('keyup', function(e){
    if (e.shiftKey) setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!tip.contains(e.target)) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);

  document.getElementById('sel-search-btn').addEventListener('click', function(){
    if (!term) return;
    lastUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(term);
    popup = window.open(lastUrl, 'ddg_search_popup', 'width=920,height=700,menubar=no,toolbar=no,location=no,status=no');
    hideTip();
    var msg = document.getElementById('sel-search-msg');
    if (popup){

    } else {
      msg.innerHTML = 'Popup blocked — <a href="' + lastUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">open the search in a new tab</a>.';
    }
    bar.classList.add('show');
  });

  document.getElementById('sel-search-close').addEventListener('click', function(){
    if (popup && !popup.closed) popup.close();
    popup = null;
    hideBar();
  });
})();
</script>

    return d;
  }
  function esc(t){ var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  addMsg('bot', 'Namaste. Ask me anything \u2014 I can search <b>this book</b> page by page, answer with your configured LLM, or run an external DuckDuckGo search.');

  function pageText(p){
    var d = document.createElement('div'); d.innerHTML = p.html; return d.textContent || '';
  }

  function searchBook(q){
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });

  }

  function snippet(i, q){
    var txt = pageText(PAGES[i]).replace(/\s+/g,' ');
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    var pos = -1;
    for (var k = 0; k < terms.length; k++){ pos = txt.toLowerCase().indexOf(terms[k]); if (pos >= 0) break; }
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 60);
    return (start ? '\u2026' : '') + txt.slice(start, start + 170) + '\u2026';
  }

  function goToPage(i){
    try { current = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch(e){ console.warn('jump failed', e); }
  }

  function callLlm(q, context){
    return fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: 'You are the assistant inside a spiritual book reader. Answer concisely. When book excerpts are provided, ground the answer in them and cite the page labels. If the question needs current external facts, say so and suggest an external search.' },
          { role: 'user', content: context ? 'Book excerpts:\n' + context + '\n\nQuestion: ' + q : q }
        ],
        temperature: 0.4
      })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error('LLM error ' + res.status + ': ' + t.slice(0,180)); });
      return res.json();
    }).then(function(data){
      var c = data.choices && data.choices[0] && data.choices[0].message;
      return (c && c.content || '(empty response)').trim();
    });
  }

  function handleSend(){
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    addMsg('user', esc(q));
    busy = true; sendBtn.disabled = true;
    var thinking = document.createElement('div');
    thinking.className = 'sl-thinking'; thinking.textContent = 'Thinking\u2026';
    body.appendChild(thinking); scrollBody();

    var hits = searchBook(q);
    var finish = function(){ busy = false; sendBtn.disabled = false; thinking.remove(); };

    function renderRefs(){
      if (!hits.length) return '';
      var h = '';
      hits.forEach(function(hit, n){
        h += '<button class="sl-ref" data-page="' + hit.i + '" type="button"><b>' + esc(PAGES[hit.i].label) +
             ' \u00b7 page ' + (hit.i + 1) + '</b><span>' + esc(snippet(hit.i, q)) + '</span>' +
             '<span class="go">Go to page \u2192</span></button>';
      });
      return h;
    }

    var done = function(html){ finish(); var m = addMsg('bot', html);
      m.querySelectorAll('.sl-ref').forEach(function(b){
        b.addEventListener('click', function(){ goToPage(parseInt(b.getAttribute('data-page'), 10)); });
      });
    };

    if (cfg.key){
      var ctx = hits.slice(0,3).map(function(hit){
        return '[' + PAGES[hit.i].label + ', page ' + (hit.i + 1) + '] ' + pageText(PAGES[hit.i]).replace(/\s+/g,' ').slice(0, 900);
      }).join('\n');
      callLlm(q, ctx).then(function(ans){ done(esc(ans) + renderRefs()); })
      .catch(function(err){ done(esc(String(err.message || err)) + renderRefs()); });
    } else if (hits.length){
      done('I found ' + hits.length + ' relevant page' + (hits.length > 1 ? 's' : '') + ' in this book. Tap one to jump there, or add an LLM API key in \u2699 Settings for a synthesized answer.' + renderRefs());
    } else {
      var url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      done('Nothing in this book matched. <a href="' + url + '" target="_blank" rel="noopener">Search the web for \u201c' + esc(q) + '\u201d on DuckDuckGo \u2197</a> \u2014 or add an LLM key in \u2699 Settings and I can answer directly.');
    }
  }

  fab.addEventListener('click', function(){ panel.classList.toggle('show'); });
  panel.querySelector('#sl-chat-x').addEventListener('click', function(){ panel.classList.remove('show'); });
  panel.querySelector('#sl-chat-clear').addEventListener('click', function(){ body.innerHTML = ''; addMsg('bot', 'Chat cleared. Ask me anything.'); });
  panel.querySelector('#sl-chat-gear').addEventListener('click', function(){
    var st = panel.querySelector('#sl-chat-settings');
    st.classList.toggle('show');
    panel.querySelector('#sl-cfg-endpoint').value = cfg.endpoint || '';
    panel.querySelector('#sl-cfg-key').value = cfg.key || '';
    panel.querySelector('#sl-cfg-model').value = cfg.model || '';
  });
  panel.querySelector('#sl-cfg-save').addEventListener('click', function(){
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    panel.querySelector('#sl-cfg-status').textContent = 'Saved.';
  });
  panel.querySelector('#sl-cfg-test').addEventListener('click', function(){
    var status = panel.querySelector('#sl-cfg-status');
    status.textContent = 'Testing\u2026';
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'Say OK' }], max_tokens: 5 })
    }).then(function(res){ status.textContent = res.ok ? 'Connected.' : 'Failed: HTTP ' + res.status; })
    .catch(function(err){ status.textContent = 'Failed: ' + err.message; });
  });
  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });
})();
</script>
<style id="sl-sel-css">
#sl-sel-tip{position:fixed;z-index:99999;display:none;align-items:center;gap:2px;padding:5px;background:#2E2A24;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);font:13px/1.2 system-ui,-apple-system,sans-serif}
#sl-sel-tip.show{display:flex}
#sl-sel-tip button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:#F7F1E3;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
#sl-sel-tip button:hover{background:#4A4234}
#sl-sel-tip .sl-sep{width:1px;height:18px;background:#55493A;margin:0 2px}
#sl-sel-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#2E2A24;color:#F7F1E3;padding:10px 18px;border-radius:999px;font:13px system-ui,-apple-system,sans-serif;z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:0 8px 22px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#sl-sel-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>
(function(){
  if (window.__slSelTools) return; window.__slSelTools = true;

  /* Compatibility shim: topic-based readers (e.g. Ponder on This) expose
     `topics` + `goTo(id)` instead of `PAGES` + `render()`. Build the PAGES
     interface so the embedded assistant's search and page jumps work there too. */
  try {
    if (typeof PAGES === 'undefined' && typeof topics !== 'undefined' && Array.isArray(topics)) {
      window.PAGES = topics.map(function(t){
        return {
          label: 'Topic ' + t.id + ' \u2014 ' + t.title,
          html: '<div>' + (t.matter || []).map(function(m){ return '<p>' + m.text + '</p>'; }).join('') + '</div>'
        };
      });
      window.render = function(){
        try { if (typeof goTo === 'function') goTo(topics[window.current || 0].id); } catch(e){}
      };
    }
  } catch(e){}

  var NOTES_KEY = 'sl_my_notes';

  var tip = document.createElement('div');
  tip.id = 'sl-sel-tip';
  tip.setAttribute('role', 'toolbar');
  tip.setAttribute('aria-label', 'Selection actions');
  tip.innerHTML =
    '<button type="button" data-act="ask">\u2728 Ask AI</button>' +
    '<span class="sl-sep"></span>' +
    '<button type="button" data-act="note">\uD83D\uDCDD Add to my note</button>';
  document.body.appendChild(tip);

  var toast = document.createElement('div');
  toast.id = 'sl-sel-toast';
  document.body.appendChild(toast);
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  var selText = '';

  function hideTip(){ tip.classList.remove('show'); }

  function insideUi(node){
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    while (el) {
      if (el.id === 'sl-chat-panel' || el.id === 'sl-sel-tip' ||
          el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return true;
      el = el.parentElement;
    }
    return false;
  }

  function showTip(){
    var sel = window.getSelection();
    var text = sel && !sel.isCollapsed ? sel.toString().replace(/\s+/g, ' ').trim() : '';
    if (text.length < 3 || insideUi(sel.anchorNode)) { hideTip(); return; }
    var rect;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch(e){ hideTip(); return; }
    if (!rect || (rect.width === 0 && rect.height === 0)) { hideTip(); return; }
    selText = text;
    tip.classList.add('show');
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = rect.left + rect.width / 2 - w / 2;
    var y = rect.top - h - 8;
    if (y < 6) y = Math.min(window.innerHeight - h - 6, rect.bottom + 8);
    x = Math.max(6, Math.min(window.innerWidth - w - 6, x));
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseup', function(){ setTimeout(showTip, 10); });
  document.addEventListener('touchend', function(){ setTimeout(showTip, 350); });
  document.addEventListener('mousedown', function(e){ if (!tip.contains(e.target)) hideTip(); });
  document.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideTip(); });

  /* Keep the text selection alive when the user taps a tooltip button */
  tip.addEventListener('mousedown', function(e){ e.preventDefault(); });
  tip.addEventListener('touchend', function(e){ e.preventDefault(); }, { passive: false });

  function askAi(text){
    var panel = document.getElementById('sl-chat-panel');
    var input = document.getElementById('sl-chat-input');
    var send = document.getElementById('sl-chat-send');
    if (!panel || !input || !send) return;
    panel.classList.add('show');
    var trimmed = text.length > 600 ? text.slice(0, 600) + '\u2026' : text;
    input.value = 'Explain this passage: \u201C' + trimmed + '\u201D';
    send.click();
    input.focus();
  }

  function currentLocation(){
    try {
      if (typeof PAGES !== 'undefined' && typeof current !== 'undefined' && PAGES[current]) {
        return PAGES[current].label || '';
      }
    } catch(e){}
    try {
      if (typeof topics !== 'undefined' && typeof currentId !== 'undefined') {
        var t = topics.find(function(x){ return x.id === currentId; });
        if (t) return 'Topic ' + t.id + ' \u2014 ' + t.title;
      }
    } catch(e){}
    return '';
  }

  function addNote(text){
    var notes = [];
    try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); } catch(e){}
    if (!Array.isArray(notes)) notes = [];
    notes.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      book: document.title,
      page: currentLocation(),
      text: text,
      url: location.pathname.split('/').pop(),
      ts: Date.now()
    });
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes.slice(0, 500))); } catch(e){}
    showToast('Saved to My Notes \u2014 view it on the library home page');
  }

  tip.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    var text = selText;
    hideTip();
    if (btn.getAttribute('data-act') === 'ask') askAi(text);
    else addNote(text);
  });
})();
</script>
