<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clairvoyance</title>
<style>
/* ============ Design tokens ============
   Palette: parchment cream #F7F1E3, ink #2E2A24, gilt gold #B8963E,
            deep violet accent (devotion) #6B5691, rose accent (affection) #C1567B,
            soft border #E4D9BE
   Type: display "Cormorant Garamond" (Victorian book serif), body "EB Garamond",
         utility/caption "Cormorant" small caps
   Layout: single centered "book leaf" card, aurora/aura corner glow, page-turn transitions
   Signature: an animated soft-glowing aura halo behind the folio number, echoing the
   book's own theme of radiating thought-vibrations.
*/
:root{
  --parchment:#F7F1E3;
  --parchment-2:#EFE6CE;
  --ink:#2E2A24;
  --ink-soft:#5A5346;
  --gold:#B8963E;
  --gold-soft:#D8C186;
  --violet:#6B5691;
  --rose:#C1567B;
  --border:#E1D3AA;
  --card:#FFFDF6;
  --shadow: 0 20px 60px -20px rgba(60,45,10,0.35), 0 2px 10px rgba(60,45,10,0.08);
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #f3e8c9 0%, transparent 60%),
    radial-gradient(ellipse 900px 600px at 110% 110%, #ecdcc0 0%, transparent 55%),
    var(--parchment);
  color:var(--ink);
  font-family: "EB Garamond", "Cormorant Garamond", Georgia, serif;
  min-height:100vh;
  overflow-x:hidden;
}
@font-face{
  font-family:'Cinzel-fallback'; src:local('Georgia');
}
.app{
  max-width:980px;
  margin:0 auto;
  padding:28px 20px 60px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- Header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:12px;
}
.brand .glyph{
  width:40px;height:40px;border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #fff6df 0%, var(--gold-soft) 45%, var(--gold) 100%);
  box-shadow: 0 0 18px 2px rgba(184,150,62,0.45), inset 0 0 6px rgba(255,255,255,0.6);
  flex-shrink:0;
}
.brand h1{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-weight:600;
  font-size:1.35rem;
  letter-spacing:0.04em;
  margin:0;
  color:var(--ink);
}
.brand p{
  margin:0; font-size:0.8rem; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--ink-soft); font-family: Georgia, serif;
}
.progress-wrap{
  display:flex; align-items:center; gap:10px;
  font-size:0.82rem; color:var(--ink-soft); letter-spacing:0.04em;
}
.progress-bar{
  width:150px; height:5px; border-radius:3px; background:var(--parchment-2);
  overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,0.08);
}
.progress-fill{
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--gold-soft), var(--gold));
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ---------- Table of contents rail ---------- */
.toc-toggle{
  border:1px solid var(--border); background:var(--card); color:var(--ink);
  border-radius:8px; padding:7px 14px; font-family:inherit; font-size:0.85rem;
  letter-spacing:0.05em; cursor:pointer; box-shadow:var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.toc-toggle:hover{ transform: translateY(-1px); }
.toc-panel{
  position:fixed; top:0; right:-360px; width:340px; height:100%;
  background:var(--card); border-left:1px solid var(--border);
  box-shadow:-20px 0 50px rgba(60,45,10,0.18);
  z-index:50; transition:right .35s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; padding:24px 18px 40px;
}
.toc-panel.open{ right:0; }
.toc-panel h2{
  font-family:"Cormorant Garamond",serif; font-size:1.1rem; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--gold); margin:0 0 14px;
  border-bottom:1px solid var(--border); padding-bottom:10px;
}
.toc-close{
  position:absolute; top:16px; right:16px; background:none; border:none;
  font-size:1.3rem; color:var(--ink-soft); cursor:pointer; line-height:1;
}
.toc-section{
  margin-bottom:6px;
}
.toc-section-title{
  font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--violet); margin:16px 0 6px; font-weight:600;
}
.toc-item{
  display:block; width:100%; text-align:left; background:none; border:none;
  padding:6px 8px; font-family:"EB Garamond",serif; font-size:0.95rem;
  color:var(--ink); cursor:pointer; border-radius:6px;
  transition: background .15s ease;
}
.toc-item:hover{ background:var(--parchment-2); }
.toc-item.active{
  background: linear-gradient(90deg, rgba(184,150,62,0.16), transparent);
  color:var(--gold); font-weight:600;
}
.scrim{
  position:fixed; inset:0; background:rgba(40,30,10,0.25); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.scrim.show{ opacity:1; pointer-events:auto; }

/* ---------- The book leaf / page card ---------- */
.stage{
  flex:1;
  display:flex; align-items:flex-start; justify-content:center;
  position:relative;
}
.leaf{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  width:100%;
  padding:46px 54px 40px;
  position:relative;
  min-height:420px;
  animation: fadeIn .5s ease;
}
.leaf::before{
  content:"";
  position:absolute; inset:10px;
  border:1px solid rgba(184,150,62,0.28);
  border-radius:8px;
  pointer-events:none;
}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
@media (max-width:700px){
  .leaf{ padding:30px 20px 28px; }
}

.eyebrow{
  font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--violet); margin:0 0 6px; font-weight:600;
}
.leaf h2.page-title{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:2rem; font-weight:600; margin:0 0 22px; color:var(--ink);
  line-height:1.15; border-bottom:2px solid var(--gold-soft); padding-bottom:14px;
}
.leaf .content p{
  font-size:1.09rem; line-height:1.75; margin:0 0 1.1em; color:var(--ink);
  text-align:justify; hyphens:auto;
}
.leaf .content p.footnote{
  font-size:0.92rem; color:var(--ink-soft); font-style:italic;
  border-left:2px solid var(--gold-soft); padding-left:14px;
}
.leaf .content p.signature{
  text-align:right; font-style:italic; letter-spacing:0.05em; color:var(--ink-soft);
}
.leaf .content p.printer-line{
  text-align:center; font-size:0.85rem; color:var(--ink-soft); letter-spacing:0.06em;
}
.leaf .content h3.subhead{
  font-family:"Cormorant Garamond",serif; font-size:1.15rem; color:var(--violet);
  margin:22px 0 10px; letter-spacing:0.03em;
}
.leaf .content ol.principles{ padding-left:1.4em; }
.leaf .content ol.principles li{ margin-bottom:6px; font-size:1.05rem; }

/* Title page flourishes */
.book-title{
  font-family:"Cormorant Garamond",serif; text-align:center; font-size:2.6rem;
  letter-spacing:0.12em; margin:18px 0 6px; color:var(--ink);
}
.book-authors{
  text-align:center; font-size:1.05rem; letter-spacing:0.1em; font-weight:400;
  color:var(--violet); margin:0 0 26px;
}
.pub-line{ text-align:center; font-size:0.78rem; color:var(--ink-soft); letter-spacing:0.04em; }
.pub-house{ text-align:center; font-size:0.95rem; color:var(--ink-soft); margin:8px 0 26px; line-height:1.6; }
.print-table{ margin:0 auto 26px; font-size:0.9rem; color:var(--ink-soft); border-collapse:collapse; }
.print-table td{ padding:2px 10px; }
.printer-line{ text-align:center; font-size:0.85rem; color:var(--ink-soft); margin-top:20px; line-height:1.6; }

/* Colour key table */
.key-table{ overflow-x:auto; margin:18px 0; }
.key-table table{ border-collapse:collapse; width:100%; font-size:0.88rem; }
.key-table th, .key-table td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
.key-table th{ background:var(--parchment-2); color:var(--gold); width:28px; text-align:center; }
.caption-label{ text-align:center; letter-spacing:0.1em; text-transform:uppercase; font-size:0.85rem; color:var(--ink-soft); }

/* TOC / illustrations tables */
.toc-table, .toc-table.small{ width:100%; border-collapse:collapse; font-size:0.98rem; }
.toc-table td{ padding:5px 6px; border-bottom:1px dotted var(--border); }
.toc-table td:last-child{ text-align:right; color:var(--ink-soft); width:80px; }
.toc-table tr.indent td:first-child{ padding-left:22px; }
.toc-table tr.indent2 td:first-child{ padding-left:44px; font-style:italic; }
.toc-table.small td{ font-size:0.88rem; }
.illus-note{ margin-bottom:14px; }
.illus-note p{ font-size:0.85rem; color:var(--ink-soft); font-style:italic; }

/* ---------- Images / figure gallery ---------- */
.figures{
  display:flex; flex-wrap:wrap; gap:22px; margin:26px 0 10px; justify-content:center;
}
.figure-card{
  background:var(--parchment-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  max-width:360px;
  flex:1 1 260px;
  text-align:center;
  box-shadow: 0 8px 22px -12px rgba(60,45,10,0.25);
}
.figure-card img{
  max-width:100%; height:auto; border-radius:5px;
  border:1px solid rgba(0,0,0,0.08);
  background:#111;
  cursor:zoom-in;
  transition: transform .25s ease;
}
.figure-card img:hover{ transform:scale(1.015); }
.figure-cap{
  margin-top:9px; font-size:0.85rem; color:var(--ink-soft);
  font-style:italic; letter-spacing:0.02em;
}

/* Lightbox */
.lightbox{
  position:fixed; inset:0; background:rgba(20,15,5,0.82);
  display:none; align-items:center; justify-content:center; z-index:100;
  padding:30px;
}
.lightbox.open{ display:flex; }
.lightbox img{ max-width:100%; max-height:85vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.lightbox-close{
  position:absolute; top:22px; right:28px; background:none; border:none;
  color:#f6ecd2; font-size:2rem; cursor:pointer; line-height:1;
}

/* ---------- Footer nav ---------- */
nav.pager{
  position:sticky; bottom:0;
  margin-top:26px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:linear-gradient(180deg, rgba(247,241,227,0) 0%, var(--parchment) 30%);
  padding-top:18px;
}
.pager-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border); color:var(--ink);
  padding:11px 20px; border-radius:10px; font-family:inherit; font-size:0.95rem;
  cursor:pointer; box-shadow:var(--shadow); letter-spacing:0.02em;
  transition: transform .15s ease, opacity .15s ease;
}
.pager-btn:hover:not(:disabled){ transform:translateY(-2px); }
.pager-btn:disabled{ opacity:0.35; cursor:default; }
.pager-btn.next{ background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:#3a2c08; border:none; }
.folio{
  position:relative;
  font-family:"Cormorant Garamond",serif; font-size:0.95rem; color:var(--ink-soft);
  text-align:center; letter-spacing:0.05em;
}
.folio .halo{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:70px; height:70px; border-radius:50%;
  background: radial-gradient(circle, rgba(184,150,62,0.30) 0%, transparent 70%);
  animation: pulse 3.2s ease-in-out infinite;
  z-index:-1;
}
@keyframes pulse{
  0%,100%{ transform:translate(-50%,-50%) scale(0.9); opacity:0.5; }
  50%{ transform:translate(-50%,-50%) scale(1.25); opacity:0.9; }
}

@media (prefers-reduced-motion: reduce){
  .leaf{ animation:none; }
  .folio .halo{ animation:none; }
}

/* PDF-exact content classes */
.leaf .content h3.pdf-heading{
  font-family:"Cormorant Garamond",serif; font-size:1.2rem; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--violet); margin:20px 0 10px;
}
.leaf .content p.pdf-caption{
  font-size:0.92rem; letter-spacing:0.05em; text-transform:uppercase;
  color:var(--gold); text-align:center; font-weight:600; margin:16px 0 10px;
}
.leaf .content p.empty-note{
  text-align:center; color:var(--ink-soft); font-size:1rem; padding:30px 0;
}

/* section pill on top of card */
.section-pill{
  position:absolute; top:-13px; left:50px;
  background:linear-gradient(135deg, var(--violet), #8875ac);
  color:#fff; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:5px 14px; border-radius:20px; box-shadow:0 6px 14px -6px rgba(107,86,145,0.6);
}
@media (max-width:700px){
  .section-pill{ left:20px; }
}

/* ---------- Read aloud ---------- */
.listen-bar{
  display:none; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 18px; margin-bottom:16px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); font-family:Georgia, serif; font-size:0.85rem;
}
.listen-bar.open{ display:flex; }
.listen-bar button{
  font-family:inherit; font-size:0.85rem; padding:7px 14px; border-radius:999px;
  border:1px solid var(--gold); background:linear-gradient(180deg,#fffdf6,#f3ead2);
  color:var(--ink); cursor:pointer; letter-spacing:0.02em;
}
.listen-bar button:hover:not(:disabled){ background:var(--gold); color:#fff; }
.listen-bar button:disabled{ opacity:0.45; cursor:default; }
.listen-bar select{
  font-family:inherit; font-size:0.82rem; padding:6px 8px; border-radius:8px;
  border:1px solid var(--border); background:#fff; color:var(--ink);
  max-width:230px;
}
.listen-bar label{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); }
.listen-bar .status{ color:var(--ink-soft); font-style:italic; flex-basis:100%; }

.search-bar, .notes-panel { display:none; padding:10px 24px; background:#f8f3e7; border-bottom:1px solid #e3d8c3; align-items:center; gap:10px; flex-wrap:wrap; }
.search-bar.open, .notes-panel.open { display:flex; }
.search-bar input { flex:1; min-width:180px; padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; font-family:inherit; font-size:14px; color:#3a3227; }
.search-bar input:focus { outline:2px solid #b29a5b; }
.search-bar .sbtn { padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; cursor:pointer; font-family:inherit; font-size:13px; color:#3a3227; }
.search-bar .sbtn:hover { background:#f0e7d3; }
#search-info { font-size:13px; color:#7a6c50; white-space:nowrap; }
mark.search-hit { background:#ffe9a8; color:inherit; padding:0 1px; border-radius:2px; }
.notes-panel { display:none; }
.notes-panel.open { display:block; }
#notes-body { max-width:820px; margin:0 auto; font-size:14.5px; line-height:1.65; color:#3a3227; }
#notes-body h3 { font-size:15px; margin:0 0 8px; color:#5c4a1e; letter-spacing:0.02em; }
#notes-body h4 { font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:#8a744a; margin:14px 0 6px; }
#notes-body p { margin:0 0 10px; }
#notes-body ul { margin:0; padding-left:20px; }
#notes-body li { margin-bottom:5px; }
#notes-body .notes-empty { color:#8a7c62; font-style:italic; }
</style>
</head>

      <button class="toc-toggle" id="search-toggle" title="Search this book">&#128269; Search</button>
      <button class="toc-toggle" id="notes-toggle" title="Chapter summary and key points">&#128221; Notes</button>
      <button class="toc-toggle" id="toc-toggle">&#9776; Contents</button>
    </div>
  </header>

<div class="search-bar" id="search-bar">
  <input type="text" id="search-input" placeholder="Search this book..." autocomplete="off">
  <button class="sbtn" id="search-prev">&#8593; Prev</button>
  <button class="sbtn" id="search-next">Next &#8595;</button>
  <span id="search-info"></span>
  <button class="sbtn" id="search-close" title="Close">&#10005;</button>
</div>
<div class="notes-panel" id="notes-panel">
  <div id="notes-body"></div>
</div>


  <div class="listen-bar" id="listen-bar">
    <button id="listen-play">&#9654; Read aloud</button>
    <button id="listen-stop" disabled>&#9632; Stop</button>
    <select id="voice-select" title="Voice"></select>
    <select id="rate-select" title="Speed">
      <option value="0.85">0.85&times;</option>
      <option value="1" selected>1&times;</option>
      <option value="1.15">1.15&times;</option>
      <option value="1.3">1.3&times;</option>

    </div>
  </div>

  <nav class="pager">

    <div class="folio"><div class="halo"></div><span id="folio-label"></span></div>
    <button class="pager-btn next" id="next-btn">Next &rarr;</button>

</div>

<div class="scrim" id="scrim"></div>

  <h2>Contents</h2>
  <div id="toc-list"></div>
</aside>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <img id="lightbox-img" src="" alt="">

<script id="pages-data" type="application/json">[{"pdf_page_index": 0, "pdf_page_number": 1, "label": "Title", "html": "<div style=\"text-align:center;padding-top:60px\"><h1 style=\"font-size:2rem\">Clairvoyance<\/h1><p style=\"margin-top:16px;font-style:italic\">C. W. Leadbeater<\/p><p>1899<\/p><\/div>", "images": []}, {"pdf_page_index": 1, "pdf_page_number": 2, "label": "Chapter 1. What Clairvoyance Is", "html": "<h3 class=\"pdf-heading\">Chapter 1. What Clairvoyance Is<\/h3><p>Clairvoyance means literally nothing more than “clear seeing”, and it is a word which has been sorely misused, and even degraded so far as to be employed to describe the trickery of a mountebank in a variety show. Even in its more restricted sense it covers a wide range of phenomena, differing so greatly in character that it is not easy to give a definition of the word which shall be at once succinct and accurate. It has been called “spiritual vision”, but no rendering could well be more misleading than that, for in the vast majority of cases there is no faculty connected with it which has the slightest claim to be honoured by so lofty a name.<\/p><p>For the purpose of this treatise we may, perhaps, define it as the power to see what is hidden from ordinary physical sight. It will be as well to premise that it is very frequently (though by no means always) accompanied by what is called clairaudience, or the power to hear what would be inaudible to the ordinary physical ear; and we will for the nonce take our title as covering this faculty also, in order to avoid the clumsiness of perpetually using two long words where one will suffice.<\/p>", "images": []}, {"pdf_page_index": 2, "pdf_page_number": 3, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Let me make two points clear before I begin. First, I am not writing for those who do not believe that there is such a thing as clairvoyance, nor am I seeking to convince those who are in doubt about the matter. In so small a work as this I have no space for that; such people must study the many books containing lists of cases, or make experiments for themselves along mesmeric lines. I am addressing myself to the better-instructed class who know that clairvoyance exists, and are sufficiently interested in the subject to be glad of information as to its methods and possibilities; and I would assure them that what I write is the result of much careful study and experiment, and that though some of the powers which I shall have to describe may seem new and wonderful to them, I mention no single one of which I have not myself seen examples.<\/p><p>Secondly, though I shall endeavour to avoid technicalities as far as possible, yet as I am writing in the main for students of Theosophy, I shall feel myself at liberty sometimes to use, for brevity’s sake and without detailed explanation, the ordinary Theosophical terms with which I may safely assume them to be familiar.<\/p>", "images": []}, {"pdf_page_index": 3, "pdf_page_number": 4, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Should this document fall into the hands of any to whom the occasional use of such terms constitutes a difficulty, I can only apologize to them and refer them for these preliminary explanations to any elementary Theosophical work, such as Mrs. Besant’s Ancient Wisdom or Man and His Bodies. The truth is that the whole Theosophical system hangs together so closely, and its various parts are so interdependent, that to give a full explanation of every term used would necessitate an exhaustive treatise on Theosophy as a preface even to this short account of clairvoyance.<\/p><p>Before a detailed explanation of clairvoyance can usefully be attempted, however, it will be necessary for us to devote a little time to some preliminary considerations, in order that we may have clearly in mind a few broad facts as to the different planes on which clairvoyant vision may be exercised, and the conditions which renders its exercise possible.<\/p>", "images": []}, {"pdf_page_index": 4, "pdf_page_number": 5, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>We are constantly assured in Theosophical literature that all these higher faculties are presently to be the heritage of mankind in general—that the capacity of clairvoyance, for example, lies latent in every one, and those in whom it already manifests itself are simply in that one particular a little in advance of the rest of us. Now this statement is a true one, and yet it seems quite vague and unreal to the majority of people, simply because they regard such a faculty as something absolutely different from anything they have yet experienced, and feel fairly confident that they themselves, at any rate, are not within measurable distance of its development.<\/p><p>It may help to dispel this sense of unreality if we try to understand that clairvoyance, like so many other things in nature is mainly a question of vibrations, and is in fact nothing but an extension of powers which we are all using every day of our lives. We are living all the while surrounded by a vast sea of mingled air and ether, the latter interpenetrating the former, as it does all physical matter; and it is chiefly by means of vibrations in that vast sea of matter that impressions reach us from the outside. This much we all know, but it may perhaps never have occurred to many of us that the number of these vibrations to which we are capable of responding is in reality quite infinitesimal.<\/p>", "images": []}, {"pdf_page_index": 5, "pdf_page_number": 6, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Up among the exceedingly rapid vibrations which affect the ether there is a certain small section—a very small section—to which the retina of the human eye is capable of responding, and these particular vibrations produce in us the sensation which we call light. That is to say, we are capable of seeing only those objects from which light of that particular kind can either issue or be reflected.<\/p><p>In exactly the same way the tympanum of the human ear is capable of responding to a certain very small range of comparatively slow vibrations—slow enough to affect the air which surrounds us and so the only sounds which we can hear are those made by objects which are able to vibrate at some rate within that particular range.<\/p><p>In both cases it is a matter perfectly well known to science that there are large numbers of vibrations both above and below these two sections, and that consequently there is much light that we cannot see, and there are many sounds to which our ears are deaf. In these case of light the action of these higher and lower vibrations is easily perceptible in the effects produced by the actinic rays at one end of the spectrum and the heat rays at the other.<\/p>", "images": []}, {"pdf_page_index": 6, "pdf_page_number": 7, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>As a matter of fact there exist vibrations of every conceivable degree of rapidity, filling the whole vast space intervening between the slow sound waves and the swift light waves; nor is even that all, for there are undoubtedly vibrations slower than those of sound, and a whole infinity of them which are swifter than those know to us as light. So we begin to understand that the vibrations by which we see and hear are only like two tiny groups of a few strings selected from an enormous harp of practically infinite extent, and when we think how much we have been able to learn and infer from the use of those minute fragments, we see vaguely what possibilities might lie before us if we were enabled to utilize the vast and wonderful whole.<\/p><p>Another fact which needs to be considered in this connection is that different human beings vary considerably, though within relatively narrow limits, in their capacity of response even to the very few vibrations which are within reach of our physical senses. I am not referring to the keenness of sight or of hearing that enables one man to see a fainter object or hear a slighter sound than another; it is not in the lest a question of strength of vision, but of extent of susceptibility.<\/p>", "images": []}, {"pdf_page_index": 7, "pdf_page_number": 8, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>For example, if anyone will take a good bisulphide-of-carbon prism, and by its means throw a clear spectrum on a sheet of white paper, and then get a number of people to mark upon the paper the extreme limits of the spectrum as it appears to them, he is fairly certain to find that their powers of vision differ appreciably. Some will see the violet extending much farther than the majority do; others will perhaps see rather less violet than most, while gaining a corresponding extension of vision at the red end. Some few there will perhaps be who can see farther than ordinary at both ends, and these will almost certainly be what we call sensitive people—susceptible in fact to a great range of vibrations than are most men of the present day.<\/p><p>In hearing, the same difference can be tested by taking some sound which is just not too high to be audible—on the very verge of audibility as it were—and discovering how many among a given number of people re able to hear it. The squeaks of a bat is a familiar instance of such a sound, and experiment will show that on a summer evening, when the whole air is full of the shrill, needle-like cries of these little animals, quite a large number of men will be absolutely unconscious of them, and unable to hear anything at all.<\/p>", "images": []}, {"pdf_page_index": 8, "pdf_page_number": 9, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Now these examples clearly show that there is no hard-and-fast limit to man’s power of response to either etheric or aerial vibrations, but that some among us already have that power to a wider extent than others; and it will even be found that the same man’s capacity varies on different occasions. It is therefore not difficult for us to imagine that it might be possible for a man to develop this power, and thus in time to learn to see much that is invisible to his fellow-men, and hear much that is inaudible to them, since we know perfectly well that enormous numbers of these additional vibrations do exist, and are simply, as it were, awaiting recognition.<\/p><p>The experiments with the Röntgen rays give us an example of the startling results which are produced when even a very few of these additional vibrations are brought within human ken, and the transparency to these rays of many substances hitherto considered opaque at once shows us one way at least in which we may explain such elementary clairvoyance as is involved in reading a letter inside a closed box, or describing those present in an adjoining apartment. To learn to see by means of the Röntgen rays in addition to those ordinarily employed would be quite sufficient to enable anyone to perform a feat of magic of this order.<\/p>", "images": []}, {"pdf_page_index": 9, "pdf_page_number": 10, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>So far we have thought only of an extension of the purely physical senses of man; and when we remember that a man’s etheric body is in reality merely the finer part of his physical frame, and that therefore all his sense-organs contain a large amount of etheric matter of various degrees of density, the capacities of which are still practically latent in most of us, we shall see that even if we confine ourselves to this line of development alone there are enormous possibilities of all kinds already opening out before us.<\/p>", "images": []}, {"pdf_page_index": 10, "pdf_page_number": 11, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>But besides and beyond all this we know that man possesses an astral and a mental body, each of which can in process of time be aroused into activity, and will respond in turn to the vibrations of the matter of its own plane, thus opening up before the Ego, as he learns to function through these vehicles, two entirely new and far wider worlds of knowledge and power. Now these new worlds, though they are all around us and freely interpenetrate one another, are not to be thought of as distinct and entirely unconnected in substance, but rather as melting the one into the other, the lowest astral forming a direct series with the highest physical, just as the lowest mental in its turn forms a direct series with the highest astral. We are not called upon in thinking of them to imagine some new and strange kind of matter, but simply to think of the ordinary physical kind as subdivided so very much more finely and vibrating so very much more rapidly as to introduce us to what are practically entirely new conditions and qualities.<\/p>", "images": []}, {"pdf_page_index": 11, "pdf_page_number": 12, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>It is not then difficult for us to grasp the possibility of a steady and progressive extension of our senses, so that both by sight and by hearing we may be able to appreciate vibrations far higher and far lower than those which are ordinarily recognized. A large section of these additional vibrations will still belong to the physical plane, and will merely enable us to obtain impressions from the etheric part of that plane, which is at present as a closed book to us. Such impressions will still be received through the retina of the eye; of course they will affect its etheric rather than its solid matter, but we may nevertheless regard them as still appealing only to an organ specialized to receive them, and not to the whole surface of the etheric body.<\/p><p>There are some abnormal cases, however, in which other parts of the etheric body respond to these additional vibrations as readily as, or even more readily than, the eye. Such vagaries are explicable in various ways, but principally as effects of some partial astral development, for it will be found that the sensitive pats of the body almost invariably correspond with one or other of the chakrams, or centres of vitality in the astral body. And though, if astral consciousness be not yet developed, these centres may not be available on their own plane, they are still strong enough to stimulate into keener activity the etheric matter which they interpenetrate.<\/p>", "images": []}, {"pdf_page_index": 12, "pdf_page_number": 13, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>When we come to deal with the astral senses themselves the methods of working are very different. The astral body has not specialized sense-organs—a fact which perhaps needs some explanation, since many students who are trying to comprehend its physiology seem to find it difficult to reconcile with the statements that have been made as to the perfect interpenetration of the physical body by astral matter, the exact correspondence between the two vehicles and the fact that every physical object has necessarily its astral counterpart.<\/p><p>Now all these statements are true, and yet it is quite possible for people who do not normally see astrally to misunderstand them. Every order of physical matter has its corresponding order of astral matter in constant association with it—not to be separated from it except by a very considerable exertion of occult force, and even then only to be held apart from it as long as force is being definitely exerted to that end. But for all that the relation of the astral particles one to another is far looser than is the case with their physical correspondences.<\/p>", "images": []}, {"pdf_page_index": 13, "pdf_page_number": 14, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>In a bar of iron, for example, we have a mass of physical molecules in the solid condition—that is to say, capable of comparatively little change in their relative positions, though each vibrating with immense rapidity in its own sphere. The astral counterpart of this consists of what we often call solid astral matter—that is, matter of the lowest and densest sub-plane of the astral; but nevertheless its particles are constantly and rapidly changing their relative positions, moving among one another as easily as those of a liquid on the physical plane might do. So that there is no permanent association between any one physical particle and that amount of astral matter which happens at any given moment to be acting as its counter part.<\/p><p>This is equally true with respect to the astral body of man, which for our purpose at the moment we may regard as consisting of two parts—the denser aggregation which occupies the exact position of the physical body, and the cloud of rarer astral matter which surrounds that aggregation. In both these parts, and between them both, there is going on at every moment of time the rapid inter-circulation of the particles which has been described, so that as one watches the movement of the molecules in the astral body one is reminded of the appearance of those in fiercely boiling water.<\/p>", "images": []}, {"pdf_page_index": 14, "pdf_page_number": 15, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>This being so, it will be readily understood that though any given organ of the physical body must always have as its counterpart a certain amount of astral matter, it does not retain the same particles for more than a few seconds at a time, and consequently there is nothing corresponding to the specialization of physical nerve-matter into optic or auditory nerves, and so on. So that though the physical eye or ear has undoubtedly always its counterpart of astral matter, that particular fragment of astral matter is no more (and no less) capable of responding to the vibrations which produce astral sight or astral hearing than any other part of the vehicle.<\/p><p>It must never be forgotten that though we constantly have to speak of “astral sight” or “astral hearing” in order to make ourselves intelligible, all that we mean by those expressions is the faculty of responding to such vibrations as convey to the man’s consciousness, when he is functioning in his astral body, information of the same character as that conveyed to him by his eyes and ears while he is in the physical body. But in the entirely different astral conditions, specialized organs are not necessary for the attainment of this result; there is matter in every part of the astral body which is capable of such response, and consequently the man functioning in that vehicle sees equally well objects behind him, beneath him, above him, without needing to turn his head.<\/p>", "images": []}, {"pdf_page_index": 15, "pdf_page_number": 16, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>There is, however, another point which it would hardly be fair to leave entirely out of account, and that is the question of the chakrams referred to above. Theosophical students are familiar with the idea of the existence in both the astral and the etheric bodies of man of certain centres of force which have to vivified in turn by the sacred serpent-fire as the man advances in evolution. Though these cannot be described as organs in the ordinary sense of the word, since it is not through them that the man sees and hears, as he does in physical life through eyes and ears, yet it is apparently very largely upon their vivification that the power of exercising these astral senses depends each of them as it is developed giving to the whole astral body the power of response to a new set of vibrations.<\/p>", "images": []}, {"pdf_page_index": 16, "pdf_page_number": 17, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Neither have these centres, however, any permanent collection of astral matter connected with them. They are simply vortices in the matter of the body—vortices through which all these particles pass in turn—points, perhaps, at which the higher force from planes above impinges upon the astral body. Even this description gives but a very partial idea of their appearance, for they are in reality four dimensional vortices, so that the force which comes through them and is the cause of their existence seems to well up from nowhere. But at any rat, since all particles in turn pass through each of them, it will be clear that it is thus possible for each in turn to evoke in all the particles of the body the power of receptivity to a certain set of vibrations, so that all the astral senses are equally active in all parts of the body.<\/p>", "images": []}, {"pdf_page_index": 17, "pdf_page_number": 18, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>The vision of the mental plane is again totally different, for in this case we can no longer speak of separate senses such as sight and hearing, but rather have to postulate one general sense which responds so fully to the vibrations reaching it that, when any object comes within its cognition, it at once comprehends it fully, and as it were sees it, hears it, feels it, and knows all there is to know about it by the one instantaneous operation. Yet even this wonderful faculty differs in degree only and not in kind from those which are at our command at the present time; one the mental plane, just as on the physical impressions are still conveyed by means of vibrations travelling from the object seen to the seer.<\/p><p>On the buddhic plane we meet for the first time with a quite new faculty having nothing in common with those of which we have spoken, for there a man cognizes any object by an entirely different method, in which external vibrations play no part. The object becomes part of himself, and he studies it from the inside instead of from the outside. But with this power ordinary clairvoyance has nothing to do.<\/p><p>The development, either entire or partial, of any one of these faculties would come under our definition of clairvoyance—the power to see what is hidden from ordinary physical sight. But these faculties may be developed in various ways, and it will be well to say a few words as to these different lines.<\/p>", "images": []}, {"pdf_page_index": 18, "pdf_page_number": 19, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>We may presume that if it were possible for a man to be isolated during his evolution from all but the gentlest outside influences, and to unfold from the beginning in perfectly regular and normal fashion, he would probably develop his senses in regular order also. He would find his physical senses gradually extending their scope until they responded to all the physical vibrations, of etheric as well as of denser matter; then in orderly sequence would come sensibility to the coarser part of the astral plane, and presently the finer part also would be included, until in due course the faculty of the mental plane dawned in its turn.<\/p><p>In real life, however, development so regular as this is hardly ever known, and many a man has occasional flashes of astral consciousness without any awakening of etheric vision at all. And this irregularity of development is one of the principal causes of man’s extraordinary liability to error in matters of clairvoyance—a liability from which there is no escape except by a long course of careful training under a qualified teacher.<\/p>", "images": []}, {"pdf_page_index": 19, "pdf_page_number": 20, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Students of Theosophical literature are well aware that there are such teachers to be found—that even in this materialistic nineteenth century the old saying is still true, that “when the pupil is ready, the Master is ready also” and that “in the hall of learning, when he is capable of entering there, the disciple will always find his Master.” They are well aware also that only under such guidance can a man develop his latent powers in safety and with certainty, since they know how fatally easy it is for the untrained clairvoyant to deceive himself as to the meaning and value of what he sees, or even absolutely to distort his vision completely in bringing it down into his physical consciousness.<\/p><p>It does not follow that even the pupil who is receiving regular instruction in the use of occult powers will find them unfolding themselves exactly in the regular order which was suggested above as probably idea. His previous progress may not have been such as to make this for him the easiest or most desirable road; but at any rate he is in the hands of one who is perfectly competent to be his guide in spiritual development, and he rests in perfect contentment that the way along which he is taken will be that which is the best way for him.<\/p>", "images": []}, {"pdf_page_index": 20, "pdf_page_number": 21, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Another great advantage which he gains is that whatever faculties he may acquire are definitely under his command and can be used fully and constantly when he needs them for his Theosophical work; whereas in the case of the untrained man such powers often manifest themselves only very partially and spasmodically, and appear to come and go, as it were, at their own sweet will.<\/p><p>It may reasonably be objected that if clairvoyant faculty is, as stated, a part of the occult development of man, and so a sign of a certain amount of progress along that line, it seems strange that it should often be possessed by primitive peoples, or by the ignorant and uncultured among our own race—persons who are obviously quite undeveloped, from whatever point of view one regards them. No doubt this does appear remarkable at first sight; but the fact is that the sensitiveness o the savage or of the coarse and vulgar European ignoramus is not really at all the same thing as the faculty of his properly trained brother, nor is it arrived at in the same way.<\/p>", "images": []}, {"pdf_page_index": 21, "pdf_page_number": 22, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>An exact and detailed explanation of the difference would lead us into rather recondite technicalities, but perhaps the general idea of the distinction between the two may be caught from an example taken from the very lowest plane of clairvoyance, in close contact with the denser physical. The etheric double in man is in exceedingly close relation to his nervous system, and any kind of action upon one of them speedily reacts on the other. Now in the sporadic appearance of etheric sight in the savage, whether of Central Africa or of Western Europe, it has been observed that the corresponding nervous disturbance is almost entirely in the sympathetic system, and that the whole affair is practically beyond the man’s control—is in fact a sort of massive sensation vaguely belonging to the whole etheric body, rather than an exact and definite sense-perception communicated through a specialized organ.<\/p><p>As in later races and amid higher development the strength of the man is more and more thrown into the evolution of the mental faculties, this vague sensitiveness usually disappears; but still later, when the spiritual man begins to unfold, he regains his clairvoyant power. This time, however, the faculty is a precise and exact one, under the control of the man’s will, and exercised through a definite sense-organ; and it is noteworthy that any nervous action set up in sympathy with it is now almost exclusively in the cerebro-spinal system.<\/p>", "images": []}, {"pdf_page_index": 22, "pdf_page_number": 23, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>On this subject Mrs. Besant writes: “The lower forms of psychism are more frequent in animals and in very unintelligent human beings than in men and women in whom the intellectual powers are well developed. They appear to be connected with the sympathetic system, not with the cerebro-spinal. The large nucleated ganglionic cells in this system contain a very large proportion of etheric matter, and are hence more easily affected by the coarser astral vibrations than are the cells in which the proportion is less. As the cerebro-spinal system develops, and the brain becomes more highly evolved, the sympathetic system subsides into a subordinate position, and the sensitiveness to psychic vibrations is dominated by the stronger and more active vibrations of the higher nervous system It is true that at a later stage of evolution psychic sensitiveness reappears but it is then developed in connection with the cerebro-spinal centres, and is brought under the control of the will. But the hysterical and ill-regulated psychism of which we see so many lamentable examples is due to the small development of the brain and the dominance of the sympathetic system.”<\/p>", "images": []}, {"pdf_page_index": 23, "pdf_page_number": 24, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Occasional flashes of clairvoyance do, however, sometimes come to the highly cultured and spiritual-minded man, even though he may never have heard of the possibility of training such a faculty. In his case such glimpses usually signify that he is approaching that stage in his evolution when these powers will naturally begin to manifest themselves, and their appearance should serve as an additional stimulus to him strive to maintain that high standard of moral purity and mental balance without which clairvoyance is a curse and not a blessing to its possessor.<\/p>", "images": []}, {"pdf_page_index": 24, "pdf_page_number": 25, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Between those who are entirely unimpressible and those who are in full possession of clairvoyant power there are many intermediate stages. One to which it will be worth while to give a passing glance is the stage in which a man, though he has no clairvoyant faculty in ordinary life, yet exhibits it more or less fully under the influence of mesmerism. This is a case in which the psychic nature is already sensitive, but the consciousness is not yet capable of functioning in it amidst the manifold distractions of physical life. It needs to be set free by the temporary suspension of the outer senses in the mesmeric trance before it can use the diviner faculties which are but just beginning to dawn within it. But of course even in the mesmeric trance there are innumerable degrees of lucidity, from the ordinary patient who is blankly unintelligent to the man whose power of sight is fully under the control of the operator, and can be directed whithersoever he wills, or to the more advanced stage in which, when the consciousness is once set free, it escapes altogether from the grasp of the magnetizer, and soars into fields of exalted vision where it is entirely beyond his reach.<\/p>", "images": []}, {"pdf_page_index": 25, "pdf_page_number": 26, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Another step along the same path is that upon which such perfect suppression of the physical as that which occurs in the hypnotic trance is not necessary, but the power of supernormal sight, though still out of reach during waking life, becomes available when the body is held in the bonds of ordinary sleep. At this stage of development stood many of the prophets and seers of whom we read, who were “warned of God in a dram”, or communed with beings far higher than themselves in the silent watches of the night.<\/p><p>Most cultured people of the higher races of the world have this development to some extent: that is to say, the senses of their astral bodies are in full working order, and perfectly capable of receiving impressions from objects and entities of their own plane. But to make that fact of any use to them down here in the physical body, two changes are usually necessary: first, that the Ego shall be awakened to the realities of the astral plane, and induced to emerge from the chrysalis formed by his own waking thoughts, and look round him to observe and to learn; and secondly, that the consciousness shall be so far retained during the return of the Ego into his physical body as to enable him to impress upon his physical brain the recollection of what he has seen or learnt.<\/p>", "images": []}, {"pdf_page_index": 26, "pdf_page_number": 27, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>If the first of these changes has taken place, the second is of little importance, since the Ego, the true man, will be able to profit by the information to be obtained upon that plane, even though he may not have the satisfaction of bringing through any remembrance of it into his waking life down here.<\/p><p>Students often ask how this clairvoyant faculty will first be manifested in themselves—how they may know when they have reached the stage at which its first faint foreshadowings are beginning to be visible. Cases differ so widely that it is impossible to give to this question any answer that will be universally applicable.<\/p><p>Some people begin by a plunge, as it were, and under some unusual stimulus become able just for once to see some striving vision; and very often in such a case, because the experience does not repeat itself, the seer comes in time to believe that on that occasion he must have been the victim of hallucination. Others begin by becoming intermittently conscious of the brilliant colours and vibrations of the human aura; yet others find themselves with increasing frequency seeing and hearing something to which those around them are blind and deaf; others, again, see faces, landscapes, or coloured clouds floating before their eyes in the dark before they sink to rest; while perhaps the commonest experience of all is that of those who begin to recollect with greater and greater clearness what they have seen and heard on the other planes during sleep.<\/p>", "images": []}, {"pdf_page_index": 27, "pdf_page_number": 28, "label": "Chapter 1. What Clairvoyance Is", "html": "<p>Having now to some extent cleared our ground, we may proceed to consider the various phenomena of clairvoyance.<\/p><p>They differ so widely both in character and in degree that it is not very easy to decide how they can most satisfactorily be classified. We might, for example, arrange them according to the kind of sight employed—whether it were mental, astral, or merely etheric. We might divine them according to the capacity of the clairvoyant, taking into consideration whether he was trained or untrained; whether his vision was regular and under his command, or spasmodic and independent of his volition; whether he could exercise it only when under mesmeric influence, or whether that assistance was unnecessary for him; whether he was able to use his faculty when awake in the physical body, or whether it was available only when he was temporarily away from that body in sleep or trance.<\/p><p>All these distinctions are of importance, and we shall have to take them all into consideration as we go on, but perhaps on the whole the most useful classification will be one something on the lines of that adopted by Mr. Sinnett in his Rational of Mesmerism—a book, by the way, which all students of clairvoyance ought to read. In dealing with the phenomena, then, we will arrange them rather according to the capacity of the sight employed than to the plane upon which it is exercised, so that we may group instances of clairvoyance under some such headings as these:<\/p>", "images": []}, {"pdf_page_index": 28, "pdf_page_number": 29, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>1. Simple clairvoyance—that is to say, a mere opening of sight, enabling its possessor to see whatever astral or etheric entities happen to be present around him, but not including the power of observing either distance places or scenes belonging to any other time than the present.<\/p><p>2. Clairvoyance in space—the capacity to see scenes or events removed from the seer in space, and either too far distant for ordinary observation or concealed by intermediate objects.<\/p><p>3. Clairvoyance in time—that is to say, the capacity to see objects or events which are removed from the seer in time, or, in other words, the power of looking into the past or the future.<\/p><h3 class=\"pdf-heading\">Chapter 2. Simple Clairvoyance: Full<\/h3><p>We have defined this as a mere opening of etheric or astral sight, which enables the possessor to see whatever may be present around him on corresponding levels, but is not usually accompanied by the power of seeing anything at a great distance or of reading either the past or the future. It is hardly possible altogether to exclude these latter faculties, for astral sight necessarily has considerably greater extension than physical, and fragmentary pictures of both past and future are often casually visible even to clairvoyants who do not know how to seek specially for them; but there is nevertheless a very real distinction between such incidental glimpses and the definite power of projection of the sight either in space or time.<\/p>", "images": []}, {"pdf_page_index": 29, "pdf_page_number": 30, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>We find among sensitive people all degrees of this kind of clairvoyance, from that of the man who gets a vague impression which hardly deserves the name of sight at all, up to the full possession of etheric and astral vision respectively. Perhaps the simplest method will be for us to begin by describing what would be visible in the case of this fuller development of the power, as the cases of its partial possession will then be seen to fall naturally into their places.<\/p><p>Let us take the etheric vision first. This consists simply, as has already been said, in susceptibility to a far larger series of physical vibrations than ordinary, but nevertheless its possession brings into view a good deal to which the majority of the human race still remains blind. Let us consider what changes its acquisition produces in the aspect of familiar objects, animate and inanimate, and then see to what entirely new factors it introduces us. But it must be remembered that what I am about to describe is the result of the full and perfectly-controlled possession of the faculty only, and that most of the instances met with in real life will be likely to fall far short of it in one direction or another.<\/p>", "images": []}, {"pdf_page_index": 30, "pdf_page_number": 31, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>The most striking change produced in the appearance of inanimate objects by the acquisition of this faculty is that most of them become almost transparent, owing to the difference in wavelength of some of the vibrations to which the man has now become susceptible. He finds himself capable of performing with the utmost ease the proverbial feat of “seeing through a brick wall,” for to his newly-acquired vision the brick wall seems to have a consistency no greater than that of a light mist. He therefore sees what is going on in an adjoining room almost as though no intervening wall existed; he can describe with accuracy the contents of a locked box, or read a sealed letter; with a little practice he can find a given passage in a closed book. This last feat, though perfectly easy to astral vision, presents considerable difficulty to one using etheric sight, because of the fact that each page has to be looked at through all those which happen to be superimposed upon it.<\/p>", "images": []}, {"pdf_page_index": 31, "pdf_page_number": 32, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>It is then asked whether under these circumstances a man sees always with this abnormal sight, or only when he wishes o do so. The answer is that if the faculty is perfectly developed it will be entirely under his control, and he can use that or his more ordinary vision at will. He changes from one to the other as readily and naturally as we now change the focus of our eyes when we look up from our book to follow the motions of some object a mile away. It is, as it were, a focussing of consciousness on the one or the other aspect of what is seen: and though the man would have quite clearly in his view the aspect upon which his attention was for the moment fixed, he would always be vaguely conscious of the other aspect too, just as when we focus our sight upon any object held in our hands we yet vaguely see the opposite wall of the room as a background.<\/p><p>Another curious change, which comes from the possession of this sight, is that the solid ground upon which the man walks becomes to a certain extent transparent to him, so that he is able to see down into it to a considerable depth, much as we can now see into fairly clear water. This enables him to watch a creature burrowing underground, to distinguish a vein of coal or of metal if not too far below the surface, and so on.<\/p>", "images": []}, {"pdf_page_index": 32, "pdf_page_number": 33, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>The limit of etheric sight when looking through solid matter appears to be analogous to that imposed upon us when looking through water or mist. We cannot see beyond a certain distance, because the medium through which we are looking is not perfectly transparent.<\/p><p>The appearance of animate objects is also considerably altered for the man who has increased his visual powers to this extent. The bodies of men and animals are for him in the main transparent, so that he can watch the action of the various internal organs, and to some extent diagnose some of their diseases.<\/p><p>The extend sight also enables him to perceive, more or less clearly, various classes of creatures, elemental and otherwise, whose bodies are not capable of reflecting any of the rays within the limit of the spectrum as ordinarily seen. Among the entities so seen will be some of the lower orders of nature-spirits—those whose bodies are composed of the denser etheric matter. To this class belong nearly all the fairies, gnomes, and brownies, about whom there are still so many stories remaining among Scotch and Irish mountains and in remote country places all over the world.<\/p>", "images": []}, {"pdf_page_index": 33, "pdf_page_number": 34, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>The vast kingdom of nature-spirits is in the main an astral kingdom, but still there is a large section of it which appertains to the etheric part of the physical plane, and this section, of course, is much more likely to come within the ken of ordinary people than the others. Indeed, in reading the common fairy stories one frequently comes across distinct indications that it is with this class that we are dealing. Any student of fairy love will remember how often mention is made of some mysterious ointment or drug, which when applied to a man’s eyes enables him to see the members of the fairy commonwealth whenever he happens to meet them.<\/p><p>The story of such an application and its results occurs so constantly and comes from so many different parts of the world that there must certainly be some truth behind it, as there always is behind really universal popular tradition. Now no such anointing of the eyes alone could by any possibility open a man’s astral vision, though certain ointment rubbed over the whole body will very greatly assist the astral body to leave the physical in full consciousness—a fact the knowledge of which seems to have survived even to mediaeval times, as will be seen from the evidence given at some of the trials for witchcraft. But the application to the physical eye might very easily so stimulate its sensitiveness as to make it susceptible to some of the etheric vibrations.<\/p>", "images": []}, {"pdf_page_index": 34, "pdf_page_number": 35, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>The story frequently goes on to relate how when the human being who has used this mystical ointment betrays his extended vision in some way to a fairy, the latter strikes or stabs him in the eye, thus depriving him not only of the etheric sight, but of that of the denser physical plane as well. (See The Science of Fairy Tales by E. S. Hartlane, in the “Contemporary Science” series—or indeed almost any extensive collection of fairy stories.) If the sight acquired had been astral, such a proceeding would have been entirely unavailaing, for no injury to the physical apparatus would affect an astral faculty; but if the vision produced by the ointment were etheric, the destruction of the physical eye would in most cases at once distinguish it, since that is the mechanism by means of which it works.<\/p>", "images": []}, {"pdf_page_index": 35, "pdf_page_number": 36, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>Anyone possessing this sight of which we are speaking would also be able to perceive the etheric double of man; but since this is so nearly identical in size with the physical, it would hardly be likely to attract his attention unless it were partially protected in trance or under the influence of anaesthetics. After death, when it withdraws entirely from the dense body, it would be clearly visible to him, and he would frequently see it hovering over newly-made graves as he passed through a church yard or cemetery. If he were to attend a spiritualistic seance he would see the etheric matter oozing out from the side of the medium, and could observe the various ways in which the communicating entities make use of it.<\/p>", "images": []}, {"pdf_page_index": 36, "pdf_page_number": 37, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>Another fact which could hardly fail soon to thrust itself upon his notice would be the extension of his perception of colour. He would find himself able to see several entirely new colours, not in the least resembling any of those included in the spectrum as we at present know it, and therefore of course quite indescribable in any terms at our command. And not only would he see new objects that were wholly of these new colours, but he would also discover that modifications had been introduced into the colour of many objects with which he was quite familiar, according to whether they had or had not some tinge of these new hues intermingled with the old. So that two surfaces of colour which to ordinary eyes appeared to match perfectly would often present distinctly different shades to his keener sight.<\/p><p>We have now touched upon some of the principal changes which would be introduced into a man’s world when he gained etheric sight; and it must always be remembered that in most cases a corresponding change would at the same time be brought about in his other senses also, so that he would be capable of hearing, and perhaps even of feeling, more than most of those around him. Now supposing that in addition to this he obtained the sight of the astral plane, what further changes would be observable?<\/p>", "images": []}, {"pdf_page_index": 37, "pdf_page_number": 38, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>Well, the changes would be many and great; in fact, a whole new world would open before his eyes. Let us consider its wonders briefly in the same order as before, and see first what difference there would be in the appearance of inanimate objects. On this point I may begin by quoting a recent quaint answer given in The Vahan.<\/p><p>“There is a distinct difference between etheric sight and astral sight, and it is the latter which seems to correspond to the fourth dimension.<\/p><p>“The easiest way to understand the difference is to take an example. If you looked at a man with both the sights in turn, you would see the buttons at the back of his coat in both cases; only if you used etheric sight you would see them through him, and would see the shank-side as nearest to you, but if you looked astrally, you would see it not only like that, but just as if you were standing behind the man as well.<\/p>", "images": []}, {"pdf_page_index": 38, "pdf_page_number": 39, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>“Or if you were looking etherically at a wooden cube with writing on all its sides, it would be as though the cube were glass, so that you could see through it, and you would see the writing on the opposite side all backwards, while that on the right and left sides would not be clear to you at all unless you moved, because you see it edgewise. But if you looked at it astrally you would see all the sides at once, and all the right way up, as though the whole cube had been flattened out before you, and you would see every particle of the inside as well—not through the others, but all flattened out. You would be looking at it from another direction, at right angles to all the directions that we know.<\/p><p>“If you look at the back of a watch etherically you see all the wheels through it, and the face through them, but backwards; if you look at it astrally, you see the face right way up and all the wheels lying separately, but nothing on the top of anything else.”<\/p>", "images": []}, {"pdf_page_index": 39, "pdf_page_number": 40, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>Here we have at once the keynote, the principal factor of the change; the man is looking at everything from an absolutely new point of view, entirely outside of anything that he has ever imagined before. He has no longer the slightest difficulty in reading any page in a closed book, because he is not now looking at it through all the other pages before it or behind it, but is looking straight down upon it as though it were the only page to be seen. The depth at which a vein of metal or of coal may lie is no longer a barrier to his sight of it, because he is not now looking through the intervening depth of earth at all. The thickness of a wall, or the number of walls intervening between the observer and the object, would make a great deal of difference to the clearness of the etheric sight; they would make no difference whatever to the astral sight, because on the astral plane they would not intervene between the observer and the object. Of course that sounds paradoxical and impossible, and it is quite inexplicable to a mind not specially trained to grasp the idea; yet it is none the less absolutely true.<\/p>", "images": []}, {"pdf_page_index": 40, "pdf_page_number": 41, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>This carries us straight into the middle of the much-vexed question of the fourth dimension—a question of the deepest interest, though one that we cannot pretend to discuss in the space at our disposal. Those who wish to study it as it deserves are recommended to begin with Mr. C. H. Hinton’s Scientific Romances or Dr. A. T. Schofield’s Another World, and then follow on with the former author’s larger work, A New Era of Thought. Mr. Hinton not only claims to be able himself to grasp mentally some of the simpler fourth dimensional figures, but also states that anyone who will take the trouble to follow out his directions may with perseverance acquire that mental grasp likewise. I am not certain that the power to do this is within the reach of everyone, as he thinks, for it appears to me to require considerable mathematical ability; but I can at any rate bear witness that the tesseract or fourth-dimensional cube which he describes is a reality, for it is quite a familiar figure upon the astral plane. He has now perfected a new method of representing the several dimensions by colours instead of by arbitrary written symbols. He states that his will very much simplify the study, as the reader will be able to distinguish instantly by sight any part or feature of the tesseract. A full description of this new method, with plates, is said to be ready for the press, and is expected to appear within a year, so that intending students of this fascinating subject might do well to await its publication.<\/p>", "images": []}, {"pdf_page_index": 41, "pdf_page_number": 42, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>I know that Madame Blavatsky, in alluding to the theory of the fourth dimension, has expressed an opinion that it is only a clumsy way of stating the idea of the entire permeability of matter, and that Mr. W. T. Stead has followed along the same lines, presenting the conception to his readers under the name of throughth. Careful, oft-repeated and detailed investigation does, however, seem to show quite conclusively that this explanation does not cover all the facts. It is a perfect description of etheric vision, but the further and quite different idea of the fourth dimension as expounded by Mr. Hinton is the only one which gives any kind of explanation down here of the constantly-observed facts of astral vision. I would therefore venture deferentially to suggest that, when Madame Blavatsky wrote as she did, she had in mind etheric vision and not astral, and that the extreme applicability of the phrase to this other and higher faculty, of which she was not at the moment thinking, did not occur to her.<\/p><p>The possession of this extraordinary and scarcely expressible power, then, must always be borne in mind through all that follows. It lays every point in the interior of every solid body absolutely open to the gaze of the seer, just as every point in the interior of a circle lies open to the gaze of a man looking down upon it.<\/p>", "images": []}, {"pdf_page_index": 42, "pdf_page_number": 43, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>But even this is by no means all that it gives to its possessor. He see not only the inside as well as the outside of every object, but also its astral counterpart. Every atom and molecule of physical matter has its corresponding astral atoms and molecules, and the mass which is built up out of these is clearly visible to our clairvoyant. Usually the astral part of any object projects somewhat beyond the physical part of it, and thus metals, stones and other things are seen surrounded by an astral aura.<\/p><p>It will be seen at once that even in the study of inorganic matter a man gains immensely by the acquisition of this vision. Not only does he see the astral part of the object at which he looks, which before was wholly hidden from him; not only does he see much more of its physical constitution than he did before, but even what was visible to him before is now seen much more clearly and truly. A moment’s consideration will show that his new vision approximates much more closely to true perception than does physical sight. For example, if he looks astrally at a glass cube, its sides will all appear equal, as we know they really are, whereas on the physical plane he sees the further side in perspective—that is, it appears smaller than the nearer side, which is, of course, a mere illusion due to his physical limitations.<\/p>", "images": []}, {"pdf_page_index": 43, "pdf_page_number": 44, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>When we come to consider the additional facilities which it offers in the observation of animate objects we see still more clearly the advantages of the astral vision. It exhibits to the clairvoyant the aura of plants and animals, and thus in the case of the latter their desires and emotions, and whatever thoughts they may have, are all plainly shown before his eyes.<\/p><p>But is in dealing with human beings that he will most appreciate the value of this faculty, for he will often be able to help them far more effectually when he guides himself by the information which it gives him.<\/p><p>He will be able to see the aura as far up as the astral body, and though that leaves all the higher part of a man still hidden from his gaze, he will nevertheless find it possible by careful observation to learn a good deal about the higher part form what is within his reach. His capacity of examining the etheric double will give him considerable advantage in locating and classifying any defects or diseases of the nervous system, while from the appearance of the astral body he will be at once aware of all the emotions, passions, desires and tendencies of the man before him, and even of very many of his thoughts also.<\/p>", "images": []}, {"pdf_page_index": 44, "pdf_page_number": 45, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>As he looks at a person he will see him surrounded by the luminous mists of the astral aura, flashing with all sorts of brilliant colours, and constantly changing in hue and brilliancy with every variation of the person’s thoughts and feelings. He will see this aura flooded with the beautiful rose-colour of pure affection, the rich blue of devotional feeling, the hard, dull brown of selfishness, the deep scarlet of angers, the horrible lurid red of sensuality, the livid grey of fear, the black clouds of hatred and malice, or any of the other hundredfold indications so easily to be red in it by a practised eye; and thus it will be impossible for any persons to conceal from him the real state of their feelings on any subject.<\/p><p>These varied indications of the aura are of themselves a study of very deep interest, but I have no space to deal with them in detail here. A much fuller account of them, together with a number of coloured illustrations, will be found in my work on the subject Man Visible and Invisible.<\/p>", "images": []}, {"pdf_page_index": 45, "pdf_page_number": 46, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>Not only does the astral aura show him the temporary result of the emotion passing through it at the moment, but it also gives him, by the arrangement and proportion of its colours when in a condition of comparative rest, a clue to the general disposition and character of its owner. For the astral body is the expression of as much of the man as can be manifested on that plane, so that from what is seen in it much more which belongs to higher planes may be inferred with considerable certainty.<\/p><p>In this judgement of character our clairvoyant will be much helped by so much of the person’s thought as expresses itself on the astral plane, and consequently comes within his purview. The true home of thought is on the mental plane, and all thought first manifests itself there as a vibration of the mind-body. But if it be in any way a selfish thought, or if it be connected in any way with an emotion or a desire, it immediately descends into the astral plane, and takes to itself a visible form of astral matter.<\/p>", "images": []}, {"pdf_page_index": 46, "pdf_page_number": 47, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>In the case of the majority of men almost all thought would fall under one or other of these heads, so that practically the whole of their personality would like clearly before friend’s astral vision, since their astral bodies and the thought-forms constantly radiating from them would be to him as an open book in which their characteristics were writ so largely that he who ran might read. Anyone wishing to gain some idea as to how the thought-forms present themselves to clairvoyant vision may satisfy themselves to some extent by examining the illustrations accompanying Mrs. Besant’s valuable article on the subject in Lucifer for September 1896.<\/p><p>We have seen something of the alteration in the appearance of both animate and inanimate objects when viewed by one possessed of full clairvoyant sight as far as the astral plane is concerned; let us now consider what entirely new objects he will see. He will be conscious of a far greater fulness in nature in many directions, but chiefly his attention will be attracted by the living denizens of this new world. No detailed account of them can be attempted within the space at our disposal; for that the reader is referred to No. V of the Theosophical Manuals. Here we can do no more than barely enumerate a few classes only of the vast hosts of astral inhabitants.<\/p>", "images": []}, {"pdf_page_index": 47, "pdf_page_number": 48, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>He will be impressed by the protean forms of the ceaseless tide of elemental essence, ever swirling around him, menacing often, yet always retiring before a determined effort of the will; he will marvel at the enormous army of entities temporarily called out of this ocean into separate existence by the thoughts and wishes of man, whether good or evil. He will watch the manifold tribes of the nature-spirits at their work or at their play; he will sometimes be able to study with ever-increasing delight the magnificent evolution of some of the lower orders of the glorious kingdom of the devas, which corresponds approximately to the angelic host of Christian terminology.<\/p><p>But perhaps of even keener interests to him than any of these will be the human denizens of the astral world, and he will find them divisible into two great classes—those whom we call the living, and those others, most of them infinitely more alive, whom we so foolishly misname the dead. Among the former he will find here and there one wide awake and fully conscious, perhaps sent to bring him some message, or examining him keenly to see what progress he is making; while the majority of his neighbours, when away from their physical bodies during sleep, will drift idly by, so wrapped up in their own cogitations as to be practically unconscious of what is going on around them.<\/p>", "images": []}, {"pdf_page_index": 48, "pdf_page_number": 49, "label": "Chapter 2. Simple Clairvoyance: Full", "html": "<p>Among the great host of the recently dead he will find all degrees of consciousness and intelligence, and all shades of character—for death, which seems to our limited vision so absolute a change, in reality alters nothing of the man himself. On the day after his death he is pre
