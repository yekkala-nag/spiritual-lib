1x 24 x 60 x . One day is divided into 24 hours on the pattern of the lunar year having 24 lunations. Each hour is divided in to 60 seconds and so on. 2 The second type of division is made according to the formula: 1 x 60 x . The one solar day is divided into 60 Ghatis. Each Ghati is divided into 60 Vighatis and so on.<\/p>", "images": [], "label": "Page 52"}, {"pdf_page_index": 52, "pdf_page_number": 53, "html": "<p>Wisdom of the Heavens<\/p>\n<p>50<\/p>\n<p>The first of the above two divisions is based on the Jupiterian and the Saturnian cycles of the earth. In fact, the number of months in a year and the number of signs in the zodiac are based on the Jupiterian cycle of 12 years. Twice this number denotes the hours in the day and the lunations in the year (approximately). The second method of division is based entirely on the Saturnian cycle (30 years). Twice this number is 60. Hence the day is divided into 60 Ghatis as also many minutes in an hour, etc. Here we get the influence of the planetary cycles on the zodiac. A period of 60 years forms a different cycle for some specific purposes in the Vēdic and Purāṇic calculations of time. This period of 60 years is further divided into 12 of five years each. Each set is called a Yuga in a different sense though.<\/p>\n<p>It is a matter of great importance that the periodicities of various planets along the geocentric zodiac follow correspondence. For example, the annual sun takes 30 days to complete a sign. The moon takes 30 days to complete a round. The days of the moon agree with the years of Saturn. This is the origin of the method of progressing the planets to read a horoscope. The seeds<\/p>", "images": [], "label": "Page 53"}, {"pdf_page_index": 53, "pdf_page_number": 54, "html": "<p>Wisdom of the Heavens<\/p>\n<p>51<\/p>\n<p>of Karma sown speedily in one life in the subtler planes are reaped slowly, through bigger periods of time in the grosser planes. Every type of calculation has many hidden principles underlying it. Every periodicity in the zodiac is ever varying while the variations themselves are periodical. Variation and diversity appear on the surface phenomena; correlation, and unity exist at the base and constitute the frame. The true occultist gradually works out the correspondences, discovers the correlations, feels the unity, and transcends the diversity and gains mastery. This includes the path of liberation from the limitations of the zodiac, planets, and the solar system. At the cosmic level, there is the aid of the Hierarchy with the seven Ashrams and beyond this the disciple has Śambala where the help of the Lord SanatKumāra and Maitrēya is ever assured for the eventual transcendence.<\/p>\n<p>These various concepts about the zodiacal wisdom are absolutely necessary before the student can aspire to study the symbolism of each of the twelve signs.<\/p>\n<p>For all spiritual purposes, Aries is located in the meridian of the day of gods. The solar year is called the<\/p>", "images": [], "label": "Page 54"}, {"pdf_page_index": 54, "pdf_page_number": 55, "html": "<p>Wisdom of the Heavens<\/p>\n<p>52<\/p>\n<p>day of the Gods. Libra is located in the midnight of Gods. Capricorn and Cancer mark their sunrise and sunset. This is according to the Vēdic and the Purāṇic wisdom, Aries and Libra mark the two ends of the line of verticality (the plumb line), to the one on the equator, at noon of their vernal equinox day. Capricorn and Cancer constitute his horizontal plane on earth (the level). These two lines form the cross in man. The cross is composed of four right angles and each one forms the square of the fourth part of the circle, the four points around him from his own magnetic centres of initiation. Through these centres, the elementals of fire, air, earth, and water will give him the required initiations of the various degrees. The ever- widening concepts of man through initiations from the portals. The meridian and the nadir also mark the vertical line. This is the axis of initiation which is symbolised by the Brahmarandhra of the vertical being (man). The hours of his day are arranged on this axis as the timings for his realisation and unfolding (the hours of labour and refreshment).<\/p>", "images": [], "label": "Page 55"}, {"pdf_page_index": 55, "pdf_page_number": 56, "html": "<h3 class=\"pdf-heading\">The Clock in Space<\/h3>\n<h3 class=\"pdf-heading\">D o you know how man discovered the watch and the<\/h3>\n<p>clock? By this, we mean to ask you how the idea of a watch came to the mind of man, for the first time. It is due to the zodiac around the earth. Zodiac means much more than what we understand. For an ordinary astrologer zodiac means the belt of space that surrounds the equatorial region of the earth. In fact, it is not so. Real astrologers know the imaginary belt that forms in view around the equator in the course of the earth’s rotation of the zodiac. The truth is that the real zodiac is a principle that is concealed in space and that which unfolds as the ring of visibility around any globe of tangible matter. Thus, the zodiac exists for every globe including the Sun of each solar system. The twelve signs of the zodiac are like the three sixty degrees around a point. The moment the point is located; there is the birth of 360 degrees. Similarly, the moment a material globe is shaped; there is the existence of its own zodiac around itself.<\/p>", "images": [], "label": "The Clock in Space"}, {"pdf_page_index": 56, "pdf_page_number": 57, "html": "<p>Wisdom of the Heavens<\/p>\n<p>54<\/p>\n<p>There are many aspects of wisdom concealed in the zodiac principle like the many would be petals of a flower awaiting unfoldment in the bud. For example, the various apparent speeds of the different planets going round the sun represent the various functions of creation in different periodicities. The seasons show a periodicity arranged as a pattern of the six-petal flower in the year. From this formula the astrologers derived the sextile aspect and its influence. In one month the moon goes round the zodiac once. Each month has duration of 30 days. When we find the magnification of this periodicity in years, we find that the Saturn goes round the zodiac in thirty years. We can understand that the Saturn is bigger moon in his functions. Both these bodies; Moon and Saturn cause coldness and contraction to the physical sheaths of the beings. The sun goes round the zodiac once in every twelve months. Jupiter completes his rounds in twelve years. We can understand Jupiter as the bigger Sun. Both of these bodies, Sun and Jupiter represent the warmth, liveliness, affection and expansion to the beings. Like this we can arrange the planetary bodies into pairs serving the same purpose in two magnifications. Jupiter’s cycle represents twelve years while Saturn’s cycle<\/p>", "images": [], "label": "Page 57"}, {"pdf_page_index": 57, "pdf_page_number": 58, "html": "<p>Wisdom of the Heavens<\/p>\n<p>55<\/p>\n<p>represents thirty years. The L.C.M. of these two periodicities is the sixty-year cycle used by the ancient Indians to represent the recurrence of events on a magnified scale.<\/p>\n<p>In each cycle of sixty years, the planet Uranus occupies a different position and so too the Neptune. The ancients found the analogy of the sixty years cycles in the sixty divisions of the day, which were called by the ancient Indians as “Ghatis”. Each Ghati is further divided into sixty vighatis (Sub-ghatis).<\/p>\n<p>There are twelve new moons, and twelve full moons occur during a single zodiacal cycle of lunations. This cycle of twenty-four lunations is called the lunar year after which the day is also divided into twenty four equal divisions called Hōras (hours). The period between a full moon and a new moon is divided into sixteen moon phases. If we consider the full moon and new moon separately, there are fourteen moon phases between two lunations. The same division is located in a much bigger cycle of fourteen Manvantaras, each ruled by a set of centuries functioning as one moon phase.<\/p>", "images": [], "label": "Page 58"}, {"pdf_page_index": 58, "pdf_page_number": 59, "html": "<p>Wisdom of the Heavens<\/p>\n<p>56<\/p>\n<p>The cycle of sixty years finds its pattern in the zodiac of 360 degrees (60 x 6 =360). If the day is divided into day and night on the equinox-day, at the equator we have 360 x 2 = 720, the total of sun-rises and sun-sets in Sāvana year. (The year of the circle) 1/10 of this gives the unit of 72 years which is the average time for the equinox to recede through one degree. The time taken for the equinox to recede through one sign is called the great month. Twelve such months make one great year. Again if we multiply 720 with 60, we get the number 43200, the time this gives us a unit of time which is called Kali Yuga(432000 years) in the Purāṇas. Twice this unit makes a Dvāpara Yuga. Three times of the unit makes one Trēta Yuga. Four times the unit of forms one Krita Yuga, (Dvāpara means multiplied by two, Trēta means multiplied by three, Krita means multiplied by four).<\/p>\n<p>The four Yugas all together include 4 + 3 + 2 + 1 = 10 units. These four put together is called one MahāYuga. Like this the ancient Indians knew the cycles in all possible magnifications. They could understand time as a flower pattern imbedding the petals of various scale of magnification. The ancient seers of India have the vision<\/p>", "images": [], "label": "Page 59"}, {"pdf_page_index": 59, "pdf_page_number": 60, "html": "<p>Wisdom of the Heavens<\/p>\n<p>57<\/p>\n<p>of the law of correspondences, which they applied to all these units of time. The result is that they could find the place of the beings of the earth within each of these units of time. The result is infallible wisdom of prophecy, which they could apply to the life of an individual, his routine, his daily time table, the cycle of rebirths, the purpose of evolution, and finally the influence of centuries upon the human beings. Yugas upon nature and MahāYugas upon the Dēva kingdom set up to the end of Kalpa and Manvantara.<\/p>", "images": [], "label": "Page 60"}, {"pdf_page_index": 60, "pdf_page_number": 61, "html": "<h3 class=\"pdf-heading\">The Nature of Time<\/h3>\n<h3 class=\"pdf-heading\">S ome of us get up early and some late in the morning.<\/h3>\n<p>All are due to get up sometime around sunrise time. This is because the awakening of many a biological being on earth generally corresponds with the sunrise. Though there is no rise to the sun in its actuality, there is sunrise to all the biological children of the earth. It is intended by nature to cause awakening to the sleeping mind and senses. The mind and senses put together form a fine instrument like your wrist-watch presented by nature to you, as a birthday gift, at the time of your birth. It is for you to remember that you are different from your instrument and that you have to do something to it daily, at a particular time. To indicate you the time nature has provided you with a sunrise every day. This screws up your instrument and immediately you know that you are awakened from sleep. In fact, it is the instrument that is awakened and it is not you. The “You” in you has neither sleep nor awakening.<\/p>", "images": [], "label": "The Nature of Time"}, {"pdf_page_index": 61, "pdf_page_number": 62, "html": "<p>Wisdom of the Heavens<\/p>\n<p>59<\/p>\n<p>Then you get up in the morning and begin to respond to your program which is pre-planned by you or by something else. However, you find yourself conditioned by the program and you will go on responding to the items that roll on approaching you. Your program is always self-conditioned and it exposes you to others and your incidents with others, in accordance with yourself conditioning. Sometimes, why, many times, you find yourself confounded and jammed amidst the clusters of programs and persons. Sometimes you will get annoyed and irritated about others. This is because you forget that you are the cause of all this. It is really an art to know the clues for any easy way out of this confusion and tight corner.<\/p>\n<p>The clue lies in the true science of astrology. Not always the astrology of the astrologers. Herein lies one important clue: The instrument of your mind and senses shows the time and nature of your environment. Observe the state of your mind and observe the mood and mode that are clouding or conditioning your mind. The person who approaches you at that time is having a similar mood, mode and conditioning. If you can read your instruments<\/p>", "images": [], "label": "Page 62"}, {"pdf_page_index": 62, "pdf_page_number": 63, "html": "<p>Wisdom of the Heavens<\/p>\n<p>60<\/p>\n<p>without getting identified with it, you will be able to read what the other man wants. You can thereby understand his situation, guide him and help him for a way out whether it is in the form of a solution, an escape or a postponement. A solution is, of course, the best of the three, if only he can withstand it.<\/p>\n<p>For example, if a person approaches you with a problem of his daughter’s marriage, immediately observe the topic that is occupying your mind. If you are spending a happy time in conversation with your wife, you can conclude that the time for the marriage of your friend’s daughter has already approached, that the marriage takes place within a few months without any effort and that the family life is bound to be happy for a long time. Instead, if you are loggerheads with your wife on some problem, you can conclude that there will be a prolonged period of serious discussions and that the marriage is not going to take place immediately due to some differences of opinion among elders, or if you are waiting anxiously for your wife’s return from a distant shopping or other, then you can conclude that the marriage will be unduly delayed due to reasons unknown.<\/p>", "images": [], "label": "Page 63"}, {"pdf_page_index": 63, "pdf_page_number": 64, "html": "<p>Wisdom of the Heavens<\/p>\n<p>61<\/p>\n<p>Once a big politician approached me to show his horoscope and know how long his span of life was. At that time, two ladies were crossing my gate with empty pots approaching the tap. One of them said, “A silly boy had thrown a stone and my pot was hit, I pasted it with wax.” The other one replied, “How long can you manage with a broken pot? You have to change it soon,” thereby, I concluded that the politician’s life was at stake due to some mischief of a contemporary and that he was going to face a violent death. This came true within the next six months. Herein lies the clue: “whether the period of the other person is good or bad, your inner voice will show similarity,” Varāhamihira<\/p>", "images": [], "label": "Page 64"}, {"pdf_page_index": 64, "pdf_page_number": 65, "html": "<h3 class=\"pdf-heading\">The Influence of Planets<\/h3>\n<h3 class=\"pdf-heading\">T he Indian astrological tradition is an unbroken<\/h3>\n<p>chain of thought which runs through the scriptures. The consistency of its logic through the centuries is one of its outstanding features. It enables us to understand that each solar system including our own is an integral whole and should be understood as one single personality. We can name this as the solar consciousness of this particular solar system, which includes the various planets as the psychological potencies of the whole system. Every atom of our earth receives a print of the totality of the personality and begins to evolve into its degrees of awakening along with this totality. Consequently, every atom is being influenced by the totality every moment. The evolving tendency is also innate in the totality as an inherent trait. The evolution of each planet is guided by the ever attending planetary consciousnesses which work as guides. This is the true basis of the ancient most science, astrology.<\/p>", "images": [], "label": "The Influence of Planets"}, {"pdf_page_index": 65, "pdf_page_number": 66, "html": "<p>Wisdom of the Heavens<\/p>\n<p>63<\/p>\n<p>The sun-globe which is perceptible on the physical plane works as the physical body of our sun. Apart from this, there is the sun-consciousness which the scriptures call the Sun-God. Every planet of our solar system is, in the same way, a double-entry having a physical planetary globe and a planetary deity. The planets described in the Vēdas and the Purāṇas as having their influence upon us are the planetary deities, and not at all the planetary globes that are observed by the student of pure astronomy. Astronomy is the study of the skeleton of our solar system whereas astrology is the study of the planets in their flesh and blood. We can rightly understand astrology as biology or our solar system, which includes the psychology and the spiritual consciousness of our solar system. The various periodicities of the planets, their speeds, orbs, and the interplanetary distances are all the conscious counterparts of the personality of our solar system, which is the expression or the totality of utterance of the solar deity into the objective detail of the whole creation.<\/p>\n<p>One truth about our solar system is the existence of cycle within cycles, which are arranged in a beautiful<\/p>", "images": [], "label": "Page 66"}, {"pdf_page_index": 66, "pdf_page_number": 67, "html": "<p>Wisdom of the Heavens<\/p>\n<p>64<\/p>\n<p>pattern of time scales, and geometrical pattern in space. These time scales create time sense to the minds of the various individuals living on this earth. Every one of us is time conditioned and works out the plan of our life in terms of time, whether knowingly or unknowingly. Our daily routine like the hours of work, dates of employment and the dates to receive wages are all guided by time sense. Our appetites, the needs of our food, drink, sex, and reproduction are all conditioned by the planetary periodicities, which enable us to read in terms of time. There is no better example of time-conditioning them the invention and the construction of our watches and clocks by the human mind. We can rightly understand the watch as the epitome of the zodiac and the revolution of planets. The unit of a solar day with its four cardinal points imbeds all the secrets of the creation and it’s time-conditioning as a self-sufficient specimen and symbol. The sunrise is a true symbol of the beginning of our creation in a scale, our individual birth on another scale, and our awakening from sleep every morning on another scale. The sun set is the symbol of the ending and our sleep is the symbol of all subjectivity which we call “Praḷaya.”<\/p>", "images": [], "label": "Page 67"}, {"pdf_page_index": 67, "pdf_page_number": 68, "html": "<p>Wisdom of the Heavens<\/p>\n<p>65<\/p>\n<p>The day is an epitome of the year and the year is an epitome of bigger cycles through centuries and Yugas. All the twelve signs of the zodiac appear to go round the earth once in every solar day, and also once in every solar year. This gives us an idea of how the atom includes all the correspondences with the whole solar system. The idea that the solar year exists was perceived by the ancient seers through the law of correspondence. The man could understand the existence of the year by observing the solar day from sunrise to sunrise. Just the various parts of the solar day wield their influence upon the various phases of consciousness for the beings on this earth; the solar year produces the various seasons which reflect upon the fauna and flora on this earth. With this idea in mind, the ancients could discover the various divisions of the heavens into equal parts. The six seasons, the 12 months with their new moons and full moons, and the relationship between the cycle of waters, and the solar year are all observed in the same way. The beginning of the solar year is marked at various points like the equinoxes and the solstices. The Vēdas describe the two equinoxes and the two solstices as the four different beginnings of the solar year. In popular astrology, the<\/p>", "images": [], "label": "Page 68"}, {"pdf_page_index": 68, "pdf_page_number": 69, "html": "<p>Wisdom of the Heavens<\/p>\n<p>66<\/p>\n<p>vernal equinox is taken as the beginning of the solar year. From this point onwards the whole cycle of the year is divided into twelve equal parts, which are called the twelve signs of the zodiac. They correspond with the twelve groups of galaxies which we call the constellations.<\/p>\n<p>Again the whole cycle is divided into 27 equal parts beginning with the vernal equinox. These are called the lunar mansions and they bear correspondence with the monthly rotation of the moon, around the earth. The moon travels at an average speed of one lunar mansion a day, the effects of which are enumerated in the ancient astrological lore of India. People are trained to have a selective use of the various days in the lunar month according to this division. Some lunar mansions are found favourable to do some kind of work, and hence they select the days according to the nature of the work. The passage of the sun through each of these lunar mansions takes about 13 days, the effects of which are also described. These periods of 13 days from the seasonal and agricultural calendar of the Indians, they are accustomed to sow and reap according to these divisions. Since the various Vēdic rituals correspond with the agricultural<\/p>", "images": [], "label": "Page 69"}, {"pdf_page_index": 69, "pdf_page_number": 70, "html": "<p>Wisdom of the Heavens<\/p>\n<p>67<\/p>\n<p>routine; we find that ancient ritualistic of the Vēdic ages used these periods to select timings for the various rituals.<\/p>\n<p>Another aspect of the science of correspondence is that the astrologer finds counterparts of these divisions in the physical body of the living being. For example, the first lunar mansion begins with the head of the human being and the last one ends with the toe. The position of any planet is one of these divisions, at the time of birth, marks the influence of that planet in that part of the physical body and we find the influence of the planet during the course of the span of that individual. For example, the location of Saturn in the first division which falls in Aries marks the Saturn centre in the head of the person born during those days. This causes a congenital dullness in the mental faculties of that individual which lives with him all through his life. Every month when the moon touches that point, the person feels the dullness more prominent. If Saturn is located in the ninth division which falls towards the end of the sign Cancer, it creates a Saturn centre in the chest of the person. This causes phlegm troubles and respiratory troubles that are congenital. Whenever the moon touches this point every month, the person feels the<\/p>", "images": [], "label": "Page 70"}, {"pdf_page_index": 70, "pdf_page_number": 71, "html": "<p>Wisdom of the Heavens<\/p>\n<p>68<\/p>\n<p>trouble more prominent. According to the effect produced by the planets, these planets are divided into two groups, benefic and malefic. Sun, Mars and Saturn are classed as the malefic planets while Jupiter, Venus and Mercury are classed as benefics. In fact, the planets are neither benefic nor malefic, but they stimulate that which is in store for the individual. The tendencies are carried from the previous births according to the previous deeds of the individual while the planet works as pointers of these tendencies. During the various revolutions, these planets stimulate that which is in store, whenever they touch these sensitive points in the horoscope. In our next lecture, we will deal with the systematic classification of these effects of the planets upon the human constitution.<\/p>\n<p>Some people know, some people believe, and some people doubt the influence of planets upon our life. The difference shows the degree of understanding according to the stage of mental evolution. It is like the difference between any two students in a class. The whole universe around us is like a class room with the distant sky as a blue board, and the heavenly bodies are as if the hints of the teacher noted on it by a piece of chalk. There is much<\/p>", "images": [], "label": "Page 71"}, {"pdf_page_index": 71, "pdf_page_number": 72, "html": "<p>Wisdom of the Heavens<\/p>\n<p>69<\/p>\n<p>to know between the lines about the stars and the galaxies. Before that, we have the presence of the planets in our solar system that are very near to us and that are communicating with us through their language of periodicities, speeds, and orbs, through their interactions and reactions with our earth’s matter. Can these bodies at a distance influence our earth and our lives on the earth? We see how the teacher in the classroom stands at a distance from us and communicates the lesson through his explanations. How can the sound expressed through his vocal cords convey the import of the lesson by reaching us through our ears? How this can happen when there is a gap of space between us and himself?  When it is possible that two people can converse with each other through the gap of space, the same thing is possible between us and the planets. The radiation of the lesson through the vibration of the sounds takes place only through them medium of space. The same thing holds good with the planets also. Each of us receives the influence according to his standard. To some people, the planets are fate-makers. They believe that their future is conditioned by the planets, and it is known by the position of the planets at their birth. This is true to them because<\/p>", "images": [], "label": "Page 72"}, {"pdf_page_index": 72, "pdf_page_number": 73, "html": "<p>Wisdom of the Heavens<\/p>\n<p>70<\/p>\n<p>they have not yet any plan in their mind about themselves. The laws of nature are injunctions to them, their own response, which is in terms of the inevitable language of their own emotions, instincts, and reflexes condition their thoughts. This, in its turn, conditions their attitude. The whole process is recorded by the moving planets as they pass through the birth position of the planets in their horoscopes.<\/p>\n<p>The birth degrees of the planets in their horoscope stand like trigger points of the emotions that are in store according to the habituated conditioning which we call the past karma. Every action in present life is only a reaction to the environment, and hence it is predictable. Their horoscope reveals the way in which they behave inevitably.<\/p>\n<p>Some people doubt the influence of the planets while at the same time, they react to the planets with the same degree of inevitability. They react to others in terms of anger, hatred, malice, jealousy, and caution, which expresses only as timidity. The incidents in their life are also as predictable as those of the previous class. Disbelief<\/p>", "images": [], "label": "Page 73"}, {"pdf_page_index": 73, "pdf_page_number": 74, "html": "<p>Wisdom of the Heavens<\/p>\n<p>71<\/p>\n<p>expresses through them as one of the forms of inevitable prediction. Such people are very careful about what they know and what they have while they are quite unconscious of what they are and what they are influenced by. There are still people with higher minds who begin to think and try to understand the realms of the unknown. To them the planets work as instructors and begin to allow freedom of thought. After waiting for a long time, these people begin to choose for themselves in light of the planetary lessons. They grow communicative and they begin to control their expressions away from the outbursts of their own emotions, though it begins to dawn on them, independent of their own limitation. Their horoscopes predict only what they choose, how they succeed, and how they fail. Planets do not take the trouble of predicting incidents in their lives.<\/p>\n<p>In the next stage of human evolution, we find that people begin to analyse their beliefs and try to plan for themselves according to the force of nature working through them, and expressing themselves in terms of their birth planets. To them, the planets teach the problems of humanity and the way how to meet them. To them, the<\/p>", "images": [], "label": "Page 74"}, {"pdf_page_index": 74, "pdf_page_number": 75, "html": "<p>Wisdom of the Heavens<\/p>\n<p>72<\/p>\n<p>planets work as instructors in terms of limitations and opportunities. There are still some people who have reached the next stage of evolution. They try to understand that there is a plan expressed through the planets, just as they have a plan for themselves to be carried through their whole life. For them, the planets work as advisors, helpers, and guides. Things are predictable only to a very small degree. To them, their horoscope is guidance to choose and not a chart, which reveals fate. Advice is more meaningful to them than prediction. Such people have passed the stage of thinkers and philosophers. They have reached the stage of doers and servers. Thus, we can trace the path through the stages of the animal, the servant, the student, the adult, the server, and the helper. Here we notice the difference between the servant and the server. The servant is a poor inevitable creature while the server fulfils his lot by way of wilful co-operation and contribution.<\/p>\n<p>In the next stage of spiritual evolution, we find another group of human beings tuning themselves with the planets and the forces of nature while trying to do their best in the interests of the whole planet of this earth.<\/p>", "images": [], "label": "Page 75"}, {"pdf_page_index": 75, "pdf_page_number": 76, "html": "<p>Wisdom of the Heavens<\/p>\n<p>73<\/p>\n<p>They have nothing of their own just as the clouds do not have some plan for themselves. Their activity is only to serve the purpose of the earth globe. The logic of what we do and what we gain is understood as vain and useless. For them, the planets work as Master’s and advisors. They conduct their gatherings and meetings to convey the plan for such people. Each conjunction, square, opposition, trine, sextile or transit between two planets in their horoscope means neither good nor bad to them. It means only a timetable and a program needful. Such people find the place of one incident in the light of all the other incidents, the place of one person in the light of all the persons and forces at work.<\/p>\n<p>As we follow the logic of the planets and understand the place of prediction, training, guidance, and advice; we will at once realize the shallowness of the philosophy of fatalism. Of course, fatalism has no place in the minds of the fatalists who grow into manhood from animal nature, while they pass through the elementary school educations of our earth. Since the career of a human being marks the life of not only a student but also a colleague of the teachers on this earth; he is expected to exercise his way<\/p>", "images": [], "label": "Page 76"}, {"pdf_page_index": 76, "pdf_page_number": 77, "html": "<p>Wisdom of the Heavens<\/p>\n<p>74<\/p>\n<p>of doing things, and deciding the course of action by feeling the presence of his own will unlike the rest of the beings on this earth. Training the human being to do this is the ultimate goal and fulfilment of the planets as far as their work for the human beings is concerned. People who wait for the situations and those who expect “the Lord to come down to earth to save them” in an objective sense have to wait until they begin to understand rightly. Meanwhile, they will be undergoing the process of births and deaths along with the animals.<\/p>\n<p>A unit human being, like a planet, is a unit- consciousness equipped with a unit mind, and physical matter at hand. Those who understand in the physical terms do not see the truth. This is the reason why the astronomers who do not know astrology and the science of spiritualism cannot find any meaning in the orbs and cycles of the planets. It is also the reason why the scientists, natural philosophers, sociologists, psychologists, economists, commercialists, and politicians, who have not grown into the dimension of spiritual awareness, find the human activity of this earth as a big riddle. They find panic in music and discord in concord.<\/p>", "images": [], "label": "Page 77"}, {"pdf_page_index": 77, "pdf_page_number": 78, "html": "<p>Wisdom of the Heavens<\/p>\n<p>75<\/p>\n<p>Astrology is the true key of spiritual wisdom which we call the science of Man. The scriptures of all the nations of this earth contain this branch of wisdom and they need astrology as a master key to unlock the secrets of the ultimate solution to everything.<\/p>", "images": [], "label": "Page 78"}, {"pdf_page_index": 78, "pdf_page_number": 79, "html": "<h3 class=\"pdf-heading\">The Principles Governed by<\/h3>\n<h3 class=\"pdf-heading\">the Planets<\/h3>\n<h3 class=\"pdf-heading\">T he whole solar system is understood as a unit<\/h3>\n<p>constitution working according to nature’s laws. The fact that there is much distance between two planets, does not bar us from understanding the fact that the whole solar system is but one unit. The concept of distance changes according to the measure and position of the individual who wants to measure. For an ant crawling upon your forearm, there is much distance between your hand and head. If the ant were asked to examine the head while itself standing on your forearm, then it understands that the head is far too distant from the head. Hence there is no possibility for the ant to understand that the hand and the head belong to the same person. Similarly, for a mere astronomer who is not yet an astrologer, the sun and the planets stand distant and different from the earth. It is not easy for him to understand that the whole solar system is the body of a unit consciousness which works like an individual. For an astrologer who can comprehend the<\/p>", "images": [], "label": "The Principles Governed by"}, {"pdf_page_index": 79, "pdf_page_number": 80, "html": "<p>Wisdom of the Heavens<\/p>\n<p>77<\/p>\n<p>above facts, the sun is certainly not different from the earth or anyone of the planets. Just as the action of one part of your body influences the other part, the planets moving around the sun cause changes upon every planet. The same is the case with our earth which is part of the solar system. The apparent motion of the sun, moon and the planets around the earth along the path of the earth’s zodiac causes many changes in the behaviour of every atom of the earth. The same logic holds good to understand that the planets influence the beings of the earth. Every planet has a physical body which the astronomer calls the planet. In fact, the planet is different from the planetary body though it resides in the same body and exercises its influence from it. Just as we are different from our bodies though we exist in the same body, the planets are different from the planetary bodies. We cannot identify ourselves without our physical bodies, so too the planets.<\/p>\n<p>We work as personalities existing in the bodies. Each planet exists in the planetary body and works as an individual. For this reason, we find the description of the planetary beings as personalities in the astrological<\/p>", "images": [], "label": "Page 80"}, {"pdf_page_index": 80, "pdf_page_number": 81, "html": "<p>Wisdom of the Heavens<\/p>\n<p>78<\/p>\n<p>textbooks of the ancients. These personalities influence the various planes of the existence of the earth and the individual from the earth.<\/p>\n<p>According to the ancient textbooks of astrology, we find that each planet represents a plane of consciousness in our personality. The sun is said to represent the centre of consciousness in us which we call “I AM”. The moon governs our mind. Mars governs valour while Mercury governs the intelligence. Jupiter governs wisdom and a sense of happiness. Venus represents the concept of beauty while Saturn represents experience. The planets at the time of birth form a particular pattern according to which we are shaped as the arrangement of the various concepts in us. Since everything on this earth is continuously created and replenished by the sun, we have to accept that the sun influences our own creation individually and collectively. Since the reactions of our mind are all framed as the secondary and tertiary reactions of the substance in us, we can understand that the structure of the family and the society are also governed by the planets. The concepts of society and family exist in our mind, and hence they are caused by the cumulative actions of the planets. In this plane, the sun<\/p>", "images": [], "label": "Page 81"}, {"pdf_page_index": 81, "pdf_page_number": 82, "html": "<p>Wisdom of the Heavens<\/p>\n<p>79<\/p>\n<p>governs the head of the family, the father force. The moon governs the mother; Mars governs the relationship among brothers while Mercury represents the maternal uncles. Jupiter represents our elders and well-wishers, whom we are expected to venerate and follow. Venus represents objects of love and affection while Saturn represents the old people in the house. All these relationships exist as concepts in the human mind while they do not exist in the very essence of the individual. These relationships are our mental projections, and hence they are influenced by the activity of the planets.<\/p>\n<p>The position of the planets at birth gives us a clue to understand the nature of relationships. The movement of the planets and their mutual aspects represent the changes that take place among the relative during the course of our span. In other plane, the Sun represents our superiors and bosses, while the Moon represents the domestic circle. Mars represents competitors while Mercury represents our social contacts, business transactions and communications. Jupiter represents financial aid and sources of help, while Venus represents persons who give us comfort and happiness. Saturn<\/p>", "images": [], "label": "Page 82"}, {"pdf_page_index": 82, "pdf_page_number": 83, "html": "<p>Wisdom of the Heavens<\/p>\n<p>80<\/p>\n<p>represents persons towards whom we have inevitable duties and responsibilities.<\/p>\n<p>The very concept of family, society and government is formed by the planetary consciousness reflecting upon the mind. In this aspect, the sun represents our relationship with the government while the moon represents our civic sense. Mars represents our relationship with the implementation of protection, law and order and defence. This is presented as our relationships with the police and military. Mercury represents postal, telegraphic, radio and television services. He represents also messengers, interpreters, traders, accountants and agents. Jupiter represents the court of law and the administration of Justice, religious and charitable institutions. Venus represents entertainments, public amenities, fancy, stationary, and beautifying aids. Saturn represents hard labour, manual work and wages. While studying the horoscope we are expected to consider the individual in the light of all the above aspects and then we will be able to assess the position of the individual in terms of his career, livelihood and his environment. In fact, the individual forms his own<\/p>", "images": [], "label": "Page 83"}, {"pdf_page_index": 83, "pdf_page_number": 84, "html": "<p>Wisdom of the Heavens<\/p>\n<p>81<\/p>\n<p>habituated behaviour towards these aspects and the very nature of his habituation is understood by studying the horoscope.<\/p>", "images": [], "label": "Page 84"}, {"pdf_page_index": 84, "pdf_page_number": 85, "html": "<h3 class=\"pdf-heading\">Planets and Colours<\/h3>\n<h3 class=\"pdf-heading\">V arious authors give various types of relationship<\/h3>\n<p>between the colours governed by the various planetary vibrations. The whole theory is based upon the hidden Law of Nature that matter, force and mind are vibrations of different frequencies. Another Law of Nature is that matter, force and mind make their manifestation as the aggregates of vibrations. Further, these three states vibrate towards each other in various frequencies producing various effects of objectivity. One of these effects on mind is called the colour-effect.<\/p>\n<p>The whole Solar system is a manifestation of the Lord’s will into an integral self-sufficient unit. The planets are formed as the effect of various consistencies in matter and mind. To the sons of our earth, the planets produce the effect of sound and colour in the septenary scale. The Solar ray manifests as the spectrum of seven colours to human eye of this earth. The planets are nothing but stabilised patterns of the colours of the Solar spectrum.<\/p>", "images": [], "label": "Planets and Colours"}, {"pdf_page_index": 85, "pdf_page_number": 86, "html": "<p>Wisdom of the Heavens<\/p>\n<p>83<\/p>\n<p>Ancient and modern books on astrology describe the relationship between each planet and its corresponding colour. Unfortunately, there are many differences of opinion among the authors and this makes us understand that there is something empirical about the theory. Human observation and understanding are always subject to error, correction and rearrangement of truth. This is in tune with the Law of Evolution of Truth and the Law of the Response of the individual to Truth in course of his evolution. This does not mean that we are to disbelieve the theories of planetary colours and their application. Science, modern or ancient, has always many loopholes in understanding. We are expected to follow the light of others’ teachings in tune with the intuition of the individual, which is ever expanding unto the goal of ultimate perfection. Ultimate perfection is a myth as far as the human intelligence and understanding are concerned, but at the same time it is not a myth to the human comprehension beyond the cage of the senses, mind and intelligence. Instead it is the vision of the ultimate perfection of things, that is the only truth into which we can unfold. Everyone is a student through births and rebirths when we consider him in the light of the vision of<\/p>", "images": [], "label": "Page 86"}, {"pdf_page_index": 86, "pdf_page_number": 87, "html": "<p>Wisdom of the Heavens<\/p>\n<p>84<\/p>\n<p>ultimate perfection. The Solar system as a whole is the only pattern, which gives us an idea of basic unity and ultimate perfection. It enables us to work out our own fitness in the totality of the Solar system. Those who could visualise this pattern of the Solar system as a whole, could gather some pages of wisdom and translate it into the language of the humans. This attempt enabled the ancient seers to read the scripture of the star-lit heavens and give us their own concept of the pattern of colours. Varāhamihira, the celebrated seer of the unity of the Solar Splendour gave us a key to the colours of the 12 signs of the Zodiac. According to him, the following colours correspond with the 12 signs:<\/p>\n<p>• Aries             -   Blood Red • Taurus - Milk White • Gemini -  Parrot Green • Cancer -  Pale Yellow • Leo -  Smoky Grey • Virgo            -  The Rainbow • Libra             -  Navy Blue • Scorpio -  Gold colour • Sagittarius  -  Honey Brown • Capricorn    -  Patched in shades of black<\/p>", "images": [], "label": "Page 87"}, {"pdf_page_index": 87, "pdf_page_number": 88, "html": "<p>Wisdom of the Heavens<\/p>\n<p>85<\/p>\n<p>• Aquarius     -  Lightning flash • Pisces         -   Transparent colour less (Like pure glass) This does not mean that these zodiacal signs have these colours. In fact there are no signs as such in the sky. They are as they appear when seen from the earth. Colour is nothing but colour effect upon the eye of the observer. Objectively, there is nothing like a colour that exists. It is all as it appears to the mind through the eye. It is like the concept of anything before it is uttered forth as a word. To the ear, it is a word uttered, but to the utterer it is a concept while it is a vibration to the soul. Same is the case with the colour. If we say that a particular surface is red, it means that it gives us an impression of what we call red. As Shelly describes, the whole splendour of the creation is a multi-coloured dome within which there is limit less lustre of no colour.<\/p>\n<p>The above said colours govern the life of the individuals that are born under each sign. Since everything from an atom to the human being is conducted under the constitution of the zodiacal signs and the<\/p>", "images": [], "label": "Page 88"}, {"pdf_page_index": 88, "pdf_page_number": 89, "html": "<p>Wisdom of the Heavens<\/p>\n<p>86<\/p>\n<p>execution of the planets it remains a fact that we see everything in terms of colours. We are governed by these colours in the name of the moods and humours they produce in us. Every colour has its effect of stimulating the corresponding colour centre of consciousness in us. Every stimulation sets a chain action in the whole constitution which makes a rearrangement of the conscious mind for the better or the worse. When the colour is in harmony with our perception, then the rearrangement of the mind is for the better. When not, it is for the worse. The result of the arrangement is what we call mood. We say, we are in good mood or bad mood. It means that we are in tune or out of tune with our environment.  Adjustment is required in our mind and not in the environment. Better arrangement or rearrangement of the articles of the physical plane around us is made possible only after there is a better arrangement of our thoughts. A well-managed house speaks of well managed mind. Conversely a well-managed house stimulates the mind in the direction of better arrangement of thoughts. The more we arrange things better, the more we will be able to manage with them better. But the pity is it should begin with the mind and<\/p>", "images": [], "label": "Page 89"}, {"pdf_page_index": 89, "pdf_page_number": 90, "html": "<p>Wisdom of the Heavens<\/p>\n<p>87<\/p>\n<p>not the material around us. For this reason, an already arranged master mind is required to give its presence to us so that we may resume the capacity to arrange our thoughts first and our things next. In space we see the creation of matter through the space mind. Matter is nothing but the precipitate of the mind and our consciousness is nothing but the sublimate of matter .This is true in space when the creation occurs. This is true in us when we begin to live after we feel the presence of ourselves. The human constitution is a wonderful instrument having the keyboard of the conversion of mind into matter and vice versa. The keyboard exists in the various brain centres which are located along the spinal column with in and which are termed ‘c̣akras’ by the Yogic scientists. Each colour has its colour centre in one of the six Chakras and in seventh, which we call the head centre (Sahasrāra). The colour of an article is nothing but a surface of a particular frequency of vibration that stimulates its corresponding colour centre in our spine. The zodiacal signs work as the transmitters while the brain centres in the spine work as the receiving sets. All things in between are like the counterparts of the musical note produced in the name of our life. Persons born under<\/p>", "images": [], "label": "Page 90"}, {"pdf_page_index": 90, "pdf_page_number": 91, "html": "<p>Wisdom of the Heavens<\/p>\n<p>88<\/p>\n<p>each zodiacal sign have a different influence of the colour of that sign. They are expected to live more and more exposed to that colour in terms of the articles of their daily life when they get at the harmony of their own instrument.<\/p>", "images": [], "label": "Page 91"}, {"pdf_page_index": 91, "pdf_page_number": 92, "html": "<h3 class=\"pdf-heading\">Planets and The Hours of<\/h3>\n<h3 class=\"pdf-heading\">The Day<\/h3>\n<h3 class=\"pdf-heading\">“D uring the day and night, the hours are counted in<\/h3>\n<p>the reverse order, leaving the preceding and the following planet in each case. Such a division of hours according to the planets reveals the good or bad that avails according to that which has been stored previously” - Varāhamihira’s  Bṛhatjātaka, 1-3. This is a wonderful riddle, the solution of which is as follow:- a) Know the planets that govern the seven days of the<\/p>\n<p>week in order. They are:<\/p>\n<p>1. Sun for Sunday 2. Moon for Monday 3. Mars for Tuesday 4. Mercury for Wednesday 5. Jupiter for Thursday<\/p>", "images": [], "label": "Planets and The Hours of"}, {"pdf_page_index": 92, "pdf_page_number": 93, "html": "<p>Wisdom of the Heavens<\/p>\n<p>90<\/p>\n<p>6. Venus for Friday 7. Saturn for Saturday b) Reverse the order of planets it is: 1. Saturn, 2.<\/p>\n<p>Venus, 3. Jupiter, 4. Mercury, 5. Mars, 6. Moon, 7. Sun c)   Pick out the planets of this order alternately leaving the preceding and the following. Once again arrange them accordingly. It is: 1. Saturn, 2. Jupiter, 3. Mars, 4. Sun, 5. Venus, 6. Mercury, 7. Moon. This is the order in which the planets govern the hours of the day and the night. The counting starts every day with the Lord of that week-day. Sunday starts with Sun hour Monday starts with Moon- hour, Tuesday starts with Mars Wednesday starts with Mercury, Thursday starts with Jupiter, Friday starts with Venus and Saturday starts with Saturn. Start the counting with sunrise exact to minute and count each hour according to the order of planetary hours. For example, suppose that sun rises at 6-10 a.m. on a particular Sunday at your place. Since it is Sunday the first hour is governed by Sun, the second hour by Venus. The order will be:<\/p>\n<p>6-10 to 7-10 a.m. - sun-hour<\/p>", "images": [], "label": "Page 93"}, {"pdf_page_index": 93, "pdf_page_number": 94, "html": "<p>Wisdom of the Heavens<\/p>\n<p>91<\/p>\n<p>7-10 to 8-10 a.m. – Venus-hour 8-10 to 9-10 a.m. – Mercury-hour<\/p>\n<p>9-10 to 10-10 a.m. – Moon-hour 10-10 to 11-10 a.m. – Saturn-hour 11-10 to 12-10 a.m. – Jupiter-hour<\/p>\n<p>12-10 to 1-10 a.m. – Mars-hour Again the same cycle repeats from after 1-10 p.m. starting with sun-hour. So on, up to the end of the night when the next day starts with moon hour. Each hour stimulates that which is in store for you according your past deeds. Past deeds leave their impressions upon our mind as habits and tendencies which await stimulation in proper time and congenial environment. Past Karma is stored in the individual nature in the form of good or bad tendencies. Good tendencies lead us to do good things while bad tendencies condition the mind to repeat bad things. For bad deeds there is fall and retribution. For example, if one is accustomed to consume opium every day his mind is conditioned to eat opium once again at the same hour every day. If one is accustomed to take his bath early and<\/p>", "images": [], "label": "Page 94"}, {"pdf_page_index": 94, "pdf_page_number": 95, "html": "<p>Wisdom of the Heavens<\/p>\n<p>92<\/p>\n<p>practise yoga for a long time, his dawn makes him feel doing the same next day also. This is what we call karma- conditioning. It acts as associations that work beyond logic and knowledge. We have in us good tendencies and bad tendencies as seeds awaiting germination. Now the planetary hours indicate us the type of tendencies that are to sprout in us during that hour. Some planetary hours stimulate good karma and some stimulate bad karma. Sun, Jupiter, Mercury and Venus stimulate bad tendencies which lay hidden in us. They result is that during the good planetary hours people get on amicably with each other and are ready to see the good in others. They are sympathetic to faults and helping according to their temperament. During the bad planetary hours people feel uncomfortable of others. They try to see the defects and darker side of others, so that they may have the fetish to point out. They are unsympathetic and overcritical towards others. These two types of stimulations condition the minds while each one behaves with other. Of course, this is only conditioning, which never compels them to action. It is for the individual to act or resist. The choice always lies with the individual and not at all with the planets as far as the daily life of the individual is<\/p>", "images": [], "label": "Page 95"}, {"pdf_page_index": 95, "pdf_page_number": 96, "html": "<p>Wisdom of the Heavens<\/p>\n<p>93<\/p>\n<p>concerned. One can be wise to grow passive during the hours of wrong stimulation and begin to act once again during the hours of right stimulation. It is only to train us to do the right thing, avoid the wrong thing and neutralize the negative tendencies in us that the planets operate, stimulate purify, retribute and rectify. The art of being benefited and guided by the planets is imparted by Astrology. You have learnt how to calculate the planets that govern the various hours of the seven days of the week. Now you will know how to use these planetary hours to the benefit. Astrology divides the seven main planets into two groups: Benefic planets and malefic planets. Benefic planets stimulate the tendencies of your good karma you have done in the past. Malefic planets stimulate the tendencies of your bad karma. When your good tendencies are stimulated you will react favourably to the environment and thereby you will do acts that benefit you. You will be able to understand others positively, think good, speak good and do good. Then you will build<\/p>", "images": [], "label": "Page 96"}, {"pdf_page_index": 96, "pdf_page_number": 97, "html": "<p>Wisdom of the Heavens<\/p>\n<p>94<\/p>\n<p>up good actions from others in favour of you.  When your bad tendencies are stimulated you will react unfavourably to the environment and thereby you will do acts that prove unfavourable to you. You are likely to misunderstand others, you will think, speak and do something that is not required which harms others and they begin to harm you. The division is as follows: BENEFIC PLANETS: 1. Jupiter 2. Mercury 3.  Venus  4. Sun MALEFIC PLANETS:<\/p>\n<p>1. Saturn  2. Mars 3. Moon Avoid doing anything important during the hours of malefic planets. Avoid starting on a journey, meeting anyone on important business, getting married, entering into any contracts of a long standing nature and starting treatment for a cure etc. Do all these things while the hours of good planets are in the present. Do this choice as far as your routine is concerned and as far as others’ routine permits you. Your luck begins to increase since you react less and less badly to others. The week days are also good and bad in the same manner to commence<\/p>", "images": [], "label": "Page 97"}, {"pdf_page_index": 97, "pdf_page_number": 98, "html": "<p>Wisdom of the Heavens<\/p>\n<p>95<\/p>\n<p>something important. Choose the good hours on good days, then you are at your best. Sunday, Wednesday, Thursday and Friday are good to commence anything. Choose the good planetary hours on good days. Monday, Tuesday, and Saturdays are bad to commence new projects. Avoid these days and the bad planetary hours. For example if you meet a stranger on any important business on Sunday during a Sun hour, Mercury hour, Jupiter hour, or Venus hour you will be at your best to meet him and he will be at his best to respond to you affectionately and show much consideration about your points of view. In the same way you can choose the same hours on a Wednesday, Thursday or Friday. If you meet a new person in a Saturn hour, you will have a cold and formal response which is rather mechanical and which lacks the warmth required for human considerations. Sometimes your disposition may grow ill so that you may commit mistakes. You may be asked to wait long and you grow impatient. You may miss the bus or train due to your own mistake. The tickets may be over in the theatre when it comes to your lot. You may<\/p>", "images": [], "label": "Page 98"}, {"pdf_page_index": 98, "pdf_page_number": 99, "html": "<p>Wisdom of the Heavens<\/p>\n<p>96<\/p>\n<p>be disqualified because the other man remembers you of something disagreeable in the past between him and yourself. If you start at home while it is Mars hour you may have a wrong sense of speed so that you may meet with an accident or hit at anyone. You may rub the other person on the wrong side or he may do the same to you. You may be critical or grow irritable in any discussion unconsciously. Then the purpose of you both may be sometimes impeded or impaired. If you choose Moon hour your mind is ever sensitive and full of hesitation. You may fear to do the right thing or you may rush to do the wrong thing. You may speak what you do not mean or you may intend something different from what others understand. The same effects wait if you take up the week days of the malefic planets. Sometimes you may find it not possible to avoid the wrong timing because of your previous appointments. Hence try to plan things much in advance and try to fix up appointments in good hours. By following this method you will get your things round into a plan. All your affairs will be rearranged. There is power in the arrangement of<\/p>", "images": [], "label": "Page 99"}, {"pdf_page_index": 99, "pdf_page_number": 100, "html": "<p>Wisdom of the Heavens<\/p>\n<p>97<\/p>\n<p>things. You will begin to feel the presence of this power working favourably. YOU have learnt how to calculate the planets that govern the various hours of the seven days of the week. You have also known the effects of the various planetary hours upon the daily events of your life. Now you know how to stimulate your good tendencies by selecting the planetary hours that are good. You have also learnt how to eliminate your bad tendencies by eliminating the bad planetary hours. Now you will have some additional information which is of practical value. It is said that the hours of Sun, Mercury, Jupiter and Venus are good and the hours of Moon, Mars and Saturn are bad. Do not get the idea confirmed that the bad planets are really bad. They only stimulate the bad in you so that it comes out into expression and gets spent up. So, the planets are not at all bad. For those who are born on a Monday, Moon is a good planet and gives good results during the hours of Moon. This is true during those days when the moon is increasing. You can select the Moon hours for journey, change of place of residence in the<\/p>", "images": [], "label": "Page 100"}, {"pdf_page_index": 100, "pdf_page_number": 101, "html": "<p>Wisdom of the Heavens<\/p>\n<p>98<\/p>\n<p>Moon hour when you are ahead of full Moon. This hour is particularly auspicious on Mondays or Fridays. Similarly the Mars hour is good to take up a challenge or a competition for those who are born on Tuesday. This is powerfully good on Tuesdays. Saturday is good to those who are born on Saturday. For them Saturn hour is good especially on Saturdays. It is good to take up any work that requires focusing all the activity towards a particular achievement that requires slow and steady work. Where the work is confined to a place without allowing outdoor activity this is good. Always avoid Sun hour on Saturn days, Moon hour on Tuesdays and Saturdays, Moon hour on Tuesdays and Saturdays, Mars hour on Mondays and Saturdays, and Saturn hour on Mondays and Tuesdays. These combinations cause obstacles and serious problems. Any good planetary hour gives the best results between the 25 th of a month and 18 th of the next month. Between 18 th and 25 th of any month they do not give full benefit. This is because the sun will be changing his sign between these days. Similarly the bad effects of bad<\/p>", "images": [], "label": "Page 101"}, {"pdf_page_index": 101, "pdf_page_number": 102, "html": "<p>Wisdom of the Heavens<\/p>\n<p>99<\/p>\n<p>planetary hours are more powerful between 18 th and 25 th of any month than the other days. Between 28 th of a month and 5 th of the next month the good planetary hours will make you complete any good work quickly. Similarly, between 15 th and 20 th of any month, the same thing happens. During these two periods work will be done and results will be got quickly. During other days, work will be slow. Before you begin to arrange your work according to the planetary hours. You will find that your routine is irregular and random. You work according to the planetary hours and you will find that your affairs begin to come to an order. You will be able to shape the things in the required direction and manage your situations with mastery. This change takes place gradually. It is not a miracle and the changes do not occur in one day. In the beginning you may have some failures because of your previous confusion in expressing your own tendencies. A continuous attempt to tune your work with these planetary hours will rearrange your psychology. It removes your complexes that are self-made. It brings your mind exposed to the planetary vibrations which are free<\/p>", "images": [], "label": "Page 102"}, {"pdf_page_index": 102, "pdf_page_number": 103, "html": "<p>Wisdom of the Heavens<\/p>\n<p>100<\/p>\n<p>from your own moods and impressions of others. Suppositions are the cause of failures because they are made by you and not by the planets. Your tendencies are classified by the planets, purified from your impressions and rearranged according to the plan of the planets. The planets are universal in their values while your impressions are of individual value. When the individual values oppose the plan of this earth and other planets, your values are sure to be defeated, then you will experience what you call failures. Following the planetary hours removes this opposition by neutralising your impressions about your fellow-beings. Impressions produce disharmony in the constitution which causes ill- health. Following the planetary hours also improves your health in course of time since it prevents you from producing unrequired secretions in the body that are stimulated by your own spirit of understanding. Human life is a mesh of various circles of activity like the domestic circle, social circle, official circle and your circle of civic duties and rights. The mesh will be disentangled by following the planetary hours. Each circle is rearranged in its proper place and relationship with the other circles. Arrangement will be the key note of your activity. Then<\/p>", "images": [], "label": "Page 103"}, {"pdf_page_index": 103, "pdf_page_number": 104, "html": "<p>Wisdom of the Heavens<\/p>\n<p>101<\/p>\n<p>everything is calculated without a complex and the routine of the day, year and the span of your life will be like a song in its arrangement and like a poem in its meaningfulness. This leaves nothing to chance. Happiness will be the result and fulfilment will be the experience.<\/p>", "images": [], "label": "Page 104"}, {"pdf_page_index": 104, "pdf_page_number": 105, "html": "<h3 class=\"pdf-heading\">Division of Work According to<\/h3>\n<h3 class=\"pdf-heading\">The Planets in The Seven Days<\/h3>\n<h3 class=\"pdf-heading\">W e have understood the methods to calculate the<\/h3>\n<p>good and the bad hours of the day according to the system of planetary hours. Now we will explain how to divide and group the various items of our work according to the nature of the planets that preside over the seven days of the week. The seven days of any week are presided over each by each planet in the following manner:-<\/p>\n<h3 class=\"pdf-heading\">DAY        PLANET<\/h3>\n<p>Sunday Sun Monday Moon Tuesday Mars Wednesday    Mercury Thursday Jupiter Friday Venus Saturday Saturn<\/p>\n<p>This is universal and this order is followed by every nation in every race, through thousands of years. The<\/p>", "images": [], "label": "Division of Work According to"}, {"pdf_page_index": 105, "pdf_page_number": 106, "html": "<p>Wisdom of the Heavens<\/p>\n<p>103<\/p>\n<p>truth of this system is proved beyond time against any type of criticism and any other intelligent system that is being suggested time and again. The influence of each planet upon each of the above days is beyond doubt, except to those who are born doubters. Ancient Indian Scriptures describe the allotment of the various branches of our work which can be followed on each of these seven days. It is unscientific to believe that some days of the week are good while others are bad. Some people are inclined to believe that Wednesday, Thursday and Friday are good days, because they are presided by benefic planets, while the other days are bad to do anything since they are presided over by bad planets. This is not correct. Every day is fit to do some type of work and we are expected to assort our work according to the nature of work and the material tackled. Here is the system of classification according to the ancient author, Vaśiṣta.<\/p>\n<p>1. The following items if work will be suitable to do on Sundays:- Splendorous gatherings, festivals, allotting big people to do great deeds, auspicious gatherings, to begin any work with service motive, to commence war, to<\/p>", "images": [], "label": "Page 106"}, {"pdf_page_index": 106, "pdf_page_number": 107, "html": "<p>Wisdom of the Heavens<\/p>\n<p>104<\/p>\n<p>commence medical aid, to open dispensaries, handicrafts, working with metals, manufacturing jewelry, plastics, leather ware, lac, cereals, workers and to erect sheds for anything.<\/p>\n<p>2. The following items on Mondays:- Water-works, pearls, glass, sugar cane, silver-ware, milk supply, herbs, gardening, agriculture, dance, music, building plans and anything done through or by women, oysters, conches.<\/p>\n<p>3. The following items on Tuesdays:- Inflammables, fire-works, poisonous materials, weapons, sharp instruments, war implements, threatening, creating differences between two persons or parties, robbery, cheating, manhandling, killing, slotting, blasting, cutting, preparing metal ware,. Parallel industries and playing black magic.<\/p>\n<p>4. The following items on Wednesdays:-<\/p>", "images": [], "label": "Page 107"}, {"pdf_page_index": 107, "pdf_page_number": 108, "html": "<p>Wisdom of the Heavens<\/p>\n<p>105<\/p>\n<p>Pursuits which require skill, communication, transport crafts, arbitration, stadiums, centres of physical culture, circus art, marketing, shopping, clinical work, correspondence, merchandise especially of alloys, jewelry, cutlery and the various studies of mathematics and statistics.<\/p>\n<p>5. The following items on Thursdays:- Ritual, worship, observation of religious duties, auspicious gatherings like marriage etc. preparing and administering nutritives, starting education, transactions of gold and jewelry and valuable clothing, gardening. Starting healing and treatment, scientific researches, competitive attempts, music, dance, and the acquisition of stable and movable assets.<\/p>\n<p>6. The following items on Fridays:- Anything done by or through ladies, music, dealing with pearls, diamonds, fruits, silver-ware, perfumery, furniture, bedroom equipment, jewelry, luxury clothing, ready-made dresses gardening, agriculture, water-works,<\/p>", "images": [], "label": "Page 108"}, {"pdf_page_index": 108, "pdf_page_number": 109, "html": "<p>Wisdom of the Heavens<\/p>\n<p>106<\/p>\n<p>pruning creepers and flower plants business, flower industry and auspicious gatherings.<\/p>\n<p>7. The following items on Saturdays:- Receiving any thing for domestic equipment, stone- work, masonry, bricks, metals like lead, undertaking austerities related to stable assets, starting house construction, establishing long standing institutions, work done by or about donkeys, camels, cattle, evaluation, weights, measures, accounting, auditing, hard labour, overcoming or counteracting something bad, false or criminal. Further it is advised not to take oil bath on Sunday, Tuesday, Thursday, and Friday. The other days prove good for oil bath on Monday it increases the luck, on Saturday it increases the health and wealth.<\/p>", "images": [], "label": "Page 109"}, {"pdf_page_index": 109, "pdf_page_number": 110, "html": "<h3 class=\"pdf-heading\">Moon in the Vedic Tradition<\/h3>\n<h3 class=\"pdf-heading\">A proper understanding of the three principles<\/h3>\n<p>governing the whole creation can be found in the ancient Indian astrological symbolism. The principles are matter, mind and consciousness. The three planets that are the manifestations of these three principles are the earth, moon and the sun in order. The earth represents the matter state of spirit, the moon represents the mind state and the sun represents the consciousness state of the same spirit, which pervades the space globe. The rotation of the earth around itself represents the birth of the individual consciousness. Its rotation around the sun shows us how matter is impregnated by the consciousness to produce the cycles of time which we call the earth years. The rotation of the moon around the earth signifies the reflected light of consciousness which we call mind. The various angles produced by these rotations signify the various phases of mind that govern the beings on the earth.<\/p>", "images": [], "label": "Moon in the Vedic Tradition"}, {"pdf_page_index": 110, "pdf_page_number": 111, "html": "<p>Wisdom of the Heavens<\/p>\n<p>108<\/p>\n<p>New moon and full moon are the two nodal points which represent the ebb and tide of the whole creation on this earth. We find the influence of these two phases upon the mind of the various persons on this earth. Indian astrology has found out correspondences of two different aspects of creation with the new moon and the full moon. 1. The phase of the mind. 2. The periodicities of the cycles of reproduction in the body of a woman. The lunar months that are measured by the new moons and full moons cause the cycles of menstruation and ovulation of the woman. The perfect conjunction of the apparent sun and moon in the sky marks the new moon. The duration of time between two new moons is called the lunar month. This is divided into thirty divisions which are called Tithis (the elongations of the moon). Apart from the days of the new moon and full moon in each month, we have twenty- eight Tithis.<\/p>\n<p>Fourteen of them belong to the white path or the increasing moon, and the remaining fourteen belong to the black path or the decreasing moon. They bear a correspondence with the fourteen Manus conducting the creation of the vast sweeps of time which we call the<\/p>", "images": [], "label": "Page 111"}, {"pdf_page_index": 111, "pdf_page_number": 112, "html": "<p>Wisdom of the Heavens<\/p>\n<p>109<\/p>\n<p>Manvantaras. Each of these elongations has its own influence upon the moods of the living beings of this earth. Many of the beings of the earth are but the sons of the earth, and are bound by the moods of the mind, before they can dream of the possibility of mastery over the mind and the senses. Many of them cannot remember themselves different from their mind and senses and hence the objects of the puppet show in the hands of the moon phases. Ancient Indian astrology knows much of the influences of these Tithis upon the individual minds. Some of them are desirable and some are not, according to the vibrations of either concord or discord they produce in the minds of the individuals. Even this, they do not produce by themselves, but they stimulate that which is in store as the aggregate of the tendencies, which are but the result of the force of habit which we call karma. It is more powerful than intelligence, knowledge and reasoning, since it conditions the nature of the individual which is the triangle of forces formed according to the ratios of the three Guṇas proposed by himself during his reactive response of the past births. The moon phases or the Tithis stimulate the corresponding activity which holds that particular group of tendencies. The result is that,<\/p>", "images": [], "label": "Page 112"}, {"pdf_page_index": 112, "pdf_page_number": 113, "html": "<p>Wisdom of the Heavens<\/p>\n<p>110<\/p>\n<p>everyone reacts to the environment according to the nature of the Tithi, irrespective of what he knows. A rich man spends his money not according to the need but according to his nature. It may be an organised utilisation or a criminal waste. The same is the case with the human span, the vital force, and the value of the environment. All the splendour of our environment is subject to one’s own use or misuse. Thus the Tithis play the role of the strings of a musical instrument, which can be played by a good or a bad musician. Since it requires practical training to become a good musician, God finds that the majority of the creative beings are bad musicians playing the notes of discord and suffering. Everyone does things not according to the need but according to convenience or desire. The result is that many people feel the effects of what they do under the influence of the Tithis in a different manner. The ancient seers like Nārada, Parāśara, and Vaśiṣṭa gave their observations and verdicts about the effects of these Tithis. Their teachings are recorded by the subsequent followers in the form of Saṃhitas (collections) with the degree of accuracy according to their ability to receive the teachings from those great lights. Leaving sufficient margin to the possibility of error that belongs to the<\/p>", "images": [], "label": "Page 113"}, {"pdf_page_index": 113, "pdf_page_number": 114, "html": "<p>Wisdom of the Heavens<\/p>\n<p>111<\/p>\n<p>composers, still we have an imaginably abundant bulk of teachings that can guide the whole humanity safely through the ravages of its idiocy to the goal of ‘the one grand liberation’.<\/p>\n<p>The new moon and the full moon create a great disturbance of mind to the majority, and the necessity and opportunity to rearrange things and better equip themselves for those who have mastery over their own moods. Generally, it is advised that no one should travel or make a beginning of any important affair of a stable and long-standing nature on the day of the full-moon and new- moon. Is it not foolish to take up a class and conduct teaching for a professor, while he is running on the streets? Similarly, he is a fool who launches a new program on the day of the full moon and the new moon. These are the days on which he is expected to receive his new program and understand it in terms of its fitness and his own fitness to it. According to the Purāṇas, one is expected to renew his contact and re-establish his transaction with the Dēvas and Pitrus that are working within and without continuously. He is expected to know his plan for the month during these two days. Hence they are called Parvas (nodal points which are considered<\/p>", "images": [], "label": "Page 114"}, {"pdf_page_index": 114, "pdf_page_number": 115, "html": "<p>Wisdom of the Heavens<\/p>\n<p>112<\/p>\n<p>holy). We have a similar explanation for all the remaining fourteen days.<\/p>\n<p>As mentioned previously, we have much information about the lunar elongations (called Tithis), found in the ancient scriptures and their commentaries. The Vēdic literature provides heaps of valuable information about the Tithis. We can broadly divide the whole information mainly into three groups:<\/p>\n<p>I. That which is available in the astrological books called Saṃhitas. II. that which is found in the Purāṇas, III. and that which can be gathered from the Vēdic<\/p>\n<p>texts, Brāhmaṇas and Upaniṣads. The first section is direct and easy to comprehend though it is a bit conventional and the actual information not being very deep. The second section is exhaustive and profound, but we have to divulge many symbols and extract the significance there from. The structure of the theory of Manvantaras should be properly understood to have a broad comprehension of the significance of Tithis<\/p>", "images": [], "label": "Page 115"}, {"pdf_page_index": 115, "pdf_page_number": 116, "html": "<p>Wisdom of the Heavens<\/p>\n<p>113<\/p>\n<p>from the Purāṇas. The fourteen Manus correspond with the fourteen Tithis between the new moon and the full moon. There is a detailed description of the careers of Manus, their ruler ship, marriages, children, descendants, and their deeds in detail. All these things correspond with the many effects of each Tithi. The process of divulging requires elaborate research, but it is at the same time profitable of the yield. The third section is really very deep and profound. It gives the right keys to divulge the secrets of correspondence between the microcosm and macrocosm. For example, the new moon educates us about the periods of menstruations and the full moon about the ovulation of the woman. It provides us with the real key of fertilisation and re-production. It also informs us when to reproduce and when not to reproduce, and also when it would be futile. Now let us deal with the information of the three sections separately, in detail. The information of the Saṃhita: Parāśara names the Tithis in the following manner:<\/p>\n<p>1. Nanda 2.Bhadra 3. Jaya 4.Rikta 5.Pūrṇa 6.Māsa 7. Mitra 8.Mahābala 9.Ugrasēna 10. Sudhanva<\/p>", "images": [], "label": "Page 116"}, {"pdf_page_index": 116, "pdf_page_number": 117, "html": "<p>Wisdom of the Heavens<\/p>\n<p>114<\/p>\n<p>11. Sunanda 12.Yama  13.Jaya     14. Ugra  15.Siddhi It is said that the fourth, sixth, twelfth and fourteenth are found to yield unfavourable results, while Mahābala is strongly favourable or unfavourable. The rest of Tithis are found to be auspicious when observed for all good purposes. These Tithis are counted starting with the day after new-moon or full-moon.<\/p>\n<p>Varāhamihira makes a grouping of the above Tithis in the following manner:<\/p>\n<p>1, 6 and 11 called Nandas; 2, 7 and 12 are called Bhadras; 3, 8 and 13 are called Jayas; 4, 9 and 14 are called Riktas; 5, 10 and 15 are called Pūrṇas. Among these, the Nandas are good for pleasurable purposes. Bhadras are good for starting treatment, appointing subordinates and inferiors, especially those who look after watch and ward. Jayas are good to begin something for success and competition. Always the Riktas yield bad result due to negligence, mistakes and carelessness. Pūrṇas yield good results when the work for the public good is undertaken. They are also favourable for sacred rites, Vratas and Yōga<\/p>", "images": [], "label": "Page 117"}, {"pdf_page_index": 117, "pdf_page_number": 118, "html": "<p>Wisdom of the Heavens<\/p>\n<p>115<\/p>\n<p>practice.  Varāhamihira has ascribed the following Lords to the Tithis:<\/p>\n<p>1. Brahma for Nanda, 2. Vidhāta for Bhadra, 3. Viśṇu for Jaya,  4. Yama for Rikta, 5. Chandra for Pūrṇa, 6. ṣaṇmukha for Māsa, 7. Indra for Mitra, 8. Vasu for Mahābala, 9.Sarpa for Ugrasēna, 10.Dharma for Sudhanva, 11.Rudra for Sunanda, 12. Āditya for Yama, 13. Manmatha for Jaya, 14.Kāli for Ugra and 15.Visvēdēvas for siddhi. The names for the presiding deities may be according to an ancient tradition, which is not in vogue at present. The significance of each of the presiding deities and the details of the results can be studies and enumerated with the hope of the help of the Purāṇic and the Vēdic lore. Before doing this, we should take into account the month also. This gives twelve sets of results according to the zodiac signs in which the sun and the moon are placed on each Tithi. The twenty eight or twenty seven lunar mansions called Nakṣatras are also to be taken into account. Each Nakṣatra manifests its own qualities when the planets go through it. This is particularly so when the moon passes through a Nakṣatra every month. The agricultural produce<\/p>", "images": [], "label": "Page 118"}, {"pdf_page_index": 118, "pdf_page_number
