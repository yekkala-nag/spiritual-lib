": 119, "html": "<p>Wisdom of the Heavens<\/p>\n<p>116<\/p>\n<p>and the rate of human births in each month depend upon the combination of the Tithi and the Nakṣatra. The tides of the ocean, days of fishing, and the rise and fall of prices in the market depended upon the same factors. The structure of the orthodox Indian Alamance is based upon these combinations. There are certain Nakṣatras through which the sun and the moon pass, when it is full moon and new moon. These Nakṣatras are considered to be especially significant and more powerful than the rest of wielding their influence upon the biological kingdom of the earth.<\/p>\n<p>Form the time of one new moon to the next, the journey of the moon is divided into four quarters. The first quarters starts with the new moon. The second quarter starts with the increasing half-moon. The third quarter begins with the full moon. The fourth quarter begins with the decreasing half-moon. These four points are the four nodal points in the lunar month, and they wield much influence upon the moods of the mental beings on this earth. The mental beings are called Mānavas or the children of Manu. (The Dēvas, Pitrus and other beings that work out the plan of the earth are not mental in their<\/p>", "images": [], "label": "Page 119"}, {"pdf_page_index": 119, "pdf_page_number": 120, "html": "<p>Wisdom of the Heavens<\/p>\n<p>117<\/p>\n<p>existence and are hence not classed as the children of Manu). These four nodal points bear correspondence with the four nodal points of the solar year as follows:<\/p>\n<p>1 The New moon corresponds with the winter solstice. 2 The increasing half-moon corresponds with vernal equinox. 3 The full moon corresponds with the summer solstice. 4 The decreasing half-moon corresponds with the autumnal equinox. Hence these four nodal points respectively correspond with the beginning of Capricorn, Aries, Cancer and Libra. The 90 degrees of each quarter can be divided into three parts of 30 degrees each when each of the divisions corresponds with a sign in the zodiac. When this information is also supplemented, we get many keys to solve the secrets of prediction and astrological selection of timings.<\/p>", "images": [], "label": "Page 120"}, {"pdf_page_index": 120, "pdf_page_number": 121, "html": "<p>Wisdom of the Heavens<\/p>\n<p>118<\/p>\n<p>Each day is also divided into four quarters of six hours each, starting with the sunrise. Then the correspondence will be as follows:<\/p>\n<p>1. The sunrise corresponds with the half-moon increasing<\/p>\n<p>2. The moon corresponds with the full moon<\/p>\n<p>3. The sunset corresponds with the half-moon decreasing<\/p>\n<p>4. The midnight corresponds with the new moon.<\/p>", "images": [], "label": "Page 121"}, {"pdf_page_index": 121, "pdf_page_number": 122, "html": "<h3 class=\"pdf-heading\">Astrological Tradition<\/h3>\n<h3 class=\"pdf-heading\">T he history of any Science is as valuable as itself and<\/h3>\n<p>the history of astrology works as an eye opener to the many free thinkers of the world. The present age is ready with its laurels to anyone, who can keep his thinking free in the presence of the many facts of a time plotting nature. The western mind is specially fitted to gather available facts and make a history of any subject out of it. Of late we find remarkable books on astrology which include a historical survey of the science of astrology, but unfortunately to an average western mind the history of any science means the development of that particular science among the western nations. The same defect lies with the astrological survey of a white man. There are certain limitations working upon his mind in the shape of confirmed opinions. One of them is that the oriental races received astrological concepts from the ancient Greeks. This is a misconception of a high order and it is due to a general lack of familiarity with the oriental tradition. The Astrological Wisdom of India dates far back to a remote<\/p>", "images": [], "label": "Astrological Tradition"}, {"pdf_page_index": 122, "pdf_page_number": 123, "html": "<p>Wisdom of the Heavens<\/p>\n<p>120<\/p>\n<p>period when there was no Greek nation as such. Tradition proves it and the scriptures of India prove it at every step to substantiate this statement. Let us try to trace the differences between the eastern and western traditions of Astrology. 1. The concept of the 12 signs of Zodiac is the only definite scientific concept to the western nations. According to the Astrology of ancient India (which is quoted different from the popular astrological tradition of India), the theory of Zodiac runs as follows: 2. You can divide the path way of the planets and the sun into as many equal divisions as possible. Then each type of division reveals a set of readings which belong to a particular aspect of life expression. For example, the whole zodiac is divided into two equal parts which serve us as two signs revealing the lunar and solar expressions of life force. The terms ‘lunar’ and ‘solar’ do not denote the luminary bodies of the Sun and the Moon. These terms denote the two expressions of creation, the active and the passive. They represent the exhalation and the inhalation of the one consciousness that governs the year and that<\/p>", "images": [], "label": "Page 123"}, {"pdf_page_index": 123, "pdf_page_number": 124, "html": "<p>Wisdom of the Heavens<\/p>\n<p>121<\/p>\n<p>serves the function of the creator to the beings on this earth. Similarly, the whole Zodiac of 360 o can be divided into 3 equal parts, when it is called the Zodiac of 3 signs. This will enlighten you about the response of a particular individual to the concept of past, present and future, to the concepts of three dimensions of perception (observer, observed and observation), the correlation between the three expressions of energy (dynamism, inertia and poise), the three interpenetrating planes of objective existence (matter, force and consciousness) and the three sproutings of the seed of wisdom (individual consciousness, cosmic consciousness and the path of unfolding or becoming in between). Each of these three signs is subdivided into three when we get a Zodiac of 9 signs. This reveals the response of the individual to the creative intelligences (DEVAS) whose seeds function as the numerical potencies (the nine number gods are called Prajāpatis or Progenitors). Each of these subdivisions is again subdivided into 3 equal parts making a Zodiac of 27 equal divisions which<\/p>", "images": [], "label": "Page 124"}, {"pdf_page_index": 124, "pdf_page_number": 125, "html": "<p>Wisdom of the Heavens<\/p>\n<p>122<\/p>\n<p>are popularly called Nakṣatras. (In fact the term ‘Nakṣatra’ is commonly used for any regular polygon formed by the equal division of Zodiac of any magnitude. Hence, all these divisions of all types come under the general term Nakṣatra. In course of time the term is restricted to the division of 27 equal parts). These 27 divisions are described as the wives of lunar deity for the fact that they correspond with the average number of days, of one revolution of the Moon, the Lord of fertilisation, germination and fecundity. You can find all the keys of the wisdom to know the time scales of biological kingdom of this earth which includes the prenatal epoch, the longevity and the cycles of rebirths besides the cycles of plant life and the fruition of the various seeds and of the various deeds of an individual. The circle of the Zodiac is again divided into 4 equal parts of 90 o each. This explains us about the mode of response of an individual to the 4 layers of consciousness (the individual awakening, the sleep, the dream and the awareness of the individual to the background consciousness). These 4 aspects of consciousness work as the 4 petals of the unfolding consciousness compared in<\/p>", "images": [], "label": "Page 125"}, {"pdf_page_index": 125, "pdf_page_number": 126, "html": "<p>Wisdom of the Heavens<\/p>\n<p>123<\/p>\n<p>the scriptures with the sacred Lotus from which Brahma, the 4 - faced creator sprouts and expands into his realisation as Brahman, the cosmic consciousness i.e. within and beyond the unit creation. This division of the Zodiac gives a practical key to the individual to expand into the absolute consciousness beyond all limitations that work upon him as his concepts of the absolute.<\/p>\n<p>According to the Vēdic tradition, the apparent path of the Sun and planets with the horizon is divided into five equal parts, each of which can be called a sign of the zodiac. The Ascendant at the birth (Lagna) is taken as the starting point and the whole zodiac of 360 degrees is divided into five equal parts of 72 degrees each. Then we get the five signed or the five housed horoscope in the shape of a five pointed star. In the Vēdas, this is called the Pentateuch of the Pitrus. The Pitrus are the group of Dēvas on the cosmic, planetary and the solar scales of creation. They preside over the coming down of souls into physical bodies, constructed by the matter which is filled with the myriads of souls in the name of atoms and cells. The five-pointed star in the horoscope gives you a clue to understand your productivity on the biological plane. The<\/p>", "images": [], "label": "Page 126"}, {"pdf_page_index": 126, "pdf_page_number": 127, "html": "<p>Wisdom of the Heavens<\/p>\n<p>124<\/p>\n<p>possibility of begetting children, the possible number of children that are to be born to an individual (in the case of a female horoscope) and the type of children that are to be born are properly estimated and understood according to this division. Any deficiencies in the childbirth and the congenital defects of children that are going to occur due to the health conditions of the individual are also understood through this chart. The position of planets in one of the five above said division gives us the nature and temperament of the children and the care that is to be taken to rectify defects.<\/p>\n<p>The solar year is divided into five equal parts like this and they are understood as the five seasons of productivity. Śatapatha Brāhmaṇa describes this in detail. Some hymns in the Suparṇa Sūkta of the Rig Vēda give us good aphorisms to apply this astrological aspect in the seasons and to the individual horoscope as well. The whole of the solar year forms five centres to a given place and through these centres the place receives the energies of the five states of matter that are converted into the matter of various kingdoms of the earth. The whole concept is highly scientific and the forgotten tradition is to<\/p>", "images": [], "label": "Page 127"}, {"pdf_page_index": 127, "pdf_page_number": 128, "html": "<p>Wisdom of the Heavens<\/p>\n<p>125<\/p>\n<p>be built, once again before the modern astrologer can understand anything out of it.<\/p>\n<p>Again the circle of 360 degrees of the zodiac is divided into 6 equal parts which form six signs of the zodiac in another application. These divisions are called Ritus or the seasons. Ancient Indian astrology described six seasons in the year. The duration of each season is about 60 days. They are: 1. The spring which runs from March 21 st to May 21 st 2. Summer which runs from May 21 st to July 21 st 3. The Rainy season which runs from July 21 st to September 21 st 4. Sarath or the Moon’s season which runs from September 21 st to November 21 st 5. The winter season which runs from November 21 st to January 21 st 6. The Season of Leaf-Fall which runs from January 21 st to March 21 st . Of course, this computation of the zodiac holds good only to the countries that fall within the tropical zone. According to this, the seasons are decided and the service<\/p>", "images": [], "label": "Page 128"}, {"pdf_page_index": 128, "pdf_page_number": 129, "html": "<p>Wisdom of the Heavens<\/p>\n<p>126<\/p>\n<p>of man to the productivity of the earth is conducted in the name of agriculture and garden farming. In ancient days, agriculture was a ritual which meant many things other than bread. It meant a duty to man towards the element of earth and the training of man to tune himself towards his duties to the plant kingdom. A symbiosis was expected to be established by a man between himself and the plant on one side and between himself and the animals on the other side. Agriculture and garden farming were together considered to be the training required for man to understand the law of life and to practise the path of getting his subsistence out of the fellow organisms while himself being useful to them. Since the bull was used for tilling and the cow was used for milk, the pair was symbolised as the Sun and the earth respectively. Agriculture involves the training for the co-existence of man with the fauna and the flora of the earth under the guidance of the awareness of the brotherhood of life. According to Janaka, the tiller-King, man cannot lead a perfect life of realisation until he submits himself to the ritual of agriculture. Since the concept of this ritual abounded the life of the lawful citizen of the earth, there was such development in the astrological science applied<\/p>", "images": [], "label": "Page 129"}, {"pdf_page_index": 129, "pdf_page_number": 130, "html": "<p>Wisdom of the Heavens<\/p>\n<p>127<\/p>\n<p>to agriculture in those days. For this purpose, the zodiac of the seasons was studied in detail. Even today, the orthodox Indian knows about the cycle of six seasons, their application and significance.<\/p>\n<p>The zodiac of 27 equal divisions which still exists in India in the name of Nakṣatras was also used as a supplementary fragment of knowledge about the ritual of agriculture. As the sun passes through each of the 27 equal divisions, it takes about 13 days and odd. Each such division is called a “Kārti”. The term “Kārti” means ‘scissoring’ which means dividing the zodiac into 27 equal parts starting with ‘Krittika’ the first big scissoring which starts with Meṣa (Aries-Zero). Of course, there is confusion about this in the subsequent centuries, when the latter astrologers (who were mere calculators without the concept of bodies in the heavens) called the first division ‘Aśvini’ instead of ‘Krittika’. The confusion was due to the false concept of a stable zodiac which is different from the one that is annually marked by the point of vernal equinox. The sun passing through the 27 Kārtis influences the crust of the earth in terms of fertility and productivity. He also influences the wind currents by<\/p>", "images": [], "label": "Page 130"}, {"pdf_page_index": 130, "pdf_page_number": 131, "html": "<p>Wisdom of the Heavens<\/p>\n<p>128<\/p>\n<p>regulating the temperature in the atmosphere according to the seasonal effects. According to this computation of Kārtis, the ancients marked the astrological calendar for reaping, sowing, harvesting, heaping and tending their cattle. According to the effects studied each Kārti is described as having a presiding deity. The deities are as follows:<\/p>\n<p>1. Agni for Krittika 2. Prajāpati for Rohiṇi 3. The deer’s head of Prajāpati for Mrugaśira, some interpret  it, that the Moon is the Lord of Mrugaśira 4. Rudra is the Lord of Ārudra 5. Aditi for Punarvasu 6. Angiras for Puṣyami 7. Serpent for Āślēṣa 8. Pitrus for Makha 9. Bhaga for Pūrvaphalguṇi 10. Āryama for Uttaraphalguṇi 11. Savita for Hasta 12. Twaṣṭa for Chitra 13. Vāyu for svāti 14. Indra-Agni for Viśākha<\/p>", "images": [], "label": "Page 131"}, {"pdf_page_index": 131, "pdf_page_number": 132, "html": "<p>Wisdom of the Heavens<\/p>\n<p>129<\/p>\n<p>15. Mitra for Anūrādha 16. Indra for Jyēṣṭa 17. Asura for Mūla 18. Waters for Pūrvāṣāḍa 19. ViśvēDēvas for Uttarāṣāḍa 20. Viśṇu for Śravaṇa 21. Vasus for Dhaniṣṭa 22. Varuṇa for Śatabhiṣa 23. Aja, the one legged for Purvābhādra 24. Ahirbudhni for Uttarābhādra 25. Pūṣa for Rēvati 26. The pair of Aśvins for Aśvini 27. Yama for Bharaṇi<\/p>\n<p>These names had been coined by the ancient astronomers of the Vēdic centuries according to the effects they produce upon the fertility in the crust of the earth and the current of winds that are regulated by the Sun travelling through the concerned degrees of each division. In the original chart, described in the Vēdas, there were two types of divisions:<\/p>\n<p>1 The set of 28 equal divisions and 2 The set of 27 equal divisions<\/p>", "images": [], "label": "Page 132"}, {"pdf_page_index": 132, "pdf_page_number": 133, "html": "<p>Wisdom of the Heavens<\/p>\n<p>130<\/p>\n<p>The first set included Abhijit, presided over by a Dēva called Gandharva. The first set of 28 divisions is out of use while the second set of 27 divisions is still in vogue in the Indian Calendars. In fact, these two sets form two different divisions of the zodiac for two specific purposes. The first set of 28 depends upon the four equal divisions of the zodiac x 90 degrees each (forming the first cross joining the arms which formed the first square). Each of the 90 degrees sectors subtended seven Nakṣatra divisions. The four sectors included 4 x 7 = 28. The second division of 27 equal arcs depends upon the trisection of the zodiac. The whole zodiac is divided into the equal parts forming a triangle, each side of the triangle contains 120 degrees which subtend 9 equal divisions each.  The three sides of the triangles include 3 x 9 = 27 divisions.<\/p>\n<p>The passage of the Sun through each Nakṣatra included an average period of 13 days duration, and each is called a Kārti. Along with the cuspal periods the Sun describes the solar year of 365 and odd days while he travels through the 27 Kārtis. Each of these Kārtis is<\/p>", "images": [], "label": "Page 133"}, {"pdf_page_index": 133, "pdf_page_number": 134, "html": "<p>Wisdom of the Heavens<\/p>\n<p>131<\/p>\n<p>presided over by a deity, who is characteristic of seasonal effects of that particular Kārti upon the fauna and flora of this earth.<\/p>\n<p>For example:<\/p>\n<p>1. The Sun passing through the Krittika marks the kindling of the fire of life on this earth through the solar ray in the form of summer. 2. Rohiṇi marks the incidence of the solar ray through the eye of the bull. During this period the minerals of the earth get charged and fertilised by the various creative activities of the solar energy. The Bull is the symbol of fertilisation. 3. The Kārti of Mrugaśira marks the period of first showers upon the fertilised earth. During these days the Indian farmer begins his work in the fields, following the first showers. 4. Ārudra marks the period of Rudras who preside over the five senses of the belonging to the animal and human kingdoms. These degrees mark the conception and the development of the senses. 5. The Kārti of Punarvasu is characterised by the Mother Goddess of Earth named Aditi, the Mother Ceres of<\/p>", "images": [], "label": "Page 134"}, {"pdf_page_index": 134, "pdf_page_number": 135, "html": "<p>Wisdom of the Heavens<\/p>\n<p>132<\/p>\n<p>Greek mythology. She presides over the phenomenon of the first crops springing up. 6. The Kārti of Puṣyami is presided over the Angiras, the sound principle of space which exists as the charge of the clouds descending into the atoms of the earth like thunder. It presides over the sense of hearing in animals and humans and the formation of food essence in the plants. Life in the form of electricity descends into the plants as the functions of chlorine to form chlorophyll, the green pigmentation of the plants which stores the solar energy as food material through photosynthesis. Sound vibration affects the human and animal kingdoms through the arrangements of the lines of force which enable the animals and human to assimilate the food of the plants and keep up the metabolic activity. The sound vibrations we produce, work as vehicles of communication in the form of language. They also set up the release of energy in the form of electricity which produces the capacity to assimilate the food. 7. The Kārti of Āślēṣa affects the storage of energy into the forms of matter with its fundamental units as spirals which settle down in coiled patterns like the<\/p>", "images": [], "label": "Page 135"}, {"pdf_page_index": 135, "pdf_page_number": 136, "html": "<p>Wisdom of the Heavens<\/p>\n<p>133<\/p>\n<p>bodies of serpents. Hence the fundamental unit of vital force exists as Kundalini principle in the matter. 8. The Kārti of Makha is presided over by the formation of the first grains among the plants and the formation of the seminal tissue in animals and humans. These are the means of the production and reproduction of the tissues. For this reason, the Pitrus or the reproductive Gods preside over this Kārti. It is also interesting to note that this Kārti falls in the sign of Leo, the fifth of the zodiac, which denotes romance and offspring. 9. The period of Pūrva Phalguṇi marks the production of the stalk of the grains and plants. It also marks the formation of the vertebral column in the embryo. 10. The Kārti of Uttara Phalguṇi marks the formation of the nodes in the plants of the cereal and the various bones of the vertebral column and the ribs in the animals and humans. 11. Hasta indicates the formation of the ears of corn and the formation of the hands in the human embryo. This Kārti imparts the capacity to grip (which is characteristic of the human beings) and is symbolised by the trunk of the elephant. Lord<\/p>", "images": [], "label": "Page 136"}, {"pdf_page_index": 136, "pdf_page_number": 137, "html": "<p>Wisdom of the Heavens<\/p>\n<p>134<\/p>\n<p>Ganēśa, the Purāṇic prototype of the Vēdic God Savita is worshipped here. 12. The Kārti of C̣itra is presided over by the divine etcher and carpenter, Tvaṣṭa. This marks the formation of the shapes of the various grains preserving the shapes and careers of their parents for their germination into posterity. In the human and animal kingdom, this imbeds the power to preserve the species. 13. The Kārti of Svāti indicates the splendour of the season of Śarat. During the season many of the cereals strengthen the seed while the ears of corn are well-formed and gather grain in them. The days are good to sow certain seeds and to reap certain harvests. It is good to take up a journey on important business, to start a political campaign or to declare war. Preparing weapons and jewels is also done under this division. 14. The Kārti of Viśākha is good to gather grains, to collect money, articles or goods, to get decorative material and house equipment. Purchase of food grains, vehicles, carts, artistic pieces is also done here.<\/p>", "images": [], "label": "Page 137"}, {"pdf_page_index": 137, "pdf_page_number": 138, "html": "<p>Wisdom of the Heavens<\/p>\n<p>135<\/p>\n<p>15. The Kārti of Anūrādha is good to settle and perform marriages, thread marriages, to conduct big journeys, pilgrimages, to build temples, ritual halls and houses. 16. The Kārti of Jyēṣṭa should be selected for competition to defeat the enemy, to file a civil suit in the court, to wage a war, to play a break between two enemies, to prepare weapons, to open fireplaces, kitchens and furnaces, to inaugurate activities of mining, metallurgy, goldsmithy and blacksmithy. It is also good to begin learning fine arts. 17. In the Kārti of Mūla, it is good to construct farmyards, granary houses, agricultural implements, aforestation, planting of commercial trees, digging wells, lakes and tanks, reaping some cereals, preparing idols for the temple and architecture. 18. In the Kārti of Purvāṣāḍa, it is good to learn cheap magic like jugglery, imprisoning the culprits, crime detection, digging wells, lakes and tanks inflicting various kinds of punishments, cutting the trees, hunting wild beasts etc. 19. The Kārti of Uttarāṣāda is good to start austerities, appeasing rites, rituals, auspicious functions like<\/p>", "images": [], "label": "Page 138"}, {"pdf_page_index": 138, "pdf_page_number": 139, "html": "<p>Wisdom of the Heavens<\/p>\n<p>136<\/p>\n<p>marriages, purchasing fancy, stationery, antiques, clothing, house planning, lighting the houses and thread marriages. 20. The Kārti of Śravaṇaṃ is good to perform thread marriages, the first haircut of the child, to make arrangement for water supply, to purchase cattle, horses and vehicles, to build temples, farm-yards, military bases, to grow gardens, parks, forests and to cut stones. 21. The Kārti of Dhaniṣta is good for war preparation, making jewellery, purchasing animals and vehicles, to prepare weapons, to build boats, launches and ships, to begin trade with pearls and silver. 22. The Kārti of Śatabhiṣam is good to begin life-risking professions like military training, wrestling, boxing, judo and circus. It is also good for the trade and purchase of the earthenware, metalware, to purchase cattle and to improve farmyards. 23. In the Kārti of Purvābhādra, it is good to arrange marriages, austerities, rituals, to construct temples, public houses, jewellery shops, cloth shops, to entire new houses and perform holy baths.<\/p>", "images": [], "label": "Page 139"}, {"pdf_page_index": 139, "pdf_page_number": 140, "html": "<p>Wisdom of the Heavens<\/p>\n<p>137<\/p>\n<p>24. In the Kārti of Uttarābhādra, it is good to renovate or decorate various places, temples, parks and lakes to construct new houses to perform marriages, thread marriages and all other auspicious gatherings. 25. In the Kārti of Rēvati, it is good to perform all auspicious gatherings, rituals, worshipping and austerities. 26. In the Kārti of Aśvini, it is good to take up journeys, long tours, picnics and expeditions. Also, it is good for treatment, beginning of education, purchase of animals, artistic pieces, cloths and decorative material. 27. In the Kārti of Bharaṇi it is good to start shooting, hunting, driving, fighting, wrestling, boxing, judo, circus and anything of risking nature.<\/p>", "images": [], "label": "Page 140"}, {"pdf_page_index": 140, "pdf_page_number": 141, "html": "<h3 class=\"pdf-heading\">Cataclysms and Astrology<\/h3>\n<h3 class=\"pdf-heading\">W hen the elements are in balance, there is the birth<\/h3>\n<p>of beings on this earth as it is on any other planet. As long as the cyclic movement of the planets bears rhythm and harmony, we find that the beings on this earth evolve in their natural order and succession. These evolved beings live happily in their own level of comprehension and happiness. When the wind is pleasant, when the ocean throws no tide to sweep are in their usual pleasant mood, accepting the happy co-existence of the fauna and flora of the earth, we too feel happy in our way. Then we forget for a while that we are living at the mercy of the equilibrium of nature’s forces. In fact we, the human beings, forget the very existence of Nature and elements just as we forget the existence of our breath and heart- beat. For a time we forget that we are travelling in a space upon the round surface of the space-ship which we call the earth piercing through the whirls of the winds of the atmosphere amidst the spirals of the magnetic currents of the poles and the electric current which we call life, continuously being produced by the presence of the<\/p>", "images": [], "label": "Cataclysms and Astrology"}, {"pdf_page_index": 141, "pdf_page_number": 142, "html": "<p>Wisdom of the Heavens<\/p>\n<p>139<\/p>\n<p>apparent path of the sun and other planets. Many people, including Scientists, astronomers and astrologers, forget that we are moving with a tremendous speed and believe falsely that they are stable on the surface of earth sitting in their chairs and reading the morning newspapers. A little child feels secure from thieves robbing the house by closing its eyes in the lap of the granny. When a ship makes its way on the surface of the mid-oceans during dark nights, the passengers feel secure in their cabins and take a comfortable sleep. It is the captain and the crew who know the actual position and hold the duration twined with responsibility. Same is the case with the human beings that inhabit this earth. When once the time of re-adjustment commences, man finds storms, earthquakes, landslides and what not. For the first time, he begins to feel the very existence of the elements continuously worked out by Nature. A limited number of evolved beings feels the responsibility to take up the work of captains and crew to their fellow human beings. Time and again they have studied and tabulated the causes and effects that occur according of Nature’s forces and their higher causation. The result is the birth and evolution of sacred sciences like astrology.<\/p>", "images": [], "label": "Page 142"}, {"pdf_page_index": 142, "pdf_page_number": 143, "html": "<p>Wisdom of the Heavens<\/p>\n<p>140<\/p>\n<p>The Zodiacal signs mark the periodicities of the four elements in Nature-Fire, Earth, Air and Water-in their succession. The signs of Aries, Leo and Sagittarius give expression to the element of fire; Taurus, Virgo and Capricorn mark the element of Earth; Gemini; Libra and Aquarius are signs of Air; Cancer, Scorpio and Pisces indicate Water. As the planes go round along the path of the Zodiacal sign, they stimulate the manifestation of the phenomena of these four elements as far as our earth is concerned. The planets also represent these four elements in the following order: -  Sun and Mars represent Fire; Moon and Saturn represent Water; Mercury and Uranus represent Air; Jupiter and some functions of Saturn represent the Earth. Venus partly represents Earth and partly water; Neptune represents the Water of the oceans and clouds; Pluto represents space and the concept of Void from which all the Program of re-arrangement of the elements if framed.<\/p>", "images": [], "label": "Page 143"}, {"pdf_page_index": 143, "pdf_page_number": 144, "html": "<p>Wisdom of the Heavens<\/p>\n<p>141<\/p>\n<p>In nature, energy flows through lines of force that are produced by the mind of a planetary body or the mind of an individual on any planet. These lines of force arrange into patterns or designs accordingly. If the expression of the mind is harmonious, these patterns are geometrical and uniform. If the expression of force is not uniform, the patterns formed are also not uniform. Uniform patterns of force are constructive while others are destructive. As the planets from various aspects like the Trine, Sextile or Semi-Sextile, they indicate uniform patterns while Squares and Oppositions indicate those that are not uniform. A uniform pattern produces creative expressions to the elements of this earth while others produce destructive nature on this earth. In fact, all the destructive phenomena are attempts for re-adjustment in the mind of the solar system. Whenever there is a disturbance in the phenomena of this earth. The stabler planets bearing a Square create a deeper and more impressionable disturbance than the speedy planets. Squares between any two of the stabler planets (Jupiter, Saturn, Uranus and Pluto) produce a strong disturbance that can be observed or felt by the people of a<\/p>", "images": [], "label": "Page 144"}, {"pdf_page_index": 144, "pdf_page_number": 145, "html": "<p>Wisdom of the Heavens<\/p>\n<p>142<\/p>\n<p>place in Nature. Mars, Saturn, Uranus, and Neptune produce these cataclysms in Nature when they stand in exact Squares. At the time of the recent cyclone which occurred in Andhra Pradesh, India on 19/20 th November, 1977, we find two Squares among the planets, the stabler ones involved. Mars was there in Square with Uranus and Sun was there in Square with Saturn. Varāhamihira explains in Bṛhat Samhita that Squares between planets occurring in stable signs (Taurus, Leo, Scorpio and Aquarius) cause cataclysms like gales, cyclones and earthquakes. Leo and Scorpio are involved here. As per the location, we have to trace the Ascendants of the various places. Those areas having the Ascendant of Leo or Scorpio will be directly hit by the cataclysm. Such type of scientific observations should be used more to anticipate sufficiently before and warn than to show verification after the incident occurred. (Even though information below is related to year 1978, it is presented here to illustrate what kind of planetary aspects indicate calamities) We will try to understand planetary configurations that indicate any such ill- balanced state of the elements<\/p>", "images": [], "label": "Page 145"}, {"pdf_page_index": 145, "pdf_page_number": 146, "html": "<p>Wisdom of the Heavens<\/p>\n<p>143<\/p>\n<p>during the year 1978: To the dismay of those who are afflicted by the disturbances of the storm in 1977 and much to the cruel pleasure of the astrologers making a post marten of the situation as indicated by planets, we find many wise discourses of the astrologers about the already finished destruction as to how and why such a planet could cause this mischief or that calamity. Let us try to understand if there is a similar indication of the planets in the future months and if so let us learn how to escape from or minimise the danger or the loss. During the second and third weeks of May, 1978, we find such a disturbance once again. The position of planets according to sayana longitude on May 14 th is as follows: Aries : 27°,43  ‘ Mercury Taurus :  23 °, 23 ’ Sun. Leo : 14° - 12 ’ Mars. Leo : 14° - 15’ Moon. Libra : 14°- 24 ’ Pluto Sagittarius: 17° - 35’ Neptune. Gemini :  20° - 51 ’ Venus. Cancer :  5° - 34 ’ Jupiter.<\/p>", "images": [], "label": "Page 146"}, {"pdf_page_index": 146, "pdf_page_number": 147, "html": "<p>Wisdom of the Heavens<\/p>\n<p>144<\/p>\n<p>Leo : 23° - 58 ’ Saturn Libra : 3° - 23 ’ Node(Rahu). Scorpio :  14° R Uranus. This makes us understand that there is a major square between Sun and Mars and Sun and Saturn. Another major square between Mars and Uranus and Saturn and Uranus, the major opposition between Sun and Uranus. All these aspects are linked up with the Moon forming a conjunction with Mars and Saturn, a square with Uranus and square with Sun. Since the major planets Saturn and Uranus are involved in these malefic aspects the results are bound to be eventful. Such malefic aspects occurring in stable signs indicate gales, storms or earthquakes according to Varāhamihira. Since Leo is prominent and since it is the eight houses from Capricorn the sign in India, we can conclude that India will experience the result of these planetary patterns in a prominent way. Since Leo indicates east, we can also conclude that the east coast will be the beginning of the mischief of nature. The coastal area between Madras and Calcutta will be hit by some<\/p>", "images": [], "label": "Page 147"}, {"pdf_page_index": 147, "pdf_page_number": 148, "html": "<p>Wisdom of the Heavens<\/p>\n<p>145<\/p>\n<p>unusual phenomena of nature. Saturn is prominent and hence we can conclude that the element of air and water will probably the mischief. We can understand that there may be a storm and a disturbance of the sea tide in an unusual way during this period. It is also probable that diseases of an unusual and a contagious nature will have sweep over the area. As far as India is concerned as a whole we see that there is a constant disturbance of a political nature and labour problems crop up and cause repeated disturbance. Unexpected in convenience about coal shortage can be expected. Minerals in general will suffer from the dislocation of industries. Unwise policies of certain minds of the industrialists will cause a serious loss of an obligatory nature. Iron and steel prove insufficient to the expansion schemes of our country since some of the crude material will be forced to be diverted. Added to this there is a possibility of lack of cooperation on the part of the workers and officers of the industry. Some of the major industries come to a close due to lack of national spirit among the key persons.<\/p>", "images": [], "label": "Page 148"}, {"pdf_page_index": 148, "pdf_page_number": 149, "html": "<p>Wisdom of the Heavens<\/p>\n<p>146<\/p>\n<p>The involvement of Mars in these squares indicates outbursts of violence and political disturbances. The general atmosphere of the whole country will be charged with disturbed thought waves of the politicians of a cheap nature. As far as the international relationships are concerned, we find that more than one country try to have an evil eye over the constructive feature of our country. But all the while there is the full benefic aspect of Jupiter to Capricorn from Cancer, his exaltation. This wards off many evils by the major policies of one remarkable person in the central government. Drastic steps will be taken to curb all the undesirable elements and order begins to prevail on a national scale. There will be radical changes in the policies and procedures and the general public will be necessitated to feel their duties and responsibilities about the interests of the nation. Party disturbances and groupism will have their impact upon the people during the first half of the year while the second half witnesses calm and peace. In the world affairs the situation is progressive since there will be real attempts for the international peace and integration. There will be a sympathetic understanding<\/p>", "images": [], "label": "Page 149"}, {"pdf_page_index": 149, "pdf_page_number": 150, "html": "<p>Wisdom of the Heavens<\/p>\n<p>147<\/p>\n<p>between the Muslim and non – Muslim countries, and the problem of inflammable oils will be eased to some extent. There will be much give and take policy among the major nations and the effect will be positive upon the international mind. There will be more possibilities of train accidents, fire accidents, plane crashes and hijackings during the month of May 1978. Throughout this month the mischievous elements try to prevail upon the positive aspects of the various nations.  The whole of the year will show sensational changed in the international policies and the basis for better and peaceful conditions will be laid during this year. The first experiments to construct big cities under the waters of the oceans will be launched in this year. International road ways under the sea will be experimented. Landing on the new planets becomes successful during this year especially between April 21 st and July 21 st of this year. The agricultural economy of India will be constantly disturbed by the limitations of the urbanized economy. Industrial economy inflates money and there will be the<\/p>", "images": [], "label": "Page 150"}, {"pdf_page_index": 150, "pdf_page_number": 151, "html": "<p>Wisdom of the Heavens<\/p>\n<p>148<\/p>\n<p>consequences of the Ill- distribution of finance and food material.  However, there will be a general encouragement of the export trade and the production of the materials there for. Sugar cane industry comes to a partial stagnation due to reverses in international trade relations. The growth and utilisation of cotton will be on the increase and help the people of rural areas. Local industries of yarn and cloth – making will be developed in as many rural areas as possible and this caters to the real needs of the workers and agriculturist. This is all due to the position of Jupiter and Uranus on the one side and Saturn and Neptune on the others i.e. standing in trine relationship in their signs. Above all the month of May in 1978 awaits to show a crucial and unpleasant period in the life history of Indira Gandhi.  The planets warn her to get prepared to face the most fateful dates on 12 th , 14 th , 15 th and 16 th of May 1978.<\/p>", "images": [], "label": "Page 151"}]</script>

<script id="notes-data" type="application/json">{"Astrology and its Importance": {"s": "Master E.K. opens by presenting astrology as the subjective lamp of a living being — the science that illumines the timing and quality of life from within.", "p": ["Astrology is called the subjective lamp of a living being", "It reveals when our good seeds sprout and when obstructions come", "Its use is guidance for right action, not fatalism"]}, "Astrology of the Scriptures": {"s": "The scriptural basis of astrology — how the ancient scriptures of the world presuppose and teach the science of the heavens.", "p": ["The scriptures of all nations contain astrology", "The science descends from the most ancient teachers", "Scriptural stories veil astronomical and spiritual truths"]}, "The Vēdic Astrology": {"s": "The Vedic tradition of astrology — its antiquity, its unbroken line, and its foundation in the wisdom of the heavens.", "p": ["Vedic astrology is an unbroken ancient tradition", "It treats the heavens as a living order", "Its purpose is the welfare of the being, not prediction alone"]}, "Worlds within Worlds": {"s": "On worlds within worlds — the seed-principle: as the banyan seed contains the tree, each world contains subtler worlds within it.", "p": ["Every seed contains its kingdom", "The subtle worlds enfold the gross", "Man is a world containing worlds"]}, "The Validity of the Zodiac": {"s": "On the validity of the zodiac — the word means a group of living animals, and the zodiac is the living belt of cosmic intelligences.", "p": ["The zodiac is a living group, not a dead diagram", "Its signs are qualities of cosmic life", "Its validity rests on the correspondence of man and cosmos"]}, "The Measures of Time in the Zodiac": {"s": "On the measures of time hidden in the zodiac — the zodiac symbolizing both space and time.", "p": ["The zodiac measures time as well as space", "The great ages are read from its wheel", "Time and space are two faces of one order"]}, "The Clock <script>
const PAGES = JSON.parse(document.getElementById('pages-data').textContent);
const IMAGES = JSON.parse(document.getElementById('images-data').textContent);

let current = 0;

function imgSrc(file){
  return 'data:image/jpeg;base64,' + IMAGES[file];
}

function render(){
  const p = PAGES[current];
  document.getElementById('section-pill').textContent = 'Page ' + p.pdf_page_number;
  document.getElementById('eyebrow').textContent = 'Source: page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('page-title').textContent = p.label;
  document.getElementById('content').innerHTML = p.html;

  const figWrap = document.getElementById('figures');
  figWrap.innerHTML = '';
  p.images.forEach(im => {
    const card = document.createElement('div');
    card.className = 'figure-card';
    const img = document.createElement('img');
    img.src = imgSrc(im.file);
    img.alt = im.caption;
    img.addEventListener('click', () => openLightbox(img.src, im.caption));
    const cap = document.createElement('div');
    cap.className = 'figure-cap';
    cap.textContent = im.caption;
    card.appendChild(img);
    card.appendChild(cap);
    figWrap.appendChild(card);
  });

  document.getElementById('folio-label').textContent = 'Page ' + p.pdf_page_number + ' / ' + PAGES.length;
  document.getElementById('progress-label').textContent = 'Page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('progress-fill').style.width = (((current+1)/PAGES.length)*100).toFixed(1) + '%';

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === PAGES.length - 1;
  document.getElementById('next-btn').textContent = current === PAGES.length -1 ? 'End' : 'Next \u2192';

  document.getElementById('leaf').style.animation = 'none';
  void document.getElementById('leaf').offsetWidth;
  document.getElementById('leaf').style.animation = '';

  updateActiveTocItem();
  window.scrollTo({top:0, behavior:'smooth'});
  if (window.__afterRender) window.__afterRender();
}

function openLightbox(src, alt){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('prev-btn').addEventListener('click', () => {
  if (current > 0){ current--; render(); }
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (current < PAGES.length -1){ current++; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// ---------- TOC ----------
function buildToc(){
  const list = document.getElementById('toc-list');
  PAGES.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = 'toc-item';
    btn.dataset.idx = idx;
    btn.textContent = 'p.' + p.pdf_page_number + '  —  ' + p.label;
    btn.addEventListener('click', () => {
      current = idx;
      render();
      closeToc();
    });
    list.appendChild(btn);
  });
}
function updateActiveTocItem(){
  document.querySelectorAll('.toc-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === current);
  });
}
function openToc(){
  document.getElementById('toc-panel').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeToc(){
  document.getElementById('toc-panel').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('toc-toggle').addEventListener('click', openToc);
document.getElementById('toc-close').addEventListener('click', closeToc);
document.getElementById('scrim').addEventListener('click', closeToc);

buildToc();
render();

// ---------- Read aloud (prefers Indian English voices) ----------
(function(){
  const listenBtn = document.getElementById('listen-toggle');
  const bar = document.getElementById('listen-bar');
  const voiceSel = document.getElementById('voice-select');
  const rateSel = document.getElementById('rate-select');
  const playBtn = document.getElementById('listen-play');
  const stopBtn = document.getElementById('listen-stop');
  const autoChk = document.getElementById('listen-auto');
  const status = document.getElementById('listen-status');

  if (!('speechSynthesis' in window)) {
    listenBtn.style.display = 'none';
    return;
  }

  let voices = [];
  let listening = false;
  let paused = false;
  let gen = 0;

  function score(v){
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l.indexOf('en-in') === 0) return 3;
    if (l === 'en-gb') return 2;
    return 1;
  }

  function loadVoices(){
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
    voices = (en.length ? en : all).slice().sort((a, b) => score(b) - score(a));
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const isIndian = (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0;
      opt.textContent = v.name + ' (' + v.lang + ')' + (isIndian ? ' — Indian accent' : '');
      voiceSel.appendChild(opt);
    });
    const idx = voices.findIndex(v => (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0);
    voiceSel.value = idx >= 0 ? idx : 0;
    if (!listening) {
      status.textContent = idx >= 0
        ? 'Indian English voice ready.'
        : 'No Indian English voice found on this device — closest English voice selected.';
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function pageText(){
    const p = PAGES[current];
    const div = document.createElement('div');
    div.innerHTML = p.html;
    let t = (div.textContent || '').replace(/\s+/g, ' ').trim();
    (p.images || []).forEach(im => { t += ' Figure on this page: ' + im.caption + '.'; });
    return t;
  }

  function chunk(text){
    const parts = text.match(/[^.!?\u2026]+[.!?\u2026]+["')\]]*\s*/g) || [text];
    const out = [];
    let buf = '';
    parts.forEach(s => {
      if ((buf + s).length > 220) { if (buf) out.push(buf); buf = s; }
      else buf += s;
    });
    if (buf) out.push(buf);
    return out;
  }

  function speak(){
    const text = pageText();
    if (!text) { status.textContent = 'Nothing to read on this page.'; return; }
    const myGen = ++gen;
    speechSynthesis.cancel();
    const pieces = chunk(text);
    const v = voices[parseInt(voiceSel.value, 10)];
    pieces.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateSel.value);
      if (i === pieces.length - 1) {
        u.onend = () => {
          if (!listening || myGen !== gen) return;
          if (autoChk.checked && current < PAGES.length - 1) { current++; render(); }
          else setUi(false);
        };
      }
      speechSynthesis.speak(u);
    });
    status.textContent = 'Reading page ' + (current + 1) + ' of ' + PAGES.length + '…';
  }

  function setUi(on){
    listening = on;
    paused = false;
    playBtn.innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Read aloud';
    stopBtn.disabled = !on;
    if (!on) status.textContent = 'Stopped.';
  }

  window.__afterRender = function(){
    if (listening) speak();
  };

  // Chrome desktop occasionally stalls long speech queues — nudge it.
  setInterval(() => {
    if (listening && !paused && speechSynthesis.speaking) speechSynthesis.resume();
  }, 10000);

  listenBtn.addEventListener('click', () => bar.classList.toggle('open'));
  playBtn.addEventListener('click', () => {
    if (!listening) { setUi(true); speak(); return; }
    if (paused) { speechSynthesis.resume(); paused = false; playBtn.innerHTML = '&#10074;&#10074; Pause'; }
    else { speechSynthesis.pause(); paused = true; playBtn.innerHTML = '&#9654; Resume'; }
  });
  stopBtn.addEventListener('click', () => { gen++; speechSynthesis.cancel(); setUi(false); });
  voiceSel.addEventListener('change', () => { if (listening) speak(); });
  rateSel.addEventListener('change', () => { if (listening) speak(); });
})();

</script>

<script>
(function(){
  var NOTES = {};
  var CHMAP = [];
  try { NOTES = JSON.parse(document.getElementById('notes-data').textContent); } catch(e) {}
  try { CHMAP = JSON.parse(document.getElementById('chapter-map').textContent); } catch(e) {}
  var term = '', matchPages = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function pageText(p){ var d=document.createElement('div'); d.innerHTML=p.html; return d.textContent || ''; }

  // ---------- SEARCH ----------
  var bar = document.getElementById('search-bar');
  var input = document.getElementById('search-input');
  var info = document.getElementById('search-info');

  function clearMarks(){
    var c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(function(mk){
      var t = document.createTextNode(mk.textContent);
      mk.parentNode.replaceChild(t, mk);
    });
    c.normalize();
  }
  function highlight(){
    clearMarks();
    if (!term || term.length < 2) return;
    var c = document.getElementById('content');
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var t = term.toLowerCase();
    nodes.forEach(function(n){
      var txt = n.nodeValue, low = txt.toLowerCase(), idx = low.indexOf(t);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(txt.slice(pos, idx)));
        var mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = txt.slice(idx, idx + term.length);
        frag.appendChild(mk);
        pos = idx + term.length;
        idx = low.indexOf(t, pos);
      }
      frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function infoText(){
    if (!term || term.length < 2) { info.textContent = ''; return; }
    if (!matchPages.length) { info.textContent = 'No matches'; return; }
    var pos = matchPages.indexOf(current);
    info.textContent = matchPages.length + (matchPages.length > 1 ? ' pages' : ' page') +
      (pos >= 0 ? ' — match ' + (pos + 1) + ' of ' + matchPages.length : '');
  }
  function doSearch(){
    term = input.value.trim();
    matchPages = [];
    if (term.length >= 2){
      var t = term.toLowerCase();
      PAGES.forEach(function(p, i){ if (pageText(p).toLowerCase().indexOf(t) >= 0) matchPages.push(i); });
    }
    if (matchPages.length){ current = matchPages[0]; render(); }
    else { highlight(); infoText(); }
  }
  function step(d){
    if (!matchPages.length) return;
    var pos = matchPages.indexOf(current);
    if (pos < 0) pos = 0;
    pos = (pos + d + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }
  var searchT = null;
  input.addEventListener('input', function(){ clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ clearTimeout(searchT); doSearch(); } });
  document.getElementById('search-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('search-next').addEventListener('click', function(){ step(1); });
  document.getElementById('search-close').addEventListener('click', function(){
    bar.classList.remove('open'); term=''; matchPages=[]; highlight(); infoText();
  });
  document.getElementById('search-toggle').addEventListener('click', function(){
    var open = bar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) input.focus();
  });

  // ---------- NOTES ----------
  var panel = document.getElementById('notes-panel');
  var body = document.getElementById('notes-body');
  function showNotes(){
    var ch = null;
    for (var i = current; i >= 0; i--){
      if (CHMAP[i] && NOTES[CHMAP[i]]) { ch = CHMAP[i]; break; }
    }
    if (!ch){
      for (var j = current; j < CHMAP.length; j++){
        if (CHMAP[j] && NOTES[CHMAP[j]]) { ch = CHMAP[j]; break; }
      }
    }
    if (!ch){
      body.innerHTML = '<p class="notes-empty">No chapter notes available for this section.</p>';
      return;
    }
    var n = NOTES[ch];
    var h = '<h3>' + esc(ch) + '</h3><h4>Summary</h4><p>' + esc(n.s) + '</p>';
    if (n.p && n.p.length){
      h += '<h4>Key points</h4><ul>' + n.p.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body.innerHTML = h;
  }
  document.getElementById('notes-toggle').addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    bar.classList.remove('open');
    if (open) showNotes();
  });

  // hooks after every render
  var prevA = window.__afterRender;
  window.__afterRender = function(){
    if (prevA) prevA();
    highlight();
    infoText();
    if (panel.classList.contains('open')) showNotes();
  };
})();
</script>

<script>
(function(){
  if (window.__selSearch) return; window.__selSearch = true;
  var tip = document.createElement('div');
  tip.id = 'sel-search-tip';
  tip.innerHTML = '<button id="sel-search-btn" type="button">&#128269; Search DuckDuckGo</button>';
  document.body.appendChild(tip);
  var bar = document.createElement('div');
  bar.id = 'sel-search-bar';
  bar.innerHTML = '<span id="sel-search-msg">Search opened in a popup window.</span>' +
    '<button id="sel-search-close" type="button">&#10005; Close search window</button>';
  document.body.appendChild(bar);
  var popup = null, term = '', lastUrl = '';

  function hideTip(){ tip.classList.remove('show'); }
  function hideBar(){ bar.classList.remove('show'); }

  function showTipForSelection(){
    var sel = window.getSelection();
    var txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    if (txt.length >= 2 && txt.length <= 160){
      term = txt;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      var top = r.top - 46;
      if (top < 8) top = r.bottom + 10;
      var left = r.left + r.width / 2;
      left = Math.max(90, Math.min(window.innerWidth - 90, left));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.classList.add('show');
    } else {
      hideTip();
    }
  }

  document.addEventListener('mouseup', function(e){
    if (tip.contains(e.target) || bar.contains(e.target)) return;
    setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('keyup', function(e){
    if (e.shiftKey) setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!tip.contains(e.target)) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);

  document.getElementById('sel-search-btn').addEventListener('click', function(){
    if (!term) return;
    lastUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(term);
    popup = window.open(lastUrl, 'ddg_search_popup', 'width=920,height=700,menubar=no,toolbar=no,location=no,status=no');
    hideTip();
    var msg = document.getElementById('sel-search-msg');
    if (popup){
      msg.textContent = 'Search opened in a popup window.';
    } else {
      msg.innerHTML = 'Popup blocked — <a href="' + lastUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">open the search in a new tab</a>.';
    }
    bar.classList.add('show');
  });

  document.getElementById('sel-search-close').addEventListener('click', function(){
    if (popup && !popup.closed) popup.close();
    popup = null;
    hideBar();
  });
})();
</script>

#sl-chat-panel.show{display:flex}
#sl-chat-head{display:flex;align-items:center;justify-content:space-between;background:#2E2A24;color:#F7F1E3;padding:10px 14px;font-weight:600;font-size:13px;letter-spacing:.4px}
#sl-chat-head button{background:none;border:none;color:#CBBEA6;cursor:pointer;font-size:15px;padding:2px 6px}
#sl-chat-head button:hover{color:#fff}
#sl-chat-settings{display:none;padding:10px 14px;background:#F6EEDC;border-bottom:1px solid #E3D9C6;font-size:12px}
#sl-chat-settings.show{display:block}
#sl-chat-settings input{width:100%;box-sizing:border-box;margin:3px 0;padding:6px 8px;border:1px solid #D8CCB2;border-radius:8px;font-size:12px;background:#fff}
#sl-chat-settings .row{display:flex;gap:8px;align-items:center;margin-top:4px}
#sl-chat-settings button{background:#2E2A24;color:#F7F1E3;border:none;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
#sl-chat-settings .hint{color:#8A7F6A;font-size:11px;line-height:1.4;margin-top:4px}
#sl-chat-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sl-msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13px;white-space:pre-wrap;word-wrap:break-word}
.sl-msg.user{align-self:flex-end;background:#2E2A24;color:#F7F1E3;border-bottom-right-radius:4px}
.sl-msg.bot{align-self:flex-start;background:#fff;border:1px solid #E7DECB;border-bottom-left-radius:4px}
.sl-msg a{color:#A6743A}

.sl-ref:hover{background:#EFE3CC}

#sl-chat-send{background:#B8893A;border:none;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
#sl-chat-send:disabled{opacity:.4}
.sl-thinking{font-size:11px;color:#A99E88;font-style:italic}
</style>

<script>
(function(){
  if (window.__slChat) return; window.__slChat = true;
  var CFG_KEY = 'sl_llm_config';
  function loadCfg(){
    try { var raw = localStorage.getItem(CFG_KEY); if (raw) return JSON.parse(raw); } catch(e){}
    return { endpoint:'https://api.openai.com/v1/chat/completions', key:'', model:'gpt-4o-mini' };
  }
  var cfg = loadCfg();

  var fab = document.createElement('button');
  fab.id = 'sl-chat-fab'; fab.type = 'button'; fab.title = 'Library assistant';
  fab.textContent = '\uD83D\uDCAC';
  document.body.appendChild(fab);

  var panel = document.createElement('div');
  panel.id = 'sl-chat-panel';
  panel.innerHTML =
    '<div id="sl-chat-head"><span>\u2728 Library Assistant</span>' +
    '<span><button id="sl-chat-clear" type="button" title="Clear chat">\uD83D\uDDD1</button>' +
    '<button id="sl-chat-gear" type="button" title="LLM settings">\u2699</button>' +
    '<button id="sl-chat-x" type="button" title="Close">\u2715</button></span></div>' +
    '<div id="sl-chat-settings">' +
    '<b>LLM configuration (any OpenAI-compatible API)</b>' +
    '<input id="sl-cfg-endpoint" placeholder="Endpoint, e.g. https://api.openai.com/v1/chat/completions">' +
    '<input id="sl-cfg-key" type="password" placeholder="API key (stored only in this browser)">' +
    '<input id="sl-cfg-model" placeholder="Model, e.g. gpt-4o-mini">' +
    '<div class="row"><button id="sl-cfg-save" type="button">Save</button>' +
    '<button id="sl-cfg-test" type="button">Test</button><span id="sl-cfg-status"></span></div>' +
    '<div class="hint">Works with OpenAI, OpenRouter, Groq, Mistral, Ollama (http://localhost:11434/v1/chat/completions), LM Studio. Without a key I search this book locally and DuckDuckGo externally.</div>' +
    '</div>' +
    '<div id="sl-chat-body"></div>' +
    '<div id="sl-chat-inputrow"><input id="sl-chat-input" placeholder="Ask about this book, or the web\u2026">' +
    '<button id="sl-chat-send" type="button" title="Send">\u27A4</button></div>';
  document.body.appendChild(panel);

  var body = panel.querySelector('#sl-chat-body');
  var input = panel.querySelector('#sl-chat-input');
  var sendBtn = panel.querySelector('#sl-chat-send');
  var busy = false;

  function scrollBody(){ body.scrollTop = body.scrollHeight; }
  function addMsg(role, html){
    var d = document.createElement('div');
    d.className = 'sl-msg ' + role;
    d.innerHTML = html;
    body.appendChild(d); scrollBody();
    return d;
  }
  function esc(t){ var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  addMsg('bot', 'Namaste. Ask me anything \u2014 I can search <b>this book</b> page by page, answer with your configured LLM, or run an external DuckDuckGo search.');

  function pageText(p){
    var d = document.createElement('div'); d.innerHTML = p.html; return d.textContent || '';
  }

  function searchBook(q){
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    if (!terms.length) return [];
    var out = [];
    for (var i = 0; i < PAGES.length; i++){
      var txt = pageText(PAGES[i]).toLowerCase();
      var score = 0;
      for (var k = 0; k < terms.length; k++){
        var hits = txt.split(terms[k]).length - 1;
        if (hits) score += hits;
      }
      if (score) out.push({ i: i, score: score });
    }
    out.sort(function(a,b){ return b.score - a.score; });
    return out.slice(0, 5);
  }

  function snippet(i, q){
    var txt = pageText(PAGES[i]).replace(/\s+/g,' ');
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    var pos = -1;
    for (var k = 0; k < terms.length; k++){ pos = txt.toLowerCase().indexOf(terms[k]); if (pos >= 0) break; }
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 60);
    return (start ? '\u2026' : '') + txt.slice(start, start + 170) + '\u2026';
  }

  function goToPage(i){
    try { current = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch(e){ console.warn('jump failed', e); }
  }

  function callLlm(q, context){
    return fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: 'You are the assistant inside a spiritual book reader. Answer concisely. When book excerpts are provided, ground the answer in them and cite the page labels. If the question needs current external facts, say so and suggest an external search.' },
          { role: 'user', content: context ? 'Book excerpts:\n' + context + '\n\nQuestion: ' + q : q }
        ],
        temperature: 0.4
      })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error('LLM error ' + res.status + ': ' + t.slice(0,180)); });
      return res.json();
    }).then(function(data){
      var c = data.choices && data.choices[0] && data.choices[0].message;
      return (c && c.content || '(empty response)').trim();
    });
  }

  function handleSend(){
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    addMsg('user', esc(q));
    busy = true; sendBtn.disabled = true;
    var thinking = document.createElement('div');
    thinking.className = 'sl-thinking'; thinking.textContent = 'Thinking\u2026';
    body.appendChild(thinking); scrollBody();

    var hits = searchBook(q);
    var finish = function(){ busy = false; sendBtn.disabled = false; thinking.remove(); };

    function renderRefs(){
      if (!hits.length) return '';
      var h = '';
      hits.forEach(function(hit, n){
        h += '<button class="sl-ref" data-page="' + hit.i + '" type="button"><b>' + esc(PAGES[hit.i].label) +
             ' \u00b7 page ' + (hit.i + 1) + '</b><span>' + esc(snippet(hit.i, q)) + '</span>' +
             '<span class="go">Go to page \u2192</span></button>';
      });
      return h;
    }

    var done = function(html){ finish(); var m = addMsg('bot', html);
      m.querySelectorAll('.sl-ref').forEach(function(b){
        b.addEventListener('click', function(){ goToPage(parseInt(b.getAttribute('data-page'), 10)); });
      });
    };

    if (cfg.key){
      var ctx = hits.slice(0,3).map(function(hit){
        return '[' + PAGES[hit.i].label + ', page ' + (hit.i + 1) + '] ' + pageText(PAGES[hit.i]).replace(/\s+/g,' ').slice(0, 900);
      }).join('\n');
      callLlm(q, ctx).then(function(ans){ done(esc(ans) + renderRefs()); })
      .catch(function(err){ done(esc(String(err.message || err)) + renderRefs()); });
    } else if (hits.length){
      done('I found ' + hits.length + ' relevant page' + (hits.length > 1 ? 's' : '') + ' in this book. Tap one to jump there, or add an LLM API key in \u2699 Settings for a synthesized answer.' + renderRefs());
    } else {
      var url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      done('Nothing in this book matched. <a href="' + url + '" target="_blank" rel="noopener">Search the web for \u201c' + esc(q) + '\u201d on DuckDuckGo \u2197</a> \u2014 or add an LLM key in \u2699 Settings and I can answer directly.');
    }
  }

  fab.addEventListener('click', function(){ panel.classList.toggle('show'); });
  panel.querySelector('#sl-chat-x').addEventListener('click', function(){ panel.classList.remove('show'); });
  panel.querySelector('#sl-chat-clear').addEventListener('click', function(){ body.innerHTML = ''; addMsg('bot', 'Chat cleared. Ask me anything.'); });
  panel.querySelector('#sl-chat-gear').addEventListener('click', function(){
    var st = panel.querySelector('#sl-chat-settings');
    st.classList.toggle('show');
    panel.querySelector('#sl-cfg-endpoint').value = cfg.endpoint || '';
    panel.querySelector('#sl-cfg-key').value = cfg.key || '';
    panel.querySelector('#sl-cfg-model').value = cfg.model || '';
  });
  panel.querySelector('#sl-cfg-save').addEventListener('click', function(){
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    panel.querySelector('#sl-cfg-status').textContent = 'Saved.';
  });
  panel.querySelector('#sl-cfg-test').addEventListener('click', function(){
    var status = panel.querySelector('#sl-cfg-status');
    status.textContent = 'Testing\u2026';
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'Say OK' }], max_tokens: 5 })
    }).then(function(res){ status.textContent = res.ok ? 'Connected.' : 'Failed: HTTP ' + res.status; })
    .catch(function(err){ status.textContent = 'Failed: ' + err.message; });
  });
  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });
})();
</script>
<style id="sl-sel-css">
#sl-sel-tip{position:fixed;z-index:99999;display:none;align-items:center;gap:2px;padding:5px;background:#2E2A24;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);font:13px/1.2 system-ui,-apple-system,sans-serif}
#sl-sel-tip.show{display:flex}
#sl-sel-tip button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:#F7F1E3;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
#sl-sel-tip button:hover{background:#4A4234}
#sl-sel-tip .sl-sep{width:1px;height:18px;background:#55493A;margin:0 2px}
#sl-sel-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#2E2A24;color:#F7F1E3;padding:10px 18px;border-radius:999px;font:13px system-ui,-apple-system,sans-serif;z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:0 8px 22px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#sl-sel-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>
(function(){
  if (window.__slSelTools) return; window.__slSelTools = true;

  /* Compatibility shim: topic-based readers (e.g. Ponder on This) expose
     `topics` + `goTo(id)` instead of `PAGES` + `render()`. Build the PAGES
     interface so the embedded assistant's search and page jumps work there too. */
  try {
    if (typeof PAGES === 'undefined' && typeof topics !== 'undefined' && Array.isArray(topics)) {
      window.PAGES = topics.map(function(t){
        return {
          label: 'Topic ' + t.id + ' \u2014 ' + t.title,
          html: '<div>' + (t.matter || []).map(function(m){ return '<p>' + m.text + '</p>'; }).join('') + '</div>'
        };
      });
      window.render = function(){
        try { if (typeof goTo === 'function') goTo(topics[window.current || 0].id); } catch(e){}
      };
    }
  } catch(e){}

  var NOTES_KEY = 'sl_my_notes';

  var tip = document.createElement('div');
  tip.id = 'sl-sel-tip';
  tip.setAttribute('role', 'toolbar');
  tip.setAttribute('aria-label', 'Selection actions');
  tip.innerHTML =
    '<button type="button" data-act="ask">\u2728 Ask AI</button>' +
    '<span class="sl-sep"></span>' +
    '<button type="button" data-act="note">\uD83D\uDCDD Add to my note</button>';
  document.body.appendChild(tip);

  var toast = document.createElement('div');
  toast.id = 'sl-sel-toast';
  document.body.appendChild(toast);
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  var selText = '';

  function hideTip(){ tip.classList.remove('show'); }

  function insideUi(node){
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    while (el) {
      if (el.id === 'sl-chat-panel' || el.id === 'sl-sel-tip' ||
          el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return true;
      el = el.parentElement;
    }
    return false;
  }

  function showTip(){
    var sel = window.getSelection();
    var text = sel && !sel.isCollapsed ? sel.toString().replace(/\s+/g, ' ').trim() : '';
    if (text.length < 3 || insideUi(sel.anchorNode)) { hideTip(); return; }
    var rect;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch(e){ hideTip(); return; }
    if (!rect || (rect.width === 0 && rect.height === 0)) { hideTip(); return; }
    selText = text;
    tip.classList.add('show');
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = rect.left + rect.width / 2 - w / 2;
    var y = rect.top - h - 8;
    if (y < 6) y = Math.min(window.innerHeight - h - 6, rect.bottom + 8);
    x = Math.max(6, Math.min(window.innerWidth - w - 6, x));
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseup', function(){ setTimeout(showTip, 10); });
  document.addEventListener('touchend', function(){ setTimeout(showTip, 350); });
  document.addEventListener('mousedown', function(e){ if (!tip.contains(e.target)) hideTip(); });
  document.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideTip(); });

  /* Keep the text selection alive when the user taps a tooltip button */
  tip.addEventListener('mousedown', function(e){ e.preventDefault(); });
  tip.addEventListener('touchend', function(e){ e.preventDefault(); }, { passive: false });

  function askAi(text){
    var panel = document.getElementById('sl-chat-panel');
    var input = document.getElementById('sl-chat-input');
    var send = document.getElementById('sl-chat-send');
    if (!panel || !input || !send) return;
    panel.classList.add('show');
    var trimmed = text.length > 600 ? text.slice(0, 600) + '\u2026' : text;
    input.value = 'Explain this passage: \u201C' + trimmed + '\u201D';
    send.click();
    input.focus();
  }

  function currentLocation(){
    try {
      if (typeof PAGES !== 'undefined' && typeof current !== 'undefined' && PAGES[current]) {
        return PAGES[current].label || '';
      }
    } catch(e){}
    try {
      if (typeof topics !== 'undefined' && typeof currentId !== 'undefined') {
        var t = topics.find(function(x){ return x.id === currentId; });
        if (t) return 'Topic ' + t.id + ' \u2014 ' + t.title;
      }
    } catch(e){}
    return '';
  }

  function addNote(text){
    var notes = [];
    try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); } catch(e){}
    if (!Array.isArray(notes)) notes = [];
    notes.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      book: document.title,
      page: currentLocation(),
      text: text,
      url: location.pathname.split('/').pop(),
      ts: Date.now()
    });
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes.slice(0, 500))); } catch(e){}
    showToast('Saved to My Notes \u2014 view it on the library home page');
  }

  tip.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    var text = selText;
    hideTip();
    if (btn.getAttribute('data-act') === 'ask') askAi(text);
    else addNote(text);
  });
})();
</script>
