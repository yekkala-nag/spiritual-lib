<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisdom of the Heavens</title>
<style>
/* ============ Design tokens ============
   Palette: parchment cream #F7F1E3, ink #2E2A24, gilt gold #B8963E,
            deep violet accent (devotion) #6B5691, rose accent (affection) #C1567B,
            soft border #E4D9BE
   Type: display "Cormorant Garamond" (Victorian book serif), body "EB Garamond",
         utility/caption "Cormorant" small caps
   Layout: single centered "book leaf" card, aurora/aura corner glow, page-turn transitions
   Signature: an animated soft-glowing aura halo behind the folio number, echoing the
   book's own theme of radiating thought-vibrations.
*/
:root{
  --parchment:#F7F1E3;
  --parchment-2:#EFE6CE;
  --ink:#2E2A24;
  --ink-soft:#5A5346;
  --gold:#B8963E;
  --gold-soft:#D8C186;
  --violet:#6B5691;
  --rose:#C1567B;
  --border:#E1D3AA;
  --card:#FFFDF6;
  --shadow: 0 20px 60px -20px rgba(60,45,10,0.35), 0 2px 10px rgba(60,45,10,0.08);
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #f3e8c9 0%, transparent 60%),
    radial-gradient(ellipse 900px 600px at 110% 110%, #ecdcc0 0%, transparent 55%),
    var(--parchment);
  color:var(--ink);
  font-family: "EB Garamond", "Cormorant Garamond", Georgia, serif;
  min-height:100vh;
  overflow-x:hidden;
}
@font-face{
  font-family:'Cinzel-fallback'; src:local('Georgia');
}
.app{
  max-width:980px;
  margin:0 auto;
  padding:28px 20px 60px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- Header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:12px;
}
.brand .glyph{
  width:40px;height:40px;border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #fff6df 0%, var(--gold-soft) 45%, var(--gold) 100%);
  box-shadow: 0 0 18px 2px rgba(184,150,62,0.45), inset 0 0 6px rgba(255,255,255,0.6);
  flex-shrink:0;
}
.brand h1{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-weight:600;
  font-size:1.35rem;
  letter-spacing:0.04em;
  margin:0;
  color:var(--ink);
}
.brand p{
  margin:0; font-size:0.8rem; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--ink-soft); font-family: Georgia, serif;
}
.progress-wrap{
  display:flex; align-items:center; gap:10px;
  font-size:0.82rem; color:var(--ink-soft); letter-spacing:0.04em;
}
.progress-bar{
  width:150px; height:5px; border-radius:3px; background:var(--parchment-2);
  overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,0.08);
}
.progress-fill{
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--gold-soft), var(--gold));
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ---------- Table of contents rail ---------- */
.toc-toggle{
  border:1px solid var(--border); background:var(--card); color:var(--ink);
  border-radius:8px; padding:7px 14px; font-family:inherit; font-size:0.85rem;
  letter-spacing:0.05em; cursor:pointer; box-shadow:var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.toc-toggle:hover{ transform: translateY(-1px); }
.toc-panel{
  position:fixed; top:0; right:-360px; width:340px; height:100%;
  background:var(--card); border-left:1px solid var(--border);
  box-shadow:-20px 0 50px rgba(60,45,10,0.18);
  z-index:50; transition:right .35s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; padding:24px 18px 40px;
}
.toc-panel.open{ right:0; }
.toc-panel h2{
  font-family:"Cormorant Garamond",serif; font-size:1.1rem; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--gold); margin:0 0 14px;
  border-bottom:1px solid var(--border); padding-bottom:10px;
}
.toc-close{
  position:absolute; top:16px; right:16px; background:none; border:none;
  font-size:1.3rem; color:var(--ink-soft); cursor:pointer; line-height:1;
}
.toc-section{
  margin-bottom:6px;
}
.toc-section-title{
  font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--violet); margin:16px 0 6px; font-weight:600;
}
.toc-item{
  display:block; width:100%; text-align:left; background:none; border:none;
  padding:6px 8px; font-family:"EB Garamond",serif; font-size:0.95rem;
  color:var(--ink); cursor:pointer; border-radius:6px;
  transition: background .15s ease;
}
.toc-item:hover{ background:var(--parchment-2); }
.toc-item.active{
  background: linear-gradient(90deg, rgba(184,150,62,0.16), transparent);
  color:var(--gold); font-weight:600;
}
.scrim{
  position:fixed; inset:0; background:rgba(40,30,10,0.25); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.scrim.show{ opacity:1; pointer-events:auto; }

/* ---------- The book leaf / page card ---------- */
.stage{
  flex:1;
  display:flex; align-items:flex-start; justify-content:center;
  position:relative;
}
.leaf{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  width:100%;
  padding:46px 54px 40px;
  position:relative;
  min-height:420px;
  animation: fadeIn .5s ease;
}
.leaf::before{
  content:"";
  position:absolute; inset:10px;
  border:1px solid rgba(184,150,62,0.28);
  border-radius:8px;
  pointer-events:none;
}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
@media (max-width:700px){
  .leaf{ padding:30px 20px 28px; }
}

.eyebrow{
  font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--violet); margin:0 0 6px; font-weight:600;
}
.leaf h2.page-title{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:2rem; font-weight:600; margin:0 0 22px; color:var(--ink);
  line-height:1.15; border-bottom:2px solid var(--gold-soft); padding-bottom:14px;
}
.leaf .content p{
  font-size:1.09rem; line-height:1.75; margin:0 0 1.1em; color:var(--ink);
  text-align:justify; hyphens:auto;
}
.leaf .content p.footnote{
  font-size:0.92rem; color:var(--ink-soft); font-style:italic;
  border-left:2px solid var(--gold-soft); padding-left:14px;
}
.leaf .content p.signature{
  text-align:right; font-style:italic; letter-spacing:0.05em; color:var(--ink-soft);
}
.leaf .content p.printer-line{
  text-align:center; font-size:0.85rem; color:var(--ink-soft); letter-spacing:0.06em;
}
.leaf .content h3.subhead{
  font-family:"Cormorant Garamond",serif; font-size:1.15rem; color:var(--violet);
  margin:22px 0 10px; letter-spacing:0.03em;
}
.leaf .content ol.principles{ padding-left:1.4em; }
.leaf .content ol.principles li{ margin-bottom:6px; font-size:1.05rem; }

/* Title page flourishes */
.book-title{
  font-family:"Cormorant Garamond",serif; text-align:center; font-size:2.6rem;
  letter-spacing:0.12em; margin:18px 0 6px; color:var(--ink);
}
.book-authors{
  text-align:center; font-size:1.05rem; letter-spacing:0.1em; font-weight:400;
  color:var(--violet); margin:0 0 26px;
}
.pub-line{ text-align:center; font-size:0.78rem; color:var(--ink-soft); letter-spacing:0.04em; }
.pub-house{ text-align:center; font-size:0.95rem; color:var(--ink-soft); margin:8px 0 26px; line-height:1.6; }
.print-table{ margin:0 auto 26px; font-size:0.9rem; color:var(--ink-soft); border-collapse:collapse; }
.print-table td{ padding:2px 10px; }
.printer-line{ text-align:center; font-size:0.85rem; color:var(--ink-soft); margin-top:20px; line-height:1.6; }

/* Colour key table */
.key-table{ overflow-x:auto; margin:18px 0; }
.key-table table{ border-collapse:collapse; width:100%; font-size:0.88rem; }
.key-table th, .key-table td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
.key-table th{ background:var(--parchment-2); color:var(--gold); width:28px; text-align:center; }
.caption-label{ text-align:center; letter-spacing:0.1em; text-transform:uppercase; font-size:0.85rem; color:var(--ink-soft); }

/* TOC / illustrations tables */
.toc-table, .toc-table.small{ width:100%; border-collapse:collapse; font-size:0.98rem; }
.toc-table td{ padding:5px 6px; border-bottom:1px dotted var(--border); }
.toc-table td:last-child{ text-align:right; color:var(--ink-soft); width:80px; }
.toc-table tr.indent td:first-child{ padding-left:22px; }
.toc-table tr.indent2 td:first-child{ padding-left:44px; font-style:italic; }
.toc-table.small td{ font-size:0.88rem; }
.illus-note{ margin-bottom:14px; }
.illus-note p{ font-size:0.85rem; color:var(--ink-soft); font-style:italic; }

/* ---------- Images / figure gallery ---------- */
.figures{
  display:flex; flex-wrap:wrap; gap:22px; margin:26px 0 10px; justify-content:center;
}
.figure-card{
  background:var(--parchment-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  max-width:360px;
  flex:1 1 260px;
  text-align:center;
  box-shadow: 0 8px 22px -12px rgba(60,45,10,0.25);
}
.figure-card img{
  max-width:100%; height:auto; border-radius:5px;
  border:1px solid rgba(0,0,0,0.08);
  background:#111;
  cursor:zoom-in;
  transition: transform .25s ease;
}
.figure-card img:hover{ transform:scale(1.015); }
.figure-cap{
  margin-top:9px; font-size:0.85rem; color:var(--ink-soft);
  font-style:italic; letter-spacing:0.02em;
}

/* Lightbox */
.lightbox{
  position:fixed; inset:0; background:rgba(20,15,5,0.82);
  display:none; align-items:center; justify-content:center; z-index:100;
  padding:30px;
}
.lightbox.open{ display:flex; }
.lightbox img{ max-width:100%; max-height:85vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.lightbox-close{
  position:absolute; top:22px; right:28px; background:none; border:none;
  color:#f6ecd2; font-size:2rem; cursor:pointer; line-height:1;
}

/* ---------- Footer nav ---------- */
nav.pager{
  position:sticky; bottom:0;
  margin-top:26px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:linear-gradient(180deg, rgba(247,241,227,0) 0%, var(--parchment) 30%);
  padding-top:18px;
}
.pager-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border); color:var(--ink);
  padding:11px 20px; border-radius:10px; font-family:inherit; font-size:0.95rem;
  cursor:pointer; box-shadow:var(--shadow); letter-spacing:0.02em;
  transition: transform .15s ease, opacity .15s ease;
}
.pager-btn:hover:not(:disabled){ transform:translateY(-2px); }
.pager-btn:disabled{ opacity:0.35; cursor:default; }
.pager-btn.next{ background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:#3a2c08; border:none; }
.folio{
  position:relative;
  font-family:"Cormorant Garamond",serif; font-size:0.95rem; color:var(--ink-soft);
  text-align:center; letter-spacing:0.05em;
}
.folio .halo{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:70px; height:70px; border-radius:50%;
  background: radial-gradient(circle, rgba(184,150,62,0.30) 0%, transparent 70%);
  animation: pulse 3.2s ease-in-out infinite;
  z-index:-1;
}
@keyframes pulse{
  0%,100%{ transform:translate(-50%,-50%) scale(0.9); opacity:0.5; }
  50%{ transform:translate(-50%,-50%) scale(1.25); opacity:0.9; }
}

@media (prefers-reduced-motion: reduce){
  .leaf{ animation:none; }
  .folio .halo{ animation:none; }
}

/* PDF-exact content classes */
.leaf .content h3.pdf-heading{
  font-family:"Cormorant Garamond",serif; font-size:1.2rem; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--violet); margin:20px 0 10px;
}
.leaf .content p.pdf-caption{
  font-size:0.92rem; letter-spacing:0.05em; text-transform:uppercase;
  color:var(--gold); text-align:center; font-weight:600; margin:16px 0 10px;
}
.leaf .content p.empty-note{
  text-align:center; color:var(--ink-soft); font-size:1rem; padding:30px 0;
}

/* section pill on top of card */
.section-pill{
  position:absolute; top:-13px; left:50px;
  background:linear-gradient(135deg, var(--violet), #8875ac);
  color:#fff; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:5px 14px; border-radius:20px; box-shadow:0 6px 14px -6px rgba(107,86,145,0.6);
}
@media (max-width:700px){
  .section-pill{ left:20px; }
}

/* ---------- Read aloud ---------- */
.listen-bar{
  display:none; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 18px; margin-bottom:16px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); font-family:Georgia, serif; font-size:0.85rem;
}
.listen-bar.open{ display:flex; }
.listen-bar button{
  font-family:inherit; font-size:0.85rem; padding:7px 14px; border-radius:999px;
  border:1px solid var(--gold); background:linear-gradient(180deg,#fffdf6,#f3ead2);
  color:var(--ink); cursor:pointer; letter-spacing:0.02em;
}
.listen-bar button:hover:not(:disabled){ background:var(--gold); color:#fff; }
.listen-bar button:disabled{ opacity:0.45; cursor:default; }
.listen-bar select{
  font-family:inherit; font-size:0.82rem; padding:6px 8px; border-radius:8px;
  border:1px solid var(--border); background:#fff; color:var(--ink);
  max-width:230px;
}
.listen-bar label{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); }
.listen-bar .status{ color:var(--ink-soft); font-style:italic; flex-basis:100%; }

.search-bar, .notes-panel { display:none; padding:10px 24px; background:#f8f3e7; border-bottom:1px solid #e3d8c3; align-items:center; gap:10px; flex-wrap:wrap; }
.search-bar.open, .notes-panel.open { display:flex; }
.search-bar input { flex:1; min-width:180px; padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; font-family:inherit; font-size:14px; color:#3a3227; }
.search-bar input:focus { outline:2px solid #b29a5b; }
.search-bar .sbtn { padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; cursor:pointer; font-family:inherit; font-size:13px; color:#3a3227; }
.search-bar .sbtn:hover { background:#f0e7d3; }
#search-info { font-size:13px; color:#7a6c50; white-space:nowrap; }
mark.search-hit { background:#ffe9a8; color:inherit; padding:0 1px; border-radius:2px; }
.notes-panel { display:none; }
.notes-panel.open { display:block; }
#notes-body { max-width:820px; margin:0 auto; font-size:14.5px; line-height:1.65; color:#3a3227; }
#notes-body h3 { font-size:15px; margin:0 0 8px; color:#5c4a1e; letter-spacing:0.02em; }
#notes-body h4 { font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:#8a744a; margin:14px 0 6px; }
#notes-body p { margin:0 0 10px; }
#notes-body ul { margin:0; padding-left:20px; }
#notes-body li { margin-bottom:5px; }
#notes-body .notes-empty { color:#8a7c62; font-style:italic; }
</style>
</head>

  <span id="search-info"></span>

</div>
<div class="notes-panel" id="notes-panel">
  <div id="notes-body"></div>
</div>


  <div class="listen-bar" id="listen-bar">

</div>

......... 53<\/p>\n<p>The Nature of Time ...................................................................................................... 58<\/p>\n<p>The Influence of Planets ............................................................................................... 62<\/p>\n<p>The Principles Governed by the Planets ...................................................................... 76<\/p>\n<p>Planets and Colours ..................................................................................................... 82<\/p>\n<p>Planets and The Hours of The Day ............................................................................... 89<\/p>\n<p>Division of Work According to The Planets in The Seven Days ............................... 102<\/p>\n<p>Moon in the Vedic Tradition ..................................................................................... 107<\/p>\n<p>Astrological Tradition ............................................................................................... 119<\/p>\n<p>Cataclysms and Astrology ......................................................................................... 138<\/p>", "images": [], "label": "Page 4"}, {"pdf_page_index": 4, "pdf_page_number": 5, "html": "<h3 class=\"pdf-heading\">Astrology and its Importance<\/h3>\n<h3 class=\"pdf-heading\">A STROLOGY is the subjective lamp of a living being,<\/h3>\n<p>which illumines his objective path. The inner man is but a spark of consciousness that is solar by nature. His very routine is guided by his time calculation, which depends upon his sun-rise and sun-set. Man grows into a seer only through the induction of the solar ray. The path of this ray has taught astrology to mankind from times immemorial. The science of astrology on any planet is logically as old as that planet.  Astronomy is the skeleton, with astrological significance as life with flesh and blood. The Vēdas are full of the wisdom of light. Astrology forms one of the six main keys to unlock the wisdom of Vēda. The Vēdic, Purāṇic, and Scientific literature of the pre-Buddhistic ages describes the astronomical, astrological, and astro- biological cycles of various scales through which our creation rolls.<\/p>\n<p>You may question how astrology helps mankind. The answer is many-sided. It helps us to know all about ourselves and the world around. We can know when we<\/p>", "images": [], "label": "Astrology and its Importance"}, {"pdf_page_index": 5, "pdf_page_number": 6, "html": "<p>Wisdom of the Heavens<\/p>\n<p>3<\/p>\n<p>are at our best to achieve and to achieve what. We can also know when we have to do certain things in life. We can know when our good seeds sprout, and when there can be obstructions of any sort. Thereby we can nourish the former and eliminate the latter by our good work. It warns us of the broken road ahead. “Can we mend?” you can ask. “Yes, the mender is within you,” says Cheiro. Secondly, astrology helps us to understand the scriptures in their right spirit. In our daily life, the application is many-sided. We can predict, diagnose, and prevent disease. Science gives us many clues for the cures that are not comprehensible to the medical branch. Hippocrates says: “A doctor is a quack who does not know astrology.”<\/p>\n<p>“Do the stars rule our destiny? Are they more powerful than the God who created us?” You are logical in questioning so. The answer is that stars rule our destiny in obedience to the law of the Lord. The planets are the faithful servants of the Lord and serve as “The seven candles on the altar.” The planets are alphabet to read the plan of the Lord, and they do not lay the law. “Then, can we alter the Law of the Lord which manifests through the planets?” maybe your next question. The planets are there to help you and not to punish. Your effort gives you<\/p>", "images": [], "label": "Page 6"}, {"pdf_page_index": 6, "pdf_page_number": 7, "html": "<p>Wisdom of the Heavens<\/p>\n<p>4<\/p>\n<p>knowledge with which you can transcend that which is bad in your seed nature. “By the human effort the wise embrace what is prosperous to them. Then man has his refuge in God. He is privileged by the same God, to throw aside snakes, fire and poison, and the thorns from his path by his own effort. Those who use God-given wisdom achieve the will of their hearts through human effort. Those who do not use will perish like the trees of the forest in summer fire”. (Vasanta Raja’s book on Omens 1- 18-20) “Which is stronger, the Fate or the Will of man?” you can again question. The will of man is the child of the will of God. The planetary spirits are to us as elders to a child. The will of man is divine in essence and can surely help us unto perfection where fate becomes an unerring play to an individual. The winds of fate need the steering of the individual to conduct the journey of life in a desirable direction.<\/p>\n<p>“One ship sails East and another sails West With the self-same winds that blow, ‘Tis the set of the sail and not the gale That determines the way they go, Like the winds of the sea are the ways of fate,<\/p>", "images": [], "label": "Page 7"}, {"pdf_page_index": 7, "pdf_page_number": 8, "html": "<p>Wisdom of the Heavens<\/p>\n<p>5<\/p>\n<p>If we voyage along through life, ‘Tis the act of the soul that determines the goal, And not the claim or strife:<\/p>\n<p>(Ella Wheeler Wilcox) “Is astrology a science or an art?”  You can further enquire. It is science while learning and art while applying. It has the same position as that of medicine and law. A degree in medical science makes a practitioner but does not create a doctor. Healing is an art though medicine is a science. The same is the case with astrology. All practitioners may not succeed to unfold into doctors, lawyers, and astrologers. One in a thousand we find is in advance of the rest, enough to enlighten his knowledge of any science with his creative genius. When a prescription fails to cure, when legal advice fails to restore justice, or when prediction fails to come true, the fault is in the practitioner but not in the science.<\/p>\n<p>Man cannot deny the sunshine, the moonlight, the eclipses, new moons, and full moons. He cannot deny the effects of the various seasons that are cyclic. The farmer knows his seasons of agriculture, and the fisherman knows the tides for fishing. Man can foresee that there will be a sunrise tomorrow, if he does not kill himself in the<\/p>", "images": [], "label": "Page 8"}, {"pdf_page_index": 8, "pdf_page_number": 9, "html": "<p>Wisdom of the Heavens<\/p>\n<p>6<\/p>\n<p>name of religion or politics. Such experience forms the basis for the Wisdom of the Heavens. Whenever the basis is illumined by the sacred lamp of pure perception through the torch of quest, there is the development of astrological science. Through this wisdom, man can foresee the will of his Creator and await His command. From the state of a fate doomed creature, he is heaved under the one banner of the star-lit heavens to live as a hero, friend, adviser, guide and brother of mankind. No real student of science can ignore anything that is new to him. With thanks, he receives and through labour, he is rewarded. From the animal level of trying to conquer man and nature, he lifts himself up to the level of unfolding into nature to serve mankind. Then only he can be faithful to Mother Nature in not using the secrets for his own destruction.<\/p>\n<p>We prefer to follow such science. We read the symbols of this science and interpret it in terms of man’s tendencies, seeds, reactions, and results. We teach what we know. We interpret what we see. If man were to talk to His Father, it is through the vault of Heavens, The wisdom of the stars should be the language.<\/p>", "images": [], "label": "Page 9"}, {"pdf_page_index": 9, "pdf_page_number": 10, "html": "<h3 class=\"pdf-heading\">Astrology of the Scriptures<\/h3>\n<h3 class=\"pdf-heading\">“T o consider the origin of the science, we must take<\/h3>\n<p>our thoughts back to the earliest days of the world’s history, and further more to the consideration of a people, the oldest of all, yet one that has survived the fall of empires, nations, and dynasties, who are today as characteristic and full of individuality as they were when thousands of years ago the first records of history were written. I allude to those children of the East, the Hindus, a people, whose philosophy and wisdom are every day being more and more revived.” (Cheiro’s “Language of the Hand”). “The Hindu’s date their Kaliyuga from great periodical conjunction of the planets thirty-one centuries B.C. (“The Secret Doctrine” Vol. 1, p. 650).<\/p>\n<p>The Vēdas are packed with astrological wisdom. Astrology forms one of the six main keys of approaching the wisdom of the Vēdas. Śatapatha Brāhmaṇa, which is a key to the Yajurvēda, describes the full significance of the Day of Gods (our Lunar Year) with its 24 hours (twelve<\/p>", "images": [], "label": "Astrology of the Scriptures"}, {"pdf_page_index": 10, "pdf_page_number": 11, "html": "<p>Wisdom of the Heavens<\/p>\n<p>8<\/p>\n<p>new moons and twelve full moons of the lunar year) along with their full significance.<\/p>\n<p>It also describes how the 24 divisions of the lunar year can be applied to the day of the mortals. This division of time is called the formula of Gāyatri, the meter of the solar year as one song with 24 syllables. The Vēdic, Purāṇic, and scientific literatures of the pre-buddhistic ages describe the astronomical, astrological, and astro- biological cycles of the various scales of time through which our creation rolls. The cycle of food entering into man and the exit of man into the same cycle of food in the form of the elements of our earth are well known to all those who are initiated into the spiritual practice of ancient India.<\/p>\n<p>“The Lord of the Round (which we call the year) who is the protector of this creation is what we call the year. To him, there are two paths, one the northern path (the upward path of waters) and the other the southern path (the downward path of waters). Those who mind the rights to fulfil their desires attain the lunar consciousness (reproductive cycle). They again return to the round path. The sages take up the southern path when they desire progeny. This is called the journey of the Pitrus<\/p>", "images": [], "label": "Page 11"}, {"pdf_page_index": 11, "pdf_page_number": 12, "html": "<p>Wisdom of the Heavens<\/p>\n<p>9<\/p>\n<p>(reproductive intelligences). Again there is the northern path which is solar by nature and which is followed, through penance, celibacy, austerity, initiations, and learning for liberation. Through this process, they seek the one spirit in them. They attain the Solar Logos. This is the abode of life pulsations, this is immortality, this is fearlessness, and this is the path of to the Highest. Those who follow this, do not condition themselves, again by the cycles (Praśnōpaniṣad-1-10)<\/p>\n<p>“Night and Day are the two sides” (solstices), the arcs of heaven and the asterisms there in, mould the shape (of the cosmic man) (Puruṣa Sūkta).<\/p>\n<p>“And within the wheel of 24 nodes (new moons and full moons, six beings ever-young (the angels of seasons) are making it rotate. (Mahābhārata Book 1)<\/p>\n<p>“Sixty and three hundred one give the milk of the sun’s rays to the one calf (the solar year) (Mahābhārata, Book-1)<\/p>\n<p>Thus we see the scriptures abound in astrological wisdom. This is because, the grand formula of the year<\/p>", "images": [], "label": "Page 12"}, {"pdf_page_index": 12, "pdf_page_number": 13, "html": "<p>Wisdom of the Heavens<\/p>\n<p>10<\/p>\n<p>conceals within its geo-centric commutations, all the mysteries of the creation on this earth.  Of course, they know fully well that the solar system is “helio-centric” of which they sing in splendorous terms but for the purposes of astrology, they required the commutation in a geo- centric formula; the whole thing being called the first substituted secret of creation.<\/p>\n<p>“The year itself is Yajña (a self-less and not result- oriented process) - Bṛhadāraṇyaka Upaniṣad. This solar Yajña or the planetary activity of the solar system, as seen from the earth is imbedded in man, like a miniature. Man is realised as an epitome of the universe. If one follows the activity of the cosmos, it shows him the path of unfolding.<\/p>\n<p>“One who does not follow the path of this wheel is the one who has sin as his span. His span is devoid of significance (The Bhagavad Gīta). Whoever inculcates this one path into man, the scriptures impart to him the astrological key as a Master Key. Without this, man cannot unlock the secrets of the ancient lore.<\/p>\n<p>The whole universe is one of the chain actions that are continuous and that run in a spiral that culminates in<\/p>", "images": [], "label": "Page 13"}, {"pdf_page_index": 13, "pdf_page_number": 14, "html": "<p>Wisdom of the Heavens<\/p>\n<p>11<\/p>\n<p>its own origin. This spiral is called the pattern of Yajña. The chain actions of the whole universe are together termed Karma (Divine Karma). Man being a part of these chain actions carries with him the divine karma as his background. At the same time, man being a spark of the Light of God, he is created in the image and likeness of God on the earth. This fact makes him a creator on the background of the creation. He creates his own story as his own Karma. He is free to create this either in tune with the background Karma or out of tune. When he creates in tune, he is happy and is said to follow the path. When he chooses to be out of tune in the name of independence, he is unhappy, due to his first disobedience. Then he has to fall due to his own temptation and he has his self- proposed fruit that causes death. He experiences the fruit in the form of self-inflicted pain when he once again turns back like the prodigal child, who wants to return to his Father. Then he needs a Light to show him the path. This is what we call astrology in its true sense. Through this light, he knows what he has created for himself in the name of his past, what he is in the name of his present, and where he is bound in the name of his impression of the future. With the aid of the astrological light, he reads the language of The Law through his own planets and<\/p>", "images": [], "label": "Page 14"}, {"pdf_page_index": 14, "pdf_page_number": 15, "html": "<p>Wisdom of the Heavens<\/p>\n<p>12<\/p>\n<p>knows how to behave and how not to behave. He knows where he is strong and where he is to grow stronger. He also begins to follow the path and attains liberation. This is the real purpose of astrology that is prescribed by the scriptures of the ancient nations.<\/p>", "images": [], "label": "Page 15"}, {"pdf_page_index": 15, "pdf_page_number": 16, "html": "<h3 class=\"pdf-heading\">The Vēdic Astrology<\/h3>\n<h3 class=\"pdf-heading\">T he Wisdom of the Heaven dates back enough to<\/h3>\n<p>confuse the historians and the Indologists. In the Vēdic tradition, it is called “The Eye of the Cosmic Man”. It is the most important of all the six limbs of the Vēdic wisdom. Vēdanga Jyōtiṣa is a primer written by the sage Lagadha. This little book contains all the fundamental calculations of the seasons and the various beginnings of the year, which are used for different purposes. For example, when the vernal equinox (about March 21 st ) is taken as the beginning, the year is called Vasanta after the spring season. When the summer solstice (about 22 nd June) is taken as the beginning, the year is called Varṣa after the rainy season. When the autumn equinox is taken as the beginning (about Sept 21 st ), the year is called Śarad after the moon season or the season of crops. When the winter solstice is taken as the beginning (about 22 nd December), the year is taken as Hēmanta after the winter. These four points which serve as the four different beginnings of the year, stand ninety degrees apart from each other. Each of these four divisions is subdivided into seven equal parts.<\/p>", "images": [], "label": "The Vēdic Astrology"}, {"pdf_page_index": 16, "pdf_page_number": 17, "html": "<p>Wisdom of the Heavens<\/p>\n<p>14<\/p>\n<p>Thus, they had the zodiac of 28 equal divisions, which are called Nakṣatras. They decide the shapes of the physical bodies of all the living beings on this earth by producing various patterns and designs.  “Nakṣatras form the shape,” says Puruṣa Sūkta. They also form shapes of the various atoms and crystals that form around the centre of this earth. The magnetism of the earth produces magnetic lines of force that are called Pāśa (ropes), and the sun’s daily path along the equator produces the spirals which work as a coil, enough to galvanize the beings of the earth with the current of the conscious force which we call life. All these theories can be found described in the Vēdic texts like the hymn to Puruṣa, Agni, and Suparṇa, etc. The Vēdanga Jyōtiṣa of Lagadha gives only the astronomical side of the subject which is required to understand and follow the Vēdic hymns. The Brāhmaṇas, which are the oldest explanations to the Vēdic Texts, describe various stories which form the required allegories, for the explanations of the Vēdic texts. These stories are called Itihāsas, which are later taken and elaborated in the Purāṇas. All these stories explained the astrological significance of the Vēdic texts. This significance does not deal with the art of prediction only, as it is done by the modern branch of astrology. They are used to unlock the<\/p>", "images": [], "label": "Page 17"}, {"pdf_page_index": 17, "pdf_page_number": 18, "html": "<p>Wisdom of the Heavens<\/p>\n<p>15<\/p>\n<p>nature of the spirals of time that unfold into the trends of living beings through vast sweeps of time called Yugas, etc.<\/p>\n<p>Some of the stories imbed in their details the various workings of the solar year and the experiments of the sages to detect astronomical phenomena. For example, the ritual named Gavāmayana (the path of the rays compared with cows grazing and proceeding) describes how 360 cows move around an axis and how they cross the Viśuvat (equinox) every year. Time, as observed through the cycles of events, is described as    Prajāpati (the Lord who gives birth). Various periodicities of time are described as the various Prajāpatis who preside over the creation. For example, the Prajāpati Dakṣa is the father of 28 daughters (the twenty-eight Nakṣatras). He has given them all in marriage to Moon. This means the moon goes round the zodiac in 28 days forming the period of the menstrual cycle of the healthy woman. This cycle presides over fertilization, child-bearing, protrusion and childbirth. All these things put together form the Prenatal Epoch. The doer of the working of nature is described in the Purāṇas as the Mother Goddess who is the 29 th daughter of Dakṣa. Her name is Sati, the lady of existence. Dakṣa performed the sacrifice which is the solar year. Since he failed to<\/p>", "images": [], "label": "Page 18"}, {"pdf_page_index": 18, "pdf_page_number": 19, "html": "<p>Wisdom of the Heavens<\/p>\n<p>16<\/p>\n<p>invite the Lord in the sacrifice, his head was cut and replaced by that of a Ram. This means the sun cuts the equator from south to north at a point, which forms the beginning of that solar year. The first month is Aries that is symbolised by the head of a Ram. Like this, the Itihāsas and the Purāṇas describe the nature of various types of the year with its subdivisions formed by the movement of the Sun and the Moon. These stories enable us to understand the scientific symbols of the Vēdic texts.<\/p>\n<p>From the illustrations cited above, we can understand that the Vēdanga Jyōtiṣa is a part of the content of the Vēdic texts than a subject by itself. The text of Lagadha is ably a primer, which introduces the student into the astronomical data, which the subject requires. Many scholars think that the primer of Lagadha, which contains 43 verses, itself is the Vēdanga Jyōtiṣa. A student of first- hand knowledge cannot accept this. This text of Lagadha gives a proper footing in the fundamentals of the three branches which the subject contains in its advanced study. The Chandōgya Upaniṣad names these three branches as follows.<\/p>", "images": [], "label": "Page 19"}, {"pdf_page_index": 19, "pdf_page_number": 20, "html": "<p>Wisdom of the Heavens<\/p>\n<p>17<\/p>\n<p>1) Rāsi Vidya or the Wisdom of the beings of the Heaven, 2) Jyōthir vidya, the Wisdom of Light and the Planetary Lights, 3) Nakṣatra Vidya, the Wisdom of the arcs of the ecliptic.<\/p>\n<p>The book Vēdanga Jyōtiṣa seems to be the one composed to imbed the theories of Lagadha than of the authorship of Lagadha as is commonly supposed. The following passage of the text (translated into English) substantiates the fact.<\/p>\n<p>“With my head, I bow down to time. I bow down to the current of wisdom. I now speak out the knowledge of time, which is of the great soul Lagadha. Lagadha has commented about the month-year, Muhūrta (selective units of time), Udaya (rise of the sun and other planets), various nodes, the day, the season and the month)”<\/p>\n<p>Though post-vēdic in origin, it contains all the astronomical requirements of the real vēdic student. Hence, it is a very famous work that is to be consulted by every true student of the Vēdas. The book describes the<\/p>", "images": [], "label": "Page 20"}, {"pdf_page_index": 20, "pdf_page_number": 21, "html": "<p>Wisdom of the Heavens<\/p>\n<p>18<\/p>\n<p>various types of years, the divisions of the seasons, paths of the planets, and the rotation of the solstices. The division of the year, into the many starting points for the sake of commencing the various vēdic rituals, is the exoteric aim of the book. But the real spirit is to enable a student to unlock the centres and the keys of unity in the Vēdic hymns. There are two famous commentaries available to this book. One is written by Sudhākara, as a key to Astro-Spiritualism of the ritualistic applications of the Vēdic text. This branch is known as Yajuṣa  Jyōtiṣam. The other commentary is written by Sōmakara. It is a key to the sound application of the Vēdic mantrams. This branch is called Arc̣a Jyōtiṣam. This commentary is provided with a lucid glossary by Muralīdhara.<\/p>\n<p>The traditional wisdom of Cosmogenesis is of five divisions. They are called the collections of the cosmic book. They are enumerated as follows.<\/p>\n<p>1 Cosmology 2 Science of Light 3 Science of Learning 4 Science of birth 5 Science of Self-expression.<\/p>", "images": [], "label": "Page 21"}, {"pdf_page_index": 21, "pdf_page_number": 22, "html": "<p>Wisdom of the Heavens<\/p>\n<p>19<\/p>\n<p>Astrology comes under the second section, the Science of Light.<\/p>\n<p>The Science of the birth of Light from darkness is considered to be a base of astrology. This portion of the Vēdic Wisdom is called Āraṇyaka or the volume of fire churning. Araṇi is a symbol of fire churning of the Vēdic rituals. Also, that part of the Vēdic hymns, which is called Aruṇam, (the red ray) deals with the birth of red colour from darkness as the first emanation of light. Hymns on the Sun God also provide us exhaustive information of the solar deity and the solar year to our earth. Śatapatha Brāhmaṇa is full of the details of the rounds of time.<\/p>\n<p>A wonderful law of correspondence is given everywhere in the Vēdas and the Upaniṣads about the astrological wisdom. It is about the flow of life currents and the consciousness of the human beings around our earth in accordance with the phenomena of the solar year. The northern journey of the sun, which takes place during the six months; between December 22 nd and June 21 st is called the upward flow or Uttarāyaṇa. During the other half that marks the journey of the Sun towards the south marks the downward flow or Dakshināyaṇa.<\/p>", "images": [], "label": "Page 22"}, {"pdf_page_index": 22, "pdf_page_number": 23, "html": "<p>Wisdom of the Heavens<\/p>\n<p>20<\/p>\n<p>The upward flow causes the upward path of the water on this earth by way of evaporation. The downward flow marks the formation of clouds and the coming down of rain for the fertilization of the earth to bear its fruit. The consciousness of the human beings also marks these two phases. The upward flow causes the creative consciousness of man, while the downward flow causes the reproductive or the procreative consciousness. When man marches towards self-realisation and the realisation of God, through a process of self-discipline and the regulation of his metabolic, mental and emotional activity; then, he is said to follow the path of Gods. When human consciousness begins to dwell in mind to respond through the senses in terms of enjoyment, he is said to follow the path of the Pitrus or the reproductive intelligence of the earth. Dēvas govern the creation of this earth and come down directly, through the sunbeams. The Pitrus govern the reproductive process of every man, animal, and seed. They come down the earth through the beams of the sun and the Neptune via the Moon of our earth. Through knowledge of the vēdic astrology on these lines, man is expected to follow the discipline of the two paths and tune himself with the cosmic consciousness by a disciplined<\/p>", "images": [], "label": "Page 23"}, {"pdf_page_index": 23, "pdf_page_number": 24, "html": "<p>Wisdom of the Heavens<\/p>\n<p>21<\/p>\n<p>way of regulating his activity. It is mainly for this purpose that astrology is used in scriptures.<\/p>\n<p>The stories of Nac̣ikēta, Bhṛgu, the Son of Varuṇa; Janaka, the King of Vidēha; contains many allegories of astrological significance. The same thing is found in the Brāhmaṇas and the Purāṇas also. It is understood that the formula of the whole creation on this earth in all its detail, is concealed in the year, should be understood to know the full significance of our activity. Every moving body in space is a spheroid. It precipitates almost into the same shape because space has the geometrical properties of a sphere concealed in the plane of space mind. This gives rise to the solidification of planetary bodies into the same shape; the process being the same as that of crystallisation. It is a peculiar fact that crystals are shape- conscious.<\/p>\n<p>The birth of a solar system is described as follows. First of all, a point is periodically awakened in the latent space, then there is an instantaneous separation of that point from all the rest. It is the birth of objectivity as a first step. It is like a man who is being repeatedly awakened from sleep, starting his routine. The space around this<\/p>", "images": [], "label": "Page 24"}, {"pdf_page_index": 24, "pdf_page_number": 25, "html": "<p>Wisdom of the Heavens<\/p>\n<p>22<\/p>\n<p>point assumes the shape of a sphere. The path of the planets around the sun is also formed into a regular shape due to the same reason. As the earth goes around the sun, it describes the elliptic path, which is described as the ring of the zodiac. This produces the effect of the sun going around the earth, which is the apparent belt of the zodiac. This is the one, which the astrologers take into account since all the phenomena on this earth are not as they are, but they are as they appear. For example, the sun appears to rise in the East, and we, the beings on this earth, have the sunrise. It is discovered that the belt of the zodiac can be divided into as many equal parts as there are the creative varieties on this earth. Only the main types of equal divisions are taken into account in the Vēdic astrology:<\/p>\n<p>1.The zodiacal ring is divided into two equal parts. One starting from the longest day and the other starting from the longest night. The division is called ‘the bird with the wings’.<\/p>\n<p>2.   Another division is by the two equinoxes, the vernal equinox, and the autumn equinox. This is also a division of the zodiac into two parts, which is called another bird.<\/p>", "images": [], "label": "Page 25"}, {"pdf_page_index": 25, "pdf_page_number": 26, "html": "<p>Wisdom of the Heavens<\/p>\n<p>23<\/p>\n<p>Two eggs have been produced by Mother Nature to give out two birds. One egg produced one bird, only with his anterior parts of the body developed.  Another egg has produced the perfect bird, Suparṇa. These four points are called the equinoxes and the solstices. They occur respectively on March 21, June 22, Sep21, and Dec 22 of every year. They divide the zodiac into four equal parts called the four heads of the Creator by the Purāṇic symbolism. They are also called the four beasts of the heaven in the ancient symbolism of the Old Testament. 3.   Again the zodiacal ring is divided into twelve equal parts according to the twelve months of the year. This division also starts from the vernal equinox. This is the only division that is followed in the modern astrology as the only division of the zodiac. 4.   Again the whole zodiac is divided into five equal parts. This division is called Panc̣apāda in the Vēdas. It is said to be the pathway of the Pitrus. It produces its effects upon the five sense organs of an individual. 5.   Another division is from the vernal equinox. The zodiac is divided into three equal parts of nine<\/p>", "images": [], "label": "Page 26"}, {"pdf_page_index": 26, "pdf_page_number": 27, "html": "<p>Wisdom of the Heavens<\/p>\n<p>24<\/p>\n<p>subdivisions each. This gives us a total of 27 equal divisions called Nakṣatras. In fact, the term “Nakṣatra” signifies any division of the zodiac into equal parts. But subsequently, this particular division is known by that name. This division gives us a clue to understand the relationship between the moon phases and the mental activity of the beings of this earth. 6.   Another division is into 28 equal parts. This is also called the Nakṣatra division. This is made as four equal divisions having seven sub divisions each. This is calculated after the daily motion of the moon. This gives us a clue to understand the relation between the moon- phases and the menstrual cycles of a woman. It also gives us the calculations of the periods of the Pre-natal Epoch. 7.   Then there is the division into 360 equal parts, called degrees. This gives us a clue to understand the annual readings of the horoscope as well as the condition of the soul before birth and after death. 8.   Again there is a division of 720 equal parts, which are called half-degrees. This gives us a clue to read the horoscope through periods of six months each. Like this<\/p>", "images": [], "label": "Page 27"}, {"pdf_page_index": 27, "pdf_page_number": 28, "html": "<p>Wisdom of the Heavens<\/p>\n<p>25<\/p>\n<p>we have many sets of correspondences with their respective clues in the Vēdic astrological wisdom.<\/p>\n<p>Among the various sacrificial symbols of the Vēdas, we find the horse as prominent, and which has much to do with the astrological science. All religions and mythologies have included this symbol. It is understood as a created symbol of power and swiftness. In the Vēdic literature, it represents the vital force that is being produced by the sun’s rays and that which galvanizes the chemistry of living bodies into the organic state of metabolism. The solar year is divided into 27 equal parts from the vernal equinox. The head of the horse is located at the beginning of the year. This is because of the mystic force and swiftness of the vital principle that is being flooded just after the time of the vernal equinox. The head of the horse is located in the first division and the tail is located in the 20 th division of the zodiac of 27 equal divisions. The first division is called Aśvini, and the last division is called Pūrvāṣāḍa. The head and the tail of the horse, when traced, give a major portion of the history of the heavens.<\/p>\n<p>“The dawn, in one way, is the head of the horse of wisdom”, says the Bṛhadārnyaka Upaniṣad, which<\/p>", "images": [], "label": "Page 28"}, {"pdf_page_index": 28, "pdf_page_number": 29, "html": "<p>Wisdom of the Heavens<\/p>\n<p>26<\/p>\n<p>discussed the import of the symbol horse sacrifice. This passage of the mantrams describes the whole space of the zodiac as the body of a big horse (the life-space of the zodiac as the body of a big horse, the life-principle) which is eternally sacrificed into the creation. The next passage describes the time of the duration of the whole day also as a horse. The “horsiness” of space and time is the main import of the Aśvamēdha sacrifice. The brighter half of a day is solar by nature and is called the Golden Cup in the sacrifice. The darker half is lunar by nature and is called the Silver Cup. They are kept one inverted upon another with the golden cup above and silver cup below the horizon relative to the observer’s position. Among the fixed stars of the heavens, there is one star which is called horse head. It is in the constellation called Aśvini. The horse-sacrifice speaks of the astronomical phenomenon which binds the horse (life force) in the heavens to prepare Anna (metabolic activity) for the whole year. “To perform the act of the ritual, the sacrifice brings which is called the horse, tied with a rope (line of force) made up of the rhythm”. It extends twelve measures for the performing of the sacrifice (the twelve months of the year).  The year itself obtains the formula of sacrifice. Therefore it is said that the rope should be of 12<\/p>", "images": [], "label": "Page 29"}, {"pdf_page_index": 29, "pdf_page_number": 30, "html": "<p>Wisdom of the Heavens<\/p>\n<p>27<\/p>\n<p>measures. At times, it is of 13 measures, (every three years of the lunar computation) there will be a 13 th month required to make an adjustment with the solar year.<\/p>\n<p>“Prajāpati (the cycle of time) created the horse- sacrifice. The horse was created from this. Through the higher limbs, he entered the directions. The Dēvas wanted to send it down and linked it with a sacrifice to fulfil desires”. The Prajāpati created the horse-sacrifice. By the higher force, he became five-fold and entered into the year (the five equal divisions of the year). Those divisions became half-months (the period between two lunations). He linked them with sets of 15 days.”<\/p>\n<p>Thus, we see the various divisions into which the horse of the heavens descends to the earth or matter. The year, the months, and the days are divided into many types of divisions, which are not known to the modern astrologer or astronomer. Each type of division is for a different purpose. Their effects are indicated by the celestial phenomena on the physical, mental, spiritual, sexual, and emotional levels of the biological kingdom.<\/p>", "images": [], "label": "Page 30"}, {"pdf_page_index": 30, "pdf_page_number": 31, "html": "<p>Wisdom of the Heavens<\/p>\n<p>28<\/p>\n<p>The formula of the heavens is described in an interesting mystic passage in the Mahābhārata, Book1 in Chapter 3. “There are two women spinning threads in white and black (manifestation and unmanifestation as expressed through the light and the darkness of the day and the night). The two women are weaving the cloth out of the fabric (the day having two halves). There is a wheel of twelve edges, ever-rotating (the days and nights are contained in a wheel of twelve months). The wheel is being rotated by six Kumāras (ever young beings, who are the seasonal splendours). There is a person who is to be approached only through the eye (the cosmic person expressing himself as the Sun God). Three hundred and sixty spokes are being rotated at the centre; where there is a fulcrum (the fulcrum is the ‘I AM’ - consciousness of the Sun-God). The six Kumāras are making the wheel of 24 nodes rotate around its own axis (twelve full moons and twelve new moons or the 24 nodes, which give the formula of the song of the year called Gāyatri). The bearer of thunder, the preserver of the existence, the killer of limitation, and the slayer of the impregnable layers is the one who rides upon the horse. (The bearer of thunder is called Parjanya, the God of rain. The preserver of existence is called Fire, the killer of limitation is Puruṣa,<\/p>", "images": [], "label": "Page 31"}, {"pdf_page_index": 31, "pdf_page_number": 32, "html": "<p>Wisdom of the Heavens<\/p>\n<p>29<\/p>\n<p>the ‘I AM’ - consciousness. The slayer of the impregnable layers is the Sun, who drives away the layers of darkness by his rings of light. The horse is the vital force which bears everything in equilibrium). The horse is the offspring of the waters and is of very ancient origin. It is called Vaiśvānara (the Man in the creation). We bow down to him who has this horse as his vehicle. He is the Lord of this passing universe. He is the Lord of the three worlds, physical, mental, and spiritual. He is the destroyer of the cities (bodies or shapes).<\/p>\n<p>As we see in the above passages, the astrological symbolism of the ancients is expressed through symbols that are profound and very significant. As we begin to extract the significance and put it in application, we find that many new horizons appear before our mind’s eye in the field of modern astrology, which is too meagre to cater to the scientific interest of the modern mind.<\/p>\n<p>The formulae and the symbols, as well as the deductions of the ancients, are nowhere empirical of hypothetical in their nature. They are the expressions of the seers’ minds who were inspired by the self-conscious mysteries of Nature and their splendours.<\/p>", "images": [], "label": "Page 32"}, {"pdf_page_index": 32, "pdf_page_number": 33, "html": "<p>Wisdom of the Heavens<\/p>\n<p>30<\/p>\n<p>The science of the “beasts of the heaven” is age-old and it is an absorbing study. The ancients have located the shapes of all the creatures on earth having their moulds in the constellations of the sky as they appear to the beings of this earth. Each group of stars presents through its combination a shape that is received by the earth during its journey around the Sun. The shape will be fertilised by the sun’s rays of various seasons. The fertilization takes place in the etheric body of the earth, which exists as the aura around the earth which, we call the atmosphere. All the atmospheric phenomena are due to this fact. The term “horse” is the shape by which we recognize it. Into this shape flesh and blood are filled, while the seed of the shape is being fertilized by the rays of the moon falling on the earth, The shapes of all beings, living and non-living are beings. Man is recognized by the shape of man and the tree is recognised by the shape of the tree. Any animal is recognised by its own shape.  Even the so- called non- living wall is recognized by its wall nature that presents to us. The shape of the horse is the natural symbol to recognise and the name “horse” is the man-made symbol, which bears no truth with it. Thus, we see the animal exists in its shape. These shapes exist in the arc of the<\/p>", "images": [], "label": "Page 33"}, {"pdf_page_index": 33, "pdf_page_number": 34, "html": "<p>Wisdom of the Heavens<\/p>\n<p>31<\/p>\n<p>heavens. The ring of the zodiac is divided into many arcs called Nakṣatras. Certain arcs contain the shape of the particular animal to present to the earth “The Arcs of Nakṣatras present the shapes”, says Puruṣa Sūktam. The shape of every animal exists in shape around our earth, which we call the zodiac. It is made flesh periodically, in the concerned season. Even the shape of our very earth, like that of all the other planets and the Sun exists in space and comes down periodically. It is made flesh by the Logos of the Sun. Even the formation of the solar globe follows the same procedure. A spark comes out from the parent Sun through an urge which is conscious. It is lodged in the womb of space. It develops into its own existence with all its counterparts. Around it, the shape assumes the form of a globe.<\/p>\n<p>Along the space around us, the shapes of the various beings exist as seeds. As the earth furrows the space in its journey around the Sun, these shapes are impregnated by the positive space, which has the Sun as the geometrical centre. Geo-centric space is negative and helio-centric space is positive by nature in their behaviour, in terms of electricity and magnetism. When the negative space is charged or impregnated by the space along which the<\/p>", "images": [], "label": "Page 34"}, {"pdf_page_index": 34, "pdf_page_number": 35, "html": "<p>Wisdom of the Heavens<\/p>\n<p>32<\/p>\n<p>sun’s rays reach the earth, the shapes in the negative space are “brought to light”. Then there occurs a peculiar atmosphere in the space, and we call it the season. The season brings down the shape when the seed of the shape is germinated into the animal or plant after that season. In this respect, the Sun is described as having the bull nature in the Vēdas. The year imbeds all these secrets and hence is called the Prajāpati (the creator and the ruler). The divisions of the zodiac are called “Rāśis” in Sanskrit. The term means the group of animals. In the Vēdic language, they are called Paśūs. The term means the beings that are bound by a rope to rotate around a centre. The word zodiac also means a group of animals. The belt of the zodiac is studded with the moulds of all the living beings that are to come down into flesh, in every bigger or smaller cycle, according to the speeds of the rounds.<\/p>\n<p>Of all these animals, the horse is speedy and has a powerful grip over its own flesh and blood through the power of its nerve. The shape of the horse in space also should be force and speed. A study of the mould and the harnessing of it is the significance of the horse-sacrifice (Aśvamēdha).<\/p>", "images": [], "label": "Page 35"}, {"pdf_page_index": 35, "pdf_page_number": 36, "html": "<p>Wisdom of the Heavens<\/p>\n<p>33<\/p>\n<p>There are the sacrifices of the shapes of all the animals in the Vēdas, and they should properly be understood and conducted with the help of the astrological and ritualistic clues. Of course, they have been much polluted through time by those who tried to do these sacrifices; by sacrificing the animals around them and making themselves beasts in their behaviour.<\/p>\n<p>At the first appearance of the sun every day in the East, there is the emanation of the horse on the horizon. The dawn is always a stimulation point of the horses. The chariot of the sun is drawn by “the seven horses as one”. The beginning of the year is made by the arc of the horse, which is called the Nakṣatra-‘Aśvini’. The beginning of the creation by the Dēvas is also conducted in the same way. It is said that Viśṇu, the omnipresent principle of the Absolute was in sleep. A germ was produced by the creator consciousness Brahma. It could eat the thread of the bow of Viśṇu. (The bow is the arch of the heavens, and the thread is the diameter which passes through the created centre.) Then by the force of the bow, the head of Viśṇu is broken and later replaced by the head of a horse. This is the origin of the horse-headed deity, Hayagrīva, in the ancient Indian Pantheon. The endless circle of the<\/p>", "images": [], "label": "Page 36"}, {"pdf_page_index": 36, "pdf_page_number": 37, "html": "<p>Wisdom of the Heavens<\/p>\n<p>34<\/p>\n<p>ecliptic is marked by the germ, and the marked point started the creation once again. Every year the vernal equinox marks the point of the beginning of the year. This allegory is given in the Purāṇa called Dēvi Bhāgavataṃ. The beginning of the year bears perfect correspondence with the beginning of the day. These two bear correspondence with the point on the Eastern horizon at the time of the birth of any being on this earth. This point is called the Ascendant or the Lagna of the horoscope of that particular being. All the planets are calculated in relation to the Lagna. The space globe around us will have its beginning and ending with the Lagna when it bears a perfect correspondence of all the configurations of planets at the time with the parts of the body of that being when it is lying folded in the egg in the mother’s womb at the time of the fertilization.<\/p>", "images": [], "label": "Page 37"}, {"pdf_page_index": 37, "pdf_page_number": 38, "html": "<h3 class=\"pdf-heading\">Worlds within Worlds<\/h3>\n<h3 class=\"pdf-heading\">T o the naked eye, the banyan seed is nothing more<\/h3>\n<p>than a globule with some irregularity in its structure. To the mind, it is a germinative-unit. To the consciousness of the soul, it is the potential where the whole banyan tree is printed on the plane of recollection. Similarly, the space around us is an empty globe to the naked eye, the eye naked of mind. To the mind that is stimulated into comprehension, the space globe is a seed of himself to everyone who observes it. That point of the horizon wherefrom the Sun appears every morning is the stalk of the seed in which he is himself lying through his span. To the consciousness of the soul, it is the original of which this position, the mother’s womb was a replica at the time when he was established in the name of fertilisation. The germ of the father has time to establish in the egg of the mother to inaugurate his own existence, and the time and place of that occurrence present the globe of space, which gives the stimulation to the child in the mother’s womb. The point on the Eastern horizon, at the time of the fertilization, corresponds with the stalk of the egg in the<\/p>", "images": [], "label": "Worlds within Worlds"}, {"pdf_page_index": 38, "pdf_page_number": 39, "html": "<p>Wisdom of the Heavens<\/p>\n<p>36<\/p>\n<p>mother’s womb. Along the inner surface of the egg, the map of the zodiac is printed with the position of the planets at that time. The planets in the solar system sow their seeds in the egg to form the tendencies that stimulate the inner soul to enfold into its own mind, senses, and body.<\/p>\n<p>The soul is a traveller who had completed part of his journey through the spiral paths of evolution and reached a particular stage, when it entered the mother’s womb at the time of fertilization. The position of the planets at that time is an index of the stage of evolution, the soul is passing through. It is a sequence of the past phases with seeds of the future stages. The horoscope calculated for the time of fertilization has a past and future. When progressed forward it indicates the future, and when progressed backward it indicates the past. The position of the developing frame of the child with all the limbs drawn towards a centre around which it lay folded, indicates another important point which we call umbilicus. The position of the head bears a correspondence with the Eastern horizon and the zodiacal sign rising at the time, along with the planets therein. The umbilicus bears its correspondence with the 7 th house, and the zodiacal sign<\/p>", "images": [], "label": "Page 39"}, {"pdf_page_index": 39, "pdf_page_number": 40, "html": "<p>Wisdom of the Heavens<\/p>\n<p>37<\/p>\n<p>that is setting along with the planets therein. These two points, the first house and the seventh house of the horoscope, at the time of fertilization work as two poles, to distribute the matter of the tissues that form the physical body. The head centre, which corresponds with the first house works as the positive pole, and the solar plexus, which corresponds with the seventh house works as the negative pole to serve the purpose of the distribution of the matter of the tissues. The head centre is the first to form at the time of fertilization and serves as the transmitting centre as a potential at first. It is thrown down in the course of the formation of the spinal tube along which the creator consciousness of the individual makes its sojourn, to investigate the downward path. The third book of Bhāgavataṃ describes this as the journey of Brahma, the creator into the barrel of the lotus stalk upon which he is seated. Brahma questions to himself “where am I and where from this Lotus sprouts?” Then he makes a journey down the barrel to know the depth of the ocean upon which he is floating. Then he questions himself as to how to create this unit creation. From the yonder skies of the cosmic existence, he receives the feeling that he is not a separate entity from the rest. He is a part of the whole and he is a world within a world and a creator within the<\/p>", "images": [], "label": "Page 40"}, {"pdf_page_index": 40, "pdf_page_number": 41, "html": "<p>Wisdom of the Heavens<\/p>\n<p>38<\/p>\n<p>creator. This makes him understand that he is not the creator, but he is a creator. He is made to create and not expected to create himself. This gives him the plan for his creation which is but a replica of the plan that already existed around and within himself.<\/p>\n<p>In the womb of the mother, the creator consciousness finds itself induced by its pair of creators (father and mother) to create its own frame in the same old fashion as that of the parent. Then the planets progressing from the time of fertilization, will suggest to him from time to time, through impression as to what chemicals he has to extract from the mother to form the content of the physical body. They initiate him into the mysteries of the numerical potencies by virtue of which he produces the limbs and their counterparts in fixed numbers. Example: His pair of eyes, pair of nostrils, pair of ears, lungs and thirty-two teeth, etc. Number consciousness, shape consciousness and mind consciousness develop simultaneously to assist the reproduction of the frame and its growth. Here the planets work as the planetary Masters, who initiate the soul into the recollection from his past births. In the light of these things the soul works up the sheaths required around him and enacts a drama of nine months during<\/p>", "images": [], "label": "Page 41"}, {"pdf_page_index": 41, "pdf_page_number": 42, "html": "<p>Wisdom of the Heavens<\/p>\n<p>39<\/p>\n<p>which time it assumes all the shapes of its past journey from the stage of an amoeba to the present stage of a human being. The planets also give stimulation to the functional side of the metabolism, which is but a habit- forming nature to repeat the function in equal periodicities of time.<\/p>\n<p>What the mother’s physical body is to the child, the space globe is to the soul to serve as a model according to which the child is to be developed. The wisdom of the heavens imparts this branch of information through the law of correspondence, which forms the main key to read the script of the vault of the heavens.<\/p>", "images": [], "label": "Page 42"}, {"pdf_page_index": 42, "pdf_page_number": 43, "html": "<h3 class=\"pdf-heading\">The Validity of the Zodiac<\/h3>\n<h3 class=\"pdf-heading\">T he word “ZODIAC” means a group of living animals.<\/h3>\n<p>In astrology, we find the names of the 12 signs of the zodiac with a description of each sign and its influence upon the people on the earth. Do the animals really exist in the heavens around us? Do the ram, the bull, the twins, the crab, the lion, etc., exist as the objective truths? On what basis do the astrologers believe in the existence of the influence of the zodiac along the 360 degrees around the equator? We definitely know that there is nothing materially real, which can be located as the zodiac. The clusters of galaxies are roughly divided into twelve groups, each of which represents an animal. Some people say that the shape of the group of the stars in each sign resembles the animal it represents. This is faintly true because the various stars in each group do not themselves resemble the animal. The imaginary lines drawn in the mind of the astrologer, to join the different stars give a faint resemblance to the animal. This is only true in the case of the sidereal zodiac and not at all the tropical<\/p>", "images": [], "label": "The Validity of the Zodiac"}, {"pdf_page_index": 43, "pdf_page_number": 44, "html": "<p>Wisdom of the Heavens<\/p>\n<p>41<\/p>\n<p>zodiac, which begins with the vernal equinox, and which has nothing to do with the corresponding clusters of the stars. The truth of the existence of a zodiac lies far beyond this argument.<\/p>\n<p>When you see a group of people from the top of a building, you find some incidental shape into which the group is formed. A group of many thousands of people travelling may appear like a snake or like a row of ants when seen from the top of a mountain. The whole perspective of a city, town or village may give the shape of a dog, a lion or a set of squares and triangles when seen from above. From an airplane, cultivable fields appear like many squares in beautiful colours. Each shape contains thousands of units like houses, trees, rivers or mountains. The shape does not exist to the various units within the shape, but it exists to the eye of the observer. At the same time, the shape influences the eye and the mind without influencing the objects in the group. The beautiful face of an actor in a drama influences the mind of the audience, fascinating it and making an impression, which stimulates an emotion or a thought. At the same time, the emotion and thought do not exist to the anatomy or the biology of the face of the actor. Yet it is not false that the audience is<\/p>", "images": [], "label": "Page 44"}, {"pdf_page_index": 44, "pdf_page_number": 45, "html": "<p>Wisdom of the Heavens<\/p>\n<p>42<\/p>\n<p>influenced by the shape, and a story is conveyed to the mind of the audience. Herein lies the truth of the existence of the zodiac. Everything around us presents as its own shape, as it appears to us without itself being influenced by the shape. The clusters of stars throw upon our mind’s eye the various shapes in which they appear from a distance. The shapes influence the beings of this earth, whether conscious or unconscious. The existence of the various articles and their arrangement in a room influences the mind of the person working in the room, whether he is consciously noticing the existence or not. When the arrangement of articles (in the room) is orderly, the mind of the person working there is also in an orderly way. If the articles in the room are clumsy, then the mind works in a disorderly and uncomfortable way. The order influences the work he does in the room.<\/p>\n<p>The clusters of stars in the distant galaxies contain only the various suns seen from a distance. Each sun has his Solar system, which is not visible either to the naked eye or to an instrument. Yet the shapes of the groups of these stars exist to the beings of the earth, though they do not exist to themselves. Each solar system receives its own shapes of the galaxies around itself, as seen from it.<\/p>", "images": [], "label": "Page 45"}, {"pdf_page_index": 45, "pdf_page_number": 46, "html": "<p>Wisdom of the Heavens<\/p>\n<p>43<\/p>\n<p>Our earth is not merely a lump of minerals and some water. It is a unit of many forces at work. Magnetic currents exist in lines in all directions around the earth influencing the space that surrounds the earth. The space around a magnet is influenced by the magnetic lines it produces. This can be observed by the shapes into which iron filings arrange themselves when they come into contact with the magnet.<\/p>\n<p>Similarly, the lines of force around the earth globe influence the space around the earth, and the result is that the earth globe exists as the equilibrium of many thousands of forces at work keeping the earth globe in poise. As the earth receives the rays of our sun, it will produce electricity by virtue of its rotation around itself, and describing its path around itself, and describing its path round the sun. The apparent path of the sun around the earth produces various spirals which give the earth the induction of electricity. So the earth and sun’s rays combine to work to form the electro-motor unit. The rays of the sun emit the various phenomena of which the heat and the light and the spectroscopy are but a few items. Each has its own influence upon the earth while reacting with the magnetic lines of the earth. Thus we can imagine<\/p>", "images": [], "label": "Page 46"}, {"pdf_page_index": 46, "pdf_page_number": 47, "html": "<p>Wisdom of the Heavens<\/p>\n<p>44<\/p>\n<p>that the space around the earth is charged in more than one way. This charge works beyond our imagination in producing various effects. The heat, light, and magnetic currents are but the various states of electricity, which are not yet fully know into the modern concept of electricity. It will be proved in the future that what we call life, mind, mood, concept, emotion, etc., are all the manifestations of the same electricity that exists in the space around the earth. What we call matter with all its differentiations is but a range of equilibriums among the states of the same electricity. The nuclear activity of the atoms, the biological activity of the cells, and the chemical reactions of the molecules are all the same activity of the states of electricity.<\/p>\n<p>As the earth receives the various shapes of the clusters of stars from a distance, it is influenced and conditioned by these shapes. Each shape contributes to the formation of the various nuclei of the atoms and cells. It also influences the formation of minerals with all their chemical properties and reactions to each other. It galvanizes the life of this earth which produces units of matter into the shapes of the bodies of the various animals and plants. The formation of the anatomy of each animal<\/p>", "images": [], "label": "Page 47"}, {"pdf_page_index": 47, "pdf_page_number": 48, "html": "<p>Wisdom of the Heavens<\/p>\n<p>45<\/p>\n<p>is due to the shape it receives from a distance. The influence of the shape is so great that the parent produces the same type of anatomy in the body of the child. We find the shape of the skull, the number of the bones, teeth, eyes, ears, nose, lungs, heart, bladder and kidneys, etc., are produced in the same shape and structure as that of the parent. All these are the result of the influence of the shapes of galaxies around upon the manifestation of life on this earth. Thus the very existence of each of us as a unit of many forces is conditioned, and influenced by these shapes every moment. This concept gives us an idea of the predictability of behaviour about each being on this earth. Each being including the human being is born and bred up in its own shape. It conditioned by its own shape internally and externally. This gives the birth and the functioning of the mind with its subjective and objective activities. At the same time, it also contains a unit force which is the resultant of all the forces. This unit force gives it a number of its own, which is number one and which is felt as the ‘I AM’ of it. This works as the individuality and the personality of each unit, which evolves through births and re-births. This is the basis of the belief of the zodiac influencing upon man.<\/p>", "images": [], "label": "Page 48"}, {"pdf_page_index": 48, "pdf_page_number": 49, "html": "<h3 class=\"pdf-heading\">The Measures of Time in<\/h3>\n<h3 class=\"pdf-heading\">the Zodiac<\/h3>\n<h3 class=\"pdf-heading\">T he zodiac symbolizes both space and time. Time is<\/h3>\n<p>the duration of the succession of events that occur in a cyclic order. The phenomenon of time occurs in the arena of space and space is a globe relative to any particular point of manifestation. The aspect of time taken separately and studied relative to the zodiacal signs discloses the proportions or measures which contribute to the unity of “the solar chariot” of the Vēdic and Purāṇic wisdom, as well as the Solomon’s Temple of the Masons.<\/p>\n<p>The time taken by the earth to go round the sun once is called the solar year. This cannot be expressed by rounded numbers through any series of minute divisions or decimal figures. All the calculations relating to the day, the solar year, and the planetary revolutions get their round figures only at the time of the great dissolution (Praḷaya). What all we can obtain is only an approximation of figures, as measures of time, and this is<\/p>", "images": [], "label": "The Measures of Time in"}, {"pdf_page_index": 49, "pdf_page_number": 50, "html": "<p>Wisdom of the Heavens<\/p>\n<p>47<\/p>\n<p>enough for our purposes. These computations are reckoned by the seers of wisdom from a point on the equator. The duration of the period between sunrise and sunset equals that between sunset and sunrise on the day of the equinox, that too only to an observer on the equator; after the day of the vernal equinox, the duration of the day gradually increases with a corresponding decrease of nights at the rate of 24 minutes per month. That is when the sun crosses the annual meridian (Aries zero), the day and the night are equal. When the sun enters Taurus, the day is prolonged for twenty- four minutes more, and there is an equal decrease in the duration of the night. When the sun enters Gemini, the duration of the day is further increased by twenty-four minutes. By the time the sun enters Cancer or the summer solstice (which marks the Western horizon of the year or the abode of Varuṇa), the day is prolonged further by twenty-four minutes. Henceforth, it begins to decrease. The arc of 90 degrees from the beginning of Aries to the beginning of Cancer will cause an increase of duration of the day by 72 minutes in time. Similarly, the 90 degrees of the arc between the beginning of Cancer and the beginning of Libra will cause the duration of the day to<\/p>", "images": [], "label": "Page 50"}, {"pdf_page_index": 50, "pdf_page_number": 51, "html": "<p>Wisdom of the Heavens<\/p>\n<p>48<\/p>\n<p>decrease by 72 minutes in time and hence, we have the day of the autumn equinox when the sun crosses the nadir of the day of gods. Similarly, the 90 degrees from Libra to Capricorn will cause the duration of the night prolonged by 72 minutes in time. Again the arc of 90 degrees from Capricorn to Aries causes the duration of the night to decrease by the same 72 minutes in time. Of course, these numbers, as already stated are mere approximations. The soul expansion and the unfolding of the spiritual consciousness will be aided by a thorough knowledge of these computations, when one assumes the physical posture, and the mental attitude, and also the equilibrium of breath.<\/p>\n<p>The numbers in the digit of 24 minutes are very significant. Twenty four denotes the number of hours in the solar day, as everybody knows. There is however a hidden side to it. A period of 24 minutes in the duration of the day (the allotted time depends upon the season) when used by the occultist for the practice of Pranayama, has considerable significance in his evolution. The number 72 of the 72 minutes is also very significant. For the precession of the equinoxes to cover up one degree in the<\/p>", "images": [], "label": "Page 51"}, {"pdf_page_index": 51, "pdf_page_number": 52, "html": "<p>Wisdom of the Heavens<\/p>\n<p>49<\/p>\n<p>zodiac, it takes 72 YEARS (APPROXIMATELY). The apparent rotation of Jupiter around this earth zodiac is twelve solar years. Six such rotations would extend over 72 years. Six-sets of 72 years give the duration of time for Jupiter to go round the apparent zodiac, 36 times and the for the procession of the equinoxes by 3 degrees. This period is 432 years which forms the base number for the computations of the great cycles of Yugas and MahāYugas.<\/p>\n<p>The wise men of the past had two different divisions of the duration of the solar day. These divisions are made by them according to the law of correspondences. They are:<\/p>\n<p>1 The day is divided according to the formula:
