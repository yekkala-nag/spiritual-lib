in Spiritualism, as well as the explanations of the phenomena which Mme. Blavatsky herself demonstrated, a close association followed which in due time led to the founding of The Theosophical Society in New York in 1875. Olcott de­ voted the rest of his life to the cause of Theosophy, being Presi­ dent of the Society until his death in 1907.<\/p>\n<p>OMNIPRESENT PRINCIPLE (See Principle, An Omnipresent).<\/p>\n<p>ONE LIFE The Causeless Cause of Spirit and Matter—which are<\/p>\n<p>the cause of Kosmos—is called the One Life, or the Intra- Cosmic Breath, in esoteric philosophy. 'From the ONE LIFE formless and uncreate, proceeds the Universe of lives.' (S.D. I, 250 First ed; 12Q4 Adyar ed; 126g Third ed.)<\/p>\n<p>ORPHEUS As used herein refers not to the Greek mythological singer<\/p>\n<p>and player of the lyre (son of Apollo and Calliope), but to the great founder of a religio-philosophical system or school as well as the Orphic Mysteries. Herodotus stated that the Mysteries were brought from India by Orpheus. Pausanias relates that there was a sacerdotal family who committed to memory all the Orphic Hymns and that they were thus transmitted from one generation to another; hence they were not written down. This is why references to the Orphic Hymns are so scarce.<\/p>\n<p>OVER-SOUL, THE UNIVERSAL A rendering of the Sanskrit<\/p>\n<p>Paramatman, signifying the originating source of Atman, inas­ much as 'Soul' is one of the translations of Atman, as used in the phrase 'the fundamental identity of all Souls with the Universal Over-Soul.'<\/p>\n<p>PILGRIM As here used the Pilgrim signifies the immortal component<\/p>\n<p>in the sevenfold constitution of a human being. As defined in the Occult Science, 'the Pilgrim is the appellation given to our Monad (the two in one) during its cycle of incarnations.' (S.D. I 16 First ed; I 82 Adyar ed; I 45 Third ed). The 'two in one'<\/p>\n<p>59<\/p>", "images": [], "label": "Page 63"}, {"pdf_page_index": 63, "pdf_page_number": 64, "html": "<p>signifies the union of A tman, the divine spirit, with Buddhi, the discriminating principle. The reference to the eternity of the<\/p>\n<p>Pilgrim calls attention to the immortality of the Monad, which takes on a new vesture for each one of its incarnations on earth.<\/p>\n<p>PLATO This most famous of the ancient Greek philosophers, was<\/p>\n<p>stated to be a 'Fifth Rounder.' ( q.v.—S.D. I, 161-2 First ed; I 216 Adyar ed; I, 185 Third ed. Also M.L. 84 First ed; 83 Third ed).<\/p>\n<p>POINT WITHIN A CIRCLE One of the most important symbols<\/p>\n<h3 class=\"pdf-heading\">used in Occult Sciences to explain the process of manifestation :<\/h3>\n<p>the appearance of the Point (i.e. the First Logos) on the infinite and shoreless expanse of the Boundless—Space. The latter is<\/p>\n<p>represented by the Circle, i.e. the Circle of Infinitude, 'whose centre is everywhere and circumference nowhere.' The Point thus represents the germ of primeval differentiation.<\/p>\n<p>PRALAYA (Sk.) Literally a 'dissolving away', hence a period of<\/p>\n<p>dissolution—following upon a period of manifestation. But the dissolution applies to the forms which are no longer manifested.<\/p>\n<p>It does not apply to the immortal principles, which in no wise are dissolved away.<\/p>\n<p>PRECIPITATION The ability to make writing appear on paper (or<\/p>\n<p>other substance) by spiritual powers, without pen, pencil, crayon or brush. Also included is the ability to deliver the message— whether written or precipitated—to any desired location.<\/p>\n<p>PRINCIPLE, AN OMNIPRESENT Whereas the concept of an<\/p>\n<p>Omnipresent Principle—which is also Eternal, Boundless and<\/p>\n<p>Immutable—may be baffling to the Western mind, the reason for presenting such a concept in connection with the Secret Doctrine of antiquity is easily explained. As soon as the mind has a fixed idea concerning a principle, it has immediately limited the comprehension of that principle. Therefore by postulating that this Boundless Principle may not be limited by the mind, one can ever strive to obtain a clearer knowledge of immutability and the boundless reaches of Infinitude.<\/p>\n<p>60<\/p>", "images": [], "label": "used in Occult Sciences to explain the process of manifestation :"}, {"pdf_page_index": 64, "pdf_page_number": 65, "html": "<p>PRINCIPLES, THE SEVEN (See under Seven Principles).<\/p>\n<p>PROJECTIVITY Using one of the Siddhis (q.v.). This signifies em­<\/p>\n<p>ploying Tulku or the ability to project one's consciousness— technically termed the Mayavi-rupa. In other words, the con­ scious withdrawal of the 'inner self' from the 'outer self.'<\/p>\n<p>PSYCHOMETER One who has the power of psychometry (q.v.).<\/p>\n<p>PSYCHOMETRY Ability to receive from any object—held in the<\/p>\n<p>hand or against the forehead—impressions of the characteristics or appearance of a person or object with which it has previously been in contact.<\/p>\n<p>PTOLEMY When used generalizingly (as in the quoted passage),<\/p>\n<p>applies to any one of the Macedonian rulers of Egypt.<\/p>\n<p>PYATIGORSK Town south of Kislovodsk, Russia, north of the<\/p>\n<p>Caucasus Mountains, not far from the Black Sea.<\/p>\n<p>RECEPTIVITY Here signifies the ability to place oneself en rapport<\/p>\n<p>with individuals by means of spiritual powers. Such individuals have the power to transmit messages to any desired distance by occult means.<\/p>\n<p>RISHIS Term used with a great deal of latitude; commonly regarded<\/p>\n<p>as singers of sacred hymns; inspired poets or sages. Also applied to seven great sages who composed the Vedic hymns. Herein re­ ferred to as Divine Beings from previous Manvantaras who asso­ ciated with the Sons of Will and Yoga.<\/p>\n<p>ROOTLESS ROOT Also the Unknown Root. Term associated with<\/p>\n<p>the Omnipresent Priniciple (q.v.), of which this concept is but an aspect. The explanation given for the Omnipresent Principle also applies here; for how can the human mind which is finite, grasp Infinity? How can one conceive of all that ever was, all that is, or all that ever shall be ? Hence the expression 'the Root­ less Root.'<\/p>\n<p>61<\/p>", "images": [], "label": "Page 65"}, {"pdf_page_index": 65, "pdf_page_number": 66, "html": "<p>SAMADHI (Sk.) In the Hindu classification of the four states of<\/p>\n<h3 class=\"pdf-heading\">consciousness, the fourth and highest state : a beatific state of<\/h3>\n<p>contemplative yoga. Also defined as the eighth and final state of yoga, signifying intense and supreme concentration of the mental<\/p>\n<h3 class=\"pdf-heading\">and spiritual faculties : a state in which one loses consciousness of<\/h3>\n<p>every individuality, including one's own, and becoming conscious of t he ALL.<\/p>\n<h3 class=\"pdf-heading\">SANG-GYAS (Tibetan sangs-rgyas : pronounced sang-gyas, literally<\/h3>\n<p>perfect, holy). Tibetan name of Gautama the Buddha.<\/p>\n<p>SEERS As used herein refers particularly to those who can see into<\/p>\n<p>the records preserved in the Akasa (q.v.)<\/p>\n<p>SENZAR Name of the ancient 'Mystery-speech' of i nitiated Adepts.<\/p>\n<p>A secret, sacerdotal language; hence also called a Mystery Language; preceding the Sanskrit language.<\/p>\n<p>SEVEN PRINCIPLES—also referred to as the sevenfold constitution<\/p>\n<p>of man, or the septenary classification of man's principles. In Theosophy the constitution of a human being is composed of seven principles, or is classified as consisting of seven components.<\/p>\n<h3 class=\"pdf-heading\">These are enumerated in Sanskrit, with English equivalents :<\/h3>\n<p>1 Sthula-sarira—Physical Body, regarded as the carrier of the six components. 2 Linga-sarira—Model Body, also termed etheric body, ethere­<\/p>\n<h3 class=\"pdf-heading\">al double, astral body : the conveyor of :<\/h3>\n<p>3 Prana—Life-Principle, representing the vital fluid. 4 Kama—Desire Principle, representing the energic principle. 5 Manas—Mind Principle, representing the functioning of the lower mind, especially in conjunction with desire. 6 Buddhi—Discriminating Principle, representing the function­ ing of the higher mind by noble thoughts and deeds. 7 Atman—Divine Principle, or spirit, conveying immortality to the sixth and fifth principles.<\/p>\n<p>SEVEN SATELLITES A symbolic manner of r eferring to the Seven<\/p>\n<p>Principles (q.v.) of the human constitution.<\/p>\n<p>62<\/p>", "images": [], "label": "consciousness, the fourth and highest state : a beatific state of"}, {"pdf_page_index": 66, "pdf_page_number": 67, "html": "<p>SEVENTH SENSE As the Occult Science postulates further develop­<\/p>\n<p>ment of faculties and powers now dormant in man, of greater potency than the five senses which function at the present time, the culmination of the evolutionary development of the human race on this globe will bring into use both the sixth and the seventh senses. H. P. Blavatsky describes what will occur when<\/p>\n<h3 class=\"pdf-heading\">the sixth sense works in consonance with the seventh : 'The light<\/h3>\n<p>which radiates from this seventh sense illumines the fields of infinitude. For a brief space of time man becomes omniscient; the<\/p>\n<p>Past and the Future, Space and Time, disappear and become for<\/p>\n<h3 class=\"pdf-heading\">him the Present.' (S.D. V, 482 Adyar ed.; Ill, 505 Third ed.)<\/h3>\n<p>SHABERON Tibetan equivalent of Ghutuktu, which H. P. Blavatsky<\/p>\n<h3 class=\"pdf-heading\">explained as : 'an incarnation of Buddha or of some Bodhisattva,<\/h3>\n<p>as believed in Tibet, where there are generally five manifesting and two secret Cfiutuktus among the high Lamas. (Th. Glos.<\/p>\n<p>P- 8 5)-<\/p>\n<p>SHAMAN Medicine-man or priest-doctor among the tribes of<\/p>\n<p>Siberia; regarded as a conjurer and an exorcist.<\/p>\n<h3 class=\"pdf-heading\">SIDDHIS (Sk.) Literally attainments : phenomenal powers,associated<\/h3>\n<p>with psychic faculties. 'There are two kinds of Siddhis. One group which embraces the lower, coarse, psychic and mental energies; the other is one which exacts the highest training of<\/p>\n<h3 class=\"pdf-heading\">Spiritual powers.' ( The Voice of the Silence, Fragment I, foot­<\/h3>\n<p>note 1).<\/p>\n<p>SINNETT, ALFRED PERCY (1840-1921) Editor of the Anglo-<\/p>\n<p>Indian paper The Pioneer when H. P. Blavatsky arrived in India in 18.79. 1° December of that year, in response to Sinnett's in­ vitation, Mme. Blavatsky visited him at Allahabad. He became interested in the message she brought, and wished to contact those from whom she derived her knowledge. He wrote to a Mahatma and received a reply, which led to a remarkable cor­ respondence, published after the editor's death as The Mahatma Letters to A.P.Sinnett. As a result of the correspondence, Sinnett wrote and published The Occult World, Esoteric Buddhism and other theosophical books. The letters he received from Mme.<\/p>\n<p>63<\/p>", "images": [], "label": "the sixth sense works in consonance with the seventh : 'The light"}, {"pdf_page_index": 67, "pdf_page_number": 68, "html": "<p>Blavatsky—a whole volume of them—were published posthum­ ously as The Letters of H. P. Blavatsky to A. P. Sinnett. From these letters Sinnett wrote a biography entitled Incidents in the Life of Mme. Blavatsky.<\/p>\n<p>SIXTH SENSE The sense to be brought to function in the Sixth<\/p>\n<h3 class=\"pdf-heading\">Root-Race : spiritual clairvoyance. It will be brought about when<\/h3>\n<p>Manas (the mind-principle) is consciously merged with the sixth sense, resulting in the use of Jnana-sakti—one of the Siddhis described as the power of real wisdom.<\/p>\n<p>SKINS A graphic expression, referring to one of the seven principles<\/p>\n<p>of the human constitution. (See Seven Principles.)<\/p>\n<p>SLEEPING ATOMS Life atoms endowed with potential invisible<\/p>\n<p>energy but temporarily passive. ( See Life-Atoms.)<\/p>\n<p>SLOKA (Sk.) Usually rendered 'verse.' In Sanskrit works a sloka<\/p>\n<p>generally consists of two metrical lines.<\/p>\n<p>SONS OF WILL AND YOGA The Divine Beings produced by<\/p>\n<p>Kriya-sakti (q.v.) (See Fire-Mist, Sons of o r Children of.)<\/p>\n<p>SONS OF WISDOM The Sons of Ad, or Sons of the Fire-Mist (q.v.)<\/p>\n<p>SOUMAY A lamasery, a Buddhist monastery or convent of Tibet,<\/p>\n<p>also of Mongolia. Usually under the direction of a chief lama (equivalent is an abbot or abbess).<\/p>\n<p>SPACE Used in the S.D. for the boundless, frontierless ALL—the<\/p>\n<p>One Eternal Element, dimensionless in every sense. The equiva­ lent Sanskrit term is Parabrahman, or the Vedic TAT—That.<\/p>\n<p>STANZAS OF DZYAN These Stanzas from the Book of Dzyan form<\/p>\n<p>the basis of the S.D. The original was written in Senzar, but ex­ tracts are also made from Chinese, Tibetan and Sanskrit trans­ lations. The Book of Dzyan—from the Sanskrit word Dhyana (mystic meditation)—is the first volume of the Commentaries upon the seven secret folios of Kiu-te and a Glossary of the<\/p>\n<p>64<\/p>", "images": [], "label": "Root-Race : spiritual clairvoyance. It will be brought about when"}, {"pdf_page_index": 68, "pdf_page_number": 69, "html": "<h3 class=\"pdf-heading\">public works of the same name.' ( S.D. V, 38 g Adyar ed; III, 403<\/h3>\n<p>Third ed) The Stanzas 'are the records of a people unknown to ethnology; it is claimed that they are written in a tongue absent from the nomenclature of languages and dialects with which<\/p>\n<p>philology is acquainted; they are said to emanate from a source<\/p>\n<h3 class=\"pdf-heading\">(Occultism) repudiated by science.' (S.D. I, XXXVII First ed; I, 59<\/h3>\n<h3 class=\"pdf-heading\">Adyar ed; I, 21 Third ed.)<\/h3>\n<p>SVASTIKA (Sk. literally well-being). Has been used in both Old and<\/p>\n<p>New Worlds from prehistoric times. 'In Esoteric Philosophy, the most mystic and ancient diagram. It is the originator of the fire by friction and of t he Forty-nine Fires.' (Th. Glos. p.315).<\/p>\n<p>TAMASHA East Indian word of Arabian or Persian origin signifying<\/p>\n<p>spectacle, entertainment. By extension, applied to a psychic phenomenon.<\/p>\n<p>TERRESTRIAL CHAIN Best explained by one of the postulates in<\/p>\n<p>the S.D. : 'every sidereal body, every planet, whether visible or invisible, is credited with six companion globes.' (I, 158-g First ed; 1213 Adyar ed; 1182 Third ed.) The seven globes comprising the Earth-system are therefore termed the Terrestrial Chain or the Earth Chain.<\/p>\n<p>THIRD RACE or THIRD ROOT-RACE Used in the S.D. for a<\/p>\n<p>specific evolutionary development of the human race on this globe. This 'Race' was preceded by two major evolutionary de­ velopmental stages (the First and Second Root-Races), each of which underwent seven minor developmental stages termed Sub- races. During the early portion of this Third Race the Sons of the Fire-Mist were produced by Kriyasakti. The Third Race is divided into three distinct divisions: (1) the Sweat-Born—the primary developmental aspect of this Race; (2) the twofold— referring to the androgynous state of humanity; (3) the two sexes of humans (as at present) which occurred during the fifth sub-<\/p>\n<p>race of this Third Race, 18 million years ago.<\/p>\n<p>THOUGHT TRANSFERENCE The power of transferring one's<\/p>\n<h3 class=\"pdf-heading\">thoughts without words. As explained by H. P. Blavatsky : 'When<\/h3>\n<p>65<\/p>", "images": [], "label": "public works of the same name.' ( S.D. V, 38 g Adyar ed; III, 403"}, {"pdf_page_index": 69, "pdf_page_number": 70, "html": "<p>two minds are sympathetically related, and the instruments through which they function are tuned to respond magnetically and electrically to one another, there is nothing which will pre­ vent the transmission of thoughts from one to the other at will.' (Key p.291).<\/p>\n<p>TIRUVALLUVAR The name of the yogi or fakir pictured on p. 37<\/p>\n<p>who attained the goal of yoga, represented by Samadhi (q.v.). In H. P. Blavatsky's precipitated portrait the yogi is portrayed in that state of consciousness.<\/p>\n<p>TSONG-KHA-PA (1358-1419) Great reformer of Buddhism, both<\/p>\n<p>exoteric and esoteric, in Tibet in 14th century. Instituted a purified form of Buddhism, freeing it from the Bon worship, which had crept into it from the Order of the Red Caps. To dis­ tinguish the Reformed Buddhists from the other Orders, Tsong- Kha-pa instituted the Yellow Gaps (Gelugpas). He also founded the monasteries of Sera and Ganden and was the presiding hier- arch of the latter. Tsong-Kha-pa 'is the founder of the secret school near Tji-gad-ji, attached to the private retreat of the Teshu-Lama. It is with Him that began the regular system of Lamaic incarnations of Buddhas (Sang-gyas)'. (S.D.V,391 Adyar<\/p>\n<h3 class=\"pdf-heading\">ed; III, 407 Third ed).<\/h3>\n<p>TULKU (Tibetan sprul-sku, pronounced tulku). Literally 'to appear<\/p>\n<p>in a body.' Has the popular connotation of an 'incarnation of<\/p>\n<p>the Buddha,' whereas the esoteric significance implies the use of one of the Siddhis, namely the ability to project one's con­ sciousness by means of an illusory vehicle.<\/p>\n<p>VERA Name of H.P.B.'s younger sister, born 1835 at Odessa, died<\/p>\n<p>1896. Married first Nikolay de Yahontov (1827-58) and secondly Vladimir de Zhelihovsky. Became widely known in Russia as writer of children's stories; also contributed to Russian periodic­ als. Of special interest are her essays concerning her sister, Helena; the first one entitled 'The Truth about H. P. Blavatsky,' published serially in Rebus in 1883, and later in book form. H.P.B. herself translated the series. In 1884 Vera wrote a series<\/p>\n<h3 class=\"pdf-heading\">entitled 'The Inexplicable or the Unexplained : From Personal<\/h3>\n<p>and Family Reminiscences,' also published by Rebus. Yet<\/p>\n<p>66<\/p>", "images": [], "label": "ed; III, 407 Third ed)."}, {"pdf_page_index": 70, "pdf_page_number": 71, "html": "<p>another series was written for the Russian Review on 'H. P. Blavatsky: A Biographical Sketch,' and published in 1891. Another biographical sketch in Russian was added to the Russian edition of H.P.B.'s book 'Mysterious Tribes of the Blue Hills'<\/p>\n<p>(published 1893). Vera also wrote two books concerning her<\/p>\n<h3 class=\"pdf-heading\">sister's and her own childhood : When I Was Small and My<\/h3>\n<p>Adolescence published in 1893 and 1894.<\/p>\n<p>WACHTMEISTER, CONSTANCE (nee de Bourbel—1838-1910)<\/p>\n<p>Born at Florence, Italy, but reared in England. In 1863 married Count Karl Wachtmeister, then Swedish and Norwegian Minister at the Court of St. James's, later at Copenhagen and Stockholm. The Countess lived with H. P. Blavatsky, first at Wiirzburg, Germany, then at Ostend, Belgium. She related her experiences in Reminiscences of H. P. Blavatsky and 'The Secret Doctrine,' published in 1893. Many of her letters written at the time she was with H.P.B. are published in a section of the book Letters of H. P. Blavatsky to A. P. Sinnett.<\/p>\n<p>WITTE, COUNT SERGUEY YULYEVICH (1849-1915) States­<\/p>\n<p>man who became Prime Minister of Russia. In 1892 was appointed Minister of Communications. In 1903 became Presi­ dent of the Committee of Ministers. The Count's outstanding accomplishment was the negotiation of the terms of peace closing the Russo-Japanese War in 1905. He was related to Mme. Blavatsky through his mother, Katherine, who was a younger sister of H.P.B.'s mother: Katherine was married to Yuliy Feodorovich de Witte. As Count Witte was born just one month before his cousin Helena was married to N. V. Blavatsky, his account as published in his Memoirs is based on gossip rather than<\/p>\n<p>factual knowledge. In spite of the slanderous statements in those Memoirs, Count Witte at least testified to Mme. Blavatsky's great<\/p>\n<h3 class=\"pdf-heading\">writing ability : 'She could write pages of smoothly flowing verse<\/h3>\n<p>without the slightest effort, and she could compose essays in prose on every conceivable subject.' (Quoted in Corson's book, pp. 19-20).<\/p>\n<p>^7<\/p>", "images": [], "label": "sister's and her own childhood : When I Was Small and My"}, {"pdf_page_index": 71, "pdf_page_number": 72, "html": "<p>WONDROUS BEING Name for the Supreme Hierarch of the Earth,<\/p>\n<p>represented as the 'Root Base' of this globe, to which a name is<\/p>\n<h3 class=\"pdf-heading\">applied in translation : 'the ever-living-human-Banyan.' This<\/h3>\n<p>Great Being descended from a high region in the early part of<\/p>\n<h3 class=\"pdf-heading\">the Third Age. Other names are : the Initiator, the Nameless<\/h3>\n<p>one, the Great Sacrifice, the Maha-Guru, the Silent Watcher.<\/p>\n<p>YOGASUTRAS (Sk.) Sutra signifies a thread, but when applied to a<\/p>\n<p>written work means a rule, a principle. In the West the sutras on yoga by Patanjali are known under the name of Yoga Aphorisms. Little is known about Patanjali; what has come down to our day is legendary. His aphorisms indicate that he possesed wisdom and imparted it in his work. He expects the practitioners of his system of yoga to acquire right kowledge of what is and what is not real and to practice all virtues. The opening sloka<\/p>\n<h3 class=\"pdf-heading\">gives the keynote of P atanjali's sutras : 'Assuredly, the exposition<\/h3>\n<p>of Yoga, or Concentration, is now to be made.'<\/p>\n<h3 class=\"pdf-heading\">YOGI (Sk : yogin —the nominative case is yogi). A practitioner of<\/h3>\n<p>yoga. One who aims to attain union of the human spirit with the Universal Spirit. One of the methods pursued by the practitioner is that of the withdrawal of the senses from all external objects.<\/p>", "images": [], "label": "applied in translation : 'the ever-living-human-Banyan.' This"}, {"pdf_page_index": 72, "pdf_page_number": 73, "html": "<p class=\"empty-note\"><em>This page is a plate or blank page in the original — shown as a facsimile image below.<\/em><\/p>", "images": [{"file": "page_072_render.jpg", "caption": "Page 73 as printed in the original"}], "label": "Facsimile Plate"}, {"pdf_page_index": 73, "pdf_page_number": 74, "html": "<p class=\"empty-note\"><em>This page is a plate or blank page in the original — shown as a facsimile image below.<\/em><\/p>", "images": [{"file": "page_073_render.jpg", "caption": "Page 74 as printed in the original"}], "label": "Facsimile Plate"}, {"pdf_page_index": 74, "pdf_page_number": 75, "html": "<p class=\"empty-note\"><em>This page is a plate or blank page in the original — shown as a facsimile image below.<\/em><\/p>", "images": [{"file": "page_074_render.jpg", "caption": "Page 75 as printed in the original"}], "label": "Facsimile Plate"}, {"pdf_page_index": 75, "pdf_page_number": 76, "html": "<p>G E O F F R E Y B A R B O R K A w a s b r o u g h t u p a t P o i n t L o m a , California. He had a classical education to which were added mod­ ern languages—German, French and Spanish; and these were later supplemented by a study of Hebrew and Sanskrit. He is the author of a number of books, including The Divine Plan (a study in The Secret Doctrine), H. P. Blavatsky, Tibet and Tulku and The Pearl of the Orient (on the Bhagavad Gita).<\/p>\n<p>QUEST<\/p>\n<h3 class=\"pdf-heading\">h * 0<\/h3>\n<p>0<\/p>", "images": [], "label": "h * 0"}]</script>

<script>
const PAGES = JSON.parse(document.getElementById('pages-data').textContent);
const IMAGES = JSON.parse(document.getElementById('images-data').textContent);

let current = 0;

function imgSrc(file){
  return 'data:image/jpeg;base64,' + IMAGES[file];
}

function render(){
  const p = PAGES[current];
  document.getElementById('section-pill').textContent = 'Page ' + p.pdf_page_number;
  document.getElementById('eyebrow').textContent = 'Source: page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('page-title').textContent = p.label;
  document.getElementById('content').innerHTML = p.html;

  const figWrap = document.getElementById('figures');
  figWrap.innerHTML = '';
  p.images.forEach(im => {
    const card = document.createElement('div');
    card.className = 'figure-card';
    const img = document.createElement('img');
    img.src = imgSrc(im.file);
    img.alt = im.caption;
    img.addEventListener('click', () => openLightbox(img.src, im.caption));
    const cap = document.createElement('div');
    cap.className = 'figure-cap';
    cap.textContent = im.caption;
    card.appendChild(img);
    card.appendChild(cap);
    figWrap.appendChild(card);
  });

  document.getElementById('folio-label').textContent = 'Page ' + p.pdf_page_number + ' / ' + PAGES.length;
  document.getElementById('progress-label').textContent = 'Page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('progress-fill').style.width = (((current+1)/PAGES.length)*100).toFixed(1) + '%';

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === PAGES.length - 1;
  document.getElementById('next-btn').textContent = current === PAGES.length -1 ? 'End' : 'Next \u2192';

  document.getElementById('leaf').style.animation = 'none';
  void document.getElementById('leaf').offsetWidth;
  document.getElementById('leaf').style.animation = '';

  updateActiveTocItem();
  window.scrollTo({top:0, behavior:'smooth'});
  if (window.__afterRender) window.__afterRender();
}

function openLightbox(src, alt){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});

// ---------- Read aloud (prefers Indian English voices) ----------
(function(){
  const listenBtn = document.getElementById('listen-toggle');
  const bar = document.getElementById('listen-bar');
  const voiceSel = document.getElementById('voice-select');
  const rateSel = document.getElementById('rate-select');
  const playBtn = document.getElementById('listen-play');
  const stopBtn = document.getElementById('listen-stop');
  const autoChk = document.getElementById('listen-auto');
  const status = document.getElementById('listen-status');

  if (!('speechSynthesis' in window)) {
    listenBtn.style.display = 'none';
    return;
  }

  let voices = [];
  let listening = false;
  let paused = false;
  let gen = 0;

  function score(v){
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l.indexOf('en-in') === 0) return 3;
    if (l === 'en-gb') return 2;
    return 1;
  }

  function loadVoices(){
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
    voices = (en.length ? en : all).slice().sort((a, b) => score(b) - score(a));
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const isIndian = (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0;
      opt.textContent = v.name + ' (' + v.lang + ')' + (isIndian ? ' — Indian accent' : '');
      voiceSel.appendChild(opt);
    });
    const idx = voices.findIndex(v => (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0);
    voiceSel.value = idx >= 0 ? idx : 0;
    if (!listening) {
      status.textContent = idx >= 0
        ? 'Indian English voice ready.'
        : 'No Indian English voice found on this device — closest English voice selected.';
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function pageText(){
    const p = PAGES[current];
    const div = document.createElement('div');
    div.innerHTML = p.html;
    let t = (div.textContent || '').replace(/\s+/g, ' ').trim();
    (p.images || []).forEach(im => { t += ' Figure on this page: ' + im.caption + '.'; });
    return t;
  }

  function chunk(text){
    const parts = text.match(/[^.!?\u2026]+[.!?\u2026]+["')\]]*\s*/g) || [text];
    const out = [];
    let buf = '';
    parts.forEach(s => {
      if ((buf + s).length > 220) { if (buf) out.push(buf); buf = s; }
      else buf += s;
    });
    if (buf) out.push(buf);
    return out;
  }

  function speak(){
    const text = pageText();
    if (!text) { status.textContent = 'Nothing to read on this page.'; return; }
    const myGen = ++gen;
    speechSynthesis.cancel();
    const pieces = chunk(text);
    const v = voices[parseInt(voiceSel.value, 10)];
    pieces.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateSel.value);
      if (i === pieces.length - 1) {
        u.onend = () => {
          if (!listening || myGen !== gen) return;
          if (autoChk.checked && current < PAGES.length - 1) { current++; render(); }
          else setUi(false);
        };
      }
      speechSynthesis.speak(u);
    });
    status.textContent = 'Reading page ' + (current + 1) + ' of ' + PAGES.length + '…';
  }

  function setUi(on){
    listening = on;
    paused = false;
    playBtn.innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Read aloud';
    stopBtn.disabled = !on;
    if (!on) status.textContent = 'Stopped.';
  }

  window.__afterRender = function(){
    if (listening) speak();
  };

  // Chrome desktop occasionally stalls long speech queues — nudge it.
  setInterval(() => {
    if (listening && !paused && speechSynthesis.speaking) speechSynthesis.resume();
  }, 10000);

  listenBtn.addEventListener('click', () => bar.classList.toggle('open'));
  playBtn.addEventListener('click', () => {
    if (!listening) { setUi(true); speak(); return; }
    if (paused) { speechSynthesis.resume(); paused = false; playBtn.innerHTML = '&#10074;&#10074; Pause'; }
    else { speechSynthesis.pause(); paused = true; playBtn.innerHTML = '&#9654; Resume'; }
  });
  stopBtn.addEventListener('click', () => { gen++; speechSynthesis.cancel(); setUi(false); });
  voiceSel.addEventListener('change', () => { if (listening) speak(); });
  rateSel.addEventListener('change', () => { if (listening) speak(); });
})();

</script>

<script>
(function(){
  var NOTES = {};
  var CHMAP = [];
  try { NOTES = JSON.parse(document.getElementById('notes-data').textContent); } catch(e) {}
  try { CHMAP = JSON.parse(document.getElementById('chapter-map').textContent); } catch(e) {}
  var term = '', matchPages = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function pageText(p){ var d=document.createElement('div'); d.innerHTML=p.html; return d.textContent || ''; }

  // ---------- SEARCH ----------
  var bar = document.getElementById('search-bar');
  var input = document.getElementById('search-input');
  var info = document.getElementById('search-info');

  function clearMarks(){
    var c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(function(mk){
      var t = document.createTextNode(mk.textContent);
      mk.parentNode.replaceChild(t, mk);
    });
    c.normalize();
  }
  function highlight(){
    clearMarks();
    if (!term || term.length < 2) return;
    var c = document.getElementById('content');
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var t = term.toLowerCase();
    nodes.forEach(function(n){
      var txt = n.nodeValue, low = txt.toLowerCase(), idx = low.indexOf(t);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(txt.slice(pos, idx)));
        var mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = txt.slice(idx, idx + term.length);
        frag.appendChild(mk);
        pos = idx + term.length;
        idx = low.indexOf(t, pos);
      }
      frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function infoText(){
    if (!term || term.length < 2) { info.textContent = ''; return; }
    if (!matchPages.length) { info.textContent = 'No matches'; return; }
    var pos = matchPages.indexOf(current);
    info.textContent = matchPages.length + (matchPages.length > 1 ? ' pages' : ' page') +
      (pos >= 0 ? ' — match ' + (pos + 1) + ' of ' + matchPages.length : '');
  }
  function doSearch(){
    term = input.value.trim();
    matchPages = [];
    if (term.length >= 2){
      var t = term.toLowerCase();
      PAGES.forEach(function(p, i){ if (pageText(p).toLowerCase().indexOf(t) >= 0) matchPages.push(i); });
    }
    if (matchPages.length){ current = matchPages[0]; render(); }
    else { highlight(); infoText(); }
  }
  function step(d){
    if (!matchPages.length) return;
    var pos = matchPages.indexOf(current);
    if (pos < 0) pos = 0;
    pos = (pos + d + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }
  var searchT = null;
  input.addEventListener('input', function(){ clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ clearTimeout(searchT); doSearch(); } });
  document.getElementById('search-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('search-next').addEventListener('click', function(){ step(1); });
  document.getElementById('search-close').addEventListener('click', function(){
    bar.classList.remove('open'); term=''; matchPages=[]; highlight(); infoText();
  });
  document.getElementById('search-toggle').addEventListener('click', function(){
    var open = bar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) input.focus();
  });

  // ---------- NOTES ----------
  var panel = document.getElementById('notes-panel');
  var body = document.getElementById('notes-body');
  function showNotes(){
    var ch = null;
    for (var i = current; i >= 0; i--){
      if (CHMAP[i] && NOTES[CHMAP[i]]) { ch = CHMAP[i]; break; }
    }
    if (!ch){
      for (var j = current; j < CHMAP.length; j++){
        if (CHMAP[j] && NOTES[CHMAP[j]]) { ch = CHMAP[j]; break; }
      }
    }
    if (!ch){
      body.innerHTML = '<p class="notes-empty">No chapter notes available for this section.</p>';
      return;
    }
    var n = NOTES[ch];
    var h = '<h3>' + esc(ch) + '</h3><h4>Summary</h4><p>' + esc(n.s) + '</p>';
    if (n.p && n.p.length){
      h += '<h4>Key points</h4><ul>' + n.p.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body.innerHTML = h;
  }
  document.getElementById('notes-toggle').addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    bar.classList.remove('open');
    if (open) showNotes();
  });

  // hooks after every render
  var prevA = window.__afterRender;
  window.__afterRender = function(){
    if (prevA) prevA();
    highlight();
    infoText();
    if (panel.classList.contains('open')) showNotes();
  };
})();
</script>

(function(){

  var popup = null, term = '', lastUrl = '';

  function hideTip(){ tip.classList.remove('show'); }
  function hideBar(){ bar.classList.remove('show'); }

  function showTipForSelection(){
    var sel = window.getSelection();
    var txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    if (txt.length >= 2 && txt.length <= 160){
      term = txt;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      var top = r.top - 46;
      if (top < 8) top = r.bottom + 10;
      var left = r.left + r.width / 2;
      left = Math.max(90, Math.min(window.innerWidth - 90, left));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.classList.add('show');
    } else {
      hideTip();
    }
  }

  document.addEventListener('mouseup', function(e){
    if (tip.contains(e.target) || bar.contains(e.target)) return;
    setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('keyup', function(e){
    if (e.shiftKey) setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!tip.contains(e.target)) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);

  document.getElementById('sel-search-btn').addEventListener('click', function(){
    if (!term) return;
    lastUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(term);
    popup = window.open(lastUrl, 'ddg_search_popup', 'width=920,height=700,menubar=no,toolbar=no,location=no,status=no');

    var msg = document.getElementById('sel-search-msg');
    if (popup){

    } else {
      msg.innerHTML = 'Popup blocked — <a href="' + lastUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">open the search in a new tab</a>.';
    }
    bar.classList.add('show');
  });

  document.getElementById('sel-search-close').addEventListener('click', function(){
    if (popup && !popup.closed) popup.close();
    popup = null;
    hideBar();
  });
})();
</script>

  fab.id = 'sl-chat-fab'; fab.type = 'button'; fab.title = 'Library assistant';
  fab.textContent = '\uD83D\uDCAC';

    '</div>' +
    '<div id="sl-chat-body"></div>' +
    '<div id="sl-chat-inputrow"><input id="sl-chat-input" placeholder="Ask about this book, or the web\u2026">' +
    '<button id="sl-chat-send" type="button" title="Send">\u27A4</button></div>';
  document.body.appendChild(panel);

  var body = panel.querySelector('#sl-chat-body');
  var input = panel.querySelector('#sl-chat-input');
  var sendBtn = panel.querySelector('#sl-chat-send');
  var busy = false;

  function scrollBody(){ body.scrollTop = body.scrollHeight; }
  function addMsg(role, html){
    var d = document.createElement('div');
    d.className = 'sl-msg ' + role;
    d.innerHTML = html;
    body.appendChild(d); scrollBody();
    return d;
  }
  function esc(t){ var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  addMsg('bot', 'Namaste. Ask me anything \u2014 I can search <b>this book</b> page by page, answer with your configured LLM, or run an external DuckDuckGo search.');

  function pageText(p){
    var d = document.createElement('div'); d.innerHTML = p.html; return d.textContent || '';
  }

  function searchBook(q){
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    if (!terms.length) return [];
    var out = [];
    for (var i = 0; i < PAGES.length; i++){
      var txt = pageText(PAGES[i]).toLowerCase();
      var score = 0;
      for (var k = 0; k < terms.length; k++){
        var hits = txt.split(terms[k]).length - 1;
        if (hits) score += hits;
      }
      if (score) out.push({ i: i, score: score });
    }
    out.sort(function(a,b){ return b.score - a.score; });
    return out.slice(0, 5);
  }

  function snippet(i, q){
    var txt = pageText(PAGES[i]).replace(/\s+/g,' ');
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    var pos = -1;
    for (var k = 0; k < terms.length; k++){ pos = txt.toLowerCase().indexOf(terms[k]); if (pos >= 0) break; }
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 60);
    return (start ? '\u2026' : '') + txt.slice(start, start + 170) + '\u2026';
  }

  function goToPage(i){
    try { current = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch(e){ console.warn('jump failed', e); }
  }

  function callLlm(q, context){
    return fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: 'You are the assistant inside a spiritual book reader. Answer concisely. When book excerpts are provided, ground the answer in them and cite the page labels. If the question needs current external facts, say so and suggest an external search.' },
          { role: 'user', content: context ? 'Book excerpts:\n' + context + '\n\nQuestion: ' + q : q }
        ],
        temperature: 0.4
      })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error('LLM error ' + res.status + ': ' + t.slice(0,180)); });
      return res.json();
    }).then(function(data){
      var c = data.choices && data.choices[0] && data.choices[0].message;
      return (c && c.content || '(empty response)').trim();
    });
  }

  function handleSend(){
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    addMsg('user', esc(q));
    busy = true; sendBtn.disabled = true;
    var thinking = document.createElement('div');
    thinking.className = 'sl-thinking'; thinking.textContent = 'Thinking\u2026';
    body.appendChild(thinking); scrollBody();

    var hits = searchBook(q);
    var finish = function(){ busy = false; sendBtn.disabled = false; thinking.remove(); };

    function renderRefs(){
      if (!hits.length) return '';
      var h = '';
      hits.forEach(function(hit, n){
        h += '<button class="sl-ref" data-page="' + hit.i + '" type="button"><b>' + esc(PAGES[hit.i].label) +
             ' \u00b7 page ' + (hit.i + 1) + '</b><span>' + esc(snippet(hit.i, q)) + '</span>' +
             '<span class="go">Go to page \u2192</span></button>';
      });
      return h;
    }

    var done = function(html){ finish(); var m = addMsg('bot', html);
      m.querySelectorAll('.sl-ref').forEach(function(b){
        b.addEventListener('click', function(){ goToPage(parseInt(b.getAttribute('data-page'), 10)); });
      });
    };

    if (cfg.key){
      var ctx = hits.slice(0,3).map(function(hit){
        return '[' + PAGES[hit.i].label + ', page ' + (hit.i + 1) + '] ' + pageText(PAGES[hit.i]).replace(/\s+/g,' ').slice(0, 900);
      }).join('\n');
      callLlm(q, ctx).then(function(ans){ done(esc(ans) + renderRefs()); })
      .catch(function(err){ done(esc(String(err.message || err)) + renderRefs()); });
    } else if (hits.length){
      done('I found ' + hits.length + ' relevant page' + (hits.length > 1 ? 's' : '') + ' in this book. Tap one to jump there, or add an LLM API key in \u2699 Settings for a synthesized answer.' + renderRefs());
    } else {
      var url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      done('Nothing in this book matched. <a href="' + url + '" target="_blank" rel="noopener">Search the web for \u201c' + esc(q) + '\u201d on DuckDuckGo \u2197</a> \u2014 or add an LLM key in \u2699 Settings and I can answer directly.');
    }
  }

  fab.addEventListener('click', function(){ panel.classList.toggle('show'); });
  panel.querySelector('#sl-chat-x').addEventListener('click', function(){ panel.classList.remove('show'); });
  panel.querySelector('#sl-chat-clear').addEventListener('click', function(){ body.innerHTML = ''; addMsg('bot', 'Chat cleared. Ask me anything.'); });
  panel.querySelector('#sl-chat-gear').addEventListener('click', function(){
    var st = panel.querySelector('#sl-chat-settings');
    st.classList.toggle('show');
    panel.querySelector('#sl-cfg-endpoint').value = cfg.endpoint || '';
    panel.querySelector('#sl-cfg-key').value = cfg.key || '';
    panel.querySelector('#sl-cfg-model').value = cfg.model || '';
  });
  panel.querySelector('#sl-cfg-save').addEventListener('click', function(){
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    panel.querySelector('#sl-cfg-status').textContent = 'Saved.';
  });
  panel.querySelector('#sl-cfg-test').addEventListener('click', function(){
    var status = panel.querySelector('#sl-cfg-status');
    status.textContent = 'Testing\u2026';
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'Say OK' }], max_tokens: 5 })
    }).then(function(res){ status.textContent = res.ok ? 'Connected.' : 'Failed: HTTP ' + res.status; })
    .catch(function(err){ status.textContent = 'Failed: ' + err.message; });
  });
  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });
})();
</script>
<style id="sl-sel-css">
#sl-sel-tip{position:fixed;z-index:99999;display:none;align-items:center;gap:2px;padding:5px;background:#2E2A24;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);font:13px/1.2 system-ui,-apple-system,sans-serif}
#sl-sel-tip.show{display:flex}
#sl-sel-tip button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:#F7F1E3;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
#sl-sel-tip button:hover{background:#4A4234}
#sl-sel-tip .sl-sep{width:1px;height:18px;background:#55493A;margin:0 2px}
#sl-sel-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#2E2A24;color:#F7F1E3;padding:10px 18px;border-radius:999px;font:13px system-ui,-apple-system,sans-serif;z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:0 8px 22px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#sl-sel-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>
(function(){
  if (window.__slSelTools) return; window.__slSelTools = true;

  /* Compatibility shim: topic-based readers (e.g. Ponder on This) expose
     `topics` + `goTo(id)` instead of `PAGES` + `render()`. Build the PAGES
     interface so the embedded assistant's search and page jumps work there too. */
  try {
    if (typeof PAGES === 'undefined' && typeof topics !== 'undefined' && Array.isArray(topics)) {
      window.PAGES = topics.map(function(t){
        return {
          label: 'Topic ' + t.id + ' \u2014 ' + t.title,
          html: '<div>' + (t.matter || []).map(function(m){ return '<p>' + m.text + '</p>'; }).join('') + '</div>'
        };
      });
      window.render = function(){
        try { if (typeof goTo === 'function') goTo(topics[window.current || 0].id); } catch(e){}
      };
    }
  } catch(e){}

  var NOTES_KEY = 'sl_my_notes';

  var tip = document.createElement('div');
  tip.id = 'sl-sel-tip';
  tip.setAttribute('role', 'toolbar');
  tip.setAttribute('aria-label', 'Selection actions');
  tip.innerHTML =
    '<button type="button" data-act="ask">\u2728 Ask AI</button>' +
    '<span class="sl-sep"></span>' +
    '<button type="button" data-act="note">\uD83D\uDCDD Add to my note</button>';
  document.body.appendChild(tip);

  var toast = document.createElement('div');
  toast.id = 'sl-sel-toast';
  document.body.appendChild(toast);
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  var selText = '';

  function hideTip(){ tip.classList.remove('show'); }

  function insideUi(node){
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    while (el) {
      if (el.id === 'sl-chat-panel' || el.id === 'sl-sel-tip' ||
          el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return true;
      el = el.parentElement;
    }
    return false;
  }

  function showTip(){
    var sel = window.getSelection();
    var text = sel && !sel.isCollapsed ? sel.toString().replace(/\s+/g, ' ').trim() : '';
    if (text.length < 3 || insideUi(sel.anchorNode)) { hideTip(); return; }
    var rect;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch(e){ hideTip(); return; }
    if (!rect || (rect.width === 0 && rect.height === 0)) { hideTip(); return; }
    selText = text;
    tip.classList.add('show');
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = rect.left + rect.width / 2 - w / 2;
    var y = rect.top - h - 8;
    if (y < 6) y = Math.min(window.innerHeight - h - 6, rect.bottom + 8);
    x = Math.max(6, Math.min(window.innerWidth - w - 6, x));
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseup', function(){ setTimeout(showTip, 10); });
  document.addEventListener('touchend', function(){ setTimeout(showTip, 350); });
  document.addEventListener('mousedown', function(e){ if (!tip.contains(e.target)) hideTip(); });
  document.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideTip(); });

  /* Keep the text selection alive when the user taps a tooltip button */
  tip.addEventListener('mousedown', function(e){ e.preventDefault(); });
  tip.addEventListener('touchend', function(e){ e.preventDefault(); }, { passive: false });

  function askAi(text){
    var panel = document.getElementById('sl-chat-panel');
    var input = document.getElementById('sl-chat-input');
    var send = document.getElementById('sl-chat-send');
    if (!panel || !input || !send) return;
    panel.classList.add('show');
    var trimmed = text.length > 600 ? text.slice(0, 600) + '\u2026' : text;
    input.value = 'Explain this passage: \u201C' + trimmed + '\u201D';
    send.click();
    input.focus();
  }

  function currentLocation(){
    try {
      if (typeof PAGES !== 'undefined' && typeof current !== 'undefined' && PAGES[current]) {
        return PAGES[current].label || '';
      }
    } catch(e){}
    try {
      if (typeof topics !== 'undefined' && typeof currentId !== 'undefined') {
        var t = topics.find(function(x){ return x.id === currentId; });
        if (t) return 'Topic ' + t.id + ' \u2014 ' + t.title;
      }
    } catch(e){}
    return '';
  }

  function addNote(text){
    var notes = [];
    try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); } catch(e){}
    if (!Array.isArray(notes)) notes = [];
    notes.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      book: document.title,
      page: currentLocation(),
      text: text,
      url: location.pathname.split('/').pop(),
      ts: Date.now()
    });
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes.slice(0, 500))); } catch(e){}
    showToast('Saved to My Notes \u2014 view it on the library home page');
  }

  tip.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    var text = selText;
    hideTip();
    if (btn.getAttribute('data-act') === 'ask') askAi(text);
    else addNote(text);
  });
})();
</script>
