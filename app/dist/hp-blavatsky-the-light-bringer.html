<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H. P. Blavatsky: The Light-Bringer &mdash; Geoffrey A. Barborka (1970)</title>
<style>
/* ============ Design tokens ============
   Palette: parchment cream #F7F1E3, ink #2E2A24, gilt gold #B8963E,
            deep violet accent (devotion) #6B5691, rose accent (affection) #C1567B,
            soft border #E4D9BE
   Type: display "Cormorant Garamond" (Victorian book serif), body "EB Garamond",
         utility/caption "Cormorant" small caps
   Layout: single centered "book leaf" card, aurora/aura corner glow, page-turn transitions
   Signature: an animated soft-glowing aura halo behind the folio number, echoing the
   book's own theme of radiating thought-vibrations.
*/
:root{
  --parchment:#F7F1E3;
  --parchment-2:#EFE6CE;
  --ink:#2E2A24;
  --ink-soft:#5A5346;
  --gold:#B8963E;
  --gold-soft:#D8C186;
  --violet:#6B5691;
  --rose:#C1567B;
  --border:#E1D3AA;
  --card:#FFFDF6;
  --shadow: 0 20px 60px -20px rgba(60,45,10,0.35), 0 2px 10px rgba(60,45,10,0.08);
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #f3e8c9 0%, transparent 60%),
    radial-gradient(ellipse 900px 600px at 110% 110%, #ecdcc0 0%, transparent 55%),
    var(--parchment);
  color:var(--ink);
  font-family: "EB Garamond", "Cormorant Garamond", Georgia, serif;
  min-height:100vh;
  overflow-x:hidden;
}
@font-face{
  font-family:'Cinzel-fallback'; src:local('Georgia');
}
.app{
  max-width:980px;
  margin:0 auto;
  padding:28px 20px 60px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- Header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:12px;
}
.brand .glyph{
  width:40px;height:40px;border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #fff6df 0%, var(--gold-soft) 45%, var(--gold) 100%);
  box-shadow: 0 0 18px 2px rgba(184,150,62,0.45), inset 0 0 6px rgba(255,255,255,0.6);
  flex-shrink:0;
}
.brand h1{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-weight:600;
  font-size:1.35rem;
  letter-spacing:0.04em;
  margin:0;
  color:var(--ink);
}
.brand p{
  margin:0; font-size:0.8rem; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--ink-soft); font-family: Georgia, serif;
}
.progress-wrap{
  display:flex; align-items:center; gap:10px;
  font-size:0.82rem; color:var(--ink-soft); letter-spacing:0.04em;
}
.progress-bar{
  width:150px; height:5px; border-radius:3px; background:var(--parchment-2);
  overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,0.08);
}
.progress-fill{
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--gold-soft), var(--gold));
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ---------- Table of contents rail ---------- */
.toc-toggle{
  border:1px solid var(--border); background:var(--card); color:var(--ink);
  border-radius:8px; padding:7px 14px; font-family:inherit; font-size:0.85rem;
  letter-spacing:0.05em; cursor:pointer; box-shadow:var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.toc-toggle:hover{ transform: translateY(-1px); }
.toc-panel{
  position:fixed; top:0; right:-360px; width:340px; height:100%;
  background:var(--card); border-left:1px solid var(--border);
  box-shadow:-20px 0 50px rgba(60,45,10,0.18);
  z-index:50; transition:right .35s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; padding:24px 18px 40px;
}
.toc-panel.open{ right:0; }
.toc-panel h2{
  font-family:"Cormorant Garamond",serif; font-size:1.1rem; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--gold); margin:0 0 14px;
  border-bottom:1px solid var(--border); padding-bottom:10px;
}
.toc-close{
  position:absolute; top:16px; right:16px; background:none; border:none;
  font-size:1.3rem; color:var(--ink-soft); cursor:pointer; line-height:1;
}
.toc-section{
  margin-bottom:6px;
}
.toc-section-title{
  font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--violet); margin:16px 0 6px; font-weight:600;
}
.toc-item{
  display:block; width:100%; text-align:left; background:none; border:none;
  padding:6px 8px; font-family:"EB Garamond",serif; font-size:0.95rem;
  color:var(--ink); cursor:pointer; border-radius:6px;
  transition: background .15s ease;
}
.toc-item:hover{ background:var(--parchment-2); }
.toc-item.active{
  background: linear-gradient(90deg, rgba(184,150,62,0.16), transparent);
  color:var(--gold); font-weight:600;
}
.scrim{
  position:fixed; inset:0; background:rgba(40,30,10,0.25); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.scrim.show{ opacity:1; pointer-events:auto; }

/* ---------- The book leaf / page card ---------- */
.stage{
  flex:1;
  display:flex; align-items:flex-start; justify-content:center;
  position:relative;
}
.leaf{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  width:100%;
  padding:46px 54px 40px;
  position:relative;
  min-height:420px;
  animation: fadeIn .5s ease;
}
.leaf::before{
  content:"";
  position:absolute; inset:10px;
  border:1px solid rgba(184,150,62,0.28);
  border-radius:8px;
  pointer-events:none;
}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
@media (max-width:700px){
  .leaf{ padding:30px 20px 28px; }
}

.eyebrow{
  font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--violet); margin:0 0 6px; font-weight:600;
}
.leaf h2.page-title{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:2rem; font-weight:600; margin:0 0 22px; color:var(--ink);
  line-height:1.15; border-bottom:2px solid var(--gold-soft); padding-bottom:14px;
}
.leaf .content p{
  font-size:1.09rem; line-height:1.75; margin:0 0 1.1em; color:var(--ink);
  text-align:justify; hyphens:auto;
}
.leaf .content p.footnote{
  font-size:0.92rem; color:var(--ink-soft); font-style:italic;
  border-left:2px solid var(--gold-soft); padding-left:14px;
}
.leaf .content p.signature{
  text-align:right; font-style:italic; letter-spacing:0.05em; color:var(--ink-soft);
}
.leaf .content p.printer-line{
  text-align:center; font-size:0.85rem; color:var(--ink-soft); letter-spacing:0.06em;
}
.leaf .content h3.subhead{
  font-family:"Cormorant Garamond",serif; font-size:1.15rem; color:var(--violet);
  margin:22px 0 10px; letter-spacing:0.03em;
}
.leaf .content ol.principles{ padding-left:1.4em; }
.leaf .content ol.principles li{ margin-bottom:6px; font-size:1.05rem; }

/* Title page flourishes */
.book-title{
  font-family:"Cormorant Garamond",serif; text-align:center; font-size:2.6rem;
  letter-spacing:0.12em; margin:18px 0 6px; color:var(--ink);
}
.book-authors{
  text-align:center; font-size:1.05rem; letter-spacing:0.1em; font-weight:400;
  color:var(--violet); margin:0 0 26px;
}
.pub-line{ text-align:center; font-size:0.78rem; color:var(--ink-soft); letter-spacing:0.04em; }
.pub-house{ text-align:center; font-size:0.95rem; color:var(--ink-soft); margin:8px 0 26px; line-height:1.6; }
.print-table{ margin:0 auto 26px; font-size:0.9rem; color:var(--ink-soft); border-collapse:collapse; }
.print-table td{ padding:2px 10px; }
.printer-line{ text-align:center; font-size:0.85rem; color:var(--ink-soft); margin-top:20px; line-height:1.6; }

/* Colour key table */
.key-table{ overflow-x:auto; margin:18px 0; }
.key-table table{ border-collapse:collapse; width:100%; font-size:0.88rem; }
.key-table th, .key-table td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
.key-table th{ background:var(--parchment-2); color:var(--gold); width:28px; text-align:center; }
.caption-label{ text-align:center; letter-spacing:0.1em; text-transform:uppercase; font-size:0.85rem; color:var(--ink-soft); }

/* TOC / illustrations tables */
.toc-table, .toc-table.small{ width:100%; border-collapse:collapse; font-size:0.98rem; }
.toc-table td{ padding:5px 6px; border-bottom:1px dotted var(--border); }
.toc-table td:last-child{ text-align:right; color:var(--ink-soft); width:80px; }
.toc-table tr.indent td:first-child{ padding-left:22px; }
.toc-table tr.indent2 td:first-child{ padding-left:44px; font-style:italic; }
.toc-table.small td{ font-size:0.88rem; }
.illus-note{ margin-bottom:14px; }
.illus-note p{ font-size:0.85rem; color:var(--ink-soft); font-style:italic; }

/* ---------- Images / figure gallery ---------- */
.figures{
  display:flex; flex-wrap:wrap; gap:22px; margin:26px 0 10px; justify-content:center;
}
.figure-card{
  background:var(--parchment-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  max-width:360px;
  flex:1 1 260px;
  text-align:center;
  box-shadow: 0 8px 22px -12px rgba(60,45,10,0.25);
}
.figure-card img{
  max-width:100%; height:auto; border-radius:5px;
  border:1px solid rgba(0,0,0,0.08);
  background:#111;
  cursor:zoom-in;
  transition: transform .25s ease;
}
.figure-card img:hover{ transform:scale(1.015); }
.figure-cap{
  margin-top:9px; font-size:0.85rem; color:var(--ink-soft);
  font-style:italic; letter-spacing:0.02em;
}

/* Lightbox */
.lightbox{
  position:fixed; inset:0; background:rgba(20,15,5,0.82);
  display:none; align-items:center; justify-content:center; z-index:100;
  padding:30px;
}
.lightbox.open{ display:flex; }
.lightbox img{ max-width:100%; max-height:85vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.lightbox-close{
  position:absolute; top:22px; right:28px; background:none; border:none;
  color:#f6ecd2; font-size:2rem; cursor:pointer; line-height:1;
}

/* ---------- Footer nav ---------- */
nav.pager{
  position:sticky; bottom:0;
  margin-top:26px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:linear-gradient(180deg, rgba(247,241,227,0) 0%, var(--parchment) 30%);
  padding-top:18px;
}
.pager-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border); color:var(--ink);
  padding:11px 20px; border-radius:10px; font-family:inherit; font-size:0.95rem;
  cursor:pointer; box-shadow:var(--shadow); letter-spacing:0.02em;
  transition: transform .15s ease, opacity .15s ease;
}
.pager-btn:hover:not(:disabled){ transform:translateY(-2px); }
.pager-btn:disabled{ opacity:0.35; cursor:default; }
.pager-btn.next{ background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:#3a2c08; border:none; }
.folio{
  position:relative;
  font-family:"Cormorant Garamond",serif; font-size:0.95rem; color:var(--ink-soft);
  text-align:center; letter-spacing:0.05em;
}
.folio .halo{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:70px; height:70px; border-radius:50%;
  background: radial-gradient(circle, rgba(184,150,62,0.30) 0%, transparent 70%);
  animation: pulse 3.2s ease-in-out infinite;
  z-index:-1;
}
@keyframes pulse{
  0%,100%{ transform:translate(-50%,-50%) scale(0.9); opacity:0.5; }
  50%{ transform:translate(-50%,-50%) scale(1.25); opacity:0.9; }
}

@media (prefers-reduced-motion: reduce){
  .leaf{ animation:none; }
  .folio .halo{ animation:none; }
}

/* PDF-exact content classes */
.leaf .content h3.pdf-heading{
  font-family:"Cormorant Garamond",serif; font-size:1.2rem; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--violet); margin:20px 0 10px;
}
.leaf .content p.pdf-caption{
  font-size:0.92rem; letter-spacing:0.05em; text-transform:uppercase;
  color:var(--gold); text-align:center; font-weight:600; margin:16px 0 10px;
}
.leaf .content p.empty-note{
  text-align:center; color:var(--ink-soft); font-size:1rem; padding:30px 0;
}

/* section pill on top of card */
.section-pill{
  position:absolute; top:-13px; left:50px;
  background:linear-gradient(135deg, var(--violet), #8875ac);
  color:#fff; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:5px 14px; border-radius:20px; box-shadow:0 6px 14px -6px rgba(107,86,145,0.6);
}
@media (max-width:700px){
  .section-pill{ left:20px; }
}

/* ---------- Read aloud ---------- */
.listen-bar{
  display:none; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 18px; margin-bottom:16px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); font-family:Georgia, serif; font-size:0.85rem;
}
.listen-bar.open{ display:flex; }
.listen-bar button{
  font-family:inherit; font-size:0.85rem; padding:7px 14px; border-radius:999px;
  border:1px solid var(--gold); background:linear-gradient(180deg,#fffdf6,#f3ead2);
  color:var(--ink); cursor:pointer; letter-spacing:0.02em;
}
.listen-bar button:hover:not(:disabled){ background:var(--gold); color:#fff; }
.listen-bar button:disabled{ opacity:0.45; cursor:default; }
.listen-bar select{
  font-family:inherit; font-size:0.82rem; padding:6px 8px; border-radius:8px;
  border:1px solid var(--border); background:#fff; color:var(--ink);
  max-width:230px;
}
.listen-bar label{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); }
.listen-bar .status{ color:var(--ink-soft); font-style:italic; flex-basis:100%; }

.search-bar, .notes-panel { display:none; padding:10px 24px; background:#f8f3e7; border-bottom:1px solid #e3d8c3; align-items:center; gap:10px; flex-wrap:wrap; }
.search-bar.open, .notes-panel.open { display:flex; }
.search-bar input { flex:1; min-width:180px; padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; font-family:inherit; font-size:14px; color:#3a3227; }
.search-bar input:focus { outline:2px solid #b29a5b; }
.search-bar .sbtn { padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; cursor:pointer; font-family:inherit; font-size:13px; color:#3a3227; }
.search-bar .sbtn:hover { background:#f0e7d3; }
#search-info { font-size:13px; color:#7a6c50; white-space:nowrap; }
mark.search-hit { background:#ffe9a8; color:inherit; padding:0 1px; border-radius:2px; }
.notes-panel { display:none; }
.notes-panel.open { display:block; }
#notes-body { max-width:820px; margin:0 auto; font-size:14.5px; line-height:1.65; color:#3a3227; }
#notes-body h3 { font-size:15px; margin:0 0 8px; color:#5c4a1e; letter-spacing:0.02em; }
#notes-body h4 { font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:#8a744a; margin:14px 0 6px; }
#notes-body p { margin:0 0 10px; }
#notes-body ul { margin:0; padding-left:20px; }
#notes-body li { margin-bottom:5px; }
#notes-body .notes-empty { color:#8a7c62; font-style:italic; }
</style>
</head>

e meaning associated with the term is clear enough; for it links up with the name given to those Divine Beings who came to the assistance of humanity during one of its most critical periods. These are the Agnishvatta Pitris, the awakeners of the fire—which signifies the mind-principle.<\/p>\n<p>About the Sons of the Fire-Mist we read in The Secret Doctrine :<\/p>\n<p>In the first or earlier portion of the existence of this Third Race, while it was yet in its state of purity, the 'Sons of Wisdom,' who...incarnated in this Third Race, produced by Kriyasakti a progeny called the 'Sons of A d' or 'of the Fire-Mist,' the 'Sons of Will and Yoga,' etc. They were a conscious production, as a portion of the race was already animated with the divine spark of spiritual, superior intelligence. It was not a Race, this progeny. It was at first a wondrous Being, called the 'Initiator,' and after him a group of semi-divine and semi-human beings. 'Set apart' in Archaic genesis for certain purposes, they are those in whom are said to have incarnated the highest Dhyanis, 'Munis and Rishis from previous Manvantaras'— to form the nursery for<\/p>\n<p>future human adepts, on this earth and during the present cycle. These 'Sons of Will and Yoga' born, so to speak, in an immacul­ ate way, remained, it is explained, entirely apart from the rest of mankind.* The secret abiding place of the Sons of the Fire-Mist was an island situated in a vast inland sea, which extended over Middle Asia north of the Himalayas.<\/p>\n<p>i<\/p>\n<p>*VoI. I, p.207 1st ed.; I, 255-6, Adyar ed.; I, 228, 3rd ed.<\/p>", "images": [], "label": "Helena Petrovna Blavatsky"}, {"pdf_page_index": 5, "pdf_page_number": 6, "html": "<p>The 'Island', according to belief, exists to the present hour; now, as an oasis surrounded by the dreadful wildernesses of the great Desert, the Gobi—whose sands 'no foot hath crossed in the memory of man.'f While the above account may be traditional, we have the authorita­ tive statement of Mahatma K.H. about the existence of the Brother­ hood in the nineteenth century, in a letter addressed to the London Lodge of The Theosophical Society, dated December 7, 1883, from<\/p>\n<h3 class=\"pdf-heading\">Mysore :<\/h3>\n<p>There are even at the present moment three centres of the Occult Brotherhood in existence, widely separated geographical­ ly, and as widely exoterically —the true esoteric doctrine being identical in substance though differing in terms; all aiming at<\/p>\n<p>the same grand object. J- To one of these centres an injunction was given, in conformity with<\/p>\n<h3 class=\"pdf-heading\">the purposes of the establishment of these centres. It reads :<\/h3>\n<p>Among the commandments of Tsong-Kha-pa there is one that enjoins the Arhats to make an attempt to enlighten the world, including the 'white barbarians,' every century, at a certain specified period of the cycle.* Apparently the last quarter of the nineteenth century was a propitious<\/p>\n<p>period for making an effort in compliance with the injunction of this great reformer of Buddhism in Tibet—especially so because this time-<\/p>\n<p>period nearly coincided with two other important cyclical periods, namely with one of the minor cyclical periods of the Kali-yuga and with the ushering in of another Messianic cycle. The Messianic Cycle referred to is that of the 2160-year period connected with the pre­ cession of the equinoxes. It marked the conclusion of the Piscean Age.<\/p>\n<h3 class=\"pdf-heading\">With regard to the Kali-yuga cycle, The Secret Doctrine says :<\/h3>\n<p>In about nine years hence, the first cycle of t he first five millen­ niums, that began with the great cycle of the Kali-Yuga, will end. And then the last prophecy contained in that book (the first volume of the prophetic record for the Black Age) will be accomplished. We have not long to wait, and many of us will<\/p>\n<p>witness the Dawn of the New Cycle, at the end of which not a few accounts will be settled and squared between the races.** The ending of the nine-year period referred to took place on February<\/p>\n<p>16, 1898. The Dawn of the New Cycle signifies the coming of the Aquarian Age.<\/p>\n<p>2<\/p>\n<p>til, 220 1st ed.; III, 224, Adyar ed.; II, 230-1, 3rd ed. %The Mahatma Letters to A. P. Sinnett, p.339,1st ed.; p.393, 3rd ed. *The Secret Doctrine, V, 3% Adyar ed.; III. 412, 3rd ed. **Vol. I, p.xliv, 1st ed.; I, 65 Adyar ed.; I, 27 3rd ed.<\/p>", "images": [], "label": "Mysore :"}, {"pdf_page_index": 6, "pdf_page_number": 7, "html": "<p>In accordance with the injunction laid on the Brotherhood that an effort should be made every century to enlighten the western world, it would seem likely that some of the members of the Fraternity were given the task of finding a suitable individual who would act as a representative or vehicle for that purpose. Statements are on record to show that these ideas are not far-fetched. First, with regard to the notion that individuals are born with constitutions enabling them to<\/p>\n<h3 class=\"pdf-heading\">act in unusual ways :<\/h3>\n<p>Some persons are born with organisations so exceptional that the door which shuts other people in from communication with the world of the astral light can be easily unbarred and opened, and their souls can look into, or even pass into, that world and return again. Those who do this consciously, and at will, are termed magicians, hierophants, seers, adepts; those who are made to do it, either through the fluid of the mesmerizer or of 'spirits,' are 'mediums'. The astral soul, when the barriers are<\/p>\n<p>once opened, is so powerfully attracted by the universal, astral magnet that it sometimes lifts its encasement with it and keeps it suspended in mid-air, until the gravity of matter reasserts its supremacy, and the body redescends again to earth.J The second statement deals with the search that was instituted for<\/p>\n<h3 class=\"pdf-heading\">'nearly a century', in the words of Mahatma K.FL :<\/h3>\n<p>Notwithstanding that the time is not quite ripe to let you entirely into the secret; and that you are hardly yet prepared to understand the great Mystery, even if told of it, owing to the great injustice and wrong done, I am empowered to allow you a glimpse behind the veil. This state of hers [H.P.B.'s] is intimately connected with her occult training in Tibet, and due to her being sent out alone into the world to gradually prepare the way for others. After nearly a century of fruitless search, our chiefs had to avail themselves of the only opportunity to send out a European body upon European soil to serve as a connecting link between that country and our own. You do not understand? Of course not. Please then, remember, what she tried to explain, and what you gathered tolerably well from her, namely the fact of the seven principles in the complete human being. Now, no man or woman, unless he be an initiate of the 'fifth circle,' can leave the precincts of Bod-Las and return back into the world in his integral whole —if I may use the expression. One, at least, of his seven satellites<\/p>\n<p>tlsis Unveiled, I, 198<\/p>\n<p>3<\/p>", "images": [], "label": "act in unusual ways :"}, {"pdf_page_index": 7, "pdf_page_number": 8, "html": "<h3 class=\"pdf-heading\">has to remain behind for two reasons : the first to form the<\/h3>\n<p>necessary connecting link, the wire of transmission—the second as the safest warranter that certain things will never be divulged. She is no exception to the rule, and you have seen another ex­ emplar—a highly intellectual man—who had to leave one of his skins behind; hence, is considered highly eccentric. The bearing and status of the remaining six depend upon the inherent quali­ ties, the psycho-physiological peculiarities of the person, especial­ ly upon the idiosyncracies transmitted by what modern science calls 'atavism'.* When the information given in the above extract is read in connection with that which follows, there should be no doubt about the fact that H. P. Blavatsky was definitely sent to America for the purpose of founding a Society, to be a transmitter of the occult doctrine. Writing<\/p>\n<h3 class=\"pdf-heading\">to A. P. Sinnett, Mathatma M. states :<\/h3>\n<p>I will tell you something you should know, and may derive profit from. On the 17th of November next the Septenary term of trial given the Society at its foundation in which to discreetly 'preach us' will expire. One or two of us hoped that the world<\/p>\n<p>had so far advanced intellectually, if not intuitionally, that the Occult doctrine might gain an intellectual acceptance, and the impulse given for a new cycle of o ccult research. Others—wiser as it would now seem—held differently, but consent was given for the trial. It was stipulated, however, that the experiment should be made independently of our personal management; that there should be no abnormal interference by ourselves. So casting about we found in America the man to stand as leader •—a man of great moral courage, unselfish and having other good qualities. He was far from being the best, but (as Mr Hume speaks in H.P.B.'s case)—he was the best one available. With him we associated a woman of most exceptional and wonderful en­ dowments. Combined with them she had strong personal defects, but just as she was, there was no second to her living fit for this work. We sent her to America, brought them together—and the trial began. From the first both she and he were given to clearly understand that the issue lay entirely with themselves, f<\/p>\n<p>4 *The Mahatmas Letters, pp.203-4, 1st ed.; pp.201-2, 3rd ed. f Op. ext., Letter xliv, p.263, 1st ed.; p.259, 3rd ed.<\/p>", "images": [], "label": "has to remain behind for two reasons : the first to form the"}, {"pdf_page_index": 8, "pdf_page_number": 9, "html": "<p>PROTECTIVE GUARDIANSHIP<\/p>\n<p>IN SUPPORT of the statement that H. P. Blavatsky was selected to be­<\/p>\n<p>come an emissary, there is evidence that during her childhood she was watched over and protected from serious injury; and that in later life this guardianship was even more protective, at times saving her when death was imminent. Even her birth was a precarious event, for she was born prematurely soon after midnight, July 30-31 (Russian style; or August 11-12 according to the present mode of reckoning), her mother being the wife of Captain Peter von Hahn. Cholera was rag­ ing throughout Russia. Some members of her family had succumbed to it and her grandparents were fearful that the child might not survive, so a hasty baptism was arranged in order that she might have<\/p>\n<p>the protection of the holy church. The church dignitaries donned their ceremonial robes and vestments; the members of the family gathered and were given lighted candles, as was customary in the Greek Church. One of the ceremonialists was a child, who stood in the first row behind the officiating priest, and also held a lighted candle. At the height of the ceremony the robes of the officiating priest caught fire, and the service had to come to an abrupt end. It was whispered that a most unusual career was in store for one who was undergoing such a baptism !<\/p>\n<p>The next unusual event would undoubtedly have had dire results but for timely assistance. It occurred in the home of her grandparents. In one o c the rooms of their mansion large portraits were hanging on the walls. One of them was covered by a curtain, and little Helena wondered why. One day, when she was all alone, she made up her mind to find out. As she could not reach the curtain, she dragged a small table against the wall and climbed on to it. Still she could not reach. So she put a chair on the table, climbed up again and pulled the curtain aside. The chair must have been precariously placed, for it suddenly gave way and the child would have been thrown to the<\/p>\n<p>floor but for the fact that strong arms grasped her and laid her gently on the floor.<\/p>\n<p>When she opened her eyes, the table had been put back in its usual position, also the chair; and the curtain was drawn over the portrait. But there was one tell-tale mark left as evidence of the occurrence.<\/p>\n<p>5<\/p>", "images": [], "label": "Page 9"}, {"pdf_page_index": 9, "pdf_page_number": 10, "html": "<p>High up on the wall beside the curtain was an imprint of a tiny hand.<\/p>\n<p>Another incident demonstrates the continued watchfulness of her guardian. Helena was now in her early teens, old enough to ride alone, even bare-back, as the Cossacks did—and how she loved it. During one gallop, however, her horse got frightened and jerked the reins out of her hands, and her foot got entangled in one of the stirrups. Again she was rescued from her predicament. Supporting arms held her up so that she did not fall, and the horse was brought under control.<\/p>\n<p>It was recorded by Helena's sister Vera that in May, 1848, the sisters travelled with both of their aunts and their uncle, Yuliy F.<\/p>\n<p>Witte, to Pyatigorsk and Kislovodsk for water cures. While on the journey between Koyshaur and Kobi, Helena narrowly escaped being engulfed in an avalanche.<\/p>\n<p>About a year later Helena was married to N. V. Blavatsky, a State Official. But the marriage was in name only, for within three months —one month of which was spent with her grandparents—Mme. Blavatsky had left Russia and begun her extensive travels. Then in 1851 the most momentous event of her life occurred. She met face to face the person she had come to regard as her guardian—the one who had in fact thus far protected her. This was in London during the International Exhibition featuring the Crystal Palace in Hyde Park.<\/p>\n<h3 class=\"pdf-heading\">She made this note of the meeting in her Sketch-book, at the time :<\/h3>\n<p>A memorable night. A certain night by the light of the setting moon—at Ramsgate, 12 of August, 1851—when I met the Master of my dreams. The 12 of A ugust—that is July 31, Russian style—the day of my birth—20 years.! However, Mme. Blavatsky told Countess Wachtmeister that the meet­ ing with her guardian had actually occurred in London, although she had placed it as taking place in Ramsgate, 'so that anyone casually taking up her book would not know where she had met her Master, and that her first interview with him had been in London' in Hyde Park, near the Serpentine.<\/p>\n<p>The important point about this meeting—although this was not included in the vivid impression she put into writing at the time—was that it was the turning-point of her life. When she related the episode to Countess Wachtmeister she said that the Master asked her whether she would be willing to co-operate in a work which he was about to undertake, and that this would necessitate certain preparatory<\/p>\n<p>6<\/p>\n<p>fReminiscences of H. P. Blavatsky and 'The Secret Doctrine' by Countess<\/p>\n<p>Constance Wachtmeister, pp.56-8.<\/p>", "images": [], "label": "She made this note of the meeting in her Sketch-book, at the time :"}, {"pdf_page_index": 10, "pdf_page_number": 11, "html": "<p>features. From the sparse references she made to it, there is no doubt that she underwent rigorous training for the work and furthermore that she was excellently fitted for the task.<\/p>\n<p>After this physical meeting with her Master, Mme. Blavatsky continued to have what we may regard as miraculous escapes from near death, although in relating the circumstances about these in­ cidents she did not attribute any of them to rescues made by her guardian. The first one is mentioned in a letter written to Georgina Johnston from London in 1887. Therein she states that in Greece her life was saved by an Irishman named Johnny O'Brien—but gave no further particulars. Whether this was before or after meeting her Master in London it is difficult to say, because there are many con­ flicting accounts in regard to her travels between 1850 and 1851. From what she herself wrote, it would seem that some time after her memorable meeting she was in America in the fall of 1851. She also journeyed to South America, then to the West Indies, and on to India, Java and Singapore, sailing from there back to England. The ship was the SS Gwalior, which was wrecked near the Cape, but she was saved along with twenty others.<\/p>\n<p>The next critical incident which befell her was the dramatic one she described in Isis Unveiled, when she was in a desert with a Tatar Shaman. Since our purpose is to demonstrate the efforts Mme. Blavatsky made to acquire the status she later gained—that of being an accepted chela of her Master—her ability to overcome the diffi­ culties she encountered during her quest is well exemplified in her recital of this episode. She began by referring to a carnelian stone she possessed.<\/p>\n<p>Every Shaman has such a talisman, which he wears attached to a string, and carries under his left arm.<\/p>\n<p>'Of what use is it to you, and what are its virtues?' was the question we often offered to our guide. To this he never answered directly, but evaded all explanation, promising that as soon as an opportunity was offered, and we were alone, he would ask the stone to 'answer for himself'. With this very indefinite hope, we were left to the resources of our own imagination.<\/p>\n<p>But the day on which the stone 'spoke' came very soon. It was during the most critical hours of our life; at a time when the vagabond nature of a traveller had carried the writer to far-off lands, where neither civilization is known, nor security can be<\/p>\n<p>7<\/p>", "images": [], "label": "Page 11"}, {"pdf_page_index": 11, "pdf_page_number": 12, "html": "<p>guaranteed for one hour. One afternoon...the Shaman, who had<\/p>\n<p>become our only protector in those dreary deserts, was reminded of his promise. He sighed and hesitated; but, after a short silence, left his place on the sheepskin, and, going outside, placed a dried-up goat's head with its prominent horns over a wooden peg, and then dropping down the felt curtain of the tent, re­ marked that no living person would venture in, for the goat's head was a sign that he was at work.<\/p>\n<p>After that, placing his hand in his bosom, he drew out the little stone, about the size of a walnut, and, carefully unwrapping it, proceeded, as it appeared, to swallow it. In a few moments his limbs stiffened, his body became rigid, and he fell, cold and motionless as a corpse. But for a slight twitching of his lips at every question asked, the scene would have been embarrassing, nay—dreadful. The sun was setting, and were it not that dying embers flickered at the centre of the tent, complete darkness would have been added to the oppressive silence which reigned. We have lived in the prairies of the West, and in the boundless steppes of Southern Russia; but nothing can be compared with<\/p>\n<p>the silence at sunset on the sandy deserts of Mongolia ; not even the barren solitudes of the deserts of Africa, though the former are partially inhabited, and the latter utterly void of life. Yet, there was the writer alone with what looked no better than a corpse lying on the ground. Fortunately, this state did not last long.<\/p>\n<p>'Mahandu !' uttered a voice, which seemed to come from the bowels of the earth, on which the Shaman was prostrated. 'Peace be with you, what would you have me do for you ?'...<\/p>\n<p>. For over two hours, the most substantial, unequivocal proofs that the Shaman's astral soul was travelling at the bidding of our unspoken wish, were given us.<\/p>\n<p>We had directed the Shaman's inner ego to...the Kutchi of Lha-Ssa, who travels constantly to British India and back. We<\/p>\n<p>know that he was apprised of our critical situation in the desert; for a few hours later came help, and we were rescued by a party of twenty-five horsemen who had been directed by their chief to find us at the place where we were, which no living man en­ dowed with common powers could have known. The chief of this escort was a Shaberon, an 'adept' whom we had never seen<\/p>\n<p>8<\/p>", "images": [], "label": "Page 12"}, {"pdf_page_index": 12, "pdf_page_number": 13, "html": "<p>before, nor did we after that, for he never left his soumay (lamasery), and we could have no access to it. But he was a personal friend of the Kutchi.* A passing reference to what may have resulted in serious consequences for Mme. Blavatsky during her travels in Burma is also referred to in his Unveiled.-.<\/p>\n<p>A fearful fever contracted by the writer near Rangoon, after a flood of the Irrawaddy River, was cured in a few hours by the<\/p>\n<p>juice of a plant called, if we mistake not, Kukushan, though there may be thousands of natives ignorant of its virtues, who are left to die of fever, f This is comparable to another remarkable cure—although this time no medicine is mentioned as having been given; nor does Mme. Blavatsky relate how she came to be relieved from the situation in which she found herself, nor how the wound from which she suffered was inflicted. For that matter, the more one probes into the incidents of her life the more mysterious does each of them become. As usual one cannot give a precise date. The event is related to have taken place in the spring of 1859 after she had spent some time with her father and her half-sister Lisa, in St. Petersburg. From there she went on a visit to her widowed sister, Vera de Yahontov, at Rugodevo.<\/p>\n<h3 class=\"pdf-heading\">There Mme. Blavatsky was prostrated by a serious illness : a wound<\/h3>\n<p>appeared near her heart. She was in what appeared to be a death-like<\/p>\n<p>trance for three or four days; then suddenly and unaccountably she was cured.<\/p>\n<p>A somewhat similar prostration took place during 1864-65, when she was living in the military settlement of Ozurgety, in Mingrelia. The local physician was unable to diagnose her condition or give any help; he therefore ordered that Mme. Blavatsky, apparently near death, should be placed in a boat and taken down the river Rion to Kutais; from there she was to be transported in a carriage to Tiflis. But again there was another sudden cure. Referring to this episode<\/p>\n<h3 class=\"pdf-heading\">later, she commented : 'between the Blavatsky of 1845-65 and the<\/h3>\n<p>Blavatsky of the years 1865-82 there is an unbridgeable gulf.'% She was referring to this fact: during the period 1845-65 whatever occult or psychic manifestations had taken place could be regarded as occurring without her conscious control, therefore unconsciously; whereas from 1865-82 whatever occult phenomena were produced were under her control, and she was consciously able to direct them.<\/p>\n<p>9<\/p>\n<p>*Isis Unveiled. II, 626-8 t Op. cit., II, 621. tH. P. Blavatsky Speaks, II, 58.<\/p>", "images": [], "label": "There Mme. Blavatsky was prostrated by a serious illness : a wound"}, {"pdf_page_index": 13, "pdf_page_number": 14, "html": "<p>After recovering from this strange illness, Mme. Blavatsky went to the Caucasus, where she spent some years. While there she was thrown from her horse and fractured her spine. No further first-hand know­ ledge is available regarding this injury nor as to her recovery from it. Likewise no information is given about a more calamitous occurence, or the reason why Mme. Blavatsky became involved in the affair. She was present at the battle of Mentana, Italy, between Garibaldi red shirts and French troops on November 2, 1867, and was wounded five<\/p>\n<p>times. Her left arm was broken in two places by a sabre stroke, and she received bullets in her shoulder and leg. Col. Olcott testifies that he actually felt the bullets when Mme. Blavatsky pointed out the spots to him. But not a word was forthcoming in regard to her con­ valescence.<\/p>\n<p>As though this were not enough, she had one still more frightening experience. About three years later she left Greece for Egypt, sailing from Piraeus in the SS Eunomia. In those days it was necessary for ships plying between Piraeus and Nauplia to carry cannon and a supply of gunpowder, as protection against pirates. On July 4, 1871,<\/p>\n<p>between the islands of Dokos and Hydra, while the Eunomia was in sight of the island of Spetsai in the gulf of Nauplia, there was a terrific explosion: the ship sank and there were only a few survivors. Mme.<\/p>\n<p>Blavatsky was one of them; but all her possessions were lost. The Greek government provided transport for the survivors, so that Mme.<\/p>\n<p>Blavatsky was able to reach Alexandria; but she arrived there with­ out- funds.<\/p>\n<p>The next mishap to befall her was in New York, when she fell and injured her knee—most likely on the icy pavement, as it happened during 'he last days of January, 1875. Then on February 13 she had another accident. As she was trying to move her bed, it fell on her leg and seriously injured it. By May it was much worse and on May<\/p>\n<p>26 it became paralysed and soon it was feared that it would have to be amputated. On June 3 the Spiritual Scientist journal announced that Mme. Blavatsky was seriously ill. This was followed by a second notice stating that the crisis was reached at midnight, June 3. Her attendants had supposed her to be dead, because she lay cold, pulse­ less and rigid, while her injured leg had swollen to double its normal size; it had also turned black. In fact, her physician had given her up.<\/p>\n<p>Nevertheless, after a few hours the swelling subsided and she revived.<\/p>\n<p>During the rest of the month, according to correspondence Col.<\/p>\n<p>10<\/p>", "images": [], "label": "Page 14"}, {"pdf_page_index": 14, "pdf_page_number": 15, "html": "<p>Olcott received during the interval, Mme. Blavatsky was undergoing certain trials which were in the nature of initiations.<\/p>\n<p>Two other times may also be noted when H. P. Blavatsky was so gravely ill that death would have ensued had she not been revivified<\/p>\n<p>by occult means. The first was on the 5 February, 1885, at Adyar. Referring to this she wrote to A. P. Sinnett:<\/p>\n<p>For though, doctors notwithstanding (who proclaimed my four days' agony, and the impossibility of recovery), I suddenly got better thanks to Master's protecting hand, I carry two mortal<\/p>\n<p>diseases in me which are not cured—heart and kidneys. At any moment the former can have a rupture, and the latter carry me away in a few days.* On being revivified Mme. Blavatsky left India for Europe on March 31, never to return. On the second occasion she was at Ostend, engaged in writing The Secret Doctrine. In March, 1887, she was in great agony with a kidney infection. Dr Ashton Ellis was cabled to come to her from London; he came and gave his report.The American consul in Ostend was called to prepare notarial service prior to death. Both men thought death to be imminent. But there was a sudden turn. One night in the last week of March, her Master came and gave her the choice of finishing The Secret Doctrine or dying. He also showed her a vision of what was in store for her in connection with the future of The Theosophical Society. In heroic manner, true to the precepts of the Lodge she was serving, H.P.B. chose to continue the task she had undertaken—that of writing The Secret Doctrine so that the message of the Ancient Wisdom could be made available to the western world. Thus was she truly carrying on the tradition of the Occult Brother­<\/p>\n<p>hood of being a torchbearer.<\/p>\n<p>H.P.B. gave a hint as to the method which was used for revivifying her. It is to be found in a brief passage in The Secret Doctrine :<\/p>\n<p>For Sound generates, or rather attracts together, the elements that produce an ozone... It may even resurrect a man or an animal whose astral Vital body' has not been irreparably separ­ ated from the physical body by the severance of the magnetic or odic chord. As one saved thrice from death by that power, the writer ought to be credited with knowing personally something about it.f<\/p>\n<p>11<\/p>\n<p>*Thc Mahatma Letters, pp.469-70, 1st ed.; p.162. 3rd ed. f Op. cit. I, 555, 1st ed.; II, 279, Adyar ed.; I, 606, 3rd ed.<\/p>", "images": [], "label": "Page 15"}, {"pdf_page_index": 15, "pdf_page_number": 16, "html": "<p>H. P. BLAVATSKY IN TIBET<\/p>\n<p>THEOSOPHISTS are much interested in learning about the time<\/p>\n<p>that H.P.B. was in Tibet, for if she was a messenger of the occult Brotherhood, she must have undergone certain experiences in Tibet and received training under her Teachers there.<\/p>\n<h3 class=\"pdf-heading\">One thing is certain : she was very reticent about giving informa­<\/h3>\n<p>tion as to how or when she entered Tibet. The reason is obvious. She had given her pledge to maintain secrecy regarding her doings in that 'Forbidden Land,' as Tibet was referred to in her days. Never­ theless, by searching through available data, an interesting account may be given of her presence in Bod-las—as the land of Tibet is referred to by her Teachers. Probably the most direct statement that Mme. Blavatsky gave concerning the period she was there was made in answer to a journalist who was critical regarding her stay in Tibet<\/p>\n<h3 class=\"pdf-heading\">and her qualifications :<\/h3>\n<p>I have lived at different periods in Little Tibet as in Great Tibet, and that these combined periods form more than seven years. Yet, I have never stated either verbally or over my signa­ ture that I had passed seven consecutive years in a convent. What I have said, and repeat now, is, that I have stopped in Lamaistic convents; that I have visited Tzi-gadze, the Tashi-Lhunpo ter­ ritory and its neighbourhood, and that I have been further in, and in such places of Tibet as have never been visited by any other European, and that he can ever hope to visit.f The events described took place in the 1860-70 period. Later on, however, Mme. Blavatsky narrated how on one occasion she entered Tibet. But this was in 1882 after the Theosohpical Society head­<\/p>\n<h3 class=\"pdf-heading\">quarters had moved to Adyar :<\/h3>\n<p>When journeying from Chandernagor to Darjeeling, instead of proceeding to it direct, I left the train half way, was met by friends with a conveyance, and passed with them into the ter­<\/p>\n<p>ritory of Sikkim, where I found my Master and Mahatma Koot Hoomi. Thence five miles across the old borderland of T ibet.i One of the very few accounts which Mme. Blavatsky penned regard­ ing her stay with the Masters in Tibet may be traced to the year 1870. In a letter dated January 6, 1886 she stated that the episode occurred 'sixteen years ago'.<\/p>\n<p>12<\/p>\n<p>\\Light, Vol. IV, No. 188, pp.323-4; republished in H. P. Blavatsky Collected<\/p>\n<p>Writings, VI, 269-80. t Ibid<\/p>", "images": [], "label": "One thing is certain : she was very reticent about giving informa­"}, {"pdf_page_index": 16, "pdf_page_number": 17, "html": "<p>I went to bed and I had the most extraordinary vision...in my sleep I saw them both [the Masters], I was again (a scene of years<\/p>\n<p>back) in Mah. K.H.'s house. I was sitting in a corner on a mat and he walking about the room in his riding dress, and Master<\/p>\n<h3 class=\"pdf-heading\">was talking to someone behind the door. 'I remind can't'— I<\/h3>\n<p>pronouncd in answer to a question of His about a dead aunt. He smiled and said 'Funny English you use.'Then I felt ashamed, hurt in my vanity, and began thinking (mind you, in my dream or vision which was the exact reproduction of what had taken place word for word 16 years ago) 'now I am here and speaking nothing hut English in verbal phonetic language 1 can perhaps learn to speak better with Him.' (To make it clear with Master I also used English, which whether bad or good was the same for Him as he does not speak it but understands every word I say out of my head; and I am made to understand Him— how I could never tell or explain if I were killed but I do. With D.K. I also spoke English, he speaking it better even than Mah. K.H.) Then, in my dream still, three months after as I was made to feel in that vision—I was standing before Mah. K.H. near the old building taken down he was looking at, and as Master was not at home, I took to him a few sentences I was studying in Senzar in his sister's room and asked him to tell me if I translated them correctly—and gave him a slip of paper with these sentences written in English. He took and read them and correcting the interpretation read them over and said 'Now your English is<\/p>\n<p>becoming better— try to pick out of my head even the little I know of it.' And he put his hand on my forehead in the region of memory and squeezed his fingers on it (and I felt even the same trifling pain in it, as then, and the cold shiver I had ex­ perienced) and since that day He did so with my head daily, for about two months. Again, the scene changes and I am going away with Master who is sending me off, back to Europe. I am bidding good-bye to his sister and her child and all the chelas. I listen to what the Masters tell me. And then come the parting words of Mah. K.H.. .* In another letter, this time written to Dr. Hartmann, Mme. Blavatsky gives a detailed picture of one of the Tibetan temples near Shigatse and also describes the characteristics of most other temples, f<\/p>\n<p>Further evidence that Mme. Blavatsky was in Tibet and received in-<\/p>\n<p>13<\/p>\n<p>*The Mahatma Letters, Letter cxl, pp. 478-9, 1st ed.; p.471, 3rd ed. fFrom The Path, Jan., 1896; quoted in Personal Memoirs of H. P. Blavatsky,<\/p>\n<p>p. 162.<\/p>", "images": [], "label": "was talking to someone behind the door. 'I remind can't'— I"}, {"pdf_page_index": 17, "pdf_page_number": 18, "html": "<p>struction from those who later sent her to the western world appears in a letter written by one of her instructors. This letter was written in French five years before the founding of The Theosophical Society and sent to one of the members of her family, who had not heard from her for many years. It was addressed to Nadyejda A. Fadeyev—<\/p>\n<h3 class=\"pdf-heading\">in translation :<\/h3>\n<p>The noble relatives of Mme. H. Blavatsky have no cause what­ soever for grief. Their daughter and niece has not left this world at all. She is living and desires to make known to those whom she loves that she is well and feels very happy in the distant and unknown retreat she has selected for herself. She has been very ill, but is so no longer; for owing to the protection of the Lord Sang-gyas she has found devoted friends who take care of her physically and spiritually. Let the ladies of her house, therefore, remain calm. Before 18 new moons shall have risen—she will have returned to her family.f At the time the letter was received the following notation was made upon the envelope in Russian and signed by the recipient (in trans­<\/p>\n<h3 class=\"pdf-heading\">lation) :<\/h3>\n<p>Received at Odessa November 7, about Lelinka probably from Tibet—November 11, 1870. Nadyejda F.J Lelinka is the Russian 'pet name' of Yelena (the Russian form of Flelena). Furthermore, a memorandum concerning the receipt of the letter was sent to Col. Olcott by Nadyejda Fadeyev dated June 26,<\/p>\n<h3 class=\"pdf-heading\">1884, from Paris :<\/h3>\n<p>Two or three years ago I wrote to Mr. Sinnett in reply to one of his letters, and I remember telling him what happened to me about a letter which I received phenomenally, when my niece was on the other side of the world, and because of that nobody knew where she was—which made us deeply anxious. All our researches had ended in nothing. We were ready to believe her dead, when—I received a letter from Him Whom I believe you call 'Kouth Humi,' which was brought to me in the most in­ comprehensible and mysterious manner, in my house by a messenger of Asiatic appearance, who then disappeared before my very eyes. This letter, which begged me not to fear anything, and which announced that she was in safety—I have still, but at Odessa. Immediately upon my return I shall send it to you, and I shall be very pleased if it can be of any use to you.*<\/p>\n<p>f Published in Collected Writings, Vol. VI, p.275. tOp. cit., p.277 *0p. cit. VI, 274. Col. Olcott received both letters and placed them in the archives of The Theosophical Society, Adyar, India.<\/p>", "images": [], "label": "in translation :"}, {"pdf_page_index": 18, "pdf_page_number": 19, "html": "<p>MESSENGERS OF THE BROTHERHOOD<\/p>\n<p>EVIDENCE that emissaries from the occult Brotherhood had been sent to the western world prior to H. P. Blavatsky's coming is con­ tained in a letter from Mahatma K. H. to A. P. Sinnett, who placed a note on it saying that it was received at Umballa on the way to Simla on August 5, 1881. In the opening sentence of the passage quoted the Mahatma comments on a book by Eliphas Levi entitled High Magic, because Sinnett had mentioned this work in his letter to the<\/p>\n<h3 class=\"pdf-heading\">Mahatma :<\/h3>\n<p>No wonder you find it cloudy, for it was never meant for the uninitiated reader. Eliphas studied from the Rosicrucian MSS. (now reduced to three copies in Europe). These expound our eastern doctrines from the teachings of Rosencruez, who, upon his return from Asia dressed them up in a semi-Christian garb intended as a shield for his pupils, against clerical revenge. One must have the key to it and that key is a science per se. Rosencruez taught orally. Saint Germain recorded the good doctrines in figures and his only cyphered MS. remained with his staunch friend and patron the benevolent German Prince from whose house and in whose presence he made his last exit—Home.f In order to show the status that H. P. Blavatsky had attained in be­ coming the messenger of the great Brotherhood, some passages on the requirements which candidates must fulfil are apposite.<\/p>\n<p>When we take candidates for chelas, they take the vow of secrecy and silence respecting every order they may receive. One has to prove himself fit for chelaship, before he can find out whether he is fit for adepts hip. J<\/p>\n<p>Once we are upon the topic, I wish you would impress upon your London friends some wholesome truths that they are but too apt to forget, even, when they have been told of them over and over again. The Occult Science is not one in which secrets can be communicated of a sudden, by a written or even verbal communication. If so, all the 'Brothers' should have to do, would be to publish a Hand-book of the art which might be taught in schools as grammar is. It is the common mistake of people that we willingly wrap ourselves and our powers in mystery—that we<\/p>\n<p>!5 t The Mahatma Letters, Letter No. xlix, p.280, 1st ed.; p.276, 3rd ed. Eliphas<\/p>\n<p>Levi's book was first written in serial instalments in French and published in Paris in 1856 under the title Dogme et Ritue l de la haute ntagie. tOp. cit., Letter liii, p.295, 1st ed.; p.291, 3rd ed.<\/p>", "images": [], "label": "Mahatma :"}, {"pdf_page_index": 19, "pdf_page_number": 20, "html": "<p>wish to keep our knowledge to ourselves, and of our own will refuse—'wantonly and deliberately' to communicate it. The truth is that till the neophyte attains to the condition necessary for that degree of Illumination to which, and for which, he is entitled and fitted, most if not all of the Secrets are incommunic­ able. The receptivity must be equal to the desire to instruct. The illumination must come from within. Till then no hocus pocus of incantations, or mummery of appliances, no metaphysical lec­ tures or discussions, no self-imposed penance can give it. All these are but means to an end, and all we can do is direct the use of such means as have been empirically found by the experience of ages to conduce to the required object. And this was and has been no secret for thousands of years. Fasting, meditation, chas­ tity of thought, word, and deed; silence for certain periods of time to enable nature herself to speak to him who comes to her for information; government of the animal passions and im­ pulses ; utter unselfishness of intention, the use of certain incense and fumigations for physiological purposes, have been published as the means since the days of Plato and Iamblichus in the West, and since the far earlier times of our Indian Rishis. How these must be complied with to suit each individual temperament is of course a matter for his own experiment and the watchful care of his tutor or Guru.*<\/p>\n<p>Every human being contains within himself vast potentialities, and it is the duty of the adepts to surround the would-be chela with circumstances which shall enable him to take the 'right- hand path,'—if he have the ability in him. We are no more at liberty to withhold the chance from a postulant than we are to guide and direct him into the proper course. At best, we can only show him after his probation period was successfully term­ inated—that if he does this he will go right; if the other, wrong. But until he has passed that period, we leave him to fight out his battles as best he may; and have to do so occasionally with higher and initiated chelas such as H.P.B., once they are allowed to work in the world...It was not a meaningless phrase of the Tathagata that 'he who masters Self is greater than he who<\/p>\n<h3 class=\"pdf-heading\">conquers thousands in battle' : there is no such other difficult<\/h3>\n<p>struggle.f<\/p>\n<p>To show you how exact a science is occultism, let me tell you<\/p>\n<p>16<\/p>\n<p>*0p. cit., Letter xlix, pp.282-3, 1st ed.; pp.278-9, 3rd ed. f Op. cit., Letter liv, p.316, 1st ed.; p.311, 3rd ed.<\/p>", "images": [], "label": "conquers thousands in battle' : there is no such other difficult"}, {"pdf_page_index": 20, "pdf_page_number": 21, "html": "<p>that the means we avail ourselves of, are all laid down for us in a code as old as humanity to the minutest detail, but every one of us has to begin from the beginning, not from the end. Our laws are as immutable as those of Nature, and they were known<\/p>\n<p>to man and eternity before this strutting game cock, modern science, was hatched.. .we build our philosophy upon experiment and deduction. $<\/p>\n<p>H.P.B.'s LITERARY ACHIEVEMENTS<\/p>\n<p>UNQUESTIONABLY, the best way of evaluating the statement that H. P. Blavatsky acted as a light-bringer to the western world, is to study the message she gave by means of her writings. Theosophists are so accustomed to regard her two major works— Isis Unveiled and The Secret Doctrine —as source books for the teachings of the Ancient<\/p>\n<p>Wisdom—and rightfully so—that they are apt to by-pass her other writings. This should not be done. Her literary production amounts to ten other volumes bearing the title The Collected Writings of H. P. Blavatsky. These works are filled with a wealth of information on all sorts of subjects as well as occult lore. In fact there are close to one thousand articles in the series. Every page was hand-written in pen and ink, without secretarial assistance—and this was so also with Isis Unveiled and The Secret Doctrine —and this amazing achievement was performed in less than seventeen years !<\/p>\n<p>In order to give an exposition of the remarkable manner in which H.P.B. employed her talents, we propose to place her writings in seven categories, in order to call attention to the different processes she em­ ployed. Moreover, because this achievement could not have been performed by ordinary means in writing, one must conclude that she<\/p>\n<h3 class=\"pdf-heading\">employed Siddhis. Therefore, the question arises : How did she obtain<\/h3>\n<p>the knowledge and power to utilize these Siddhis ? The answer is<\/p>\n<h3 class=\"pdf-heading\">obvious. It is the reply she herself gave : she was born with the<\/h3>\n<p>ability to use certain powers unconsciously; then she was taught how to use the Siddhis consciously by her Teachers.<\/p>\n<p>Listing the Siddhis which would be utilized in connection with writing: (i) the ability to see clairvoyantly; (2) the ability to hear clairaudiently; (3) the ability to place oneself en rapport with persons having similar capabilities; (4) the power of receptivity; (5) the power<\/p>\n<p>U<\/p>\n<p>tOp. ext., Letter xxii, p.144, 1st ed.; pp.140-1, 3rd ed.<\/p>", "images": [], "label": "employed Siddhis. Therefore, the question arises : How did she obtain"}, {"pdf_page_index": 21, "pdf_page_number": 22, "html": "<p>of perceptivity; (6) the power of projectivity; (7) the power of using<\/p>\n<p>psychometry; (8) the power of using intuition; (9) the power of demonstrating precipitation. All of these were demonstrated by Mme. Blavatsky. Her writings are proof of this. We repeat, her literary works simply could not have been produced by ordinary means.<\/p>\n<p>For example, consider the phenomenal amount of works quoted in<\/p>\n<h3 class=\"pdf-heading\">Isis Unveiled : 1,339 different works ! Have we any idea of t he labour<\/h3>\n<p>that would be required for an ordinary writer to search through over a thousand books to find a particular passage ? Think what it would mean to buy all these books ! If the volumes were not purchased, one would have to go to a university library to find them—and some works would not even be there.<\/p>\n<p>In The Secret Doctrine, 1,147 works are quoted* and these two computations do not take into consideration how many times any one volume is quoted.<\/p>\n<p>Let us now consider the seven kinds of process involved in her writings. Each one will be considered separately, beginning with the<\/p>\n<h3 class=\"pdf-heading\">one in which Mme. Blavatsky displayed her talents as a writer :<\/h3>\n<p>1 Descriptive Writing 2 Writing by means of Instruction 3 Writing by Dictation 4 Writing by Directive Clairvoyance 5 Writing by Psychometry 6 Writing by means of Precipitation 7 Writing by means of a process analogous to Tulku.<\/p>\n<p>DESCRIPTIVE WRITING<\/p>\n<p>HERE IT IS possible to give no more than a selected passage from one of Mme. Blavatsky's stories. This extract is from the least known story, entitled Legend of the Night Flower, published posthumously as recently as 1966 in the revised Volume I of the Collected Writings of H. P. Blavatsky. j\"<\/p>\n<p>At the very beginning of the creation of the World, and long before the sin which became the downfall of Eve, a fresh green shrub spread its broad leaves on the banks of a rivulet. The sun, still young at that time and tired of its initial efforts, was setting slowly, and drawing his veils of mists around him, enveloped the<\/p>\n<p>18<\/p>\n<p>The count of the works listed is computed from the excellent compilation<\/p>\n<p>added to the Index forming the sixth volume of the latest 5th edition set of<\/p>\n<p>The Secret Doctrine, published by The Theosophical Publishing House, Adyar, India, 1962. tVol. I, pp. 7-9.<\/p>", "images": [], "label": "Isis Unveiled : 1,339 different works ! Have we any idea of t he labour"}, {"pdf_page_index": 22, "pdf_page_number": 23, "html": "<p>earth in deep and dark shadows. Then a modest flower blossomed forth upon a branch of the shrub. She had neither the fresh<\/p>\n<p>beauty of the rose, nor the superb and majestic pride of the beautiful lily. Humble and modest, she opened her petals and cast an anxious glance on the world of the great Buddha. All was cold and dark about her ! Her companions slept all around bent on their flexible stems; her comrades, daughters of the same shrub, turned away from her look; the moths, winged lovers of the flowers, rested but for a moment on her breast, but soon flew away to more beautiful ones. A large beetle almost cut her in two as it climbed without ceremony over her, in search for nocturnal quarters. And the poor flower, frightened by its isolation and its loneliness in the midst of this indifferent crowd, hung its head mournfully and shed a bitter dewdrop for a tear. But lo, a little star was kindled in the sombre sky. Its brilliant rays, quick and tender, pierced the waves of gloom. Suddenly the orphaned flower felt vivified and refreshed as by some beneficent dew. Fully restored, she lifted her face and saw the friendly star. She re­ ceived its rays into her breast, quivering with love and gratitude. They had brought about her rebirth into a new life.<\/p>\n<p>Dawn with its rosy smile gradually dispelled the darkness, and the star was submerged in an ocean of light which streamed forth from the star of day. Thousands of flowers hailed it their param­ our, bathing greedily in his golden rays. These he shed also on the little flower; the great star deigned to cover her too with its flam­ ing kisses. But full of the memory of the evening star, and of its silvery twinkling, the flower responded but coldly to the demon­ strations of the haughty sun. She still saw before her mind's eye the soft and affectionate glow of t he star; she still felt in her heart the beneficent dewdrop, and turning away from the blinding rays of the sun, she closed her petals and went to sleep nestled in the thick foliage of the parent-shrub. From that time on, day became night for the lowly flower, and night became day. As soon as the sun rises and engulfs heaven and earth in its golden rays, the flower becomes invisible; but hardly does the sun set, and the star, piercing a corner of the dark horizon, makes its appearance, than the flower hails it with joy, plays with its silvery rays, and absorbs with long breaths its mellow glow.<\/p>\n<p>Such is the heart of many a woman. The first gracious word,<\/p>\n<p>19<\/p>", "images": [], "label": "Page 23"}, {"pdf_page_index": 23, "pdf_page_number": 24, "html": "<p>the first affectionate caress, falling on her aching heart, takes root there deeply. Profoundly moved by a friendly word, she remains indifferent to the passionate demonstrations of the whole universe. The first may not differ from many others; it may be lost among thousands of other stars similar to that one, yet the heart of woman knows where to find him, near by or far away; she will follow with love and interest his humble course, and will send her blessings on his journey. She may greet the haughty sun, and admire its glory, but, loyal and grateful, her love will always belong to one lone star. Now a passage from The Secret Doctrine illustrating descriptive writ­ ing on an entirely different theme. It is a description of atoms, viewed from the standpoint of Occultism. It portrays what is visioned by one who has developed the Siddhi of spiritual clairvoyance, one who is a 'spiritual seer, whose inner Eye is opened, and who can see through the veil of m atter'.f<\/p>\n<p>Atoms are called 'Vibrations' in Occultism; also 'Sound'— collectively...The waves and undulations of Science are all pro­ duced by atoms propelling their molecules into activity from within. Atoms fill the immensity of Space, and by their con­ tinuous vibration are that MOTION which keeps the wheels of Life perpetually going. It is that inner work that produces the natural phenomena called the correlation of F orces. Only, at the origin of every such 'force,' there stands the conscious guiding noumenon thereof—Angel or God, Spirit or Demon—ruling powers, yet the same.<\/p>\n<p>As described by Seers—those who can see the motion of the interstellar shoals, and follow them in their evolution clairvoyant- ly—they are dazzling, like specks of virgin snow in radiant sun­ light. Their velocity is swifter than thought, quicker than any mortal physical eye could follow, and, as well as can be judged from the tremendous rapidity of their course, the motion is circular...Standing on an open plain, on a mountain summit especially, and gazing into the vast vault above and the spacial infinitudes around, the whole atmosphere seems ablaze with them, the air soaked through with these dazzling coruscations. At times, the intensity of their motion produces flashes like the Northern lights during the Aurora Borealis. The sight is so mar­ vellous, that, as the Seer gazes into this inner world, and feels<\/p>\n<p>20<\/p>\n<p>fO/&gt;. cit., I, 633-4, 1st ed.; II, 3S8-9, Adyar ed.; I, 694-5, 3rd ed.<\/p>", "images": [], "label": "Page 24"}, {"pdf_page_index": 24, "pdf_page_number": 25, "html": "<p>the scintillating points shoot past him, he is filled with awe at the thought of other, still greater mysteries, that lie beyond, and within, this radiant ocean...<\/p>\n<p>WRITING BY INSTRUCTION<\/p>\n<p>TO SHOW that H. P. Blavatsky acted in the capacity of a messenger in bringing the teachings of the Ancient Wisdom to the western world and that she was instructed to do so by means of her writings,<\/p>\n<h3 class=\"pdf-heading\">there is nothing better than her own words :<\/h3>\n<p>I wrote this last night 'by order,' but what the deuce it is to be I don't know. Perhaps it is for a newspaper article, perhaps for<\/p>\n<h3 class=\"pdf-heading\">a book, perhaps for nothing : anyhow, I did as I was ordered. J<\/h3>\n<p>The significance of this quotation is that it describes how the writing of Isis Unveiled began. This was a short time before the founding of The Theosophical Society. 'One day in the Summer of 1875, H.P.B. showed me some sheets of manuscript which she had written',* wrote Col. Olcott, when she made the'statement given above.<\/p>\n<p>Regarding the writing of The Secret Doctr ine, a sentence from one of her letters to A. P. Sinnett, after he had visited her at Ostend,<\/p>\n<h3 class=\"pdf-heading\">simply dated Sunday, reads : 'It is true that ever since you left, Master<\/h3>\n<p>has made me add some thing daily to the old MSS. SO th at much of it is new and much more that I do not understand myself.'f<\/p>\n<p>There was supervision of the manuscript of The Secret Doctrine as the writing progressed. A striking illustration was narrated by Coun­ tess Wachtmeister, who was Mme. Blavatsky's companion during the<\/p>\n<h3 class=\"pdf-heading\">preparation of that work :<\/h3>\n<p>When I walked into H.P.B.'s writing room, I found the floor strewn with sheets of discarded manuscript. I asked the meaning<\/p>\n<h3 class=\"pdf-heading\">of this scene of confusion, and she replied : 'Yes, I have tried<\/h3>\n<p>twelve times to write this one page correctly, and each time Master says it is wrong. I think I shall go mad, writing it so often; but leave me alone; I will not pause until I have con­ quered it, even if I have to go on all night.'<\/p>\n<p>I brought a cup of coffee to refresh and sustain her, and then left her to prosecute her weary task. An hour later I heard her voice calling me, and on entering found that, at last, the passage was completed to satisfaction.**<\/p>\n<p>21<\/p>\n<p>fOuoted in Old Diary Leaves, I, pp.202-3 by H. S. Olcott. *Ibid. •\\The Letters of H. P. Blavatsky to A. P. Sinnett, p.226 **Reminiscences, etc., pp.32-3, by Countess Wachtmeister.<\/p>", "images": [], "label": "there is nothing better than her own words :"}, {"pdf_page_index": 25, "pdf_page_number": 26, "html": "<p>The Countess also related that assignments were often given by means<\/p>\n<h3 class=\"pdf-heading\">of precipitated messages :<\/h3>\n<p>Another incident of frequent occurrence came under my notice from time to time, and marks another mode in which guidance and aid were given to H.P.B. in her work. Often, in the early morning, I would see on her writing-table a piece of paper with unfamiliar characters traced upon it in red ink. On asking her what was the meaning of these mysterious notes, she replied that they indicated her work for the day.*<\/p>\n<p>WRITING BY DICTATION<\/p>\n<p>IT MAY appear strange to have one of the classifications of Mme. Blavatsky's writings listed as Writing by Dictation. Nevertheless, it is used because of what she herself wrote in one of the last, if not the very last, article she penned. It is dated April 27, 1891, eleven days<\/p>\n<p>before she died—and is entitled \"My Books\". The work she refers to in the opening sentence is her earliest one, Isis Unveiled:<\/p>\n<p>Every word of information found in this work or in my later writings comes from the teachings of our Eastern Masters; and that many a passage in these works has been written by me under their dictation. In saying this no supernatural claim is urged, for no miracle is performed by such a dictation...Space and dis­ tance do not exist for thought; and if two persons are in perfect mutual psycho-magnetic rapport, and of these two, one is a great Adept in Occult Sciences, then thought-transference and dicta­ tion of whole pages become as easy and as comprehensible at the distance of ten thousand miles as the transference of two words across a room.f The explanation of the method used by the Mahatmas in thus 'dictat­ ing' to Mme. Blavatsky, was described in a letter to A. P. Sinnett, in response to one he had written hoping that he could have direct com­<\/p>\n<h3 class=\"pdf-heading\">munications with the Mahatma :<\/h3>\n<p>I must tell you now that for opening 'direct communication'<\/p>\n<h3 class=\"pdf-heading\">the only possible means would be : (1) For each of us to meet in<\/h3>\n<p>our own physical bodies. I being where I am, and you in your own quarters, there is a material impediment for me. (2) For both to meet in our astral form—which would necessitate your<\/p>\n<p>22<\/p>\n<p>* Reminiscences, etc.. p.38. t Lucifer, London, Vol. VIII, No. 43, May 15, 1881, pp.241-47<\/p>", "images": [], "label": "of precipitated messages :"}, {"pdf_page_index": 26, "pdf_page_number": 27, "html": "<p>'getting out' of yours, as well as my leaving my body. The spiritual<\/p>\n<p>impediment to this is on your part. (3) To make you hear my voice either within you or near you as 'the old lady' does. This<\/p>\n<h3 class=\"pdf-heading\">would be feasible in either of two ways : (a) My chiefs have but<\/h3>\n<p>to give me permission to set up the conditions—and this for the present they refuse; or (b) for you to hear my voice, i.e., my natural voice without any psycho-physiological tamasha being employed by me (again as we often do among ourselves). But<\/p>\n<p>then, to do this, not only have one's spiritual senses to be abnorm­ ally opened, but one must himself have mastered the great secret —yet undiscovered by science—of, so to say, abolishing all the impediments of space; of neutralising for the time being the natural obstacle of intermediary particles of air and forcing the waves to strike your ear in reflected sounds or echo. J One of the most important articles by Mme. Blavatsky was written from dictation. It was very long and was published in The Theo- sophist, the journal which she founded soon after inaugurating the work of The Theosophical Society in India. Col. Olcott was aware of<\/p>\n<h3 class=\"pdf-heading\">the significance of this article, because he refers to it in this manner :<\/h3>\n<p>On August 22, 1883 I joined Mme. Blavatsky at Ootacamund, the summer resort in the Nilgiri Hills. While there part of her work was the taking from dictation from her invisible teacher of the 'Replies to an English F.T.S.'...That she was taking down from dictation was fully apparent to one who was familiar with her ways.*<\/p>\n<h3 class=\"pdf-heading\">Here is a portion of one of these 'replies' :<\/h3>\n<p>The gradual development of man's seven principles and phy­ sical senses has to be coincident and on parallel lines with Rounds and Root-races. Our fifth race has so far developed but its five senses. Now, if the Kama or lOW-principIe of the 'Fourth- rounders' has already reached that stage of its evolution when the automatic acts, the unmotivated instincts and impulses of its childhood and youth, instead of following external stimuli, will have become acts of will framed constantly in conjunction with the mind {Manas), thus making of every man on earth of that race a free agent, a fully responsible being—the Kama of our hardly adult fifth race is only slowly approaching it. As to the sixth sense of this, our race, it has hardly sprouted above the soil of its materiality. It is highly unreasonable, therefore, to expect<\/p>\n<p>23 |The Mahatma Letters, Letter VIII, p.28. *Old Diary Leaves, II, 466.<\/p>", "images": [], "label": "would be feasible in either of two ways : (a) My chiefs have but"}, {"pdf_page_index": 27, "pdf_page_number": 28, "html": "<p>for the men of the fifth to sense the nature and essence of that which will be fully sensed and perceived but by the sixth—let alone the seventh race—i.e., to enjoy the legitimate outgrowth of the evolution and endowments of the future races with only the help of our present limited senses. The exceptions to this quasi universal rule have been hitherto found only in some rare cases of constitutional, abnormally precocious individual evolu­ tions; or, in such, where by early training and special methods, reaching the stage of the fifth rounders, some men in addition to the natural gift of the latter have fully developed (by certain occult methods) their sixth, and in still rarer cases their seventh, sense. As an instance of the former class may be cited the Seeress of Prevorst; a creature born out of time, a rare precocious growth, ill adapted to the uncongenial atmosphere that sur­ rounded her, hence a martyr ever ailing and sickly. As an example of t he other, the Count St. Germain may be mentioned. Apace with the anthropological and physiological development of man runs his spiritual evolution. To the latter, purely intel­ lectual growth is often more an impediment than a help.f<\/p>\n<p>WRITING BY DIRECTIVE CLAIRVOYANCE<\/p>\n<p>THE TERM Directive Clairvoyance is used to indicate a specific method Mme. Blavatsky employed, signifying a particular kind of clairvoyance. She explained that she had been taught how to use this faculty by her Teachers during the period she was undergoing training in Tibet. Before giving her explanation of how she used this<\/p>\n<h3 class=\"pdf-heading\">Siddhi, let us note the special capacity needed for it: The ability to<\/h3>\n<p>select a book on a specific theme. Then, although never having seen the<\/p>\n<p>volume before, from any page in the work, choose a selected, appro­ priate passage on a predetermined subject. Having selected a citation, the ability to copy it verbatim, and give its correct page. Continuing the process : in order to support this citation by quoting another author, an extract from a further book would be required—and it would be forthcoming in the same manner. In either case there would be no need to see the book itself, nor to handle it, nor to search through its pages. It would be a matter solely of visualizing the page from which the desired extract was to be copied.<\/p>\n<p>24<\/p>\n<p>f The Theosophist, Vol. IV, p.295, September 1883. Quoted in Collected<\/p>\n<p>Writings, V, 144-5.<\/p>", "images": [], "label": "Siddhi, let us note the special capacity needed for it: The ability to"}, {"pdf_page_index": 28, "pdf_page_number": 29, "html": "<p>Proficiency in this process would dispense with any need of ex­ traneous assistance, such as a special chair or particular paper. There would be no necessity for a list of books on the subject; no book, no reference to hunt up, no authority to consult; not even an encyclo­ paedia or an index. It hardly seems necessary to state that H. P. Blavatsky had no books on her desk; likewise she had no access to a<\/p>\n<h3 class=\"pdf-heading\">library. Here are her words on her method of procedure :<\/h3>\n<p>Well, you see, what I do is this. I make what I can only describe as a sort of vacuum in the air before me, and fix my sight and my will upon it, and soon scene after scene passes before me like the successive pictures of a diorama, or, if I need a reference or information from some book, I fix my mind intently, and the astral counterpart of- the book appears, and from it I take what I need. The more perfectly my mind is freed from distractio
