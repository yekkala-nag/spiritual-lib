ns and mortifications, the more energy and intentness it possesses, the more easily I can do this. J Countess Wachtmeister, who was Mme. Blavatsky's companion while The Secret Doctrine was being written, describes watching the author<\/p>\n<h3 class=\"pdf-heading\">at work :<\/h3>\n<p>I saw her write down sentences as if she were copying them<\/p>\n<h3 class=\"pdf-heading\">from something before her, where, however, I saw nothing. 1<\/h3>\n<p>did not pay much attention to the manner of her work from the standpoint of a hunter of phenomena, and did not control it for<\/p>\n<p>that purpose; but I know that I saw a good deal of the well- known blue K.H. handwriting as corrections and annotations on her manuscripts as well as in books that lay occasionally on her desk. And I noticed this principally in the morning before she had commenced to work.* There was another method which II.-P. Blavatsky was able to use. to which the term Directive Clairvoyance would be applicable, although her visioning this time would not be from books, it would be in the form of pictures, somewhat similar to that of a television screen. She also employed this process in writing her major works. She described<\/p>\n<h3 class=\"pdf-heading\">it in a letter from New York to her sister Vera :<\/h3>\n<p>Well, Vera, whether you believe me or not, something mirac­ ulous is happening to me. You cannot imagine in what a charmed world of pictures and visions I live. I am writing Isis; not writing, rather copying out and drawing that which She personally shows to me. Upon my word, sometimes it seems to<\/p>\n<p>25<\/p>\n<p>XReminiscences etc., by Countess Wachtmeister, p.33. *Op. cit., pp.112-3.<\/p>", "images": [], "label": "library. Here are her words on her method of procedure :"}, {"pdf_page_index": 29, "pdf_page_number": 30, "html": "<p>me that the ancient Goddess of Beauty in person leads me through all the countries of past centuries which I have to describe. I sit with my eyes open and to all appearances see and hear everything real and actual around me, and yet at the same time I see and hear that which I write. I feel short of breath; I am afraid to make the slightest movement for fear the spell might be broken. Slowly century after century, image after image, float out of the distance and pass before me as if in a magic panorama; and meanwhile I put them together in my mind, fitting in epochs and dates, and know for sure that there can be no mistake. Races and nations, countries and cities, which have for long disappeared<\/p>\n<p>in the darkness of the pre-historic past, emerge and then vanish, giving place to others; and then I am told the consecutive dates. Hoary antiquity makes way for historical periods; myths are ex­ plained to me with events and people who have really existed, and every event which is at all remarkable, every newly-turned<\/p>\n<p>page of this many coloured book of life, impresses itself on my brain with photographic exactitude. My own reckonings and calculations appear to me later on as separate coloured pieces of different shapes in the game which is called casse-tete (puzzles). I gather them together and try to match them one after the other and at the end there always comes out a geo­ metrical whole, f An example of the faculty of Directive Clairvoyance is shown on the opening pages of The Secret Doctrine : J<\/p>\n<p>An Archaic Manuscript—a collection of palm leaves made impermeable to water, fire and air, by some specific unknown<\/p>\n<p>process—is before the writer's eye. On the first page is an im­ maculate white disk within a dull black ground. On the following page, the same disk, but with a central point. The first, the student knows to represent Kosmos in Eternity, before the re­ awakening of still slumbering Energy, the emanation of the Word in later systems. The point in the hitherto immaculate Disk, Space and Eternity in Pralaya, denotes the dawn of differentia­<\/p>\n<p>tion. It is the Point in the Mundane Egg, the germ within the latter which will become the Universe, the ALL, the boundless, periodical Kosmos, this germ being latent and active, periodically and by turns. The one circle is divine Unity, from which all proceeds, whither all returns. Its circumference—a forcibly<\/p>\n<p>26<\/p>\n<p>t The Path, Vol. ix No. 10, pp.301-1, January, 1895. JVol. I, pp.1-2, 1st ed.; I, 69-70, Adyar ed.; I, 31-2, 3rd ed.<\/p>", "images": [], "label": "Page 30"}, {"pdf_page_index": 30, "pdf_page_number": 31, "html": "<p>limited symbol, in view of the limitation of the human mind— indicates the abstract, ever incognisable Presence, and its plane, the Universal Soul, although the two are one. Only the face of the Disk being white and the ground all around black, shows clearly that its plane is the only knowledge, dim and hazy though it still is, that is attainable by man. It is on this plane that the Manvantaric manifestations begin; for it is in this SOUL that slumbers, during the Pralaya, the Divine Thought, wherein lies concealed the plan of every future Cosmogony and Theo- gony.<\/p>\n<p>It is the ONE LIFE , eternal, invisible, yet Omnipresent, with­ out beginning or end, yet periodical in its regular manifestations, between which periods reigns the dark mystery of non-Being; unconscious, yet absolute Consciousness; unrealisable, yet the one self-existing reality; truly, 'a chaos to the sense, a Kosmos to the reason.' Its one absolute attribute, which is ITSELF , e ter­ nal, ceaseless Motion, is called in esoteric parlance the 'Great Breath,' which is the perpetual motion of the universe, in the sense of limitless, ever-present SPACE . That which is motionless cannot be Divine. But then there is nothing in fact and reality absolutely motionless within the universal soul.<\/p>\n<p>WRITING BY PSYCHOMETRY<\/p>\n<p>H. P. BLAVATSKY herself described the subject of writing by means<\/p>\n<h3 class=\"pdf-heading\">of psychometry in her first major work :<\/h3>\n<p>One of the most interesting discoveries of modern times is that of the faculty which enables a certain class of sensitive persons to receive from any object held in the hand or against the forehead impressions of the character or appearance of the individual, or any other object with which it has previously been in contact. Thus a manuscript, painting, article of clothing, or jewelry—no matter how ancient—conveys to the sensitive a vivid picture of the writer, painter, or wearer; even though he lived in the days of Ptolemy or Enoch. Nay, more; a fragment of an ancient building will recall its history and even the scenes which transpired within or about it. A bit of ore will carry the soul-vision back to the time when it was in process of formation. This faculty is called...psychometry.*<\/p>\n<p>27<\/p>\n<p>*Isis Unveiled, I, 182.<\/p>", "images": [], "label": "of psychometry in her first major work :"}, {"pdf_page_index": 31, "pdf_page_number": 32, "html": "<p>The psychometer, by applying the fragment of a substance to his forehead, brings his inner-self into relations with the inner soul of the object he handles. It is now admitted that the univer­ sal aether pervades all things in nature, even the most solid.<\/p>\n<p>It is beginning to be admitted, also, that this preserves the images of all things which transpire. When the psychometer ex­ amines his specimen, he is brought in contact with the current of the astral light, connected with that specimen, and which retains pictures of the events associated with its history. These, accord­ ing to Denton, pass before his vision with the swiftness of light; scene after scene crowding upon each other so rapidly, that it is only by the supreme exercise of the will that he is able to hold any one in the field of vision long enough to describe it.<\/p>\n<p>The psychometer is clairvoyant; that is, he sees with the inner eye. Unless his will-power is very strong, unless he has thoroughly trained himself to that particular phenomenon, and his know­ ledge of the capabilities of his sight are profound, his perceptions of places, persons, and events, must necessarily be very confused.* In an article on. Psychometry, Mme. Blavatsky explains the difference<\/p>\n<h3 class=\"pdf-heading\">between the use of that faculty and Clairvoyance :<\/h3>\n<p>Psychometry embodies even more potentialities for instructing and elevating average humanity than Clairvoyance. While the latter faculty is most rare, and more rarely still to be found, un­ less accompanied by a tendency in the clairvoyant to self-decep­<\/p>\n<p>tion and the misleading of others, by reason of imperfect control over the Imagination, the psychometer sees the secrets of the Akasa by the 'Eye of Siva,' while corporeally awake and in full possession of his bodily senses. A perfectly independent clairvoy­ ant one may meet with once or twice in a lifetime, but psycho- meters abound in every circle of society, nay, may be found in almost every house, f<\/p>\n<h3 class=\"pdf-heading\">The significance of the Eye of Siva is apt to be overlooked : it is a<\/h3>\n<p>mystical way of describing the functioning of the pineal gland. It is also referred to as the Eye of Dangma.<\/p>\n<p>Mme. Blavatsky also explained why the psychometer is able to describe a person who has had contact with an object; first clarifying<\/p>\n<h3 class=\"pdf-heading\">the difference between life-atoms and sleeping atoms :<\/h3>\n<p>We regard and call in our occult phraseology those atoms that are moved by Kinetic energy as 'life-atoms,' while those that are<\/p>\n<p>28<\/p>\n<p>*Isis Unveiled, I, 183-4. t Collected Writings, VI, 181-2; from The Thcosophist, V, 147-8.<\/p>", "images": [], "label": "between the use of that faculty and Clairvoyance :"}, {"pdf_page_index": 32, "pdf_page_number": 33, "html": "<p>for the time being passive, containing but invisible potential energy, we call 'sleeping atoms,' regarding at the same time these two forms of energy as produced by the one and same force, or life.J<\/p>\n<p>Heat is produced whenever visible energy is transformed into molecular energy we are told, and it may be thrown out by any material composed of sleeping atoms or inorganic matter as it is<\/p>\n<h3 class=\"pdf-heading\">called : whereas the magnetic fluid projected 'by a living human<\/h3>\n<p>body is life itself. 'Indeed it is life atoms' that a man in a blind passion throws off, unconsciously, and though he does it quite as effectively as a mesmeriser who transfers them from himself to any object consciously and under the guidance of his will. Let any man give way to any intense feeling, such as anger, grief, etc., under or near a tree, or in direct contact with a stone; and many thousands of years after that any tolerable Psychometer will see the man and sense his feelings from one single fragment of that tree or stone that he had touched. Hold any object in your hand, and it will become impregnated with your life-atoms, indrawn and outdrawn, changed and transferred in us at every instant of our lives. Animal heat is but so many life atoms in molecular motion. It requires no adept knowledge, but simply the natural gift of a good clairvoyant subject to see them passing to and fro, from man to objects and vice versa like a bluish lambent flame.*<\/p>\n<p>WRITING BY PRECIPITATION<\/p>\n<p>PRECIPITATION in connection with writing generally signifies the materialization of a message on paper (or other substance). By ex­ tension of meaning it also has come to have the added significance of the delivery of the message, although the latter is actually a distinct process from the former.<\/p>\n<p>As an introduction to this type of writing, a comment made by Mme. Blavatsky in one of her letters to A. P. Sinnett, dated Adyar,<\/p>\n<h3 class=\"pdf-heading\">March 17, 1885, is worthy of note :<\/h3>\n<p>I have never, before beginning the service for you and Mr. Hume, transmitted and received letters to, and from Masters, except for myself. If you had any idea of the difficulties, or the<\/p>\n<p>29<\/p>\n<p>tOp. cit., V, 113; The Theosophist, IV, 286-8. *0p. cit., V, 115-6; from The Theosophist, IV, 288.<\/p>", "images": [], "label": "called : whereas the magnetic fluid projected 'by a living human"}, {"pdf_page_index": 33, "pdf_page_number": 34, "html": "<p>modus operandi you would not have consented to be in my place. And yet I never refused.f Writing on precipitation, she gave an explanation of the method used, with specific reference to the Mahatma letters received by Sinnett and Hume. Nevertheless, this also clarifies the process Mme. Blavatsky would have been called upon to employ for precipitations she herself performed.<\/p>\n<p>Those having even a superficial knowledge of the science of mesmerism know how the thoughts of the mesmeriser, though silently formulated in his mind are instantly transferred to that of the subject. It is not necessary for the operator, if he is sufficiently powerful, to be present near the subject to produce the above result. Some celebrated practitioners in this Science are known to have been able to put their subjects to sleep even from a dis­ tance of s everal days' journey. This known fact will serve us as a guide in comprehending the comparatively unknown subject now under discussion. The work of writing the letters in question is carried on by a sort of psychological telegraphy; the Mahatmas very rarely write their letters in the ordinary way. An electro­ magnetic connection, so to say, exists on the psychological plane between a Mahatma and his chelas, one of whom acts as his amanuensis. When the Master wants a letter to be written in this way, he draws the attention of the chela, whom he selects for the task, by causing an astral bell (heard by so many of our Fellows and others) to be rung near him just as the despatching telegraph office signals to the receiving office before wiring the message. The thoughts arising in the mind of the Mahatma are then clothed in word, pronounced mentally, and forced along the astral currents he sends towards the pupil to impinge on the brain of the latter. Thence they are borne by the nerve-currents to the<\/p>\n<p>palms of his hands and the tips of his finger, which rest on a piece of magnetically prepared paper. As the thought-waves are thus impressed on the tissue, materials are drawn to it from the ocean of akasa (permeating every atom of t he sensuous universe), by an occult process, out of place here to describe, and per­ manent marks are left.<\/p>\n<p>From this it is abundantly clear that the success of such writing as above described depends chiefly upon these things: (i) The force and the clearness with which the thoughts are propelled,<\/p>\n<p>3« \\Thc Mahatma Letters p.470, 1st ed.; pp.462-3, 3rd ed.<\/p>", "images": [], "label": "Page 34"}, {"pdf_page_index": 34, "pdf_page_number": 35, "html": "<p>and (2) the freedom of the receiving brain from disturbance of every description. J Further information is provided in an interview Charles Johnston once had with Mme. Blavatsky, although the report of the occurrence was not published until after her death. Of special interest is the ex­ planation given of how a Mahatma is able to produce the precipita­ tion in English even though knowing nothing of that language. H. P. Blavatsky opened her explanation with a question she herself pro­ ceeded to answer:<\/p>\n<p>Have you ever made experiments in thought-transference ? If you have, you must have noticed that the person who receives the mental picture very often colours it, or even changes it slight­ ly, with his own thought, and this where perfectly genuine transference of thought takes place. Well, it is something like that with the precipitated letters. One of our Masters, who perhaps does not know English, and of course has no English hand­ writing, wishes to precipitate a letter in answer to a question sent mentally to him. Let us say he is in Tibet, while I am in Madras or London. He has the answering thought in his mind, but not in English words. He has first to impress that thought on my brain, or on the brain of someone else who knows English, and then to take the word-forms that rise up in that other brain to answer the thought. Then he must form a clear mind-picture of the words in writing, also drawing on my brain, or the brain of whoever it is, for the shapes. Then either through me or some Chela with whom he is magnetically connected, he has to pre­ cipitate these word-shapes on paper, first sending the shapes into the Chela's mind, and then driving them into the paper, using the magnetic force of the Chela to do the printing, and collecting the material, black or blue or red, as the case may be, from the astral light. As all things dissolve into the astral light, the will of the magician can draw them forth again. So he can draw forth colours of pigments to mark the figure in the letter, using the magnetic force of the Chela to stamp them in, and guiding the whole by his own much greater magnetic force, a current of powerful will.* With regard to the synchronization of the two minds—the Mahatma's<\/p>\n<h3 class=\"pdf-heading\">and the chela's—a sloka from the Yogasutras may be quoted :<\/h3>\n<p>The nature of the mind of another person becomes known to<\/p>\n<p>31<\/p>\n<p>XCollected Writings, VI. pp.119-20; from The Theosophist, V, 64. *Collected Writings, VIII, 397-8; from The Thensophical Forum, New York,<\/p>", "images": [], "label": "and the chela's—a sloka from the Yogasutras may be quoted :"}, {"pdf_page_index": 35, "pdf_page_number": 36, "html": "<p>the ascetic when he concentrates his own mind upon that other person.f Mme. Blavatsky gave an explanation of a different type of precipita­ tion, which illustrates the use of another method :<\/p>\n<p>I have often seen M. sit with a book of most elaborate Chinese characters that he wanted to copy, and a blank book before him and he would put a pinch of black lead dust before him and then<\/p>\n<p>rub it in slightly on the page; and then over it precipitate ink; and then, if the image of the characters was all right and correct in his mind the characters copied would be all right.{<\/p>\n<p>WRITING BY A PROCESS ANALOGOUS TO TULKU<\/p>\n<p>THE LAST of the seven methods of writing chosen for consideration could be termed Writing by means of a process analogous to Tulku.* This description endeavours to express the significance of the idea suggested by the word Tulku, for there is no single English word equivalent to the Tibetan one. To some extent it explains the state or condition in which Mme. Blavatsky functioned from time to time. She referred to this state in a rather vague manner, leaving it to one's intuition to determine what was meant. For instance here is a passage from one of her letters to A. P. Sinnett:<\/p>\n<p>I too was made a reflection several times and during months; but I never abused of it, to try and palm off my personal schemes on those who mistook H.P.B. of Russia, for the high Initiate of xxx whose telephone she was at times. And this why the MASTERS have never withdrawn Their confidence from me, if all others (saving a very few) have.** In similar vein she wrote this significant statement in her own copy of her book The Voice of the Silence : 'H.P.B. to H. P. Blavatsky with no kind regards.'<\/p>\n<h3 class=\"pdf-heading\">Here is another citation, selected from one of her articles :<\/h3>\n<p>I once slept for eleven weeks, believing myself to be awake the whole time and walking around like a ghost of Pontoise, without being able to understand why no one appeared to see me and to answer me. I was entirely unaware that I was liberated from my old carcase which, at that time, however, was a little younger. That was at the beginning of my studies.!*<\/p>\n<p>32<\/p>\n<p>\\Yoga Aphorisms of Patanjali (W. Q. Judge's recension Book III, sloka 19). tThe Letters of H. P. Blavatsky to A. P. Sinnett, p.32. *For a full explanation of the meaning of the Tibetan word Tulku and its significance in connection with H.P.B., the reader is referred to the author's book entitled H. P. Blavatsky, Tibet and Tulku. **Op. cit., p.174 (Letter No. Ixxii). \\*The Complete Works of H. P. Blavatsky, II, 46.<\/p>", "images": [], "label": "Here is another citation, selected from one of her articles :"}, {"pdf_page_index": 36, "pdf_page_number": 37, "html": "<p>Then there is this passage, which occurs in a letter to her sister Vera;<\/p>\n<h3 class=\"pdf-heading\">consequently no technical terms are used :<\/h3>\n<p>Several times a day I feel that besides me there is someone else, quite separable from me, present in my body. I never lose the consciousness of my own personality; what I feel is as if I were keeping silent and the other one—the lodger who is in me—were speaking with my tongue...<\/p>\n<p>Do not be afraid that I am off my head. All that I can say<\/p>\n<h3 class=\"pdf-heading\">is that someone positively inspires me... more than this : someone<\/h3>\n<h3 class=\"pdf-heading\">enters me. It is not I who talk and write : it is something within<\/h3>\n<p>me, my higher and luminous Self, that thinks and writes for me.* Col. Olcott was aware of this change that would occur to H. P. Blavatsky when she was engaged in the writing of I sis Unveiled, for<\/p>\n<h3 class=\"pdf-heading\">he narrates :<\/h3>\n<p>...the H.P.B. manuscripts varied at times, and that there were several variants of the one prevailing script; also that each change in the writing was accompanied by a marked alteration in the manner, motions, expression, and literary capacity of H.P.B.f<\/p>\n<p>THE WORKS OF H. P. BLAVATSKY<\/p>\n<p>ALTHOUGH the list of books published during the lifetime of Mme. Blavatsky may not be large, their content is unparalleled in the literary field, for her volumes give access to the secret lore of the Orient— where the Ancient Wisdom has been preserved by its Custodians. However, the articles written by her in pen and ink for periodicals amount to about a thousand. When these are gathered together and printed in book form—as has been done posthumously—they com­ prise more than eleven volumes.<\/p>\n<p>The first work to be published, in 1877, was lsis Unveiled, a work of two volumes, sub-titled 'a master-key to the mysteries of ancient and modern science and theology'. Although this was her first pub­ lished work, it was preceded by many articles written for journals in the United States. These have been gathered and published posthum­ ously in the first volume of the Collected Writings.<\/p>\n<h3 class=\"pdf-heading\">The second, in order of publication, in 1883 : Iz pescher i debrey<\/h3>\n<p>Indostana, (From the Caves and Jungles of Hindostan), subtitled<\/p>\n<p>33<\/p>\n<p>•'Letters from H. P. Blavatsky to Mme. Vera de Zhelihovsky,' published in The Path , Dec. 1894, Vol. IX, pp.269-70. f Old Diary Leaves, I, 243.<\/p>", "images": [], "label": "consequently no technical terms are used :"}, {"pdf_page_index": 37, "pdf_page_number": 38, "html": "<p>Pisma na rodinu (Letters to the Father-land) written for Russian periodicals.<\/p>\n<p>The next book, published in 1885, was entitled Five Years of<\/p>\n<h3 class=\"pdf-heading\">Theosophy : Mystical, Philosophical, Theosophical, Historical and<\/h3>\n<p>Scientific Essays, selected from The Theosophist, the periodical of<\/p>\n<p>which H. P. Blavatsky was the editor. Most of the articles in the work were written by her, although other authors were included in the selection made from the magazine.<\/p>\n<p>In 1888 The Secret Doctrine was published, sub-titled 'The Syn­ thesis of Science, Religion, and Philosophy.' Volume I—Cosmo- genesis; Volume II—Anthropogenesis. A third volume was added<\/p>\n<p>posthumously containing essays by H. P. Blavatsky not incorporated in the original two-volume printing.<\/p>\n<p>In 1889 The Key to Theosophy appeared, 'being a clear exposition, in the form of question and answer, of the ethics, science, and<\/p>\n<p>philosophy, for the study of which The Theosophical Society has been founded.' A second edition soon followed, which was amplified by the addition of a glossary.<\/p>\n<p>Also in 1889 The Voice of the Silence, 'being chosen Fragments from the Book of the Golden Precepts, for the daily use of Lanoos (Disciples)'.<\/p>\n<p>This was'followed in 1890 by Gems from the East, a birthday book of precepts and axioms.<\/p>\n<h3 class=\"pdf-heading\">Transactions of the Blavatsky Lodge, in two parts : the first in 1890,<\/h3>\n<p>the second in 1891; consisting of replies given by H.P.B. to questions asked upon the Stanzas of Dzyan during the sessions of the Lodge. Of especial significance for students of The Secret Doctrine.<\/p>\n<p>POSTHUMOUS WORKS<\/p>\n<p>THE FIRST posthumous work to appear was a collection of seven occult stories published in 1892 under the title of Nightmare Tales, although the stories had already appeared in various periodicals dur­ ing her lifetime.<\/p>\n<p>In the same year The Theosophical Glossary was published, al­ though Mme. Blavatsky did not have the opportunity of checking and correcting it.<\/p>\n<p>Also in 1892, From the Caves and Jungles of Hindostan, translated from the Russian by Mrs. Charles Johnston (although it was not a complete version of the original volume). This was followed by two books consisting of articles originally printed in Russian journals, en­<\/p>\n<p>34<\/p>", "images": [], "label": "Theosophy : Mystical, Philosophical, Theosophical, Historical and"}, {"pdf_page_index": 38, "pdf_page_number": 39, "html": "<p>titled Zagadochniya plemena na Golubih Gorah (The Enigmatical Tribes on the Azure-Blue Hills) published in 1893; and Durbar v<\/p>\n<p>Lahore (The Durbar in Lahore).<\/p>\n<p>A Modern Panarion, published in 1895, was the name given to a collection of articles written for periodicals before the publication of<\/p>\n<p>Isis Unveiled. This work contains many of the articles appearing in Volume I of the Collected Writings series.<\/p>\n<p>In 1925 The Letters of H. P. Blavatsky to A. P. Sinnett and other miscellaneous Letters were published under the supervision of A. T. Barker, intended as a companion volume to The Mahatma Letters to A. P. Sinnett.<\/p>\n<p>Another volume of Letters was brought forth between 1925 and 1935 by E. R. Corson under the title Some Unpublished Letters of Helena Petrovna Blavatsky. These letters were written to Dr. Corson's father and mother between February 9, 1875 and March 12, 1876.<\/p>\n<p>By far the most important posthumous publications are the H. P. Blavatsky Collected Writings series, for her literary labours were so prolific that it has taken many years to gather them and prepare the articles for publication. This work is principally due to the efforts of her grand-nephew, Boris de Zirkoff.The series begins with a collection of articles written during the years 1874-78. This formed the first of a uniform set of Volumes published under the title of The Complete Works of H. P. Blavatsky. This first volume appeared in 1933 and was<\/p>\n<h3 class=\"pdf-heading\">followed by three more : Volume II for articles from The Theosophist<\/h3>\n<p>during 1879-80; Volume III comprising articles in 1881-82; Volume IV containing articles from 1882-83 (published during 1933-36). Long out of print, these four volumes have now been reissued as part of the H. P. Blavatsky Collected Writings —in conformity with Volumes V—X. Volume V contains articles written during 1883 (published 1950); Volume VI, articles of 1883-85 (published 1954); Volume VII, articles of 1886-87 (published 1958); Volume VIII, articles princip­ ally from Lucifer written during 1887 (published 1960); Volume IX, articles of 1888 (published 1962); Volume X, articles of 1888-89 (pub­ lished 1964). Articles yet to appear in the series are those written in 1890 and 1891 for Lucifer —some of which were published posthum­ ously. Forthcoming volumes will also reproduce translations of her writings in Russian.<\/p>\n<p>35<\/p>", "images": [], "label": "followed by three more : Volume II for articles from The Theosophist"}, {"pdf_page_index": 39, "pdf_page_number": 40, "html": "<p>H. P. BLAVATSKY—THE ARTIST<\/p>\n<p>THE LITERARY achievements of H. P. Blavatsky undoubtedly provide the testimonial that she acted as the light-bringer of the Ancient Wisdom to the western world. This achievement naturally obscured her other talents which are deserving of more recognition.<\/p>\n<p>It is fitting that her artistic abilities should be described. Thus the word artist, which has a dual significance, may well be applied to her. Although she did not work with a brush and palette and do oil paint­ ings, nevertheless her pen and ink sketches were truly artistic creations and her cartoons clever and humorous. In addition, she worked in a distinctive field, because she could produce a picture without pen or pencil or brush by precipitation, by kriyasakti (literally by will-power alone). The best way of describing her ability in this field is to quote Col. Olcott's account of how she made a unique portrait. No pencil or crayon work would be able to duplicate it; nor could an artist with a brush.<\/p>\n<p>At the close of dinner we [W. Q. Judge, L. M. Marquette, M.D. and H. S. Olcott] had drifted into talk about precipitations, and Judge asked H.P.B. if she would not make somebody's portrait for us. As we were moving towards the writing-room, she asked him whose portrait he wished made, and he chose that of this particular yogi, whom we knew by name as one held in great respect by the Masters. She crossed to my table, took a sheet of my crested club-paper, tore it in halves, kept the half<\/p>\n<p>which had no imprint, and laid it down on her own blotting- paper. She then scraped perhaps a grain of the plumbago of a Faber lead-pencil on it, and then rubbed the surface for a minute or so with a circular motion of the palm of her right hand; after which she handed us the result. On the paper had come the desired portrait and, setting wholly aside the question of its phenomenal character, it is an artistic production of power and genius...The yogi is depicted in Samadhi, the head drawn partly aside, the eyes profoundly introspective and dead to external things, the body seemingly that of an absent tenant. There is a beard and hair of moderate length, the latter drawn with such skill that one sees through the upstanding locks, as it were—an<\/p>\n<p>3 6<\/p>", "images": [], "label": "Page 40"}, {"pdf_page_index": 40, "pdf_page_number": 41, "html": "<p class=\"empty-note\"><em>This page is a plate or blank page in the original — shown as a facsimile image below.<\/em><\/p>", "images": [{"file": "page_040_render.jpg", "caption": "Page 41 as printed in the original"}], "label": "Facsimile Plate"}, {"pdf_page_index": 41, "pdf_page_number": 42, "html": "<p>effect obtained in good photographs, but hard to imitate with pencil or crayon. The portrait is in a medium not easy to dis­<\/p>\n<h3 class=\"pdf-heading\">tinguish : it might be black crayon, without stumping, or black<\/h3>\n<p>lead; but there is neither dust nor gloss on the surface to indicate<\/p>\n<h3 class=\"pdf-heading\">which, nor any marks of the stump or the point used : hold the<\/h3>\n<p>paper horizontally towards the light and you might fancy the pigment was below the surface, combined with the fibres.* A well-known American artist of t hat epoch provided this testimonial regarding the portrait: it is 'unique, distinctly an \"individual\" in the technical sense; one that no living artist within his knowledge could have produced.'! The yogi's name is Tiruvalluvar. Mahatma K. H. wrote to Sinnett in regard to this phenomenal portraiture by Mme. Blavatsky:<\/p>\n<p>She can and did produce phenomena, owing to her natural powers combined with several long years of regular training, and her phenomena are sometimes better, more wonderful and far more perfect than those of some high, initiated chelas, whom she surpasses in artistic taste and purely Western appreciation of art<\/p>\n<h3 class=\"pdf-heading\">—as for instance in the instantaneous production of pictures :<\/h3>\n<p>witness her portrait of the 'fakir.'t Another striking example of her artistry is H.P.B.'s portrayal by means of a pen and ink sketch of tw o opera singers, drawn on page 24 of her Sketchbook. It depicts not only their roles in the opera in which<\/p>\n<p>they performed—that of Gounod's Faust —but also graphically tells who they are, namely Teresina Signora Mitrovich and her husband Agardi Mitrovich, and where they were performing, in Tiflis on April 7, 1862. Signora Mitrovich is portrayed as Marguerite, absorbed in prayer before a crucifix, while there is no doubt as to the personifi­ cation of the individual who is glancing with evil eyes over Margue­ rite's shoulder—Mephistopheles.<\/p>\n<h3 class=\"pdf-heading\">Mention was made of the use of the word artist in a dual sense :<\/h3>\n<p>the first usage has been applied to one who is proficient in portraiture. The second use of the term is often applied to a polished musician.<\/p>\n<p>In this sense it is also applicable to H.P.B., for she was a gifted pianist.<\/p>\n<h3 class=\"pdf-heading\">Dr Corson in his book about Mme. Blavatsky writes :<\/h3>\n<p>My mother described to me how H.P.B. would sit down at the piano and improvise with great skill, showing a remarkable<\/p>\n<p>38<\/p>\n<p>*Old Diary Leaves, Vol. I, pp.367-8. !Le Clear, quoted in O.D.L., I, 368.<\/p>\n<p>%The Mahatma Letters , p.312 1st ed.; pp.307-8, 3rd ed.<\/p>", "images": [], "label": "tinguish : it might be black crayon, without stumping, or black"}, {"pdf_page_index": 42, "pdf_page_number": 43, "html": "<p>efficiency for one who played but at odd times as the spirit might move her. Her biographers have not dwelt at any length on her musical talent. Her cousin, Count Witte, in his Memoirs, refers to this musical talent at some length.*<\/p>\n<h3 class=\"pdf-heading\">Col. Olcott enthused over H.P.B.'s playing :<\/h3>\n<p>She was a splendid pianist, playing with a touch and expression that were simply superb. Her hands were models—ideal and actual—for a sculptor and never seen to such advantage as when flying over the keyboard to find its magical melodies. She was a pupil of Moscheles, and when in London as a young girl [lady], with her father, played at a charity concert with Madame Clara Schumann and Madame Arabella Goddard in a piece of Schu­<\/p>\n<p>mann's for three pianos. Some weeks after the above was published I learned from a member of her family that shortly before coming to America, H.P.B. had made some concert tours in Italy and Russia under the pseudonym of 'Madame Laura.'<\/p>\n<p>During the time of our relationship she played scarcely at all. Once a cottage piano was bought and she played on it for a few weeks, but then it remained closed ever after until sold, and served as a double book-shelf. There were times when...she would sit in the dusk sometimes, with nobody else in the room beside myself and strike from the sweet-toned instrument im­ provisations that might well make one fancy he was listening to the Gandharvas, or heavenly choristers. It was the harmony of heaven.|<\/p>\n<h3 class=\"pdf-heading\">William Kingsland provided this reminiscence :<\/h3>\n<p>I well remember on one occasion, on a visit by her to my house in London in 1889, she sat down at the piano and played Schubert's Erl-Konig, to my great surprise and delight, as I had never even heard that she had even been a pianist.f Her sister Vera, speaks of 'her musical talents and of the fact that she was a member of the Philharmonic Society in London.'**<\/p>\n<p>CONCERNING H. P. BLAVATSKY'S FINANCIAL STATUS<\/p>\n<p>NOT a word is said about Mme.Blavatsky receiving remuneration for her musical performances. From her literary work she did not derive such income as one might expect. Even with her two major works,<\/p>\n<p>39<\/p>\n<p>*Some Unpublished Letters of H. P. Blavatsky, p.33. XOld Diary Leaves, Vol. I, pp.458-9. t The Real H. P. Blavatsky, by William Kingsland, p.38. **Incidents in the Life of Madame Blavatsky, by A. P. Sinnett, p.SI<\/p>", "images": [], "label": "Col. Olcott enthused over H.P.B.'s playing :"}, {"pdf_page_index": 43, "pdf_page_number": 44, "html": "<p>Isis Unveiled and The Secret Doctrine, a great deal of the cost of publishing was borne by H.P.B. herself because of her fondness for making changes on proof-sheets. Dr. Keightley, who assisted her in<\/p>\n<h3 class=\"pdf-heading\">preparing and publishing The Secret Doctrine wrote :<\/h3>\n<p>It went through three or four other hands besides H.P.B.'s in galley proof, as well as in revise. She was her own most severe corrector, and was liable to treat revise as MSS , with alarming results in the correction item in the bill.J Col. Olcott had the same to say about the changes made on the proofs of Isis Unveiled. However, even before the publication of her first book, Mme. Blavatsky's finances had sustained a heavy loss, because of the help she had given to the editor of the Spiritual Scientist, a<\/p>\n<h3 class=\"pdf-heading\">Boston journal. H.P.B. had this comment to make : 'Between Col.<\/h3>\n<p>Olcott and myself, H.P.B., we have spent over a iooo dollars given him to pay his debts and support his paper.*<\/p>\n<p>The meagreness of PI.P.B.'s financial status is attested in a docu­ ment written by Countess Wachtmeister. While living with Mme. Blavatsky at Ostend, Belgium, the Countess had called a lawyer, and when he was prepared to draw up the will, H.P.B. stated that she wished to leave everything to Constance Wachtmeister. The Countess<\/p>\n<h3 class=\"pdf-heading\">continues the narration :<\/h3>\n<p>The lawyer now expostulated. Had she no relations; would it not be right to leave her property to them ? And then he looked askance at me, as if he thought that I might have been unduly in­ fluencing H.P.B. to leave her money to me to the detriment of her<\/p>\n<p>relatives. H.P.B. flew out at him, and asked him what business it was of his; she should leave her money, she declared, to whom she chose. Madame Gebhard, fearful of a scene, interposed and said<\/p>\n<h3 class=\"pdf-heading\">gently to the lawyer : 'Perhaps, when you know the amount<\/h3>\n<p>which Madame Blavatsky has to will away, you will have no further objections to making the will as she desires; for had Madame Blavatsky died there would not have been sufficient money to pay for her funeral expenses.'<\/p>\n<p>The lawyer could not restrain an expression of surprise, but set to work without further comment. In a few minutes the will was made and signed by those present.f Countess Wachtmeister also relates that H.P.B. had received an offer<\/p>\n<p>from a Russian journal which would have enabled her to recoup her dwindling finances. However, Mme. Blavatsky declined to take ad­<\/p>\n<h3 class=\"pdf-heading\">vantage of it, as narrated by the Countess :<\/h3>\n<p>40<\/p>\n<p>^Reminiscences of H. P. Blavatsky etc., p.100. *Collected Writings; Vol. I, p.95. f Reminiscences etc., p.77<\/p>", "images": [], "label": "preparing and publishing The Secret Doctrine wrote :"}, {"pdf_page_index": 44, "pdf_page_number": 45, "html": "<p>One day a temptation came to her in the form of a large yearly salary if she would write for the Russian papers. She might write, she was told, on occultism or any other subject which pleased her, if she would only contribute to their columns. Here was a promise of comfort and ease for the remainder of her life. Two hours' labour every day would be ample to satisfy all de­ mands made on her time; but then no Secret Doctrine would be written. I spoke of a compromise, and asked her if it would not be possible for her to accept this engagement, and, at the same time, continue her Theosophical work. 'No—a thousand<\/p>\n<p>times no!' she answered. 'To write such a work as The Secret Doctrine I must have all my thoughts turned in the direction of that current. It is difficult enough even now, hampered as I am with this sick and worn-out old body, to get all I want, how much more difficult, then, if I am to be continually changing the currents into other directions. I have no longer the vitality or the. energy left in me. Too much of it was exhausted at the time when I produced my phenomena.! However, there was another reason why H.P.B. was often without funds. She explained it to the Countess when the latter inquired con­ cerning the task which Mme. Blavatsky had undertaken, namely to<\/p>\n<h3 class=\"pdf-heading\">bring the knowledge of the Ancient Wisdom to the western world :<\/h3>\n<p>In occultism, a most solemn vow has to be taken never to use any powers acquired or conferred for the benefit of one's own personal self, for to do so would be to set foot on the steep and treacherous slope that ends in the abyss of Black Magic. I have taken that vow, and I am not one to break a pledge the sanctity of which cannot be brought within the comprehension of the<\/p>\n<p>profane. I would rather suffer any tortures than be untrue to my pledge. As for securing more favourable conditions for the execu­<\/p>\n<h3 class=\"pdf-heading\">tion of my task : it is not with us that the end is held to justify the<\/h3>\n<p>means, nor is it we who are permitted to do evil that good may come. And it is not only bodily pain and weakness and the ravages of disease that I am to suffer with what patience I may, subduing them by my will for the sake of the work, but mental pain, ignominy, opprobrium and ridicule.*<\/p>\n<p>H.P.B's MESSAGE SUCH has been the destiny of those who sought to benefit the human race. For H.P.B. was not the first one to bring the knowledge that<\/p>\n<p>41 tOp. cit., p.48 *Op. cit., p.46.<\/p>", "images": [], "label": "bring the knowledge of the Ancient Wisdom to the western world :"}, {"pdf_page_index": 45, "pdf_page_number": 46, "html": "<p>there was a Divine Wisdom, which may be described as the basis upon which all religions are founded. This Theo-sophia—Divine Wisdom, or the Wisdom-Religion, as it is sometimes called—is not a system of belief formulated by an individual; instead it is the cumulative result of many ages of systematic search. It is not a religion in the ordinary meaning of the word, denoting formalized worship and devotional practices, rather is it the accumulated wisdom of innumerable eras.<\/p>\n<p>In reviving the search for this Ancient Wisdom, as represented by Theosophy, its object was 'to reconcile all religions, sects and nations<\/p>\n<p>under a common system of ethics based on eternal verities.'f Further­ more,<\/p>\n<p>The 'Wisdom-Religion' was one in antiquity; and the same­ ness of primitive religious philosophy is proven to us by the identical doctrines taught to the Initiates during the Mysteries, an institution once universally diffused. J<\/p>\n<p>What is also needed is to impress men with the idea that, if the root of mankind is one, then there must also be one truth which finds expression in all the various religions.* As to the message H. P. Blavatsky brought: it is based on fundament­ al concepts formulated^ into three propositions. These propositions<\/p>\n<p>form the basis for the presentation of the doctrines of the Ancient Wisdom, also known as the Esoteric Philosophy. Generations of sages and seers have had the opportunity of checking these doctrines by practical experience as well as by study. They have found that the teachings thus enunciated are in harmony with the philosophical system formulated by them. These three fundamental propositions are:<\/p>\n<p>1. An Omnipresent, Eternal, Boundless, and Immutable Principle on which all speculation is impossible, since it trans­ cends the power of human conception and could only be dwarfed<\/p>\n<p>by any human expression or similitude...It is the rootless root of 'all that was, is, or ever shall be'.<\/p>\n<p>2. The Eternity of the Universe in toto as a boundless plane; periodically 'the playground of numberless Universes incessantly manifesting and disappearing,' called 'the manifesting stars,' and the 'sparks of Eternity'. 'The Eternity of the Pilgrim is like a wink of the Eye of Self-Existence.<\/p>\n<p>3. The fundamental identity of all Souls with the Universal Over-Soul, the latter being itself an aspect of the Unknown Root; and the obligatory pilgrimage for every Soul—a spark of the<\/p>\n<p>42 •\\The Key to Theosophy, p.3. tlbid. p.4. *The Key to Theosophy, p.45<\/p>", "images": [], "label": "Page 46"}, {"pdf_page_index": 46, "pdf_page_number": 47, "html": "<p>former—through the Cycle of Incarnation (or 'Necessity') in accordance with Cyclic and Karmic law, during the whole term.*<\/p>\n<p>From time immemorial there have been human beings who have demonstrated superior faculties and abilities. Some have declared that they have come to assist humanity in one way or other. This was especially portrayed in the Mysteries of a ncient Greece. For instance, in the Eleusinian Mysteries certain families were selected as being representatives of carrying on the tradition of passing on the teach­ ings and customs in a particular manner. Thus the Hierophants were chosen from one family living in Athens named the Eumolpidae; the Torchbearers were drawn from the family of Lycomidae, also living in Athens.<\/p>\n<p>In similar manner to the torchbearers, who lit the way for the pro­ cessions to and from the temple where the ancient wisdom was con­ veyed to the initiants by the Hierophants, so does H. P. Blavatsky illumine the path for those who are eager to pursue the quest for knowledge. And in what an incomparable manner has the age-old wisdom been presented by her ! Read the words she penned in regard to her search for the custodians of the ancient lore of the Orient:<\/p>\n<p>When, years ago, we first travelled over the East, exploring the penetralia of its deserted sanctuaries, two saddening and ever- recurring questions oppressed our thoughts : Where, who, what is God? Who ever saw the immortal Spirit of man, so as to be able to assure himself of man's immortality?<\/p>\n<p>It was while most anxious to solve these perplexing problems that we came into contact with certain men, endowed with such mysterious powers and such profound knowledge that we may truly designate them as the sages of the Orient. To their instruc­ tions we lent a ready ear. They showed us that by combining science with religion, the existence of God and immortality of man's spirit may be demonstrated like a problem of Euclid. For the first time we received the assurance that the Oriental philoso­ phy has room for no other faith than an absolute and immovable faith in the omnipotence of man's own immortal self. We were taught that this omnipotence comes from the kinship, of man's spirit with the Universal Soul—God ! The latter, they said, can never be demonstrated but by the former. Man-spirit proves<\/p>\n<p>God-spirit, as the one drop of water proves a source from which it must have come. Tell one who had never seen water, that<\/p>\n<p>43<\/p>\n<p>*The Secret Doctrine, Vol. I, pp.14-17 1st ed.; 1,82 Adyar ed.; 1,453rd ed.<\/p>", "images": [], "label": "Page 47"}, {"pdf_page_index": 47, "pdf_page_number": 48, "html": "<p>there is an ocean of water, and he must accept it on faith or reject it altogether. But let one drop fall upon his hand, and he<\/p>\n<p>then has the fact from which all the rest may be inferred. After that he could by degrees understand that a boundless and fathomless ocean of water existed. Blind faith would no longer be necessary; he would have supplanted it with KNOWLEDGE.* We are not asked to accept on faith alone the message which H. P. Blavatsky brought to the western world. But we are requested to consider the fundamental propositions upon which her writings are<\/p>\n<p>based. Nevertheless, in due time we are expected to test the validity of each one of the doctrines which she presented. For, as stated by one<\/p>\n<h3 class=\"pdf-heading\">of her teachers :<\/h3>\n<p>We tell you what we know, for we are made to learn it through personal experience .f One of the required experiences in this testing is that of passing through the portals of death while retaining full consciousness, and that of going through the after-death states fully conscious.<\/p>\n<p>Not only did H. P. Blavatsky provide illumination upon what happens to man when he dies—thus enabling one to banish the fear of death—but she presented esoteric knowledge concerning the pro­ cess of birth. Then, too, the reason for living nobly is stressed; so is<\/p>\n<h3 class=\"pdf-heading\">the purpose of existence : why we are on earth and where we are<\/h3>\n<p>going. Above all she expounded the inner meaning of life on earth and<\/p>\n<p>reaffirmed the knowledge of man's spiritual powers and faculties— which although at present dormant are available to him who would make the requisite effort to awaken them.<\/p>\n<p>When presenting The Secret Doctrine to the western world, H. P.<\/p>\n<h3 class=\"pdf-heading\">Blavatsky quoted these words : 'My doctrine is not mine, but his that<\/h3>\n<p>sent me.'J Thus there is every assurance that she came as a messenger from the Fraternity representing the Sons of the Fire-Mist. In fact, she truly acted as a Light-bringer to the western world, ushering in a new age.<\/p>\n<p>44<\/p>\n<p>*Isis Unveiled, I, p. vi (Preface). t The Mahatma Letters to A. P. Sinnett, Letter xxc, p.131;<\/p>\n<p>1st ed.; p.128,3rd ed. %John, vii, 16.<\/p>", "images": [], "label": "of her teachers :"}, {"pdf_page_index": 48, "pdf_page_number": 49, "html": "<p class=\"empty-note\"><em>This page is a plate or blank page in the original — shown as a facsimile image below.<\/em><\/p>", "images": [{"file": "page_048_render.jpg", "caption": "Page 49 as printed in the original"}], "label": "Facsimile Plate"}, {"pdf_page_index": 49, "pdf_page_number": 50, "html": "<h3 class=\"pdf-heading\">GLOSSARY<\/h3>\n<p>ABBREVIATIONS I<\/p>\n<h3 class=\"pdf-heading\">Sk. = Sanskrit; Key = The Key to Theosophy;<\/h3>\n<h3 class=\"pdf-heading\">M.L. = The Mahatma Letters to A. P. Sinnett;<\/h3>\n<h3 class=\"pdf-heading\">S.D. = The Secret Doctrine; Th. Glos. = Theosophical Glossary<\/h3>\n<p>AD, SONS OF Term used by Occultists for a group of beings who<\/p>\n<p>preceded by hundreds of centuries what is called the Age of Iron.<\/p>\n<p>ADEPT Used with, a great deal of latitude. Herein applicable to<\/p>\n<p>those superior human beings who compose the occult Brother­ hood.<\/p>\n<p>AGNISHVATTA PITRIS (Sk : compounded of agni, fire or inner<\/p>\n<p>essence, applied figuratively to the mind, hence the fire of mind; svatta from svad, meaning to taste or sweeten; pitris, fathers).<\/p>\n<h3 class=\"pdf-heading\">The term may be explained in two ways : (i) Beings who have<\/h3>\n<p>tasted of the fire of mind and who have become stimulated to achieve and conclude the evolutionary cycle (the Cycle of Necessity); (2) Beings who have been sweetened by the fire of suffering and experience in the Cycle of Necessity and have graduated therefrom. It was the Agnishvatta Pitris (also termed<\/p>\n<p>Manasaputras or Sons of Mind) who awakened the dormant mind-principle of humanity during the fifth sub-race of the Third Root-Race.<\/p>\n<p>AKASA (Sk.) The Supersensuous spiritual essence which pervades<\/p>\n<p>all space; sometimes referred to as the Primordial Light manifest­ ing through Divine Ideation. Best described as manifesting in seven degrees or aspects. In its highest aspect it is equivalent to<\/p>\n<p>the Root of All, for it is defined in Southern Buddhism as that from which everything in the universe comes into being. In this<\/p>\n<p>46<\/p>", "images": [], "label": "Glossary"}, {"pdf_page_index": 50, "pdf_page_number": 51, "html": "<p>aspect Akasa is equivalent to the Tibetan term Tho-og, Space, or<\/p>\n<h3 class=\"pdf-heading\">Aditi in Hindu scriptures. Other equivalent terms : Adi-Buddhi<\/h3>\n<p>in Northern Buddhism, or Alaya; Svabhavat in the Stanzas of Dzyan; Mulaprakriti in the Vedantin system; Pradhana in the Brahmanical; Anima Mundi or the 'Soul of the World'; Prim­ ordial Aether (in Western terminology). In its lowest aspect Akasa is often referred to as the Astral Light.<\/p>\n<p>AQUARIAN AGE Best explained by considering the precession of<\/p>\n<p>the equinoxes—the westward movement of the equinoxes on the ecliptic. The equinoxes (vernal and autumnal) do not occur at the same points of the ecliptic every solar year, for the plane of the ecliptic and the plane of the equator revolve in opposite directions. Therefore, the two planes make a complete revolution with respect to each other once every 25,868 years. As the twelve signs of the zodiac are regarded as being stationed along the ecliptic, and divided into 30 degrees each, the 'entry of the equinox' into another sign of the zodiac would occur every 2155 years. As the 'entry of the equinox' in the zodiacal sign of Pisces is described as having occurred in 255 BC, the entry of the equinox into the zodiacal sign of Aquarius represents the present epoch as the Aquarian Age.<\/p>\n<h3 class=\"pdf-heading\">ARHAT (Sk : derived from verbal root arh —to be worthy, to be en­<\/h3>\n<p>titled to—hence one who is entitled to the distinction of having achieved the goal). Herein used as an individual who is a member of the occult Brotherhood.<\/p>\n<p>ASTRAL LIGHT Used with much latitude for lack of suitable<\/p>\n<p>English equivalents. In connection with the Earth, the Astral Light acts as a receptacle for the vital energies or life-principle (cosmic Jiva) proceeding from the sun, thus acting as the con­ veyor of it to the Earth. In this aspect it is equivalent to the Linga-sarira (pattern vehicle) in the sevenfold constitution of man, which likewise is the conveyor of Prana (life-principle) to the physical body. In this capacity each planet, and for that matter each sun, has its specific Astral Light.<\/p>\n<p>Furthermore, the Astral Light also represents what may be regarded as the 'picture gallery' of Eternity, preserving the record<\/p>\n<p>47<\/p>", "images": [], "label": "Aditi in Hindu scriptures. Other equivalent terms : Adi-Buddhi"}, {"pdf_page_index": 51, "pdf_page_number": 52, "html": "<p>of every event occurring on earth—whether on physical or astral<\/p>\n<p>plane. Also used as an equivalent for Kama-loka, the region associated with the first after-death state.<\/p>\n<p>ASTRAL SOUL As used in H. P. Blavatsky's narrative signifies the<\/p>\n<p>Mayavi-rupa, which by the use of Siddhis enables one to project one's consciousness to any desired distance. She also referred to it as the 'inner ego.'<\/p>\n<p>ASTRAL VITAL BODY As here used signifies the Linga-sarira (the<\/p>\n<p>model body or ethereal double) vitalized by the life-principle (Prana). See Seven Principles.<\/p>\n<h3 class=\"pdf-heading\">ATOM In Occult Science thus : 'Atoms fill the immensity of S pace,<\/h3>\n<p>and by their continuous vibration are that Motion which keeps<\/p>\n<h3 class=\"pdf-heading\">the wheels of Life perpetually going.' ( S.D. I, 633 First ed; II,<\/h3>\n<h3 class=\"pdf-heading\">358; Adyar ed; I, 6g4 Third ed)<\/h3>\n<p>BLACK MAGIC Term of the ancient Mystery-Schools, signifying<\/p>\n<p>the use of Siddhis (occult powers) for selfish or unholy purposes. 'For this is black magic, abomination and spiritual sorcery', to<\/p>\n<p>quote H. P. Blavatsky ( Key p.68). She also refers to mediumship as 'unconscious black magic.'<\/p>\n<p>BLAVATSKY, HELENA PETROVNA (1831-91) Daughter of<\/p>\n<p>Capt. Peter Alexeyevich von Hahn and Helena Andreyevna de Fadeyev; granddaughter of Privy Councillor Andrey Mihailovich de Fadeyev and Princess Helena Dolgorukov. Born at Ekaterino- slav, Ukraine, Russia, August 11-12. Her first ten years were spent in a sequence of moves, accompanying her father who was in the horse artillery. When Helena's mother died she lived with<\/p>\n<p>her grandparens, principally at Saratov and Tiflis, until her marriage (July 7, 1849) to N. V. Blavatsky, a State Official. The marriage was in name only, for within three months Mme. Blavatsky had left her home-land and began a series of travels, continuing for several years. The momentous event of her life occurred when she met her Master in London on her twentieth birthday. She never gave a sequential account of her journeys except for one notebook during the year of 1867. That she was<\/p>\n<p>48<\/p>", "images": [], "label": "ATOM In Occult Science thus : 'Atoms fill the immensity of S pace,"}, {"pdf_page_index": 52, "pdf_page_number": 53, "html": "<h3 class=\"pdf-heading\">in Tibet more than once is certain because she wrote : 'I have<\/h3>\n<p>lived at different periods in Little Tibet as in Great Tibet, and... these combined periods form more than seven years.' ( Collected Writings, VI, 272)<\/p>\n<p>It was during her stay in Tibet that she studied under her Teachers and was taught how to use the Siddhis which enabled her to produce her writings in a remarkable and unparalleled manner. On July 7, 1873, she arrived in New York; a year later she met Col. Olcott, and W. Q. Judge; these three with fourteen others founded The Theosophical Society in September, 1875. H. P. Blavatsky's first work, I sis Unveiled, was published in 1877. In December 1878 Mme. Blavatsky left America for India, re­ maining there until 1885. In 1879 The Theosophist was estab­ lished, for which she wrote many articles. She began writing The Secret Doctrine in Wurzburg in 1885, and then continued it in Ostend and London until its publication in 1888. The monthly magazine Lucifer was established by her in 1887; and she edited it until her death in 1891.<\/p>\n<p>BOD-LAS Tibetan for the land of Tibet. Bod is derived from Bhota<\/p>\n<p>(Sk.)—the land of Tibet.<\/p>\n<p>BROTHERHOOD An occult fraternity whose origin may be traced<\/p>\n<p>to the Sons of Ad, the custodians of the Ancient Wisdom. H. P. Blavatsky affirmed that she was sent to the western world by this fraternity to present certain teachings of the esoteric doctrine. Members of this Brotherhood are known by various names : Mahatmas, Chohans, Chang-Chubs, Byanz-Tzyoobs, Bodhisatt- vas, Khubil-khans, Adepts, Initiates, Arhats.<\/p>\n<p>BUDDHISM Usually defined as the religion founded by Gautama<\/p>\n<h3 class=\"pdf-heading\">Buddha. However, there are two main divisions : Mahayana<\/h3>\n<p>Buddhism, referred to as the Doctrine of the Heart, or Northern Buddhism; Hinayana Buddhism, the Doctrine of the Eye, or Southern Buddhism. The principal factor in Buddhism is its ethical teachings presented as the Noble Eightfold Path: (1) Right Understanding; (2) Right Attitude of Mind; (3) Right Speech; (4) Right Action; (5) Right Livelihood; (6) Right Effort; (7) Right Recollection; (8) Samma Samadhi—ecstatic beatitude, or the highest state of yoga.<\/p>\n<p>49<\/p>", "images": [], "label": "in Tibet more than once is certain because she wrote : 'I have"}, {"pdf_page_index": 53, "pdf_page_number": 54, "html": "<p>CHELA A term used in India for a disciple. Specifically, a personal<\/p>\n<p>disciple of a guru, or spiritual teacher. When used in connection with H. P. Blavatsky it signified an initiated disciple, even though her Teachers often referred to her as Upasika, signifying a female disciple.<\/p>\n<p>CHIEFS As used herein signifies those who are in the superior stages<\/p>\n<p>of evolution in connection with the occult Brotherhood (q.v.).<\/p>\n<p>CLAIRAUDIENCE Faculty of hearing with the 'inner ear'; or<\/p>\n<p>spiritual hearing of occult sounds at any distance.<\/p>\n<p>CLAIRVOYANCE Faculty of seeing with the 'inner eye'; or spirit­<\/p>\n<p>ual sight. As defined by H. P. Blavatsky : 'Real clairvoyance means the faculty of seeing through the densest matter (the latter disappearing at the will and before the spiritual eye of the Seer), and irrespective of time (past, present and future) or distance.' (Th. Glos. p.85).<\/p>\n<p>CYCLE OF NECESSITY Also termed the Cycle of Incarnation, or<\/p>\n<p>the Circle of Necessity. It refers to the ancient doctrine which postulates the necessity for the immortal component of man— the Pilgrim or the Monad—to return again and again for in­ carnation on earth, in order to accomplish seven major evolu­<\/p>\n<p>tionary developments, each one of which represents a change of form and greater manifestation of potencies.<\/p>\n<p>DANGMA The Eye of Dangma is also called the deva-eye, the eye<\/p>\n<p>of wisdom, the eye of Siva. This refers to the pineal gland, at present dormant. When awakened by occult process, the 'Opened Eye of Dangma' functions as 'the faculty of spiritual intuition, through which direct and certain knowledge is obtainable.' (S.D. I, 46 First ed; I, 118 Adyar ed; I, 77 Third ed.)<\/p>\n<p>DENTON, W. Geologist and author of The Soul of T hings: Psycho­<\/p>\n<p>metric Researches and Discoveries, Boston, 1873. He asserts that the images of the events are imbedded in that all-permeating universal and ever-retaining medium, which he terms the 'Soul<\/p>\n<p>50<\/p>", "images": [], "label": "Page 54"}, {"pdf_page_index": 54, "pdf_page_number": 55, "html": "<p>of Things'—which philosophers called Anima Mundi—the Soul of the World.<\/p>\n<p>DHYANIS (Sk.) Used in S.D. in place of Dhyanins—an abbreviated<\/p>\n<p>form of Dhyani-Chohans, literally 'the Meditative Lords.' Generalizing term for Divine Beings, superior in status to the<\/p>\n<h3 class=\"pdf-heading\">Human Kingdom : representing the Divine Intelligences who<\/h3>\n<p>supervise a cosmos.<\/p>\n<h3 class=\"pdf-heading\">ENOCH In the Bible ( Genesis iv and v) three Enochs are mentioned :<\/h3>\n<p>the son of Cain, the son of Seth, the son of Jared. An interpre­<\/p>\n<h3 class=\"pdf-heading\">tation of one of the meanings of Enoch is given by H.P.B. :<\/h3>\n<p>'Esoterically, Enoch is the \"Son of man,\" the first; and sym­ bolically, the first Sub-Race of the Fifth Root-Race. And if his name yields for purposes of numerical and astronomical glyphs the meaning of the solar year, or 365, in conformity to the age assigned to him in Genesis, it is because, being the seventh, he is, for Occult purposes, the personified period of the two preceding Races with their fourteen Sub-Races. Therefore, he is shown in the Book as the great grandfather of Noah who, in his turn, is the personification of the mankind of the Fifth, struggling with that of the Fourth Root-Race—the great period of the revealed<\/p>\n<h3 class=\"pdf-heading\">and profaned Mysteries.' (S.D. V. 106 Adyar ed.III go Third ed.)<\/h3>\n<p>EYE OF SIVA Conscious use of the pineal gland for clairvoyance is<\/p>\n<p>called by Hindu mystics the operation of the Eye of Siva. Also referred to as the third eye. (See under Dangma.)<\/p>\n<p>FIFTH CIRCLE A specific grade or status of superior degree<\/p>\n<p>attained in the Occult Fraternity, achieved by initiation.<\/p>\n<p>FIFTH RACE or FIFTH ROOT-RACE As described by Occult<\/p>\n<p>Science, represents the fifth major developmental evolution of the human kingdom. The term is specifically applicable to the Indo-European branch of humanity, which had its origin in northern Asia, in the vicinity of Lake Manasasarovara—a sacred lake in Tibet in the Himalayas. As a race sui generis it has already been in existence about one million years.<\/p>\n<p>51<\/p>", "images": [], "label": "Human Kingdom : representing the Divine Intelligences who"}, {"pdf_page_index": 55, "pdf_page_number": 56, "html": "<p>FIRE-MIST, SONS OF, or CHILDREN OF Equivalent to the<\/p>\n<p>Sons of Ad. These Beings are termed the Sons of Fire, or Fire- Mist, because they were the first humans in which 'the Fire of Mind' functioned. They were produced by Kriyasakti (by thought-power and yoga) in the first portion of the Third Race (q.v.).<\/p>\n<p>FIFTH-ROUNDERS Forerunners of the human race, such as the<\/p>\n<p>Mahatmas, having the ability to function in a superior degree of evolutionary development. They represent what the advanced members of the human race will be during the Fifth Round of the cyclical stage of e volutionary development, whereas the mass of humanity on earth function as Fourth-Rounders.<\/p>\n<p>FOURTH-ROUNDERS As explained by the Occult Sciences, the<\/p>\n<p>human race represents the stage of evolutionary development comparable to its Fourth Round, or fourth circuit of the required seven cyclical stages of evolutionary development. Each Round, or each circuit of the seven, represents a specific stage in the evolutionary development of the human race, in that one of the seven principles of man is developed to its fullest capacity. Dur­ ing the Fourth Round the fourth principle, Kama, is in its phase of development.<\/p>\n<p>GEBHARD, MARY (nee L'Estrange 1832-92) Best known in theoso-<\/p>\n<p>phical circles for the assistance given to Mme. Blavatsky during 1884 in Germany and 1886 in Belgium. Mme. Blavatsky lived with the Gebhards from August to October 1884, and again in May and June, 1886.<\/p>\n<p>Of interest also is the fact that after Mary L'Estrange's marriage to Consul Gustav Gebhard in 1852, she made the acquaintance of Eliphas Levi and studied the Kabbala under his tuition until his death in 1875.<\/p>\n<p>GREAT BREATH Symbol used to portray the coming into being of<\/p>\n<p>a universe, or a cosmos, for a period of manifestation and activity<\/p>\n<p>(termed a Manvantara)—the Outbreathing of the Great Breath. Similarly the dissolution (or Pralaya) of a cosmos is represented as the Inbreathing of the Great Breath. In the words of the<\/p>\n<p>52<\/p>", "images": [], "label": "Page 56"}, {"pdf_page_index": 56, "pdf_page_number": 57, "html": "<h3 class=\"pdf-heading\">Occult Catechism : 'What is it that is ever coming and going?'<\/h3>\n<p>'The Great Breath.'<\/p>\n<h3 class=\"pdf-heading\">GURU (Sk.) A spiritual teacher : one able to expound philosophical<\/h3>\n<p>and metaphysical doctrines.<\/p>\n<p>HERMES Herein the reference is not to the Greek messenger of the<\/p>\n<p>gods but to a generic name of many ancient Greek writers on philosophy and alchemy. Then, too, there is Hermes Trismegis- tus, the 'thrice great Hermes' in Egypt. The Hermetic philosophy which arose in that land is due to him. 'The forty-two Sacred Books of the Egyptians, mentioned by Clement of Alexandria as having existed in his time, were but a portion of the Books of Hermes. ( Stromata, II, 324) Iamblichus, on the authority of the Egyptian priest Abammon, attributes 1200 of such Books to<\/p>\n<h3 class=\"pdf-heading\">Hermes, and Manetho, 36,000.' ( S.D. V, §8 Adyar ed; III, 37<\/h3>\n<p>Third ed)<\/p>\n<p>H1EROPHANT Derived from Greek hieros, sacred; hence one who<\/p>\n<p>expounds sacred things; also an initiating priest, particularly in temples where the Mysteries were celebrated.<\/p>\n<p>HUME, ALLAN OCTAVIAN, C.B. (1829-1912) Secretary to the<\/p>\n<p>Government of India from 1870 to June 1879; was acquainted with metaphysical thought. Met Mme. Blavatsky in December 1879 and became interested in Theosophy. Wished to contact the source from which she obtained her knowledge, consequently wrote direct to Mahatma K. H. and corresponded with him. For a time he was interested in the philosophical teachings which were presented to him; many of the letters he received were published in The Mahatma Letters to A. P. Sinnett. After a few years he lost touch with Theosophy. Later he became the prime mover in organizing the Indian National Congress and was called the 'Father of the Congress.'<\/p>\n<p>INITIATION When a candidate desired to be admitted into the<\/p>\n<p>ancient Mysteries he underwent a process termed initiation. This practice was observed in all the ancient religions. Plutarch, writing from knowledge, mentioned the joy that was experienced<\/p>\n<p>53<\/p>", "images": [], "label": "Occult Catechism : 'What is it that is ever coming and going?'"}, {"pdf_page_index": 57, "pdf_page_number": 58, "html": "<h3 class=\"pdf-heading\">when one was initiated into the sacred Mysteries : it was the<\/h3>\n<p>most sacred of all solemnities as well as the most beneficent and greatly promoted virtue. The clue to the esoteric significance of initiation was expressed in this passage: 'The degrees of an Adept's initiation mark the seven stages at which he discovers the secret of the sevenfold principles in nature and man and awakens his dormant powers.' ( M.L. p.gg First ed; gj Third ed.)<\/p>\n<p>INNER EGO Used in H. P. Blavatsky's narrative to designate the<\/p>\n<p>Mayavi-rupa, which was projected by the Shaman. ( See Astral<\/p>\n<p>Soul).<\/p>\n<p>JUDGE, WILLIAM QUAN (1851-96) Theosophist and author:<\/p>\n<p>born in Ireland; came to Brooklyn, America, with his parents while in his teens and became a U.S. citizen in 1872. Met H. P. Blavatsky in 1874 and was a constant visitor at her residence dur­ ing her stay in New York. On the occasion of the founding of The Theosophical Society in September, 1875, Judge proposed<\/p>\n<p>that Col. Olcott should be elected chairman of the Society. Later, when the officers of the Society were elected in October, Judge became Counsel. In the spring of 1884 he went -to Paris and worked with H. P. Blavatsky on a projected revision of I sis Unveiled, which was later abandoned and superseded by the writing and publishing of The Secret Doctrine in 1888. In June 1886 Judge was elected General Secretary of the T.S.in.America, having already founded earlier in the year a theosophical maga­ zine entitled The Path. He wrote many articles for it and con­ tinued its publication until his death in 1896. Judge is best known for his writings in his magazine as well as through his books,<\/p>\n<p>principally The Ocean of Theosophy, his recension of the Bhagavad-Gita and Yoga Aphorisms of Patanjali.<\/p>\n<h3 class=\"pdf-heading\">KALI-YUGA (Sk : kali, the die with one dot; yuga, a cycle, an age).<\/h3>\n<p>The length of the Kali-yuga is stated to be 432,000 years. As figured in India it is the current cycle, for it began in 3102 B.C., coincident with the death of Krishna. It is refered to as the<\/p>\n<p>Black Age, because it is an era when strife and vice are pre­ dominant.<\/p>\n<p>54<\/p>", "images": [], "label": "when one was initiated into the sacred Mysteries : it was the"}, {"pdf_page_index": 58, "pdf_page_number": 59, "html": "<p>KAMA (Sk: from the verbal root kam, to desire). Applied in the<\/p>\n<p>sevenfold classification of principles in the human constitution to<\/p>\n<p>the desire principle as well as the energetic principle. In the Occult Sciences Kama is regarded as the Will-principle ( The Theosophist , IV, 295).<\/p>\n<p>KAPILA, THE RISHI A great sage; a great adept of antiquity;<\/p>\n<p>author of the Sankhya philosophy.<\/p>\n<p>KAPILA 'also the generic name of the Kumaras, the celestial ascetics<\/p>\n<p>and virgins; therefore the very fact of Bhagavata-Pur ana calling that Kapila—which it showed just before as a portion of Vishnu —the author of Sankhya philosophy, ought to have warned the reader of a 'blind' containing an esoteric meaning. Whether the Son of Vitatha, as Harivansa shows him to be, or of anyone else,<\/p>\n<p>the author of Sankhya cannot be the same as the Sage of the<\/p>\n<h3 class=\"pdf-heading\">Satya-Yuga' {S.D. II, 572 First ed; IV, 142 Adyar ed; II, 604<\/h3>\n<p>Third ed.)<\/p>\n<p>'The Sankhya philosophy may have been brought down and taught by the first, and written out by the last Kapila.' {Ibid) 'The Kapila of the Satya-yuga, and the Kapila of the Kali-yuga,<\/p>\n<p>may be &lt;?ne and the same individuality, without being the same<\/p>\n<p>personality.' {Ibid).<\/p>\n<p>KEIGHTLEY, ARCHIBALD (1859-1930) physician and Theoso­<\/p>\n<h3 class=\"pdf-heading\">phist : practiced in New York. Joined The Theosophical Society<\/h3>\n<p>in 1884 and met Mme. Blavatsky. In 1887 he assisted H. P. B. in moving from Ostend to London and settling, first at Norwood, then at 17 Lansdowne Road. It was while living at the latter house that he with his uncle Bertram helped H. P. B. in prepar­ ing and typing The Secret Doctrine, as well as seeing it through the press.<\/p>\n<p>KINGSLAND, WILLIAM (1855-1936) M.I.E.E., engineer, scien­<\/p>\n<p>tist, Theosophist and author: employed with early installation of telephone and electricity in England and Scotland. In 1888 Kingsland contacted Theosophy, became a member of the Society and met Mme. Blavatsky. In January, 1889, he was elected President of Blavatsky Lodge, London, holding that office for almost two years.<\/p>\n<p>55<\/p>", "images": [], "label": "Satya-Yuga' {S.D. II, 572 First ed; IV, 142 Adyar ed; II, 604"}, {"pdf_page_index": 59, "pdf_page_number": 60, "html": "<p>KRIYASAKTI (Sk.) The power of creative thought, especially when<\/p>\n<p>energized by will-power. One of the seven great powers which yogins are able to make manifest, i.e., one of the Siddhis.<\/p>\n<p>LIFE-ATOM. The essential element of life associated with an atom,<\/p>\n<p>or the indwelling spark vitalizing an atom. Life-atoms may be<\/p>\n<h3 class=\"pdf-heading\">classified in two categories : (i) atoms that are moved by kinetic<\/h3>\n<p>energy—hence always in motion; (2) atoms that are temporarily<\/p>\n<p>pasive, although they contain invisible, potential energy. These are termed 'sleeping atoms.' 'Each atom is of course a soul, a monad, a little universe endowed with consciousness hence with<\/p>\n<h3 class=\"pdf-heading\">memory.' ( S.D. II, 672 First ed; IV, 241 Adyar ed; II, 710 Third<\/h3>\n<p>ed.)<\/p>\n<p>LUCIFER (Latin). Literally the light-bearer, therefore used by H.<\/p>\n<p>P. Blavatsky as the title for her magazine which she founded in September 1887 and continued monthly until May 1891. Pub­<\/p>\n<h3 class=\"pdf-heading\">lished postumously until 1897. A passage in Rev. xvi, 22 reads :<\/h3>\n<p>'I am...the bright morning star,' signifying Lucifer, or Phosphor<\/p>\n<p>in Greek, the planet Venus. The first issue, which appeared on September 15, 1887, bore this message on the title-page. 'A Theosophical Magazine, designed to bring to light the hidden<\/p>\n<p>things of darkness.'<\/p>\n<p>LYCOMIDAE The word is derived from the Greek luke, light; hence<\/p>\n<p>signifying the light-bearers—those who carried torches in the<\/p>\n<p>processions of the Mysteries.<\/p>\n<p>MAHA GURU (Sk.) Literally the 'Great Teacher.' Herein signifies<\/p>\n<p>the Wondrous Being, the Great Watcher.<\/p>\n<h3 class=\"pdf-heading\">MAHATMA (Sk : mahatman, compound of maha, great atman, the<\/h3>\n<p>divine self). Usually rendered a 'great soul.' Herein the term signifies a member of the occult Brotherhood. Specifically applic­ able to the two individuals who were instrumental in sending H. P. Blavatsky as a messenger from the Brotherhood to the western world, namely Mahatma M. (Morya—H. P. B.'s spiritual guru), and Mahatma K. H. (Koot Hoomi). The cor­<\/p>\n<p>respondence between Sinnett and these two Mahatmas is published in The Mahatma Letters to A. P. Sinnett.<\/p>\n<p>56<\/p>", "images": [], "label": "classified in two categories : (i) atoms that are moved by kinetic"}, {"pdf_page_index": 60, "pdf_page_number": 61, "html": "<p>MANAS (Sk.) Derived from verbal root man, to think. Applied to the<\/p>\n<p>mind principle, in the sevenfold classification of principles in the human constitution. The ability to use the mind principle marks the difference between the human and the animal kingdoms.<\/p>\n<h3 class=\"pdf-heading\">MANVANTARA (Sk : Manu, a divine being and antara, between;<\/h3>\n<p>hence literally a period between two Manus). Herein used as a cyclic period of activity comprising 7 Rounds of evolutionary development. Equivalent to a Day of Brahma, or 1,000 revolu­ tions of the Maha-yugas, or 4,320,000,000 years.<\/p>\n<p>MASTER The individual referred to by H. P. B. as 'my Master' is<\/p>\n<p>known as Mahatma Morya (or M. :.), her Guru. She relates that she first met him in the physical body in London in 1851, al­<\/p>\n<p>though she had known him in his astral form during her child­ hood and had regarded him as her guardian. She underwent tuition and training under his tutelage in Tibet and under his direction went to America, where she met Col. Olcott and founded the Theosophical Society in 1875.<\/p>\n<p>MASTERS H. P. Blavatsky referred to her Teachers as Elder<\/p>\n<p>Brothers, because of their association with the occult Brother­ hood (q.v.); or again as Masters or Mahatmas. Two members of the Fraternity who were particularly instrumental in the found­<\/p>\n<h3 class=\"pdf-heading\">ing of the T.S. were known as K.H. (Koot Hoomi) and M. :. (or<\/h3>\n<p>Morya), her specific guru or spiritual teacher.<\/p>\n<p>MESSIANIC CYCLE As used herein the Messianic Cycle represents<\/p>\n<p>the period associated with the advent of a Messiah. It is a cycle of 2155 or 2160 solar years. The significance of the number 2160 is<\/p>\n<h3 class=\"pdf-heading\">this : it is just one half of 4320—4-3-2 being the key-figures of<\/h3>\n<p>esoteric reckoning. The Messiah of the present Messianic Cycle was represented as coming through H. P. Blavatsky, who acted as the channel. Hence it is asserted that she acted in the capacity of a Light-Bringer.<\/p>\n<p>MUNDANE EGG. The symbol of an egg is used in connection with<\/p>\n<p>the coming into birth of a new world. Just as the egg-cell is the point within the egg which eventually brings to birth a new<\/p>\n<p>57<\/p>", "images": [], "label": "MANVANTARA (Sk : Manu, a divine being and antara, between;"}, {"pdf_page_index": 61, "pdf_page_number": 62, "html": "<p>being, so the Point within the World-Egg represents the Logos, which enables a new cosmos to come into manifestation.<\/p>\n<p>MUNIS (Sk.) Usually rendered Seers or Sages. Herein used for<\/p>\n<p>Divine Beings from previous Manvantaras (q.v.), who associated with the Sons of Will and Yoga (q.v.).<\/p>\n<p>MYSTERIES Derived from Greek muo, to be shut, or closed, refer­<\/p>\n<p>ring to the lips and eyes. Those initiated into the Mysteries were instructed to keep their lips sealed regarding what happened in the temples. The Mysteries consisted of dramatic portrayals of episodes connected with the deities represented in the myth­ ologies of ancient nations. The hidden meanings of the myths and allegories were then explained to the initiated candidates. The three principal Mysteries were the Orphic, the Eleusinian and the Dionysiac.<\/p>\n<p>NAD YE JD A Given name of Nadyezhda Andreyevna Fadeyev (1829-<\/p>\n<p>1919), sister of H.P.B's mother and youngest daughter of Andrey Mihailovich de Fadeyev and Princess Helena Pavlovna Dolgoru- kova. She was H.P.B.'s favourite aunt and corresponded with her through the years. She was the recipient of the first known Mahatma letter, receiving it at the time that H. P. Blavatsky was undergoing tuition in Tibet. The letter was delivered to her in person by Mahatma M.<\/p>\n<p>OCCULT DOCTRINE The Secret Doctrine, which forms the basis<\/p>\n<p>of Theosophy as transmitted by H. P. Blavatsky to the western world.<\/p>\n<p>OCCULT SCIENCE One of the names by which the custodians of<\/p>\n<p>the Ancient Wisdom refer to it. A rendering of the Sanskrit Gupta-Vidya.<\/p>\n<p>OLCOTT, HENRY STEEL (1832-1907) For distinguished service<\/p>\n<p>as Special Commissioner for the War Department as well as in the Navy Department during the Civil War in America, Olcott was awarded the rank of Colonel. In 1874, while acting as a special reporter for the New York Daily Graphic, covering the<\/p>\n<p>58<\/p>", "images": [], "label": "Page 62"}, {"pdf_page_index": 62, "pdf_page_number": 63, "html": "<p>spiritualistic phenomena appearing at the Eddy farm-house at Chittenden, Vermont, he met H. P. Blavatsky, who had been sent there by her Teacher. As a result of this meeting and the interest Col. Olcott showed
