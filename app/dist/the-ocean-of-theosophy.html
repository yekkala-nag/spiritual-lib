em>devachan<\/em> until that force is exhausted, but which being spent has no more power to hold back the decree of our self-made mortal destiny.<\/p>", "images": [], "label": "13. Devachan"}, {"pdf_page_index": 151, "pdf_page_number": 152, "html": "<p>The necessity for this state after death is one of the necessities of evolution growing out of the nature of mind and soul. The very nature of <em>manas<\/em> requires a devachanic state as soon as the body is lost, and it is simply the effect of loosening the bonds placed upon the mind by its physical and astral encasement. In life we can but to a fractional extent act out the thoughts we have each moment; and still less can we exhaust the psychic energies engendered by each day’s aspirations and dreams. The energy thus engendered is not lost or annihilated, but is stored in <em>Manas<\/em>, but the body, brain, and astral body permit no full development of the force. Hence, held latent until death, it bursts then from the weakened bonds and plunges <em>Manas<\/em>, the thinker, into the expansion, use, and development of the thought-force set up in life. The impossibility of escaping this necessary state lies in man’s ignorance of his own powers and faculties. From this ignorance delusion arises, and <em>Manas<\/em> not being wholly free is carried by its own force into the thinking of <em>devachan<\/em>. But while ignorance is the cause for going into this state the whole process is remedial, restful, and beneficial. For if the average man returned at once to another body in the same civilization he had just quitted, his soul would be completely tired out and deprived of the needed opportunity for the development of the higher part of his nature.<\/p>", "images": [], "label": "13. Devachan (cont.)"}, {"pdf_page_index": 152, "pdf_page_number": 153, "html": "<p>Now the Ego being minus mortal body and <em>kama<\/em>, clothes itself in <em>devachan<\/em> with a vesture which cannot be called body but may be styled means or vehicle, and in that it functions in the devachanic state entirely on the plane of mind and soul. Everything is as real then to the being as this world seems to be to us. It simply now has gotten the opportunity to make its own world for itself unhampered by the clogs of physical life. Its state may be compared to that of the poet or artist who, rapt in ecstasy of composition or arrangement of color, cares not for and knows not of either time or objects of the world.<\/p>\n<p>We are making causes every moment, and but two fields exist for the manifestation in effect of those causes. These are, the objective as this world is called, and the subjective which is both here and after we have left this life. The objective field relates to earth life and the grosser part of man, to his bodily acts and his brain thoughts, as also sometimes to his astral body. The subjective has to do with his higher and spiritual parts. In the objective field the psychic impulses cannot work out, nor can the high leanings and aspirations of his soul; hence these must be the basis, cause, substratum, and support for the state of <em>devachan<\/em>. What then is the time, measured by mortal years, that one will stay in <em>devachan<\/em>?<\/p>", "images": [], "label": "13. Devachan (cont.)"}, {"pdf_page_index": 153, "pdf_page_number": 154, "html": "<p>This question while dealing with what earth-men call time does not, of course, touch the real meaning of time itself, that is, of what may be in fact for this solar system the ultimate order, precedence, succession, and length of moments. It is a question which may be answered in respect to our time, but not certainly in respect to the time on the planet Mercury, for instance, where time is not the same as ours, nor, indeed, in respect to time as conceived by the soul. As to the latter any man can see that after many years have slipped away he has no direct perception of the time just passed, but is able only to pick out some of the incidents which marked its passage, and as to some poignant or happy instants or hours he seems to feel them as but of yesterday. And thus it is for the being in <em>devachan<\/em>. No time is there. The soul has all the benefit of what goes on within itself in that state, but it indulges in no speculations as to the lapse of moments; all is made up of events, while all the time the solar orb is marking off the years for us on the earth plane. This cannot be regarded as an impossibility if we will remember how, as is well known in life, events, pictures, thoughts, argument, introspective feeling will all sweep over us in perfect detail in an instant, or, as is known of those who have been drowning, the events of a whole life time pass in a flash before the eye of the mind. But the Ego remains as said in <em>devachan<\/em> for a time exactly proportioned to the psychic impulses generated during life. Now this being a matter which deals with the mathematics of the soul, no one but a Master can tell what the time would be for the average man of this century in every land. Hence we have to depend on the Masters of wisdom for that average, as it must be based upon a calculation. They have said, as is well put by Mr. A. P. Sinnett in his <em>Esoteric Buddhism<\/em>, that the period is fifteen hundred years in general. From a reading of his book, which was made up from letters from the Masters, it is to be inferred he desires it to be understood that the devachanic period is in each and every case fifteen centuries; but to do away with that misapprehension his informants wrote at a later date that that is the average period and not a fixed one. Such must be the truth, for as we see that men differ in respect to the periods of time they remain in any state of mind in life due to the varying intensities of their thoughts, so it must be in <em>devachan<\/em> where thought has a greater force though always due to the being who had the thoughts.<\/p>", "images": [], "label": "13. Devachan (cont.)"}, {"pdf_page_index": 154, "pdf_page_number": 155, "html": "<p>What the Master did say on this is as follows: The “dream of <em>devachan<\/em>” lasts until karma is satisfied in that direction. In <em>devachan<\/em> there is a “gradual exhaustion of force.” “The stay in Devachan is proportioned to the unfinished psychic impulses originating in earth-life: those whose attractions were preponderatingly material will be sooner drawn back into rebirth by the force of <em>Tanha<\/em>.” <em>Tanha<\/em> is the thirst for life. He therefore who has not in life originated many psychic impulses will have but little basis or force in his essential nature to keep his higher principles in <em>devachan<\/em>. About all he will have are those originated in childhood before he began to fix his thoughts on materialistic thinking. The thirst for life expressed by the word <em>Tanha<\/em> is the pulling or magnetic force lodged in the <em>skandhas<\/em> inherent in all beings. In such a case as this the average rule does not apply, since the whole effect either way is due to a balancing of forces and is the outcome of action and reaction. And this sort of materialistic thinker may emerge out of <em>devachan<\/em> into another body here in a month, allowing for the unexpended psychic forces originated in early life. But as every one of such persons varies as to class, intensity and quantity of thought and psychic impulse, each may vary in respect to the time of stay in <em>devachan<\/em>. Desperately materialistic thinkers will remain in the devachanic condition stupefied or asleep, as it were, as they have no forces in them appropriate to that state save in a very vague fashion, and for them it can be very truly said that there is no state after death so far as mind is concerned; they are torpid for a while, and then they live again on earth. This general average of the stay in <em>devachan<\/em> gives us the length of a very important human cycle, the Cycle of Reincarnation. For under that law national development will be found to repeat itself, and the times that are past will be found to come again.<\/p>", "images": [], "label": "13. Devachan (cont.)"}, {"pdf_page_index": 155, "pdf_page_number": 156, "html": "<p>The last series of powerful and deeply imprinted thoughts are those which give color and trend to the whole life in <em>devachan<\/em>. The last moment will color each subsequent moment. On those the soul and mind fix themselves and weave of them a whole set of events and experiences, expanding them to their highest limit, carrying out all that was not possible in life. Thus expanding and weaving these thoughts the entity has its youth and growth and growing old, that is, the uprush of the force, its expansion, and its dying down to final exhaustion. If the person has led a colorless life the <em>devachan<\/em> will be colorless; if a rich life, then it will be rich in variety and effect. Existence there is not a dream save in a conventional sense, for it is a stage of the life of man, and when we are there this present life is a dream. It is not in any sense monotonous. We are too prone to measure all possible states of life and places for experience by our present earthly one and to imagine it to be reality. But the life of the soul is endless and not to be stopped for one instant. Leaving our physical body is but a transition to another place or plane for living in. But as the ethereal garments of <em>devachan<\/em> are more lasting than those we wear here, the spiritual, moral, and psychic causes use more time in expanding and exhausting in that state than they do on earth. If the molecules that form the physical body were not subject to the general chemical laws that govern physical earth, then we should live as long in these bodies as we do in the devachanic state. But such a life of endless strain and suffering would be enough to blast the soul compelled to undergo it. Pleasure would then be pain, and surfeit would end but in an immortal insanity. Nature, always kind, leads us soon again into heaven for a rest, for the flowering of the best and highest in our natures.<\/p>", "images": [], "label": "13. Devachan (cont.)"}, {"pdf_page_index": 156, "pdf_page_number": 157, "html": "<p><em>Devachan<\/em> is then neither meaningless nor useless. “In it we are rested; that part of us which could not bloom under the chilling skies of earth-life bursts forth into flower and goes back with us to another life stronger and more a part of our nature than before; . . . Why shall we repine that nature kindly aids us in the interminable struggle; why thus keep the mind revolving about this petty personality and its good and evil fortunes?” (Letter from Mahatma K. H. See <em>Path<\/em>, p. 192, Vol. 5.)<\/p>", "images": [], "label": "13. Devachan (cont.)"}, {"pdf_page_index": 157, "pdf_page_number": 158, "html": "<p>But it is sometimes asked, what of those we have left behind: do we see them there? We do not see them there in fact, but we make to ourselves their images as full, complete, and objective as in life, and devoid of all that we then thought was a blemish. We live with them and see them grow great and good instead of mean or bad. The mother who has left a drunken son behind finds him before her in <em>devachan<\/em> a sober, good man, and likewise through all possible cases, parent, child, husband, and wife have their loved ones there perfect and full of knowledge. This is for the benefit of the soul. You may call it a delusion if you will, but the illusion is necessary to happiness just as it often is in life. And as it is the mind that makes the illusion, it is no cheat. Certainly the idea of a heaven built over the verge of hell where you must know, if any brains or memory are left to you under the modern orthodox scheme, that your erring friends and relatives are suffering eternal torture, will bear no comparison with the doctrine of <em>devachan<\/em>. But entities in <em>devachan<\/em> are not wholly devoid of power to help those left on earth. Love, the master of life, if real, pure, and deep, will sometimes cause the happy Ego in <em>devachan<\/em> to affect those left on earth for their good, not only in the moral field but also in that of material circumstance. This is possible under a law of the occult universe which cannot be explained now with profit, but the fact may be stated. It has been given out before this by H. P. Blavatsky, without, however, much attention being drawn to it.<\/p>", "images": [], "label": "13. Devachan (cont.)"}, {"pdf_page_index": 158, "pdf_page_number": 159, "html": "<p>The last question to consider is whether we here can reach those in <em>devachan<\/em> or do they come here. We cannot reach them nor affect them unless we are Adepts. The claim of mediums to hold communion with the spirits of the dead is baseless, and still less valid is the claim of ability to help those who have gone to <em>devachan<\/em>. The Mahatma, a being who has developed all his powers and is free from illusion, can go into the devachanic state and then communicate with the Egos there. Such is one of their functions, and that is the only school of the Apostles after death. They deal with certain entities in <em>devachan<\/em> for the purpose of getting them out of the state so as to return to earth for the benefit of the race. The Egos they thus deal with are those whose nature is great and deep but who are not wise enough to be able to overcome the natural illusions of <em>devachan<\/em>. Sometimes also the hypersensitive and pure medium goes into this state and then holds communication with the Egos there, but it is rare, and certainly will not take place with the general run of mediums who trade for money. But the soul never descends here to the medium. And the gulf between the consciousness of <em>devachan<\/em> and that of earth is so deep and wide that it is but seldom the medium can remember upon returning to recollection here what or whom it met or saw or heard in <em>devachan<\/em>. This gulf is similar to that which separates <em>devachan<\/em> from rebirth; it is one in which all memory of what preceded it is blotted out.<\/p>", "images": [], "label": "13. Devachan (cont.)"}, {"pdf_page_index": 159, "pdf_page_number": 160, "html": "<p>The whole period allotted by the soul’s forces being ended in <em>devachan<\/em>, the magnetic threads which bind it to earth begin to assert their power. The Self wakes from the dream, it is borne swiftly off to a new body, and then, just before birth, it sees for a moment all the causes that led it to <em>devachan<\/em> and back to the life it is about to begin, and knowing it to be all just, to be the result of its own past life, it repines not but takes up the cross again — and another soul has come back to earth.<\/p>", "images": [], "label": "13. Devachan (cont.)"}, {"pdf_page_index": 160, "pdf_page_number": 161, "html": "<h3 class=\"pdf-heading\">14. Cycles<\/h3>\n<p>The doctrine of Cycles is one of the most important in the whole theosophical system, though the least known and of all the one most infrequently referred to. Western investigators have for some centuries suspected that events move in cycles, and a few of the writers in the field of European literature have dealt with the subject, but all in a very incomplete fashion. This incompleteness and want of accurate knowledge have been due to the lack of belief in spiritual things and the desire to square everything with materialistic science. Nor do I pretend to give the cyclic law in full, for it is one that is not given out in detail by the Masters of Wisdom. But enough has been divulged, and enough was for a long time known to the Ancients to add considerably to our knowledge.<\/p>", "images": [], "label": "14. Cycles"}, {"pdf_page_index": 161, "pdf_page_number": 162, "html": "<p>A cycle is a ring or turning, as the derivation of the word indicates. The corresponding words in the Sanskrit are <em>Yuga, Kalpa, Manvantara<\/em>, but of these <em>yuga<\/em> comes nearest to cycle, as it is lesser in duration than the others. The beginning of a cycle must be a moment, that added to other moments makes a day, and those added together constitute months, years, decades, and centuries. Beyond this the West hardly goes. It recognizes the moon cycle and the great sidereal one, but looks at both and upon the others merely as periods of time. If we are to consider them as but lengths of time there is no profit except to the dry student or to the astronomer. And in this way today they are regarded by European and American thinkers, who say cycles exist but have no very great bearing on human life and certainly no bearing on the actual recurrence of events or the reappearance on the stage of life of persons who once lived in the world. The theosophical theory is distinctly otherwise, as it must be if it carries out the doctrine of reincarnation to which in preceding pages a good deal of attention has been given. Not only are the cycles named actual physical facts in respect to time, but they and other periods have a very great effect on human life and the evolution of the globe with all the forms of life thereon. Starting with the moment and proceeding through a day, this theory erects the cycle into a comprehensive ring which includes all in its limits. The moment being the basis, the question to be settled in respect to the great cycles is, When did the first moment come? This cannot be answered, but it can be said that the truth is held by the ancient theosophists to be that at the first moments of the solidification of this globe the mass of matter involved attained a certain and definite rate of vibration which will hold through all variations in any part of it until its hour for dissolution comes. These rates of vibration are what determine the different cycles, and, contrary to the ideas of western science, the doctrine is that the solar system and the globe we are now on will come to an end when the force behind the whole mass of seen and unseen matter has reached its limit of duration under cyclic law. Here our doctrine is again different from both the religious and scientific one. We do not admit that the ending of the force is the withdrawal by a God of his protection, nor the sudden propulsion by him of another force against the globe, but that the force at work and determining the great cycle is that of man himself considered as a spiritual being; when he is done using the globe he leaves it, and then with him goes out the force holding all together; the consequence is dissolution by fire or water or what not, these phenomena being simply effects and not causes. The ordinary scientific speculations on this head are that the earth may fall into the sun, or that a comet of density may destroy the globe, or that we may collide with a greater planet known or unknown. These dreams are idle for the present.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 162, "pdf_page_number": 163, "html": "<p>Reincarnation being the great law of life and progress, it is interwoven with that of the cycles and karma. These three work together, and in practice it is almost impossible to disentangle reincarnation from cyclic law. Individuals and nations in definite streams return in regularly recurring periods to the earth, and thus bring back to the globe the arts, the civilization, the very persons who once were on it at work. And as the units in nation and race are connected together by invisible strong threads, large bodies of such units moving slowly but surely all together reunite at different times and emerge again and again together into new race and new civilization as the cycles roll their appointed rounds. Therefore the souls who made the most ancient civilizations will come back and bring the old civilization with them in idea and essence, which being added to what others have done for the development of the human race in its character and knowledge will produce a new and higher state of civilization. This newer and better development will not be due to books, to records, to arts or mechanics, because all those are periodically destroyed so far as physical evidence goes, but the soul ever retaining in <em>Manas<\/em> the knowledge it once gained and always pushing to completer development the higher principles and powers, the essence of progress remains and will as surely come out as the sun shines. And along this road are the points when the small and large cycles of Avatars bring out for man’s benefit the great characters who mold the race from time to time.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 163, "pdf_page_number": 164, "html": "<p>The Cycle of Avatars includes several smaller ones. The greater are those marked by the appearance of Rama and Krishna among the Hindus, of Menes among the Egyptians, of Zoroaster among the Persians, and of Buddha to the Hindus and other nations of the East. Buddha is the last of the great Avatars and is in a larger cycle than is Jesus of the Jews, for the teachings of the latter are the same as those of Buddha and tinctured with what Buddha had taught to those who instructed Jesus. Another great Avatar is yet to come, corresponding to Buddha and Krishna combined. Krishna and Rama were of the military, civil, religious, and occult order; Buddha of the ethical, religious, and mystical, in which he was followed by Jesus; Mohammed was a minor intermediate one for a certain part of the race, and was civil, military, and religious. In these cycles we can include mixed characters who have had great influence on nations, such as King Arthur, Pharaoh, Moses, Charlemagne reincarnated as Napoleon Bonaparte, Clovis of France reborn as Emperor Frederic III of Germany, and Washington the first President of the United States of America where the root for the new race is being formed.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 164, "pdf_page_number": 165, "html": "<p>At the intersection of the great cycles dynamic effects follow and alter the surface of the planet by reason of the shifting of the poles of the globe or other convulsion. This is not a theory generally acceptable, but we hold it to be true. Man is a great dynamo, making, storing, and throwing out energy, and when masses of men composing a race thus make and distribute energy, there is a resulting dynamic effect on the material of the globe which will be powerful enough to be distinct and cataclysmic. That there have been vast and awful disturbances in the strata of the world is admitted on every hand and now needs no proof; these have been due to earthquakes and ice formation so far as concerns geology; but in respect to animal forms the cyclic law is that certain animal forms now extinct and also certain human ones not known but sometimes suspected will return again in their own cycle; and certain human languages now known as dead will be in use once more at their appointed cyclic hour.<\/p>\n<p>“The Metonic cycle is that of the Moon. It is a period of about nineteen years, which being completed the new and the full moons return on the same days of the month.”<\/p>\n<p>“The cycle of the Sun is a period of twenty eight years, which having elapsed the Dominical or Sunday letters return to their former place and proceed in the former order according to the Julian calendar.”<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 165, "pdf_page_number": 166, "html": "<p>The great Sidereal year is the period taken by the equinoctial points to make in their precession a complete revolution of the heavens. It is composed of 25,868 solar years almost. It is said that the last sidereal year ended about 9,868 years ago, at which time there must have been on this earth a violent convulsion or series of such, as well as distributions of nations. The completion of this grand period brings the earth into newer spaces of the cosmos, not in respect to its own orbit, but by reason of the actual progress of the sun in an orbit of its own that cannot be measured by any observer of the present day, but which is guessed at by some and located in one of the constellations.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 166, "pdf_page_number": 167, "html": "<p>Affecting man especially are the spiritual, psychic, and moral cycles, and out of these grow the national, racial, and individual cycles. Race and national cycles are both historical. The individual cycles are of reincarnation, of sensation, and of impression. The length of the individual reincarnation cycle for the general mass of men is fifteen hundred years, and this in its turn gives us a large historical cycle related closely to the progress of civilization. For as the masses of persons return from <em>devachan<\/em>, it must follow that the Roman, the Greek, the old Aryan, and other Ages will be seen again and can to a very great extent be plainly traced. But man is also affected by astronomical cycles because he is an integral part of the whole, and these cycles mark the periods when mankind as a whole will undergo a change. In the sacred books of all nations these are often mentioned, and are in the Bible of the Christians, as, for instance, in the story of Jonah in the belly of the whale. This is an absurdity when read as history, but not so as an astronomical cycle. “Jonah” is in the constellations, and when that astronomical point which represents man reaches a point in the Zodiac which is directly opposite the belly of Cetus or the whale on the other side of the circle, by what is known as the process of opposition, then Jonah is said to be in the center of the fish and is “thrown out” at the expiration of the period when that man-point has passed so far along in the Zodiac as to be out of opposition to the whale. Similarly as the same point moves thus through the Zodiac it is brought by opposition into the different constellations that are exactly opposite from century to century while it moves along. During these progresses changes take place among men and on earth exactly signified by the constellations when those are read according to the right rules of symbology. It is not claimed that the conjunction causes the effect, but that ages ago the Masters of Wisdom worked out all the problems in respect to man and found in the heavens the means for knowing the exact dates when events are sure to recur, and then by imprinting in the minds of older nations the symbology of the Zodiac were able to preserve the record and the prophecy. Thus in the same way that a watchmaker can tell the hour by the arrival of the hands or the works of the watch at certain fixed points, the Sages can tell the hour for events by the Zodiacal clock. This is not of course believed today, but it will be well understood in future centuries, and as the nations of the earth have all similar symbols in general for the Zodiac, and as also the records of races long dead have the same, it is not likely that the vandal-spirit of the western nineteenth century will be able to efface this valuable heritage of our evolution. In Egypt the Denderah Zodiac tells the same tale as that one left to us by the old civilization of the American continent, and all of these are from the same source, they are the work of the Sages who come at the beginning of the great human cycle and give to man when he begins his toilsome ascent up the road of development those great symbols and ideas of an astronomical character which will last through all the cycles.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 167, "pdf_page_number": 168, "html": "<p>In regard to great cataclysms occurring at the beginning and ending of the great cycles, the main laws governing the effects are those of Karma and Reimbodiment, or Reincarnation, proceeding under cyclic rule. Not only is man ruled by these laws, but every atom of matter as well, and the mass of matter is constantly undergoing a change at the same time with man. It must therefore exhibit alterations corresponding to those through which the thinker is going. On the physical plane effects are brought out through the electrical and other fluids acting with the gases on the solids of the globe. At the change of a great cycle they reach what may be termed the exploding point and cause violent convulsions of the following classes: (<em>a<\/em>) Earthquakes, (<em>b<\/em>) Floods, (<em>c<\/em>) Fire, (<em>d<\/em>) Ice.<\/p>\n<p>Earthquakes may be brought on according to this philosophy by two general causes; <em>first<\/em>, subsidence or elevation under the earth-crust due to heat and steam, <em>second<\/em>, electrical and magnetic changes which affect water and earth at the same time. These last have the power to instantaneously make the earth fluidic without melting it, thus causing immense and violent displacements in large or small waves. And this effect is sometimes seen now in earthquake districts when similar electrical causes are at work in a smaller measure.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 168, "pdf_page_number": 169, "html": "<p>Floods of general extent are caused by displacement of water from the subsidence or elevation of land, and by those combined with electrical change which induces a copious discharge of moisture. The latter is not a mere emptying of a cloud, but a sudden turning of vast bodies of fluids and solids into water.<\/p>\n<p>Universal fires come on from electrical and magnetic changes in the atmosphere by which the moisture is withdrawn from the air and the latter turned into a fiery mass; and, secondly, by the sudden expansion of the solar magnetic center into seven such centers, thus burning the globe.<\/p>\n<p>Ice cataclysms come on not only from the sudden alteration of the poles but also from lowered temperature due to the alteration of the warm fluid currents in the sea and the hot magnetic currents in the earth, the first being known to science, the latter not. The lower stratum of moisture is suddenly frozen, and vast tracts of land covered in a night with many feet of ice. This can easily happen to the British Isles if the warm currents of the ocean are diverted from its shores.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 169, "pdf_page_number": 170, "html": "<p>Both Egyptians and Greeks had their cycles, but in our opinion derived them from the Indian Sages. The Chinese always were a nation of astronomers, and have recorded observations reaching far back of the Christian era, but as they belong to an old race which is doomed to extinction — strange as the assertion may appear — their conclusions will not be correct for the Aryan races. On the coming of the Christian era a heavy pall of darkness fell on the minds of men in the West, and India was for many centuries isolated so as to preserve these great ideas during the mental night of Europe. This isolation was brought about deliberately as a necessary precaution taken by that great Lodge to which I adverted in Chapter I, because its Adepts, knowing the cyclic laws perfectly, wished to preserve philosophy for future generations. As it would be mere pedantry and speculation to discuss the unknown Saros and Naros and other cycles of the Egyptians, I will give the Brahmanical ones, since they tally almost exactly with the correct periods.<\/p>\n<p>A period or exhibition of universal manifestation is called a Brahmarandrha [in <em>The Path<\/em>, Nov., 1893, p. 259, Judge points out that this is a misprint for <em>Brahmanda<\/em>., that is a complete life of Brahma, and Brahma’s life is made of his days and years, which, being cosmical are each of immense duration. His day is as man’s 24 odd hours long, his year 360 odd days, the number of his years is 100.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 170, "pdf_page_number": 171, "html": "<p>Taking now this globe — since we are concerned with no other — its government and evolution proceed under <em>Manu<\/em> or <em>man<\/em> and from this is the term <em>Manvantara<\/em> or “between two <em>Manus<\/em>.” The course of evolution is divided into four <em>Yugas<\/em> for every race in its own time and way. These <em>Yugas<\/em> do not affect all mankind at one and the same time, as some races are in one of the <em>Yugas<\/em> while others are in a different cycle. The Red Indian, for instance, is in the end of his stone age, while the Aryans are in quite a different state. These four <em>Yugas<\/em> are: <em>Krita<\/em>, or <em>Satya<\/em>, the golden; <em>Treta; Dvapara<\/em>; and <em>Kali<\/em> or the black. The present age for the West and India is <em>Kali Yuga<\/em>, especially in respect to moral and spiritual development. The first of these is slow in comparison with the rest, and the present — <em>Kali<\/em> — is very rapid, its motion being accelerated precisely like certain astronomical periods known today in regard to the Moon, but not fully worked out.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 171, "pdf_page_number": 172, "html": "<p>The first 5000 years of <em>Kali Yuga<\/em> will end between the years 1897 and 1898. This <em>Yuga<\/em> began about 3102 years before the Christian era, at the time of Krishna’s death. As 1897-98 are not far off, the scientific men of today will have an opportunity of seeing whether the close of the five thousand year cycle will be preceded or followed by any convulsions or great changes political, scientific, or physical, or all of these combined. Cyclic changes are now proceeding as year after year the souls from prior civilizations are being incarnated in this period when liberty of thought and action are not so restricted in the West as they have been in the past by dogmatic religious prejudice and bigotry. And at the present time we are in a cycle of transition, when, as a transition period should indicate, everything in philosophy, religion, and society is changing. In a transition period the full and complete figures and rules respecting cycles are not given out to a generation which elevates money above all thoughts and scoffs at the spiritual view of man and nature.<\/p>", "images": [], "label": "14. Cycles (cont.)"}, {"pdf_page_index": 172, "pdf_page_number": 173, "html": "<h3 class=\"pdf-heading\">15. Differentiation of Species — Missing Links<\/h3>\n<p>Between Science and Theosophy there is a wide gulf, for the present unbridged, on the question of the origin of man and the differentiation of species. The teachers of religion in the West offer on this subject a theory, dogmatically buttressed by an assumed revelation, as impossible as the one put forward by scientific men. And yet the religious expounders are nearer than science to the truth. Under the religious superstition about Adam and Eve is hidden the truth, and in the tales of Cain, Seth, and Noah is vaguely shadowed the real story of the other races of men, Adam being but the representative of one single race. The people who received Cain and gave him a wife were some of those human races which had appeared simultaneously with the one headed by Adam.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links"}, {"pdf_page_index": 173, "pdf_page_number": 174, "html": "<p>The ultimate origin or beginning of man is not to be discovered, although we may know when and from where the men of this globe came. Man never was not. If not on this globe, then on some others, he ever was, and will ever be in existence somewhere in the Cosmos. Ever perfecting and reaching up to the image of the Heavenly Man, he is always becoming. But as the human mind cannot go back to any beginning, we shall start with this globe. Upon this earth and upon the whole chain of globes of which it is a part seven races of men appeared simultaneously, coming over to it from other globes of an older chain. And in respect to this earth — the fourth of this chain — these seven races came simultaneously from another globe of this chain. This appearance of seven races together happens in the first and in part of the second round of the globes. In the second round the seven masses of beings are amalgamated, and their destiny after that is to slowly differentiate during the succeeding rounds until at the seventh round the seven first great races will be once more distinct, as perfect types of the human race as this period of evolution will allow. At the present time the seven races are mixed together, and representatives of all are in the many so-called races of men as classified by our present science. The object of this amalgamation and subsequent differentiation is to give to every race the benefit of the progress and power of the whole derived from prior progress in other planets and systems. For Nature never does her work in a hasty or undue fashion, but, by the sure method of mixture, precipitation, and separation, brings about the greatest perfection. And this method was one known to the Alchemists, though not fully understood in all its bearings even by them.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 174, "pdf_page_number": 175, "html": "<p>Hence man did not spring from a single pair. Neither did he come from any tribe or family of monkey. It is hopeless to look to either religion or science for a solution of the question, for science is confused on her own admission, and religion is tangled with a revelation that in its books controverts the theory put forward by the priest. Adam is called the first man, but the record in which the story is found shows that other races of men must have existed on the earth before Cain could have founded a city. The Bible, then, does not support the single pair theory. If we take up one of the hypotheses of Science and admit for the moment that man and monkey differentiated from one ancestor, we have then to decide where the first ancestor came from. The first postulate of the Lodge on this subject is that seven races of men appeared simultaneously on the earth, and the first negative assumption is that man did not spring from a single pair or from the animal kingdom.<\/p>\n<p>The varieties of character and capacity which subsequently appear in man’s history are the forthcoming of the variations which were induced in the Egos in other and long anterior periods of evolution upon other chains of globes. These variations were so deeply impacted as to be equivalent to inherent characteristics. For the races of this globe the prior period of evolution was passed on the chain of globes of which our moon is the visible representative.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 175, "pdf_page_number": 176, "html": "<p>The burning question of the anthropoid apes as related to man is settled by the Masters of Wisdom, who say that instead of those being our progenitors they were produced by man himself. In one of the early periods of the globe the men of that time begot from large females of the animal kingdom the anthropoids, and in anthropoid bodies were caught a certain number of Egos destined one day to be men. The remainder of the descendants of the true anthropoid are the descendants of those illegitimate children of men, and will die away gradually, their Egos entering human bodies. Those half-ape and half-man bodies could not be ensouled by strictly animal Egos, and for that reason they are known to the Secret Doctrine as the “Delayed Race,” the only one not included in the fiat of Nature that no more Egos from the lower kingdoms will come into the human kingdom until the next <em>Manvantara<\/em>. But to all kingdoms below man except the anthropoids, the door is now closed for entry into the human stage, and the Egos in the subordinate forms must all wait their turn in the succeeding great Cycle. And as the delayed Egos of the Anthropoid family will emerge into the man stage later on, they will thus be rewarded for the long wait in that degraded race. All the other monkeys are products in the ordinary manner of the evolutionary processes.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 176, "pdf_page_number": 177, "html": "<p>On this subject I cannot do better than quote the words of one of those Masters of Wisdom, giving the esoteric anthropology from the secret volumes, thus:<\/p>\n<p>The anatomical resemblance between Man and the higher Ape, so frequently cited by Darwinists as pointing to some former ancestor common to both, presents an interesting problem, the proper solution of which is to be sought for in the esoteric explanation of the genesis of the pithecoid stocks. We have given it so far as was useful, by stating that the bestiality of the primeval mindless races resulted in the production of huge man-like monsters — the offspring of human and animal parents. As time rolled on, and the still semi-astral forms consolidated into the physical, the descendants of these creatures were modified by external conditions, until the breed, dwindling in size, culminated in the lower apes of the Miocene period. With these the later Atlanteans renewed the sin of the “Mindless” — this time with full responsibility. The resultants of their crime were the species of apes now known as the Anthropoid. . . .<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 177, "pdf_page_number": 178, "html": "<p>Let us remember in this connection the esoteric teaching which tells us of Man having had in the Third Round a GIGANTIC APE-LIKE FORM on the astral plane. And similarly at the close of the Third Race in this Round. Thus it accounts for the human features of the Apes, especially of the later Anthropoids, — apart from the fact that these latter preserved by <em>Heredity<\/em> a resemblance to their Atlanto-Lemurian sires.<\/p>\n<p>The same teachers furthermore assert that the mammalian types were produced in the fourth round, subsequent to the appearance of the human types. For this reason there was no barrier against fertility, because the root-types of those mammals were not far enough removed to raise the natural barrier. The unnatural union in the third race, when man had not yet had the light of <em>Manas<\/em> given to him, was not a crime against Nature, since, no mind being present save in the merest germ, no responsibility could attach. But in the fourth round, the light of <em>Manas<\/em> being present, the renewal of the act by the new race was a crime, because it was done with a full knowledge of the consequences and against the warning of conscience. The karmic effect of this, including as it does all races, has yet to be fully felt and understood — at a much later day than now.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 178, "pdf_page_number": 179, "html": "<p>As man came to this globe from another planet, though of course then a being of very great power before being completely enmeshed in matter, so the lower kingdoms came likewise in germ and type from other planets, and carry on their evolution step by step upward by the aid of man, who is, in all periods of manifestation, at the front of the wave of life. The Egos in these lower kingdoms could not finish their evolution in the preceding globe-chain before its dissolution, and coming to this they go forward age after age, gradually approaching nearer the man stage. One day they too will become men and act as the advance guard and guide for other lower kingdoms of this or other globes. And in the coming from the former planet there are always brought with the first and highest class of beings some forms of animal life, some fruits and other products, as models or types for use here. It will not be profitable to go into this here with particularity, for being too far ahead of the time it would evoke only ridicule from some and stupidity from others. But the general forms of the various kingdoms being so brought over, we have next to consider how the differentiation of animal and other lower species began and was carried on.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 179, "pdf_page_number": 180, "html": "<p>This is the point where intelligent aid and interference from a mind or mass of minds is absolutely necessary. Such aid and interference was and is the fact, for Nature unaided cannot do the work right. But I do not mean that God or angel interferes and aids. It is Man who does this. Not the man of the day, weak and ignorant as he is, but great souls, high and holy men of immense power, knowledge, and wisdom. Just such as every man would now know he could become, if it were not that religion on one hand and science on the other have painted such a picture of our weakness, inherent evil and purely material origin that nearly all men think they are puppets of God or cruel fate without hope, or remain with a degrading and selfish aim in view both here and after. Various names have been given to these beings now removed from our plane. They are the <em>Dhyanis<\/em>, the Creators, the Guides, the Great Spirits, and so on by many titles. In theosophical literature they are called the <em>Dhyanis<\/em>.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 180, "pdf_page_number": 181, "html": "<p>By methods known to themselves and to the Great Lodge they work on the forms so brought over, and by adding here, taking away there, and often altering, they gradually transform by such alteration and addition the kingdoms of nature as well as the gradually forming gross body of man. This process is carried on chiefly in the purely astral period preceding the gross physical stage, as the impulses thus given will surely carry themselves forward through the succeeding times. When the midway point of evolution is reached the species emerge on to the present stage and not showing the connection to the eye of man nor to our instruments. The investigations of the day have traced certain species down to a point where, as is confessed, it is not known to what root they go back. Taking oxen on one side and horses on the other, we see that both are hoofed, but one has a split hoof and the other but one toe. These bring us back, when we reach the oldest ancestor of each, to the midway point, and there science has to stop. At this spot the wisdom of the Masters comes in to show that back of this is the astral region of ancient evolution, where were the root-types in which the Dhyanis began the evolution by alteration and addition which resulted in the differentiation afterwards on this gross plane into the various families, species, and genera.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 181, "pdf_page_number": 182, "html": "<p>A vast period of time, about 300,000,000 years, was passed by earth and man and all the kingdoms of nature in an astral stage. Then there was no gross matter such as we now know. This was in the early rounds when Nature was proceeding slowly with the work of perfecting the types on the astral plane, which is matter, though very fine in its texture. At the end of that stretch of years the process of hardening began, the form of man being the first to become solid, and then some of the astral prototypes of the preceding rounds were involved in the solidification, though really belonging to a former period when everything was astral. When those fossils are discovered it is argued that they must be those of creatures which co-existed with the gross physical body of man.<\/p>\n<p>While that argument is proper enough under the other theories of Science, it becomes only an assumption if the existence of the astral period be admitted. It would be beyond the scope of this work to go further into particulars. But it may incidentally be said that neither the bee nor the wheat could have had their original differentiation in this chain of globes, but must have been produced and finished in some other from which they were brought over into this. Why this should be so I am willing to leave for the present to conjecture.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 182, "pdf_page_number": 183, "html": "<p>To the whole theory it may be objected that Science has not been able to find the missing links between the root-types of the astral period and the present fossils or living species. In the year 1893 at Moscow Professor Virchow said in a lecture that the missing link was as far off as ever, as much of a dream as ever, and that no real evidence was at hand to show man as coming from the animals. This is quite true, and neither class of missing link will be discovered by Science under her present methods. For all of them exist in the astral plane and therefore are invisible to the physical eye. They can only be seen by the inner astral senses, which must first be trained to do their work properly, and until Science admits the existence of the astral and inner senses she will never try to develop them. Always, then, Science will be without the instruments for discovering the astral links left on the astral plane in the long course of differentiation. The fossils spoken of above, which were, so to say, solidified out of date, form an exception to the impossibility of finding any missing links, but they are blind alleys to Science because she admits none of the necessary facts.<\/p>\n<p>The object of all this differentiation, amalgamation, and separation is well stated by another of the Masters, thus:<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 183, "pdf_page_number": 184, "html": "<p>Nature consciously prefers that matter should be indestructible under organic rather than inorganic forms; and that she works slowly but incessantly towards the realization of this object — the evolution of conscious life out of inert material.<\/p>", "images": [], "label": "15. Differentiation of Species — Missing Links (cont.)"}, {"pdf_page_index": 184, "pdf_page_number": 185, "html": "<h3 class=\"pdf-heading\">16. Psychic Laws, Forces, and Phenomena<\/h3>\n<p>The field of psychic forces, phenomena, and dynamics is a vast one. Such phenomena are seen and the forces exhibited every day in all lands, but until a few years ago very little attention was given to them by scientific persons, while a great deal of ridicule was heaped upon those who related the occurrences or averred belief in the psychic nature. A cult sprang up in the United States some forty years ago calling itself quite wrongly “spiritualism,” but having a great opportunity it neglected it and fell into mere wonder-seeking without the slightest shadow of a philosophy. It has accomplished but little in the way of progress except a record of many undigested facts which for four decades failed to attract the serious attention of people in general. While it has had its uses, and includes in its ranks many good minds, the great dangers and damages coming to the human instruments involved and to those who sought them more than offset the good done in the opinion of those disciples of the Lodge who would have man progress evenly and without ruin along his path of evolution. But other Western investigators of the accepted schools have not done much better, and the result is that there is no Western Psychology worthy of the name.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena"}, {"pdf_page_index": 185, "pdf_page_number": 186, "html": "<p>This lack of an adequate system of Psychology is a natural consequence of the materialistic bias of science and the paralyzing influence of dogmatic religion; the one ridiculing effort and blocking the way, the other forbidding investigation. The Roman Catholic branch of the Christian Church is in some respects an exception, however. It has always admitted the existence of the psychic world — for it the realm of devils and angels, but as angels manifest when they choose and devils are to be shunned, no one is permitted by that Church to meddle in such matters except an authorized priest. So far as that Church’s prohibiting the pernicious practice of necromancy indulged in by “spiritualists” it was right, but not in its other prohibitions and restrictions. Real psychology is an Oriental product today. Very true the system was known in the West when a very ancient civilization flourished in America, and in certain parts of Europe anterior to the Christian era, but for the present day psychology in its true phase belongs to the Orient.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 186, "pdf_page_number": 187, "html": "<p>Are there psychic forces, laws, and powers? If there are, then there must be the phenomena. And if all that has been outlined in preceding chapters is true, then in man are the same powers and forces which are to be found anywhere in Nature. He is held by the Masters of Wisdom to be the highest product of the whole system of evolution, and mirrors in himself every power, however wonderful or terrible, of Nature; by the very fact of being such a mirror he is man.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 187, "pdf_page_number": 188, "html": "<p>This has long been recognized in the East, where the writer has seen exhibitions of such powers which would upset the theories of many a Western man of science. And in the West the same phenomena have been repeated for the writer, so that he knows of his own knowledge that every man of every race has the same powers potentially. The genuine psychic — or, as they are often called, magical — phenomena done by the Eastern faqir or yogee are all performed by the use of natural forces and processes not even dreamed of as yet by the West. Levitation of the body in apparent defiance of gravitation is a thing to be done with ease when the process is completely mastered. It contravenes no law. Gravitation is only half of a law. The Oriental sage admits gravity, if one wishes to adopt the term; but the real term is attraction, the other half of the law being expressed by the word repulsion, and both being governed by the great laws of electrical force. Weight and stability depend on polarity, and when the polarity of an object is altered in respect to the earth immediately underneath it, then the object may rise. But as mere objects are devoid of the consciousness found in man, they cannot rise without certain other aids. The human body, however, will rise in the air unsupported, like a bird, when its polarity is thus changed. This change is brought about consciously by a certain system of breathing known to the Oriental; it may be induced also by aid from certain natural forces spoken of later, in the cases of those who without knowing the law perform the phenomena, as with the saints of the Roman Catholic Church.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 188, "pdf_page_number": 189, "html": "<p>A third great law which enters into many of the phenomena of the East and West is that of Cohesion. The power of Cohesion is a distinct power of itself, and not a result as is supposed. This law and its action must be known if certain phenomena are to be brought about, as, for instance, what the writer has seen, the passing of one solid iron ring through another, or a stone through a solid wall. Hence another force is used which can only be called dispersion. Cohesion is the dominating force, for, the moment the dispersing force is withdrawn, the cohesive force restores the particles to their original position.<\/p>\n<p>Following this out the Adept in such great dynamics is able to disperse the atoms of an object — excluding always the human body — to such a distance from each other as to render the object invisible, and then can send them along a current formed in the ether to any distance on the earth. At the desired point the dispersing force is withdrawn, when immediately cohesion reasserts itself and the object reappears intact. This may sound like fiction, but being known to the Lodge and its disciples as an actual fact, it is equally certain that Science will sooner or later admit the proposition.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 189, "pdf_page_number": 190, "html": "<p>But the lay mind infested by the materialism of the day wonders how all these manipulations are possible, seeing that no instruments are spoken of. The instruments are in the body and brain of man. In the view of the Lodge “the human brain is an exhaustless generator of force,” and a complete knowledge of the inner chemical and dynamic laws of Nature, together with a trained mind, give the possessor the power to operate the laws to which I have referred. This will be man’s possession in the future, and would be his today were it not for blind dogmatism, selfishness, and materialistic unbelief. Not even the Christian lives up to his Master’s very true statement that if one had faith he could remove a mountain. A knowledge of the law when added to faith gives power over matter, mind, space, and time.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 190, "pdf_page_number": 191, "html": "<p>Using the same powers, the trained Adept can produce before the eye, objective to the touch, material which was not visible before, and in any desired shape. This would be called creation by the vulgar, but it is simply evolution in your very presence. Matter is held suspended in the air about us. Every particle of matter, visible or still unprecipitated, has been through all possible forms, and what the Adept does is to select any desired form, existing, as they all do, in the Astral Light and then by effort of the Will and Imagination to clothe the form with the matter by precipitation. The object so made will fade away unless certain other processes are resorted to which need not be here described, but if these processes are used the object will remain permanently. And if it is desired to make visible a message on paper or other surface, the same laws and powers are used. The distinct — photographically and sharply definite — image of every line of every letter or picture is formed in the mind, and then out of the air is drawn the pigment to fall within the limits laid down by the brain, “the exhaustless generator of force and form.” All these things the writer has seen done in the way described, and not by any hired or irresponsible medium, and he knows whereof he speaks.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 191, "pdf_page_number": 192, "html": "<p>This, then, naturally leads to the proposition that the human Will is all powerful and the Imagination is a most useful faculty with a dynamic force. The Imagination is the picture-making power of the human mind. In the ordinary average human person it has not enough training or force to be more than a sort of dream, but it may be trained. When trained it is the Constructor in the Human Workshop. Arrived at that stage it makes a matrix in the Astral substance through which effects objectively will flow. It is the greatest power, after Will, in the human assemblage of complicated instruments. The modern Western definition of Imagination is incomplete and wide of the mark. It is chiefly used to designate fancy or misconception and at all times stands for unreality. It is impossible to get another term as good because one of the powers of the trained Imagination is that of making an image. The word is derived from those signifying the formation or reflection of an image. This faculty used, or rather suffered to act, in an unregulated mode has given the West no other idea than that covered by “fancy.” So far as that goes it is right but it may be pushed to a greater limit, which, when reached causes the Imagination to evolve in the Astral substance an actual image or form which may be then used in the same way as an iron molder uses a mold of sand for the molten iron. It is therefore the King faculty, inasmuch as the Will cannot do its work if the Imagination be at all weak or untrained. For instance, if the person desiring to precipitate from the air wavers in the least with the image made in the Astral substance, the pigment will fall upon the paper in a correspondingly wavering and diffused manner.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 192, "pdf_page_number": 193, "html": "<p>To communicate with another mind at any distance the Adept attunes all the molecules of the brain and all the thoughts of the mind so as to vibrate in unison with the mind to be affected, and that other mind and brain have also to be either voluntarily thrown into the same unison or fall into it voluntarily. So though the Adept be at Bombay and his friend in New York, the distance is no obstacle, as the inner senses are not dependent on an ear, but may feel and see the thoughts and images in the mind of the other person.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 193, "pdf_page_number": 194, "html": "<p>And when it is desired to look into the mind and catch the thoughts of another and the pictures all around him of all he has thought and looked at, the Adept’s inner sight and hearing are directed to the mind to be seen, when at once all is visible. But, as said before, only a rogue would do this, and the Adepts do not do it except in strictly authorized cases. The modern man sees no misdemeanor in looking into the secrets of another by means of this power, but the Adepts say it is an invasion of the rights of the other person. No man has the right, even when he has the power in his hand, to enter into the mind of another and pick out its secrets. This is the law of the Lodge to all who seek, and if one sees that he is about to discover the secrets of another he must at once withdraw and proceed no further. If he proceeds his power is taken from him in the case of a disciple; in the case of any other person he must take the consequence of this sort of burglary. For Nature has her laws and her policemen, and if we commit felonies in the Astral world the great Law and the guardians of it, for which no bribery is possible, will execute the penalty, no matter how long we wait, even if it be for ten thousand years. Here is another safeguard for ethics and morals. But until men admit the system of philosophy put forward in this book, they will not deem it wrong to commit felonies in fields where their weak human law has no effect, but at the same time by thus refusing the philosophy they will put off the day when all may have these great powers for the use of all.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 194, "pdf_page_number": 195, "html": "<p>Among phenomena useful to notice are those consisting of the moving of objects without physical contact. This may be done, and in more than one way. The first is to extrude from the physical body the Astral hand and arm, and with those grasp the object to be moved. This may be accomplished at a distance of as much as ten feet from the person. I do not go into argument on this, only referring to the properties of the Astral substance and members. This will serve to some extent to explain several of the phenomena of mediums. In nearly all cases of such apportation the feat is accomplished by thus using the unseen but material Astral hand. The second method is to use the elementals of which I have spoken. They have the power when directed by the inner man to carry objects by changing the polarity, and then we see, as with the fakirs of India and some mediums in America, small objects moving apparently unsupported. These elemental entities are used when things are brought from longer distances than the length to which the Astral members may be stretched. It is no argument against this that mediums do not know they do so. They rarely if ever know anything about how they accomplish any feat, and their ignorance of the law is no proof of its non-existence. Those students who have seen the forces work from the inside will need no argument on this.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 195, "pdf_page_number": 196, "html": "<p>Clairvoyance, clairaudience, and second-sight are all related very closely. Every exercise of any one of them draws in at the same time both of the others. They are but variations of one power. Sound is one of the distinguishing characteristics of the Astral sphere, and as light goes with sound, sight obtains simultaneously with hearing. To see an image with the Astral senses means that at the same time there is a sound, and to hear the latter infers the presence of a related image in Astral substance. It is perfectly well known to the true student of occultism that every sound produces instantaneously an image, and this, so long known in the Orient, has lately been demonstrated in the West in the production to the eye of sound pictures on a stretched tympanum. This part of the subject can be gone into very much further with the aid of occultism, but as it is a dangerous one in the present state of society I refrain at this point. In the Astral Light are pictures of all things whatsoever that happened to any person, and as well also pictures of those events to come the causes for which are sufficiently well marked and made. If the causes are yet indefinite, so will be the images of the future. But for the mass of events for several years to come all the producing and efficient causes are always laid down with enough definiteness to permit the seer to see them in advance as if present. By means of these pictures, seen with the inner senses, all clairvoyants exercise their strange faculty. Yet it is a faculty common to all men, though in the majority but slightly developed; but occultism asserts that were it not for the germ of this power slightly active in every one no man could convey to another any idea whatsoever.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 196, "pdf_page_number": 197, "html": "<p>In clairvoyance the pictures in the Astral Light pass before the inner vision and are reflected into the physical eye from within. They then appear objectively to the seer. If they are of past events or those to come, the picture only is seen; if of events actually then occurring, the scene is perceived through the Astral Light by the inner sense. The distinguishing difference between ordinary and clairvoyant vision is, then, that in clairvoyance with waking sight the vibration is communicated to the brain first, from which it is transmitted to the physical eye, where it sets up an image upon the retina, just as the revolving cylinder of the phonograph causes the mouthpiece to vibrate exactly as the voice had vibrated when thrown into the receiver. In ordinary eye vision the vibrations are given to the eye first and then transmitted to the brain. Images and sounds are both caused by vibrations, and hence any sound once made is preserved in the Astral Light from whence the inner sense can take it and from within transmit it to the brain, from which it reaches the physical ear. So in clairaudience at a distance the hearer does not hear with the ear, but with the center of hearing in the Astral body. Second-sight is a combination of clairaudience and clairvoyance or not, just as the particular case is, and the frequency with which future events are seen by the second-sight seer adds an element of prophecy.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 197, "pdf_page_number": 198, "html": "<p>The highest order of clairvoyance — that of spiritual vision — is very rare. The usual clairvoyant deals only with the ordinary aspects and strata of the Astral matter. Spiritual sight comes only to those who are pure, devoted, and firm. It may be attained by special development of the particular organ in the body through which alone such sight is possible, and only after discipline, long training, and the highest altruism. All other clairvoyance is transitory, inadequate, and fragmentary, dealing, as it does, only with matter and illusion. Its fragmentary and inadequate character results from the fact that hardly any clairvoyant has the power to see into more than one of the lower grades of Astral substance at any one time. The pure-minded and the brave can deal with the future and the present far better than any clairvoyant. But as the existence of these two powers proves the presence in us of the inner senses and of the necessary medium — the Astral Light, they have, as such human faculties, an important bearing upon the claims made by the so-called “spirits” of the <em>seance<\/em> room.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 198, "pdf_page_number": 199, "html": "<p>Dreams are sometimes the result of brain action automatically proceeding, and are also produced by the transmission into the brain by the real inner person of those scenes or ideas high or low which that real person has seen while the body slept. They are then strained into the brain as if floating on the soul as it sinks into the body. These dreams may be of use, but generally the resumption of bodily activity destroys the meaning, perverts the image, and reduces all to confusion. But the great fact of all dreaming is that some one perceives and feels therein, and this is one of the arguments for the inner person’s existence. In sleep the inner man communes with higher intelligences, and sometimes succeeds in impressing the brain with what is gained, either a high idea or a prophetic vision, or else fails in consequence of the resistance of brain fiber. The karma of the person also determines the meaning of a dream, for a king may dream that which relates to his kingdom, while the same thing dreamed by a citizen relates to nothing of temporal consequence. But, as said by Job: In dreams and visions of the night man is instructed.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 199, "pdf_page_number": 200, "html": "<p>Apparitions and doubles are of two general classes. The one, astral shells or images from the astral world, either actually visible to the eye or the result of vibration within thrown out to the eye and thus making the person think he sees an objective form without. The other, the astral body of living persons and carrying full consciousness or only partially so endowed. Laborious attempts by Psychical Research Societies to prove apparitions without knowing these laws really prove nothing, for out of twenty admitted cases nineteen may be the objectivization of the image impressed on the brain. But that apparitions have been seen there is no doubt. Apparitions of those just dead may be either pictures made objective as described, or the Astral Body — called <em>Kama Rupa<\/em> at this stage — of the deceased. And as the dying thoughts and forces released from the body are very strong, we have more accounts of such apparitions than of any other class.<\/p>\n<p>The Adept may send out his apparition, which, however, is called by another name, as it consists of his conscious and trained astral body endowed with all his intelligence and not wholly detached from his physical frame.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 200, "pdf_page_number": 201, "html": "<p>Theosophy does not deny nor ignore the physical laws discovered by science. It admits all such as are proven, but it asserts the existence of others which modify the action of those we ordinarily know. Behind all the visible phenomena is the occult cosmos with its ideal machinery; that occult cosmos can only be fully understood by means of the inner senses which pertain to it; those senses will not be easily developed if their existence is denied. Brain and mind acting together have the power to evolve forms, first as astral ones in astral substance, and later as visible ones by accretions of the matter on this plane. Objectivity depends largely on perception, and perception may be affected by inner stimuli. Hence a witness may either see an object which actually exists as such without, or may be made to see one by internal stimulus. This gives us three modes of sight: (<em>a<\/em>) with the eye by means of light from an object, (<em>b<\/em>) with the inner senses by means of the Astral Light, and (<em>c<\/em>) by stimulus from within which causes the eye to report to the brain, thus throwing the inner image without. The phenomena of the other senses may be tabulated in the same manner.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 201, "pdf_page_number": 202, "html": "<p>The Astral substance being the register of all thoughts, sounds, pictures, and other vibrations, and the inner man being a complete person able to act with or without co-ordination with the physical, all the phenomena of hypnotism, clairvoyance, clairaudience, mediumship, and the rest of those which are not consciously performed may be explained. In the Astral substance are all sounds and pictures, and in the Astral man remain impressions of every event, however remote or insignificant; these acting together produce the phenomena which seem so strange to those who deny or are unaware of the postulates of occultism.<\/p>\n<p>But to explain the phenomena performed by Adepts, Fakirs, Yogees, and all trained occultists, one has to understand the occult laws of chemistry, of mind, of force, and of matter. These it is obviously not the province of such a work as this to treat in detail.<\/p>", "images": [], "label": "16. Psychic Laws, Forces, and Phenomena (cont.)"}, {"pdf_page_index": 202, "pdf_page_number": 203, "html": "<h3 class=\"pdf-heading\">17. Psychic Phenomena and Spiritualism<\/h3>\n<p>In the history of psychical phenomena the records of so-called “spiritualism” in Europe, America, and elsewhere hold an important place. Advisedly I say that no term was ever more misapplied than that of “spiritualism” to the cult in Europe and America just mentioned, inasmuch as there is nothing of the spirit about it. The doctrines given in preceding chapters are those of true spiritualism; the misnamed practises of modern mediums and so-called spiritists constitute the Worship of the Dead, old-fashioned necromancy, in fact, which was always prohibited by spiritual teachers. They are a gross materializing of the spiritual idea, and deal with matter more than with its opposite. This cult is supposed by some to have originated about forty years ago in America at Rochester, N. Y., under the mediumship of the Fox sisters, but it was known in Salem during the witchcraft excitement, and in Europe one hundred years ago the same practises were pursued, similar phenomena seen, mediums developed, and <em>seances<\/em> held. For centuries it has been well known in India where it is properly designated “bhuta worship,” meaning the attempt to communicate with the devil or Astral remnants of deceased persons. This should be its name here also, for by it the gross and devilish, or earthly, parts of man are excited, appealed to, and communicated with. But the facts of the long record of forty years in America demand a brief examination. These facts all studious Theosophists must admit. The theosophical explanation and deductions, however, are totally different from those of the average spiritualist. A philosophy has not been evolved in the ranks or literature of spiritualism; nothing but theosophy will give the true explanation, point out defects, reveal dangers, and suggest remedies.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism"}, {"pdf_page_index": 203, "pdf_page_number": 204, "html": "<p>As it is plain that clairvoyance, clairaudience, thought-transference, prophecy, dream and vision, levitation, apparitional appearance, are all powers that have been known for ages, the questions most pressing in respect to spiritualism are those relating to communication with the souls of those who have left this earth and are now disembodied, and with unclassified spirits who have not been embodied here but belong to other spheres. Perhaps also the question of materialization of forms at <em>seances<\/em> deserves some attention. Communication includes trance-speaking, slate and other writing, independent voices in the air, speaking through the physical vocal organs of the medium, and precipitation of written messages out of the air. Do the mediums communicate with the spirits of the dead? Do our departed friends perceive the state of life they have left, and do they sometimes return to speak to and with us?<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 204, "pdf_page_number": 205, "html": "<p>The answers are intimated in foregoing chapters. Our departed do not see us here. They are relieved from the terrible pang such a sight would inflict. Once in a while a pure-minded, unpaid medium may ascend in trance to the state in which a deceased soul is, and may remember some bits of what was there heard; but this is rare. Now and then in the course of decades some high human spirit may for a moment return and by unmistakable means communicate with mortals. At the moment of death the soul may speak to some friend on earth before the door is finally shut. But the mass of communications alleged as made day after day through mediums are from the astral unintelligent remains of men, or in many cases entirely the production of, invention, compilation, discovery, and collocation by the loosely attached Astral body of the living medium.<\/p>\n<p>Certain objections arise to the theory that the spirits of the dead communicate. Some are:<\/p>\n<p>I. At no time have these spirits given the laws governing any of the phenomena, except in a few instances, not accepted by the cult, where the theosophical theory was advanced. As it would destroy such structures as those erected by A. J. Davis, these particular spirits fell into discredit.<\/p>\n<p>II. The spirits disagree among themselves, one stating the after-life to be very different from the description by another. These disagreements vary with the medium and the supposed theories of the deceased during life. One spirit admits reincarnation and others deny it.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 205, "pdf_page_number": 206, "html": "<p>III. The spirits have discovered nothing in respect to history, anthropology, or other important matters, seeming to have less ability in that line than living men; and although they often claim to be men who lived in older civilizations, they show ignorance thereupon or merely repeat recently published discoveries.<\/p>\n<p>IV. In these forty y
