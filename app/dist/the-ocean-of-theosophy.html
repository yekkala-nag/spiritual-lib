<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ocean of Theosophy</title>
<style>
/* ============ Design tokens ============
   Palette: parchment cream #F7F1E3, ink #2E2A24, gilt gold #B8963E,
            deep violet accent (devotion) #6B5691, rose accent (affection) #C1567B,
            soft border #E4D9BE
   Type: display "Cormorant Garamond" (Victorian book serif), body "EB Garamond",
         utility/caption "Cormorant" small caps
   Layout: single centered "book leaf" card, aurora/aura corner glow, page-turn transitions
   Signature: an animated soft-glowing aura halo behind the folio number, echoing the
   book's own theme of radiating thought-vibrations.
*/
:root{
  --parchment:#F7F1E3;
  --parchment-2:#EFE6CE;
  --ink:#2E2A24;
  --ink-soft:#5A5346;
  --gold:#B8963E;
  --gold-soft:#D8C186;
  --violet:#6B5691;
  --rose:#C1567B;
  --border:#E1D3AA;
  --card:#FFFDF6;
  --shadow: 0 20px 60px -20px rgba(60,45,10,0.35), 0 2px 10px rgba(60,45,10,0.08);
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #f3e8c9 0%, transparent 60%),
    radial-gradient(ellipse 900px 600px at 110% 110%, #ecdcc0 0%, transparent 55%),
    var(--parchment);
  color:var(--ink);
  font-family: "EB Garamond", "Cormorant Garamond", Georgia, serif;
  min-height:100vh;
  overflow-x:hidden;
}
@font-face{
  font-family:'Cinzel-fallback'; src:local('Georgia');
}
.app{
  max-width:980px;
  margin:0 auto;
  padding:28px 20px 60px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- Header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:12px;
}
.brand .glyph{
  width:40px;height:40px;border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #fff6df 0%, var(--gold-soft) 45%, var(--gold) 100%);
  box-shadow: 0 0 18px 2px rgba(184,150,62,0.45), inset 0 0 6px rgba(255,255,255,0.6);
  flex-shrink:0;
}
.brand h1{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-weight:600;
  font-size:1.35rem;
  letter-spacing:0.04em;
  margin:0;
  color:var(--ink);
}
.brand p{
  margin:0; font-size:0.8rem; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--ink-soft); font-family: Georgia, serif;
}
.progress-wrap{
  display:flex; align-items:center; gap:10px;
  font-size:0.82rem; color:var(--ink-soft); letter-spacing:0.04em;
}
.progress-bar{
  width:150px; height:5px; border-radius:3px; background:var(--parchment-2);
  overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,0.08);
}
.progress-fill{
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--gold-soft), var(--gold));
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ---------- Table of contents rail ---------- */
.toc-toggle{
  border:1px solid var(--border); background:var(--card); color:var(--ink);
  border-radius:8px; padding:7px 14px; font-family:inherit; font-size:0.85rem;
  letter-spacing:0.05em; cursor:pointer; box-shadow:var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.toc-toggle:hover{ transform: translateY(-1px); }
.toc-panel{
  position:fixed; top:0; right:-360px; width:340px; height:100%;
  background:var(--card); border-left:1px solid var(--border);
  box-shadow:-20px 0 50px rgba(60,45,10,0.18);
  z-index:50; transition:right .35s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; padding:24px 18px 40px;
}
.toc-panel.open{ right:0; }
.toc-panel h2{
  font-family:"Cormorant Garamond",serif; font-size:1.1rem; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--gold); margin:0 0 14px;
  border-bottom:1px solid var(--border); padding-bottom:10px;
}
.toc-close{
  position:absolute; top:16px; right:16px; background:none; border:none;
  font-size:1.3rem; color:var(--ink-soft); cursor:pointer; line-height:1;
}
.toc-section{
  margin-bottom:6px;
}
.toc-section-title{
  font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--violet); margin:16px 0 6px; font-weight:600;
}
.toc-item{
  display:block; width:100%; text-align:left; background:none; border:none;
  padding:6px 8px; font-family:"EB Garamond",serif; font-size:0.95rem;
  color:var(--ink); cursor:pointer; border-radius:6px;
  transition: background .15s ease;
}
.toc-item:hover{ background:var(--parchment-2); }
.toc-item.active{
  background: linear-gradient(90deg, rgba(184,150,62,0.16), transparent);
  color:var(--gold); font-weight:600;
}
.scrim{
  position:fixed; inset:0; background:rgba(40,30,10,0.25); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.scrim.show{ opacity:1; pointer-events:auto; }

/* ---------- The book leaf / page card ---------- */
.stage{
  flex:1;
  display:flex; align-items:flex-start; justify-content:center;
  position:relative;
}
.leaf{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  width:100%;
  padding:46px 54px 40px;
  position:relative;
  min-height:420px;
  animation: fadeIn .5s ease;
}
.leaf::before{
  content:"";
  position:absolute; inset:10px;
  border:1px solid rgba(184,150,62,0.28);
  border-radius:8px;
  pointer-events:none;
}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
@media (max-width:700px){
  .leaf{ padding:30px 20px 28px; }
}

.eyebrow{
  font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--violet); margin:0 0 6px; font-weight:600;
}
.leaf h2.page-title{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:2rem; font-weight:600; margin:0 0 22px; color:var(--ink);
  line-height:1.15; border-bottom:2px solid var(--gold-soft); padding-bottom:14px;
}
.leaf .content p{
  font-size:1.09rem; line-height:1.75; margin:0 0 1.1em; color:var(--ink);
  text-align:justify; hyphens:auto;
}
.leaf .content p.footnote{
  font-size:0.92rem; color:var(--ink-soft); font-style:italic;
  border-left:2px solid var(--gold-soft); padding-left:14px;
}
.leaf .content p.signature{
  text-align:right; font-style:italic; letter-spacing:0.05em; color:var(--ink-soft);
}
.leaf .content p.printer-line{
  text-align:center; font-size:0.85rem; color:var(--ink-soft); letter-spacing:0.06em;
}
.leaf .content h3.subhead{
  font-family:"Cormorant Garamond",serif; font-size:1.15rem; color:var(--violet);
  margin:22px 0 10px; letter-spacing:0.03em;
}
.leaf .content ol.principles{ padding-left:1.4em; }
.leaf .content ol.principles li{ margin-bottom:6px; font-size:1.05rem; }

/* Title page flourishes */
.book-title{
  font-family:"Cormorant Garamond",serif; text-align:center; font-size:2.6rem;
  letter-spacing:0.12em; margin:18px 0 6px; color:var(--ink);
}
.book-authors{
  text-align:center; font-size:1.05rem; letter-spacing:0.1em; font-weight:400;
  color:var(--violet); margin:0 0 26px;
}
.pub-line{ text-align:center; font-size:0.78rem; color:var(--ink-soft); letter-spacing:0.04em; }
.pub-house{ text-align:center; font-size:0.95rem; color:var(--ink-soft); margin:8px 0 26px; line-height:1.6; }
.print-table{ margin:0 auto 26px; font-size:0.9rem; color:var(--ink-soft); border-collapse:collapse; }
.print-table td{ padding:2px 10px; }
.printer-line{ text-align:center; font-size:0.85rem; color:var(--ink-soft); margin-top:20px; line-height:1.6; }

/* Colour key table */
.key-table{ overflow-x:auto; margin:18px 0; }
.key-table table{ border-collapse:collapse; width:100%; font-size:0.88rem; }
.key-table th, .key-table td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
.key-table th{ background:var(--parchment-2); color:var(--gold); width:28px; text-align:center; }
.caption-label{ text-align:center; letter-spacing:0.1em; text-transform:uppercase; font-size:0.85rem; color:var(--ink-soft); }

/* TOC / illustrations tables */
.toc-table, .toc-table.small{ width:100%; border-collapse:collapse; font-size:0.98rem; }
.toc-table td{ padding:5px 6px; border-bottom:1px dotted var(--border); }
.toc-table td:last-child{ text-align:right; color:var(--ink-soft); width:80px; }
.toc-table tr.indent td:first-child{ padding-left:22px; }
.toc-table tr.indent2 td:first-child{ padding-left:44px; font-style:italic; }
.toc-table.small td{ font-size:0.88rem; }
.illus-note{ margin-bottom:14px; }
.illus-note p{ font-size:0.85rem; color:var(--ink-soft); font-style:italic; }

/* ---------- Images / figure gallery ---------- */
.figures{
  display:flex; flex-wrap:wrap; gap:22px; margin:26px 0 10px; justify-content:center;
}
.figure-card{
  background:var(--parchment-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  max-width:360px;
  flex:1 1 260px;
  text-align:center;
  box-shadow: 0 8px 22px -12px rgba(60,45,10,0.25);
}
.figure-card img{
  max-width:100%; height:auto; border-radius:5px;
  border:1px solid rgba(0,0,0,0.08);
  background:#111;
  cursor:zoom-in;
  transition: transform .25s ease;
}
.figure-card img:hover{ transform:scale(1.015); }
.figure-cap{
  margin-top:9px; font-size:0.85rem; color:var(--ink-soft);
  font-style:italic; letter-spacing:0.02em;
}

/* Lightbox */
.lightbox{
  position:fixed; inset:0; background:rgba(20,15,5,0.82);
  display:none; align-items:center; justify-content:center; z-index:100;
  padding:30px;
}
.lightbox.open{ display:flex; }
.lightbox img{ max-width:100%; max-height:85vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.lightbox-close{
  position:absolute; top:22px; right:28px; background:none; border:none;
  color:#f6ecd2; font-size:2rem; cursor:pointer; line-height:1;
}

/* ---------- Footer nav ---------- */
nav.pager{
  position:sticky; bottom:0;
  margin-top:26px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:linear-gradient(180deg, rgba(247,241,227,0) 0%, var(--parchment) 30%);
  padding-top:18px;
}
.pager-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border); color:var(--ink);
  padding:11px 20px; border-radius:10px; font-family:inherit; font-size:0.95rem;
  cursor:pointer; box-shadow:var(--shadow); letter-spacing:0.02em;
  transition: transform .15s ease, opacity .15s ease;
}
.pager-btn:hover:not(:disabled){ transform:translateY(-2px); }
.pager-btn:disabled{ opacity:0.35; cursor:default; }
.pager-btn.next{ background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:#3a2c08; border:none; }
.folio{
  position:relative;
  font-family:"Cormorant Garamond",serif; font-size:0.95rem; color:var(--ink-soft);
  text-align:center; letter-spacing:0.05em;
}
.folio .halo{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:70px; height:70px; border-radius:50%;
  background: radial-gradient(circle, rgba(184,150,62,0.30) 0%, transparent 70%);
  animation: pulse 3.2s ease-in-out infinite;
  z-index:-1;
}
@keyframes pulse{
  0%,100%{ transform:translate(-50%,-50%) scale(0.9); opacity:0.5; }
  50%{ transform:translate(-50%,-50%) scale(1.25); opacity:0.9; }
}

@media (prefers-reduced-motion: reduce){
  .leaf{ animation:none; }
  .folio .halo{ animation:none; }
}

/* PDF-exact content classes */
.leaf .content h3.pdf-heading{
  font-family:"Cormorant Garamond",serif; font-size:1.2rem; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--violet); margin:20px 0 10px;
}
.leaf .content p.pdf-caption{
  font-size:0.92rem; letter-spacing:0.05em; text-transform:uppercase;
  color:var(--gold); text-align:center; font-weight:600; margin:16px 0 10px;
}
.leaf .content p.empty-note{
  text-align:center; color:var(--ink-soft); font-size:1rem; padding:30px 0;
}

/* section pill on top of card */
.section-pill{
  position:absolute; top:-13px; left:50px;
  background:linear-gradient(135deg, var(--violet), #8875ac);
  color:#fff; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:5px 14px; border-radius:20px; box-shadow:0 6px 14px -6px rgba(107,86,145,0.6);
}
@media (max-width:700px){
  .section-pill{ left:20px; }
}

/* ---------- Read aloud ---------- */
.listen-bar{
  display:none; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 18px; margin-bottom:16px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); font-family:Georgia, serif; font-size:0.85rem;
}
.listen-bar.open{ display:flex; }
.listen-bar button{
  font-family:inherit; font-size:0.85rem; padding:7px 14px; border-radius:999px;
  border:1px solid var(--gold); background:linear-gradient(180deg,#fffdf6,#f3ead2);
  color:var(--ink); cursor:pointer; letter-spacing:0.02em;
}
.listen-bar button:hover:not(:disabled){ background:var(--gold); color:#fff; }
.listen-bar button:disabled{ opacity:0.45; cursor:default; }
.listen-bar select{
  font-family:inherit; font-size:0.82rem; padding:6px 8px; border-radius:8px;
  border:1px solid var(--border); background:#fff; color:var(--ink);
  max-width:230px;
}
.listen-bar label{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); }
.listen-bar .status{ color:var(--ink-soft); font-style:italic; flex-basis:100%; }

.search-bar, .notes-panel { display:none; padding:10px 24px; background:#f8f3e7; border-bottom:1px solid #e3d8c3; align-items:center; gap:10px; flex-wrap:wrap; }
.search-bar.open, .notes-panel.open { display:flex; }
.search-bar input { flex:1; min-width:180px; padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; font-family:inherit; font-size:14px; color:#3a3227; }
.search-bar input:focus { outline:2px solid #b29a5b; }
.search-bar .sbtn { padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; cursor:pointer; font-family:inherit; font-size:13px; color:#3a3227; }
.search-bar .sbtn:hover { background:#f0e7d3; }
#search-info { font-size:13px; color:#7a6c50; white-space:nowrap; }
mark.search-hit { background:#ffe9a8; color:inherit; padding:0 1px; border-radius:2px; }
.notes-panel { display:none; }
.notes-panel.open { display:block; }
#notes-body { max-width:820px; margin:0 auto; font-size:14.5px; line-height:1.65; color:#3a3227; }
#notes-body h3 { font-size:15px; margin:0 0 8px; color:#5c4a1e; letter-spacing:0.02em; }
#notes-body h4 { font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:#8a744a; margin:14px 0 6px; }
#notes-body p { margin:0 0 10px; }
#notes-body ul { margin:0; padding-left:20px; }
#notes-body li { margin-bottom:5px; }
#notes-body .notes-empty { color:#8a7c62; font-style:italic; }
</style>
</head>

<script id="pages-data" type="application/json">[{"pdf_page_index": 0, "pdf_page_number": 1, "html": "<h3 class=\"pdf-heading\">THE OCEAN OF THEOSOPHY<\/h3>\n<h3 class=\"pdf-heading\">by WILLIAM Q. JUDGE<\/h3>\n<p class=\"empty-note\"><em>First published 1893. Complete text — Preface and seventeen chapters — presented as a reading edition in this library format.<\/em><\/p>", "images": [], "label": "Title"}, {"pdf_page_index": 1, "pdf_page_number": 2, "html": "<h3 class=\"pdf-heading\">Preface<\/h3>\n<p>An attempt is made in the pages of this book to write of theosophy in such a manner as to be understood by the ordinary reader. Bold statements are made in it upon the knowledge of the writer, but at the same time it is distinctly to be understood that he alone is responsible for what is therein written: the Theosophical Society is not involved in nor bound by anything said in the book, nor are any of its members any the less good Theosophists because they may not accept what I have set down. The tone of settled conviction which may be thought to pervade the chapters is not the result of dogmatism or conceit, but flows from knowledge based upon evidence and experience.<\/p>\n<p>Members of the Theosophical Society will notice that certain theories or doctrines have not been gone into. That is because they could not be treated without unduly extending the book and arousing needless controversy.<\/p>\n<p>The subject of the Will has received no treatment, inasmuch as that power or faculty is hidden, subtle, undiscoverable as to essence, and only visible in effect. As it is absolutely colorless and varies in moral quality in accordance with the desire behind it, as also it acts frequently without our knowledge, and as it operates in all the kingdoms below man, there could be nothing gained by attempting to enquire into it apart from the Spirit and the desire.<\/p>", "images": [], "label": "Preface"}, {"pdf_page_index": 2, "pdf_page_number": 3, "html": "<p>I claim no originality for this book. I invented none of it, discovered none of it, but have simply written that which I have been taught and which has been proved to me. It therefore is only a handing on of what has been known before.<\/p>\n<p>William Q. Judge<\/p>\n<p><em>New York, May,<\/em><em> <\/em><em>1893.<\/em><\/p>", "images": [], "label": "Preface (cont.)"}, {"pdf_page_index": 3, "pdf_page_number": 4, "html": "<h3 class=\"pdf-heading\">1. Theosophy And The Masters<\/h3>\n<p>Theosophy is that ocean of knowledge which spreads from shore to shore of the evolution of sentient beings; unfathomable in its deepest parts, it gives the greatest minds their fullest scope, yet, shallow enough at its shores, it will not overwhelm the understanding of a child. It is wisdom about God for those who believe that he is all things and in all, and wisdom about nature for the man who accepts the statement found in the Christian Bible that God cannot be measured or discovered, and that darkness is around his pavilion. Although it contains by derivation the name God and thus may seem at first sight to embrace religion alone, it does not neglect science, for it is the science of sciences and therefore has been called the wisdom religion. For no science is complete which leaves out any department of nature, whether visible or invisible, and that religion which, depending solely on an assumed revelation, turns away from things and the laws which govern them is nothing but a delusion, a foe to progress, an obstacle in the way of man’s advancement toward happiness. Embracing both the scientific and the religious, Theosophy is a scientific religion and a religious science.<\/p>", "images": [], "label": "1. Theosophy And The Masters"}, {"pdf_page_index": 4, "pdf_page_number": 5, "html": "<p>It is not a belief or dogma formulated or invented by man, but is a knowledge of the laws which govern the evolution of the physical, astral, psychical, and intellectual constituents of nature and of man. The religion of the day is but a series of dogmas man-made and with no scientific foundation for promulgated ethics; while our science as yet ignores the unseen, and failing to admit the existence of a complete set of inner faculties of perception in man, it is cut off from the immense and real field of experience which lies within the visible and tangible worlds. But Theosophy knows that the whole is constituted of the visible and the invisible, and perceiving outer things and objects to be but transitory it grasps the facts of nature, both without and within. It is therefore complete in itself and sees no unsolvable mystery anywhere; it throws the word coincidence out of its vocabulary and hails the reign of law in everything and every circumstance.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 5, "pdf_page_number": 6, "html": "<p>That man possesses an immortal soul is the common belief of humanity; to this Theosophy adds that he is a soul; and further that all nature is sentient, that the vast array of objects and men are not mere collections of atoms fortuitously thrown together and thus without law evolving law, but down to the smallest atom all is soul and spirit ever evolving under the rule of law which is inherent in the whole. And just as the ancients taught, so does Theosophy; that the course of evolution is the drama of the soul and that nature exists for no other purpose than the soul’s experience. The Theosophist agrees with Prof. Huxley in the assertion that there must be beings in the universe whose intelligence is as much beyond ours as ours exceeds that of the black beetle, and who take an active part in the government of the natural order of things. Pushing further on by the light of the confidence had in his teachers, the Theosophist adds that such intelligences were once human and came like all of us from other and previous worlds, where as varied experience had been gained as is possible on this one. We are therefore not appearing for the first time when we come upon this planet, but have pursued a long, an immeasurable course of activity and intelligent perception on other systems of globes, some of which were destroyed ages before the solar system condensed. This immense reach of the evolutionary system means, then, that this planet on which we now are is the result of the activity and the evolution of some other one that died long ago, leaving its energy to be used in the bringing into existence of the earth, and that the inhabitants of the latter in their turn came from some older world to proceed here with the destined work in matter. And the brighter planets, such as Venus, are the habitation of still more progressed entities, once as low as ourselves, but now raised up to a pitch of glory incomprehensible for our intellects.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 6, "pdf_page_number": 7, "html": "<p>The most intelligent being in the universe, man, has never, then, been without a friend, but has a line of elder brothers who continually watch over the progress of the less progressed, preserve the knowledge gained through aeons of trial and experience, and continually seek for opportunities of drawing the developing intelligence of the race on this or other globes to consider the great truths concerning the destiny of the soul. These elder brothers also keep the knowledge they have gained of the laws of nature in all departments, and are ready when cyclic law permits to use it for the benefit of mankind. They have always existed as a body, all knowing each other, no matter in what part of the world they may be, and all working for the race in many different ways. In some periods they are well known to the people and move among ordinary men whenever the social organization, the virtue, and the development of the nations permit it. For if they were to come out openly and be heard of everywhere, they would be worshipped as gods by some and hunted as devils by others. In those periods when they do come out some of their number are rulers of men, some teachers, a few great philosophers, while others remain still unknown except to the most advanced of the body.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 7, "pdf_page_number": 8, "html": "<p>It would be subversive of the ends they have in view were they to make themselves public in the present civilization, which is based almost wholly on money, fame, glory, and personality. For this age, as one of them has already said, “is an age of transition,” when every system of thought, science, religion, government, and society is changing, and men’s minds are only preparing for an alteration into that state which will permit the race to advance to the point suitable for these elder brothers to introduce their actual presence to our sight. They may be truly called the bearers of the torch of truth across the ages; they investigate all things and beings; they know what man is in his innermost nature and what his powers and destiny, his state before birth and the states into which he goes after the death of his body; they have stood by the cradle of nations and seen the vast achievements of the ancients, watched sadly the decay of those who had no power to resist the cyclic law of rise and fall; and while cataclysms seemed to show a universal destruction of art, architecture, religion, and philosophy, they have preserved the records of it all in places secure from the ravages of either men or time; they have made minute observations, through trained psychics among their own order, into the unseen realms of nature and of mind, recorded the observations and preserved the record; they have mastered the mysteries of sound and color through which alone the elemental beings behind the veil of matter can be communicated with, and thus can tell why the rain falls and what it falls for, whether the earth is hollow or not, what makes the wind to blow and light to shine, and greater feat than all — one which implies a knowledge of the very foundations of nature — they know what the ultimate divisions of time are and what are the meaning and the times of the cycles.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 8, "pdf_page_number": 9, "html": "<p>But, asks the busy man of the nineteenth century who reads the newspapers and believes in “modern progress,” if these elder brothers are all you claim them to be, why have they left no mark on history nor gathered men around them? Their own reply, published some time ago by Mr. A. P. Sinnett, is better than any I could write.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 9, "pdf_page_number": 10, "html": "<p>“We will first discuss, if you please, the one relating to the presumed failure of the ‘Fraternity’ to ‘leave any mark upon the history of the world.’ They ought, you think, to have been able, with their extraordinary advantages, to have ‘gathered into their schools a considerable portion of the more enlightened minds of every race.’ How do you know they have made no such mark? Are you acquainted with their efforts, successes, and failures? Have you any dock upon which to arraign them? How could your world collect proofs of the doings of men who have sedulously kept closed every possible door of approach by which the inquisitive could spy upon them? The prime condition of their success was that they should never be supervised or obstructed. What they have done they know; all that those outside their circle could perceive was results, the causes of which were masked from view. To account for these results, men have, in different ages, invented theories of the interposition of gods, special providences, fates, the benign or hostile influences of the stars. There never was a time within or before the so-called historical period when our predecessors were not moulding events and ‘making history,’ the facts of which were subsequently and invariably distorted by historians to suit contemporary prejudices. Are you quite sure that the visible heroic figures in the successive dramas were not often but their puppets? We never pretended to be able to draw nations in the mass to this or that crisis in spite of the general drift of the world’s cosmic relations. The cycles must run their rounds. Periods of mental and moral light and darkness succeed each other as day does night. The major and minor yugas must be accomplished according to the established order of things. And we, borne along on the mighty tide, can only modify and direct some of its minor currents.”<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 10, "pdf_page_number": 11, "html": "<p>It is under cyclic law, during a dark period in the history of mind, that the true philosophy disappears for a time, but the same law causes it to reappear as surely as the sun rises and the human mind is present to see it. But some works can only be performed by the Master, while other works require the assistance of the companions. It is the Master’s work to preserve the true philosophy, but the help of the companions is needed to rediscover and promulgate it. Once more the elder brothers have indicated where the truth — Theosophy — could be found, and the companions all over the world are engaged in bringing it forth for wider currency and propagation.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 11, "pdf_page_number": 12, "html": "<p>The Elder Brothers of Humanity are men who were perfected in former periods of evolution. These periods of manifestation are unknown to modern evolutionists so far as their number are concerned, though long ago understood by not only the older Hindus, but also by those great minds and men who instituted and carried on the first pure and undebased form of the Mysteries of Greece. The periods, when out of the Great Unknown there come forth the visible universes, are eternal in their coming and going, alternating with equal periods of silence and rest again in the Unknown. The object of these mighty waves is the production of perfect man, the evolution of soul, and they always witness the increase of the number of Elder Brothers; the life of the least of men pictures them in day and night, waking and sleeping, birth and death, “for these two, light and dark, day and night, are the world’s eternal ways.”<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 12, "pdf_page_number": 13, "html": "<p>In every age and complete national history these men of power and compassion are given different designations. They have been called Initiates, Adepts, Magi, Hierophants, Kings of the East, Wise Men, Brothers, and what not. But in the Sanskrit language there is a word which, being applied to them, at once thoroughly identifies them with humanity. It is Mahatma. This is composed of <em>Maha<\/em> great, and <em>Atma<\/em> soul; so it means great soul, and as all men are souls the distinction of the Mahatma lies in greatness. The term Mahatma has come into wide use through the Theosophical Society, as Mme. H. P. Blavatsky constantly referred to them as her Masters who gave her the knowledge she possessed. They were at first known only as the Brothers, but afterwards, when many Hindus flocked to the Theosophical movement, the name Mahatma was brought into use, inasmuch as it has behind it an immense body of Indian tradition and literature. At different times unscrupulous enemies of the Theosophical Society have said that even this name had been invented and that such beings are not known of among the Indians or in their literature. But these assertions are made only to discredit if possible a philosophical movement that threatens to completely upset prevailing erroneous theological dogmas. For all through Hindu literature Mahatmas are often spoken of, and in parts of the north of that country the term is common. In the very old poem the <em>Bhagavad-Gita<\/em>, revered by all Hindu sects and admitted by the western critics to be noble as well as beautiful, there is a verse reading, “Such a Mahatma is difficult to find.”<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 13, "pdf_page_number": 14, "html": "<p>But irrespective of all disputes as to specific names, there is sufficient argument and proof to show that a body of men having the wonderful knowledge described above has always existed and probably exists today. The older mysteries continually refer to them. Ancient Egypt had them in her great king-Initiates, sons of the sun and friends of great gods. There is a habit of belittling the ideas of the ancients which is in itself belittling to the people of today. Even the Christian who reverently speaks of Abraham as “the friend of God,” will scornfully laugh at the idea of the claims of Egyptian rulers to the same friendship being other than childish assumption of dignity and title. But the truth is, these great Egyptians were Initiates, members of the one great lodge which includes all others of whatever degree or operation. The later and declining Egyptians, of course, must have imitated their predecessors, but that was when the true doctrine was beginning once more to be obscured upon the rise of dogma and priesthood.<\/p>\n<p>The story of Apollonius of Tyana is about a member of one of the same ancient orders appearing among men at a descending cycle, and only for the purpose of keeping a witness upon the scene for future generations.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 14, "pdf_page_number": 15, "html": "<p>Abraham and Moses of the Jews are two other Initiates, Adepts who had their work to do with a certain people; and in the history of Abraham we meet with Melchizedek, who was so much beyond Abraham that he had the right to confer upon the latter a dignity, a privilege, or a blessing. The same chapter of human history which contains the names of Moses and Abraham is illuminated also by that of Solomon. And thus these three make a great Triad of Adepts, the record of whose deeds can not be brushed aside as folly and devoid of basis.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 15, "pdf_page_number": 16, "html": "<p>Moses was educated by the Egyptians and in Midian, from both of which he gained much occult knowledge, and any clear-seeing student of the great Universal Masonry can perceive all through his books the hand, the plan, and the work of a master. Abraham again knew all the arts and much of the power in psychical realms that were cultivated in his day, or else he could not have consorted with kings nor have been “the friend of God”; and the reference to his conversations with the Almighty in respect to the destruction of cities alone shows him to have been an Adept who had long ago passed beyond the need of ceremonial or other adventitious aids. Solomon completes this triad and stands out in characters of fire. Around him is clustered such a mass of legend and story about his dealings with the elemental powers and of his magic possessions that one must condemn the whole ancient world as a collection of fools who made lies for amusement if a denial is made of his being a great character, a wonderful example of the incarnation among men of a powerful Adept. We do not have to accept the name Solomon nor the pretense that he reigned over the Jews, but we must admit the fact that somewhere in the misty time to which the Jewish records refer there lived and moved among the people of the earth one who was an Adept and given that name afterwards. Peripatetics and microscopic critics may affect to see in the prevalence of universal tradition naught but evidence of the gullibility of men and their power to imitate, but the true student of human nature and life knows that the universal tradition is true and arises from the facts in the history of man.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 16, "pdf_page_number": 17, "html": "<p>Turning to India, so long forgotten and ignored by the lusty and egotistical, the fighting and the trading West, we find her full of the lore relating to these wonderful men of whom Noah, Abraham, Moses, and Solomon are only examples. There the people are fitted by temperament and climate to be the preservers of the philosophical, ethical, and psychical jewels that would have been forever lost to us had they been left to the ravages of such Goths and Vandals as western nations were in the early days of their struggle for education and civilization. If the men who wantonly burned up vast masses of historical and ethnological treasures found by the minions of the Catholic rulers of Spain, in Central and South America, could have known of and put their hands upon the books and palm-leaf records of India before the protecting shield of England was raised against them, they would have destroyed them all as they did for the Americans, and as their predecessors attempted to do for the Alexandrian library. Fortunately events worked otherwise.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 17, "pdf_page_number": 18, "html": "<p>All along the stream of Indian literature we can find the names by scores of great adepts who were well known to the people and who all taught the same story — the great epic of the human soul. Their names are unfamiliar to western ears, but the records of their thoughts, their work and powers remain. Still more, in the quiet unmovable East there are today by the hundred persons who know of their own knowledge that the Great Lodge still exists and has its Mahatmas, Adepts, Initiates, Brothers. And yet further, in that land are such a number of experts in the practical application of minor though still very astonishing power over nature and her forces, that we have an irresistible mass of human evidence to prove the proposition laid down.<\/p>\n<p>And if Theosophy — the teaching of this Great Lodge — is as said, both scientific and religious, then from the ethical side we have still more proof. A mighty Triad acting on and through ethics is that composed of Buddha, Confucius, and Jesus. The first, a Hindu, founds a religion which today embraces many more people than Christianity, teaching centuries before Jesus the ethics which he taught and which had been given out even centuries before Buddha. Jesus coming to reform his people repeats these ancient ethics, and Confucius does the same thing for ancient and honorable China.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 18, "pdf_page_number": 19, "html": "<p>The Theosophist says that all these great names represent members of the one single brotherhood, who all have a single doctrine. And the extraordinary characters who now and again appear in western civilization, such as St. Germain, Jacob Boehme, Cagliostro, Paracelsus, Mesmer, Count St. Martin, and Madame H. P. Blavatsky, are agents for the doing of the work of the Great Lodge at the proper time. It is true they are generally reviled and classed as impostors — though no one can find out why they are when they generally confer benefits and lay down propositions or make discoveries of great value to science after they have died. But Jesus himself would be called an impostor today if he appeared in some Fifth Avenue theatrical church rebuking the professed Christians. Paracelsus was the originator of valuable methods and treatments in medicine now universally used. Mesmer taught hypnotism under another name. Madame Blavatsky brought once more to the attention of the West the most important system, long known to the Lodge, respecting man, his nature and destiny. But all are alike called impostors by a people who have no original philosophy of their own and whose mendicant and criminal classes exceed in misery and in number those of any civilization on the earth.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 19, "pdf_page_number": 20, "html": "<p>It will not be unusual for nearly all occidental readers to wonder how men could possibly know so much and have such power over the operations of natural law as I have ascribed to the Initiates, now so commonly spoken of as the Mahatmas. In India, China, and other Oriental lands no wonder would arise on these heads, because there, although everything of a material civilization is just now in a backward state, they have never lost a belief in the inner nature of man and in the power he may exercise if he will. Consequently living examples of such powers and capacities have not been absent from those people. But in the West a materialistic civilization having arisen through a denial of the soul life and nature consequent upon a reaction from illogical dogmatism, there has not been any investigation of these subjects and, until lately, the general public has not believed in the possibility of anyone save a supposed God having such power.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 20, "pdf_page_number": 21, "html": "<p>A Mahatma endowed with power over space, time, mind, and matter, is a possibility just because he is a perfected man. Every human being has the germ of all the powers attributed to these great Initiates, the difference lying solely in the fact that we have in general not developed what we possess the germ of, while the Mahatma has gone through the training and experience which have caused all the unseen human powers to develop in him, and conferred gifts that look god-like to his struggling brother below. Telepathy, mind-reading, and hypnotism, all long ago known to Theosophy, show the existence in the human subject of planes of consciousness, functions, and faculties hitherto undreamed of. Mind-reading and the influencing of the mind of the hypnotized subject at a distance prove the existence of a mind which is not wholly dependent upon a brain, and that a medium exists through which the influencing thought may be sent. It is under this law that the Initiates can communicate with each other at no matter what distance. Its <em>rationale<\/em>, not yet admitted by the schools of the hypnotizers, is, that if the two minds vibrate or change into the same state they will think alike, or, in other words, the one who is to hear at a distance receives the impression sent by the other. In the same way with all other powers, no matter how extraordinary. They are all natural, although now unusual, just as great musical ability is natural though not usual or common. If an Initiate can make a solid object move without contact, it is because he understands the two laws of attraction and repulsion of which “gravitation” is but the name for one; if he is able to precipitate out of the viewless air the carbon which we know is in it, forming the carbon into sentences upon the paper, it is through his knowledge of the occult higher chemistry, and the use of a trained and powerful image making faculty which every man possesses; if he reads your thoughts with ease, that results from the use of the inner and only real powers of sight, which require no retina to see the fine-pictured web which the vibrating brain of man weaves about him. All that the Mahatma may do is natural to the perfected man; but if those powers are not at once revealed to us it is because the race is as yet selfish altogether and still living for the present and the transitory.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 21, "pdf_page_number": 22, "html": "<p>I repeat then, that though the true doctrine disappears for a time from among men it is bound to reappear, because first, it is impacted in the imperishable center of man’s nature; and secondly, the Lodge forever preserves it, not only in actual objective records, but also in the intelligent and fully self-conscious men who, having successfully overpassed the many periods of evolution which preceded the one we are now involved in, cannot lose the precious possessions they have acquired. And because the elder brothers are the highest product of evolution through whom alone, in cooperation with the whole human family, the further regular and workmanlike prosecution of the plans of the Great Architect of the Universe could be carried on, I have thought it well to advert to them and their Universal Lodge before going to other parts of the subject.<\/p>", "images": [], "label": "1. Theosophy And The Masters (cont.)"}, {"pdf_page_index": 22, "pdf_page_number": 23, "html": "<h3 class=\"pdf-heading\">2. General Principles<\/h3>\n<p>The teachings of Theosophy deal for the present chiefly with our earth, although its purview extends to all the worlds, since no part of the manifested universe is outside the single body of laws which operate upon us. Our globe being one of the solar system is certainly connected with Venus, Jupiter, and other planets, but as the great human family has to remain with its material vehicle — the earth — until all the units of the race which are ready are perfected, the evolution of that family is of greater importance to the members of it. Some particulars respecting the other planets may be given later on. First let us take a general view of the laws governing all.<\/p>\n<p>The universe evolves from the unknown, into which no man or mind, however high, can inquire, on seven planes or in seven ways or methods in all worlds, and this sevenfold differentiation causes all the worlds of the universe and the beings thereon to have a septenary constitution. As was taught of old, the little worlds and the great are copies of the whole, and the minutest insect as well as the most highly developed being are <em>replicas<\/em> in little or in great of the vast inclusive original. Hence sprang the saying, “as above so below” which the Hermetic philosophers used.<\/p>", "images": [], "label": "2. General Principles"}, {"pdf_page_index": 23, "pdf_page_number": 24, "html": "<p>The divisions of the sevenfold universe may be laid down roughly as: The Absolute, Spirit, Mind, Matter, Will, Akasa or Aether, and Life. In place of “the Absolute” we can use the word Space. For Space is that which ever is, and in which all manifestation must take place. The term Akasa, taken from the Sanskrit, is used in place of Aether, because the English language has not yet evolved a word to properly designate that tenuous state of matter which is now sometimes called Ether by modern scientists. As to the Absolute we can do no more than say IT IS. None of the great teachers of the School ascribe qualities to the Absolute although all the qualities exist in It. Our knowledge begins with differentiation, and all manifested objects, beings, or powers are only differentiations of the Great Unknown. The most that can be said is that the Absolute periodically differentiates itself, and periodically withdraws the differentiated into itself.<\/p>\n<p>The first differentiation — speaking metaphysically as to time — is Spirit, with which appears Matter and Mind. Akasa is produced from Matter and Spirit, Will is the force of Spirit in action and Life is a resultant of the action of Akasa, moved by Spirit, upon Matter.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 24, "pdf_page_number": 25, "html": "<p>But the Matter here spoken of is not that which is vulgarly known as such. It is the real Matter which is always invisible, and has sometimes been called Primordial Matter. In the Brahmanical system it is denominated <em>Mulaprakriti<\/em>. The ancient teaching always held, as is now admitted by Science, that we see or perceive only the phenomena but not the essential nature, body or being of matter.<\/p>\n<p>Mind is the intelligent part of the Cosmos, and in the collection of seven differentiations above roughly sketched, Mind is that in which the plan of the Cosmos is fixed or contained. This plan is brought over from a prior period of manifestation which added to its ever-increasing perfectness, and no limit can be set to its evolutionary possibilities in perfectness, because there was never any beginning to the periodical manifestations of the Absolute, there never will be any end, but forever the going forth and withdrawing into the Unknown will go on.<\/p>\n<p>Wherever a world or system of worlds is evolving there the plan has been laid down in universal mind, the original force comes from spirit, the basis is matter — which is in fact invisible — Life sustains all the forms requiring life, and Akasa is the connecting link between matter on one side and spirit-mind on the other.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 25, "pdf_page_number": 26, "html": "<p>When a world or a system comes to the end of certain great cycles men record a cataclysm in history or tradition. These traditions abound; among the Jews in their flood; with the Babylonians in theirs; in Egyptian papyri; in the Hindu cosmology; and none of them as merely confirmatory of the little Jewish tradition, but all pointing to early teaching and dim recollection also of the periodical destructions and renovations. The Hebraic story is but a poor fragment torn from the pavement of the Temple of Truth. Just as there are periodical minor cataclysms or partial destructions, so, the doctrine holds, there is the universal evolution and involution. Forever the Great Breath goes forth and returns again. As it proceeds outwards, objects, worlds and men appear; as it recedes all disappear into the original source.<\/p>\n<p>This is the waking and the sleeping of the Great Being; the Day and the Night of Brahma; the prototype of our waking days and sleeping nights as men, of our disappearance from the scene at the end of one little human life, and our return again to take up the unfinished work in another life, in a new day.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 26, "pdf_page_number": 27, "html": "<p>The real age of the world has long been involved in doubt for Western investigators, who up to the present have shown a singular unwillingness to take instruction from the records of Oriental people much older than the West. Yet with the Orientals is the truth about the matter. It is admitted that Egyptian civilization flourished many centuries ago, and as there are no living Egyptian schools of ancient learning to offend modern pride, and perhaps because the Jews “came out of Egypt” to fasten the Mosaic misunderstood tradition upon modern progress, the inscriptions cut in rocks and written on papyri obtain a little more credit today than the living thought and record of the Hindus. For the latter are still among us, and it would never do to admit that a poor and conquered race possesses knowledge respecting the age of man and his world which the western flower of culture, war, and annexation knows nothing of. Ever since the ignorant monks and theologians of Asia Minor and Europe succeeded in imposing the Mosaic account of the genesis of earth and man upon the coming western evolution, the most learned even of our scientific men have stood in fear of the years that elapsed since Adam, or have been warped in thought and perception whenever their eyes turned to any chronology different from that of a few tribes of the sons of Jacob. Even the noble, aged, and silent pyramid of Gizeh, guarded by Sphinx and Memnon made of stone, has been degraded by Piazzi Smyth and others into a proof that the British inch must prevail and that a “Continental Sunday” controverts the law of the Most High. Yet in the Mosaic account, where one would expect to find a reference to such a proof as the pyramid, we can discover not a single hint of it and only a record of the building by King Solomon of a temple of which there never was a trace.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 27, "pdf_page_number": 28, "html": "<p>But the Theosophist knows why the Hebraic tradition came to be thus an apparent drag on the mind of the West; he knows the connection between Jew and Egyptian; what is and is to be the resurrection of the old pyramid builders of the Nile valley, and where the plans of those ancient master masons have been hidden from the profane eyes until the cycle should roll round again for their bringing forth. The Jews preserved merely a part of the learning of Egypt hidden under the letter of the books of Moses, and it is there still to this day in what they call the cabalistic or hidden meaning of the scriptures. But the Egyptian souls who helped in planning the pyramid of Gizeh, who took part in the Egyptian government, theology, science, and civilization, departed from their old race, that race died out and the former Egyptians took up their work in the oncoming races of the West, especially in those which are now repeopling the American continents. When Egypt and India were younger there was a constant intercourse between them. They both, in the opinion of the Theosophist, thought alike, but fate ruled that of the two the Hindus only should preserve the old ideas among a living people. I will therefore take from the Brahmanical records of Hindustan their doctrine about the days, nights, years and life of Brahma, who represents the universe and the worlds.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 28, "pdf_page_number": 29, "html": "<p>The doctrine at once upsets the interpretation so long given to the Mosaic tradition, but fully accords with the evident account in Genesis of other and former “creations,” with the cabalistic construction of the Old Testament verse about the kings of Edom, who there represent former periods of evolution prior to that started with Adam, and also coincides with the belief held by some of the early Christian Fathers who told their brethren about wonderful previous worlds and creations.<\/p>\n<p>The Day of Brahma is said to last one thousand years, and his night is of equal length. In the Christian Bible is a verse saying that one day is as a thousand years to the Lord and a thousand years as one day. This has generally been used to magnify the power of Jehovah, but it has a suspicious resemblance to the older doctrine of the length of Brahma’s day and night. It would be of more value if construed to be a statement of the periodical coming forth for great days and nights of equal length of the universe of manifested worlds.<\/p>\n<p>A day of mortals is reckoned by the sun, and is but twelve hours in length. On Mercury it would be different, and on Saturn or Uranus still more so. But a day of Brahma is made up of what are called Manvantaras — or period between two men — fourteen in number. These include four billion three hundred and twenty million mortal, or earth, years, which is one day of Brahma.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 29, "pdf_page_number": 30, "html": "<p>When this day opens, cosmic evolution, so far as relates to this solar system, begins and occupies between one and two billions of years in evolving the very ethereal first matter before the astral kingdoms of mineral, vegetable, animal and men are possible. This second step takes some three hundred millions of years, and then still more material processes go forward for the production of the tangible kingdoms of nature, including man. This covers over one and one-half billions of years. And the number of solar years included in the present “human” period is over eighteen millions of years.<\/p>\n<p>This is exactly what Herbert Spencer designates as the gradual coming forth of the known and heterogeneous from the unknown and homogeneous. For the ancient Egyptian and Hindu Theosophists never admitted a creation out of nothing, but ever strenuously insisted upon evolution, by gradual stages, of the heterogeneous and differentiated from the homogeneous and undifferentiated. No mind can comprehend the infinite and absolute unknown, which is, has no beginning and shall have no end; which is both last and first, because, whether differentiated or withdrawn into itself, it ever is. This is the God spoken of in the Christian Bible as the one around whose pavilion there is darkness.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 30, "pdf_page_number": 31, "html": "<p>This cosmic and human chronology of the Hindus is laughed at by western Orientalists, yet they can furnish nothing better and are continually disagreeing with each other on the same subject. In Wilson’s translation of <em>Vishnu Purana<\/em> he calls it all fiction based on nothing, and childish boasting. But the Free Masons, who remain inactive hereupon, ought to know better. They could find in the story of the building of Solomon’s temple from the heterogeneous materials brought from everywhere, and its erection without the noise of a tool being heard, the agreement with these ideas of their Egyptian and Hindu brothers. For Solomon’s Temple means man whose frame is built up, finished and decorated without the least noise. But the materials had to be found, gathered together and fashioned in other and distant places.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 31, "pdf_page_number": 32, "html": "<p>These are in the periods above spoken of, very distant and very silent. Man could not have his bodily temple to live in until all the matter in and about his world had been found by the Master, who is the inner man, when found the plans for working it required to be detailed. They then had to be carried out in different detail until all the parts should be perfectly ready and fit for placing in the final structure. So in the vast stretch of time which began after the first almost intangible matter had been gathered and kneaded, the material and vegetable kingdoms had sole possession here with the Master — man — who was hidden from sight within carrying forward the plans for the foundations of the human temple. All of this requires many, many ages, since we know that nature never leaps. And when the rough work was completed, when the human temple was erected, many more ages would be required for all the servants, the priests, and the counsellors to learn their parts properly so that man, the Master, might be able to use the temple for its best and highest purposes.<\/p>\n<p>The ancient doctrine is far nobler than the Christian religious one or that of the purely scientific school. The religious gives a theory which conflicts with reason and fact, while science can give for the facts which it observes no reason which is in any way noble or elevating. Theosophy alone, inclusive of all systems and every experience, gives the key, the plan, the doctrine, the truth.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 32, "pdf_page_number": 33, "html": "<p>The real age of the world is asserted by Theosophy to be almost incalculable, and that of man as he is now formed is over eighteen millions of years. What has become at last man is of vastly greater age, for before the present two sexes appeared the human creature was sometimes of one shape and sometimes of another, until the whole plan had been fully worked out into our present form, function, and capacity. This is found to be referred to in the ancient books written for the profane where man is said to have been at one time globular in shape. This was at a time when the conditions favored such a form and of course it was longer ago than eighteen millions of years. And when this globular form was the rule the sexes as we know them had not differentiated and hence there was but one sex, or if you like, no sex at all.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 33, "pdf_page_number": 34, "html": "<p>During all these ages before our man came into being, evolution was carrying on the work of perfecting various powers which are now our possession. This was accomplished by the Ego or real man going through experience in countless conditions of matter all different one from the other, and the same plan in general was and is pursued as prevails in respect to the general evolution of the universe to which I have before adverted. That is, details were first worked out in spheres of being very ethereal, metaphysical in fact. Then the next step brought the same details to be worked out on a plane of matter a little more dense, until at last it could be done on our present plane of what we miscall gross matter. In these anterior states the senses existed in germ, as it were, or in idea, until the astral plane which is next to this one was arrived at, and then they were concentrated so as to be the actual senses we now use through the agency of the different outer organs. These outer organs of sight, touch and hearing, and tasting, are often mistaken by the unlearned or the thoughtless for the real organs and senses, but he who stops to think must see that the senses are interior and that their outer organs are but mediators between the visible universe and the real perceiver within. And all these various powers and potentialities being well worked out in this slow but sure process, at last man is put upon the scene a sevenfold being just as the universe and earth itself are sevenfold. Each of his seven principles is derived from one of the great first seven divisions, and each relates to a planet or scene of evolution, and to a race in which that evolution was carried out. So the first sevenfold differentiation is important to be borne in mind, since it is the basis of all that follows; just as the universal evolution is septenary so the evolution of humanity, sevenfold in its constitution, is carried on upon a septenary Earth. This is spoken of in Theosophical literature as the Sevenfold Planetary Chain, and is intimately connected with Man’s special evolution.<\/p>", "images": [], "label": "2. General Principles (cont.)"}, {"pdf_page_index": 34, "pdf_page_number": 35, "html": "<h3 class=\"pdf-heading\">3. The Earth Chain<\/h3>\n<p>Coming now to our Earth the view put forward by Theosophy regarding its genesis, its evolution and the evolution of the Human, Animal and other Monads, is quite different from modern ideas, and in some things contrary to accepted theories. But the theories of today are not stable. They change with each century, while the Theosophical one never alters because, in the opinion of those Elder Brothers who have caused its repromulgation and pointed to its confirmation in ancient books, it is but a statement of facts in nature. The modern theory is, on the contrary, always speculative, changeable, and continually altered.<\/p>\n<p>Following the general plan outlined in preceding pages, the Earth is sevenfold. It is an entity and not a mere lump of gross matter. And being thus an entity of a septenary nature there must be six other globes which roll with it in space. This company of seven globes has been called the “Earth Chain,” the “Planetary Chain.” In <em>Esoteric Buddhism<\/em> this is clearly stated, but there a rather hard and fast materialistic view of it is given and the reader led to believe that the doctrine speaks of seven distinct globes, all separated from though connected with each other. One is forced to conclude that the author meant to say that the globe Earth is as distinct from the other six as Venus is from Mars.<\/p>", "images": [], "label": "3. The Earth Chain"}, {"pdf_page_index": 35, "pdf_page_number": 36, "html": "<p>This is not the doctrine. The earth is one of seven globes, in respect to man’s consciousness only, because when he functions on one of the seven he perceives it as a distinct globe and does not see the other six. This is in perfect correspondence with man himself who has six other constituents of which only the gross body is visible to him because he is now functioning on the Earth — or the fourth globe — and his body represents the Earth. The whole seven “globes” constitute one single mass or great globe and they all interpenetrate each other. But we have to say “globe,” because the ultimate shape is globular or spherical. If one relies too closely on the explanation made by Mr. Sinnett it might be supposed that the globes did not interpenetrate each other but were connected by currents or lines of magnetic force. And if too close attention is paid to the diagrams used in the <em>Secret Doctrine<\/em> to illustrate the scheme, without paying due regard to the explanations and cautions given by H. P. Blavatsky, the same error may be made. But both she and her Adept teachers say, that the seven globes of our chain are in “<em>coadunation with each other but not in consubstantiality<\/em>.” (<em>Secret Doctrine<\/em>, Vol. I, p. 166, first edition.) This is further enforced by cautions not to rely on statistics or plane surface diagrams, but to look at the metaphysical and spiritual aspect of the theory as stated in English. Thus from the very source of Mr. Sinnett’s book we have the statement, that these globes are united in one mass though differing from each other in substance, and that this difference of substance is due to change of center of consciousness.<\/p>", "images": [], "label": "3. The Earth Chain (cont.)"}, {"pdf_page_index": 36, "pdf_page_number": 37, "html": "<p>The Earth Chain of seven globes as thus defined is the direct reincarnation of a former chain of seven globes, and that former family of seven was the moon chain, the moon itself being the visible representative of the fourth globe of the old chain. When that former vast entity composed of the Moon and six others, all united in one mass, reached its limit of life it died just as any being dies. Each one of the seven sent its energies into space and gave similar life or vibration to cosmic dust — matter, — and the total cohesive force of the whole kept the seven energies together. This resulted in the evolving of the present Earth Chain of seven centers of energy or evolution combined in one mass. As the Moon was the fourth of the old series it is on the same plane of perception as the Earth, and as we are now confined in our consciousness largely to Earth we are able only to see one of the old seven — to wit: our Moon. When we are functioning on any of the other seven we will perceive in our sky the corresponding old corpse which will then be a Moon, and we will not see the present Moon. Venus, Mars, Mercury and other visible planets are all fourth-plane globes of distinct planetary masses and for that reason are visible to us, their companion six centers of energy and consciousness being invisible. All diagrams on plane surfaces will only becloud the theory because a diagram necessitates linear divisions.<\/p>", "images": [], "label": "3. The Earth Chain (cont.)"}, {"pdf_page_index": 37, "pdf_page_number": 38, "html": "<p>The stream or mass of Egos which evolves on the seven globes of our chain is limited in number, yet the actual quantity is enormous. For though the universe is limitless and infinite, yet in any particular portion of Cosmos in which manifestation and evolution have begun there is a limit to the extent of manifestation and to the number of Egos engaged therein. And the whole number of Monads now going through evolution on our Earth Chain came over from the old seven planets or globes which I have described. <em>Esoteric Buddhism<\/em> calls this mass of Egos a “life wave,” meaning the stream of Monads. It reached this planetary mass, represented to our consciousness by the central point our Earth, and began on Globe A or No. I, coming like an army or river. The first portion began on Globe A and went through a long evolution there in bodies suited to such a state of matter, and then passed on to B, and so on through the whole seven greater states of consciousness which have been called globes. When the first portion left A others streamed in and pursued the same course, the whole army proceeding with regularity round the septenary route.<\/p>", "images": [], "label": "3. The Earth Chain (cont.)"}, {"pdf_page_index": 38, "pdf_page_number": 39, "html": "<p>This journey went on for four circlings round the whole, and then the whole stream or army of Egos from the old Moon Chain had arrived, and being complete, no more entered after the middle of the Fourth Round. The same circling process of these differently arrived classes goes on for seven complete Rounds of the whole seven planetary centers of consciousness, and when the seven are ended as much perfection as is possible in the immense period occupied will have been attained, and then this chain or mass of “globes” will die in its turn to give birth to still another series.<\/p>\n<p>Each one of the globes is used by evolutionary law for the development of seven races, and of senses, faculties and powers appropriate to that state of matter: the experience of the whole seven globes being needed to make a perfect development. Hence we have the Rounds and Races. The Round is a circling of the seven centers of planetary consciousness; the Race the racial development on one of those seven. There are seven races for each globe, but the total of forty-nine races only makes up seven great races, the special septennate of races on each globe or planetary center composing in reality one race of seven constituents or special peculiarities of function and power.<\/p>", "images": [], "label": "3. The Earth Chain (cont.)"}, {"pdf_page_index": 39, "pdf_page_number": 40, "html": "<p>And as no complete race could be evolved in a moment on any globe, the slow, orderly processes of nature, which allow no jumps, must proceed by appropriate means. Hence sub-races have to be evolved one after the other before the perfect root race is formed, and then the root race sends off its offshoots while it is declining and preparing for the advent of the next great race.<\/p>\n<p>As illustrating this, it is distinctly taught that on the Americas is to be evolved the new — sixth — race; and here all the races of the earth are now engaged in a great amalgamation from which will result a very highly developed sub-race, after which others will be evolved by similar processes until the new one is completed.<\/p>\n<p>Between the end of any great race and the beginning of another there is a period of rest, so far as the globe is concerned, for then the stream of human Egos leaves it for another one of the chain in order to go on with further evolution of powers and faculties there. But when the last, the seventh, race has appeared and fully perfected itself, a great dissolution comes on, similar to that which I briefly described as preceding the birth of the earth’s chain, and then the world disappears as a tangible thing, and so far as the human ear is concerned there is silence. This, it is said, is the root of the belief so general that the world will come to an end, that there will be a judgment-day, or that there have been universal floods or fires.<\/p>", "images": [], "label": "3. The Earth Chain (cont.)"}, {"pdf_page_index": 40, "pdf_page_number": 41, "html": "<p>Taking up evolution on the Earth, it is stated that the stream of Monads begins first to work up the mass of matter in what are called elemental conditions when all is gaseous or fiery. For the ancient and true theory is that no evolution is possible without the Monad as vivifying agent. In this first stage there is no animal or vegetable. Next comes the mineral when the whole mass hardens, the Monads being all imprisoned within. Then the first Monads emerge into vegetable forms which they construct themselves, and no animals yet appear. Next the first class of Monads emerges from the vegetable and produces the animal, then the human astral and shadowy model, and we have minerals, vegetables, animals and future men, for the second and later classes are still evolving in the lower kingdoms. When the middle of the Fourth Round is reached no more Monads emerge into the human stage and will not until a new planetary mass, reincarnated from ours, is made. This is the whole process roughly given, but with many details left out, for in one of the rounds man appears before the animals. But this detail need lead to no confusion.<\/p>", "images": [], "label": "3. The Earth Chain (cont.)"}, {"pdf_page_index": 41, "pdf_page_number": 42, "html": "<p>And to state it in another way. The plan comes first in the universal mind, after which the astral model or basis is made, and when that astral model is completed, the whole process is gone over so as to condense the matter, up to the middle of the Fourth Round. Subsequent to that, which is our future, the whole mass is spiritualized with full consciousness and the entire body of globes raised up to a higher plane of development. In the process of condensing above referred to there is an alteration in respect to the time of the appearance of man on the planet. But as to these details the teachers have only said, “that at the Second Round the plan varies, but the variation will not be given to this generation.” Hence it is impossible for me to give it. But there is no vagueness on the point that seven great races have to evolve here on this planet, and that the entire collection of races has to go seven times round the whole series of seven globes.<\/p>\n<p>Human beings did not appear here in two sexes first. The first were of no sex, then they altered into hermaphrodite, and lastly separated into male and female. And this separation into male and female for human beings was over 18,000,000 years ago. For that reason is it said, in these ancient schools, that our humanity is 18,000,000 years old and a little over.<\/p>", "images": [], "label": "3. The Earth Chain (cont.)"}, {"pdf_page_index": 42, "pdf_page_number": 43, "html": "<h3 class=\"pdf-heading\">4. Septenary Constitution of Man<\/h3>\n<p>Respecting the nature of man there are two ideas current in the religious circles of Christendom. One is the teaching and the other the common acceptation of it; the first is not secret, to be sure, in the Church, but it is so seldom dwelt upon in the hearing of the laity as to be almost arcane for the ordinary person. Nearly everyone says he has a soul and a body, and there it ends. What the soul is, and whether it is the real person or whether it has any powers of its own, are not inquired into, the preachers usually confining themselves to its salvation or damnation. And by thus talking of it as something different from oneself, the people have acquired an underlying notion that they are not souls because the soul may be lost by them. From this has come about a tendency to materialism causing men to pay more attention to the body than to the soul, the latter being left to the tender mercies of the priest of the Roman Catholics, and among dissenters the care of it is most frequently put off to the dying day. But when the true teaching is known it will be seen that the care of the soul, which is the Self, is a vital matter requiring attention every day, and not to be deferred without grievous injury resulting to the whole man, both soul and body.<\/p>", "images": [], "label": "4. Septenary Constitution of Man"}, {"pdf_page_index": 43, "pdf_page_number": 44, "html": "<p>The Christian teaching, supported by St. Paul, since upon him, in fact, dogmatic Christianity rests, is that man is composed of body, soul, and spirit. This is the threefold constitution of man, believed by the theologians but kept in the background because its examination might result in the readoption of views once orthodox but now heretical. For when we thus place soul between spirit and body, we come very close to the necessity for looking into the question of the soul’s responsibility — since mere body can have no responsibility. And in order to make the soul responsible for the acts performed, we must assume that it has powers and functions. From this it is easy to take the position that the soul may be rational or irrational, as the Greeks sometimes thought, and then there is but a step to further Theosophical propositions. This threefold scheme of the nature of man contains, in fact, the Theosophical teaching of his sevenfold constitution, because the four other divisions missing from the category can be found in the powers and functions of body and soul, as I shall attempt to show later on. This conviction that man is a septenary and not merely a duad, was held long ago and very plainly taught to every one with accompanying demonstrations, but like other philosophical tenets it disappeared from sight, because gradually withdrawn at the time when in the east of Europe morals were degenerating and before materialism had gained full sway in company with scepticism, its twin. Upon its withdrawal the present dogma of body, soul, spirit, was left to Christendom. The reason for that concealment and its rejuvenescence in this century is well put by Mme. H. P. Blavatsky in the <em>Secret<\/em> <em>Doctrine<\/em>. In answer to the statement, “we cannot understand how any danger could arise from the revelation of such a purely philosophical doctrine as the evolution of the planetary chain,” she says:<\/p>", "images": [], "label": "4. Septenary Constitution of Man (cont.)"}, {"pdf_page_index": 44, "pdf_page_number": 45, "html": "<p>The danger was this: Doctrines such as the Planetary chain or the seven races at once give a clue to the seven-fold nature of man, for each principle is correlated to a plane, a planet, and a race; and the human principles are, on every plane, correlated to seven-fold occult forces — those of the higher planes being of tremendous occult powers, the abuse of which would cause incalculable evil to humanity. A clue, which is, perhaps, no clue to the present generation — especially the Westerns — protected as they are by their very blindness and ignorant materialistic disbelief in the occult; but a clue which would, nevertheless, have been very real in the early centuries of the Christian era, to people fully convinced of the reality of occultism, and entering a cycle of degradation, which made them rife [ripe] for abuse of occult powers and sorcery of the worst description.<\/p>\n<p>Mr. A. P. Sinnett, at one time an official in the Government of India, first outlined in this century the real nature of man in his book <em>Esoteric Buddhism<\/em>, which was made up from information conveyed to him by H. P. Blavatsky directly from the Great Lodge of Initiates to which reference has been made. And in thus placing the old doctrine before western civilization he conferred a great benefit on his generation and helped considerably the cause of Theosophy. His classification was:<\/p>\n<p>The Body, or <em>Rupa<\/em>.<\/p>\n<p>Vitality, or <em>Prana-Jiva<\/em>.<\/p>\n<p>Astral Body, or <em>Linga-Sarira<\/em>.<\/p>", "images": [], "label": "4. Septenary Constitution of Man (cont.)"}, {"pdf_page_index": 45, "pdf_page_number": 46, "html": "<p>Animal Soul, or <em>Kama-Rupa<\/em>.<\/p>\n<p>Human Soul, or <em>Manas<\/em>.<\/p>\n<p>Spiritual Soul, or <em>Buddhi<\/em>.<\/p>\n<p>Spirit, or <em>Atma<\/em>.<\/p>", "images": [], "label": "4. Septenary Constitution of Man (cont.)"}, {"pdf_page_index": 46, "pdf_page_number": 47, "html": "<p>The words in italics being equivalents in the Sanskrit language adopted by him for the English terms. This classifica
