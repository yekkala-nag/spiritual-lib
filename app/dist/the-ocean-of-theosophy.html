 since no man can by any possibility, or favor, or edict, or belief escape the consequences, and each one who grasps this doctrine will be moved by conscience and the whole power of nature to do well in order that he may receive good and become happy.<\/p>", "images": [], "label": "9. Reincarnation Continued"}, {"pdf_page_index": 100, "pdf_page_number": 101, "html": "<p>It is maintained that the idea of rebirth is uncongenial and unpleasant because on the one hand it is cold, allowing no sentiment to interfere, prohibiting us from renouncing at will a life which we have found to be sorrowful; and on the other, that there appears to be no chance under it for us to see our loved ones who have passed away before us. But whether we like it or not Nature’s laws go forward unerringly, and sentiment or feeling can in no way avert the consequence that must follow a cause. If we eat bad food bad results must come. The glutton would have Nature permit him to gorge himself without the indigestion which will come, but Nature’s laws are not to be thus put aside. Now, the objection to reincarnation that we will not see our loved ones in heaven as promised in dogmatic religion, presupposes a complete stoppage of the evolution and development of those who leave earth before ourselves, and also assumes that recognition is dependent on physical appearance. But as we progress in this life, so also must we progress upon leaving it, and it would be unfair to compel the others to await our arrival in order that we may recognize them. And if one reflects on the natural consequences of arising to heaven where all trammels are cast off, it must be apparent that those who have been there, say, twenty of mortal years before us must, in the nature of things mental and spiritual, have made a progress equal to many hundreds of years here under varied and very favorable circumstances. How then could we, arriving later and still imperfect, be able to recognize those who had been perfecting themselves in heaven with such advantages? And as we know that the body is left behind to disintegrate, so, it is evident, recognition cannot depend, in the spiritual and mental life, on physical appearance. For not only is this thus plain, but since we are aware that an unhandsome or deformed body often enshrines a glorious mind and pure soul, and that a beautifully formed exterior — such as in the case of the Borgias — may hide an incarnate devil in character, the physical form gives no guarantee of recognition in that world where the body is absent. And the mother who has lost a child who had grown to maturity must know that she loved the child when a baby as much as afterwards when the great alteration to later life had completely swept away the form and features of early youth. The Theosophists see that this objection can have no existence in the face of the eternal and pure life of the soul. And Theosophy also teaches that those who are like unto each other and love each other will be reincarnated together whenever the conditions permit. Whenever one of us has gone farther on the road to perfection, he will always be moved to help and comfort those who belong to the same family. But when one has become gross and selfish and wicked, no one would want his companionship in any life. Recognition depends on the inner sight and not on outward appearance; hence there is no force in this objection. And the other phase of it relating to loss of parent, child, or relative is based on the erroneous notion that as the parents give the child its body so also is given its soul. But soul is immortal and parentless; hence this objection is without a root.<\/p>", "images": [], "label": "9. Reincarnation Continued (cont.)"}, {"pdf_page_index": 101, "pdf_page_number": 102, "html": "<p>Some urge that Heredity invalidates Reincarnation. We urge it as proof. Heredity in giving us a body in any family provides the appropriate environment for the Ego. The Ego only goes into the family which either completely answers to its whole nature, or which gives an opportunity for the working out of its evolution, and which is also connected with it by reason of past incarnations or causes mutually set up. Thus the evil child may come to the presently good family because parents and child are indissolubly connected by past actions. It is a chance for redemption to the child and the occasion of punishment to the parents. This points to bodily heredity as a natural rule governing the bodies we must inhabit, just as the houses in a city will show the mind of the builders. And as we as well as our parents were the makers and influencers of bodies, took part in and are responsible for states of society in which the development of physical body and brain was either retarded or helped on, debased or the contrary, so we are in this life responsible for the civilization in which we now appear. But when we look at the characters in human bodies, great inherent differences are seen. This is due to the soul inside, who is suffering or enjoying in the family, nation, and race his own thoughts and acts in the past lives have made it inevitable he should incarnate with.<\/p>", "images": [], "label": "9. Reincarnation Continued (cont.)"}, {"pdf_page_index": 102, "pdf_page_number": 103, "html": "<p>Heredity provides the tenement and also imposes those limitations of capacity of brain or body which are often a punishment and sometimes a help, but it does not affect the real Ego. The transmission of traits is a physical matter, and nothing more than the coming out into a nation of the consequences of the prior lives of all Egos who are to be in that race. The limitations imposed on the Ego by any family heredity are exact consequences of that Ego’s prior lives. The fact that such physical traits and mental peculiarities are transmitted does not confute reincarnation, since we know that the guiding mind and real character of each are not the result of a body and brain but are peculiar to the Ego in its essential life. Transmission of trait and tendency by means of parent and body is exactly the mode selected by nature for providing the incarnating Ego with the proper tenement in which to carry on its work. Another mode would be impossible and subversive of order.<\/p>\n<p>Again, those who dwell on the objection from heredity forget that they are accentuating similarities and overlooking divergencies. For while investigations on the line of heredity have recorded many transmitted traits, they have not done so in respect to divergencies from heredity vastly greater in number. Every mother knows that the children of a family are as different in character as the fingers on one hand — they are all from the same parents, but all vary in character and capacity.<\/p>", "images": [], "label": "9. Reincarnation Continued (cont.)"}, {"pdf_page_index": 103, "pdf_page_number": 104, "html": "<p>But heredity as the great rule and as a complete explanation is absolutely overthrown by history, which shows no constant transmission of learning, power, and capacity. For instance, in the case of the ancient Egyptians long gone and their line of transmission shattered, we have no transmission to their descendants. If physical heredity settles the question of character, how has the great Egyptian character been lost? The same question holds in respect to other ancient and extinct nations. And taking an individual illustration we have the great musician Bach, whose direct descendants showed a decrease in musical ability leading to its final disappearance from the family stock. But Theosophy teaches that in both of these instances — as in all like them — the real capacity and ability have only disappeared from a family and national body, but are retained in the Egos who once exhibited them, being now incarnated in some other nation and family of the present time.<\/p>", "images": [], "label": "9. Reincarnation Continued (cont.)"}, {"pdf_page_index": 104, "pdf_page_number": 105, "html": "<p>Suffering comes to nearly all men, and a great many live lives of sorrow from the cradle to the grave, so it is objected that reincarnation is unjust because we suffer for the wrong done by some other person in another life. This objection is based on the false notion that the person in the other life was some one else. But in every life it is the same person. When we come again we do not take up the body of some one else, nor another’s deeds, but are like an actor who plays many parts, the same actor inside though the costumes and the lines recited differ in each new play. Shakespeare was right in saying that life is a play, for the great life of the soul is a drama, and each new life and rebirth another act in which we assume another part and put on a new dress, but all through it we are the self-same person. So instead of its being unjust, it is perfect justice, and in no other manner could justice be preserved.<\/p>", "images": [], "label": "9. Reincarnation Continued (cont.)"}, {"pdf_page_index": 105, "pdf_page_number": 106, "html": "<p>But, it is said, if we reincarnate how is it that we do not remember the other life; and further, as we cannot remember the deeds for which we suffer is it not unjust for that reason? Those who ask this always ignore the fact that they also have enjoyment and reward in life and are content to accept them without question. For if it is unjust to be punished for deeds we do not remember, then it is also inequitable to be rewarded for other acts which have been forgotten. Mere entry into life is no fit foundation for any reward or punishment. Reward and punishment must be the just desert for prior conduct. Nature’s law of justice is not imperfect, and it is only the imperfection of human justice that requires the offender to know and remember in this life a deed to which a penalty is annexed. In the prior life the doer was then quite aware of what he did, and nature affixes consequences to his acts, being thus just. We well know that she will make the effect follow the cause whatever we wish and whether we remember or forget what we did. If a baby is hurt in its first years by the nurse so as to lay the ground for a crippling disease in after life, as is often the case, the crippling disease will come although the child neither brought on the present cause nor remembered aught about it. But reincarnation, with its companion doctrine of Karma, rightly understood, shows how perfectly just the whole scheme of nature is.<\/p>", "images": [], "label": "9. Reincarnation Continued (cont.)"}, {"pdf_page_index": 106, "pdf_page_number": 107, "html": "<p>Memory of a prior life is not needed to prove that we passed through that existence, nor is the fact of not remembering a good objection. We forget the greater part of the occurrences of the years and days of this life, but no one would say for that reason we did not go through these years. They were lived, and we retain but little of the details in the brain, but the entire effect of them on the character is kept and made a part of ourselves. The whole mass of detail of a life is preserved in the inner man to be one day fully brought back to the conscious memory in some other life when we are perfected. And even now, imperfect as we are and little as we know, the experiments in hypnotism show that all the smallest details are registered in what is for the present known as the sub-conscious mind. The theosophical doctrine is that not a single one of these happenings is forgotten in fact, and at the end of life when the eyes are closed and those about say we are dead every thought and circumstance of life flash vividly into and across the mind.<\/p>", "images": [], "label": "9. Reincarnation Continued (cont.)"}, {"pdf_page_index": 107, "pdf_page_number": 108, "html": "<p>Many persons do, however, remember that they have lived before. Poets have sung of this, children know it well, until the constant living in an atmosphere of unbelief drives the recollection from their minds for the present, but all are subject to the limitations imposed upon the Ego by the new brain in each life. This is why we are not able to keep the pictures of the past, whether of this life or the preceding ones. The brain is the instrument for the memory of the soul, and, being new in each life with but a certain capacity, the Ego is only able to use it for the new life up to its capacity. That capacity will be fully availed of or the contrary, just according to the Ego’s own desire and prior conduct, because such past living will have increased or diminished its power to overcome the forces of material existence.<\/p>\n<p>By living according to the dictates of the soul the brain may at least be made porous to the soul’s recollections; if the contrary sort of a life is led, then more and more will clouds obscure that reminiscence. But as the brain had no part in the life last lived, it is in general unable to remember. And this is a wise law, for we should be very miserable if the deeds and scenes of our former lives were not hidden from our view until by discipline we become able to bear a knowledge of them.<\/p>", "images": [], "label": "9. Reincarnation Continued (cont.)"}, {"pdf_page_index": 108, "pdf_page_number": 109, "html": "<p>Another objection brought up is that under the doctrine of reincarnation it is not possible to account for the increase of the world’s population. This assumes that we know surely that its population has increased and are keeping informed of its fluctuations. But it is not certain that the inhabitants of the globe have increased, and, further, vast numbers of people are annually destroyed of whom we know nothing. In China year after year many thousands have been carried off by flood. Statistics of famine have not been made. We do not know by how many thousands the deaths in Africa exceed the births in any year. The objection is based on imperfect tables which only have to do with western lands. It also assumes that there are fewer Egos out of incarnation and waiting to come in than the number of those inhabiting bodies, and this is incorrect. Annie Besant has put this well in her “Reincarnation” by saying that the inhabited globe resembles a hall in a town which is filled from the much greater population of the town outside; the number in the hall may vary, but there is a constant source of supply from the town. It is true that so far as concerns this globe the number of Egos belonging to it is definite; but no one knows what that quantity is nor what is the total capacity of the earth for sustaining them. The statisticians of the day are chiefly in the West, and their tables embrace but a small section of the history of man. They cannot say how many persons were incarnated on the earth at any prior date when the globe was full in all parts, hence the quantity of egos willing or waiting to be reborn is unknown to the men of today. The Masters of theosophical knowledge say that the total number of such egos is vast, and for that reason the supply of those for the occupation of bodies to be born over and above the number that die is sufficient. Then too it must be borne in mind that each ego for itself varies the length of stay in the <em>post-mortem<\/em> states. They do not reincarnate at the same interval, but come out of the state after death at different rates, and whenever there occurs a great number of deaths by war, pestilence, or famine, there is at once a rush of souls to incarnation, either in the same place or in some other place or race. The earth is so small a globe in the vast assemblage of inhabitable planets there is a sufficient supply of Egos for incarnation here. But with due respect to those who put this objection, I do not see that it has the slightest force or any relation to the truth of the doctrine of reincarnation.<\/p>", "images": [], "label": "9. Reincarnation Continued (cont.)"}, {"pdf_page_index": 109, "pdf_page_number": 110, "html": "<h3 class=\"pdf-heading\">10. Arguments Supporting Reincarnation<\/h3>\n<p>Unless we deny the immortality of man and the existence of soul, there are no sound arguments against the doctrine of preexistence and rebirth save such as rest on the dictum of the church that each soul is a new creation. This dictum can be supported only by blind dogmatism, for given a soul we must sooner or later arrive at the theory of rebirth, because even if each soul is new on this earth it must keep on living somewhere after passing away, and in view of the known order of nature will have other bodies in other planets or spheres. Theosophy applies to the self — the thinker — the same laws which are seen everywhere in operation throughout nature, and those are all varieties of the great law that effects follow causes and no effect is without a cause. The soul’s immortality — believed in by the mass of humanity — demands embodiment here or elsewhere, and to be embodied means reincarnation. If we come to this earth for but a few years and then go to some other, the soul must be reimbodied there as well as here, and if we have travelled from some other world we must have had there too our proper vesture. The powers of mind and the laws governing its motion, its attachment, and its detachment as given in theosophical philosophy show that its reimbodiment must be here, where it moved and worked, until such time as the mind is able to overcome the forces which chain it to this globe. To permit the involved entity to transfer itself to another scene of action before it had overcome all the causes drawing it here and without its having worked out its responsibilities to other entities in the same stream of evolution would be unjust and contrary to the powerful occult laws and forces which continually operate upon it. The early Christian Fathers saw this, and taught that the soul had fallen into matter and was obliged by the law of its nature to toil upward again to the place from which it came. They used an old Greek hymn which ran:<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation"}, {"pdf_page_index": 110, "pdf_page_number": 111, "html": "<p>Eternal Mind, thy seedling spark,<br />Through this thin vase of clay,<br />Athwart the waves of chaos dark<br />Emits a timorous ray.<br />This mind enfolding soul is sown,<br />Incarnate germ in earth:<br />In pity, blessed Lord, then own<br />What claims in Thee its birth.<br />Far forth from Thee, thou central fire,<br />To earth’s sad bondage cast,<br />Let not the trembling spark expire;<br />Absorb thine own at last!<\/p>\n<p>Each human being has a definite character different from every other human being, and masses of beings aggregated into nations show as wholes that the national force and distinguishing peculiarities go to make up a definite and separate national character. These differences, both individual and national, are due to essential character and not to education. Even the doctrine of the survival of the fittest should show this, for the fitness can not come from nothing but must at last show itself from the coming to the surface of the actual inner character. And as both individuals and nations among those who are ahead in the struggle with nature exhibit an immense force in their character, we must find a place and time where the force was evolved. These, Theosophy says, are this earth and the whole period during which the human race has been on the planet.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 111, "pdf_page_number": 112, "html": "<p>So, then, while heredity has something to do with the difference in character as to force and morale, swaying the soul and mind a little and furnishing also the appropriate place for receiving reward and punishment, it is not the cause for the essential nature shown by every one.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 112, "pdf_page_number": 113, "html": "<p>But all these differences, such as those shown by babes from birth, by adults as character comes forth more and more, and by nations in their history, are due to long experience gained during many lives on earth, are the outcome of the soul’s own evolution. A survey of one short human life gives no ground for the production of his inner nature. It is needful that each soul should have all possible experience, and one life cannot give this even under the best conditions. It would be folly for the Almighty to put us here for such a short time, only to remove us just when we had begun to see the object of life and the possibilities in it. The mere selfish desire of a person to escape the trials and discipline of life is not enough to set nature’s laws aside, so the soul must be reborn until it has ceased to set in motion the cause of rebirth, after having developed character up to its possible limit as indicated by all the varieties of human nature, when every experience has been passed through, and not until all of truth that can be known has been acquired. The vast disparity among men in respect to capacity compels us, if we wish to ascribe justice to Nature or to God, to admit reincarnation and to trace the origin of the disparity back to the past lives of the Ego. For people are as much hindered and handicapped, abused and made the victims of seeming injustice because of limited capacity, as they are by reason of circumstances of birth or education. We see the uneducated rising above circumstances of family and training, and often those born in good families have very small capacity; but the troubles of nations and families arise from want of capacity more than from any other cause. And if we consider savage races only, there the seeming injustice is enormous. For many savages have good actual brain capacity but still are savage. This is because the Ego in that body is still savage and undeveloped, for in contrast to the savage there are many civilized men with small actual brain force who are not savage in nature because the indwelling Ego has had long experience in civilization during other lives, and being a more developed soul has power to use the brain instrument to its highest limit.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 113, "pdf_page_number": 114, "html": "<p>Each man feels and knows that he has an individuality of his own, a personal identity which bridges over not only the gaps made by sleep but also those sometimes supervening on temporary lesions in the brain. This identity never breaks from beginning to end of life in the normal person, and only the persistence and eternal character of the soul will account for it.<\/p>\n<p>So, ever since we began to remember, we know that our personal identity has not failed us, no matter how bad may be our memory. This disposes of the argument that identity depends on recollection, for the reason that if it did depend alone on recollection we should each day have to begin over again, as we cannot remember the events of the past in detail, and some minds remember but little yet feel their personal identity. And as it is often seen that some who remember the least insist as strongly as the others on their personal identity, that persistence of feeling must come from the old and immortal soul.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 114, "pdf_page_number": 115, "html": "<p>Viewing life and its probable object, with all the varied experience possible for man, one must be forced to the conclusion that a single life is not enough for carrying out all that is intended by Nature, to say nothing of what man himself desires to do. The scale of variety in experience is enormous. There is a vast range of powers latent in man which we see may be developed if opportunity be given. Knowledge infinite in scope and diversity lies before us, and especially in these days when special investigation is the rule. We perceive that we have high aspirations with no time to reach up to their measure, while the great troop of passions and desires, selfish motives and ambitions, war with us and among themselves, pursuing us even to the door of death. All these have to be tried, conquered, used, subdued. One life is not enough for all this. To say that we have but one life here with such possibilities put before us and impossible of development is to make the universe and life a huge and cruel joke perpetrated by a powerful God who is thus accused, by those who believe in a special creation of souls, of triumphing and playing with puny man just because that man is small and the creature of the Almighty. A human life at most is seventy years; statistics reduce this to about forty; and out of that little remainder a large part is spent in sleep and another part in childhood. Thus in one life it is perfectly impossible to attain to the merest fraction of what Nature evidently has in view. We see many truths vaguely which a life gives us no time to grasp, and especially is this so when men have to make such a struggle to live at all. Our faculties are small or dwarfed or weak; one life gives no opportunity to alter this; we perceive other powers latent in us that cannot possibly be brought out in such a small space of time; and we have much more than a suspicion that the extent of the field of truth is vastly greater than the narrow circle we are confined to. It is not reasonable to suppose that either God or nature projects us into a body simply to fill us with bitterness because we can have no other opportunity here, but rather we must conclude that a series of incarnations has led to the present condition, and that the process of coming here again and again must go on for the purpose of affording us the opportunity needed.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 115, "pdf_page_number": 116, "html": "<p>The mere fact of dying is not of itself enough to bring about development of faculties or the elimination of wrong tendency and inclination. If we assume that upon entering heaven we at once acquire all knowledge and purity, then that state after death is reduced to a dead level and life itself with all its discipline is shorn of every meaning. Some of the churches teach of a school of discipline after death where it is impudently stated that the Apostles themselves, well known to be ignorant men, are to be the teachers. This is absurd and devoid of any basis or reason in the natural order. Besides, if there is to be such subsequent discipline, why were we projected into life at all? And why after the suffering and the error committed are we taken from the place where we did our acts? The only solution left is in reincarnation. We come back to earth because on it and with the beings upon it our deeds were performed; because it is the only proper place where punishment and reward can be justly meted out; because here is the only natural spot in which to continue the struggle toward perfection, toward the development of the faculties we have and the destruction of the wickedness in us. Justice to ourselves and to all other beings demands it, for we cannot live for ourselves, and it would be unjust to permit some of us to escape, leaving those who were participants with us to remain or to be plunged into a hell of eternal duration.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 116, "pdf_page_number": 117, "html": "<p>The persistence of savagery, the rise and decay of nations and civilizations, the total extinction of nations, all demand an explanation found nowhere but in reincarnation. Savagery remains because there are still Egos whose experience is so limited that they are still savage; they will come up into higher races when ready. Races die out because the Egos have had enough of the experience that sort of race gives. So we find the red Indian, the Hottentot, the Easter Islanders, and others as examples of races deserted by high Egos and as they are dying away other souls who have had no higher life in the past enter into the bodies of the race to go on using them for the purpose of gaining such experience as the race body will give. A race could not possibly arise and then suddenly go out. We see that such is not the case, but science has no explanation; it simply says that this is the fact, that nations decay. But in this explanation no account is taken of the inner man nor of the recondite subtle and occult laws that unite to make a race. Theosophy shows that the energy drawn together has to expend itself gradually, and therefore the reproduction of bodies of the character of that race will go on, though the Egos are not compelled to inhabit bodies of that sort any longer than while they are of the same development as the race. Hence a time comes when the whole mass of Egos which built up the race leaves it for another physical environment more like themselves. The economy of Nature will not permit the physical race to suddenly fade away, and so in the real order of evolution other and less progressed Egos come in and use the forms provided, keeping up the production of new bodies but less and less in number each century. These lower Egos are not able to keep up to the limit of the capacity of the congeries of energies left by the other Egos, and so while the new set gains as much experience as is possible the race in time dies out after passing through its decay. This is the explanation of what we may call descending savagery, and no other theory will meet the facts. It has been sometimes thought by ethnologists that the more civilized races kill off the other, but the fact is that in consequence of the great difference between the Egos inhabiting the old race body and the energy of that body itself, the females begin to be sterile, and thus slowly but surely the number of deaths exceeds the births. China itself is in process of decay, she being now in the almost stationary stage just before the rush downward. Great civilizations like those of Egypt and Babylon have gone because the souls who made them have long ago reincarnated in the great conquering nations of Europe and the present American continents. As nations and races they have been totally reincarnated and born again for greater and higher purposes than ever. Of all the old races the Aryan Indian alone yet remains as the preserver of the old doctrines. It will one day rise again to its old heights of glory.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 117, "pdf_page_number": 118, "html": "<p>The appearance of geniuses and great minds in families destitute of these qualities, as well as the extinction from a family of the genius shown by some ancestor, can only be met by the law of re-birth. Napoleon the First came in a family wholly unlike him in power and force. Nothing in his heredity will explain his character. He said himself, as told in the Memoirs of Prince Talleyrand, that he was Charlemagne. Only by assuming for him a long series of lives giving the right line of evolution or cause for his mind and nature and force to be brought out, can we have the slightest idea why he or any other great genius appeared at all. Mozart when an infant could compose orchestral scores. This was not due to heredity, for such a score is not natural, but is forced, mechanical, and wholly conventional, yet he understood it without schooling. How? Because he was a musician reincarnated, with a musical brain furnished by his family and thus not impeded in his endeavors to show forth his musical knowledge. But stronger yet is the case of Blind Tom, a negro whose family could not by any possibility have a knowledge of the piano, a modern instrument, so as to transmit that knowledge to the atoms of his body, yet he had great musical power and knew the present mechanical musical scale on the piano. There are hundreds of examples like these among the many prodigies who have appeared to the world’s astonishment. In India there are many histories of sages born with complete knowledge of philosophy and the like, and doubtless in all nations the same can be met with. This bringing back of knowledge also explains instinct, for that is no more than recollection divisible into physical and mental memory. It is seen in the child and the animal, and is no more than the result of previous experience. And whether we look at the new-born babe flinging out its arms for self-protection, or the animal with very strong instinctual power, or the bee building a cell on the rules of geometry, it is all the effect of reincarnation acting either in the mind or physical cell, for under what was first laid down no atom is devoid of life, consciousness, and intelligence of its own.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 118, "pdf_page_number": 119, "html": "<p>In the case of the musician Bach we have proof that heredity counts for nothing if the Ego is not advanced, for his genius was not borne down his family line; it gradually faded out, finally leaving the family stream entirely. So, too, the coming of idiots or vicious children to parents who are good, pure, or highly intellectual is explained in the same way. They are cases where heredity is set at nought by a wholly bad or deficient Ego.<\/p>\n<p>And lastly, the fact that certain inherent ideas are common to the whole race is explained by the sages as due to recollection of such ideas, which were implanted in the human mind at the very beginning of its evolutionary career on this planet by those brothers and sages who learned their lessons and were perfected in former ages long before the development of this globe began. No explanation for inherent ideas is offered by science that will do more than say, “they exist.” These were actually taught to the mass of Egos who are engaged in this earth’s evolution; they were imprinted or burned into their natures, and always recollected; they follow the Ego through the long pilgrimage.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 119, "pdf_page_number": 120, "html": "<p>It has been often thought that the opposition to reincarnation has been solely based on prejudice, when not due to a dogma which can only stand when the mind is bound down and prevented from using its own powers. It is a doctrine the most noble of all, and with its companion one of Karma, next to be considered, it alone gives the basis for ethics. There is no doubt in my mind that the founder of Christianity took it for granted and that its present absence from that religion is the reason for the contradiction between the professed ethics of Christian nations and their actual practices which are so contrary to the morals given out by Jesus.<\/p>", "images": [], "label": "10. Arguments Supporting Reincarnation (cont.)"}, {"pdf_page_index": 120, "pdf_page_number": 121, "html": "<h3 class=\"pdf-heading\">11. Karma<\/h3>\n<p>Karma is an unfamiliar word for Western ears. It is the name adopted by Theosophists of the nineteenth century for one of the most important of the laws of nature. Ceaseless in its operation, it bears alike upon planets, systems of planets, races, nations, families, and individuals. It is the twin doctrine to reincarnation. So inextricably interlaced are these two laws that it is almost impossible to properly consider one apart from the other. No spot or being in the universe is exempt from the operation of Karma, but all are under its sway, punished for error by it yet beneficently led on, through discipline, rest, and reward, to the distant heights of perfection. It is a law so comprehensive in its sweep, embracing at once our physical and our moral being, that it is only by paraphrase and copious explanation one can convey its meaning in English. For that reason the Sanskrit term <em>Karma<\/em> was adopted to designate it.<\/p>", "images": [], "label": "11. Karma"}, {"pdf_page_index": 121, "pdf_page_number": 122, "html": "<p>Applied to man’s moral life it is the law of ethical causation, justice, reward and punishment; the cause for birth and rebirth, yet equally the means for escape from incarnation. Viewed from another point it is merely effect flowing from cause, action and reaction, exact result for every thought and act. It is act and the result of act; for the word’s literal meaning is action. Theosophy views the Universe as an intelligent whole, hence every motion in the Universe is an action of that whole leading to results, which themselves become causes for further results. Viewing it thus broadly, the ancient Hindus said that every being up to Brahma was under the rule of Karma.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 122, "pdf_page_number": 123, "html": "<p>It is not a being but a law, the universal law of harmony which unerringly restores all disturbance to equilibrium. In this the theory conflicts with the ordinary conception about God, built up from the Jewish system, which assumes that the Almighty as a thinking entity, extraneous to the Cosmos, builds up, finds his construction inharmonious, out of proportion, errant, and disturbed, and then has to pull down, destroy, or punish that which he created. This has either caused thousands to live in fear of God, in compliance with his assumed commands, with the selfish object of obtaining reward and securing escape from his wrath, or has plunged them into darkness which comes from a denial of all spiritual life. But as there is plainly, indeed painfully, evident to every human being a constant destruction going on in and around us, a continual war not only among men but everywhere through the whole solar system, causing sorrow in all directions, reason requires a solution of the riddle. The poor, who see no refuge or hope, cry aloud to a God who makes no reply, and then envy springs up in them when they consider the comforts and opportunities of the rich. They see the rich profligates, the wealthy fools, enjoying themselves unpunished. Turning to the teacher of religion, they meet the reply to their questioning of the justice which will permit such misery to those who did nothing requiring them to be born with no means, no opportunities for education, no capacity to overcome social, racial, or circumstantial obstacles, “It is the will of God.” Parents produce beloved offspring who are cut off by death at an untimely hour, just when all promised well. They too have no answer to the question “Why am I thus afflicted?” but the same unreasonable reference to an inaccessible God whose arbitrary will causes their misery. Thus in every walk of life, loss, injury, persecution, deprivation of opportunity, nature’s own forces working to destroy the happiness of man, death, reverses, disappointment continually beset good and evil men alike. But nowhere is there any answer or relief save in the ancient truths that each man is the maker and fashioner of his own destiny, the only one who sets in motion the causes for his own happiness and misery. In one life he sows and in the next he reaps. Thus on and forever, the law of Karma leads him.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 123, "pdf_page_number": 124, "html": "<p>Karma is a beneficent law wholly merciful, relentlessly just, for true mercy is not favor but impartial justice.<\/p>\n<p>“My brothers! each man’s life<br />The outcome of his former living is;<br />The bygone wrongs bring forth sorrows and woes,<br />The bygone right breeds bliss. . . .<br />This is the doctrine of Karma.”<\/p>\n<p>How is the present life affected by that bygone right and wrong act, and is it always by way of punishment? Is Karma only fate under another name, an already fixed and formulated destiny from which no escape is possible, and which therefore might make us careless of act or thought that cannot affect destiny? It is not fatalism. Everything done in a former body has consequences which in the new birth the Ego must enjoy or suffer, for, as St. Paul said: “Brethren, be not deceived, God is not mocked, for whatsoever a man soweth that shall he also reap.” For the effect is in the cause, and Karma produces the manifestation of it in the body, brain, and mind furnished by reincarnation. And as a cause set up by one man has a distinct relation to him as a center from which it came, so each one experiences the results of his own acts. We may sometimes seem to receive effects solely from the acts of others, but this is the result of our own acts and thoughts in this or some prior life. We perform our acts in company with others always, and the acts with their underlying thoughts have relation always to other persons and to ourselves.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 124, "pdf_page_number": 125, "html": "<p>No act is performed without a thought at its root either at the time of performance or as leading to it. These thoughts are lodged in that part of man which we have called <em>Manas<\/em> — the mind, and there remain as subtle but powerful links with magnetic threads that enmesh the solar system, and through which various effects are brought out. The theory put forward in earlier pages that the whole system to which this globe belongs is alive, conscious on every plane, though only in man showing self-consciousness, comes into play here to explain how the thought under the act in this life may cause result in this or the next birth. The marvellous modern experiments in hypnotism show that the slightest impression, no matter how far back in the history of the person, may be waked up to life, thus proving it is not lost but only latent. Take for instance the case of a child born humpbacked and very short, the head sunk between the shoulders, the arms long and legs curtailed. Why is this? His karma for thoughts and acts in a prior life. He reviled, persecuted, or otherwise injured a deformed person so persistently or violently as to imprint in his own immortal mind the deformed picture of his victim. For in proportion to the intensity of his thought will be the intensity and depth of the picture. It is exactly similar to the exposure of the sensitive photographic plate, whereby, just as the exposure is long or short, the impression in the plate is weak or deep. So this thinker and actor — the Ego — coming again to rebirth carries with him this picture, and if the family to which he is attracted for birth has similar physical tendencies in its stream, the mental picture causes the newly-forming astral body to assume a deformed shape by electrical and magnetic osmosis through the mother of the child. And as all beings on earth are indissolubly joined together, the misshapen child is the karma of the parents also an exact consequence for similar acts and thoughts on their part in other lives. Here is an exactitude of justice which no other theory will furnish.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 125, "pdf_page_number": 126, "html": "<p>But as we often see a deformed human being — continuing the instance merely for the purpose of illustration — having a happy disposition, an excellent intellect, sound judgment, and every good moral quality, this very instance leads us to the conclusion that karma must be of several different kinds in every individual case, and also evidently operates in more than one department of our being, with the possibility of being pleasant in effect for one portion of our nature and unpleasant for another.<\/p>\n<p>Karma is of three sorts:<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 126, "pdf_page_number": 127, "html": "<p><em>First<\/em> — that which has not begun to produce any effect in our lives owing to the operation on us of some other karmic causes. This is under a law well known to physicists, that two opposing forces tend to neutrality, and that one force may be strong enough to temporarily prevent the operation of another one. This law works on the unseen mental and karmic planes or spheres of being just as it does on the material ones. The force of a certain set of bodily, mental, and psychical faculties with their tendencies may wholly inhibit the operation on us of causes with which we are connected, because the whole nature of each person is used in the carrying out of this law. Hence the weak and mediocre furnish a weak focus for karma, and in them the general result of a lifetime is limited, although they may feel it all to be very heavy. But that person who has a wide and deep-reaching character and much force will feel the operation of a greater quantity of karma than the weaker person.<\/p>\n<p><em>Second<\/em> — that karma which we are now making or storing up by our thoughts and acts, and which will operate in the future when the appropriate body, mind, and environment are taken up by the incarnating Ego in some other life, or whenever obstructive karma is removed.<\/p>\n<p>This bears both on the present life and the next one. For one may in this life come to a point where, all previous causes being worked out, new karma, or that which is unexpended, must begin to operate.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 127, "pdf_page_number": 128, "html": "<p>Under this are those cases where men have sudden reverses of fortune or changes for the better either in circumstances or character. A very important bearing of this is on our present conduct. While old karma must work out and cannot be stopped, it is wise for the man to so think and act now under present circumstances, no matter what they are, that he shall produce no bad or prejudicial causes for the next rebirth or for later years in this life. Rebellion is useless, for the law works on whether we weep or rejoice. The great French engineer, de Lesseps, is a good example of this class of karma. Raised to a high pitch of glory and achievement for many years of his life, he suddenly falls covered with shame through the Panama canal scandal. Whether he was innocent or guilty, he has the shame of the connection of his name with a national enterprise all besmirched with bribery and corruption that involved high officials. This was the operation of old karmic causes on him the very moment those which had governed his previous years were exhausted. Napoleon I is another, for he rose to a very great fame, then suddenly fell and died in exile and disgrace. Many other cases will occur to every thoughtful reader.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 128, "pdf_page_number": 129, "html": "<p><em>Third<\/em> — that karma which has begun to produce results. It is the operating now in this life on us of causes set up in previous lives in company with other Egos. And it is in operation because, being most adapted to the family stock, the individual body, astral body, and race tendencies of the present incarnation, it exhibits itself plainly, while other unexpended karma awaits its regular turn.<\/p>\n<p>These three classes of karma govern men, animals, worlds, and periods of evolution. Every effect flows from a cause precedent, and as all beings are constantly being reborn they are continually experiencing the effects of their thoughts and acts (which are themselves causes) of a prior incarnation. And thus each one answers, as St. Matthew says, for every word and thought; none can escape either by prayer, or favor, or force, or any other intermediary.<\/p>\n<p>Now as karmic causes are divisible into three classes, they must have various fields in which to work. They operate upon man in his mental and intellectual nature, in his psychical or soul nature, and in his body and circumstances. The spiritual nature of man is never affected or operated upon by karma.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 129, "pdf_page_number": 130, "html": "<p>One species of karma may act on the three specified planes of our nature at the same time to the same degree, or there may be a mixture of the causes, some on one plane and some on another. Take a deformed person who has a fine mind and a deficiency in his soul nature. Here punitive or unpleasant karma is operating on his body while in his mental and intellectual nature good karma is being experienced, but psychically the karma, or cause, being of an indifferent sort the result is indifferent. In another person other combinations appear. He has a fine body and favorable circumstances, but the character is morose, peevish, irritable, revengeful, morbid, and disagreeable to himself and others. Here good physical karma is at work with very bad mental, intellectual, and psychical karma. Cases will occur to readers of persons born in high station having every opportunity and power, yet being imbecile or suddenly becoming insane.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 130, "pdf_page_number": 131, "html": "<p>And just as all these phases of the law of karma have sway over the individual man, so they similarly operate upon races, nations, and families. Each race has its karma as a whole. If it be good that race goes forward. If bad it goes out — annihilated as a race — though the souls concerned take up their karma in other races and bodies. Nations cannot escape their national karma, and any nation that has acted in a wicked manner must suffer some day, be it soon or late. The karma of the nineteenth century in the West is the karma of Israel, for even the merest tyro can see that the Mosaic influence is the strongest in the European and American nations. The old Aztec and other ancient American peoples died out because their own karma — the result of their own life as nations in the far past — fell upon and destroyed them. With nations this heavy operation of karma is always through famine, war, convulsion of nature, and the sterility of the women of the nation. The latter cause comes near the end and sweeps the whole remnant away. And the individual in race or nation is warned by this great doctrine that if he falls into indifference of thought and act, thus molding himself into the general average karma of his race or nation, that national and race karma will at last carry him off in the general destiny. This is why teachers of old cried, “Come ye out and be ye separate.”<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 131, "pdf_page_number": 132, "html": "<p>With reincarnation the doctrine of karma explains the misery and suffering of the world, and no room is left to accuse Nature of injustice.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 132, "pdf_page_number": 133, "html": "<p>The misery of any nation or race is the direct result of the thoughts and acts of the Egos who make up the race or nation. In the dim past they did wickedly and now suffer. They violated the laws of harmony. The immutable rule is that harmony must be restored if violated. So these Egos suffer in making compensation and establishing the equilibrium of the occult cosmos. The whole mass of Egos must go on incarnating and reincarnating in the nation or race until they have all worked out to the end the causes set up. Though the nation may for a time disappear as a physical thing, the Egos that made it do not leave the world, but come out as the makers of some new nation in which they must go on with the task and take either punishment or reward as accords with their karma. Of this law the old Egyptians are an illustration. They certainly rose to a high point of development, and as certainly they were extinguished as a nation. But the souls — the old Egos — live on and are now fulfilling their self-made destiny as some other nation now in our period. They may be the new American nation, or the Jews fated to wander up and down in the world and suffer much at the hands of others. This process is perfectly just. Take, for instance, the United States and the Red Indians. The latter have been most shamefully treated by the nation. The Indian Egos will be reborn in the new and conquering people, and as members of that great family will be the means themselves of bringing on the due results for such acts as were done against them when they had red bodies. Thus it has happened before, and so it will come about again.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 133, "pdf_page_number": 134, "html": "<p>Individual unhappiness in any life is thus explained:<\/p>\n<p>(<em>a<\/em>) It is punishment for evil done in past lives; or (<em>b<\/em>) it is discipline taken up by the Ego for the purpose of eliminating defects or acquiring fortitude and sympathy. When defects are eliminated it is like removing the obstruction in an irrigating canal which then lets the water flow on. Happiness is explained in the same way: the result of prior lives of goodness.<\/p>\n<p>The scientific and self-compelling basis for right ethics is found in these and in no other doctrines. For if right ethics are to be practised merely for themselves, men will not see why, and have never been able to see why, for that reason they should do right. If ethics are to be followed from fear, man is degraded and will surely evade; if the favor of the Almighty, not based on law or justice, be the reason, then we will have just what prevails today — a code given by Jesus to the west professed by nations and not practised save by the few who would in any case be virtuous.<\/p>\n<p>On this subject the Adepts have written the following to be found in the <em>Secret Doctrine<\/em>:<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 134, "pdf_page_number": 135, "html": "<p>Nor would the ways of Karma be inscrutable were men to work in union and harmony, instead of disunion and strife. For our ignorance of those ways — which one portion of mankind calls the ways of Providence, dark and intricate, while another sees in them the action of blind Fatalism, and a third, simple chance, with neither gods nor devils to guide them — would surely disappear, if we would but attribute all these to their correct cause. With right knowledge, or at any rate with a confident conviction that our neighbors will no more work to hurt us than we would think of harming them, the two-thirds of the World’s evil would vanish into thin air. Were no man to hurt his brother, Karma-Nemesis would have neither cause to work for, nor weapons to act through. . . . We cut these numerous windings in our destinies daily with our own hands, while we imagine that we are pursuing a track on the royal high road of respectability and duty, and then complain of those ways being so intricate and so dark. We stand bewildered before the mystery of our own making, and the riddles of life that <em>we will not<\/em> solve, and then accuse the great Sphinx of devouring us. But verily there is not an accident in our lives, not a misshapen day, or a misfortune, that could not be traced back to our own doings in this or in another life. . . .<\/p>\n<p>. . . Knowledge of Karma gives the conviction that if —<br />“. . . . virtue in distress, and vice in triumph<br />Make atheists of mankind,”<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 135, "pdf_page_number": 136, "html": "<p>it is only because that mankind has ever shut its eyes to the great truth that man is himself his own saviour as his own destroyer. That he need not accuse Heaven and the gods, Fates and Providence, of the apparent injustice that reigns in the midst of humanity. But let him rather remember and repeat this bit of Grecian wisdom, which warns man to forbear accusing <em>That<\/em> which —<\/p>\n<p>“. . . . . . . . . . . . . . . . .”<br />“Just, though mysterious, leads us on unerring<br />Through ways unmark’d from guilt to punishment . . .”<\/p>\n<p>— which are now the ways and the high road on which move onward the great European nations. The Western Aryans had, every nation and tribe, like their Eastern brethren of the Fifth Race, their Golden and their Iron ages, their period of comparative irresponsibility, or the Satya age of purity, while now, several of them have reached their Iron Age, the <em>Kali Yuga<\/em>, an age Black with Horrors. . . .<\/p>\n<p>. . . This state will last . . . until we begin acting from <em>within<\/em> instead of ever following impulses from <em>without<\/em> . . . Until then the only palliative to the evils of life is union and harmony — a Brotherhood in actu, and <em>altruism<\/em> not simply in name.<\/p>", "images": [], "label": "11. Karma (cont.)"}, {"pdf_page_index": 136, "pdf_page_number": 137, "html": "<h3 class=\"pdf-heading\">12. Kama Loka<\/h3>\n<p>Let us now consider the states of man after the death of the body and before birth, having looked over the whole field of the evolution of things and beings in a general way. This brings up at once the questions: Is there any heaven or hell, and what are they? Are they states or places? Is there a spot in space where they may be found and to which we go or from where we come? We must also go back to the subject of the fourth principle of the constitution of man, that called <em>Kama<\/em> in Sanskrit and desire or passion in English. Bearing in mind what was said about that principle, and also the teaching in respect to the astral body and the Astral Light, it will be easier to understand what is taught about the two states <em>ante<\/em> and <em>post mortem<\/em>. In chronological order we go into <em>kama loka<\/em> — or the plane of desire — first on the demise of the body, and then the higher principles, the real man, fall into the state of <em>Devachan<\/em>. After dealing with <em>kama loka<\/em> it will be more easy to study the question of <em>Devachan<\/em>.<\/p>", "images": [], "label": "12. Kama Loka"}, {"pdf_page_index": 137, "pdf_page_number": 138, "html": "<p>The breath leaves the body and we say the man is dead, but that is only the beginning of death; it proceeds on other planes. When the frame is cold and eyes closed, all the forces of the body and mind rush through the brain, and by a series of pictures the whole life just ended is imprinted indelibly on the inner man not only in a general outline but down to the smallest detail of even the most minute and fleeting impression. At this moment, though every indication leads the physician to pronounce for death and though to all intents and purposes the person is dead to this life, the real man is busy in the brain, and not until his work there is ended is the person gone. When this solemn work is over the astral body detaches itself from the physical, and, life energy having departed, the remaining five principles are in the plane of <em>kama loka<\/em>.<\/p>\n<p>The natural separation of the principles brought about by death divides the total man into three parts:<\/p>\n<p><em>First<\/em>, the visible body with all its elements left to further disintegration on the earth plane, where all that it is composed of is in time resolved into the different physical departments of nature;<\/p>\n<p><em>Second<\/em>, the <em>kama rupa<\/em> made up of the astral body and the passions and desires, which also begins at once to go to pieces on the astral plane;<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 138, "pdf_page_number": 139, "html": "<p><em>Third<\/em>, the real man, the upper triad of <em>Atma-Buddhi-Manas<\/em>, deathless but now out of earth conditions, devoid of body, begins in <em>devachan<\/em> to function solely as mind clothed in a very ethereal vesture which it will shake off when the time comes for it to return to earth.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 139, "pdf_page_number": 140, "html": "<p><em>Kama loka<\/em> — or the place of desire — is the astral region penetrating and surrounding the earth. As a place it is on and in and about the earth. Its extent is to a measurable distance from the earth, but the ordinary laws obtaining here do not obtain there, and entities therein are not under the same conditions as to space and time as we are. As a state it is metaphysical, though that metaphysic relates to the astral plane. It is called the plane of desire because it relates to the fourth principle, and in it the ruling force is desire devoid of and divorced from intelligence. It is an astral sphere intermediate between earthly and heavenly life. Beyond any doubt it is the origin of the Christian theory of purgatory, where the soul undergoes penance for evil done and from which it can be released by prayer and other ceremonies or offerings. The fact underlying this superstition is that the soul may be detained in <em>kama<\/em> <em>loka<\/em> by the enormous force of some unsatisfied desire, and cannot get rid of the astral and kamic clothing until that desire is satisfied by some one on earth or by the soul itself. But if the person was pure minded and of high aspirations, the separation of the principles on that plane is soon completed, permitting the higher triad to go into <em>Devachan<\/em>. Being the purely astral sphere, it partakes of the nature of the astral matter which is essentially earthly and devilish, and in it all the forces work undirected by soul or conscience. It is the slag-pit, as it were, of the great furnace of life, where nature provides for the sloughing off of elements which have no place in <em>Devachan<\/em>, and for that reason it must have many degrees, every one of which was noted by the ancients. These degrees are known in Sanskrit as <em>lokas<\/em> or places in a metaphysical sense. Human life is very varied as to character and other potentialities, and for each of these the appropriate place after death is provided, thus making <em>kama loka<\/em> an infinitely varied sphere. In life some of the differences among men are modified and some inhibited by a similarity of body and heredity, but in <em>kama<\/em> <em>loka<\/em> all the hidden desires and passions are let loose in consequence of the absence of body, and for that reason the state is vastly more diversified than the life plane. Not only is it necessary to provide for the natural varieties and differences, but also for those caused by the manner of death, about which something shall be said. And all these various divisions are but the natural result of the life thoughts and last thoughts of the persons who die on earth. It is beyond the scope of this work to go into a description of all these degrees, inasmuch as volumes would be needed to describe them, and then but few would understand.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 140, "pdf_page_number": 141, "html": "<p>To deal with <em>kama loka<\/em> compels us to deal also with the fourth principle in the classification of man’s constitution, and arouses a conflict with modern ideas and education on the subject of the desires and passions. It is generally supposed that the desires and passions are inherent tendencies in the individual, and they have an altogether unreal and misty appearance for the ordinary student. But in this system of philosophy they are not merely inherent in the individual nor are they due to the body <em>per se<\/em>. While the man is living in the world the desires and passions — the principle <em>kama<\/em> — have no separate life apart from the astral and inner man, being, so to say, diffused throughout his being. But as they coalesce with the astral body after death and thus form an entity with its own term of life, though without soul, very important questions arise. During mortal life the desires and passions are guided by the mind and soul; after death they work without guidance from the former master; while we live we are responsible for them and their effects, and when we have left this life we are still responsible, although they go on working and making effects on others while they last as the sort of entity I have described, and without our direct guidance. In this is seen the continuance of responsibility. They are a portion of the <em>skandhas<\/em> — well known in eastern philosophy — which are the aggregates that make up the man. The body includes one set of the <em>skandhas<\/em>, the astral man another, the <em>kama<\/em> principle is another set, and still others pertain to other parts. In <em>kama<\/em> are the really active and important ones which control rebirths and lead to all the varieties of life and circumstance upon each rebirth. They are being made from day to day under the law that every thought combines instantly with one of the elemental forces of nature, becoming to that extent an entity which will endure in accordance with the strength of the thought as it leaves the brain, and all of these are inseparably connected with the being who evolved them. There is no way of escaping; all we can do is to have thoughts of good quality, for the highest of the Masters themselves are not exempt from this law, but they “people their current in space” with entities powerful for good alone.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 141, "pdf_page_number": 142, "html": "<p>Now in <em>kama loka<\/em> this mass of desire and thought exists very definitely until the conclusion of its disintegration, and then the remainder consists of the essence of these <em>skandhas<\/em>, connected, of course, with the being that evolved and had them. They can no more be done away with than we can blot out the universe. Hence they are said to remain until the being comes out of <em>devachan<\/em>, and then at once by the law of attraction they are drawn to the being, who from them as germ or basis builds up a new set of <em>skandhas<\/em> for the new life. <em>Kama loka<\/em> therefore is distinguished from the earth plane by reason of the existence therein, uncontrolled and unguided, of the mass of passions and desires; but at the same time earth-life is also a <em>kama loka<\/em>, since it is largely governed by the principle <em>kama<\/em>, and will be so until at a far distant time in the course of evolution the races of men shall have developed the fifth and sixth principle, thus throwing <em>kama<\/em> into its own sphere and freeing earth-life from its influence.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 142, "pdf_page_number": 143, "html": "<p>The astral man in <em>kama loka<\/em> is a mere shell devoid of soul and mind, without conscience and also unable to act unless vivified by forces outside of itself. It has that which seems like an animal or automatic consciousness due wholly to the very recent association with the human Ego. For under the principle laid down in another chapter, every atom going to make up the man has a memory of its own which is capable of lasting a length of time in proportion to the force given it. In the case of a very material and gross or selfish person the force lasts longer than in any other, and hence in that case the automatic consciousness will be more definite and bewildering to one who without knowledge dabbles with necromancy. Its purely astral portion contains and carries the record of all that ever passed before the person when living, for one of the qualities of the astral substance is to absorb all scenes and pictures and the impressions of all thoughts, to keep them, and to throw them forth by reflection when the conditions permit. This astral shell, cast off by every man at death, would be a menace to all men were it not in every case, except one which shall be mentioned, devoid of all the higher principles which are the directors. But those guiding constituents being disjoined from the shell, it wavers and floats about from place to place without any will of its own, but governed wholly by attractions in the astral and magnetic fields.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 143, "pdf_page_number": 144, "html": "<p>It is possible for the real man — called the spirit by some — to communicate with us immediately after death for a few brief moments, but, those passed, the soul has no more to do with earth until reincarnated. What can and do influence the sensitive and the medium from out of this sphere are the shells I have described. Soulless and conscienceless, these in no sense are the spirits of our deceased ones. They are the clothing thrown off by the inner man, the brutal earthly portion discarded in the flight to <em>devachan<\/em>, and so have always been considered by the ancients as devils — our personal devils — because essentially astral, earthly, and passional. It would be strange indeed if this shell, after being for so long the vehicle of the real man on earth, did not retain an automatic memory and consciousness. We see the decapitated body of the frog or the cock moving and acting for a time with a seeming intelligence, and why is it not possible for the finer and more subtle astral form to act and move with a far greater amount of seeming mental direction?<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 144, "pdf_page_number": 145, "html": "<p>Existing in the sphere of <em>kama loka<\/em>, as, indeed, also in all parts of the globe and the solar system, are the elementals or nature forces. They are innumerable, and their divisions are almost infinite, as they are, in a sense, the nerves of nature. Each class has its own work just as has every natural element or thing. As fire burns and as water runs down and not up under their general law, so the elementals act under law, but being higher in the scale than gross fire or water their action seems guided by mind. Some of them have a special relation to mental operations and to the action of the astral organs, whether these be joined to a body or not. When a medium forms the channel, and also from other natural coordination, these elementals make an artificial connection with the shell of a deceased person, aided by the nervous fluid of the medium and others near, and then the shell is galvanized into an artificial life. Through the medium connection is made with the physical and psychical forces of all present. The old impressions on the astral body give up their images to the mind of the medium, the old passions are set on fire. Various messages and reports are then obtained from it, but not one of them is original, not one is from the spirit. By their strangeness, and in consequence of the ignorance of those who dabble in it, this is mistaken for the work of spirit, but it is all from the living when it is not the mere picking out from the astral light of the images of what has been in the past. In certain cases to be noted there is an intelligence at work that is wholly and intensely bad, to which every medium is subject, and which will explain why so many of them have succumbed to evil, as they have confessed.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 145, "pdf_page_number": 146, "html": "<p>A rough classification of these shells that visit mediums would be as follows:<\/p>\n<p>(1) Those of the recently deceased whose place of burial is not far away. This class will be quite coherent in accordance with the life and thought of the former owner. An unmaterial, good, and spiritualized person leaves a shell that will soon disintegrate. A gross, mean, selfish, material person’s shell will be heavy, consistent, and long lived: and so on with all varieties.<\/p>\n<p>(2) Those of persons who had died far away from the place where the medium is. Lapse of time permits such to escape from the vicinity of their old bodies, and at the same time brings on a greater degree of disintegration which corresponds on the astral plane to putrefaction on the physical. These are vague, shadowy, incoherent; respond but briefly to the psychic stimulus, and are whirled off by any magnetic current. They are galvanized for a moment by the astral currents of the medium and of those persons present who were related to the deceased.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 146, "pdf_page_number": 147, "html": "<p>(3) Purely shadowy remains which can hardly be given a place. There is no English to describe them, though they are facts in this sphere. They might be said to be the mere mold or impress left in the astral substance by the once coherent shell long since disintegrated. They are therefore so near being fictitious as to almost deserve the designation. As such shadowy photographs they are enlarged, decorated, and given an imaginary life by the thoughts, desires, hopes, and imaginings of medium and sitters at the <em>seance<\/em>.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 147, "pdf_page_number": 148, "html": "<p>(4) Definite, coherent entities, human souls bereft of the spiritual tie, now tending down to the worst state of all, <em>avichi<\/em>, where annihilation of the personality is the end. They are known as black magicians. Having centered the consciousness in the principle of <em>kama<\/em>, preserved intellect, divorced themselves from spirit, they are the only damned beings we know. In life they had human bodies and reached their awful state by persistent lives of evil for its own sake; some of such already doomed to become what I have described, are among us on earth today. These are not ordinary shells, for they have centered all their force in <em>kama<\/em>, thrown out every spark of good thought or aspiration, and have a complete mastery of the astral sphere. I put them in the classification of shells because they are such in the sense that they are doomed to disintegration consciously as the others are to the same end mechanically only. They may and do last for many centuries, gratifying their lusts through any sensitive they can lay hold of where bad thought gives them an opening. They preside at nearly all <em>seances<\/em>, assuming high names and taking the direction so as to keep the control and continue the delusion of the medium, thus enabling themselves to have a convenient channel for their own evil purposes. Indeed, with the shells of suicides, of those poor wretches who die at the hand of the law, of drunkards and gluttons, these black magicians living in the astral world hold the field of physical mediumship and are liable to invade the sphere of any medium no matter how good. The door once open, it is open to all. This class of shell has lost higher <em>manas<\/em>, but in the struggle not only after death but as well in life the lower portion of <em>manas <\/em>which should have been raised up to godlike excellence was torn away from its lord and now gives this entity intelligence which is devoid of spirit but power to suffer as it will when its final day shall come.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 148, "pdf_page_number": 149, "html": "<p>In the state of <em>Kama Loka<\/em> suicides and those who are suddenly shot out of life by accident or murder, legal or illegal, pass a term almost equal to the length life would have been but for the sudden termination. These are not really dead. To bring on a normal death, a factor not recognized by medical science must be present. That is, the principles of the being as described in other chapters have their own term of cohesion, at the natural end of which they separate from each other under their own laws. This involves the great subject of the cohesive forces of the human subject, requiring a book in itself. I must be content therefore with the assertion that this law of cohesion obtains among the human principles. Before that natural end the principles are unable to separate. Obviously the normal destruction of the cohesive force cannot be brought about by mechanical processes except in respect to the physical body. Hence a suicide, or person killed by accident or murdered by man or by order of human law, has not come to the natural termination of the cohesion among the other constituents, and is hurled into the <em>kama loka<\/em> state only partly dead. There the remaining principles have to wait until the actual natural life term is reached, whether it be one month or sixty years.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 149, "pdf_page_number": 150, "html": "<p>But the degrees of <em>kama loka<\/em> provide for the many varieties of the last-mentioned shells. Some pass the period in great suffering, others in a dreamy sort of sleep, each according to the moral responsibility. But executed criminals are in general thrown out of life full of hate and revenge, smarting under a penalty they do not admit the justice of. They are ever rehearsing in <em>kama loka<\/em> their crime, their trial, their execution, and their revenge. And whenever they can gain touch with a sensitive living person, medium or not, they attempt to inject thoughts of murder and other crime into the brain of such unfortunate. And that they succeed in such attempts the deeper students of Theosophy full well know.<\/p>\n<p>We have now approached <em>devachan<\/em>. After a certain time in <em>kama loka<\/em> the being falls into a state of unconsciousness which precedes the change into the next state. It is like the birth into life, preluded by a term of darkness and heavy sleep. It then wakes to the joys of <em>devachan<\/em>.<\/p>", "images": [], "label": "12. Kama Loka (cont.)"}, {"pdf_page_index": 150, "pdf_page_number": 151, "html": "<h3 class=\"pdf-heading\">13. Devachan<\/h3>\n<p>Having shown that just beyond the threshold of human life there is a place of separation wherein the better part of man is divided from his lower and brute elements, we come to consider what is the state after death of the real being, the immortal who travels from life to life. Struggling out of the body the entire man goes into <em>kama loka<\/em>, to purgatory, where he again struggles and loosens himself from the lower <em>skandhas<\/em>; this period of birth over, the higher principles, <em>Atma-Buddhi-Manas<\/em>, begin to think in a manner different from that which the body and brain permitted in life. This is the state of <em>Devachan<\/em>, a Sanskrit word meaning literally “the place of the gods,” where the soul enjoys felicity; but as the gods have no such bodies as ours, the Self in <em>devachan<\/em> is devoid of a mortal body. In the ancient books it is said that this state lasts “for years of infinite number,” or “for a period proportionate to the merit of the being”; and when the mental forces peculiar to the state are exhausted, “the being is drawn down again to be reborn in the world of mortals.” <em>Devachan<\/em> is therefore an interlude between births in the world. The law of karma which forces us all to enter the world, being ceaseless in its operation and also universal in scope, acts also on the being in <em>devachan<\/em>, for only by the force or operation of Karma are we taken out of <em>devachan<\/em>. It is something like the pressure of atmosphere which, being continuous and uniform, will push out or crush that which is subjected to it unless there be a compensating quantity of atmosphere to counteract the pressure. In the present case the karma of the being is the atmosphere always pressing the being on or out from state to state; the counteracting quantity of atmosphere is the force of the being’s own life-thoughts and aspirations which prevent his coming out of <
