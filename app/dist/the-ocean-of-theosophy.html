tion stands to this day for all practical purposes, but it is capable of modification and extension. For instance, a later arrangement which places Astral body second instead of third in the category does not substantially alter it. It at once gives an idea of what man is, very different from the vague description by the words “body and soul,” and also boldly challenges the materialistic conception that mind is the product of brain, a portion of the body. No claim is made that these principles were hitherto unknown, for they were all understood in various ways not only by the Hindus but by many Europeans. Yet the compact presentation of the sevenfold constitution of man in intimate connection with the septenary constitution of a chain of globes through which the being evolves, had not been given out. The French Abbe, Eliphas Levi, wrote about the astral realm and the astral body, but evidently had no knowledge of the remainder of the doctrine, and while the Hindus possessed the other terms in their language and philosophy, they did not use a septenary classification, but depended chiefly on a fourfold one and certainly concealed (if they knew of it) the doctrine of a chain of seven globes including our earth. Indeed, a learned Hindu, Subba Row, now deceased, asserted that they knew of a seven-fold classification, but that it had not been and would not be given out.<\/p>", "images": [], "label": "4. Septenary Constitution of Man (cont.)"}, {"pdf_page_index": 47, "pdf_page_number": 48, "html": "<p>Considering these constituents in another manner, we would say that the lower man is a composite being, but in his real nature is a unity, or immortal being, comprising a trinity of Spirit, Discernment, and Mind which requires four lower mortal instruments or vehicles through which to work in matter and obtain experience from Nature. This trinity is that called <em>Atma-Buddhi-Manas<\/em> in Sanskrit, difficult terms to render in English. <em>Atma<\/em> is Spirit, <em>Buddhi<\/em> is the highest power of intellection, that which discerns and judges, and <em>Manas<\/em> is Mind. This threefold collection is the real man; and beyond doubt the doctrine is the origin of the theological one of the trinity of Father, Son, and Holy Ghost. The four lower instruments or vehicles are shown in this table:<\/p>\n<p><strong>Real Man:<\/strong> <em>Atma, Buddhi, Manas<\/em>,<\/p>\n<p><strong>Lower Vehicles:<\/strong><\/p>\n<p>The Passions and Desires,<\/p>\n<p>Life Principle,<\/p>\n<p>Astral Body,<\/p>\n<p>Physical Body.<\/p>", "images": [], "label": "4. Septenary Constitution of Man (cont.)"}, {"pdf_page_index": 48, "pdf_page_number": 49, "html": "<p>These four lower material constituents are transitory and subject to disintegration in themselves as well as to separation from each other. When the hour arrives for their separation to begin, the combination can no longer be kept up, the physical body dies, the atoms of which each of the four is composed begin to separate from each other, and the whole collection being disjointed is no longer fit for one as an instrument for the real man. This is what is called “death” among us mortals, but it is not death for the real man because he is deathless, persistent, immortal. He is therefore called the Triad, or indestructible trinity, while they are known as the Quaternary or mortal four.<\/p>", "images": [], "label": "4. Septenary Constitution of Man (cont.)"}, {"pdf_page_index": 49, "pdf_page_number": 50, "html": "<p>This quaternary or lower man is a product of cosmic or physical laws and substance. It has been evolved during a lapse of ages, like any other physical thing, from cosmic substance, and is therefore subject to physical, physiological, and psychical laws which govern the race of man as a whole. Hence its period of possible continuance can be calculated just as the limit of tensile strain among the metals used in bridge building can be deduced by the engineer. Any one collection in the form of man made up of these constituents is therefore limited in duration by the laws of the evolutionary period in which it exists. Just now, that is generally seventy to one hundred years, but its possible duration is longer. Thus there are in history instances where ordinary persons have lived to be two hundred years of age; and by a knowledge of the occult laws of nature the possible limit of duration may be extended nearly to four hundred years.<\/p>\n<p>The visible physical man is: Brain, Nerves, Blood, Bones, Lymph, Muscles, Organs of Sensation and Action, and Skin.<\/p>\n<p>The unseen physical man is: Astral Body, Passions and Desires, Life Principle (called <em>prana<\/em> or <em>jiva<\/em>).<\/p>", "images": [], "label": "4. Septenary Constitution of Man (cont.)"}, {"pdf_page_index": 50, "pdf_page_number": 51, "html": "<p>It will be seen that the physical part of our nature is thus extended to a second department which, though invisible to the physical eye, is nevertheless material and subject to decay. Because people in general have been in the habit of admitting to be real only what they can see with the physical eye, they have at last come to suppose that the unseen is neither real nor material. But they forgot that even on the earth plane noxious gases are invisible though real and powerfully material, and that water may exist in the air held suspended and invisible until conditions alter and cause its precipitation.<\/p>", "images": [], "label": "4. Septenary Constitution of Man (cont.)"}, {"pdf_page_index": 51, "pdf_page_number": 52, "html": "<p>Let us recapitulate before going into details. The <em>Real Man<\/em> is the trinity of <em>Atma-Buddhi-Manas<\/em>, or Spirit and Mind, and he uses certain agents and instruments to get in touch with nature in order to know himself. These instruments and agents are found in the lower Four — or the Quaternary — each principle in which category is of itself an instrument for the particular experience belonging to its own field, the body being the lowest, least important, and most transitory of the whole series. For when we arrive at the body on the way down from the Higher Mind, it can be shown that all of its organs are in themselves senseless and useless when deprived of the man within. Sight, hearing, touch, taste, and smelling do not pertain to the body but to the second unseen physical man, the real organs for the exercise of those powers being in the Astral Body, and those in the physical body being but the mechanical outer instruments for making the coordination between nature and the real organs inside.<\/p>", "images": [], "label": "4. Septenary Constitution of Man (cont.)"}, {"pdf_page_index": 52, "pdf_page_number": 53, "html": "<h3 class=\"pdf-heading\">5. Body and Astral Body<\/h3>\n<p>The body, as a mass of flesh, bones, muscles, nerves, brain matter, bile, mucous, blood, and skin is an object of exclusive care for too many people, who make it their god because they have come to identify themselves with it, meaning it only when they say “I.” Left to itself it is devoid of sense, and acts in such a case solely by reflex and automatic action. This we see in sleep, for then the body assumes attitudes and makes motions which the waking man does not permit. It is like mother earth in that it is made up of a number of infinitesimal “lives.” Each of these lives is a sensitive point. Not only are there microbes, bacilli, and bacteria, but these are composed of others, and those others of still more minute lives. These lives are not the cells of the body, but make up the cells, keeping ever within the limits assigned by evolution to the cell. They are forever whirling and moving together throughout the whole body, being in certain apparently void spaces as well as where flesh, membrane, bones, and blood are seen. They extend, too, beyond the actual outer limits of the body to a measurable distance.<\/p>", "images": [], "label": "5. Body and Astral Body"}, {"pdf_page_index": 53, "pdf_page_number": 54, "html": "<p>One of the mysteries of physical life is hidden among these “lives.” Their action, forced forward by the Life energy — called <em>Prana<\/em> or <em>Jiva<\/em> — will explain active existence and physical death. They are divided into two classes, one the destroyers, the other the preservers, and these two war upon each other from birth until the destroyers win. In this struggle the Life Energy itself ends the contest because it is life that kills. This may seem heterodox, but in Theosophical philosophy it is held to be the fact. For, it is said, the infant lives because the combination of healthy organs is able to absorb the life all around it in space, and is put to sleep each day by the overpowering strength of the stream of life, since the preservers among the cells of the youthful body are not yet mastered by the other class. These processes of going to sleep and waking again are simply and solely the restoring of the equilibrium in sleep and the action produced by disturbing it when awake. It may be compared with the arc-electric light wherein the brilliant arc of light at the point of resistance is the symbol of the waking active man. So in sleep we are again absorbing and not resisting the Life Energy; when we wake we are throwing it off. But as it exists around us like an ocean in which we swim, our power to throw it off is necessarily limited. Just when we wake we are in equilibrium as to our organs and life; when we fall asleep we are yet more full of life than in the morning; it has exhausted us; it finally kills the body. Such a contest could not be waged forever, since the whole solar system’s weight of life is pitted against the power to resist focussed in one small human frame.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 54, "pdf_page_number": 55, "html": "<p>The body is considered by the Masters of Wisdom to be the most transitory, impermanent, and illusionary of the whole series of constituents in man. Not for a moment is it the same. Ever changing, in motion in every part, it is in fact never complete or finished though tangible. The ancients clearly perceived this, for they elaborated a doctrine called Nitya Pralaya, or the continual change in material things, the continual destruction. This is known now to science in the doctrine that the body undergoes a complete alteration and renovation every seven years. At the end of the first seven years it is not the same body it was in the beginning. At the end of our days it has changed seven times, perhaps more. And yet it presents the same general appearance from maturity until death; and it is a human form from birth to maturity. This is a mystery science explains not; it is a question pertaining to the cell and to the means whereby the general human shape is preserved.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 55, "pdf_page_number": 56, "html": "<p>The “cell” is an illusion. It is merely a word. It has no existence as a material thing, for any cell is composed of other cells. What, then, is a cell? It is the ideal form within which the actual physical atoms — made up of the “lives” — arrange themselves. As it is admitted that the physical molecules are forever rushing away from the body, they must be leaving the cells each moment. Hence there is no physical cell, but the privative limits of one, the ideal walls and general shape. The molecules assume position within the ideal shape according to the laws of nature, and leave it again almost at once to give place to other atoms. And as it is thus with the body, so is it with the earth and with the solar system. Thus also is it, though in slower measure, with all material objects. They are all in constant motion and change. This is modern and also ancient wisdom. This is the physical explanation of clairvoyance, clairaudience, telepathy, and mind-reading. It helps to show us what a deluding and unsatisfactory thing our body is.<\/p>\n<p>Although, strictly speaking, the second constituent of man is the Astral Body — called in Sanskrit <em>Linga Sarira<\/em> — we will consider Life Energy — or <em>Prana<\/em> and <em>Jiva<\/em> in Sanskrit — together, because to our observation the phenomenon of life is more plainly exhibited in connection with the body.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 56, "pdf_page_number": 57, "html": "<p>Life is not the result of the operation of the organs, nor is it gone when the body dissolves. It is a universally pervasive principle. It is the ocean in which the earth floats; it permeates the globe and every being and object on it. It works unceasingly on and around us, pulsating against and through us forever. When we occupy a body we merely use a more specialized instrument than any other for dealing with both <em>Prana<\/em> and <em>Jiva<\/em>. Strictly speaking, Prana is breath; and as breath is necessary for continuance of life in the human machine, that is the better word. Jiva means “life,” and also is applied to the living soul, for the life in general is derived from the Supreme Life itself. <em>Jiva<\/em> is therefore capable of general application, whereas <em>Prana<\/em> is more particular. It cannot be said that one has a definite amount of this Life Energy which will fly back to its source should the body be burned, but rather that it works with whatever be the mass of matter in it. We, as it were, secrete or use it as we live. For whether we are alive or dead, life-energy is still there; in life among our organs sustaining them, in death among the innumerable creatures that arise from our destruction. We can no more do away with this life than we can erase the air in which the bird floats, and like the air it fills all the spaces on the planet, so that nowhere can we lose the benefit of it nor escape its final crushing power. But in working upon the physical body this life — <em>Prana<\/em> — needs a vehicle, means, or guide, and this vehicle is the astral body.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 57, "pdf_page_number": 58, "html": "<p>There are many names for the Astral Body. Here are a few: <em>Linga Sarira<\/em>, Sanskrit, meaning design body, and the best one of all; ethereal double; phantom; wraith; apparition; doppelganger; personal man; perisprit; irrational soul; animal soul; <em>Bhuta<\/em>; elementary; spook; devil; demon. Some of these apply only to the astral body when devoid of the corpus after death. <em>Bhuta<\/em>, devil, and elementary are nearly synonymous; the first Sanskrit, the other English. With the Hindus the <em>Bhuta<\/em> is the Astral Body when it is by death released from the body and the mind; and being thus separated from conscience, is a devil in their estimation. They are not far wrong, if we abolish the old notion that a devil is an angel fallen from heaven, for this bodily devil is something which rises from the earth.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 58, "pdf_page_number": 59, "html": "<p>It may be objected that the term Astral Body is not the right one for this purpose. The objection is one which arises from the nature and genesis of the English language, for as that has grown up in a struggle with nature and among a commercial people it has not as yet coined the words needed for designating the great range of faculties and organs of the unseen man. And as its philosophers have not admitted the existence of these inner organs, the right terms do not exist in the language. So in looking for words to describe the inner body the only ones found in English were the “astral body.” This term comes near to the real fact, since the substance of this form is derived from cosmic matter or star matter, roughly speaking. But the old Sanskrit word describes it exactly — <em>Linga Sarira<\/em>, the design body — because it is the design or model for the physical body. This is better than “ethereal body,” as the latter might be said to be subsequent to the physical, whereas in fact the astral body precedes the material one.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 59, "pdf_page_number": 60, "html": "<p>The astral body is made of matter of very fine texture as compared with the visible body, and has a great tensile strength, so that it changes but little during a lifetime, while the physical alters every moment. And not only has it this immense strength, but at the same time possesses an elasticity permitting its extension to a considerable distance. It is flexible, plastic, extensible, and strong. The matter of which it is composed is electrical and magnetic in its essence, and is just what the whole world was composed of in the dim past when the processes of evolution had not yet arrived at the point of producing the material body for man. But it is not raw or crude matter. Having been through a vast period of evolution and undergone purifying processes of an incalculable number, its nature has been refined to a degree far beyond the gross physical elements we see and touch with the physical eye and hand.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 60, "pdf_page_number": 61, "html": "<p>The astral body is the guiding model for the physical one, and all the other kingdoms have the same astral model. Vegetables, minerals, and animals have the ethereal double, and this theory is the only one which will answer the question how it is that the seed produces its own kind and all sentient beings bring forth their like. Biologists can only say that the facts are as we know them, but can give no reason why the acorn will never grow anything but an oak except that no man ever knew it to be otherwise. But in the old schools of the past the true doctrine was known, and it has been once again brought out in the West through the efforts of H. P. Blavatsky and those who have found inspiration in her works.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 61, "pdf_page_number": 62, "html": "<p>This doctrine is, that in early times of the evolution of this globe the various kingdoms of nature are outlined in plan or ideal form first, and then the astral matter begins to work on this plan with the aid of the Life principle, until after long ages the astral human form is evolved and perfected. This is, then, the first form that the human race had, and corresponds in a way with the allegory of man’s state in the garden of Eden. After another long period, during which the cycle of further descent into matter is rolling forward, the astral form at last clothes itself with a “coat of skin,” and the present physical form is on the scene. This is the explanation of the verse of the book of Genesis which describes the giving of coats of skin to Adam and Eve. It is the final fall into matter, for from that point on the man within strives to raise the whole mass of physical substance up to a higher level, and to inform it all with a larger measure of spiritual influence, so that it may be ready to go still further on during the next great period of evolution after the present one is ended. So at the present time the model for the growing child in the womb is the astral body already perfect in shape before the child is born. It is on this the molecules arrange themselves until the child is complete, and the presence of the ethereal design-body will explain how the form grows into shape, how the eyes push themselves out from within to the surface of the face, and many other mysterious matters in embryology which are passed over by medical men with a description but with no explanation. This will also explain, as nothing else can, the cases of marking of the child in the womb sometimes denied by physicians but well-known by those who care to watch, to be a fact of frequent occurrence. The growing physical form is subject to the astral model; it is connected with the imagination of the mother by physical and psychical organs; the mother makes a strong picture from horror, fear, or otherwise, and the astral model is then similarly affected. In the case of marking by being born legless, the ideas and strong imagination of the mother act so as to cut off or shrivel up the astral leg, and the result is that the molecules, having no model of leg to work on, make no physical leg whatever; and similarly in all such cases. But where we find a man who still feels the leg which the surgeon has cut off, or perceives the fingers that were amputated, then the astral member has not been interfered with, and hence the man feels as if it were still on his person. For knife or acid will not injure the astral model, but in the first stages of its growth ideas and imagination have the power of acid and sharpened steel.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 62, "pdf_page_number": 63, "html": "<p>In the ordinary man who has not been trained in practical occultism or who has not the faculty by birth, the astral body cannot go more than a few feet from the physical one. It is a part of that physical, it sustains it and is incorporated in it just as the fibers of the mango are all through that fruit. But there are those who, by reason of practices pursued in former lives on the earth, have a power born with them of unconsciously sending out the astral body. These are mediums, some seers, and many hysterical, cataleptic, and scrofulous people. Those who have trained themselves by a long course of excessively hard discipline which reaches to the moral and mental nature and quite beyond the power of the average man of the day, can use the astral form at will, for they have gotten completely over the delusion that the physical body is a permanent part of them, and, besides, they have learned the chemical and electrical laws governing in this matter. In their case they act with knowledge and consciously; in the other cases the act is done without power to prevent it, or to bring it about at will, or to avoid the risks attendant on such use of potencies in nature of a high character.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 63, "pdf_page_number": 64, "html": "<p>The astral body has in it the real organs of the outer sense organs. In it are the sight, hearing, power to smell, and the sense of touch. It has a complete system of nerves and arteries of its own for the conveyance of the astral fluid which is to that body as our blood is to the physical. It is the real personal man. There are located the subconscious perception and the latent memory, which the hypnotizers of the day are dealing with and being baffled by. So when the body dies the astral man is released, and as at death the immortal man — the Triad — flies away to another state, the astral becomes a shell of the once living man and requires time to dissipate. It retains all the memories of the life lived by the man, and thus reflexly and automatically can repeat what the dead man knew, said, thought, and saw. It remains near the deserted physical body nearly all the time until that is completely dissipated, for it has to go through its own process of dying. It may become visible under certain conditions. It is the spook of the spiritualistic seance-rooms, and is there made to masquerade as the real spirit of this or that individual. Attracted by the thoughts of the medium and the sitters, it vaguely flutters where they are, and then is galvanized into a factitious life by a whole host of elemental forces and by the active astral body of the medium who is holding the seance or of any other medium in the audience. From it (as from a photograph) are then reflected into the medium’s brain all the boasted evidences which spiritualists claim go to prove identity of deceased friend or relative. These evidences are accepted as proof that the spirit of the deceased is present, because neither mediums nor sitters are acquainted with the laws governing their own nature, nor with the constitution, power, and function of astral matter and astral man.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 64, "pdf_page_number": 65, "html": "<p>The Theosophical philosophy does not deny the facts proven in spiritualistic seances, but it gives an explanation of them wholly opposed to that of the spiritualists. And surely the utter absence of any logical scientific explanation by these so-called spirits of the phenomena they are said to produce supports the contention that they have no knowledge to impart. They can merely cause certain phenomena; the examination of those and deductions therefrom can only be properly carried on by a trained brain guided by a living trinity of spirit, soul, and mind. And here another class of spiritualistic phenomena requires brief notice. That is the appearance of what is called a “materialized spirit.”<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 65, "pdf_page_number": 66, "html": "<p>Three explanations are offered: <em>First<\/em>, that the astral body of the living medium detaches itself from its corpus and assumes the appearance of the so-called spirit; for one of the properties of the astral matter is capacity to reflect an image existing unseen in ether. <em>Second<\/em>, the actual astral shell of the deceased — wholly devoid of his or her spirit and conscience — becomes visible and tangible when the condition of air and ether is such as to so alter the vibration of the molecules of the astral shell that it may become visible. The phenomena of density and apparent weight are explained by other laws. <em>Third<\/em>, an unseen mass of electrical and magnetic matter is collected, and upon it is reflected out of the astral light a picture of any desired person either dead or living. This is taken to be the “spirit” of such persons, but it is not, and has been justly called by H. P. Blavatsky a “psychological fraud,” because it pretends to be what it is not. And, strange to say, this very explanation of materializations has been given by a “spirit” at a regular seance, but has never been accepted by the spiritualists just because it upsets their notion of the return of the spirits of deceased persons.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 66, "pdf_page_number": 67, "html": "<p>Finally, the astral body will explain nearly all the strange psychical things happening in daily life and in dealings with genuine mediums; it shows what an apparition may be and the possibility of such being seen, and thus prevents the scientific doubter from violating good sense by asserting you did not see what you know you have seen; it removes superstition by showing the real nature of these phenomena, and destroys the unreasonable fear of the unknown which makes a man afraid to see a “ghost.” By it also we can explain the apportation of objects without physical contact, for the astral hand may be extruded and made to take hold of an object, drawing it in toward the body. When this is shown to be possible, then travelers will not be laughed at who tell of seeing the Hindu yogee make coffee cups fly through the air and distant objects approach apparently of their own accord untouched by him or anyone else. All the instances of clairvoyance and clairaudience are to be explained also by the astral body and astral light. The astral — which are the real — organs do the seeing and the hearing, and as all material objects are constantly in motion among their own atoms the astral sight and hearing are not impeded, but work at a distance as great as the extension of the astral light or matter around and about the earth. Thus it was that the great seer Swedenborg saw houses burning in the city of Stockholm when he was at another city many miles off, and by the same means any clairvoyant of the day sees and hears at a distance.<\/p>", "images": [], "label": "5. Body and Astral Body (cont.)"}, {"pdf_page_index": 67, "pdf_page_number": 68, "html": "<h3 class=\"pdf-heading\">6. Kama — Desire<\/h3>\n<p>The author of <em>Esoteric Buddhism<\/em> — which book ought to be consulted by all students of Theosophy, since it was made from suggestions given by some of the Adepts themselves — gave the name <em>Kama rupa<\/em> to the fourth principle of man’s constitution. The reason was that the word <em>Kama <\/em>in the Sanskrit language means “desire,” and as the idea intended to be conveyed was that the fourth principle was the “body or mass of desires and passions,” Mr. Sinnett added the Sanskrit word for body or form which is <em>Rupa<\/em>, thus making the compound word <em>Kamarupa<\/em>. I shall call it by the English equivalent — passions and desires — because those terms exactly express its nature. And I do this also in order to make the sharp issue which actually exists between the psychology and mental philosophy of the west and those of the east. The west divides man into intellect, will, and feeling, but it is not understood whether the passions and desires constitute a principle in themselves or are due entirely to the body. Indeed, most people consider them as being the result of the influence of the flesh, for they are designated often by the terms “desires of the flesh” and “fleshly appetites.” The ancients, however, and the Theosophists know them to be a principle in themselves and not merely the impulses from the body. There is no help to be had in this matter from the western psychology, now in its infancy and wholly devoid of knowledge about the inner, which is the psychical, nature of man, and from this point there is the greatest divergence between it and Theosophy.<\/p>", "images": [], "label": "6. Kama — Desire"}, {"pdf_page_index": 68, "pdf_page_number": 69, "html": "<p>The passions and desires are not produced by the body, but, on the contrary, the body is caused to be by the former. It is desire and passion which caused us to be born, and will bring us to birth again and again in this body or in some other.<a href=\"#_ftn1\">[1]<\/a> It is by passion and desire we are made to evolve through the mansions of death called lives on earth. It was by the arising of desire in the unknown first cause, the one absolute existence, that the whole collection of worlds was manifested, and by means of the influence of desire in the now manifested world is the latter kept in existence.<\/p>", "images": [], "label": "6. Kama — Desire (cont.)"}, {"pdf_page_index": 69, "pdf_page_number": 70, "html": "<p>This fourth principle is the balance principle of the whole seven. It stands in the middle, and from it the ways go up or down. It is the basis of action and the mover of the will. As the old Hermetists say: “Behind will stands desire.” For whether we wish to do well or ill we have to first arouse within us the desire for either course. The good man who at last becomes even a sage had at one time in his many lives to arouse the desire for the company of holy men and to keep his desire for progress alive in order to continue on his way. Even a Buddha or a Jesus had first to make a vow, which is a desire, in some life, that he would save the world or some part of it, and to persevere with the desire alive in his heart through countless lives. And equally so, on the other hand, the bad man life after life took unto himself low, selfish, wicked desires, thus debasing instead of purifying this principle. On the material and scientific side of occultism, the use of the inner hidden powers of our nature, if this principle of desire be not strong the master power of imagination cannot do its work, because though it makes a mold or matrix the will cannot act unless it is moved, directed, and kept up to pitch by desire.<\/p>", "images": [], "label": "6. Kama — Desire (cont.)"}, {"pdf_page_index": 70, "pdf_page_number": 71, "html": "<p>The desires and passions, therefore, have two aspects, the one being low and the other high. The low is that shown by the constant placing of the consciousness entirely below in the body and the astral body; the high comes from the influence of and aspiration to the trinity above, of Mind, Buddhi, and Spirit. This fourth principle is like the sign Libra in the path of the Sun through the Zodiac; when the Sun (who is the real man) reaches that sign he trembles in the balance. Should he go back the worlds would be destroyed; he goes onward, and the whole human race is lifted up to perfection.<\/p>\n<p>During life the emplacement of the desires and passions is, as obtains with the astral body, throughout the entire lower man, and like that ethereal counterpart of our physical person it may be added to or diminished, made weak or increased in strength, debased or purified.<\/p>", "images": [], "label": "6. Kama — Desire (cont.)"}, {"pdf_page_index": 71, "pdf_page_number": 72, "html": "<p>At death it informs the astral body, which then becomes a mere shell; for when a man dies his astral body and principle of passion and desire leave the physical in company and coalesce. It is then that the term <em>Kamarupa<\/em> may be applied, as <em>Kamarupa<\/em> is really made of astral body and <em>Kama <\/em>in conjunction, and this joining of the two makes a shape or form which though ordinarily invisible is material and may be brought into visibility. Although it is empty of mind and conscience, it has powers of its own that can be exercised whenever the conditions permit. These conditions are furnished by the medium of the spiritualists, and in every <em>seance<\/em> room the astral shells of deceased persons are always present to delude the sitters, whose powers of discrimination have been destroyed by wonderment. It is the “devil” of the Hindus, and a worse enemy the poor medium could not have. For the astral spook — or <em>Kamarupa<\/em> — is but the mass of the desires and passions abandoned by the real person who has fled to “heaven” and has no concern with the people left behind, least of all with <em>seances<\/em> and mediums. Hence, being devoid of the nobler soul, these desires and passions work only on the very lowest part of the medium’s nature and stir up no good elements, but always the lower leanings of the being. Therefore it is that even the spiritualists themselves admit that in the ranks of the mediums there is much fraud, and mediums have often confessed, “the spirits did tempt me and I committed fraud at their wish.”<\/p>", "images": [], "label": "6. Kama — Desire (cont.)"}, {"pdf_page_index": 72, "pdf_page_number": 73, "html": "<p>This <em>Kamarupa<\/em> spook is also the enemy of our civilization, which permits us to execute men for crimes committed and thus throw out into the ether the mass of passion and desire free from the weight of the body and liable at any moment to be attracted to any sensitive person. Being thus attracted, the deplorable images of crimes committed and also the picture of the execution and all the accompanying curses and wishes for revenge are implanted in living persons, who, not seeing the evil, are unable to throw it off. Thus crimes and new ideas of crimes are wilfully propagated every day by those countries where capital punishment prevails.<\/p>", "images": [], "label": "6. Kama — Desire (cont.)"}, {"pdf_page_index": 73, "pdf_page_number": 74, "html": "<p>The astral shells together with the still living astral body of the medium, helped by certain forces of nature which the Theosophists call “elementals,” produce nearly all the phenomena of non-fraudulent spiritualism. The medium’s astral body having the power of extension and extrusion forms the framework for what are called “materialized spirits,” makes objects move without physical contact, gives reports from deceased relatives, none of them anything more than recollections and pictures from the astral light, and in all this using and being used by the shells of suicides, executed murderers, and all such spooks as are naturally near to this plane of life. The number of cases in which any communication comes from an actual spirit out of the body is so small as to be countable almost on one hand. But the spirits of living men sometimes, while their bodies are asleep, come to <em>seances<\/em> and take part therein. But they cannot recollect it, do not know how they do it, and are not distinguished by mediums from the mass of astral corpses. The fact that such things can be done by the inner man and not be recollected proves nothing against these theories, for the child can see without knowing how the eye acts, and the savage who has no knowledge of the complex machinery working in his body still carries on the process of digestion perfectly. And that the latter is unconscious with him is exactly in line with the theory, for these acts and doings of the inner man are the unconscious actions of the subconscious mind. These words “conscious” and “subconscious” are of course used relatively, the unconsciousness being that of the brain only. And hypnotic experiments have conclusively proved all these theories, as on one day not far away will be fully admitted. Besides this, the astral shells of suicides and executed criminals are the most coherent, longest lived, and nearest to us of all the shades of hades, and hence must, out of the necessity of the case, be the real “controls” of the <em>seance<\/em> room.<\/p>", "images": [], "label": "6. Kama — Desire (cont.)"}, {"pdf_page_index": 74, "pdf_page_number": 75, "html": "<p>Passion and desire together with astral model-body are common to men and animals, as also to the vegetable kingdom, though in the last but faintly developed. And at one period in evolution no further material principles had been developed, and all the three higher, of Mind, Soul, and Spirit, were but latent. Up to this point man and animal were equal, for the brute in us is made of the passions and the astral body. The development of the germs of Mind made man because it constituted the great differentiation. The God within begins with <em>Manas<\/em> or mind, and it is the struggle between this God and the brute below which Theosophy speaks of and warns about. The lower principle is called bad because by comparison with the higher it is so, but still it is the basis of action. We cannot rise unless self first asserts itself in the desire to do better. In this aspect it is called <em>rajas<\/em> or the active and bad quality, as distinguished from <em>tamas<\/em>, or the quality of darkness and indifference. Rising is not possible unless <em>rajas<\/em> is present to give the impulse, and by the use of this principle of passion all the higher qualities are brought to at last so refine and elevate our desires that they may be continually placed upon truth and spirit. By this Theosophy does not teach that the passions are to be pandered to or satiated, for a more pernicious doctrine was never taught, but the injunction is to make use of the activity given by the fourth principle so as to ever rise and not to fall under the dominion of the dark quality that ends with annihilation, after having begun in selfishness and indifference.<\/p>", "images": [], "label": "6. Kama — Desire (cont.)"}, {"pdf_page_index": 75, "pdf_page_number": 76, "html": "<p>Having thus gone over the field and shown what are the lower principles, we find Theosophy teaching that at the present point of man’s evolution he is a fully developed quaternary with the higher principles partly developed. Hence it is taught that today man shows himself to be moved by passion and desire. This is proved by a glance at the civilizations of the earth, for they are all moved by this principle, and in countries like France, England, and America a glorification of it is exhibited in the attention to display, to sensuous art, to struggle for power and place, and in all the habits and modes of living where the gratification of the senses is sometimes esteemed the highest good. But as Mind is being evolved more and more as we proceed in our course along the line of the race development, there can be perceived underneath in all countries the beginning of the transition from the animal possessed of the germ of real mind to the man of mind complete. This day is therefore known to the Masters, who have given out some of the old truths, as the “transition period.” Proud science and prouder religion do not admit this, but think we are as we always will be. But believing in his teacher, the theosophist sees all around him the evidence that the race mind is changing by enlargement, that the old days of dogmatism are gone and the “age of inquiry” has come, that the inquiries will grow louder year by year and the answers be required to satisfy the mind as it grows more and more, until at last, all dogmatism being ended, the race will be ready to face all problems, each man for himself, all working for the good of the whole, and that the end will be the perfecting of those who struggle to overcome the brute. For these reasons the old doctrines are given out again, and Theosophy asks every one to reflect whether to give way to the animal below or look up to and be governed by the God within.<\/p>", "images": [], "label": "6. Kama — Desire (cont.)"}, {"pdf_page_index": 76, "pdf_page_number": 77, "html": "<p>A fuller treatment of the fourth principle of our constitution would compel us to consider all such questions as those presented by the wonder workers of the east, by spiritualistic phenomena, hypnotism, apparitions, insanity, and the like, but they must be reserved for separate handling.<\/p>", "images": [], "label": "6. Kama — Desire (cont.)"}, {"pdf_page_index": 77, "pdf_page_number": 78, "html": "<h3 class=\"pdf-heading\">7. Manas<\/h3>\n<p>In our analysis of man’s nature we have so far considered only the perishable elements which make up the lower man, and have arrived at the fourth principle or plane — that of desire — without having touched upon the question of Mind. But even so far as we have gone it must be evident that there is a wide difference between the ordinary ideas about Mind and those found in Theosophy. Ordinarily the Mind is thought to be immaterial, or to be merely the name for the action of the brain in evolving thought, a process wholly unknown other than by inference, or that if there be no brain there can be no mind. A good deal of attention has been paid to cataloging some mental functions and attributes, but the terms are altogether absent from the language to describe actual metaphysical and spiritual facts about man. This confusion and poverty of words for these uses are due almost entirely, first, to dogmatic religion, which has asserted and enforced for many centuries dogmas and doctrines which reason could not accept, and secondly to the natural war which grew up between science and religion just as soon as the fetters placed by religion upon science were removed and the latter was permitted to deal with facts in nature. The reaction against religion naturally prevented science from taking any but a materialistic view of man and nature. So from neither of these two have we yet gained the words needed for describing the fifth, sixth, and seventh principles, those which make up the Trinity, the real man, the immortal pilgrim.<\/p>", "images": [], "label": "7. Manas"}, {"pdf_page_index": 78, "pdf_page_number": 79, "html": "<p>The fifth principle is <em>Manas<\/em>, in the classification adopted by Mr. Sinnett, and is usually translated Mind. Other names have been given to it, but it is the knower, the perceiver, the thinker. The sixth is <em>Buddhi<\/em>, or spiritual discernment; the seventh is <em>Atma<\/em>, or Spirit, the ray from the Absolute Being. The English language will suffice to describe in part what <em>Manas<\/em> is, but not <em>Buddhi<\/em>, or <em>Atma<\/em>, and will leave many things relating to <em>Manas<\/em> undescribed.<\/p>", "images": [], "label": "7. Manas (cont.)"}, {"pdf_page_index": 79, "pdf_page_number": 80, "html": "<p>The course of evolution developed the lower principles and produced at last the form of man with a brain of better and deeper capacity than that of any other animal. But this man in form was not man in mind, and needed the fifth principle, the thinking, perceiving one, to differentiate him from the animal kingdom and to confer the power of becoming self-conscious. The monad was imprisoned in these forms, and that monad is composed of <em>Atma<\/em> and <em>Buddhi<\/em>; for without the presence of the monad evolution could not go forward. Going back for a moment to the time when the races were devoid of mind, the question arises, “who gave the mind, where did it come from, and what is it?” It is the link between the Spirit of God above and the personal below; it was given to the mindless monads by others who had gone all through this process ages upon ages before in other worlds and systems of worlds, and it therefore came from other evolutionary periods which were carried out and completed long before the solar system had begun. This is the theory, strange and unacceptable today, but which must be stated if we are to tell the truth about theosophy; and this is only handing on what others have said before.<\/p>", "images": [], "label": "7. Manas (cont.)"}, {"pdf_page_index": 80, "pdf_page_number": 81, "html": "<p>The manner in which this light of mind was given to the Mindless Men can be understood from the illustration of one candle lighting many. Given one lighted candle and numerous unlighted ones, it follows that from one light the others may also be set aflame. So in the case of <em>Manas<\/em>. It is the candle of flame. The mindless men having four elementary principles of Body, Astral Body, Life and Desire, are the unlighted candles that cannot light themselves. The Sons of Wisdom, who are the Elder Brothers of every family of men on any globe, have the light, derived by them from others who reach back, and yet farther back, in endless procession with no beginning or end. They set fire to the combined lower principles and the Monad, thus lighting up <em>Manas<\/em> in the new men and preparing another great race for final initiation. This lighting up of the fire of <em>Manas <\/em>is symbolized in all great religions and Freemasonry. In the east one priest appears holding a candle lighted at the altar, and thousands of others light their candles from this one. The Parsees also have their sacred fire which is lighted from some other sacred flame.<\/p>", "images": [], "label": "7. Manas (cont.)"}, {"pdf_page_index": 81, "pdf_page_number": 82, "html": "<p><em>Manas<\/em>, or the Thinker, is the reincarnating being, the immortal who carries the results and values of all the different lives lived on earth or elsewhere. Its nature becomes dual as soon as it is attached to a body. For the human brain is a superior organism and <em>Manas<\/em> uses it to reason from premises to conclusions. This also differentiates man from animal, for the animal acts from automatic and so-called instinctual impulses, whereas the man can use reason. This is the lower aspect of the Thinker or <em>Manas<\/em>, and not, as some have supposed, the highest and best gift belonging to man. Its other, and in theosophy higher, aspect is the intuitional, which knows, and does not depend on reason. The lower, and purely intellectual, is nearest to the principle of Desire, and is thus distinguished from its other side which has affinity for the spiritual principles above. If the Thinker, then, becomes wholly intellectual, the entire nature begins to tend downward; for intellect alone is cold, heartless, selfish, because it is not lighted up by the two other principles of <em>Buddhi<\/em> and <em>Atma<\/em>.<\/p>", "images": [], "label": "7. Manas (cont.)"}, {"pdf_page_index": 82, "pdf_page_number": 83, "html": "<p>In <em>Manas<\/em> the thoughts of all lives are stored. That is to say: in any one life, the sum total of thoughts underlying all the acts of the life-time will be of one character in general, but may be placed in one or more classes. That is, the business man of today is a single type; his entire life thoughts represent but one single thread of thought. The artist is another. The man who has engaged in business, but also thought much upon fame and power which he never attained, is still another. The great mass of self-sacrificing, courageous, and strong poor people who have but little time to think, constitute another distinct class. In all these the total quantity of life thoughts makes up the stream or thread of a life’s meditation — “that upon which the heart was set” — and is stored in <em>Manas<\/em>, to be brought out again at any time in whatever life the brain and bodily environments are similar to those used in engendering that class of thoughts. It is <em>Manas<\/em> which sees the objects presented to it by the bodily organs and the actual organs within. When the open eye receives a picture on the retina, the whole scene is turned into vibrations in the optic nerves which disappear into the brain, where <em>Manas<\/em> is enabled to perceive them as idea. And so with every other organ or sense. If the connection between <em>Manas<\/em> and the brain be broken, intelligence will not be manifested unless <em>Manas<\/em> has by training found out how to project the astral body from the physical and thereby keep up communication with fellowmen. That the organs and senses do not cognize objects, hypnotism, mesmerism, and spiritualism have now proved. For, as we see in mesmeric and hypnotic experiments, the object seen or felt, and from which all the effects of solid objects may be sensed, is often only an idea existing in the operator’s brain. In the same way <em>Manas<\/em>, using the astral body, has only to impress an idea upon the other person to make the latter see the idea and translate it into a visible body from which the usual effects of density and weight seem to follow. And in hypnotism there are many experiments, all of which go to show that so called matter is not <em>per se<\/em> solid or dense; that sight does not always depend on the eye and rays of light proceeding from an object; that the intangible for one normal brain and organs may be perfectly tangible for another; and that physical effects in the body may be produced from an idea solely. The well-known experiments of producing a blister by a simple piece of paper, or preventing a real blistering plaster from making a blister, by force of the idea conveyed to a subject, either that there was to be or not to be a blister, conclusively prove the power of effecting an impulse on matter by the use of that which is called <em>Manas<\/em>. But all these phenomena are the exhibition of the powers of lower <em>Manas<\/em> acting in the astral Body and the fourth principle — Desire, using the physical body as the field for the exhibition of the forces.<\/p>", "images": [], "label": "7. Manas (cont.)"}, {"pdf_page_index": 83, "pdf_page_number": 84, "html": "<p>It is this lower <em>Manas<\/em> which retains all the impressions of a life-time and sometimes strangely exhibits them in trances or dreams, delirium, induced states, here and there in normal conditions, and very often at the time of physical death. But it is so occupied with the brain, with memory and with sensation, that it usually presents but few recollections out of the mass of events that years have brought before it. It interferes with the action of Higher <em>Manas<\/em> because just at the present point of evolution, Desire and all corresponding powers, faculties, and senses are the most highly developed, thus obscuring, as it were, the white light of the spiritual side of <em>Manas<\/em>. It is tinted by each object presented to it, whether it be a thought-object or a material one. That is to say, Lower <em>Manas<\/em> operating through the brain is at once altered into the shape and other characteristics of any object, mental or otherwise. This causes it to have four peculiarities.<\/p>\n<p><em>First<\/em>, to naturally fly off from any point, object, or subject;<\/p>\n<p><em>second<\/em>, to fly to some pleasant idea;<\/p>\n<p><em>third<\/em>, to fly to an unpleasant idea;<\/p>\n<p><em>fourth<\/em>, to remain passive and considering naught.<\/p>", "images": [], "label": "7. Manas (cont.)"}, {"pdf_page_index": 84, "pdf_page_number": 85, "html": "<p>The first is due to memory and the natural motion of <em>Manas<\/em>; the second and third are due to memory alone; the fourth signifies sleep when not abnormal, and when abnormal is going toward insanity. These mental characteristics all belonging to Lower <em>Manas<\/em>, are those which the Higher <em>Manas<\/em>, aided by <em>Buddhi<\/em> and <em>Atma<\/em>, has to fight and conquer. Higher <em>Manas<\/em>, if able to act, becomes what we sometimes call Genius; if completely master, then one may become a god. But memory continually presents pictures to Lower <em>Manas<\/em>, and the result is that the Higher is obscured. Sometimes, however, along the pathway of life we do see here and there men who are geniuses or great seers and prophets. In these the Higher powers of <em>Manas<\/em> are active and the person illuminated. Such were the great Sages of the past, men like Buddha, Jesus, Confucius, Zoroaster, and others. Poets, too, such as Tennyson, Longfellow, and others, are men in whom Higher <em>Manas<\/em> now and then sheds a bright ray on the man below, to be soon obscured, however, by the effect of dogmatic religious education which has given memory certain pictures that always prevent <em>Manas<\/em> from gaining full activity.<\/p>\n<p>In this higher Trinity, we have the God above each one; this is <em>Atma<\/em>, and may be called the Higher Self.<\/p>", "images": [], "label": "7. Manas (cont.)"}, {"pdf_page_index": 85, "pdf_page_number": 86, "html": "<p>Next is the spiritual part of the soul called <em>Buddhi<\/em>; when thoroughly united with <em>Manas<\/em> this may be called the Divine Ego.<\/p>\n<p>The inner Ego, who reincarnates, taking on body after body, storing up the impressions of life after life, gaining experience and adding it to the divine Ego, suffering and enjoying through an immense period of years, is the fifth principle — <em>Manas<\/em> — not united to <em>Buddhi<\/em>. This is the permanent individuality which gives to every man the feeling of being himself and not some other; that which through all the changes of the days and nights from youth to the end of life makes us feel one identity through all the period; it bridges the gap made by sleep; in like manner it bridges the gap made by the sleep of death. It is this, and not our brain, that lifts us above the animal. The depth and variety of the brain convolutions in man are caused by the presence of <em>Manas<\/em>, and are not the cause of mind. And when we either wholly or now and then become consciously united with <em>Buddhi<\/em>, the Spiritual Soul, we behold God, as it were. This is what the ancients all desired to see, but what the moderns do not believe in, the latter preferring rather to throw away their own right to be great in nature, and to worship an imaginary god made up solely of their own fancies and not very different from weak human nature.<\/p>", "images": [], "label": "7. Manas (cont.)"}, {"pdf_page_index": 86, "pdf_page_number": 87, "html": "<p>This permanent individuality in the present race has therefore been through every sort of experience, for Theosophy insists on its permanence and in the necessity for its continuing to take part in evolution. It has a duty to perform, consisting in raising up to a higher state all the matter concerned in the chain of globes to which the earth belongs. We have all lived and taken part in civilization after civilization, race after race, on earth, and will so continue throughout all the rounds and races until the seventh is complete. At the same time it should be remembered that the matter of this globe and that connected with it has also been through every kind of form, with possibly some exceptions in very low planes of mineral formation. But in general all the matter visible, or held in space still unprecipitated, has been molded at one time or another into forms of all varieties, many of these being such as we now have no idea of. The processes of evolution, therefore, in some departments, now go forward with greater rapidity than in former ages because both <em>Manas<\/em> and matter have acquired facility of action. Especially is this so in regard to man, who is the farthest ahead of all things or beings in this evolution. He is now incarnated and projected into life more quickly than in earlier periods when it consumed many years to obtain a “coat of skin.” This coming into life over and over again cannot be avoided by the ordinary man because Lower <em>Manas<\/em> is still bound by Desire, which is the preponderating principle at the present period. Being so influenced by Desire <em>Manas<\/em> is continually deluded while in the body, and being thus deluded is unable to prevent the action upon it of the forces set up in the life time. These forces are generated by <em>Manas<\/em>, that is, by the thinking of the life time. Each thought makes a physical as well as mental link with the desire in which it is rooted. All life is filled with such thoughts, and when the period of rest after death is ended <em>Manas<\/em> is bound by innumerable electrical magnetic threads to earth by reason of the thoughts of the last life, and therefore by desire, for it was desire that caused so many thoughts and ignorance of the true nature of things. An understanding of this doctrine of man being really a thinker and made of thought will make clear all the rest in relation to incarnation and reincarnation. The body of the inner man is made of thought, and this being so it must follow that if the thoughts have more affinity for earth-life than for life elsewhere a return to life here is inevitable. At the present day <em>Manas<\/em> is not fully active in the race, as Desire still is uppermost. In the next cycle of the human period <em>Manas<\/em> will be fully active and developed in the entire race. Hence the people of the earth have not yet come to the point of making a conscious choice as to the path they will take; but when in the cycle referred to, <em>Manas<\/em> is active, all will then be compelled to consciously make the choice to right or left, the one leading to complete and conscious union with <em>Atma<\/em>, the other to the annihilation of those beings who prefer that path.<\/p>", "images": [], "label": "7. Manas (cont.)"}, {"pdf_page_index": 87, "pdf_page_number": 88, "html": "<h3 class=\"pdf-heading\">8. Of Reincarnation<\/h3>\n<p>How man has come to be the complex being that he is and why, are questions that neither Science nor Religion makes conclusive answer to. This immortal thinker having such vast powers and possibilities, all his because of his intimate connection with every secret part of Nature from which he has been built up, stands at the top of an immense and silent evolution. He asks why Nature exists, what the drama of life has for its aim, how that aim may be attained. But Science and Religion both fail to give a reasonable reply. Science does not pretend to be able to give the solution, saying that the examination of things as they are is enough of a task; religion offers an explanation both illogical and unmeaning and acceptable but to the bigot, as it requires us to consider the whole of Nature as a mystery and to seek for the meaning and purpose of life with all its sorrow in the pleasure of a God who cannot be found out. The educated and enquiring mind knows that dogmatic religion can only give an answer invented by man while it pretends to be from God.<\/p>", "images": [], "label": "8. Of Reincarnation"}, {"pdf_page_index": 88, "pdf_page_number": 89, "html": "<p>What then is the universe for, and for what final purpose is man the immortal thinker here in evolution? It is all for the experience and emancipation of the soul, for the purpose of raising the entire mass of manifested matter up to the stature, nature, and dignity of conscious god-hood. The great aim is to reach self-consciousness; not through a race or a tribe or some favored nation, but by and through the perfecting, after transformation, of the whole mass of matter as well as what we now call soul. Nothing is or is to be left out. The aim for present man is his initiation into complete knowledge, and for the other kingdoms below him that they may be raised up gradually from stage to stage to be in time initiated also. This is evolution carried to its highest power; it is a magnificent prospect; it makes of man a god, and gives to every part of nature the possibility of being one day the same; there is strength and nobility in it, for by this no man is dwarfed and belittled, for no one is so originally sinful that he cannot rise above all sin. Treated from the materialistic position of Science, evolution takes in but half of life; while the religious conception of it is a mixture of nonsense and fear. Present religions keep the element of fear, and at the same time imagine that an Almighty being can think of no other earth but this and has to govern this one very imperfectly. But the old theosophical view makes the universe a vast, complete, and perfect whole.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 89, "pdf_page_number": 90, "html": "<p>Now the moment we postulate a double evolution, physical and spiritual, we have at the same time to admit that it can only be carried on by reincarnation. This is, in fact, demonstrated by science. It is shown that the matter of the earth and of all things physical upon it was at one time either gaseous or molten; that it cooled; that it altered; that from its alterations and evolutions at last were produced all the great variety of things and beings. This, on the physical plane, is transformation or change from one form to another. The total mass of matter is about the same as in the beginning of this globe, with a very minute allowance for some star dust. Hence it must have been changed over and over again, and thus been physically reformed and reimbodied. Of course, to be strictly accurate, we cannot use the word reincarnation, because “incarnate” refers to flesh. Let us say “reimbodied,” and then we see that both for matter and for man there has been a constant change of form and this is, broadly speaking, “reincarnation.” As to the whole mass of matter, the doctrine is that it will all be raised to man’s estate when man has gone further on himself. There is no residuum left after man’s final salvation which in a mysterious way is to be disposed of or done away with in some remote dust-heap of nature. The true doctrine allows for nothing like that, and at the same time is not afraid to give the true disposition of what would seem to be a residuum. It is all worked up into other states, for as the philosophy declares there is no inorganic matter whatever but that every atom is alive and has the germ of self-consciousness, it must follow that one day it will all have been changed. Thus what is now called human flesh is so much matter that one day was wholly mineral, later on vegetable, and now refined into human atoms. At a point of time very far from now the present vegetable matter will have been raised to the animal stage and what we now use as our organic or fleshy matter will have changed by transformation through evolution into self-conscious thinkers, and so on up the whole scale until the time shall come when what is now known as mineral matter will have passed on to the human stage and out into that of thinker. Then at the coming on of another great period of evolution the mineral matter of that time will be some which is now passing through its lower transformations on other planets and in other systems of worlds. This is perhaps a “fanciful” scheme for the men of the present day, who are so accustomed to being called bad, sinful, weak, and utterly foolish from their birth that they fear to believe the truth about themselves, but for the disciples of the ancient theosophists it is not impossible or fanciful, but is logical and vast. And no doubt it will one day be admitted by everyone when the mind of the western race has broken away from Mosaic chronology and Mosaic ideas of men and nature. Therefore as to reincarnation and metempsychosis we say that they are first to be applied to the whole cosmos and not alone to man. But as man is the most interesting object to himself, we will consider in detail its application to him.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 90, "pdf_page_number": 91, "html": "<p>This is the most ancient of doctrines and is believed in now by more human minds than the number of those who do not hold it. The millions in the East almost all accept it; it was taught by the Greeks; a large number of the Chinese now believe it as their forefathers did before them; the Jews thought it was true, and it has not disappeared from their religion; and Jesus, who is called the founder of Christianity, also believed and taught it. In the early Christian church it was known and taught, and the very best of the fathers of the church believed and promulgated it.<\/p>\n<p>Christians should remember that Jesus was a Jew who thought his mission was to Jews, for he says in St. Matthew, “I am not sent but unto the lost sheep of the house of Israel.” He must have well known the doctrines held by them. They all believed in reincarnation. For them Moses, Adam, Noah, Seth, and others had returned to earth, and at the time of Jesus it was currently believed that the old prophet Elias was yet to return. So we find, first, that Jesus never denied the doctrine, and on various occasions assented to it, as when he said that John the Baptist was actually the Elias of old whom the people were expecting. All this can be seen by consulting St. Matthew in chapters xvii, xi, and others.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 91, "pdf_page_number": 92, "html": "<p>In these it is very clear that Jesus is shown as approving the doctrine of reincarnation. And following Jesus we find St. Paul, in Romans ix, speaking of Esau and Jacob being actually in existence before they were born, and later such great Christian fathers as Origen, Synesius, and others believing and teaching the theory. In Proverbs viii, 22, we have Solomon saying that when the earth was made he was present, and that, long before he could have been born as Solomon, his delights were in the habitable parts of the earth with the sons of men. St. John the Revelator says in Revs. iii, 12, he was told in a vision which refers to the voice of God or the voice of one speaking for God, that whosoever should overcome would not be under the necessity of “going out” any more, that is, would not need to be reincarnated. For five hundred years after Jesus the doctrine was taught in the church until the council of Constantinople. Then a condemnation was passed upon a phase of the question which has been regarded by many as against reincarnation, but if that condemnation goes against the words of Jesus it is of no effect. It does go against him, and thus the church is in the position of saying in effect that Jesus did not know enough to curse, as it did, a doctrine known and taught in his day and which was brought to his notice prominently and never condemned but in fact approved by him. Christianity is a Jewish religion, and this doctrine of reincarnation belongs to it historically by succession from the Jews, and also by reason of its having been taught by Jesus and the early fathers of the church. If there be any truthful or logical way for the Christian church to get out of this position — excluding, of course, dogmas of the church — the theosophist would like to be shown it. Indeed, the theosophist holds that whenever a professed Christian denies the theory he thereby sets up his judgment against that of Jesus, who must have known more about the matter than those who follow him. It is the anathema hurled by the church council and the absence of the doctrine from the teaching now that have damaged Christianity and made of all the Christian nations people who pretend to be followers of Jesus and the law of love, but who really as nations are followers of the Mosaic law of retaliation. For alone in reincarnation is the answer to all the problems of life, and in it and Karma is the force that will make men pursue in fact the ethics they have in theory. It is the aim of the old philosophy to restore this doctrine to whatsoever religion has lost it; and hence we call it the “lost chord of Christianity.”<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 92, "pdf_page_number": 93, "html": "<p>But who or what is it that reincarnates? It is not the body, for that dies and disintegrates; and but few of us would like to be chained forever to such bodies as we now have, admitted to be infected with disease except in the case of the savage. It is not the astral body, for, as shown, that also has its term and must go to pieces after the physical has gone. Nor is it the passions and desires. They, to be sure, have a very long term, because they have the power to reproduce themselves in each life so long as we do not eradicate them. And reincarnation provides for that, since we are given by it many opportunities of slowly, one by one, killing off the desires and passions which mar the heavenly picture of the spiritual man.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 93, "pdf_page_number": 94, "html": "<p>It has been shown how the passional part of us coalesces with the astral after death and makes a seeming being that has a short life to live while it is disintegrating. When the separation is complete between the body that has died, the astral body, and the passions and desires — life having begun to busy itself with other forms — the Higher Triad, <em>Manas, Buddhi<\/em>, and <em>Atma<\/em>, who are the real man, immediately go into another state, and when that state, which is called <em>Devachan<\/em>, or heaven, is over, they are attracted back to earth for reincarnation. They are the immortal part of us; they, in fact, and no other are we. This should be firmly grasped by the mind, for upon its clear understanding depends the comprehension of the entire doctrine. What stands in the way of the modern western man’s seeing this clearly is the long training we have all had in materialistic science and materializing religion, both of which have made the mere physical body too prominent. The one has taught of matter alone and the other has preached the resurrection of the body, a doctrine against common sense, fact, logic, and testimony. But there is no doubt that the theory of the bodily resurrection has arisen from the corruption of the older and true teaching. Resurrection is founded on what Job says about seeing his redeemer in his flesh, and on St. Paul’s remark that the body was raised incorruptible. But Job was an Egyptian who spoke of seeing his teacher or initiator, who was the redeemer, and Jesus and Paul referred to the spiritual body only.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 94, "pdf_page_number": 95, "html": "<p>Although reincarnation is the law of nature, the complete trinity of <em>Atma-Buddhi-Manas<\/em> does not yet fully incarnate in this race. They use and occupy the body by means of the entrance of <em>Manas<\/em>, the lowest of the three, and the other two shine upon it from above, constituting the God in Heaven. This was symbolized in the old Jewish teaching about the Heavenly Man who stands with his head in heaven and his feet in hell. That is, the head <em>Atma<\/em> and <em>Buddhi<\/em> are yet in heaven, and the feet, <em>Manas<\/em>, walk in hell, which is the body and physical life. For that reason man is not yet fully conscious, and reincarnations are needed to at last complete the incarnation of the whole trinity in the body. When that has been accomplished the race will have become as gods, and the godlike trinity being in full possession the entire mass of matter will be perfected and raised up for the next step. This is the real meaning of “the word made flesh.” It was so grand a thing in the case of any single person, such as Jesus or Buddha, as to be looked upon as a divine incarnation. And out of this, too, comes the idea of the crucifixion, for <em>Manas<\/em> is thus crucified for the purpose of raising up the thief to paradise.<\/p>\n<p>It is because the trinity is not yet incarnate in the race that life has so many mysteries, some of which are showing themselves from day to day in all the various experiments made on and in man.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 95, "pdf_page_number": 96, "html": "<p>The physician knows not what life is nor why the body moves as it does, because the spiritual portion is yet enshrouded in the clouds of heaven; the scientist is wandering in the dark, confounded and confused by all that hypnotism and other strange things bring before him, because the conscious man is out of sight on the very top of the divine mountain, thus compelling the learned to speak of the “subconscious mind,” the “latent personality,” and the like; and the priest can give us no light at all because he denies man’s god-like nature, reduces all to the level of original sin, and puts upon our conception of God the black mark of inability to control or manage the creation without invention of expedients to cure supposed errors. But this old truth solves the riddle and paints God and Nature in harmonious colors.<\/p>\n<p>Reincarnation does not mean that we go into animal forms after death, as is believed by some Eastern peoples. “Once a man always a man” is the saying in the Great Lodge. But it would not be too much punishment for some men were it possible to condemn them to rebirth in brute bodies; however nature does not go by sentiment but by law, and we, not being able to see all, cannot say that the brutal man is brute all through his nature. And evolution having brought <em>Manas<\/em> the Thinker and Immortal Person on to this plane, cannot send him back to the brute which has not <em>Manas<\/em>.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 96, "pdf_page_number": 97, "html": "<p>By looking into two explanations for the literal acceptation by some people in the East of those laws of Manu which seem to teach the transmigrating into brutes, insects, and so on, we can see how the true student of this doctrine will not fall into the same error.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 97, "pdf_page_number": 98, "html": "<p>The first is, that the various verses and books teaching such transmigration have to do with the actual method of reincarnation, that is, with the explanation of the actual physical processes which have to be undergone by the Ego in passing from the unembodied to the embodied state, and also with the roads, ways, or means of descent from the invisible to the visible plane. This has not yet been plainly explained in Theosophical books, because on the one hand it is a delicate matter, and on the other the details would not as yet be received even by Theosophists with credence, although one day they will be. And as these details are not of the greatest importance they are not now expounded. But as we know that no human body is formed without the union of the sexes, and that the germs for such production are locked up in the sexes and must come from food which is taken into the body, it is obvious that foods have something to do with the reincarnating of the Ego. Now if the road to reincarnation leads through certain food and none other, it may be possible that if the Ego gets entangled in food which will not lead to the germ of physical reproduction, a punishment is indicated where Manu says that such and such practices will lead to transmigration, which is then a “hindrance.” I throw this out so far for the benefit of certain theosophists who read these and whose theories on this subject are now rather vague and in some instances based on quite other hypotheses.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 98, "pdf_page_number": 99, "html": "<p>The second explanation is, that inasmuch as nature intends us to use the matter which comes into our body and astral body for the purpose, among others, of benefiting the matter by the impress it gets from association with the human Ego, if we use it so as to give it only a brutal impression it must fly back to the animal kingdom to be absorbed there instead of being refined and kept on the human plane. And as all the matter which the human Ego gathered to it retains the stamp or photographic impression of the human being, the matter transmigrates to the lower level when given an animal impress by the Ego. This actual fact in the great chemical laboratory of nature could easily be misconstrued by the ignorant. But the present-day students know that once <em>Manas<\/em> the Thinker has arrived on the scene he does not return to baser forms; first, because he does not wish to, and second, because he cannot. For just as the blood in the body is prevented by valves from rushing back and engorging the heart, so in this greater system of universal circulation the door is shut behind the Thinker and prevents his retrocession. Reincarnation as a doctrine applying to the real man does not teach transmigration into kingdoms of nature below the human.<\/p>", "images": [], "label": "8. Of Reincarnation (cont.)"}, {"pdf_page_index": 99, "pdf_page_number": 100, "html": "<h3 class=\"pdf-heading\">9. Reincarnation Continued<\/h3>\n<p>In the West, where the object of life is commercial, financial, social, or scientific success, that is, personal profit, aggrandizement, and power, the real life of man receives but little attention, and we, unlike the Orientals, give scant prominence to the doctrine of preexistence and reincarnation. That the church denies it is enough for many, with whom no argument is of any use. Relying on the church, they do not wish to disturb the serenity of their faith in dogmas that may be illogical; and as they have been taught that the church can bind them in hell, a blind fear of the anathema hurled at reincarnation in the Constantinople council about 500 a.d. would alone debar them from accepting the accursed theory. And the church in arguing on the doctrine urges the objection that if men are convinced that they will live many lives, the temptation to accept the present and do evil without check will be too strong. Absurd as this seems, it is put forward by learned Jesuits, who say men will rather have the present chance than wait for others. If there were no retribution at all this would be a good objection, but as Nature has also a Nemesis for every evil doer, and as each, under the law of Karma — which is that of cause and effect and perfect justice — must receive the exact consequences himself in every life for what good or bad deeds and thoughts he did and had in other lives, the basis for moral conduct is secure. It is safe under this system,
