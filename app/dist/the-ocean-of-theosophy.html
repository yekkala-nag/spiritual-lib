ears no <em>rationale<\/em> of phenomena nor of development of mediumship has been obtained from the spirits. Great philosophers are reported as speaking through mediums, but utter only drivel and merest commonplaces.<\/p>\n<p>V. The mediums come to physical and moral grief, are accused of fraud, are shown guilty of trickery, but the spirit guides and controls do not interfere to either prevent or save.<\/p>\n<p>VI. It is admitted that the guides and controls deceive and incite to fraud.<\/p>\n<p>VII. It is plainly to be seen through all that is reported of the spirits that their assertions and philosophy, if any, vary with the medium and the most advanced thought of living spiritualists.<\/p>\n<p>From all this and much more that could be adduced, the man of materialistic science is fortified in his ridicule, but the theosophist has to conclude that the entities, if there be any communicating, are not human spirits, and that the explanations are to be found in some other theories.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 206, "pdf_page_number": 207, "html": "<p>Materialization of a form out of the air, independent of the medium’s physical body, is a fact. But it is not a spirit. As was very well said by one of the “spirits” not favored by spiritualism, one way to produce this phenomenon is by the accretion of electrical and magnetic particles into one mass upon which matter is aggregated and an image reflected out of the Astral sphere. This is the whole of it; as much a fraud as a collection of muslin and masks. How this is accomplished is another matter. The spirits are not able to tell, but an attempt has been made to indicate the methods and instruments in former chapters. The second method is by the use of the Astral body of the living medium. In this case the Astral form exudes from the side of the medium, gradually collects upon itself particles extracted from the air and the bodies of the sitters present, until at last it becomes visible. Sometimes it will resemble the medium; at others it bears a different appearance. In almost every instance dimness of light is requisite because a high light would disturb the Astral substance in a violent manner and render the projection difficult. Some so-called materializations are hollow mockeries, as they are but flat plates of electrical and magnetic substance on which pictures from the Astral Light are reflected. These seem to be the faces of the dead, but they are simply pictured illusions.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 207, "pdf_page_number": 208, "html": "<p>If one is to understand the psychic phenomena found in the history of “spiritualism” it is necessary to know and admit the following:<\/p>\n<p>I. The complete heredity of man astrally, spiritually, and psychically, as a being who knows, reasons, feels, and acts through the body, the Astral body, and the soul.<\/p>\n<p>II. The nature of the mind, its operation, its powers; the nature and power of imagination; the duration and effect of impressions. Most important in this is the persistence of the slightest impression as well as the deepest; that every impression produces a picture in the individual aura; and that by means of this a connection is established between the auras of friends and relatives old, new, near, distant, and remote in degree: this would give a wide range of possible sight to a clairvoyant.<\/p>\n<p>III. The nature, extent, function, and power of man’s inner Astral organs and faculties included in the terms Astral body and <em>Kama<\/em>. That these are not hindered from action by trance or sleep, but are increased in the medium when entranced; at the same time their action is not free, but governed by the mass chord of thought among the sitters, or by a predominating will, or by the presiding devil behind the scenes; if a sceptical scientific investigator be present, his mental attitude may totally inhibit the action of the medium’s powers by what we might call a freezing process which no English terms will adequately describe.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 208, "pdf_page_number": 209, "html": "<p>IV. The fate of the real man after death, his state, power, activity there, and his relation, if any, to those left behind him here.<\/p>\n<p>V. That the intermediary between mind and body — the Astral body — is thrown off at death and left in the Astral light to fade away; and that the real man goes to <em>Devachan<\/em>.<\/p>\n<p>VI. The existence, nature, power, and function of the Astral light and its place as a register in Nature. That it contains, retains, and reflects pictures of each and every thing that happened to anyone, and also every thought; that it permeates the globe and the atmosphere around it; that the transmission of vibration through it is practically instantaneous, since the rate is much quicker than that of electricity as now known.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 209, "pdf_page_number": 210, "html": "<p>VII. The existence in the Astral light of beings not using bodies like ours, but not human in their nature, having powers, faculties, and a sort of consciousness of their own; these include the elemental forces or nature sprites divided into many degrees, and which have to do with every operation of Nature and every motion of the mind of man. That these elementals act at <em>seances<\/em> automatically in their various departments, one class presenting pictures, another producing sounds, and others depolarizing objects for the purposes of apportation. Acting with them in this Astral sphere are the soulless men who live in it. To these are to be ascribed the phenomenon, among others, of the “independent voice,” always sounding like a voice in a barrel just because it is made in a vacuum which is absolutely necessary for an entity so far removed from spirit. The peculiar <em>timbre<\/em> of this sort of voice has not been noticed by the spiritualists as important, but it is extremely significant in the view of occultism.<\/p>\n<p>VIII. The existence and operation of occult laws and forces in nature which may be used to produce phenomenal results on this plane; that these laws and forces may be put into operation by the subconscious man and by the elementals either consciously or unconsciously, and that many of these occult operations are automatic in the same way as is the freezing of water under intense cold or the melting of ice under heat.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 210, "pdf_page_number": 211, "html": "<p>IX. That the Astral body of the medium, partaking of the nature of the Astral substance, may be extended from the physical body, may act outside of the latter, and may also extrude at times any portion of itself such as hand, arm, or leg and thereby move objects, indite letters, produce touches on the body, and so on <em>ad infinitum<\/em>. And that the Astral body of any person may be made to feel sensation, which, being transmitted to the brain, causes the person to think he is touched on the outside or has heard a sound.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 211, "pdf_page_number": 212, "html": "<p>Mediumship is full of dangers because the Astral part of the man is now only normal in action when joined to the body; in distant years it will normally act without a body as it has in the far past. To become a medium means that you have to become disorganized physiologically and in the nervous system, because through the latter is the connection between the two worlds. The moment the door is opened all the unknown forces rush in, and as the grosser part of nature is nearest to us it is that part which affects us most; the lower nature is also first affected and inflamed because the forces used are from that part of us. We are then at the mercy of the vile thoughts of all men, and subject to the influence of the shells in <em>Kama Loka<\/em>. If to this be added the taking of money for the practice of mediumship, an additional danger is at hand, for the things of the spirit and those relating to the Astral world must not be sold. This is the great disease of American spiritualism which has debased and degraded its whole history; until it is eliminated no good will come from the practice; those who wish to hear truth from the other world must devote themselves to truth and leave all considerations of money out of sight.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 212, "pdf_page_number": 213, "html": "<p>To attempt to acquire the use of the psychic powers for mere curiosity or for selfish ends is also dangerous for the same reasons as in the case of mediumship. As the civilization of the present day is selfish to the last degree and built on the personal element, the rules for the development of these powers in the right way have not been given out, but the Masters of Wisdom have said that philosophy and ethics must first be learned and practiced before any development of the other department is to be indulged in; and their condemnation of the wholesale development of mediums is supported by the history of spiritualism, which is one long story of the ruin of mediums in every direction.<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 213, "pdf_page_number": 214, "html": "<p>Equally improper is the manner of the scientific schools which without a thought for the true nature of man indulge in experiments in hypnotism in which the subjects are injured for life, put into disgraceful attitudes, and made to do things for the satisfaction of the investigators which would never be done by men and women in their normal state. The Lodge of the Masters does not care for Science unless it aims to better man’s state morally as well as physically, and no aid will be given to Science until she looks at man and life from the moral and spiritual side. For this reason those who know all about the psychical world, its denizens and laws, are proceeding with a reform in morals and philosophy before any great attention will be accorded to the strange and seductive phenomena possible for the inner powers of man.<\/p>\n<p>And at the present time the cycle has almost run its course for this century. Now, as a century ago, the forces are slackening; for that reason the phenomena of spiritualism are lessening in number and volume; the Lodge hopes by the time the next tide begins to rise that the West will have gained some right knowledge of the true philosophy of Man and Nature, and be then ready to bear the lifting of the veil a little more. To help on the progress of the race in this direction is the object of this book, and with that it is submitted to its readers in every part of the world.<\/p>\n<p>THE END<\/p>", "images": [], "label": "17. Psychic Phenomena and Spiritualism (cont.)"}, {"pdf_page_index": 214, "pdf_page_number": 215, "html": "<h3 class=\"pdf-heading\">Footnote<\/h3>\n<p><p> <sup>[1]<\/sup> In <em>The Theosophical Forum<\/em>, June, 1894, page 12, Judge corrected this to: “in some body on this earth or another globe.” <\/p><\/p>", "images": [], "label": "Footnote"}]</script>

<script id="notes-data" type="application/json">{"by WILLIAM Q. JUDGE": {"s": "Author’s page — William Quan Judge, co-founder of the Theosophical Society.", "p": ["Judge co-founded the T.S. with Blavatsky and Olcott in 1875"]}, "Preface": {"s": "Judge states his aim: to present the complete system of theosophy in brief, plain language for the general reader.", "p": ["Written for the general reader, not the specialist", "Attempts to cover the whole ocean of theosophy in a small compass"]}, "1. Theosophy And The Masters": {"s": "Introduces the Masters of Wisdom — the adepts behind the theosophical movement — their brotherhood, their knowledge, and their aim of helping human evolution.", "p": ["The Masters are perfected men, not spirits or gods", "They form a brotherhood watching over human progress", "The theosophical movement is their work"]}, "2. General Principles": {"s": "States the fundamentals: the unity of all life, the one universal law, cyclical evolution, and the septenary structure of cosmos and man.", "p": ["All life is one; separateness is illusion", "One universal law governs every plane", "Evolution works in cycles and sevens"]}, "3. The Earth Chain": {"s": "Explains the doctrine of planetary chains and rounds — the earth as one globe in a septenary chain through which the human life-wave passes.", "p": ["Each planet belongs to a chain of seven globes", "The life-wave passes around the chain in seven rounds", "Earth is the fourth globe of our chain — the densest"]}, "4. Septenary Constitution of Man": {"s": "Details the seven principles of man, from the physical body to the divine spirit, and their division into the mortal lower quaternary and immortal upper triad.", "p": ["Seven principles: body, astral, prana, kama, manas, buddhi, atma", "The lower four perish; the upper triad endures", "Man mirrors the sevenfold cosmos"]}, "5. Body and Astral Body": {"s": "Describes the physical body and its astral double — the subtle design-body that sustains the physical and survives it for a time after death.", "p": ["The astral body is the subtle model of the physical", "Prana, the life-force, animates the two", "At death the astral double gradually disintegrates"]}, "6. Kama — Desire": {"s": "Analyses kama, the desire principle — the seat of passion and sensation — and its role in binding the soul to rebirth.", "p": ["Kama is the principle of desire and emotion", "It survives death as the kama-rupa or desire-body", "Uncontrolled desire is the great binder to earth"]}, "7. Manas": {"s": "Treats manas, the mind principle — the thinker and reincarnating ego — and the division into lower (personal) and higher (spiritual) mind.", "p": ["Manas is the thinker, the real man", "Lower manas mixes with desire; higher manas aspires to buddhi", "The destiny of the soul hinges on which way the mind turns"]}, "8. Of Reincarnation": {"s": "Presents reincarnation as the method of evolution — the soul returning to earth life after life to learn, grow, and pay its karmic debts.", "p": ["Rebirth is the schooling of the soul", "Each life is a reaping of past sowing", "Evolution requires many lives, not one"]}, "9. Reincarnation Continued": {"s": "Answers objections and details the process: the interval between lives, the conditions of the new birth, and the moral logic of the doctrine.", "p": ["A devachanic interval separates incarnations", "The new birth is fashioned by the karma of the old", "The doctrine explains heredity’s puzzles better than chance"]}, "10. Arguments Supporting Reincarnation": {"s": "Marshals the arguments: innate ideas, child genius, the justice of varied lots, the testimony of ages, and flashes of past-life memory.", "p": ["Genius and innate character imply prior experience", "Only rebirth makes life’s inequalities just", "The doctrine is ancient and worldwide"]}, "11. Karma": {"s": "Expounds karma — the law of ethical causation — as the unfailing adjuster that weaves destiny from thought, word, and deed.", "p": ["Karma is action and its inevitable reaction", "Thought is the most potent karmic seed", "Karma is not fate: new thought creates new destiny"]}, "12. Kama Loka": {"s": "Describes kama-loka, the after-death realm of desire where the soul sheds its earthly passions before rising to devachan.", "p": ["Kama-loka purges the lower desires", "The kama-rupa or spook of the séance room belongs here", "The process is nature’s, not a punishment"]}, "13. Devachan": {"s": "Describes devachan, the blissful state of rest and assimilation between incarnations, where the soul dwells on the noblest experiences of the past life.", "p": ["Devachan is a subjective heaven of the soul’s own making", "Its length is proportioned to the life’s spiritual harvest", "It is rest, not progress — progress needs earth"]}, "14. Cycles": {"s": "Teaches the law of cycles in nature, history, and individual life — the returning tides that bring opportunities round again.", "p": ["All growth moves in cycles and returning tides", "History, nations, and souls obey cyclic law", "Knowing one’s cycle lets one work with nature"]}, "15. Differentiation of Species — Missing Links": {"s": "Applies theosophy to evolution: the inner, spiritual plan precedes outer form, explaining the missing links that baffle materialist biology.", "p": ["Form follows an inner, pre-existing astral plan", "Missing links reflect the descent of spirit into matter", "Man’s form is far older than science supposed"]}, "16. Psychic Laws, Forces, and Phenomena": {"s": "Surveys psychic phenomena — mesmerism, clairvoyance, apparitions — and the hidden forces behind them, with warnings against their pursuit.", "p": ["Psychic powers are natural but latent faculties", "Phenomena belong to the astral, the lowest subtle plane", "Their pursuit without ethics is dangerous"]}, "17. Psychic Phenomena and Spiritualism": {"s": "Examines spiritualism in the light of theosophy: séance “spirits” are mostly shells and elementals, and mediumship is injurious to the medium.", "p": ["Genuine communications from the dead are rare", "Most séance figures are astral shells animated by elementals", "Mediumship drains vitality and invites obsession"]}, "Footnote": {"s": "Judge’s notes and references supporting the text.", "p": ["Sources drawn from The Secret Doctrine and the Mahatma Letters"]}}</script>

<script>
const PAGES = JSON.parse(document.getElementById('pages-data').textContent);
const IMAGES = JSON.parse(document.getElementById('images-data').textContent);

let current = 0;

function imgSrc(file){
  return 'data:image/jpeg;base64,' + IMAGES[file];
}

function render(){
  const p = PAGES[current];
  document.getElementById('section-pill').textContent = 'Page ' + p.pdf_page_number;
  document.getElementById('eyebrow').textContent = 'Source: page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('page-title').textContent = p.label;
  document.getElementById('content').innerHTML = p.html;

  const figWrap = document.getElementById('figures');
  figWrap.innerHTML = '';
  p.images.forEach(im => {
    const card = document.createElement('div');
    card.className = 'figure-card';
    const img = document.createElement('img');
    img.src = imgSrc(im.file);
    img.alt = im.caption;
    img.addEventListener('click', () => openLightbox(img.src, im.caption));
    const cap = document.createElement('div');
    cap.className = 'figure-cap';
    cap.textContent = im.caption;
    card.appendChild(img);
    card.appendChild(cap);
    figWrap.appendChild(card);
  });

  document.getElementById('folio-label').textContent = 'Page ' + p.pdf_page_number + ' / ' + PAGES.length;
  document.getElementById('progress-label').textContent = 'Page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('progress-fill').style.width = (((current+1)/PAGES.length)*100).toFixed(1) + '%';

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === PAGES.length - 1;
  document.getElementById('next-btn').textContent = current === PAGES.length -1 ? 'End' : 'Next \u2192';

  document.getElementById('leaf').style.animation = 'none';
  void document.getElementById('leaf').offsetWidth;
  document.getElementById('leaf').style.animation = '';

  updateActiveTocItem();
  window.scrollTo({top:0, behavior:'smooth'});
  if (window.__afterRender) window.__afterRender();
}

function openLightbox(src, alt){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('prev-btn').addEventListener('click', () => {
  if (current > 0){ current--; render(); }
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (current < PAGES.length -1){ current++; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// ---------- TOC ----------
function buildToc(){
  const list = document.getElementById('toc-list');
  PAGES.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = 'toc-item';
    btn.dataset.idx = idx;
    btn.textContent = 'p.' + p.pdf_page_number + '  —  ' + p.label;
    btn.addEventListener('click', () => {
      current = idx;
      render();
      closeToc();
    });
    list.appendChild(btn);
  });
}
function updateActiveTocItem(){
  document.querySelectorAll('.toc-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === current);
  });
}
function openToc(){
  document.getElementById('toc-panel').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeToc(){
  document.getElementById('toc-panel').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('toc-toggle').addEventListener('click', openToc);
document.getElementById('toc-close').addEventListener('click', closeToc);
document.getElementById('scrim').addEventListener('click', closeToc);

buildToc();
render();

// ---------- Read aloud (prefers Indian English voices) ----------
(function(){
  const listenBtn = document.getElementById('listen-toggle');
  const bar = document.getElementById('listen-bar');
  const voiceSel = document.getElementById('voice-select');
  const rateSel = document.getElementById('rate-select');
  const playBtn = document.getElementById('listen-play');
  const stopBtn = document.getElementById('listen-stop');
  const autoChk = document.getElementById('listen-auto');
  const status = document.getElementById('listen-status');

  if (!('speechSynthesis' in window)) {
    listenBtn.style.display = 'none';
    return;
  }

  let voices = [];
  let listening = false;
  let paused = false;
  let gen = 0;

  function score(v){
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l.indexOf('en-in') === 0) return 3;
    if (l === 'en-gb') return 2;
    return 1;
  }

  function loadVoices(){
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
    voices = (en.length ? en : all).slice().sort((a, b) => score(b) - score(a));
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const isIndian = (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0;
      opt.textContent = v.name + ' (' + v.lang + ')' + (isIndian ? ' — Indian accent' : '');
      voiceSel.appendChild(opt);
    });
    const idx = voices.findIndex(v => (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0);
    voiceSel.value = idx >= 0 ? idx : 0;
    if (!listening) {
      status.textContent = idx >= 0
        ? 'Indian English voice ready.'
        : 'No Indian English voice found on this device — closest English voice selected.';
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function pageText(){
    const p = PAGES[current];
    const div = document.createElement('div');
    div.innerHTML = p.html;
    let t = (div.textContent || '').replace(/\s+/g, ' ').trim();
    (p.images || []).forEach(im => { t += ' Figure on this page: ' + im.caption + '.'; });
    return t;
  }

  function chunk(text){
    const parts = text.match(/[^.!?\u2026]+[.!?\u2026]+["')\]]*\s*/g) || [text];
    const out = [];
    let buf = '';
    parts.forEach(s => {
      if ((buf + s).length > 220) { if (buf) out.push(buf); buf = s; }
      else buf += s;
    });
    if (buf) out.push(buf);
    return out;
  }

  function speak(){
    const text = pageText();
    if (!text) { status.textContent = 'Nothing to read on this page.'; return; }
    const myGen = ++gen;
    speechSynthesis.cancel();
    const pieces = chunk(text);
    const v = voices[parseInt(voiceSel.value, 10)];
    pieces.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateSel.value);
      if (i === pieces.length - 1) {
        u.onend = () => {
          if (!listening || myGen !== gen) return;
          if (autoChk.checked && current < PAGES.length - 1) { current++; render(); }
          else setUi(false);
        };
      }
      speechSynthesis.speak(u);
    });
    status.textContent = 'Reading page ' + (current + 1) + ' of ' + PAGES.length + '…';
  }

  function setUi(on){
    listening = on;
    paused = false;
    playBtn.innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Read aloud';
    stopBtn.disabled = !on;
    if (!on) status.textContent = 'Stopped.';
  }

  window.__afterRender = function(){
    if (listening) speak();
  };

  setInterval(() => {
    if (listening && !paused && speechSynthesis.speaking) speechSynthesis.resume();
  }, 10000);

  listenBtn.addEventListener('click', () => bar.classList.toggle('open'));
  playBtn.addEventListener('click', () => {
    if (!listening) { setUi(true); speak(); return; }
    if (paused) { speechSynthesis.resume(); paused = false; playBtn.innerHTML = '&#10074;&#10074; Pause'; }
    else { speechSynthesis.pause(); paused = true; playBtn.innerHTML = '&#9654; Resume'; }
  });
  stopBtn.addEventListener('click', () => { gen++; speechSynthesis.cancel(); setUi(false); });
  voiceSel.addEventListener('change', () => { if (listening) speak(); });
  rateSel.addEventListener('change', () => { if (listening) speak(); });
})();

</script>

<script>
(function(){
  var NOTES = {};
  var CHMAP = [];
  try { NOTES = JSON.parse(document.getElementById('notes-data').textContent); } catch(e) {}
  try { CHMAP = JSON.parse(document.getElementById('chapter-map').textContent); } catch(e) {}
  var term = '', matchPages = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function pageText(p){ var d=document.createElement('div'); d.innerHTML=p.html; return d.textContent || ''; }

  // ---------- SEARCH ----------
  var bar = document.getElementById('search-bar');
  var input = document.getElementById('search-input');
  var info = document.getElementById('search-info');

  function clearMarks(){
    var c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(function(mk){
      var t = document.createTextNode(mk.textContent);
      mk.parentNode.replaceChild(t, mk);
    });
    c.normalize();
  }
  function highlight(){
    clearMarks();
    if (!term || term.length < 2) return;
    var c = document.getElementById('content');
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var t = term.toLowerCase();
    nodes.forEach(function(n){
      var txt = n.nodeValue, low = txt.toLowerCase(), idx = low.indexOf(t);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(txt.slice(pos, idx)));
        var mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = txt.slice(idx, idx + term.length);
        frag.appendChild(mk);
        pos = idx + term.length;
        idx = low.indexOf(t, pos);
      }
      frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function infoText(){
    if (!term || term.length < 2) { info.textContent = ''; return; }
    if (!matchPages.length) { info.textContent = 'No matches'; return; }
    var pos = matchPages.indexOf(current);
    info.textContent = matchPages.length + (matchPages.length > 1 ? ' pages' : ' page') +
      (pos >= 0 ? ' — match ' + (pos + 1) + ' of ' + matchPages.length : '');
  }
  function doSearch(){
    term = input.value.trim();
    matchPages = [];
    if (term.length >= 2){
      var t = term.toLowerCase();
      PAGES.forEach(function(p, i){ if (pageText(p).toLowerCase().indexOf(t) >= 0) matchPages.push(i); });
    }
    if (matchPages.length){ current = matchPages[0]; render(); }
    else { highlight(); infoText(); }
  }
  function step(d){
    if (!matchPages.length) return;
    var pos = matchPages.indexOf(current);
    if (pos < 0) pos = 0;
    pos = (pos + d + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }
  var searchT = null;
  input.addEventListener('input', function(){ clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ clearTimeout(searchT); doSearch(); } });
  document.getElementById('search-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('search-next').addEventListener('click', function(){ step(1); });
  document.getElementById('search-close').addEventListener('click', function(){
    bar.classList.remove('open'); term=''; matchPages=[]; highlight(); infoText();
  });
  document.getElementById('search-toggle').addEventListener('click', function(){
    var open = bar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) input.focus();
  });

  // ---------- NOTES ----------
  var panel = document.getElementById('notes-panel');
  var body = document.getElementById('notes-body');
  function showNotes(){
    var ch = null;
    for (var i = current; i >= 0; i--){
      if (CHMAP[i] && NOTES[CHMAP[i]]) { ch = CHMAP[i]; break; }
    }
    if (!ch){
      for (var j = current; j < CHMAP.length; j++){
        if (CHMAP[j] && NOTES[CHMAP[j]]) { ch = CHMAP[j]; break; }
      }
    }
    if (!ch){
      body.innerHTML = '<p class="notes-empty">No chapter notes available for this section.</p>';
      return;
    }
    var n = NOTES[ch];
    var h = '<h3>' + esc(ch) + '</h3><h4>Summary</h4><p>' + esc(n.s) + '</p>';
    if (n.p && n.p.length){
      h += '<h4>Key points</h4><ul>' + n.p.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body.innerHTML = h;
  }
  document.getElementById('notes-toggle').addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    bar.classList.remove('open');
    if (open) showNotes();
  });

  // hooks after every render
  var prevA = window.__afterRender;
  window.__afterRender = function(){
    if (prevA) prevA();
    highlight();
    infoText();
    if (panel.classList.contains('open')) showNotes();
  };
})();
</script>

<script>
(function(){
  if (window.__selSearch) return; window.__selSearch = true;
  var tip = document.createElement('div');
  tip.id = 'sel-search-tip';
  tip.innerHTML = '<button id="sel-search-btn" type="button">&#128269; Search DuckDuckGo</button>';
  document.body.appendChild(tip);
  var bar = document.createElement('div');
  bar.id = 'sel-search-bar';
  bar.innerHTML = '<span id="sel-search-msg">Search opened in a popup window.</span>' +
    '<button id="sel-search-close" type="button">&#10005; Close search window</button>';
  document.body.appendChild(bar);
  var popup = null, term = '', lastUrl = '';

  function hideTip(){ tip.classList.remove('show'); }
  function hideBar(){ bar.classList.remove('show'); }

  function showTipForSelection(){
    var sel = window.getSelection();
    var txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    if (txt.length >= 2 && txt.length <= 160){
      term = txt;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      var top = r.top - 46;
      if (top < 8) top = r.bottom + 10;
      var left = r.left + r.width / 2;
      left = Math.max(90, Math.min(window.innerWidth - 90, left));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.classList.add('show');
    } else {
      hideTip();
    }
  }

  document.addEventListener('mouseup', function(e){
    if (tip.contains(e.target) || bar.contains(e.target)) return;
    setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('keyup', function(e){
    if (e.shiftKey) setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!tip.contains(e.target)) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);

  document.getElementById('sel-search-btn').addEventListener('click', function(){
    if (!term) return;
    lastUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(term);
    popup = window.open(lastUrl, 'ddg_search_popup', 'width=920,height=700,menubar=no,toolbar=no,location=no,status=no');
    hideTip();
    var msg = document.getElementById('sel-search-msg');
    if (popup){
      msg.textContent = 'Search opened in a popup window.';
    } else {
      msg.innerHTML = 'Popup blocked — <a href="' + lastUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">open the search in a new tab</a>.';
    }
    bar.classList.add('show');
  });

  document.getElementById('sel-search-close').addEventListener('click', function(){
    if (popup && !popup.closed) popup.close();
    popup = null;
    hideBar();
  });
})();
</script>

<script>
(function(){
  if (window.__slChat) return; window.__slChat = true;
  var CFG_KEY = 'sl_llm_config';
  function loadCfg(){
    try { var raw = localStorage.getItem(CFG_KEY); if (raw) return JSON.parse(raw); } catch(e){}
    return { endpoint:'https://api.openai.com/v1/chat/completions', key:'', model:'gpt-4o-mini' };
  }
  var cfg = loadCfg();

  var fab = document.createElement('button');
  fab.id = 'sl-chat-fab'; fab.type = 'button'; fab.title = 'Library assistant';
  fab.textContent = '\uD83D\uDCAC';
  document.body.appendChild(fab);

  var panel = document.createElement('div');
  panel.id = 'sl-chat-panel';
  panel.innerHTML =
    '<div id="sl-chat-head"><span>\u2728 Library Assistant</span>' +
    '<span><button id="sl-chat-clear" type="button" title="Clear chat">\uD83D\uDDD1</button>' +
    '<button id="sl-chat-gear" type="button" title="LLM settings">\u2699</button>' +
    '<button id="sl-chat-x" type="button" title="Close">\u2715</button></span></div>' +
    '<div id="sl-chat-settings">' +
    '<b>LLM configuration (any OpenAI-compatible API)</b>' +
    '<input id="sl-cfg-endpoint" placeholder="Endpoint, e.g. https://api.openai.com/v1/chat/completions">' +
    '<input id="sl-cfg-key" type="password" placeholder="API key (stored only in this browser)">' +
    '<input id="sl-cfg-model" placeholder="Model, e.g. gpt-4o-mini">' +
    '<div class="row"><button id="sl-cfg-save" type="button">Save</button>' +
    '<button id="sl-cfg-test" type="button">Test</button><span id="sl-cfg-status"></span></div>' +
    '<div class="hint">Works with OpenAI, OpenRouter, Groq, Mistral, Ollama (http://localhost:11434/v1/chat/completions), LM Studio. Without a key I search this book locally and DuckDuckGo externally.</div>' +
    '</div>' +
    '<div id="sl-chat-body"></div>' +
    '<div id="sl-chat-inputrow"><input id="sl-chat-input" placeholder="Ask about this book, or the web\u2026">' +
    '<button id="sl-chat-send" type="button" title="Send">\u27A4</button></div>';
  document.body.appendChild(panel);

  var body = panel.querySelector('#sl-chat-body');
  var input = panel.querySelector('#sl-chat-input');
  var sendBtn = panel.querySelector('#sl-chat-send');
  var busy = false;

  function scrollBody(){ body.scrollTop = body.scrollHeight; }
  function addMsg(role, html){
    var d = document.createElement('div');
    d.className = 'sl-msg ' + role;
    d.innerHTML = html;
    body.appendChild(d); scrollBody();
    return d;
  }
  function esc(t){ var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  addMsg('bot', 'Namaste. Ask me anything \u2014 I can search <b>this book</b> page by page, answer with your configured LLM, or run an external DuckDuckGo search.');

  function pageText(p){
    var d = document.createElement('div'); d.innerHTML = p.html; return d.textContent || '';
  }

  function searchBook(q){
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    if (!terms.length) return [];
    var out = [];
    for (var i = 0; i < PAGES.length; i++){
      var txt = pageText(PAGES[i]).toLowerCase();
      var score = 0;
      for (var k = 0; k < terms.length; k++){
        var hits = txt.split(terms[k]).length - 1;
        if (hits) score += hits;
      }
      if (score) out.push({ i: i, score: score });
    }
    out.sort(function(a,b){ return b.score - a.score; });
    return out.slice(0, 5);
  }

  function snippet(i, q){
    var txt = pageText(PAGES[i]).replace(/\s+/g,' ');
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    var pos = -1;
    for (var k = 0; k < terms.length; k++){ pos = txt.toLowerCase().indexOf(terms[k]); if (pos >= 0) break; }
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 60);
    return (start ? '\u2026' : '') + txt.slice(start, start + 170) + '\u2026';
  }

  function goToPage(i){
    try { current = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch(e){ console.warn('jump failed', e); }
  }

  function callLlm(q, context){
    return fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: 'You are the assistant inside a spiritual book reader. Answer concisely. When book excerpts are provided, ground the answer in them and cite the page labels. If the question needs current external facts, say so and suggest an external search.' },
          { role: 'user', content: context ? 'Book excerpts:\n' + context + '\n\nQuestion: ' + q : q }
        ],
        temperature: 0.4
      })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error('LLM error ' + res.status + ': ' + t.slice(0,180)); });
      return res.json();
    }).then(function(data){
      var c = data.choices && data.choices[0] && data.choices[0].message;
      return (c && c.content || '(empty response)').trim();
    });
  }

  function handleSend(){
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    addMsg('user', esc(q));
    busy = true; sendBtn.disabled = true;
    var thinking = document.createElement('div');
    thinking.className = 'sl-thinking'; thinking.textContent = 'Thinking\u2026';
    body.appendChild(thinking); scrollBody();

    var hits = searchBook(q);
    var finish = function(){ busy = false; sendBtn.disabled = false; thinking.remove(); };

    function renderRefs(){
      if (!hits.length) return '';
      var h = '';
      hits.forEach(function(hit, n){
        h += '<button class="sl-ref" data-page="' + hit.i + '" type="button"><b>' + esc(PAGES[hit.i].label) +
             ' \u00b7 page ' + (hit.i + 1) + '</b><span>' + esc(snippet(hit.i, q)) + '</span>' +
             '<span class="go">Go to page \u2192</span></button>';
      });
      return h;
    }

    var done = function(html){ finish(); var m = addMsg('bot', html);
      m.querySelectorAll('.sl-ref').forEach(function(b){
        b.addEventListener('click', function(){ goToPage(parseInt(b.getAttribute('data-page'), 10)); });
      });
    };

    if (cfg.key){
      var ctx = hits.slice(0,3).map(function(hit){
        return '[' + PAGES[hit.i].label + ', page ' + (hit.i + 1) + '] ' + pageText(PAGES[hit.i]).replace(/\s+/g,' ').slice(0, 900);
      }).join('\n');
      callLlm(q, ctx).then(function(ans){ done(esc(ans) + renderRefs()); })
      .catch(function(err){ done(esc(String(err.message || err)) + renderRefs()); });
    } else if (hits.length){
      done('I found ' + hits.length + ' relevant page' + (hits.length > 1 ? 's' : '') + ' in this book. Tap one to jump there, or add an LLM API key in \u2699 Settings for a synthesized answer.' + renderRefs());
    } else {
      var url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      done('Nothing in this book matched. <a href="' + url + '" target="_blank" rel="noopener">Search the web for \u201c' + esc(q) + '\u201d on DuckDuckGo \u2197</a> \u2014 or add an LLM key in \u2699 Settings and I can answer directly.');
    }
  }

  fab.addEventListener('click', function(){ panel.classList.toggle('show'); });
  panel.querySelector('#sl-chat-x').addEventListener('click', function(){ panel.classList.remove('show'); });
  panel.querySelector('#sl-chat-clear').addEventListener('click', function(){ body.innerHTML = ''; addMsg('bot', 'Chat cleared. Ask me anything.'); });
  panel.querySelector('#sl-chat-gear').addEventListener('click', function(){
    var st = panel.querySelector('#sl-chat-settings');
    st.classList.toggle('show');
    panel.querySelector('#sl-cfg-endpoint').value = cfg.endpoint || '';
    panel.querySelector('#sl-cfg-key').value = cfg.key || '';
    panel.querySelector('#sl-cfg-model').value = cfg.model || '';
  });
  panel.querySelector('#sl-cfg-save').addEventListener('click', function(){
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    panel.querySelector('#sl-cfg-status').textContent = 'Saved.';
  });
  panel.querySelector('#sl-cfg-test').addEventListener('click', function(){
    var status = panel.querySelector('#sl-cfg-status');
    status.textContent = 'Testing\u2026';
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'Say OK' }], max_tokens: 5 })
    }).then(function(res){ status.textContent = res.ok ? 'Connected.' : 'Failed: HTTP ' + res.status; })
    .catch(function(err){ status.textContent = 'Failed: ' + err.message; });
  });
  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });
})();
</script>
<style id="sl-sel-css">
#sl-sel-tip{position:fixed;z-index:99999;display:none;align-items:center;gap:2px;padding:5px;background:#2E2A24;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);font:13px/1.2 system-ui,-apple-system,sans-serif}
#sl-sel-tip.show{display:flex}
#sl-sel-tip button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:#F7F1E3;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
#sl-sel-tip button:hover{background:#4A4234}
#sl-sel-tip .sl-sep{width:1px;height:18px;background:#55493A;margin:0 2px}
#sl-sel-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#2E2A24;color:#F7F1E3;padding:10px 18px;border-radius:999px;font:13px system-ui,-apple-system,sans-serif;z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:0 8px 22px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#sl-sel-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>
(function(){
  if (window.__slSelTools) return; window.__slSelTools = true;

  /* Compatibility shim: topic-based readers (e.g. Ponder on This) expose
     `topics` + `goTo(id)` instead of `PAGES` + `render()`. Build the PAGES
     interface so the embedded assistant's search and page jumps work there too. */
  try {
    if (typeof PAGES === 'undefined' && typeof topics !== 'undefined' && Array.isArray(topics)) {
      window.PAGES = topics.map(function(t){
        return {
          label: 'Topic ' + t.id + ' \u2014 ' + t.title,
          html: '<div>' + (t.matter || []).map(function(m){ return '<p>' + m.text + '</p>'; }).join('') + '</div>'
        };
      });
      window.render = function(){
        try { if (typeof goTo === 'function') goTo(topics[window.current || 0].id); } catch(e){}
      };
    }
  } catch(e){}

  var NOTES_KEY = 'sl_my_notes';

  var tip = document.createElement('div');
  tip.id = 'sl-sel-tip';
  tip.setAttribute('role', 'toolbar');
  tip.setAttribute('aria-label', 'Selection actions');
  tip.innerHTML =
    '<button type="button" data-act="ask">\u2728 Ask AI</button>' +
    '<span class="sl-sep"></span>' +
    '<button type="button" data-act="note">\uD83D\uDCDD Add to my note</button>';
  document.body.appendChild(tip);

  var toast = document.createElement('div');
  toast.id = 'sl-sel-toast';
  document.body.appendChild(toast);
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  var selText = '';

  function hideTip(){ tip.classList.remove('show'); }

  function insideUi(node){
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    while (el) {
      if (el.id === 'sl-chat-panel' || el.id === 'sl-sel-tip' ||
          el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return true;
      el = el.parentElement;
    }
    return false;
  }

  function showTip(){
    var sel = window.getSelection();
    var text = sel && !sel.isCollapsed ? sel.toString().replace(/\s+/g, ' ').trim() : '';
    if (text.length < 3 || insideUi(sel.anchorNode)) { hideTip(); return; }
    var rect;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch(e){ hideTip(); return; }
    if (!rect || (rect.width === 0 && rect.height === 0)) { hideTip(); return; }
    selText = text;
    tip.classList.add('show');
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = rect.left + rect.width / 2 - w / 2;
    var y = rect.top - h - 8;
    if (y < 6) y = Math.min(window.innerHeight - h - 6, rect.bottom + 8);
    x = Math.max(6, Math.min(window.innerWidth - w - 6, x));
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseup', function(){ setTimeout(showTip, 10); });
  document.addEventListener('touchend', function(){ setTimeout(showTip, 350); });
  document.addEventListener('mousedown', function(e){ if (!tip.contains(e.target)) hideTip(); });
  document.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideTip(); });

  /* Keep the text selection alive when the user taps a tooltip button */
  tip.addEventListener('mousedown', function(e){ e.preventDefault(); });
  tip.addEventListener('touchend', function(e){ e.preventDefault(); }, { passive: false });

  function askAi(text){
    var panel = document.getElementById('sl-chat-panel');
    var input = document.getElementById('sl-chat-input');
    var send = document.getElementById('sl-chat-send');
    if (!panel || !input || !send) return;
    panel.classList.add('show');
    var trimmed = text.length > 600 ? text.slice(0, 600) + '\u2026' : text;
    input.value = 'Explain this passage: \u201C' + trimmed + '\u201D';
    send.click();
    input.focus();
  }

  function currentLocation(){
    try {
      if (typeof PAGES !== 'undefined' && typeof current !== 'undefined' && PAGES[current]) {
        return PAGES[current].label || '';
      }
    } catch(e){}
    try {
      if (typeof topics !== 'undefined' && typeof currentId !== 'undefined') {
        var t = topics.find(function(x){ return x.id === currentId; });
        if (t) return 'Topic ' + t.id + ' \u2014 ' + t.title;
      }
    } catch(e){}
    return '';
  }

  function addNote(text){
    var notes = [];
    try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); } catch(e){}
    if (!Array.isArray(notes)) notes = [];
    notes.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      book: document.title,
      page: currentLocation(),
      text: text,
      url: location.pathname.split('/').pop(),
      ts: Date.now()
    });
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes.slice(0, 500))); } catch(e){}
    showToast('Saved to My Notes \u2014 view it on the library home page');
  }

  tip.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    var text = selText;
    hideTip();
    if (btn.getAttribute('data-act') === 'ask') askAi(text);
    else addNote(text);
  });
})();
</script>
