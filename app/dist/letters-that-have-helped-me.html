r in hand, watching the upward curl of its blue smoke-filament, his eyes darkened by the intensity of his thought. I knew he had just seen X, an “advanced” theosophist of the occult wing, and I lay in wait for any information which might percolate through upon my humble self. Presently theProfessor remarked, dreamily, and as if speaking from cloudland:<\/p><p>“We had many a crisis, but assuredly this was the greatest.”<\/p><p>“To what do you refer, Professor?”<\/p><p>“To the departure of H. P. B. from her physical body, It might have been supposed. in advance, that this sudden taking-off would result to our disadvantage. But the fact is, disasters work upon the T. S. in inverse proportion. The greater the (apparent) disaster, the greater the resultant good. The stronger the blow, too, the stronger our reaction. All attacks, all so-called exposures and losses have merely cleared away the impediments of weak and uncertain followers. The apparent loss of our leader did not, for one instant even, paralyze the activities of the working staff in India, England, or America. Now, day by day, we have evidence of growth in every direction. The Press is opening its jealously- guarded doors. The Practical Work of the Theosophic League has won public sympathy for us. Everywhere there is a sudden outburst of energy and new life. X spoke of it today.”<\/p><p>“What had he to say of it?”<\/p>", "images": []}, {"pdf_page_index": 286, "pdf_page_number": 287, "label": "Tea-Table Talks", "html": "<p>“We were talking about H. P. B., and he said that, so far as he understood, she (the Adept) expended an immense amount of energy—vis viva, you know—in holding together a body whose every molecule tended to disruption. In effect, just think of the cohesive force thus employed!—of the immense friction in brain centers already worn by disease. X says they were so impaired that senility must soon have resulted, so that it seemed to her (?) better to let that body go to pieces as soon as a good opportunity should occur.”<\/p><p>“That last phrase is very suggestive.”<\/p><p>“It is. And we believe that H. P. B. will be for some time occupied in training a new instrument, and one not so young as to be useless at the present cyclic crisis. He does not pretend to speak with authority, but certain sayings of hers—and perhaps what I might call post-mortem facts—bear him out. Certainly she left everything in order. All things were planned out, and evidence was abundantly had to the effect that she knew her departure was near. Moreover, X said that looking upon her as an Adept, whose chief work was done outside of the objective body, it was reason able to suppose that she is now enabled to use, upon higher (or inner) planes of being, the power previously expended in the maintenance of that body.”<\/p><p>“Did he think that the present theosophic increase should be attributed to that fact?”<\/p>", "images": []}, {"pdf_page_index": 287, "pdf_page_number": 288, "label": "Tea-Table Talks", "html": "<p>“Only in part. You see, he believes her attentions to be largely engaged with the new instrument. But, from his point of view, her co-adjutors and associates would naturally lend a helping hand in her absence, especially if the T.S., as a body, called down their help.”<\/p><p>“What do you mean by calling down help?”<\/p><p>“I mean that- the united impulse of a large body of truth seekers—more especially if they work for Humanity—attracts the help needed for its spiritual efforts. Imagine it as a great stream of energy going out into space and returning freighted with all that it had attracted to itself—all similars—on its passage. That in itself would be a source of power. Again, the increase is largely due to what H.P,B. foresaw. Theosophists are now able to stand alone, are all the gainers by being left to do so. (Take the words ‘alone’ and ‘left’ in a relative sense, please.) In the same way an infant is benefited when left to learn to walk, even at the cost of its tumbles; it is the course of normal, healthy growth in every department of Nature.”<\/p><p>“All that sounds rational enough.”<\/p><p>“My dear Sir! Nothing is more rational, more sane than Theosophy. It is like the fairy wand which was used upon the ten billion feathers of ten thousand different kinds; all the facts of life fly out into well ordered heaps.”<\/p><p>“Just fancy how the public would receive that statement!”<\/p>", "images": []}, {"pdf_page_index": 288, "pdf_page_number": 289, "label": "Tea-Table Talks", "html": "<p>“The public is well described by Carlyle’s estimate of population: so many ‘millions—mostly fools.’ Yet tell me what truth, what invention, has not been rejected by their scorn. Let us not be trite. All the truths of Theosophy, all the axioms of occultism are, if I may so put it, the apotheosis of common sense. When you see a lack of that—beware! You may be sure that their knowledge is defective, erratic, ill-digested; every psychic, every seer, every hearer to the contrary. What are their gifts If not supplemented by an understanding of the thing heard or seen? ‘My son, get knowledge; but, above all, get understanding.’ That power to interpret must be supplied. How?”<\/p><p>“I cannot possibly say. Did you not ask X?”<\/p><p>“I did. His answer was: ‘By study of the Ethics. The Bhagavad Gita shows the way.’ In this science, he declared, spirit and nature, or the pure and the true, or ethics and law, are one and the same thing. The inner man may be looked upon as a congeries of powers. Every power is ‘the opener of the Door’ to the plane from which it springs in Nature. A power of the lower astral, or psycho-physiological, plane opens the door to that plane alone. It does so partly through action and interaction in the cells and molecules of the body. It acts upon its corresponding principle in every cell.”<\/p><p>“Can’t you enlarge upon that, Professor?”<\/p>", "images": []}, {"pdf_page_index": 289, "pdf_page_number": 290, "label": "Tea-Table Talks", "html": "<p>“Suppose I were able to induce in the optic nerve that vibratory ratio which enables it to perceive the yellow color. How do I do it? I act as Nature does. She presents a given numerical vibration to the nerves, and forthwith they telegraph to the brain the sense impression of yellow. Which do you call the real thing in itself; the sense impression? or the vibratory ratio? I induce (if I can!) that same ratio in the nervous fluid, and the brain again registers yellow. Soon, if I were to continue this action, that nerve aura of the inner man would be in synchronous action and interaction with a whole plane of being—call it the lower plane of the yellow ray, and all the things of that plane which are related to that vibration are perceived. Those parts of specific things which are not in relation to the vibration are not seen, and thus partial knowledge arises. It is literally true that you see that which you are.”<\/p><p>“I begin to understand.”<\/p><p>“Again, note that every plane has its active and its passive aspects; its principles; its sub-divisions and theirs. It is only the higher plane forces that open the upper doors. What determines this difference in power?”<\/p><p>“Ah! That must be the crux.”<\/p>", "images": []}, {"pdf_page_index": 290, "pdf_page_number": 291, "label": "Tea-Table Talks", "html": "<p>“Thought determines it. Motive determines it, for motive determines the quality of Thought. Through motive, Thought becomes contractive or expansive. It is well known that Thought affects the assimilative processes of the body. It has always been a recognized factor in therapeutics. The introduction of the higher, more spiritualized vibrations into the secret brain centers not only opens them to the influence of higher spheres, but also it influences the selective action of the whole sphere. As the body exhales and inhales air, so the inner nervous body dilates and contracts with the motion of the etheric or astral Medium. Its vibration is quickened by the action of Thought, and this more rapid vibration prevents the entrance of the grosser particles of etheric substance, causing also a draught upon the infinitely finer currents of that World Soul. In this way the higher intelligence of every atom is opened, ‘wooed from out the bud like leaves upon the branch.’ Keely gives us a hint of one method in which this is done.”<\/p><p>“You mean by his discovery that the production of the chord of any given mass ruptures the molecular association of that mass and liberates finer energies, which energies are infinitely more dynamic?”<\/p>", "images": []}, {"pdf_page_index": 291, "pdf_page_number": 292, "label": "Tea-Table Talks", "html": "<p>“Precisely so. The lesson can be carried still further. You say he produces the chord of any given mass, a chord which represents the vibratory total of that mass. So, too, we must use that force which is harmonious to the plane which we desire to enter. It is easy to talk about it, but who amongst us can do it? And when the psychic does it fortuitously, he sees only partial results, only that which he is fitted to see, and no more. This is why it is so often said: ‘A man must live what he knows.’ Until he has lived it, he cannot know it; he must be that higher vibration; he him self must become that ‘lost Word.’ By long training in the production of forces within himself—forces which must be absolutely pure if they are to reveal the pure—the student may approximate an understanding of what he sees. Otherwise, psychic experiences are a great disadvantage. They pre-empt thought; they detain the mind, as thorns upon the bushes detain the sheep. This is why the Voice of the Silence advises the student to flee from that ‘Hall of Learning’ where, under every flower, the astral serpent coils.”<\/p><p>“Then it is well to be able to show these things by the light of common sense.”<\/p><p>“Certainly, if you wish to benefit the sensible. I always go to Nature for an explanation of occultism.”<\/p>", "images": []}, {"pdf_page_index": 292, "pdf_page_number": 293, "label": "Tea-Table Talks", "html": "<p>“In that case, drawing a parallel, we may say that the so-called death of Madame Blavatsky brought the theosophic minds to a common focus; that was, the determination to continue her work. This unity of effort on higher lines induced a great volume of energy, all pouring into and from a common center.”<\/p><p>“Yes—and results of this action are now seen in a two-fold manner. Firstly, in the increased activity we spoke of; secondly, in the partial unclosing of the doors into higher planes.”<\/p><p>“How do you infer that?”<\/p><p>“From what X went on to tell me. It appears that the Leaders of the Society have made themselves objectively felt. Say, for example, in the way of letters. It is affirmed that some such have been received, and that their burden is ‘Work.’ In one, a laborer is told to ‘not ask for detailed commands, for H. P. B. has the PATH hewed out. FOLLOW in WORK and leave us to manage results.’ Again, work is referred to thus:— ‘You go on with other work in a field as wide as humanity.’ The worker here referred to had been previously working in purely ethical ways. Another student is told: ‘Be careful, then, so to act that your life shall not hurt the Society, now having so few. * * * Make no profession a lie. Remember your responsibility and your oath.’ The burden of all such letters is devotion to and work for the present organization, as a duly-created center through which work is to be done.”<\/p><p>“It must be very encouraging to receive such letters.”<\/p>", "images": []}, {"pdf_page_index": 293, "pdf_page_number": 294, "label": "Gleanings From The “Path”", "html": "<p>“Precisely my remark to X, who gave me one of his sudden shrewd looks, and then said quickly, ‘My dear boy, when a plant is mildewed, devoured, broken, growing awry, the head gardener or some one of his authorized assistants comes to its aid, or some few especial plants, doing especial service in the garden, may receive especial stimulus, such as would injure others. But when a plant is following all the natural laws of growth, it requires no re-adjustment: it does not hear from the gardener, who knows it is doing well. In the East, the Guru or Teacher is called the Re-adjuster. And He may communicate with some sub-center already established, which sub-center is to give out the help thus extended to those working in the same line’.”<\/p><p>“Then those workers who do not hear in some specific manner may still feel that they are seen and are doing well?”<\/p><p>“That is what X said; also that with closer relations to The Lodge comes also a greater, a terrible responsibility.”<\/p><p>“It often seems to me hard to know just how to work.”<\/p><p>“That is so. The best advice I ever found was: 1st, Use your predominant gifts to the best advantage. 2nd, Do not impede your fellow in so using his. 3rd, Follow the methods of Nature. Find a current or a nucleus, and work in it. No matter whether it seems perfect to you or not. Leave results to the Law. But if no nucleus is found, become yourself a center. The Divine will enter and work through you.” . .<\/p><p>—September, 1891<\/p><h3 class=\"pdf-heading\">Gleanings From The “Path”<\/h3>", "images": []}, {"pdf_page_index": 294, "pdf_page_number": 295, "label": "Gleanings From The “Path”", "html": "<p>In the great struggle of Humanity nothing is lost. No labor, no love is in vain. We live over again our own trials in those we desire to assist. We are drawn upward and outward by those who are trying to assist us.<\/p><p>—May, 1890<\/p><p>Books will do you little good. They will serve to confirm after you already know. They cannot give anything new, for it is the old which they strive to teach and we to find. Keep your motive pure, your will to rise higher strong, and you will pass on. * * * Shut up your books and think.<\/p><p>Do not rely upon books to guide you or teach you. They are good to give men earthly knowledge, they are good to start men thinking. They will not give men heavenly wisdom or the True. You can obtain good from all things, books included. You cannot know yourself through books.<\/p><p>—April, 1890<\/p><p>Look for the real beneath the unreal; look for the substance behind the shadow; and in the midst of confusion look for the silent centre where the Lodge is ever at work.<\/p><p>—December, 1895<\/p><p>The remarks of our President[24] last Tuesday [were] upon the multiplied force of concerted action, in showing that, side by side with what we are doing, runs the hidden current of our being, slow-moving, perhaps, but nevertheless sweeping on with a resist- less force, none the less great for being unsuspected.<\/p><p>—August, 1889<\/p><p>NOTE.—Bracketed passages are those of the writer (usually “Jasper” or “Julius”) who is quoting Mr. Judge.—Eds.<\/p><p>[An adept writes:]<\/p>", "images": []}, {"pdf_page_index": 295, "pdf_page_number": 296, "label": "Gleanings From The “Path”", "html": "<p>Before you can become an occultist you have to give up every prejudice, every earthly liking, every feeling of preference for one thing over another. It is easy to fall into Black Magic. The natural tendency is to Black Magic, and that is why several years’ training is necessary to cut away every source of prejudice before power can be intrusted to you. An Adept must entirely separate himself from his personality; he must say, ‘I am a power.” A Black magician prepares to do mischief without giving a thought to whether it will harm others. A deed of kindness done with partiality may become evil, e. g., by stirring up animosity in the mind of others. It is necessary, when acting, to lose all sense of identity and to become an abstract power. Justice is the opposite of Partiality. There is good and evil in every point of the universe, and if one works, however indirectly, for one’s own partiality, one becomes, to that extent, a Black magician. Occultism demands perfect justice, absolute impartiality. When a man uses the powers of nature indiscriminately with partiality and no regard to justice, it is Black magic. Like a blackleg, a Black magician acts on certain knowledge. Magic is power over the forces of nature, a. g., the Salvation Army, by hypnotizing people and making them psychically drunk with excitement, uses Black magic. The first exercise of Black Magic is to psychologize people. To help a sick person is not black magic, but no personal preference must guide you.<\/p>", "images": []}, {"pdf_page_index": 296, "pdf_page_number": 297, "label": "Gleanings From The “Path”", "html": "<p>When the 6th race reaches its close there will be no more Dugpas (Black magicians). A Dugpa may become converted during life at the expense of terrible sufferings and trials. On the astral and psychic planes the Masters are always stronger than the Dugpas, because there good is stronger than evil. But on our material plane evil is stronger than good, and the Masters, having to exercise cunning if acting on this plane, which is contrary to Their natures, encounter great difficulties and can only palliate evil effects. in powers not good there is absence of good but not presence of evil, and the higher we go, the more does evil become the absence of good. Only by following the absolute sexless unity can the white path be trodden.<\/p><p>—August, 1890<\/p><p>[ MSS. remarks by an Adept:]<\/p><p>All illnesses, diseases, and abnormalities of the body come from astral planes. The physical cannot infect the astral. The occult and the physical must never be mixed up. It is absolutely necessary to concentrate on one or on the other.<\/p><p>—August, 1889<\/p><p>How much I wish you could keep quiet; I mean, quiet inside. You are allowing yourself to chafe and rage inside. Outside quiet does not amount to anything unless all inside is quiet too. This has to be learned, and, good boy as you are, you have not yet learned it. Can’t you? I have learned that, or else I should have gone mad, as much from myself as from others.<\/p>", "images": []}, {"pdf_page_index": 297, "pdf_page_number": 298, "label": "Gleanings From The “Path”", "html": "<p>‘What is to learn, is to be content, or, rather, resigned to ourselves and our limitations even while striving to get above them; and when a bold and loyal nature like yours achieves that knowledge, a great advance is made. You need never excuse yourself at all in the forum of your own judgment, but when you have passed your judgment, bow your head. We cannot all at once live up to these high ideals as some others live up to theirs. Some are pleased with themselves because their rules allow it, and they are thus quiet, but it is not that quiet I refer to. Your soul may be quiet even while the body rages. (See Voice of the Silence.) I am never, nor you, satisfied with ourselves, but we must be resigned to the limitations of our character as they appear to us. The greatest error in occultism is to doubt one’s self, for it leads to all doubt. The doubts of others, which we have, always spring from the inward doubt of self. Do not doubt, then, even so much as you admit, in yourself.<\/p><p>—April, 1890<\/p><p>The processes of preparation go silently on till the individual, all unconscious, reaches the moment when the one needed force touches him, and then every prepared constituent falls instantly into place and the being is—as it were—reconstructed at once. Conceptions, relations, aims are revolutionized.<\/p><p>—May, 1888<\/p><p>[One versed in holy mysteries said recently when consulted about an aspirant for chelaship:]<\/p>", "images": []}, {"pdf_page_index": 298, "pdf_page_number": 299, "label": "Gleanings From The “Path”", "html": "<p>Having the right motive he is all right. His views are of no use to him. * * * He had better be ready to alter them as he passes on.<\/p><p>—September, 1887<\/p><p>I want you to stop as much as possible any wish to progress. The intense desire to know and to become, and to reach the light, is different from the thought: I am not progressing: I know nothing. The latter is looking for results. The right position to take is the wish to Be. For then we know. The wish to know is almost solely intellectual, and the desire to Be is of the heart. For instance, when you succeed in seeing a distant friend, that is not knowledge: that is the fact of Being in the condition or vibration that is that friend at the time. The translation of it into a mental reckoning or explanation, is what is called knowledge. To see an elemental on the astral plane, is for the time to be, in some part of our nature, in that state or condition. Of course there are vast fields of Being we cannot hope to reach yet. But while we strive to become divine and set our final hopes no lower than that supreme condition, we can wholly and entirely learn to be that plane which is presented to us now.<\/p><p>—January, 1888<\/p><p>Unlike those who grumble at not being “helped,” I think there is more danger of our being “helped” too much than too little. Machines break from over-speeding, not from being run too slowly—save in exceptional cases.<\/p><p>—April, 1891<\/p><p>[One who had won the right and the sacred duty of teacher, once said:]<\/p>", "images": []}, {"pdf_page_index": 299, "pdf_page_number": 300, "label": "Gleanings From The “Path”", "html": "<p>That law is immutably fixed which declares that he who has received spiritual benefit, no matter how little, must not willingly die, unless he has communicated that which he has received to at least one other person. And therein it is also stated that by communicating is meant, not merely verbal delivery, but patient care until that other person fully understands. Having once turned thy mind to the light of that True Sun, thou bath cast thyself upon that great stream of divine energy which flows to and from that Sun; and nevermore canst thou claim back for thyself that life; live, then, so that the duty may be well performed.<\/p><p>—January, 1888<\/p><p>[A comrade writes:]<\/p><p>This battle does not seem like the real one. That will come when, for purposes of testing the staying force of her supporters and the influence on them of theosophy, H. P. B. will seem to give herself away.<\/p><p>—July, 1889<\/p><p>The image of the Master is the best protection against lower influences; think of the Master as a living man within you.<\/p><p>—September, 1890<\/p>", "images": []}, {"pdf_page_index": 300, "pdf_page_number": 301, "label": "Gleanings From The “Path”", "html": "<p>I faint with the desire to find those who will unselfishly accept me and work for the rest. I give myself in all things for your benefit and would be glad if by my death or by my loss you could reach enlightenment. I would transfer, could I do so, all my experience to your soul and give it away to you. For what? For nothing at all save your acceptance. You know very well we can do no more than offer these goods. We set up the wooden image before the eyes of men and not one taking the sword cuts it in two, to find the jewels within. Then we sadly go on again.<\/p><p>—June, 1887<\/p><p>[The following extract from a letter of X. shows the attitude of the clear-sighted seeker:]<\/p><p>Like you, I merely want to work. I seek no powers; nothing. I have made in my heart the martyr’s vow. I am devoted as far as my lights in each life will permit to the service in the altruist army. Just now I only find T.S. to work in here. Next time, some other way—or the same. I am ready “to step out of the sun shine into the shade so as to make room for others,” and I seek no Nirvana. This is your way, too; so be troubled not by words, titles or confusions.<\/p><p>—December, 1889<\/p><p>[Some are being wounded in the fray, and to one of such this letter was lately written by a friend.]<\/p>", "images": []}, {"pdf_page_index": 301, "pdf_page_number": 302, "label": "Gleanings From The “Path”", "html": "<p>Hearing that you are not well in health and have as well another grief to bear, I make bold to write to you and say that I am sorry. It is not consolation that I have to offer, for I think that is too often a mere mockery of sorrow. Yet I would tell you that you are not quite alone. A friend who is dealing blows to right and left, and would fain make of herself an enemy, has not spared you in that respect. But I think we have only to remember what we have already learned for ourselves—that it is all from delusion— and then we shall not mind and shall be prepared to wait until great Time brings its magic changes. ‘We can wait: “those also serve who only stand and wait.” And that, too, has to be learned—no doubt like other things—through pain. But let us not forget that it is we who make our own pain. I have found that grief and sorrow spring only from wrong thinking. Not wrong in the sense of wicked, but in the sense of something out of harmony with the scheme of Nature; something unscientific and therefore contrary to the highest ethics. If we confined our thoughts as well as acts to our own clear duty, leaving results and the morrow to the Law, what room would there be for sorrow?<\/p>", "images": []}, {"pdf_page_index": 302, "pdf_page_number": 303, "label": "Gleanings From The “Path”", "html": "<p>So, let us lean back and smile at the show and seeming of things, knowing that even if we are tied by hands and feet for a spell of days or years the heart of the world will throb on quite well without us. Therefore, do not let us get mentally involved in this or any other matter, but stand aside—spectators, though doing with power all that comes to us to do and ready to do nothing if that be needed. Then, Brother, let us be glad at whatever comes and at all that is said and whispered, for though to-day may seem dark, these things work out in the end for good. The more violent the storm, the sooner shall we see the face of the sun which shines behind the clouds that hide it for only a very little while. You are quite happy and serene, ready for all and indifferent to each, at rest in the silent place of your own abode. But, like all of us, you are not known to every man, for the soul alone knows the soul. That is why there is little need to hide in Kali Yuga! You may tell all, and they are not one jot the wiser. These people who imagine that they know the heart, the mind, and the soul of either you or me are not wise at all. They do not understand. They do not believe in their teaching, but merely hold it in their heads. So let it turn there, and perchance in the course of ages a flower will bloom in the heart of each, and then we will rejoice. If man could be strong in himself as a part of the whole, the noise of the world would not so much as reach his ears. My love to you.<\/p>", "images": []}, {"pdf_page_index": 303, "pdf_page_number": 304, "label": "From Unpublished Letters", "html": "<p>—April, 1895<\/p><h3 class=\"pdf-heading\">From Unpublished Letters<\/h3><p>NOTE.—These fragments were originally published in The English Theosophist, October, 1898; April, 1899; and January-March, I900.—Eds.<\/p><p>There are no authorities in Theosophy except such as every one chooses to accept for himself.<\/p><p>—————<\/p><p>No effort, even the smallest, is ever in vain; and knowing this, each one can “try, ever keep trying.”<\/p><p>—————<\/p><p>It is unwise to consider phenomena or try to understand them, until one has thoroughly grasped the philosophy of nature and man found in Theosophy.<\/p><p>—————<\/p><p>Phenomena are wholly illusionary, and if considered lead away from the reality of life and truth.<\/p><p>—————<\/p><p>The accounts of other incarnations are not useful nor reliable; they will do no good in the end, but may lead to vanity and gloom; and therefore, they are to be avoided. I never knew a case yet where such were followed or relied on that had not bad consequences. And the only Adepts I ever knew refuse to tell of one’s past life: it is a rule of occultism that relations of past lives shall not be indulged in, similar to the rule against relating your progress in the higher life in this life. A study of spiritual philosophy as found in Bhagavad Gita will shed light on all possible events, which are mere motions and unreal apparitions, hiding the truth from our perception.<\/p><p>—————<\/p>", "images": []}, {"pdf_page_index": 304, "pdf_page_number": 305, "label": "From Unpublished Letters", "html": "<p>As to yourself, of course those powers that come naturally are good, and may be used naturally, and the caution I would give (that to you may not be necessary) is that the less people to whom you actually reveal yourself, the better for your progress. and for them, too. The way to do good with those powers is never by the exhibition of them, but by the influence they may silently exert on others, and by the cues, clues, and points they may give to their possessor if rightly used; in that way, they may become of use, but not by talking of them, nor by any show. This is a great point in all true schools of Occultism.<\/p><p>—————<\/p><p>Do not be discouraged; there is no cause; nothing that is done with ease is really very good or lasting; there must be annoyances and strains here and there.<\/p><p>—————<\/p><p>Do not harbour the idea that ______ and others do not attend for “caste reasons” and the like. Better to assume that they have other reasons; better to hope for the best and the best will come; . . . besides, I do not think it is the fact. Gossip gets up these ideas.<\/p><p>—————<\/p><p>The circumstances we are in are the best for us if we will only so regard them. Try to do this, and thus get the best out of them, and escape them in another life.<\/p><p>Try to get people to practise true theosophy and brotherhood.<\/p><p>—————<\/p>", "images": []}, {"pdf_page_index": 305, "pdf_page_number": 306, "label": "From Unpublished Letters", "html": "<p>As to the matter of _______, the best way is to wait with moderation, to do the best possible, to refuse to listen to calumny and see what will happen. . . .We are not always to be reforming others, while at the same time we can refuse to let the others damage the work. . .<\/p><p>Stand firm, avoid controversy, and continue work.<\/p><p>—————<\/p><p>Try to progress in harmony; the other kind of progress will then follow in due course. Be a centre of harmony yourself and others will help you in spreading that feeling throughout.<\/p><p>Let us all draw closer together in mind and heart, soul and act, and try thus to make that true brotherhood through which alone our universal and particular progress can come.<\/p><p>—————<\/p>", "images": []}, {"pdf_page_index": 306, "pdf_page_number": 307, "label": "From Unpublished Letters", "html": "<p>I think you and—— ought to change your attitude of mind in this one point: it seems to me—though I may be wrong, and, if so, excuse me—that in wishing to have harmony you try, either in thought or act, to make harmony. Now, I do not think harmony can be made, but is the result of either action or thought. Consequently, you and—— , being persons who do their duty, should rest on that and let results go. If you do right, and do not think about whether harmony is the result or not, harmony must result if your actions are harmonious. This attitude will prevent nervous troubles, for very often we are nervous about a thing because we are thinking of the results. Now, if you do your best, and harmony does not result, it cannot be your fault; consequently, you should not think about it; the less you think about it, the sooner harmony will come.<\/p><p>—————<\/p><p>The Society seems to be entirely different from all other organizations in this: that in others plenty of money is furnished by members—clubs and churches can raise large sums of money because they offer definite creeds. I suppose that human nature comes in its real colour before us in the Society, where we offer nothing of that kind, but demand real altruistic work.<\/p><p>—————<\/p>", "images": []}, {"pdf_page_index": 307, "pdf_page_number": 308, "label": "From Unpublished Letters", "html": "<p>And now as to the Branch. A rush of members is not good for it unless those in are able to cope with the rush, Hence it is of high importance that the branch should educate and strengthen itself, or it may grow too rapidly, like a child, and get weak, and thus retard itself. If, on the other hand, a large number of its members become each one a centre and a power from having good knowledge of the subject, then you would see the branch go on with undoubted power and force. If you had lecture after lecture, and merely new members and no building up of the old members, your branch would die the moment the supply of lecturing was cut off. Try and impress this on whatever of the members are willing to listen.<\/p>", "images": []}, {"pdf_page_index": 308, "pdf_page_number": 309, "label": "From Unpublished Letters", "html": "<p>I regret to hear that you are not reconciled to your son’s departure from this physical plane. It is hard to part with those we love, but death is only a parting on the lower planes; it is not a “loss” on the higher. But the true union on the inner planes, which always exists though we may be unconscious of it, cannot be consciously felt so long as there is any feeling of “disappointment,” Try to think within yourself what would be the real desire of your son, and what is your own real inner desire, though you may not know it, in regard to your attitude. It would be, and is, on the inner planes, that you should not sorrow or grieve, but “rejoice”— yes, rejoice in the position in which you now are, because there is your great opportunity, because the Law and Nature always provide the greatest opportunity and bestow on us the greatest blessings we are capable of receiving. From the standpoint of the soul it is all we ourselves (the “souls”) would have it.<\/p><p>—————<\/p>", "images": []}, {"pdf_page_index": 309, "pdf_page_number": 310, "label": "From Unpublished Letters", "html": "<p>If you find friction between yourself and another or others, never stop to think where they are wrong. Everybody is always wrong somewhere; and, apart from that, it would be easy enough to find their errors in your own imagination. Their errors, real or imaginary, are no concern of yours, are not your duty, and need not and should not be considered by you. For you to do so would be to make an occult “break.” What concerns you and what is your duty is to discover wherein you have been at fault. If, on finding friction of any sort, you will look back over your past thoughts and words and deeds, you will surely find you have erred, either directly or indirectly, by leaving something undone or unsaid. By living that way you will learn a good deal about yourself, while by looking for and noting the possible faults of others—no matter how greatly they have sinned, in your opinion—you will learn nothing and will merely prove yourself an ass.<\/p>", "images": []}, {"pdf_page_index": 310, "pdf_page_number": 311, "label": "From Unpublished Letters", "html": "<p>Difficulties and friction are the accompaniments of existence, and if everything was smooth and all right all the time we would have nothing to do. Our movement is a reform one, dealing with the very character of the race, and therefore neither we nor the other members of the race are perfect. Did you ever reflect on the question: “What would you do if all our ideals for man were accomplished, if altruism were universal?” We would have to emigrate to some worse planet to have scope for our feelings. Hence we should accept all the difficulties as part of the day’s work, and try to get as many people, including ourselves, arranged for help as we can.<\/p><p>—————<\/p><p>Do not think you do nothing for the Cause which is so dear to you, for indeed the truest work is done on the inner planes, and without this there could be no work done on the outer planes. So, remember that you can work and are doing real work to help the cause by being strong in heart, in trust, and in devotion. In this way, you help to keep the centre of the whole movement strong, and others, who can work on the outer plane, will be helped to do their work because the centre is strong, and they themselves get help from it. This is what you can do and you should think of it often.<\/p>", "images": []}, {"pdf_page_index": 311, "pdf_page_number": 312, "label": "From Unpublished Letters", "html": "<p>We are now to be like the Freemasons, who are one and all, in every part of the world, Freemasons. Yet each Grand Lodge is independent, autonomous. That is the way to look at it. In the U. S. there are about forty independent States; in each a Masonic Grand Lodge for the state, every one autonomous, and yet every member a Freemason and travelling into every Lodge if he follows the rule.<\/p><p>It was quite right that Autonomy was agreed on as the method. There would be very great clumsiness and friction in being part of the American T. S. Each great territory, like an individual, stands on its own feet, while all are united in aim. . . . After everything is arranged it is to be hoped that you may be able to reach many more minds than before. If we keep in mind that what we ought to work for is to bring the truths of Theosophy before the greatest number of persons and not that we seek office or honour, then our best efforts must have good results. I congratulate all, and hope for the very best.<\/p><p>—————<\/p><p>I have your letter, and reply as best I can. In the first place, I am neither wise enough nor good enough to be the guide for any one, but am willing to help all I can to the best of my ability, always premising that we are on quite an equal footing. So much, then, to begin.<\/p>", "images": []}, {"pdf_page_index": 312, "pdf_page_number": 313, "label": "From Unpublished Letters", "html": "<p>I am glad you have such an earnest desire to help in the T. S. cause, and to try and spread truth as you understand it. This attitude, being persisted in, will lead to the right end. It is the only one you need assume, and if you listen to the voice of your own soul, it will guide you aright and better than I could.<\/p><p>You are now in the flush of a new thing. This flush will wear off to some extent, to be succeeded by a deeper knowledge, and hence a greater strength. So, then, all you have to do is to continue doing all you can for others, and at the same time keep up the process of purifying the mind of old notions and of getting the new ideas well fixed, well grounded and well arranged. Then you will be all the better able, each day more and more, to help all with whom you may be thrown.<\/p>", "images": []}, {"pdf_page_index": 313, "pdf_page_number": 314, "label": "From Unpublished Letters", "html": "<p>But I would not advise you to use your strength in curing people of ills, save now and then, for the reason that each one has just so much power, and, if used, it is gone. The Masters have more power than you or I, yet they are not found curing diseases now, but are at work all the time at the souls of men and at their minds. For the deep darkness of the soul and the mind of the race are more important than their outer miseries, as the latter will all soon he ended by death. Thus, we are not justified in using all our strength to help the very few that one person might reach in a lifetime. Use your power that way, and you die having helped in body a few, But use your power for the souls and minds of men and you will have cured many, for many lives to come, even in this present short life.<\/p><p>Later it will be time for you to look into the other and higher flights of Theosophy. At present your test and your trial are in the great enthusiasm you have with but little vent. By standing this, it will do you good; but, using all opportunity for others in your present circumstances, you will take all that nature offers and she will, later on, offer you more and better chances if you are fit—not otherwise.<\/p><p>In regard to the movement, you may be sure that it will be taken care of if the members do their part. H. P. B. laid down the lines of work and if we follow these we may safely leave the results in the hands of the Master and the Law of Karma.<\/p>", "images": []}, {"pdf_page_index": 314, "pdf_page_number": 315, "label": "From Unpublished Letters", "html": "<p>I shall use the story of your little girl’s conversation in the Path without giving any names or places so as not to involve you,[25] It will be useful and interesting for the readers. It is very instructive and more like it would be if people did not repress the children. In the past I published a good many such in the Path.<\/p>", "images": []}, {"pdf_page_index": 315, "pdf_page_number": 316, "label": "From Unpublished Letters", "html": "<p>As to the child. It is true, of course, we are not perfect, but, while we are not so, it is not true that we cannot give the children as nearly perfect teaching as possible; they may be more perfect and make better use of it when we give it to them. Hence I would tell her all of reincarnation, and not make the mistake of letting her explain away a truth, as she did by a mere mechanical and mental reply—like her saying it was a picture in the mind. Why not say, “Why, that is a fact, you lived before and many times, and it is likely you saw with your real memory the picture of another mother who may have been myself when I lived with you.” Then tell her the simple truth of the soul and its unity, and of the great Soul of all and of the actual immortality now and not after, and that eternity is now: and also of Karma. She will understand perhaps better than yourself, for her mind is not filled with nonsense. How much could be avoided for the children if they were not left to the fight we have had, and is it not your duty to save her from such a long struggle to get over bad education? What you find good for your own mature mind should not be kept from your child, and she can understand very well and will not forget.<\/p>", "images": []}, {"pdf_page_index": 316, "pdf_page_number": 317, "label": "From Unpublished Letters", "html": "<p>I should advise you not to talk much to the child of her other lives. Let the fact of those be a tacitly understood thing. Teach her all you like of law and ethics and duty, and what not, but you will do well to avoid now particularizing old events. In time, living in an atmosphere where the real truth of things is taught and believed, her soul will expand and she herself will know when to speak of those former events and when not.<\/p><p>When you feel lonely, remember that on the higher planes we are never alone, but that those who are striving to follow the right path are linked together by bonds of sympathy and true brotherhood, and remember, too, that the greatest work is not done on outer physical planes but on the thought plane. Here is something, then, for you to do:—to think strong helpful thoughts for all the members of the T. S. and for your friends, and then for the whole of humanity. It may be that when a bright helpful thought comes into your own life, it has been sent forth from some other, who is trying to lighten the load of the world’s suffering, and all the loving helpful thoughts that you can send out will help to lighten someone’s sadness, and bring a ray of hope into someone’s life. Each thought is a seed, and will bear fruit in due season.<\/p><p>Around the word Spiritualism in your letter, is the bad influence that is against you. My advice to you is to keep that whole influence off as much as you can, try to work for others, and rely on your Higher Self.<\/p>", "images": []}, {"pdf_page_index": 317, "pdf_page_number": 318, "label": "From Unpublished Letters", "html": "<p>I am glad to hear of your work in F— and trust that you will be able to get together a strong Centre; remember, however, that you yourself can be and are a centre to the extent that you make Theosophy a living power in your life.<\/p><p>Sexual intercourse is a right and proper thing when used for its right object as intended by nature, i. e., the propagation of children. But, if indulged in simply for personal and sensual gratification, it becomes like any other passion, and as regards this you can decide for yourself.<\/p><p>The arguments pro and con on this point will not help you much. Better get them out of your mind, and depend on the leading of the spirit and the voice of conscience.<\/p><p>Endeavour to do that which is right from the standpoint of your inner consciousness, and you will be led in the right way.<\/p><p>Instead of being annoyed, I am glad to get your letter, for it shows you see. It is a twenty years’ experience with me to know what you see and not be able to destroy the mask born with another and now mine. But it has been useful. Did I know how to destroy it perhaps it would be better, perhaps not—it might mean death.<\/p><p>If you look at its hand you would find death shown fifteen years ago and now—yet it lives. Too much effort might kill it now—I do not know. But so many thinking as you do may have effect in time unconsciously, so to say. The whole thing comes from the peculiar fact of a person living in a house he did not build, and having two astrals at work.<\/p>", "images": []}, {"pdf_page_index": 318, "pdf_page_number": 319, "label": "From Unpublished Letters", "html": "<p>No, your friends do not and will not forget you, but remember that the greatest and truest friend is the Higher Self. He who has the Higher Self as his friend possesses all things and lacks nothing, and the Higher Self is your friend if you will but receive that friendship.<\/p><p>Take courage and be patient: the light is shining in your heart, and, if you will but go on, you will find it there, and it will be brighter far than you can now imagine.<\/p><p>It is true that too often when we begin to meditate on some elevating thought, dark thoughts come in, and this is not easy to overcome; but if we remember that the very essence of our being, the inmost sanctuary of the Soul, is divine, we can enter into it and shut out the evil. The tendency of the mind is to wander from subject to subject, and so we should try to follow the advice of the Bhagavad Gita: “To whatsoever object the inconstant mind goeth out, he should subdue it, bring it back and place it upon the Spirit.” “There is no purifier in this world to be compared to spiritual knowledge, and he who is perfected in devotion findeth Spiritual knowledge springing up spontaneously in himself in the progress of time.”<\/p>", "images": []}, {"pdf_page_index": 319, "pdf_page_number": 320, "label": "From Unpublished Letters", "html": "<p>Although so far away, yet through——— I hear something of all that you and your co-workers are doing. It interests me very much, it must be of great effect and value, both now and in later days. As I understand it, your work is with those who are called in England “common people.” In this country we are all common people, and such work strictly is hardly possible here. It is therefore very interesting, because from the better (so-called) classes no great improvement will come. If you can sensibly alter those “common people,” you will have done a great work for the world. The cultured classes do not give us any hope for theosophy—they are too selfish and too superficial.<\/p><p>I feel sure you do not hold that erroneous opinion that theosophy can only be understood by the highly educated. Any man can understand it and make it a part of his life. In fact, I think that its essential truths are easier for the humble than for the polished. For a lot of education and a smattering of different notions in the heads of the better educated make it difficult for them to come to any conclusions in any such matters.<\/p><p>I trust you will go on unfalteringly. Do not be depressed by anything. It is of no use. Besides, it may be avoided if you will avoid setting down, to be achieved, any certain results as to persons, numbers, times or otherwise. We must be satisfied with what the time and Karma give us after we have done our duty and the best.<\/p>", "images": []}, {"pdf_page_index": 320, "pdf_page_number": 321, "label": "From Unpublished Letters", "html": "<p>Let us simplify our teachings, avoiding long and strange words. “Merit” and “Demerit” express part of Karma and are words well known to Catholics. And so on, in all directions, we should try to avoid all pedantry and the making of a new language.<\/p><p>Let us not judge others too much, for they also may be acting up to the best light they have. Besides, Karma ever works, and ever the T. S. must feel it even more than other bodies. The effect of the fuss—for it is but that—must be for the best, for, if it kills the T. S., that proves a deserved death; if not, then T. S. is stronger than ever. The latter is what I see as the final end, how ever far off.<\/p><p>Our duty, these days of trial and transition, is to engage in propaganda, so as to place Theosophy before as many of the race as possible. To do that, the most common-sense, simple presentation of theosophy, free from vagueness and big words, is the best.<\/p>", "images": []}, {"pdf_page_index": 321, "pdf_page_number": 322, "label": "From Unpublished Letters", "html": "<p>The very best I can say to you is that, as you know, all our troubles in life arise from ourselves, no matter how much they may seem to come from the outside; we are all parts of the one great whole, and if you try to centre your mind upon that fact, and to remember that those things that seem to trouble you are really due to your own way of looking at the world and life, you will probably grow more contented in mind. It is your own mind you should watch, and not the circumstances in which you are placed. Others have been in worse circumstances than what you think surround you, and have not been disturbed as you seem to be. It must be, therefore, that it is the way you yourself look at this thing; stop looking at it, then, in that way and look at every thing in a contented spirit, feeling sure that they are all more or less illusionary, and you will do better.<\/p>", "images": []}, {"pdf_page_index": 322, "pdf_page_number": 323, "label": "From Unpublished Letters", "html": "<p>A teacher, and that is your present status no matter how or why, has to have not only a pleasant manner on the outside but must have a purely pleasant and sweet feeling inside; for if the inside does not, in fact, coincide with the outside, then there is trouble. When the outside is pleasant but the inside is false, then it is a hollow shell and all the good magnetism is cut off. When the outside is rough but the inside wishes to be right, there is sincerity; then the magnetism is not cut off, but a current in opposition is often raised which engenders error and misconception and makes a big obstacle, though many friends arise who overlook it.<\/p><p>But it is not to be so left. The inner attitude must be made entirely suave, and the outer will soon be made to correspond. Surety of conviction is not best conveyed by force, but by the great onward quiet movement of the glacier, the best example of this. To the quiet motion of the glacier add the steady fire of the genial Sun, and nothing can resist. This is the way, and, if it is comprehended, there will be more and better work done and more help given.<\/p><p>—————<\/p>", "images": []}, {"pdf_page_index": 323, "pdf_page_number": 324, "label": "From Unpublished Letters", "html": "<p>When one stops to think, to weigh, and to consider what is one’s duty, or which of many duties should be performed first, it is indeed perplexing and difficult to know what to do. But if you will do just what lies before you without thinking about all the other things, and without troubling your mind about all the things you can’t do, then it will all be different and everything will grow brighter for you. Do what you have to do now, and don’t trouble about other things, they will be looked after in due time; but what will help you in all these matters is to be content, to do what you can, and to let the rest go; act with a high motive; have kindly feelings towards all; do some little act of kindness every day and try to realize that the end of all this will be happiness and peace for all humanity. Then, a foretaste of that peace will enter your own heart. There is a bright side to life, and what makes the brightness is the love which each of us may have for humanity.<\/p><p>—————<\/p>", "images": []}, {"pdf_page_index": 324, "pdf_page_number": 325, "label": "From Unpublished Letters", "html": "<p>Generally speaking, the habit of drinking intoxicants is due to a desire to get rid of what might be called the present personal consciousness. When people drink to try and drown sorrow, pain, worry. they clearly do it with that motive in view. But others drink without any such ostensible motive, though still with the same actual motive, for they long to get rid of what is to them an intolerable sense of identity, of monotony, of sameness. It is an effort to produce by extraneous aids what can only be done properly and lastingly by interior development. People read trashy novels, gamble and so forth with the same motive, that is to say, with the intention of getting rid of their personal identity for the time being. Ultimately, the race will come to realize that this can only be achieved by identification of the ego with the higher instead of the lower nature. Meanwhile, and for the ordinary person, healthy and interesting occupation is the best cure for such a habit. If possible, he should be made to understand that the desire for drink is now a habit in certain lives in his body whose very existence depends upon their being fed with alcohol. The desire is not in himself unless he is foolish enough to identify himself with the desire. Once he ceases to so identify himself, the desire will lose more than half its power over him.<\/p><p>FROM “THE IRISH THEOSOPHIST”<\/p><p>Mr. Judge, during a few remarks at the close of the meeting, explained the method of study adopted in America.<\/p>", "images": []}, {"pdf_page_index": 325, "pdf_page_number": 326, "label": "From Unpublished Letters", "html": "<p>Each Branch, he said, formed itself into sections for the purpose of studying a certain subject, such, for instance, as the Bhagavad Gita. When the study was completed the sections compared notes, and produced, subsequently, a general statement of decisions upon which they could all agree. Without such a system as this the movement could not have solidarity. Moreover, it was the system adopted by groups of Chelas under the direct supervision of the Masters.<\/p><p>When he first heard of the Dublin Lodge he felt that it “rang” in his ears. When one heard of some Branches (and he was glad to think that they were few) the sound seemed to fall dully. In this case he felt that it was real. He hoped that it would become a living power in Ireland. He knew of no European race that was more naturally occult, especially the western Irish.<\/p><p>In conclusion, he said that he would counsel the Lodge to aspire to the principles of the Masters.<\/p><p>—February, 1895<\/p><p>Say, my friend, remember that title: The Cause of Sublime Perfection. That is the name of Theosophy. Opposed to the idea of inherent sinfulness, it may work a change. Use the title now and then. So will I. Those three—(a) Perfectibility of Humanity, (b) Cause of Sublime Perfection, (c) Masters are living facts, and not cold abstractions—should be well spread abroad. They pulverize the awful wrong of inherent sin, they raise a hope in every man above a sot, they illuminate the sky of the future. We work for the future—oh, the glorious future!<\/p>", "images": []}, {"pdf_page_index": 326, "pdf_page_number": 327, "label": "From Unpublished Letters", "html": "<p>—February, 1897<\/p><p>FROM “THE PACIFIC THEOSOPHIST”<\/p><p>[Experience proves that Theosophy can be most acceptably presented to the laboring classes. Especially can karma and reincarnation be explained as enforcing Brotherhood. Persons wishing to study and work along these lines are referred to pp. 37-39 of the Key to Theosophy, for practical hints. Also pages 197-249 of the same work, will be found to present many valuable points to use at such meetings. No leading-up policy is required. Plain, straight Theosophy—karma and reincarnation—is what is needed. These, and these alone, meet the wants and solve the problems of laboring men. These are extracts from letters from William Q. Judge, in regard to this matter:]<\/p><p>Strive to get a clear, comprehensive and common-sense view of Theosophy, and to the world give only that view, and the world will appreciate. Never consider yourself as the actor, and think of the real Self.<\/p><p>Never consider that you have done better than another; always strive to improve.<\/p><p>Do not soar to ridiculous heights where no one can follow you, and where you will not be at home yourself.<\/p><p>And karma, reincarnation and the seven-fold constitution of man are the important doctrines, and can be presented in every manner.<\/p><p>Do your best and you will have all the opportunities you can manage, and all the experience you require.<\/p><p>—October, 1895—————<\/p><p>FROM “THE INTERNATIONALIST”<\/p>", "images": []}, {"pdf_page_index": 327, "pdf_page_number": 328, "label": "From Unpublished Letters", "html": "<p>You must find yourself out. And you had better do something concretely practical for some other needy person rather than aim at “ideal thoughts,” soaring in clouds and other useless things. Envy no one. You express envy for——— . They need aid as much as you. Their conditions and capacities are not yours: better find and measure your own. As you say, your brain wavers, then give it a long rest and do simple constant acts of kindness for others. . . . There are all too many members who too hastily aspire to be great writers, orators, leaders. . . . The tortoise and not the hare won the race. The purely practical part of the movement needs workers. There are too many dreamers.<\/p><p>—October, 1897<\/p><p>FROM “THE SCREEN OF TIME”<\/p>", "images": []}, {"pdf_page_index": 328, "pdf_page_number": 329, "label": "From Unpublished Letters", "html": "<p>Once a vision was seen. The seer is known to the writer by letter only, though well known. He was in Paris. Passing up from the Luxembourg Gardens, along narrow streets that seem to be a centre of equal attraction for priests, restaurants and funerals— though hiding perhaps beneath this safe disguise an inner life of different and loftier order—he came out upon the Quai directly opposite the site of the Tuileries. Leaning over the parapet, gazing at the muddy waters of the Seine, his thoughts were in no way enticed by the miles of second-hand bookstalls that extend along the south side of the river. Their volumes in every language and on every subject (a battered Key among the rest!) , rare and curious, cheap and very nasty, no more occupied his mind than the tragedy of the fallen Empire which had played its last stake within two hundred yards of where he stood. Paris, once the temple of Pleasure and still the rendezvous of pleasure-seekers, was all in holiday attire. Laughter was in the air—but what are surroundings to a man whose mind is occupied with thoughts that are worth the thinking? Nothing. Truly it is the mind which makes the surroundings, and Archimedes was neither the first nor the last thinker who has remained faithful to a thought during the sacking of his city.—————<\/p><p>NOTE.—This concluding portion of an article by “Julius” (Path, August, 1895) evidently renders an experience of Mr. Judge’s—Eds.<\/p>", "images": []}, {"pdf_page_index": 329, "pdf_page_number": 330, "label": "From Unpublished Letters", "html": "<p>My friend soon found realistically the truth of this oft-repeated adage. He had been pondering over the history of a life, a friend’s life; studying it, not unkindly, but in relation to universal principles and with fraternal sympathy. He came down along the record of events until he reached the present. Looking out across the river, gazing without sight at what had once been the palace of a tinsel Caesar, there suddenly appeared to him a gray figure, stooping, meditative. Then it waxed clearer and he saw that the head of the figure was bent over some object held in the hand. It seemed that the whole being—the mind, heart and soul of this silent spectre—were riveted on this one object. My friend looked more closely to discover what this was: only a worm, a poor, struggling worm transfixed on a pin, writhing in agony. A feeling of disgust at the cruelty of it came over him, and he turned to reproach the torturer, who had not seen him, who had eyes for nothing but the sufferings of the captive worm, regarding it with interested pity and yet with satisfaction. “Why not take it off—?” my friend began, but as he turned to speak he started back in momentary horror. The figure was that of the person whose life-history he had been pondering, and the worm, as he now saw, bore a similar likeness—the picture of a mind gloating over its own self-inflicted sufferings.<\/p>", "images": []}, {"pdf_page_index": 330, "pdf_page_number": 331, "label": "From Unpublished Letters", "html": "<p>Then all vanished. A company of French infantry passed by him with strident bugling that could be heard for miles, It sounded miles away. The picture still fascinated him. The pity of it! For it was true: This had been the symbol of that life. The Worship of Pain; a sublimated form of selfishness that longed for a martyr’s crown, but which would welcome the martyrdom for its own sake, even without the crown. A selfishness that in its grosser form would be but hypocrisy and conceit. A passion for pain which made it seem that to inflict it on others was to confer a benefit rather than a wrong. How could they grow without pain? See how I have grown through pain! A disease, my brothers, a disease of the mind. “Think not that breaking bone, that rending flesh and muscle, unites thee to thy ‘silent Self’.” And remember that “these vices of the ordinary man pass through a subtle transformation, and reappear with changed aspect in the heart of the disciple.” The St. Dominic of yesterday may well continue to try to purify the souls of others and his own, by the pain he thinks it right to inflict, though now perhaps he uses some mental torture. The St. Simeon Stylites of one life may pass from racking his body for “the greater glory of God,” to racking his mind, and with the same motive. He may now cry as then, though in different form:<\/p><p>O my sons, my sons . . . mortifyYour flesh, like me, with scourges and with thorns;Smite, shrink not, spare not . .<\/p><p>*   *   *   *   *<\/p>", "images": []}, {"pdf_page_index": 331, "pdf_page_number": 332, "label": "From MS. Letters", "html": "<p>O Jesus, if thou wilt not save my soul,Who may be saved? Who is it may be saved?Who may be made a saint, if I fail here?Show me the man hath suffer’d more than I.”<\/p><p>But that is not Theosophy: nor is it Occultism. It is far removed from either. Once more we see that growth does not depend upon the amount of pain or pleasure that is endured, but upon our attitude of mind towards all that may meet us on life’s journey. “It is not what is done, but the spirit in which the least thing is done that is counted.”<\/p><p>Julius<\/p><h3 class=\"pdf-heading\">From MS. Letters<\/h3><p>NOTE.—These letters, all (except the last one) to the same person, are in the archives of the United Lodge of Theosophists.—Eds.<\/p><p>New York, July 25, 1893<\/p><p>Dear Brother:<\/p><p>I have but little time to reply to yours, as my recent trip to London has made a lot of business grow, and the Congress at Chicago of the T S has added more still to the load.<\/p><p>I asked——— to write you about the Sunday School as we have run it here, and he has done so. That might be done at any place by sincere members if they like to try. It is a success here. I hope it will be the same with you.<\/p>", "images": []}, {"pdf_page_index": 332, "pdf_page_number": 333, "label": "From MS. Letters", "html": "<p>As to the other matter, let me tell you what has guided me all my life and may guide you. When an idea of work for the T S comes into my head, I go at it even if I do not see just how, and always the help and the right line comes to me, for I have a supreme faith that the great Lodge will foster all such, even if we do not hear from the Lodge. So if you have the idea of a regular and systematic gathering, go ahead, and your faith and sincerity will carry you through. But make it fully theosophical. This means not sectarian. And that will enable you to give out what you believe to be right, if you always say and let it be constantly known that no man is forced to believe.<\/p><p>Let it be a large TS if you like, with its creed universal brotherhood, and if some might object to being an actual part of the TS, then let the formal branch part of it be for those who are willing— the others getting the benefit by their attendance. There is nothing to prevent one having music at such gatherings if such is the desire. All that is wanted is a clear head and a strong hand at the top, to see that no creed as such is indulged in. It might be a success. I know there are many who want to attend such meetings and who like a little music. But in that case I would either (a) eliminate all references in the hymns to Jesus and the religion of the day, or (b) insert references to every religion and make the one as prominent as the other.<\/p>", "images": []}, {"pdf_page_index": 333, "pdf_page_number": 334, "label": "From MS. Letters", "html": "<p>Maybe this idea of yours is the beginning of a great and new success, for while many ministers really steal and preach our ideas without credit, none are bold enough to say “I am a theosophist and preach it, not compelling you to believe.” If you did so you would compel respect, and at the same time gain perhaps a great hearing. I have wondered some did not do this, but I see that vanity and personality and fear have prevented it. If you did it, it would be the first distinctive effort of the kind, and at the same time it might be carried on in full sympathy with the T S and its administration.<\/p><p>Let me know what you think of all this, and may you have luck and also confidence, hope and a good inspiration.<\/p><p>Sincerely yours,<\/p><p>William Q. Judge<\/p><p>—————<\/p><p>New York, November 8, 1893<\/p><p>Dear Bro. ———<\/p>", "images": []}, {"pdf_page_index": 334, "pdf_page_number": 335, "label": "From MS. Letters", "html": "<p>I wrote you a long letter in August, in reply to yours of the 13th of July enclosing the catechism, and expected, rather, an answer to that from you. As immediately thereafter I was plunged into the work of the Chicago Congress, which is not yet quite done, I have been too busy to take the catechism up again particularly, and, as I said, have been waiting rather to hear from you. I will endeavor soon to get the time to look over it again and send it to you. It is a very difficult matter to do, as the making of a catechism tends in the direction of dogmatism which we ought to avoid. Although I have very definite beliefs of my own, still I hesitate to put them in a dogmatic form for the use of others, such as a catechism would involve. One great difficulty that we have to encounter is that although children are easily taught and quickly understand, the adults who take up theosophy do not themselves understand it because they have so many old notions to get rid of.<\/p><p>Sincerely yours,<\/p><p>William Q. Judge<\/p><p>That catechism was a mistake I know well. [Pencil notation at bottom of letter, by recipient.—Eds.]<\/p><p>New York, May 3, 1894<\/p><p>Dear Brother———,<\/p><p>On return from an 8,000 mile tour I have yours of 23.3.94. Well, so you are out. Perhaps it is a good thing to be well quit of the incubus of a cult you don’t believe. All success to you. Am glad you are encouraged by the start of your new venture.<\/p>", "images": []}, {"pdf_page_index": 335, "pdf_page_number": 336, "label": "From MS. Letters", "html": "<p>The matter of is still pending, and as I am soon off to London to attend that blessed Jud’l Com’te, I cannot do much about him.<\/p><p>What your clairvoyant saw about the Church is true, only it will take over 100 years perhaps. It is now tottering on its rotten creeds.<\/p><p>I thank you for all your news. Write me again. And have patience with me for such short letters, as I am overworked and banked up high with unanswered letters on all sides, together with Path work for 2 advance months—all to be done in 3 weeks.<\/p><p>Goodbye and good luck,<\/p><p>William Q. Judge<\/p><p>—————<\/p><p>[Cincinnati] May 20, 1895<\/p><p>Dear Bro. _____,<\/p><p>I am away from home for my health [which is] much hurt by others’ hate. * * *<\/p><p>Besant has had what ought to be her last say, and I read to the delegates at our Conv’n my explan’n of the charges—my last word. It will soon be published.<\/p><p>I wish we could all ignore Mrs. B once and for all. She lives by fighting or flattery now. But what blasphemy to say that, even be I guilty, the Master would stoop so low as to bid her hound me over the world trying to murder my character. I pity her in her next life. It will not be I who will then annoy her but the hundreds who have been insulted and outraged by her acts and words ag’st me. Instead of one she will then have hundreds of enemies and obstructions.<\/p><p>Well, goodby and best wishes. . .Yours,William Q. Judge<\/p><p>—————<\/p><p>3 Oct 1895<\/p><p>Dear Bro.<\/p>", "images": []}, {"pdf_page_index": 336, "pdf_page_number": 337, "label": "From MS. Letters", "html": "<p>* * * As regards T. S. organization in N. Z. &amp; Australia I cannot express any opinion. You must do what you as a body consider the best thing to be done, and if people won’t work without having office, why, let them have it—it is work we want. But think the matter over carefully and consult together, so that you may do what on the whole you consider best for the Movement.<\/p><p>I hope you will be able to form a strong centre.<\/p><p>Fraternally yours,<\/p><p>William Q. Judge<\/p><p>—————<\/p><p>New York City, November 18, 1895<\/p><p>Dear Brother<\/p><p>I thank you again for your very kind invitation to visit New Zealand and Australia, but I certainly cannot come now for my health would not permit of the journey, nor could I at the present time and in the present state of affairs go so far away from the center of the Work in America. The matter must therefore be held over indefinitely, but I ask you to please express my thanks and good wishes to all who joined with you in inviting me to visit you.<\/p><p>I am glad to hear that “your people” will listen to your Theosophical talks on Sundays—much good seed can be sown in this way. As for the other Branches and Centers in N. Z. they have to be let follow what course they consider right, writes me that here and there are members who are at least not unfriendly. This is good; and steady quiet work on your part will not fail to have its effect. .<\/p>", "images": []}, {"pdf_page_index": 337, "pdf_page_number": 338, "label": "From MS. Letters", "html": "<p>You had not before told me about the notes taken of A. B.’s talks in Auckland. As a general rule it is better to let such matters drop, and turn your energies in other directions. But always use your own judgment, and if in a particular instance, should opportunity offer, you think it well to bring up the matter it would be all right for you to do so. But I believe A B did speak that way of the “old Tibetan woman” as that was constantly said at Avenue Rd. by her and others who all knew nothing of it. Mrs. B has the habit of “forgetting”—we call it a very “bad for gettery.”<\/p><p>Many thanks for the kind wishes.<\/p><p>Fraternally yours,<\/p><p>William Q. Judge<\/p><p>—————<\/p><p>May 26, 1888<\/p><p>Dear ______,<\/p><p>I have your letter. Am glad you like the Bhag. Gita. The reason for these similarities and coincident times is that we all move together. You will notice that the June Bhag. G. article[26] in type and in MS. long ago agrees precisely with Lucifer just at hand in its first article.[27] The latter should be studied by all, especially by those aspiring beings who would pull down the moon without a step ladder while their ordinary duties are ignored.<\/p><p>The last of Idylls[28] is already set up. My great pressure and hurry prevented me sending proof. And here I will say that in any future articles for Path I am obliged to cut out so much poetry. It is wasteful of space and does not suit so many as prose does. Part 2 of yours takes 8 pages and has thus crowded out matter equally valuable.<\/p>", "images": []}, {"pdf_page_index": 338, "pdf_page_number": 339, "label": "London And Paris Letters", "html": "<p>Baxter is back and I am glad. He must have been missed by Malden T. S.<\/p><p>The old obligation has not been altered. It relates solely to signs and passwords. I have sent you some.Fraternally,William Q. Judge<\/p><p>Staying out of Devachan is for those who are really pledged and accepted and not merely for those who aspire. Besides Devachan may be enjoyed while you are yet alive.<\/p><p>J.—————NOTE—The last letter is reproduced, pp. 188-9—Eds<\/p><h3 class=\"pdf-heading\">London And Paris Letters<\/h3><p>[On his way to India, in 1884, Mr. Judge had to spend some weeks in London, waiting for the coming of H. P. B. and Col. Olcott from India. During those days he wrote letters to a “long time friend,” Mrs. Laura Langford (formerly Mrs. Holloway, co-author of Man—Fragments of Forgotten History). For another phase of his London experiences, see “A Weird Tale.”—Eds.]<\/p><p>This is the end of this chapter. This sheet of extracts I enclose to you I took last night from the letters in S.’s possession,[29] Of course, that is not one twentieth part of what he had, but I thought those would be of use to you and the other two disciples.[30] A letter came from H. S. 0. yesterday to S., posted at Marseilles, saying they, H. S. 0., H. P. B., Mohini[31] and one other chela, would be in Paris perhaps one week, and then would be here, except H. P. B., who is furious at treatment of the by the London Branch, and who says she will not, but will stop in Boulogne, in France, or other place, to go on with the new Isis.<\/p>", "images": []}, {"pdf_page_index": 339, "pdf_page_number": 340, "label": "London And Paris Letters", "html": "<p>Today forenoon I have had an awful time, such as I never had. It was at 5 A. M., your time, but 10 here, onward and up to now. Awful. Such an outside pressure on me to go back to the U. S. and to any other fancy you can imagine-—suicide, anything. There is no cause for it in me. Went to bed early last night. Maybe the influence in ______ is bad, or that in my hotel. But whatever it was and is, it began in the street suddenly without preparation, and instead of growing up to strength it rushed upon me just as if you had made the determination to force me out of my path.<\/p><p>Ah, my friend, the path is dark, and now as I write, I am in the valley of the shadow, which is so horrible because I know it is not caused by my wrong doing. My time has been spent in the day in going about to see this place instead of in writing, and in the evening at S.’s except last eve when I was home at 9:15, read the Theosophist till 11 and then to bed. Nor have I had bad thoughts. They have dwelt upon the Masters, upon you, upon the situation.—————<\/p><p>NOTE.—Originally published in The Word, March and April, 1912.—Eds.<\/p>", "images": []}, {"pdf_page_index": 340, "pdf_page_number": 341, "label": "London And Paris Letters", "html": "<p>I shall telegraph Olcott today and then when I get reply—what? Such is the state of my mind. I have lost my steadiness, and after all these years. Dear friend, help me. Of course, when you get this, I may be out of all annoyance, but there is a comfort in addressing you in this letter. You are now either up or awake, as it is 11:30 A. M. here. . . . Goodby, Love to the whole ∆ and may we soon be able to see clearly what the whole affair is to be.<\/p><p>Just before dinner I went up to the Dome of St. Paul’s and into the great bell placed on top from where a grand view might be bad. But the eternal fog prevented, although this is an exceptionally fine day indeed.<\/p><p>The stairway is inside between the two sides of the dome, and the ascent to the bell is difficult. Don’t know how you could do it. It is a cylinder with heavy iron bars on each side and a perpendicular wooden ladder. You brace up against the sides, and ascend the ladder, holding on by the heavy bars—only one at a time can get up, and up there it is open, but not enough to fall through. So I have done nearly all there is. Today I am going with Thomas,[32] a friend, to the Parliament Houses.<\/p><p>My depression must not affect you, as it is quite likely to go away soon.<\/p><p>I must close again. 1st, An engagement. 2nd, The Mail closes. 3rd, There is a snuffling man in this room, whose continuous snuffle drives me mad. Goodbye again.<\/p><p>Your Brother, W.<\/p><p>—————<\/p><p>Grass from St. Paul’s Church yard.<\/p>", "images": []}, {"pdf_page_index": 341, "pdf_page_number": 342, "label": "London And Paris Letters", "html": "<p>Last eve I went to dinner to Miss Arundale’s, . . . West. Keep that address. She is a very charming woman and so in earnest. She lives there with her old mother who, although aged, is as fresh and intense in Theosophical pursuits as a young man. Today I went to S’s. He was very glad to see me, and showed me his treasures. I will copy M. picture for you—a side view—and send it in my next. He has three heads of K. H., a very beautiful man. One is finished very highly, and the next are merely out lines surrounded with blue. But he says all are genuine. He has also some pictures of two or three chelas in Madras, He has another photo of a man lying on his side, with long hair—and such eyes! The face has strangely affected me ever since. This is his position. He is leaning on his left arm with two fingers under his mustache, which is large and black. His nose is very large and straight, and the eyes are enormous and have a similar expression to those in that of your Master. The face is youthful and strangely old. Do you know who it was?<\/p>", "images": []}, {"pdf_page_index": 342, "pdf_page_number": 343, "label": "London And Paris Letters", "html": "<p>The dinner at S.’s was of vegetables, and I stayed there until 11:30 P. M. coming home to hotel on the underground railway. I was therefore at S.’s and I thought much of you—from 3 to 7 P. M. your time. Zeno was there in full force, rushing about the room after dinner, and I was wondering why, when there arrived an Indian mail containing a letter from Olcott from Adyar in S.’s care. Olcott and H. P. B., if she comes, will stop with S. What you saw of her prostration was right. S. says she is very sick, and oh, how tired. There is a late picture of her there, showing her the image of fatigue.<\/p><p>I read them some of Damodar’s letters, and they were very much interested. But, notwithstanding their large opportunities, I do not think they are as advanced as you and, of course, they have not got your powers.<\/p><p>I am rather at sea, not finding anything from India, and until I heard Olcott andH. P. B. were coming so soon, was tempted to go on the next steamer to Madras. I think I will await their arriva
