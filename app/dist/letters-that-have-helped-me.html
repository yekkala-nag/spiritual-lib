He bowed his defenceless head to The Will and The Law, and, passing with sweet and serene heart through the waters of bitterness—consoled by the respect and trust of the community in which his life had been spent, and by the thousands of students who knew and loved him—he exhorted all to forgiveness and renewed effort. He reminded them that there were many [mistakes] committed by the unbrotherliness of his opponents, but they them selves would in time come to see and comprehend the wrong done to the Work by action taken which at the time they did not under stand in all its bearings.[40] He begged the students to be ready to meet that day, and to take the hands which would then be extended by those who had ignorantly shared the wrong done to him, and through him, to all. In this trust he passed behind the veil. On the 21st of March, 1896, he encountered “Eloquent, Just and Mighty Death.”<\/p>", "images": []}, {"pdf_page_index": 401, "pdf_page_number": 402, "label": "William Q. Judge", "html": "<p>So much for the open and material facts of his life. There is much more that must be left unsaid. His claim upon us was that of The Work. The Work was his Ideal. He valued men and women only by their theosophical Work, and the spirit in which that work was done. He held Right Thought to be of the best Work. He worked with anyone who was willing to do Work in the real sense, careless whether such were personal friends, strangers, or active or secret foes. Many a time he was known to be energetically working with those who were attacking him, or planning attack in supposed concealment, and his smile, as this was commented upon, was a thing to be always remembered—that whimsical and quaint smile, followed by some Irish drollery.<\/p><p>[The following section is part of the last installment of Jasper Niemand’s memoir of Mr. Judge, which, though not published until June, 1896, was written before his death, and we have retained the present tense throughout. At the end was appended a note about Mr. Judge’s passing, dated on what would have been his 45th birthday, and giving the message which concludes the biographical sketch. —Eds.]<\/p>", "images": []}, {"pdf_page_index": 402, "pdf_page_number": 403, "label": "William Q. Judge", "html": "<p>The mind of Mr. Judge has a very pronounced duality. It is immensely practical and also profoundly mystical. As a man of business he is successful; it was once said of him by a wealthy merchant that he was a man who could have sold anything he undertook to sell. His practical gift has its most brilliant exposition in his power of organization. He is indeed a master-builder, and to this faculty the T.S. in America owes its strength and its growth. He is far-seeing. prompt, and resourceful in emergency, never deterred by expediency, mere public opinion, nor by any consideration of a personal nature, from carrying out that which he has resolved to do. He fears nothing, except his own conscience. When plans of work are under consideration, he consults all the principal workers and members living in the districts for which the plan is proposed. He collates the opinions of all and is guided by those which are of worth, and thus, like an able general, he never moves far from his base of supplies, but carries his support with him.<\/p>", "images": []}, {"pdf_page_index": 403, "pdf_page_number": 404, "label": "William Q. Judge", "html": "<p>As a mystic, Mr. Judge has another office, simple yet profound, rarely visible on the surface, yet luminous: In the years 1887-88, he wrote, by the order of the Master and to two friends who are now husband and wife, a series of letters since published under the title, Letters that have Helped Me. It would be difficult to trace the lives in which these letters have been as a light to the soul. In them is found that gift which the occultist who has in any degree become must possess in rare perfection—the art of evolving souls.<\/p><p>For thus act the Bearers of the Flame, the Brethren of the burning Heart, from one generation to another. Such are the servants of Krishna. Such are the evolvers of soul. And those who have come into closer contact with the man of whom the Master wrote in 1887 through H. P. B., that “he of all chelas suffers most and ask or even expects the least,”—those who have worked with true devotion and in the true spirit with William Q. Judge, whether near or far in the body—know well the uplifting, widening force which flows through him, ripening the character, developing the higher nature and letting patience have her perfect work,<\/p>", "images": []}, {"pdf_page_index": 404, "pdf_page_number": 405, "label": "William Q. Judge", "html": "<p>Working thus on varied planes, the life of William Q. Judge goes on its quiet way. Its depths lie hidden, but from them wells an irresistible force that stimulates to devotion, to self-denial, to unsparing, unceasing activity for the world. A friend to all men and women, he is yet impersonal always; personal flattery or personal following he meets with impatience, and soon sets the offender upon his own feet. To him, the ideal friend is one who teaches us to stand on our own base, to rely upon the inner self, and this is the part of friendship as he himself plays it.<\/p>", "images": []}, {"pdf_page_index": 405, "pdf_page_number": 406, "label": "William Q. Judge", "html": "<p>A lady, being recently asked if she had not received psychic teachings from Mr. Judge, replied: “I will tell you the kind of psychic teaching he gave me. It was this: Cast no one out of your heart’.” So we find him ever accepting all, as in the One Self, closing no door to anyone; leaving the way always open to all who may wish to return to him or to the work; excluding none who are in that work, whether friend or foe; offering a hand to his adversaries, and ready to offer it again when it is rejected; conquering personal animosity by the sheer force of his character, as he goes steadily on with that work from which it sought to remove him. Seeing in him our most constructive and most indefatigable worker, we can well understand that he is the towering mark against which every force subversive to evolution is being hurled. To obliterate our trust in the “Resuscitator,’’ to dim his reputation and impede his building hand, is to enfeeble the work.<\/p><p>April 13th, 1896<\/p><p>A message in 1893 foreshadowed the storm and lightnings of the judicial charges against W. Q. Judge, the crisis of November 3rd, 1894, and the death of William Q. Judge:<\/p><p>“Take yet more courage. We have not left you comfortless. The Lodge watches ever. A new day will dawn. But there is much darkness yet to traverse and Judge is in danger. You must watch, and stand, and stand and STAND.”<\/p>", "images": []}, {"pdf_page_index": 406, "pdf_page_number": 407, "label": "William Q. Judge", "html": "<p>On Page 50 of the first book of LETTERS is a letter from an Adept, from which a certain portion (“private instruction”) is omitted. That omitted portion runs as follows:<\/p><p>“Is the choice made? Then Y. will do well to see W.Q.J. and to acquaint him with this letter. For the first year or two no better guide can be had, For when the ‘PRESENCE’ is upon him, he knows well that which others only suspect and ‘divine.’ ______ is useful to ‘Path,’ but greater services may be rendered to him, who, of all chelas, suffers most and demands, or even expects, the least.”<\/p><p>If this extract be fitted into the original letter its immense importance in respect to Mr. Judge may be realized by the intuitive student.<\/p><p>J. N.<\/p><p>ABOUT THE “LETTERS”<\/p><p>To the Editor of THE IRISH THEOSOPHIST:<\/p><p>Dear Sir and Brother,—A report having arisen that William Q. Judge did not himself write Letters that have Helped Me, we ask your fraternal assistance in correcting this rumour. It is false. It attributes the letters to the dictation or the teaching of the Master “Hilarion,” who is known to have been in daily (physical) intercourse with Mr. Judge in i888 in New York. The letters began in 1886, and had ended in 1888, so far as those already published are concerned. The letters do, in fact, continue to the present day, and we are not the only persons to receive such, as extracts now appearing in your columns—none of them being from letters to ourselves—amply testify.<\/p>", "images": []}, {"pdf_page_index": 407, "pdf_page_number": 408, "label": "Last Days Of Wm. Q. Judge", "html": "<p>NOTE.—This letter was originally published in the Irish Theosophist, February, 1895.—Eds.<\/p><p>Those of us to whom the Master Hilarion is objectively, as well as psychically known, have the best of reasons for asserting that these letters were not from him, and we do so state now and here. Matter from him, whether “inspired” or objectively dictated, is in quite another style. [The Master spoken of is the author of Light on the Path.—Eds.]<\/p><p>Moreover, on page 50 of the little volume referred to, is a letter printed in italics, beginning, “Says Master.” That letter is one written through H. P. B. by her Master, and is in the modification of her handwriting to which Colonel Olcott refers as being the form in which her Master first wrote through her. The “private directions” omitted from that letter assign to Mr. Judge the office of “guide,” therein assigned to him by the Master, and specify the interior source of his inspiration:<\/p><p>He knows well that which others only suspect or ‘divine’.” We shall be happy to show the original to any Esotericist whom you may indicate.<\/p><p>Your readers may be interested to hear that a second volume of such Letters will probably appear.<\/p><p>With thanks for the courtesy of your columns, we are,<\/p><p>Fraternally yours,<\/p><p>Julia C. Keightley<\/p><p>Archibald Keightley<\/p><p>London, Jan. 13th, 1895<\/p><h3 class=\"pdf-heading\">Last Days Of Wm. Q. Judge<\/h3>", "images": []}, {"pdf_page_index": 408, "pdf_page_number": 409, "label": "Last Days Of Wm. Q. Judge", "html": "<p>MR JUDGE came to the conclusion that climates were of no avail and determined to return to New York, where he would be in the midst of friends and close to the Headquarters of his work. He intended to devote his evenings to writing a book on “Occultism,” and we spent many hours talking over its contents and the general outline of the work. Students will never see that book, and those who knew something of the vast fund of information on occult matters possessed by ‘W. Q. Judge will appreciate their loss and the loss to the cause of Theosophical education.<\/p><p>On February 22d, at about 2:30 P.M., he drove in a closed carriage to the apartment on the third floor of 325 West 6th Street, the last time but one that he was out of doors. Ill as he was, his contempt for the precautions that all orthodox invalids take—in the shape of shawls, rugs and so forth—was characteristic of the man, though alarming to his friends.<\/p>", "images": []}, {"pdf_page_index": 409, "pdf_page_number": 410, "label": "Last Days Of Wm. Q. Judge", "html": "<p>From that day he grew weaker and weaker, with rare spurts of renewed strength, though down to the very last he retained his power of energizing and inspiring others. Some two weeks before his death he was warned by Dr. Rounds, who was attending him daily, that his only chance of living would be destroyed unless he would consent to absolutely give up all work. This he reluctantly agreed to do, but the first effect of such a change in his whole life’s practice was to bring about a reaction that threatened an immediate collapse. After this he read but little, and then only the lightest sort of literature. He would doze whenever he could, as his nights were broken by his cough, and for weeks before he finally passed away he had not been able to get more than three hours continuous sleep at any one time. Hardly able to whisper, so weak that he had to be supported from chair to chair, torn to pieces by his racking cough—that made it impossible for him to lie down—he still held fast to life and did so until the time had come for him to relax his effort and die. And throughout it all he preserved his magnificent power of endurance and self-control.<\/p>", "images": []}, {"pdf_page_index": 410, "pdf_page_number": 411, "label": "Last Days Of Wm. Q. Judge", "html": "<p>On the morning of March 19th, he asked me to make full enquiries in regard to health resorts in the South and to report to him at once. At the same time I was to telegraph Mr. B. A. Neresheimer to call on him. He said that if he could “only get to some place where he could sit in the midst of sunshine and flowers,” he might yet perhaps recover. Mr. Neresheimer called that after noon, and it was after he had said good-bye, and when I was sitting by the side of Mr. Judge’s sofa, that the “Rajah” suddenly roused the body out of the half-sleep in which it had been lying, and with his unmistakable force said: “There should be calmness. Hold fast. Go slow.” I took this at first to apply particularly to the contemplated journey to a warmer climate, and it was not until several days later when his papers had been examined that the full significance of this message appeared. It had meanwhile been applied to all the matters that came up for decision, and it was well that this was done, for hasty action taken during the day or two following his death might, as I now see, have brought lasting disaster on the Society. * * *<\/p>", "images": []}, {"pdf_page_index": 411, "pdf_page_number": 412, "label": "Last Days Of Wm. Q. Judge", "html": "<p>Dr. Rounds afterwards said that the condition of his lungs could not have caused his death; that death had been due to “failure of the heart’s action.” But all the doctors who had examined him had agreed that his heart was as sound as a bell, and from this it is safe to conclude that he died as H.P.B. died, from no immediate physical cause, but because the right time had come.<\/p><p>—B. T. HARGROVEThe Path, May, 1896<\/p><p>[ From E. T. Hargrove’s address on March 23, 1896:]<\/p><p>His last message to us was this: “There should be calmness. Hold fast. Go slow.” And if you take down those words and remember them, you will find that they contain an epitome of his whole life-struggle. He believed in Theosophy and lived it. He believed because he knew that the great Self of which he so often spoke was the eternal Self, was himself. Therefore he was always calm.<\/p><p>He held fast with unwavering tenacity to his purpose and to his ideal.<\/p><p>He went slow, and never allowed himself to act hastily. He made time his own, and he was justice itself on that account, And he had the power to act with the rapidity of lightning when the time for action came.<\/p>", "images": []}, {"pdf_page_index": 412, "pdf_page_number": 413, "label": "“My Only Friend”", "html": "<p>We can now afford to console ourselves because of the life he lived, and should also remember that this man, William Quan Judge, had more devoted friends, I believe, than any other living man—more friends who would literally have died for him at a moment’s notice, would have gone to any part of the world on the strength of a hint from him. And never once did he use that power and influence for his own personal ends—never once did he use that power, great as it was, not only in America, but in Europe, Australasia and elsewhere as well, for anything but the good of the Theosophical movement.<\/p><p>Poor Judge. It was not the charges that stung him, they were too untrue to hurt. It was the fact that those who had once most loudly proclaimed themselves his debtors and his friends were among the first to turn against him. He had the heart of a little child and his tenderness was only equalled by his strength . .<\/p><p>He never cared what people thought of him or his work so long as they would work for brotherhood. . . . His wife has said that she never knew him to tell a lie, and those most closely connected with him theosophically agree that he was the most truthful man they ever knew.<\/p><p>W. Q. Judge, in a letter dated August 5th, 1895, wrote: “What I want to work at is a Napoleonic propaganda which I hoped to, but cannot, assist. . . We have to fill the air with Theosophy and the T.S. in A, . . . We have to pour in force at those points.”<\/p><p>—E. T. HARGROVE<\/p><h3 class=\"pdf-heading\">“My Only Friend”<\/h3>", "images": []}, {"pdf_page_index": 413, "pdf_page_number": 414, "label": "“My Only Friend”", "html": "<p>H. P. BLAVATSKY ON WILLIAM Q. JUDGE<\/p><p>[There is no one—not even H.P.B. herself—concerning whom so great a range of contradictory opinion exists among Theosophists as in regard to William Q. Judge. She was the great Personage who was the target for all the outside enemies of Theosophy, the Theosophical Movement, and the Parent Theosophical Society. “I ask no one to help or defend me. But Judge’s case is different, and more difficult of proof or disproof,” as she herself said, on a momentous occasion—that of the Coues-Collins conspiracy—’ ‘and I now call upon all those who will remain true to their pledges to do their duty when the time comes, and especially by their American brother.” How was Judge’s case “different” from her own? His enemies were all within the Movement, within the Society.<\/p><p>It will, therefore, be of interest and value to all students to place together here some of the statements, public and private, formal and informal, which H.P.Blavatsky made in reference to Mr. Judge. They are all unique—all such as she made in regard to no others—and the circumstances under which and in which they were made but adds to their importance. Readers of The Theosophical Movement may refer to it for the setting of events in which her various utterances were made.—EDS. ]<\/p><p>To WILLIAM Q. JUDGE, General Secretary of the American Section of the Theosophical Society:<\/p><p>MY DEAREST BROTHER AND CO-FOUNDER OF THE THEOSOPHICAL SOCIETY:<\/p>", "images": []}, {"pdf_page_index": 414, "pdf_page_number": 415, "label": "“My Only Friend”", "html": "<p>In addressing to you this letter, which I request you to read to the convention summoned for April 22d, I must first present my hearty congratulations and most cordial good wishes to the assembled Delegates and good Fellows of our Society, and to your self—the heart and soul of that body in America. We were several to call it to life in 1875. Since then you have remained alone to preserve that life through good and evil report. It is to you chiefly, if not entirely, that the Theosophical Society owes its existence in 1888. Let me then thank you for it, for the first, and perhaps for the last time publicly, and from the bottom of my heart, which beats only for the cause you represent so well and serve so faithfully. I ask you also to remember that, on this important occasion, my voice is but the feeble echo of other more sacred voices, and the transmitter of the approval of Those whose presence is alive in more than one true Theosophical heart, and lives, as I know, preeminently in yours.<\/p><p>(From H.P.B.’s first message to the American Theosophists, April, 1888.)<\/p>", "images": []}, {"pdf_page_index": 415, "pdf_page_number": 416, "label": "“My Only Friend”", "html": "<p>In answer to your letter I can only say as follows: If W. Q. Judge, the man who has done most for Theosophy in America, who has worked most unselfishly in your country, and has ever done the biddings of Master, the best he knew how, is left alone• . . then I say—let them go! They are no Theosophists: and if such a thing should happen, and Judge be left to fight his battles alone, then I shall bid all of them an eternal good-bye. I swear on MASTER’s holy name to shake off the dust of my feet from every one of them. . . . I am unable to realize that at the hour of trouble and supreme fight. . . any true Theosophist should hesitate for one moment to back W.Q.J. publicly and lodge in his or her protest. Let them read Masters’ letter in the preliminary. . . . All that I said about W.Q.J. was from HIS words in HIS letter to me.. . . Do with this letter what you like. Show it to anyone you please as my firm determination. . . . .<\/p><p>H.P. B.<\/p><p>He or she, who believes that under any circumstances what ever, provocations, gossips, slander or anything devised by the enemy, H.P.B. will ever dream even of going against W.Q.J.— does not know H.P.B.—even if he or she does know H. P. Blavatsky, or thinks he knows her.<\/p><p>The idea is absurd preposterous.<\/p>", "images": []}, {"pdf_page_index": 416, "pdf_page_number": 417, "label": "“My Only Friend”", "html": "<p>If W.Q.J. gets riled under any provocation—for more than five minutes by the city clock, then he is flap-doodle. H.P.B. would give 7 dozens of Bridges, 77 dozens of Noyses, the whole esoteric brood in the U.S.A. for one W.Q.J. who is part of herself for several eons. Those having ears will hear, those who are deaf &amp; blind, let them provide themselves with false ears &amp; glass eyes, or vanish away.<\/p><p>The Esoteric Section and its life in the U.S.A. depends on W.Q.J. remaining its agent what he is now. The day W.Q.J. resigns, H.P.B. will be virtually dead for the Americans. W.Q.J. is the Antaskarana between the two Manas (es), the American thought &amp; the Indian—or rather the trans-Himalayan EsotericKnowledge. DIXI.<\/p><p>H.P.B.<\/p><p>P.S. W.Q.J. had better show, &amp; impress this on the minds of all those whom it may concern.<\/p><p>H,P.B.<\/p><p>(From a letter of H.P.B.’s in 1889.)<\/p><p>KEEP THE LINK (the Antaskarana) UNBROKEN! DO NOT LET MY LAST INCARNATION BE A FALURE.<\/p><p>(The last words of H,P.B.)<\/p><p>[The following extracts from the letters of H. P. Blavatsky are in several instances prophetic. Addressed to more than one person, the originals are all in the possession of the sender. Some are written as late as 1890, as will be seen by the allusion to Mrs. Besant’s trip to America. Two are evidently to Mr. Judge (so stated), who was prevailed upon to give them to friends on account of their prophetic nature.—Ed., Irish Theosophist.]<\/p>", "images": []}, {"pdf_page_index": 417, "pdf_page_number": 418, "label": "“My Only Friend”", "html": "<p>“If knowing that W. Q. J. is the only man in the E. S. in whom I have confidence enough not to have extracted from him a pledge, he misunderstands me or doubts my affection for him or gratitude, then in addition to other things he must be a flapdoodle.[41] . . . .There is nothing I would not do for him and I will stick to him till death through thick and thin. . . . He says and writes and prints he is my agent (of the Master rather, not mine). Therefore it is easy for him to say that any alterations are as by myself.<\/p><p>And look here, if he does protest . . . against what I say about him in my forthcoming Instructions, then I will curse him on my death-bed. He does not know what I do. He has to be defended whether he will or not. He has much to endure and he is over worked. But so have I, and if he threatens me with such a thing [ resignation] then I had better shut up shop. . . . May our Savior, the mild Jesus, have him in his keeping.”<\/p><p>“He who does all and the best that he can and knows how does ENOUGH for Them. This is a message for Judge. His Path begins to beat The Theosophist out of sight. It is most excellent.<\/p><p>The Path alone is his certificate for him in Theosophy.”<\/p><p>“. . . Oh, my poor crushed chum, what would I give to help him. I try to be with him as much as I can. I am often watching him. . . . He should gather strength from one who is oftener with him than he knows of.”<\/p><p>“Judge . . . whom I trusted more perhaps than I did Olcott— or myself.”<\/p>", "images": []}, {"pdf_page_index": 418, "pdf_page_number": 419, "label": "“My Only Friend”", "html": "<p>NOTE—Published in The Irish Theosophist, June, 1895—Eds<\/p><p>“My Co-Founder, W. Q. Judge, General Secretary in America.”<\/p><p>“Master wants Judge to be elected for life, for reasons of His own—that’s God’s truth. . . . Less than you would I want to see X _______ or anyone (save Judge) elected for life. . . . But if I do not like the idea it is because I trust no one any longer, save Judge, and Olcott perhaps. I have lost my last faith in mankind and see and smell (rightly, if you please) Judases everywhere, But with Judge it is different. . . .“<\/p><p>“My dear W. Q. J. . . . my only friend. * . . Judge has done for me so much lately, I owe him such gratitude, there is nothing I would not do for him. . . . ‘Pon my word, I never knew I cared so much for him personally. . . . I will never forget Judge’s loyalty and devotion, his unswerving friendship. . . .“<\/p><p>“Thanks for all, my dear old chum [W. Q. J.]; may the Masters protect him. His ever and till and AFTER death.”<\/p>", "images": []}, {"pdf_page_index": 419, "pdf_page_number": 420, "label": "“My Only Friend”", "html": "<p>[To ‘W. Q. Judge.] “Well, sir and my only friend, the crisis is nearing. I am ending my S. D. and you are going to replace me, or take my place in America. I know you will have success if you do not lose heart, but do, do remain true to the Masters and their Theosophy and THE NAMES. . . . May They help you and allow us to give you our best blessings. I am offered any amount of money, an income, board, lodging, all free to come to America and work without you, i.e., against. . . . I rather lose the whole American lot to the last man, X included, than You. Perhaps soon now, you will know why. . . . Now be so kind as to write to me plainly (SO that I could read) what you expect me to do and what I must not do. And I give you my word that I shall follow your instructions. Let us understand each other, mutually. But till now no one ever said to me a word about you asking to do this or that. Write to me direct and I will do it. Goodbye, my Irish crocodile, and may Masters protect you.”<\/p>", "images": []}, {"pdf_page_index": 420, "pdf_page_number": 421, "label": "“My Only Friend”", "html": "<p>Affairs and events may be turned off by unseen hands into such a groove that you will be unanimously elected for life— just as Olcott and I were—to go on with the work after our deaths. Do you understand what it means? It means that, unless you consent, you force me to a miserable life and a MISERABLE DEATH, with the idea preying upon my mind that there is an end of Theosophy. That for several years I will not be able to help it on, and steer its course, because I will have to act in a body which will have to be assimilated to the Nirmanakaya, because even in occultism there are such things as a failure and a retardment and a misfit, . . . Nothing that you will do will ever be discountenanced by me, my beloved W. Q. J.”<\/p><p>“If I thought for one moment that Lucifer will ‘rub out’ Path I would never consent to be the editor. But listen, then, my good old friend. Once that the Masters have proclaimed your Path the best, the most theosophical of all theosophical publications, surely it is not to allow it to be rubbed out. . . . One is the fighting, combative Manas; the other (Path) is pure Buddhi. . . . Lucifer will be Theosophy militant and Path the shining light, the Star of Peace. If your intuition does not whisper to you ‘IT Is So’, then that intuition must be wool-gathering. No, sir, the Path is too well, too theosophically edited for me to interfere.”<\/p>", "images": []}, {"pdf_page_index": 421, "pdf_page_number": 422, "label": "“My Only Friend”", "html": "<p>“I trust Judge more than anyone in the world. . . . He has numerous enemies who work against him underhand and openly too, as _______ does. Now I have to hold in check and counterwork their machinations when they write or say to Olcott that Judge is a liar, etc. Now this is a ________ lie. . . . I am thinking of going to U. S. with Annie Besant when the spirit moveth me.”<\/p><p>[To William Q. Judge in 1888.] “Well, my only friend, you ought to know better. Look into my life and try to realize it— in its outer course at least, as the rest is hidden. I am under the curse of ever writing, as the wandering Jew was under that of being ever on the move, never stopping one moment to rest. Three ordinary healthy persons could hardly do what I have to do. I live an artificial life; I am an automaton running full steam until the power of generating steam stops, and then—good-bye! .<\/p><p>“The night before last, however, I was shown a bird’s eye view of the present state of Theosophy and its Societies. I saw a few earnest, reliable Theosophists in a death-struggle with the world in general and with other—nominal but ambitious—Theosophists. The former are greater in number than you may think, and they prevailed, as you in America will prevail if you only remain staunch to the Master’s programme and true to yourselves.<\/p>", "images": []}, {"pdf_page_index": 422, "pdf_page_number": 423, "label": "“My Only Friend”", "html": "<p>And last night I saw .. and now I feel strong—such as I am in my body—and ready to fight for Theosophy and the few true ones to my last breath. The defending forces have to be judiciously—so scanty they are——distributed over the globe, wherever Theosophy is struggling against the powers of darkness.<\/p><p>“Is Judge ready to help me to carry on the sacrifice—that of accepting and carrying on the burden of life, which is heavy? My choice is made and I will not go back on it. I remain in England in the midst of the howling wolves. Here I am needed and nearer to America; there in Adyar there are dark plots going on against me and poor Olcott.”<\/p><p>[ W. Q. Judge.] “Take my place in America now and, after I am gone, at Adyar. If you have no more personal ambition than I have—and I know you have not, only combativeness—then this will be no more sacrifice for you than it was for me to have Olcott as my President. . . . I am yours truly in the work for ever. Dispose of me. I will . . . help you with all my powers.<\/p><p>“Well, I have raised a ‘Frankenstein’ [the T. S.], and he seeks to devour me. You alone can save the fiend and make of him a man. Breathe into him a soul if not the spirit. Be his Savior in the U. S. and may the blessings of my SUPERIORS and yours descend on you. Yours—the ‘old woman’, but one ready to offer you her inner life if you begin and proceed with the work. .<\/p>", "images": []}, {"pdf_page_index": 423, "pdf_page_number": 424, "label": "“My Only Friend”", "html": "<p>But as the ranks thin around us, and one by one our best intellectual forces depart, to turn bitter enemies, I say—Blessed are the pure- hearted who have only intuition, for intuition is better than intellect. .<\/p><p>Yours ever, H. P. B.”<\/p><p>HISTORY REPEATED<\/p><p>(The following letter of H. P. Blavatsky [evidently a letter to “Julius”—see Path IX, 255], dated Ostende, March 19th, 1887, seems so applicable to the present hour that we have permission to repeat it thus in print.—Ed., Irish Theosophist, February, 1895.)<\/p><p>Dear ——,<\/p><p>Having heard from my dear old W. Q. Judge how kindly disposed you are toward me, and having received from him several messages on your behalf, let me tell you how grateful I feel for your kind expressions of sympathy.<\/p><p>Yes, the work has brought upon me contumely, ignominy of all kinds, hatred, malice and slander. ‘Were it only from the outsiders I would mind very little. But, sad to say, it is the “Theosophists” chiefly who tear me to pieces. Our mystic birds are so wise as to soil their own nest instead of leaving it and choosing another. True, “there are many mansions” in our Father’s house, but for the world we are one. And it does seem hard that I should have created a “Frankenstein” only to turn round and try to rend me in pieces!<\/p><p>“Well, so be it, for it is my Karma. “Barkis is willing” even to become the manure for the theosophical fields, provided it does bring crops some day. Unfortunately, the “birds” peck out even the manure, and thus we had but weeds so far.<\/p>", "images": []}, {"pdf_page_index": 424, "pdf_page_number": 425, "label": "Words Of Students And Friends", "html": "<p>*     *     *     *     *<\/p><p>Dear and far distant friend, that is private and strictly confidential. I open my poor old aching heart before you. If Judge has such a great esteem for you, you must be worth all that he thinks.<\/p><p>Have patience; The Secret Doctrine will teach you more definite things than Isis now ever could. The latter was only an “essay balloon.” I hope you will be satisfied with the last and final work of my life.<\/p><p>Yours sincerely and truly gratefully,<\/p><p>H. P. BLAVATSKY<\/p><p>NOTE.—The expression “Barkis is willing,” H. P. B. said once was a mantram unconsciously made by Dickens. She used it upon occasion to certain persons on meeting (or writing) them for the first time. Spoken, it had such peculiar force as to alarm one who thus heard it from her lips and as she used it.—ED., Irish Theosophist.<\/p><h3 class=\"pdf-heading\">Words Of Students And Friends<\/h3>", "images": []}, {"pdf_page_index": 425, "pdf_page_number": 426, "label": "Words Of Students And Friends", "html": "<p>I FIRST met William Q. Judge in the winter of 1885. He was at that time a devoted student of the Bhagavad Gita. It was his constant companion, and his favorite book ever after. His life and work were shaped by its precepts. That “equal-mindedness” and “skill in the performance of actions” inculcated in this “Book of Devotion,” and declared to constitute “Yoga,” or union with the Supreme Spirit, Mr. Judge possessed in greater measure than any one I have ever known. His devotion never wavered; his anchorage seemed ever sure and steadfast, and herein lay his strength. His skill in the performance of actions was marvellous, his executive ability of the highest order. He was never disturbed by passion or blinded by resentment, and when openly and strongly assailed, he held steadily on his course, working for the one object of his life, the success of the T. S.<\/p>", "images": []}, {"pdf_page_index": 426, "pdf_page_number": 427, "label": "Words Of Students And Friends", "html": "<p>And so he worked on to the end, friends rallying around him and aiding him in his work. People on the other side of the ocean never understood Mr. Judge’s position in America, where he was well known in connection with his work, nor how impossible it would be to shake confidence in him. It is true the issues raised were seemingly altogether personal, and it took some time to make clear to the whole Society their real nature. When, however, these issues became clear and people had time to consider them, the verdict was overwhelming, and those who were present at Boston last April [1889] will never forget the scene there enacted [ the T. S. in A. was formed]. It has been my lot to preside over many conventions, both medical and Theosophical, but I never witnessed such a scene before and never expect to again. There was no noisy demonstration, but the very air throbbed with sympathy and appreciation.<\/p>", "images": []}, {"pdf_page_index": 427, "pdf_page_number": 428, "label": "Words Of Students And Friends", "html": "<p>He was never narrow, never selfish, never conceited. He would drop his own plan in a moment if a better were suggested, and was delighted if some one would carry on the work he had devised, and immediately inaugurate other lines of work. To get on with the work and forward the movement seemed to be his only aim in life. . . . For myself, knowing Mr. Judge as I did, and associating with him day after day—at home, in the rush of work, in long days of travel over desert-wastes or over the trackless ocean, having travelled with him a distance equal to twice around the globe—there is not the slightest doubt of his connection with and service of the Great Lodge. He did the Master’s work to the best of his ability, and thus carried out the injunction of H. P. B. to “keep the link unbroken.”<\/p><p>J. D. BUCK<\/p><p>For the last four years, nearly, most of our communication has been personal, much of this period having been spent under the same roof. I have had good opportunity to study the character of the man and I do not hesitate to place my estimate of him on record.<\/p><p>There is not one act in the life of William Q. Judge that has come under my observation, that savors of selfishness or of a desire to further any personal end.<\/p>", "images": []}, {"pdf_page_index": 428, "pdf_page_number": 429, "label": "Words Of Students And Friends", "html": "<p>Perhaps I am not qualified to pass on the merits as an occultist of the man whose memory I hold in such grateful esteem; but I can, at least, speak of what has passed before my eyes in the ordinary affairs of life, and in these affairs I have invariably found him to be the soul of unselfishness, honor, generosity, and all the other virtues that men hold so dear in other men. The severity which some saw in him was on the outside, only. He was not always patient with folly and faintheartedness, yet even these drew from him pity rather than condemnation, and nothing except deliberate cowardice persisted in, and treachery to the Cause itself, seemed to place the offender outside the pale of his present sympathy and attention.<\/p>", "images": []}, {"pdf_page_index": 429, "pdf_page_number": 430, "label": "Words Of Students And Friends", "html": "<p>He was singularly free from the vice of constantly seeking to explain and justify his actions. He believed in doing the present good act, in carrying out the present good intention, leaving the result where it belonged. Even when something occurred which, apparently, called for particular explanation and justification, he usually neither explained nor justified. The most striking example of this, of which I have any knowledge, grew out of a letter that I received from him in 1887, in which letter was folded another on different paper and written, in blue, in the hand made so familiar by reason of the frequent “exposures” of “so-called Mahatmic messages.” The enclosure was directly in explanation of a matter that was no more than hinted at in Judge’s own letter, and when I wrote, making a jocular allusion to his effort at precipitating a letter for my benefit, he answered, in a direct, straightforward way, that he had done nothing of the kind and would not; but, contrary to his usual custom, he gave a theory of how such things might be accomplished. Some years afterwards we met in St. Louis and I showed him the letter and the enclosure. After turning the papers over for a moment, he looked me straight in the face and said, in the simplest manner, “I can’t explain it. It’s a dead give-away.” And there the matter rested. But for my certain belief in his integrity I might have doubted him then, might have given some heed to the cry of “fraud” later, Years after the occurrence I found out, independently of Judge, the truth about the matter, and my faith in his sincerity was abundantly justified.<\/p>", "images": []}, {"pdf_page_index": 430, "pdf_page_number": 431, "label": "Words Of Students And Friends", "html": "<p>Among all my friends and acquaintances, William Q. Judge was least wasteful of time. He seemed never to rest, for work was his rest. And yet he was not, in any sense, an unsociable man.<\/p><p>During the last few years, he seemed to become more and more absorbed in his work, and yet, much as he was struggling through, and it was enough to appall the ordinary hardworking man, he never hesitated to take on some other burden if it appeared to promise well for the movement in which he was so thoroughly wrapped up. Notwithstanding the busy life that he led, he was one of the most accessible men that I ever knew, and one of the few who was always ready to accept a suggestion. He did not know everything, and was aware of the fact, but he did know how to utilize the material that he found ready to his hand.<\/p><p>Though he was always the same kindly friend to me, never in all these years writing or speaking a harsh word to me, I am aware that in his intercourse with the many people whom he met “the Irish boy” sometimes came between himself and others. To those who were aware of the real inner life of the man this is enough explanation for the apparent contradictions and failings on the everyday plane of life that he shared in common with the rest of mankind. That he ever deliberately wounded or deceived anyone is unthinkable to me.<\/p><p>ELLIOTT B. PAGE<\/p>", "images": []}, {"pdf_page_index": 431, "pdf_page_number": 432, "label": "Words Of Students And Friends", "html": "<p>In the summer of 1894 we were privileged to have him stay at our house for several weeks, and since then he spent at least one evening a week with us until his illness forced him to leave New York. . . . Day after day he would come back from the office utterly exhausted in mind and body, and night after night he would lie awake fighting the arrows of suspicion and doubt that would come at him from all over the world. He said they were like shafts of fire piercing him; and in the morning he would come downstairs wan and pale and unrested, and one step nearer the limit of his strength; but still with the same gentle and forgiving spirit. Truly they knew not what they did.<\/p><p>Perhaps the most striking evidence of his greatness was the wisdom with which he treated different people and the infinite knowledge of character shown by him in his guidance of his pupils. I do not believe he was the same to any two people. . . . His most lovable trait was his exquisite sympathy and gentleness. It has been said of him that no one ever touched a sore spot with such infinite tenderness, and I know many that would rather have been scolded and corrected by Mr. Judge than praised by anyone else.<\/p>", "images": []}, {"pdf_page_index": 432, "pdf_page_number": 433, "label": "Words Of Students And Friends", "html": "<p>It was the good fortune of a few of us to know something of the real Ego who used the body known as Wm. Q. Judge. He once spent some hours describing to my wife and me the experience the Ego had in assuming control of the instrument it was to use for so many years. The process was not a quick nor an easy one and, indeed, was never absolutely perfected, for to Mr. Judge’s dying day, the physical tendencies and heredity of the body he used would crop up and interfere with the full expression of the inner man’s thoughts and feelings. An occasional abruptness and coldness of manner was attributable to this lack of co-ordination. Of course Mr. Judge was perfectly aware of this and it would trouble him for fear his friends would be deceived as to his real feelings. He was always in absolute control of his thoughts and actions, but his body would sometimes slightly modify their expression. * * *<\/p><p>Mr. Judge told me in December, 1894, that the Judge body was due by its Karma to die in the next year and that it would have to be tided over this period by extraordinary means. He then expected this process to be entirely successful, and that he would be able to use that body for many years, but he did not count upon the assaults from without, nor the strain and exhaustion due to the<\/p>", "images": []}, {"pdf_page_index": 433, "pdf_page_number": 434, "label": "Words Of Students And Friends", "html": "<p>“Row.” This, and the body’s heredity, proved too much for even his will and power. Two months before his death he knew he was to die, but even then the indomitable will was hard to conquer and the poor exhausted, pain-racked body was dragged through a miserable two months in one final and supreme effort to stay with his friends. And when he did decide to go, those who loved him most were the most willing for the parting. I thank the Gods that I was privileged to know him. It was a benediction to call him friend.<\/p><p>G. HIJO<\/p>", "images": []}, {"pdf_page_index": 434, "pdf_page_number": 435, "label": "Words Of Students And Friends", "html": "<p>My acquaintance with William Q. Judge antedated considerably my interest in Theosophy. We were introduced by a newspaper man who spoke of him to me as a thoroughly honest good fellow but a crank about some incomprehensible Oriental philosophy, a knowledge of which would not be, to any practical mind, compensative for the difficulty of understanding it. If my memory serves me rightly, we met first upon an occasion when H. P. Blavatsky was induced to try, in presence of some reporters, if she could open up communication with the diaphanous remainder of a night watchman who had been drowned in an East River dock. Olcott was present, in command, prominent and authoritative; and Judge, in attendance, reserved and quiet. The spook was shy and the reporters were sarcastic. The only one apparently annoyed by their humor was the Colonel. Mr. Judge’s placidity and good nature commended him to the liking of the reporters and made a particularly favorable impression upon me, which was deepened by the experiences of an acquaintance that continued while he lived.<\/p>", "images": []}, {"pdf_page_index": 435, "pdf_page_number": 436, "label": "Words Of Students And Friends", "html": "<p>In all that time, though I have seen him upon a good many occasions when he would have had excellent excuse for wrath, his demeanor was uniformly the same—kindly, considerate and self- restrained, not merely in such measure of polite self-control as might be expected of a gentleman, but as if inspired by much higher regards than mere respect for the covenances of good society. He always seemed to look for mitigating circumstances in even the pure cussedness of others, seeking to credit them with, at least, honesty of purpose and good intentions, however treacherous and malicious their acts toward him might have been. He did not appear willing to believe that people did evil through preference for it, but only because they were ignorant of the good, and its superior advantages; consequently he was very tolerant.<\/p>", "images": []}, {"pdf_page_index": 436, "pdf_page_number": 437, "label": "Words Of Students And Friends", "html": "<p>But that meekness of spirit—a strange thing, by the way, in a brainy and rather nervous Irishman—by no means made of him a weak, or yielding character who could be bluffed into doing what his judgment did not approve, or turned aside by influence from any course of action upon which he had deliberately resolved. And careful deliberation upon things was one of his strongest characteristics. His mind was very active, quick and resourceful in suggestion, but I do not recall having ever known of his trusting its impulses until he had thoroughly weighed and considered them. Not infrequently, matters that seemed to me of trivial importance, things that might as well be settled right off, and about which there did not appear to be room for two opinions, he would take under advisement over night, or even longer. And candor compels me to admit that such things, as a rule, turned out to be much more important, and with chains of effects more serious, than had at first seemed possible, fully justifying his caution.<\/p><p>Now, and for a good while past, I have had no doubt of his receiving aid in his deliberations, and guidance toward correct conclusions, from intelligences with prescience beyond that of ordinary men, but when I first noted his habit of deliberation I regarded it simply as a proneness to “chew over” things—prudent but rather un-Irish.<\/p>", "images": []}, {"pdf_page_index": 437, "pdf_page_number": 438, "label": "Words Of Students And Friends", "html": "<p>Many journalists work very hard, but I have never known any one, even in that toilsome field of labor, so indefatigable and persistent as William Q. Judge. No matter how much those about him might endeavor, by their assistance, to lighten his burden, the effort was hopeless, for a moment’s leisure, when he should have been resting, only gave him opportunity to think of something else to do.<\/p><p>J. H. CONNELLY<\/p><p>His life was an example of the possibility of presenting new ideas with emphasis, persistence, and effect; without becoming eccentric or one-sided, without losing touch with our fellows; in short, without becoming a “crank.”<\/p><p>Those who have heard him speak, know the singular directness with which his mind went to the marrow of a subject, the simplicity of his words, the unaffected selflessness that radiated from the man. The quality of “common sense” was Mr. Judge’s preeminent characteristic. He had the gift of words, but also the far greater gift of a sense of proportion, of a co-ordinating faculty which reduced those words to their proper place, as mere tools or agents, attracting no attention to themselves. His sentences were short and plain; his manner cool and quiet; but what he said was remembered, for his words appealed to the sense of truth; they seemed to “soak in,” like the showers which the farmers prize, while a “torrent of eloquence” would have run off, leaving dry ground.<\/p>", "images": []}, {"pdf_page_index": 438, "pdf_page_number": 439, "label": "Words Of Students And Friends", "html": "<p>Whether true or not, it might well be that Wm. Q. Judge was, as has been said, one of the signers of the Declaration of Independence. His qualities were those which characterized the leaders of that period. There was energy on the one hand, and intellect on the other; but there was also a dominating and tenacious common sense, which was not a dull conservatism, but a balancing quality which converted intellect into clear judgment, and blind expansive energy into cool steady work.<\/p><p>For the lack of this, we find that the intellectual element of the French Revolution furnished only a chaos of visionary schemes, while its emotional and animal energies were expended in destructive heat, fury, and froth.<\/p><p>W. MAIN<\/p><p>Mr. Judge joined another office to that of evolver. He was a conserver. When one came to work under him, one was at first surprised, perhaps annoyed even, at his insistence in small things. It was, keep your desk thus; or, dip your pen thus; or, make your entries and copy your letters in this fashion, and not in your own way. Presently one found that the sum total of attention in these details was greater celerity with less waste of energy, or greater mental freedom often obtained by greater ease of bodily action. All he did had a meaning when you came to put it together.<\/p>", "images": []}, {"pdf_page_index": 439, "pdf_page_number": 440, "label": "Words Of Students And Friends", "html": "<p>In thinking of this helper and teacher of ours, I find myself thinking almost wholly of the future. He was one who never looked back; he looked forward always. While the activities of the body and the mind were engaged each moment in the duty of that moment, yet his heart was set upon the promise of the future, and the song of his soul echoed the music of cycles yet to come. We think of him not as of a man departed from our midst, but as a soul set free to work its mighty mission, rejoicing in that freedom and resplendent with compassion and power. His was a nature that knew no trammels, but acknowledged the divine laws in all things. He was, as he himself said, “rich in hope.” He wrote recently that we should now turn our attention to work in the United States in order to have there “a world compelling and sky defying place for Theosophy.”<\/p><p>That future as he saw and sees it is majestic in its harmonious proportions. It presaged the liberation of the race. It struck the shackles from the self-imprisoned and bade the souls of men be free. It evokes now, to-day, the powers of the inner man.<\/p>", "images": []}, {"pdf_page_index": 440, "pdf_page_number": 441, "label": "Words Of Students And Friends", "html": "<p>Death, the magician, opened a door to show us these things. If we are faithful, that door will never close. If we are faithful—only that proviso. Close up the ranks, and let Fidelity be the agent of heavenly powers. To see America, the cradle of the new race, fit herself to help and uplift that race and to prepare here a haven and a home for Egos yet to appear . . . for this he worked; for this will work those who come after him. And he works with them.<\/p><p>JULIA W. L. KEIGHTLEY<\/p><p>A friend of old time and of the future—as such does William Q. Judge appear to me, as doubtless he does to many others in this and other lands.<\/p><p>The first Theosophical treatise that I read was his Epitome of Theosophy; my first meeting with him changed the whole current of my life. I trusted him then, as I trust him now, and all those whom he trusted; to me it seems that “trust” is the bond that binds, that makes the strength of the Movement, for it is of the heart. And this trust he called forth was not allowed to remain a blind trust, for as time went on, as the energy, steadfastness and devotion of the student became more marked, the “real W. Q. J.” was more and more revealed, until the power that radiated through him became in each an ever-present help in the work. As such it remains to-day, a living centre in each heart that trusted him, a focus for the Rays of the coming “great messenger.”<\/p>", "images": []}, {"pdf_page_index": 441, "pdf_page_number": 442, "label": "Words Of Students And Friends", "html": "<p>Having been engaged in active T. S. work in Boston for over seven years, it has been my Karma to be brought in touch with him under many different circumstances, the various crises, local and general, through which the Society has safely passed. In all these, his was the voice that encouraged or admonished, his the hand that guided matters to a harmonious issue. Of his extraordinary power of organization, his marvellous insight into the character and capacity of individuals, his ability of turning seeming evils into powers for good, I have had many proofs.<\/p><p>That he was a “great occultist” many know by individual experience, but none have fathomed the depths of his power and knowledge. The future will reveal much in regard to him that is now hidden, will show the real scope of his life-work. We know that to us that life-work has been an inestimable boon, and that through us it must be bestowed on others. The lines have been laid down for us by H. P. B., W. Q. J., and Masters, and we can take again our watchword, that which he gave us at the passing of H. P. B., “Work, watch an wait.” We will not have long to wait.<\/p>", "images": []}, {"pdf_page_index": 442, "pdf_page_number": 443, "label": "Words Of Students And Friends", "html": "<p>Speaking of Mr. Judge as anybody might have known him— as a human being like ourselves—he was humble, unassuming, modest, strong, patient, meek, courageous, an organizer beyond comparison, with powers similar to those possessed by H. P. B., and never using them in any way but to smooth the path for those who desired to follow the road to knowledge. He was kind and patient, as we do not often find with tremendous forcefulness; he had extraordinary powers of organization, with a perception that could look into the very motives and minds of others, could see traitors around him, could read the hearts of those desirous of injuring him, and yet in all his intercourse with them, paving the way for them, remaining ever kind. For the one who most injured him, he had only this to say when friends about him spoke their denunciations: “Never mind what others do. Put no one out of your heart. Go on with the work you see. Work will tell in time, and all these follies of others—follies of ignorance—will fall to nothing. Then, when the time comes, we will all have gained strength; when those who have fallen away for a while come back, there we will be with open arms, as strong brothers, to help them find the path and smooth out the effects of errors that they have created through ignorance.”<\/p><p>ROBERT CROSBIE<\/p>", "images": []}, {"pdf_page_index": 443, "pdf_page_number": 444, "label": "Words Of Students And Friends", "html": "<p>Wm. Q. Judge was an Adept—a great one, however much the true man was hidden behind the one of clay. Is it reasonable to suppose that at a time when the Great Lodge had for foes the intellectual giants—the Spencers, Mills, Huxleys, and Darwins—of an era the very apotheosis of materialistic agnosticism, they sent tyros or babes to do battle for the world? Nay; they sent their best and bravest; were there no other proof of this, the work accomplished would be sufficient. Right royally did H. P. B. march down to Armageddon; confounding the learned by her wisdom, mocking materialism by her wonderful exhibition of abnormal and at first sight supernatural powers. But she was the Knight errant, who fought amid the beating of drums, and the clash and clamor, the excitement and glory, of a princely tournament. None the less royally did Wm. Q. Judge do his knightly duty on his silent, unnoticed field of battle. His place, his task, it was to teach ethics; to turn aside the craze for phenomena and wonder-working into the more healthy, lasting channels of love for our fellow men.<\/p><p>H. P. B. laid the foundations well; but it was left for Wm. Q. Judge to build strongly and safely thereon.<\/p>", "images": []}, {"pdf_page_index": 444, "pdf_page_number": 445, "label": "Words Of Students And Friends", "html": "<p>Yet while we reverence the Adept, let us not therefore lose sight of the man, for even in his simplest life he was great. Those who have seen him lay aside every care, and for the moment become the mirth-loving gleeful companion, will not need to be reminded of this beautiful side of his character. To the children and the humble and lowly in the Society, he was a revelation. They heard of him with awe, they approached him with fear and trembling, they instantly recognized their own, and became his sworn friends forever. This was wonderful—how wholly the very humblest in our ranks, who came into his presence personally, loved and trusted him.<\/p><p>JEROME A. ANDERSON<\/p><p>My acquaintance with him dates from 1888;he was the only man I ever met with whom I felt safe in all directions. The depth of his nature as it appeared to me was fathomless. His character was balanced, for he had an all-absorbing ideal; his thoughts and doings emanated from the soul and not from superficial motives. He was careless of the impressions that he might produce by any thing he said or did, the personal element being mostly absent, and he was sincere always, unless it was at times when he would permit the surface man to prevail, and submitted to the frolics and idiosyncrasies of his more human nature; but even then there was mastery supreme.<\/p>", "images": []}, {"pdf_page_index": 445, "pdf_page_number": 446, "label": "Words Of Students And Friends", "html": "<p>He had the faculty of observing and synthesizing circumstances, persons and events; in fact here I often detected what people some times call occult knowledge. He was an occultist; he had the power of self-control, and could subdue the turbulent wanderings of the mind, sit still in the midst of his own nature, supported by his ideal, and view any and every situation dispassionately. What wonder that he saw clearly! In matters Theosophical all his mind and soul was aglow and alive with deepest interest; whatever question or problem arose he would view it starting with his basic ideal of the spiritual unity of all things, the Self; sublime harmony was contained in its comprehension, and a mode of adjustment for everything found in its source.<\/p><p>This philosophy he claimed is brought to view in the book of books, the Bhagavad Gita, and he used to say that the Gita and Secret Doctrine were quite enough for him to attempt to understand and to follow in this life.<\/p>", "images": []}, {"pdf_page_index": 446, "pdf_page_number": 447, "label": "Words Of Students And Friends", "html": "<p>He never tired of making things plain and simple. . . . He was called by some “The Rajah.” I wrote him once at the end of a period of prolonged anxiety, worry and trouble in my affairs, asking what was the lesson to be learned from it, as I could not make the application myself. His reply was: “The lesson is not different from anything in life. It is just Karma, and being applied to large circumstances seems larger, but is in reality no more than the small ones of others. Calmness is the best lesson to learn, with an indifference to results. If all comes right it is well, and if you have been calm and detached then it is better, for you shall have made no new Karma of attachment by it. Calmness also preserves health in all affairs more than anything else, and leaves the mind free to act well.”<\/p><p>From him I learned to disentangle principle from condition. He viewed all questions from the standpoint of the principle or essence that each contained in itself, without reference to personality, and his quick perception of every situation, together with the application of his ideal principles, enabled him to judge correctly at all times.<\/p>", "images": []}, {"pdf_page_index": 447, "pdf_page_number": 448, "label": "Words Of Students And Friends", "html": "<p>Whenever his advice was followed on the lines of his own example in any matter in or outside of the Society’s work, it would invariably simplify the most complicated situation; in other words, the standpoint of truth and the establishment of harmony was ever the attitude which he held towards everything he touched. He was non-argumentative, because he thought by argument no one could be finally convinced—”each has to hew out his own conviction”—nevertheless he was easily approachable, gentle, sympathetic, but above all strong and powerful, whenever and wherever it was necessary to put in a word at the right time, or to act on the spot.<\/p><p>B. AUGUST NERESHEIMER<\/p><p>To the mystical element in the personality of Mr. Judge, was united the shrewdness of the practised lawyer, the organizing faculty of a great leader, and that admirable common sense, which is so uncommon a thing with enthusiasts. . . . In his teaching was embodied most emphatically that received by the prophet Ezekiel when the Voice said to him: “Stand upon thy feet, and I will speak to thee.”<\/p>", "images": []}, {"pdf_page_index": 448, "pdf_page_number": 449, "label": "Words Of Students And Friends", "html": "<p>It was the upright and self-dependent attitude that the Chief insisted upon, and he emphatically discouraged anything that savored of weakness, of want of self-reliance, or of what H. P. B. was so fond of calling “flap-doodle and gush,” and he turned a face of stern resistance to those who expected to reach the heights he had climbed by clinging to his garments. But when one came to him who really needed aid, no one could be more ready to stretch out a helping hand, to respond with a bright smile of encouragement, to say just the word that was necessary, and no more.<\/p><p>He was the best of friends, for he held you firmly, yet apart. He realized the beautiful description Emerson gives of the ideal friend, in whom meet the two most essential elements of friendship, tenderness and truth, “I am arrived at last,” says Emerson, “in the presence of a man so real and equal . . . that I may deal with him with the simplicity and wholeness with which one chemical atom meets another. . . . To a great heart he will still be a stranger in a thousand particulars, that he may come near in the holiest ground.”<\/p><p>Upon that “holiest ground” of devotion to the highest aim, of desire alone for the welfare of others, the Chief was always to be approached. And blended with the undaunted courage, the keen insight, the swift judgment, the endless patience, that made his personality so powerful, were the warm affections, the ready wit, the almost boyish gaity that made it so lovable.<\/p>", "images": []}, {"pdf_page_index": 449, "pdf_page_number": 450, "label": "Words Of Students And Friends", "html": "<p>One of the Chief’s last messages to us said: “They must aim to develop themselves in daily life in small duties.” . . . There was a beautiful story of Rhoecus, who could not recognize in the bee that buzzed about his head the messenger of the Dryad, and so lost her love.<\/p><p>KATHERINE HILLARD<\/p><p>It is necessary that just those souls in whom we have felt most of reality should disappear from us into the darkness, in order that we may learn that not seeing, but inwardly touching, is the true proof that our friend is there; in order that we may learn that the vanishing and dissipation of the outward, visible part, is no impairing or detriment to the real part which is invisible. This knowledge, and the realizing of it in our wills, are gained with the utmost difficulty, at a cost not less than the loss of the best of our friends; yet if the cost be great, the gain is great and beyond estimating, for it is nothing less than a first victory over the whole universe, wherein we come to know that there is that in us which can face and conquer and outlast anything in the universe, and come forth radiant and triumphant from the contest. Yet neither the universe nor death are real antagonists, for they are but only Life every where, and we are Life.<\/p><p>CHARLES JOHNSTON<\/p>", "images": []}, {"pdf_page_index": 450, "pdf_page_number": 451, "label": "Words Of Students And Friends", "html": "<p>To a greater extent than I have ever realized I know he entered into my life and I am equally sure into the lives of thousands, and this fact I see we are to acknowledge as time passes more and more. . . .He swore no one to allegiance, he asked for no one’s love or loyalty; but his disciples came to him of their own free will and accord, and then he never deserted them, but gave more freely than they asked, and often in greater measure than they could or would use. He was always a little ahead of the occasion, and so was truly a leader.<\/p><p>E. B. RAMBO<\/p><p>Judge was the best and truest friend a man ever had. H. P. B. told me I should find this to be so, and so it was of him whom she, too, trusted and loved as she did no other. And as I think of what those missed who persecuted him, of the loss in their lives, of the great jewel so near to them which they passed by, I turn sick with a sense of their loss: the immense mystery that Life is, presses home to me. In him his foes lost their truest friend out of this life of ours in the body, and though it was their limitations which hid him from them, as our limitations do hide from us so much Spiritual Good, yet we must remember, too, that these limitations have afforded to us and to the world this wonderful example of unselfishness and forgiveness. Judge made the life portrayed by Jesus realizable to me.<\/p><p>ARCHIBALD KEIGHTLEY<\/p>", "images": []}, {"pdf_page_index": 451, "pdf_page_number": 452, "label": "Words Of Students And Friends", "html": "<p>William Q. Judge was the nearest approach to my ideal of a MAN that I have known. He was what I want to be. H. P. B. was something more than human. She was a cosmic power.<\/p><p>W. Q. J. was splendidly human: and he manifested in a way delightfully refreshing, and all his own, that most rare of human characteristics—genuineness. His influence is continuingly present and powerful, an influence tending steadily, as ever, in one direction—work for the Masters’ Cause.<\/p><p>THOMAS GREEN<\/p><p>I knew him with some degree of intimacy for the past eight years, meeting him often and under varied conditions, and never for one moment on any occasion did he fail to command my respect and affection, and that I should have had the privilege of his acquaintance I hold a debt to Karma. A good homely face and unpretentious manner, a loving disposition, full of kindliness and honest friendship, went with such strong common sense and knowledge of affairs that his coming was always a pleasure and his stay a delight. The children hung about him fondly as he would sit after dinner and draw them pictures.<\/p><p>A. H. SPENCER<\/p>", "images": []}, {"pdf_page_index": 452, "pdf_page_number": 453, "label": "Words Of Students And Friends", "html": "<p>‘What he was to one of his pupils, I believe he was to all—so wide-reaching was his sympathy, so deep his understanding of each heart—and I but voice the feeling of hundreds all over the world when I say that we mourn the tenderest of friends, the wisest of counsellors, the bravest and noblest of leaders. What a man was this, to have been such to people of so widely varying nationalities, opinions and beliefs—to have drawn them all to him by the power of his love—and, in so doing, to have brought them closer to each other. There was no difficulty he would not take infinite pains to unravel, no sore spot in the heart he did not sense and strive to heal.<\/p><p>G.L.G.<\/p>", "images": []}, {"pdf_page_index": 453, "pdf_page_number": 454, "label": "A Sculptor’s Appreciation", "html": "<p>Mr. Judge has lived hundreds of lives. So have all men, but very few have any recollection of them. Mr. Judge’s existence has been a conscious one for ages, whether alive or “dead,” sleeping or waking, embodied or disembodied. In the early part of his last life I do not think he was completely conscious twenty-four hours a day, but several years ago he arrived at the stage where he never afterwards lost his consciousness for a moment. Sleep with him merely meant to float out of his body in full possession of all his faculties, and that was also the manner in which he “died”—left his body for good. In other bodies, and known under other names, he has played an important part in the world’s history, sometimes as a conspicuous visible figure. At other times, he worked quietly behind the scenes, or, as in his last life, as a leader in a philanthropical and philosophical movement.<\/p><p>CLAUDE FALLS WRIGHT<\/p><h3 class=\"pdf-heading\">A Sculptor’s Appreciation<\/h3>", "images": []}, {"pdf_page_index": 454, "pdf_page_number": 455, "label": "A Sculptor’s Appreciation", "html": "<p>[The following appeared in the New York Journal. May 7th, 1896, and is an appraisement of our late Chief’s character from a standpoint whose merits are recognized by few in the T.S. on this the sceptical side of the Atlantic. In America, phrenology, as a scientific method of estimating disposition and ability, is a generally accepted fact, and Mr. Lindstrom, whose remarks, as recorded, appear to be chiefly founded upon phrenological observation, has evidently strong enough belief in this science, to induce him to join the T.S. on its evidence as to a noble character.<\/p><p>Some little acquaintance with phrenology on the part of the writer,[42] and a careful study of such photographs of Mr. Judge as he has been able to obtain, enables him to say that Mr. Lindstrom’s deductions, as reported, appear perfectly accurate, and that if any journalistic embellishments have been introduced, they are so well within the truth as to be indistinguishable from it. T.]<\/p>", "images": []}, {"pdf_page_index": 455, "pdf_page_number": 456, "label": "A Sculptor’s Appreciation", "html": "<p>William Quan Judge, the head of both esoteric and exoteric branches of the Theosophical Society in America, died on March 21st. August Lindstrom, a sculptor, who had never seen Mr. Judge in life, made a cast of the dead man’s head, from which he modelled the bust unveiled at Madison Square Garden during the recent convention of Theosophists. Yesterday Mr. Lindstrom said:— “While making the death mask I was struck by the shape of Mr. Judge’s head, which was utterly unlike anything I had ever seen. Most of the heads of remarkable men show the development of one faculty in particular, or, perhaps, of several, and to the neglect of other faculties. I saw at once that Mr. Judge’s head evidenced a high and uniform development of all the faculties, well balanced throughout. This is the remarkable combination I found:<\/p><p>A tremendous will power, with an equal development of gentleness; thorough practicability and adaptability conjoined to a highly idealistic nature, and a gigantic intellect hand in hand with selflessness and modesty.<\/p><p>“There are only two heads that I know of in history that compare with his—Michael Angelo’s and Savonarola’s. The back of Angelo’s head is almost identical with the back of Mr. Judge’s. There is a difference however, in the forehead.<\/p>", "images": []}, {"pdf_page_index": 456, "pdf_page_number": 457, "label": "A Sculptor’s Appreciation", "html": "<p>“In addition to the death mask, I had six photographs to assist me in modelling the bust. A comparison of these photographs is a study. One taken at the age of twenty placed by the side of one taken a year ago, when he was about forty-four years old, makes such a contrast that no one would believe they pictured the same person. It shows that by his great will power this man overcame all his youthful tendencies, with the result of completely changing the form of his skull. I make bold to say that another such highly developed head is not to be found between Maine and California. He had only time to plan his work when carried off In his prime by death. Had he lived to the age of seventy his influence would have been felt by the whole nation.<\/p>", "images": []}, {"pdf_page_index": 457, "pdf_page_number": 458, "label": "Footnotes", "html": "<p>“I consider the nose as giving the best index to character of any feature. His nose was his most distinguishing feature, and shows great power and at the same time complete control over every thought and act, and although strong, it is of the delicate and sensitive type. His mouth showed tenderness and firmness present in equal proportion. His cheek bones also gave evidence of will strength. His hair was soft and showed refinement and gentleness. Taken altogether there was harmonious development, with no defects present, and careful examination of his head from every aspect proves that he was a great and noble man. If such a man as he would devote his life to the Theosophical Society, I think it must have a great mission and I shall ask to be admitted as a member.”<\/p><p>THE END<\/p><p>↑ Back to top<\/p><h3 class=\"pdf-heading\">Footnotes<\/h3><p>[1] Not the physical heart, but the real centre of life in man.—J. N.<\/p><p>[2] Gods and demons.—J. N.<\/p><p>[3] This doubtless refers to H.P.B. See ‘ Mahatmas,’ Theosophy, XXI, 294, and “She Being Dead, Yet Speaketh,” Theosophy, XXXI, 201——Eds.<\/p><p>[4] Originally written: “we rest upon the heart of the Divine.” See Path, II, 290.—Eds.<\/p><p>[5] H.P.B. wrote: “Follow the path I show, the Masters that are behind— and do not follow me or my PATH From ‘She Being Dead, Yet Speaketh,” Theosophy, XXXI, 299—Eds.<\/p>", "images": []}, {"pdf_page_index": 458, "pdf_page_number": 459, "label": "Footnotes", "html": "<p>[6] See “The Seeress of Prevorst,” Path, II, 332, February, 1888. The writer, “B. (probably for “Brehon,” one of Mr. Judge’s pen names), referring to this idea of a ‘‘gentle current,” says: “Herein may lie a valuable hint for medical science; and, indeed, it seems as if it were already tending in this direction. It might be worth while to construct a machine after the pattern given by her—Eds.<\/p><p>[7] Chela means disciple. It is a Sanscrit word.—J. N.<\/p><p>[8] Long Out of print, Man was originally published in 1885 by “Two Chelas in the T.S.” (Later identified as Mohini M. Chatterji and Mrs. Laura C. Holloway. See Theosophist, XIX. 649, Aug., 1898) —Eds.<\/p><p>[9] From “Practical Occultism,” by H.P.B. See Theosophy. XXXI, 102.—Eds.<\/p><p>[10] Through its negative or passive quality.—J. N.<\/p><p>[11] First published in The Theosophist, at intervals from October, 1881, to July. 1883. The first three ‘Fragments” are by H.P.B.. the others being signed Lay Chela” (A. P. Sinnett). The series is reprinted in Theosophy, II.—Eds.<\/p><p>[12] From the second installment of “A Hindu Chela’s Diary,” published by Mr. Judge in the Path, July, 1886, and reprinted in Theosophy, III, 265. The quotation, “no Yogee will do a thing unless he sees the desire in another Yogee’s mind,” occurs on page 268—Eds.<\/p><p>[13] From the third installment of the “Diary,” Theosophy, III, 359—Eds<\/p>", "images": []}, {"pdf_page_index": 459, "pdf_page_number": 460, "label": "Footnotes", "html": "<p>[14] The substance of the letter to which Mr. Judge is replying is given in the “Tea Table Talk,” Path, June, 1837, followed by a portion of his answer. This last, being less condensed than that published in the original LETTERS, is here substituted ,—Eds.<\/p><p>[15] Eusebio Urban was one of Mr. Judge’s pen names in the Path.—Eds.<\/p><p>[16] Evidently the Convention of 1892. We have completed the text of this letter by reference to the Theosophical Forum. August, 1933.—Ed<\/p><p>[17] Lucifer, May, 1888. Reprinted in Theosophy, XXXI, 149—Ed.<\/p><p>[18] The “date” rumored (wrongly) to be the “extinguisher” was 1897. (Compare LETTERS, p. 97.) See two articles by Mr. Judge: “Will Master’s Help be Withdrawn in 1898 till 5975?” in the Path, November, 1894. and “The Closing Cycle,” in the Irish Theosophist, January, 1895. Both articles were republished, under the second title, in Theosophy, XXXII, 81.—Eds.<\/p><p>[19] By H. P. Blavatsky. (Orig. Pub., 1889.)—Eds.<\/p><p>[20] Or, it would probably be more correct to say, he did not desire to be known as possessing it.—Eds.<\/p><p>[21] By this time, the name “Quickly” was no longer used, Mr. Judge being henceforth referred to simply as “Student” or “X.’ ‘—Eds.<\/p><p>[22] The “Faces of Friends,’ in the same issue of the Path.—Eds.<\/p><p>[23] Compare the Prologue to Gorgo, by Charles Kelsey Gaines (Lothrop, Lee and Shepard Co., Boston, Mass.: 1903.) Professor Gaines had read Mr. Judge’s Ocean of Theosophy published in that same year, and may also have seen this passage in the Path.—Eds.<\/p>", "images": []}, {"pdf_page_index": 460, "pdf_page_number": 461, "label": "Footnotes", "html": "<p>[24] Mr. Judge, president of the Aryan T.S., the Parent (New York) Branch.—Eds.<\/p><p>[25] This correspondence is published in the Path, March, 1894. —Eds.<\/p><p>[26] The fourth paper on the second chapter. (See Notes on the Bhagavad-Gita, p. 69.)—Eds.<\/p><p>[27] Occultism versus the Occult Arts.” in the May Lucifer (reprinted in Theosophy, XXXI,149) .—Eds.<\/p><p>[28] “Theosophy in Tennyson ‘Idylls of the King’,’ Path, May and June, 1888.—Eds.<\/p><p>[29] A. P. Sinnett, Vice-President of the London Lodge.—Eds.<\/p><p>[30] Mrs. Hollis-Billings and Emma Hardinge Britten, the ∆ later referred to.—Eds.<\/p><p>[31] The other author of Man.—Eds.<\/p><p>[32] Probably Thomas Green co-editor of Book II. (See also p. 297) —Ed.<\/p><p>[33] C. C. Massey, a Spiritualist, one of the original members of the T.S., and first President of the British Theosophical Society, established in 1876. —Ed<\/p><p>[34] Dr. Anna Bonus Kingsford.—Eds.<\/p><p>[35] The stories in ‘Occult Tales’ have been omitted as they are already available here: Occult Tales<\/p><p>[36] Compare Judge’s statement in a letter to Olcott, March 4, 1880: “I have lived at one time in India 19 years, and twice before about a 2 or 3 years each time, so, you see, I am not so much younger than you, I thought.” (The Theosophist, March, 1931.) Olcott was born in 1832, W.Q.J. in 1851.—Eds.<\/p><p>[37] Compare Mr. Judge’s pen names, “Eusebio Urban” and ‘ Undiano.<\/p><p>[38] Compare the account in the “Tea Table Talk,” p.152—Eds<\/p>", "images": []}, {"pdf_page_index": 461, "pdf_page_number": 462, "label": "Footnotes", "html": "<p>[39] For Mr. Judge’s account of that first meeting, see p. 261, the quotation from his article, “You
