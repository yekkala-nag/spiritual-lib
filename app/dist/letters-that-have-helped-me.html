 what is to be done, but only when the offence is against the whole. When an offence is against us, then let it go. This is thought by some to be “goody-goody,” but I tell you the heart, the soul, and the bowels of compassion are of more consequence than intellectuality. The latter will take us all sure to hell if we let it govern only. Be sure of this and try as much as you can to spread the true spirit in all directions, or else not only will there be individual failure, but also the circle H. P. B. made as a nucleus for possible growth will die, rot, fail, and come to nothing.<\/p>", "images": []}, {"pdf_page_index": 228, "pdf_page_number": 229, "label": "Extracts On Theosophy And The T.S.", "html": "<p>It is not possible to evade the law of evolution, but that law need not always be carried out in one way. If the same result is produced, it is enough. Hence, in any one hour or minute, the being attaining adeptship could pass through countless experiences in effect. But, as a fact, no one becomes an adept until he has in some previous time gone through the exact steps needed. If you and I, for instance, miss adeptship in this Manuantara, we shall emerge again to take up the work at a corresponding point in the much higher development of the next, although then we may seem low down in the scale—viewing us from the standard then to prevail.<\/p><p>The law is this. No man can rush on and fail to escape the counter current, and in proportion as he rushes, so will be the force of the current. All members who work hard come at last to the notice of the Lodge, and the moment they do so, the Black Lodge also takes notice; hence, questions arise, and we are tried in subtle ways that surpass sight, but are strong for the undoing of him who is not prepared—by right thought and sacrifice to the higher nature—for the fight. I tell you this. It may sound mysterious, but it is the truth, and at this time we are all bound to feel the forces at work, for as we grow, so the other side gets ready to oppose.<\/p>", "images": []}, {"pdf_page_index": 229, "pdf_page_number": 230, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Be sure that you understand me right about the Black side. I mean this: when men work along a good while, and really raise themselves up by that, they get the attention of the Black if they are of sufficient importance for it. I have their attention, and it makes a trouble now and then. What we all want to have, then, is the best armour for such a fight, and that is patience. Patience is a great thing, and will work in more ways than one, not only in personal life, but in wider concerns.<\/p><p>The difficulty of remembering the things you read, and the like, may be due to one or many causes. First, it indicates the need of mental discipline in the way of compelling yourself to serious reading and thinking, even though for a short time each day. If persisted in, this will gradually change the mental action, just as one can alter the taste for different sorts of food taken into the body. Again, if you have been dealing in what is known as Mind Cure or Metaphysical Healing, you should avoid it, because it will increase the difficulty you mention. It is different from good, ordinary, mental discipline. And also if you have been in any way following Spiritualism or indulging in psychic thoughts or visions or experiences, these would be a cause for the trouble, and should be abandoned.<\/p>", "images": []}, {"pdf_page_index": 230, "pdf_page_number": 231, "label": "Extracts On Theosophy And The T.S.", "html": "<p>There is no need for you to be a despairer. Reflect on that old verse, “What room is there for sorrow and what room for doubt in him who knows that the Self is one, and that all things are the Self, only differing in degree.” This is a free rendering, but is what it means. Now, it is true that a man cannot force himself at once into a new will and into a new belief, but by thinking much on the same thing—such as this—he soon gets a new will and a new belief, and from it will come strength and also light. Try this plan. It is purely occult, simple, and powerful. I hope all will be well, and that as we are shaken up from time to time we shall grow strong.<\/p><p>______‘s article strove to show that H. P. B. did not teach the doctrine of reincarnation in ‘77, as she did later, which is quite true so far as the public was then concerned. But she did teach it to me and others, then as now. Further, it seems clear what she meant, to wit, that there is no reincarnation for the astral monad, which is the astral man; and, it being a theosophical doctrine that the astral man does not reincarnate save in exceptional cases, she taught then the same thing as she did later. H. P. B. told me personally many times of the real doctrine of reincarnation, enforced by the case of the death of my own child, so I know what she thought and believed.<\/p>", "images": []}, {"pdf_page_index": 231, "pdf_page_number": 232, "label": "Extracts On Theosophy And The T.S.", "html": "<p>I am not able to give you the definition which you ask for, as it seems to me, spirit cannot be defined except in this way, that the whole universe is made of spirit and matter, both constituting together the Absolute. What is not in matter is spirit, and what is not in spirit is matter; but there is no particle of matter without spirit, and no particle of spirit without matter. If this attempted definition is correct, you will see that it is impossible to define the things of the spirit, and that has always been said by the great teachers of the past.<\/p><p>What a petty lot of matter we spend time on, when so much is transitory. After a hundred years what will be the use of all this? Better that a hundred years hence a principle of freedom and an impulse of work should have been established. The small errors of a life are nothing, but the general sum of thought is much.<\/p><p>I care everything for the unsectarianism that H. P. B. died to start, and which is now threatened in its own house. Is it not true that Masters have forbidden Their chelâ to tell under what orders they act, for fear of the black shadow that follows innovations? Yes, . . .<\/p>", "images": []}, {"pdf_page_index": 232, "pdf_page_number": 233, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Am very sorry to hear that your health is not good. In reply to your question: A sound body is not expected, because our race is unsound everywhere. It is Karma. Of course a correct mental and moral position will at last bring a sound body, but the process may, and often does, involve sickness. Hence sickness may be a blessing on two planes: (1) the mental and moral, by opening the nature, and (2) on the physical, as being the discharge into this plane of an inner sickness of the inner being.<\/p><p>The question of sex is not the most difficult. The personal one is still harder. I mean the purely personal, that relating to “me.” The sexual really relates only to a low plane gratification. If Nature can beat you there, then she need not try the other, and vice versa; if she fails on the personal she may attempt the other, but then with small chance of success.<\/p><p>We all differ and must agree to disagree, for it is only by balancing contrary things that equilibrium (harmony) is obtained. Harmony does not come through likeness. If people will only let each other alone and go about their own business quietly all will be well.. . . It is one’s duty to try to find one’s own duty and not to get into the duty of another. And in this it is of the highest importance that we should detach our minds (as well as our tongues) from the duties and acts of others whenever those are outside of our own. If you can find this fine line of action and inaction you will have made great progress.<\/p>", "images": []}, {"pdf_page_index": 233, "pdf_page_number": 234, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Do not stop to consider your progress at all, because that is the way to stop it; but take your mind off the question of your progress and do the best you can. I hope you will be able to acquire in no long time that frame of mind which you so much desire. I think you will acquire it if you will take your mind off yourself as much as possible, and throw it into something for someone else, which would, in course of time, destroy the self impression.<\/p><p>I regret exceedingly all your troubles and difficulties. They are all, it goes without saying, matters of Karma, and must right themselves in process of time. Meantime, your work and duty lie in continuing patient and persevering throughout. The troubles of your friends and relatives are not your Karma, though intimately associated with it by reason of the very friendship and relation. In the lives of all who aspire to higher things there is a more or less rapid precipitation of old Karma, and it is this which is affecting you. It will go off shortly, and you will have gained greatly in having gotten rid of a troublesome piece of business.<\/p><p>As it will take many a life for one to overcome the personal nature, there is no good in imagining what things and thoughts would then be like. It is certain that, in the long journey, the whole nature changing, it is adjusted to all conditions. Many of those matters which we call the woes of others are really nothing at all, and only ‘ deep”; the real woe of the race is not that.<\/p>", "images": []}, {"pdf_page_index": 234, "pdf_page_number": 235, "label": "Extracts On Theosophy And The T.S.", "html": "<p>By setting apart a particular time for meditation, a habit is formed, and, as the time comes round, the mind will after a while become trained, so that meditation at the particular time will become natural. Hence, it will be well for you to keep to the same hour as far as possible.<\/p><p>You ask if I was at where you saw me. Let me tell you something in confidence. I am around at all places, but, of course, most at such as where you, , and others like that are, but, it is not necessary for me to remember it at all, as it is done without that, since this brain has enough to do here. To remember, I should have to retire and devote myself to that, and it would make things no better.<\/p><p>A college course is not necessary for occultism. One of the best occultists I know was never in college. But if a man adds good learning to intuition and high aspiration he is naturally better off than another. I am constantly in the habit of consulting the dictionary and of thinking out the meanings and the correlations of words. Do the same. It is good.<\/p><p>The old mission of the Rosicrucians, though dead on the outside, is not dead, for the Masters were in that as They are in this, and it may be possible to usher in a new era of western occultism devoid of folly. We should all be ready for that, if it be possible.<\/p><p>In regard to the pictures which you see, observe them with indifference, relying always on the Higher Self, and looking to it for knowledge and light—pictures or no pictures.<\/p><p>ON WORK<\/p>", "images": []}, {"pdf_page_index": 235, "pdf_page_number": 236, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Yes, that business is already a “back number,” stale and unprofitable. I have found that work tells. While others fume and fret and sleep, and now and then start up to criticize, if you go right on and work, and let time, the great devourer, do the other work, you will see that, in a little while, the others will wake up once more to find themselves “left,” as they say in the land of slang. Do, then, that way. Your own duty is hard enough to find out, and by attending to that you gain, no matter how small the duty may be. The duty of another is full of danger. May you have the light to see and to do! Tell to remember to work to the end to make himself an instrument for good work. Times change, men go here and there, and places need to be filled by those who can do the best sort of work, who are full of the fire of devotion, and who have the right basis, and a sure and solid one for them-selves. My love to all.<\/p><p>I am very sorry that so many efforts on your part to influence the public press have been unsuccessful, but I feel sure that you will ultimately be successful. I am inclined to think that you will almost certainly find that articles written by Theosophists on the spot will obtain more ready admission than if you send them articles which have already been printed.<\/p>", "images": []}, {"pdf_page_index": 236, "pdf_page_number": 237, "label": "Extracts On Theosophy And The T.S.", "html": "<p>They have a more local colouring, and therefore a greater local interest. . . . I feel sure that by persistent and steady work, such as you are doing, you will win your way, and that even the most conservative papers will find it to their interest to insert articles.<\/p><p>Both _____ and ______are two weak, half-corroded spots. It is due to (a) gossip about others, including me and others in the three lands; (b) to the personal element; (c) most of all to the absence of real faith in the Masters, for wherever that is not strong the work goes down; (d) to a sort of fear of public opinion; (e) to incomplete grasp of the elementary truths; and so on.<\/p><p>Stick to it that the way is to do all you can and let the results go. You have nothing to do with results; the other side will look out for that. This is really the culmination of the work of ages, and it would be a poor thing, indeed, if the Lodge had to depend alone on our puny efforts. Hence, go on and keep the spirit that you have only to proceed, and leave the rest to time and the Lodge. If all the other members had the same idea, it would be better for the old T.S. But let us hope on, for we have some any way, and that is more than none.<\/p><p>You are right, too, about The Secret Doctrine: it is a mine, and is the magazine for the warrior Theosophists, which is the description of you and me and some others.<\/p>", "images": []}, {"pdf_page_index": 237, "pdf_page_number": 238, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Let us all be as silent as we may be, and work, work: for as the enemy rages, they waste time, while work shines forth after all is over, and we will see that as they fought we were building. Let that be our watchword. . . . I hope no weak souls will be shaken off their base. If they get on their own base they will not be shaken off.<\/p><p>ON WISDOM IN ACTION<\/p><p>This is the right conclusion, to let all talk and other people’s concerns slip by and not meddle, No one should be taking information to another, for it fans a flame, and now we have to ignore everything and just work on, be good and kind and, like St. Paul’s charity, overlook all things. Retire into your own silence and let all others be in the hands of Karma, as we all are. ‘Karma takes care of its own.” It is better to have no side, for it is all for the Master and He will look out for all if each does just right, even if, to their view, another seems not to do so. By our not looking at their errors too closely, the Master will be able to clear it all off and make it work well. The plan of quiet passive resistance, or rather, laying under the wind, is good and ought to work in all attacks. Retreat within your own heart and there keep firmly still. Resist without resisting. It is possible and should be attained. Once more, au revoir only, no matter what may happen, even irresistible Death itself. Earthquakes here yesterday: these signify some souls of use have come into the world somewhere; but where?<\/p>", "images": []}, {"pdf_page_index": 238, "pdf_page_number": 239, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Well, now, just at this minute I do not know exactly what to say. Why not take up an easy and fluidic position in the matter? An occultist is never fixed on any particular mortal plan. So do not fix your mind as yet on a plan. Wait. All things come to him who waits in the right way. Make yourself in every way as good an instrument for any sort of work as you can. Every little thing I ever learned I have now found out to be of use to me in this work of ours. Ease of manner and of speech are of the best to have. Ease of mind and confidence are better than all in this work of dealing with other men—that is, with the human heart. The more wise one is the better he can help his fellows, and the more cosmopolitan he is the better, too. . . . When the hour strikes it will then find you ready; no man knows when the hour will strike. But he has to be ready. You see, Jesus was in fact an occultist, and in the parable of the foolish virgins gave a real occult ordinance. It is a good one to follow. Nothing is gained, but a good deal is lost, by impatience—not only strength, but also sight and intuition. So decide nothing hastily. Wait; make no set plan.<\/p><p>Wait for the hour to make the decision, for if you decide in advance of the time you tend to raise a confusion. So have patience, courage, hope, faith, and cheerfulness.<\/p>", "images": []}, {"pdf_page_index": 239, "pdf_page_number": 240, "label": "Extracts On Theosophy And The T.S.", "html": "<p>The very first step towards being positive and self-centered is in the cheerful performance of duty. Try to take pleasure in doing what is your duty, and especially in the little duties of life. When doing any duty put your whole heart into it. There is much in this life that is bright if we would open our eyes to it. If we recognize this, then we can bear the troubles that come to us calmly and patiently, for we know that they will pass away.<\/p><p>. . . You can solidify your character by attending to small things. By attacking small faults, and on every small occasion, one by one. This will arouse the inner attitude of attention and caution. The small faults and small occasions being conquered, the character grows strong. Feelings and desires are not wholly of the body. If the mind is deliberately taken off such subjects and placed on other and better ones, then the whole body will follow the mind and grow tractable. This struggle must be kept up, and after a while it will be easier. Old age makes only this difference—the machine of body is less strong; in old age the thoughts are the same, if we let them grow without pruning.<\/p>", "images": []}, {"pdf_page_index": 240, "pdf_page_number": 241, "label": "Extracts On Theosophy And The T.S.", "html": "<p>There is never any need to worry. The good law looks out for all things, and all we have to do is our duty as it comes along from day to day. Nothing is gained by worrying about matters and about the way people do not respond. In the first place, you do not alter people, and in the second, by being anxious as to things, you put an occult obstacle in the way of what you want done. It is better to acquire a lot of what is called carelessness by the world, but is in reality a calm reliance on the law, and a doing of one’s own duty, satisfied that the results must be right, no matter what they may be. Think that over, and try to make it a part of your inner mind that it is no use to worry; that things will be all right, no matter what comes, and that you are resolved to do what you see before you, and trust to Karma for all the rest.<\/p><p>I am sorry to hear that you are passing through what you mention. Yet you knew it would have to come, and one learns, and the purpose of life is to learn. It is all made up of learning. So, though it is hard, it is well to accept it, as you say.<\/p><p>Do you know what it Is to resist without resistance?<\/p>", "images": []}, {"pdf_page_index": 241, "pdf_page_number": 242, "label": "Extracts On Theosophy And The T.S.", "html": "<p>That means, among other things, that too great an expenditure of strength, of “fortitude,” is not wise. If one fights, one is drawn into the swirl of events and thoughts, instead of leaning back on the great ocean of the Self which is never moved. Now you see that. So, lean back and look on at the ebb and flow of life that washes to our feet and away again many things that are not easy to lose nor pleasant to welcome, Yet they all belong to Life, to the Self. The wise man has no personal possessions.<\/p><p>Anyway, you are right that struggling is wrong. Do it quietly—that is the way the Masters do it. The reaction the other way is just as you say, but the Master has so much wisdom He is seldom, if ever, the prey of reactions. That is why He goes slowly. But it is sure. . . . I know how the clouds come and go. That is all right; just wait, as the song says, till they roll by.<\/p><p>Arouse, arouse in you the meaning of “Thou art That.” Thou art the Self. This is the thing to think of in meditation, and if you believe it, then tell others the same. You have read it before, but now try to realize it more and more each day, and you will have the light you want. . . . If you will look for wisdom you will get it sure, and that is all you want or need. Am glad all looks well. It would always look well if each and all minded their own things and kept the mind free from all else.<\/p>", "images": []}, {"pdf_page_index": 242, "pdf_page_number": 243, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Patience is really the best and most important thing, for it includes many. You cannot have it if you are not calm and ready for the emergency, and as calmness is the one thing necessary for the spirit to be heard, it is evident how important patience is. It also prevents one from precipitating a thing, for by precipitation we may smash a good egg or a good plan, throw the Karma off for the time, and prevent certain good effects flowing. So, keep right on, and try for patience in all the very smallest things of life every day, and you will find it growing very soon, and with it will come greater strength and influence on and for others, as well as greater and clearer help from the inner side of things.<\/p>", "images": []}, {"pdf_page_index": 243, "pdf_page_number": 244, "label": "Extracts On Theosophy And The T.S.", "html": "<p>For the love of heaven do not take any tales or information from any person to any other. The man who brought news to the king was sometimes killed. The surest way to make trouble out of nothing is to tell about it from one to another. Construe the words of the Gîtâ about one’s own duty to mean that you have nothing to do in the smallest particular with other people’s fancies, tales, facts, or other matters, as you will have enough to do to look out for your own duty. . . . Too much, too much, trying to force harmony. Harmony comes from a balancing of diversities, and discord from any effort to make harmony by force. . . . In all such things I never meddle, but say to myself it is none of my affair at all, and wait till it comes to me—and thank God if it never arrives! And that is a good rule for you.<\/p><p>Think of these points:<\/p><p>(a) Criticism should be abandoned. It is no good. Cooperation is better than criticism. The duty of another is dangerous for one whose duty it is not. The insidious coming of unbrotherly criticism should be warned against, prevented, stopped. By example you can do much, as also by word in due season.<\/p><p>(b) Calmness is now a thing to be had, to be preserved. No irritation should be let dwell inside. It is a deadly foe. Sit on all the small occasions that evoke it and the greater ones will never arise to trouble you.<\/p><p>(c) Solidarity.<\/p><p>(d) Acceptation of others.<\/p>", "images": []}, {"pdf_page_index": 244, "pdf_page_number": 245, "label": "Extracts On Theosophy And The T.S.", "html": "<p>It is not wise to be always analyzing our faults and failures— to regret is waste of energy. If we endeavour to use all our energy in service of the Cause, we shall find ourselves rising above our faults and failures, and though these must perhaps occur, they will lose their power to drag us down. Of course, we do have to face our faults and fight them, but our strength for such a struggle will increase with our devotion and unselfishness. This does not mean that vigilance over one’s thoughts and acts is ever to be relaxed.<\/p><p>If you will rely upon the truth that your inner self is a part of the great Spirit, you will be able to conquer these things which annoy, and if you will add to that a proper care of your bodily health, you will get strength in every department. Do not look at things as failures, but regard every apparent failure after real effort as a success, for the real test is in the effort and motive, and not in the result. If you will think over this idea on the lines of The Bhagavad Gîtâ, you will gain strength from it.<\/p>", "images": []}, {"pdf_page_index": 245, "pdf_page_number": 246, "label": "Extracts On Theosophy And The T.S.", "html": "<p>As before, so now, I will do all I can for you, which is not much, as each must do for himself. Just stay loyal and true, and look for the indications of your own duty from day to day, not meddling with others, and you will find the road easier. It is better to die in one’s own duty than to do that of another, no matter how well you do it. Look for peace that comes from a realization of the true unity of all and the littleness of oneself. Give up all, in mind and heart, to the Self, and you will find peace.<\/p><p>The deadening dullness you speak of is one of the trials of the age, but we have some good and earnest people, and they may act as the righteous men in the cities of old, for our ideas are more mighty than all the materialism of the age, which is sure to die out and be replaced by the truth. You will have to take care that the spirit of the time, and the wickedness and apathy of the people, do not engender in you a bitter spirit. This is always to be found in the beginning, but now, being forewarned, you are forearmed.<\/p><p>Do not allow bitterness to come up; keep off all personalities all the time; let the fight be for a cause and not against anyone. Let no stones be thrown. Be charitable. Do not let people be asked to step out, no matter what they do; when they want to go they may go, but don’t have threats nor discipline, it does no good but a lot of harm.<\/p>", "images": []}, {"pdf_page_index": 246, "pdf_page_number": 247, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Say, look here, never growl at anything you have to do. If you have to go, just take it as a good thing you have to do, and then it will redound to the good of them and of yourself, but if it is a constant cross then it does no good and you get nothing. Apply your theories thus. . . . It is a contest of smiles if we really know our business. . . . Never be afraid, never be sorry, and cut all doubts with the sword of knowledge.<\/p><p>I think that you will be helped if you will try to aid some poor, distressed person by merely talking and expressing your sympathy, if you are not able to help in money, though the very fact of giving five cents to someone who needs it is an act which, if done in the right spirit—that of true brotherliness—will help the one who gives. I suggest this because you will, by doing so, set up fresh bonds of sympathy between you and others, and by trying to alleviate the sorrows or sufferings of others, you will find strength come to you when you most need it.<\/p><p>Let them croak, and if we keep silent it will have no effect; as there has been trouble enough, it is better not to make it any worse by referring to it. The only strength it has is when we take notice. It is better policy for all of us who are in earnest and united to keep still in every matter that has any personal bearing.<\/p>", "images": []}, {"pdf_page_index": 247, "pdf_page_number": 248, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Silentlo, my dear, is almost as good as patience. He laughs best who does it last, and time is a devil for grinding things. . . . Use the time in getting calmness and solid strength, for a big river is not so because it has a deep bed, but because it has VOLUME.<\/p><p>Rely within yourself on your Higher Self always, and that gives strength, as the Self uses whom it will. Persevere, and little by little new ideals and thought-forms will drive out of you the old ones. This is the eternal process.<\/p><p>Troubles are ahead, of course, but I rather think that the old war-horse of the past will not be easily frightened or prevented from the road. Do your best to make and keep good thought and feeling of solidarity. . . . Our old lion of the Punjab is not so far off, but all the same is not in the place some think, nor in the condition, either.<\/p><p>The way gets clearer as we go on, but as we get clearer we get less anxious as to the way ahead.<\/p><p>There is service objective and its counterpart within, which being stronger will at last manifest without.<\/p><p>Do not judge in anger, for though the anger passes the judgment remains.<\/p><p>The promises I made to myself are just as binding as any others.<\/p><p>Be true lovers, but of God, and not of each other. Love each the other in that to one another ye mirror God, for that God is in you each.<\/p><p>We all are; I, too. We never were anything, but only continually are. What we are now determines what we will be.<\/p>", "images": []}, {"pdf_page_index": 248, "pdf_page_number": 249, "label": "Foreword", "html": "<p>In order to off-set the terribly cold effect of perceiving the littleness of human affairs, one must inculcate in oneself a great compassion which will include oneself, also. If this is not done, contempt comes on, and the result is dry, cold, hard, repellent and obstructive to all good work.<\/p><p>I know that his absence is a loss to you, but I think if you will regard all things and events as being in the Self and It in them, making yourself a part of the whole, you will see there is no real cause for sorrow or fear. Try to realize this, and thus gain confidence and even joy.<\/p><p>There are valleys in which the greatest shadows are due to old lives in other bodies, and yet the intensity of universal love and of aspiration will dissipate those in an instant of time.<\/p><p>THE LIGHT OF THE EYE FADETH, THE HEARING LEAVETH THE EAR, BUT THE POWER TO SEE AND TO HEAR NEVER DESERTETH THE IMMORTAL BEING, WHICH LIVETH FOREVER UNTOUCHED AND UNDIMINISHED.<\/p><p>Book of Items<\/p><h3 class=\"pdf-heading\">Book III<\/h3><p>To all<\/p><p>Who have discovered<\/p><p>in the Writings of W.Q.J.<\/p><p>Advice, Guidance and Encouragement at every Turn and<\/p><p>for every Circumstance of Life<\/p><p>March 21, 1946<\/p><p>Compiled by<\/p><p>EDITORS, “THEOSOPHY”<\/p><h3 class=\"pdf-heading\">Foreword<\/h3>", "images": []}, {"pdf_page_index": 249, "pdf_page_number": 250, "label": "Foreword", "html": "<p>William Q. JUDGE once said of a Theosophical essay that it would be “profitable for doctrine, for reproof, for correction, for instruction in righteousness.” There could be no more fitting epitome of the influence of Mr. Judge’s own writings, whether magazine articles or letters to his friends and theosophical associates. Nor was there ever a title more felicitous than “Letters that Have Helped Me,” for it expresses at once the simplicity and the power of W.Q.J.<\/p><p>The “exquisite modesty” to which Jasper Niemand (then Mrs. Julia Campbell VerPlanck) referred in her Preface to Book I has concealed much from the careless reader, whose indifference prevents his understanding. Indeed, the “help” that proceeds through these simple, direct words of Mr. Judge finds its way only to the heart that is open, to the mind that is eager and free. He appealed, as was his mission, to the “subtle sight of the subtle-sighted,” and in his seventh letter to Jasper he confided: “Many have I halted, and spoken the exact words to them, have exposed to them my real heart, and they heard nothing; they thought that heart was some-thing else.”<\/p>", "images": []}, {"pdf_page_index": 250, "pdf_page_number": 251, "label": "Foreword", "html": "<p>But some have heard and have understood, then as now, and to them Mr. Judge declares himself, more truly and intimately, it sometimes seems, than might be the case if they had contacted any thing other than the essence, or the presence, of Mr. Judge, as it inheres in his written word. W. Q. J. the Teacher is a vivid figure. W. Q. J. the Friend, a most sympathetic companion, and W. Q. J. the Great Soul—an Ideal and a Fact.<\/p><p>It is now half a century since he left the scene—”on what high mission bent we know not.” What he wrote on the occasion of H. P. B.’s passing, we might repeat, in turn, of him:<\/p><p>It must not be forgotten that the part played by H. P. Blavatsky can never be rightly given to the world, because it would not be understood. Her service and efforts can never be estimated, but they may be glimpsed by intuitional natures.<\/p><p>That a more complete picture may be glimpsed of William Q. Judge, the LETTERS THAT HAVE HELPED ME have been carefully edited and somewhat enlarged, by reference to the original publications, chiefly to Mr. Judge’s own Path Magazine. Certain obvious corrections of style have been made in these letters—so hurriedly written—and occasional footnotes added, so that the book might not hold surface obscurities for the new reader, as well as to facilitate reference to old theosophical magazines now long out of print. Where possible, reference has also been made to reprints of the articles mentioned, in the more accessible Theosophy Magazine.<\/p>", "images": []}, {"pdf_page_index": 251, "pdf_page_number": 252, "label": "Foreword", "html": "<p>“Theosophy” was the name which the Path assumed, at Mr. Judge’s direction, in its eleventh volume—a change which may be regarded as a line of direction for the future. The first number, however—Theosophy for April, 1896—carried the announcement of his death. Sixteen years later, in 1912, Robert Crosbie, a student and co-worker of Mr. Judge’s, established, with his associates in the newly-formed United Lodge of Theosophists, a “reincarnation” of the Path, in a new magazine, using the title Mr. Judge had selected. That magazine is still published, and fills a great need for those who wish to study the magazine articles of Mme, Blavatsky and Mr. Judge.<\/p><p>In this semicentennial edition of the LETTERS, some more “Gleanings” have been added, following the method described by the editors in the second foreword. The ten volumes of the Path have been most carefully gone over, and all the quotations from Judge letters, whether long or short, are here gathered together. Several “Tea Table Talks” (a Path series contributed by Jasper over the pseudonym, “Julius”—for Julia Campbell VerPlanck) have been reproduced entire, for their wealth of Judge material, and also to illustrate the way students of that day were provided with the comments of Mr. Judge, his identity concealed under a variety of disguises.<\/p>", "images": []}, {"pdf_page_index": 252, "pdf_page_number": 253, "label": "Foreword", "html": "<p>Jasper’s articles were frequently spiced with quotations “from a letter of a friend”—always Mr. Judge—and so several excerpts are from this source. It may be noticed in passing that Jasper’s “Letters on the True,” in the second volume of the Path, contain some of the statements on which Mr. Judge comments in Book I. Also, in several instances, Jasper has interjected paragraphs from Mr. Judge’s letters without the formality of quotation marks. Mr. Judge had no pride of authorship—as appears from the variety of names he himself used in writing—and he was too intent upon getting ideas before people’s minds to be much concerned about whose name was signed to them. It can readily be imagined how a conversation with him must have fired the genius of a writer, the real “authorship” of the resultant article being then a moot question!<\/p><p>Another group of Path excerpts, the sayings of “Quickly” (Mr. Judge, as Jasper tells us), suggests the character of his “psychic experiences,” some of manifestly deep meaning. The “Tea Table Talks,” as will be seen, were rich in explanation by Mr. Judge of dreams and dreaming. There were several natural “psychics”— Jasper among them—in the Society in those days, and Jasper’s writings helped to establish a commonsense attitude toward the psychic, giving as well some philosophical basis for experiences that some people have quite frequently, and almost everyone has at least once.<\/p>", "images": []}, {"pdf_page_index": 253, "pdf_page_number": 254, "label": "Foreword", "html": "<p>As to phenomena generally, it has been stated that “in W. Q. J.’s presence H. P. B. caused more phenomena to happen than could be described in a volume.” Mr. Judge himself wrote in the Path that the “phenomena were those amazing feats of magic, hundreds of which I witnessed in broad daylight or blazing gas light, from 1875 to 1878.” If for no other reason, he was qualified by such experiences to discuss the broad question of phenomena with authority. Some of these happenings he described in “Conversations on Occultism with H. P. B.” (Theosophy, III, 36), and his series, “Conversations on Occultism” (Theosophy, I and II), will suggest reasons why H. P. B. so favored him with demonstrations of occult powers.<\/p>", "images": []}, {"pdf_page_index": 254, "pdf_page_number": 255, "label": "Foreword", "html": "<p>The letters written by W. Q. J. while in London and Paris, in 1884, introduce a phase of his life which is of profound importance to the determined student of occultism, for Mr. Judge’s account of these ordeals, as he observed their workings in his own nature, contains many hints for disciples who must some day face for themselves these universal experiences of the Path. It may seem, on the surface, as if Mr. Judge was “overwhelmed” by the conflict and the turmoil of that hour, yet intrinsic evidence—for example, the constant iteration that he will stand—shows that not once was he shaken from his spiritual centre, whatever the harassments and sufferings of the personal man. Another aspect of his life, during this crucial period, is brought out in the second part of “A Weird Tale,” in which Mr. Judge tells of meeting an Adept in London, and of the instructions given him. Most of all, how ever, these London and Paris letters confirm what has already been divined by the intuitive reader of the letters to Jasper—that in writing of the tests and trials of disciples, ‘W. Q. J. knew whereof he spoke.<\/p>", "images": []}, {"pdf_page_index": 255, "pdf_page_number": 256, "label": "Foreword", "html": "<p>Mr. Judge’s “stories” have long been out of print, and are now presented for the first time in book form, These tales—”truer” than allegories—belong quite literally to the story of W. Q. J., and they illustrate his use of pseudonyms when he desired to present statements for consideration on their merits, apart from any question of personalities or authority. Mr. Crosbie, whose friendship with Mr. Judge began in the year of the Path’s founding, 1886, has suggested:<\/p><p>It is well known that Wm. Q. Judge used pen names for many articles published in his magazine, “The Path,” in order to conceal his identity, especially in the case of articles of occult significance intended to convey information to the earnest observant student. The reader would do well to consider all such writings to be recitals of facts and events in which the author was directly concerned. Those who understand the cyclic return of individuals into physical existence with all of their acquired tendencies and relations to others, will find both warning and prophecy for the then future in many of the articles, the proofs of which may be obtained by comparing what was then written with what subsequently occurred in the history of the Movement. Truly “history repeats itself.”<\/p>", "images": []}, {"pdf_page_index": 256, "pdf_page_number": 257, "label": "Foreword", "html": "<p>In reading the LETTERS, Mr. Judge’s own statement (Path, IX, 57) should be kept in mind, that “The LETTERS [To Jasper] were written by me in the regular course of correspondence with the persons to whom they were sent, and were not then intended for publication, nor did I even dream of subsequent publication.” How Mr. Judge came to write this series of letters is told by Bertram Keightley in the Path (IX, 14). Mrs. VerPlanck was so deeply impressed by the first talk she heard on the Teaching “that she joined the T. S. within two weeks, and thenceforward began her unceasing work for Theosophy.” The account continues:<\/p><p>Living with her parents at a distance from New York she wrote for the PATH under the names of “Julius,” “August Waldensee,” “J,” and later on as “Jasper Niemand,” as well as unsigned articles, and also corresponded with T.S. enquirers. In those days writers were so few in the Society that they had to take several names, and often one would write up the notes or finish the articles of another.<\/p>", "images": []}, {"pdf_page_index": 257, "pdf_page_number": 258, "label": "Foreword", "html": "<p>In answer to some enquirers as to the “Jasper Niemand” writings, Mrs. Keightley[VerPlanck had married Dr. Archibald Keightley in 1891] writes: “. . . The Letters that Have Helped Me were received at my Pennsylvania home. They were written for me and for Dr. Keightley—and for the use of others later on—by Mr. Judge, at the express wish of H.P.Blavatsky. The letter which is the source of this request[ H.P.B.], and which conveys assurance of Mr. Judge’s qualifications for the office of instructor, purported to he written through Madame Blavatsky (it begins ‘Says Master’ [ Letter XIV, Book I, and p. 271 for the omitted “private instructions”—Eds.) , and is one of those so ably described by Col. H. S. Olcott in the Theosophist for July, 1893, where he says that communications from high occult sources received through H.P.B. always resembled her handwriting.”<\/p><p>This modification of H.P.B.’s handwriting is decidedly interesting in the above mentioned letter, whose data amply justify the manner in which “Z” is spoken of in Niemand’s preface. Moreover, H,P.B. spoke of her friend Mr. Judge as the “exile,” and Annie Besant wrote later on, “You are indeed fortunate in having W.Q.J. as Chief. Now that H.P.B. is gone, it is the Americans who have as immediate leader the greatest of all exiles.”<\/p>", "images": []}, {"pdf_page_index": 258, "pdf_page_number": 259, "label": "Foreword", "html": "<p>The technical meaning of these titles, “Greatest of the Exiles” and “Friend of all Creatures,” as employed in the East, is totally unknown in the West; the latter being a phrase that has more than once been applied, half in jest, to W.Q.J. by his intimates on account of his often enforced doctrine of “accepting all men and all things”—provided they work for Theosophy.<\/p><p>Book II presents letters and extracts written from 1891 to 1894—the years immediately following Mme. Blavatsky’s death—when Mr. Judge, as H.P.B. before him, had to meet the full force of the storm brewed by enemies of Theosophy and the T.S. These letters, according to those who received them, “were written on a basis of some intimacy, during times of storm and difficulty for the most part, and when the writer was nearly always being attacked either openly or privately. They are peculiar, inasmuch as from first to last they do not contain an uncharitable remark about any person, dead or living.” (Irish Theosophist, December, 1894.)<\/p><p>A correspondent has recorded of that period: “In the first hour of the attack he wrote, ‘Be kind, be charitable, and throw no stones’.” Mr. Judge took his own advice, from the first hour to the last, determined always to be “of and for peace, and not for war alone.” He saved his strength for the real battles—with wrong ideas, and wrong courses of action—and his victory in this Holy War may be seen from some words of H.P.B., written in 1889 (see pp. 277-8).<\/p>", "images": []}, {"pdf_page_index": 259, "pdf_page_number": 260, "label": "Tea-Table Talks", "html": "<p>To one of his associates on the Path, who asked what the students would do without him—how could they manage if he died, Mr. Judge said, “Go to the pages of the Path Magazine. Study what I have written there, and you will know what I would do.” The letters of Mr. Judge, no less than his more formal writings, convey that timeless guidance which only great souls know to give, and the lines of direction therein are as eternal as the truths from which they stem.<\/p><p>As a star, seen brilliantly out of the corner of the eye, flickers out and disappears when focussed upon, so the Being called “W.Q.J.” fades and flickers by ordinary light, alternately dazzling and bewildering those who attempt to fix his position in the theosophical galaxy. But, as with all matters bearing on the real and eternal Theosophical Movement, or on the inner life of any true theosophical effort, the status of Mr. Judge—whether student, guide, friend, teacher, Master’s Agent or Adept—is finally clarified, not by dogmatic assertions, hard and fast theories, personal testimonies and imaginings, but by Theosophy itself, when found, studied, understood and adhered to by the individual for himself.<\/p><p>—EDITORS<\/p><p>March 21, 1946<\/p><h3 class=\"pdf-heading\">Tea-Table Talks<\/h3>", "images": []}, {"pdf_page_index": 260, "pdf_page_number": 261, "label": "Tea-Table Talks", "html": "<p>The Tea Table witnessed a strange discussion last week, between Didymus and Quickly. I have not hitherto alluded to the latter, who is a man of remarkable will power, to which his psychic development and training have not a little contributed. He sat chatting with the ladies on this occasion, when Didymus, walking in, remarked to him:— old man, I’ve just come from your office.”<\/p><p>“You mean at noon, when you left me to go to the Stewart sale with Miss Polly.”<\/p><p>“Oh! but I changed my mind,” said she.<\/p><p>“Of course! Why mention it?” said I, and got that rare thing from a woman, a natural (as well as expressive) look.<\/p><p>“So,” continued Didymus, to Quickly, “I went back to your den. It was just 3 :20 by Old Trinity as I entered.”<\/p><p>“Well! I’ve been there since 2 o’clock,” said Quickly.<\/p><p>“You weren’t though, for I stood at your door looking straight in, and I’ll swear you were not there.”<\/p><p>“My dear boy, I sat down at my desk at 3 P. M., noting that I had just three-quarters of an hour to spare, and never rose till 3:40 when I came up here.”<\/p><p>“But I say, how could I be mistaken? I passed your clerks in the outer office and went right to your den. It’s small, rather bare, no books, no closets, bright sunlight streaming in. There was your chair standing empty, I looked all over the place; a cat couldn’t have hidden there.”<\/p>", "images": []}, {"pdf_page_index": 261, "pdf_page_number": 262, "label": "Tea-Table Talks", "html": "<p>Quickly was silent. His color changed slightly. The two men eyed each other; then Quickly diverted the conversation. With all due modesty, I may say I have the quickness of a Gordon setter on an occult trail, and, as the laws of the Tea Table provide that all such experiences, once broached, must be held as common property among this little band of earnest seekers, I called the meeting to order and Quickly to account.<\/p><p>“Well,” said he slowly, “Didymus bade me farewell for the day at noon, as he was going to the sale. At 3:10 P. M. I was reading some very private letters—in fact—they related to high themes in occultism. As I read, I suddenly thought of Didymus, and the strange idea flashed through my head that he might perhaps return and see the letters in my hands. In my then frame of mind—for I am a queer chap that way sometimes—I had a positive throb of horror lest he might come in and see them, and I mentally went over a little farce of dropping them out of sight.”<\/p><p>“You needn’t have done that, old man,” said Didymus.<\/p><p>“I know it,” rejoined the other, with his shrewd nod, “but the whole thing passed through me as I tell you. The letters related to matters which went to the very roots of my life, and it seemed as if I couldn’t stand their being seen just at first.”<\/p><p>A sympathetic movement ran like a wave through the group and showed that Quickly was understood by all.<\/p>", "images": []}, {"pdf_page_index": 262, "pdf_page_number": 263, "label": "Tea-Table Talks", "html": "<p>“I was in a direct line from my door,” resumed he. “It was to feet off, and the light very bright. At 3:25 I finished reading them, and had seen no one. I wrote a letter, finished it at 3:40 and came straight up here. I can swear I never left my room from 3 to 3:40 P. M.”<\/p><p>“And if the lives of those dearest to me depended on it, I would have sworn that you were not there. I stood in front of your chair at 3:20 for several moments; your clerks saw me come and go.”<\/p>", "images": []}, {"pdf_page_index": 263, "pdf_page_number": 264, "label": "Tea-Table Talks", "html": "<p>Of course this strange occurrence was discussed at more length, but the facts remained the same. Can we explain them? I think so. We know that Adepts possess the power of becoming invisible at will, and that one of the methods employed consists in mesmerizing the lookers-on, so that they do not perceive him who so wills it. All that is required is the institution of a certain vibration through a strong self-conscious will. This Quickly has not.[20] But reading those letters relating to the higher self had so raised his vibrations and intensified his psychic perception, that when the inner self raised a note of alarm at the approach of Didymus, and the idea of discovery was conveyed to the normal consciousness of Quickly, the will to remain unseen was so intense that, unknown to his mind, his soul emitted or employed that vibration necessary to set up such an akasic disturbance as would perturb the sight of a looker-on. This sight depended upon the transmission of certain vibrations to the optic nerve, and these were wanting. Many such incidents happen to those whose psychic senses are gradually unfolding, and, when well attested, as in this case, are useful hints to fellow students.<\/p><p>—From The Path, May, 1887<\/p>", "images": []}, {"pdf_page_index": 264, "pdf_page_number": 265, "label": "Tea-Table Talks", "html": "<p>Even Quickly, the grim, the saturnine, has been beguiled by summer. He writes: “I am doing fairly well with the trout, thanks, old man; but I’ve had a queerish, nervous shock. Serves me right, too. Jolting along in one of those beastly Wagner cars, I saw great hollows in the banks, where land slides had taken place. I got to thinking of them intently; wished hard to examine them; found myself out on the bank at such a place. Suddenly the ‘limited’ came along in the contrary direction from the train my astral self had left. It roared down on me: I got startled and confused, Although it could not strike me, it yet struck me full and square—I felt the headlight hurled against my head! Jupiter! It sent me plunging back into my body (on my own train) with a nervous tremor and jar from which I haven’t yet recovered. See the dangers of leaving the body for puerile purposes, before you are fully poised and self-centered. True, I was out before I was aware, but an occultist should always be aware of all things. I knew well that no catapult could injure or even disperse those fine molecules, or do aught more than pass through them. Yet so strong are the illusions of matter, that I lost my presence of mind in the uproar. Even mystics commit folly! Let me tell you, Julius; it’s been a lesson to me.”<\/p><p>—July, 1887<\/p>", "images": []}, {"pdf_page_index": 265, "pdf_page_number": 266, "label": "Tea-Table Talks", "html": "<p>Quickly one night dreamed that he went out into an adjoining street and saw that several houses had been altered with new stoops and cherry doors. Next day he went there, but found no alteration. A month after, they were all altered as he dreamed, with new stoops and cherry doors. There was a blue door he used to see in the astral light, when awake, about which the Tea Table chaffed him. Now he writes exultant: “The blue door I told you I saw turns out to be a piece of second-sight. The door across the street that I see every morning and evening, has been so altered. I believe I saw the picture just when the owner had determined to paint it over in a few months to come. His thought and determination made a strong picture which I got and thus saw the thing occur. Most men make up their minds nearly every day in general what they will do weeks ahead and thus the ether is full of such pictures at all times. Those pictures of things so well founded that they must soon eventuate, are seen by us.”<\/p><p>—August, 1887<\/p>", "images": []}, {"pdf_page_index": 266, "pdf_page_number": 267, "label": "Tea-Table Talks", "html": "<p>Speaking of pictures of future events in the astral light, when with the Tea Table recently, Quickly gave an excellent reply to some rather nervous queries from the ladies regarding such “omens” as visions of death scenes or funerals passing by. Said he: “They are, of course, compounded; there are other elements in them than those of thought. But the causes must already exist, for if I died now, my relatives have a fair, general idea of the kind of funeral I should have,” (shudders from the ladies) “and so the whole scene might easily be pictured and suddenly seen by a person in a tense nervous condition. Then again, in most cases, a train of similar causes will always produce similar effects or pictures. The soul, having an enormous power of induction, can begin with a known cause; its effect becomes another cause. Unthinking men, acting blindly, will always be moved in known and easily premised ways; thus all the elements can be calculated in an instant and a long-distant event be seen. It appears in some cases to be an extension of the power of cause calculation possessed by many. There are various methods in life which show that all this can be done. See the doctrine of least squares, and others.”<\/p><p>—September, 1887<\/p>", "images": []}, {"pdf_page_index": 267, "pdf_page_number": 268, "label": "Tea-Table Talks", "html": "<p>An inquirer writes: “I want to tell you of a little experience I had last week. I would call it a dream, but it is unlike any dream I ever had. It was in the night, of course, and I thought that I— the real I—was standing by the bedside, looking down at my sleeping form. The whole room was light, yet it did not seem like sunlight; it came from no particular point, it cast no shadows; it seemed to be diffused from, or to pervade, all things equally; it was not colored, like sunlight or gaslight—it seemed white, or silvery. Everything was clearly visible: the furniture, the mosquito bar, the brushes on the toilet-table. The form on the bed I recognized distinctly. It was lying as usual, on the right side, the right arm curved under the pillow, my favorite attitude. I seemed to see it even more clearly, more distinctly than the ordinary reflection in the mirror, for whereas there one only has the reflection of a plane surface, here I saw it as a solid, just as I do other people and could also observe the breathing. This did not last more than, perhaps, thirty seconds, but long enough for me to see the body distinctly, to observe and comment upon the fact that the face had an expression of weariness, to note the light as before remarked and some objects in the room. Then all faded away, and after wards—tho’ how long, of course I don’t know—I awoke and it was day. Was this a dream, or did I remember that much of the excursion of my ‘Astral,’ and was the light I saw the Astral Light? C.”<\/p>", "images": []}, {"pdf_page_index": 268, "pdf_page_number": 269, "label": "Tea-Table Talks", "html": "<p>This inquirer was answered, “I believe that what you saw was the remembrance of what really happened. Your astral self got out—as it always does—and looked back at the body. It is more than likely that all that you saw occurred when you were returning to the body, and that is why it was short. We remember distinctly only that which is nearest to us. I think you went out when you fell asleep and then on coming back to wakefulness you kept a recollection of the last few seconds. You do not really forget what you saw and thought while away. It sinks into your upper, or sub-conscious, or super-conscious mind, from which it will all percolate into the thoughts of your waking state. To remember what happens during sleep, is to be a conscious seer. So we only get these useless glimpses of our returning to the body.<\/p><p>“We go away in deep dreamless sleep to other spheres and states, where we get ideas and so forth, and the way back is through many different states, all having their denizens and obstructions. Besides that, there are two ways to ascend and descend: the direct and indirect. So, much is lost and mixed up on those two roads. Now I talk of actualities and not sentimentally.<\/p><p>“We must be patient. because it takes time to find out how to walk, and much time is spent in getting hold of clues. A great deal depends on purity of thought and motive, and breadth of view.”<\/p><p>—October, 1887<\/p>", "images": []}, {"pdf_page_index": 269, "pdf_page_number": 270, "label": "Tea-Table Talks", "html": "<p>Quickly thought he could beat that dream: he generally does go us one better, and I don’t know that any one envies him some of his occult adventures at least. He was living in New York, and had an acquaintance who was better known to the family of his uncle than to himself. He went to Washington and put up in a private house in R. Street. On the second night he dreamed he was at home and was going in by the basement way in company with the above-named gentleman and his own deceased sister. As they were about entering, the gentleman put his hand on the overhanging stoop, which at once fell upon him, and he disappeared beneath it. Every one in the dream seemed to feel very badly about him. Next day Quickly made a note of the dream in his diary and dismissed it from his mind. Not writing home, he heard nothing about the gentleman, but when he returned to New York he learned that his acquaintance had had a severe fall which brought on an old trouble, and that he had died on the night of the dream. The Professor listened with the genuine “I-know-all-about-it” air, and remarked at the close that the dream was doubtless caused by the events of the man’s life passing rapidly through his dying mind, and when he came to his relations with Quickly, that recollection vibrated in connection with Quickly and caused his dream, reaching him all the more rapidly because his physical nature was at the moment quiescent in sleep. I do not doubt myself that this suggestion is a correct clue to all similar occurrences.<\/p>", "images": []}, {"pdf_page_index": 270, "pdf_page_number": 271, "label": "Tea-Table Talks", "html": "<p>—March, 1888<\/p><p>The student[21] was prevailed on the other night to say some-thing about dreams and dreaming.<\/p><p>“Yes, although the greater number of dreams are foolish, we must not despise them utterly, but should discriminate. If we rely on dreams we shall at last become verily superstitious and amen able to punishment by our friends. The fact that nearly all people dream is an enormous fact. For in these dreams, foolish, sad, grave, or prophetic, there is some ego or person or individual who experiences the feelings that we note in dreams and remember afterwards. The same sort of cognitions and sensations is perceived in dreams as when we are awake. Who feels, who suffers and enjoys? is the question. That is what we should consider. But it is true that one may learn the meaning of his own dreams; rare is the man who can say what, if any, meaning the dreaming of another has.”<\/p><p>—May, 1891<\/p>", "images": []}, {"pdf_page_index": 271, "pdf_page_number": 272, "label": "Tea-Table Talks", "html": "<p>The student remarked, “Dreams are not understood generally, and most of those we have are forgotten in five minutes after waking up. Job truly said that in the visions of the night man is instructed. That this [the Bishop’s dream under discussion] was a day-dream does not alter the case. Bulwer Lytton shows that the first initiations come in dreams. They are nearly always in symbols, for the inner man has no such language as ours. He sees and speaks by pictures. He throws out a thought as a picture. It is for us to grasp it and remember. Each picture is modified by the changing methods of our waking hours of thought. Your friend has well dreamed and well interpreted, and if we were to act upon our dream- teaching when it gives high motive, then we could encourage, as it were, the inner dreamer so that oftener we might get instruction. The Bishop’s impulse is to slightly sniff at his relative because he is so practical. Yet he, even, dreams and a great fact is therefore present in his experience—the fact of dreaming. Our dreams present an opportunity to us as waking men and women to so live that the Inner Self may more easily speak to us. For, as with new acquaintances and strange languages, it is necessary to become accustomed to the new forms of speech and thought, so that out of the great confusion reigning at first we may bring order with instruction. The lesson of this dream is for all; it is to throw off the hold of self upon us each in his own way—for all differ—and to abandon all fear. But we cannot do either while we remain impure; as we purify, so we succeed.”<\/p>", "images": []}, {"pdf_page_index": 272, "pdf_page_number": 273, "label": "Tea-Table Talks", "html": "<p>—March, 1892<\/p><p>“What good are dreams, anyway?” said the Professor the other day. “Is there any use in our paying the slightest attention to them? I have been dreaming that the duck we ate at dinner the other day had grown to the size of an elephant and threatened me with a wave of his web foot. It was really terrifying.”<\/p><p>“Oh!” said the student, who had been looking steadily at the Professor, “then it terrified? Do you see nothing in the fact that someone was appalled by this imaginary duck?”<\/p><p>“It was only an image in my brain,” responded the Professor.<\/p><p>“Yes, very true, it was an image produced by bad digestion; but you ignore an immense fact connected with the image. That great point is that this unexisting duck gave a shock to the perceiver within. The person and faculties that cause your body to shrink from what you call real danger in waking life are the same person and faculties which were terrified by the duck of your dream.”<\/p><p>“Really,” said the Professor, “I never regarded it in that light. You mean that even in this foolish instance I had an introspective experience, showing, by means of the dream state, the actual existence and functioning of myself as a real person within?”<\/p><p>Here the widow, who had stopped in town en route for a new seaside, interrupted with, “Ah, Professor, you are at least learning something. Perhaps you will not be so ready hereafter to laugh at my dream of my new bonnet.”<\/p><p>“Why, what was that?”<\/p>", "images": []}, {"pdf_page_index": 273, "pdf_page_number": 274, "label": "Tea-Table Talks", "html": "<p>“Well, I dreamed I was tying on a new one before the glass and thinking what a lucky person I was in getting the first of the new style, when in walked Lady Eleanor, who appeared at once to grow green with envy at my success.”<\/p><p>“Yes,” remarked the student, “it was just the opposite of his elephantine duck. Yours was not caused by indigestion. It was pleasant. It gratified your love of personal decoration, not unmixed with a desire to stand ahead of the others, unmarried or not. But the person within perceived the event which your mind brought up, and was thereupon pleased. That inner person never sees material objects. It only cognizes the idea of the objects, whether presented by the waking senses or by the mind in dreams. It is a thinker who looks on these ideas. And whether the dream be folly or not in itself, the great fact remains that some one perceived it. In our waking moments we run after folly just as much as we do in dreams. We call it experience, whether it be wise or unwise, whether it be the pursuit of great things or their opposite. Why should we refuse to use our dreams as experience appropriate to that state? For the thinker the experience is the same, whether obtained from what the waking eye sees or from the mind’s own motions in a dream.”<\/p><p>The Professor looked serious a moment and then he said, “You have thrown some light on the matter, but what about dreams of other sorts? Are they all equally foolish, and all only for the use you mention?”<\/p>", "images": []}, {"pdf_page_index": 274, "pdf_page_number": 275, "label": "Tea-Table Talks", "html": "<p>“No, they are not all alike. But there are dreamers and dreamers. Not every person is a real dreamer in the old sense of that term. Some dreams are visions of the night. The real man then sees many facts of life, of history, of family, of nations. He is not bound by the body then, and so makes immediate conclusions. He may see a war that is to come, because he sees all the facts that must lead to a war; and so he impresses on the brain the pictures of battles, of armies, of standards. He can also perceive the coming of single events connected with himself or others. This is because no fact can come without an antecedent cause. He looks on the causes, instantly calculates results down to exact dates even, and then throws the picture upon the receptive brain. If he be a king, and at the same time a good dreamer of this class, his dream- visions have relation to the kingdom, and so may be of more importance than those of the peasant. And yet sometimes such dreamers are obscure men, and often dream that which relates to the whole kingdom. Every idea except those of purest mathematics is presented as a picture or drama to the mind and not in words. Hence often the brain distorts the picture, with confusion as a consequence.<\/p>", "images": []}, {"pdf_page_index": 275, "pdf_page_number": 276, "label": "Tea-Table Talks", "html": "<p>“Sometimes, too, we dream of people we do not know to be alive or dead, or that they ever were. These sometimes are caused by our inner self in dream meeting the self of another whom we had known in a prior life, and then we are unable to identify them with our present brain experience. But they are not nonsense or imagination.<\/p><p>“Then, again, there is the dream that often comes to those who are striving to live the higher life and to develop their inner faculties. In this, one is often apparently attacked and pursued. It is the struggle between the higher and the lower nature in which some times terror supervenes in consequence of old passions and tendencies seeming to get the upper hand. That fear produces a picture of pursuit or battle, and the dreamer wakes up in the condition brought on by an ordinary nightmare. If the aspiration towards a higher life is kept up, but a corresponding change in daily thought and act does not take place, the dream will be repeated, varying perhaps in detail, and cease to come only when the fight is given up and one re-plunges into the lower sort of conduct, or when the battle is won by the opposite course of life and thought.”<\/p><p>The Professor thanked the student, promising more questions some other evening. We all then gathered in another room to discuss the Theosophical prophecies so often made, that our selfish civilization is sure to bring on very serious struggles in society.<\/p><p>—September, 1892<\/p>", "images": []}, {"pdf_page_index": 276, "pdf_page_number": 277, "label": "Tea-Table Talks", "html": "<p>I had just finished reading aloud a letter from one of our circle sent from the West the other day, when the Professor arrived, and seeing the student sitting at the end of the table cried, “Oh, my dear fellow, you are just the man I wanted. Your talk about dreams the other day gave me so many new ideas I think I have hit on a poser for you this time.”<\/p><p>We all became at once very much interested at the prospect of the student’s being posed. He is seldom put to flight, for he has a way of waiting until you have said all you wish, and then gives the matter such a turn that his expected defeat is your own Sedan day. This time he looked at the Professor quite straight and laconically ejaculated, “Letters and their forerunners, I presume.”<\/p><p>A sort of falling of the jaw came to the Professor, and then I knew that again our dear student had posed the other man, and at the same time the voice of the widow whispered in my ear, “I saw a blue light go out of his eyes when old ‘Prof.’ first spoke.”<\/p><p>“Why,” exclaimed the Professor, “that’s it exactly, though I don’t quite give it just that title. But how did you know? Pshaw, it was only a guess! It is this way. When I am thinking of a man, and the same day or the same hour receive a letter from him, is there any necessary connection between my thoughts and the getting of the letter?”<\/p>", "images": []}, {"pdf_page_index": 277, "pdf_page_number": 278, "label": "Tea-Table Talks", "html": "<p>“There may be, and there may not. It all depends. Perhaps as much connection as between our listening here to a letter being read, your coming in just then, and my putting your query for you, ‘by guess’ as you say. A close connection is quite possible, and exists in the greater number of such cases. You have heard of the so-called superstition of the ‘forerunner’ in Scotland and other countries? No, you paid no attention to that? Well, they think that some people have what they call a ‘forerunner.’ This is often a fleeting image of the person which comes to the house or place to which the original is actually travelling, as if to give warning of the approaching person, but which does not speak. In other cases it is a knock or number of knocks sent on ahead as a kind of courier in advance. It does not forbode death, but is simply a forerunner, the person’s own familiar herald. ‘Well, it is the same thing with letters. They have their forerunners which travel on in advance, some at a long distance, others not far before. It is a sort of pressure of aura, an aura full of the characteristics of the writer, and given impulse and direction from the very definite thoughts and ideas of the correspondent toward the person written to. But really this is preaching; I don’t wish to monopolize the evening.”<\/p>", "images": []}, {"pdf_page_index": 278, "pdf_page_number": 279, "label": "Tea-Table Talks", "html": "<p>We all drew in our breaths, for this was exactly what we had been talking about one day in the student’s absence, and now he provokingly proposed to cut off the explanation at the beginning. So there was chorus of “Go on! Don’t do like that. This is not a tea in Society. You can have the evening.”<\/p><p>“Do you mean,” questioned the Professor, with an “I’ll-draw him-out” expression, “that certain objects—such, for instance, as letters—have spheres of their own, of an extensible nature, which can and do travel on ahead, where, impinging on the sensorium of the person to whom they are written, they produce an impression or image or thought of the writer in the brain of the individual against whom this sphere impinges?”<\/p><p>“That is exactly it,”—and I caught a flying look from the student which telegraphed that he was the one who had paused so as to draw the Professor out and on into the web of his own words, which being in his own style, might the more quickly be accepted by his brain.<\/p>", "images": []}, {"pdf_page_index": 279, "pdf_page_number": 280, "label": "Tea-Table Talks", "html": "<p>“The existence of an aura around objects, and especially those belonging to man, has been proved. Letters not only have it on general principles, but also in a specialized state due to the concentration by the writer upon thought, words, and person. It remains with the epistle somewhat in the way a mass of compressed air travels along with a bullet or a cannon ball. This latter is now well known, for by an instantaneous photograph the cushion of the compressed air and the bullet have been distinctly reproduced on the plate. What obtains in physics obtains also in the realm of actual physics, to coin a term. “In some cases I have measured the time this forerunner will reach me, and found it often to be one day, which meant in one case a five-hundred-mile distance and in another one thousand miles.”<\/p><p>“Then, of course,” I said, “each mass of this aura, which must be personal to the writer, carries with it the idea or picture of the friend?”<\/p><p>“Yes, this is so with all our thoughts, and we fix them firmly in the letter during the writing. Then the aura is all permeated with our image. and when the brain receives it that image produces an idea about the writer. In some sensitive persons a partial knowledge of the contents of the coming letter is gained, though in most cases only in the vaguest manner. I think we have cumulative proof of this in telepathy and mind-reading.”<\/p>", "images": []}, {"pdf_page_index": 280, "pdf_page_number": 281, "label": "Tea-Table Talks", "html": "<p>Just here, in the most annoying way, the door-bell began to ring, announcing visitors not in the charmed circle, and both the Professor and the Student pleaded engagements—with each other, I suppose, to continue the conversation as they walked along.<\/p><p>—October, 1892<\/p><p>The editor let me see the sketch of Dr. Anderson,[22] and in that the incident of his having never learned spelling is noteworthy. He gave this in detail to the editor, who tells me. He was but four years of age and had not up to that time studied anything, and his parents were thinking of how to go about his education. They found him reading, and he himself could never explain how it had come to him except that he just knew. This is a very interesting fact, and one of many of the same sort which could be gathered if we only looked for them. I told the story at the table, and the Student said he had had a similar experience in the same line. He said,<\/p>", "images": []}, {"pdf_page_index": 281, "pdf_page_number": 282, "label": "Tea-Table Talks", "html": "<p>“I was not a precocious boy nor a dull one: simply ordinary. Sent to school very early, the spelling book was a terror to me and occupied most of my thoughts. I could not get on and was low in the class. One day I was especially annoyed by this, and after thinking of it all day went to bed full of grief and trouble on the matter. A very sound sleep came and I waked in the morning with the first and prominent thought, ‘Oh I can spell now and will not look in the miserable book again.’ I was then about seven. With out taking the book I went to school and rose through the class. Never again did I study the speller, and am now able to spell all words except the very rare and peculiar.”<\/p><p>“What was that?” said the widow. “Was it your astral, or the mayavi-rupa, or what?”<\/p>", "images": []}, {"pdf_page_index": 282, "pdf_page_number": 283, "label": "Tea-Table Talks", "html": "<p>The Student smiled at her utter disregard of terms, and said that he had not the slightest doubt about its being the taking up of old knowledge from another life, for he declared it had always been a most distinct experience and one he could not forget nor be in the least confused about. Such incidents had happened to him before. In one case he was given as a small boy a missionary book that depicted the Hindus as a lot of miserable black men who were very near savages. This he took home, looked over, and then growing suddenly angry threw it on the floor saying it was a lie. He found in after life he was right, although at the time he had no means of knowing the facts about India or the Hindus, but had to rely on prejudiced tales and interested persons.[23]<\/p><p>All this while the Professor was looking very grave. The old ridicule was not on his face, and the Student and I were beginning to think some inroads had been made on his skeptical mind. We asked him what he thought of it all.<\/p><p>“Well,” said he, “I am bound to accept the evidence offered, and it certainly gives much extraordinary introspective experience. I can hardly put it down to imagination, as there was no basis, and besides, imagination will not confer knowledge. In the Student’s case there was a slight beginning, as he had been studying, but in that of the Doctor there was absolutely no basis. Could it be that the cells of the body have a power of transmitting forms of knowledge such as spelling?”<\/p>", "images": []}, {"pdf_page_index": 283, "pdf_page_number": 284, "label": "Tea-Table Talks", "html": "<p>At this all of us, even the widow, had to laugh, for we saw the Professor was, like so many of his brethren, in a very small corner and hardly knew how to get out. The Student came to his relief, to our astonishment, telling us we must not ridicule the Professor, for he had hit on the explanation, provided he went just a little farther. The physical cells have such a power, but it is latent and can never come out until the Ego, the inner man, draws out the latent impression. And this is not possible unless the Ego in the body has been through a similar set of impressions as those tried to be brought out. That is, there must be an interaction and interrelation between the physical collection of atoms and man inside. If the inner man has been, say, a speller of English, and the mass of atoms composing the body has been also used by those who have been good spellers, then it will be possible for the person to pick up old knowledge. But this goes to show that it is in any case the remembering of what we once learned, and that always depending on the physical instrument we are using at the time. The Professor looked relieved, as we were all so interested in the solution of the matter that we forgot the person who brought it out.<\/p>", "images": []}, {"pdf_page_index": 284, "pdf_page_number": 285, "label": "Tea-Table Talks", "html": "<p>The very cases that seem against this are really supports to it. Take that of the family of the great musician Bach. His descendants were, indeed, good musicians but not such as he, and little by little his great abilities faded from the family. At first this seems to negative the idea, but if you will remember that the Ego must have the power in itself you will see that though Bach may have left atoms with musical impression the new Egos coming to the family line were not able to draw out the power of the instrument, and so it sounded no more. This is a great lesson in karma and universal brotherhood if looked at in the right way. It was the karma of that family to draw Egos to it of indifferent capacity, and those using the atoms of the family gave them new and other impressions and tendencies until at last Ego after Ego was attracted to the family devoid of talent. The same may and does happen in respect to virtue. Hence as we act and live we raise up or pull down the general standard. This is also beyond doubt the real reason for the ancient insistence on the purity of the family line; it is at the same time the cause for the amalgamation of many races to produce a new one, as we see here in our own land.<\/p><p>—April, 1893<\/p>", "images": []}, {"pdf_page_index": 285, "pdf_page_number": 286, "label": "Tea-Table Talks", "html": "<p>The Professor sat, ciga
