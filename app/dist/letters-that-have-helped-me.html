eem mysteries. I find the greatest consolation in these reflections, and then I see that each moment is mine, and that when gone it is passed and merged into the sum of my being; and so I must strive to Be. Thus I may hope to become in time the conscious possessor of the whole of Being. So I do not strive after mystery. The great struggle must be to open up my outer self, that my higher being may shine through, for I know that in my heart the God sits patient, and that his pure rays are merely veiled from me by the many strivings and illusions that I bring on outwardly. This being so, I can only look at the Society and its work (under my lights) as the best available channel for my actions in the effort to help others. Its methods, then, as far as I am concerned, will be only mine, and thus I cannot attach to it the methods of any other person.<\/p><p>Believe me sincerely yours,<\/p><h3 class=\"pdf-heading\">Book II · Letter VIII<\/h3>", "images": []}, {"pdf_page_index": 166, "pdf_page_number": 167, "label": "Book II · Letter VIII", "html": "<p>As for me, all that is the matter is my health, not yet full and good. If that were all right, I would have nothing. What do I care for all the row? It will soon be over; some will be dead; the sooner the better, and then we shall have other fun. I look at it all as so much fun and variety, sure; I am not joking. It is variety, and without that what would life be? As all these asses bray we learn new notes of the scale not known before. A heap of letters I got; but I am O.K.—fragile, perhaps, but not brittle. I would like to be with you both and have some sweet fun without tears or spite, but we have to be apart, to meet now and then. Poor _______ Don’t be hard on him. He had to be silent, you know. A small matter, but more important than he knew for him, Let up on him, and don’t jeer. He has a hard enough time with him self, to have any added by massage from others.<\/p>", "images": []}, {"pdf_page_index": 167, "pdf_page_number": 168, "label": "Book II · Letter VIII", "html": "<p>C ‘s allusion to ‘ opens up a vein of thought which I have had. I have examined myself for the “uses” of this rumpus, to see if I am properly “suffering.” Well, I can’t find it. Down in the deeps I may be; but I find myself cheerful, happy, and anything but morose or sad. Ergo: can I be suffering? Do you know? Positively, I do not know. Ought I? Am I a wretch because I do not suffer, or because, being in actual suffering, I am insensate and do not perceive it? But, on the other hand, I feel no anger and no resentment. Really, it puzzleth me. Many nights I do not sleep, and have used the hours (as I now do), when all is still, in looking over all, and yet I feel all right—everywhere. Of course, I have committed my human faults and sins, but I mean, on the Grand Round-Up. I find nothing to “suffer me”; nothing that I shall rush out to amend by taking the ridiculous and nasty world to my bosom in confidence upon.<\/p>", "images": []}, {"pdf_page_index": 168, "pdf_page_number": 169, "label": "Book II · Letter VIII", "html": "<p>As for myself. Well. What? Nothing. I know not and care not. I am joyful and glorious that the work thus goes. My desires are not here, and all the racket sounds to me far off, as if miles from my ear. I am acting as a pump-engine, and trying to force a lot on. This is not for myself. I must find myself alone, as we all are, and then the Law will say: “Next!” But what next I do not care and don’t want to know, for when “Next” is said I will see what it is to do. Just now the best and biggest work by us poor children is on this plane with the great aid of Master, Whose simple single will keeps the whole organization [ being], and acts as its support and shield. We are not big enough yet to handle the Akasa, but we may help Them to, and that is all I want to do. I have used the present affairs to be as a lesson to me, for it may be used as a test to me as to pride and ambition; and I find that, no matter how I turn it, the same result comes. I am seeking other things while working in this. Try as I may to raise an ambition for power, and to raise a desire to change a supposed case (non-existent in fact), I can’t do it. So you see, my dear Comrade, I am all right.<\/p><p>These questions you ask me:<\/p><p>When the self is first seen, it is like looking into a glove; and for how many incarnations may it not be so? The material envelope throws up before the eye of the Soul waving fumes and clouds of illusion.<\/p>", "images": []}, {"pdf_page_index": 169, "pdf_page_number": 170, "label": "Book II · Letter VIII", "html": "<p>The brain is only the focus through which are centralized the forces and thoughts that are continually coming in through the solar plexus of the heart. Many such thoughts, therefore, are lost, just as millions of seeds in nature are lost. It behooves us to study them and to guard them when there; but can we call them our own? Or weep over them? Let us be as wide as great Nature concerning them, and let each go on to its own place without colouring them with our own colour and acceptance or adhesion.<\/p><p>The spiral movement is the double movement of the astral light, one spiral inside the other. The diastole and systole of the heart are caused by that double movement of the Akasa. But do not presumptuously grasp the movement too soon, for often even the heart moving too rapidly destroys the life.<\/p><p>The brutes unconsciously are aware of the general human opposition, which in each human being they see focalized.<\/p><p>It is easier to sink back into the Eternal than to dive. The diver must needs have the power to retain breath against the rush caused by diving, while to sink gives time to get and keep the breath.<\/p>", "images": []}, {"pdf_page_index": 170, "pdf_page_number": 171, "label": "Book II · Letter IX", "html": "<p>Nothing else greatly new. Am waiting to hear of your completer health. Sustained on the wave you will come in with the tide in time. Best love to _______ and to ______and to thee. May you all be well sustained. I think I have now given you all there is. Salute most noble, brave, and diamond-hearted! May we meet after the dust settles, and we will meet forever in the long, long manvantaras before us all. Peace! Peace! the path of peace and not of war: such are the words.<\/p><p>As forevermore,<\/p><h3 class=\"pdf-heading\">Book II · Letter IX<\/h3><p>I do not know what to write, for I’ve been so occupied with people. I am anxious about my lectures; still unprepared. I can not naturally reply to many of your points, because I have a retiring feeling, and so shall not reply. Indeed, I often think how nice it would be not to speak or write. I am no hand at those nice phrases that people like. Of course, that does not alter my real feelings, but chickens are chickens and often think nonsense. I want to forget and forgive all those children and childish acts. Let us do it, and try as much as possible to be real brothers, and thus get nearer the truth. And by work we will defeat the enemy of Master: by still silently working.<\/p>", "images": []}, {"pdf_page_index": 171, "pdf_page_number": 172, "label": "Book II · Letter IX", "html": "<p>I hope still you will emerge sooner or later all the better and the stronger. I know you will, and I do not see you dead by any means. You are less hopeful for yourself than for others. But you have the will and the fire to fight on to the last bone and the last moment. I only wish I could see you all to hearten you up a little more: that is, to talk with you, for you do not need much of the grit. .<\/p><p>I often hear from Him now. That terrible racket cleared me up. He says that much haste must be avoided. And that I must not let the flood carry me off. He asks me to say to you that you have a natural rapidity that must be guided by yourself and the best way is to wait after a letter and to sleep on a plan. He also says that . . . (I am not aware of this, but He must be right), that you have a subtle desire to be the first to make or propose a good plan or act. Do not let this carry you off, but be slower as to that. It is good advice, I think, for the additional reason that one can now and then take a plan from the head of another.<\/p><p>I see the clans have been gathering. Keep it up and see to it as far as possible that partisanship is at a low ebb and that only good, steady loyalty and work are the main motive. And cast no one out of your heart.<\/p><p>I must ask for a calmer motion at this time. It is absolutely necessary.<\/p>", "images": []}, {"pdf_page_index": 172, "pdf_page_number": 173, "label": "Book II · Letter IX", "html": "<p>A word of love to ________ ? I sent it. I sent many. I sent it not only visibly but also the other way. What could I say? I do not know. In what I sent my whole heart was put. Does not forever stand for me and with me? How can I use words when the fibres of my heart are involved? And what good is my philosophy if, when the actual taking of ________ off seemed so near, I indulged in mere words? I cannot do it. If I try, then the words are mere rubbish, lies and unreal, as I am not able to do this, no matter how much others can. Our real life is not in words of love or hate or coldness but in the fiery depths of the heart. And in those depths is and was, Could I say more? No; impossible. And even that is small and badly said.<\/p><p>It is true that day by day the effect of my philosophy is more apparent on me, as yours is and will be on you, and so with us all. I see it myself, let alone all I hear of it from others. What a world and what a life! Yet we are born alone and must die alone, except that in the Eternal Space all are one, and the One Reality never dies,<\/p>", "images": []}, {"pdf_page_index": 173, "pdf_page_number": 174, "label": "Book II · Letter X", "html": "<p>If ambition slowly creeps up higher and higher it will destroy all things, for the foundations will be weak. In the end, the Master will win, so let us breathe deep and hold fast there, as we are. And let us hurry nothing. Eternity is here all the time. I can not tell you how my heart turns to you all. You know this, but a single word will do it: Trust! That was what H. P. B. said. Did she not know? Who is greater than our old and valiant “old Lady”? Ah, were she here, what a carnage! Wonder, any how, how she, or he, or it, looks at the matter? Smiling, I suppose, at all our struggles.<\/p><p>Again, in storm and shine, in heat and cold, near or afar, among friends or foes, the same in One Work.<\/p><h3 class=\"pdf-heading\">Book II · Letter X<\/h3><p>My Dear Companion (Campanero),<\/p>", "images": []}, {"pdf_page_index": 174, "pdf_page_number": 175, "label": "Book II · Letter X", "html": "<p>Your long letter and message received. All I can say is that it is gigantically splendid, marvelously accurate, And let me then return to you this message . . . that this must prove to you that you are not standing still. . . . It’s all well enough to be out in the rapids as you say I am, but what of it when I don’t hear such a message as yours myself? Thank you. It is a bugle blast from the past. Perhaps in some other age I taught you that and now you give it to me again. When I said in mine that in Kali Yuga more could be done than in any other age in the same period, I stated all you say but I didn’t know it. Now your clear light falls upon it and I see it well. But fear not. You got so familiar to me that I permitted myself to let out some of the things that I now and then feel. But I swear to you that I do not always so let them rush before me. Truly, you have proved that your place is “where the long roll finds you standing.”<\/p><p>Now, don’t you begin to see more and more things? Don’t you feel things that you know without anyone to tell you?<\/p>", "images": []}, {"pdf_page_index": 175, "pdf_page_number": 176, "label": "Book II · Letter X", "html": "<p>My friend Urban[15] has shown me a letter from ______ in which the latter, feeling dark in consequence of various causes, sees no light. This is merely the slough of despond, I tell him. We know the light is ahead, and the experience of others shows that the darkest hour is just before the dawn. I tell him also that strong souls are thus tried inevitably because they rush ahead along the road to the light. In the Finnish Epic [ Kalevala] it is said that guarding a certain place are hideous serpents and glittering spears. And so it really is.<\/p><p>But although such is the truth, I have also to tell him that he ought, as far as possible, to try to ameliorate the circumstances. I will make my meaning clear. He is living now, as you know, among people of an opposite faith. Around them are elementals who would, if they could, implant suspicion and distrust about those whom he reveres, or, if they fail there, will try to cause physical ills or aggravate present ones. In his case these have succeeded in part in causing darkness. . . . Now ________, while not just in that case, is surrounded, while not strong, by those who inwardly deplore his beliefs . . . and hence the elementals are there and they quarrel with those of ________ and bring on despair, reduce strength, and so on. I tell those circumstances ought to be ameliorated every now and then, for I know he would at once, if changed to a better place, get better. And so I have written to him to make a change as soon as he can.<\/p>", "images": []}, {"pdf_page_index": 176, "pdf_page_number": 177, "label": "Book II · Letter X", "html": "<p>It is highly important that no replies should be made to attacks. Get the people to devote themselves to work and to ignoring attacks. The opposing forces strain every nerve to irritate some or all of us so that we may reply in irritation and precipitate more follies. Consider solely how to improve old work, get up new work and infuse energy into work. Otherwise the beneficent influences intended for all F.T.S. will be nullified.<\/p><p>Cheer up , and from your standpoint tell him how to know the distinction between the intellect and the spiritual mind. Tell him how to find out his spirit-will and to ignore a little the mental attitude he takes. Do not point to particular instances of his own failure but detail your own inner experience. It will do him good.<\/p>", "images": []}, {"pdf_page_index": 177, "pdf_page_number": 178, "label": "Book II · Letter X", "html": "<p>Upanishads: “Subsisting” here means, not that the self exists by reason of food, but that as a manifestation, as one causing the body to be visible and to act, the self subsists in that state by means of the food which is used. It is really a reversed translation, and ought to read—as I think—”The self exists in close proximity to the heart and causes the body to exist by reason of the food which it takes in for its subsistence.” That is, continual reference is had to the doctrine that if the self were not there the body would not exist. Yes: it also means that the self procures vital airs from the food which the one life causes to be digested. For note that which you know: did we not take food, the material unit of the trinity would die, and the self be disappointed, and then [the self] would get another body to try in again. For is it not permitted to each one to try to set up a habit in that material unit whereby we may as incarnated beings know the self? Then when that is done we do not live as others; but all the same, even then, the self must subsist, so to say, while in manifestation, by means of food, no matter if that food be of a different character, corresponding to the new state. Even the Devas subsist by food. You know “they enter into that colour, or sound, or savour, at the sacrifice; they rise in that colour, etc., and by it they live.” Watch words, dear; they are traps. Catch ideas, and I will understand by the context that you are not confined to the ordinary meanings.<\/p>", "images": []}, {"pdf_page_index": 178, "pdf_page_number": 179, "label": "Book II · Letter XI", "html": "<p>I am swamped in work, but my courage is up, and I feel the help sent from the right place.<\/p><p>Let us go on from place to place and from year to year; no matter who or what claims us outwardly, we are each the property of the self.<\/p><p>As forevermore and after,<\/p><h3 class=\"pdf-heading\">Book II · Letter XI<\/h3><p>To ______<\/p><p>There is a sentence in your letter not explained by J. Niemand, which, however, needs explaining, for it is the outgrowth of an erroneous idea in you. You say: “Can I help these ignorant elementals with mental instruction? I tried it, but not success fully.”<\/p><p>In all cases where trouble or mental distress is caused by the elementals, you cannot. Elementals are not ignorant. They know just as much and just as little as you do. Most generally more. Do you not know that they are reflectors? They merely mirror to you either your own mind, or the mental strata caused by the age, the race, and the nation you may be in. Their action is invariably automatic and unconscious. They care not for what is called by you “mental instruction.” They hear you not.<\/p><p>Do you know how they hear, or what language they understand? Not human speech; nor ordinary human thought clothed in mental speech. That is a dead letter to them altogether.<\/p><p>They can only be communicated with through correlations of colours and sounds. But while you address yourself to them, those thoughts assume life from elementals rushing in and attaching themselves to those thoughts.<\/p>", "images": []}, {"pdf_page_index": 179, "pdf_page_number": 180, "label": "Book II · Letter XII", "html": "<p>Do not, then, try to speak to them too much, because did you make them know [ they might demand of you some boon or privilege, or become attached to you, since in order to make them understand they must know you—and a photographic plate forgets not.<\/p><p>Fear them not, nor recoil in horror nor repulsion. The time of trial must be fulfilled. Job had to wait his period until all his troubles and diseases passed away. Before that time he could do naught.<\/p><p>But we are not to idly sit and repine; we are to bear these trials, meanwhile drawing in new and good elementals so as to have, in Western phrase, a capital on which to draw when the time of trial has fully passed away. . .<\/p><p>On all other points, Niemand has well explained. Read both together.<\/p><p>Lastly, know this law, written on the walls of the temple of learning.<\/p><p>“Having received, freely give; having once in thought devoted your life to the great stream of energy in which elementals and souls alike are carried—and which causes the pulse beat of our hearts—you can never claim it back again. Seek, then, that mental devotion which strains to give. For in the Law it is written that we must give away all or we lose it; as you need mental help, so do others who are wandering in darkness seeking for light.”<\/p><h3 class=\"pdf-heading\">Book II · Letter XII<\/h3>", "images": []}, {"pdf_page_index": 180, "pdf_page_number": 181, "label": "Book II · Letter XII", "html": "<p>To-day I got your wire, “_______ very low.” This is a shock to me. I hardly believe it is the end at all. I cannot believe it, there is so much fire there. But I wired you to ask if I was to tell _______ Also to read 2nd ch. Bhag. Gîtâ. That, my dear follow, solves all these troubles for me, though it doesn’t kill out immediate pain. Besides, it is Karma, just and wise. Defects are in us all, and if this is the taking off, why, it means that a lot of obstructive Karma is thus at once and forever worked off, and has left ________ free for greater work in better places. I would I were there with you. Tell him how much I love him and that in this era of Kali Yuga no sincere one, such as he, remains long away from the work there is to do. Words are of no use. I have sent thoughts, and those are useful, whether we are in the body or out of it. I sent every night lately all the help I could and continued through the day, not only to , but also you. It reached there, I know, but I can’t overcome Karma if it is too strong.<\/p><p>Tell ________ if it should come to the worst, that no regrets about the work are needed. What has already been accomplished there will last, and seethe and do its work for several years to come. So in that direction there could be nothing to regret. I cannot write directly; but if able to hear this—or maybe when it arrives—then head it as if it were to him, and not to you.<\/p>", "images": []}, {"pdf_page_index": 181, "pdf_page_number": 182, "label": "Book II · Letter XIII", "html": "<p>So, dear , in the presence of your wire this is all I can write. You know my feelings, and I need not say any more.<\/p><p>As ever,<\/p><h3 class=\"pdf-heading\">Book II · Letter XIII<\/h3><p>You did right to send me that letter. Of course, I am sorry to hear from you in that way, but am glad that you wrote. Let me tell you something—will you believe it? You are not in nearly such a bad way as you think, and your letter, which you sent me unreservedly, shows it. Can you not, from the ordinary stand point of worldly wisdom, see it so? For your letter shows this—a mind and lower nature in a whirl, not in the ordinary sense, but as though, figuratively speaking, it were whirling in a narrow circle, seemingly dead, yet kept alive by its own motion. And above it, a human soul, not in any hurry, but waiting for its hour to strike. And I tell you, I know it will strike.<\/p>", "images": []}, {"pdf_page_index": 182, "pdf_page_number": 183, "label": "Book II · Letter XIII", "html": "<p>If so far as your personal consciousness goes you have lost all desire for progress, for service, for the inner life—what has that to do with it? Do you not think that others have had to go through with all of that, and worse—a positive aversion, maybe, to everything connected with Theosophy? Do you not know that it takes a nature with some strength in it to sink very low, and that the mere fact of having the power to sink low may mean that the same person may in time rise to a proportionately greater height? This is not the highest path to go, but it is one that many have to tread. The highest is that which goes with little variation, but few are strong enough to keep up the never-ceasing strain, Time alone, and many ages of service, can give them that strength. But meanwhile there is that other to be traveled. Travel it bravely.<\/p><p>You have got the _______Which of the hells do you think you are in? Try to find out and look at the corresponding heaven. It is very near. And I do not say this to try to bolster you up artificially, for that would be of no use and would not last, even if I were to succeed in doing it. I write of facts, and I think that somewhere in your nature you are quite well aware that I do so.<\/p><p>Now what is to be done:      *          *          *          *<\/p>", "images": []}, {"pdf_page_index": 183, "pdf_page_number": 184, "label": "Book II · Letter XIII", "html": "<p>In my opinion you should deliberately give yourself a year’s trial. Write and tell me at the end of that year (and meantime as often as you feel called upon to do so, which will not be very often) how you then feel, and, if you do not feel inclined to go on and stick to it, I will help you all I can. But you must do it yourself, in spite of not wanting to do it. You can.<\/p>", "images": []}, {"pdf_page_index": 184, "pdf_page_number": 185, "label": "Book II · Letter XIII", "html": "<p>Make up your mind that in some part of your nature, some where, there is that which desires to be of use to the world. Intellectually realize that that world is not too well off and probably wants a helping hand. Recognize mentally that you should try to work for it sooner or later. Admit to yourself that another part of your nature—and if possible see that it is the lower part—does not care in the least about the world or its future, but that such care and interest should be cultivated. This cultivation will, of course, take time—all cultivation does. Begin by degrees. Assert constantly to yourself that you intend to work and that you will do so. Keep that up all the time. Do not put any time limit to it, but take up the attitude that you are working towards that end. Begin by doing ten minutes’ work every day of any sort— study, or the addressing of envelopes, or anything, so long as it be done deliberately and with that object in view. If a day comes when this is too irksome, knock it off for that day. Give yourself three or four days’ rest, and do it deliberately. Then go back to your ten minutes’ work. At the end of six or seven weeks, you will know what to add to that practice; but go slowly, do nothing in a hurry; be deliberate.<\/p>", "images": []}, {"pdf_page_index": 185, "pdf_page_number": 186, "label": "Book II · Letter XIII", "html": "<p>Don’t try to feel more friendly to this or that person—more actively friendly, I should have said. Such things must spring up of their own accord and will do so in time. But do not be surprised that you feel all compassion die out of you in some ways. That, too, is an old story. It is all right because it does not last. Do not be too anxious to get results from the practice I have outlined above. Do not look for any: you have no concern with them, if you do all that as a duty. And finally, do not forget, my dear fellow, that the dead do come to life and that the coldest thing in the world may be made hot by gentle friction. So I wish you luck, and wish I could do more for you. But I will do what I can.<\/p>", "images": []}, {"pdf_page_index": 186, "pdf_page_number": 187, "label": "Book II · Letter XIII", "html": "<p>Now, this is, as I said, an era. I called it that of ‘Western Occultism, but you may give it any name you like. But it is “Western. The symbol is the well-intended American Republic, which was seen by Tom Paine beforehand as “a new era in the affairs of the world.” It was meant to be, as nearly as possible, a brotherhood of nations, and that is the drift of its Declaration and Constitution. The T.S. is meant to be the same, but has for many years been in a state of friction. It has now, if possible, to come out of that. It cannot be a brotherhood unless each, or some, of its units becomes a brother in truth, And brother was the noble name given in 1875 to the Masters. Hence you and I and all of us must cultivate [brotherhood]. We must forgive our enemies and those who assail us, for only thus can the great brothers properly help by working through us. There seems to be a good deal to forgive, but it is easily done, inasmuch as in fifty years we’ll all be gone and forgot.<\/p><p>Cut off, then, thoughts about those “foolish children” until harmonious vibrations ensue to some extent. That absurdity let go. I have deliberately refrained from jumping at such a grand chance. So, you see, forgive, forgive and largely forget. Come along, then, and with me get up as fast as possible the feeling of brotherhood.<\/p>", "images": []}, {"pdf_page_index": 187, "pdf_page_number": 188, "label": "Book II · Letter XV", "html": "<p>Now then, you want more light, and this is what you must do. You will have to “give up” something. To wit: have yourself called half an hour earlier than is usual and devote it before breakfast to silent meditation, in which brood upon all great and high ideas. Half an hour! Surely, that you can spare. And don’t eat first. If you can take another half before you go to bed, and without any preliminaries of undressing or making things agreeable or more comfortable, meditate again. Now don’t fail me in this. This is much to give up, but give it up, recollecting that you are not to make all those preparations so often indulged in by people.<\/p><p>. . . “The best and most important teacher is one’s seventh principle centered in the sixth. The more you divest yourself of the illusionary sense of personal isolation, and the more you are devoted to the service of others, the more Maya disappears and the nearer you approach to Divinity.” Good-bye, then, and may you find that peace which comes from the Self.<\/p><h3 class=\"pdf-heading\">Book II · Letter XV<\/h3><p>In answer to your questions:<\/p><p>(I) Clothes and astral form.<\/p>", "images": []}, {"pdf_page_index": 188, "pdf_page_number": 189, "label": "Book II · Letter XV", "html": "<p>Answer.—You are incorrect in assuming that clothes have no astral form. Everything in nature has its double on other planes, the fact being that nothing visible in matter or space could be produced without such a basis. The clothes are seen, as well as the person, because they exist on the astral plane as well as he. Besides this, the reason why people are seen on the astral plane with clothes of various cut and colour, is because of the thought and desire of the person, which clothes him thus. Hence a person may be seen in the astral light wearing there a suit of clothes utterly unlike what he has on, because his thought and desire were on another suit, more comfortable, more appropriate, or what not.<\/p><p>(2) What can true and earnest Theosophists do against the Black Age or Kali Yuga?<\/p>", "images": []}, {"pdf_page_index": 189, "pdf_page_number": 190, "label": "Book II · Letter XVI", "html": "<p>Answer.—Nothing against it, but a great deal in it; for it is to be remembered that the very fact of its being the iron, or foundation, age, gives opportunities obtained in no other. It is only a quarter as long as the longest of the other ages, and it is therefore crammed four times as full of life and activity. Hence the rapidity with which all things come to pass in it. A very slight cause produces gigantic effects. To aspire ever so little now will bring about greater and more lasting effects for good than at any other time. And, similarly, evil intent has greater powers for evil. These great forces are visibly increased at the close of certain cycles in the Kali Yuga. The present cycle, which closes Nov. 17th, 1897— Feb. 18th, 1898, is one of the most important of any that have been. Opportunities for producing permanent effects for good, in themselves, and in the world as a whole, are given to Theosophists at the present time—opportunities which they may never have again if these are scattered.<\/p><h3 class=\"pdf-heading\">Book II · Letter XVI<\/h3><p>The Masters have written that we are all bound together in one living whole. Hence the thoughts and acts of one react upon all.<\/p>", "images": []}, {"pdf_page_index": 190, "pdf_page_number": 191, "label": "Book II · Letter XVI", "html": "<p>Experience has shown that it is true, as said by Masters, that any sincere member in any town can help the T.S. and benefit his fellow townsmen. It is not high learning that is needed, but solely devotion to humanity, faith in Masters, in the Higher Self, a comprehension of the fundamental truths of Theosophy, and a little—only a little—sincere attempt to present those fundamental truths to a people who are in desperate need of them. That attempt should be continuous. No vain striving to preach or prove phenomena will be of any value, for, as again Masters have written, one phenomenon demands another and another.<\/p><p>What the people want is a practical solution of the troubles besetting us, and that solution you have in Theosophy. Will you not try to give it to them more and more and save from the slough it is in?<\/p><p>I would distinctly draw your attention to Brother _______ There is not that complete sympathy and toleration between him and you which there ought to be, and, for the sake of the work, it should be otherwise. You may say that it is his fault. It is not wholly, for you must, also, be somewhat to blame, if not in this life, then from another past one. Can you deny that for a long period he has held up the Branch there? For if he had not, it would have died out, even though you also were necessary agents.<\/p>", "images": []}, {"pdf_page_index": 191, "pdf_page_number": 192, "label": "Book II · Letter XVII", "html": "<p>Have any of you had unkind or revengeful feelings to him? If so, ought you not to at once drive them out of your hearts? For I swear to you on my life that if you have been troubled or unfortunate, it is by the reaction from such or similar thoughts about him or others. Drive them all out of your hearts, and present such kindliness and brotherliness to him that he shall, by the force of your living kindness, be drawn into full unity and co-operation with you.<\/p><p>Discussion or proofs to show that you are all right and he wrong avail nothing. We are none of us ever in the right—there is always that in us that causes another to offend. The only discussion should be to the end that you may find out how to present to the world, in your district, one simple, solid, united front.<\/p><p>As to the expression “seeing sounds,” this you understand, of course, so far as the statement goes. It records the fact that, at one time, the vibrations which now cause a sound were capable of making a picture—and this they do yet on the astral plane.<\/p><h3 class=\"pdf-heading\">Book II · Letter XVII<\/h3><p>In reply to your question:<\/p>", "images": []}, {"pdf_page_index": 192, "pdf_page_number": 193, "label": "Book II · Letter XVII", "html": "<p>Neither the general law nor the Lodge interferes to neutralize the effect of strain upon the disciple’s physical energies when caused by undue exertion or want of regularity, except in certain cases. Hence the Theosophist is bound to see that his hours for sleep, work, and recreation are properly arranged and adjusted, since he has no right to live so as to break himself down, and thus deprive the cause he works for of a useful and necessary instrument.<\/p><p>Your friend’s energies have been disarranged and somewhat exhausted by irregularities as to rest and recreation, since work has been hard and required rest—whether asleep or awake—has not been had. This causes excitement, which will react (or has) in many different ways in the system and upon the organs. It causes mental excitement, which again raises other disturbance. He, like anyone else, should take measures to insure regularity as to rest, so that what work he does shall be better, and the present excitement subside in his system. It is not wise to remain up late unless for a good purpose, and it is not that to merely remain with others to late hours when nothing good or necessary can be accomplished. Besides other reasons, that is a good one.<\/p>", "images": []}, {"pdf_page_index": 193, "pdf_page_number": 194, "label": "Book II · Letter XVIII", "html": "<p>Excitement is heat; if heat be applied to heat, more is produced. Coolness must be applied so as to create an equilibrium. This applies in that case, and the establishment of regularity in the matter of rest is the application of coolness. Second, the various exciting and “wrongful” acts or thoughts of others are heat; coolness is to be produced by discharging the mind of those and ceasing to refer to them in words; otherwise the engendered heat will continue. It is needless to refer to reasons resting on points of conduct and example, for those anyone is capable of finding and applying.<\/p><p>As there is no hurry, it is easy to divest the mind of anxiety and the irritation arising from hurry. Again, comparison of one’s own work or ways of doing things better than others is wrong and also productive of the heat above spoken of.<\/p><h3 class=\"pdf-heading\">Book II · Letter XVIII<\/h3><p>You are right in thinking that the essential principles of Theosophy are often stated without the use of that name, for it is the universal fundamental system which underlies the religions of every age. The New Testament, rightly understood, teaches Theosophy, and we know that both Jesus and St. Paul were initiates. Of course, in Theosophy, as in any other Science, one understands more as one reads more, and I recommend you to read and digest such of our books as you can conveniently procure.<\/p>", "images": []}, {"pdf_page_index": 194, "pdf_page_number": 195, "label": "Book II · Letter XVIII", "html": "<p>Now in respect to the questions you ask, let me say that Theosophy requires no man to abandon a mode of life which is not in itself wrong. The use of meat diet is not a sin; it is not even an offence; it is a habit which the race has now largely conformed to, and is not a question of morals or right. At a certain stage of advance as a chela or disciple, the use of meat food has to be abandoned because of its psychical and physiological effects. But you have not reached that stage, nor is it likely that you will for a long time. As the use of meat is not an offence, so neither can be the supply of it to others, so that your assisting in killing hogs for market is in no way opposed to your duty as a man or as a Theosophist. That being your duty in present circumstances, I should recommend you to perform it without hesitation.<\/p>", "images": []}, {"pdf_page_index": 195, "pdf_page_number": 196, "label": "Book II · Letter XIX", "html": "<p>Men and women are complementary in character, and therefore adapted to each other. It is natural that each sex should enjoy the company of the other, and what is natural cannot be wrong. More over, it is perfectly proper that when a suitable mate is found, a man should marry and settle down as a householder, bringing up a family with right views and high purposes. He contributes a service to humanity, who puts [leaves] children to take his place after his death, and to reproduce his true and altruistic life. Consequently, if you find a suitable match and desire matrimony, there can be no possible reason why you should not carry out such a purpose. Like the abstention from meat, celibacy is essential to advance after a certain stage, but that stage has not yet been reached by you, and you cannot, therefore, be subjected to its conditions. There can be no one rule laid down for all human beings, inasmuch as the temperaments and desires are so different. Each must work out the problem of life in his own way. If your aspirations are so set on higher things that you find the lower a hindrance, it is evident that you should not indulge in the latter; but if you are not so hindered, then no less a duty is yours. You are right in thinking that the essential to all true progress is a wish to conform utterly to the Divine Will, we being certain that we shall be helped in proportion—as is our need.<\/p><h3 class=\"pdf-heading\">Book II · Letter XIX<\/h3>", "images": []}, {"pdf_page_index": 196, "pdf_page_number": 197, "label": "Book II · Letter XIX", "html": "<p>Yes, you are right. I am in danger, but that danger is not on the outside, although it is on the outside that attempts are brought forward. And in some sense all those with me are in danger too. It is a danger from _________ which ever tries to forestall the steps of those who travel forward. So, too, my dear, you are in the same sort of danger. But while the danger is there, there is yet encouragement in the fact itself. For we would not be so placed if we had not been so fortunate as to have progressed through work and patience to the point where _______ sees enough in us to try and stop progress and hinder our work. Hence, if they see they cannot stop us, they try all plans to get up strife, so as to nullify our work.<\/p><p>But we will win, for knowing the danger we take measures against it. I am determined not to fail. Others may; but ________ and I will not. Let us, then, await all suffering with confidence and hope. The very fact that you suffer so much is objective evidence of progress, even though so painful, not only to you but to those who love you. So, while I do not say “suffer on,” I am comforted by the knowledge that it will be for great good in the future. So I am writing this, instead of machining it, in order that you may feel the force of my love and comradeship.<\/p><p>Let us all draw closer together in mind and heart, soul and act, and try thus to make the true brotherhood through which alone our universal and particular progress can come.<\/p>", "images": []}, {"pdf_page_index": 197, "pdf_page_number": 198, "label": "Book II · Letter XX", "html": "<p>To thee, oh holder of the flame, my love I send. Well, I go again, but never do I forget. My best love and blessing to thee. I cannot speak of these things, but thou knowest.<\/p><p>And now, as formerly, and as now, and as forever and forever more,<\/p><h3 class=\"pdf-heading\">Book II · Letter XX<\/h3><p>To those I love and who work with me.<\/p><p>My last words before going to the Convention.[16]<\/p>", "images": []}, {"pdf_page_index": 198, "pdf_page_number": 199, "label": "Book II · Letter XX", "html": "<p>Doubts and questions have arisen as to some things since the present cloud gathered. Among others it has been said it were better that Olcott had left the chair; it would be well for him to go and so on. These views should not be held. If held, they should be dismissed. There are two forces at work in the T.S., as well as in the world and in man. These are the good and the bad. We cannot help this: it is the Law! But we have rules and we have preached of love and truth and kindness; and above all, we have spoken of gratitude, not only of Masters, but among us. Now this applies to these questions as to Olcott, and as well there come in principles of policy. Now let me tell you what one has said to me in whom I believe and whose words I endorse. Thus:“He retains the position for two reasons: (a) To pay a debt of gratitude, (b) The T.S. must not seem to the outside world to split or to become separate entities. It must remain one undivided whole solid from side to side and retaining even its ‘incompetent president.’ It must not be known that he is wholly incapable. He is capable of going on with his small portion of work to the end if well assisted. The work must not fail because here and there personalities fall and sin and are unwise. TRUTH remains and IT Is, whoever falls, but the multitude look to the visible leader. If he falls apart like an unjointed puzzle, at once they say, ‘there is no truth, nothing which Is’; and the work of a century is ruined and must be again rebuilt from its foundations, and years of back ward tendency must come between the wreck of one undertaking and the beginning of another. The same power that overruled his intended resignation and frustrated it, will overrule the present trouble.<\/p>", "images": []}, {"pdf_page_index": 199, "pdf_page_number": 200, "label": "Book II · Letter XXI", "html": "<p>“Let me say one thing that I KNOW: Only the feeling of true brotherhood, of true love toward humanity, aroused in the soul of some one strong enough to stem this tide, can carry us through. For LOVE and TRUST are the only weapons that can overcome the REAL enemies against which the true theosophist must fight. If I or you go into this battle from pride, from self-will, from desire to hold our position in the face of the world, from anything but the purest motives, we will fail. Let us search our souls well and look at it as we never looked before. See if in us is the reality of the brotherhood which we preach and which we are supposed to represent.”<\/p><p>Let us remember those famous words: “Be ye wise as serpents but harmless as doves.” Let us remember the teaching of the Sages that death in the performance of our own duty is preferable to the doing by us of the duty of another, however well we may do the latter: the duty of another is full of danger. Let us be of and for peace, and not for war alone.<\/p><p>Sincerely as ever,<\/p><p>WILLIAM Q. JUDGE<\/p><h3 class=\"pdf-heading\">Book II · Letter XXI<\/h3><p>It is true suffered through my cold and hard feelings. But it was her fault, for I say now as then to ________ that she, absorbed in , neglected my members, who are my children, and for whom I wanted her best and got her worst. That made me cold, of course, and I had to fight it, and didn’t care if _______ did not like it. I have no time to care. I am glad she has gone to ________<\/p>", "images": []}, {"pdf_page_index": 200, "pdf_page_number": 201, "label": "Book II · Letter XXI", "html": "<p>It is her trial and her chance and when she gets back she can see for herself if she is able to prevent the “big head” from coming on as has happened with others. If she does, then she will have stood the reaction and I have faith she will stand; but still it has to be met. Time comes on sure, and with it trial. H. P. B. was her preparer and comfort, but men are not made into steel by comfort, and note that H. P. B. then died off.<\/p><p>My trip all over this country shows me that it is of more consequence that I should now work up the U. S., where the Masters first worked in this century. It needs all I can do. . . . So, when I have fulfilled my engagement on the English stage, I shall skip back here quickly and do this work. The field is even greater than I thought, although I had a big idea of it. From the United States we can affect the world and they will come to us from all places either for solid work or for help in their need.<\/p>", "images": []}, {"pdf_page_index": 201, "pdf_page_number": 202, "label": "Book II · Letter XXI", "html": "<p>‘Well now, of you: I feel it all. It is up, and down. It is well you are courageous, and to endure you are able. Indeed, endure is the best word, for that is what the oak does when the storms rage: it is better to endure when we can do nothing than to faint and fall. The facts are to be faced. I hope they may turn out otherwise, but if not, it is Karma. Aside from pain, it is the same as anything else. If it comes, it will not last long. Still, I hope it cometh not. I think much of it, but know the bravery of you and the high soul that dwells there. All the time of pain and dogged fighting I know your real self sits up above it all unaffected, and so does mine, and from that let us take comfort. All things in this age move like lightning and so with all our Karma, though mine has so often seemed slow, so far as concerns me. ‘Well, I can not go on with this. I feel as you do: I stand by you in heart and have often of late sent you messages of hope and power to help you.<\/p>", "images": []}, {"pdf_page_index": 202, "pdf_page_number": 203, "label": "Book II · Letter XXII", "html": "<p>I advised________ to do her part to lessen the constant bringing forward of the name of H. P. B., instead of independent thought on Theosophy. We have too much of it and it is no proof of loyalty, and it gives rise to much of the foolish talk of our dogmatism. You will understand, and may be able to influence some to a more moderate though firm attitude that will not lessen their loyalty and devotion. One good point is that the true chêla does not talk much of his Master and often does not refer to that Master’s existence. It has almost become the same as unnecessarily waving the red flag at a bull. Those of us who have experience do not do it; but the younger ones do. X ____ does it here in his speeches and I am going to speak to him of it. If it be not avoided, the first thing we know there will be a split between the H. P. B.’ers and the theosophists pur sang, the latter claiming to be the real thing because devoid of any personal element. You and I and____ do not find it necessary all the time to be flinging her (H. P. B.) in the faces of others, and it is well now to take the warning offered from the outside. Besides, I have had a very strong inside warning on it. My best love, now that we are near Christmas and New Year, and may there be some sunshine to light the path. I send you my love unsullied by a mere gift.<\/p><p>I hope will be firm and proceed as indicated, but she, like us all, must meet her own old enemies in herself.<\/p><p>Again I go, as for evermore,<\/p><h3 class=\"pdf-heading\">Book II · Letter XXII<\/h3>", "images": []}, {"pdf_page_index": 203, "pdf_page_number": 204, "label": "Book II · Letter XXII", "html": "<p>Great excitement last night. It was the regular night of ____ T.S. and _____was to speak. We got there at 8:15, and the hall was full. He began, and had just been fifteen minutes, when it was discovered that the building was on fire. We stopped and let 1,000 people in the various halls get out, then quietly went and none were hurt, only two, _____and_____ , getting a few quarts of water from a burst hose.<\/p><p>It was a queer exit, for we went downstairs beside the elevator, and glass, bricks and water were falling down the light well, while the fire on the top stories of it roared and made a fine light, and streams of fire ran down the oily elevator pipes on the other side; and firemen pulled up hose neck or nothing as we got away. It was _____‘s own meeting, and it ended in fire! None of the great psychics present had had the remotest premonition, but one invented afterwards an expost facto sense of terror.<\/p><p>Tell _____ the time has passed for him to vacillate; he knows his guru—she was and is H. P. B. Let him reflect ere he does that which, in wrecking her life and fame, will wreck his own life by leaving him where nothing that is true may be seen. . . . Silence is useful, now and then, but silence sometimes is a thing that speaks too loud. I am his friend and will help. No one can hurt him but himself; his work and sacrifice were noble and none can point at him.<\/p>", "images": []}, {"pdf_page_index": 204, "pdf_page_number": 205, "label": "Book II · Letter XXII", "html": "<p>See what I said in the opening volume of The Path: the study of what is now called “practical occultism” was not the object of that journal. “We regard it as incidental to the journey along the path. The traveller, in going from one city to another, has perhaps to cross several rivers; maybe his conveyance fails him and he is obliged to swim, or he must, in order to pass a great mountain, know engineering in order to tunnel through it, or is compelled to exercise the art of locating his exact position by observation of the sun: but all that is only incidental to his main object of reaching his destination. We admit the existence of hidden, powerful forces in nature, and believe that every day greater progress is made towards an understanding of them. Astral body formation, clairvoyance, looking into the astral light, and controlling elementals is all possible, but not all profitable. The electrical current, which when resisted in the carbon produces intense light, may be brought into existence by any ignoramus who has the key to the engine- room and can turn the crank that starts the dynamo, but is unable to prevent his fellow man or himself from being instantly killed, should that current accidentally be diverted through his body. The control of these hidden forces is not easily obtained, nor can phenomena be produced without danger, and, in our view, the attainment of true wisdom is not by means of phenomena, but through the development which begins within.<\/p>", "images": []}, {"pdf_page_index": 205, "pdf_page_number": 206, "label": "Extracts On Theosophy And The T.S.", "html": "<p>“True occultism is clearly set forth in the Bhagavat Gita and Light on the Path, where sufficient stress is laid upon practical occultism, but, after all, Krishna says, the kingly science and the kingly mystery is devotion to and study of the light which comes from within. The very first step in true mysticism and true occultism is to try to apprehend the meaning of Universal Brotherhood, without which the very highest progress in the practise of magic turns to ashes in the mouth.<\/p><p>“We appeal, therefore, to all who wish to raise themselves and their fellow creatures—man and beast—out of the thoughtless jog trot of selfish everyday life. It is not thought that Utopia can be established in a day; but, through the spreading of the idea of Universal Brotherhood, the truth in all things may be discovered. What is wanted is true knowledge of the spiritual condition of man, his aim, and destiny. Such a study leads us to accept the utterance of Prajapati to his sons: ‘Be restrained, be liberal, be merciful; it is the death of selfishness’.”<\/p><p>This is the line for us to take and to persevere in, that all may in time obtain the true light.<\/p><h3 class=\"pdf-heading\">Extracts On Theosophy And The T.S.<\/h3><p>All the work that any of us do anywhere redounds to the interest and benefit of the whole T.S,, and for that reason we know that we are united.<\/p>", "images": []}, {"pdf_page_index": 206, "pdf_page_number": 207, "label": "Extracts On Theosophy And The T.S.", "html": "<p>The Self is one and all-powerful, but it must happen to the seeker from time to time that he or she shall feel the strangeness of new conditions; this is not a cause for fear. If the mind is kept intent on the Self and not diverted from it, and comes to see the Self in all things, no matter what, then fear should pass away in time. I would therefore advise you to study and meditate over the Bhagavad Gita, which is a book that has done me more good than all others in the whole range of books, and is the one that can be studied all the time.<\/p><p>This will do more good than anything—if the great teachings are silently assimilated and put into action, for it goes to the very root of things and gives the true philosophy of life.<\/p><p>If you try to put into practice what in your inner life you hold to be right, you will be more ready to receive helpful thoughts and the inner life will grow more real. I hope with you that your home may become a strong centre of work for Theosophy.<\/p>", "images": []}, {"pdf_page_index": 207, "pdf_page_number": 208, "label": "Extracts On Theosophy And The T.S.", "html": "<p>You want to know the inner situation of the T.S. Well, it is just this: we have all worked along for eighteen years, and the T.S. as a body has its karma as well as each one in it. Those in it who have worked hard, of course, have their own karma, and have brought themselves to a point ahead of the T.S. Now, if the branches are weak in their knowledge of Theosophy, and in their practise of its precepts and their understanding of the whole thing, the body is in the situation of the child who has been growing too fast for its strength; if that be the case it is bound to have a check. For my part I do not want any great rush, since I too well know how weak even those long in it are. As to individuals, say you, ____ and so on, By reason of hard and independent work you have got yourselves in the inner realm just where you may soon begin to get the attention of the Black Magicians, who then begin to try to knock you out, so beware. Attempts will be silently made to arouse irritation, and to increase it where it now exists. So the only thing to do is to live as much as possible in the higher nature, and each one to crush out the small and trifling ebullitions of the lower nature which ordinarily are overlooked; thus strength is gained in the whole nature, and the efforts of the enemy made nil. This is of the highest importance, and if not attended to it will be sad. This is what I had in view in all the letters I have sent to you and others. I hope you will be able to catch hold of men, here and there, who will take the right, true, solid view, and thus be left behind you as good men and good agents.<\/p>", "images": []}, {"pdf_page_index": 208, "pdf_page_number": 209, "label": "Extracts On Theosophy And The T.S.", "html": "<p>When I was in ____ I broached to you and others the plan of getting Theosophy to the working people. Has anything been done? It must be simply put. It can be understood. It is important. Let us see if this thing cannot be done—you all promised to go to work at it. Why not, like the Bible man, turn from all these people who will not come, to the byways and hedges? Then I feel sure that, if managed right, a lot of people who believe in Theosophy but don’t want to come out for it, would help such a movement, seeing that it would involve talking to the poor and giving them sensible stuff. If need be, I’d hold a meeting every night, and not give them abstractions. Add music, if possible, etc. Now let me hear your ideas. Time rolls on, and many queer social changes are on the way.<\/p>", "images": []}, {"pdf_page_index": 209, "pdf_page_number": 210, "label": "Extracts On Theosophy And The T.S.", "html": "<p>I have your long letter from _____and you are right as to conduct of Branches. No Branch should depend on one person, for if so, it will slump, sure; nor on two or three either. Here they depended on me for a long time, and my bad health in voice for a year was a good thing as it made the others come forward. _____ is right enough in his way, but certainly he ought to be fitting himself for something in addition to speaking, as the T.S. has to have a head as well as a tongue; and if a man knows he is bad at business, he should mortify himself by making himself learn it, and thus get good discipline. We sadly need at all places some true enthusiasts. But all that will come in time. The main thing is for the members to study and know Theosophy, for if they do not know it how can they give any of it to others? Of course, at all times most of the work falls upon the few, as is always the case, but effort should be made, as you say, to bring out other material.<\/p><p>. . . I am abundantly sure that you are quite correct in saying that it is the Branches which work that flourish, and that those addicted to “Parlour Talks” soon squabble and dwindle. You have gone right to the root of the matter. So, also, I agree with you, heart and soul, in what you say as to the policy of a timid holding and setting forth of Theosophy. Nothing can be gained by such a policy, and all experience points to energy and decision as essential to any real advance.<\/p>", "images": []}, {"pdf_page_index": 210, "pdf_page_number": 211, "label": "Extracts On Theosophy And The T.S.", "html": "<p>You are, I think, quite right to attempt to get all members to work for their individual advance, by working for their Branches, By doing things in this way, they provide an additional safeguard for themselves, while forming a centre from which Theosophical thought can radiate out, to help and encourage others who are only beginning their upward way.<\/p><p>I find that you state my view exactly. That view is that the A B C of Theosophy should be taught all the time, and this, not only for the sake of outsiders, but also for the sake of the members who are, I very well know, not so far along as to need the elaborate work all the time. And it is just because the members are not well grounded that they are not able themselves to get in more inquirers. Just as you say, if the simple truths practically applied as found in Theosophy are presented, you will catch at last some of the best people—real workers and valuable members. And Theosophy can best be presented in a simple form by one who has mastered the elements as well as “the nature of the Absolute.” It is just this floating in the clouds which sometimes prevents a Branch from get ting on. And I fully agree, also, that if the policy I have referred to should result temporarily in throwing off some few persons it would be a benefit, for you would find others coming to take their places. And I can agree with you, furthermore, out of actual experience.<\/p>", "images": []}, {"pdf_page_index": 211, "pdf_page_number": 212, "label": "Extracts On Theosophy And The T.S.", "html": "<p>You by no means need to apologize for asking my attention to the matter of your joining the Theosophical Society. It is my great desire and privilege to give to all sincere enquirers whatever information I may possess, and certainly there can be no greater pleasure than to further the internal progress of any real student and aspirant. I think you quite right in wishing to identify your self with the Theosophical Society, not only because that is the natural and obvious step for anyone sincerely interested; but also because each additional member with right spirit strengthens the body for its career and work.<\/p><p>In taking advantage of an opportunity to introduce Theosophy into the secular press, you are doing exactly the work which is so invaluable to the Society, and which I so constantly urge upon our members. It is in this way that so very many persons are reached who would otherwise be quite inaccessible, and the amount of good which seed thus sown can accomplish is beyond our comprehension. You have my very hearty approval of and encouragement in your work, and I am very sure that that work will not be with out fruit.<\/p><p>NEW YORK, October 11th, 1892.—This is the era of Western Occultism. We are now to stand shoulder to shoulder in the U.S. to present it and enlarge it in view of coming cussedness— attacks which will be in the line of trying to impose solely Eastern disciples on us. The Masters are not Eastern nor Western, but universal.<\/p>", "images": []}, {"pdf_page_index": 212, "pdf_page_number": 213, "label": "Extracts On Theosophy And The T.S.", "html": "<p>I shall be glad to give you any information possible respecting Theosophy and the Theosophical Society, but I think you err in supposing that the purpose of either is to encourage the study of what is known as the Occult Arts. Knowledge concerning, and control of, the finer forces of nature are not things which should be sought after at our elementary stage of progress; nor would such attainment be appropriate, even if possible, to anyone who had not thoroughly mastered the principles of Theosophy itself.<\/p>", "images": []}, {"pdf_page_index": 213, "pdf_page_number": 214, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Mere desire for powers is a form of selfishness, and receives no encouragement from our Teachers. Mme. Blavatsky stated this matter very clearly indeed in an article published in Lucifer, entitled “Occultism versus the Occult Arts.”[17] When persons without a large preliminary training in the real Wisdom-Religion seek knowledge on the Occult plane, they are very apt, from inexperience and inadequate culture, to drift into black magic. I have no power to put you into communication with any adept to guide you in a course of Occult study, nor would it be a service to you if the thing were possible. The Theosophical Society was not established for any such purpose, nor could anyone receive instructions from an adept until he was ripe for it. In other words, he must undergo a long preliminary training in knowledge, self-control, and the subjugation of the lower nature before he would be in any way fit for instruction on the higher planes. What I recommend you to do is to study the elementary principles of Theosophy, and gain some idea of your own nature as a human being and as an individual, but drop entirely all ambition for knowledge of powers which would be inappropriate to your present stage, and to correct your whole conception of Theosophy and Occultism.<\/p><p>ON MASTERS<\/p>", "images": []}, {"pdf_page_index": 214, "pdf_page_number": 215, "label": "Extracts On Theosophy And The T.S.", "html": "<p>I think the way for all western theosophists is through H. P. B. I mean that as she is the T.S. incarnate—its mother and guardian, its creator — the Karmic laws would naturally provide that all who drew this life through her belonged to her, and if they denied her, they need not hope to reach _____, for how can they deny her who gave this doctrine to the western world? They share her Karma to little purpose, if they think they can get round this identification and benefit, and want no better proof that a man does not comprehend their philosophy. This would, of course, bar him from_____ by natural laws (of growth). I do not mean that in the ordinary business sense she must forward their applications or their merits; I mean that they who do not understand the basic mutual relation, who undervalue her gift and her creation, have not imbibed the teaching and cannot assimilate its benefits.<\/p><p>She must be understood as being what she is to the T.S., or Karma (the law of compensation, or of cause and effect) is not understood, nor the first laws of occultism. People ought to think of this: we are too much given to supposing that events are chances, or have no connection with ourselves—each event is an effect of the Law.<\/p>", "images": []}, {"pdf_page_index": 215, "pdf_page_number": 216, "label": "Extracts On Theosophy And The T.S.", "html": "<p>What should be done is to realize that “the Master-Soul is one,” with all that that implies; to know the meaning of the old teaching, “Thou art That.” When this is done we may with impunity identify our consciousness with that of anything in nature; not before. But to do this is a lifetime’s work, and beforehand we have to exhaust all Karma, which means duty; we must live for others and then we will find out all we should know, not what we would like to know.<\/p><p>Devotion and aspiration will, and do, help to bring about a proper attitude of mind, and to raise the student to a higher plane; also, they secure for the student help which is unseen by him, for devotion and aspiration put the student into a condition in which aid can be given to him, though he may, as yet, be unconscious of it. But conscious communication with one’s Master can only be accomplished after long training and study. What a student has to do, and is able to do, is to fit himself to receive this training.<\/p>", "images": []}, {"pdf_page_index": 216, "pdf_page_number": 217, "label": "Extracts On Theosophy And The T.S.", "html": "<p>The recognition from a Guru will come when you are ready, and my advice to you is that, if possible, you put away from your self the desire for such recognition, for such desire will hinder you. If you will read the Bhagavad Gîtâ, especially chapters ii. and iii., I think you will find much to help you. There it says: “Let, then, the motive for action be in the action itself, not in the event. Do not be incited to actions by the hope of their reward . . . perform thy duty . . . and laying aside all desire for any benefit to thyself from action, make the event equal to thee, whether it be success or failure.” It is but natural that a student should hope for recognition from a Master, but this desire is to be put aside, and that work is to be done which lies before each. At the same time, each one knows that the effect follows the cause; hence, whatever our due, we shall receive it at the right time.<\/p>", "images": []}, {"pdf_page_index": 217, "pdf_page_number": 218, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Every Chêla (and we are all that once we determine to be) has these same difficulties. Patience and fortitude! For an easy birth is not always a good one. The kingdom of heaven is taken only by violence, and not by weakness of attack. Your constant aspiration preserved in secret has led you to that point where just these troubles come to all. Console yourself with the thought that others have been in the same place and have lived through it by patience and fortitude. . . . Fix your thoughts again on Those Elder Brothers, work for Them, serve Them, and They will help through the right appropriate means and no other. To meditate on the Higher Self is difficult. Seek, then, the bridge—the Masters. “Seek the truth by strong search,” by doing service, and by enquiry, and Those who know the Truth will teach it. Give up doubt, and arise in your place with patience and fortitude. Let the warrior fight, the gentle yet fierce Krishna, who, when he finds thee as his disciple and his friend, will tell thee the truth and lighten up the darkness with the lamp of spiritual knowledge.<\/p>", "images": []}, {"pdf_page_index": 218, "pdf_page_number": 219, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Attacks cannot hurt: they must needs come, but all we have to do is to keep right on, working steadily, and Masters will see after the rest. For, that which is done in Their name will come right; and this whole thing has arisen because I have chosen to proclaim my personal belief in the existence of these beings of grandeur. So, let us shake again with the confidence born from the knowledge of the wisdom of the Unseen Leaders, and we go forth once more, separately, again to the work, even if not to meet until another incarnation is ours. But, meeting then, we shall be all the stronger for having kept faith now.<\/p><p>I am glad that you have such a faith in the Great Workers who are behind u;. They are behind us, to my personal knowledge, and not behind me only, but behind all sincere workers. I know that their desire is that each should listen to the voice of his inner self and not depend too much on outside people, whether they be Masters, Eastern disciples or what not. By a dependence of that kind you become at last thoroughly independent, and then the unseen helpers are able to help all the more.<\/p>", "images": []}, {"pdf_page_index": 219, "pdf_page_number": 220, "label": "Extracts On Theosophy And The T.S.", "html": "<p>We are all human, and thus weak and sinful. If, in one respect, we are better than others, then, in some other way, they are better than we are. We would be self-righteous to judge others by our own standard. . . . Are we so wise as never to act foolishly? Not at all. . . . Indeed I have come to the conclusion that in this nineteenth century a pledge is no good, because everyone reserves to himself the right to break it, if he finds after a while that it is galling, or that it puts him in some attitude inconsistent with some thing he may have said or done at some other time. . . . In ———‘ s    case, . . . everyone should never think but the very best, no matter what the evidences are. Why, if the Masters were to judge us exactly as They must know we are, then good-bye at once! We would all be sent packing. But Masters deal kindly with us in the face of greater knowledge of our faults and evil thoughts from which none are yet exempt. This is my view, and you will please me much if you are able to turn to the same [view] and to spread it among those on the inside who have it not. It is easy to do well by those we like; it is our duty to make ourselves do and think well by those we do not like. Masters say we think in grooves, and but few have the courage to fill those up and go on other lines. Let us who are willing to make the attempt try to fill up these grooves, and make new and better ones.<\/p>", "images": []}, {"pdf_page_index": 220, "pdf_page_number": 221, "label": "Extracts On Theosophy And The T.S.", "html": "<p>. . . Keep up your courage, faith, and charity. Those who can to any extent assimilate the Master, to that extent they are the representatives of the Master, and have the help of the Lodge in its work. . . . Bear up, firm heart, be strong, be bold and kind, and spread your strength and boldness.<\/p><p>H. P. B. then said that it is by falling and by failing that we learn, and we cannot hope to be at once great and wise and wholly strong. She and the Masters behind expected this from all of us; she and They never desired any of us to work blindly, but only desired that we work unitedly.<\/p><p>H. P. B. wrote me in 1890: “Be more charitable for others than for yourself, and more severe on yourself than on others.” This is good advice. A strain always weakens the fibres and produces friction. I hope all misunderstandings will fly away.<\/p><p>ON OCCULT PHILOSOPHY<\/p>", "images": []}, {"pdf_page_index": 221, "pdf_page_number": 222, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Begin by trying to conquer the habit, almost universal, of pushing yourself forward. This arises from personality. Do not monopolize the conversation. Keep in the background. If some one begins to tell you about himself and his doings, do not take first chance to tell him about yourself, but listen to him and talk solely to bring him out. And when he has finished, suppress in yourself the desire to tell about yourself, your opinions and experiences. Do not ask a question unless you intend to listen to the answer and inquire into its value. Try to recollect that you are a very small affair in the world, and that the people around do not value you at all and grieve not when you are absent. Your only true greatness lies in your inner true self and it is not desirous of obtaining the applause of others. If you will follow these directions for one week you will find they will take considerable effort, and you will begin to discover a part of the meaning of the saying, “Man, know thyself.”<\/p>", "images": []}, {"pdf_page_index": 222, "pdf_page_number": 223, "label": "Extracts On Theosophy And The T.S.", "html": "<p>It is not necessary to be conscious of the progress one has made. Nor is the date in any sense an extinguisher, as some have styled it.[18] In these days we are too prone to wish to know everything all at once, especially in relation to ourselves. It may be desirable and encouraging to be thus conscious, but it is not necessary. We make a good deal of progress in our inner, hidden life of which we are not at all conscious. We do not know of it until some later life. So, in this case, many may be quite beyond the obstacles and not be conscious of it. It is best to go on with duty, and to refrain from this trying to take stock and measuring of progress. All of our progress is in the inner nature, and not in the physical where lives the brain, and from which the present question comes. The apparent physical progress is evanescent. It is ended when the body dies, at which time, if the inner man has not been allowed to guide us, the natural record against us will be a cipher, or failure.” Now, as the great Adepts live in the plane of our inner nature, it must follow that they might be actively helping every one of us after the date referred to, and we, as physical brain men, not be conscious of it on this plane.<\/p>", "images": []}, {"pdf_page_index": 223, "pdf_page_number": 224, "label": "Extracts On Theosophy And The T.S.", "html": "<p>. . . I strongly advise you to give up all yoga practices, which in almost all cases have disastrous results unless guided by a competent teacher. The concussions and explosions in your head are evidences that you are in no fit condition to try yoga practices, for these effects result from lesions of the brain, i.e., from the bursting of the very minute brain cells. I am glad you have written to me upon this matter, that I may have an opportunity of warning you. Also, I advise you to discontinue concentration on the vital centres, which again may prove dangerous unless under the guidance of a teacher. You have learnt, to a certain degree, the power of concentration, and the greatest help will now come to you from concentration upon the Higher Self, and aspiration toward the Higher Self. Also, if you will take some subject or sentence from the Bhagavad Gîtâ, and concentrate your mind upon that and meditate upon it, you will find much good result from it, and there is no danger in such concentration.<\/p>", "images": []}, {"pdf_page_index": 224, "pdf_page_number": 225, "label": "Extracts On Theosophy And The T.S.", "html": "<p>As to the question about the disintegration of the astral body and the length of time beforehand when it could be seen: My answer was not meant to be definite as to years, except that I gave a period of two years as a long one before the death of the physical body. There are cases—perhaps rare—in which five years before the death of the physical, a clairvoyant has seen the disintegration of the astral beginning. The idea intended to be conveyed is that, regardless of periods of time, if the man is going to die naturally (and that includes by disease), the corruption, disintegrating or breaking up of the astral body may be perceived by those who can see in that way. Hence the question of years is not involved. Violent deaths are not included in this, because the astral in such cases does not disintegrate beforehand. And the way of seeing such a death in advance is by another method altogether. Death from old age—which is the natural close of a cycle—is included in the answer as to death by disease, which might be called the disease of inability to fight off the ordinary breaking-up of the cohesive forces.<\/p>", "images": []}, {"pdf_page_index": 225, "pdf_page_number": 226, "label": "Extracts On Theosophy And The T.S.", "html": "<p>You cannot develop the third eye. It is too difficult, and until you have cleared up a good deal more on philosophy it would be useless, and a useless sacrifice is a crime of folly. But here is advice given by many Adepts: every day and as often as you can, and on going to sleep and as you wake—think, think, think, on the truth that you are not body, brain, or astral man, but that you are THAT, and “THAT” is the Supreme Soul. For by this practice you will gradually kill the false notion which lurks inside that the false is the true, and the true. the false. By persistence in this, by submitting your daily thoughts each night to the judgment of your Higher Self, you will at last gain light.<\/p>", "images": []}, {"pdf_page_index": 226, "pdf_page_number": 227, "label": "Extracts On Theosophy And The T.S.", "html": "<p>Now as to The Voice of the Silence,[19] and the cycles of woe (undergone by the Arhan who remains to help mankind), it is easy to understand. You must always remember, when reading such things, that terms must be used which the reader will understand. Hence, speaking thus, it must be said that there are such cycles of woe—from our standpoint—just as the fact that I have no amusements, and nothing but work in the T.S., seems a great penance to those who like their pleasures. I, on the contrary, take pleasure and peace in the “self-denial,” as they call it. Therefore, it must follow that he who enters the secret Path finds his peace and pleasure in endless work for ages for Humanity. But, of course, with his added sight and knowledge, he must always be seeing the self-inflicted miseries of men. The mistake you make is to give the person thus “sacrificed” the same small qualities and longings as we now have, whereas the wider sweep and power of soul make what we call sacrifice and woe seem something different. Is not this clear, then? If it were stated otherwise than as the Voice has it, you would find many making the vow and then breaking it: but he who makes the vow with the full idea of its misery will keep it.<\/p>", "images": []}, {"pdf_page_index": 227, "pdf_page_number": 228, "label": "Extracts On Theosophy And The T.S.", "html": "<p>If we can all accumulate a fund of good for all the others we will thus dissipate many clouds. The follies and the so-called sins of people are really things that are sure to come to nothing if we treat them right. ‘We must not be so prone as are the people of the day, of whom we are some, to criticize others and forget the beam in our own eye. The Bhagavad Gîtâ and Jesus are right in that they both show us how to do our own duty and not go into that of others. Every time we think that someone else has done wrong we should ask ourselves two questions:<\/p><p>(1) Am I the judge in this matter who is entitled to try this person?<\/p><p>(2) Am I any better in my way? Do I, or do I not offend in some other way just as much as they do in this?<\/p><p>This will settle the matter, I think. And in . . . there ought to be no judgments and no criticism. If some offend, then let us ask
