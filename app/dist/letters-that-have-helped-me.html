l, as Mohini will be able to communicate with ______. Mohini is coming for the purpose of instructing these Londoners.<\/p>", "images": []}, {"pdf_page_index": 343, "pdf_page_number": 344, "label": "London And Paris Letters", "html": "<p>‘Well, another week has passed by, and I am really further back than I ever was. The magnetic atmosphere of London is horrible. There is a place on the Strand on my way up here which I located this morning, where a wave of despair just overwhelms me, and I keep it after that nearly all day, and there is no other way of getting here. And then my dreams are bad. Last night I was watching the sea as it rolled in fiercely upon the shore, and although I was safe, yet I do not like it. Then I was among rivers that had dried up almost, leaving poor fishes gasping. The only redeeming feature was that I had a lot of birds. Then I slept again and met my sister A. and asked her what those dreams meant. She said, “They mean well, or that you will spoil your business, or your aims by your own acts.” Curious, wasn’t it?<\/p><p>Sunday in London is dull. Such is the respect for the day that by law all the public houses are shut during church hours, and all the underground trains stopped. Then, with church over, all the gin palaces are wide open again, and everything goes on in full vigor. What hypocrisy is this! I suppose that they are afraid that the working classes may disturb their worship of the most High God, if the public houses were allowed to be open. After that worship is over, and all the silk and broadcloth has gone home, the poor people may revel and drink as they like, and then go to the abbey for the evening service.<\/p>", "images": []}, {"pdf_page_index": 344, "pdf_page_number": 345, "label": "London And Paris Letters", "html": "<p>I went there last night at 7 and was soon flanked by an old habitué of gin shops, whose liquor-laden breath mingled with the strains of the music and the voice of the preacher, so that I began to fancy I was in a cell with a roystering keeper, while the priests and boys passed my cell-window chanting.<\/p><p>Such are the softening influences of English civilization and municipal regulations. Here was this drinking man actually listening in the sacred Abbey to the platitudes of Rev. Canon Maurice Spence, who was dilating upon the necessity of the well-to-do making sacrifices for the poor, while he, the Rev. Canon, no doubt went home every evening to his chops and ale.<\/p><p>What, a Canon drink ale? Why, of course. Everyone here drinks ale or beer and eats chops eternally. The English phrase is either “Let us go and kill something,” or “Let us have a chop and some bitters.” For my part, considering this love for beer, I cannot understand why the English and Germans have not long ago consolidated with beer for a basis. I presume the reason is the difficulty of drinking beer and talking German at the same time.<\/p>", "images": []}, {"pdf_page_index": 345, "pdf_page_number": 346, "label": "London And Paris Letters", "html": "<p>I went over to see M——y[33] at 11:30 . . . M——y is now well off, his father having died leaving him means. He has given up the law and studies philosophy. He has known H. P. B. and occultism as long as I have and hesitates about India. I asked him why, today, and he says there are so many dubious things about it for him. He knows the voyage is not much, but is afraid after getting there he would find out nothing whatever, they seem to dislike English and Americans so much. His trip to America in 1875 was taken solely from reading Olcott’s People from the Other World, and in order to see the Eddies. It was then that he met H. P. B.<\/p><p>No news yet from Olcott or the native. I walked over to M—y’s from the hotel and it took me forty minutes. I went along the Thames embankment, across by the Abbey and Parliament House and down Victoria street, The way was fine and the walk delightful. All along I was thinking of you and wishing you were with me.<\/p><p>This letter goes tomorrow, Thursday—so I will drop it now as I am going out with Thomas.<\/p><p>This paper I am writing upon is the last of my acquisitions through my South American speculations. Behold, then, the result of much weariness of spirit and much investment of money.<\/p><p>Yesterday I went to the British Museum, and found that the building, like nearly every other one in London, is hidden from view as you approach it.<\/p>", "images": []}, {"pdf_page_index": 346, "pdf_page_number": 347, "label": "London And Paris Letters", "html": "<p>It is a fine building, standing in front of Russell Street, and you could walk within two blocks of it, as I have done several times, and not know it was there. I assure you that had I been aware it was there, I should have visited it several times. As it is not furnished with a dome as St. Paul’s, it is not caught by the eye from a distance. The Street coming up in front of it is Museum St., and is very narrow indeed, so that as you come along all that you see is a small part of the vestibule. Museum Street leads into old Drury Lane. one of the most tortuous, narrow, old streets that I know of.<\/p><p>Outside on the steps are placed two New Zealand stone gods presented by Queen Victoria, Inside the door you have to leave cane and umbrella, and can buy, if you wish, the general catalogue— of which I send by this mail a copy to you—or any number of special ones.<\/p>", "images": []}, {"pdf_page_index": 347, "pdf_page_number": 348, "label": "London And Paris Letters", "html": "<p>You pass up the flight of stairs on the left, along which are placed a lot of East India bas reliefs from the Buddhist Temple of Amravati. This interested me very much, and I spent a good deal of time I knew I could spare from the Greek Gallery, in examining the figures and their attitudes. The collection of Indian articles is not large, but the Assyrian and Egyptian collections are very large and splendid. There are some corridors filled with these objects, such as statues, coffins, etc., and the impression made upon the mind is very solemn indeed. These enormous stone sarcophagi and colossal statues fill one with awe as well as admiration for the people who made them. I felt more at home there than I did in any other part of it. There was one enormous reddish stone arm and hand 16 feet from the shoulder to the fist. Just think of the whole of which it was but the arm! As one looked at the colossal black granite figure of the guardian of one of the gates of the lower world, the imagination ran back to the glorious past of Egypt, when that statue sat silent and motionless in the hall of the temple, while the processions of priests went by, or while their incantations evoked to view the elemental shapes of which the statue was but a copy. Oh, how I longed to have you there with me that you might relate what dim shapes you would see flitting about, harmless, sad, wondering where the past had gone; questioning why the rites of the ancient days proceeded no more, and looking with still greater wonder upon us, the modern barbarians.<\/p>", "images": []}, {"pdf_page_index": 348, "pdf_page_number": 349, "label": "London And Paris Letters", "html": "<p>There were no dire or evil influences there, and my sleep was not as much disturbed afterward as it often is by the things I succeed in taking over from the Theosophical Fellows.<\/p><p>I want very much to learn what is the connection between me and you and Egypt’s past.<\/p><p>I felt quite at home also in another gallery or stairs, where the Egyptian Book of the Dead is, and where I could see the same figures as you find on that little panel I painted you.<\/p><p>The mummy room was also intensely interesting. What thoughts crowd upon one in such a place! How you realize the vanity of human life and the constant turning of the great wheel of the universe, in the rapid and rushing river of Time. There on a shelf is the arm and hand of some being who lived so many centuries ago.<\/p><p>After dinner I stopped in to a tailor’s on Ludgate Hill and ordered a pair of trousers costing $4. They would be $10 in N. Y. You don’t care about that, but it is an item of news!<\/p>", "images": []}, {"pdf_page_index": 349, "pdf_page_number": 350, "label": "London And Paris Letters", "html": "<p>Went over to S.’s last eve in response to the enclosed letter which I send you. Found there himself, his wife and Madam Gebhard. He had another letter from Olcott saying they had sent ahead of them to London Sorabjé Padshah, a native and chela whom he asked him to meet. S.’s object in sending for me was to ask me to take the young man with me, which I will do gladly. S. said of course he would meet him, but he couldn’t imagine why they sent him, nor what they expected him to do, Now my idea (which I carefully concealed) is that they are sending him so as to try S., and already S., in advance, does not do the hospitable thing.<\/p><p>The idea of a Londoner leaving a stranger the task of selecting a place for a Hindu, who, of course, is a strict vegetarian. He cannot get on as I can, and it is ridiculous to propose putting him in my hotel. I suggested a room for him near S. ‘s house, and he replied that that was a vague thing. Well, it is vague in that he would have to select it.<\/p><p>He used up a good part of the evening in a discourse as to what name the grandsons of the Duke of Edinburgh would be able to bear. Of course that is all right, but it seems to me there is but little time to spare for such discussions.<\/p>", "images": []}, {"pdf_page_index": 350, "pdf_page_number": 351, "label": "London And Paris Letters", "html": "<p>I did not go to S.’s dinner last night and refused an invitation to dine there tonight on plea of previous engagement. I asked him about his sight of K. H. and he related this: “He was lying in his bed in India one night, when suddenly awakening, he found K. H. standing by his bed. He rose half up, when K. H. put his hand on his head, causing him to fall at once back on the pillow. He then, he says, found himself out of his body, and in the next room, talking to another adept whom he describes as an English or European, with light hair, fair, and of great beauty. This is the one Olcott described to me in 1876 and called by name ______ Please erase that when read. I think it is also the one you have seen and called English, with light hair. S. says he is very high. He described K. H. as looking then not exactly like the picture now in his possession, but with some resemblance to it. .<\/p><p>Now am I not a good correspondent? Since February 27th have not met a congenial soul save Thomas, and he does not reach up to your elbow in sympathy with me. Surely I will never meet again three souls so kind to me as you three, and never again one like yours, until I meet myself. Good-night.<\/p><p>March 20th. Good morning. No further news from Olcott or the rest. Give my love to the other two sides of the triangle. I will consign this as it is to the mails, and write you again Saturday. And I ever remain,<\/p><p>Your Brother, WILL<\/p>", "images": []}, {"pdf_page_index": 351, "pdf_page_number": 352, "label": "London And Paris Letters", "html": "<p>Yesterday I spent a few hours in Hyde Park walking along Rotten Row, and looking at the blood roll by. It was very common in appearance. The best people are away, they say, but I saw enough to show what the average of beauty is here.<\/p><p>The Albert Memorial is here with those groups at the corner that have been so much photographed and distributed over America. It is very homely on the whole: too much gilt and colors. Prince Albert is seated, colossal in size, all gold from head to foot, in a gold chair inside of a little temple. However, as a memorial, it is a magnificent thing. The next thing for her Imper. Majesty to do now is to put up a memorial to John Brown.<\/p><p>Telegraphed Olcott to Nice yesterday and just got reply. It is now 11 A. M. He says to meet him in Paris on the 27th and that a letter follows the telegram. Well, this is some encouragement for a weary pilgrim, especially as said pilgrim is getting blue.<\/p><p>You can easily see how blue I was getting with the surroundings here.<\/p><p>Oh, how I wish I was out of this. London is horrid. Too much beef and beer. I walk about in a mental cloak, and do not care either to see or hear.<\/p><p>There is no more for me in London, so my next epistle will be from Paris.<\/p><p>W.Q.J.<\/p><p>—————<\/p>", "images": []}, {"pdf_page_index": 352, "pdf_page_number": 353, "label": "London And Paris Letters", "html": "<p>[It the end of March, 1884, Madame Blavatsky, Col. Olcott, and the young Hindu, Mohini Chatterjee, arrived in Paris from India. The fourth member of the party was Babula, a young Hindu, who was the special attendant of Madame Blavatsky. Mr. Judge was at the station to greet them on their arrival, and he remained several months in the house with them, working on the revised edition of Isis Unveiled which became the Secret Doctrine, then being prepared for publication.—Eds.]<\/p><p>I have been here now since the 25th (March), and H. P. B. arrived on the 28th. Crowds of people have been here constantly, and, therefore, I have not been able to have any long private conversations with her. I have had some talks with her and can tell you now that I have confirmation of much that has occurred. She told me independently and voluntarily that the Master had told her In India, that he was doing, or “about to do something with and for me.”<\/p><p>*     *    *     *     *<\/p><p>I am happy to be able to send you the first confirmation of the truth of the experience and messages had in ______, and I expect to send you the picture of the young Hindu who came there— also that there is an English Adept or European with rather light hair, who is very high. This first young man is a friend of Mohini, and has been studying for many years. I described him hypothetically to Mohini, who rushed for his bag and got me a picture and said that was the one.<\/p><p>—————<\/p>", "images": []}, {"pdf_page_index": 353, "pdf_page_number": 354, "label": "London And Paris Letters", "html": "<p>I feel quite strongly that I will stay here quite a while, and probably go back to London.<\/p><p>—————<\/p><p>Although I wrote you yesterday, I cannot resist the temptation to write again today because I am sending off so many letters to the U. S. in today’s mail. For several days, until yesterday, I have had the most awful blues that ever were. So bad indeed that H. P. B. was very much worried. It seemed impossible to stave them off, and as they were accompanied with an uncontrollable desire to weep, I was in a bad way. She said I had got into my past current, and also that in going about I had absorbed some old elementaries which she saw about me. She gave me to wear all day her talisman ring, which is of great value and strength. It has a double triangle and the Sanscrit for “life” on it. This helped me, but all the while I felt that something was to be done by me.<\/p><p>It is a hard road, and each soul must travel and work to grow strong. This point in my career I feel is a turning point, and I hope to turn it with advantage. I trust you are not the cause of my depression, although if so that is better than any other cause. It has seemed to be from without. Give my love to the beloved ones, and keep me in kind remembrance.<\/p>", "images": []}, {"pdf_page_index": 354, "pdf_page_number": 355, "label": "London And Paris Letters", "html": "<p>I sent you the other day a rough sketch, being a resemblance to Mahatma M and I inclose to you a photograph of Madame, Subba Row and Dabajeri Nath, or Babaji, as they call him, at headquarters. He is not always at headquarters. S. told me there was something mysterious about him. Mohini told me also that he was far advanced, and can easily leave his body at will.<\/p><p>I telegraphed you yesterday that my address for a month would be American Exchange, Paris, as I am ordered by the Masters to stop here and help Madame in writing the Secret Doctrine, which you see advertised in the Theosophist.<\/p>", "images": []}, {"pdf_page_index": 355, "pdf_page_number": 356, "label": "London And Paris Letters", "html": "<p>To resume with coherency. After the first hurry was over here, I said I had to go to India at once. Olcott thought I had better stay with H. P. B., and so did she. But I said that all the orders I had were to go to India, and without further ones I was going, and so she said I was probably right; and then it was decided that I would wait here until 0. could get me a steamer in London where he went on the 5th. All was thus arranged definitely. But the next morning, as I was sitting in the bedroom with Mohini, in which he and I slept, and after we had been there about an hour after coffee, Olcott came from his room, which was at the other end of the hall, and called me out, and told me privately that the Master had been then to his room and had told him that I was not to go yet to India, but to stay and help H. P. B. on the Secret Doctrine. By the way, my fate is mixed up with Isis Unveiled. I helped her on that, and, as she reminded me yesterday, I suggested the use of the word “elemental” to make the distinction clear between them and the “elementaries.” As she said, “That was your word, Judge.” It shows she is not ungrateful, nor like so many who are unwilling to concede what they are indebted to others for.<\/p>", "images": []}, {"pdf_page_index": 356, "pdf_page_number": 357, "label": "London And Paris Letters", "html": "<p>Mohini and I had not yet left our rooms and H. P. B. was still in bed. Perfectly convinced after a few minutes that 0. was right, especially as the afternoon before I had had an intuition of it in the street, I returned to our room and told Mohini nothing. But after about half an hour he looked up and said, “Judge, I believe your Master has been in the house this morning for some purpose.” I then told him of the change of plan, and he said, “it must be right.”<\/p><p>So then, here I am for how long or short I do not know, and I am to make suggestions and write upon the work. So, see my fate again linked with the second working up of Isis. In this place you will remember her letter of last June that my fate was indissolubly linked with that of theirs (the ... ).<\/p><p>I am now able to give you proofs of the Adepts from these Hindus who know and revere them.<\/p><p>I find, also, that I was right in insisting on the Bhagavad Gita. Mohini says he reads it all the time, and does not yet understand it. Those commentaries which he shall make for me I will give to you. But let me again insist upon your trying to realize in your selves that you are a part of the All. That is the constant subject of meditation, and will bring the best and most rapid progress.<\/p>", "images": []}, {"pdf_page_index": 357, "pdf_page_number": 358, "label": "London And Paris Letters", "html": "<p>Furthermore, too much must not be expected of the Mahatmas. They cannot interfere with Karma; and so, if a man starts out to them, they say, “Try.” If he fails he has done so on his own judgment. It does not follow that they are always helping him because he has made himself a chela. Of course, there are those whose Karma is such that they are helped. But it is not right to suppose, as some do, that because they are chelas they can therefore go into a den of lions and be safe. Of course, if the Master sends one, then he will protect.<\/p><p>Another thing. As I told D. the spleen is the seat of Astral or Vital air or life. It radiates its power in curves the same as those which are made by the magnet upon filings of iron on paper. There are five centers beginning at the spleen and ending at the point on the forehead just above the nose. When you can straighten all these curves out, then you project your double. This is how you can do it. I spoke with him about meditation, and he says we should try to realize first intellectually, and then transmute the knowledge into ourselves, so that it becomes a part of ourselves.<\/p><p>We say we are a part of the All. Well, we must intensely meditate upon that until we begin to realize it, and from then we will receive instruction.<\/p>", "images": []}, {"pdf_page_index": 358, "pdf_page_number": 359, "label": "London And Paris Letters", "html": "<p>We have had a lot of talk and I cannot now go into all, as I have no time today. But I think he has confirmed me in my old views of the matter, and shown me that where I have erred has been in not being faithful enough to my own convictions, not only as to what to believe, but also as to how to believe and meditate. He also says that there can be no doubt of the truth of those Maji messages and that he thinks they have the stamp of the Master, Mohini says he is sent here to try to straighten out the difficulties in the societies, but he is left more or less to his own judgment.<\/p><p>If he errs he will hear of it, but not always so if he is right. This is proper, or else the judgment would not be formed, the Brother hood would become merely the Gods of the Church to us, and we would be like little children who could not walk without assistance.<\/p><p>There is an answer to that question whether the Masters love anyone, which I will tell you.<\/p><p>Mahatma wrote in a letter referring to Mrs. K.,[34] who is causing the row in London, “that her efforts for the poor animals in regard to vivisection have gained her consideration from the Chohan.” The Chohan, as you know, is the Guru of the Adepts. If those are their sentiments, surely they love human beings.<\/p>", "images": []}, {"pdf_page_index": 359, "pdf_page_number": 360, "label": "London And Paris Letters", "html": "<p>No doubt it will interest you to tell you of a remark Mohini dropped. It was the other night while we were talking of the calumnies circulated by many people respecting fraud. He said, “Well, there is one fortunate thing and that is, that I saw the Master before I ever heard of the Theosophical Society.”<\/p><p>I must give you a little hint he gave me about Karma and Devachan, that is not in Sinnett’s book, but ought to be. There it is only given that you take your good Karma to Devachan, and the other waits for you. That slightly bothered me and many others. He (Mohini) says you take both with you, but the bad has no opportunity there to exercise itself and remains quiescent until you return, when it begins to work, Of course, you must remember the terms used here are indefinite, and that included in “bad Karma” is “good” material Karma. For, in saying “bad Karma,” I mean the Karma which works out in physical life whether it be a good or a bad Karma, and in saying “good Karma in Devachan,” I mean that good or spiritual Karma which can only be worked out in Devachan.<\/p><p>He tells me, also, that there are many errors in that Bhagavad Gita I sent you, and now I see that it is Thompson’s and not Hurrychund’s translation. Turn to the first chapter, 1st verse, and correct it to read as follows:<\/p>", "images": []}, {"pdf_page_index": 360, "pdf_page_number": 361, "label": "London And Paris Letters", "html": "<p>“What doeth the lower parts of man’s nature which holds thirst for renewed life, and his other or spiritual parts, who are assembled for the purpose of fighting in the body which is acquired by Karma, Sanjaya?<\/p><p>“Oh, Brahma, what is this mystery which takes place every night? When lying on the matting, the eyes closed, the body is lost sight of, and the soul escapes to enter into conversation with the ancestors (pitris). Watch over it, Brahma, when forsaking the resting body it goes away to hover over the water, to wander in the immensity of heaven and penetrate into the dark and mysterious nooks of the valleys and grand forests of the blessed Himavat (Hymalayas).”<\/p><p>This, it seems to me, is our work just now. Let us deserve and then desire.<\/p><p>It is quite a task, this selecting and collating from the matter of Isis so that all may be preserved, and all useless matter expunged. For this work you are peculiarly fitted; and even if you worked at it with the intention of returning to New York, that would be a good Karma for you. I am fitted also for certain portions of the work, and together we would revel in knowledge and advance hand in hand along that path.<\/p><p>N. went away at night and then for about an hour the Masters sent messages through H. P. B. in the parlor, questions to me to try her. Each message made a distinct effect upon my skin before she repeated it.<\/p>", "images": []}, {"pdf_page_index": 361, "pdf_page_number": 362, "label": "London And Paris Letters", "html": "<p>She says that when I started for Mexico, one of the Masters said: “Why does he go there; I do not like that.” But my Master merely looked at me and smiled.<\/p><p>On the fifth Olcott and Mohini left for London, leaving Madame and me here, as she had been ordered not to go to London. We went through the day and in the evening were sitting together in the parlor alone, talking very seriously of old times.<\/p><p>As we sat there I felt the old signal of a message from the Master and saw that she was listening. She said: “Judge, the Master asks me to try and guess what would be the most extraordinary thing he could order now?” I said, “That Mrs. K. should be made the President of the London Lodge.” Try again. “That H. P. B. should be ordered to go to London.” That was right and he ordered her to take the 7:45 express, giving the exact hours it would arrive at the different stations and in London—all of which was correct, and we had no time table in the house. She disliked the order awfully and I can tell you, knowing her ill health and present unwieldly size, it was an awful journey. But last night I took her to the station and saw her go off in the train with a little hand bag. There is some peculiar object in this, as she might have gone with Olcott. She was ordered to stay in London only 24 hours, and will return here on Wednesday.<\/p>", "images": []}, {"pdf_page_index": 362, "pdf_page_number": 363, "label": "London And Paris Letters", "html": "<p>All the time she confessed her inability to see why she was ordered, as the Londoners will think it done for effect after her refusal to go then, and Olcott, when he sees her, will certainly feel like swearing. But the London situation is serious, and maybe they intend to work some phenomena there for some good end. So I am left here alone in this house, and am going to work a little on the book.<\/p><p>Let me go back to the change of orders about me. Mind, we had decided I was going to India, and the letters were posted to Damodar and several others to that effect by both Olcott and myself and H. P. B.<\/p><p>I am deep among Counts, Countesses and Duchesses. Called on Countess d’Ademar yesterday, who is a Kentucky girl. Lady Caithness Duchess de Pomar is to be here in a few days, and has requested the infinitude of pleasure to be derived from my company. And so things go.<\/p>", "images": []}, {"pdf_page_index": 363, "pdf_page_number": 364, "label": "London And Paris Letters", "html": "<p>I will give you a short account of the last week. After Olcott left, Madame left also, as I told you, I remaining here with Babula, Mme,’s servant. He is a Hindu boy she picked up five years ago. She taught him French; he already knew English and Hindustani, He is a genuine servant and a good boy. When she is here he sleeps on the floor outside her door. He now waits on me at meals. There is a French woman to cook and fix up the rooms. She has an easy time. In the morning I have coffee and bread; at 1 o’clock, rice: at 6, dinner of vegetables. The weather has been cold, and I sit here in this east room with a wood fire in this beastly French fireplace, where two-thirds of the heat goes up the chimney. After Mme. left I had one entire day devoted to the most awfully severe attack of neuralgia any poor devil ever had. The other days I have occupied in going over Isis and making notes and suggestions for the ‘Secret Doctrine.” So have led a hermit’s life, except when I took an hour’s walk, which I did every day.<\/p><p>I have given some time every day to the endeavor to see it——— but I cannot report success. It may not be well for me to go there in spirit, for, not being skilful, I might easily bring back with me influences met there among which could be some very distressing ones. Perhaps this is the explanation of some of my horrible days of distress and despair.<\/p><p>Nothing new as yet. . . . Olcott still in London where they have now two societies, caused by a split in favor of Mrs. K.<\/p>", "images": []}, {"pdf_page_index": 364, "pdf_page_number": 365, "label": "London And Paris Letters", "html": "<p>These last days (12) have been a trial to me. Quite vividly the question of sticking fast or letting go has come up. I believe that I have been left alone to try me. But I have conquered. I will not give up; and no matter what the annoyance or bitterness, I will stand. Last night I opened the Theosophist that Mme. has here, and almost at once came across those articles about chelaship, its trials and dangers. It seemed like a confirmation of my thoughts, and while the picture in one sense was rather dismal, yet they strengthened me. Then there was one passage by Damodar in which he hinted that those whom the Masters themselves selected did not fail. Do you not think—that I may call myself one who was selected? But even if I cannot, it will make no difference to me.<\/p><p>Well, then, goodbye, and may you daily realize more and more the indivisibility of the supreme Spirit which is one with us all.<\/p><p>Do you remember what the Master says about motives? I quote the paragraph lest you have forgotten it.<\/p><p>“Motives are vapors, as attenuated as the atmospheric moisture; and, as the latter develops its dynamic energy for man’s use only when concentrated and applied as steam or hydraulic power, so the practical value of good motives is best seen when they take the form of deeds.”<\/p><p>Now I send this before seeing H. P. B., and will send you just what she says. I have no doubt of all this, nor that Karma has brought us together and will keep us the same.<\/p>", "images": []}, {"pdf_page_index": 365, "pdf_page_number": 366, "label": "Mr. Judge’s Stories", "html": "<p>I never forgetI will never forgetI have never forgottenWhite can never be black.Into the Master’s hand I consign you.<\/p><h3 class=\"pdf-heading\">Mr. Judge’s Stories<\/h3><p>MR JUDGE was never at a loss for a new way to call attention to old truths. Besides the several pseudonyms he employed in the Path—Hadji-Erinn, Murdhna Joti, William Brehon (“Brehon” means Judge in Gaelic), Eusebio Urban, Rodriguez Undiano, and a dozen others he created and used but once—he used the ancient device of the historical allegory. Thus, at intervals from 1885 to 1893, he published ten of these strange tales, using (for all but the first, “A Weird Tale,” which was published in the Theosophist, and which, furthermore, was a recital of contemporary happenings) the name “Bryan Kinnavan.”<\/p><p>In these stories will be discovered both philosophy and history— teachings on the elementals, on symbols, on “borrowed bodies,” and graphic pictures of the Karma of delay, doubt, superstition, and the abandonment of the true religion and practice. Here, also, is an historical account of the final submersion of Atlantis, of the establishment in Ireland of the Lodge, and of the Teachers’ leaving the island at the close of a certain cycle. “The Magic Screen of Time” and “The Skin of the Earth,” in especial, belong with Mr. Judge’s wonderful series, “Conversations on Occultism.”<\/p>", "images": []}, {"pdf_page_index": 366, "pdf_page_number": 367, "label": "An Occult Novel", "html": "<p>Above all, these curious tales are direction, guidance, warning and prophecy for theosophists. Month after month, year after year, in the Path, Mr. Judge strove to bring before the minds of his readers the meaning of the Work they were engaged in, the way it must be carried on—each man for himself as to method, but all men together on the principles of Theosophy. He pointed to pitfalls, described dangers, and gave the formula for surmounting all difficulties: Devotion, Study, Work. Then, from ancient history, he selects the materials for telling the story again.<\/p><p>The “Occult Novel” (or the notes therefor) , which follows the stories[35], is another series of invaluable hints—on violent death, on reincarnation through cloud, rain and seed and thus to man (compare Mr. Judge’s Ocean of ‘Theosophy, page 68), on insanity, and, most important and extensive of all, on borrowed bodies. Of the many ideas for stories among these jottings by Mr. Judge, only one was developed and published— “A Curious Tale.”<\/p><h3 class=\"pdf-heading\">An Occult Novel<\/h3>", "images": []}, {"pdf_page_index": 367, "pdf_page_number": 368, "label": "An Occult Novel", "html": "<p>A TIRELESS worker, Mr. Judge was always proposing new modes of activity. One never knew what fresh idea would emanate from his indefatigable mind. One idea with which he occupied some of his lighter moments, was that of an occult novel. It was his idea that a friend of his should write this, from incidents and material to be furnished by himself, and to this idea he adhered, even having the title copyrighted, with the name of his author, despite the laughing protests of this friend, to whose outcries and statements that she never could, and never should, write a novel, Mr. Judge would smilingly reply: “Oh, yes! You will do it when the time comes.” From time to time he sent to this friend suggestions, incidents and other material for this novel, the same being on odds and ends of paper, often rough wrapping paper, and being jotted down under a lamp-post at night while he waited for his tram, or in court while he waited for the case in which he was engaged to come up. On these scraps are also marginal notes, as he accepted or rejected the ideas of his own prolific mind, These notes are given here as such. It has been suggested that the recipient of these materials should still write the novel as proposed, but setting aside the fact that she could not be sure of properly rendering the real ideas of Mr. Judge, it is also thought that readers will much prefer to have the notes precisely as Mr. Judge set them down.<\/p><p>The printed title-page runs as follows:<\/p><p>IN A BORROWED BODY<\/p>", "images": []}, {"pdf_page_index": 368, "pdf_page_number": 369, "label": "An Occult Novel", "html": "<p>The Journey of a Soul<\/p><p>BY<\/p><p>J. CAMPBELL VER-PLANCK, F.T.S.<\/p><p>1891<\/p><p>The name is filled in in the writing of Mr. Judge, and there is this marginal note. “Copyright gone to Washngn.”<\/p><p>(All “Notes” are to be understood as being marginal ones made by Mr. Judge unless otherwise stated.)<\/p><p>[ JN.]<\/p><p>MEMO. ABOUT Borrowed Body<\/p><p>The point on which it should all turn is not so much reincarnation as the use of a borrowed body, which is a different kind of reincarnation from that of Arnold’s Phra the Phœnician.<\/p><p>This will also give chance to show the other two sorts of reincarnation, e.g. :—<\/p><p>(a) Ordinary reincarnation in which there is no memory of the old personality, as the astral body is new; and:<\/p><p>(b) Exception as to astral body; but similarity of conception to that of ordinary cases, where the child retains the old astral body and hence memory of old personality and acquaintance with old knowledge and dexterity.<\/p><p>A CHAPTER<\/p><p>The Assembling of the Skandhas<\/p><p>On the death of body, the Kama principle collects the Skandhas in space, or at the rebirth of the Ego the Skandhas rush together and assemble about it to go with it in the new life.<\/p><p>ANOTHER<\/p><p>The Unveiling of the Sun<\/p><p>There is the real and unreal Sun. The real one is hidden by a golden vase, and the devotee prays:<\/p><p>“Unveil, 0 Pushan, the true Sun’s face,” etc. A voice (or other) says “thou art that vase” and then he knows that he alone hides the true Sun from himself.<\/p><p>Pushan is the guide and watches on the path to the Sun.<\/p>", "images": []}, {"pdf_page_index": 369, "pdf_page_number": 370, "label": "An Occult Novel", "html": "<p>The eulogy of the Sun and the Soul are enshrined in a golden rose or lotus in the heart which is impregnable.<\/p><p>The theme of the book is not always teacher and pupil.<\/p><p>He first strives for some lives ordinarily and then in one he grows old and wise, and sitting before a temple one day in Madura he dies slowly, and like a dissolving view he sees the adepts round him aiding him; also a small child which seems to be himself, and then thick darkness. He is born then in the usual way. Twice this is repeated, each time going through the womb but with the same astral body.<\/p><p>AN OCCULT NOVEL<\/p><p>Then he lives the third life to forty-nine,[36] and comes again to die and with the same aid he selects a foreign child who is dying.<\/p><p>Child dying. Skandhas collecting, child’s Ego going—left, spark of life low: relatives about bed.<\/p><p>He enters by the way the mind went out and revivifies the body. Recovery, youth, etc., etc.<\/p><p>This is his borrowed body.<\/p><p>MEMO. No. 2<\/p><p>A couple of Incidents for the Book<\/p><p>I. A round tower used by the fire worshippers in Ireland and other isles in early ages. A temple is attached to it; quaint structure—one priest and one neophyte.<\/p><p>People below the tower coming into the temple grounds as the religion is in its decadence.<\/p>", "images": []}, {"pdf_page_index": 370, "pdf_page_number": 371, "label": "An Occult Novel", "html": "<p>On the top of the tower is the neophyte, who in the face of the prevailing scepticism clings to the dead faith and to the great priest. His duty is to keep a fire on the tower burning with aromatic woods. He leans over the fire; it burns badly; the wood seems green; he blows it up; it burns slightly; he hears the voices of the disputers and sellers below; goes to the tower and gazes over while the fire goes slowly out. He is a young man of singular expression, not beautiful but powerful face; intense eyes, long dark hair, and far-gazing eyes of a greyish colour unusual for such hair, Skin clear with a shifting light flowing from it. Sensitive face; blushes easily, but now and then stern. As he still gazes, the fire goes out. Just then a tall old man comes up the stairs and stands upon the tower top at opposite side, looking at the fire and then at the young man and withdraws not his gaze for an instant. It is a sternly powerful drawing look. He is very tall, dark brown eyes, grey hair, long beard. The young man feels his look and turns about and sees the fire out completely, while its last small cloud of smoke is floating off beyond the tower. They look at each other. In the young man’s face you see the desperate first impulse to excuse, and then the sudden thought that excuses are useless because childish, for he knew his duty—to keep the small spiral of smoke ever connecting heaven with earth, in the hope, however vain, that thus the old age might be charmed to return. The old man raises his hand, points away from the tower and says “Go.” Young man descends.<\/p>", "images": []}, {"pdf_page_index": 371, "pdf_page_number": 372, "label": "An Occult Novel", "html": "<p>II. A battle.—In the hottest a young soldier armed to the teeth, fighting as if it made no matter whether he win or lose, die or live. Strange weapons, sounds and clouds.<\/p><p>Wounded, blood flowing. It is the young man of the tower. He sinks down, taken prisoner. In a cell, condemned, for they fear his spiritual power. Conflict between the last remnant of the old religion and the new, selfish faith.<\/p><p>Taken to his execution. Two executioners. They bind him standing and stand behind and at side; each holds a long straight weapon with a curved blunt blade, curved to (fit?) about the neck. They stand at opposite sides, place those curved blunt blades holding his neck like two crooks. They pull—a sickening sound: his head violently pulled out close to the shoulder leaves a jagged edge. The body sways and falls. It was the way they made such a violent exit for a noble soul as they thought would keep it bound in the astral earth sphere for ages.<\/p><p>III. That young man again. He approaches an old man (of the tower). Young one holds parchments and flowers in his hand, points to parchments and asks explanation. Old one says, “Not now; when I come again I will tell you.”<\/p><p>Note.—Keep this, Julius.<\/p><p>W. Q. J.<\/p><p>Z.L.Z.<\/p><p>The next batch of notes is headed by the single word: “Book.” Then follow four lines of shorthand. After these the words:<\/p><p>“Incidents showing by picture his life in other ages; the towers; the battle; the death: the search for knowledge and the sentiment expressed in the flowers.”<\/p>", "images": []}, {"pdf_page_index": 372, "pdf_page_number": 373, "label": "An Occult Novel", "html": "<p>Eusebio Rodriguez de Undiano[37] was a notary in Spain who found among the effects of his father many old parchments written in a language which was unknown to him. He discovered it was Arabic, and in order to decipher them learned that tongue. They contained the story.<\/p><p>Note.—No initiates; Lytton only.<\/p><p>Fusebio de Undiano is only one of the old comrades reborn in Spain who searches likes Nicodemus for the light.<\/p><p>Note.—Yes.<\/p><p>Ensebio de Undiano finds in his father’s parchments confirmation of what the possession of the body has often told him.<\/p><p>Note.—Yes.<\/p><p>This person in the body never gave his name to anyone and has no name.<\/p><p>An autobiographical story? No? Yes! Related by one who was struck; by an admirer who suspected something? No; because that is hearsay evidence; the proof is incomplete, whereas he relating it himself is either true, or a mere insane fancy. It is better to be insane than be another’s tool.<\/p><p>Stick to the tower and the head-chopping business. Let him be that young man and after the head loss he wanders in Kama Loca and there he sees the old man who was killed on the tower soon after the fire went out. The old man tells him that he will tell all when they return to earth.<\/p>", "images": []}, {"pdf_page_index": 373, "pdf_page_number": 374, "label": "An Occult Novel", "html": "<p>He wanders about the tower vicinity seeking a birth, until one day he sees vague shapes suddenly appearing and disappearing. They are not dressed like his countrymen down below on the earth. This goes on. They seem friendly and familiar, the one requesting him to go with them, he refuses. They are more powerful than he is, yet they do not compel him but show him their power. One day one was talking to him; he again refuses unless something might show him that he ought to go. Just then he hears a bell sound, such as he never heard before. It vibrates through him and seems to open up vistas of a strange past and in a moment he consents to go.<\/p><p>They reach Southern India and there he sees the old man of the tower, whom he addresses, and again asks the burning question about the parchment. The old man says again the same as before and adds that he had better come again into the world in that place.<\/p><p>The darkness and silence. The clear, hot day. The absence of rain. After listening to the old man he consents inwardly to assume life there and soon a heavy storm arises, the rain beats, he feels himself carried to the earth and in deep darkness. A resounding noise about him. It is the noise of the growing plants. This is a rice field with some sesamum in it. The moisture descends and causes the expanding; sees around, all is motion and life. Inclosed in the sphere of some rice, he bemoans his fate. He is born in a Brahmin’s house.<\/p>", "images": []}, {"pdf_page_index": 374, "pdf_page_number": 375, "label": "An Occult Novel", "html": "<p>Note.—Shall the question of reincarnation—through cloud and rain and seed, and thus from the seed of the man—be gone into?<\/p><p>He is the young man. He knows much. He dies at nineteen. Strange forms around his bed who hold him. They carry him back to the land of the towers. He recognizes it again and sees that ages have passed since the fire went out, and in the air he perceives strange shapes and sees incessantly a hand as of Fate, pointing to that Island. The towers are gone, the temples and the monuments. All is altered. They take him to a populous city and as he approaches he sees over one house a great commotion in the air. Shapes moving. Bright flashes, and puffs as of smoke. They enter the room, and on the bed is the form of a young boy given up to die, with relatives weeping. His guides ask him if he will borrow that body about to be deserted and use it for the good of their Lodge. He consents. They warn him of the risks and dangers.<\/p><p>The boy’s breathing ceases and his eyes close, and a bright flash is seen to go off from it (the body). He sees the blood slowing down. THEY push him, and he feels dark again. Boy revives. Physician takes hope. Yes; he will recover, with care.” He recovers easily. Change in his character. Feels strange in his surroundings, etc.<\/p>", "images": []}, {"pdf_page_index": 375, "pdf_page_number": 376, "label": "An Occult Novel", "html": "<p>The place in India where he went after death which was again sudden (how?). A large white building. Gleaming marble. Steps. Pillars. A hole that has yellowish glow that looks like water. Instruction as to the work to be done, and the journey to the land of the tower, in search of a body to borrow. As to bodies being deserted by the tenant that might live if well understood and well connected with a new soul. The difference between such a birth and an ordinary birth where the soul really owns the body, and between those bodies of insane people which are not deserted, but where the owner really lives outside. Bodies of insane are not used because the machine itself is out of order, and would be useless to the soul of a sane person.<\/p><p>Note.—Julius; keep these. I will send them now and then. But before you go away, return to me so I can keep the run of it. May change the scheme. The motive is in the title I gave you.<\/p>", "images": []}, {"pdf_page_index": 376, "pdf_page_number": 377, "label": "An Occult Novel", "html": "<p>Note one who has not consciously lived the double life of a man who is in the use and possession of a body not his own can know the agony that so often falls to one in such a case. I am not the original owner of this body that I now use. It was made for another, and for some little time used by him, but in the storm of sickness he left It here to be buried, and it would have been laid away in the earth if I had not taken it up, vivified its failing energies and carried it through some years of trial by sickness and accident. But the first owner had not been in it long enough to sow any troublesome seeds of disease; he left a heritage of good family blood and wonderful endurance. That he should have left this form so well adapted for living, at least seems inconceivable, unless it was that he could not use it, sick or well, for any of his own purposes. At any rate it is mine now, but while at first I thought it quite an acquisition there are often times when I wish I had not thus taken another man’s frame, but had come into life in the ordinary way.<\/p><p>A COUPLE OF INCIDENTS FOR THE BOOK<\/p><p>Incident of the letter and picture.<\/p><p>There was a very curious old man (sufficient description to add).<\/p>", "images": []}, {"pdf_page_index": 377, "pdf_page_number": 378, "label": "An Occult Novel", "html": "<p>Sent a small cardboard in which was a picture, a head, and over it appeared to be placed a thin sheet of paper, gummed over the sides to the back. He asked if I could tell him anything of the picture which was visible through the thin paper, Having great curiosity, I lifted up the thin paper, and at once there seemed to be printed off from its underside a red circle surrounding the head on the board. In one instance this circle turned black and so did the entire inside space including the head which was then obliterated. In the other the red circle seemed to get on fire inward, and then the whole included portion burned up. On examining the thin paper on underside there were traces of a circle, as if with paste.<\/p><p>He laughed and said that curiosity was not always rewarded.<\/p><p>Took it to several chemists in Paris, who said that they knew of no substance that would do this. The old chemist in Ireland said a very destructive thing called Fluorine might be liberated thus and do it, but that it was only a thing with chemists and analysts.<\/p><p>(Note by the compiler.—In his travels Mr. Judge met many strange people and saw some extraordinary sights. Now and again he would tell one of these to be included in the novel, but just in this unfinished and vague way. When asked to tell more, he would smile and shake his head, saying: “No. No—little brothers must finish it.”)<\/p><p>Another Incident<\/p>", "images": []}, {"pdf_page_index": 378, "pdf_page_number": 379, "label": "An Occult Novel", "html": "<p>The temple on the site of the present city of Conjeveram was about to be consecrated, and the regular priests were all ready for the ceremony. Minor ceremonies had taken place at the laying of the cornerstone, but this was to exceed that occasion in importance. A large body of worshippers were gathered not for the gratification of curiosity, but in order to receive the spiritual benefits of the occasion, and they filled the edifice so that I could not get inside. I was thus compelled to stand just at the edge of the door, and that was, as I afterwards found out, the best place I could have selected if I had known in advance what was to take place. A few days before, a large number of wandering ascetics had arrived and camped on a spot near the temple, but no one thought much of it because used to seeing such people. There was nothing unnatural about these men, and all that could be said was that a sort of mysterious air hung about them, and one or two children declared that, on one evening, none of the visitors could be found at their camp, nor any evidence that men had been there. But they were not believed, because the ascetics were there as usual the next morning. Two old men in the city said that the Visitors were Devas in their “illusionary form,” but there was too much excitement about the dedication to allow of much thought on the subject. The event, however, proved the old men right.<\/p>", "images": []}, {"pdf_page_index": 379, "pdf_page_number": 380, "label": "An Occult Novel", "html": "<p>At the moment when the people in the temple were expecting the priests to arrive, the entire body of ascetics appeared at the door with a wonderful looking sage-like man at their head; they entered the edifice in the usual formal way of the priests and the latter, on arriving, made no disturbance, but took what places they could, simply saying: “They are the Devas.” The strangers went on with the ceremonies, and, all the while, a light filled the building and music from the air floated over the awestruck worshippers.<\/p><p>When the time came for them to go. they all followed the leader in silence to the door. I could see inside, and as I was at the door could also see outside. All the ascetics came to the entrance, but not one was seen to go beyond it, and none were ever perceived by any man in the city again. They melted away at the threshold. it was their last appearance, for the shadow of the dark age was upon the people, preventing such sights for the future. The occurrence was the topic of conversation for years, and it was all recorded in the archives of the city.<\/p><p>IN A BORROWED BODY<\/p><p>I must tell you first what happened to me in this present life, since it is in this one that I am relating to you about many other lives of mine.<\/p>", "images": []}, {"pdf_page_index": 380, "pdf_page_number": 381, "label": "An Occult Novel", "html": "<p>I was a simple student of our high Philosophy for many lives on earth, in various countries, and then at last developed in myself a desire for action. So I died once more, as so often before, and was again reborn in the family of a Rajah, and in time came to sit on his throne after his death.<\/p><p>Two years after that sad event, one day an old wandering Brahmin came to me and asked if I was ready to follow my vows of long lives before, and go to do some work for my old master in a foreign land. Thinking this meant a journey, only, I said I was.<\/p><p>“Yes,” said he, “but it is not only a journey. It will cause you to be here and there all days and years. Today here, to-night there.”<\/p><p>“Well,” I replied, “I will do even that, for my vows had no conditions and master orders.”<\/p><p>I knew of the order, for the old Brahmin gave me the sign marked on my forehead. He had taken my hand, and covering it with his waist-cloth, traced the sign in my palm under the cloth so that it stood Out in lines of light before my eyes.<\/p><p>He went away with no other word, as you know they so often do, leaving me in my palace. I fell asleep in the heat, with only faithful Gopal beside me. I dreamed and thought I was at the bed side of a mere child, a boy. in a foreign land unfamiliar to me, only that the people looked like what I knew of the Europeans. The boy was lying as if dying, and relatives were all about the bed.<\/p>", "images": []}, {"pdf_page_index": 381, "pdf_page_number": 382, "label": "An Occult Novel", "html": "<p>A strange and irresistible feeling drew me nearer to the child, and for a moment I felt in this dream as if I were about to lose consciousness. With a start I awoke in my own palace—on the mat where I had fallen asleep, with no one but Gopal near and no noise but the howling of jackals near the edge of the compound.<\/p><p>“Gopal,” I said, “how long have I slept?”<\/p><p>“Five hours, master, since an Old Brahmin went away, and the night is nearly gone, master.”<\/p><p>I was about to ask him something else, when again sleepiness fell upon my senses, and once more I dreamed of the small dying foreign child.<\/p><p>The scene had changed a little, other people had come in, there was a doctor there, and the boy looked to me, dreaming so vividly, as if dead. The people were weeping, and his mother knelt by the bedside. The doctor laid his head on the child’s breast a moment. As for myself, I was drawn again nearer to the body and thought surely the people were strange not to notice me at all. They acted as if no stranger were there, and I looked at my clothes and saw they were eastern and bizarre to them. A magnetic line seemed to pull me to the form of the child.<\/p><p>And now beside me I saw the old Brahmin standing. He smiled.<\/p><p>“This is the child,” he said, “and here must you fulfil a part of your vows. Quick now! There is no time to lose, the child is almost dead. These people think him already a corpse. You see the doctor has told them the fatal words, ‘he is dead!’<\/p>", "images": []}, {"pdf_page_index": 382, "pdf_page_number": 383, "label": "An Occult Novel", "html": "<p>Yes, they were weeping. But the old Brahmin put his hands on my head, and submitting to his touch, I felt myself in my dream falling asleep. A dream in a dream. But I woke in my dream, though not on my mat, with Gopal near me. I was that boy, I thought. I looked out through his eyes, and near me I heard as if his soul had slipped off to the ether with a sigh of relief. The doctor turned once more and I opened my eyes—his eyes—on him.<\/p><p>The physician started and turned pale. To another I heard him whisper “automatic nerve action.” He drew near, and the intelligence in that eye startled him to paleness. He did not see the old Brahmin making passes over this body I was in and from which I felt great waves of heat and life rolling over me—or the boy.<\/p><p>And yet this all now seemed real as if my identity was merged in the boy.<\/p><p>I was that boy and still confused, vague dreams seemed to flit through my brain of some other plane where I thought I was again, and had a faithful servant named Gopal; but that must be dream, this the reality. For did I not see my mother and father, the old doctor and the nurse so long in our house with the children. Yes; of course this is the reality.<\/p><p>And then I feebly smiled, whereon the doctor said:<\/p><p>“Most marvellous. He has revived. He may live.”<\/p>", "images": []}, {"pdf_page_index": 383, "pdf_page_number": 384, "label": "An Occult Novel", "html": "<p>He was feeling the slow-moving pulse and noting that breathing began and that vitality seemed once more to return to the child, but he did not see the old Brahmin in his illusionary body sending air currents of life over the body of this boy, who dreamed he had been a Rajah with a faithful servant named Gopal. Then, in the dream, sleep seemed to fall upon me. A sensation of falling, falling, came to my brain, and with a start I awoke in my palace on my own mat. Turning to see if my servant was there, I saw him standing as if full of sorrow or fear for me.<\/p><p>“Gopal, how long have I slept again?”<\/p><p>“It is just morning, master, and I feared you had gone to Yamâ’s dominions and left your own Gopal behind.”<\/p><p>No, I was not sleeping. This was reality, these my own do-minions. So this day passed as all days had, except that the dream of the small boy in a foreign land came to my mind all day until the night when I felt more drowsy than usual. Once more I slept and dreamed.<\/p><p>The same place and the same house, only now it was morning there. What a strange dream I thought I had had; as the doctor came in with my mother and bent over me, I heard him say softly:<\/p><p>“Yes, he will recover. The night sleep has done good. Take him, when he can go, to the country, where he may see and walk on the grass.”<\/p>", "images": []}, {"pdf_page_index": 384, "pdf_page_number": 385, "label": "An Occult Novel", "html": "<p>As he spoke I saw behind him the form of a foreign-looking man with a turban on. He looked like the pictures of Brahmins I saw in the books before I fell sick. Then I grew very vague and told my mother: “I had two dreams for two nights, the same in each. I dreamed I was a king and had one faithful servant for whom I was sorry, as I liked him very much, and it was only a dream, and both were gone.”<\/p><p>My mother soothed me, and said: “Yes, yes, my dear.”<\/p><p>And so that day went as days go with sick boys, and early in the evening I fell fast asleep as a boy in a foreign land, in my dream, but did no more dream of being a king, and as before I seemed to fall until I woke again on my mat in my own palace with Gopal sitting near. Before I could rise the old Brahmin, who had gone away, came in and I sent Gopal off.<\/p><p>“Rama,” said he, “as boy, you will not dream of being Rajah, but now you must know that every night, as sleeping king, you are waking boy in foreign land. Do well your duty and fail not. It will be some years, but Time’s never-stopping car rolls on. Remember my words,” and then he passed through the open door.<\/p>", "images": []}, {"pdf_page_index": 385, "pdf_page_number": 386, "label": "An Occult Novel", "html": "<p>So I knew those dreams about a sick foreign boy were not mere dreams, but that they were recollections, and I condemned each night to animate that small child just risen from the grave, as his relations thought. But I knew that his mind for many years would not know itself, and would ever feel strange in its surroundings, for, indeed, that boy would be myself—inside—and he— without—his friends not seeing that he had fled away and another taken his place. Each night I, as sleeping Rajah, who had listened to the words of sages, would be an ignorant foreign boy, until, through lapse of years and effort unremittingly continued, I learned how to live two lives at once. Yet horrible at first seemed the thought that, although my life in that foreign land as a growing youth would be undisturbed by vague dreams of independent power as Rajah, I would always, when I woke on my mat, have a clear remembrance of what at first seemed only dreams of being a king, with vivid knowledge that, while my faithful servant watched my sleeping form I would be masquerading in a borrowed body, unruly as the wind. Thus, as a boy, I might be happy, but as a king miserable, maybe. And then, after I should become accustomed to this double life, perhaps my foreign mind and habits would so dominate the body of the boy, that existence there would grow full of pain from the struggle with an environment wholly at war with the thinker within.<\/p>", "images": []}, {"pdf_page_index": 386, "pdf_page_number": 387, "label": "Biographical Notes", "html": "<p>But a vow once made is to be fulfilled, and Father Time eats up all things and ever the centuries.<\/p><h3 class=\"pdf-heading\">Biographical Notes<\/h3><p>JASPER NIEMAND’S sketch of Mr. Judge’s life has been considerably enlarged in this edition of the LETTERS, by the addition of material taken from her four-part story of W. Q. J., published in AE’s (George Russell’s) Irish Theosophist, beginning in February, 1896. This account she herself evidently summarized when preparing the second book of letters.<\/p><p>Almost all the quotations have been lengthened, also, by reference to the complete texts in the Path Magazine (then beginning its first year under the name Theosophy), where articles on Mr. Judge by his students and friends continued to appear for three months. A few of these have been added here, as well as letters and articles of especial relevance.<\/p><p>Nor would this section be complete without some of W. Q. J.’s own words—the description of his first meeting with Mme. Blavatsky. The relationship thus renewed between H. P. B. and her “friend, brother and son—W. Q. J. speaks for itself.<\/p>", "images": []}, {"pdf_page_index": 387, "pdf_page_number": 388, "label": "William Q. Judge", "html": "<p>It was her eye that attracted me, the eye of one whom I must have known in lives long passed away. She looked at me in recognition at that first hour, and never since has that look changed. Not as a questioner of philosophies did I come before her, not as one groping in the dark for lights that schools and fanciful theories had obscured, but as one who, wandering many periods through the corridors of life, was seeking the friends who could show where the designs for the work had been hidden. And true to the call she responded, revealing the plans once again, and speaking no words to explain, simply pointed them out and went on with the task. It was as if the evening before we had parted, leaving yet to be done some detail of a task taken up with one common end; it was teacher and pupil, elder brother and younger, both bent on the one single end, but she with the power and the knowledge that belong but to lions and sages. So, friends from the first, I felt safe.<\/p><h3 class=\"pdf-heading\">William Q. Judge<\/h3>", "images": []}, {"pdf_page_index": 388, "pdf_page_number": 389, "label": "William Q. Judge", "html": "<p>WILLIAM QUAN JUDGE, son of Alice Mary Quan and Frederick H. Judge, was born at Dublin, Ireland, on April 13th, 1851. His father was a Mason and a student of mysticism. His mother died in early life at the birth of her seventh child. The lad was brought up in Dublin until his thirteenth year, when the father removed to the United States with his motherless children, taking passage on the Inman Liner, “City of Limerick,” which arrived in New York harbour on July 14th 1864. Of the years of ‘William’s childhood there is little to be said, though we hear of a memorable illness of his seventh year—an illness supposed to be mortal. The physician declared the small sufferer to be dying, then dead; but, in the outburst of grief which followed the announcement, it was discovered that the child had revived, and that all was well with him. During convalescence, the boy showed aptitudes and knowledge never before displayed, exciting wonderment and questioning among his elders as to when and how he had learned all these new things. He seemed the same, and yet not the same; he had to be studied anew by his family, and while no one knew that he had ever learned to read,[38] from his recovery in his eighth year, we find him devouring the contents of all the books he could obtain, relating to Mesmerism, Phrenology, Character-Reading, Religion, Magic, Rosicrucianism, and deeply absorbed in the Book of Revelation, trying to discover its real meaning.<\/p>", "images": []}, {"pdf_page_index": 389, "pdf_page_number": 390, "label": "William Q. Judge", "html": "<p>Perhaps the magnetic link so abruptly renewed in his illness was never fully vitalized in the physical sense, for the lad never acquired a strong physique. Without being sickly, he was frail, but indomitable and persevering beyond his years. An anecdote of his boyhood illustrates these traits. He was with other boys upon the bank of a stream. His companions swam to an island a little way off from the bank, from which vantage-ground they jeered and mocked their younger comrade, who could not swim. The small William’s heart rose hot within him; he plunged into the water, resolved to get to that island or perish. When out of his depth he let himself sink, touched bottom, ran a few steps on the river’s bed, rose, of course, kicked, sank, took a step and another, repeated the process, and thus struggling, rising, sinking, scrambling, and, above all, holding his breath, he actually reached the margin of the island, to be drawn out, half unconscious, by his astonished play-fellows. Nothing could be more characteristic of Mr. Judge.<\/p>", "images": []}, {"pdf_page_index": 390, "pdf_page_number": 391, "label": "William Q. Judge", "html": "<p>The elder Judge, with his children, lived for a brief period at the old Merchants’ Hotel, in Cortland Street, New York; next in Tenth Street, and then settled in Brooklyn. William began work in New York as a clerk, and afterwards entered the Law Office of George P. Andrews, who later became Judge of the Supreme Court of New York. There the lad studied law, while living with his father, who, however, died soon after. On coming of age, William Q. Judge was naturalized a citizen of the United States, in April, 1872. In May of that year he was admitted to the Bar of New York. His conspicuous traits as a lawyer, in the practice of Commercial Law, which became his specialty, were his thoroughness, his inflexible persistence, and his industry, which won the respect of employers and clients alike. As was said of him, then and later:<\/p><p>‘Judge would walk over red-hot ploughshares from here to India to do his duty.”<\/p>", "images": []}, {"pdf_page_index": 391, "pdf_page_number": 392, "label": "William Q. Judge", "html": "<p>In 1874 he married Ella M. Smith, of Brooklyn, by whom he had one child, a little girl of great charm and promise, whose death in early childhood was long a source of deep, though quiet, sorrow to both. Mr. Judge in especial was a great lover of children, and had the gift of attracting them around him. If he sketched on the deck of a steamer the children would sidle up, coming nearer and nearer, until they were leaning against him or perching where-ever a resting-place could be had—often before he had seemed to notice their presence. The children of his friends always gave him joyous welcome, and not infrequently he was dragged to the floor, the common playground, amid their toys. A child, in the company where he was, was sure to find the haven of his arms at last, and nestle there while the metaphysical discussion went on above its curls. But, however animated the argument, you would not find that small form, so gently cradled, to be ever so little disturbed.<\/p><p>Soon after his marriage, Mr. Judge heard of Madame Blavatsky, in this wise. He came across a book which greatly interested him:<\/p>", "images": []}, {"pdf_page_index": 392, "pdf_page_number": 393, "label": "William Q. Judge", "html": "<p>People from the Other World, by H. S. Olcott. Mr. Judge wrote to Colonel Olcott, asking for the address of a good medium, for at this time the tide of occult inquiry and speculation had just set in, and the experiences of numbers of people, including those of Madame Blavatsky, at the “Eddy Homestead,” were the talk of all the world. While no medium was forthcoming, Mr. Judge was invited to call upon H. P. B.<\/p><p>The call was paid at 40, Irving Place, New York, and H. P. Blavatsky then for the first time in this life met her most devoted pupil and friend face to face,[39] in a relationship which continued unbroken, and justified that which H. P. Blavatsky herself wrote of it—’ ‘till death and after.” Storms there were, no doubt, as well as fullest sunshine, for the pupil was a powerful mind and the teacher was the sphinx of her era, so that intellectual tussles followed as a natural sequence; but whatever the pupil thought of the teacher was said to her, boldly—not a doubt nor a fear concealed when these arose, as arise they must when the hour of occult teaching and trial dawns. That H. P. B. honored this openness is evidenced by her long letters—there are some of forty-eight pages—in which many a puzzle is explained with profound affection.<\/p>", "images": []}, {"pdf_page_index": 393, "pdf_page_number": 394, "label": "William Q. Judge", "html": "<p>There has been a recent attempt to make capital out of some passing episode, turning it into a prolonged enmity on the part of Mr. Judge toward H. P. B. New, perhaps, to their odious trade, the slanderers were more silly than expert; they were unaware of the existence of these letters of H. P. B., which not only show how complete was the final understanding, but which also show through what arts, and of what individual, the temporary want of comprehension arose. Never was karmic line more plainly marked out nor karmic tool more mercifully—yet plainly—exposed by H. P. B. This effort was as vain as will be every other attempt to separate that teacher and that pupil. The final verdict of H. P. B. upon the relationship is an ample one. It extends over the ten years previous to her departure from our midst and is replete with a noble gratitude constantly poured forth. The splendid friendship went on its rejoicing way, a thing of life immortal, destined to pass beyond the confines of the tomb, as beyond many a mortal life.<\/p>", "images": []}, {"pdf_page_index": 394, "pdf_page_number": 395, "label": "William Q. Judge", "html": "<p>Mr. Judge spent much of his time with H. P. B. at Irving Place, New York, in study, under her direction and instruction, and helped her with Isis Unveiled [as indicated in his Paris letter, p. 199]. He was one of the number present at her rooms on September 7, 1875. when the first proposal for the Theosophical Society was made, and its organization begun. Isis was published in 1877, and a little over a year later, Madame Blavatsky and Col. Olcott went to India, while Mr. Judge was left to carry on the T. S. in New York as best he could—these three being, as H. P. B. subsequently wrote, the only founders who remained true to the Cause and to the Society. It was a position in which the young lawyer seemed quite over-weighted, but he did all that he could. Much or little it might have been on the external plane, and at that time. We cannot say. He was a disciple under trial, soon to be accepted and recognized, but already, so far as this life goes, a neophyte, one of a band who have taken the vow of interior poverty, and whose unseen and unrecorded work is regarded as being of far more importance than exterior, visible work. The main current of such lives runs underground. Already H. P. Blavatsky had written and said that he had been a part of herself and of the Great Lodge “for aeons past” (her exact words), and that he was one of those tried Egos who have reincarnated several times immediately after death; assisted to do so, and without devachanic rest, in order to continue his Lodge work. It is a matter of record that, when the seven years’ probation of this life were over, the Master best known in connection with the T. S. sent to Mr. Judge, through H. P. B., his photograph, inscribed upon the back “to my colleague,” with a cryptogram and signature; and, a little later, a letter of thanks and advice was delivered to Mr. Judge in Paris by H. P. B. A message sent to him through H. P. B. in writing from the Lodge at about this time ends by saying: “Those who do all that they can, and the best they know how, do enough for us.”<\/p>", "images": []}, {"pdf_page_index": 395, "pdf_page_number": 396, "label": "William Q. Judge", "html": "<p>Mr. Judge’s was a difficult task, indeed, when she, who was then the one great exponent, had left the field, and the curiosity and interest excited by her original and striking mission had died down. The T. S. was henceforth to subsist on its philosophical basis, and this, after long years of toil and unyielding persistence, was the point attained by Mr. Judge. From his twenty-third year until his death, his best efforts and all the fiery energies of his un daunted soul were given to this Work. We have a word picture of him, opening meetings, reading a chapter of the Bhagavad Gita, entering the Minutes, and carrying on all the details of the same, as if he were not the only person present; and this he did, time after time, determined to have a society. Will, such as this, makes its way through every obstacle. Through his unremitting labour, he built up the T. S. in America, aiding the Movement as well in all parts of the world, and winning from The Master the name of “Resuscitator of Theosophy in America.” His motto in those days was, “Promulgation, not Speculation.” “Theosophy,” said he, “is a cry of the Soul.”<\/p>", "images": []}, {"pdf_page_index": 396, "pdf_page_number": 397, "label": "William Q. Judge", "html": "<p>The work went slowly at first. There was no very great activity, but the link was kept unbroken, and correspondence with H. P. Blavatsky was brisk. Amid such external work as he could find to do, the young disciple still kept up the inner search. It was a period of darkness and silence, the period of probation. Through such a period had passed H. P. Blavatsky, and of it she said and wrote: “For long years I thought Master had quite deserted me.” She had seen the Master in London, in the physical body, following, as if an official, in the suite of some Indian prince, and, in an interview which was given to her in Hyde Park, the Master told her she might come to Thibet, but left her to find her way thither unaided, and also to discover where she should go when she reached that country, all of which she accomplished after several failures and some years of search and apparent desertion. Of such a period the author of Light on the Path wrote in some explanatory notes in Lucifer, that though the Master might really be near the neophyte and might extend to him the utmost comfort which one soul could give to another, yet the neophyte would feel himself utterly alone, and that not one has passed through this period of suffering without bitter complaint. Complaint was wrung from this strong soul, whose portrait is feebly attempted here, in letters of sacred privacy to his teacher, H. P. Blavatsky, and to Damodar, his fellow<\/p>", "images": []}, {"pdf_page_index": 397, "pdf_page_number": 398, "label": "William Q. Judge", "html": "<p>The shadow portrayed in those letters lifted, the disciple came to know even as he was known, and in 1888 we find H. P. B. writing in certain official documents of him as being then “a, chela of thirteen years’ standing, with trust reposed in him,” and as “the chief and sole agent of the Dzyan (Lodge) in America.” (This, it will be remembered, is the name by which what is called “The Lodge” is known in Thibet.)<\/p><p>Mr. Judge had been in South America, where H. P. B. said there was a branch of the Great Lodge, and where he saw many strange things. In that country he contracted the dreaded Chagres fever, which racks the system of its victims as by fire, often carrying them off in the twentieth year. Mr. Judge was always a great sufferer from this torturing disease—though he never stayed his work for it—and 1896 was the twentieth year.<\/p>", "images": []}, {"pdf_page_index": 398, "pdf_page_number": 399, "label": "William Q. Judge", "html": "<p>To Europe he went, too, in 1884, meeting H. P. B. in Paris and spending some little time with her there, and thence to India, where he arrived just after the outbreak of the Coulomb scandal. After a brief stay there, Mr. Judge returned to America and the duties of his professional and theosophical life. The moment was critical, a turning-point. As so often happens, the scandal attracted public attention to the Theosophical Society, and letters of inquiry began to pour in. Mr. Judge seized the tide at the flood and carried the bark of the Society on to wider fortunes. The press took the matter up, reporters called, inquirers became members, the community became aware of the quiet, forceful worker in its midst. His method and his manner won the respect of those who heard him; the press began to accept his articles on Theosophy, and later on those of others; from scoffing and jeering and being unable to admit a theosophical item without insulting comment, it passed to giving these like other items of news. Later still, the personal influence of Mr. Judge induced the editors of the New York Sun to retract a libel which they had published against the T. S. and Madame Blavatsky, and a libel suit instituted against that journal by Mr. Judge was withdrawn.<\/p>", "images": []}, {"pdf_page_index": 399, "pdf_page_number": 400, "label": "William Q. Judge", "html": "<p>Mr. Judge instituted The Path magazine in 1886, meeting all its deficits and carrying on its various activities, as well as those of the T. S. He wrote unceasingly, books, articles, letters. He lectured all over the States, and did the work of several men. Every spare moment was given to Theosophy. and taken from his meals and his rest. Finally, when the New York Headquarters were bought, and when the work had increased to large proportions, Mr. Judge relinquished his profession and gave his entire life and time to the Society. His health, always frail, continued to give way. A day free from pain was rare with him. Often he was in very real danger. But always he was scornful of every suffering, working when another man would have been prone, when his friends and doctors were shocked at his being about at all. As the T. S. grew, his working staff grew also, but he out-worked and out-tired them all. Dauntless, indomitable, he was ever inaugurating fresh plans of work.<\/p>", "images": []}, {"pdf_page_index": 400, "pdf_page_number": 401, "label": "William Q. Judge", "html": "<p>He had his sorrows, too, but the cheerfulness of his aspect, his undaunted energy, never failed him. To those who would ask his advice in the crises which were wont to shake the tree of the T. S., he would make answer: “Work! Work! Work for Theosophy!” And when at last the Great Betrayal came to him, and some of those whom he had lifted and served and taught how to work, strove to cast him down and out of the Society, in their ignorance of their own limitations, he kept the due silence of the Initiate.
