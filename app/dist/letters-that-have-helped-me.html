<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letters That Have Helped Me</title>
<style>
/* ============ Design tokens ============
   Palette: parchment cream #F7F1E3, ink #2E2A24, gilt gold #B8963E,
            deep violet accent (devotion) #6B5691, rose accent (affection) #C1567B,
            soft border #E4D9BE
   Type: display "Cormorant Garamond" (Victorian book serif), body "EB Garamond",
         utility/caption "Cormorant" small caps
   Layout: single centered "book leaf" card, aurora/aura corner glow, page-turn transitions
   Signature: an animated soft-glowing aura halo behind the folio number, echoing the
   book's own theme of radiating thought-vibrations.
*/
:root{
  --parchment:#F7F1E3;
  --parchment-2:#EFE6CE;
  --ink:#2E2A24;
  --ink-soft:#5A5346;
  --gold:#B8963E;
  --gold-soft:#D8C186;
  --violet:#6B5691;
  --rose:#C1567B;
  --border:#E1D3AA;
  --card:#FFFDF6;
  --shadow: 0 20px 60px -20px rgba(60,45,10,0.35), 0 2px 10px rgba(60,45,10,0.08);
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #f3e8c9 0%, transparent 60%),
    radial-gradient(ellipse 900px 600px at 110% 110%, #ecdcc0 0%, transparent 55%),
    var(--parchment);
  color:var(--ink);
  font-family: "EB Garamond", "Cormorant Garamond", Georgia, serif;
  min-height:100vh;
  overflow-x:hidden;
}
@font-face{
  font-family:'Cinzel-fallback'; src:local('Georgia');
}
.app{
  max-width:980px;
  margin:0 auto;
  padding:28px 20px 60px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- Header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:12px;
}
.brand .glyph{
  width:40px;height:40px;border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #fff6df 0%, var(--gold-soft) 45%, var(--gold) 100%);
  box-shadow: 0 0 18px 2px rgba(184,150,62,0.45), inset 0 0 6px rgba(255,255,255,0.6);
  flex-shrink:0;
}
.brand h1{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-weight:600;
  font-size:1.35rem;
  letter-spacing:0.04em;
  margin:0;
  color:var(--ink);
}
.brand p{
  margin:0; font-size:0.8rem; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--ink-soft); font-family: Georgia, serif;
}
.progress-wrap{
  display:flex; align-items:center; gap:10px;
  font-size:0.82rem; color:var(--ink-soft); letter-spacing:0.04em;
}
.progress-bar{
  width:150px; height:5px; border-radius:3px; background:var(--parchment-2);
  overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,0.08);
}
.progress-fill{
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--gold-soft), var(--gold));
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ---------- Table of contents rail ---------- */
.toc-toggle{
  border:1px solid var(--border); background:var(--card); color:var(--ink);
  border-radius:8px; padding:7px 14px; font-family:inherit; font-size:0.85rem;
  letter-spacing:0.05em; cursor:pointer; box-shadow:var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.toc-toggle:hover{ transform: translateY(-1px); }
.toc-panel{
  position:fixed; top:0; right:-360px; width:340px; height:100%;
  background:var(--card); border-left:1px solid var(--border);
  box-shadow:-20px 0 50px rgba(60,45,10,0.18);
  z-index:50; transition:right .35s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; padding:24px 18px 40px;
}
.toc-panel.open{ right:0; }
.toc-panel h2{
  font-family:"Cormorant Garamond",serif; font-size:1.1rem; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--gold); margin:0 0 14px;
  border-bottom:1px solid var(--border); padding-bottom:10px;
}
.toc-close{
  position:absolute; top:16px; right:16px; background:none; border:none;
  font-size:1.3rem; color:var(--ink-soft); cursor:pointer; line-height:1;
}
.toc-section{
  margin-bottom:6px;
}
.toc-section-title{
  font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--violet); margin:16px 0 6px; font-weight:600;
}
.toc-item{
  display:block; width:100%; text-align:left; background:none; border:none;
  padding:6px 8px; font-family:"EB Garamond",serif; font-size:0.95rem;
  color:var(--ink); cursor:pointer; border-radius:6px;
  transition: background .15s ease;
}
.toc-item:hover{ background:var(--parchment-2); }
.toc-item.active{
  background: linear-gradient(90deg, rgba(184,150,62,0.16), transparent);
  color:var(--gold); font-weight:600;
}
.scrim{
  position:fixed; inset:0; background:rgba(40,30,10,0.25); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.scrim.show{ opacity:1; pointer-events:auto; }

/* ---------- The book leaf / page card ---------- */
.stage{
  flex:1;
  display:flex; align-items:flex-start; justify-content:center;
  position:relative;
}
.leaf{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  width:100%;
  padding:46px 54px 40px;
  position:relative;
  min-height:420px;
  animation: fadeIn .5s ease;
}
.leaf::before{
  content:"";
  position:absolute; inset:10px;
  border:1px solid rgba(184,150,62,0.28);
  border-radius:8px;
  pointer-events:none;
}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
@media (max-width:700px){
  .leaf{ padding:30px 20px 28px; }
}

.eyebrow{
  font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--violet); margin:0 0 6px; font-weight:600;
}
.leaf h2.page-title{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:2rem; font-weight:600; margin:0 0 22px; color:var(--ink);
  line-height:1.15; border-bottom:2px solid var(--gold-soft); padding-bottom:14px;
}
.leaf .content p{
  font-size:1.09rem; line-height:1.75; margin:0 0 1.1em; color:var(--ink);
  text-align:justify; hyphens:auto;
}
.leaf .content p.footnote{
  font-size:0.92rem; color:var(--ink-soft); font-style:italic;
  border-left:2px solid var(--gold-soft); padding-left:14px;
}
.leaf .content p.signature{
  text-align:right; font-style:italic; letter-spacing:0.05em; color:var(--ink-soft);
}
.leaf .content p.printer-line{
  text-align:center; font-size:0.85rem; color:var(--ink-soft); letter-spacing:0.06em;
}
.leaf .content h3.subhead{
  font-family:"Cormorant Garamond",serif; font-size:1.15rem; color:var(--violet);
  margin:22px 0 10px; letter-spacing:0.03em;
}
.leaf .content ol.principles{ padding-left:1.4em; }
.leaf .content ol.principles li{ margin-bottom:6px; font-size:1.05rem; }

/* Title page flourishes */
.book-title{
  font-family:"Cormorant Garamond",serif; text-align:center; font-size:2.6rem;
  letter-spacing:0.12em; margin:18px 0 6px; color:var(--ink);
}
.book-authors{
  text-align:center; font-size:1.05rem; letter-spacing:0.1em; font-weight:400;
  color:var(--violet); margin:0 0 26px;
}
.pub-line{ text-align:center; font-size:0.78rem; color:var(--ink-soft); letter-spacing:0.04em; }
.pub-house{ text-align:center; font-size:0.95rem; color:var(--ink-soft); margin:8px 0 26px; line-height:1.6; }
.print-table{ margin:0 auto 26px; font-size:0.9rem; color:var(--ink-soft); border-collapse:collapse; }
.print-table td{ padding:2px 10px; }
.printer-line{ text-align:center; font-size:0.85rem; color:var(--ink-soft); margin-top:20px; line-height:1.6; }

/* Colour key table */
.key-table{ overflow-x:auto; margin:18px 0; }
.key-table table{ border-collapse:collapse; width:100%; font-size:0.88rem; }
.key-table th, .key-table td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
.key-table th{ background:var(--parchment-2); color:var(--gold); width:28px; text-align:center; }
.caption-label{ text-align:center; letter-spacing:0.1em; text-transform:uppercase; font-size:0.85rem; color:var(--ink-soft); }

/* TOC / illustrations tables */
.toc-table, .toc-table.small{ width:100%; border-collapse:collapse; font-size:0.98rem; }
.toc-table td{ padding:5px 6px; border-bottom:1px dotted var(--border); }
.toc-table td:last-child{ text-align:right; color:var(--ink-soft); width:80px; }
.toc-table tr.indent td:first-child{ padding-left:22px; }
.toc-table tr.indent2 td:first-child{ padding-left:44px; font-style:italic; }
.toc-table.small td{ font-size:0.88rem; }
.illus-note{ margin-bottom:14px; }
.illus-note p{ font-size:0.85rem; color:var(--ink-soft); font-style:italic; }

/* ---------- Images / figure gallery ---------- */
.figures{
  display:flex; flex-wrap:wrap; gap:22px; margin:26px 0 10px; justify-content:center;
}
.figure-card{
  background:var(--parchment-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  max-width:360px;
  flex:1 1 260px;
  text-align:center;
  box-shadow: 0 8px 22px -12px rgba(60,45,10,0.25);
}
.figure-card img{
  max-width:100%; height:auto; border-radius:5px;
  border:1px solid rgba(0,0,0,0.08);
  background:#111;
  cursor:zoom-in;
  transition: transform .25s ease;
}
.figure-card img:hover{ transform:scale(1.015); }
.figure-cap{
  margin-top:9px; font-size:0.85rem; color:var(--ink-soft);
  font-style:italic; letter-spacing:0.02em;
}

/* Lightbox */
.lightbox{
  position:fixed; inset:0; background:rgba(20,15,5,0.82);
  display:none; align-items:center; justify-content:center; z-index:100;
  padding:30px;
}
.lightbox.open{ display:flex; }
.lightbox img{ max-width:100%; max-height:85vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.lightbox-close{
  position:absolute; top:22px; right:28px; background:none; border:none;
  color:#f6ecd2; font-size:2rem; cursor:pointer; line-height:1;
}

/* ---------- Footer nav ---------- */
nav.pager{
  position:sticky; bottom:0;
  margin-top:26px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:linear-gradient(180deg, rgba(247,241,227,0) 0%, var(--parchment) 30%);
  padding-top:18px;
}
.pager-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border); color:var(--ink);
  padding:11px 20px; border-radius:10px; font-family:inherit; font-size:0.95rem;
  cursor:pointer; box-shadow:var(--shadow); letter-spacing:0.02em;
  transition: transform .15s ease, opacity .15s ease;
}
.pager-btn:hover:not(:disabled){ transform:translateY(-2px); }
.pager-btn:disabled{ opacity:0.35; cursor:default; }
.pager-btn.next{ background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:#3a2c08; border:none; }
.folio{
  position:relative;
  font-family:"Cormorant Garamond",serif; font-size:0.95rem; color:var(--ink-soft);
  text-align:center; letter-spacing:0.05em;
}
.folio .halo{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:70px; height:70px; border-radius:50%;
  background: radial-gradient(circle, rgba(184,150,62,0.30) 0%, transparent 70%);
  animation: pulse 3.2s ease-in-out infinite;
  z-index:-1;
}
@keyframes pulse{
  0%,100%{ transform:translate(-50%,-50%) scale(0.9); opacity:0.5; }
  50%{ transform:translate(-50%,-50%) scale(1.25); opacity:0.9; }
}

@media (prefers-reduced-motion: reduce){
  .leaf{ animation:none; }
  .folio .halo{ animation:none; }
}

/* PDF-exact content classes */
.leaf .content h3.pdf-heading{
  font-family:"Cormorant Garamond",serif; font-size:1.2rem; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--violet); margin:20px 0 10px;
}
.leaf .content p.pdf-caption{
  font-size:0.92rem; letter-spacing:0.05em; text-transform:uppercase;
  color:var(--gold); text-align:center; font-weight:600; margin:16px 0 10px;
}
.leaf .content p.empty-note{
  text-align:center; color:var(--ink-soft); font-size:1rem; padding:30px 0;
}

/* section pill on top of card */
.section-pill{
  position:absolute; top:-13px; left:50px;
  background:linear-gradient(135deg, var(--violet), #8875ac);
  color:#fff; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:5px 14px; border-radius:20px; box-shadow:0 6px 14px -6px rgba(107,86,145,0.6);
}
@media (max-width:700px){
  .section-pill{ left:20px; }
}

/* ---------- Read aloud ---------- */
.listen-bar{
  display:none; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 18px; margin-bottom:16px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); font-family:Georgia, serif; font-size:0.85rem;
}
.listen-bar.open{ display:flex; }
.listen-bar button{
  font-family:inherit; font-size:0.85rem; padding:7px 14px; border-radius:999px;
  border:1px solid var(--gold); background:linear-gradient(180deg,#fffdf6,#f3ead2);
  color:var(--ink); cursor:pointer; letter-spacing:0.02em;
}
.listen-bar button:hover:not(:disabled){ background:var(--gold); color:#fff; }
.listen-bar button:disabled{ opacity:0.45; cursor:default; }
.listen-bar select{
  font-family:inherit; font-size:0.82rem; padding:6px 8px; border-radius:8px;
  border:1px solid var(--border); background:#fff; color:var(--ink);
  max-width:230px;
}
.listen-bar label{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); }
.listen-bar .status{ color:var(--ink-soft); font-style:italic; flex-basis:100%; }

.search-bar, .notes-panel { display:none; padding:10px 24px; background:#f8f3e7; border-bottom:1px solid #e3d8c3; align-items:center; gap:10px; flex-wrap:wrap; }
.search-bar.open, .notes-panel.open { display:flex; }
.search-bar input { flex:1; min-width:180px; padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; font-family:inherit; font-size:14px; color:#3a3227; }
.search-bar input:focus { outline:2px solid #b29a5b; }
.search-bar .sbtn { padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; cursor:pointer; font-family:inherit; font-size:13px; color:#3a3227; }
.search-bar .sbtn:hover { background:#f0e7d3; }
#search-info { font-size:13px; color:#7a6c50; white-space:nowrap; }
mark.search-hit { background:#ffe9a8; color:inherit; padding:0 1px; border-radius:2px; }
.notes-panel { display:none; }
.notes-panel.open { display:block; }
#notes-body { max-width:820px; margin:0 auto; font-size:14.5px; line-height:1.65; color:#3a3227; }
#notes-body h3 { font-size:15px; margin:0 0 8px; color:#5c4a1e; letter-spacing:0.02em; }
#notes-body h4 { font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:#8a744a; margin:14px 0 6px; }
#notes-body p { margin:0 0 10px; }
#notes-body ul { margin:0; padding-left:20px; }
#notes-body li { margin-bottom:5px; }
#notes-body .notes-empty { color:#8a7c62; font-style:italic; }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="glyph"></div>
      <div>
        <h1>Letters That Have Helped Me</h1>
        <p>William Q. Judge &middot; 1891 &middot; complete text</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="progress-wrap">
        <span id="progress-label">Page 1</span>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:1.8%"></div></div>
      </div>
      <button class="toc-toggle" id="listen-toggle" style="margin-right:10px;" title="Read aloud">&#128266; Listen</button><a class="toc-toggle dl-btn" href="letters-that-have-helped-me.pdf" download title="Download this book as PDF" style="text-decoration:none;">&#10515; Download</a>
      <button class="toc-toggle" id="search-toggle" title="Search this book">&#128269; Search</button>
      <button class="toc-toggle" id="notes-toggle" title="Chapter summary and key points">&#128221; Notes</button>
      <button class="toc-toggle" id="toc-toggle">&#9776; Contents</button>
    </div>
  </header>

<div class="search-bar" id="search-bar">
  <input type="text" id="search-input" placeholder="Search this book..." autocomplete="off">
  <button class="sbtn" id="search-prev">&#8593; Prev</button>
  <button class="sbtn" id="search-next">Next &#8595;</button>
  <span id="search-info"></span>
  <button class="sbtn" id="search-close" title="Close">&#10005;</button>
</div>
<div class="notes-panel" id="notes-panel">
  <div id="notes-body"></div>
</div>


  <div class="listen-bar" id="listen-bar">
    <button id="listen-play">&#9654; Read aloud</button>
    <button id="listen-stop" disabled>&#9632; Stop</button>
    <select id="voice-select" title="Voice"></select>
    <select id="rate-select" title="Speed">
      <option value="0.85">0.85&times;</option>
      <option value="1" selected>1&times;</option>
      <option value="1.15">1.15&times;</option>
      <option value="1.3">1.3&times;</option>
    </select>
    <label><input type="checkbox" id="listen-auto" checked> Auto-advance pages</label>
    <span class="status" id="listen-status"></span>

      <div class="section-pill" id="section-pill">PDF Page</div>
      <div class="eyebrow" id="eyebrow"></div>
      <h2 class="page-title" id="page-title"></h2>
      <div class="content" id="content"></div>
      <div class="figures" id="figures"></div>
    </div>
  </div>

  <nav class="pager">
    <button class="pager-btn prev" id="prev-btn">&larr; Previous</button>
    <div class="folio"><div class="halo"></div><span id="folio-label"></span></div>
    <button class="pager-btn next" id="next-btn">Next &rarr;</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<aside class="toc-panel" id="toc-panel">
  <button class="toc-close" id="toc-close">&times;</button>
  <h2>Contents</h2>
  <div id="toc-list"></div>
</aside>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <img id="lightbox-img" src="" alt="">

<script id="pages-data" type="application/json">[{"pdf_page_index": 0, "pdf_page_number": 1, "label": "Title", "html": "<div style=\"text-align:center;padding-top:60px\"><h1 style=\"font-size:2rem\">Letters That Have Helped Me<\/h1><p style=\"margin-top:16px;font-style:italic\">William Q. Judge<\/p><p>1891<\/p><\/div>", "images": []}, {"pdf_page_index": 1, "pdf_page_number": 2, "label": "Preface", "html": "<h3 class=\"pdf-heading\">Book I<\/h3><h3 class=\"pdf-heading\">Preface<\/h3><p>Seeking for freedom, I go to that God who is the light of his own thoughts. A man who knows him truly passes over death; there is no other path to go.<\/p><p>—UPANISHADS<\/p><p>IN the Path for May, 1886, we find these words: “We need a literature, not solely for highly intellectual persons, but of a more simple character, which attempts to appeal to ordinary common-sense minds who are really fainting for such moral and mental assistance as is not reached by the more pretentious works.”<\/p><p>The experience of one student is, on the whole, the experience of all. Details differ, however. Some are made more instantly rich than others: they are those who put forth more vigorous and generous effort; or they have a Karmic store which brings aid. What Theosophists know as Karma, or the law of spiritual action and reaction, decides this, as it works on all the planes, physical, moral, mental, psychical, and spiritual alike. Our Karma may be worked out on any one of these planes when our life is chiefly concentrated upon it, no matter upon what other plane any special initiative impulse or branch of it originated.<\/p>", "images": []}, {"pdf_page_index": 2, "pdf_page_number": 3, "label": "Preface", "html": "<p>The writer, when first he became a Theosophical student, had the aid of an advanced occultist in his studies. This friend sent him, among others, the letters which, in the hope that they may assist others as they have the original recipient, are here published. They are not exhaustive treatises; they are hints given by one who knew that the first need of a student is to learn how to think. The true direction is pointed out, and the student is left to clarify his own perceptions, to draw upon and enlarge his own intuitions, and to develop, as every created thing must at last develop, by his own inward exertions. Such students have passed the point where their external environment can affect their growth favorably. They may learn from it, but the time has also come to resist it and turn to the internal adjustment to higher relations only. The brevity of these letters should not mislead the reader. Every statement in them is a statement of law. They point to causes of which life is in effect; that life arising from the action of Spirit in Nature, and which we must understand as it is manifested within us before we can advance on the Path. There is a scientific meaning within all these devotional or ethical injunctions, for the Wisdom- Religion never relaxes her hold upon Science nor attempts to dissever an effect from its cause. Most of these admonitions have their base in the constitution of the Archæus or World-Soul, and the correlation of its energies; others, still, adhere in the Eternal.<\/p>", "images": []}, {"pdf_page_index": 3, "pdf_page_number": 4, "label": "Preface", "html": "<p>No less should the reader guard himself against a slight estimate arising from the exquisite modesty of  Z. An occultist is never so truly a man of power as when he has wholly learned and exhibits this truth:<\/p><p>“And the power the disciple shall covet is that which shall make him appear as nothing in the eyes of men.”<\/p><p>The inner eye, the power of seeing, looks deeper into the source of a man’s knowledge and takes it at its true value. Those men who are sharers in the Divine, whose first office is to give, are often protected from the demands and curiosity of the careless by a simple exterior which deceives the worldly sense. Some men are great because of the Power which stands behind them, the divine energies which flow through them; they are great through having learned how to receive this celestial influx from higher spheres of Being; they are the appointed ministrants, the true servitors of the Law and pupils of Masters whose office is humanitarian and universal.<\/p>", "images": []}, {"pdf_page_index": 4, "pdf_page_number": 5, "label": "Preface", "html": "<p>Such aid is never volunteered; it follows the Karmic behest, and, when given, leaves the student free to follow it or not, as his intuitions may direct. There is not a shadow or vestige of authority in the matter, as the world understands the word authority. Those who travel the unknown way send messages back, and he who can receives them. Only a few of the first steps are here recorded and the first impediments surmounted. No hints of magic lore are to be found; no formulas of creed or occult powers; the questions of an awakening soul are answered, and the pilgrim is shown where lies the entrance to the Path. The world at large seeks the facts of occult science, but the student who has resolved to attain desires to find the true road. What may seem to others as mere ethics is to him practical instruction, for as he follows it he soon perceives its relation to facts and laws which he is enabled to verify, and what seemed to him the language of devotion merely, is found to be that of science; but the science is spiritual, for the Great Cause is pure Spirit.<\/p>", "images": []}, {"pdf_page_index": 5, "pdf_page_number": 6, "label": "Preface", "html": "<p>Many students must at some time stand where the writer then stood, at the beginning of the way. For all these this correspondence is made public, and they are urged to look within the printed words for their imperishable meaning. They may be cheered to find the foot-prints of a comrade upon the rugged Path, above which the light of Truth ever shines. Yet even this light is not always a clear splendor. It may seem “in the day-time a cloud, and by night a pillar of fire.” We must question every external aspect, even that of Faith itself, for the secret and germ of things lies at their core. Let us purify even our Faith; let us seek Truth herself, and not our preconceptions of Truth. In her mirror we shall never see our own familiar face: that which we see is still ourselves, because our real self is truth.<\/p>", "images": []}, {"pdf_page_index": 6, "pdf_page_number": 7, "label": "Preface", "html": "<p>As the Theosophical movement gathers new momentum, fresh recruits may be aided by those letters which so greatly sustained me, or encouraged by some co-partnership of thought, and that, too, in the real issue confronting them, We first take this issue to be the acquirement of occult knowledge. Soon we find that the meaning of all really informed occult writers eludes us. We find that books only serve to remind us of what we knew in the long past, perhaps when “journeying with Deity,” and the echoes awakened within us are so faint that they are rarely to be caught. Whether we study philosophies, metaphysics, physics, ethics, harmony, astrology, natural sciences, astralism, magnetism or what not, we meet with endless contradiction and differentation; we for ever require to strike the balance of our own intuition. We discover that the final word has not yet been written down upon any of the higher subjects (unless it be on mathematics, and scarcely on that), and that all our learning is but a finger-post to that supreme knowledge of Truth which is only found and closely guarded within the human heart. Thrown back upon our inner perceptions for continual readjustment, on every side of experience this warning confronts us: Stand ready to abandon all thou hast learned! Not knowing the one center, we cannot thoroughly know any sub-center. The cause unknown, effects mislead us. Then we turn to that mysterious center whereby the One is manifest in man, and we begin the study of the heart, both in itself and in the life it has instituted about us.<\/p>", "images": []}, {"pdf_page_index": 7, "pdf_page_number": 8, "label": "Preface", "html": "<p>To be put into more direct communication with the world of cause is now the student’s most pressing need. One thing alone prevents this,—himself.  He is of such gross fibre that he cannot be “porous to thought, bibulous of the sea of light.” To the refinement and dispersal of this lower self—of the man he now takes himself to be—he then directs his will. Each man has a different mode of doing this, but each who advances at all finds that with every new period of his inner life a new self rises before him. Looking back over a group of weeks or months, he is amazed to see what manner of man he was then, and smiles that pitying smile which we bestow upon the faded letters of our youth.<\/p><p>Yet some there be who ossify there in their rut; let them struggle mightily to break up the mass which has resisted all environment, all change, all the conditions of progressive life. They have done for themselves what the enemy strives to do for others; they are the rock in their own path.<\/p><p>What our Eastern brothers call “the sheaths of the heart” fall away one by one: when the last bursts open there is a silence, the silence of the mystic death. But “the dead shall arise,” and from that death springs up the first tender growth of eternal life.<\/p>", "images": []}, {"pdf_page_index": 8, "pdf_page_number": 9, "label": "Book I · Letter I", "html": "<p>Up to this point we shall not travel in the ensuing pages. Yet having realized the real issues so forcibly that his whole strength was at the start directed towards self-knowledge and the right use of Thought, the writer offers a part of his first instructions to those of his comrades who, single-hearted and of royal Faith, hold Truth to be dearer than all material life and seek it on the hidden way. There is no tie in the universe equal to that which binds such comrades together. It has been forged in the fires of unspeakable anguish; it has been rivetted by a dauntless purpose and a unique, because Divine, Love. The fierce hatred of seen and unseen worlds cannot tamper with it so long as a man remains true to himself, for this larger life is himself, and as he grows towards it his self- imposed fetters fall away and he stands, at last, a free soul, in the celestial Light which is Freedom itself, obedient only to the Law of its own divine Being. To reach it, let us obey the law of our own Being, for, truly, Being is One.<\/p><p>My comrades, wherever you are, I salute you.<\/p><p>JASPER NIEMAND, F. T. S.<\/p><h3 class=\"pdf-heading\">Book I · Letter I<\/h3><p>My Dear Jasper:<\/p>", "images": []}, {"pdf_page_index": 9, "pdf_page_number": 10, "label": "Book I · Letter I", "html": "<p>NOW let me elevate a signal. Do not think much of me. please. Think kindly of me; but oh, my friend, direct your thoughts to the Eternal Truth. I am, like you, struggling on the road. Perhaps a veil might in an instant fall down from your spirit, and you would be long ahead of us all. The reason you have had help is that in other lives you gave it to others. In every effort you made to lighten another mind and open it to Truth, you were helped your self. Those pearls you found for another and gave to him, you really retained for yourself in the act of benevolence. For when one lives thus to help others, he is thereby putting in practice the rule to try and ‘kill out all sense of separateness,” and thus gets little by little in possession of the true light.<\/p><p>Never lose, then, that attitude of mind. Hold fast in silence to all that is your own, for you will need it in the fight; but never, never desire to get knowledge or power for any other purpose than to give it on the altar, for thus alone can it be saved to you.<\/p>", "images": []}, {"pdf_page_index": 10, "pdf_page_number": 11, "label": "Book I · Letter I", "html": "<p>So many are there around me who are ardent desirers and seekers, devotees; but they are doing it because the possession seems valuable. Perhaps I see in you—I hope I mistake not—a pure desire to seek Knowledge for its own sake, and that all others may be benefited. So I would point out to you the only royal road, the one vehicle. Do all those acts, physical, mental, moral, for the reason that they must be done, instantly resigning all interest in them, offering them upon the altar. What altar? Why, the great spiritual altar, which is, if one desires it, in the heart. Yet still use earthly discrimination, prudence. and wisdom.<\/p><p>It is not that you must rush madly or boldly out to do, to do. Do what you find to do. Desire ardently to do, and even when you shall not have succeeded in carrying out anything but some small duties, some words of warning, your strong desire will strike like Vulcan upon other hearts in the world, and suddenly you will find that done which you had longed to be the doer of. Then rejoice that another had been so fortunate as to make such a meritorious Karma. Thus, like the rivers running into the unswelling, passive ocean, will your desires enter into your heart.<\/p>", "images": []}, {"pdf_page_index": 11, "pdf_page_number": 12, "label": "Book I · Letter II", "html": "<p>I find all your remarks just; and besides, there seems to be a real spirit behind them. Do not fear nor fail because you feel dark and heavy. The very rage you feel will break the shrine that covers the mystery after a while. No one can really help you. No one can open your doors. You locked them up, and only you can open them. When you open any door, beyond it you find others standing who had passed you long ago, but now, unable to proceed, they are there waiting; others are there waiting for you. Then you come, opening a door, and those waiting disciples perhaps may pass on; thus on and on. What a privilege this, to reflect that we may perhaps be able to help those who seemed greater than ourselves!<\/p><p>Oh, what a groan Nature gives to see the heavy Karma which man has piled upon himself and all the creatures of the three worlds! That deep sigh pierces through my heart. How can the load be lifted? Am I to stand for myself, while the few strong hands of Blessed Masters and Their friends hold back the awful cloud? Such a vow I registered ages ago to help them, and I must. Would to great Karma I could do more! And you—do what you can.<\/p><p>Place your only faith, reliance, and trust on Karma.<\/p><p>Z.<\/p><h3 class=\"pdf-heading\">Book I · Letter II<\/h3><p>My Dear Brother:<\/p>", "images": []}, {"pdf_page_index": 12, "pdf_page_number": 13, "label": "Book I · Letter II", "html": "<p>Your last long letter came duly to hand and has been read with much pleasure. It is quite rare to find one willing to enter this movement on the basis you have laid down for yourself, and my previous letter was written in order to see what your attitude really was, and also because I then felt from your writing that you were really in earnest. And before yours of to-day, I fell to thinking about you and wondering whether a future of power, a brilliancy of knowledge, was not your aspiration, and what effect certain occurrences would have upon that.<\/p><p>Judge, then, my pleasure in reading your present words exactly answering my mental inquiries of yesterday and placing you in the right position.<\/p><p>It is true, we must aspire ardently, and blessed is the one who, after the first aspiration, is wise enough to see the Truth.<\/p><p>Three qualities forever encompass us: Satwa (truth and stability), Rajas (action, war, aspiration, ambition), Tamas (indifference, ignorance, darkness)<\/p>", "images": []}, {"pdf_page_index": 13, "pdf_page_number": 14, "label": "Book I · Letter II", "html": "<p>None may be ignored. So the path lies from Tamas, up through war, ambition, and aspiration, to Satwa, or truth and stability. We are now in Rajasika regions, sometimes lifting our fingers up to the hem of the garment of Satwa, ever aspiring, ever trying to purify our thoughts and free ourselves from the attachment to actions and objects. So, of course, the ardent student naturally aspires for power. This is wise. But he must soon begin to see what he must do for real progress. For continual aspiration for power, merely, is sure to sow for us the giant weed of self, which is the giant spoken of in Light on the Path.<\/p>", "images": []}, {"pdf_page_index": 14, "pdf_page_number": 15, "label": "Book I · Letter II", "html": "<p>As to the Theosophical Society, all should be admitted, for we can refuse no one. If this is a Universal Brotherhood, we can make no distinctions; but we can put ourselves right in the beginning by seeing that people do not enter with mistaken notions of what we have. And yet with all our precautions, how often we find persons who, not really sincere themselves, judge us by their standard, unbelieving in our sincerity. They enter; they find that each must study for himself and that no guides are told off to each one; then they are disgusted. They forget that “the kingdom of heaven must be taken by violence.” We have also had to suffer from our friends. People have joined us in secret like Nicodemus; they have stood idly by, waiting for the Cause to get strong or to get fashionable, leaving all the hard fighting to be done by a few earnest men who defied the hosts of Materialism and of Conventionality. Had they spoken for their Cause, more earnest people would long ago have heard of the Movement, instead of being kept away until now, like your self, for want of knowledge that it existed.<\/p>", "images": []}, {"pdf_page_index": 15, "pdf_page_number": 16, "label": "Book I · Letter II", "html": "<p>You will find that other members care for nothing but Theosophy, and are yet forced by circumstances to work in other fields as well. What moments they have left are devoted to the Cause, and in consequence they have no unoccupied hours; each moment, day and evening, is filled up, and therefore they are happy. Yet they are unhappy that they cannot give their entire working time to the Cause in which some have been from the beginning. They feel, like Claude St. Martin, a burning desire within them to get these truths to the ears of all men. They are truths, and you are in the right path. In America it is as easy to find the Light of Lights as in India, but all around you are those who do not know these things, who never heard of them; and yet many of our fellow members are anxious to study only for their own benefit. Some times, if it were not for my reliance on those Great Beings who beckon me ever on, I would faint, and, leaving these people to themselves, rush off into the forest. So many people like Theosophy, and yet they at once wish to make it select and of high tone. It is for all men. It is for the common people, who are ever with us. Others, again, come in and wait like young birds for food to be put into them: they will not think, and ages must pass before they will progress.<\/p>", "images": []}, {"pdf_page_index": 16, "pdf_page_number": 17, "label": "Book I · Letter III", "html": "<p>You misunderstood a little the words ‘Do not think much of me.” Underline “much,” but not “think.” You will please think all the thoughts you will of me, but do not place me on any pinnacle: that’s all I meant.<\/p><p>A constant endeavor towards perfecting the mere mortal machine is folly. Thereby we sometimes fail to live up to our own intuitions. This habit goes on for some time, but will get weaker as other senses (inner ones) begin to appear. Yet know the new fully before being off with the old.<\/p><p>Inasmuch as we learn almost solely from each other, as we are all here for each other, the effect of affinities upon our acts and thoughts is enormous and wide. It anon saves us, and anon damns. For we may meet in our lives a person who has a remarkable effect, either for good or ill, because of the affinities engendered in past lives. And now our eyes are open, we act to-day for the future,<\/p><p>That you may pass beyond the sea of darkness, I offer you my life and help.<\/p><p>Z.<\/p><h3 class=\"pdf-heading\">Book I · Letter III<\/h3><p>Say, Brother Jasper, are you tired? I am. Not tired of fate nor of the great “Leaders of the World,” but of all these people who gape and gape and are (excuse me) so Americanly “independent”—as if men were ever independent of each other.<\/p>", "images": []}, {"pdf_page_index": 17, "pdf_page_number": 18, "label": "Book I · Letter III", "html": "<p>You ask about the “moment of choice.” It is made up of all moments. It is not in space or time, but is the aggregation of those moments flying by us each instant. It is referred to in Esoteric Buddhism as a period not yet arrived for the race, when it will as a whole be compelled to make the choice for good or evil. But any single individual can bring on the period for himself. When it will or has come, the uninstructed cannot tell. For the student of occultism it may come in the next instant, or it may come one hundred lives after. But it cannot come this instant unless all the previous lives have led up to it. Yet as regards the student, even if it be presented to him and he refuse, he will be brought to the choice in future existences, with the whole body of his race.<\/p><p>Race influences are insidious and powerful. For instance, my race has its peculiarities deeply seated and inherited from an extraordinary past. I must be under their influence in this body as a necessary part of my experience. In another life I might have been a prosaic Hottentot, or an Englishman, and in a succeeding one I might be under the influence of other race peculiarities. Those influences are, then, guiding me every moment, and each thought I have adds to them now, for either my own future use or for some other person who will come under the power of part of the force generated now by me.<\/p>", "images": []}, {"pdf_page_index": 18, "pdf_page_number": 19, "label": "Book I · Letter III", "html": "<p>As to the sub-conscious mind. It is difficult to explain. I find constantly I have ideas that internally I thoroughly understand, and yet can find no language for. Call it sub-conscious if you like. It is there and can be affected; indeed, it is affected every moment. It is a nearness to the universal mind. So if I desire to influence— say, your mind—I do not formulate your sub-conscious plane, but firmly and kindly think of you and the subject I wish you to think of. This must reach you. If I am selfish, then the thought has more difficulty to get there; but if it be brotherly, then it gets there more easily, being in harmony with the universal mind and the Law. The Psychical Society speaks of it, and says that the influence “emerges into the lower mind” by one or more of the channels. But they do not know what those “channels” are, nor even if they do exist. In fact, the whole subject of mind is only faintly understood in the West. They say “mind,” meaning the vast range and departments of that which they call mind, whereas there must be a need for the names of those departments. When the true ideas are grasped, the names will follow. Meanwhile we must be satisfied with “mind” as including the whole thing. But it does not. Certainly it is not ordinary mental motion—ratiocination—to grasp in an instant a whole subject, premises and conclusions, without stopping to reason. It cannot be called a picture, for with some it comes as an idea, and not as a picture. Memory. What is that? Is it brain-impression; or similarity of vibration, recognized upon being repeated and then producing a picture? If so, then the power to recognize the vibration as the same as before is separate from the matter which vibrates. And how is it possible for the power to inhere in the brain cells, when we know they are constantly being changed? Yet memory is perfect, no matter what happens. That it is above brain is clear, because a man may be killed by having his brain blown to atoms, and yet his “shell” can give all the incidents of his life; they are not taken from the brain, for that is dead, Where, then, is the sub-conscious mind? And where are the channels, and how are they connected? I think through the heart, and that the heart is the key to it all, and that the brain is only the servant of the heart,[1] for remember that there is in it the “small dwarf who sits at the centre.” Think it out on that line now for yourself—or any other line that you may choose, but think.<\/p>", "images": []}, {"pdf_page_index": 19, "pdf_page_number": 20, "label": "Book I · Letter IV", "html": "<p>As ever, Z.<\/p><h3 class=\"pdf-heading\">Book I · Letter IV<\/h3><p>Dear Sir and Brother:<\/p><p>In cogitating lately I thought of you in respect to some of my own thoughts. I was reading a book and looking around within myself to see how I could enlarge my idea of brotherhood. Practice in benevolence will not give it its full growth. I had to find some means of reaching further, and struck on this, which is as old as old age.<\/p><p>I am not separate from anything. “I am that which is.” That is, I am Brahma, and Brahma is everything. But being in an illusionary world, I am surrounded by certain appearances that seem to make me separate. So I will proceed to mentally state and accept that I am all these illusions. I am my friends,—and then I went to them in general and in particular. I am my enemies; then I felt them all. I am the poor and the wicked; I am the ignorant.<\/p>", "images": []}, {"pdf_page_index": 20, "pdf_page_number": 21, "label": "Book I · Letter IV", "html": "<p>Those moments of intellectual gloom are the moments when I am influenced by those ignorant ones who are myself. All this in my nation. But there are many nations, and to those I go in mind; I feel and I am them all, with what they hold of superstition or of wisdom or evil. All, all is myself. Unwisely, I was then about to stop, but the whole is Brahma, so I went to the Devas and Asuras;[2] the elemental world, that too is myself. After pursuing this course a while, I found it easier to return to a contemplation of all men as myself. It is a good method and ought to be pursued, for it is a step toward getting into contemplation of the All. I tried last night to reach up to Brahma, but darkness is about his pavilion.<\/p><p>Now what does all this insanity sound like? I’ll tell you what:<\/p><p>if it were not for this insanity I would go insane. But shall I not take heart, even when a dear friend deserts me and stabs me deep, when I know that he is myself?<\/p><p>NAMASTAE.!<\/p><p>Z<\/p>", "images": []}, {"pdf_page_index": 21, "pdf_page_number": 22, "label": "Book I · Letter V", "html": "<p>I found the above letter still more valuable when I remembered that Brahma is “the universal expansive force of Nature”—from Brih, to expand; and so stated in an article by H. P. Blavatsky in Five Years of Theosophy [1st ed., p. 184]. In the Dhammapada we are told to think ourselves to be the sun and stars, the wet and dry, heat and cold; in short, to feel all experience, for we can live all out in the mind.                                                                                                                                                 J. N.<\/p><h3 class=\"pdf-heading\">Book I · Letter V<\/h3><p>Dear Jasper:<\/p><p>I wish I could answer your letter as you ought to have it done. But I feel my inability. However, our duty is to never consider our ability, but to do what comes to be done in whatever way we can, no matter how inadequate the work appears to others. When we stop to consider our weakness, we think, by comparison, of how another would do it. Our only right is in the act itself. The consequences are in the great Brahm. So I will just say what comes.<\/p>", "images": []}, {"pdf_page_index": 22, "pdf_page_number": 23, "label": "Book I · Letter V", "html": "<p>I feel the sadness in your letter, but know that you will rebound from that. Do not let the sadness of knowledge create despair; that sadness is less than the joy of Truth. Abstract Truth, even, has necessarily in it all the mercy there is in the whole. Its sternness is only a reflection from our own imperfections, which make us recognize the stern aspect alone. We are not the only ones to suffer upon the Path. Like ourselves, Masters have wept, though They do not now weep. One of them wrote some years ago: “Do you suppose we have not passed through many times worse trials than you now think you are in?” The Master often seems to reject and to hide his (spiritual) face, in order that the disciple may try. On the doors and walls of the temple the word “Try” is written. (“The Brothers” is a better designation than Mahâtmas or Masters.)<\/p>", "images": []}, {"pdf_page_index": 23, "pdf_page_number": 24, "label": "Book I · Letter V", "html": "<p>Along the path of the true student is sadness, but also there is great joy and hope. Sadness comes from a more just appreciation of the difficulties in one’s way, and of the great wickedness of the individual and collective heart of man. But look at the great fountain of hope and of joy in the consideration that the Brothers exist, that They were men too; They had to fight the fight; They triumphed, and They work for those left after Them. Then beyond Them are “the Fathers,” that is, the spirits of “just men made perfect,” those Who lived and worked for humanity ages ago and Who are now out of our sphere, but Who nevertheless still influence us in that Their spiritual forces flow down upon this earth for all pure souls. Their immediate influence is felt by Masters, and by us through the latter.<\/p><p>Now, as you say, it is all Faith; but what is Faith? It is the intuitional feeling—”that is true.” So, formulate to yourself certain things as true that you feel to be true, and then increase your faith in them.<\/p>", "images": []}, {"pdf_page_index": 24, "pdf_page_number": 25, "label": "Book I · Letter VI", "html": "<p>Don’t be anxious. Don’t get “maddened.” Because in the fact that you are “maddened” (of course in the metaphorical sense) is found the proof that you are anxious. In a worldly sense it is perhaps well to be anxious about a highly important matter, but in occultism it is different, for the Law takes no account of our projects and objects, or our desire to be ahead or behind. So, if we are anxious, we raise a barrier against progress, by perturbation, and straining harshly. You wrote to B. that what is his, is his. Then the converse is true; what is not, is not. Why don’t you take your own medicine?<\/p><p>Yours, Z<\/p><h3 class=\"pdf-heading\">Book I · Letter VI<\/h3><p>Dear Jasper:<\/p>", "images": []}, {"pdf_page_index": 25, "pdf_page_number": 26, "label": "Book I · Letter VI", "html": "<p>It is a great advance that you hear the bells, which few hear, and evidence that you are where you can hear them; that is a great deal indeed, Do not look for the voice of the bells, but regard the ideas which thereupon come into the head, and apply to them the touchstone of your own Soul, just as you advised B. The fact that you feel “dead” is something you should not worry about. It is likely that you are under the operation of a law which prevails in nature, and which you will find referred to in an article in Path Magazine for April, ‘86, page 14. It is that the soul goes to a new place or new surroundings and becomes silent awhile—what you call “dead”—and draws strength there, and begins to get accustomed to its new surroundings, after which it begins to move about. This is seen in ordinary life in the bashfulness of a boy. That is, the bashfulness is the shyness felt in new surroundings, and is just what happens when the soul goes to a new place or into new surroundings.<\/p><p>There can be no loss or detriment to our efforts. Every aspiration higher brightens up the road connecting the higher and lower self. No doubt of that. It is not what is done, but the spirit in which the least thing is done that is counted. Hear the word of the Master:<\/p><p>“He who does the best he knows how and that he can do, does enough for us.”<\/p>", "images": []}, {"pdf_page_index": 26, "pdf_page_number": 27, "label": "Book I · Letter VI", "html": "<p>The mere fact that a man appreciates these truths and feels these aspirations is proof that he is on the right road. It is well to tread it now. We will not always live. Death must come. How much better, then, to embrace death while thus at work than to swerve off only to be brought up with suddenness in after lives. Immediate rebirth is for those who are always working with their hearts on Master’s work and free from self-interest.<\/p><p>The one Spirit is in all, is the property of each; therefore It is always there, always with us, and by reflecting on that, little room is left for sorrow or delusion. If we believe that the soul of all is measured by the whole of Time and not by a part, then we care not for these moments which relate alone to our body. If we live in our hearts we soon prove that space and time exist not. Nothing foreign to Master enters there; our faults are not there. The heart reaches Him always, and no doubt He replies. He does, I know. He helps us while He leaves us to ourselves. He needs not stoop to see our devotion, for that is of a supernal quality and reaches anywhere.<\/p>", "images": []}, {"pdf_page_index": 27, "pdf_page_number": 28, "label": "Book I · Letter VI", "html": "<p>No, I do not say nor have I said that you ought to do something other than you do. We each do what we can. None of us can be the judge of any creature existing; so I do not judge you in the least respect. Your life may in the great sum total be greater than any life I ever led or that anyone has led. Whether you are in America, Europe, or India makes no difference. That is seeking conditions. I have come to understand that Masters themselves must have worked up out of much worse conditions than we are in. No matter where we are, the same spirit pervades all and is accessible. What need, then, to change places? We do not change ourselves by moving the body to another locus. We only put it under a different influence. And in order to change we must have got to dislike the place we moved from. That is attachment by opposites, and that will produce detriment, as does all that disturbs the equilibrium of the soul. You know the same result is produced by two exact opposites, and thus extremes meet.<\/p>", "images": []}, {"pdf_page_index": 28, "pdf_page_number": 29, "label": "Book I · Letter VI", "html": "<p>That hot flame you speak of is one of the experiences, as are also the sounds. There are so many, many of these things. Often they result from extreme tension or vibration in the aura of an aspirant of pure devotion. They are himself, and he should be on his guard against taking them for wonders. Often they are “apparitions in Brahm.” They are like new lights and sights to a mariner on an unfamiliar coast. They will go on, or alter, or stop. You are only to carefully note them, and “do not exhibit wonder nor form association.”<\/p><p>I cannot say more. All help you extend to any other soul is help to yourself. It is our duty to help all, and we must begin on those nearest to us, for to run abroad to souls we might possibly help we again forsake our present duty. It is better to die in our own duty, however mean, than to try another one. So lift your head and look around upon the hulks of past imagined faults. They were means and teachers. Cast all doubt, all fear, all regret aside, and freely take of truth what you may contain right on every step. It will thus be well. Eternal Truth is one and indivisible, and we may get from the Fathers (Pitris) flashes now and then of what is true.<\/p>", "images": []}, {"pdf_page_index": 29, "pdf_page_number": 30, "label": "Book I · Letter VI", "html": "<p>Words are things. With me and in fact. Upon the lower plane of social intercourse they are things, but soulless and dead because that convention in which they have their birth has made abortions of them. But when we step away from that conventionality, words become alive in proportion to the reality and purity of the thought that is behind them. So in communication between two students they are things, and students must be careful that the ground of intercourse is fully understood. Let us use with care those living messengers called words.<\/p><p>Where I see you mistaken I will speak, to warn my Brother who temporarily knows not. For did I not call on the bugle, perhaps other things might switch him off to where for the time he would be pleased, but would again be sorry; and then when his mistake was plain, he would justly sigh to me across dark centuries of separation that I had been false to my duty of warning.<\/p><p>As ever, Z.<\/p>", "images": []}, {"pdf_page_index": 30, "pdf_page_number": 31, "label": "Book I · Letter VI", "html": "<p>The new plane to which the soul may go, referred to in this letter, is the astral plane. It is the plane next above the material one, and consists of a subtile order of matter. When a student turns his attention to the higher life and desires intensely to find the way, his soul has begun to awaken and to speak. It has heard the voice of the spirit. Then the inner senses begin to unfold, at first ever so gently, so tenderly, we scarce hear their report. But the soul has then turned its attention to the astral plane, that being the next one to be learned on the way upward; its energy is transferred from the material plane to this one, and we have an influx of many confused dreams and strange experiences, awake and asleep. These may or may not continue; all depends upon the individual soul and upon Karma. It is a most confusing plane. and generally speaking, we may say that those students are more fortunate who make a marked degree of progress in spiritual things without having any conscious experience of the astral plane. For then they can later on learn it from above, instead of from below, and with far less danger to themselves. The whole must be known, but we may progress in various ways, even by discontinuous degrees, only then we must go back later on, to what we passed by. Such a going back does not imply detriment or loss of degree, for such cannot be lost when once gained in reality.<\/p>", "images": []}, {"pdf_page_index": 31, "pdf_page_number": 32, "label": "Book I · Letter VII", "html": "<p>‘With regard to the astral plane being a more subtile order of matter, this truth is often denied by clairvoyants and untrained seers. They do not distinguish between the psychic senses and the spiritual. They can see through gross matter, such as a wall, the human body, and so forth, as if it were glass; but they cannot see through astral substance, and hence they believe its forms and all the pictures and shapes in the astral light to be real. Only the adept sees through these illusions, which are far more powerful because composed of a subtile order of matter: subtile energies, fine forces have a highly increased rate of power over grosser ones. The adept has at his command the rate of vibration which dispels them or drives them asunder. In speaking of the astral plane, I mean the lower soul plane, and not that higher and purified quality which the author of Light on the Path calls the “divine astral.”<\/p><p>By anxiety we exert the constrictive power of egoism, which densifies and perturbs our magnetic sphere, rendering us less permeable to the efflux from above.<\/p><p>J. N.<\/p><h3 class=\"pdf-heading\">Book I · Letter VII<\/h3><p>Dear Jasper:<\/p>", "images": []}, {"pdf_page_index": 32, "pdf_page_number": 33, "label": "Book I · Letter VII", "html": "<p>I have your letter, Comrade, in which you say how much you wish there were some Adepts sent to the United States to help all true students. Yet you know well They do not need to come here in person, in order to help. By going carefully over your letter there appears to me the possibility of the seed of doubt in your heart as to the wise ordering of all things, for all are under the Law, and Masters first of all. Mind, I only say the “possibility of the seed of doubt.” For I judge from my own experience. Well do I remember when I thought, as you say—how much better ‘twould be if some one were there.<\/p>", "images": []}, {"pdf_page_index": 33, "pdf_page_number": 34, "label": "Book I · Letter VII", "html": "<p>If that is allowed to remain, it will metamorphose itself into a seed, and afterward a plant, of doubt. Cast it right out! It does not now show as seed of doubt, but in the case of metamorphosis, the change would be so great as to deceive you into thinking it were never from the same root. The best stand to take is—it is all right as it is now, and when the time comes for it to be better, it will be so. Meanwhile we have a duty to see that we do all we can in our own place as we see best, undisturbed and undismayed by aught. How much I have in years gone away said and thought those very words of yours, and to no profit! Why do you care what becomes of a million human beings? Are not millions going to death daily with no one to tell them of all this? But did you suppose that all this was not provided for? “And heavenly death itself is also well provided for.” Now, then, you and I must learn to look on the deaths or the famishing of millions of beings with unfaltering heart. Else we had better give it all up now. Consider that at this moment are so many persons in various far-distant places who cannot ever hear these truths. Do you grieve for them? Do you realize their state? No: you realize the same thing only partially among those with whom it was your present lot to be born—I mean the nation. Do you want to do more than your best? Do you covet the work of another? No; you do not. You will sit calmly where you are, then, and with an unaffected heart, picture to yourself the moral and physical deaths and famines which are now without the possibility of prevention or amelioration. Your faith will know that all is provided for.<\/p>", "images": []}, {"pdf_page_index": 34, "pdf_page_number": 35, "label": "Book I · Letter VII", "html": "<p>I do not say that you must attain to that calm now or give up seeking the Way: but I do say that you must admit that such an attainment must be absolutely tried for. For of such is the trial, and why should we care? We must some day be able to stand any shock, and to get ready for that time we must be triumphant now over some smaller things. Among others is the very position you and I are now in; that is, standing our ground and feeling ourselves so much and so awfully alone. But we know that They have left us a commandment. That we keep, although now and then objects, senses, men, and time conspire to show us that Masters laugh at us. It is all a delusion. It is only one consequence of our past Karma now burning itself out before our eyes. The whole phantasmagoria is only a picture thrown up against the Screen of Time by the mighty magic of Prakriti (Nature). But you and I are superior to Nature. Why, then, mind these pictures? Part of that very screen, however, being our own mortal bodies, we cannot help the sensation derived therefrom through our connection with the body. It is only another form of cold or heat: and what are they? They are vibrations: they are felt; they do not really exist in themselves. So we can calmly look on the picture as it passes fragmentarily through those few square feet contained within the superficial boundaries of our elementary frame. We must do so, for it is a copy of the greater, of the universal form. For otherwise we will never be able to understand the greater picture. Now, then, is there not many a cubic inch of your own body which is entitled to know and to be the Truth in greater measure than now? And yet you grieve for the ignorance of so many other human beings! Grieve on; and I grieve, too, Do not imagine that I am what is there written, Not so. I am grieving just the same outwardly, but inwardly trying what I have just told you. And what a dream all this is. Here I am writing you so seriously, and now I see that you know it all quite well and much better than I do.<\/p>", "images": []}, {"pdf_page_index": 35, "pdf_page_number": 36, "label": "Book I · Letter VII", "html": "<p>Yet, my dear Jasper, now and then I feel—not Doubt of Masters, who hear any heartbeat in the right direction, but—a terrible Despair of these people. Oh, my God! The age is black as hell, hard as iron. It is iron, it is Kali Yuga. Kali is always painted black. Yet Kali Ynga, by its very nature and terrible, swift momentum, permits one to do more with his energies in a shorter time than in any other Yuga. But heavens, what a combat! Demons from all the spheres; waving clouds of smoky Karma: dreadful shapes; stupefying exhalations from every side. Exposed at each turn to new dangers. Imagine a friend walking with you who you see is in the same road, but all at once he is permeated by these things of death and shows a disposition to obstruct your path, the path of himself. Yes; the gods are asleep for a while. But noble hearts still walk here, fighting over again the ancient fight. They seek each other, so as to be of mutual help. We will not fail them. To fail would be nothing, but to stop working for Humanity and Brotherhood would be awful. We cannot; we will not. Yet we have not a clear road. No, it is not clear. I am content if I can see the next step in advance, only. You seek The Warrior. He is here, somewhere. No one can find him for you. You must do that. Still He fights on. No doubt He sees you and tries to make you see Him. Still He fights on and on.<\/p>", "images": []}, {"pdf_page_index": 36, "pdf_page_number": 37, "label": "Book I · Letter VII", "html": "<p>How plainly the lines are drawn, how easily the bands are seen. Some want a certificate, or an uttered pledge, or a secret meeting, or a declaration, but, without any of that, I see those who—up to this hour—I find are my “companions.” They need no such folly. They are there; they hear and understand the battle-cry, they recognize the sign. Now where are the rest? Many have I halted, and spoken the exact words to them, have exposed to them my real heart, and they heard nothing; they thought that heart was something else. I sigh to think how many. Perhaps I overlooked some; perhaps some did not belong to me. There are some who partly understood the words and the sign, but they are not sure of themselves; they know that they partake of the nature, but are still held back.<\/p><p>Do you not see, Jasper, that your place in the ranks is well known? You need no assurances because they are within you.<\/p><p>Now what a dreadful letter; but it is all true.<\/p>", "images": []}, {"pdf_page_index": 37, "pdf_page_number": 38, "label": "Book I · Letter VII", "html": "<p>A student of occultism after a while gets into what we may call a psychic whirl, or a vortex of occultism. At first be is affected by the feelings and influences of those about him. That begins to be pushed off and he passes into the whirl caused by the mighty effort of his Higher Self to make him remember his past lives. Then those past lives affect him. They become like clouds throwing shadows on his path. Now they seem tangible and then fade away, only a cloud. Then they begin to affect his impulse to action in many various ways. To-day he has vague calling longings to do something, and critically regarding himself, he cannot see in this life any cause. It is the bugle note of a past life blown almost in his face. It startles him; it may throw him down, Then it starts before him, a phantom, or, like a person behind you as you look at a mirror, it looks over his shoulder. Although dead and past they yet have a power. He gets, too, a power and a choice. If all his previous past lives were full of good, then irresistible is the force for his benefit. But all alike marshal up in front, and he hastens their coming by his effort. Into this vortex about him others are drawn, and their germs for good or ill ripen with activity. This is a phase of the operation of Karmic stamina. The choice is this: these events arrive one after the other and, as it were, offer themselves. If he chooses wrong, then hard is the fight. The one chosen attracts old ones like itself perhaps, for all have a life of their own. Do you wonder that in the case of those who rush unprepared into the “circle of ascetics” and before the ripe moment, insanity sometimes results? But then that insanity is their safety for the next life, or for their return to sanity.<\/p>", "images": []}, {"pdf_page_index": 38, "pdf_page_number": 39, "label": "Book I · Letter VII", "html": "<p>Receive my brotherly assurances, my constant desire to help you.<\/p>", "images": []}, {"pdf_page_index": 39, "pdf_page_number": 40, "label": "Book I · Letter VII", "html": "<p>In respect to Karmic action it is well to recall the statement of Patanjali that “works exist only in the shape of mental deposits.” (Book 2, Aph. 12, A.) By “works” is here meant Karma, the stock of works, or Action. Its results remain as mental deposits or potential energies in the higher part of the fifth principle, and when it reincarnates those seeds are there to “ripen on the tablets of the mind” whenever they are exposed to favoring circumstances. Sometimes they remain dormant for want of something to arouse them, as in the case of children. “The mental deposits of works, collected from time without beginning in the ground of the mind, as they by degrees arrive at maturation, so do they, existing in lesser or greater measure (the sum of merit being less than that of demerit, or conversely), lead to their effects in the shape of rank, raised or lowered . . . or experience of good or ill.” (Book 2, Aph. 13. B.) The mind energizes and impels us to fresh action. The impulse lies within, in germ, and may be ripened by interior or exterior suggestion. Can we, then, be too careful to guard the ground of the mind, to keep close watch over our thoughts? Thoughts are dynamic. Each one as it leaves the mind has a vis viva of its own, proportionate to the intensity with which it was propelled. As the work done by a moving body is proportionate to the square of its velocity, we may say that the force of thoughts is to be measured by the square or quadrupled power of their spirituality, so greatly do these finer forces increase by activity. The spiritual force, being impersonal, fluidic, not bound to any constricting center, acts with unimaginable swiftness. A thought, on its departure from the mind, is said to associate itself with an elemental; it is attracted wherever there is a similar vibration, or, let us say, a suitable soil, just as the winged thistle-seed floats off and sows itself in this spot and not in that, in the soil of its natural selection. Thus the man of virtue, by admitting a material or sensual thought into his mind—even though he expel it—sends it forth to swell the evil impulses of the man of vice, from whom he imagines himself separated by a wide gulf, yet to whom he may have just given a fresh impulse to sin, Many men are like sponges, porous and bibulous, ready to suck up every element of the order preferred by their nature. We all have more or less of this quality; we attract what we love, and we may derive a greater strength from the vitality of thoughts infused from without than from those self-reproduced within us at a time when our nervous vitality is exhausted. It is a solemn thought, this, of our responsibility for the impulse of another. We live in one another, and our widely different deeds have often a common source. The occultist cannot go far upon his way without realizing to what a great extent he is “his brother’s keeper.” Our affinities are ourselves, in whatever ground they may live and ripen.<\/p>", "images": []}, {"pdf_page_index": 40, "pdf_page_number": 41, "label": "Book I · Letter VIII", "html": "<p>J. N.<\/p><h3 class=\"pdf-heading\">Book I · Letter VIII<\/h3><p>Dear Jasper:<\/p><p>I seize a few moments to acknowledge your letter. This is a period of waiting, of silence. Nothing seems alive. All oracles are silent. But the great clock of the Universe still goes on, unheeding. On Sunday I engaged in Meditation and received some benefit. I wished I could see you to speak of it. Yet these things are too high for words, and when we approach the subjects we are not able to give expression to our thoughts. We do not live up to our highest soul possibilities. All that prevents our reaching up to the high thoughts of the far past is our own weakness, and not the work of any other. How petty seem the cares of this earth when we indulge in deep reflection; they are then seen for what they are, and later on they are obliterated. It is true that the road to the gods is dark and difficult, and as you say. we get nothing from them at first call; we have to call often. But we can on the way stop to look ahead, for no matter how sombre or howsoever weak our-selves, the Spectator sees it all and beckons to us, and whispers, “Be of good courage, for I have prepared a place for you where you will be with me forever.” He is the Great Self; He is our-selves.<\/p>", "images": []}, {"pdf_page_index": 41, "pdf_page_number": 42, "label": "Book I · Letter VIII", "html": "<p>The Leaders of the world are always trying to help us. May we pass the clouds and see them ever. We must be patient. All our obstructions are of our own making. All our power is the storage of the past. That store we all must have; who in this life feels it near is he who has in this life directed his thoughts to the proper channel. That others do not feel it is because they have lived but blindly. That you do not feel it and see it more is because you have not yet directed all your mental energies to it. This great root of Karmic energy can be drawn upon by directing to it the fire of our minds. Towards Love of course is the right way— the Love of the Divine and of all beings. If we feel that after all we are not yet “Great Souls” who participate in the totality of those “Souls who wait upon the gods,” it need not cast us down: we are waiting our hour in hope. Let us wait patiently, in the silence which follows all effort, knowing that thus Nature works, for in her periods of obscuration she does naught where that obscuration lies, while doubtless she and we, too, are then at work on other spheres.<\/p>", "images": []}, {"pdf_page_index": 42, "pdf_page_number": 43, "label": "Book I · Letter VIII", "html": "<p>That described by you is not the soul; it is only a partial experience. Did you know the Soul, then could you yourself reply to all those questions, for all knowledge is there. In the soul is every creature and every thought alike. That sinking down of your thoughts to the center is practice. It can be done and we cannot explain it; we can only say “do it.” Still, do not hunger to do these things. The first step in becoming is Resignation. Resignation is the sure, true, and royal road. Our subtle motives, ever changing, elude us when we seek it. You are near to it; it needs a great care. But while the body may be requiring time to feel its full results, we can instantly change the attitude of the mind. After Resignation, follow (in their own order) Satisfaction, Contentment, Knowledge. Anxiety to do these things is an obscurant and deterrent, So, try to acquire patient Resignation. The lesson intended by the Karma of your present life is the higher patience. I can tell you nothing on this head; it is a matter for self and practice. Throw away every wish to get the power, and seek only for understanding of thyself. Insist on carelessness. Assert to yourself that it is not of the slightest consequence what you were yesterday, but in every moment strive for that moment; the results will follow of themselves.<\/p>", "images": []}, {"pdf_page_index": 43, "pdf_page_number": 44, "label": "Book I · Letter VIII", "html": "<p>The Past! What is it? Nothing. Gone! Dismiss it. You are the past of yourself. Therefore it concerns you not as such. It only concerns you as you now are. In you, as you now exist, lies all the past. So follow the Hindu maxim: “Regret nothing; never be sorry; and cut all doubts with the sword of spiritual knowledge.” Regret is productive only of error. I care not what I was, or what any one was. I only look for what I am each moment. For as each moment is and at once is not, it must follow that if we think of the past we forget the present, and while we forget, the moments fly by us, making more past. Then regret nothing, not even the greatest follies of your life, for they are gone, and you are to work in the present which is both past and future at once. So then, with the absolute knowledge that all your limitations are due to Karma, past or in this life, and with a firm reliance ever upon Karma as the only judge, which will be good or bad as you make it, yourself, you can stand anything that may happen and feel serene, despite the occasional despondencies which all feel, but which the light of Truth always dispels. This verse always settles everything:<\/p><p>“In him who knows that all spiritual beings are the same in kind with the Supreme Being, what room can there be for delusion and what room for sorrow when he reflects upon the unity of spirit?”<\/p>", "images": []}, {"pdf_page_index": 44, "pdf_page_number": 45, "label": "Book I · Letter VIII", "html": "<p>In all these inner experiences there are tides, as well as in the ocean. We rise and fall. Anon the gods descend, and then they return to heaven. Do not think of getting them to descend, but strive to raise yourself higher on the road down which they periodically return, and thus get nearer to them, so that you shall in fact receive their influences sooner than before.<\/p><p>Adios. May you ever feel the surge of the vast deeps that lie beyond the heart’s small ebb. Perhaps our comrades are coming nearer. Who knows? But even if not, then we will wait; the sun must burst some day from the clouds. This will keep us strong, as, in the company of the Dweller of the Threshold, we have perforce to stare and sham awhile.<\/p><p>Z.—————<\/p>", "images": []}, {"pdf_page_index": 45, "pdf_page_number": 46, "label": "Book I · Letter VIII", "html": "<p>The “higher patience” alluded to also requires a care. It is the fine line between pride and humility. Both are extremes and mistakes; oscillations from one to the other are only a trifle better. How shall we be proud when we are so small? How dare we be humble when we are so great? In both we blaspheme. But there is that firm spot between the two which is the place “neither too high nor too low” on which Krishna told Arjuna to sit; a spot of his own. It is the firm place which our faith has won from the world. On it we are always to stand calmly, not overshadowed by any man however great, because each of us contains the potentialities of every other. “Not overshadowed” does not mean that we are not to show reverence to those through whom the soul speaks. It is the great soul we reverence, and not the mortal clay. We are to examine thoughtfully all that comes to us from such persons, and all that comes to us from any source wearing the aspect of truth, and try faithfully to see wherein it may be true, laying it aside, if we fail, as fruit not ripe for us yet. We are not to yield up our intuitions to any being, while we may largely doubt our judgment at all times. We are not to act without the inner asseveration, but we must not remain ignorant of the serious difficulties of separating this intuitive voice from the babble and prattle of fancy, desire, or pride. If we are just to ourselves we shall hold the balance evenly. How can we be just to any other, who are not just to ourselves? In the Law, a man suffers as much from injustice to himself as to another; it matters not in whose interests he has opposed the universal currents; the Law only knows that he has tried to deflect them by an injustice. It takes no account of persons nor even of ignorance of the Law. It is an impartial, impersonal force, only to be understood by the aid of the higher patience, which at once dares all and endures all.<\/p>", "images": []}, {"pdf_page_index": 46, "pdf_page_number": 47, "label": "Book I · Letter IX", "html": "<p>“Never regret anything.” Regret is a thought, hence an energy. If we turn its tide upon the past, it plays upon the seeds of that past and vivifies them; it causes them to sprout and grow in the ground of the mind: from thence to expression in action is but a step. A child once said to me when I used the word “Ghosts,” “Hush! Don’t think of them. What we think of always happens.” There are no impartial observers like children when they think away from themselves.                                                                                                                                      J. N.<\/p><h3 class=\"pdf-heading\">Book I · Letter IX<\/h3><p>Dear Sir and Brother:<\/p>", "images": []}, {"pdf_page_index": 47, "pdf_page_number": 48, "label": "Book I · Letter IX", "html": "<p>Tell your friend and inquirer this: No one was ever converted to Theosophy. Each one who really comes into it does so because it is only “an extension of previous beliefs.” This will show you that Karma is a true thing. For no idea we get is any more than an extension of previous ones. That is, they are cause and effect in endless succession. Each one is the producer of the next and inheres in that successor. Thus we are all different, and some similar. My ideas of today, and yours, are tinged with those of youth, and we will thus forever pr
