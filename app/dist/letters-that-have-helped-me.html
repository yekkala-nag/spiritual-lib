igher by reporting or conveying His reply.<\/p><p>TO ASPIRANTS FOR CHELASHIP<\/p>", "images": []}, {"pdf_page_index": 104, "pdf_page_number": 105, "label": "Book I · Letter XIV", "html": "<p>Sincere interest in Theosophic truth is often followed by sincere aspiration after Theosophic life, and the question continually recurs, What are the conditions and the steps to chelaship; to whom should applications be made; how is the aspirant to know that it has been granted?<\/p><p>As to the conditions and the discipline of chelaship, not a little has been disclosed in The Theosophist, Man, Esoteric Buddhism, and other works upon Theosophy; and some of the qualifications, difficulties, and dangers have been very explicitly set forth by Madame Blavatsky in her article upon “Theosophical Mahatmas” in the Path of December, 1886. To everyone cherishing even a vague desire for closer relations to the system of development through which Masters are produced, the thoughtful study of this article is earnestly commended. It will clear the ground of several misconceptions, deepen the sense of the seriousness of such an effort, and excite a healthy self-distrust which is better before than after the gate has been passed.<\/p>", "images": []}, {"pdf_page_index": 105, "pdf_page_number": 106, "label": "Book I · Letter XIV", "html": "<p>It is entirely possible, however, that the searching of desire and strength incited by that article may only convince more strongly of sincerity, and that not a few readers may emerge from it with a richer purpose and a deeper resolve. Even where there is not a distinct intention to reach chelaship, there may be an eager yearning for greater nearness to the Masters, for some definite assurance of guidance and of help. In either of these cases the question at once arises before the aspirant. Who is to receive the application, and how is its acceptance to be signified?<\/p><p>The very natural, indeed the instinctive, step of such an aspirant is to write to an officer of a Theosophical Society. None the less is this a mistake. For a Theosophical Society is an exoteric body, the Lodge of Masters wholly esoteric. The former is a voluntary group of inquirers and philanthropists, with avowed aims, a printed Constitution, and published officers, and, moreover, expressly disavowing any power, as a Society, to communicate with Masters; the latter is an Occult Lodge, of whose address, members, processes, functions, nothing is known. It follows, therefore, that there is no person, no place, no address, to which an aspirant may appeal.<\/p><p>Let it be supposed, however, that such an inquiry is preferred to a person advanced in Occult study, versed in its methods and tests and qualifications. Assuredly his reply would be directly to this effect:<\/p>", "images": []}, {"pdf_page_index": 106, "pdf_page_number": 107, "label": "Book I · Letter XIV", "html": "<p>“If you were now fitted to be an accepted chela, you would of yourself know how, where, and to whom to apply. For the becoming a chela in reality consists in the evolution or development of certain spiritual principles latent in every man, and in great measure unknown to your present consciousness, Until these principles are to some degree consciously evolved by you, you are not in practical possession of the means of acquiring the first rudiments of that knowledge which now seems to you so desirable. Whether It is desired by your mind or by your heart is still another important question, not to be solved by any one who has not yet the clew to Self.<\/p><p>“It is true that these qualities can be developed (or forced) by the aid of an Adept. And most applicants for chelaship are actuated by a desire to receive instructions directly from the Masters. They do not ask themselves what they have done to merit a privilege so rare. Nor do they consider that, all Adepts being servants of the Law of Karma, it must follow that, did the applicant now merit Their visible aid, he would already possess it and could not be in search of it. The indications of the fulfilment of the Law are, in fact, the partial unfolding of those faculties above referred to.<\/p>", "images": []}, {"pdf_page_index": 107, "pdf_page_number": 108, "label": "Book I · Letter XIV", "html": "<p>“You must, then, reach a point other than that where you now stand, before you can even ask to be taken as a chela on probation. All candidates enter the unseen Lodge in this manner, and it is governed by Laws containing within themselves their own fulfilment and not requiring any officers whatever. Nor must you imagine that such a probationer is one who works under constant and known direction of either an Adept or another chela. On the contrary, he is tried and tested for at least seven years, and perhaps many more, before the point is reached when he is either accepted (and prepared for the first of a series of initiations often covering several incarnations) , or rejected. And this rejection is not by any body of men just as they incline, but is the natural rejection by Nature. The probationer may or may not hear from his Teacher during this preliminary period; more often he does not hear. He may be finally rejected and not know it, just as some men have been on probation and have not known it until they suddenly found themselves accepted. Such men are those self-developed persons who have reached that point in the natural order after many incarnations, where their expanded faculties have entitled them to an entrance into the Hall of Learning or the spiritual Lodge beyond. And all I say of men applies equally to women.<\/p>", "images": []}, {"pdf_page_index": 108, "pdf_page_number": 109, "label": "Book I · Letter XIV", "html": "<p>“When anyone is regularly accepted as a chela on probation, the first and only order he receives (for the present) is to work unselfishly for humanity—sometimes aiding and aided by some older chela—while striving to get rid of the strength of the personal idea. The ways of doing this are left to his own intuition entirely, inasmuch as the object is to develop that intuition and to bring him to self-knowledge, It is his having these powers in some degree that leads to his acceptance as a probationer, so that it is more than probable that you have them not yet save as latent possibilities. In order to have in his turn any title to help, he must work for others, but that must not be his motive for working. He who does not feel irresistibly impelled to serve the Race, whether he himself fails or not, is bound fast by his own personality, and cannot progress until he has learned that the race is himself and not that body which he now occupies. The ground of this necessity for a pure motive was recently stated in Lucifer to be that ‘unless the intention is entirely unalloyed, the spiritual will transform itself into the psychic, act on the astral plane, and dire results may be produced by it. The powers and forces of animal nature can be equally used by the selfish and revengeful as by the unselfish and all-forgiving; the powers and forces of spirit lend themselves only to the perfectly pure in heart,’[9]<\/p>", "images": []}, {"pdf_page_index": 109, "pdf_page_number": 110, "label": "Book I · Letter XIV", "html": "<p>“It may be stated, however, that even those natural forces cannot be discovered by any man who has not obtained the power of getting rid of his personality in some degree. That an emotional desire to help others does not imply this freedom from personality may be seen by the fact that, if you were now perfected in unselfishness in the real sense, you would have a conscious existence separate from that of the body and would be able to quit the body at will: in other words, to be free from all sense of self is to be an Adept, for the limitations of self inhibit progress.<\/p><p>“Hear also the words of the Master, taken from Sinnett’s The Occult World. ‘Perhaps you will better appreciate our meaning when told that in our view the highest aspirations for the welfare of humanity become tainted with selfishness if, in the mind of the philanthropist, there lurks the shadow of a desire for self-benefit or a tendency to do injustice, even when these exist unconsciously to himself.’<\/p>", "images": []}, {"pdf_page_index": 110, "pdf_page_number": 111, "label": "Book I · Letter XIV", "html": "<p>“While setting forth these facts, as well as the dangers and difficulties—both those set ones appointed by the laws of the Lodge and the more innumerable ones adjudged by Karma and hastened by the efforts of the neophyte—it should also be stated that the Masters desire to deter no man from entering the path. They are well aware, however, from the repeated trials and records of centuries, and from their knowledge of our racial difficulties, how few are the persons who have any clew to their own real nature, which is the foe they attempt to conquer the moment they become pupils of the occult. Hence They endeavor, so far as Karma permits, to hold unfit individuals back from rash ventures, the results of which would recoil upon their unbalanced lives and drive them to despair. The powers of evil, inadequately defied by the ignorant man, revenge themselves upon him as well as upon his friends, and not upon those who are above their reach. Although these powers are not hideous objective shapes coming in tangible ways, they are none the less real and dangerous. Their descent in such instances cannot be prevented: it is Karma.<\/p><p>“To lose all sense of self, then, implies the loss of all that ordinary men most value in themselves. It therefore behooves you to seriously consider these points:<\/p>", "images": []}, {"pdf_page_index": 111, "pdf_page_number": 112, "label": "Book I · Letter XIV", "html": "<p>“1st. What is your motive in desiring to be a chela? You think that motive is well known to you, whereas it is hidden deep within you, and by that hidden motive you will be judged. It has flared up from unseen regions upon men sure of themselves, has belched out in some lurid thought or deed of which they esteemed them-selves incapable, and has overthrown their life or reason. There-fore test yourself ere Karma tests you.<\/p><p>“2d. What the place and duties of a true neophyte are.<\/p><p>“When you have seriously considered both for twenty-one days, you may, if your desire remains firm, take a certain course open to you. It is this.<\/p>", "images": []}, {"pdf_page_index": 112, "pdf_page_number": 113, "label": "Book I · Letter XIV", "html": "<p>“Although you do not now know where you can offer yourself to Masters themselves as a chela on probation, yet, in forming that desire in your heart and in re-affirming it (if you do) after due consideration of these points you have then to some extent called upon the Law, and it is within your power to constitute yourself a disciple. so far as in you lies, through the purity of your motive and effort if both are sufficiently sustained. No one can fix a period when this effort will bear fruit, and, if your patience and faith are not strong enough to bear you through an unlimited (so far as you know) period of unselfish work for humanity, you had better resign your present fancy, for it is then no more than that. But if other wise, you are to work for the spiritual enlightenment of Humanity in and through the Theosophical Society (which much needs such laborers), and in all other modes and planes as you best can, remembering the word of Masters: ‘He who does what he can and all that he can, and all that he knows how to do, does enough for us.’ This task includes that of divesting yourself of all personality through interior effort, because that work, if done in the right spirit, is even more important to the race than any outward work we can do. Living as you now are, on the outward plane chiefly, your work is due there and is to be done there until your growth shall fit you to pass away from it altogether.<\/p>", "images": []}, {"pdf_page_index": 113, "pdf_page_number": 114, "label": "Book I · Letter XIV", "html": "<p>“In following this course you work towards a fixed point under observation—as is, indeed, the whole Theosophic body, which is now, as a body, a chela of Masters—but specialized from other members in the sense that your definite aim and trust are understood and taken into consideration by the unseen Founders and the Law. The Theosophical Society then stands to you, for the time being, as any older chela might who was appointed for you to aid and to work under. You are not, understand, a chela on probation, since no one without authority can confer or announce such a privilege. But if you succeed in lifting yourself and others spiritually, it will be known, no matter what the external silence may seem to be, and you will receive your full dues from Those who are honest debtors and ministers of the Just and Perfect Law. You must be ready to work, to wait, and to aspire in silence, just as all do who have fixed their eyes on this goal. Remember that your truest adviser is to be found, and constantly sought, within yourself. Only by experience can you learn to know its voice from that of natural instinct or mere logic, and strengthen this power, by virtue of which the Masters have become what They are.<\/p>", "images": []}, {"pdf_page_index": 114, "pdf_page_number": 115, "label": "Book I · Letter XV", "html": "<p>“Your choice or rejection of this course is the first test of your self. Others will follow, whether you are aware of them or not, for the first and only right of the neophyte is—to be tried. Hence, silence and sorrow follow his acceptance instead of the offer of prompt aid for which he looks. Yet even that shall not be wanting; those trials and reverses will come only from the Law to which you have appealed.”<\/p><p>J. N.<\/p><h3 class=\"pdf-heading\">Book I · Letter XV<\/h3><p>Dear Jasper:<\/p><p>I gave your letter to a distressed soul: she returned thanks, saying it was a cooling draught to one athirst. The thanks of course are yours. Now, this lady says it was refreshment to the weary, that letter. True, or she would not say it. But it was not so to me nor to you.<\/p><p>We needed it not. But she illustrates a certain state of progress. She is not yet where we are; but which is happier? She is happier, but poorer in hope. We are not all too happy, but are rich in hope, knowing the prize at the end of time, and not deterred by the clouds, the storms, the miasms and dreadful beasts of prey that line the road. Let us, then, at the very outset wash out of our souls all desire for reward, all hope that we may attain. For so long as we thus hope and desire, we shall be separated from the Self. If in the Self all things are, then we cannot wish to be something which we can only compass by excluding something else. Standing where we are, let us purify ourselves to be all things.<\/p>", "images": []}, {"pdf_page_index": 115, "pdf_page_number": 116, "label": "Book I · Letter XV", "html": "<p>So being beyond this lady so grateful, we find that everything we meet on this illusory plane of existence is a lure that in one way or another has power to draw us out of our path. That is the point we are at, and we may call it the point where lures of Maya have omnipresent power. Therefore we must beware of the illusions of matter.<\/p><p>Before we got to this stage we knew well the fateful lure, the dazzling mirror of the elemental Self, here and there in well-defined places, and intrenched as it was, so as to say, in strongly-marked defenses. Those we assaulted; and that was what it desired, for it did think that it then had no need to exercise the enchantment which is hard because so subtle, and so distributed here and there that we find no citadels to take, no battalions in array. But now our dearest friends are unconsciously in league with the deceptive in nature. How strongly do I realize the dejection of Arjuna as he let his bow drop from his hand and sat down on his chariot in despair! But he had a sure spot to rest upon. He used his own. He had Krishna near, and he might fight on.<\/p><p>So in passing along those stages where the grateful lady and others are, we may perhaps have found one spot we may call our own and possess no other qualification for the task. That spot is enough. It is our belief in the Self, in Masters: it is the little flame of intuition we have allowed to burn, and that we have fostered with care.<\/p>", "images": []}, {"pdf_page_index": 116, "pdf_page_number": 117, "label": "Book I · Letter XV", "html": "<p>Then come these dreadful lures. They are, in fact, but mere carcasses, shells of monsters from past existences, offering themselves that we may give them life to terrify us as soon as we have entered them either by fear or love. No matter which way we enter, whether by attachment or by repugnant horror, it is all one: they are in one case vivified by a lover; in the other by a slave who would be free but cannot.<\/p><p>Here it is the lure of enjoyment of natural pleasures, growing out of life’s physical basis; there it is self-praise, anger, vanity, what not? Even these beautiful hills and river—they mock one, for they live on untrammelled. Perhaps they do not speak to us because they know the superiority of silence. They laugh with each other at us in the night, amused at the wild struggle of this petty man who would pull the sky down. Ach! God of Heaven! And all the sucklings of Theosophy wish that some great, well-diplomaed Adept would come and open the secret box; but they do not imagine that other students have stepped on the spikes that defend the entrance to the way that leads to the gate of the Path. But we will not blame them, nor yet wish for the things—the special lots—that some of them have abstracted, because now we know the dreadful power that despair and doubt and violated conscience have, we prefer to prepare wisely and carefully, and not rush in like fools where angels do not pass uninvited.<\/p>", "images": []}, {"pdf_page_index": 117, "pdf_page_number": 118, "label": "Book I · Letter XV", "html": "<p>But, Companion, I remind you of the power of the lure. This Path passes along under a sky and in a clime where every weed grows a yard in the night. It has no discrimination. Thus even after weeks or months of devotion, or years of work, we are surprised at small seeds of vanity or any other thing which would be easily conquered in other years of inattentive life, but which seem now to arise as if helped by some damnable Intelligence. This great power of self-illusion is strong enough to create a roaring torrent or a mountain of ice between us and our Masters.<\/p>", "images": []}, {"pdf_page_index": 118, "pdf_page_number": 119, "label": "Book I · Letter XV", "html": "<p>In respect to the question of sex. It is, as you know, given much prominence by both women and men to the detriment of the one sex or the other, or of any supposed sex. There are those who say that the female sex is not to be thought of in the spirit; that all is male. Others say the same for the female. Now both are wrong. In the True there is no sex, and when I said “There all men are women and all women are men,” I was only using rhetoric to accentuate the idea that neither one nor the other was predominant, but that the two were coalesced, so to say, into one. In the same way you might say, “men are animals there and vice versa.” Mind, this is in regard to Spirit, and not in regard to the psychical states. For in the psychical states there are still distinctions, as the psychical, though higher than the material, is not as high as Spirit, for it still partakes of matter. In the Spirit or Atma all experiences of all forms of life and death are found at once, and he who is one with the Atma knows the whole manifested Universe at once. I have spoken of this condition before as the Turya or fourth state.<\/p><p>When I say that the female principle represents matter, I do not mean women, for they in any one or more cases may be full of the masculine principle, and vice versa.<\/p>", "images": []}, {"pdf_page_index": 119, "pdf_page_number": 120, "label": "Book I · Letter XV", "html": "<p>Matter is illusionary and vain, and so the female element is illusionary and vain, as well as tending to the established order.[10] So in the Kaballa it is said that the woman is a wall about the man. A balance is necessary, and that balance is found in women, or the woman element. You can easily see that the general tendency of women is to keep things as they are and not to have change. Woman—not here and there women—has never been the pioneer in great reforms. Of course, many single individual women have been, but the tendency of the great mass of women has always been to keep things as they are until the men have brought about the great change. This is why women always support any established religion, no matter what—Christian, Jewish, Buddhist, or Brahmin. The Buddhist women are as much believers in their religion and averse from changing it as are their Christian sisters opposed in the mass to changing theirs.<\/p><p>Now as to telling which element predominates in any single person, it is hard to give a general test rule. But perhaps it might be found in whether a person is given to abstract or concrete thought, and similarly whether given to mere superficial things or to deep fundamental matters. But you must work that out, I think, for yourself.<\/p>", "images": []}, {"pdf_page_index": 120, "pdf_page_number": 121, "label": "Book I · Letter XV", "html": "<p>Of course in the spiritual life no organ disappears, but we must find out what would be the mode of operation of any organ in its spiritual counterpart. As I understand, the spiritual counterparts of the organs are powers, and not organs, as the eye is the power to see, the ear the power to hear, and so on. The generative organs would then become the creative power and perhaps the Will. You must not suppose that in the spirit life the organs are reproduced as we see them.<\/p><p>One instance will suffice. One may see pictures in the astral light through the back of the head or the stomach. In neither place is there any eye, yet we see. It must be by the power of seeing, which in the material body needs the specialized place or specializing organ known as the eye. We hear often through the head without the aid of the auricular apparatus, which shows us that there is the power of hearing and of transmitting and receiving sounds without the aid of an external ear or its inside cerebral apparatus. So, of course. all these things survive in that way. Any other view is grossly material, leading to a deification of this unreal body, which is only an image of the reality, and a poor one, at that.<\/p>", "images": []}, {"pdf_page_index": 121, "pdf_page_number": 122, "label": "Book II", "html": "<p>In thinking over these matters you ought always to keep in mind the three plain distinctions of physical, psychical, and spiritual, always remembering that the last includes the other two. All the astral things are of the psychical nature, which is partly material and therefore very deceptive. But all are necessary, for they are, they exist.<\/p><p>The Deity is subject to this law, or rather it is the law of the Deity. The Deity desires experience or self-knowledge, which is only to be attained by stepping, so to say, aside from self. So the Deity produces the manifested universes consisting of matter, psychical nature, and spirit. In the Spirit alone resides the great consciousness of the whole; and so it goes on ever producing and drawing into itself, accumulating such vast and enormous experiences that the pen falls down at the thought. How can that be put into language? It is impossible, for we at once are met with the thought that the Deity must know all at all times. Yet there is a vastness and an awe-inspiring influence in this thought of the Day and Night of Brahman. It is a thing to be thought over in the secret recesses of the heart, and not for discussion. It is the All.<\/p><p>And now, my Brother, for the present I leave you. May your restored health enable you to do more work for the world.<\/p><p>I salute you, my Brother, and wish you to reach the terrace of enlightenment.<\/p><p>Z.<\/p><h3 class=\"pdf-heading\">Book II<\/h3><p>In Devotion<\/p><p>TO THE IMMORTALS<\/p><p>and in<\/p><p>The Service of Humanity<\/p><p>This little book is laid<\/p><p>Upon the Altar June, 1905<\/p>", "images": []}, {"pdf_page_index": 122, "pdf_page_number": 123, "label": "Foreword", "html": "<p>Compiled by<\/p><p>THOMAS GREEN and JASPER NIEMAND<\/p><p>HITHERTO I HAVE BEEN AN EXILE FROM MY TRUE COUNTRY: NOW I RETURN THITHER. DO NOT WEEP FOR ME: I RETURN TO THAT CELESTIAL LAND WHERE EACH GOES IN HIS TURN.<\/p><p>Hermes Trismegistos<\/p><h3 class=\"pdf-heading\">Foreword<\/h3><p>ONE marked difference will be noticed between this, the second volume of LETTERS THAT HAVE HELPED ME, and the earlier volume. That first volume had a unity of purpose and development, setting forth, as it did, in due sequence, the salient points of the Eastern teaching. This unity palpably arose from the fact that the series of letters was written to one individual, and thus followed along a line suited to the unfolding needs and the studies of that individual, as to those of all fellow students pursuing an identical line of thought.<\/p>", "images": []}, {"pdf_page_index": 123, "pdf_page_number": 124, "label": "Foreword", "html": "<p>The present volume, on the contrary, consists of letters, and extracts from letters, written to a number of people in different parts of the world. In many instances, an extract only was sent to the compilers by individuals appealed to, that of their store something might be given to their fellow-men. In other instances, the entire letter was sent, but contained personal or other matter, which could not be published. In still other instances, the entire letter is given. It has been thought best to omit all headings and endings to these letters, in order that no discrimination shall be made in respect of the recipients, thus leaving the truths which the letters embody to stand out in their own relief, unmarred by a label and a name. Many of the extracts were published in The Irish Theosophist, and still others in the “Tea-Table” of The Path, where “Quickly” stood for Mr. Judge. It was the wish of Mr. Judge, expressed in writing to one of the compilers, that the series should be republished (with the addition of other matter) as a second volume of the earlier work. The compilers are thus carrying out the direct wishes of Mr. Judge.<\/p>", "images": []}, {"pdf_page_index": 124, "pdf_page_number": 125, "label": "Foreword", "html": "<p>During the lifetime of Mr. Judge, it was possible to rearrange, to suggest excision or amplification, or the grouping of various extracts as one letter; and it was possible as well to annotate, since Mr. Judge read all proof, and was always ready to consider any suggestions, while he was also pleased to see that his annotator had grasped his meaning, or to correct errors in this respect. It is evident that such rearrangement, adding as it would to the completeness and the unity of a series, is much to be desired. It was hoped to continue this method with the present volume; but the death of the writer has made it impossible. We can only publish some letters completely, as they stand, and group together such extracts as remain.<\/p>", "images": []}, {"pdf_page_index": 125, "pdf_page_number": 126, "label": "Foreword", "html": "<p>One point more. A great number of letters have thus come up. One compiler alone has many score, all written since the publication of the first volume, and ranging over that period of years in which the trials of Mr. Judge became increasingly heavy, a period to which his unexpected death set a term. How great were these trials, none well knew except the Master Whom he so devotedly served. The last letter of all was written but a very short while before his death. In no single letter out of all these numbers—in no letter that the compilers have seen—is there a harsh or condemnatory word said of the authors of his trials. He accepts the bitter, the profound injustice done him without one word which could impugn the faith he held, the teachings he gave out. Surprise there is; annoyance once or twice at the waste of time, the irrational deeds and words. And then he turns him to that wise compassion which knows that it is not he who is wronged who is in truth the sufferer, but he who inflicts a wrong.<\/p>", "images": []}, {"pdf_page_index": 126, "pdf_page_number": 127, "label": "Foreword", "html": "<p>Mr. Judge always taught the truest Occultism, the highest path. When his hour of trial struck, step by step he followed along that path. In the destiny of the crucified, whether Christs, or Christ-disciples, it is always seen that the loudest denial comes from those most helped, most served. It is he who sits “at meat” with them who betrays them. And of all the long line of martyrs, never one has been exonerated to his era, justified to his age. This fact alone should make thinking men pause, remembering further that the crowd always prefers that Barabbas should be released unto them.<\/p><p>The great drama ever follows the same lines. The initiate, be he disciple or be he adept, cannot defend himself: this is the inexorable law. But he has all the tenderest support that his great predecessors along the path of thorns can bestow; all the joy of a battle nobly fought: all the gratitude of those among his fellows whose intuition can follow him behind the veil which screens the initiate from our sight.<\/p><p>So it comes about that these letters breathe the compassion, the patience, the brotherliness their author lived to inculcate. Sorrow, indeed, he felt; but he put it bravely by. His great and kind heart remained sound to the core. He sweetened the hours of bitterness by profound resignation to The Law. He was one of those of whom it is written: “He that loseth his life for My sake shall find it.”<\/p>", "images": []}, {"pdf_page_index": 127, "pdf_page_number": 128, "label": "Book II · Letter I", "html": "<p>For the helping of mankind we publish these letters. To the judgment of posterity we commit them, knowing well that in the eternal spaces the Truth alone prevails. He who is here seen sustaining and consoling his fellows during the saddest hours of his life and down to the doors of the tomb, was in his turn upheld—--not alone by a great faith and by an All-Compassionate Hand—but also by the Love enshrined in his own quiet heart. To The Master he left the rest.<\/p><p>THE COMPILERS<\/p><h3 class=\"pdf-heading\">Book II · Letter I<\/h3><p>Dear Brothers and Sisters:<\/p><p>I DO not think you will take it amiss that I again intrude myself before you. I am so far off, and the place where my old friend and teacher—the one who pointed out to me the way that must bring us, if followed, to the light and peace and power of truth—is so dear to me, I would fain speak with those, my fellow-workers, who now live where she worked, and where her mighty soul left the body she used for our advantage. This is surely sufficient reason.<\/p>", "images": []}, {"pdf_page_index": 128, "pdf_page_number": 129, "label": "Book II · Letter I", "html": "<p>Refer to the Master’s letter in The Occult World and you will find him saying that the Masters are philanthropists and care only for that. Hence, the very oldest F.T.S. who has been selfish, and not philanthropic, has never come under the notice of the Masters, has never done anything, in fact, toward the development of the soul in his possession, nothing for the race of man. It is not membership in the T.S., nor in any other mystical body, that brings us near the Masters, but just such philanthropic work with pure motive.<\/p><p>Then I know, and say plainly—for as so close to each other we should plainly speak—that some of us, maybe all, have waited and wondered, and wished and hoped, for what? Variously expressed, thus: one wants to go to the Masters, not knowing even if it be fitting; another wants to know what is the vague longing inside; another says, if only the inner senses were developed, and hopes the Master would develop them, and so on; all, however, expressed by what the Master himself has written, “You want to find out about us, of our methods of work, and for that you seek along the line of occultism.” Well, it is right for us to seek and to try and to want to reach to Them, for otherwise we never will in any age get where such Beings are. But as wise thinkers we should act and think wisely. I know many of you, and what I am saying should help some as it does me also.<\/p>", "images": []}, {"pdf_page_index": 129, "pdf_page_number": 130, "label": "Book II · Letter I", "html": "<p>You are all on the road to Masters, but as we are now, with the weak and hereditarily diseased bodies we have, we could not live an hour with Masters did we suddenly jump past space to Them. Some, too, have doubt and darkness—the doubt mostly as to themselves. This should not be harboured, for it is a while of the lower man striving to keep you back among the mediocre of the race. When you have lifted yourself up over that level of the race, the enemy of man strikes, and strives at all times to bring clouds of doubt and despair. You should know that all, everyone, down to the most obscure, who are working steadily, are as steadily creeping on to a change. and yet on and on to other changes, and all steps to the Master. Do not allow discouragement to come in. Time is needed for all growth, and all change, and all development. Let time have her perfect work and do not stop it.<\/p>", "images": []}, {"pdf_page_index": 130, "pdf_page_number": 131, "label": "Book II · Letter I", "html": "<p>How may it be stopped? How many have thought of this I do not know, but here is a fact. As a sincere student works on, his work makes him come every day nearer to a step, and, if it be an advance, then it is certain there is a sort of silence or loneliness all around in the forest of his nature. Then he may stop all by allowing despair to come in with various reasons and pretexts; he may thus throw himself back to where he began. This is not arbitrary law but Nature’s. It is a law of mind, and the enemies of man take advantage of it for the undoing of the unwary disciple. I would never let the least fear or despair come before me, but if I cannot see the road, nor the goal, for the fog, I would simply sit down and wait; I would not allow the fog to make me think no road was there, and that I was not to pass it. The fogs must lift.<\/p><p>What, then, is the panacea, finally—the royal talisman? It is DUTY, Selflessness. Duty persistently followed is the highest yoga, and is better than mantrams or any posture, or any other thing. If you can do no more than duty it will bring you to the goal, And, my dear friends, I can swear it, the Masters are watching us all, and, without fail, when we come to the right point and really deserve, They manifest to us. At all times I know They help and try to aid us as far as we will let Them.<\/p>", "images": []}, {"pdf_page_index": 131, "pdf_page_number": 132, "label": "Book II · Letter II", "html": "<p>Why, the Masters are anxious (to use a word of our own) that as many as possible may reach to the state of power and love They are in. Why, then, suppose They help not? As They are Atman and therefore the very law of Karma itself, They are in everything in life, and in every phase of our changing days and years. If you will arouse your faith on this line you come nearer to help from Them than you will recognize.<\/p><p>I send you my love and hope, and best thoughts that you may all find the great light shining around you every day. It is there.<\/p><p>Your brother,<\/p><p>WILLIAM Q. JUDGE<\/p><h3 class=\"pdf-heading\">Book II · Letter II<\/h3><p>Once more, in the absence of Annie [Besant] who is so far away, I send you a word of brotherly greeting. I would ask you to read it impersonally in every part, as I have no reserved thoughts and no ulterior aim in it, and have not had any letters or news from anyone to lead me to write. We are so far away from each other that now and then such a greeting is well, and should be taken in the spirit sent. It is not possible to send to any other household, as none other exists in the Society, you being unique in this—you are the only one. Here we have no such thing, all, nearly, living at other places, and this being merely a centre for work.<\/p>", "images": []}, {"pdf_page_index": 132, "pdf_page_number": 133, "label": "Book II · Letter II", "html": "<p>Many times have co-operative households been tried and failed. One was tried here and is famous. It was called the Brook Farm, but it had no such high aim and philosophy behind it as you have, and thus the personal frictions, developed at any place of close intimacy, broke it up. That should be a guide to you to enable you to watch and avoid. Yours may alter in number and in personnel, but can never really be broken up if the aim is high and the self-judgment is strict and not self-righteous. I am not accusing you of this, but only stating a common human danger, from which the Theosophist is not at any time exempt. Indeed, he is in danger in your centre from the fact that strong force revolves around it. Hence all must be ever careful, for the personal element is one that ever has a tendency to delude us, as it hides behind various walls and clothes itself in the faults, real or imaginary, of others.<\/p>", "images": []}, {"pdf_page_index": 133, "pdf_page_number": 134, "label": "Book II · Letter II", "html": "<p>Your centre being the only one as yet of such size, it is useful for you to think how you all may best act so as to make it truly international, Each one has a right to his or her particular “crank,” of course, but no one ought to think that anyone else is to be judged from not being of the same stripe of “crank.” One eats meat, another does not. Neither is universally right, for the kingdom of heaven does not come from meat, nor from its absence. Another smokes and another does not; these are neither universally right nor wrong, as smoke for one is good and for another is bad; the true cosmopolitan allows each to do in such matters as he likes. Essentials are the only things on which true occultism and Theosophy require an agreement, and such temporary matters as food and other habitual daily things are not essentials. One may make a mistake, too, of parading too much his or her particular line of life or act. When this is done the whole world is bored, and nothing effective or lasting is gained except a cranky impression.<\/p>", "images": []}, {"pdf_page_index": 134, "pdf_page_number": 135, "label": "Book II · Letter II", "html": "<p>In a place like yours, where so many of all sorts of nature are together, there is a unique opportunity for gain and good in the chance it gives one for self-discipline. There friction of personality is inevitable, and if each one learns the great “give and take,” and looks not for the faults of the others but for the faults he sees in himself, because of the friction, then great progress can be made. The Masters have said that the great step is to learn how to get out of the rut each one has by nature and by training, and to fill up the old grooves. This has been misconstrued by some who have applied it only to mere outer habits of life, and forgotten that its real application is to the mental grooves, and the astral ones, also. Each mind has a groove, and is not naturally willing to run in the natural groove of another mind. Hence often comes friction and wrangle. Illustrate it by the flanged wheel of the steam-engine running on a track. It cannot run off nor on a track of broader or narrower gauge, and so is confined to one. Take off the flange and make the face of the wheel broader, and then it can run on any track that is at all possible. General human nature is like the engine—it is flanged and run for a certain size of track—but the occultist, or the would-be one, should take off the flange and have a broad-faced wheel that will accommodate itself to the other mind and nature. Thus in one life, even, we might have the benefit of many, for the lives of other men are lived beside us unnoticed and unused because we are too broad and flanged in wheel, or too narrow and flanged also. This is not easy, it is true, to change, but there is no better opportunity in the whole world, than is hourly presented to you to make the alteration. I would gladly have such a chance, which Karma has denied me, and I see the loss I incur each day by not having it there nor here. You have it, and from there should go out to all the earth, soon or late, men and women who are broad and free and strong for the work of helping the world. My reminding you of all this is not a criticism, but is due to my own want of such an opportunity, and, being at a distance, I can get a clearer view of the case, and of what you have for your own benefit and also for all others.<\/p>", "images": []}, {"pdf_page_index": 135, "pdf_page_number": 136, "label": "Book II · Letter II", "html": "<p>It is natural for one to ask: “What of the future, and what of the defined object, if any, for our work?” That can be answered in many ways.<\/p><p>There is, first, our own work, in and on ourselves, each one. That has for its object the enlightenment of oneself for the good of others. If that is pursued selfishly, some enlightenment comes, but not the amount needed for the whole work. We have to watch ourselves, so as to make of each a centre from which, in our measure, may flow out the potentialities for good that from the adept come in large and affluent streams. The future, then, for each, will come from each present moment. As we use the moment, so we shift the future up or down for good or ill; the future, being only a word for the present, not yet come, we have to see to the present more than all. If the present is full of doubt or vacillation, so will be the future; if full of confidence, calmness, hope, courage and intelligence, thus also will be the future.<\/p>", "images": []}, {"pdf_page_index": 136, "pdf_page_number": 137, "label": "Book II · Letter II", "html": "<p>As to the broader scope of the work, that comes from united effort of the whole mass of units, It embraces the race, and as we cannot escape from the destiny of the race, we have to dismiss doubt and continue at work. The race is as a whole in a transition state, and many of its units are kept back by the condition of the whole. We find the path difficult, because, being of the race, the general race-tendencies very strongly affect us. This we cannot do away within a moment. It is useless to groan over it; it is also selfish, since we in the distant past had a hand in making it what it now is. The only way we can alter it is by such action now as makes of each one a centre for good, a force that makes “for righteousness,” and that is guided by wisdom. From the great power of the general badness, we each one have a greater fight to wage the moment we force our inner nature up beyond the dead level of the world. So, before we attempt that forcing, we should on the lower plane accumulate all that we can of merit by unselfish acts, by kind thoughts, by detaching our minds from the allurements of the world, This will not throw us out of the world, but will make us free from the great force which is called by Bœhme the “Turba,” by which he meant the immense power of the unconscious and material basis of our nature. That material base being devoid of soul is more inclined on this plane to the lower things of life than to the higher.<\/p>", "images": []}, {"pdf_page_index": 137, "pdf_page_number": 138, "label": "Book II · Letter II", "html": "<p>Hence, until we have in some degree conquered that, it is useless for us to be wishing, as so many of us do, to see the Masters and to be with Them. They could not help us unless we furnished the condition, and a mere desire is not the needed condition. The new condition calls for a change in thought and nature.<\/p>", "images": []}, {"pdf_page_index": 138, "pdf_page_number": 139, "label": "Book II · Letter II", "html": "<p>So the Masters have said this is a transition age, and he who has ears to hear will hear what has thus been said. We are working for the new cycles and centuries. What we do now in this transition age will be like what the great Dhyan Chohans did in the transition point—the midway point in evolution—at the time when all matter and all types were in a transition and fluid state. They then gave the new impulse for the new types, which resulted later in all the vast varieties of nature. In mental development we are now at the same point; and what we now do in faith and hope for others, and for ourselves, will result similarly on the plane to which it is all directed. Thus in other centuries we will come out again and go on with it. If we neglect it now, so much the worse for us then. Hence we are not working for some definite organization of the new years to come, but for a change in the Manas and Buddhi of the Race. That is why it may seem indefinite, but it is, nevertheless, very defined and very great in scope. Let me refer you to that part of The Secret Doctrine, penned by Master Himself, where the midway point of evolution is explained in reference to the ungulate mammals. It should give you a glimpse of what we have to do. and remove all vain longings for a present sojourn with our unseen guides and brothers. The world is not free from superstition, and we, a part of it, must have some traces left of the same thing. They have said that a great shadow follows all innovations in the life of humanity. The wise one will not bring on that shadow too soon—not until some light is ready to fall at the same time for breaking up the darkness.<\/p>", "images": []}, {"pdf_page_index": 139, "pdf_page_number": 140, "label": "Book II · Letter II", "html": "<p>Masters could give now all the light and knowledge needed, but there is too much darkness that would swallow up the light, except for a few bright souls, and then a greater darkness would come on. Many of us could not grasp nor understand all that might be given, and to us would result a danger and new difficulty for other lives, to be worked out in pain and sorrow. It is from kindness and love that Masters do not blind us with the electric flash of truth complete.<\/p>", "images": []}, {"pdf_page_index": 140, "pdf_page_number": 141, "label": "Book II · Letter II", "html": "<p>But, concretely, there is a certain object for our general work. It is to start up a new force, a new current in the world, whereby great and long-gone Gnanis, or wise ones, will be attracted back to incarnate among men here and there, and thus bring back the true life and the true practices. Just now a pall of darkness is over all that no Gnani will be attracted by. Here and there a few beams strike through this. Even in India it is dark, for there, where the truth is hid, the thick veil of theological dogma hides all; and. though there is a great hope there, the Masters cannot pierce through to minds below. We have to educate the West so that it may appreciate the possibilities of the East, and thus on the waiting structure in the East may be built up a new order of things for the benefit of the whole. We have, each one of us, to make ourselves a centre of light—a picture gallery from which shall be projected on the astral light such scenes, such influences, such thoughts, as may influence many for good, shall thus arouse a new current, and then finally result in drawing back the great and the good from other spheres, from beyond the earth. This is not spiritualism at all, for it has no reference to the denizens of spook-land in any way.<\/p>", "images": []}, {"pdf_page_index": 141, "pdf_page_number": 142, "label": "Book II · Letter III", "html": "<p>Let us then have great faith and confidence. See how many have gone out from time to time from your centre to many and distant parts of the world, and how many will continue to go for the good and the gain of man of all places. They have gone to all parts, and it must be that even if the centre should be disrupted from causes outside of you. its power and reality will not be destroyed at all, but will ever remain, even after all of it may have gone, so far as bricks and mortar are concerned.<\/p><p>I give you my best wishes and brotherly greeting for the new year and for every year that is to come.<\/p><p>Affectionately yours,<\/p><p>WILLIAM Q. JUDGE<\/p><h3 class=\"pdf-heading\">Book II · Letter III<\/h3><p>I send you this, and you keep it, using it later on when I give the word. It is to be headed by me later.<\/p><p>The Theosophical movement was begun as a work of the Brotherhood of which H. P. B. is a member, and in which the great Initiate, who was by her called Master, is one of the Chiefs.<\/p><p>It was started among Western people by Western people, the two chief agents being H. P. B., a Russian, and H. S. Olcott, an American. The place where it was started was also Western—the City of New York.<\/p>", "images": []}, {"pdf_page_index": 142, "pdf_page_number": 143, "label": "Book II · Letter III", "html": "<p>But notwithstanding that the Brotherhood thus had it begun, it must, as a Society, be kept with a free platform, while at the same time its members are individually free to take and hold what belief they find approved by conscience, provided that belief does not militate against Universal Brotherhood. Hence they are at perfect liberty to believe in the Lodge of that Brotherhood and in its messengers, and also to accept their doctrines as to man, his nature, powers and destiny as given out by the messengers on behalf of the Lodge.<\/p><p>The fact is significant that the Theosophical movement was thus, as said, begun in the Western world, in the country where the preparations for the new root race are going on, and where that new root is to appear. This was not to give precedence to any one race or country over another, or to reduce any race or country, but was and is according to the law of cycles, which is a part of evolution. In the eye of that great Law no country is first or last, new or old, high or low, but each at the right time is appropriate for what ever the work is that must be performed. Each country is bound up with all the others and must assist them.<\/p>", "images": []}, {"pdf_page_index": 143, "pdf_page_number": 144, "label": "Book II · Letter III", "html": "<p>This movement has, among others, an object which should be borne in mind. It is the union of the West with the East, the revival in the East of those greatnesses which once were hers, the development in the West of that Occultism which is appropriate for it, so that it may, in its turn, hold out a helping hand to those of older blood who may have become fixed in one idea, or degraded in spirituality.<\/p><p>For many centuries this union has been worked towards and workers have been sent out through the West to lay the foundations. But not until 1875 could a wide public effort be made, and then the Theosophical Society came into existence because the times were ripe and the workers ready.<\/p><p>Organizations, like men, may fall into ruts or grooves of mental and psychic action, which once established are difficult to obliterate. To prevent those ruts or grooves in the Theosophical movement, its guardians provided that necessary shocks should now and then interpose so as to conduce to solidarity, to give strength such as the oak obtains from buffeting the storm, and in order that all grooves of mind, act, or thought, might be filled up.<\/p>", "images": []}, {"pdf_page_index": 144, "pdf_page_number": 145, "label": "Book II · Letter III", "html": "<p>It is not the desire of the Brotherhood that those members of the Theosophical movement who have, under their rights, taken up a belief in the messengers and the message should become pilgrims to India. To arouse that thought was not the work nor the wish of H. P. B. Nor is it the desire of the Lodge to have members think that Eastern methods are to be followed, Eastern habits adopted, or the present East made the model or the goal. The West has its own work and its duty, its own life and development. Those it should perform, aspire to and follow, and not try to run to other fields where the duties of other men are to be performed. If the task of raising the spirituality of India, now degraded and almost suffocated, were easy, and if thus easily raised it could shine into and enlighten the whole world of the West, then, indeed, were the time wasted in beginning in the West, when a shorter and quicker way existed in the older land. But in fact it is more difficult to make an entry into the hearts and minds of people who, through much lapse of time in fixed metaphysical dogmatism, have built in the psychic and psycho-mental planes a hard impervious shell around them selves, than it is to make that entry with Westerners who, although they may be meat eaters, yet have no fixed opinions deep laid in a foundation of mysticism and buttressed with a pride inherited from the past.<\/p>", "images": []}, {"pdf_page_index": 145, "pdf_page_number": 146, "label": "Book II · Letter III", "html": "<p>The new era of ‘Western Occultism definitely began in 1875 with the efforts of that noble woman who abandoned the body of that day not long ago. This does not mean that the Western Occultism is to be something wholly different from and opposed to what so many know, or think they know, as Eastern Occultism. It is to be the “Western side of the one great whole of which the true Eastern is the other half. It has, as its mission, largely entrusted to the hands of the Theosophical Society, to furnish to the West that which it can never get from the East; to push forward and raise high on the circular path of evolution now rolling West, the light that lighteth every man who cometh into the world—the light of the true Self, who is the one true Master for every human being; all other Masters are but servants of that true One; in it all real Lodges have their union.<\/p>", "images": []}, {"pdf_page_index": 146, "pdf_page_number": 147, "label": "Book II · Letter III", "html": "<p>Woe is set apart—not by Masters but by Nature’s laws—for those who, having started in the path with the aid of H. P. B., shall in any way try to belittle her and her work, still as yet not understood, and by many misunderstood. This does not mean that a mere person is to be slavishly followed. But to explain her away, to belittle her, to imagine vain explanations to do away with what is not liked in that which she said, is to violate the ideal, is to spit back in the face of the teacher through whom the knowledge and the opportunity came, to befoul the river which brought you sweet waters, She was and is one of those brave servants of the universal Lodge sent to the West to take up the work, well knowing the pain and obloquy and the insult to the very soul—worst of all insults —which were certain from the first to be hers. “Those who cannot understand her had best not try to explain her; those who do not find themselves strong enough for the task she plainly out lined from the beginning had best not attempt it.” She knew, and you have been told before, that high and wise servants of the Lodge have remained with the West since many centuries for the purpose of helping it on to its mission and destiny. That work it would be well for the members of the Theosophical Movement to continue without deviating, without excitement, without running to extremes, without imagining that Truth is a matter of either longitude or latitude: the truth of the soul’s life is in no special quarter of the compass, it is everywhere round the whole circle; and those who look in one quarter will not find it.<\/p>", "images": []}, {"pdf_page_index": 147, "pdf_page_number": 148, "label": "Book II · Letter IV", "html": "<p>(This letter is marked in red pencil, by the hand of Mr. Judge, “unfinished.” In fact, it ends with the word “will,” as above, but in publishing earlier some extracts from this letter, the owner had the permission of the writer to supply the last three words, which he had intended to place there when called away, and in his haste for the post, in returning, had omitted to add.)<\/p><h3 class=\"pdf-heading\">Book II · Letter IV<\/h3><p>TO THE THEOSOPHICAL PUBLICATION SOCIETY<\/p><p>It is with great regret that I learn from recent London advices that the Managers of the Society there think that the Tract, “Epitome of Theosophy,” which appeared in The Path, is “too advanced to be reprinted now, and that what is needed is ‘a stepping stone from fiction to philosophy’.”<\/p><p>Permit me to say that I cannot agree with this opinion, nor with the policy which is outlined by it. The opinion is erroneous, and the policy is weak as well as being out of accord with that of the Masters. Those Masters have approved the project of the new Society and are watching the unfolding of its policy.<\/p><p>If I had made up that Epitome wholly myself I might have some hesitation in speaking in this way, but I did not. The general idea of such a series of tracts was given to me some two years ago, and this one was prepared by several students who know what the people need. It is at once comprehensive and fundamental. It covers most of the ground, and if any sincere reader grasps it he will have food for his reflection of the sort needed.<\/p>", "images": []}, {"pdf_page_index": 148, "pdf_page_number": 149, "label": "Book II · Letter IV", "html": "<p>If, however, we are to proceed by a mollified passage from folly (which is fiction) to philosophy, then we at once diverge from the path marked out for us by the Masters; and for this statement I can refer to letters from Them in my hands. I need only draw your attention to the fact that when those Masters began to cause Their servants to give out matter in India, They did not begin with fiction, but with stern facts such as are to be found in the Fragments of Occult Truth,[11] which afterwards became Mr. Sinnett’s Esoteric Buddhism. ‘ are not seeking to cater to a lot of fiction readers and curiosity hunters, but to the pressing needs of earnest minds. Fiction readers never influenced a nation’s progress. And these earnest minds do not desire, and ought not to be treated to, a gruel which the sentence just quoted would seem to indicate as their fate.<\/p>", "images": []}, {"pdf_page_index": 149, "pdf_page_number": 150, "label": "Book II · Letter V", "html": "<p>Then again, I beg to remind my English brothers in this enterprise that they should remember that the United States contain more theosophists and possible subscribers and readers than the whole of Europe. They do not want fiction. They want no padding in their search for truth. They are perfectly able to grasp that which you call ‘too advanced.” The Master some years ago said that the U. S. needed the help of the English body of theosophists. That they did not get, and now do not require it so much, and their ideas and needs must be considered by us. We have twenty-one Branches to your three in Great Britain, and each month, nearly, sees a new Branch. Several have written me that they understand the T.P.S. is to give them good and valuable reprints and not weak matters of fiction.<\/p><p>I therefore respectfully urge upon you that the weak and erroneous policy to which I have referred shall not be followed, but that strong lines of action be taken, and that we leave fiction to the writers who profit by it or who think that thus people’s minds can be turned to the Truth. If a contrary line be adopted, then we will not only disappoint the Master (if that be possible) but we will in a very large sense be guilty of making false representations to a growing body of subscribers here as well as elsewhere.I am, fraternally yours,<\/p><p>WILLIAM Q. JUDGE<\/p><h3 class=\"pdf-heading\">Book II · Letter V<\/h3><p>It is a relief to turn from these eternal legal quibbles (of my business) to say a word or two on eternal matters.<\/p>", "images": []}, {"pdf_page_index": 150, "pdf_page_number": 151, "label": "Book II · Letter V", "html": "<p>Now and then there are underlined sentences occurring in The Path. These ought to be studied. One about one yogee not doing anything not seen in another yogee’s mind will open up a subject.[12] Reticence does not always mean ignorance: if we dig out the knowledge we drag down at the same time rocks and debris of other sorts, whereas, if a miner hands us the nugget, that is all we get at the time. So a slight reticence often results in our going at the digging ourselves.<\/p><p>In September Path is another. Getting back the memory of other lives is really the whole of the process,[13] and if some people don’t understand certain things it is either because they have not got to that point in their other lives or because no glimmer of memory has yet come.<\/p>", "images": []}, {"pdf_page_index": 151, "pdf_page_number": 152, "label": "Book II · Letter V", "html": "<p>The communion of saints is a reality, and it often happens that those brought up in the same school speak the same language. While not being one, such are very like co-scholars, no matter when or where. Furthermore, there are some peculiar natures in this world who, while they are like mirrors or sponges that reflect and absorb from others certain information, still retain a very strong individuality of their own. So it is with this gentleman whose letter you enclose. There is scarcely any doubt that he, if he tells true tales, sees in the astral light. The description of things “moving about like fishes in the sea” is a real description of one of the manners in which many of these elemental forms are seen. So, as premised above, it may be settled that he sees in the astral light.<\/p>", "images": []}, {"pdf_page_index": 152, "pdf_page_number": 153, "label": "Book II · Letter V", "html": "<p>He should know that that astral light exists in all places and interpenetrates everything, and is not simply in the free air alone. Further should he know that to be able to see as he sees in the light is not all of the seeing thus. That is, there are many sorts of such sight, e.g., he may see now certain airy shapes and yet not see many others which at the same time are as really present there as those he now sees. So it would seem that there are “layers” or differences of states in the astral light. Another way to state it is that elementals are constantly moving in the astral light—that is, everywhere. They, so to say, show pictures to him who looks, and the pictures they show will depend in great part upon the seer’s thoughts, motives and development. These differences are very numerous. It therefore follows that in this study pride must be eliminated. That pride has disappeared from ordinary life does not prove that it has done any more than retreat a little further within. So one must be careful of becoming even inwardly vain of being able to see any such things; for, if that happens, it will follow that the one limited plane in which one may be a seer will be accepted as the whole. That, then, will be falsity. But if recognized as delusive, because partial, then it remains true—so far as it goes. All true things must be total, and all totalities exist at once, each in all, while these partial forms exist partially in those that are total. So it follows that only those that are total reveal entire truth, and those that partake of lower nature—or are partial— receive but a limited view of truth. The elementals are partial forms, while the man’s individual soul is total, and according to the power and purity of that form which it inhabits, “waits upon the Gods.”<\/p>", "images": []}, {"pdf_page_index": 153, "pdf_page_number": 154, "label": "Book II · Letter V", "html": "<p>Now our bodies, and all “false I” powers up to the individual soul, are “partial forms,” in common with the energic centres in astral light. So it must follow that, no matter how much we and they participate in each other, the resulting view of the one Truth is partial in its nature because the two partial forms mingling together do not produce totality. But it intoxicates. And herein lies the danger of the teaching of such men as P. B. Randolph, who advocates participation with these partial beings by means of sensual excesses glorified with a name and gilded with the pretence of a high purpose—viz., knowledge: KNOWLEDGE MUST BE CAREFULLY OBTAINED WITH A PURE MOTIVE.<\/p><p>This motive is the point for this gentleman to study. He says that he “will know,” and that he “desires to escape from present limitations of this personality, which is all loneliness.”<\/p><p>As he did go forward on the path of knowledge, he would find that this imaginary loneliness of which he speaks is, by comparison with the utter loneliness of that path, a howling mob, a tramping regiment.<\/p>", "images": []}, {"pdf_page_index": 154, "pdf_page_number": 155, "label": "Book II · Letter V", "html": "<p>As he is fighting alone his own fight, let him carefully note his motive in seeking to know more, and in seeking to escape from his present “loneliness.” Must it not be true that loneliness cannot be escaped from by abhorrence of it or even by its act but by its recognition? What next? Well this—and perhaps it is too simple. He ought to assure himself that his motive in knowing and being is that he may help all creatures. I do not say that this is not now his motive, but, for fear it should not be, I refer to it, For as he appears to be on the borderland of fearful sights and sounds, he ought to know the magic amulet which alone can protect him while he is ignorant. It is that boundless charity of love which led Buddha to say: “Let the sins of this dark age fall on me that the world may be saved,” and not a desire for escape or for knowledge. It is expressed in the words: “THE FIRST STEP IN TRUE MAGIC IS DEVOTION TO THE INTERESTS OF OTHERS.” It was expressed by Krishna when he said: “Near to Renunciation is salvation” (or the state of a Jivanmukta).<\/p><p>But he naturally will ask if he should cultivate his powers. Well, of course, he should at some time or other; but he ought to begin at motives and purification of thought. He may, if he chooses, abandon the ideas of this large-hearted charity and yet make great progress in “powers,” but surely then death and ashes will be the result. That does not concern me.[14]<\/p>", "images": []}, {"pdf_page_index": 155, "pdf_page_number": 156, "label": "Book II · Letter V", "html": "<p>[Latterly a friend related a strange experience to the Tea Table. He had been brought up among the Welsh, and was a firm disbeliever in the “supernaturalism” so rife among that people, until occultism explained to him so many of the strange occurrences and sights he had hitherto defied From childhood he had been used to seeing “strange things moving about like fishes in the sea,” to hearing strange sounds and seeing distant places or objects, though his sturdy attitude of negation, and his attributing them to optical or nervous defects, had of late years somewhat lessened the number of those phenomena. One day recently, he had been reading of some psychometric experiments, and fell to thinking of some place to which he desired to go. Closing his eyes, he thought strongly of this place, determined to see, if possible, a person who was there. All at once an indescribable lightness seemed to pervade his whole person. He thought—”I can go there!” and rising, was half across the room in a moment, when turning his head, he beheld himself seated in the chair he had left. At this a nameless horror seized him, a dreadful fear; he rushed back into his body—how, he knew not—overcome with terror at his own involuntary act.<\/p><p>This fact of his undue alarm and its possible cause excited some discussion around the Tea Table. Finally it was agreed to write to an eminent occultist on the subject. His reply will interest all students of this important branch of occultism.]<\/p>", "images": []}, {"pdf_page_index": 156, "pdf_page_number": 157, "label": "Book II · Letter V", "html": "<p>Why did he have a horror when he nearly succeeded in getting away from his body—in being for a moment free? That is an important question. Its solution may be found in many ways. I will mention one. If the place, or person, he wished to go to was one to which he ought not then to have gone, or if his motive in desiring to go there was not pure, then a horror might result that drove him back. Motive is highly important, and must be examined and tested countless times. The meaning of the word motive must not here be limited to what is called bad or improper motive. I will just as willingly examine into bad as into good motives, and, no matter how lurid the light on them, I will still examine them impartially. If one has a bad motive, then the results are his own Karma, and not that of any other, except those who willingly take it on themselves.<\/p>", "images": []}, {"pdf_page_index": 157, "pdf_page_number": 158, "label": "Book II · Letter V", "html": "<p>In the above case, indifference of motive is just as much to be guarded against as any other sort. In leaving the body without motive, we leave it under the impressions of Tamoguna (Darkness) and when set free we are very likely to be caught in a whirl which is far from pleasant. Horror may then result. I do not say it always will result. But great forces are not to be set in motion with impunity. We must be able to put down and control an equal opposition, and good motive alone affords us this balance of power by setting the Law on our side. The highest possible motive must be laid at the bottom, or else we will meet trouble which only power can overcome. Yet again, if even with a bad motive he had attempted to go to a place where a similar motive existed, then no horror would have come. If he will tell himself, or me, just where he was wanting to go, I may say why he had a horror. But I do not want to know.<\/p>", "images": []}, {"pdf_page_index": 158, "pdf_page_number": 159, "label": "Book II · Letter V", "html": "<p>It is not necessarily a horror-producing thing to leave the body. Only lately I know of a friend who went out of his body a distance of 10,000 miles and had no horror. In that case he desired to see a friend on a common purpose which had in view the amelioration of this dark age; and again, he left his body and saw the surrounding sweeps of wood and vale, and had no horror in either case. Similarity of motive creates an electric or magnetic current along which we may possibly proceed in safety provided it is not crossed by a still stronger current. If one is sure of motive, and that is pure, then going out of the body is not detrimental.<\/p><p>This inquirer lays much stress upon the fact that he was “rushing back” to his body of his own accord. That does not prove that he was not pushed back. When the saturated solution in a glass is disturbed, itself, by its own volition, crystallizes, but it had first to have the predisposing cause in the shape of the blow on the glass. So although he “rushed back,” it was because of the push he received from something he cannot describe nor understand.<\/p>", "images": []}, {"pdf_page_index": 159, "pdf_page_number": 160, "label": "Book II · Letter VI", "html": "<p>An illustration will show the dangers. Take the case of one who determines to leave the body merely to go to another who is admired by him, or whom he desires to see, This other, however, is protected by high motives and great purity. The first is mixed in motive in waking life, but, as soon as the disengaged state comes on, the motive is changed into a mere will or curiosity to see the second, combined perhaps with more or less sensuality, e.g., a desire to see a woman much admired and to pour into her unwilling ear pretended or real human love. The elementals and other guardians of the second protect that soul, and hurl vague horrors at the first, who, if he is not a skilled black magician is—<\/p><p>a. Either merely pushed back into the body, or<\/p><p>b. Is assailed with fears that prevent him from finding or entering his body, and that may be occupied by an elementary, good, bad or indifferent, and his friends say he waked up suddenly insane!<\/p><p>Motive is then the main point for this and every inquirer to study. If he is sure of his motives, and that they are neither indifferent, curious, selfish, nor imprudent, and he trusts in the Unity of the Supreme Soul, he cannot be in much danger.<\/p><p>Well—enough!<\/p><h3 class=\"pdf-heading\">Book II · Letter VI<\/h3>", "images": []}, {"pdf_page_index": 160, "pdf_page_number": 161, "label": "Book II · Letter VI", "html": "<p>The letters proposed by your friend are a device of the enemy, as you may have supposed, and which you were warned to expect in unexpected quarters and ways. Therefore they should not be written. It is the small rift in the lute that destroys it; in human history small and unexpected events alter the destiny of nations.<\/p><p>On this plane the dark powers rely upon their ability to create a maya. They have seen that you are not to be trapped in the prominent lines of work and so try their hands where your currents exist in a prominent place but with a very small matter. Let me point out.<\/p><p>If you issue these letters they would be an endorsement of all that your friend might think to do, and neither you nor Y. are free from mistakes yet. They would amount to a declaration, to the perception of others, that you were guiding Y. in everything and were at all times conscious of it. Do you or Y. know where this would end? Do you see the possibilities flowing from the acceptance in full of those letters by the others? And what would their action be? Are they free from the curse of superstition; are they clear in the co-ordination of psychic with brain thought? No. The result would not only be different from what you and Y. can see, but worse. Now further.<\/p>", "images": []}, {"pdf_page_index": 161, "pdf_page_number": 162, "label": "Book II · Letter VI", "html": "<p>It is true—and humanly natural—that the others (like you and your friends) indulged in some slight critiques on your friend, but they were small and coupled with sincere and kind thoughts up to their lights, no matter how large and bitter all this was made by maya to appear. The dark powers seized on them, enlarged them, dressed them up, assumed the images of the thinkers, enlivened the thoughts with elementals, all with an object, viz., to make your friend think it all came from the others. Why, if that were so then those others (poor weak mortals) are fends. But are they? No. It was wished by the dark ones to irritate your friend and you, so as by the irritation to split a breach forever unhealable. In Y.’s very weak state they found it easy, and hoped by distance to make you blind.<\/p>", "images": []}, {"pdf_page_index": 162, "pdf_page_number": 163, "label": "Book II · Letter VI", "html": "<p>Tell your friend to remember what was long ago said—that the Master would manage results. You must not manage, precipitate, nor force. Beware. Let Y. assume that the others do not think harshly nor critically, but put it all against the dark powers, and the results will be managed by Master. As chelâs and students conceal rather than give out your inner psychic life, for by telling of it your proper progress is hindered. There must be silence in heaven for a time or the dark ones rejoice to so easily get good, malleable images for annoying you. It will be tried again either that way or some other. By gentleness, detachment, strict attention to duty, and retiring now and then to the quiet place, bring up good currents and keep back all evil ones. Remember it is the little things the work is done through, for they are not noticed, while the larger ones draw the eyes and minds of all.<\/p>", "images": []}, {"pdf_page_index": 163, "pdf_page_number": 164, "label": "Book II · Letter VI", "html": "<p>I think of you always as the brave soldier, made not of mud and soft things, but made of long pieces of steel and strips of diamond and flashes of long light that has no harshness, and a big, big spring all the way through. That is you. And your eyes laugh now and then, even if you do have a pain in your head. Inside you are all right, as you know very well, don’t you? Then if you are that soldier, it means that he will spring back as soon as the body has had time to get some better. The body is like the heart; it has to have time to get to some other condition. But you will get there. A steady mind and heart stands still and quiet until the muddy stream rolls clear. Now sleep, I say; I command you to sleep. I have tried to help you to sleep, and I wish you to sleep, for sleep will do you good as nothing else can. I hope to see you drop all when comes, and go to sleep for a while, and far enough from the row to be quiet. It is sleep your tired nature on the outside wants, for sleep knits up the ravelled thread of life and makes us young again. You have been so awake, that the power of equilibrium between life and the body is disturbed and needs a chance. This is fact. One can get wrought up, and then Prana is too strong; so little children sleep much. Be a child once.<\/p>", "images": []}, {"pdf_page_index": 164, "pdf_page_number": 165, "label": "Book II · Letter VII", "html": "<p>Well I’m near home, or rather the centre spot, for pilgrims like you and me have no real house and don’t want it; it’s too dull and usual for such to want a home. And perhaps the little brother is good and well? He shall be ever present, as he always has been, in those little songs and tales told to oneself in the dark, and is, too, the lone warrior seen on the plain of stupid infantry, and he rides a horse whose blood is electricity. Au revoir. Tell _________ I can stand alone; it is the best way to stand, and what I always was and shall be. Let the ripples and the foam go on coming and going; the old river and the bed of the river do not move for all that is on the top. Is it not so? Well, good-bye, and good luck, and may the devas help you, and also karma. Love to all, as usual.<\/p><p>As forevermore,<\/p><h3 class=\"pdf-heading\">Book II · Letter VII<\/h3><p>I was very glad indeed to get your letter, but sorry to read of your troubles. Strangely, too, a similar trouble with a very dear friend of mine is now uppermost in my mind, and I would like to crave the favour from you that you would tell me what kind of place the asylum is you speak of. The only accessible one here is a mere prison, where men do nothing, and where I do not think the influence would be other than depressing. Do you think that, at the one you have in mind, a man of active mind, who merely wishes to get rid of his present trouble, would be able to occupy himself?<\/p>", "images": []}, {"pdf_page_index": 165, "pdf_page_number": 166, "label": "Book II · Letter VIII", "html": "<p>I am indeed sorry that you have to tell me such matters, but they will rest in my confidence; and I thank you and ______ for your renewed invitation.<\/p><p>It is best not to inquire into some of the mysteries of life, but surely a full reliance upon the Spirit within and upon the law that the hands that smite us are our own, will relieve the pressure of some events that s
