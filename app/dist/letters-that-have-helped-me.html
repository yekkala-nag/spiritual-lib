rs Till Death and After” (reprinted in Theosophy, V, 289) .—Eds.<\/p><p>[40] The history of the period to which this passage refers may be found in the Theosophical Movement, beginning at Chapter XIX.—Eds.<\/p><p>[41] Of “flap-doodle” it has been said: “a convenient term which she (H.P.B.) often used, with many shades of meaning, but all of them derogatory.”—Eds.<\/p><p>[42] “T.” or “P.T.” (Philip Tovey?), whose articles appeared regularly in The Theosophic Isis. His ‘Mind and Brain” appeared in the May, 1896, issue.—Eds.<\/p>", "images": []}]</script>

<script id="notes-data" type="application/json">{"Preface": {"s": "The compiler’s preface: how these letters of William Q. Judge — written to encourage a student — came to be gathered for the help of all.", "p": ["The letters were written to one earnest student", "They were published because they help all students", "Judge wrote under the name of the recipient’s need, not his own fame"]}, "Book I · Letter I": {"s": "The signal is raised: do not think of the writer, but of the Eternal Truth — the opening letter sets the impersonal tone of all true occult guidance.", "p": ["Fix the mind on the Truth, not the teacher", "Personality worship is the first snare", "The work is for all, not for one"]}, "Book I · Letter II": {"s": "On entering the movement on the right basis — conviction of the truth itself, not enthusiasm for persons or phenomena.", "p": ["Enter on the basis of conviction, not emotion", "The movement needs steady workers, not admirers", "The truth is its own credential"]}, "Book I · Letter III": {"s": "On weariness in the work — the writer’s own tiredness confessed, and the remedy of holding on without expectation.", "p": ["Even old workers grow weary", "The gaping crowd is not the reward", "Hold on without looking for results"]}, "Book I · Letter IV": {"s": "On the method of inner work — reading, self-examination, and the gradual discovery of the way within.", "p": ["Look within while reading the books", "The way is found by doing, not by asking", "Self-examination is the daily discipline"]}, "Book I · Letter V": {"s": "On duty and inability: our duty is never to consider our ability, but to do the work that lies before us.", "p": ["Duty is measured by the task, not the talent", "Do the work; the strength comes in the doing", "The feeling of inability is no excuse"]}, "Book I · Letter VI": {"s": "On the inner bells — the hearing of inner sounds as a sign of progress, with a caution against making much of such signs.", "p": ["Inner sounds are signs, not goals", "Do not stop to admire the milestones", "Progress is in character, not in phenomena"]}, "Book I · Letter VII": {"s": "On the wish that adepts might be sent to help — the answer that the help is already nearer than we think.", "p": ["The help is proportional to the effort", "The Masters do not waste their messengers", "The true helper is the awakened self within"]}, "Book I · Letter VIII": {"s": "On the periods of silence and waiting — when all oracles are dumb, the work goes on below the surface.", "p": ["Silence is a season of the inner life", "Waiting is part of the training", "The seed grows in the dark"]}, "Book I · Letter IX": {"s": "On conversion: no one is converted to theosophy — each one who truly comes, recognizes it as something long known.", "p": ["Theosophy is recognized, not adopted", "The soul remembers its own", "Do not argue men into the movement"]}, "Book I · Letter X": {"s": "On the three gunas of the Bhagavad-Gita — the qualities of nature and their play in the disciple’s life.", "p": ["The three qualities bind the soul to action", "Know them, and act without attachment", "The Gita is the devotional manual of the path"]}, "Book I · Letter XI": {"s": "On illness and the balance of life — a word of counsel in serious sickness.", "p": ["Illness has its karmic side", "The inner attitude governs the outer issue", "Courage is itself a medicine"]}, "Book I · Letter XII": {"s": "On chelaship — the questions of would-be disciples answered from the writer’s own experience.", "p": ["Chelaship is not taken up by asking", "The qualifications are shown in life, not in words", "The Master finds the ready pupil"]}, "Book I · Letter XIII": {"s": "On passing from the outer relation of teacher and pupil to the inner relation of the Lodge.", "p": ["The inner bond succeeds the outer", "The Lodge is a living unity", "The relation is of service, not privilege"]}, "Book I · Letter XIV": {"s": "What may properly be said to earnest inquirers who prove their perseverance — the deeper teaching held for the persevering.", "p": ["Perseverance is the test of fitness", "The deeper teaching follows the proved student", "Curiosity-seekers get the shell; the earnest get the kernel"]}, "Book I · Letter XV": {"s": "The closing letter of the first series — a cooling draught for the athirst, and the parting counsel of the writer.", "p": ["The letters end in benediction", "The teaching is for the distressed and the striving", "The work goes on after the letters cease"]}, "Book II": {"s": "The second book of the letters — further counsel written in the later years.", "p": ["The second series continues the same guidance"]}, "Foreword": {"s": "The foreword to the second book of the letters.", "p": ["Introduces the later correspondence"]}, "Book II · Letter I": {"s": "A word from afar — the writer, distant in body, speaks of the old friendship and the unbroken inner tie.", "p": ["Distance does not break the inner bond", "The true friendship is of souls", "The work unites those who serve it"]}, "Book II · Letter II": {"s": "A brotherly greeting in absence — the letter to be read impersonally, as from the movement to the worker.", "p": ["Read the word impersonally", "The message outlasts the messenger"]}, "Book II · Letter III": {"s": "A note held in trust — to be used later, when the word is given.", "p": ["Some things are written for the future", "Patience with sealed instruction is part of the discipline"]}, "Book II · Letter IV": {"s": "A letter to the Theosophical Publication Society on the work of publication.", "p": ["The publication work is part of the movement’s service", "The printed word carries the teaching far"]}, "Book II · Letter V": {"s": "On turning from legal quibbles to eternal matters — the relief of the eternal after the business of the day.", "p": ["The worldly work and the eternal work must both be done", "The eternal matters give rest to the mind", "Do not let the day’s business eat the soul"]}, "Book II · Letter VI": {"s": "On the devices of the enemy — attacks and misleading letters to be expected from unexpected quarters.", "p": ["Opposition comes in disguise", "The student is warned, not frightened", "Discrimination is the shield"]}, "Book II · Letter VII": {"s": "On troubles shared — the writer’s sympathy and the likeness of the trials of friends.", "p": ["The trials of students are strangely alike", "Sympathy is a real help", "The common struggle binds the workers"]}, "Book II · Letter VIII": {"s": "On health and the row of the outer world — what matters and what does not.", "p": ["The body’s health is a charge on the worker", "The outer noise is not worth the soul’s peace", "Keep the centre still"]}, "Book II · Letter IX": {"s": "On the pressure of work and people — the writer’s crowded days and the cost of the public work.", "p": ["The public worker pays in strength", "Preparation and anxiety are part of the load", "The work is worth the price"]}, "Book II · Letter X": {"s": "On a message received — splendid and marvellously accurate — and the answer returned.", "p": ["True messages carry their own evidence", "Accuracy is the test of the inner word", "The writer answers in kind"]}, "Book II · Letter XI": {"s": "On an erroneous idea in the student’s mind — the correction of a sentence that needed explaining.", "p": ["Errors of idea breed errors of life", "The correction is given plainly", "The student is asked to think it through"]}, "Book II · Letter XII": {"s": "On news of one lying very low — the shock of the message and the refusal to believe it the end.", "p": ["The writer will not believe the work is done", "Fire of purpose outlasts the body’s weakness", "Hope is an occult force"]}, "Book II · Letter XIII": {"s": "On a letter of distress — the writer’s plain and comforting answer.", "p": ["Distress may be written without shame", "The answer is friendship itself", "The dark hour is not the last hour"]}, "Book II · Letter XV": {"s": "On the astral form of things — even clothes have their doubles on the other planes, for nothing in nature is without its subtle counterpart.", "p": ["Everything has its astral counterpart", "The subtle planes duplicate the physical", "This explains many small mysteries"]}, "Book II · Letter XVI": {"s": "On the living whole — we are all bound together, and the thoughts and acts of one react upon all.", "p": ["Humanity is one living whole", "No thought is private in its effects", "Responsibility is universal"]}, "Book II · Letter XVII": {"s": "On the law and the strain of exertion — neither the general law nor the Lodge neutralizes the effects of overstrain on the disciple’s body.", "p": ["The law does not repeal cause and effect for disciples", "Overstrain has its price", "Care of the instrument is a duty"]}, "Book II · Letter XVIII": {"s": "On theosophy without the name — the essential principles stated in many systems, for theosophy is the universal fundament.", "p": ["The truth wears many names", "Judge the teaching, not the label", "The universal fundament is one"]}, "Book II · Letter XIX": {"s": "On danger within — the real danger is not on the outside, though attempts come from there.", "p": ["The inner danger is the greater", "Outer attacks answer inner weakness", "Watch the fortress of the self"]}, "Book II · Letter XX": {"s": "To those he loves and who work with him — a letter of communion with the fellow-workers.", "p": ["The bond of the workers is sacred", "Love is the strength of the work"]}, "Book II · Letter XXI": {"s": "On cold and hard feelings — a confession and a lesson in the misunderstandings of the workers.", "p": ["Even the best workers misunderstand each other", "Confession clears the air", "The personal equation must be watched"]}, "Book II · Letter XXII": {"s": "On a night at the lodge — a vivid account of a meeting, the crowd, and the speaker.", "p": ["The lodge meeting is the movement’s heartbeat", "The writer reports the life of the work", "Enthusiasm and order both have their place"]}, "Extracts On Theosophy And The T.S.": {"s": "Extracts on theosophy and the Theosophical Society — Judge’s shorter notes on the work and its organization.", "p": ["Short extracts on the Society’s life", "The work and its workers are the theme"]}, "Tea-Table Talks": {"s": "Tea-table talks — informal, homely conversations on the deepest things.", "p": ["The profound in the dress of the familiar", "Judge’s gift of simple speech on high themes"]}, "Gleanings From The “Path”": {"s": "Gleanings from The Path — selections from Judge’s editorial work in his magazine.", "p": ["The Path was Judge’s own journal", "The gleanings are its ripe grain"]}, "From Unpublished Letters": {"s": "From unpublished letters — further counsel not before printed.", "p": ["The unpublished letters continue the same guidance", "Personal counsel made general"]}, "From MS. Letters": {"s": "From manuscript letters — notes gathered from the writer’s remaining papers.", "p": ["Fragments from the writer’s papers", "The same voice, the same counsel"]}, "London And Paris Letters": {"s": "The London and Paris letters — Judge’s correspondence from the European centres of the work.", "p": ["Reports from the European field", "The movement as seen from its old-world centres"]}, "Mr. Judge’s Stories": {"s": "Mr. Judge’s stories — the tales by which he taught, east and west.", "p": ["Judge taught by stories as well as precepts", "The tales carry the doctrine in parable"]}, "An Occult Novel": {"s": "An occult novel — a piece of fiction used as a vehicle of the teaching.", "p": ["Fiction as a vessel of the doctrine", "The story form reaches where the treatise cannot"]}, "Biographical Notes": {"s": "Biographical notes on William Q. Judge.", "p": ["The outline of Judge’s life", "His place in the founding of the Society"]}, "William Q. Judge": {"s": "A fuller sketch of William Q. Judge — the man, the co-founder, the teacher.", "p": ["Judge as co-founder with Blavatsky and Olcott", "His American work and his <script>
const PAGES = JSON.parse(document.getElementById('pages-data').textContent);
const IMAGES = JSON.parse(document.getElementById('images-data').textContent);

let current = 0;

function imgSrc(file){
  return 'data:image/jpeg;base64,' + IMAGES[file];
}

function render(){
  const p = PAGES[current];
  document.getElementById('section-pill').textContent = 'Page ' + p.pdf_page_number;
  document.getElementById('eyebrow').textContent = 'Source: page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('page-title').textContent = p.label;
  document.getElementById('content').innerHTML = p.html;

  const figWrap = document.getElementById('figures');
  figWrap.innerHTML = '';
  p.images.forEach(im => {
    const card = document.createElement('div');
    card.className = 'figure-card';
    const img = document.createElement('img');
    img.src = imgSrc(im.file);
    img.alt = im.caption;
    img.addEventListener('click', () => openLightbox(img.src, im.caption));
    const cap = document.createElement('div');
    cap.className = 'figure-cap';
    cap.textContent = im.caption;
    card.appendChild(img);
    card.appendChild(cap);
    figWrap.appendChild(card);
  });

  document.getElementById('folio-label').textContent = 'Page ' + p.pdf_page_number + ' / ' + PAGES.length;
  document.getElementById('progress-label').textContent = 'Page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('progress-fill').style.width = (((current+1)/PAGES.length)*100).toFixed(1) + '%';

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === PAGES.length - 1;
  document.getElementById('next-btn').textContent = current === PAGES.length -1 ? 'End' : 'Next \u2192';

  document.getElementById('leaf').style.animation = 'none';
  void document.getElementById('leaf').offsetWidth;
  document.getElementById('leaf').style.animation = '';

  updateActiveTocItem();
  window.scrollTo({top:0, behavior:'smooth'});
  if (window.__afterRender) window.__afterRender();
}

function openLightbox(src, alt){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('prev-btn').addEventListener('click', () => {
  if (current > 0){ current--; render(); }
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (current < PAGES.length -1){ current++; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// ---------- TOC ----------
function buildToc(){
  const list = document.getElementById('toc-list');
  PAGES.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = 'toc-item';
    btn.dataset.idx = idx;
    btn.textContent = 'p.' + p.pdf_page_number + '  —  ' + p.label;
    btn.addEventListener('click', () => {
      current = idx;
      render();
      closeToc();
    });
    list.appendChild(btn);
  });
}
function updateActiveTocItem(){
  document.querySelectorAll('.toc-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === current);
  });
}
function openToc(){
  document.getElementById('toc-panel').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeToc(){
  document.getElementById('toc-panel').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('toc-toggle').addEventListener('click', openToc);
document.getElementById('toc-close').addEventListener('click', closeToc);
document.getElementById('scrim').addEventListener('click', closeToc);

buildToc();
render();

// ---------- Read aloud (prefers Indian English voices) ----------
(function(){
  const listenBtn = document.getElementById('listen-toggle');
  const bar = document.getElementById('listen-bar');
  const voiceSel = document.getElementById('voice-select');
  const rateSel = document.getElementById('rate-select');
  const playBtn = document.getElementById('listen-play');
  const stopBtn = document.getElementById('listen-stop');
  const autoChk = document.getElementById('listen-auto');
  const status = document.getElementById('listen-status');

  if (!('speechSynthesis' in window)) {
    listenBtn.style.display = 'none';
    return;
  }

  let voices = [];
  let listening = false;
  let paused = false;
  let gen = 0;

  function score(v){
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l.indexOf('en-in') === 0) return 3;
    if (l === 'en-gb') return 2;
    return 1;
  }

  function loadVoices(){
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
    voices = (en.length ? en : all).slice().sort((a, b) => score(b) - score(a));
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const isIndian = (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0;
      opt.textContent = v.name + ' (' + v.lang + ')' + (isIndian ? ' — Indian accent' : '');
      voiceSel.appendChild(opt);
    });
    const idx = voices.findIndex(v => (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0);
    voiceSel.value = idx >= 0 ? idx : 0;
    if (!listening) {
      status.textContent = idx >= 0
        ? 'Indian English voice ready.'
        : 'No Indian English voice found on this device — closest English voice selected.';
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function pageText(){
    const p = PAGES[current];
    const div = document.createElement('div');
    div.innerHTML = p.html;
    let t = (div.textContent || '').replace(/\s+/g, ' ').trim();
    (p.images || []).forEach(im => { t += ' Figure on this page: ' + im.caption + '.'; });
    return t;
  }

  function chunk(text){
    const parts = text.match(/[^.!?\u2026]+[.!?\u2026]+["')\]]*\s*/g) || [text];
    const out = [];
    let buf = '';
    parts.forEach(s => {
      if ((buf + s).length > 220) { if (buf) out.push(buf); buf = s; }
      else buf += s;
    });
    if (buf) out.push(buf);
    return out;
  }

  function speak(){
    const text = pageText();
    if (!text) { status.textContent = 'Nothing to read on this page.'; return; }
    const myGen = ++gen;
    speechSynthesis.cancel();
    const pieces = chunk(text);
    const v = voices[parseInt(voiceSel.value, 10)];
    pieces.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateSel.value);
      if (i === pieces.length - 1) {
        u.onend = () => {
          if (!listening || myGen !== gen) return;
          if (autoChk.checked && current < PAGES.length - 1) { current++; render(); }
          else setUi(false);
        };
      }
      speechSynthesis.speak(u);
    });
    status.textContent = 'Reading page ' + (current + 1) + ' of ' + PAGES.length + '…';
  }

  function setUi(on){
    listening = on;
    paused = false;
    playBtn.innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Read aloud';
    stopBtn.disabled = !on;
    if (!on) status.textContent = 'Stopped.';
  }

  window.__afterRender = function(){
    if (listening) speak();
  };

  setInterval(() => {
    if (listening && !paused && speechSynthesis.speaking) speechSynthesis.resume();
  }, 10000);

  listenBtn.addEventListener('click', () => bar.classList.toggle('open'));
  playBtn.addEventListener('click', () => {
    if (!listening) { setUi(true); speak(); return; }
    if (paused) { speechSynthesis.resume(); paused = false; playBtn.innerHTML = '&#10074;&#10074; Pause'; }
    else { speechSynthesis.pause(); paused = true; playBtn.innerHTML = '&#9654; Resume'; }
  });
  stopBtn.addEventListener('click', () => { gen++; speechSynthesis.cancel(); setUi(false); });
  voiceSel.addEventListener('change', () => { if (listening) speak(); });
  rateSel.addEventListener('change', () => { if (listening) speak(); });
})();

</script>

<script>
(function(){
  var NOTES = {};
  var CHMAP = [];
  try { NOTES = JSON.parse(document.getElementById('notes-data').textContent); } catch(e) {}
  try { CHMAP = JSON.parse(document.getElementById('chapter-map').textContent); } catch(e) {}
  var term = '', matchPages = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function pageText(p){ var d=document.createElement('div'); d.innerHTML=p.html; return d.textContent || ''; }

  // ---------- SEARCH ----------
  var bar = document.getElementById('search-bar');
  var input = document.getElementById('search-input');
  var info = document.getElementById('search-info');

  function clearMarks(){
    var c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(function(mk){
      var t = document.createTextNode(mk.textContent);
      mk.parentNode.replaceChild(t, mk);
    });
    c.normalize();
  }
  function highlight(){
    clearMarks();
    if (!term || term.length < 2) return;
    var c = document.getElementById('content');
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var t = term.toLowerCase();
    nodes.forEach(function(n){
      var txt = n.nodeValue, low = txt.toLowerCase(), idx = low.indexOf(t);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(txt.slice(pos, idx)));
        var mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = txt.slice(idx, idx + term.length);
        frag.appendChild(mk);
        pos = idx + term.length;
        idx = low.indexOf(t, pos);
      }
      frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function infoText(){
    if (!term || term.length < 2) { info.textContent = ''; return; }
    if (!matchPages.length) { info.textContent = 'No matches'; return; }
    var pos = matchPages.indexOf(current);
    info.textContent = matchPages.length + (matchPages.length > 1 ? ' pages' : ' page') +
      (pos >= 0 ? ' — match ' + (pos + 1) + ' of ' + matchPages.length : '');
  }
  function doSearch(){
    term = input.value.trim();
    matchPages = [];
    if (term.length >= 2){
      var t = term.toLowerCase();
      PAGES.forEach(function(p, i){ if (pageText(p).toLowerCase().indexOf(t) >= 0) matchPages.push(i); });
    }
    if (matchPages.length){ current = matchPages[0]; render(); }
    else { highlight(); infoText(); }
  }
  function step(d){
    if (!matchPages.length) return;
    var pos = matchPages.indexOf(current);
    if (pos < 0) pos = 0;
    pos = (pos + d + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }
  var searchT = null;
  input.addEventListener('input', function(){ clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ clearTimeout(searchT); doSearch(); } });
  document.getElementById('search-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('search-next').addEventListener('click', function(){ step(1); });
  document.getElementById('search-close').addEventListener('click', function(){
    bar.classList.remove('open'); term=''; matchPages=[]; highlight(); infoText();
  });
  document.getElementById('search-toggle').addEventListener('click', function(){
    var open = bar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) input.focus();
  });

  // ---------- NOTES ----------
  var panel = document.getElementById('notes-panel');
  var body = document.getElementById('notes-body');
  function showNotes(){
    var ch = null;
    for (var i = current; i >= 0; i--){
      if (CHMAP[i] && NOTES[CHMAP[i]]) { ch = CHMAP[i]; break; }
    }
    if (!ch){
      for (var j = current; j < CHMAP.length; j++){
        if (CHMAP[j] && NOTES[CHMAP[j]]) { ch = CHMAP[j]; break; }
      }
    }
    if (!ch){
      body.innerHTML = '<p class="notes-empty">No chapter notes available for this section.</p>';
      return;
    }
    var n = NOTES[ch];
    var h = '<h3>' + esc(ch) + '</h3><h4>Summary</h4><p>' + esc(n.s) + '</p>';
    if (n.p && n.p.length){
      h += '<h4>Key points</h4><ul>' + n.p.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body.innerHTML = h;
  }
  document.getElementById('notes-toggle').addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    bar.classList.remove('open');
    if (open) showNotes();
  });

  // hooks after every render
  var prevA = window.__afterRender;
  window.__afterRender = function(){
    if (prevA) prevA();
    highlight();
    infoText();
    if (panel.classList.contains('open')) showNotes();
  };
})();
</script>

  function showTipForSelection(){
    var sel = window.getSelection();
    var txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    if (txt.length >= 2 && txt.length <= 160){
      term = txt;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      var top = r.top - 46;
      if (top < 8) top = r.bottom + 10;
      var left = r.left + r.width / 2;
      left = Math.max(90, Math.min(window.innerWidth - 90, left));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.classList.add('show');
    } else {
      hideTip();
    }
  }

  document.addEventListener('mouseup', function(e){
    if (tip.contains(e.target) || bar.contains(e.target)) return;
    setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('keyup', function(e){
    if (e.shiftKey) setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!tip.contains(e.target)) hideTip();
  });

    }
    bar.classList.add('show');
  });

  document.getElementById('sel-search-close').addEventListener('click', function(){

    hideBar();
  });
})();

<script>
(function(){
  if (window.__slChat) return; window.__slChat = true;
  var CFG_KEY = 'sl_llm_config';
  function loadCfg(){
    try { var raw = localStorage.getItem(CFG_KEY); if (raw) return JSON.parse(raw); } catch(e){}
    return { endpoint:'https://api.openai.com/v1/chat/completions', key:'', model:'gpt-4o-mini' };
  }
  var cfg = loadCfg();

  var fab = document.createElement('button');
  fab.id = 'sl-chat-fab'; fab.type = 'button'; fab.title = 'Library assistant';
  fab.textContent = '\uD83D\uDCAC';
  document.body.appendChild(fab);

  var panel = document.createElement('div');
  panel.id = 'sl-chat-panel';
  panel.innerHTML =
    '<div id="sl-chat-head"><span>\u2728 Library Assistant</span>' +
    '<span><button id="sl-chat-clear" type="button" title="Clear chat">\uD83D\uDDD1</button>' +
    '<button id="sl-chat-gear" type="button" title="LLM settings">\u2699</button>' +
    '<button id="sl-chat-x" type="button" title="Close">\u2715</button></span></div>' +
    '<div id="sl-chat-settings">' +
    '<b>LLM configuration (any OpenAI-compatible API)</b>' +
    '<input id="sl-cfg-endpoint" placeholder="Endpoint, e.g. https://api.openai.com/v1/chat/completions">' +
    '<input id="sl-cfg-key" type="password" placeholder="API key (stored only in this browser)">' +
    '<input id="sl-cfg-model" placeholder="Model, e.g. gpt-4o-mini">' +
    '<div class="row"><button id="sl-cfg-save" type="button">Save</button>' +
    '<button id="sl-cfg-test" type="button">Test</button><span id="sl-cfg-status"></span></div>' +
    '<div class="hint">Works with OpenAI, OpenRouter, Groq, Mistral, Ollama (http://localhost:11434/v1/chat/completions), LM Studio. Without a key I search this book locally and DuckDuckGo externally.</div>' +
    '</div>' +
    '<div id="sl-chat-body"></div>' +
    '<div id="sl-chat-inputrow"><input id="sl-chat-input" placeholder="Ask about this book, or the web\u2026">' +
    '<button id="sl-chat-send" type="button" title="Send">\u27A4</button></div>';
  document.body.appendChild(panel);

  var body = panel.querySelector('#sl-chat-body');
  var input = panel.querySelector('#sl-chat-input');
  var sendBtn = panel.querySelector('#sl-chat-send');
  var busy = false;

  function scrollBody(){ body.scrollTop = body.scrollHeight; }
  function addMsg(role, html){
    var d = document.createElement('div');
    d.className = 'sl-msg ' + role;
    d.innerHTML = html;
    body.appendChild(d); scrollBody();
    return d;
  }
  function esc(t){ var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  addMsg('bot', 'Namaste. Ask me anything \u2014 I can search <b>this book</b> page by page, answer with your configured LLM, or run an external DuckDuckGo search.');

  function pageText(p){
    var d = document.createElement('div'); d.innerHTML = p.html; return d.textContent || '';
  }

  function searchBook(q){
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    if (!terms.length) return [];
    var out = [];
    for (var i = 0; i < PAGES.length; i++){
      var txt = pageText(PAGES[i]).toLowerCase();
      var score = 0;
      for (var k = 0; k < terms.length; k++){
        var hits = txt.split(terms[k]).length - 1;
        if (hits) score += hits;
      }
      if (score) out.push({ i: i, score: score });
    }
    out.sort(function(a,b){ return b.score - a.score; });
    return out.slice(0, 5);
  }

  function snippet(i, q){
    var txt = pageText(PAGES[i]).replace(/\s+/g,' ');
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    var pos = -1;
    for (var k = 0; k < terms.length; k++){ pos = txt.toLowerCase().indexOf(terms[k]); if (pos >= 0) break; }
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 60);
    return (start ? '\u2026' : '') + txt.slice(start, start + 170) + '\u2026';
  }

  function goToPage(i){
    try { current = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch(e){ console.warn('jump failed', e); }
  }

  function callLlm(q, context){
    return fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: 'You are the assistant inside a spiritual book reader. Answer concisely. When book excerpts are provided, ground the answer in them and cite the page labels. If the question needs current external facts, say so and suggest an external search.' },
          { role: 'user', content: context ? 'Book excerpts:\n' + context + '\n\nQuestion: ' + q : q }
        ],
        temperature: 0.4
      })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error('LLM error ' + res.status + ': ' + t.slice(0,180)); });
      return res.json();
    }).then(function(data){
      var c = data.choices && data.choices[0] && data.choices[0].message;
      return (c && c.content || '(empty response)').trim();
    });
  }

  function handleSend(){
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    addMsg('user', esc(q));
    busy = true; sendBtn.disabled = true;
    var thinking = document.createElement('div');
    thinking.className = 'sl-thinking'; thinking.textContent = 'Thinking\u2026';
    body.appendChild(thinking); scrollBody();

    var hits = searchBook(q);
    var finish = function(){ busy = false; sendBtn.disabled = false; thinking.remove(); };

    function renderRefs(){
      if (!hits.length) return '';
      var h = '';
      hits.forEach(function(hit, n){
        h += '<button class="sl-ref" data-page="' + hit.i + '" type="button"><b>' + esc(PAGES[hit.i].label) +
             ' \u00b7 page ' + (hit.i + 1) + '</b><span>' + esc(snippet(hit.i, q)) + '</span>' +
             '<span class="go">Go to page \u2192</span></button>';
      });
      return h;
    }

    var done = function(html){ finish(); var m = addMsg('bot', html);
      m.querySelectorAll('.sl-ref').forEach(function(b){
        b.addEventListener('click', function(){ goToPage(parseInt(b.getAttribute('data-page'), 10)); });
      });
    };

    if (cfg.key){
      var ctx = hits.slice(0,3).map(function(hit){
        return '[' + PAGES[hit.i].label + ', page ' + (hit.i + 1) + '] ' + pageText(PAGES[hit.i]).replace(/\s+/g,' ').slice(0, 900);
      }).join('\n');
      callLlm(q, ctx).then(function(ans){ done(esc(ans) + renderRefs()); })
      .catch(function(err){ done(esc(String(err.message || err)) + renderRefs()); });
    } else if (hits.length){
      done('I found ' + hits.length + ' relevant page' + (hits.length > 1 ? 's' : '') + ' in this book. Tap one to jump there, or add an LLM API key in \u2699 Settings for a synthesized answer.' + renderRefs());
    } else {
      var url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      done('Nothing in this book matched. <a href="' + url + '" target="_blank" rel="noopener">Search the web for \u201c' + esc(q) + '\u201d on DuckDuckGo \u2197</a> \u2014 or add an LLM key in \u2699 Settings and I can answer directly.');
    }
  }

  fab.addEventListener('click', function(){ panel.classList.toggle('show'); });
  panel.querySelector('#sl-chat-x').addEventListener('click', function(){ panel.classList.remove('show'); });
  panel.querySelector('#sl-chat-clear').addEventListener('click', function(){ body.innerHTML = ''; addMsg('bot', 'Chat cleared. Ask me anything.'); });
  panel.querySelector('#sl-chat-gear').addEventListener('click', function(){
    var st = panel.querySelector('#sl-chat-settings');
    st.classList.toggle('show');
    panel.querySelector('#sl-cfg-endpoint').value = cfg.endpoint || '';
    panel.querySelector('#sl-cfg-key').value = cfg.key || '';
    panel.querySelector('#sl-cfg-model').value = cfg.model || '';
  });
  panel.querySelector('#sl-cfg-save').addEventListener('click', function(){
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    panel.querySelector('#sl-cfg-status').textContent = 'Saved.';
  });
  panel.querySelector('#sl-cfg-test').addEventListener('click', function(){
    var status = panel.querySelector('#sl-cfg-status');
    status.textContent = 'Testing\u2026';
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'Say OK' }], max_tokens: 5 })
    }).then(function(res){ status.textContent = res.ok ? 'Connected.' : 'Failed: HTTP ' + res.status; })
    .catch(function(err){ status.textContent = 'Failed: ' + err.message; });
  });
  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });
})();
</script>
<style id="sl-sel-css">
#sl-sel-tip{position:fixed;z-index:99999;display:none;align-items:center;gap:2px;padding:5px;background:#2E2A24;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);font:13px/1.2 system-ui,-apple-system,sans-serif}

<script>
(function(){
  if (window.__slSelTools) return; window.__slSelTools = true;

  /* Compatibility shim: topic-based readers (e.g. Ponder on This) expose
     `topics` + `goTo(id)` instead of `PAGES` + `render()`. Build the PAGES
     interface so the embedded assistant's search and page jumps work there too. */
  try {
    if (typeof PAGES === 'undefined' && typeof topics !== 'undefined' && Array.isArray(topics)) {
      window.PAGES = topics.map(function(t){
        return {
          label: 'Topic ' + t.id + ' \u2014 ' + t.title,
          html: '<div>' + (t.matter || []).map(function(m){ return '<p>' + m.text + '</p>'; }).join('') + '</div>'
        };
      });
      window.render = function(){
        try { if (typeof goTo === 'function') goTo(topics[window.current || 0].id); } catch(e){}
      };
    }
  } catch(e){}

  var NOTES_KEY = 'sl_my_notes';

  var tip = document.createElement('div');
  tip.id = 'sl-sel-tip';
  tip.setAttribute('role', 'toolbar');
  tip.setAttribute('aria-label', 'Selection actions');
  tip.innerHTML =
    '<button type="button" data-act="ask">\u2728 Ask AI</button>' +
    '<span class="sl-sep"></span>' +
    '<button type="button" data-act="note">\uD83D\uDCDD Add to my note</button>';
  document.body.appendChild(tip);

  var toast = document.createElement('div');
  toast.id = 'sl-sel-toast';
  document.body.appendChild(toast);
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  var selText = '';

  function hideTip(){ tip.classList.remove('show'); }

  function insideUi(node){
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    while (el) {
      if (el.id === 'sl-chat-panel' || el.id === 'sl-sel-tip' ||
          el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return true;
      el = el.parentElement;
    }
    return false;
  }

  function showTip(){
    var sel = window.getSelection();
    var text = sel && !sel.isCollapsed ? sel.toString().replace(/\s+/g, ' ').trim() : '';
    if (text.length < 3 || insideUi(sel.anchorNode)) { hideTip(); return; }
    var rect;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch(e){ hideTip(); return; }
    if (!rect || (rect.width === 0 && rect.height === 0)) { hideTip(); return; }
    selText = text;
    tip.classList.add('show');
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = rect.left + rect.width / 2 - w / 2;
    var y = rect.top - h - 8;
    if (y < 6) y = Math.min(window.innerHeight - h - 6, rect.bottom + 8);
    x = Math.max(6, Math.min(window.innerWidth - w - 6, x));
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseup', function(){ setTimeout(showTip, 10); });
  document.addEventListener('touchend', function(){ setTimeout(showTip, 350); });
  document.addEventListener('mousedown', function(e){ if (!tip.contains(e.target)) hideTip(); });
  document.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideTip(); });

  /* Keep the text selection alive when the user taps a tooltip button */
  tip.addEventListener('mousedown', function(e){ e.preventDefault(); });
  tip.addEventListener('touchend', function(e){ e.preventDefault(); }, { passive: false });

  function askAi(text){
    var panel = document.getElementById('sl-chat-panel');
    var input = document.getElementById('sl-chat-input');
    var send = document.getElementById('sl-chat-send');
    if (!panel || !input || !send) return;
    panel.classList.add('show');
    var trimmed = text.length > 600 ? text.slice(0, 600) + '\u2026' : text;
    input.value = 'Explain this passage: \u201C' + trimmed + '\u201D';
    send.click();
    input.focus();
  }

  function currentLocation(){
    try {
      if (typeof PAGES !== 'undefined' && typeof current !== 'undefined' && PAGES[current]) {
        return PAGES[current].label || '';
      }
    } catch(e){}
    try {
      if (typeof topics !== 'undefined' && typeof currentId !== 'undefined') {
        var t = topics.find(function(x){ return x.id === currentId; });
        if (t) return 'Topic ' + t.id + ' \u2014 ' + t.title;
      }
    } catch(e){}
    return '';
  }

  function addNote(text){
    var notes = [];
    try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); } catch(e){}
    if (!Array.isArray(notes)) notes = [];
    notes.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      book: document.title,
      page: currentLocation(),
      text: text,
      url: location.pathname.split('/').pop(),
      ts: Date.now()
    });
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes.slice(0, 500))); } catch(e){}
    showToast('Saved to My Notes \u2014 view it on the library home page');
  }

  tip.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    var text = selText;
    hideTip();
    if (btn.getAttribute('data-act') === 'ask') askAi(text);
    else addNote(text);
  });
})();
</script>
