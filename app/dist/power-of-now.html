ment?\" Be at least as interested in what goes on inside you as what happens outside. If you get the inside right, the outside will fall into place. Primary reality is within, secondary reality without. But dont answer these questions immediately. Direct your attention inward. Have a look inside yourself. What kind of thoughts is your mind producing? What do you feel? Direct your attention into the body. Is there any tension? Once you detect that there is a low level of unease, the background static, see in what way you are avoiding, resisting, or denying life by denying the Now. There are many ways in which people unconsciously resist the present moment. I will give you a few examples. With practice, your power of self- observation, of monitoring your inner state, will become sharpened.<\/p>", "images": [], "label": "Page 89"}, {"pdf_page_index": 89, "pdf_page_number": 90, "html": "<h4 class=\"pdf-subhead\">Freedom From Unhappiness<\/h4>\n<p class=\"pdf-para\">Do you resent doing what you are doing? It may be your job, or you may have agreed to do something and are doing it, but part of you resents and resists it. Are you carrying unspoken resentment toward a person close to you? Do you realize that the energy you thus emanate is so harmful in its effects that you are in fact contaminating yourself as well as those around you? Have a good look inside. Is there even the slightest trace of resentment, unwillingness? If there is, observe it on both the mental and the emotional levels. What thoughts is your mind creating around this situation? Then look at the emotion, which is the body's reaction to those thoughts. Feel the emotion. Does it feel pleasant or unpleasant? Is it an energy that you would actually choose to have inside you? Do you have a choice?<\/p>\n<p class=\"pdf-para\">Maybe you are being taken advantage of, maybe the activity you are engaged in is tedious, maybe someone close to you is dishonest, irritating, or unconscious, but all this is irrelevant. Whether your thoughts and emotions about this situation are justified or not makes no difference. The fact is that you are resisting what is. You are making the present moment into an enemy. You are creating unhappiness, conflict between the inner and the outer. Your unhappiness is polluting not only your own inner being and those around you but also the collective human psyche of which you are an inseparable part. The pollution of the planet is only an outward reflection of an inner psychic pollution: millions of unconscious individuals not taking responsibility for their inner space.<\/p>\n<p class=\"pdf-para\">Either stop doing what you are doing, speak to the person concerned and express fully what you feel, or drop the negativity that your mind has created around the situation and that serves no purpose whatsoever except to strengthen a false sense of self. Recognizing its futility is important. Negativity is never the optimum way of dealing with any situation. In fact, in most cases it keeps you stuck in it, blocking real change. Anything that is done with negative energy will become contaminated by it and in time give<\/p>", "images": [], "label": "Page 90"}, {"pdf_page_index": 90, "pdf_page_number": 91, "html": "<p class=\"pdf-para\">rise to more pain, more unhappiness. Furthermore, any negative inner state is contagious: Unhappiness spreads more easily than a physical disease. Through the law of resonance, it triggers and feeds latent negativity in others, unless they are immune that is, highly conscious.<\/p>\n<p class=\"pdf-para\">Are you polluting the world or cleaning up the mess? You are responsible for your inner space; nobody else is, just as you are responsible for the planet. As within, so without: If humans clear inner pollution, then they will also cease to create outer pollution.<\/p>\n<p class=\"pdf-para\">How can we drop negativity, as you suggest? By dropping it. How do you drop a piece of hot coal that you are holding in your hand? How do you drop some heavy and useless baggage that you are carrying? By recognizing that you don't want to suffer the pain or carry the burden anymore and then letting go of it.<\/p>\n<p class=\"pdf-para\">Deep unconsciousness, such as the pain-body, or other deep pain, such as the loss of a loved one, usually needs to be transmuted through acceptance combined with the light of your presence your sustained attention. Many patterns in ordinary unconsciousness, on the other hand, can simply be dropped once you know that you don't want them and don't need them anymore, once you realize that you have a choice, that you are not just a bundle of conditioned reflexes. All this implies that you are able to access the power of Now. Without it, you have no choice. If you call some emotions negative, aren't you creating a mental polarity of good and bad, as you explained earlier?<\/p>\n<p class=\"pdf-para\">No. The polarity was created at an earlier stage when your mind judged the present moment as bad; this judgment then created the negative emotion.<\/p>\n<p class=\"pdf-para\">But if you call some emotions negative, aren't you really saying that they shouldn't be there, that it's not okay to have those emotions? My understanding is that we should give ourselves permission to have whatever feelings come up, rather than judge them as bad or say that we shouldn't have them. It's okay to feel resentful; it's okay to be angry, irritated, moody, or whatever otherwise, we get into repression, inner conflict, or denial. Everything is okay as it is.<\/p>\n<p class=\"pdf-para\">Of course. Once a mind pattern, an emotion or a reaction is there, accept it. You were not conscious enough to have a choice in the matter. Thats not a judgment, just a fact. If you had a choice, or realized that you do have a<\/p>", "images": [], "label": "Page 91"}, {"pdf_page_index": 91, "pdf_page_number": 92, "html": "<p class=\"pdf-para\">choice, would you choose suffering or joy, ease or unease, peace or conflict?<\/p>\n<p class=\"pdf-para\">Would you choose a thought or feeling that cuts you off from your natural state of well-being, the joy of life within? Any such feeling I call negative, which simply means bad. Not in the sense that “You shouldn't have done that” but just plain factual bad, like feeling sick in the stomach.<\/p>\n<p class=\"pdf-para\">How is it possible that humans killed in excess of 100 million fellow humans in the twentieth century alone? Humans inflicting pain of such magnitude on one another is beyond anything you can imagine. And thats not taking into account the mental, emotional and physical violence, the torture, pain, and cruelty they continue to inflict on each other as well as on other sentient beings on a daily basis.<\/p>\n<p class=\"pdf-para\">Do they act in this way because they are in touch with 87 their natural state, the joy of life within? Of course not. Only people who are in a deeply negative state, who feel very bad indeed, would create such a reality as a reflection of how they feel. Now they are engaged in destroying nature and the planet that sustains them. Unbelievable but true. Humans are a dangerously insane and very sick species. Thats not a judgment. Ifs a fact. It is also a fact that the sanity is there underneath the madness. Healing and redemption are available right now.<\/p>\n<p class=\"pdf-para\">Coming back specifically to what you said it is certainly true that, when you accept your resentment, moodiness, anger, and so on, you are no longer forced to act them out blindly, and you are less likely to project them onto others. But I wonder if you are not deceiving yourself. When you have been practicing acceptance for a while, as you have,<\/p>\n<p class=\"pdf-para\">there comes a point when you need to go on to the next stage, where those negative emotions are not created anymore. If you don't, your “acceptance” just becomes a mental label that allows your ego to continue to indulge in unhappiness and so strengthen its sense of separation from other people, your surroundings, youre here and now. As you know, separation is the basis for the ego's sense of identity. True acceptance would transmute those feelings at once. And if you really knew deeply that everything is “okay,” as you put it, and which of course is true, then would you have those negative feelings in the first place? Without judgment, without resistance to what is, they would not arise. You have an idea in your mind that “everything is okay,” but deep down you dont really believe it,<\/p>", "images": [], "label": "Page 92"}, {"pdf_page_index": 92, "pdf_page_number": 93, "html": "<p class=\"pdf-para\">and so the old mental- emotional patterns of resistance are still in place. Thats what makes you feel bad.<\/p>\n<p class=\"pdf-para\">Thats okay, too. Are you defending your right to be unconscious, your right to suffer? Don't worry: nobody is going to take that away from you. Once you realize that a certain kind of food makes you sick, would you carry on eating that food and keep asserting that it is okay to be sick?<\/p>", "images": [], "label": "Page 93"}, {"pdf_page_index": 93, "pdf_page_number": 94, "html": "<h4 class=\"pdf-subhead\">Wherever You Are, Be There Totally<\/h4>\n<p class=\"pdf-para\">Can you give some more examples of ordinary unconsciousness? See if you can catch yourself complaining, in either speech or thought, about a situation you find yourself in, what other people do or say, your surroundings, your life situation, even the weather. To complain is always nonacceptance of what is.<\/p>\n<p class=\"pdf-para\">It invariably carries an unconscious negative charge. When you complain, you make yourself into a victim. When you speak out, you are in your power. So change the situation by taking action or by speaking out if necessary or possible; leave the situation or accept it. All else is madness.<\/p>\n<p class=\"pdf-para\">Ordinary unconsciousness is always linked in some way with denial of the Now. The Now, of course, also implies the here. Are you resisting your here and now? Some people would always rather be somewhere else. Their “here” is never good enough. Through self-observation, find out if that is the case in your life. Wherever you are, be there totally. If you find your here and now intolerable and it makes you unhappy, you have three options: remove yourself from the situation, change it, or accept it totally. If you want to take responsibility for your life, you must choose one of those three options, and you must choose now. Then accept the consequences. No excuses. No negativity. No psychic pollution. Keep your inner space clear.<\/p>\n<p class=\"pdf-para\">If you take any action leaving or changing your situation drop the negativity first, if at all possible. Action arising out of insight into what is required is more effective than action arising out of negativity.<\/p>\n<p class=\"pdf-para\">Any action is often better than no action, especially if you have been stuck in an unhappy situation for a long time. If it is a mistake, at least you learn something, in which case ifs no longer a mistake. If you remain stuck, you learn nothing. Is fear preventing you from taking action? Acknowledge the fear, watch it, take your attention into it, be fully present with it. Doing so cuts the link between the fear and your thinking. Don't let the fear rise up into pour mind. Use the power of the Now. Fear cannot prevail against it.<\/p>", "images": [], "label": "Page 94"}, {"pdf_page_index": 94, "pdf_page_number": 95, "html": "<p class=\"pdf-para\">If there is truly nothing that you can do to change your here and now, and you can't remove yourself from the situation, then accept your here and now totally by dropping all inner resistance. The false, unhappy self that loves feeling miserable, resentful, or sorry for itself can then no longer survive. This is called surrender. Surrender is not weakness. There is great strength in it. Only a surrendered person has spiritual power. Through surrender, you will be free internally of the situation. You may then find that the situation changes without any effort on your part. In any case,<\/p>\n<p class=\"pdf-para\">you are free. Or is there something that you “should” be doing but are not doing it? Get up and do it now. Alternatively, completely accept your inactivity, laziness, or passivity at this moment, if that is your choice. Go into it fully. Enjoy it. Be as lazy or inactive as you can. If you go into it fully and consciously, you will soon come out of it. Or maybe you won't. Either way, there is no inner conflict, no resistance, no negativity.<\/p>\n<p class=\"pdf-para\">Are you stressed? Are you so busy getting to the future that the present is reduced to a means of getting there? Stress is caused by being “here” but wanting to be “there,” or being in the present but wanting to be in the future. Its a split that tears you apart inside. To create and live with such an inner split is insane. The fact that everyone else is doing it doesn't make it any less insane. If you have to, you can move fast, work fast, or even run, without projecting yourself into the future and without resisting the present. As you move, work, run do it totally. Enjoy the flow of energy, the high energy of that moment. Now you are no longer stressed, no longer splitting yourself in two. Just moving, running, working and enjoying it. Or you can drop the whole thing and sit on a park bench. But when you do, watch your mind. It may say: “You should be working. You are wasting time.” Observe the mind. Smile at it.<\/p>\n<p class=\"pdf-para\">Does the past take up a great deal of your attention? Do you frequently talk and think about it, either positively or negatively? The great things that you have achieved, your adventures or experiences, or your victim story and the dreadful things that were done to you, or maybe what you did to someone else? Are your thought processes creating guilt, pride, resentment, anger, regret, or self-pity? Then you are not only reinforcing a false sense of self but also helping to accelerate your body's aging process by creating an accumulation of past in your psyche. Verify this for yourself by observing those around you who have a strong tendency to hold on to the past.<\/p>", "images": [], "label": "Page 95"}, {"pdf_page_index": 95, "pdf_page_number": 96, "html": "<p class=\"pdf-para\">Die to the past every moment. You dont need it. Only refer to it when it is absolutely relevant to the present. Feel the power of this moment and the fullness of Being. Feel your presence.<\/p>\n<p class=\"pdf-para\">¤ Are you worried? Do you have many “what if” thoughts? You are identified with your mind, which is projecting itself into an imaginary future situation and creating fear. There is no way that you can cope with such a situation, because it doesn't exist. It's a mental phantom. You can stop this health- and life-corroding insanity simply by acknowledging the present moment. Become aware of your breathing. Feel the air flowing in and out of your body. Feel your inner energy field. All that you ever have to deal with, cope with, in real life as opposed to imaginary mind projections is this moment. Ask yourself what “problem” you have right now, not next year, tomorrow, or five minutes from now. What is wrong with this moment? You can always cope with the Now, but you can never cope with the future nor do you have to. The answer, the strength, the right action or the resource will be there when you need it, not before, not after.<\/p>\n<p class=\"pdf-para\">“One day I'll make it.” Is your goal taking up so much of your attention that you reduce the present moment to a means to an end? Is it taking the joy out of your doing? Are you waiting to start living? If you develop such a mind pattern, no matter what you achieve or get, the present will never be good enough; the future will always seem better. A perfect recipe for permanent dissatisfaction and nonfulfillment, don't you agree?<\/p>\n<p class=\"pdf-para\">Are you a habitual “waiter”? How much of your life do you spend waiting? What I call “small-scale waiting” is waiting in line at the post office, in a traffic jam, at the airport, or waiting for someone to arrive, to finish work, and so on. “Large-scale waiting” is waiting for the next vacation, for a better job, for the children to grow up, for a truly meaningful relationship, for success, to make money, to be important, to become enlightened. It is not uncommon for people to spend their whole life waiting to start living.<\/p>\n<p class=\"pdf-para\">Waiting is a state of mind. Basically, it means that you want the future; you don't want the present. You don't want what you've got, and you want what you haven't got. With every kind of waiting, you unconsciously create inner conflict between your here and now, where you don't want to be, and the projected future, where you want to be. This greatly reduces the quality of your life by making you lose the present.<\/p>", "images": [], "label": "Page 96"}, {"pdf_page_index": 96, "pdf_page_number": 97, "html": "<p class=\"pdf-para\">There is nothing wrong with striving to improve your life situation. You can improve your life situation, but you cannot improve your life. Life is primary. Life is your deepest inner Being. It is already whole, complete, perfect. Your life situation consists of your circumstances youre your experiences. There is nothing wrong with setting goals and striving to achieve things. The mistake lies in using it as a substitute for the feeling of life, for Being. The only point of access for that is the Now. You are then like an architect who pays no attention to the foundation of a building but spends a lot of time working on the superstructure.<\/p>\n<p class=\"pdf-para\">For example, many people are waiting for prosperity. It cannot come in the future. When you honor, acknowledge, and fully accept your present reality where you are, who you are, what you are doing right now when you fully accept what you have got, you are grateful for what you have got, grateful for what is, grateful for Being. Gratitude for the present moment and the fullness of life now is true prosperity.<\/p>\n<p class=\"pdf-para\">It cannot come in the future. Then, in time, that prosperity manifests for you in various ways.<\/p>\n<p class=\"pdf-para\">If you are dissatisfied with what you have got, or even frustrated or angry about your present lack, that may motivate you to become rich, but even if you do make millions, you will continue to experience the inner condition of lack, and deep down you will continue to feel unfulfilled. You may have many exciting experiences that money can buy, but they will come and go and always leave you with an empty feeling and the need for further physical or psychological gratification. You won't abide in Being and so feel the fullness of life now that alone is true prosperity.<\/p>\n<p class=\"pdf-para\">So give up waiting as a state of mind. When you catch yourself slipping into waiting . . . snap out of it. Come into the present moment. Just be, and enjoy being. If you are present, there is never any need for you to wait for anything. So next time somebody says, “Sorry to have kept you waiting,” you can reply, “Thats all right, I wasn't waiting. I was just standing here enjoying myself in joy in my self.”<\/p>\n<p class=\"pdf-para\">These are just a few of the habitual mind strategies for denying the present moment that are part of ordinary unconsciousness. They are easy to overlook because they are so much a part of normal living: the background static of perpetual discontent. But the more you practice monitoring your inner mental-emotional state, the easier it will be to know when you have been trapped in past or future, which is to say unconscious, and to awaken<\/p>", "images": [], "label": "Page 97"}, {"pdf_page_index": 97, "pdf_page_number": 98, "html": "<p class=\"pdf-para\">out of the dream of time into the present. But beware: The false, unhappy self, based on mind identification, lives on time. It knows that the present moment is its own death and so feels very threatened by it. It will do all it can to take you out of it. It will try to keep you trapped in time.<\/p>", "images": [], "label": "Page 98"}, {"pdf_page_index": 98, "pdf_page_number": 99, "html": "<h4 class=\"pdf-subhead\">The Inner Purpose Of Your Life'S Journey<\/h4>\n<p class=\"pdf-para\">I can see the truth of what you are saying, but I still think that we must have purpose on our life's journey; otherwise we just drift, and purpose means future, doesn't it? How do we reconcile that with living in the present?<\/p>\n<p class=\"pdf-para\">When you are on a journey, it is certainly helpful to know where you are going or at least the general direction in which you are moving, but don't forget: the only thing that is ultimately real about your journey is the step that you are taking at this moment. Thats all there ever is.<\/p>\n<p class=\"pdf-para\">Your life's journey has an outer purpose and an inner purpose. The outer purpose is to arrive at your goal or destination, to accomplish what you set out to do, to achieve this or that, which, of course, implies future. But if your destination, or the steps you are going to take in the future, take up so much of your attention that they become more important to you than the step you are taking now, then you completely miss the journey's inner purpose, which has nothing to do with where you are going or what you are doing, but everything to do with how. It has nothing to do with future but everything to do with the quality of your consciousness at this moment. The outer purpose belongs to the horizontal dimension of space and time; the inner purpose concerns a deepening of your Being in the vertical dimension of the timeless Now. Your outer journey may contain a million steps; your inner journey only has one: the step you are taking right now. As you become more deeply aware of this one step, you realize that it already contains within itself all the other steps as well as the destination. This one step then becomes transformed into an expression of perfection, an act of great beauty and quality. It will have taken you into Being, and the light of Being will shine through it. This is both the purpose and the fulfillment of your inner journey, the journey into yourself.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 99"}, {"pdf_page_index": 99, "pdf_page_number": 100, "html": "<p class=\"pdf-para\">Does it matter whether we achieve our outer purpose, whether we succeed or fail in the world?<\/p>\n<p class=\"pdf-para\">It will matter to you as long as you haven't realized your inner purpose. After that, the outer purpose is just a game that you may continue to play simply because you enjoy it. It is also possible to fail completely in your outer purpose and at the same time totally succeed in your inner purpose. Or the other way around, which is actually more common: outer riches and inner poverty, or to “gain the world and lose your soul,” as Jesus puts it. Ultimately, of course, every outer purpose is doomed to “fail” sooner or later, simply because it is subject to the law of impermanence of all things. The sooner you realize that your outer purpose cannot give you lasting fulfillment, the better. When you have seen the limitations of your outer purpose, you give up your unrealistic expectation that it should make you happy, and you make it subservient to your inner purpose.<\/p>", "images": [], "label": "Page 100"}, {"pdf_page_index": 100, "pdf_page_number": 101, "html": "<h4 class=\"pdf-subhead\">The Past Cannot Survive In Your Presence<\/h4>\n<p class=\"pdf-para\">You mentioned that thinking or talking about the past unnecessarily is one of the ways in which we avoid the present. But apart from the past that we remember and perhaps identify with, isn't there another level of past within us that is much more deep-seated? I am talking about the unconscious past that conditions our lives, especially through early childhood experiences, perhaps even past-life experiences. And then there is our cultural conditioning, which has to do with where we live geographically and the historical time period in which we live. All these things determine how we see the world, how we react, what we think, what kind of relationships we have, how we live our lives. How could we ever become conscious of all that or get rid of it? How long would that take? And even if we did, what would there be left?<\/p>\n<p class=\"pdf-para\">What is left when illusion ends? There is no need to investigate the unconscious past in you except as it manifests at this moment as a thought, an emotion, a desire, a reaction, or an external event that happens to you. Whatever you need to know about the unconscious past in you, the challenges of the present will bring it out. If you delve into the past, it will become a bottomless pit: There is always more. You may think that you need more time to understand the past or become free of it, in other words, that the future will eventually free you of the past. This is a delusion. Only the present can free you of the past. More time cannot free you of time. Access the power of Now. That is the key. What is the power of Now?<\/p>\n<p class=\"pdf-para\">None other than the power of your presence, your consciousness liberated from thought forms.<\/p>\n<p class=\"pdf-para\">So deal with the past on the level of the present. The more attention you give to the past, the more you energize it, and the more likely you are to make a “self” out of it. Dont misunderstand: Attention is essential, but not to the past as past. Give attention to the present; give attention to your behavior, to your reactions, moods, thoughts, emotions, fears,<\/p>", "images": [], "label": "Page 101"}, {"pdf_page_index": 101, "pdf_page_number": 102, "html": "<p class=\"pdf-para\">and desires as they occur in the present. There's the past in you. If you can be present enough to watch all those things, not critically or analytically but nonjudgmentally, then you are dealing with the past and dissolving it through the power of your presence. You cannot find yourself by going into the past. You find yourself by coming into the present.<\/p>\n<p class=\"pdf-para\">Isn't it helpful to understand the past and so understand why we do certain things, react in certain ways, or why we unconsciously create our particular kind of drama, patterns in relationships, and so on?<\/p>\n<p class=\"pdf-para\">As you become more conscious of your present reality, you may suddenly get certain insights as to why your conditioning functions in those particular ways; for example, why your relationships follow certain patterns, and you may remember things that happened in the past or see them more dearly. That is fine and can be helpful, but it is not essential. What is essential is your conscious presence. That dissolves the past. That is the transformative agent. So don't seek to understand the past, but be as present as you can. The past cannot survive in your presence. It can only survive in your absence.<\/p>", "images": [], "label": "Page 102"}, {"pdf_page_index": 102, "pdf_page_number": 103, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 103"}, {"pdf_page_index": 103, "pdf_page_number": 104, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 104"}, {"pdf_page_index": 104, "pdf_page_number": 105, "html": "<p class=\"pdf-para\">Chapter Five<\/p>", "images": [], "label": "Page 105"}, {"pdf_page_index": 105, "pdf_page_number": 106, "html": "<h3 class=\"pdf-heading\">Chapter Five<\/h3>\n<h3 class=\"pdf-heading\">The State of Presence<\/h3>\n", "images": [], "label": "The State of Presence"}, {"pdf_page_index": 106, "pdf_page_number": 107, "html": "<h4 class=\"pdf-subhead\">It'S Not What You Think It Is<\/h4>\n<p class=\"pdf-para\">You keep talking about the state of presence as the key. I think I understand it intellectually, but I don't know if I have ever truly experienced it. I wonder is it what I think it is, or is it something entirely different?<\/p>\n<p class=\"pdf-para\">Its not what you think it is! You can't think about presence, and the mind can't understand it. Understanding presence is being present.<\/p>\n<p class=\"pdf-para\">Try a little experiment. Close your eyes and say to yourself: “I wonder what my next thought is going to be.” Then become very alert and wait for the next thought. Be like a cat watching a mouse hole. What thought is going to come out of the mouse hole? Try it now.<\/p>\n<p class=\"pdf-para\">¤ Well? I had to wait for quite a long time before a thought came in. Exactly. As long as you are in a state of intense presence, you are free of thought. You are still, yet highly alert. The instant your conscious attention sinks below a certain level, thought rushes in. The mental noise returns; the stillness is lost. You are back in time.<\/p>\n<p class=\"pdf-para\">To test their degree of presence, some Zen masters have been known to creep up on their students from behind and suddenly hit them with a stick. Quite a shock! If the student had been fully present and in a state of alertness, if he had “kept his loin girded and his lamp burning,” which is one of the analogies that Jesus uses for presence, he would have noticed the master coming up from behind and stopped him or stepped aside. But if he were hit, that would mean he was immersed in thought, which is to say absent, unconscious.<\/p>\n<p class=\"pdf-para\">To stay present in everyday life, it helps to be deeply rooted within yourself otherwise, the mind, which has incredible momentum, will drag you along like a wild river.<\/p>\n<p class=\"pdf-para\">What do you mean by “rooted within yourself”? It means to inhabit your body fully. To always have some of your attention in the inner energy field of your body. To feel the body from<\/p>", "images": [], "label": "Page 107"}, {"pdf_page_index": 107, "pdf_page_number": 108, "html": "<p class=\"pdf-para\">within, so to speak. Body awareness keeps you present. It anchors you in the Now (see Chapter 6).<\/p>", "images": [], "label": "Page 108"}, {"pdf_page_index": 108, "pdf_page_number": 109, "html": "<h4 class=\"pdf-subhead\">The Esoteric Meaning Of “Waiting”<\/h4>\n<p class=\"pdf-para\">In a sense, the state of presence could be compared to waiting. Jesus used the analogy of waiting in some of his parables. This is not the usual bored or restless kind of waiting that is a denial of the present and that I spoke about already. It is not a waiting in which your attention is focused on some point in the future and the present is perceived as an undesirable obstacle that prevents you from having what you want. There is a qualitatively different kind of waiting, one that requires your total alertness. Something could happen at any moment, and if you are not absolutely awake, absolutely still, you will miss it. This is the kind of waiting Jesus talks about. In that state, all your attention is in the Now. There is none left for daydreaming, thinking, remembering, anticipating. There is no tension in it, no fear, just alert presence. You are present with your whole Being, with every cell of your body. In that state, the “you” that has a past and a future, the personality if you like, is hardly there anymore. And yet nothing of value is lost. You are still essentially yourself. In fact, you are more fully yourself than you ever were before, or rather it is only now that you are truly yourself.<\/p>\n<p class=\"pdf-para\">“Be like a servant waiting for the return of the master,” says Jesus. The servant does not know at what hour the master is going to come. So he stays awake, alert, poised, still, lest he miss the master's arrival. In another parable, Jesus speaks of the five careless (unconscious) women who do not have enough oil (consciousness) to keep their lamps burning (stay present) and so miss the bridegroom (the Now) and don't get to the wedding feast (enlightenment). These five stand in contrast to the five wise women who have enough oil (stay conscious).<\/p>\n<p class=\"pdf-para\">Even the men who wrote the Gospels did not understand the meaning of these parables, so the first misinterpretations and distortions crept in as they were written down. With subsequent erroneous interpretations, the real meaning was completely lost. These are parables not about the end of the world but about the end of psychological time. They point to the<\/p>", "images": [], "label": "Page 109"}, {"pdf_page_index": 109, "pdf_page_number": 110, "html": "<p class=\"pdf-para\">transcendence of the egoic mind and the possibility of living in an entirely new state of consciousness.<\/p>", "images": [], "label": "Page 110"}, {"pdf_page_index": 110, "pdf_page_number": 111, "html": "<h4 class=\"pdf-subhead\">Beauty Arises In The Stillness Of Your Presence<\/h4>\n<p class=\"pdf-para\">What you have just described is something that I occasionally experience for brief moments when I am alone and surrounded by nature.<\/p>\n<p class=\"pdf-para\">Yes. Zen masters use the word satori to describe a flash of insight, a moment of no-mind and total presence. Although satori is not a lasting transformation, be grateful when it comes, for it gives you a taste of enlightenment. You may, indeed, have experienced it many times without knowing what it is and realizing its importance. Presence is needed to become aware of the beauty, the majesty, the sacredness of nature. Have you ever gazed up into the infinity of space on a clear night, awestruck by the absolute stillness and inconceivable vastness of it? Have you listened, truly listened, to the sound of a mountain stream in the forest? Or to the song of a blackbird at dusk on a quiet summer evening?<\/p>\n<p class=\"pdf-para\">To become aware of such things, the mind needs to be still. You have to put down for a moment your personal baggage of problems, of past and future, as well as all your knowledge; otherwise, you will see but not see, hear but not hear. Your total presence is required.<\/p>\n<p class=\"pdf-para\">Beyond the beauty of the external forms, there is more here: something that cannot be named, something ineffable, some deep, inner, holy essence. Whenever and wherever there is beauty, this inner essence shines through somehow. It only reveals itself to you when you are present. Could it be that this nameless essence and your presence are one and the same? Would it be there without your presence? Go deeply into it. Find out for yourself.<\/p>\n<p class=\"pdf-para\">¤ When you experienced those moments of presence, you 101 likely didn't realize that you were briefly in a state of no- mind. This is because the gap between that state and the influx of thought was too narrow. Your satori may only have lasted for a few seconds before the mind came in, but it was there; otherwise, you would not have experienced the beauty. Mind can neither recognize nor create beauty. Only for a few seconds, while you<\/p>", "images": [], "label": "Page 111"}, {"pdf_page_index": 111, "pdf_page_number": 112, "html": "<p class=\"pdf-para\">were completely present, was that beauty or that sacredness there. Because of the narrowness of that gap and a lack of vigilance and alertness on your part, you were probably unable to see the fundamental difference between the perception, the thought-less awareness of beauty,<\/p>\n<p class=\"pdf-para\">and the naming and interpreting of it as thought: The time gap was so small that it seemed to be a single process. The truth is, however, that the moment thought came in, all you had was a memory of it.<\/p>\n<p class=\"pdf-para\">The wider the time gap between perception and thought, the more depth there is to you as a human being, which is to say the more conscious you are.<\/p>\n<p class=\"pdf-para\">Many people are so imprisoned in their minds that the beauty of nature does not really exist for them. They might say, “What a pretty flower,” but thats just a mechanical mental labeling. Because they are not still, not present, they don't truly see the flower, don't feel its essence, its holiness just as they don't know themselves, don't feel their own essence, their own holiness.<\/p>\n<p class=\"pdf-para\">Because we live in such a mind-dominated culture, most modem art, architecture, music, and literature are devoid of beauty, of inner essence, with very few exceptions. The reason is that the people who create those things cannot even for a moment free themselves from their mind. So they are never in touch with that place within where tree creativity and beauty arise. The mind left to itself creates monstrosities, and not only in art galleries. Look at our urban landscapes and industrial wastelands. No civilization has ever produced so much ugliness.<\/p>", "images": [], "label": "Page 112"}, {"pdf_page_index": 112, "pdf_page_number": 113, "html": "<h4 class=\"pdf-subhead\">Realizing Pure Consciousness<\/h4>\n<p class=\"pdf-para\">Is presence the same as Being? When you become conscious of Being, what is really happening is that Being becomes conscious of itself. When Being becomes conscious of itself thats presence. Since Being, consciousness, and life are synonymous, we could say that presence means consciousness becoming conscious of itself, or life attaining self-consciousness. But don't get attached to the words, and don't make an effort to understand this. There is nothing that you need to understand before you can become present.<\/p>\n<p class=\"pdf-para\">I do understand what you just said, but it seems to imply that Being, the ultimate transcendental reality, is not yet complete, that it is undergoing a process of development. Does God need time for personal growth?<\/p>\n<p class=\"pdf-para\">Yes, but only as seen from the limited perspective of the manifested universe. In the Bible, God declares: “I am the Alpha and the Omega, and I am the living One.” In the timeless realm where God dwells, which is also your home, the beginning and the end, the Alpha and the Omega, are one,<\/p>\n<p class=\"pdf-para\">and the essence of everything that ever has been and ever will be is eternally present in an unmanifested state of oneness and perfection totally beyond anything the human mind can ever imagine or comprehend. In our world of seemingly separate forms, however, timeless perfection is an inconceivable concept. Here even consciousness, which is the light emanating from the eternal Source, seems to be subject to a process of development, but this is due to our limited perception. It is not so in absolute terms. Nevertheless, let me continue to speak for a moment about the evolution of consciousness in this world. Everything that exists has Being, has God-essence, has some degree of consciousness. Even a stone has rudimentary consciousness; otherwise, it would not be, and its atoms and molecules would disperse. Everything is alive. The sun, the earth, plants, animals, humans all are expressions of consciousness in varying degrees, consciousness manifesting as form.<\/p>", "images": [], "label": "Page 113"}, {"pdf_page_index": 113, "pdf_page_number": 114, "html": "<p class=\"pdf-para\">The world arises when consciousness takes on shapes and forms, thought forms and material forms. Look at the millions of life forms on this planet alone. In the sea, on land,<\/p>\n<p class=\"pdf-para\">in the air and then each life form is replicated millions of times. To what end? Is someone or something playing a game, a game with form? This is what the ancient seers of India asked themselves. They saw the world as lila, a kind of divine game that God is playing. The individual life forms are obviously not very important in this game. In the sea, most life forms don't survive for more than a few minutes after being born. The human form turns to dust pretty quickly too, and when it is gone it is as if it had never been. Is that tragic or cruel? Only if you create a separate identity for each form, if you forget that its consciousness is God- essence expressing itself in form. But you don't truly know that until you realize your own God- essence as pure consciousness.<\/p>\n<p class=\"pdf-para\">If a fish is born in your aquarium and you call it John, write out a birth certificate, tell him about his family history, and two minutes later he gets eaten by another fish thats tragic. But ifs only tragic because you projected a separate self where there was none. You got hold of a fraction of a dynamic process, a molecular dance, and made a separate entity out of it.<\/p>\n<p class=\"pdf-para\">Consciousness takes on the disguise of forms until they reach such complexity that it completely loses itself in them. In present-day humans, consciousness is completely identified with its disguise. It only knows itself as form and therefore lives in fear of the annihilation of its physical or psychological form. This is the egoic mind, and this is where considerable dysfunction sets in. It now looks as if something had gone very wrong somewhere along the line of evolution. But even this is part of lila, the divine game. Finally, the pressure of suffering created by this apparent dysfunction forces consciousness to disidentify from form and awakens it from its dream of form: It regains self- consciousness, but it is at a far deeper level than when it lost it.<\/p>\n<p class=\"pdf-para\">This process is explained by Jesus in his parable of the lost son, who leaves his father's home, squanders his wealth, becomes destitute, and is then forced by his suffering to return home. When he does, his father loves him more than before. The son's state is the same as it was before, yet not the same. It has an added dimension of depth. The parable describes a journey from unconscious perfection, through apparent imperfection and “evil” to conscious perfection.<\/p>", "images": [], "label": "Page 114"}, {"pdf_page_index": 114, "pdf_page_number": 115, "html": "<p class=\"pdf-para\">Can you now see the deeper and wider significance of becoming present as the watcher of your mind? Whenever you watch the mind, you withdraw consciousness from mind forms, which then becomes what we call the watcher or the witness. Consequently, the watcher pure consciousness beyond form becomes stronger, and the mental formations become weaker. When we talk about watching the mind we are personalizing an event that is truly of cosmic significance: through you, consciousness is awakening out of its dream of identification with form and withdrawing from form. This foreshadows, but is already part of, an event that is probably still in the distant future as far as chronological time is concerned. The event is called the end of the world.<\/p>\n<p class=\"pdf-para\">¤ When consciousness frees itself from its identification with physical and mental forms, it becomes what we may call pure or enlightened consciousness, or presence. This has already happened in a few individuals, and it seems destined to happen soon on a much larger scale, although there is no absolute guarantee that it will happen. Most humans are still in the grip of the egoic mode of consciousness: identified with their mind and run by their mind. If they do not free themselves from their mind in time, they will be destroyed by it. They will experience increasing confusion, conflict, violence, illness, despair, madness. Egoic mind has become like a sinking ship. If you dont get off, you will go down with it. The collective egoic mind is the most dangerously insane and destructive entity ever to inhabit this planet. What do you think will happen on this planet if human consciousness remains unchanged?<\/p>\n<p class=\"pdf-para\">Already for most humans, the only respite they find from their own minds is to occasionally revert to a level of consciousness below thought. Everyone does that every night during sleep. But this also happens to some extent through sex, alcohol, and other drugs that suppress excessive mind activity. If it weren't for alcohol, tranquilizers, antidepressants, as well as the illegal drugs, which are all consumed in vast quantities, the insanity of the human mind would become even more glaringly obvious than it is already.<\/p>\n<p class=\"pdf-para\">I believe that, if deprived of their drugs, a large part of the population would become a danger to themselves and others. These drugs, of course, simply keep you stuck in dysfunction.<\/p>\n<p class=\"pdf-para\">Their widespread use only delays the breakdown of the old mind structures and the emergence of higher consciousness. While individual<\/p>", "images": [], "label": "Page 115"}, {"pdf_page_index": 115, "pdf_page_number": 116, "html": "<p class=\"pdf-para\">users may get some relief from the daily torture inflicted on them by their minds, they are prevented from generating enough conscious presence to rise above thought and so find true liberation.<\/p>\n<p class=\"pdf-para\">Falling back to a level of consciousness below mind, which is the pre- thinking level of our distant ancestors and of animals and plants, is not an option for us. There is no way back. If the human race is to survive, it will have to go on to the next stage. Consciousness is evolving throughout the universe in billions of forms. So even if we didn't make it, this wouldn't matter on a cosmic scale. No gain in consciousness is ever lost, so it would simply express itself through some other form. But the very fact that I am speaking here and you are listening or reading this is a clear sign that the new consciousness is gaining a foothold on the planet.<\/p>\n<p class=\"pdf-para\">There is nothing personal in this: I am not teaching you. You are consciousness, and you are listening to yourself. There is an Eastern saying: “The teacher and the taught together create the teaching.” In any case, the words in themselves are not important. They are not the Truth; they only point to it. I speak from presence, and as I speak, you may be able to join me in that state. Although every word that I use has a history, of course, and comes from the past, as all language does, the words that I speak to you now are carriers of the high-energy frequency of presence, quite apart from the meaning they convey as words.<\/p>\n<p class=\"pdf-para\">Silence is an even more potent carrier of presence, so when you read this or listen to me speak, be aware of the silence between and underneath the words. Be aware of the gaps. To listen to the silence, wherever you are, is an easy and direct way of becoming present. Even if there is noise, there is always some silence underneath and in between the sounds. Listening to the silence immediately creates stillness inside you. Only the stillness in you can perceive the silence outside. And what is stillness other than presence, consciousness freed from thought forms? Here is the living realization of what we have been talking about.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 116"}, {"pdf_page_index": 116, "pdf_page_number": 117, "html": "<h4 class=\"pdf-subhead\">Christ: The Reality Of Your Divine Presence<\/h4>\n<p class=\"pdf-para\">Don't get attached to any one word. You can substitute “Christ” for presence, if that is more meaningful to you. Christ is your God-essence or the Self, as it is sometimes called in the East. The only difference between Christ and presence is that Christ refers to your indwelling divinity regardless of whether you are conscious of it or not, whereas presence means your awakened divinity or God-essence.<\/p>\n<p class=\"pdf-para\">Many misunderstandings and false beliefs about Christ will clear if you realize that there is no past or future in Christ. To say that Christ was or will be is a contradiction in terms. Jesus was. He was a man who lived two thousand years ago and realized divine presence, his true nature. And so he said: “Before Abraham was, I am.” He did not say. “I already existed before Abraham was born.” That would have meant that he was still within the dimension of time and form identity. The words I am used in a sentence that starts in the past tense indicate a radical shift, a discontinuity in the temporal dimension. It is a Zen-like statement of great profundity. Jesus attempted to convey directly, not through discursive thought, the meaning of presence, of self- realization. He had gone beyond the consciousness dimension governed by time, into the realm of the timeless. The dimension of eternity had come into this world. Eternity, of course, does not mean endless time, but no time. Thus, the man Jesus became Christ, a vehicle for pure consciousness. And what is God's self-definition in the Bible? Did God say “I have always been, and I always will be?” Of course not. That would have given reality to past and future. God said: “ I AM THAT I AM .” No time here, just presence.<\/p>\n<p class=\"pdf-para\">The “second coming” of Christ is a transformation of human consciousness, a shift from time to presence, from thinking to pure consciousness, not the arrival of some man or woman. If “Christ” were to return tomorrow in some externalized form, what could he or she possibly<\/p>", "images": [], "label": "Page 117"}, {"pdf_page_index": 117, "pdf_page_number": 118, "html": "<p class=\"pdf-para\">say to you other than this: “I am the Truth. I am divine presence. I am eternal life. I am within you. I am here. I am Now.”<\/p>\n<p class=\"pdf-para\">¤ Never personalize Christ. Don't make Christ into a form identity. Avatars, divine mothers, enlightened masters, the very few that are real, are not special as persons. Without a false self to uphold, defend, and feed, they are more simple, more ordinary than the ordinary man or woman. Anyone with a strong ego would regard them as insignificant or, more likely, not see them at all.<\/p>\n<p class=\"pdf-para\">If you are drawn to an enlightened teacher, it is because there is already enough presence in you to recognize presence in another. There were many people who did not recognize Jesus or the Buddha, as there are and always have been many people who are drawn to false teachers. Egos are drawn to bigger egos. Darkness cannot recognize light. Only light can recognize light. So don't believe that the light is outside you or that it can only come through one particular form. If only your master is an incarnation of God, then who are you? Any kind of exclusivity is identification with form, and identification with form means ego, no matter how well disguised.<\/p>\n<p class=\"pdf-para\">Use the master's presence to reflect your own identity beyond name and form back to you and to become more intensely present yourself. You will soon realize that there is no “mine” or “yours” in presence. Presence is one.<\/p>\n<p class=\"pdf-para\">Group work can also be helpful for intensifying the light of your presence. A group of people coming together in a state of presence generates a collective energy field of great intensity. It not only raises the degree of presence of each member of the group but also helps to free the collective human consciousness from its current state of mind dominance. This will make the state of presence increasingly more accessible to individuals. However, unless at least one member of the group is already firmly established in it and thus can hold the energy frequency of that state, the egoic mind can easily reassert itself and sabotage the group's endeavors. Although group work is invaluable, it is not enough, and you must not come to depend on it. Nor must you come to depend on a teacher or a master, except during the transitional period, when you are learning the meaning and practice of presence.<\/p>", "images": [], "label": "Page 118"}, {"pdf_page_index": 118, "pdf_page_number": 119, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 119"}, {"pdf_page_index": 119, "pdf_page_number": 120, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 120"}, {"pdf_page_index": 120, "pdf_page_number": 121, "html": "<p class=\"pdf-para\">Chapter Six<\/p>", "images": [], "label": "Page 121"}, {"pdf_page_index": 121, "pdf_page_number": 122, "html": "<h3 class=\"pdf-heading\">Chapter Six<\/h3>\n<h3 class=\"pdf-heading\">The Inner Body<\/h3>\n", "images": [], "label": "The Inner Body"}, {"pdf_page_index": 122, "pdf_page_number": 123, "html": "<h4 class=\"pdf-subhead\">Being Is Your Deepest Self<\/h4>\n<p class=\"pdf-para\">You spoke earlier about the importance of having deep roots within or inhabiting the body. Can you explain what you meant by that?<\/p>\n<p class=\"pdf-para\">The body can become a point of access into the realm of Being. Lets go into that more deeply now.<\/p>\n<p class=\"pdf-para\">I am still not quite sure if I fully understand what you mean by Being. “Water? What do you mean by that? I don't understand it.” This is what a fish would say if it had a human mind.<\/p>\n<p class=\"pdf-para\">Please stop trying to understand Being. You have already had significant glimpses of Being, but the mind will always try to squeeze it into a little box and then put a label on it. It cannot be done. It cannot become an object of knowledge. In Being, subject and object merge into one.<\/p>\n<p class=\"pdf-para\">Being can be felt as the ever-present I am that is beyond name and form. To feel and thus to know that you are and to abide in that deeply rooted state is enlightenment, is the truth that Jesus says will make you free.<\/p>\n<p class=\"pdf-para\">Free from what? Free from the illusion that you are nothing more than your 111 physical body and your mind. This “illusion of the self,” as the Buddha calls it, is the core error. Free from fear in its countless disguises as the inevitable consequence of that illusion the fear that is your constant tormentor as long as you derive your sense of self only from this ephemeral and vulnerable form. And free from sin, which is the suffering you unconsciously inflict on yourself and others as long as this illusory sense of self governs what you think, say, and do.<\/p>", "images": [], "label": "Page 123"}, {"pdf_page_index": 123, "pdf_page_number": 124, "html": "<h4 class=\"pdf-subhead\">Look Beyond The Words<\/h4>\n<p class=\"pdf-para\">I don't like the word sin. It implies that I am being judged and found guilty.<\/p>\n<p class=\"pdf-para\">I can understand that. Over the centuries, many erroneous views and interpretations have accumulated around words such as sin, due to ignorance, misunderstanding, or a desire to control, but they contain an essential core of truth. If you are unable to look beyond such interpretations and so cannot recognize the reality to which the word points, then dont use it. Dont get stuck on the level of words. A word is no more than a means to an end. It's an abstraction. Not unlike a signpost, it points beyond itself. The word honey isnt honey. You can study and talk about honey for as long as you like, but you won't really know it until you taste it. After you have tasted it, the word becomes less important to you. You won't be attached to it anymore. Similarly, you can talk or think about God continuously for the rest of your life, but does that mean you know or have even glimpsed the reality to which the word points? It really is no more than an obsessive attachment to a signpost, a mental idol.<\/p>\n<p class=\"pdf-para\">The reverse also applies: If, for whatever reason, you 112 disliked the word honey, that might prevent you from ever tasting it. If you had a strong aversion to the word God, which is a negative form of attachment, you may be denying not just the word but also the reality to which it points. You would be cutting yourself off from the possibility of experiencing that reality. All this is, of course, intrinsically connected with being identified with your mind.<\/p>\n<p class=\"pdf-para\">So, if a word doesnt work for you anymore, then drop it and replace it with one that does work. If you dont like the word sin, then call it unconsciousness or insanity. That may get you closer to the truth, the reality behind the word, than a long-misused word like sin, and leaves little room for guilt.<\/p>\n<p class=\"pdf-para\">I don't like those words either. They imply that there is something wrong with me. I am being judged.<\/p>", "images": [], "label": "Page 124"}, {"pdf_page_index": 124, "pdf_page_number": 125, "html": "<p class=\"pdf-para\">Of course there is something wrong with you and you are not being judged.<\/p>\n<p class=\"pdf-para\">I don't mean to offend you personally, but do you not belong to the human race that has killed over mo million members of their own species in the twentieth century alone?<\/p>\n<p class=\"pdf-para\">You mean guilt by association? It is not a question of guilt. But as long as you are run by the egoic mind, you are part of the collective insanity. Perhaps you havent looked very deeply into the human condition in its state of dominance by the egoic mind. Open your eyes and see the fear, the despair, the greed, and the violence that are all-pervasive. See the heinous cruelty and suffering on an unimaginable scale that humans have inflicted and continue to inflict on each other as well as on other life forms on the planet. You don't need to condemn. Just observe. That is sin. That is insanity. That is unconsciousness. Above all, don't forget to observe your own mind. Seek out the root of the insanity there.<\/p>", "images": [], "label": "Page 125"}, {"pdf_page_index": 125, "pdf_page_number": 126, "html": "<h4 class=\"pdf-subhead\">Finding Your Invisible And Indestructible Reality<\/h4>\n<p class=\"pdf-para\">You said that identification with our physical form is part of the illusion, so how can the body, the physical form, bring you to a realization of Being?<\/p>\n<p class=\"pdf-para\">The body that you can see and touch cannot take you into Being. But that visible and tangible body is only an outer shell, or rather a limited and distorted perception of a deeper reality. In your natural state of connectedness with Being, this deeper reality can be felt every moment as the invisible inner body, the animating presence within you. So to “inhabit the body” is to feel the body from within, to feel the life inside the body and thereby come to know that you are beyond the outer form.<\/p>\n<p class=\"pdf-para\">But that is only the beginning of an inward journey that will take you ever more deeply into a realm of great stillness and peace, yet also of great power and vibrant life. At first, you may only get fleeting glimpses of it, but through them you will begin to realize that you are not just a meaningless fragment in an alien universe, briefly suspended between birth and death, allowed a few short-lived pleasures followed by pain and ultimate annihilation. Underneath your outer form, you are connected with something so vast, so immeasurable and sacred, that it cannot be conceived or spoken of yet I am speaking of it now. I am speaking of it not to give you something to believe in but to show you how you can know it for yourself.<\/p>\n<p class=\"pdf-para\">You are cut off from Being as long as your mind takes up all your attention. When this happens and it happens continuously for most people you are not in your body. The mind absorbs all your consciousness and transforms it into mind stuff. You cannot stop thinking. Compulsive thinking has become a collective disease. Your whole sense of who you are is then derived from mind activity. Your identity, as it is no longer rooted in Being, becomes a vulnerable and ever-needy mental construct, which creates fear as the predominant underlying emotion. The one thing that truly matters is then missing from your life: awareness of your deeper self your invisible and indestructible reality.<\/p>", "images": [], "label": "Page 126"}, {"pdf_page_index": 126, "pdf_page_number": 127, "html": "<p class=\"pdf-para\">To become conscious of Being, you need to reclaim consciousness from the mind. This is one of the most essential tasks on your spiritual journey. It will free vast amounts of consciousness that previously had been trapped in useless and compulsive thinking. A very effective way of doing this is simply to take the focus of your attention away from thinking and direct it into the body, where Being can be felt in the first instance as the invisible energy field that gives life to what you perceive as the physical body.<\/p>", "images": [], "label": "Page 127"}, {"pdf_page_index": 127, "pdf_page_number": 128, "html": "<h4 class=\"pdf-subhead\">Connecting With The Inner Body<\/h4>\n<p class=\"pdf-para\">Please try it now. You may find it helpful to close your eyes for this practice. Later on, when “being in the body” has become natural and easy, this will no longer be necessary. Direct your attention into the body. Feel it from within. Is it alive? Is there life in your hands, arms, legs, and feet in your abdomen, your chest? Can you feel the subtle energy field that pervades the entire body and gives vibrant life to every organ and every cell? Can you feel it simultaneously in all parts of the body as a single field of energy? Keep focusing on the feeling of your inner body for a few moments. Do not start to think about it. Feel it. The more attention you give it, the clearer and stronger this feeling will become. It will feel as if every cell is becoming more alive, and if you have a strong visual sense, you may get an image of your body becoming luminous. Although such an image can help you temporarily, pay more attention to the feeling than to any image that may arise. An image, no matter how beautiful or powerful, is already defined in form, so there is less scope for penetrating more deeply.<\/p>\n<p class=\"pdf-para\">¤ The feeling of your inner body is formless, limitless, and unfathomable. You can always go into it more deeply. If you cannot feel very much at this stage, pay attention to whatever you can feel. Perhaps there is just a slight tingling in your hands or feet. Thats good enough for the moment. Just focus on the feeling. Your body is coming alive. Later, we will practice some more. Please open your eyes now, but keep some attention in the inner energy field of the body even as you look around the room. The inner body lies at the threshold between your form identity and your essence identity, your true nature. Never lose touch with it.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 128"}, {"pdf_page_index": 128, "pdf_page_number": 129, "html": "<h4 class=\"pdf-subhead\">Transformation Through The Body<\/h4>\n<p class=\"pdf-para\">Why have most religions condemned or denied the body? It seems that spiritual seekers have always regarded the body as a hindrance or even as sinful. Why have so few seekers become finders? On the level of the body, humans are very dose to animals. All the basic bodily functions pleasure, pain, breathing, eating, drinking, defecating, sleeping, the drive to find a mate and procreate, and of course birth and death we share with the animals. A long time after their fall from a state of grace and oneness into illusion, humans suddenly woke up in what seemed to be an animal body and they found this very disturbing. “Don't fool yourself. You are no more than an animal.” This seemed to be the truth that was staring them in the face. But it was too disturbing a truth to tolerate. Adam and Eve saw that they were naked, and they became afraid. Unconscious denial of their animal nature set in very quickly. The threat that they might be taken over by powerful instinctual drives and revert back to complete unconsciousness was indeed a very real one. Shame and taboos appeared around certain parts of the body and bodily functions, especially sexuality. The light of their consciousness was not yet strong enough to make friends with their animal nature, to allow it to be and even enjoy that aspect of themselves let alone to go deeply into it to find the divine hidden within it, the reality within the illusion. So they did what they had to do. They began to disassociate from their body. They now saw themselves as having a body, rather than just being it.<\/p>\n<p class=\"pdf-para\">When religions arose, this disassociation became even more pronounced as the “you are not your body” belief. Countless people in East and West throughout the ages have tried to find God, salvation, or enlightenment through denial of the body. This took the form of denial of sense pleasures and of sexuality in particular, fasting, and other ascetic practices. They even inflicted pain on the body in an attempt to weaken or punish it because they regarded it as sinful. In Christianity, this used to be called mortification of<\/p>", "images": [], "label": "Page 129"}, {"pdf_page_index": 129, "pdf_page_number": 130, "html": "<p class=\"pdf-para\">the flesh. Others tried to escape from the body by entering trance states or seeking out-of-the-body experiences. Many still do. Even the Buddha is said to have practiced body denial through fasting and extreme forms of asceticism for six years, but he did not attain enlightenment until after he had given up this practice.<\/p>\n<p class=\"pdf-para\">The fact is that no one has ever become enlightened through denying or fighting the body or through an out-of- the-body experience. Although such an experience can be fascinating and can give you a glimpse of the state of liberation from the material form, in the end you will always have to return to the body, where the essential work of transformation takes place. Transformation is through the body, not away from it. This is why no true master has ever advocated fighting or leaving the body, although their mind- based followers often have.<\/p>\n<p class=\"pdf-para\">Of the ancient teachings concerning the body, only certain fragments survive, such as Jesus's statement that “your whole body will be filled with light,” or they survive as myths, such as the belief that Jesus never relinquished his body but remained one with it and ascended into “heaven” with it. Almost no one to this day has understood those fragments or the hidden meaning of certain myths, and the “you are not your body” belief has prevailed universally, leading to body denial and attempts to escape from the body. Countless seekers have thus been prevented from attaining spiritual realization for themselves and becoming finders.<\/p>\n<p class=\"pdf-para\">Is it possible to recover the lost teachings on the significance of the body or to reconstruct them from the existing fragments?<\/p>\n<p class=\"pdf-para\">There is no need for that. All spiritual teachings originate from the same Source. In that sense, there is and always has been only one master, who manifests in many different forms.<\/p>\n<p class=\"pdf-para\">I am that master, and so are you, once you are able to access the Source within. And the way to it is through the inner body. Although all spiritual teachings originate from the same Source, once they become verbalized and written down they are obviously no more than collections of words and a word is nothing but a signpost, as we talked about earlier. All such teachings are signposts pointing the way back to the Source.<\/p>\n<p class=\"pdf-para\">I have already spoken of the Truth that is hidden within your body, but I will summarize for you again the lost teachings of the masters so here is another signpost. Please endeavor to feel your inner body as you read or listen.<\/p>", "images": [], "label": "Page 130"}, {"pdf_page_index": 130, "pdf_page_number": 131, "html": "<h4 class=\"pdf-subhead\">Sermon On The Body<\/h4>\n<p class=\"pdf-para\">What you perceive as a dense physical structure called the body, which is subject to disease, old age, and death, is not ultimately real is not you. It is a misperception of your essential reality that is beyond birth and death, and is due to the limitations of your mind, which, having lost touch with Being, creates the body as evidence of its illusory belief in separation and to justify its state of fear. But do not turn away from the body, for within that symbol of impermanence, limitation, and death that you perceive as the illusory creation of your mind is concealed the splendor of your essential and immortal reality. Do not turn your attention elsewhere in your search for the Truth, for it is nowhere else to be found but within your body.<\/p>\n<p class=\"pdf-para\">Do not fight against the body, for in doing so you are fighting against your own reality. You are your body. The body that you can see and touch is only a thin illusory veil. Underneath it lies the invisible inner body, the doorway into Being, into Life Unmanifested. Through the inner body, you are inseparably connected to this unmanifested One Life birthless, deathless, eternally present. Through the inner body, you are forever one with God. ¤<\/p>", "images": [], "label": "Page 131"}, {"pdf_page_index": 131, "pdf_page_number": 132, "html": "<h4 class=\"pdf-subhead\">Have Deep Roots Within<\/h4>\n<p class=\"pdf-para\">The key is to be in a state of permanent connectedness with your inner body to feel it at all times. This will rapidly deepen and transform your life. The more consciousness you direct into the inner body, the higher its vibrational frequency becomes, much like a light that grows brighter as you turn up the dimmer switch and so increase the flow of electricity. At this higher energy level, negativity cannot affect you anymore, and you tend to attract new circumstances that reflect this higher frequency.<\/p>\n<p class=\"pdf-para\">If you keep your attention in the body as much as possible, you will be anchored in the Now. You won't lose yourself in the external world, and you wont lose yourself in your mind. Thoughts and emotions, fears and desires, may still be there to some extent, but they won't take you over.<\/p>\n<p class=\"pdf-para\">Please examine where your attention is at this moment. You are listening to me, or you are reading these words in a book. That is the focus of your attention. You are also peripherally aware of your surroundings, other people, and so on. Furthermore, there may be some mind activity around what you are hearing or reading, some mental commentary. Yet there is no need for any of this to absorb all your attention. See if you can be in touch with your inner body at the same time. Keep some of your attention within. Dont let it all flow out. Feel your whole body from within, as a single field of energy. It is almost as if you were listening or reading with your whole body. Let this be your practice in the days and weeks to come.<\/p>\n<p class=\"pdf-para\">Do not give all your attention away to the mind and the external world. By all means focus on what you are doing, but feel the inner body at the same time whenever possible. Stay rooted within. Then observe how this changes your state of consciousness and the quality of what you are doing.<\/p>\n<p class=\"pdf-para\">Whenever you are waiting, wherever it may be, use that time to feel the inner body. In this way, traffic jams and line- ups become very enjoyable. Instead of mentally projecting yourself away from the Now, go more deeply into the Now by going more deeply into the body.<\/p>", "images": [], "label": "Page 132"}, {"pdf_page_index": 132, "pdf_page_number": 133, "html": "<p class=\"pdf-para\">The art of inner-body awareness will develop into a completely new way of living, a state of permanent connectedness with Being, and will add a depth to your life that you have never known before.<\/p>\n<p class=\"pdf-para\">It is easy to stay present as the observer of your mind when you are deeply rooted within your body. No matter what happens on the outside, nothing can shake you anymore.<\/p>\n<p class=\"pdf-para\">Unless you stay present and inhabiting your body is always an essential aspect of it you will continue to be run by your mind. The script in your head that you learned a long time ago, the conditioning of your mind, will dictate your thinking and your behavior. You may be free of it for brief intervals, but rarely for long. This is especially true when something “goes wrong” or there is some loss or upset. Your conditioned reaction will then be involuntary, automatic, and predictable, fueled by the one basic emotion that underlies the mind-identified state of consciousness: fear.<\/p>\n<p class=\"pdf-para\">So when such challenges come, as they always do, make it a habit to go within at once and focus as much as you can on the inner energy field of your body. This need not take long, just a few seconds. But you need to do it the moment that the challenge presents itself. Any delay will allow a conditioned mental-emotional reaction to arise and take you over. When you focus within and feel the inner body, you immediately become still and present as you are withdrawing consciousness from the mind. If a response is required in that situation, it will come up from this deeper level. Just as the sun is infinitely brighter than a candle flame,<\/p>\n<p class=\"pdf-para\">there is infinitely more intelligence in Being than in your mind. As long as you are in conscious contact with your inner body, you are like a tree that is deeply rooted in the earth, or a building with a deep and solid foundation. The latter analogy is used by Jesus in the generally misunderstood parable of the two men who build a house. One man builds it on the sand, without a foundation, and when the storms and floods come, the house is swept away. The other man digs deep until he reaches the rock, then builds his house, which is not swept away by the floods.<\/p>", "images": [], "label": "Page 133"}, {"pdf_page_index": 133, "pdf_page_number": 134, "html": "<h4 class=\"pdf-subhead\">Before You Enter The Body, Forgive<\/h4>\n<p class=\"pdf-para\">I felt very uncomfortable when I tried to put my attention on the inner body. There was a feeling of agitation and some nausea. So I haven't been able to experience what you are talking about.<\/p>\n<p class=\"pdf-para\">What you felt was a lingering emotion that you were probably unaware of, until you started putting some attention into the body. Unless you first give it some attention, the emotion will prevent you from gaining access to the inner body, which lies at a deeper level underneath it. Attention does not mean that you start thinking about it. It means to just observe the emotion, to feel it fully, and so to acknowledge and accept it as it is. Some emotions are easily identified: anger, fear, grief, and so on. Others may be much harder to label. They may just be vague feelings of unease, heaviness, or constriction, halfway between an emotion and a physical sensation. In any case, what matters is not whether you can attach a mental label to it but whether you can bring the feeling of it into awareness as much as possible. Attention is the key to transformation and full attention also implies acceptance. Attention is like a beam of light the focused power of your consciousness that transmutes everything into itself.<\/p>\n<p class=\"pdf-para\">In a fully functional organism, an emotion has a very short life span. It is like a momentary ripple or wave on the surface of your Being. When you are not in your body, however, an emotion can survive inside you for days or weeks, or join with other emotions of a similar frequency that have merged and become the pain-body, a parasite that can live inside you for years, feed on your energy, lead to physical illness, and make your life miserable (see Chapter 2).<\/p>\n<p class=\"pdf-para\">So place your attention on feeling the emotion, and check whether your mind is holding on to a grievance pattern such as blame, self-pity, or resentment that is feeding the emotion. If that is the case, it means that you haven't forgiven. Nonforgiveness is often toward another person or yourself, but it may just as well be toward any situation or condition past,<\/p>", "images": [], "label": "Page 134"}, {"pdf_page_index": 134, "pdf_page_number": 135, "html": "<p class=\"pdf-para\">present or future that your mind refuses to accept. Yes, there can be nonforgiveness even with regard to the future. This is the mind's refusal to accept uncertainty, to accept that the future is ultimately beyond its control. Forgiveness is to relinquish your grievance and so to let go of grief. It happens naturally once you realize that your grievance serves no purpose except to strengthen a false sense of self. Forgiveness is to offer no resistance to life to allow life to live through you. The alternatives are pain and suffering, a greatly restricted flow of life energy, and in many cases physical disease.<\/p>\n<p class=\"pdf-para\">The moment you truly forgive, you have reclaimed your power from the mind. Nonforgiveness is the very nature of the mind, just as the mind-made false self, the ego, cannot survive without strife and conflict. The mind cannot forgive. Only you can. You become present, you enter your body, you feel the vibrant peace and stillness that emanate from Being. That is why Jesus said: “Before you enter the temple, forgive.” ¤<\/p>", "images": [], "label": "Page 135"}, {"pdf_page_index": 135, "pdf_page_number": 136, "html": "<h4 class=\"pdf-subhead\">Your Link With The Unmanifested<\/h4>\n<p class=\"pdf-para\">What is the relationship between presence and the inner body? Presence is pure consciousness consciousness that has been reclaimed from the mind, from the world of form. The inner body is your link with the Unmanifested, and in its deepest aspect is the Unmanifested: the Source from which consciousness emanates as light emanates from the sun. Awareness of the inner body is consciousness remembering its origin and returning to the Source.<\/p>\n<p class=\"pdf-para\">Is the Unmanifested the same as Being? Yes. The word Unmanifested attempts, by way of negation, to express That which cannot be spoken, thought or imagined.<\/p>\n<p class=\"pdf-para\">It points to what it is by saying what it is not. Being, on the other hand, is a positive term. Please don't get attached to either of these words or start believing in them. They are no more than signposts.<\/p>\n<p class=\"pdf-para\">You said that presence is consciousness that has been reclaimed from the mind. Who does the reclaiming?<\/p>\n<p class=\"pdf-para\">You do. But since in your essence you are consciousness, we might as well say that it is an awakening of consciousness from the dream of form. This does not mean that your own form will instantly vanish in an explosion of light. You can continue in your present form yet be aware of the formless and deathless deep within you.<\/p>\n<p class=\"pdf-para\">I must admit that this is way beyond my comprehension, and yet on some deeper level I seem to know what you are talking about. It's more like a feeling than anything else. Am I deceiving myself?<\/p>\n<p class=\"pdf-para\">No, you are not. Feeling will get you closer to the truth of who you are than thinking. I cannot tell you anything that deep within you don't already know. When you have reached a certain stage of inner connectedness, you recognize the truth when you hear it. If you haven't reached that stage yet, the practice of body awareness will bring about the deepening that is necessary.<\/p>", "images": [], "label": "Page 136"}, {"pdf_page_index": 136, "pdf_page_number": 137, "html": "<h4 class=\"pdf-subhead\">Slowing Down The Aging Process<\/h4>\n<p class=\"pdf-para\">
