ly by surrender. If you can never accept what is, by implication you will not be able to accept anybody the way they are. You will judge, criticize, label, reject, or attempt to change people.<\/p>\n<p class=\"pdf-para\">Furthermore, if you continuously make the Now into a means to an end in the future, you will also make every person you encounter or relate with into a means to an end. The relationship the human being is then of secondary importance to you, or of no importance at all. What you can get out of the relationship is primary be it material gain, a sense of power, physical pleasure, or some form of ego gratification.<\/p>\n<p class=\"pdf-para\">Let me illustrate how surrender can work in relationships. When you become involved in an argument or some conflict situation, perhaps with a partner or someone close to you, start by observing how defensive you become as your own position is attacked, or feel the force of your own aggression as you attack the other person's position. Observe the attachment to your views and opinions. Feel the mental-emotional energy behind your need to be right and make the other person wrong. Thats the energy of the egoic mind. You make it conscious by acknowledging it, by feeling it as fully as possible. Then one day, in the middle of an argument, you will suddenly realize that you have a choice, and you may decide to drop your own reaction just to see what happens. You surrender. I don't mean dropping the reaction just verbally by saying “Okay, you are right,” with a look on your face that says, “I am above all this childish unconsciousness.” Thats just displacing the resistance to another level, with the egoic mind still in charge, claiming superiority. I am speaking of letting go of the entire mental-emotional energy field inside you that was fighting for power. The ego is cunning, so you have to be very alert, very present, and totally honest with yourself to see whether you have truly relinquished your identification with a mental position and so freed yourself from your mind. If you suddenly feel very light, clear and deeply at peace, that is an unmistakable sign that you have truly surrendered. Then observe what happens to the other person's mental position as you no longer energize it through resistance. When identification with mental positions is out of the way, true communication begins.<\/p>\n<p class=\"pdf-para\">What about nonresistance in the face of violence, aggression, and the like?<\/p>", "images": [], "label": "Page 228"}, {"pdf_page_index": 228, "pdf_page_number": 229, "html": "<p class=\"pdf-para\">Nonresistance doesn't necessarily mean doing nothing. All it means is that any “doing” becomes nonreactive. Remember the deep wisdom underlying the practice of Eastern martial arts: don't resist the opponents force. Yield to overcome.<\/p>\n<p class=\"pdf-para\">Having said that, “doing nothing” when you are in a state of intense presence is a very powerful transformer and healer of situations and people. In Taoism, there is a term called wu wei, which is usually translated as “actionless activity” or “sitting quietly doing nothing.” In ancient China, this was regarded as one of the highest achievements or virtues. It is radically different from inactivity in the ordinary state of consciousness, or rather unconsciousness, which stems from fear, inertia, or indecision. The real “doing nothing” implies inner nonresistance and intense alertness.<\/p>\n<p class=\"pdf-para\">On the other hand, if action is required, you will no longer react from your conditioned mind, but you will respond to the situation out of your conscious presence. In that state, your mind is free of concepts, including the concept of nonviolence. So who can predict what you will do? The ego believes that in your resistance lies your strength, whereas in truth resistance cuts you off from Being, the only place of true power. Resistance is weakness and fear masquerading as strength. What the ego sees as weakness is your Being in its purity, innocence, and power. What it sees as strength is weakness. So the ego exists in a continuous resistance-mode and plays counterfeit roles to cover up your “weakness,” which in truth is your power. Until there is surrender, unconscious role-playing constitutes a large part of human interaction. In surrender, you no longer need ego defenses and false masks. You become very simple, very real. “Thats dangerous,” says the ego. “You'll get hurt. You'll become vulnerable.” What the ego doesn't know, of course, is that only through the letting go of resistance, through becoming “vulnerable,” can you discover your true and essential invulnerability.<\/p>", "images": [], "label": "Page 229"}, {"pdf_page_index": 229, "pdf_page_number": 230, "html": "<h4 class=\"pdf-subhead\">Transforming Illness Into Enlightenment<\/h4>\n<p class=\"pdf-para\">If someone is seriously ill and completely accepts their condition and surrenders to the illness, would they not have given up their will to get back to health? The determination to fight the illness would not be there any more, would it?<\/p>\n<p class=\"pdf-para\">Surrender is inner acceptance of what is without any reservations. We are talking about your life this instant not the conditions or circumstances of your life, not what I call your life situation. We have spoken about this already.<\/p>\n<p class=\"pdf-para\">With regard to illness, this is what it means. Illness is part of your life situation. As such, it has a past and a future. Past and future form an uninterrupted continuum, unless the redeeming power of the Now is activated through your conscious presence. As you know, underneath the various conditions that make up your life situation, which exists in time, there is something deeper, more essential: your Life, your very Being in the timeless Now.<\/p>\n<p class=\"pdf-para\">As there are no problems in the Now, there is no illness either. The belief in a label that someone attaches to your condition keeps the condition in place, empowers it, and makes a seemingly solid reality out of a temporary imbalance. It gives it not only reality and solidity but also a continuity in time that it did not have before. By focusing on this instant and refraining from labeling it mentally, illness is reduced to one or several of these factors: physical pain, weakness, discomfort, or disability. That is what you surrender to now. You do not surrender to the idea of “illness.” Allow the suffering to force you into the present moment, into a state of intense conscious presence. Use it for enlightenment.<\/p>\n<p class=\"pdf-para\">Surrender does not transform what is, at least not directly. Surrender transforms you. When you are transformed, your whole world is transformed, because the world is only a reflection. We spoke about this earlier.<\/p>", "images": [], "label": "Page 230"}, {"pdf_page_index": 230, "pdf_page_number": 231, "html": "<p class=\"pdf-para\">If you looked in the mirror and did not like what you saw, you would have to be mad to attack the image in the mirror. That is precisely what you do when you are in a state of nonacceptance. And, of course, if you attack the image, it attacks you back. If you accept the image, no matter what it is, if you become friendly toward it, it cannot not become friendly toward you. This is how you change the world.<\/p>\n<p class=\"pdf-para\">Illness is not the problem. You are the problem as long as the egoic mind is in control. When you are ill or disabled, do not feel that you have failed in some way, do not feel guilty. Do not blame life for treating you unfairly, but do not blame yourself either. All that is resistance. If you have a major illness, use it for enlightenment. Anything “bad” that happens in your life use it for enlightenment. Withdraw time from the illness. Do not give it any past or future. Let it force you into intense present-moment awareness and see what happens. Become an alchemist. Transmute base metal into gold,<\/p>\n<p class=\"pdf-para\">suffering into consciousness, disaster into enlightenment. Are you seriously ill and feeling angry now about what I have just said? Then that is a clear sign that the illness has become part of your sense of self and that you are now protecting your identity as well as protecting the illness. The condition that is labeled “illness” has nothing to do with who you truly are.<\/p>", "images": [], "label": "Page 231"}, {"pdf_page_index": 231, "pdf_page_number": 232, "html": "<h4 class=\"pdf-subhead\">When Disaster Strikes<\/h4>\n<p class=\"pdf-para\">As far as the still unconscious majority of the population is concerned, only a critical limit-situation has the potential to crack the hard shell of the ego and force them into surrender and so into the awakened state. A limit- situation arises when through some disaster, drastic upheaval, deep loss, or suffering your whole world is shattered and doesn't make sense anymore. It is an encounter with death, be it physical or psychological. The egoic mind, the creator of this world, collapses. Out of the ashes of the old world, a new world can then come into being.<\/p>\n<p class=\"pdf-para\">There is no guarantee, of course, that even a limit- situation will do it, but the potential is always there. Some people's resistance to what is even intensifies in such a situation, and so it becomes a descent into hell. In others, there may only be partial surrender, but even that will give them a certain depth and serenity that were not there before. Parts of the ego shell break off, and this allows small amounts of the radiance and peace that lie beyond the mind to shine through.<\/p>\n<p class=\"pdf-para\">Limit-situations have produced many miracles. There have been murderers in death row waiting for execution who, in the last few hours of their lives, experienced the egoless state and the deep joy and peace that come with it. The inner resistance to the situation they found themselves in became so intense as to produce unbearable suffering, and there was nowhere to run and nothing to do to escape it, not even a mind-projected future. So they were forced into complete acceptance of the unacceptable. They were forced into surrender. In this way, they were able to enter the state of grace with which comes redemption: complete release from the past. Of course, it is not really the limit-situation that makes room for the miracle of grace and redemption but the act of surrender.<\/p>\n<p class=\"pdf-para\">So whenever any kind of disaster strikes, or something goes seriously “wrong” illness, disability, loss of home or fortune or of a socially defined identity, break-up or a close relationship, death or suffering of a loved one, or your own impending death know that there is another side to it, that you<\/p>", "images": [], "label": "Page 232"}, {"pdf_page_index": 232, "pdf_page_number": 233, "html": "<p class=\"pdf-para\">are just one step away from something incredible: a complete alchemical transmutation of the base metal of pain and suffering into gold. That one step is called surrender.<\/p>\n<p class=\"pdf-para\">I do not mean to say that you will become happy in such a situation. You will not. But fear and pain will become transmuted into an inner peace and serenity that come from a very deep place from the Unmanifested itself. It is “the peace of God, which passes all understanding.” Compared to that, happiness is quite a shallow thing. With this radiant peace comes the realization not on the level of mind but within the depth of your Being that you are indestructible, immortal. This is not a belief. It is absolute certainty that needs no external evidence or proof from some secondary source.<\/p>", "images": [], "label": "Page 233"}, {"pdf_page_index": 233, "pdf_page_number": 234, "html": "<h4 class=\"pdf-subhead\">Transforming Suffering Into Peace<\/h4>\n<p class=\"pdf-para\">I read about a stoic philosopher in ancient Greece who, when he was told that his son had died in an accident, replied, “I knew he was not immortal.” Is that surrender? If it is, I don't want it. There are some situations in which surrender seems unnatural and inhuman.<\/p>\n<p class=\"pdf-para\">Being cut off from your feelings is not surrender. But we don't know what his inner state was when he said those words. In certain extreme situations, it may still be impossible for you to accept the Now. But you always get a second chance at surrender.<\/p>\n<p class=\"pdf-para\">Your first chance is to surrender each moment to the reality of that moment. Knowing that what is cannot be undone because it already is you say yes to what is or accept what isn't. Then you do what you have to do, whatever the situation requires. If you abide in this state of acceptance, you create no more negativity, no more suffering,<\/p>\n<p class=\"pdf-para\">no more unhappiness. You then live in a state of nonresistance, a state of grace and lightness, free of struggle.<\/p>\n<p class=\"pdf-para\">Whenever you are unable to do that, whenever you miss that chance either because you are not generating enough conscious presence to prevent some habitual and unconscious resistance pattern from arising, or because the condition is so extreme as to be absolutely unacceptable to you then you are creating some form of pain, some form of suffering. It may look as if the situation is creating the suffering, but ultimately this is not so your resistance is.<\/p>\n<p class=\"pdf-para\">Now here is your second chance at surrender: If you cannot accept what is outside, then accept what is inside. If you cannot accept the external condition, accept the internal condition. This means: Do not resist the pain. Allow it to be there. Surrender to the grief, despair, fear, loneliness, or whatever form the suffering takes. Witness it without labeling it mentally. Embrace it. Then see how the miracle of surrender transmutes deep suffering into deep peace. This is your crucifixion. Let it become your<\/p>", "images": [], "label": "Page 234"}, {"pdf_page_index": 234, "pdf_page_number": 235, "html": "<p class=\"pdf-para\">resurrection and ascension. I do not see how one can surrender to suffering. As you yourself pointed out, suffering is non-surrender. How could you surrender to non-surrender?<\/p>\n<p class=\"pdf-para\">Forget about surrender for a moment. When your pain is deep, all talk of surrender will probably seem futile and meaningless anyway.<\/p>\n<p class=\"pdf-para\">When your pain is deep, you will likely have a strong urge to escape from it rather than surrender to it. You don't want to feel what you feel. What could be more normal? But there is no escape, no way out. There are many pseudo escapes work, drink, drugs, anger, projection, suppression,<\/p>\n<p class=\"pdf-para\">and so on but they don't free you from the pain. Suffering does not diminish in intensity when you make it unconscious. When you deny emotional pain, everything you do or think as well as your relationships become contaminated with it. You broadcast it, so to speak, as the energy you emanate, and others will pick it up subliminally. If they are unconscious, they may even feel compelled to attack or hurt you in some way, or you may hurt them in an unconscious projection of your pain. You attract and manifest whatever corresponds to your inner state. When there is no way out, there is still always a way through. So don't turn away from the pain. Face it. Feel it fully. Feel it don't think about it! Express it if necessary, but don't create a script in your mind around it. Give all your attention to the feeling, not to the person, event, or situation that seems to have caused it. Don't let the mind use the pain to create a victim identity for yourself out of it. Feeling sorry for yourself and telling others your story will keep you stuck in suffering. Since it is impossible to get away from the feeling, the only possibility of change is to move into it; otherwise, nothing will shift. So give your complete attention to what you feel, and refrain from mentally labeling it. As you go into the feeling, be intensely alert. At first, it may seem like a dark and terrifying place, and when the urge to turn away from it comes, observe it but don't act on it. Keep putting your attention on the pain, keep feeling the grief, the fear, the dread, the loneliness, whatever it is. Stay alert, stay present present with your whole Being, with every cell of your body. As you do so, you are bringing a light into this darkness. This is the flame of your consciousness.<\/p>\n<p class=\"pdf-para\">At this stage, you don't need to be concerned with surrender anymore. It has happened already. How? Full attention is full acceptance, is surrender. By giving full attention, you use the power of the Now, which is the power<\/p>", "images": [], "label": "Page 235"}, {"pdf_page_index": 235, "pdf_page_number": 236, "html": "<p class=\"pdf-para\">of your presence. No hidden pocket of resistance can survive in it. Presence removes time. Without time, no suffering, no negativity, can survive.<\/p>\n<p class=\"pdf-para\">The acceptance of suffering is a journey into death. Facing deep pain, allowing it to be, taking your attention into it, is to enter death consciously. When you have died this death, you realize that there is no death and there is nothing to fear. Only the ego dies. Imagine a ray of sunlight that has forgotten it is an inseparable part of the sun and deludes itself into believing it has to fight for survival and create and cling to an identity other than the sun. Would the death of this delusion not be incredibly liberating?<\/p>\n<p class=\"pdf-para\">Do you want an easy death? Would you rather die without pain, without agony? Then die to the past every moment, and let the light of your presence shine away the heavy, time-bound self you thought of as “you.”<\/p>", "images": [], "label": "Page 236"}, {"pdf_page_index": 236, "pdf_page_number": 237, "html": "<h4 class=\"pdf-subhead\">The Way Of The Cross<\/h4>\n<p class=\"pdf-para\">¤ ¤ There are many accounts of people who say they have found God through their deep suffering, and there is the Christian expression “the way of the cross, ” which I suppose points to the same thing.<\/p>\n<p class=\"pdf-para\">We are concerned with nothing else here. Strictly speaking, they did not find God through their suffering, because suffering implies resistance. They found God through surrender, through total acceptance of what is, into which they were forced by their intense suffering. They must have realized on some level that their pain was self- created. How do you equate surrender with finding God? Since resistance is inseparable from the mind, relinquishment of resistance surrender is the end of the mind as your master, the impostor pretending to be “you,” the false god. All judgment and all negativity dissolve. The realm of Being, which had been obscured by the mind, then opens up. Suddenly, a great stillness arises within you, an unfathomable sense of peace. And within that peace, there is great joy. And within that joy, there is love. And at the innermost core, there is the sacred, the immeasurable, That which cannot be named.<\/p>\n<p class=\"pdf-para\">I don't call it finding God, because how can you find that which was never lost, the very life that you are? The word God is limiting not only because of thousands of years of misperception and misuse, but also because it implies an entity other than you. God is Being itself, not a being. There can be no subject-object relationship here, no duality, no you and God. God-realization is the most natural thing there is. The amazing and incomprehensible fact is not that you can become conscious of God but that you are not conscious of God.<\/p>\n<p class=\"pdf-para\">The way of the cross that you mentioned is the old way to enlightenment, and until recently it was the only way. But don't dismiss it or underestimate its efficacy. It still works.<\/p>\n<p class=\"pdf-para\">The way of the cross is a complete reversal. It means that the worst thing in your life, your cross, turns into the best thing that ever happened to<\/p>", "images": [], "label": "Page 237"}, {"pdf_page_index": 237, "pdf_page_number": 238, "html": "<p class=\"pdf-para\">you, by forcing you into surrender, into “death,” forcing you to become as nothing, to become as God because God, too, is no-thing.<\/p>\n<p class=\"pdf-para\">At this time, as far as the unconscious majority of humans is concerned, the way of the cross is still the only way. They will only awaken through further suffering, and enlightenment as a collective phenomenon will be predictably preceded by vast upheavals. This process reflects the workings of certain universal laws that govern the growth of consciousness and thus was foreseen by some seers. It is described, among other places, in the Book of Revelation or Apocalypse, though cloaked in obscure and sometimes impenetrable symbology. This suffering is inflicted not by God but by humans on themselves and on each other as well as by certain defensive measures that the Earth, which is a living, intelligent organism, is going to take to protect herself from the onslaught of human madness.<\/p>\n<p class=\"pdf-para\">However, there is a growing number of humans alive today whose consciousness is sufficiently evolved not to need any more suffering before the realization of enlightenment. You may be one of them.<\/p>\n<p class=\"pdf-para\">Enlightenment through suffering the way of the cross means to be forced into the kingdom of heaven kicking and screaming. You finally surrender because you can't stand the pain anymore, but the pain could go on for a long time until this happens. Enlightenment consciously chosen means to relinquish your attachment to past and future and to make the Now the main focus of your life. It means choosing to dwell in the state of presence rather than in time. It means saying yes to what is. You then don't need pain anymore. How much more time do you think you will need before you are able to say “I will create no more pain, no more suffering?” How much more pain do you need before you can make that choice?<\/p>\n<p class=\"pdf-para\">If you think that you need more time, you will get more time and more pain. Time and pain are inseparable.<\/p>", "images": [], "label": "Page 238"}, {"pdf_page_index": 238, "pdf_page_number": 239, "html": "<h4 class=\"pdf-subhead\">The Power To Choose<\/h4>\n<p class=\"pdf-para\">What about all those people who, it seems, actually want to suffer? I have a friend whose partner is physically abusive toward her, and her previous relationship was of a similar kind. Why does she choose such men, and why is she refusing to get out of that situation now? Why do so many people actually choose pain?<\/p>\n<p class=\"pdf-para\">I know that the word choose is a favorite New Age term, but it isn't entirely accurate in this context. It is misleading to say that somebody “chose” a dysfunctional relationship or any other negative situation in his or her life. Choice implies consciousness a high degree of consciousness. Without it, you have no choice. Choice begins the moment you disidentify from the mind and its conditioned patterns, the moment you become present. Until you reach that point, you are unconscious, spiritually speaking. This means that you are compelled to think, feel, and act in certain ways according to the conditioning of your mind. That is why Jesus said: “Forgive them, for they know not what they do.” This is not related to intelligence in the conventional sense of the word. I have met many' highly intelligent and educated people who were also completely unconscious, which is to say completely identified with their mind. In fact, if mental development and increased knowledge are not counterbalanced by a corresponding growth in consciousness,<\/p>\n<p class=\"pdf-para\">the potential for unhappiness and disaster is very great. Your friend is stuck in a relationship with an abusive partner, and not for the first time. Why? No choice. The mind, conditioned as it is by the past, always seeks to re-<\/p>\n<p class=\"pdf-para\">create what it knows and is familiar with. Even if it is painful, at least it is familiar. The mind always adheres to the known. The unknown is dangerous because it has no control over it. Thats why the mind dislikes and ignores the present moment. Present-moment awareness creates a gap not only in the stream of mind but also in the past-future continuum.<\/p>", "images": [], "label": "Page 239"}, {"pdf_page_index": 239, "pdf_page_number": 240, "html": "<p class=\"pdf-para\">Nothing truly new and creative can come into this world except through that gap, that clear space of infinite possibility.<\/p>\n<p class=\"pdf-para\">So your friend, being identified with her mind, may be re-creating a pattern learned in the past in which intimacy and abuse are inseparably linked. Alternatively, she may be acting out a mind pattern learned in early childhood according to which she is unworthy and deserves to be punished. It is possible, too, that she lives a large part of her life through the pain- body, which always seeks more pain on which to feed. Her partner has his own unconscious patterns, which complement hers. Of course her situation is self- created, but who or what is the self that is doing the creating? A mental-emotional pattern from the past, no more. Why make a self out of it? If you tell her that she has chosen her condition or situation, you are reinforcing her state of mind identification. But is her mind pattern who she is? Is it her self? Is her true identity derived from the past? Show your friend how to be the observing presence behind her thoughts and her emotions. Tell her about the pain-body and how to free herself from it. Teach her the art of inner-body awareness. Demonstrate to her the meaning of presence. As soon as she is able to access the power of the Now, and thereby break through her conditioned past, she will have a choice.<\/p>\n<p class=\"pdf-para\">Nobody chooses dysfunction, conflict, pain. Nobody chooses insanity. They happen because there is not enough presence in you to dissolve the past, not enough light to dispel the darkness. You are not fully here. You have not quite woken up yet. In the meantime, the conditioned mind is running your life.<\/p>\n<p class=\"pdf-para\">Similarly, if you are one of the many people who have an issue with their parents, if you still harbor resentment about something they did or did not do, then you still believe that they had a choice that they could have acted differently. It always looks as if people had a choice, but that is an illusion. As long as your mind with its conditioned patterns runs your life, as long as you are your mind, what choice do you have? None. You are not even there. The mind-identified state is severely dysfunctional. It is a form of insanity. Almost everyone is suffering from this illness in varying degrees. The moment you realize this, there can be no more resentment. How can you resent someone's illness? The only appropriate response is compassion.<\/p>\n<p class=\"pdf-para\">So that means nobody is responsible for what they do? I don't like that idea.<\/p>", "images": [], "label": "Page 240"}, {"pdf_page_index": 240, "pdf_page_number": 241, "html": "<p class=\"pdf-para\">If you are run by your mind, although you have no choice you will still suffer the consequences of your unconsciousness, and you will create further suffering. You will bear the burden of fear, conflict, problems, and pain. The suffering thus created will eventually force you out of your unconscious state.<\/p>\n<p class=\"pdf-para\">What you say about choice also applies to forgiveness, I suppose. You need to be fully conscious and surrender before you can forgive.<\/p>\n<p class=\"pdf-para\">“Forgiveness” is a term that has been in use for 2,000 years, but most people have a very limited view of what it means. You cannot truly forgive yourself or others as long as you derive your sense of self from the past. Only through accessing the power of the Now, which is your own power, can there be true forgiveness. This renders the past powerless,<\/p>\n<p class=\"pdf-para\">and you realize deeply that nothing you ever did or that was ever done to you could touch even in the slightest the radiant essence of who you are. The whole concept of forgiveness then becomes unnecessary.<\/p>\n<p class=\"pdf-para\">And how do I get to that point of realization? When you surrender to what is and so become fully present, the past ceases to have any power. You do not need it anymore. Presence is the key. The Now is the key.<\/p>\n<p class=\"pdf-para\">How will I know when I have surrendered? When you no longer need to ask the question.<\/p>", "images": [], "label": "Page 241"}, {"pdf_page_index": 241, "pdf_page_number": 242, "html": "<p class=\"pdf-para\">END<\/p>", "images": [], "label": "Page 242"}]</script>

<script id="notes-data" type="application/json">{"Foreword": {"s": "Russell E. DiCarlo introduces Tolle as a teacher who points beyond words to a direct experience of Being. He frames the book as a living transmission: read slowly, and let the gaps between the words do the work.", "p": ["The book is a pointer, not a doctrine — the truth it names is beyond words", "Enlightenment is not a future attainment but a recognition of what is already here", "Read with a feeling-awareness; pause when something resonates"]}, "Introduction": {"s": "Tolle tells his own story: years of anxiety and suicidal depression culminating in a night of inner dissolution — 'I cannot live with myself any longer' — that revealed the distinction between the false mind-made self and the deeper 'I'. He explains the book's question-and-answer origin and its purpose: to awaken readers to presence.", "p": ["His crisis at 29 dissolved the unhappy self and left a deep peace", "The 'I' and the 'self I cannot live with' exposed the split between Being and the egoic mind", "The book arose from questions asked by students, clients, and friends", "Markers like ¤ invite pauses to absorb rather than merely read"]}, "You Are Not Your Mind": {"s": "The first chapter names the core problem: identification with thinking. The voice in the head pretends to be you, but you are the awareness behind it. Enlightenment is simply the state of felt oneness with Being — found by watching the thinker, creating gaps of no-mind, and feeling the inner energy field of the body.", "p": ["'You are not your mind' — the observer of thought is who you really are", "Enlightenment is your natural state of felt oneness with Being, not a superhuman feat", "Watching the thinker and listening to the voice in the head begins disidentification", "Gaps in thinking — even seconds of no-mind — are tastes of presence and peace"]}, "Consciousness: The Way Out of Pain": {"s": "Tolle explains emotional pain as the pain-body: an accumulated residue of past suffering that lives in you and periodically feeds on negativity. The way out is not analysis but presence — watching the pain-body without judgment or identification, which cuts its food supply and transmutes it into consciousness.", "p": ["The pain-body is a semi-autonomous energy form of old emotional pain", "It awakens when triggered and seeks more pain to feed on", "Witnessing it without identifying breaks the link and begins transmutation", "Fear, guilt, anxiety and depression are ego-patterns sustained by unconsciousness"]}, "Moving Deeply Into the Now": {"s": "This chapter dismantles the illusion of psychological time. The past and future have no reality of their own; only the Now exists. Problems are mind-made projections into time, so 'there are no problems in the Now' — only situations to be dealt with or accepted. Presence dissolves the burden of time.", "p": ["Nothing ever happened in the past or will happen in the future — it happens Now", "Psychological time (endless past/future thinking) is the disease; clock time is a tool", "Life's situations are handled in the Now; 'problems' are mind-stories about time", "The quality of your consciousness now determines the future"]}, "Mind Strategies for Avoiding the Now": {"s": "The mind resists the Now through ordinary unconsciousness (background unease) and deep unconsciousness (acute suffering). Waiting, complaining, blaming and impatience are all escape strategies. Tolle urges self-observation: catch the resistance, feel the negativity, and let presence burn it up.", "p": ["Ordinary unconsciousness is the chronic low-level unease most people call normal", "Waiting — for success, salvation, the future — is a core denial of the Now", "Negativity is never the right response; it signals resistance to what is", "Ask 'what is my relationship with the present moment?' to expose the mind's games"]}, "The State of Presence": {"s": "Presence is described in positive terms: deep alertness, stillness, and the felt sense of Being. Tolle compares it to waiting at the door of the senses, and to the alertness of a cat watching a mouse hole. Christ, Buddha, and the 'I Am' point to the same timeless state.", "p": ["Presence is intense aliveness without thought — the state of 'no-mind' with eyes open", "Sages have always pointed to it: the Kingdom, Nirvana, the Eternal Now", "Presence is not a trance; it is hyper-alert, spacious stillness", "You cannot think your way into presence — you feel your way in"]}, "The Inner Body": {"s": "The inner body is the practical doorway into presence. Feeling the subtle energy field within the body anchors attention in the Now, because the body is always present. Tolle gives practices: feeling the hands, following the breath, sensing the whole body from within — and explains forgiveness and slowing ageing as by-products.", "p": ["The body cannot be in the past or future — feeling it pulls you into the Now", "Sensing the inner energy field (hands, feet, whole body) is a direct portal", "Forgiveness is reclaiming the present; holding grievances anchors you in time", "Deep body awareness strengthens immunity and can slow ageing"]}, "Portals Into the Unmanifest": {"s": "Beyond form lies the Unmanifest — the formless source Tolle equates with Being, God, or the void. He surveys the doorways: the inner body, the dissolution of the world in death, the space between thoughts, silence, and dreamless sleep. Each portal is an opening to the eternal Now.", "p": ["The Unmanifest is the invisible source of all form, not nothingness", "Portals include inner body, gaps between thoughts, silence, sleep, and death", "Space and silence are doorways because form needs both to exist", "Death is not the opposite of life but the Unmanifest becoming visible"]}, "Enlightened Relationships": {"s": "Tolle applies presence to intimacy. Relationships intensify both pain and awakening; love/hate cycles come from the pain-body and ego. A relationship becomes enlightened when partners stop making each other the source of happiness, allow each other to be, and use conflict as a mirror for consciousness.", "p": ["Romantic love often masks dependency and pain-body attraction", "Stop demanding your partner make you happy; take responsibility for your state", "Presence transforms relating: acceptance, non-judgment, and space heal the bond", "You do not need a partner to awaken — and aloneness can itself be a doorway"]}, "Beyond Happiness and Unhappiness There Is Peace": {"s": "This chapter distinguishes happiness (which depends on conditions) from the deep peace of Being. It teaches acceptance of the present moment, the impermanence of all forms, the cyclical nature of life, and compassion that sees through ego drama without being pulled in.", "p": ["Happiness depends on what happens; peace is untouched by conditions", "Accept — then act. Non-resistance comes before effective action", "Everything arises and passes; identifying with form guarantees suffering", "Compassion is recognizing others' drama as pain-body and ego, not attacking it"]}, "The Meaning of Surrender": {"s": "The final chapter defines surrender not as weakness or resignation but as yielding to the flow of life — inner acceptance of what is, while acting powerfully from presence. It covers surrender in relationships, illness, disaster and suffering, the way of the cross, and the power to choose the Now.", "p": ["Surrender is inner acceptance of this moment, not defeat or inaction", "Nonresistance does not mean doing nothing — it means acting from presence, not reactivity", "Illness and disaster can become portals: surrendered suffering opens into peace", "There is only one choice to make: the Now — everything else follows"]}}</script>

<script>
const PAGES = JSON.parse(document.getElementById('pages-data').textContent);
const IMAGES = JSON.parse(document.getElementById('images-data').textContent);

let current = 0;

function imgSrc(file){
  return 'data:image/jpeg;base64,' + IMAGES[file];
}

function render(){
  const p = PAGES[current];
  document.getElementById('section-pill').textContent = 'Page ' + p.pdf_page_number;
  document.getElementById('eyebrow').textContent = 'Source: page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('page-title').textContent = p.label;
  document.getElementById('content').innerHTML = p.html;

  const figWrap = document.getElementById('figures');
  figWrap.innerHTML = '';
  p.images.forEach(im => {
    const card = document.createElement('div');
    card.className = 'figure-card';
    const img = document.createElement('img');
    img.src = imgSrc(im.file);
    img.alt = im.caption;
    img.addEventListener('click', () => openLightbox(img.src, im.caption));
    const cap = document.createElement('div');
    cap.className = 'figure-cap';
    cap.textContent = im.caption;
    card.appendChild(img);
    card.appendChild(cap);
    figWrap.appendChild(card);
  });

  document.getElementById('folio-label').textContent = 'Page ' + p.pdf_page_number + ' / ' + PAGES.length;
  document.getElementById('progress-label').textContent = 'Page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('progress-fill').style.width = (((current+1)/PAGES.length)*100).toFixed(1) + '%';

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === PAGES.length - 1;
  document.getElementById('next-btn').textContent = current === PAGES.length -1 ? 'End' : 'Next \u2192';

  document.getElementById('leaf').style.animation = 'none';
  void document.getElementById('leaf').offsetWidth;
  document.getElementById('leaf').style.animation = '';

  updateActiveTocItem();
  window.scrollTo({top:0, behavior:'smooth'});
  if (window.__afterRender) window.__afterRender();
}

function openLightbox(src, alt){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('prev-btn').addEventListener('click', () => {
  if (current > 0){ current--; render(); }
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (current < PAGES.length -1){ current++; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// ---------- TOC ----------
function buildToc(){
  const list = document.getElementById('toc-list');
  PAGES.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = 'toc-item';
    btn.dataset.idx = idx;
    btn.textContent = 'p.' + p.pdf_page_number + '  —  ' + p.label;
    btn.addEventListener('click', () => {
      current = idx;
      render();
      closeToc();
    });
    list.appendChild(btn);
  });
}
function updateActiveTocItem(){
  document.querySelectorAll('.toc-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === current);
  });
}
function openToc(){
  document.getElementById('toc-panel').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeToc(){
  document.getElementById('toc-panel').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('toc-toggle').addEventListener('click', openToc);
document.getElementById('toc-close').addEventListener('click', closeToc);
document.getElementById('scrim').addEventListener('click', closeToc);

buildToc();
render();

// ---------- Read aloud (prefers Indian English voices) ----------
(function(){
  const listenBtn = document.getElementById('listen-toggle');
  const bar = document.getElementById('listen-bar');
  const voiceSel = document.getElementById('voice-select');
  const rateSel = document.getElementById('rate-select');
  const playBtn = document.getElementById('listen-play');
  const stopBtn = document.getElementById('listen-stop');
  const autoChk = document.getElementById('listen-auto');
  const status = document.getElementById('listen-status');

  if (!('speechSynthesis' in window)) {
    listenBtn.style.display = 'none';
    return;
  }

  let voices = [];
  let listening = false;
  let paused = false;
  let gen = 0;

  function score(v){
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l.indexOf('en-in') === 0) return 3;
    if (l === 'en-gb') return 2;
    return 1;
  }

  function loadVoices(){
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
    voices = (en.length ? en : all).slice().sort((a, b) => score(b) - score(a));
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const isIndian = (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0;
      opt.textContent = v.name + ' (' + v.lang + ')' + (isIndian ? ' — Indian accent' : '');
      voiceSel.appendChild(opt);
    });
    const idx = voices.findIndex(v => (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0);
    voiceSel.value = idx >= 0 ? idx : 0;
    if (!listening) {
      status.textContent = idx >= 0
        ? 'Indian English voice ready.'
        : 'No Indian English voice found on this device — closest English voice selected.';
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function pageText(){
    const p = PAGES[current];
    const div = document.createElement('div');
    div.innerHTML = p.html;
    let t = (div.textContent || '').replace(/\s+/g, ' ').trim();
    (p.images || []).forEach(im => { t += ' Figure on this page: ' + im.caption + '.'; });
    return t;
  }

  function chunk(text){
    const parts = text.match(/[^.!?\u2026]+[.!?\u2026]+["')\]]*\s*/g) || [text];
    const out = [];
    let buf = '';
    parts.forEach(s => {
      if ((buf + s).length > 220) { if (buf) out.push(buf); buf = s; }
      else buf += s;
    });
    if (buf) out.push(buf);
    return out;
  }

  function speak(){
    const text = pageText();
    if (!text) { status.textContent = 'Nothing to read on this page.'; return; }
    const myGen = ++gen;
    speechSynthesis.cancel();
    const pieces = chunk(text);
    const v = voices[parseInt(voiceSel.value, 10)];
    pieces.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateSel.value);
      if (i === pieces.length - 1) {
        u.onend = () => {
          if (!listening || myGen !== gen) return;
          if (autoChk.checked && current < PAGES.length - 1) { current++; render(); }
          else setUi(false);
        };
      }
      speechSynthesis.speak(u);
    });
    status.textContent = 'Reading page ' + (current + 1) + ' of ' + PAGES.length + '…';
  }

  function setUi(on){
    listening = on;
    paused = false;
    playBtn.innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Read aloud';
    stopBtn.disabled = !on;
    if (!on) status.textContent = 'Stopped.';
  }

  window.__afterRender = function(){
    if (listening) speak();
  };

  // Chrome desktop occasionally stalls long speech queues — nudge it.
  setInterval(() => {
    if (listening && !paused && speechSynthesis.speaking) speechSynthesis.resume();
  }, 10000);

  listenBtn.addEventListener('click', () => bar.classList.toggle('open'));
  playBtn.addEventListener('click', () => {
    if (!listening) { setUi(true); speak(); return; }
    if (paused) { speechSynthesis.resume(); paused = false; playBtn.innerHTML = '&#10074;&#10074; Pause'; }
    else { speechSynthesis.pause(); paused = true; playBtn.innerHTML = '&#9654; Resume'; }
  });
  stopBtn.addEventListener('click', () => { gen++; speechSynthesis.cancel(); setUi(false); });
  voiceSel.addEventListener('change', () => { if (listening) speak(); });
  rateSel.addEventListener('change', () => { if (listening) speak(); });
})();

</script>

<script>
(function(){
  var NOTES = {};
  var CHMAP = [];
  try { NOTES = JSON.parse(document.getElementById('notes-data').textContent); } catch(e) {}
  try { CHMAP = JSON.parse(document.getElementById('chapter-map').textContent); } catch(e) {}
  var term = '', matchPages = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function pageText(p){ var d=document.createElement('div'); d.innerHTML=p.html; return d.textContent || ''; }

  // ---------- SEARCH ----------
  var bar = document.getElementById('search-bar');
  var input = document.getElementById('search-input');
  var info = document.getElementById('search-info');

  function clearMarks(){
    var c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(function(mk){
      var t = document.createTextNode(mk.textContent);
      mk.parentNode.replaceChild(t, mk);
    });
    c.normalize();
  }
  function highlight(){
    clearMarks();
    if (!term || term.length < 2) return;
    var c = document.getElementById('content');
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var t = term.toLowerCase();
    nodes.forEach(function(n){
      var txt = n.nodeValue, low = txt.toLowerCase(), idx = low.indexOf(t);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(txt.slice(pos, idx)));
        var mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = txt.slice(idx, idx + term.length);
        frag.appendChild(mk);
        pos = idx + term.length;
        idx = low.indexOf(t, pos);
      }
      frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function infoText(){
    if (!term || term.length < 2) { info.textContent = ''; return; }
    if (!matchPages.length) { info.textContent = 'No matches'; return; }
    var pos = matchPages.indexOf(current);
    info.textContent = matchPages.length + (matchPages.length > 1 ? ' pages' : ' page') +
      (pos >= 0 ? ' — match ' + (pos + 1) + ' of ' + matchPages.length : '');
  }
  function doSearch(){
    term = input.value.trim();
    matchPages = [];
    if (term.length >= 2){
      var t = term.toLowerCase();
      PAGES.forEach(function(p, i){ if (pageText(p).toLowerCase().indexOf(t) >= 0) matchPages.push(i); });
    }
    if (matchPages.length){ current = matchPages[0]; render(); }
    else { highlight(); infoText(); }
  }
  function step(d){
    if (!matchPages.length) return;
    var pos = matchPages.indexOf(current);
    if (pos < 0) pos = 0;
    pos = (pos + d + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }
  var searchT = null;
  input.addEventListener('input', function(){ clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ clearTimeout(searchT); doSearch(); } });
  document.getElementById('search-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('search-next').addEventListener('click', function(){ step(1); });
  document.getElementById('search-close').addEventListener('click', function(){
    bar.classList.remove('open'); term=''; matchPages=[]; highlight(); infoText();
  });
  document.getElementById('search-toggle').addEventListener('click', function(){
    var open = bar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) input.focus();
  });

  // ---------- NOTES ----------
  var panel = document.getElementById('notes-panel');
  var body = document.getElementById('notes-body');
  function showNotes(){
    var ch = null;
    for (var i = current; i >= 0; i--){
      if (CHMAP[i] && NOTES[CHMAP[i]]) { ch = CHMAP[i]; break; }
    }
    if (!ch){
      for (var j = current; j < CHMAP.length; j++){
        if (CHMAP[j] && NOTES[CHMAP[j]]) { ch = CHMAP[j]; break; }
      }
    }
    if (!ch){
      body.innerHTML = '<p class="notes-empty">No chapter notes available for this section.</p>';
      return;
    }
    var n = NOTES[ch];
    var h = '<h3>' + esc(ch) + '</h3><h4>Summary</h4><p>' + esc(n.s) + '</p>';
    if (n.p && n.p.length){
      h += '<h4>Key points</h4><ul>' + n.p.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body.innerHTML = h;
  }
  document.getElementById('notes-toggle').addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    bar.classList.remove('open');
    if (open) showNotes();
  });

  // hooks after every render
  var prevA = window.__afterRender;
  window.__afterRender = function(){
    if (prevA) prevA();
    highlight();
    infoText();
    if (panel.classList.contains('open')) showNotes();
  };
})();
</script>

#sel-search-bar a{color:#ffd98a}
</style>

<script>
(function(){
  if (window.__selSearch) return; window.__selSearch = true;
  var tip = document.createElement('div');
  tip.id = 'sel-search-tip';
  tip.innerHTML = '<button id="sel-search-btn" type="button">&#128269; Search DuckDuckGo</button>';
  document.body.appendChild(tip);
  var bar = document.createElement('div');
  bar.id = 'sel-search-bar';
  bar.innerHTML = '<span id="sel-search-msg">Search opened in a popup window.</span>' +
    '<button id="sel-search-close" type="button">&#10005; Close search window</button>';
  document.body.appendChild(bar);
  var popup = null, term = '', lastUrl = '';

  function hideTip(){ tip.classList.remove('show'); }
  function hideBar(){ bar.classList.remove('show'); }

  function showTipForSelection(){
    var sel = window.getSelection();
    var txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    if (txt.length >= 2 && txt.length <= 160){
      term = txt;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      var top = r.top - 46;
      if (top < 8) top = r.bottom + 10;
      var left = r.left + r.width / 2;
      left = Math.max(90, Math.min(window.innerWidth - 90, left));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.classList.add('show');
    } else {
      hideTip();
    }
  }

  document.addEventListener('mouseup', function(e){
    if (tip.contains(e.target) || bar.contains(e.target)) return;
    setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('keyup', function(e){
    if (e.shiftKey) setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!tip.contains(e.target)) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);

  document.getElementById('sel-search-btn').addEventListener('click', function(){
    if (!term) return;
    lastUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(term);
    popup = window.open(lastUrl, 'ddg_search_popup', 'width=920,height=700,menubar=no,toolbar=no,location=no,status=no');
    hideTip();
    var msg = document.getElementById('sel-search-msg');
    if (popup){
      msg.textContent = 'Search opened in a popup window.';
    } else {
      msg.innerHTML = 'Popup blocked — <a href="' + lastUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">open the search in a new tab</a>.';
    }
    bar.classList.add('show');
  });

  document.getElementById('sel-search-close').addEventListener('click', function(){
    if (popup && !popup.closed) popup.close();
    popup = null;
    hideBar();
  });
})();
</script>

<script>
(function(){
  if (window.__slChat) return; window.__slChat = true;
  var CFG_KEY = 'sl_llm_config';
  function loadCfg(){
    try { var raw = localStorage.getItem(CFG_KEY); if (raw) return JSON.parse(raw); } catch(e){}
    return { endpoint:'https://api.openai.com/v1/chat/completions', key:'', model:'gpt-4o-mini' };
  }
  var cfg = loadCfg();

  var fab = document.createElement('button');
  fab.id = 'sl-chat-fab'; fab.type = 'button'; fab.title = 'Library assistant';
  fab.textContent = '\uD83D\uDCAC';
  document.body.appendChild(fab);

  var panel = document.createElement('div');
  panel.id = 'sl-chat-panel';
  panel.innerHTML =
    '<div id="sl-chat-head"><span>\u2728 Library Assistant</span>' +
    '<span><button id="sl-chat-clear" type="button" title="Clear chat">\uD83D\uDDD1</button>' +
    '<button id="sl-chat-gear" type="button" title="LLM settings">\u2699</button>' +
    '<button id="sl-chat-x" type="button" title="Close">\u2715</button></span></div>' +
    '<div id="sl-chat-settings">' +
    '<b>LLM configuration (any OpenAI-compatible API)</b>' +
    '<input id="sl-cfg-endpoint" placeholder="Endpoint, e.g. https://api.openai.com/v1/chat/completions">' +
    '<input id="sl-cfg-key" type="password" placeholder="API key (stored only in this browser)">' +
    '<input id="sl-cfg-model" placeholder="Model, e.g. gpt-4o-mini">' +
    '<div class="row"><button id="sl-cfg-save" type="button">Save</button>' +
    '<button id="sl-cfg-test" type="button">Test</button><span id="sl-cfg-status"></span></div>' +
    '<div class="hint">Works with OpenAI, OpenRouter, Groq, Mistral, Ollama (http://localhost:11434/v1/chat/completions), LM Studio. Without a key I search this book locally and DuckDuckGo externally.</div>' +
    '</div>' +
    '<div id="sl-chat-body"></div>' +
    '<div id="sl-chat-inputrow"><input id="sl-chat-input" placeholder="Ask about this book, or the web\u2026">' +
    '<button id="sl-chat-send" type="button" title="Send">\u27A4</button></div>';
  document.body.appendChild(panel);

  var body = panel.querySelector('#sl-chat-body');
  var input = panel.querySelector('#sl-chat-input');
  var sendBtn = panel.querySelector('#sl-chat-send');
  var busy = false;

  function scrollBody(){ body.scrollTop = body.scrollHeight; }
  function addMsg(role, html){
    var d = document.createElement('div');
    d.className = 'sl-msg ' + role;
    d.innerHTML = html;
    body.appendChild(d); scrollBody();
    return d;
  }
  function esc(t){ var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  addMsg('bot', 'Namaste. Ask me anything \u2014 I can search <b>this book</b> page by page, answer with your configured LLM, or run an external DuckDuckGo search.');

  function pageText(p){
    var d = document.createElement('div'); d.innerHTML = p.html; return d.textContent || '';
  }

  function searchBook(q){
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    if (!terms.length) return [];
    var out = [];
    for (var i = 0; i < PAGES.length; i++){
      var txt = pageText(PAGES[i]).toLowerCase();
      var score = 0;
      for (var k = 0; k < terms.length; k++){
        var hits = txt.split(terms[k]).length - 1;
        if (hits) score += hits;
      }
      if (score) out.push({ i: i, score: score });
    }
    out.sort(function(a,b){ return b.score - a.score; });
    return out.slice(0, 5);
  }

  function snippet(i, q){
    var txt = pageText(PAGES[i]).replace(/\s+/g,' ');
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    var pos = -1;
    for (var k = 0; k < terms.length; k++){ pos = txt.toLowerCase().indexOf(terms[k]); if (pos >= 0) break; }
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 60);
    return (start ? '\u2026' : '') + txt.slice(start, start + 170) + '\u2026';
  }

  function goToPage(i){
    try { current = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch(e){ console.warn('jump failed', e); }
  }

  function callLlm(q, context){
    return fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: 'You are the assistant inside a spiritual book reader. Answer concisely. When book excerpts are provided, ground the answer in them and cite the page labels. If the question needs current external facts, say so and suggest an external search.' },
          { role: 'user', content: context ? 'Book excerpts:\n' + context + '\n\nQuestion: ' + q : q }
        ],
        temperature: 0.4
      })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error('LLM error ' + res.status + ': ' + t.slice(0,180)); });
      return res.json();
    }).then(function(data){
      var c = data.choices && data.choices[0] && data.choices[0].message;
      return (c && c.content || '(empty response)').trim();
    });
  }

  function handleSend(){
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    addMsg('user', esc(q));
    busy = true; sendBtn.disabled = true;
    var thinking = document.createElement('div');
    thinking.className = 'sl-thinking'; thinking.textContent = 'Thinking\u2026';
    body.appendChild(thinking); scrollBody();

    var hits = searchBook(q);
    var finish = function(){ busy = false; sendBtn.disabled = false; thinking.remove(); };

    function renderRefs(){
      if (!hits.length) return '';
      var h = '';
      hits.forEach(function(hit, n){
        h += '<button class="sl-ref" data-page="' + hit.i + '" type="button"><b>' + esc(PAGES[hit.i].label) +
             ' \u00b7 page ' + (hit.i + 1) + '</b><span>' + esc(snippet(hit.i, q)) + '</span>' +
             '<span class="go">Go to page \u2192</span></button>';
      });
      return h;
    }

    var done = function(html){ finish(); var m = addMsg('bot', html);
      m.querySelectorAll('.sl-ref').forEach(function(b){
        b.addEventListener('click', function(){ goToPage(parseInt(b.getAttribute('data-page'), 10)); });
      });
    };

    if (cfg.key){
      var ctx = hits.slice(0,3).map(function(hit){
        return '[' + PAGES[hit.i].label + ', page ' + (hit.i + 1) + '] ' + pageText(PAGES[hit.i]).replace(/\s+/g,' ').slice(0, 900);
      }).join('\n');
      callLlm(q, ctx).then(function(ans){ done(esc(ans) + renderRefs()); })
      .catch(function(err){ done(esc(String(err.message || err)) + renderRefs()); });
    } else if (hits.length){
      done('I found ' + hits.length + ' relevant page' + (hits.length > 1 ? 's' : '') + ' in this book. Tap one to jump there, or add an LLM API key in \u2699 Settings for a synthesized answer.' + renderRefs());
    } else {
      var url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      done('Nothing in this book matched. <a href="' + url + '" target="_blank" rel="noopener">Search the web for \u201c' + esc(q) + '\u201d on DuckDuckGo \u2197</a> \u2014 or add an LLM key in \u2699 Settings and I can answer directly.');
    }
  }

  fab.addEventListener('click', function(){ panel.classList.toggle('show'); });
  panel.querySelector('#sl-chat-x').addEventListener('click', function(){ panel.classList.remove('show'); });
  panel.querySelector('#sl-chat-clear').addEventListener('click', function(){ body.innerHTML = ''; addMsg('bot', 'Chat cleared. Ask me anything.'); });
  panel.querySelector('#sl-chat-gear').addEventListener('click', function(){
    var st = panel.querySelector('#sl-chat-settings');
    st.classList.toggle('show');
    panel.querySelector('#sl-cfg-endpoint').value = cfg.endpoint || '';
    panel.querySelector('#sl-cfg-key').value = cfg.key || '';
    panel.querySelector('#sl-cfg-model').value = cfg.model || '';
  });
  panel.querySelector('#sl-cfg-save').addEventListener('click', function(){
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    panel.querySelector('#sl-cfg-status').textContent = 'Saved.';
  });
  panel.querySelector('#sl-cfg-test').addEventListener('click', function(){
    var status = panel.querySelector('#sl-cfg-status');
    status.textContent = 'Testing\u2026';
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'Say OK' }], max_tokens: 5 })
    }).then(function(res){ status.textContent = res.ok ? 'Connected.' : 'Failed: HTTP ' + res.status; })
    .catch(function(err){ status.textContent = 'Failed: ' + err.message; });
  });
  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });
})();
</script>
<style id="sl-sel-css">
#sl-sel-tip{position:fixed;z-index:99999;display:none;align-items:center;gap:2px;padding:5px;background:#2E2A24;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);font:13px/1.2 system-ui,-apple-system,sans-serif}
#sl-sel-tip.show{display:flex}
#sl-sel-tip button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:#F7F1E3;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
#sl-sel-tip button:hover{background:#4A4234}
#sl-sel-tip .sl-sep{width:1px;height:18px;background:#55493A;margin:0 2px}
#sl-sel-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#2E2A24;color:#F7F1E3;padding:10px 18px;border-radius:999px;font:13px system-ui,-apple-system,sans-serif;z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:0 8px 22px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#sl-sel-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>
(function(){
  if (window.__slSelTools) return; window.__slSelTools = true;

  /* Compatibility shim: topic-based readers (e.g. Ponder on This) expose
     `topics` + `goTo(id)` instead of `PAGES` + `render()`. Build the PAGES
     interface so the embedded assistant's search and page jumps work there too. */
  try {
    if (typeof PAGES === 'undefined' && typeof topics !== 'undefined' && Array.isArray(topics)) {
      window.PAGES = topics.map(function(t){
        return {
          label: 'Topic ' + t.id + ' \u2014 ' + t.title,
          html: '<div>' + (t.matter || []).map(function(m){ return '<p>' + m.text + '</p>'; }).join('') + '</div>'
        };
      });
      window.render = function(){
        try { if (typeof goTo === 'function') goTo(topics[window.current || 0].id); } catch(e){}
      };
    }
  } catch(e){}

  var NOTES_KEY = 'sl_my_notes';

  var tip = document.createElement('div');
  tip.id = 'sl-sel-tip';
  tip.setAttribute('role', 'toolbar');
  tip.setAttribute('aria-label', 'Selection actions');
  tip.innerHTML =
    '<button type="button" data-act="ask">\u2728 Ask AI</button>' +
    '<span class="sl-sep"></span>' +
    '<button type="button" data-act="note">\uD83D\uDCDD Add to my note</button>';
  document.body.appendChild(tip);

  var toast = document.createElement('div');
  toast.id = 'sl-sel-toast';
  document.body.appendChild(toast);
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  var selText = '';

  function hideTip(){ tip.classList.remove('show'); }

  function insideUi(node){
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    while (el) {
      if (el.id === 'sl-chat-panel' || el.id === 'sl-sel-tip' ||
          el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return true;
      el = el.parentElement;
    }
    return false;
  }

  function showTip(){
    var sel = window.getSelection();
    var text = sel && !sel.isCollapsed ? sel.toString().replace(/\s+/g, ' ').trim() : '';
    if (text.length < 3 || insideUi(sel.anchorNode)) { hideTip(); return; }
    var rect;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch(e){ hideTip(); return; }
    if (!rect || (rect.width === 0 && rect.height === 0)) { hideTip(); return; }
    selText = text;
    tip.classList.add('show');
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = rect.left + rect.width / 2 - w / 2;
    var y = rect.top - h - 8;
    if (y < 6) y = Math.min(window.innerHeight - h - 6, rect.bottom + 8);
    x = Math.max(6, Math.min(window.innerWidth - w - 6, x));
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseup', function(){ setTimeout(showTip, 10); });
  document.addEventListener('touchend', function(){ setTimeout(showTip, 350); });
  document.addEventListener('mousedown', function(e){ if (!tip.contains(e.target)) hideTip(); });
  document.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideTip(); });

  /* Keep the text selection alive when the user taps a tooltip button */
  tip.addEventListener('mousedown', function(e){ e.preventDefault(); });
  tip.addEventListener('touchend', function(e){ e.preventDefault(); }, { passive: false });

  function askAi(text){
    var panel = document.getElementById('sl-chat-panel');
    var input = document.getElementById('sl-chat-input');
    var send = document.getElementById('sl-chat-send');
    if (!panel || !input || !send) return;
    panel.classList.add('show');
    var trimmed = text.length > 600 ? text.slice(0, 600) + '\u2026' : text;
    input.value = 'Explain this passage: \u201C' + trimmed + '\u201D';
    send.click();
    input.focus();
  }

  function currentLocation(){
    try {
      if (typeof PAGES !== 'undefined' && typeof current !== 'undefined' && PAGES[current]) {
        return PAGES[current].label || '';
      }
    } catch(e){}
    try {
      if (typeof topics !== 'undefined' && typeof currentId !== 'undefined') {
        var t = topics.find(function(x){ return x.id === currentId; });
        if (t) return 'Topic ' + t.id + ' \u2014 ' + t.title;
      }
    } catch(e){}
    return '';
  }

  function addNote(text){
    var notes = [];
    try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); } catch(e){}
    if (!Array.isArray(notes)) notes = [];
    notes.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      book: document.title,
      page: currentLocation(),
      text: text,
      url: location.pathname.split('/').pop(),
      ts: Date.now()
    });
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes.slice(0, 500))); } catch(e){}
    showToast('Saved to My Notes \u2014 view it on the library home page');
  }

  tip.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    var text = selText;
    hideTip();
    if (btn.getAttribute('data-act') === 'ask') askAi(text);
    else addNote(text);
  });
})();
</script>
