d by the mind. Even when the sky is heavily overcast, the sun hasn't disappeared. It's still there on the other side of the clouds.<\/p>\n<p class=\"pdf-para\">The Buddha says that pain or suffering arises through desire or craving and that to be free of pain we need to cut the bonds of desire.<\/p>\n<p class=\"pdf-para\">All cravings are the mind seeking salvation or fulfillment in external things and in the future as a substitute for the joy of Being. As long as I am<\/p>", "images": [], "label": "Page 37"}, {"pdf_page_index": 37, "pdf_page_number": 38, "html": "<p class=\"pdf-para\">my mind, I am those cravings, those needs, wants, attachments, and aversions, and apart from them there is no 'I' except as a mere possibility, an unfulfilled potential, a seed that has not yet sprouted. In that state, even my desire to become free or enlightened is just another craving for fulfillment or completion in the future. So don't seek to become free of desire or “achieve” enlightenment. Become present. Be there as the observer of the mind. Instead of quoting the Buddha, be the Buddha, be “the awakened one,” which is what the word buddha means.<\/p>\n<p class=\"pdf-para\">Humans have been in the grip of pain for eons, ever since they fell from the state of grace, entered the realm of time and mind, and lost awareness of Being. At that point, they started to perceive themselves as meaningless fragments in an alien universe, unconnected to the Source and to each other.<\/p>\n<p class=\"pdf-para\">Pain is inevitable as long as you are identified with your mind, which is to say as long as you are unconscious, spiritually speaking. I am talking here primarily of emotional pain, which is also the main cause of physical pain and physical disease. Resentment, hatred, self-pity, guilt, anger, depression, jealousy, and so on, even the slightest irritation, are all forms of pain. And every pleasure or emotional high contains within itself the seed of pain: its inseparable opposite, which will manifest in time.<\/p>\n<p class=\"pdf-para\">Anybody who has ever taken drugs to get “high” will know that the high eventually turns into a low, that the pleasure turns into some form of pain. Many people also know from their own experience how easily and quickly an intimate relationship can turn from a source of pleasure to a source of pain. Seen from a higher perspective, both the negative and the positive polarities are faces of the same coin,<\/p>\n<p class=\"pdf-para\">are both part of the underlying pain that is inseparable from the mind- identified egoic state of consciousness.<\/p>\n<p class=\"pdf-para\">There are two levels to your pain: the pain that you create now, and the pain from the past that still lives on in your mind and body. Ceasing to create pain in the present and dissolving past pain this is what I want to talk about now.<\/p>", "images": [], "label": "Page 38"}, {"pdf_page_index": 38, "pdf_page_number": 39, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 39"}, {"pdf_page_index": 39, "pdf_page_number": 40, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 40"}, {"pdf_page_index": 40, "pdf_page_number": 41, "html": "<p class=\"pdf-para\">Chapter Two<\/p>", "images": [], "label": "Page 41"}, {"pdf_page_index": 41, "pdf_page_number": 42, "html": "<h3 class=\"pdf-heading\">Chapter Two<\/h3>\n<h3 class=\"pdf-heading\">Consciousness: The Way Out of Pain<\/h3>\n", "images": [], "label": "Consciousness: The Way Out of Pain"}, {"pdf_page_index": 42, "pdf_page_number": 43, "html": "<h4 class=\"pdf-subhead\">Create No More Pain In The Present<\/h4>\n<p class=\"pdf-para\">Nobody's life is entirely free of pain and sorrow. Isn't it a question of learning to live with them rather than trying to avoid them?<\/p>\n<p class=\"pdf-para\">The greater part of human pain is unnecessary. It is self- created as long as the unobserved mind runs your life.<\/p>\n<p class=\"pdf-para\">The pain that you create now is always some form of nonacceptance, some form of unconscious resistance to what is. On the level of thought, the resistance is some form of judgment. On the emotional level, it is some form of negativity. The intensity of the pain depends on the degree of resistance to the present moment, and this in turn depends on how strongly you are identified with your mind. The mind always seeks to deny the Now and to escape from it. In other words, the more you are identified with your mind, the more you suffer. Or you may put it like this: the more you are able to honor and accept the Now, the more you are free of pain, of suffering and free of the egoic mind.<\/p>\n<p class=\"pdf-para\">Why does the mind habitually deny or resist the Now? Because it cannot function and remain in control without time, which is past and future, so it perceives the timeless Now as threatening. Time and mind are in fact inseparable.<\/p>\n<p class=\"pdf-para\">Imagine the Earth devoid of human life, inhabited only by plants and animals. Would it still have a past and a future? Could we still speak of time in any meaningful way? The question “What time is it?” or “What's the date today?” if anybody were there to ask it would be quite meaningless. The oak tree or the eagle would be bemused by such a question. “What time?” they would ask. “Well, of course, it's now. The time is now. What else is there?”<\/p>\n<p class=\"pdf-para\">Yes, we need the mind as well as time to function in this world, but there comes a point where they take over our lives, and this is where dysfunction, pain, and sorrow set in.<\/p>\n<p class=\"pdf-para\">The mind, to ensure that it remains in control, seeks continuously to cover up the present moment with past and future, and so, as the vitality and<\/p>", "images": [], "label": "Page 43"}, {"pdf_page_index": 43, "pdf_page_number": 44, "html": "<p class=\"pdf-para\">infinite creative potential of Being, which is inseparable from the Now, becomes covered up by time, your true nature becomes obscured by the mind. An increasingly heavy burden of time has been accumulating in the human mind. All individuals are suffering under this burden, but they also keep adding to it every moment whenever they ignore or deny that precious moment or reduce it to a means of getting to some future moment, which only exists in the mind, never in actuality. The accumulation of time in the collective and individual human mind also holds a vast amount of residual pain from the past.<\/p>\n<p class=\"pdf-para\">If you no longer want to create pain for yourself and others, if you no longer want to add to the residue of past pain that still lives on in you, then dont create any more time, or at least no more than is necessary to deal with the practical aspects of your life. How to stop creating time? Realize deeply that the present moment is all you ever have. Make the Now the primary focus of your life. Whereas before you dwelt in time and paid brief visits to the Now, have your dwelling place in the Now and pay brief visits to past and future when required to deal with the practical aspects of your life situation. Always say “yes” to the present moment. What could be more futile, more insane, than to create inner resistance to something that already is? What could be more insane than to oppose life itself, which is now and always now? Surrender to what is. Say “yes” to life and see how life suddenly starts working for you rather than against you.<\/p>\n<p class=\"pdf-para\">¤ The present moment is sometimes unacceptable, unpleasant, or awful. It is as it is. Observe how the mind labels it and how this labeling process, this continuous sitting in judgment, creates pain and unhappiness. By watching the mechanics of the mind, you step out of its resistance patterns, and you can then allow the present moment to be. This will give you a taste of the state of inner freedom from external conditions, the state of true inner peace. Then see what happens, and take action if necessary or possible.<\/p>\n<p class=\"pdf-para\">Accept then act. Whatever the present moment contains, accept it as if you had chosen it. Always work with it, not against it. Make it your friend and ally, not your enemy. This will miraculously transform your whole life.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 44"}, {"pdf_page_index": 44, "pdf_page_number": 45, "html": "<h4 class=\"pdf-subhead\">Past Pain: Dissolving The Pain-Body<\/h4>\n<p class=\"pdf-para\">As long as you are unable to access the power of the Now, every emotional pain that you experience leaves behind a residue of pain that lives on in you. It merges with the pain from the past, which was already there, and becomes lodged in your mind and body. This, of course, includes the pain you suffered as a child, caused by the unconsciousness of the world into which you were born.<\/p>\n<p class=\"pdf-para\">This accumulated pain is a negative energy field that occupies your body and mind. If you look on it as an invisible entity in its own right, you are getting quite close to the truth. Its the emotional pain-body. It has two modes of being: dormant and active. A pain-body may be dormant 90 percent of the time; in a deeply unhappy person, though, it may be active up to mo percent of the time. Some people live almost entirely through their pain-body, while others may experience it only in certain situations, such as intimate relationships, or situations linked with past loss or abandonment, physical or emotional hurt, and so on. Anything can trigger it, particularly if it resonates with a pain pattern from your past. When it is ready to awaken from its dormant stage, even a thought or an innocent remark made by someone close to you can activate it.<\/p>\n<p class=\"pdf-para\">Some pain-bodies are obnoxious but relatively harmless, for example like a child who won't stop whining. Others are vicious and destructive monsters, true demons. Some are physically violent; many more are emotionally violent. Some will attack people around you or close to you, while others may attack you, their host. Thoughts and feelings you have about your life then become deeply negative and self- destructive. Illnesses and accidents are often created in this way. Some pain-bodies drive their hosts to suicide. When you thought you knew a person and then you are suddenly confronted with this alien, nasty creature for the first time, you are in for quite a shock. However, it's more important to observe it in yourself than in someone else. Watch out for any sign of unhappiness in yourself, in whatever form it may be the awakening pain-body. This can take the form<\/p>", "images": [], "label": "Page 45"}, {"pdf_page_index": 45, "pdf_page_number": 46, "html": "<p class=\"pdf-para\">of irritation, impatience, a somber mood, a desire to hurt, anger, rage, depression, a need to have some drama in your relationship, and so on. Catch it the moment it awakens from its dormant state. The pain-body wants to survive, just like every other entity in existence, and it can only survive if it gets you to unconsciously identify with it. It can then rise up, take you over, “become you,” and live through you. It needs to get its “food” through you. It will feed on any experience that resonates with its own kind of energy, anything that creates further pain in whatever form: anger, destructiveness, hatred, grief, emotional drama, violence, and even illness. So the pain-body, when it has taken you over, will create a situation in your life that reflects back its own energy frequency for it to feed on. Pain can only feed on pain. Pain cannot feed on joy. It finds it quite indigestible.<\/p>\n<p class=\"pdf-para\">Once the pain-body has taken you over, you want more pain. You become a victim or a perpetrator. You want to inflict pain, or you want to suffer pain, or both. There isn't really much difference between the two. You are not conscious of this, of course, and will vehemently claim that you do not want pain. But look closely and you will find that your thinking and behavior are designed to keep the pain going, for yourself and others. If you were truly conscious of it, the pattern would dissolve, for to want more pain is insanity, and nobody is consciously insane.<\/p>\n<p class=\"pdf-para\">The pain-body, which is the dark shadow cast by the ego, is actually afraid of the light of your consciousness. It is afraid of being found out. Its survival depends on your unconscious identification with it, as well as on your unconscious fear of facing the pain that lives in you. But if you don't face it, if you don't bring the light of your consciousness into the pain, you will be forced to relive it again and again. The pain-body may seem to you like a dangerous monster that you cannot bear to look at, but I assure you that it is an insubstantial phantom that cannot prevail against the power of your presence.<\/p>\n<p class=\"pdf-para\">Some spiritual teachings state that all pain is ultimately an illusion, and this is true. The question is: Is it true for you? A mere belief doesn't make it true. Do you want to experience pain for the rest of your life and keep saying that it is an illusion? Does that free you from the pain? What we are concerned with here is how you can realize this truth that is, make it real in your own experience.<\/p>", "images": [], "label": "Page 46"}, {"pdf_page_index": 46, "pdf_page_number": 47, "html": "<p class=\"pdf-para\">So the pain-body doesn't want you to observe it directly and see it for what it is. The moment you observe it, feel its energy field within you, and take your attention into it, the identification is broken. A higher dimension of consciousness has come in. I call it presence. You are now the witness or the watcher of the pain-body. This means that it cannot use you anymore by pretending to be you, and it can no longer replenish itself through you. You have found your own innermost strength. You have accessed the power of Now.<\/p>\n<p class=\"pdf-para\">What happens to the pain-body when we become conscious enough to break our identification with it?<\/p>\n<p class=\"pdf-para\">Unconsciousness creates it; consciousness transmutes it into itself. St. Paul expressed this universal principle beautifully:. “Everything is shown up by being exposed to the light, and whatever is exposed to the light itself becomes light.” Just as you cannot fight the darkness, you cannot fight the pain-body.<\/p>\n<p class=\"pdf-para\">Trying to do so would create inner conflict and thus further pain. Watching it is enough. Watching it implies accepting it as part of what is at that moment.<\/p>\n<p class=\"pdf-para\">The pain-body consists of trapped life-energy that has split off from your total energy field and has temporarily become autonomous through the unnatural process of mind identification. It has turned in on itself and become anti-life, like an animal trying to devour its own tail. Why do you think our civilization has become so life-destructive? But even the life- destructive forces are still life-energy.<\/p>\n<p class=\"pdf-para\">When you start to disidentify and become the watcher, the pain-body will continue to operate for a while and will try to trick you into identifying with it again. Although you are no longer energizing it through your identification, it has a certain momentum, just like a spinning wheel that will keep turning for a while even when it is no longer being propelled. At this stage, it may also create physical aches and pains in different parts of the body, but they wont last. Stay present, stay conscious. Be the ever-alert guardian of your inner space. You need to be present enough to be able to watch the pain-body directly and feel its energy. It then cannot control your thinking. The moment your thinking is aligned with the energy field of the pain-body, you are identified with it and again feeding it with your thoughts.<\/p>", "images": [], "label": "Page 47"}, {"pdf_page_index": 47, "pdf_page_number": 48, "html": "<p class=\"pdf-para\">For example, if anger is the predominant energy vibration of the pain- body and you think angry thoughts, dwelling on what someone did to you or what you are going to do to him or her, then you have become unconscious, and the pain-body has become “you.” Where there is anger, there is always pain underneath. Or when a dark mood comes upon you and you start getting into a negative mind-pattern and thinking how dreadful your life is, your thinking has become aligned with the pain-body, and you have become unconscious and vulnerable to the pain-body's attack. “Unconscious,” the way that I use the word here, means to be identified with some mental or emotional pattern. It implies a complete absence of the watcher.<\/p>\n<p class=\"pdf-para\">Sustained conscious attention severs the link between the pain-body and your thought processes and brings about the process of transmutation. It is as if the pain becomes fuel for the flame of your consciousness, which then burns more brightly as a result. This is the esoteric meaning of the ancient art of alchemy:, the transmutation of base metal into gold, of suffering into consciousness. The split within is healed, and you become whole again. Your responsibility then is not to create further pain.<\/p>\n<p class=\"pdf-para\">Let me summarize the process. Focus attention on the feeling inside you. Know that it is the pain-body. Accept that it is there. Don't think about it don't let the feeling turn into thinking. Don't judge or analyze. Don't make an identity for yourself out of it. Stay present, and continue to be the observer of what is happening inside you. Become aware not only of the emotional pain but also of “the one who observes,” the silent watcher. This is the power of the Now, the power of your own conscious presence. Then see what happens.<\/p>\n<p class=\"pdf-para\">¤ For many women, the pain-body awakens particularly at the time preceding the menstrual flow. I will talk about this and the reason for it in more detail later. Right now, let me just say this: If you are able to stay alert and present at that time and watch whatever you feel within, rather than be taken over by it, it affords an opportunity for the most powerful spiritual practice, and a rapid transmutation of all past pain becomes possible.<\/p>", "images": [], "label": "Page 48"}, {"pdf_page_index": 48, "pdf_page_number": 49, "html": "<h4 class=\"pdf-subhead\">Ego Identification With The Pain- Body<\/h4>\n<p class=\"pdf-para\">The process that I have just described is profoundly powerful yet simple. It could be taught to a child, and hopefully one day it will be one of the first things children learn in school. Once you have understood the basic principle of being present as the watcher of what happens inside you and you “understand” it by experiencing it you have at your disposal the most potent transformational tool.<\/p>\n<p class=\"pdf-para\">This is not to deny that you may encounter intense inner resistance to disidentifying from your pain. This will be the case particularly if you have lived closely identified with your emotional pain-body for most of your life and the whole or a large part of your sense of self is invested in it. What this means is that you have made an unhappy self out of your pain-body and believe that this mind-made fiction is who you are. In that case, unconscious fear of losing your identity will create strong resistance to any disidentification. In other words, you would rather be in pain be the pain- body than take a leap into the unknown and risk losing the familiar unhappy self.<\/p>\n<p class=\"pdf-para\">If this applies to you, observe the resistance within yourself. Observe the attachment to your pain. Be very alert. Observe the peculiar pleasure you derive from being unhappy. Observe the compulsion to talk or think about it. The resistance will cease if you make it conscious. You can then take your attention into the pain-body, stay present as the witness, and so initiate its transmutation.<\/p>\n<p class=\"pdf-para\">Only you can do this. Nobody can do it for you. But if you are fortunate enough to find someone who is intensely conscious, if you can be with them and join them in the state of presence, that can be helpful and will accelerate things. In this way, your own light will quickly grow stronger. When a log that has only just started to burn is placed next to one that is burning fiercely, and after a while they are separated again,<\/p>", "images": [], "label": "Page 49"}, {"pdf_page_index": 49, "pdf_page_number": 50, "html": "<p class=\"pdf-para\">the first log will be burning with much greater intensity. After all, it is the same fire. To be such a fire is one of the functions of a spiritual teacher. Some therapists may also be able to fulfill that function, provided that they have gone beyond the level of mind and can create and sustain a state of intense conscious presence while they are working with you.<\/p>", "images": [], "label": "Page 50"}, {"pdf_page_index": 50, "pdf_page_number": 51, "html": "<h4 class=\"pdf-subhead\">The Origin Of Fear<\/h4>\n<p class=\"pdf-para\">You mentioned fear as being part of our basic underlying emotional pain. How does fear arise, and why is there so much of it in people's lives? And isn't a certain amount of fear just healthy self protection? If I didn't have a fear of fire, I might put my hand in it and get burned. The reason why you don't put your hand in the fire is not because of fear, ifs because you know that you'll get burned. You don't need fear to avoid unnecessary danger just a minimum of intelligence and common sense. For such practical matters, it is useful to apply the lessons learned in the past. Now if someone threatened you with fire or with physical violence, you might experience something like fear. This is an instinctive shrinking back from danger, but not the psychological condition of fear that we are talking about here.<\/p>\n<p class=\"pdf-para\">The psychological condition of fear is divorced from any concrete and true immediate danger. It comes in many forms: unease, worry, anxiety, nervousness, tension, dread, phobia, and so on. This kind of psychological fear is always of something that might happen, not of something that is happening now. You are in the here and now, while your mind is in the future. This creates an anxiety gap. And if you are identified with your mind and have lost touch with the power and simplicity of the Now, that anxiety gap will be your constant companion. You can always cope with the present moment, but you cannot cope with something that is only a mind projection you cannot cope with the future.<\/p>\n<p class=\"pdf-para\">Moreover, as long as you are identified with your mind, the ego runs your life, as I pointed out earlier. Because of its phantom nature, and despite elaborate defense mechanisms, the ego is very vulnerable and insecure, and it sees itself as constantly under threat. This, by the way, is the case even if the ego is outwardly very confident. Now remember that an emotion is the body's reaction to your mind. What message is the body receiving continuously from the ego, the false, mind-made self? Danger, I am under<\/p>", "images": [], "label": "Page 51"}, {"pdf_page_index": 51, "pdf_page_number": 52, "html": "<p class=\"pdf-para\">threat. And what is the emotion generated by this continuous message? Fear, of course.<\/p>\n<p class=\"pdf-para\">Fear seems to have many causes. Fear of loss, fear of failure, fear of being hurt, and so on, but ultimately all fear is the ego's fear of death, of annihilation. To the ego, death is always just around the corner. In this mind-identified state, fear of death affects every aspect of your life. For example, even such a seemingly trivial and “normal” thing as the compulsive need to be right in an argument and make the other person wrong defending the mental position with which you have identified is due to the fear of death. If you identify with a mental position, then if you are wrong, your mind-based sense of self is seriously threatened with annihilation. So you as the ego cannot afford to be wrong. To be wrong is to die. Wars have been fought over this, and countless relationships have broken down.<\/p>\n<p class=\"pdf-para\">Once you have disidentified from your mind, whether you are right or wrong makes no difference to your sense of self at all, so the forcefully compulsive and deeply unconscious need to be right, which is a form of violence, will no longer be there. You can state dearly and firmly how you feel or what you think, but there will be no aggressiveness or defensiveness about it. Your sense of self is then derived from a deeper and truer place within yourself, not from the mind. Watch out for any kind of defensiveness within yourself. What are you defending? An illusory identity, an image in your mind, a fictitious entity. By making this pattern conscious, by witnessing it, you disidentify from it. In the light of your consciousness, the unconscious pattern will then quickly dissolve. This is the end of all arguments and power games, which are so corrosive to relationships. Power over others is weakness disguised as strength. True power is within, and it is available to you now.<\/p>\n<p class=\"pdf-para\">So anyone who is identified with their mind and, therefore, disconnected from their true power, their deeper self rooted in Being, will have fear as their constant companion. The number of people who have gone beyond mind is as yet extremely small, so you can assume that virtually everyone you meet or know lives in a state of fear. Only the intensity of it varies. It fluctuates between anxiety and dread at one end of the scale and a vague unease and distant sense of threat at the other. Most people become conscious of it only when it takes on one of its more acute forms.<\/p>", "images": [], "label": "Page 52"}, {"pdf_page_index": 52, "pdf_page_number": 53, "html": "<h4 class=\"pdf-subhead\">The Ego'S Search For Wholeness<\/h4>\n<p class=\"pdf-para\">Another aspect of the emotional pain that is an intrinsic part of the egoic mind is a deep-seated sense of lack or incompleteness, of not being whole. In some people, this is conscious, in others unconscious. If it is conscious, it manifests as the unsettling and constant feeling of not being worthy or good enough. If it is unconscious, it will only be felt indirectly as an intense craving, wanting and needing. In either case, people will often enter into a compulsive pursuit of ego-gratification and things to identify with in order to fill this hole they feel within. So they strive after possessions, money, success, power, recognition, or a special relationship, basically so that they can feel better about themselves, feel more complete. But even when they attain all these things, they soon find that the hole is still there, that it is bottomless. Then they are really in trouble, because they cannot delude themselves anymore. Well, they can and do, but it gets more difficult.<\/p>\n<p class=\"pdf-para\">As long as the egoic mind is running your life, you cannot truly be at ease; you cannot be at peace or fulfilled except for brief intervals when you obtained what you wanted, when a craving has just been fulfilled. Since the ego is a derived sense of self, it needs to identify with external things. It needs to be both defended and fed constantly. The most common ego identifications have to do with possessions, the work you do, social status and recognition, knowledge and education, physical appearance, special abilities, relationships, personal and family history, belief systems, and often also political, nationalistic, racial, religious, and other collective identifications. None of these is you. Do you find this frightening? Or is it a relief to know this? All of these things you will have to relinquish sooner or later. Perhaps you find it as yet hard to believe, and I am certainly not asking you to believe that your identity cannot be found in any of those things. You will know the troth of it for yourself. You will know it at the latest when you feel death approaching. Death is a stripping away of all that is not you. The secret of life is to “die before you die” and find that there is no death.<\/p>", "images": [], "label": "Page 53"}, {"pdf_page_index": 53, "pdf_page_number": 54, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 54"}, {"pdf_page_index": 54, "pdf_page_number": 55, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 55"}, {"pdf_page_index": 55, "pdf_page_number": 56, "html": "<p class=\"pdf-para\">Chapter One<\/p>", "images": [], "label": "Page 56"}, {"pdf_page_index": 56, "pdf_page_number": 57, "html": "<h3 class=\"pdf-heading\">Chapter Three<\/h3>\n<h3 class=\"pdf-heading\">Moving Deeply Into the Now<\/h3>\n", "images": [], "label": "Moving Deeply Into the Now"}, {"pdf_page_index": 57, "pdf_page_number": 58, "html": "<h4 class=\"pdf-subhead\">Don'T Seek Your Self In The Mind<\/h4>\n<p class=\"pdf-para\">I feel that there is still ct great deal I need to learn about the workings of my mind before I can get anywhere near full consciousness or spiritual enlightenment.<\/p>\n<p class=\"pdf-para\">No, you don't. The problems of the mind cannot be solved on the level of the mind. Once you have understood the basic dysfunction, there isnt really much else that you need to learn or understand. Studying the complexities of the mind may make you a good psychologist, but doing so won't take you beyond the mind, just as the study of madness isn't enough to create sanity. You have already understood the basic mechanics of the unconscious state: identification with the mind, which creates a false self, the ego, as a substitute for your true self rooted in Being. You become as a “branch cut off from the vine,” as Jesus puts it.<\/p>\n<p class=\"pdf-para\">The ego's needs are endless. It feels vulnerable and threatened and so lives in a state of fear and want. Once you know how the basic dysfunction operates, there is no need to explore all its countless manifestations, no need to make it into a complex personal problem. The ego, of course, loves that. It is always seeking for something to attach itself to in order to uphold and strengthen its illusory sense of self, and it will readily attach itself to your problems. This is why, for so many people, a large part of their sense of self is intimately connected with their problems. Once this has happened, the last thing they want is to become free of them; that would mean loss of self. There can be a great deal of unconscious ego investment in pain and suffering.<\/p>\n<p class=\"pdf-para\">So once you recognize the root of unconsciousness as identification with the mind, which of course includes the emotions, you step out of it. You become present. When you are present, you can allow the mind to be as it is without getting entangled in it. The mind in itself is not dysfunctional.<\/p>\n<p class=\"pdf-para\">It is a wonderful tool. Dysfunction sets in when you seek your self in it and mistake it for who you are. It then becomes the egoic mind and takes<\/p>", "images": [], "label": "Page 58"}, {"pdf_page_index": 58, "pdf_page_number": 59, "html": "<p class=\"pdf-para\">over your whole life.<\/p>", "images": [], "label": "Page 59"}, {"pdf_page_index": 59, "pdf_page_number": 60, "html": "<h4 class=\"pdf-subhead\">End The Delusion Of Time<\/h4>\n<p class=\"pdf-para\">It seems almost impossible to disidentify from the mind. We are all immersed in it. How do you teach a fish to fly?<\/p>\n<p class=\"pdf-para\">Here is the key: End the delusion of time. Time and mind are inseparable. Remove time from the mind and it stops unless you choose to use it.<\/p>\n<p class=\"pdf-para\">To be identified with your mind is to be trapped in time: the compulsion to live almost exclusively through memory and anticipation. This creates an endless preoccupation with past and future and an unwillingness to honor and acknowledge the present moment and allow it to be. The compulsion arises because the past gives you an identity and the future holds the promise of salvation, of fulfillment in whatever form. Both are illusions.<\/p>\n<p class=\"pdf-para\">But without a sense of time, how would we function in this world? There would be no goals to strive toward anymore. I wouldn't even know who I am, because my past makes me who I am today. I think time is something very precious, and we need to learn to use it wisely rather than waste it. Time isn't precious at all, because it is an illusion. What you perceive as precious is not time but the one point that is out of time: the Now. That is precious indeed. The more you are focused on time past and future the more you miss the Now, the most precious thing there is.<\/p>\n<p class=\"pdf-para\">Why is it the most precious thing? Firstly, because it is the only thing. Its all there is. The eternal present is the space within which your whole life unfolds, the one factor that remains constant. Life is now. There was never a time when your life was not now, nor will there ever be. Secondly,<\/p>\n<p class=\"pdf-para\">the Now is the only point that can take you beyond the limited confines of the mind. It is your only point of access into the timeless and formless realm of Being.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 60"}, {"pdf_page_index": 60, "pdf_page_number": 61, "html": "<h4 class=\"pdf-subhead\">Nothing Exists Outside The Now<\/h4>\n<p class=\"pdf-para\">Aren't past and future just as real, sometimes even more real, than the present? After all, the past determines who we are, as well as how we perceive and behave in the present. And our future goals determine which actions we take in the present.<\/p>\n<p class=\"pdf-para\">You havent yet grasped the essence of what I am saying because you are trying to understand it mentally. The mind cannot understand this. Only you can. Please just listen.<\/p>\n<p class=\"pdf-para\">Have you ever experienced, done, thought, or felt anything outside the Now? Do you think you ever will? Is it possible for anything to happen or be outside the Now? The answer is obvious, is it not? Nothing ever happened in the past; it happened in the Now.<\/p>\n<p class=\"pdf-para\">Nothing will ever happen in the future; it will happen in the Now. What you think of as the past is a memory trace, stored in the mind, of a former Now. When you remember the past, you reactivate a memory trace and you do so now. The future is an imagined Now, a projection of the mind. When the future comes, it comes as the Now. When you think about the future, you do it now. Past and future obviously have no reality of their own. Just as the moon has no light of its own, but can only reflect the light of the sun, so are past and future only pale reflections of the light, power, and reality of the eternal present. Their reality is “borrowed” from the Now.<\/p>\n<p class=\"pdf-para\">The essence of what I am saying here cannot be understood by the mind. The moment you grasp it, there is a shift in consciousness from mind to Being, from time to presence. Suddenly, everything feels alive, radiates energy, emanates Being.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 61"}, {"pdf_page_index": 61, "pdf_page_number": 62, "html": "<h4 class=\"pdf-subhead\">The Key To The Spiritual Dimension<\/h4>\n<p class=\"pdf-para\">In life-threatening emergency situations, the shift in consciousness from time to presence sometimes happens naturally. The personality that has a past and a future momentarily recedes and is replaced by an intense conscious presence, very still but very alert at the same time. Whatever response is needed then arises out of that state of consciousness. The reason why some people love to engage in dangerous activities, such as mountain climbing, car racing, and so on, although they may not be aware of it, is that it forces them into the Now that intensely alive state that is free of time, free of problems, free of thinking, free of the burden of the personality. Slipping away from the present moment even for a second may mean death. Unfortunately, they come to depend on a particular activity to be in that state. But you don't need to climb the north face of the Eiger. You can enter that state now.<\/p>\n<p class=\"pdf-para\">¤ Since ancient times, spiritual masters of all traditions have pointed to the Now as the key to the spiritual dimension. Despite this, it seems to have remained a secret. It is certainly not taught in churches and temples. If you go to a church, you may hear readings from the Gospels such as “Take no thought for the morrow; for the morrow shall take thought for the things of itself,” or “Nobody who puts his hands to the plow and looks back is fit for the Kingdom of God.” Or you might hear the passage about the beautiful flowers that are not anxious about tomorrow but live with ease in the timeless Now and are provided for abundantly by God. The depth and radical nature of these teachings are not recognized. No one seems to realize that they are meant to be lived and so bring about a profound inner transformation.<\/p>\n<p class=\"pdf-para\">¤ The whole essence of Zen consists in walking along the razor's edge of Now to be so utterly, so completely present that no problem, no suffering, nothing that is not who you are in your essence, can survive in<\/p>", "images": [], "label": "Page 62"}, {"pdf_page_index": 62, "pdf_page_number": 63, "html": "<p class=\"pdf-para\">you. In the Now, in the absence of time, all your problems dissolve. Suffering needs time; it cannot survive in the Now.<\/p>\n<p class=\"pdf-para\">The great Zen master Rinzai, in order to take his students' attention away from time, would often raise his finger and slowly ask: “What, at this moment, is lacking?” A powerful question that does not require an answer on the level of the mind. It is designed to take your attention deeply into the Now. A similar question in the Zen tradition is this: “If not now, when?”<\/p>\n<p class=\"pdf-para\">¤ The Now is also central to the teaching of Sufism, the mystical branch of Islam. Sufis have a saying: “The Sufi is the son of time present.” And Rumi, the great poet and teacher of Sufism, declares: “Past and future veil God from our sight; burn up both of them with fire.”<\/p>\n<p class=\"pdf-para\">Meister Eckhart, the thirteenth-century spiritual teacher, summed it all up beautifully “Time is what keeps the light from reaching us. There is no greater obstacle to God than time.”<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 63"}, {"pdf_page_index": 63, "pdf_page_number": 64, "html": "<h4 class=\"pdf-subhead\">Accessing The Power Of The Now<\/h4>\n<p class=\"pdf-para\">A moment ago, when you talked about the eternal present and the unreality of past and future, I found myself looking at that tree outside the window. I had looked at it a few times before, but this time it was different. The external perception had not changed much, except that the colors seemed brighter and more vibrant. But there was now an added dimension to it. This is hard to explain. I don't know how, but I was aware of something invisible that I felt was the essence of that tree, its inner spirit, if you like. And somehow I was part of that. I realize now that I hadn't truly seen the tree before, just a flat and dead image of it. When I look at the tree now, some of that awareness is still present, but I can feel it slipping away. You see, the experience is already receding into the past. Can something like this ever be more than affecting glimpse?<\/p>\n<p class=\"pdf-para\">You were free of time for a moment. You moved into the Now and therefore perceived the tree without the screen of mind. The awareness of Being became part of your perception. With the timeless dimension comes a different kind of knowing, one that does not “kill” the spirit that lives within every creature and every thing. A knowing that does not destroy the sacredness and mystery of life but contains a deep love and reverence for all that is. A knowing of which the mind knows nothing.<\/p>\n<p class=\"pdf-para\">The mind cannot know the tree. It can only know facts or information about the tree. My mind cannot know you, only labels, judgments, facts, and opinions about you. Being alone knows directly.<\/p>\n<p class=\"pdf-para\">There is a place for mind and mind knowledge. It is in the practical realm of day-to-day living. However, when it takes over all aspects of your life, including your relationships with other human beings and with nature, it becomes a monstrous parasite that, unchecked, may well end up killing all life on the planet and finally itself by killing its host.<\/p>\n<p class=\"pdf-para\">You have had a glimpse of how the timeless can transform your perceptions. But an experience is not enough, no matter how beautiful or<\/p>", "images": [], "label": "Page 64"}, {"pdf_page_index": 64, "pdf_page_number": 65, "html": "<p class=\"pdf-para\">profound. What is needed and what we are concerned with is a permanent shift in consciousness.<\/p>\n<p class=\"pdf-para\">So break the old pattern of present-moment denial and present-moment resistance. Make it your practice to withdraw attention from past and future whenever they are not needed. Step out of the time dimension as much as possible in everyday life. If you find it hard to enter the Now directly, start by observing the habitual tendency of your mind to want to escape from the Now. You will observe that the future is usually imagined as either better or worse than the present. If the imagined future is better, it gives you hope or pleasurable anticipation. If it is worse, it creates anxiety. Both are illusory. Through self-observation, more presence comes into your life automatically. The moment you realize you are not present, you are present. Whenever you are able to observe your mind, you are no longer trapped in it. Another factor has come in, something that is not of the mind:<\/p>\n<p class=\"pdf-para\">the witnessing presence. Be present as the watcher of your mind of your thoughts and emotions as well as your reactions in various situations. Be at least as interested in your reactions as in the situation or person that causes you to react. Notice also how often your attention is in the past or future. Don't judge or analyze what you observe. Watch the thought, feel the emotion, observe the reaction. Dont make a personal problem out of them. You will then feel something more powerful than any of those things that you observe: the still, observing presence itself behind the content of your mind, the silent watcher. ¤<\/p>\n<p class=\"pdf-para\">Intense presence is needed when certain situations trigger a reaction with a strong emotional charge, such as when your self-image is threatened, a challenge comes into your life that triggers fear, things “go wrong,” or an emotional complex from the past is brought up. In those instances, the tendency is for you to become “unconscious.” The reaction or emotion takes you over you “become” it. You act it out. You justify, make wrong, attack, defend . . . except that it isn't you, it's the reactive pattern, the mind in its habitual survival mode.<\/p>\n<p class=\"pdf-para\">Identification with the mind gives it more energy;, observation of the mind withdraws energy from it. Identification with the mind creates more time; observation of the mind opens up the dimension of the timeless. The energy that is withdrawn from the mind turns into presence. Once you can feel what it means to be present, it becomes much easier to simply choose to step out of the time dimension whenever time is not needed for practical<\/p>", "images": [], "label": "Page 65"}, {"pdf_page_index": 65, "pdf_page_number": 66, "html": "<p class=\"pdf-para\">purposes and move more deeply into the Now. This does not impair your ability to use time past or future when you need to refer to it for practical matters. Nor does it impair your ability to use your mind. In fact, it enhances it. When you do use your mind, it will be sharper, more focused.<\/p>", "images": [], "label": "Page 66"}, {"pdf_page_index": 66, "pdf_page_number": 67, "html": "<h4 class=\"pdf-subhead\">Letting Go Of Psychological Time<\/h4>\n<p class=\"pdf-para\">Learn to use time in the practical aspects of your life we may call this “clock time” but immediately return to present-moment awareness when those practical matters have been dealt with. In this way, there will be no build-up of “psychological time,” which is identification with the past and continuous compulsive projection into the future.<\/p>\n<p class=\"pdf-para\">Clock time is not just making an appointment or planning a trip. It includes learning from the past so that we don't repeat the same mistakes over and over. Setting goals and working toward them. Predicting the future by means of patterns and laws, physical, mathematical and so on, learned from the past and taking appropriate action on the basis of our predictions.<\/p>\n<p class=\"pdf-para\">But even here, within the sphere of practical living, where we cannot do without reference to past and future, the present moment remains the essential factor, Any lesson from the past becomes relevant and is applied now. Any planning as well as working toward achieving a particular goal is done now.<\/p>\n<p class=\"pdf-para\">The enlightened person's main focus of attention is always the Now, but they are still peripherally aware of time. In other words, they continue to use clock time but are free of psychological time.<\/p>\n<p class=\"pdf-para\">Be alert as you practice this so that you do not unwittingly transform clock time into psychological time. For example, if you made a mistake in the past and learn from it now, you are using clock time. On the other hand, if you dwell on it mentally, and self-criticism, remorse, or guilt come up, then you are making the mistake into “me” and “mine”: you make it part of your sense of self, and it has become psychological time, which is always linked to a false sense of identity. Nonforgiveness necessarily implies a heavy burden of psychological time.<\/p>\n<p class=\"pdf-para\">If you set yourself a goal and work toward it, you are using clock time. You are aware of where you want to go, but you honor and give your fullest attention to the step that you are taking at this moment. If you then become excessively focused on the goal, perhaps because you are seeking<\/p>", "images": [], "label": "Page 67"}, {"pdf_page_index": 67, "pdf_page_number": 68, "html": "<p class=\"pdf-para\">happiness, fulfillment, or a more complete sense of self in it, the Now is no longer honored. It becomes reduced to a mere stepping stone to the future, with no intrinsic value. Clock time then turns into psychological time. Your life's journey is no longer an adventure, just an obsessive need to arrive, to attain, to “make it.” You no longer see or smell the flowers by the wayside either, nor are you aware of the beauty and the miracle of life that unfolds all around you when you are present in the Now.<\/p>\n<p class=\"pdf-para\">¤ I can see the supreme importance of the Now, but I cannot quite go along with you when you say that time is a complete illusion.<\/p>\n<p class=\"pdf-para\">When I say “time is an illusion,” my intention is not to make a philosophical statement. I am just reminding you of a simple fact a fact so obvious that you may find it hard to grasp and may even find it meaningless but once fully realized, it can cut like a sword through all the mind-created layers of complexity and “problems.” Let me say it again: the present moment is all you ever have. There is never a time when your life is not “this moment.” Is this not a fact?<\/p>", "images": [], "label": "Page 68"}, {"pdf_page_index": 68, "pdf_page_number": 69, "html": "<h4 class=\"pdf-subhead\">The Insanity Of Psychological Time<\/h4>\n<p class=\"pdf-para\">You will not have any doubt that psychological time is a mental disease if you look at its collective manifestations. They occur, for example, in the form of ideologies such as communism, national socialism or any nationalism, or rigid religious belief systems, which operate under the implicit assumption that the highest good lies in the future and that therefore the end justifies the means. The end is an idea, a point in the mind-projected future, when salvation in whatever form happiness, fulfillment, equality, liberation, and so on will be attained. Not infrequently, the means of getting there are the enslavement, torture, and murder of people in the present.<\/p>\n<p class=\"pdf-para\">For example, it is estimated that as many as 50 million people were murdered to further the cause of communism, to bring about a “better world” in Russia, China, and other countries. This is a chilling example of how belief in a future heaven creates a present hell. Can there be any doubt that psychological time is a serious and dangerous mental illness?<\/p>\n<p class=\"pdf-para\">How does this mind pattern operate in your life? Are you always trying to get somewhere other than where you are? Is most of your doing just a means to an end? Is fulfillment always just around the corner or confined to short-lived pleasures, such as sex, food, drink, drugs, or thrills and excitement? Are you always focused on becoming,<\/p>\n<p class=\"pdf-para\">achieving, and attaining, or alternatively chasing some new thrill or pleasure? Do you believe that if you acquire more things you will become more fulfilled, good enough, or psychologically complete? Are you waiting for a man or woman to give meaning to your life?<\/p>\n<p class=\"pdf-para\">In the normal, mind-identified or unenlightened state of consciousness, the power and infinite creative potential that lie concealed in the Now are completely obscured by psychological time. Your life then loses its vibrancy, its freshness, its sense of wonder. The old patterns of thought, emotion, behavior, reaction, and desire are acted out in endless repeat<\/p>", "images": [], "label": "Page 69"}, {"pdf_page_index": 69, "pdf_page_number": 70, "html": "<p class=\"pdf-para\">performances, a script in your mind that gives you an identity of sorts but distorts or covers up the reality of the Now. The mind then creates an obsession with the future as an escape from the unsatisfactory present.<\/p>", "images": [], "label": "Page 70"}, {"pdf_page_index": 70, "pdf_page_number": 71, "html": "<h4 class=\"pdf-subhead\">Negativity And Suffering Have Their Roots In Time<\/h4>\n<p class=\"pdf-para\">But the belief that the future will be better than the present is not always an illusion. The present can be dreadful, and things can get better in the future, and often they do.<\/p>\n<p class=\"pdf-para\">Usually, the future is a replica of the past. Superficial changes are possible, but real transformation is rare and depends upon whether you can become present enough to dissolve the past by accessing the power of the Now. What you perceive as future is an intrinsic part of your state of consciousness now. If your mind carries a heavy burden of past, you will experience more of the same. The past perpetuates itself through lack of presence. The quality of your consciousness at this moment is what shapes the future which, of course, can only be experienced as the Now.<\/p>\n<p class=\"pdf-para\">You may win $10 million, but that kind of change is no more than skin deep. You would simply continue to act out the same conditioned patterns in more luxurious surroundings. Humans have learned to split the atom. Instead of killing ten or twenty people with a wooden club, one person can now kill a million just by pushing a button. Is that real change?<\/p>\n<p class=\"pdf-para\">If it is the quality of your consciousness at this moment that determines the future, then what is it that determines the quality of your consciousness? Your degree of presence. So the only place where true change can occur and where the past can be dissolved is the Now.<\/p>\n<p class=\"pdf-para\">¤ All negativity is caused by an accumulation of psychological time and denial of the present. Unease, anxiety, tension, stress, worry all forms of fear are caused by too much future, and not enough presence. Guilt, regret, resentment, grievances, sadness, bitterness, and all forms of nonforgiveness are caused by too much past, and not enough presence.<\/p>\n<p class=\"pdf-para\">Most people find it difficult to believe that a state of consciousness totally free of all negativity is possible. And yet this is the liberated state to<\/p>", "images": [], "label": "Page 71"}, {"pdf_page_index": 71, "pdf_page_number": 72, "html": "<p class=\"pdf-para\">which all spiritual teachings point. It is the promise of salvation, not in an illusory future but right here and now.<\/p>\n<p class=\"pdf-para\">You may find it hard to recognize that time is the cause of your suffering or your problems. You believe that they are caused by specific situations in your life, and seen from a conventional viewpoint, this is true. But until you have dealt with the basic problem-making dysfunction of the mind its attachment to past and future and denial of the Now problems are actually interchangeable. If all your problems or perceived causes of suffering or unhappiness were miraculously removed for you today, but you had not become more present, more conscious, you would soon find yourself with a similar set of problems or causes of suffering, like a shadow that follows you wherever you go. Ultimately, there is only one problem: the time-bound mind itself.<\/p>\n<p class=\"pdf-para\">I cannot believe that I could ever reach a point where I am completely free of my problems.<\/p>\n<p class=\"pdf-para\">You are right. You can never reach that point because you are at that point now.<\/p>\n<p class=\"pdf-para\">There is no salvation in time. You cannot be free in the future. Presence is the key to freedom, so you can only be free now.<\/p>", "images": [], "label": "Page 72"}, {"pdf_page_index": 72, "pdf_page_number": 73, "html": "<h4 class=\"pdf-subhead\">Finding The Life Underneath Your Life Situation<\/h4>\n<p class=\"pdf-para\">I don't see how I can be free now. As it happens, I am extremely unhappy with my life at the moment. This is a fact, and I would be deluding myself if I tried to convince myself that all is well when it definitely isn't. To me, the present moment is very unhappy; it is not liberating at all. What keeps me going is the hope or possibility of some improvement in the future.<\/p>\n<p class=\"pdf-para\">You think that your attention is in the present moment when it's actually taken up completely by time. You cannot be both unhappy and fully present in the Now.<\/p>\n<p class=\"pdf-para\">What you refer to as your “life” should more accurately be called your “life situation.” It is psychological time: past and future. Certain things in the past didn't go the way you wanted them to go. You are still resisting what happened in the past, and now you are resisting what is. Hope is what keeps you going, but hope keeps you focused on the future, and this continued focus perpetuates your denial of the Now and therefore your unhappiness.<\/p>\n<p class=\"pdf-para\">It is true that my present life situation is the result of things that happened in the past, but it is still my present situation, and being stuck in it is what makes me unhappy.<\/p>\n<p class=\"pdf-para\">Forget about your life situation for a while and pay attention to your life.<\/p>\n<p class=\"pdf-para\">What is the difference? Your life situation exists in time. Your life is now. Your life situation is mind-stuff. Your life is real. Find the “narrow gate that leads to life.” It is called the Now. Narrow your life down to this moment. Your life situation may be full of problems most life situations are but find out if you have any problem at this moment. Not tomorrow or in ten minutes, but now. Do you have a problem now?<\/p>", "images": [], "label": "Page 73"}, {"pdf_page_index": 73, "pdf_page_number": 74, "html": "<p class=\"pdf-para\">When you are full of problems, there is no room for anything new to enter, no room for a solution. So whenever you can, make some room, create some space, so that you find the life underneath your life situation.<\/p>\n<p class=\"pdf-para\">Use your senses fully. Be where you are. Look around. Just look, don't interpret. See the light, shapes, colors, textures. Be aware of the silent presence of each thing. Be aware of the space that allows everything to be. Listen to the sounds; don't judge them. Listen to the silence underneath the sounds. Touch something anything and feel and acknowledge its Being. Observe the rhythm of your breathing; feel the air flowing in and out, feel the life energy inside your body. Allow everything to be, within and without.<\/p>\n<p class=\"pdf-para\">Allow the “isness” of all things. Move deeply into the Now. You are leaving behind the deadening world of mental abstraction, of time. You are getting out of the insane mind that is draining you of life energy, just as it is slowly poisoning and destroying the Earth. You are awakening out of the dream of time into the present.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 74"}, {"pdf_page_index": 74, "pdf_page_number": 75, "html": "<h4 class=\"pdf-subhead\">All Problems Are Illusions Of The Mind<\/h4>\n<p class=\"pdf-para\">It feels as if a heavy burden has been lifted. A sense of lightness. I feel clear . . . but my problems are still there waiting for me, aren't they? They haven't been solved. Am I not just temporarily evading them?<\/p>\n<p class=\"pdf-para\">If you found yourself in paradise, it wouldn't be long before your mind would say “yes, but . . . ”Ultimately, this is not about solving your problems. Ifs about realizing that there are no problems. Only situations to be dealt with now, or to be left alone and accepted as part of the \"isness' of the present moment until they change or can be dealt with. Problems are mind-made and need time to survive. They cannot survive in the actuality of the Now.<\/p>\n<p class=\"pdf-para\">Focus your attention on the Now and tell me what problem you have at this moment.<\/p>\n<p class=\"pdf-para\">¤ I am not getting any answer because it is impossible to have a problem when your attention is fully in the Now. A situation that needs to be either dealt with or accepted yes. Why make it into a problem? Why make anything into a problem? Isn't life challenging enough as it is? What do you need problems for? The mind unconsciously loves problems because they give you an identity of sorts. This is normal, and it is insane. “Problem” means that you are dwelling on a situation mentally without there being a true intention or possibility of taking action now and that you are unconsciously making it part of your sense of self. You become so overwhelmed by your life situation that you lose your sense of life, of Being. Or you are carrying in your mind the insane burden of a hundred things that you will or may have to do in the future instead of focusing your attention on the one thing that you can do now.<\/p>\n<p class=\"pdf-para\">When you create a problem, you create pain. All it takes is a simple choice, a simple decision: no matter what happens, I will create no more pain for myself. I will create no more problems. Although it is a simple<\/p>", "images": [], "label": "Page 75"}, {"pdf_page_index": 75, "pdf_page_number": 76, "html": "<p class=\"pdf-para\">choice, it is also very radical. You wont make that choice unless you are truly fed up with suffering, unless you have truly had enough.<\/p>\n<p class=\"pdf-para\">And you won't be able to go through with it unless you access the power of the Now. If you create no more pain for yourself, then you create no more pain for others. You also no longer contaminate the beautiful Earth, your inner space, and the collective human psyche with the negativity of problem-making.<\/p>\n<p class=\"pdf-para\">¤ If you have ever been in a life-or-death emergency situation, you will know that it wasn't a problem. The mind didn't have time to fool around and make it into a problem. In a true emergency, the mind stops; you become totally present in the Now, and something infinitely more powerful takes over. This is why there are many reports of ordinary people suddenly becoming capable of incredibly courageous deeds. In any emergency, either you survive or you don't. Either way, it is not a problem.<\/p>\n<p class=\"pdf-para\">Some people get angry when they hear me say that problems are illusions. I am threatening to take away their sense of who they are. They have invested much time in a false sense of self. For many years, they have unconsciously defined their whole identity in terms of their problems or their suffering. Who would they be without it?<\/p>\n<p class=\"pdf-para\">A great deal of what people say, think, or do is actually motivated by fear, which of course is always linked with having your focus on the future and being out of touch with the Now. As there are no problems in the Now, there is no fear either.<\/p>\n<p class=\"pdf-para\">Should a situation arise that you need to deal with now, your action will be clear and incisive if it arises out of present-moment awareness. It is also more likely to be effective. It will not be a reaction coming from the past conditioning of your mind but an intuitive response to the situation. In other instances, when the time-bound mind would have reacted, you will find it more effective to do nothing just stay centered in the Now.<\/p>", "images": [], "label": "Page 76"}, {"pdf_page_index": 76, "pdf_page_number": 77, "html": "<h4 class=\"pdf-subhead\">A Quantum Leap In The Evolution Of Consciousness<\/h4>\n<p class=\"pdf-para\">I have had glimpses of this state off freedom from mind and time that you describe, but past and future are so overwhelmingly strong that I cannot keep them out for long.<\/p>\n<p class=\"pdf-para\">The time-bound mode of consciousness is deeply embedded in the human psyche. But what we are doing here is part of a profound transformation that is taking place in the collective consciousness of the planet and beyond: the awakening of consciousness from the dream of matter, form, and separation. The ending of time. We are breaking mind patterns that have dominated human life for eons. Mind patterns that have created unimaginable suffering on a vast scale. I am not using the word evil. It is more helpful to call it unconsciousness or insanity.<\/p>\n<p class=\"pdf-para\">This breaking up of the old mode of consciousness or rather unconsciousness: is it something we have to do or will it happen anyway? I mean, is this change inevitable?<\/p>\n<p class=\"pdf-para\">Thats a question of perspective. The doing and the happening is in fact a single process; because you are one with the totality of consciousness, you cannot separate the two. But there is no absolute guarantee that humans will make it. The process isn't inevitable or automatic. Your cooperation is an essential part of it. However you look at it, it is a quantum leap in the evolution of consciousness, as well as our only chance of survival as a race.<\/p>", "images": [], "label": "Page 77"}, {"pdf_page_index": 77, "pdf_page_number": 78, "html": "<h4 class=\"pdf-subhead\">The Joy Of Being<\/h4>\n<p class=\"pdf-para\">To alert you that you have allowed yourself to be taken over by psychological time, you can use a simple criterion. Ask yourself: Is there joy, ease, and lightness in what I am doing? If there isn't, then time is covering up the present moment, and life is perceived as a burden or a struggle.<\/p>\n<p class=\"pdf-para\">If there is no joy, ease, or lightness in what you are doing, it does not necessarily mean that you need to change what you are doing. It may be sufficient to change the how. “How” is always more important than “what.” See if you can give much more attention to the doing than to the result that you want to achieve through it. Give your fullest attention to whatever the moment presents. This implies that you also completely accept what is, because you cannot give your full attention to something and at the same time resist it.<\/p>\n<p class=\"pdf-para\">As soon as you honor the present moment, all unhappiness and struggle dissolve, and life begins to flow with joy and ease. When you act out of present-moment awareness, whatever you do becomes imbued with a sense of quality, care, and love even the most simple action.<\/p>\n<p class=\"pdf-para\">¤ So do not be concerned with the fruit of your action just give attention to the action itself. The fruit will come of its own accord. This is a powerful spiritual practice. In the Bhagavad Gita, one of the oldest and most beautiful spiritual teachings in existence, non-attachment to the fruit of your action is called Karma Yoga. It is described as the path of “consecrated action.”<\/p>\n<p class=\"pdf-para\">When the compulsive striving away from the Now ceases, the joy of Being flows into everything you do. The moment your attention turns to the Now, you feel a presence, a stillness, a peace. You no longer depend on the future for fulfillment and satisfaction you don't look to it for salvation. Therefore, you are not attached to the results. Neither failure nor success<\/p>", "images": [], "label": "Page 78"}, {"pdf_page_index": 78, "pdf_page_number": 79, "html": "<p class=\"pdf-para\">has the power to change your inner state of Being. You have found the life underneath your life situation.<\/p>\n<p class=\"pdf-para\">In the absence of psychological time, your sense of self is derived from Being, not from your personal past. Therefore, the psychological need to become anything other than who you are already is no longer there. In the world, on the level of your life situation, you may indeed become wealthy, knowledgeable, successful, free of this or that, but in the deeper dimension of Being you are complete and whole now.<\/p>\n<p class=\"pdf-para\">In that state of wholeness, would we still be able or willing to pursue external goals ?<\/p>\n<p class=\"pdf-para\">Of course, but you will not have illusory expectations that anything or anybody in the future will save you or make you happy. As far as your life situation is concerned, there may be things to be attained or acquired. Thats the world of form,<\/p>\n<p class=\"pdf-para\">of gain and loss. Yet on a deeper level you are already complete, and when you realize that, there is a playful, joyous energy behind what you do. Being free of psychological time, you no longer pursue your goals with grim determination, driven by fear, anger, discontent, or the need to become someone. Nor will you remain inactive through fear of failure, which to the ego is loss of self. When your deeper sense of self is derived from Being, when you are free of “becoming” as a psychological need, neither your happiness nor your sense of self depends on the outcome, and so there is freedom from fear. You don't seek permanency where it cannot be found: in the world of form, of gain and loss, birth and death. You don't demand that situations, conditions, places, or people should make you happy, and then suffer when they don't live up to your expectations.<\/p>\n<p class=\"pdf-para\">Everything is honored, but nothing matters. Forms are born and die, yet you are aware of the eternal underneath the forms. You know that “nothing real can be threatened.”<\/p>\n<p class=\"pdf-para\">When this is your state of Being, how can you not succeed? You have succeeded already.<\/p>", "images": [], "label": "Page 79"}, {"pdf_page_index": 79, "pdf_page_number": 80, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 80"}, {"pdf_page_index": 80, "pdf_page_number": 81, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 81"}, {"pdf_page_index": 81, "pdf_page_number": 82, "html": "<p class=\"pdf-para\">Chapter One<\/p>", "images": [], "label": "Page 82"}, {"pdf_page_index": 82, "pdf_page_number": 83, "html": "<h3 class=\"pdf-heading\">Chapter Four<\/h3>\n<h3 class=\"pdf-heading\">Mind Strategies for Avoiding the Now<\/h3>\n<p class=\"pdf-para\">NOW<\/p>", "images": [], "label": "Mind Strategies for Avoiding the Now"}, {"pdf_page_index": 83, "pdf_page_number": 84, "html": "<h4 class=\"pdf-subhead\">Loss Of Now: The Core Delusion<\/h4>\n<p class=\"pdf-para\">Even if I completely accept that ultimately time is an illusion, what difference is that going to make in my life? I still have to live in a world that is completely dominated by time.<\/p>\n<p class=\"pdf-para\">Intellectual agreement is just another belief and won't make much difference to your life. To realize this truth, you need to live it. When every cell of your body is so present that it feels vibrant with life, and when you can feel that life every moment as the joy of Being, then it can be said that you are free of time.<\/p>\n<p class=\"pdf-para\">But I still have to pay the bills tomorrow, and I am still going to grow old and die just like everybody else. So how can I ever say that I am free of time?<\/p>\n<p class=\"pdf-para\">Tomorrow's bills are not the problem. The dissolution of the physical body is not a problem. Loss of Now is the problem, or rather: the core delusion that turns a mere situation, event, or emotion into a personal problem and into suffering. Loss of Now is loss of Being.<\/p>\n<p class=\"pdf-para\">To be free of time is to be free of the psychological need of past for your identity and future for your fulfillment. It represents the most profound transformation of consciousness that you can imagine. In some rare cases, this shift in consciousness happens dramatically and radically, once and for all. When it does, it usually comes about through total surrender in the midst of intense suffering. Most people, however, have to work at it.<\/p>\n<p class=\"pdf-para\">When you have had your first few glimpses of the timeless state of consciousness, you begin to move back and forth between the dimensions of time and presence. First you become aware of just how rarely your attention is truly in the Now. But to know that you are not present is a great success: that knowing is presence even if initially it only lasts for a couple of seconds of dock time before it is lost again. Then, with increasing frequency, you choose to have the focus of your consciousness in the present moment rather than in the past or future, and whenever you realize that you had lost the Now, you are able to stay in it not just for a couple of<\/p>", "images": [], "label": "Page 84"}, {"pdf_page_index": 84, "pdf_page_number": 85, "html": "<p class=\"pdf-para\">seconds, but for longer periods as perceived from the external perspective of dock time. So before you are firmly established in the state of presence, which is to say before you are fully conscious, you shift back and forth for a while between consciousness and unconsciousness, between the state of presence and the state of mind identification. You lose the Now, and you return to it, again and again. Eventually, presence becomes your predominant state.<\/p>\n<p class=\"pdf-para\">For most people, presence is experienced either never at all or only accidentally and briefly on rare occasions without being recognized for what it is. Most humans alternate not between consciousness and unconsciousness but only between different levels of unconsciousness.<\/p>", "images": [], "label": "Page 85"}, {"pdf_page_index": 85, "pdf_page_number": 86, "html": "<h4 class=\"pdf-subhead\">Ordinary Unconsciousness And Deep Unconsciousness<\/h4>\n<p class=\"pdf-para\">What do you mean by different levels of unconsciousness? As you probably know, in sleep you constantly move between the phases of dreamless sleep and the dream state. Similarly, in wakefulness most people only shift between ordinary unconsciousness and deep unconsciousness. What I call ordinary unconsciousness means being identified with your thought processes and emotions, your reactions, desires, and aversions. It is most people's normal state. In that state, you are run by the egoic mind, and you are unaware of Being.<\/p>\n<p class=\"pdf-para\">It is a state not of acute pain or unhappiness but of an almost continuous low level of unease, discontent, boredom, or nervousness a kind of background static. You may not realize this because it is so much a part of “normal” living, just as you are not aware of a continuous low background noise, such as the hum of an air conditioner, until it stops. When it suddenly does stop, there is a sense of relief. Many people use alcohol, drugs, sex, food, work, television, or even shopping as anesthetics in an unconscious attempt to remove the basic unease. When this happens, an activity that might be very enjoyable if used in moderation becomes imbued with a compulsive or addictive quality, and all that is ever achieved through it is extremely short-lived symptom relief.<\/p>\n<p class=\"pdf-para\">The unease of ordinary unconsciousness turns into the pain of deep unconsciousness a state of more acute and more obvious suffering or unhappiness when things “go wrong,” when the ego is threatened or there is a major challenge, threat, or loss, real or imagined, in your life situation or conflict in a relationship. It is an intensified version of ordinary unconsciousness, different from it not in kind but in degree.<\/p>\n<p class=\"pdf-para\">In ordinary unconsciousness, habitual resistance to or denial of what is creates the unease and discontent that most people accept as normal living. When this resistance becomes intensified through some challenge or threat to the ego, it brings up intense negativity such as anger, acute fear,<\/p>", "images": [], "label": "Page 86"}, {"pdf_page_index": 86, "pdf_page_number": 87, "html": "<p class=\"pdf-para\">aggression, depression, and so on. Deep unconsciousness often means that the pain-body has been triggered and that you have become identified with it. Physical violence would be impossible without deep unconsciousness. It can also occur easily whenever and wherever a crowd of people or even an entire nation generates a negative collective energy field.<\/p>\n<p class=\"pdf-para\">The best indicator of your level of consciousness is how you deal with life's challenges when they come. Through those challenges, an already unconscious person tends to become more deeply unconscious, and a conscious person more intensely conscious. You can use a challenge to awaken you, or you can allow it to pull you into even deeper sleep. The dream of ordinary unconsciousness then turns into a nightmare.<\/p>\n<p class=\"pdf-para\">If you cannot be present even in normal circumstances, such as when you are sitting alone in a room, walking in the woods, or listening to someone, then you certainly won't be able to stay conscious when something “goes wrong” or you are faced with difficult people or situations, with loss or the threat of loss. You will be taken over by a reaction, which ultimately is always some form of fear, and pulled into deep unconsciousness. Those challenges are your tests. Only the way in which you deal with them will show you and others where you are at as far as your state of consciousness is concerned, not how long you can sit with your eyes closed or what visions you see.<\/p>\n<p class=\"pdf-para\">So it is essential to bring more consciousness into your life in ordinary situations when everything is going relatively smoothly. In this way, you grow in presence power. It generates an energy field in you and around you of a high vibrational frequency. No unconsciousness, no negativity, no discord or violence can enter that field and survive, just as darkness cannot survive in the presence of light.<\/p>\n<p class=\"pdf-para\">When you learn to be the witness of your thoughts and emotions, which is an essential part of being present, you may be surprised when you first become aware of the background “static” of ordinary unconsciousness and realize how rarely, if ever, you are truly at ease within yourself. On the level of your thinking, you will find a great deal of resistance in the form of judgment, discontent, and mental projection away from the Now. On the emotional level, there will be an undercurrent of unease, tension, boredom, or nervousness. Both are aspects of the mind in its habitual resistance mode.<\/p>", "images": [], "label": "Page 87"}, {"pdf_page_index": 87, "pdf_page_number": 88, "html": "<h4 class=\"pdf-subhead\">What Are They Seeking?<\/h4>\n<p class=\"pdf-para\">Carl Jung tells in one of his books of a conversation he had with a Native American chief who pointed out to him that in his perception most white people have tense faces, staring eyes, and a cruel demeanor. He said: “They are always seeking something. What are they seeking? The whites always want something. They are always uneasy and restless. We dont know what they want. We think they are mad.”<\/p>\n<p class=\"pdf-para\">The undercurrent of constant unease started long before the rise of Western industrial civilization, of course, but in Western civilization, which now covers almost the entire globe, including most of the East, it manifests in an unprecedentedly acute form. It was already there at the time of Jesus, and it was there 60o years before that at the time of Buddha, and long before that. Why are you always anxious? Jesus asked his disciples. “Can anxious thought add a single day to your life?” And the Buddha taught that the root of suffering is to be found in our constant wanting and craving.<\/p>\n<p class=\"pdf-para\">Resistance to the Now as a collective dysfunction is intrinsically connected to loss of awareness of Being and forms the basis of our dehumanized industrial civilization. Freud, by the way, also recognized the existence of this undercurrent of unease and wrote about it in his book Civilization and Its Discontents, but he did not recognize the true root of the unease and failed to realize that freedom from it is possible. This collective dysfunction has created a very unhappy and extraordinarily violent civilization that has become a threat not only to itself but also to all life on the planet.<\/p>", "images": [], "label": "Page 88"}, {"pdf_page_index": 88, "pdf_page_number": 89, "html": "<h4 class=\"pdf-subhead\">Dissolving Ordinary Unconsciousness<\/h4>\n<p class=\"pdf-para\">So how can we be free of this affliction? Make it conscious. Observe the many ways in which unease, discontent, and tension arise within you through unnecessary judgment, resistance to what is, and denial of the Now. Anything unconscious dissolves when you shine the light of consciousness on it. Once you know how to dissolve ordinary unconsciousness, the light of your presence will shine brightly, and it will be much easier to deal with deep unconsciousness whenever you feel its gravitational pull. However, ordinary unconsciousness may not be easy to detect initially because it is so normal.<\/p>\n<p class=\"pdf-para\">Make it a habit to monitor your mental-emotional state through self- observation. 'Am I at ease at this moment?“ is a good question to ask yourself frequently. Or you can ask: ”Whats going on inside me at this mo
