In the meantime, awareness of the inner body has other benefits in the physical realm. One of them is a significant slowing down of the aging of the physical body.<\/p>\n<p class=\"pdf-para\">Whereas the outer body normally appears to grow old and wither fairly quickly, the inner body does not change with time, except that you may feel it more deeply and become it more fully. If you are twenty years old now, the energy field of your inner body will feel just the same when you are eighty. It will be just as vibrantly alive. As soon as your habitual state changes from being out-of-the-body and trapped in your mind to being in- the-body and present in the Now, your physical body will feel lighter, clearer, more alive.<\/p>\n<p class=\"pdf-para\">As there is more consciousness in the body, its molecular structure actually becomes less dense. More consciousness means a lessening of the illusion of materiality. When you become identified more with the timeless inner body than with the outer body, when presence becomes your normal mode of consciousness and past and future no longer dominate your attention, you do not accumulate time anymore in your psyche and in the cells of the body. The accumulation of time as the psychological burden of past and future greatly impairs the cells' capacity for self-renewal. So if you inhabit the inner body, the outer body will grow old at a much slower rate, and even when it does, your timeless essence will shine through the outer form, and you will not give the appearance of an old person.<\/p>\n<p class=\"pdf-para\">Is there any scientific evidence for this? Try it out and you will be the evidence.<\/p>", "images": [], "label": "Page 137"}, {"pdf_page_index": 137, "pdf_page_number": 138, "html": "<h4 class=\"pdf-subhead\">Strengthening The Immune System<\/h4>\n<p class=\"pdf-para\">Another benefit of this practice in the physical realm is a great strengthening of the immune system which occurs when you inhabit the body. The more consciousness you bring into the body, the stronger the immune system becomes. It is as if every cell awakens and rejoices. The body loves your attention. It is also a potent form of self- healing. Most illnesses creep in when you are not present in the body. If the master is not present in the house, all kinds of shady characters will take up residence there. When you inhabit your body, it will be hard for unwanted guests to enter.<\/p>\n<p class=\"pdf-para\">It is not only your physical immune system that becomes strengthened; your psychic immune system is greatly enhanced as well. The latter protects you from the negative mental-emotional force fields of others, which are highly contagious. Inhabiting the body protects you not by putting up a shield, but by raising the frequency vibration of your total energy field, so that anything that vibrates at a lower frequency, such as fear, anger, depression, and so on, now exists in what is virtually a different order of reality. It doesnt enter your field of consciousness anymore, or if it does you don't need to offer any resistance to it because it passes right through you. Please don't just accept or reject what I am saying. Put it to the test.<\/p>\n<p class=\"pdf-para\">There is a simple but powerful self-healing meditation that you can do whenever you feel the need to boost your immune system. It is particularly effective if used when you feel the first symptoms of an illness, but it also works with illnesses that are already entrenched if you use it at frequent intervals and with an intense focus. It will also counteract any disruption of your energy field by some form of negativity. However, it is not a substitute for the moment-to- moment practice of being in the body;, otherwise, its effect will only be temporary. Here it is.<\/p>\n<p class=\"pdf-para\">When you are unoccupied for a few minutes, and especially last thing at night before falling asleep and first thing in the morning before getting up, “flood” your body with consciousness. Close your eyes. Lie flat on your<\/p>", "images": [], "label": "Page 138"}, {"pdf_page_index": 138, "pdf_page_number": 139, "html": "<p class=\"pdf-para\">back. Choose different parts of your body to focus your attention on briefly at first: hands, feet, arms, legs, abdomen, chest, head, and so on. Feel the life energy inside those parts as intensely as you can. Stay with each part for fifteen seconds or so. Then let your attention run through the body like a wave a few times, from feet to head and back again. This need only take a minute or so. After that, feel the inner body in its totality, as a single field of energy. Hold that feeling for a few minutes. Be intensely present during that time, present in every cell of your body. Don't be concerned if the mind occasionally succeeds in drawing your attention out of the body and you lose yourself in some thought. As soon as you notice that this has happened, just return your attention to the inner body.<\/p>", "images": [], "label": "Page 139"}, {"pdf_page_index": 139, "pdf_page_number": 140, "html": "<h4 class=\"pdf-subhead\">Let The Breath Take You Into The Body<\/h4>\n<p class=\"pdf-para\">At times, when my mind has been very active, it has acquired such momentum that I find it impossible to take my attention away from it and feel the inner body. This happens particularly when I get into a worry or anxiety pattern. Do you have any suggestions?<\/p>\n<p class=\"pdf-para\">If at any time you are finding it hard to get in touch with the inner body, it is usually easier to focus on your breathing first. Conscious breathing, which is a powerful meditation in its own right, will gradually put you in touch with the body. Follow the breath with your attention as it moves in and out of your body. Breathe into the body, and feel your abdomen expanding and contracting slightly with each inhalation and exhalation. If you find it easy to visualize, close your eyes and see yourself surrounded by light or immersed in a luminous substance a sea of consciousness. Then breathe in that light. Feel that luminous substance filling up your body and making it luminous also. Then gradually focus more on the feeling. You are now in your body. Don't get attached to any visual image.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 140"}, {"pdf_page_index": 140, "pdf_page_number": 141, "html": "<h4 class=\"pdf-subhead\">Creative Use Of Mind<\/h4>\n<p class=\"pdf-para\">If you need to use your mind for a specific purpose, use it in conjunction with your inner body. Only if you are able to be conscious without thought can you use your mind creatively, and the easiest way to enter that state is through your body. Whenever an answer, a solution, or a creative idea is needed, stop thinking for a moment by focusing attention on your inner energy field. Become aware of the stillness. When you resume thinking, it will be fresh and creative. In any thought activity, make it a habit to go back and forth every few minutes or so between thinking and an inner kind of listening,<\/p>\n<p class=\"pdf-para\">an inner stillness. We could say. don't just think with your head, think with your whole body.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 141"}, {"pdf_page_index": 141, "pdf_page_number": 142, "html": "<h4 class=\"pdf-subhead\">The Art Of Listening<\/h4>\n<p class=\"pdf-para\">When listening to another person, don't just listen with your mind, listen with your whole body. Feel the energy field of your inner body as you listen. That takes attention away from thinking and creates a still space that enables you to truly listen without the mind interfering. You are giving the other person space space to be. It is the most precious gift you can give. Most people don't know how to listen because the major part of their attention is taken up by thinking. They pay more attention to that than to what the other person is saying, and none at all to what really matters: the Being of the other person underneath the words and the mind. Of course, you cannot feel someone else's Being except through your own. This is the beginning of the realization of oneness, which is love. At the deepest level of Being, you are one with all that is.<\/p>\n<p class=\"pdf-para\">Most human relationships consist mainly of minds interacting with each other, not of human beings communicating, being in communion. No relationship can thrive in that way, and that is why there is so much conflict in relationships. When the mind is running your life, conflict, strife and problems are inevitable. Being in touch with your inner body creates a clear space of no-mind within which the relationship can flower.<\/p>", "images": [], "label": "Page 142"}, {"pdf_page_index": 142, "pdf_page_number": 143, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 143"}, {"pdf_page_index": 143, "pdf_page_number": 144, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 144"}, {"pdf_page_index": 144, "pdf_page_number": 145, "html": "<p class=\"pdf-para\">Chapter Seven<\/p>", "images": [], "label": "Page 145"}, {"pdf_page_index": 145, "pdf_page_number": 146, "html": "<h3 class=\"pdf-heading\">Chapter Seven<\/h3>\n<h3 class=\"pdf-heading\">Portals Into the Unmanifest<\/h3>\n", "images": [], "label": "Portals Into the Unmanifest"}, {"pdf_page_index": 146, "pdf_page_number": 147, "html": "<h4 class=\"pdf-subhead\">Going Deeply Into The Body<\/h4>\n<p class=\"pdf-para\">I can feel the energy inside my body, especially in my arms and legs, but I don't seem to be able to go more deeply, as you suggested earlier. Make it into a meditation. It needn't take long. Ten to fifteen minutes of clock time should be sufficient. Make sure first that there are no external distractions such as telephones or people who are likely to interrupt you. Sit on a chair, but don't lean back. Keep the spine erect. Doing so will help you to stay alert. Alternatively, choose your own favorite position for meditation.<\/p>\n<p class=\"pdf-para\">Make sure the body is relaxed. Close your eyes. Take a few deep breaths. Feel yourself breathing into the lower abdomen, as it were. Observe how it expands and contracts slightly with each in and out breath. Then become aware of the entire inner energy field of the body. Don't think about it feel it. By doing this, you reclaim consciousness from the mind. If you find it helpful, use the “light” visualization I described earlier.<\/p>\n<p class=\"pdf-para\">When you can feel the inner body clearly as a single field of energy, let go, if possible, of any visual image and focus exclusively on the feeling. If you can, also drop any mental image you may still have of the physical body. All that is left then is an all-encompassing sense of presence or “beingness,” and the inner body is felt to be without a boundary. Then take your attention even more deeply into that feeling. Become one with it. Merge with the energy field, so that there is no longer a perceived duality of the observer and the observed, of you and your body. The distinction between inner and outer also dissolves now, so there is no inner body anymore. By going deeply into the body, you have transcended the body. Stay in this realm of pure Being for as long as feels comfortable; then become aware again of the physical body, your breathing and physical senses, and open your eyes. Look at your surroundings for a few minutes in a meditative way that is, without labeling them mentally and continue to feel the inner body as you do so.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 147"}, {"pdf_page_index": 147, "pdf_page_number": 148, "html": "<p class=\"pdf-para\">Having access to that formless realm is truly liberating. It frees you from bondage to form and identification with form. It is life in its undifferentiated state prior to its fragmentation into multiplicity. We may call it the Unmanifested, the invisible Source of all things, the Being within all beings. It is a realm of deep stillness and peace, but also of joy and intense aliveness. Whenever you are present, you become “transparent” to some extent to the light, the pure consciousness that emanates from this Source. You also realize that the light is not separate from who you are but constitutes your very essence.<\/p>", "images": [], "label": "Page 148"}, {"pdf_page_index": 148, "pdf_page_number": 149, "html": "<h4 class=\"pdf-subhead\">The Source Of Chi<\/h4>\n<p class=\"pdf-para\">Is the Unmanifested what in the East is called chi, a kind of universal life energy?<\/p>\n<p class=\"pdf-para\">No, it isn't. The Unmanifested is the source of chi. Chi is the inner energy, field of your body. It is the bridge between the outer you and the Source. It lies halfway between the manifested, the world of form, and the Unmanifested. Chi can be likened to a river or an energy stream. If you take the focus of your consciousness deeply into the inner body, you are tracing the course of this river back to its Source. Chi is movement; the Unmanifested is stillness. When you reach a point of absolute stillness, which is nevertheless vibrant with life, you have gone beyond the inner body and beyond chi to the Source itself: the Unmanifested. Chi is the link between the Unmanifested and the physical universe.<\/p>\n<p class=\"pdf-para\">So if you take your attention deeply into the inner body, you may reach this point, this singularity, where the world dissolves into the Unmanifested and the Unmanifested takes on form as the energy stream of chi, which then becomes the world. This is the point of birth and death. When your consciousness is directed outward, mind and world arise. When it is directed inward, it realizes its own Source and returns home into the Unmanifested. Then, when your consciousness comes back to the manifested world, you reassume the form identity that you temporarily relinquished. You have a name, a past, a life situation, a future. But in one essential respect, you are not the same person you were before: You will have glimpsed a reality within yourself that is not “of this world,” although it isnt separate from it, just as it isn't separate from you.<\/p>\n<p class=\"pdf-para\">Now let your spiritual practice be this: As you go about your life, don't give 1oo percent of your attention to the external world and to your mind. Keep some within. I have spoken about this already. Feel tile inner body even when engaged in everyday activities, especially when engaged in relationships or when you are relating with nature. Feel the stillness deep inside it. Keep the portal open. It is quite possible to be conscious of the<\/p>", "images": [], "label": "Page 149"}, {"pdf_page_index": 149, "pdf_page_number": 150, "html": "<p class=\"pdf-para\">Unmanifested throughout your life. You feel it as a deep sense of peace somewhere in the background, a stillness that never leaves you, no matter what happens out here. You become a bridge between the Unmanifested and the manifested, between God and the world. This is the state of connectedness with the Source that we call enlightenment.<\/p>\n<p class=\"pdf-para\">Dont get the impression that the Unmanifested is separate from the manifested. How could it be? It is the life within every form, the inner essence of all that exists. It pervades this world. Let me explain.<\/p>", "images": [], "label": "Page 150"}, {"pdf_page_index": 150, "pdf_page_number": 151, "html": "<h4 class=\"pdf-subhead\">Dreamless Sleep<\/h4>\n<p class=\"pdf-para\">You take a journey into the Unmanifested every night when you enter the phase of deep dreamless sleep. You merge with the Source. You draw from it the vital energy that sustains you for a while when you return to the manifested, the world of separate forms. This energy is much more vital than food: “Man does not live by bread alone.” But in dreamless sleep, you don't go into it consciously. Although the bodily functions are still operating, “you” no longer exist in that state. Can you imagine what it would be like to go into dreamless sleep with full consciousness? It is impossible to imagine it, because that state has no content.<\/p>\n<p class=\"pdf-para\">The Unmanifested does not liberate you until you enter it consciously. Thats why Jesus did not say:. the truth will make you free, but rather: “You will know the truth, and the truth will make you free.” This is not a conceptual truth. It is the truth of eternal life beyond form, which is known directly or not at all. But don't attempt to stay conscious in dreamless sleep. It is highly unlikely that you will succeed. At most, you may remain conscious during the dream phase, but not beyond that. This is called lucid dreaming, which may be interesting and fascinating, but it is not liberating.<\/p>\n<p class=\"pdf-para\">So use your inner body as a portal through which you 134 enter the Unmanifested, and keep that portal open so that you stay connected with the Source at all times. It makes no difference, as far as the inner body is concerned, whether your outer physical body is old or young, frail or strong. The inner body is timeless. If you are not yet able to feel the inner body, use one of the other portals, although ultimately they are all one. Some I have spoken about at length already, but I'll mention them again briefly here.<\/p>", "images": [], "label": "Page 151"}, {"pdf_page_index": 151, "pdf_page_number": 152, "html": "<h4 class=\"pdf-subhead\">Other Portals<\/h4>\n<p class=\"pdf-para\">The Now can be seen as the main portal. It is an essential aspect of every other portal, including the inner body. You cannot be in your body without being intensely present in the Now.<\/p>\n<p class=\"pdf-para\">Time and the manifested are as inextricably linked as are the timeless Now and the Unmanifested. When you dissolve psychological time through intense present-moment awareness, you become conscious of the Unmanifested both directly and indirectly. Directly, you feel it as the radiance and power of your conscious presence no content, just presence. Indirectly, you are aware of the Unmanifested in and through the sensory realm. In other words, you feel the God-essence in every creature, every flower, every stone, and you realize: 'All that is, is holy.“ This is why Jesus, speaking entirely from his essence or Christ identity, says in the Gospel of Thomas: ”Split a piece of wood; I am there. Lift up a stone, and you will find me there.\"<\/p>\n<p class=\"pdf-para\">Another portal into the Unmanifested is created through the cessation of thinking. This can start with a very simple thing, such as taking one conscious breath or looking, in a state of intense alertness, at a flower, so that there is no mental commentary running at the same time. There are many ways to create a gap in the incessant stream of thought. This is what meditation is all about. Thought is part of the realm of the manifested. Continuous mind activity keeps you imprisoned in the world of form and becomes an opaque screen that prevents you from becoming conscious of the Unmanifested, conscious of the formless and timeless God- essence in yourself and in all things and all creatures. When you are intensely present, you don't need to be concerned about the cessation of thinking, of course, because the mind then stops automatically. Thats why I said the Now is an essential aspect of every other portal.<\/p>\n<p class=\"pdf-para\">Surrender the letting go of mental-emotional resistance to what is also becomes a portal into the Unmanifested. The reason for this is simple: inner resistance cuts you off from other people, from yourself, from the world<\/p>", "images": [], "label": "Page 152"}, {"pdf_page_index": 152, "pdf_page_number": 153, "html": "<p class=\"pdf-para\">around you. It strengthens the feeling of separateness on which the ego depends for its survival. The stronger the feeling of separateness, the more you are bound to the manifested, to the world of separate forms. The more you are bound to the world of form, the harder and more impenetrable your form identity becomes. The portal is closed, and you are cut off from the inner dimension, the dimension of depth. In the state of surrender, your form identity softens and becomes somewhat “transparent,” as it were, so the Unmanifested can shine through you.<\/p>\n<p class=\"pdf-para\">Its up to you to open a portal in your life that gives you conscious access to the Unmanifested. Get in touch with the energy field of the inner body, be intensely present, disidentify from the mind, surrender to what is; these are all portals you can use but you only need to use one.<\/p>\n<p class=\"pdf-para\">Surely love must also be one of those portals? No, it isn't. As soon as one of the portals is open, love is present in you as the “feeling-realization” of oneness. Love isn't a portal; ifs what comes through the portal into this world. As long as you are completely trapped in your form identity, there can be no love. Your task is not to search for love but to find a portal through which love can enter.<\/p>", "images": [], "label": "Page 153"}, {"pdf_page_index": 153, "pdf_page_number": 154, "html": "<h4 class=\"pdf-subhead\">Silence<\/h4>\n<p class=\"pdf-para\">Are there any other portals apart from those you just mentioned? Yes, there are. The Unmanifested is not separate from the manifested. It pervades this world, but it is so well disguised that almost everybody misses it completely. If you know where to look, you'll find it everywhere. A portal opens up every moment.<\/p>\n<p class=\"pdf-para\">Do you hear that dog barking in the distance? Or that car passing by? Listen carefully. Can you feel the presence of the Unmanifested in that? You cant? Look for it in the silence out of which the sounds come and into which they return. Pay more attention to the silence than to the sounds. Paying attention to outer silence creates inner silence: the mind becomes still. A portal is opening up.<\/p>\n<p class=\"pdf-para\">Every sound is born out of silence, dies back into silence, and during its life span is surrounded by silence. Silence enables the sound to be. It is an intrinsic but unmanifested part 0fevery sound, every musical note, every song, every word. The Unmanifested is present in this world as silence. This is why it has been said that nothing in this world is so like God as silence. All you have to do is pay attention to it. Even during a conversation, become conscious of the gaps between words, the brief silent intervals between sentences. As you do that, the dimension of stillness grows within you. You cannot pay attention to silence without simultaneously becoming still within. Silence without, stillness within. You have entered the Unmanifested.<\/p>", "images": [], "label": "Page 154"}, {"pdf_page_index": 154, "pdf_page_number": 155, "html": "<h4 class=\"pdf-subhead\">Space<\/h4>\n<p class=\"pdf-para\">Just as no sound can exist without silence, nothing can exist without nothing, without the empty space that enables it to be. Every physical object or body has come out of nothing, is surrounded by nothing, and will eventually return to nothing. Not only that, but even inside every physical body there is far more “nothing” than “something.” Physicists tell us that the solidity of matter is an illusion. Even seemingly solid matter, including your physical body, is nearly 100 percent empty space so vast are the distances between the atoms compared to their size. What is more, even inside every atom there is mostly empty space. What is left is more like a vibrational frequency than particles of solid matter, more like a musical note. Buddhists have known that for over 2,500 years. “Form is emptiness, emptiness is form,” states the Heart Sutra, one of the best known ancient Buddhist texts. The essence of all things is emptiness.<\/p>\n<p class=\"pdf-para\">The Unmanifested is not only present in this world as silence; it also pervades the entire physical universe as space from within and without. This is just as easy to miss as silence. Everybody pays attention to the things in space, but who pays attention to space itself?<\/p>\n<p class=\"pdf-para\">You seem to be implying that “emptiness” or “nothing” is not just nothing, that there is some mysterious quality to it. What is this nothing?<\/p>\n<p class=\"pdf-para\">You cannot ask such a question. Your mind is trying to make nothing into something. The moment you make it into something, you have missed it. Nothing space is the appearance of the Unmanifested as an externalized phenomenon in a sense-perceived world. Thats about as much as one can say about it, and even that is a kind of paradox. It cannot become an object of knowledge. You can't do a Ph.D. on “nothing.” When scientists study space, they usually make it into something and thereby miss its essence entirely. Not surprisingly, the latest theory is that space isn't empty at all, that it is filled with some substance. Once you have a theory, ifs not too hard to find evidence to substantiate it, at least until some other theory comes along.<\/p>", "images": [], "label": "Page 155"}, {"pdf_page_index": 155, "pdf_page_number": 156, "html": "<p class=\"pdf-para\">“Nothing” can only become a portal into the Unmanifested for you if you don't try to grasp or understand it.<\/p>\n<p class=\"pdf-para\">Isn't that what we are doing here ? Not at all. I am giving you pointers to show you how you can bring the dimension of the Unmanifested into your life. We are not trying to understand it. There is nothing to understand.<\/p>\n<p class=\"pdf-para\">Space has no “existence.” “To exist” literally means “to stand out.” You cannot understand space because it doesn't standout. Although in itself it has no existence, it enables everything else to exist. Silence has no existence either, nor does the Unmanifested.<\/p>\n<p class=\"pdf-para\">So what happens if you withdraw attention from the objects in space and become aware of space itself.&gt; What is the essence of this room? The furniture, pictures, and so on are in the room, but they are not the room. The floor, walls, and ceiling define the boundary of the room, but they are not the room either. So what is the essence of the room? Space, of course, empty space. There would be no “room” without it.<\/p>\n<p class=\"pdf-para\">Since space is “nothing,” we can say that what is not there is more important than what is there. So become aware of the space that is all around you. Don't think about it. Feel it, as it were. Pay attention to “nothing.”<\/p>\n<p class=\"pdf-para\">As you do that, a shift in consciousness takes place inside you. Here is why. The inner equivalent to objects in space such as furniture, walls, and so on are your mind objects: thoughts, emotions, and the objects of the senses. And the inner equivalent of space is the consciousness that enables your mind objects to be, just as space allows all things to be. So if you withdraw attention from things objects in space you automatically withdraw attention from your mind objects as well. In other words: You cannot think and be aware of space or of silence, for that matter. By becoming aware of the empty space around you, you simultaneously become aware of the space of no-mind, of pure consciousness: the Unmanifested. This is how the contemplation of space can become a portal for you.<\/p>\n<p class=\"pdf-para\">Space and silence are two aspects of the same thing, the same nothing. They are an externalization of inner space and inner silence, which is stillness: the infinitely creative womb of all existence. Most humans are completely unconscious of this dimension. There is no inner space, no stillness. They are out of balance. In other words, they know the world, or think they do, but they dont know God. They identify exclusively with their<\/p>", "images": [], "label": "Page 156"}, {"pdf_page_index": 156, "pdf_page_number": 157, "html": "<p class=\"pdf-para\">own physical and psychological form, unconscious of essence. And because every form is highly unstable, they live in fear. This fear causes a deep misperception of themselves and of other humans, a distortion in their vision of the world.<\/p>\n<p class=\"pdf-para\">If some cosmic convulsion brought about the end of our world, the Unmanifested would remain totally unaffected by this. A Course in Miracles expresses this truth poignantly. “Nothing real can be threatened. Nothing unreal exists. Herein lies the peace of God.”<\/p>\n<p class=\"pdf-para\">If you remain in conscious connection with the Unmanifested, you value, love, and deeply respect the manifested and every life form in it as an expression of the One Life beyond form. You also know that every form is destined to dissolve again and that ultimately nothing out here matters all that much. You have “overcome the world,” in the words of Jesus, or, as the Buddha put it, you have “crossed over to the other shore.”<\/p>", "images": [], "label": "Page 157"}, {"pdf_page_index": 157, "pdf_page_number": 158, "html": "<h4 class=\"pdf-subhead\">The True Nature Of Space And Time<\/h4>\n<p class=\"pdf-para\">Now consider this: If there were nothing but silence, it wouldn't exist for you; you wouldn't know what it is. Only when sound appears does silence come into being. Similarly, if there were only space without any objects in space, it wouldn't exist for you. Imagine yourself as a point of consciousness floating in the vastness of space no stars, no galaxies, just emptiness. Suddenly, space wouldn't be vast anymore; it would not be there at all. There would be no speed, no movement from here to there. At least two points of reference are needed for distance and space to come into being. Space comes into being the moment the One becomes two, and as “two” become the “ten thousand things,” as Lao Tse calls the manifested world, space becomes more and more vast. So world and space arise simultaneously.<\/p>\n<p class=\"pdf-para\">Nothing could be without space, yet space is nothing. Before the universe came into being, before the “big bang” if you like, there wasn't a vast empty space waiting to be filled. There was no space, as there was no thing. There was only the Unmanifested the One. When the One became “the ten thousand things,” suddenly space seemed to be there and enabled the many to be. Where did it come from? Was it created by God to accommodate the universe? Of course not. Space is no-thing, so it was never created.<\/p>\n<p class=\"pdf-para\">Go out on a clear night and look up at the sky. The thousands of stars you can see with the naked eye are no more than an infinitesimal fraction of what is there. Over 100 billion galaxies can already be detected with the most powerful telescopes, each galaxy an “island universe” with billions of stars. Yet what is even more awe-inspiring is the infinity of space itself, the depth and stillness that allows all of that magnificence to be. Nothing could be more awe- inspiring and majestic than the inconceivable vastness and stillness of space, and yet what is it? Emptiness, vast emptiness.<\/p>\n<p class=\"pdf-para\">What appears to us as space in our universe perceived through the mind and the senses is the Unmanifested itself, externalized. It is the “body” of<\/p>", "images": [], "label": "Page 158"}, {"pdf_page_index": 158, "pdf_page_number": 159, "html": "<p class=\"pdf-para\">God. And the greatest miracle is this: That stillness and vastness that enables the universe to be, is not just out there in space it is also within you. When you are utterly and totally present, you encounter it as the still inner space of no-mind. Within you, it is vast in depth, not in extension. Spacial extension is ultimately a misperception of infinite depth an attribute of the one transcendental reality.<\/p>\n<p class=\"pdf-para\">According to Einstein, space and time are not separate. I don't really understand it, but I think he is saying that time is the fourth dimension of space. He calls it the “space-time continuum. ”<\/p>\n<p class=\"pdf-para\">Yes. What you perceive externally as space and time are ultimately illusory, but they contain a core of truth. They are the two essential attributes of God, infinity and eternity, perceived as if they had an external existence outside you. Within you, both space and time have an inner equivalent that reveals their true nature, as well as your own. Whereas space is the still, infinitely deep realm of no-mind, the inner equivalent of time is presence, awareness of the eternal Now. Remember that there is no distinction between them. When space and time are realized within as the Unmanifested no-mind and presence external space and time continue to exist for you, but they become much less important. The world, too, continues to exist for you, but it will not bind you anymore.<\/p>\n<p class=\"pdf-para\">Hence, the ultimate purpose of the world lies not within the world but in transcendence of the world. Just as you would not be conscious of space if there were no objects in space, the world is needed for the Unmanifested to be realized. You may have heard the Buddhist saying: “If there were no illusion, there would be no enlightenment.” It is through the world and ultimately through you that the Unmanifested knows itself. You are here to enable the divine purpose of the universe to unfold. That is how important you are!<\/p>", "images": [], "label": "Page 159"}, {"pdf_page_index": 159, "pdf_page_number": 160, "html": "<h4 class=\"pdf-subhead\">Conscious Death<\/h4>\n<p class=\"pdf-para\">Apart from dreamless sleep, which I mentioned already, there is one other involuntary portal. It opens up briefly at the time of physical death. Even if you have missed all the other opportunities for spiritual realization during your lifetime, one last portal will open up for you immediately after the body has died.<\/p>\n<p class=\"pdf-para\">There are countless accounts by people who had a visual impression of this portal as radiant light and then returned from what is commonly known as a near-death experience. Many of them also spoke of a sense of blissful serenity and deep peace. In the Tibetan Book of the Dead, it is described as “the luminous splendor of the colorless light of Emptiness,” which it says is “your own true self.” This portal opens up only very briefly, and unless you have already encountered the dimension of the Unmanifested in your lifetime, you will likely miss it. Most people carry too much residual resistance, too much fear, too much attachment to sensory experience, too much identification with the manifested world. So they see the portal, turn away in fear, and then lose consciousness. Most of what happens after that is involuntary and automatic. Eventually, there will be another round of birth and death. Their presence wasn't strong enough yet for conscious immortality. So going through this portal does not mean annihilation?<\/p>\n<p class=\"pdf-para\">As with all the other portals, your radiant true nature remains, but not the personality. In any case, whatever is real or of true value in your personality is your true nature shining through. This is never lost. Nothing that is of value, nothing that is real, is ever lost. Approaching death and death itself, the dissolution of the physical form, is always a great opportunity for spiritual realization. This opportunity is tragically missed most of the time, since we live in a culture that is almost totally ignorant of death, as it is almost totally ignorant of anything that truly matters.<\/p>\n<p class=\"pdf-para\">Every portal is a portal of death, the death of the false self. When you go through it, you cease to derive your identity from your psychological, mind-made form. You then realize that death is an illusion, just as your<\/p>", "images": [], "label": "Page 160"}, {"pdf_page_index": 160, "pdf_page_number": 161, "html": "<p class=\"pdf-para\">identification with form was an illusion. The end of illusion thats all that death is. It is painful only as long as you ding to illusion.<\/p>", "images": [], "label": "Page 161"}, {"pdf_page_index": 161, "pdf_page_number": 162, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 162"}, {"pdf_page_index": 162, "pdf_page_number": 163, "html": "<p class=\"pdf-para\" style=\"text-align:center;color:#8a7f6a;\">·<\/p>", "images": [], "label": "Page 163"}, {"pdf_page_index": 163, "pdf_page_number": 164, "html": "<p class=\"pdf-para\">Chapter Eight<\/p>", "images": [], "label": "Page 164"}, {"pdf_page_index": 164, "pdf_page_number": 165, "html": "<h3 class=\"pdf-heading\">Chapter Eight<\/h3>\n<h3 class=\"pdf-heading\">Enlightened Relationships<\/h3>\n", "images": [], "label": "Enlightened Relationships"}, {"pdf_page_index": 165, "pdf_page_number": 166, "html": "<h4 class=\"pdf-subhead\">Enter The Now From Wherever You Are<\/h4>\n<p class=\"pdf-para\">I always thought that true enlightenment is not possible except through love in a relationship between a man and a woman. Isn't this what makes us whole again? How can one's life be fulfilled until that happens?<\/p>\n<p class=\"pdf-para\">Is that true in your experience? Has this happened to you? Not yet, but how could it be otherwise? I know that it will happen. In other words, you are waiting for an event in time to save you. Is this not the core error that we have been talking about?<\/p>\n<p class=\"pdf-para\">Salvation is not elsewhere in place or time. It is here and now. What does that statement mean, “salvation is here and now”? I don't understand it. I don't even know what salvation means.<\/p>\n<p class=\"pdf-para\">Most people pursue physical pleasures or various forms of psychological gratification because they believe that those things will make them happy or free them from a feeling of fear or lack. Happiness may be perceived as a heightened sense of aliveness attained through physical pleasure, or a more secure and more complete sense of self attained through some form of psychological gratification. This is the search for salvation from a state of unsatisfactoriness or insufficiency. Invariably, any satisfaction that they obtain is short-lived, so the condition of satisfaction or fulfillment is usually projected once again onto an imaginary point away from the here and now. “When I obtain this or am free of that then I will be okay.” This is the unconscious mind-set that creates the illusion of salvation in the future.<\/p>\n<p class=\"pdf-para\">True salvation is fulfillment, peace, life in all its fullness. It is to be who you are, to feel within you the good that has no opposite, the joy of Being that depends on nothing outside itself. It is felt not as a passing experience but as an abiding presence. In theistic language, it is to “know God” not as something outside you but as your own innermost essence. True salvation is to know yourself as an inseparable part of the timeless and formless One Life from which all that exists derives its being. True salvation is a state of<\/p>", "images": [], "label": "Page 166"}, {"pdf_page_index": 166, "pdf_page_number": 167, "html": "<p class=\"pdf-para\">freedom from fear, from suffering, from a perceived state of lack and insufficiency and therefore from all wanting, needing, grasping, and dinging. It is freedom from compulsive thinking, from negativity, and above all from past and future as a psychological need. Your mind is telling you that you cannot get there from here. Something needs to happen, or you need to become this or that before you can be free and fulfilled. It is saying, in fact, that you need time that you need to find, sort out, do, achieve, acquire, become, or understand something before you can be free or complete. You see time as the means to salvation, whereas in truth it is the greatest obstacle to salvation. You think that you can't get there from where and who you are at this moment because you are not yet complete or good enough, but the truth is that here and now is the only point from where you can get there. You \"get' there by realizing that you are there already. You find God the moment you realize that you don't need to seek God. So there is no only way to salvation: Any condition can be used, but no particular condition is needed. However, there is only one point of access: the Now: There can be no salvation away from this moment. You are lonely and without a partner? Enter the Now from there. You are in a relationship? Enter the Now from there.<\/p>\n<p class=\"pdf-para\">There is nothing you can ever do or attain that will get you closer to salvation than it is at this moment. This may be hard to grasp for a mind accustomed to thinking that everything worthwhile is in the future. Nor can anything that you ever did or that was done to you in the past prevent you from saying yes to what is and taking your attention deeply into the Now. You cannot do this in the future. You do it now or not at all.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 167"}, {"pdf_page_index": 167, "pdf_page_number": 168, "html": "<h4 class=\"pdf-subhead\">Love/Hate Relationships<\/h4>\n<p class=\"pdf-para\">Unless and until you access the consciousness frequency of presence, all relationships, and particularly intimate relationships, are deeply flawed and ultimately dysfunctional.<\/p>\n<p class=\"pdf-para\">They may seem perfect for a while, such as when you are “in love,” but invariably that apparent perfection gets disrupted as arguments, conflicts, dissatisfaction, and emotional or even physical violence occur with increasing frequency. It seems that most “love relationships” become love/hate relationships before long. Love can then turn into savage attack, feelings of hostility, or complete withdrawal of affection at the flick of a switch. This is considered normal. The relationship then oscillates for a while, a few months or a few years, between the polarities of “love” and hate, and it gives you as much pleasure as it gives you pain. It is not uncommon for couples to become addicted to those cycles. Their drama makes them feel alive. When a balance between the positive/negative polarities is lost and the negative, destructive cycles occur with increasing frequency and intensity, which tends to happen sooner or later, then it will not be long before the relationship finally collapses.<\/p>\n<p class=\"pdf-para\">It may appear that if you could only eliminate the negative or destructive cycles, then all would be well and the relationship would flower beautifully but alas, this is not possible. The polarities are mutually interdependent. You cannot have one without the other. The positive already contains within itself the as yet unmanifested negative. Both are in fact different aspects of the same dysfunction. I am speaking here of what is commonly called romantic relationships not of true love, which has no opposite because it arises from beyond the mind. Love as a continuous state is as yet very rare as rare as conscious human beings. Brief and elusive glimpses of love, however, are possible whenever there is a gap in the stream of mind.<\/p>\n<p class=\"pdf-para\">The negative side of a relationship is, of course, more easily recognizable as dysfunctional than the positive one. And it is also easier to<\/p>", "images": [], "label": "Page 168"}, {"pdf_page_index": 168, "pdf_page_number": 169, "html": "<p class=\"pdf-para\">recognize the source of negativity in your partner than to see it in yourself. It can manifest in many forms: possessiveness, jealousy, control, withdrawal and unspoken resentment, the need to be right, insensitivity and self-absorption, emotional demands and manipulation, the urge to argue, criticize, judge, blame, or attack, anger, unconscious revenge for past pain inflicted by a parent, rage and physical violence.<\/p>\n<p class=\"pdf-para\">On the positive side, you are “in love” with your partner. This is at first a deeply satisfying state. You feel intensely alive. Your existence has suddenly become meaningful because someone needs you, wants you, and makes you feel special, and you do the same for him or her. When you are together, you feel whole. The feeling can become so intense that the rest of the world fades into insignificance. However, you may also have noticed that there is a neediness and a clinging quality to that intensity. You become addicted to the other person. He or she acts on you like a drug. You are on a high when the drug is available, but even the possibility or the thought that he or she might no longer be there for you can lead to jealousy, possessiveness, attempts at manipulation through emotional blackmail, blaming and accusing fear of loss. If the other person does leave you, this can give rise to the most intense hostility or the most profound grief and despair. In an instant, loving tenderness can turn into a savage attack or dreadful grief. Where is the love now? Can love change into its opposite in an instant? Was it love in the first place, or just an addictive grasping and clinging?<\/p>", "images": [], "label": "Page 169"}, {"pdf_page_index": 169, "pdf_page_number": 170, "html": "<h4 class=\"pdf-subhead\">Addiction And The Search For Wholeness<\/h4>\n<p class=\"pdf-para\">Why should we become addicted to another person? The reason why the romantic love relationship is such an intense and universally sought-after experience is that it seems to offer liberation from a deep-seated state of fear, need, lack, and incompleteness that is part of the human condition in its unredeemed and unenlightened state. There is a physical as well as a psychological dimension to this state.<\/p>\n<p class=\"pdf-para\">On the physical level, you are obviously not whole, nor will you ever be: You are either a man or a woman, which is to say, one-half of the whole. On this level, the longing for wholeness the return to oneness manifests as male- female attraction, man's need for a woman, woman's need for a man. It is an almost irresistible urge for union with the opposite energy polarity. The root of this physical urge is a spiritual one: the longing for an end to duality, a return to the state of wholeness. Sexual union is the closest you can get to this state on the physical level. This is why it is the most deeply satisfying experience the physical realm can offer. But sexual union is no more than a fleeting glimpse of wholeness, an instant of bliss. As long as it is unconsciously sought as a means of salvation, you are seeking the end of duality on the level of form, where it cannot be found. You are given a tantalizing glimpse of heaven, but you are not allowed to dwell there, and find yourself again in a separate body.<\/p>\n<p class=\"pdf-para\">On the psychological level, the sense of lack and incompleteness is, if anything, even greater than on the physical level. As long as you are identified with the mind, you have an externally derived sense of self. That is to say, you get your sense of who you are from things that ultimately have nothing to do with who you are: your social role, possessions, external appearance, successes and failures,<\/p>\n<p class=\"pdf-para\">belief systems, and so on. This false, mind-made self, the ego, feels vulnerable, insecure, and is always seeking new things to identify with to<\/p>", "images": [], "label": "Page 170"}, {"pdf_page_index": 170, "pdf_page_number": 171, "html": "<p class=\"pdf-para\">give it a feeling that it exists. But nothing is ever enough to give it lasting fulfillment. Its fear remains; its sense of lack and neediness remains.<\/p>\n<p class=\"pdf-para\">But then that special relationship comes along. It seems to be the answer to all the ego's problems and to meet all its needs. At least this is how it appears at first. All the other things that you derived your sense of self from before, now become relatively insignificant. You now have a single focal point that replaces them all, gives meaning to your life, and through which you define your identity: the person you are “in love” with. You are no longer a disconnected fragment in an uncaring universe, or so it seems. Your world now has a center: the loved one. The fact that the center is outside you and that, therefore, you still have an externally derived sense of self does not seem to matter at first. What matters is that the underlying feelings of incompleteness, of fear, lack and unfulfillment so characteristic of the egoic state are no longer there or are they? Have they dissolved, or do they continue to exist underneath the happy surface reality?<\/p>\n<p class=\"pdf-para\">If in your relationships you experience both “love” and the opposite of love attack, emotional violence, and so on then it is likely that you are confusing ego attachment and addictive clinging with love. You cannot love your partner one moment and attack him or her the next. True love has no opposite. If your “love” has an opposite, then it is not love but a strong ego- need for a more complete and deeper sense of self, a need that the other person temporarily meets. It is the ego's substitute for salvation, and for a short time it almost does feel like salvation.<\/p>\n<p class=\"pdf-para\">But there comes a point when your partner behaves in ways that fail to meet your needs, or rather those of your ego. The feelings of fear, pain, and lack that are an intrinsic part of egoic consciousness but had been covered up by the “love relationship” now resurface. Just as with every other addiction, you are on a high when the drug is available, but invariably there comes a time when the drug no longer works for you. When those painful feelings reappear, you feel them even more strongly than before, and what is more, you now perceive your partner as the cause of those feelings. This means that you project them outward and attack the other with all the savage violence that is part of your pain. This attack may awaken the partner's own pain, and he or she may counter your attack. At this point, the ego is still unconsciously hoping that its attack or its attempts at manipulation will be sufficient punishment to induce your partner to change their behavior, so that it can use them again as a cover-up for your pain.<\/p>", "images": [], "label": "Page 171"}, {"pdf_page_index": 171, "pdf_page_number": 172, "html": "<p class=\"pdf-para\">Every addiction arises from an unconscious refusal to face and move through your own pain. Every addiction starts with pain and ends with pain. Whatever the substance you are addicted to alcohol, food, legal or illegal drugs, or a person you are using something or somebody to cover up your pain. That is why, after the initial euphoria has passed, there is so much unhappiness, so much pain in intimate relationships. They do not cause pain and unhappiness. They bring out the pain and unhappiness that is already in you. Every addiction does that. Every addiction reaches a point where it does not work for you anymore, and then you feel the pain more intensely than ever. This is one reason why most people are always trying to escape from the present moment and are seeking some kind of salvation in the future, The first thing that they might encounter if they focused their attention on the Now is their own pain, and this is what they fear. If they only knew how easy it is to access in the Now the power of presence that dissolves the past and its pain, the reality that dissolves the illusion. If they only knew how close they are to their own reality, how dose to God.<\/p>\n<p class=\"pdf-para\">Avoidance of relationships in an attempt to avoid pain is not the answer either. The pain is there anyway. Three failed relationships in as many years are more likely to force you into awakening than three years on a desert island or shut away in your room. But if you could bring intense presence into your aloneness, that would work for you too.<\/p>\n<p class=\"pdf-para\">¤<\/p>", "images": [], "label": "Page 172"}, {"pdf_page_index": 172, "pdf_page_number": 173, "html": "<h4 class=\"pdf-subhead\">From Addictive To Enlightened Relationships<\/h4>\n<p class=\"pdf-para\">Can we change an addictive relationship into a true one ? Yes. Being present and intensifying your presence by taking your attention ever more deeply into the Now:. Whether you are living alone or with a partner, this remains the key. For love to flourish, the light of your presence needs to be strong enough so that you no longer get taken over by the thinker or the pain-body and mistake them for who you are. To know yourself as the Being underneath the thinker, the stillness underneath the mental noise, the love and joy underneath the pain, is freedom, salvation, enlightenment. To disidentify from the pain-body is to bring presence into the pain and thus transmute it. To disidentify from thinking is to be the silent watcher of your thoughts and behavior, especially the repetitive patterns of your mind and the roles played by the ego.<\/p>\n<p class=\"pdf-para\">If you stop investing it with “selfness,” the mind loses its compulsive quality, which basically is the compulsion to judge, and so to resist what is, which creates conflict, drama, and new pain. In fact, the moment that judgment stops through acceptance of what is, you are free of the mind. You have made room for love, for joy, for peace. First you stop judging yourself; then you stop judging your partner. The greatest catalyst for change in a relationship is complete acceptance of your partner as he or she is, without needing to judge or change them in any way. That immediately takes you beyond ego. All mind games and all addictive clinging are then over. There are no victims and no perpetrators anymore, no accuser and accused. This is also the end of all codependency, of being drawn into somebody else's unconscious pattern and thereby enabling it to continue. You will then either separate in love or move ever more deeply into the Now together into Being. Can it be that simple? Yes, it is that simple.<\/p>\n<p class=\"pdf-para\">Love is a state of Being. Your love is not outside; it is deep within you. You can never lose it, and it cannot leave you. It is not dependent on some other body, some external form. In the stillness of your presence, you can<\/p>", "images": [], "label": "Page 173"}, {"pdf_page_index": 173, "pdf_page_number": 174, "html": "<p class=\"pdf-para\">feel your own formless and timeless reality as the unmanifested life that animates your physical form. You can then feel the same life deep within every other human and every other creature. You look beyond the veil of form and separation. This is the realization of oneness. This is love.<\/p>\n<p class=\"pdf-para\">What is God? The eternal One Life underneath all the forms of life. What is love? To feel the presence of that One Life deep within yourself and within all creatures. To be it. Therefore, all love is the love of God. ¤<\/p>\n<p class=\"pdf-para\">Love is not selective, just as the light of the sun is not selective. It does not make one person special. It is not exclusive. Exclusivity is not the love of God but the “love” of ego. However, the intensity with which true love is felt can vary. There may be one person who reflects your love back to you more clearly and more intensely than others, and if that person feels the same toward you, it can be said that you are in a love relationship with him or her. The bond that connects you with that person is the same bond that connects you with the person sitting next to you on a bus, or with a bird, a tree, a flower. Only the degree of intensity with which it is felt differs.<\/p>\n<p class=\"pdf-para\">Even in an otherwise addictive relationship, there may be moments when something more real shines through, something beyond your mutual addictive needs. These are moments when both your and your partner's mind briefly subside and the pain-body is temporarily in a dormant state. This may sometimes happen during physical intimacy, or when you are both witnessing the miracle of childbirth, or in the presence of death, or when one of you is seriously ill anything that renders the mind powerless. When this happens,<\/p>\n<p class=\"pdf-para\">your Being, which is usually buried underneath the mind, becomes revealed, and it is this that makes true communication possible.<\/p>\n<p class=\"pdf-para\">True communication is communion the realization of oneness, which is love. Usually, this is quickly lost again, unless you are able to stay present enough to keep out the mind and its old patterns. As soon as the mind and mind identification return, you are no longer yourself but a mental image of yourself, and you start playing games and roles again to get your ego needs met. You are a human mind again, pretending to be a human being, interacting with another mind, playing a drama called “love.” Although brief glimpses are possible, love cannot flourish unless you are permanently free of mind identification and your presence is intense enough to have dissolved the pain-body or you can at least remain present as the watcher.<\/p>", "images": [], "label": "Page 174"}, {"pdf_page_index": 174, "pdf_page_number": 175, "html": "<p class=\"pdf-para\">The pain-body cannot then take you over and so become destructive of love.<\/p>", "images": [], "label": "Page 175"}, {"pdf_page_index": 175, "pdf_page_number": 176, "html": "<h4 class=\"pdf-subhead\">Relationships As Spiritual Practice<\/h4>\n<p class=\"pdf-para\">As the egoic mode of consciousness and all the social, political, and economic structures that it created enter the final stage of collapse, the relationships between men and women reflect the deep state of crisis in which humanity now finds itself. As humans have become increasingly identified with their mind, most relationships are not rooted in Being and so turn into a source of pain and become dominated by problems and conflict.<\/p>\n<p class=\"pdf-para\">Millions are now living alone or as single parents, unable to establish an intimate relationship or unwilling to repeat the insane drama of past relationships. Others go from one relationship to another, from one pleasure-and-pain cycle to another, in search of the elusive goal of fulfillment through union with the opposite energy polarity. Still others compromise and continue to be together in a dysfunctional relationship in which negativity prevails, for the sake of the children or security, through force of habit, fear of being alone, or some other mutually “beneficial” arrangement, or even through the unconscious addiction to the excitement of emotional drama and pain.<\/p>\n<p class=\"pdf-para\">However, every crisis represents not only danger but also opportunity. If relationships energize and magnify egoic mind patterns and activate the pain-body, as they do at this time, why not accept this fact rather than try to escape from it? Why not cooperate with it instead of avoiding relationships or continuing to pursue the phantom of an ideal partner as an answer to your problems or a means of felling fulfilled? The opportunity that is concealed within every crisis does not manifest until all the facts of any given situation are acknowledged and fully accepted. As long as you deny them, as long as you try to escape from them or wish that things were different, the window of opportunity does not open up, and you remain trapped inside that situation, which will remain the same or deteriorate further.<\/p>", "images": [], "label": "Page 176"}, {"pdf_page_index": 176, "pdf_page_number": 177, "html": "<p class=\"pdf-para\">With the acknowledgment and acceptance of the facts also comes a degree of freedom from them. For example, when you know there is disharmony and you hold that “knowing,” through your knowing a new factor has come in, and the disharmony cannot remain unchanged. When you know you are not at peace, your knowing creates a still space that surrounds your nonpeace in a loving and tender embrace and then transmutes your nonpeace into peace. As far as inner transformation is concerned, there is nothing you can do about it. You cannot transform yourself, and you certainly cannot transform your partner or anybody else. All you can do is create a space for transformation to happen, for grace and love to enter.<\/p>\n<p class=\"pdf-para\">¤ So whenever your relationship is not working, whenever it brings out the “madness” in you and in your partner, be glad. What was unconscious is being brought up to the light. It is an opportunity for salvation. Every moment, hold the knowing of that moment, particularly of your inner state. If there is anger, know that there is anger. If there is jealousy, defensiveness, the urge to argue, the need to be right, an inner child demanding love and attention, or emotional pain of any kind whatever it is, know the reality of that moment and hold the knowing. The relationship then becomes your sadhana, your spiritual practice. If you observe unconscious behavior in your partner, hold it in the loving embrace of your knowing so that you won't react. Unconsciousness and knowing cannot coexist for long even if the knowing is only in the other person and not in the one who is acting out the unconsciousness. The energy form that lies behind hostility and attack finds the presence of love absolutely intolerable. If you react at all to your partner's unconsciousness, you become unconscious yourself. But if you then remember to know your reaction, nothing is lost.<\/p>\n<p class=\"pdf-para\">Humanity is under great pressure to evolve because it is our only chance of survival as a race. This will affect every aspect of your life and close relationships in particular. Never before have relationships been as problematic and conflict ridden as they are now. As you may have noticed, they are not here to make you happy or fulfilled. If you continue to pursue the goal of salvation through a relationship, you will be disillusioned again and again. But if you accept that the relationship is here to make you conscious instead of happy, then the relationship will offer you salvation, and you will be aligning yourself with the higher consciousness that wants<\/p>", "images": [], "label": "Page 177"}, {"pdf_page_index": 177, "pdf_page_number": 178, "html": "<p class=\"pdf-para\">to be born into this world. For those who hold on to the old patterns, there will be increasing pain, violence, confusion, and madness.<\/p>\n<p class=\"pdf-para\">I suppose that it takes two to make a relationship into a spiritual practice, as you suggest. For example, my partner is still acting out his old patterns of jealousy and control. I have pointed this out many times, but he is unable to see it.<\/p>\n<p class=\"pdf-para\">How many people does it take to make your life into a spiritual practice? Never mind if your partner will not cooperate. Sanity consciousness can only come into this world through you. You do not need to wait for the world to become sane, or for somebody else to become conscious, before you can be enlightened. You may wait forever. Do not accuse each other of being unconscious. The moment you start to argue, you have identified with a mental position and are now defending not only that position but also your sense of self. The ego is in charge. You have become unconscious. At times, it may be appropriate to point out certain aspects of your partner's behavior. If you are very alert, very present, you can do so without ego involvement without blaming, accusing, or making the other wrong.<\/p>\n<p class=\"pdf-para\">When your partner behaves unconsciously, relinquish all judgment. Judgment is either to confuse someone's unconscious behavior with who they are or to project your own unconsciousness onto another person and mistake that for who they are. To relinquish judgment does not mean that you do not recognize dysfunction and unconsciousness when you see it. It means “being the knowing” rather than “being the reaction” and the judge. You will then either be totally free of reaction or you may react and still be the knowing, the space in which the reaction is watched and allowed to be. Instead of fighting the darkness, you bring in the light. Instead of reacting to delusion, you see the delusion yet at the same time look through it. Being the knowing creates a clear space of loving presence that allows all things and all people to be as they are. No greater catalyst for transformation exists. If you practice this, your partner cannot stay with you and remain unconscious.<\/p>\n<p class=\"pdf-para\">If you both agree that the relationship will be your spiritual practice, so much the better. You can then express your thoughts and feelings to each other as soon as they occur, or as soon as a reaction comes up, so that you do not create a time gap in which an unexpressed or unacknowledged emotion or grievance can fester and grow. Learn to give expression to what<\/p>", "images": [], "label": "Page 178"}, {"pdf_page_index": 178, "pdf_page_number": 179, "html": "<p class=\"pdf-para\">you feel without blaming. Learn to listen to your partner in an open, nondefensive way. Give your partner space for expressing himself or herself. Be present. Accusing, defending, attacking all those patterns that are designed to strengthen or protect the ego or to get its needs met will then become redundant. Giving space to others and to yourself is vital. Love cannot flourish without it. When you have removed the two factors that are destructive of relationships: When the pain-body has been transmuted and you are no longer identified with mind and mental positions, and if your partner has done the same, you will experience the bliss of the flowering of relationship. Instead of mirroring to each other your pain and your unconsciousness, instead of satisfying your mutual addictive ego needs, you will reflect back to each other the love that you feel deep within, the love that comes with the realization of your oneness with all that is. This is the love that has no opposite.<\/p>\n<p class=\"pdf-para\">If your partner is still identified with the mind and the pain-body while you are already free, this will represent a major challenge not to you but to your partner. It is not easy to live with an enlightened person, or rather it is so easy that the ego finds it extremely threatening. Remember that the ego needs problems, conflict, and “enemies” to strengthen the sense of separateness on which its identity depends. The unenlightened partner's mind will be deeply frustrated because its fixed positions are not resisted, which means they will become shaky and weak, and there is even the “danger” that they may collapse altogether, resulting in loss of self. The pain-body is demanding feedback and not getting it. The need for argument, drama, and conflict is not being met. But beware: Some people who are unresponsive, withdrawn, insensitive, or cut off from their feelings may think and try to convince others that they are enlightened, or at least that there is “nothing wrong” with them and everything wrong with their partner. Men tend to do that more than women. They may see their female partners as irrational or emotional. But if you can feel your emotions, you are not far from the radiant inner body just underneath. If you are mainly in your head, the distance is much greater, and you need to bring consciousness into the emotional body before you can reach the inner body. If there isn't an emanation of love and joy, complete presence and openness toward all beings, then it is not enlightenment. Another indicator is how a person behaves in difficult or challenging situations or when things “go wrong.” If your “enlightenment” is egoic self-delusion, then life will soon<\/p>", "images": [], "label": "Page 179"}, {"pdf_page_index": 179, "pdf_page_number": 180, "html": "<p class=\"pdf-para\">give you a challenge that will bring out your unconsciousness in whatever form as fear, anger, defensiveness, judgment, depression, and so on. If you are in a relationship, many of your challenges will come through your partner. For example, a woman may be challenged by an unresponsive male partner who lives almost entirely in his head. She will be challenged by his inability to hear her, to give her attention and space to be, which is due to his lack of presence. The absence of love in the relationship, which is usually more keenly felt by a woman than a man, will trigger the woman's pain-body, and through it she will attack her partner blame, criticize, make wrong, and so on. This in turn now becomes his challenge. To defend himself against her pain-body's attack, which he sees as totally unwarranted, he will become even more deeply entrenched in his mental positions as he justifies, defends himself or counterattacks. Eventually, this may activate his own pain-body. When both partners have thus been taken over, a level of deep unconsciousness has been reached, of emotional violence, savage attack and counterattack. It will not subside until both pain-bodies have replenished themselves and then enter the dormant stage. Until the next time.<\/p>\n<p class=\"pdf-para\">This is only one of an endless number of possible scenarios. Many volumes have been written, and many more could be written, about the ways in which unconsciousness is brought out in male-female relationships. But, as I said earlier, once you understand the root of the dysfunction, you do not need to explore its countless manifestations.<\/p>\n<p class=\"pdf-para\">Let's briefly look again at the scenario I have just described. Every challenge that it contains is actually a disguised opportunity for salvation. At every stage of the unfolding dysfunctional process, freedom from unconsciousness is possible. For example, the woman's hostility could become a signal for the man to come out of his mind-identified state, awaken into the Now, become present instead of becoming even more identified with his mind, even more unconscious. Instead of “being” the pain- body, the woman could be the knowing that watches the emotional pain in herself, thus accessing the power of the Now and initiating the transmutation of the pain. This would remove the compulsive and automatic outward projection of it. She could then express her feelings to her partner. There is no guarantee, of course, that he will listen, but it gives him a good chance to become present and certainly breaks the insane cycle of the involuntary acting out of old mind patterns. If the woman misses that<\/p>", "images": [], "label": "Page 180"}, {"pdf_page_index": 180, "pdf_page_number": 181, "html": "<p class=\"pdf-para\">opportunity, the man could watch his own mental-emotional reaction to her pain, his own defensiveness, rather than being the reaction. He could then watch his own pain-body being triggered and thus bring consciousness into his emotions. In this way, a clear and still space of pure awareness would come into being the knowing, the silent witness, the watcher. This awareness does not deny the pain and yet is beyond it. It allows the pain to be and yet transmutes it at the same time. It accepts everything and transforms everything. A door would have opened up for her through which she could easily join him in that space.<\/p>\n<p class=\"pdf-para\">If you are consistently or at least predominantly present in your relationship, this will be the greatest challenge for your partner. They will not be able to tolerate your presence for very long and stay unconscious. If they are ready, they will walk through the door that you opened for them and join you in that state. If they are not, you will separate like oil and water. The light is too painful for someone who wants to remain in darkness.<\/p>", "images": [], "label": "Page 181"}, {"pdf_page_index": 181, "pdf_page_number": 182, "html": "<h4 class=\"pdf-subhead\">Why Women Are Closer To Enlightenment<\/h4>\n<p class=\"pdf-para\">Are the obstacles to enlightenment the same for a man as for a woman? Yes, but the emphasis is different. Generally speaking, it is easier for a woman to feel and be in her body, so she is naturally closer to Being and potentially closer to enlightenment than a man. This is why many ancient cultures instinctively chose female figures or analogies to represent or describe the formless and transcendental reality. It was often seen as a womb that gives birth to everything in creation and sustains and nourishes it during its life as form. In the Tao Te Ching, one of the most ancient and profound books ever written, the Tao, which could be translated as Being, is described as “infinite, eternally present, the mother of the universe.” Naturally, women are closer to it than men since they virtually “embody” the Unmanifested. What is more, all creatures and all things must eventually return to the Source. 'All things vanish into the Tao. It alone endures.\" Since the Source is seen as female, this is represented as the light and dark sides of the archetypal feminine in psychology and mythology. The Goddess or Divine Mother has two aspects: She gives life, and she takes life.<\/p>\n<p class=\"pdf-para\">When the mind took over and humans lost touch with the reality of their divine essence, they started to think of God as a male figure. Society became male dominated, and the female was made subordinate to the male.<\/p>\n<p class=\"pdf-para\">I am not suggesting a return to earlier female representations of the divine. Some people now use the term Goddess instead of God. They are redressing a balance between male and female that was lost a long time ago, and that is good. But it is still a representation and a concept, perhaps temporarily useful, just as a map or a signpost is temporarily useful, but more a hindrance than a help when you are ready to realize the reality beyond all concepts and images. What does remain true, however, is that the energy frequency of the mind appears to be essentially male. The mind resists, fights for control, uses, manipulates, attacks, tries to grasp and<\/p>", "images": [], "label": "Page 182"}, {"pdf_page_index": 182, "pdf_page_number": 183, "html": "<p class=\"pdf-para\">possess, and so on. This is why the traditional God is a patriarchal, controlling authority figure, an often angry man who you should live in fear of, as the Old Testament suggests. This God is a projection of the human mind.<\/p>\n<p class=\"pdf-para\">To go beyond the mind and reconnect with the deeper reality of Being, very different qualities are needed: surrender, nonjudgment, an openness that allows life to be instead of resisting it, the capacity to hold all things in the loving embrace of your knowing. All these qualifies are much more closely related to the female principle. Whereas mind-energy is hard and rigid, Being-energy is soft and yielding and yet infinitely more powerful than mind. The mind runs our civilization, whereas Being is in charge of all life on our planet and beyond. Being is the very Intelligence whose visible manifestation is the physical universe. Although women are potentially closer to it, men can also access it within themselves.<\/p>\n<p class=\"pdf-para\">At this time, the vast majority of men as well as women are still in the grip of the mind: identified with the thinker and the pain-body. This, of course, is what prevents enlightenment and the flowering of love. As a general rule, the major obstacle for men tends to be the thinking mind, and the major obstacle for women the pain-body, although in certain individual cases the opposite may be true, and in others the two factors may be equal.<\/p>", "images": [], "label": "Page 183"}, {"pdf_page_index": 183, "pdf_page_number": 184, "html": "<h4 class=\"pdf-subhead\">Dissolving The Collective Female Pain-Body<\/h4>\n<p class=\"pdf-para\">Why is the pain-body more of an obstacle for women? The pain-body usually has a collective as well as a personal aspect. The personal aspect is the accumulated residue of emotional pain suffered in one's own past. The collective one is the pain accumulated in the collective human psyche over thousands of years through disease, torture, war, murder, cruelty, madness, and so on. Everyone's personal pain-body also partakes of this collective pain-body. There are different strands in the collective pain-body. For example, certain races or countries in which extreme forms of strife and violence occur have a heavier collective pain- body than others. Anyone with a strong pain-body and not enough consciousness to disidentify from it will not only continuously or periodically be forced to relive their emotional pain but may also easily become either the perpetrator or the victim of violence, depending on whether their pain-body is predominantly active or passive. On the other hand, they may also be potentially closer to enlightenment. This potential isn't necessarily realized, of course, but if you are trapped in a nightmare you will probably be more strongly motivated to awaken than someone who is just caught in the ups and downs of an ordinary dream.<\/p>\n<p class=\"pdf-para\">Apart from her personal pain-body, every woman has her share in what could be described as the collective female pain-body unless she is fully conscious. This consists of accumulated pain suffered by women partly through male subjugation of the female, through slavery, exploitation, rape,<\/p>\n<p class=\"pdf-para\">childbirth, child loss, and so on, over thousands of years. The emotional or physical pain that for many women precedes and coincides with the menstrual flow is the pain- body in its collective aspect that awakens from its dormancy at that time, although it can be triggered at other times too. It restricts the free flow of life energy through the body, of which menstruation is a physical expression. Let's dwell on this for a moment and see how it can become an opportunity for enlightenment. Often a woman is<\/p>", "images": [], "label": "Page 184"}, {"pdf_page_index": 184, "pdf_page_number": 185, "html": "<p class=\"pdf-para\">“taken over” by the pain-body at that time. It has an extremely powerful energetic charge that can easily pull you into unconscious identification with it. You are then actively possessed by an energy field that occupies your inner space and pretends to be you but, of course, is not you at all. It speaks through you, acts through you, thinks through you. It will create negative situations in your life so that it can feed on the energy. It wants more pain, in whatever form. I have described this process already. It can be vicious and destructive. It is pure pain, past pain and it is not you.<\/p>\n<p class=\"pdf-para\">The number of women who are now approaching the fully conscious state already exceeds that of men and will be growing even faster in the years to come. Men may catch up with them in the end, but for some considerable time there will be a gap between the consciousness of men and that of women. Women are regaining the function that is their birthright and, therefore, comes to them more naturally than it does to men: to be a bridge between the manifested world and the Unmanifested, between physicality and spirit. Your main task as a woman now is to transmute the pain-body so that it no longer comes between you and your true self, the essence of who you are. Of course, you also have to deal with the other obstacle to enlightenment, which is the thinking mind, but the intense presence you generate when dealing with the pain-body will also free you from identification with the mind.<\/p>\n<p class=\"pdf-para\">The first
