<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Serpent Power &mdash; Arthur Avalon (Sir John Woodroffe)</title>
<style>
/* ============ Design tokens (Thought-Forms Luxury Style) ============ */
:root {
  --parchment: #F7F1E3;
  --parchment-2: #EFE6CE;
  --ink: #2E2A24;
  --ink-soft: #5A5346;
  --gold: #B8963E;
  --gold-soft: #D8C186;
  --teal: #0d9488;
  --teal-soft: #14b8a6;
  --violet: #6B5691;
  --rose: #C1567B;
  --border: #E1D3AA;
  --card: #FFFDF6;
  --shadow: 0 20px 60px -20px rgba(60,45,10,0.35), 0 2px 10px rgba(60,45,10,0.08);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #f3e8c9 0%, transparent 60%),
    radial-gradient(ellipse 900px 600px at 110% 110%, #ecdcc0 0%, transparent 55%),
    var(--parchment);
  color: var(--ink);
  font-family: "EB Garamond", "Cormorant Garamond", Georgia, serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 980px;
  margin: 0 auto;
  padding: 24px 20px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: max-width 0.3s ease;
}

/* Full window mode */
body.full-window .app {
  max-width: 100%;
  padding: 16px 36px 60px;
}
body.full-window .leaf {
  max-width: 1200px;
  margin: 0 auto;
}

/* ---------- Header ---------- */
header.top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 16px; flex-wrap: wrap;
}
.brand {
  display: flex; align-items: center; gap: 12px;
}
.brand .glyph {
  width: 42px; height: 42px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fffdf6 0%, var(--gold-soft) 45%, var(--teal) 100%);
  box-shadow: 0 0 18px 2px rgba(13,148,136,0.4), inset 0 0 6px rgba(255,255,255,0.7);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: Georgia, serif; font-size: 20px; font-weight: bold;
}
.brand h1 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-weight: 600; font-size: 1.35rem; letter-spacing: 0.04em; margin: 0;
  color: var(--ink);
}
.brand p {
  margin: 0; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-soft); font-family: Georgia, serif;
}
.progress-wrap {
  display: flex; align-items: center; gap: 10px;
  font-size: 0.82rem; color: var(--ink-soft); letter-spacing: 0.04em;
}
.progress-bar {
  width: 140px; height: 5px; border-radius: 3px; background: var(--parchment-2);
  overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
}
.progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--gold-soft), var(--teal));
  transition: width .4s cubic-bezier(.4,0,.2,1);
}
.header-actions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.action-btn {
  border: 1px solid var(--border); background: var(--card); color: var(--ink);
  border-radius: 8px; padding: 7px 12px; font-family: inherit; font-size: 0.85rem;
  letter-spacing: 0.04em; cursor: pointer; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 6px; transition: transform .15s ease, background .15s ease;
}
.action-btn:hover { transform: translateY(-1px); background: #fff; }
.action-btn.active { background: var(--gold-soft); border-color: var(--gold); }

/* ---------- Floating Side Navigation (Easy Reading) ---------- */
.float-nav {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 48px; height: 72px; border-radius: 12px;
  background: rgba(255, 253, 246, 0.88); backdrop-filter: blur(8px);
  border: 1px solid var(--border); color: var(--ink);
  box-shadow: 0 10px 30px rgba(60,45,10,0.18);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 35; transition: all 0.2s ease;
}
.float-nav:hover { background: #fff; border-color: var(--gold); transform: translateY(-50%) scale(1.05); }
.float-nav:active { transform: translateY(-50%) scale(0.95); }
.float-nav.prev { left: 16px; }
.float-nav.next { right: 16px; background: linear-gradient(135deg, rgba(255,253,246,0.9), rgba(216,193,134,0.3)); border-color: var(--gold); }
@media (max-width: 1100px) {
  .float-nav { display: none; }
}

/* ---------- Search Bar ---------- */
.search-bar {
  display: none; padding: 12px 18px; background: #fbf7ee; border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 14px; align-items: center; gap: 10px; flex-wrap: wrap;
  box-shadow: var(--shadow);
}
.search-bar.open { display: flex; animation: fadeIn .3s ease; }
.search-bar input {
  flex: 1; min-width: 200px; padding: 8px 14px; border: 1px solid #d8cbb0;
  border-radius: 8px; background: #fffdf7; font-family: inherit; font-size: 14px;
  color: #3a3227; outline: none;
}
.search-bar input:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(184,150,62,0.25); }
.search-bar .sbtn {
  padding: 8px 14px; border: 1px solid #d8cbb0; border-radius: 8px;
  background: #fffdf7; cursor: pointer; font-family: inherit; font-size: 13px; color: #3a3227;
  transition: background .15s;
}
.search-bar .sbtn:hover { background: #f0e7d3; }
#search-info { font-size: 13px; color: var(--gold); font-weight: 600; white-space: nowrap; }
mark.search-hit { background: #ffd978; color: inherit; padding: 0 2px; border-radius: 2px; font-weight: 600; }

/* ---------- Notes Panel ---------- */
.notes-panel {
  display: none; padding: 18px 24px; background: #fbf7ee; border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.notes-panel.open { display: block; animation: fadeIn .3s ease; }
#notes-body h3 { font-family: "Cormorant Garamond", serif; font-size: 1.25rem; color: var(--teal); margin: 0 0 8px; }
#notes-body h4 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin: 12px 0 6px; }
#notes-body p { margin: 0 0 8px; line-height: 1.7; font-size: 1rem; }
#notes-body ul { margin: 6px 0 10px 20px; line-height: 1.7; font-size: 0.98rem; }

/* ---------- Table of Contents Rail ---------- */
.toc-panel {
  position: fixed; top: 0; right: -360px; width: 340px; height: 100%;
  background: var(--card); border-left: 1px solid var(--border);
  box-shadow: -20px 0 50px rgba(60,45,10,0.18);
  z-index: 60; transition: right .35s cubic-bezier(.4,0,.2,1);
  overflow-y: auto; padding: 24px 18px 40px;
}
.toc-panel.open { right: 0; }
.toc-panel h2 {
  font-family: "Cormorant Garamond", serif; font-size: 1.15rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--teal); margin: 0 0 14px;
  border-bottom: 1px solid var(--border); padding-bottom: 10px;
}
.toc-close {
  position: absolute; top: 16px; right: 16px; background: none; border: none;
  font-size: 1.4rem; color: var(--ink-soft); cursor: pointer; line-height: 1;
}
.toc-item {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 8px 10px; font-family: "EB Garamond", serif; font-size: 0.95rem;
  color: var(--ink); cursor: pointer; border-radius: 6px; margin-bottom: 2px;
  transition: background .15s ease;
}
.toc-item:hover { background: var(--parchment-2); }
.toc-item.active {
  background: linear-gradient(90deg, rgba(13,148,136,0.14), transparent);
  color: var(--teal); font-weight: 600;
}
.scrim {
  position: fixed; inset: 0; background: rgba(40,30,10,0.25); z-index: 55;
  opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.scrim.show { opacity: 1; pointer-events: auto; }

/* ---------- The Book Leaf (Thought Forms Style) ---------- */
.stage {
  flex: 1; display: flex; align-items: flex-start; justify-content: center;
  position: relative;
}
.leaf {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow); width: 100%;
  padding: 46px 54px 40px; position: relative; min-height: 480px;
  animation: fadeIn .4s ease;
}
.leaf::before {
  content: ""; position: absolute; inset: 10px;
  border: 1px solid rgba(184,150,62,0.28); border-radius: 8px;
  pointer-events: none;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 700px) {
  .leaf { padding: 30px 20px 28px; }
}
.section-pill {
  position: absolute; top: -13px; left: 50px;
  background: linear-gradient(135deg, var(--teal), #0f766e);
  color: #fff; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 5px 14px; border-radius: 20px; box-shadow: 0 6px 14px -6px rgba(13,148,136,0.6);
  font-weight: 600;
}
.eyebrow {
  font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--gold); margin: 0 0 6px; font-weight: 600;
}
.leaf h2.page-title {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 2rem; font-weight: 600; margin: 0 0 22px; color: var(--ink);
  line-height: 1.15; border-bottom: 2px solid var(--gold-soft); padding-bottom: 14px;
}
.leaf .content p {
  font-size: 1.1rem; line-height: 1.8; margin: 0 0 1.1em; color: var(--ink);
  text-align: justify; hyphens: auto;
}
.dropcap {
  float: left; font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 3.6rem; line-height: 0.8; padding-top: 4px; padding-right: 10px;
  padding-bottom: 2px; color: var(--teal); font-weight: 700;
}
.leaf .content p.footnote {
  font-size: 0.94rem; color: var(--ink-soft); font-style: italic;
  border-left: 2px solid var(--gold-soft); padding-left: 14px; margin: 16px 0;
}
.leaf .content h3.subhead {
  font-family: "Cormorant Garamond", serif; font-size: 1.25rem; color: var(--teal);
  margin: 24px 0 10px; letter-spacing: 0.03em;
}
.book-title {
  font-family: "Cormorant Garamond", serif; text-align: center; font-size: 2.6rem;
  letter-spacing: 0.12em; margin: 18px 0 6px; color: var(--ink);
}
.book-authors {
  text-align: center; font-size: 1.05rem; letter-spacing: 0.1em; font-weight: 400;
  color: var(--teal); margin: 0 0 26px;
}
.pub-line { text-align: center; font-size: 0.82rem; color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; }
.pub-house { text-align: center; font-size: 0.95rem; color: var(--ink-soft); margin: 8px 0 26px; line-height: 1.6; }

/* Figures / Sacred Plates */
.figures {
  display: flex; flex-wrap: wrap; gap: 20px; margin: 26px 0 12px; justify-content: center;
}
.figure-card {
  background: var(--parchment-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; max-width: 440px; flex: 1 1 300px;
  text-align: center; box-shadow: 0 8px 22px -12px rgba(60,45,10,0.25);
}
.figure-card img {
  max-width: 100%; height: auto; max-height: 480px; border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.08); background: #111; cursor: zoom-in;
  transition: transform .25s ease;
}
.figure-card img:hover { transform: scale(1.015); }
.figure-cap {
  margin-top: 10px; font-size: 0.88rem; color: var(--ink-soft);
  font-style: italic; letter-spacing: 0.02em; line-height: 1.4;
}

/* Lightbox Modal */
.lightbox {
  position: fixed; inset: 0; background: rgba(20,15,5,0.88);
  display: none; align-items: center; justify-content: center; z-index: 100;
  padding: 30px; backdrop-filter: blur(8px);
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 95vw; max-height: 85vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.lightbox-close {
  position: absolute; top: 22px; right: 28px; background: none; border: none;
  color: #f6ecd2; font-size: 2.2rem; cursor: pointer; line-height: 1;
}

/* ---------- Sticky Pager Navigation ---------- */
nav.pager {
  position: sticky; bottom: 0; margin-top: 28px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  background: linear-gradient(180deg, rgba(247,241,227,0) 0%, var(--parchment) 30%);
  padding-top: 18px; z-index: 30;
}
.pager-btn {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--border); color: var(--ink);
  padding: 12px 24px; border-radius: 12px; font-family: inherit; font-size: 1rem;
  cursor: pointer; box-shadow: var(--shadow); letter-spacing: 0.02em; font-weight: 600;
  transition: transform .15s ease, opacity .15s ease;
}
.pager-btn:hover:not(:disabled) { transform: translateY(-2px); }
.pager-btn:disabled { opacity: 0.35; cursor: default; }
.pager-btn.next {
  background: linear-gradient(135deg, var(--gold-soft), var(--gold));
  color: #3a2c08; border: none;
}
.folio {
  position: relative; font-family: "Cormorant Garamond", serif;
  font-size: 1.05rem; color: var(--ink-soft); text-align: center; letter-spacing: 0.05em;
}
.folio .halo {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 76px; height: 76px; border-radius: 50%;
  background: radial-gradient(circle, rgba(13,148,136,0.35) 0%, transparent 70%);
  animation: pulse 3.2s ease-in-out infinite; z-index: -1;
}
@keyframes pulse {
  0%,100% { transform: translate(-50%,-50%) scale(0.9); opacity: 0.5; }
  50% { transform: translate(-50%,-50%) scale(1.25); opacity: 0.9; }
}

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #2E2A24; color: #fff; padding: 10px 20px; border-radius: 12px;
  font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1); z-index: 300;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

    "html": "<h3 class=\"pdf-heading\">PREFACE BY ARTHUR AVALON</h3>\n<p><span class=\"dropcap\">I</span>n my work &ldquo;Shakti and Shakta&rdquo; I outlined for the first time the principles of &ldquo;Kundali-Yoga&rdquo; so much discussed in some quarters, but of which so little was known. This work is a description and explanation in fuller detail of the Serpent Power (Kundali Shakti), and the Yoga effected through it, a subject occupying a pre-eminent place in the Tantra Shastra.</p>\n<p>It consists of a translation of two Sanskrit works published some years ago in the second volume of my series of Tantrik Texts, but hitherto untranslated. The first, entitled &ldquo;Shatchakranirupana&rdquo; (&ldquo;Description of and Investigation into the Six Bodily Centres&rdquo;), has as its author the celebrated Tantrik Purnananda Svami. It forms the sixth chapter of his extensive work on Tantrik Ritual entitled &ldquo;Shritattvachintamani&rdquo;. This has been the subject of commentaries by Shangkara and Vishvanatha, and the commentary here translated from the Sanskrit is by Kalicharana.</p>\n<p>The second text, called &ldquo;Paduka-Panchaka&rdquo; (&ldquo;Fivefold Footstool of the Guru&rdquo;), deals with one of the Lotuses described in the larger work. To it is appended a translation of a commentary by Kalicharana. As these texts are of a highly recondite character, I have prefaced the translation by a general Introduction in which I have endeavoured to give an explanation of this form of Yoga.</p>",

    "label": "Note to Second Edition",
    "section": "Preface",
    "html": "<h3 class=\"pdf-heading\">NOTE TO SECOND EDITION</h3>\n<p><span class=\"dropcap\">T</span>he first edition of this work was sold out within a short time of publication, proving that a deep interest in Tantra Shastra and Kundalini Yoga exists among sincere seekers both in the East and in the West.</p>\n<p>In this second edition, many textual clarifications, Sanskrit transliteration corrections, and extended notes have been provided. The reader will observe that the Tantras do not merely advocate abstract speculation, but present a verified experimental psychology based upon direct inner perception and rigorous sadhana.</p>\n<p>The great physiological fact underlying this Yoga is that the human body is an electro-magnetic dynamo; the nervous centres are stations of vital prana, and the spinal column is the royal path along which the dormant spiritual power ascends from gross materiality to supreme spiritual freedom.</p>",
    "images": [
      {
        "file": "images/serpent-power/0_0.jpg",
        "caption": "Plate III: Book Cover and Emblem of the Serpent Power"
      }
    ]
  },
  {
    "pdf_page_index": 3,
    "pdf_page_number": 4,
    "label": "I. Introductory \u2014 Kundali Yoga",
    "section": "Introduction",
    "html": "<h3 class=\"pdf-heading\">I. INTRODUCTORY &mdash; KUNDALI YOGA</h3>\n<p><span class=\"dropcap\">T</span>he two Sanskrit works here translated deal with a particular form of Tantrik Yoga named Kundali Yoga, or, as some works call it, Bhuta-shuddhi (the purification of the elements in the body). These names refer to the Kundalini Shakti, or Supreme Power in the human body by the arousing of which the Yoga is achieved, and to the purification of the elements of the body which takes place upon that arousal.</p>\n<p>Yoga is union &mdash; the realization of the identity of the individual soul (Jivatma) with the Supreme Soul (Paramatma). In Kundalini Yoga, this realization is not a mere intellectual conclusion or emotional sentiment, but an actual physical, physiological, and psychical ascension of energy.</p>\n<p>Kundalini is the Primordial Energy (Para-Shakti) in the human body. She is conceived as a serpent lying asleep and coiled three and a half times around the Svayambhu-Linga in the Muladhara centre at the base of the spinal column, closing with Her mouth the entrance to the Sushumna canal (Brahma-dvara).</p>\n<p>When She is aroused by pranayama, mantra, and focused meditation, She uncoils, pierces each of the six bodily centres (Chakras) along the central axis, dissolves each element into its subtler source, and unites in ecstatic embrace with Shiva in the Sahasrara.</p>",
    "images": [
      {
        "file": "images/serpent-power/15_0.jpg",
        "caption": "Frontispiece: The Six Centres and Kundalini Shakti in the Cerebrospinal Axis"
      }
    ]
  },
  {
    "pdf_page_index": 4,
    "pdf_page_number": 5,
    "label": "II. Consciousness and Its Power",
    "section": "Philosophy",
    "html": "<h3 class=\"pdf-heading\">II. CONSCIOUSNESS AND ITS POWER (SARVA-SHAKTIMAN)</h3>\n<p><span class=\"dropcap\">T</span>he ultimate Reality is Chit &mdash; Pure Consciousness, which is changeless, eternal, and all-pervading. Yet this Consciousness is not sterile; it possesses inherent Power (Shakti) through which the infinite multiplicity of the universe manifests.</p>\n<p>Shiva represents the static, unchanging aspect of consciousness; Shakti represents the dynamic, kinetic aspect of the same reality. There is no Shiva without Shakti, nor Shakti without Shiva. As heat cannot be separated from fire, nor moonlight from the moon, so Consciousness and Power are indivisible.</p>\n<p>Maya in the Shakta Tantras is not an illusion or non-existence; it is the measuring power of Divine Consciousness (Miyate anena iti Maya), by which the Infinite measures Itself into finite name (Nama) and form (Rupa).</p>\n<p>The universe is real because it is the manifestation of real Divine Power. The body is real because it is the temple and vehicle of the Divine Mother. Liberation consists not in fleeing from embodiment, but in divinizing the body and experiencing Samsara as the living play of Nirvana.</p>",
    "images": [
      {
        "file": "images/serpent-power/38_0.jpg",
        "caption": "Plate IV: Consciousness and Its Power &mdash; The Cosmic Polarities"
      }
    ]
  },
  {
    "pdf_page_index": 5,
    "pdf_page_number": 6,
    "label": "III. Embodied Consciousness & Nadis",
    "section": "Anatomy",
    "html": "<h3 class=\"pdf-heading\">III. EMBODIED CONSCIOUSNESS (THE JIVATMA &amp; THE NADIS)</h3>\n<p><span class=\"dropcap\">T</span>he embodied spirit is the Jiva, which is the Supreme Self conditioned by ignorance (Avidya) and clothed in the five sheaths (Koshas): Annamaya (food sheath), Pranamaya (vital breath), Manomaya (mind), Vijnanamaya (intellect), and Anandamaya (bliss).</p>\n<p>The vital life-force (Prana) circulates through subtle conduits called Nadis, numbered by the Shastras at 72,000. Fourteen of these are of chief importance, and among the fourteen, three are supreme:</p>\n<ul class=\"principles\" style=\"margin:14px 0 16px 20px;line-height:1.8;\">\n<li><strong>Ida Nadi:</strong> On the left side of the spine; white, lunar, feminine, cool; ending at the left nostril.</li>\n<li><strong>Pingala Nadi:</strong> On the right side; red, solar, masculine, warm; ending at the right nostril.</li>\n<li><strong>Sushumna Nadi:</strong> In the middle, within the cerebrospinal column, extending from Muladhara to Sahasrara. Inside Sushumna is Vajra Nadi; inside Vajra is Chitrini Nadi; inside Chitrini is the Brahma Nadi &mdash; the extremely subtle pathway through which Kundalini ascends.</li>\n</ul>\n<p>When breath flows through Ida, consciousness is introspective; when through Pingala, active in the outer world. But when prana enters the central Sushumna, the mind is suspended in samadhi, and the door to immortality is unbolted.</p>",
    "images": [
      {
        "file": "images/serpent-power/65_0.jpg",
        "caption": "Plate V: The Spinal Column, the Three Nadis, and the Prana Sheaths"
      }
    ]
  },
  {
    "pdf_page_index": 6,
    "pdf_page_number": 7,
    "label": "IV. The Garland of Letters",
    "section": "Mantra",
    "html": "<h3 class=\"pdf-heading\">IV. THE GARLAND OF LETTERS (VARNAMALA &amp; MANTRA)</h3>\n<p><span class=\"dropcap\">A</span>ll creation is sound (Shabda). The universe begins not in physical matter, but in cosmic acoustic vibration &mdash; Shabda-Brahman. Sound evolves through four progressive states:</p>\n<ol class=\"principles\" style=\"margin:14px 0 16px 20px;line-height:1.8;\">\n<li><strong>Para:</strong> The supreme transcendent, unmanifest causal sound dormant in the Muladhara.</li>\n<li><strong>Pashyanti:</strong> The visualized, undifferentiated nascent sound reaching the navel centre.</li>\n<li><strong>Madhyama:</strong> The mental, interior articulated sound in the heart.</li>\n<li><strong>Vaikhari:</strong> The audible spoken voice uttered through the throat, tongue, and lips.</li>\n</ol>\n<p>The fifty letters (Varnas) of the Sanskrit alphabet constitute the Matrika &mdash; the Garland of Letters worn as a necklace by the Divine Mother Kali. Each letter is the acoustic body of a cosmic power.</p>\n<p>These 50 letters are inscribed on the petals of the six bodily chakras: 4 on Muladhara, 6 on Svadhishthana, 10 on Manipura, 12 on Anahata, 16 on Vishuddha, and 2 on Ajna (4 + 6 + 10 + 12 + 16 + 2 = 50). By chanting the root mantras (Bijamantras), the petals and centres are awakened from latency.</p>",
    "images": [
      {
        "file": "images/serpent-power/105_0.jpg",
        "caption": "Plate VI: The Garland of Letters &mdash; The Fifty Sacred Sanskrit Matrikas"
      }
    ]
  },
  {
    "pdf_page_index": 7,
    "pdf_page_number": 8,
    "label": "V. The Lower Chakras",
    "section": "Chakras",
    "html": "<h3 class=\"pdf-heading\">V. THE LOWER BODILY CENTRES (MULADHARA TO MANIPURA)</h3>\n<p><span class=\"dropcap\">T</span>he Six Centres (Chakras or Padmas) are subtle dynamic vortices within the spinal cord, each governing a gross elemental region (Tattva), a sensory organ, and an octave of conscious life.</p>\n<p><strong>1. Muladhara (The Root Lotus):</strong> Located between the anus and the genitals. Crimson lotus of 4 petals bearing golden letters <em>Vam, Sham, Sham, Sam</em>. Elemental region: Earth (Prithvi), represented by a yellow square with the eight spears of the directions. Bija mantra: <em>LAM</em>, seated on Airavata, the eight-trunked white elephant. Here resides the Svayambhu-Linga, around which Kundalini sleeps like a golden serpent coiled 3&frac12; times.</p>\n<p><strong>2. Svadhishthana (The Sacral Lotus):</strong> Located at the root of the genitals. Vermilion lotus of 6 petals bearing letters <em>Bam, Bham, Mam, Yam, Ram, Lam</em>. Elemental region: Water (Apas), represented by a shining white crescent moon. Bija mantra: <em>VAM</em>, mounted on the Makara (water-monster). Presiding deities: Vishnu and Rakini Shakti.</p>\n<p><strong>3. Manipura (The Solar Plexus Lotus):</strong> Located at the navel region. Lustrous blue lotus of 10 petals bearing letters <em>Dam to Pham</em>. Elemental region: Fire (Tejas), represented by a red triangle. Bija mantra: <em>RAM</em>, mounted on a ram. Presiding deities: Rudra and Lakini Shakti.</p>",
    "images": [
      {
        "file": "images/serpent-power/155_0.jpg",
        "caption": "Plate VII: The Six Bodily Centres from Muladhara to Sahasrara"
      }
    ]
  },
  {
    "pdf_page_index": 8,
    "pdf_page_number": 9,
    "label": "V (Contd). The Higher Chakras",
    "section": "Chakras",
    "html": "<h3 class=\"pdf-heading\">V (CONTD). THE HIGHER CENTRES (ANAHATA TO SAHASRARA)</h3>\n<p><span class=\"dropcap\">A</span>s the yogic energy ascends above the navel, consciousness transitions from elemental survival to transcendent love, intuition, and unconditioned awareness.</p>\n<p><strong>4. Anahata (The Heart Lotus):</strong> In the heart region. Deep red lotus of 12 petals bearing letters <em>Kam to Tham</em>. Elemental region: Air (Vayu), represented by a smoky hexagram (two interlaced triangles). Bija mantra: <em>YAM</em>, mounted on a fleet black antelope. In its pericarp shines the Bana-Linga, and here burns the steady flame of the individual soul (Jivatma), like a lamp in a windless place.</p>\n<p><strong>5. Vishuddha (The Throat Lotus):</strong> In the throat. Smoky purple lotus of 16 petals bearing the 16 Sanskrit vowels. Elemental region: Ether (Akasha), represented by a white circle. Bija mantra: <em>HAM</em>, seated on a white elephant. Presiding deities: Sadashiva and Shakini.</p>\n<p><strong>6. Ajna (The Third Eye Lotus):</strong> Between the eyebrows. Moon-white lotus of 2 petals bearing letters <em>Ham</em> and <em>Ksham</em>. Region of the subtle Mind (Manas). Bija mantra: <em>OM</em>. Here shines the golden Itara-Linga and Hakini Shakti. This is the command centre where the inner Guru is encountered.</p>\n<p><strong>7. Sahasrara (The Thousand-Petalled Lotus):</strong> In the crown of the head. It hangs head downwards, brilliant as the morning sun, containing all letters and all fifty sounds twentyfold. Within its pericarp is the supreme abode of Parama-Shiva and Parama-Shakti in everlasting bliss.</p>",
    "images": [
      {
        "file": "images/serpent-power/155_0.jpg",
        "caption": "Plate VIII: The Higher Chakras and the Thousand-Petalled Lotus"
      }
    ]
  },
  {
    "pdf_page_index": 9,
    "pdf_page_number": 10,
    "label": "VI. Practice & Kundalini Awakening",
    "section": "Practice",
    "html": "<h3 class=\"pdf-heading\">VI. PRACTICE (YOGA: LAYA-KRAMA)</h3>\n<p><span class=\"dropcap\">T</span>he awakening of Kundalini is achieved through rigorous preparation: moral restraint (Yama, Niyama), steady asana, control of prana through Kumbhaka, and the application of the Bandhas (Mula Bandha, Uddiyana Bandha, Jalandhara Bandha).</p>\n<p>By contracting the perineum, the downward Prana is turned upward, and by pressing the chin to the chest, the upward Apana is forced downward. The two opposing winds meet in the Muladhara fire, producing an intense spiritual heat that strikes upon the sleeping Kundalini.</p>\n<p>Aroused by the air and fire, She awakes, uncoils, and enters the entrance of the Brahma Nadi inside Sushumna. As She pierces each lotus (Shat-Chakra-Bheda), the elements of that centre are dissolved into Her:</p>\n<ul class=\"principles\" style=\"margin:14px 0 16px 20px;line-height:1.8;\">\n<li>Earth is dissolved into Water at the Svadhishthana.</li>\n<li>Water is dissolved into Fire at the Manipura.</li>\n<li>Fire is dissolved into Air at the Anahata.</li>\n<li>Air is dissolved into Ether at the Vishuddha.</li>\n<li>Ether is dissolved into Mind at the Ajna.</li>\n<li>Mind is dissolved into Pure Consciousness in Sahasrara.</li>\n</ul>\n<p>During Her ascent, the yogi's lower limbs become cold as marble, while the crown of the head becomes intensely warm and luminous with transcendent ecstasy.</p>",
    "images": [
      {
        "file": "images/serpent-power/207_0.jpg",
        "caption": "Plate IX: The Practice of Shat-Chakra-Bheda & Kundalini Awakening"
      }
    ]
  },
  {
    "pdf_page_index": 10,
    "pdf_page_number": 11,
    "label": "VII. Theoretical Bases & Liberation",
    "section": "Liberation",
    "html": "<h3 class=\"pdf-heading\">VII. THEORETICAL BASES OF THE YOGA &amp; SAMADHI</h3>\n<p><span class=\"dropcap\">W</span>hen Kundalini reaches the crown of the head, She unites with Supreme Shiva. This celestial marriage (Samarasya) produces an outpouring of divine nectar (Amrita), red and white, which descends through the Sushumna, bathing and revitalizing the entire system.</p>\n<p>The yogi drinks this nectar of immortality and enters Nirvikalpa Samadhi &mdash; unconditioned consciousness wherein the illusion of subject and object is completely dissolved. The seeker realizes: <em>&ldquo;So&rsquo;ham&rdquo;</em> (&ldquo;I am He&rdquo;) and <em>&ldquo;Saham&rdquo;</em> (&ldquo;I am She&rdquo;).</p>\n<p>Yet Kundalini is not kept permanently at the crown. She is brought back down through the same route to the Muladhara, returning each element to its proper place, leaving the yogi revitalized, spiritually transformed, and master of all nature.</p>\n<p>The liberated sage (Jivanmukta) continues to live in the physical body without attachment. Having pierced the illusion of separateness, he sees the Divine Mother playing in all beings, enjoying supreme peace (Shanti) in the midst of daily activity.</p>",
    "images": [
      {
        "file": "images/serpent-power/285_0.jpg",
        "caption": "Plate X: The Descent of Amrita & the Union of Shiva and Shakti"
      }
    ]
  },
  {
    "pdf_page_index": 11,
    "pdf_page_number": 12,
    "label": "Sat-Chakra-Nirupana Translation",
    "section": "Texts",
    "html": "<h3 class=\"pdf-heading\">TRANSLATION: SAT-CHAKRA-NIRUPANA</h3>\n<p class=\"pub-line\">BY PURNANANDA SVAMI (16TH CENTURY)</p>\n<p><span class=\"dropcap\">N</span>ow I speak of the first incitement to the tree of liberation, the ladder of climbing to yoga, which reveals the true knowledge of the six lotuses attached to the spine.</p>\n<p><em>Verse 1:</em> In the space outside the Meru, placed on the left and right, are the two Shiris (Ida and Pingala). The Nadi Sushumna, whose substance is the threefold Gunas, is in the middle. She is the form of Moon, Sun, and Fire, extending from the middle of the root to the head.</p>\n<p><em>Verse 4:</em> Attached to the mouth of the Sushumna is the Adhara Lotus, having four petals of crimson hue. In its pericarp is the square region of Earth, of golden brilliance, surrounded by eight spears.</p>\n<p><em>Verse 10:</em> Over it shines the flame of desire, Kama-rupa. Within it is the Svayambhu-Linga, like molten gold, turned downwards. Above it sleeps Kundalini, finer than the fibre of a lotus stalk, radiant as ten million flashes of lightning.</p>\n<p><em>Verse 22:</em> In the heart is the Lotus of twelve petals, Anahata. Inside it shines the flame of the soul, like a lamp in a place where there is no wind.</p>",
    "images": [
      {

        "caption": "Plate XI: Purnananda Svami's Original Text on the Six Centres"
      }
    ]

  {
    "pdf_page_index": 12,
    "pdf_page_number": 13,
    "label": "Paduka-Panchaka Translation",
    "section": "Texts",
    "html": "<h3 class=\"pdf-heading\">TRANSLATION: PADUKA-PANCHAKA</h3>\n<p class=\"pub-line\">THE FIVEFOLD FOOTSTOOL OF THE GURU</p>\n<p><span class=\"dropcap\">I</span> meditate on the Lotus of a thousand petals situated on the crest of the head, inside which is the twelve-petalled lotus of the white Moon, emitting a cool nectar of immortality.</p>\n<p><em>Verse 1:</em> I adore the divine Lotus of a thousand petals, whose filaments are radiant with the soft lustre of the full moon, in the pericarp of which is the triangular throne (A-Ka-Tha), adorned by the three Bindus.</p>\n<p><em>Verse 3:</em> In that seat is the eternal Guru, calm and tranquil, with eyes full of mercy, holding the gesture of dispelling fear and granting boons, seated upon the altar of jewels.</p>\n<p><em>Verse 5:</em> Meditation upon the holy Lotus-Feet of the Guru purges the mind of all karmic stains and awakens the inner Eye of Wisdom. The nectar falling from the Paduka bestows the power of speech, poetic beauty, and instant liberation.</p>",
    "images": [
      {
        "file": "images/serpent-power/543_0.jpg",
        "caption": "Plate XII: The Fivefold Footstool of the Guru in Sahasrara"
      }
    ]
  },
  {
    "pdf_page_index": 13,
    "pdf_page_number": 14,
    "label": "Sanskrit Text & Mula Slokas",
    "section": "Texts",
    "html": "<h3 class=\"pdf-heading\">SANSKRIT MULA SLOKAS (SHATCHAKRA-NIRUPANA)</h3>\n<p class=\"pub-line\">ORIGINAL DEVANAGARI APPARATUS &amp; LINEAGE</p>\n<p><span class=\"dropcap\">T</span>he original Sanskrit text is preserved with meticulous accuracy. Each Sanskrit vowel and consonant corresponds to a specific acoustic vortex (Varna) upon the bodily chakras.</p>\n<p class=\"footnote\">&ldquo;Meros bahye savyetare nishadvara samsthite shashibhanumatyau, tadantar-gata sushumna triguna-rupa chandrarka-dahana-shaktih.&rdquo; &mdash; Shatchakranirupana, Sloka 1</p>\n<p>Through the profound commentary of Kalicharana, the phonetic and allegorical allusions of the Tantras are unlocked, uniting grammatical science with internal yogic realization.</p>\n<p>Sir John Woodroffe's translation remains the gold standard of scholarship, bridging the profound depth of Eastern wisdom with the critical methodology of the West.</p>",

<script>
(function(){
  const PAGES = JSON.parse(document.getElementById('pages-data').textContent);
  const NOTES = JSON.parse(document.getElementById('notes-data').textContent);
  const CHMAP = JSON.parse(document.getElementById('chapter-map').textContent);

  let current = parseInt(localStorage.getItem('serpent_tf_page')) || 0;
  if (current >= PAGES.length) current = 0;

  let term = '', matchPages = [];
  let isListening = false;

  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  function render(){
    const p = PAGES[current];
    document.getElementById('section-pill').textContent = p.section || 'Sacred Text';
    document.getElementById('eyebrow').textContent = `The Serpent Power &mdash; Section ${current + 1} of ${PAGES.length}`;
    document.getElementById('page-title').innerHTML = p.label;
    document.getElementById('content').innerHTML = p.html;

    const figWrap = document.getElementById('figures');
    figWrap.innerHTML = '';
    if (p.images && p.images.length > 0){
      p.images.forEach(im => {
        const card = document.createElement('div');
        card.className = 'figure-card';
        card.innerHTML = `<img src="${im.file}" alt="${im.caption}" loading="lazy" onclick="openLightbox('${im.file}')"><div class="figure-cap">${im.caption}</div>`;
        figWrap.appendChild(card);
      });
    }

    // Pager & Progress
    const pct = Math.round(((current + 1) / PAGES.length) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `Page ${current + 1} of ${PAGES.length}`;
    document.getElementById('folio-label').textContent = `Page ${current + 1} of ${PAGES.length}`;

    document.getElementById('prev-btn').disabled = current === 0;
    document.getElementById('next-btn').disabled = current === PAGES.length - 1;
    document.getElementById('float-prev').style.opacity = current === 0 ? '0.3' : '1';
    document.getElementById('float-next').style.opacity = current === PAGES.length - 1 ? '0.3' : '1';

    localStorage.setItem('serpent_tf_page', current);

    highlightSearch();
    updateSearchInfo();
    if (document.getElementById('notes-panel').classList.contains('open')) renderNotes();
    updateTocActive();

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goTo(index){
    if (index >= 0 && index < PAGES.length){
      current = index;
      render();
    }
  }

  // Previous & Next Navigation Handlers
  document.getElementById('prev-btn').onclick = () => goTo(current - 1);
  document.getElementById('next-btn').onclick = () => goTo(current + 1);
  document.getElementById('float-prev').onclick = () => goTo(current - 1);
  document.getElementById('float-next').onclick = () => goTo(current + 1);

  // Full Window / Fullscreen toggle
  const fsBtn = document.getElementById('fullscreen-toggle');
  if (fsBtn) {
    fsBtn.onclick = () => {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'TOGGLE_FULL_WINDOW' }, '*');
        return;
      }
      const isFull = document.body.classList.toggle('full-window');
      const lbl = document.getElementById('full-label');
      if (lbl) lbl.textContent = isFull ? 'Exit Full' : 'Full Window';
      showToast(isFull ? 'Expanded to Full Window' : 'Returned to Standard View');
    };
  }

  // Table of Contents
  const tocPanel = document.getElementById('toc-panel');
  const scrim = document.getElementById('scrim');
  function openToc(){ tocPanel.classList.add('open'); scrim.classList.add('show'); }
  function closeToc(){ tocPanel.classList.remove('open'); scrim.classList.remove('show'); }
  document.getElementById('toc-toggle').onclick = openToc;
  document.getElementById('toc-close').onclick = closeToc;
  scrim.onclick = () => { closeToc(); };

  function renderToc(){
    const list = document.getElementById('toc-list');
    list.innerHTML = PAGES.map((p, idx) => `
      <button class="toc-item${idx === current ? ' active' : ''}" data-idx="${idx}">
        <span style="font-size:0.75rem;color:var(--gold);margin-right:8px;font-weight:700;">${String(idx+1).padStart(2,'0')}</span>
        ${p.label}
      </button>
    `).join('');

    list.querySelectorAll('.toc-item').forEach(btn => {
      btn.onclick = () => {
        goTo(parseInt(btn.dataset.idx));
        closeToc();
      };
    });
  }

  function updateTocActive(){
    document.querySelectorAll('.toc-item').forEach((btn, idx) => {
      btn.classList.toggle('active', idx === current);
    });
  }

  // Lightbox
  window.openLightbox = function(src){
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  };
  window.closeLightbox = function(){
    document.getElementById('lightbox').classList.remove('open');
  };

  // Notes Panel
  function renderNotes(){
    const ch = CHMAP[current] || 'Introduction';
    const n = NOTES[ch];
    const body = document.getElementById('notes-body');
    if (!n){
      body.innerHTML = '<p>No specific commentary notes for this section.</p>';
      return;
    }
    body.innerHTML = `
      <h3>Chapter Context: ${ch}</h3>
      <h4>Wisdom Summary</h4>
      <p>${n.s}</p>
      <h4>Key Esoteric Points</h4>
      <ul>${n.p.map(x => `<li>${x}</li>`).join('')}</ul>
    `;
  }

  document.getElementById('notes-toggle').onclick = () => {
    const p = document.getElementById('notes-panel');
    const open = p.classList.toggle('open');
    document.getElementById('search-bar').classList.remove('open');
    if (open) renderNotes();
  };

  // Search Functionality
  const searchBar = document.getElementById('search-bar');
  const searchInput = document.getElementById('search-input');
  const searchInfo = document.getElementById('search-info');

  document.getElementById('search-toggle').onclick = () => {
    const open = searchBar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) searchInput.focus();
  };
  document.getElementById('search-close').onclick = () => {
    searchBar.classList.remove('open');
    term = ''; matchPages = [];
    highlightSearch(); updateSearchInfo();
  };

  function pagePlainText(p){
    const d = document.createElement('div');
    d.innerHTML = p.html + ' ' + (p.images ? p.images.map(i=>i.caption).join(' ') : '');
    return d.textContent || '';
  }

  function doSearch(){
    term = searchInput.value.trim();
    matchPages = [];
    if (term.length >= 2){
      const t = term.toLowerCase();
      PAGES.forEach((p, idx) => {
        if (pagePlainText(p).toLowerCase().includes(t)){
          matchPages.push(idx);
        }
      });
    }
    if (matchPages.length > 0){
      if (!matchPages.includes(current)){
        current = matchPages[0];
        render();
      } else {
        highlightSearch();
        updateSearchInfo();
      }
    } else {
      highlightSearch();
      updateSearchInfo();
    }
  }

  function highlightSearch(){
    const c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(m => {
      const parent = m.parentNode;
      parent.replaceChild(document.createTextNode(m.textContent), m);
      parent.normalize();
    });
    if (!term || term.length < 2) return;

    const walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT, null, false);
    const textNodes = [];
    let node;
    while(node = walker.nextNode()) textNodes.push(node);

    const t = term.toLowerCase();
    textNodes.forEach(n => {
      const val = n.nodeValue;
      const low = val.toLowerCase();
      let idx = low.indexOf(t);
      if (idx === -1) return;

      const frag = document.createDocumentFragment();
      let last = 0;
      while(idx !== -1){
        frag.appendChild(document.createTextNode(val.slice(last, idx)));
        const mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = val.slice(idx, idx + term.length);
        frag.appendChild(mk);
        last = idx + term.length;
        idx = low.indexOf(t, last);
      }
      frag.appendChild(document.createTextNode(val.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }

  function updateSearchInfo(){
    if (!term || term.length < 2){ searchInfo.textContent = ''; return; }
    if (matchPages.length === 0){ searchInfo.textContent = 'No matches found'; return; }
    const pos = matchPages.indexOf(current);
    searchInfo.textContent = `${matchPages.length} ${matchPages.length === 1 ? 'page' : 'pages'} (Page ${pos >= 0 ? pos + 1 : 1} of ${matchPages.length})`;
  }

  function stepMatch(dir){
    if (matchPages.length === 0) return;
    let pos = matchPages.indexOf(current);
    if (pos === -1) pos = 0;
    pos = (pos + dir + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }

  let searchTimeout = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(doSearch, 300);
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      clearTimeout(searchTimeout);
      if (e.shiftKey) stepMatch(-1);
      else stepMatch(1);
    }
  });
  document.getElementById('search-prev').onclick = () => stepMatch(-1);
  document.getElementById('search-next').onclick = () => stepMatch(1);

  // Read Aloud (TTS)
  const listenBtn = document.getElementById('listen-toggle');
  listenBtn.onclick = () => {
    if (!('speechSynthesis' in window)){
      showToast('Speech synthesis not supported');
      return;
    }
    if (isListening){
      window.speechSynthesis.cancel();
      isListening = false;
      listenBtn.classList.remove('active');
      showToast('Audio paused');
      return;
    }
    const plain = document.getElementById('page-title').textContent + '. ' + document.getElementById('content').innerText;
    const utter = new SpeechSynthesisUtterance(plain);
    utter.rate = 0.95;
    utter.pitch = 1.0;
    utter.onend = () => { isListening = false; listenBtn.classList.remove('active'); };
    utter.onerror = () => { isListening = false; listenBtn.classList.remove('active'); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
    isListening = true;
    listenBtn.classList.add('active');
    showToast('Reading page aloud...');
  };

  // Keyboard navigation
  window.onkeydown = (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'Escape') { closeToc(); closeLightbox(); }
    if (e.key === 'f' || e.key === 'F') fsBtn.click();
    if (e.key === '/' || (e.metaKey && e.key === 'k')) {
      e.preventDefault();
      document.getElementById('search-toggle').click();
    }
  };

  // Parent frame message handler
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'NAV_PREV') goTo(current - 1);
    if (e.data?.type === 'NAV_NEXT') goTo(current + 1);
    if (e.data?.type === 'OPEN_SEARCH') {
      const searchToggle = document.getElementById('search-toggle');
      if (searchToggle) searchToggle.click();
    }
    if (e.data?.type === 'SET_FULL_WINDOW') {
      const isFull = !!e.data.isFullWindow;
      document.body.classList.toggle('full-window', isFull);
      const lbl = document.getElementById('full-label');
      if (lbl) lbl.textContent = isFull ? 'Exit Full' : 'Full Window';
    }
  });

  // Initialize
  renderToc();
  render();
})();
</script>
</body>
</html>
