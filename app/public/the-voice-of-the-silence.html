/p><p>Shall he not use the gifts which it confers for his own rest and bliss, his well-earn’d weal and glory — he, the subduer of the great Delusion?<\/p><p>Nay, O thou candidate for Nature’s hidden lore! If one would follow in the steps of holy Tathâgata, those gifts and powers are not for Self.<\/p><p>Would’st thou thus dam the waters born on Sumeru?[125] Shalt thou divert the stream for thine own sake, or send it back to its prime source along the crests of cycles?<\/p><p>If thou would’st have that stream of hard-earn’d knowledge, of Wisdom heaven-born, remain sweet running waters, thou should’st not leave it to become a stagnant pond.<\/p><p>Know, if of Amitâbha, the “Boundless Age,” thou would’st become co-worker, then must thou shed the light acquired, like to the Bodhisattvas twain[126], upon the span of all three worlds[127].<\/p><p>Know that the stream of superhuman knowledge and the Deva-Wisdom thou hast won, must, from thyself, the channel of Alaya, be poured forth into another bed.<\/p>", "images": []}, {"pdf_page_index": 42, "pdf_page_number": 43, "label": "Fragment III. The Seven Portals", "html": "<p>Know, O Naljor, thou of the Secret Path, its pure fresh waters must be used to sweeter make the Ocean’s bitter waves — that mighty sea of sorrow formed of the tears of men.<\/p><p>Alas! when once thou hast become like the fix’d star in highest heaven, that bright celestial orb must shine from out the spatial depths for all — save for itself; give light to all, but take from none.<\/p><p>Alas! when once thou hast become like the pure snow in mountain vales, cold and unfeeling to the touch, warm and protective to the seed that sleepeth deep beneath its bosom — ‘tis now that snow which must receive the biting frost, the northern blasts, thus shielding from their sharp and cruel tooth the earth that holds the promised harvest, the harvest that will feed the hungry.<\/p><p>Self-doomed to live through future Kalpas,[128] unthanked and unperceived by man; wedged as a stone with countless other stones which form the “Guardian Wall”[129], such is thy future if the seventh gate thou passest. Built by the hands of many Masters of Compassion, raised by their tortures, by their blood cemented, it shields mankind, since man is man, protecting it from further and far greater misery and sorrow.<\/p><p>Withal man sees it not, will not perceive it, nor will he heed the word of Wisdom . . . for he knows it not.<\/p><p>But thou hast heard it, thou knowest all, O thou of eager guileless Soul. . . . . and thou must choose. Then hearken yet again.<\/p>", "images": []}, {"pdf_page_index": 43, "pdf_page_number": 44, "label": "Fragment III. The Seven Portals", "html": "<p>On Sowan’s Path, O Srotâpatti,[130] thou art secure. Aye, on that Mârga,[131] where nought but darkness meets the weary pilgrim, where torn by thorns the hands drip blood, the feet are cut by sharp unyielding flints, and Mâra wields his strongest arms — there lies a great reward immediately beyond.<\/p><p>Calm and unmoved the Pilgrim glideth up the stream that to Nirvâna leads. He knoweth that the more his feet will bleed, the whiter will himself be washed. He knoweth well that after seven short and fleeting births Nirvâna will be his. . . .<\/p><p>Such is the Dhyâna Path, the haven of the Yogi, the blessed goal that Srotâpattis crave.<\/p><p>Not so when he hath crossed and won the Aryahata Path.[132]<\/p><p>There Kleśa[133] is destroyed for ever, Tanhâ’s[134] roots torn out. But stay, Disciple . . . Yet, one word. Canst thou destroy divine compassion? Compassion is no attribute. It is the LAW of laws — eternal Harmony, Alaya’s SELF; a shoreless universal essence, the light of everlasting Right, and fitness of all things, the law of love eternal.<\/p><p>The more thou dost become at one with it, thy being melted in its BEING, the more thy Soul unites with that which IS, the more thou wilt become Compassion Absolute[135].<\/p><p>Such is the Ârya Path, Path of the Buddhas of perfection.<\/p><p>Withal, what mean the sacred scrolls which make thee say?<\/p><p>“Om! I believe it is not all the Arhats that get of the Nirvânic Path the sweet fruition.”<\/p><p>“Om! I believe that the Nirvâna-Dharma is entered not by all the Buddhas”[136].<\/p>", "images": []}, {"pdf_page_index": 44, "pdf_page_number": 45, "label": "Footnotes", "html": "<p>“Yea; on the Ârya Path thou art no more Srotâpatti, thou art a Bodhisattva[137]. The stream is cross’d. ‘Tis true thou hast a right to Dharmakâya vesture; but Sambhogakâya is greater than a Nirvânî, and greater still is a Nirmânakâya — the Buddha of Compassion[138].<\/p><p>Now bend thy head and listen well, O Bodhisattva — Compassion speaks and saith: “Can there be bliss when all that lives must suffer? Shalt thou be saved and hear the whole world cry?”<\/p><p>Now thou hast heard that which was said.<\/p><p>Thou shalt attain the seventh step and cross the gate of final knowledge but only to wed woe — if thou would’st be Tathâgata, follow upon thy predecessor’s steps, remain unselfish till the endless end.<\/p><p>Thou art enlightened — Choose thy way.<\/p><p>***************<\/p><p>Behold, the mellow light that floods the Eastern sky. In signs of praise both heaven and earth unite. And from the four-fold manifested Powers a chant of love ariseth, both from the flaming Fire and flowing Water, and from sweet-smelling Earth and rushing Wind.<\/p><p>Hark! . . . from the deep unfathomable vortex of that golden light in which the Victor bathes, ALL NATURE’S wordless voice in thousand tones ariseth to proclaim:<\/p><p>Joy unto ye, O men of Myalba[139].<\/p><p>A Pilgram hath returned back “from the other shore.”<\/p><p>A new Arhan[140] is born. . . .<\/p><p>Peace to all beings[141].<\/p><p>THE END<\/p><p>↑ Back to top<\/p><h3 class=\"pdf-heading\">Footnotes<\/h3>", "images": []}, {"pdf_page_index": 45, "pdf_page_number": 46, "label": "Footnotes", "html": "<p>[1] The Pali word Iddhi, is the synonym of the Sanskrit Siddhis, or psychic faculties, the abnormal powers in man. There are two kinds of Siddhis. One group which embraces the lower, coarse, psychic and mental energies; the other is one which exacts the highest training of Spiritual powers. Says Krishna in Śrîmad Bhâgavatam: —<\/p><p>“He who is engaged in the performance of yoga, who has subdued his senses and who has concentrated his mind in me (Krishna), such yogis all the Siddhis stand ready to serve.”<\/p><p>[2] The ”Soundless Voice,” or the “Voice of the Silence.” Literally perhaps this would read “Voice in the Spiritual Sound,” as Nâda is the equivalent word in Sanskrit, for the Sen-sar term.<\/p><p>[3] Dhâranâ, is the intense and perfect concentration of the mind upon some one interior object, accompanied by complete abstraction from everything pertaining to the external Universe, or the world of the senses.<\/p><p>[4] The ”great Master” is the term used by lanoos or chelas to indicate one’s “Higher Self.” It is the equivalent of Avalokiteśvara, and the same as Âdi-Budha with the Buddhist Occultists, Âtman the “Self” (the Higher Self) with the Brahmins, and Christos with the ancient Gnostics.<\/p><p>[5] Soul is used here for the Human Ego or Manas, that which is referred to in our Occult Septenary division as the “Human Soul” (Vide the Secret Doctrine) in contradistinction to the Spiritual and Animal Souls.<\/p><p>[6] Mahâ Mâyâ ”Great Illusion,” the objective Universe.<\/p><p>[7] Sakkâyaditthi ”delusion” of personality.<\/p>", "images": []}, {"pdf_page_index": 46, "pdf_page_number": 47, "label": "Footnotes", "html": "<p>[8] Attavâda, the heresy of the belief in Soul or rather in the separateness of Soul or Self from the One Universal, infinite Self.<\/p><p>[9] The Tattvajñânin is the “knower” or discriminator of the principles in nature and in man; and Âtmajñânin is the knower of Âtman or the Universal, One Self.<\/p><p>[10] Kala Hamsa, the “Bird” or Swan (Vide No. 11). Says the Nâda-Bindu Upanishad (Rig Veda) translated by the Kumbakonam Theos. Society — “The syllable a is considered to be its (the bird Hamsa’s) right wing, u, its left, m, its tail, and the Ardha-mâtra (half metre) is said to be its head.”<\/p><p>[11] Eternity with the Orientals has quite another signification than it has with us. It stands generally for the 100 years or “age” of Brahmâ, the duration of a Kalpa or a period of 4,320,000,000 years.<\/p><p>[12] Says the same Nâda-Bindu, “A Yogi who bestrides the Hamsa (thus contemplates on Aum) is not affected by Karmic influences or crores of sins.”<\/p><p>[13] Give up the life of physical personality if you would live in spirit.<\/p><p>[14] The three states of consciousness, which are Jâgrat, the waking; Svapna, the dreaming; and Sushupti, the deep sleeping state. These three Yogi conditions, lead to the fourth, or —<\/p><p>[15] The Turîya, that beyond the dreamless state, the one above all, a state of high spiritual consciousness.<\/p>", "images": []}, {"pdf_page_index": 47, "pdf_page_number": 48, "label": "Footnotes", "html": "<p>[16] Some Sanskrit mystics locate seven planes of being, the seven spiritual lokas or worlds within the body of Kala Hamsa, the Swan out of Time and Space, convertible into the Swan in Time, when it becomes Brahmâ instead of Brahma (neuter).<\/p><p>[17] The phenomenal World of Senses and of terrestrial consciousness — only.<\/p><p>[18] The Hall of Probationary Learning.<\/p><p>[19] The astral region, the Psychic World of super-sensuous perceptions and of deceptive sights — the world of Mediums. It is the great “Astral Serpent” of Éliphas Lévi. No blossom plucked in those regions has ever yet been brought down on earth without its serpent coiled around the stem. It is the world of the Great Illusion.<\/p><p>[20] The region of the full Spiritual Consciousness beyond which there is no longer danger for him who has reached it.<\/p><p>[21] The Initiate who leads the disciple through the Knowledge given to him to his spiritual, or second, birth is called the Father guru or Master.<\/p><p>[22] Ajñâna is ignorance or non-wisdom the opposite of “Knowledge,” jñâna.<\/p><p>[23] Mâra is in exoteric religions a demon, an Asura, but in esoteric philosophy it is personified temptation through men’s vices, and translated literally means “that which kills” the Soul. It is represented as a King (of the Mâras) with a crown in which shines a jewel of such lustre that it blinds those who look at it, this lustre referring of course to the fascination exercised by vice upon certain natures.<\/p>", "images": []}, {"pdf_page_index": 48, "pdf_page_number": 49, "label": "Footnotes", "html": "<p>[24] The inner chamber of the Heart, called in Sanskrit Brahmapura. The “fiery power” is Kundalinî.<\/p><p>[25] The ”Power” and the “World-mother” are names given to Kundalinî — one of the mystic “Yogi powers.” It is Buddhi considered as an active instead of a passive principle (which it is generally, when regarded only as the vehicle, or casket of the Supreme Spirit Âtma). It is an electro-spiritual force, a creative power which when aroused into action can as easily kill as it can create.<\/p><p>[26] Khechara or “sky-walker” or “goer.” As explained in the 6th Adhyâya of that king of mystic works the Jñâneśvari — the body of the Yogi becomes as one formed of the wind; as “a cloud from which limbs have sprouted out,” after which — “he (the Yogi) beholds the things beyond the seas and stars; he hears the language of the Devas and comprehends it, and perceives what is passing in the mind of the ant.”<\/p><p>[27] The Higher SELF.<\/p><p>[28] Vînâ is an Indian stringed instrument like a lute.<\/p><p>[29] The six principles; meaning when the lower personality is destroyed and the inner individuality is merged into and lost in the Seventh or Spirit.<\/p><p>[30] The disciple is one with Brahmâ or the Âtman.<\/p><p>[31] The astral form produced by the Kâmic principle, the Kâma rûpa or body of desire.<\/p><p>[32] Mânasa rûpa. The first refers to the astral or personal Self; the second to the individuality or the reincarnating Ego whose consciousness on our plane or the lower Manas — has to be paralyzed.<\/p>", "images": []}, {"pdf_page_index": 49, "pdf_page_number": 50, "label": "Footnotes", "html": "<p>[33] Kundalinî (the “Serpent Power” or mystic fire.) is called the “Serpentine” or the annular power on account of its spiral-like working or progress in the body of the ascetic developing the power in himself. It is an electric fiery occult or Fohatic power, the great pristine force, which underlies all organic and inorganic matter.<\/p><p>[34] This ”Path” is mentioned in all the Mystic Works. As Krishna says in the Jñâneśvari: “When this Path is beheld . . . whether one sets out to the bloom of the east or to the chambers of the west, without moving, O holder of the bow, is the travelling in this road. In this path, to whatever place one would go, that place one’s own self becomes.” “Thou art the Path” is said to the adept guru and by the latter to the disciple, after initiation. “I am the way and the Path” says another Master.<\/p><p>[35] Adeptship — the “blossom of Bodhisattva.”<\/p><p>[36] Tanhâ — “the will to live,” the fear of death and love for life, that force or energy which causes the rebirths.<\/p><p>[37] The inner chamber of the Heart, called in Sanskrit Brahmapura. The “fiery power” is Kundalinî.<\/p><p>[38] These mystic sounds or the melody heard by the ascetic at the beginning of his cycle of meditation called Anâhata-śabda by the Yogis.<\/p><p>[39] This means that in the sixth stage of development which, in the occult system is Dhâranâ, every sense as an individual faculty has to be “killed” (or paralyzed) on this plane, passing into and merging with the Seventh sense, the most spiritual.<\/p>", "images": []}, {"pdf_page_index": 50, "pdf_page_number": 51, "label": "Footnotes", "html": "<p>[40] Dhâranâ, is the intense and perfect concentration of the mind upon some one interior object, accompanied by complete abstraction from everything pertaining to the external Universe, or the world of the senses.<\/p><p>[41] Every stage of development in Râja Yoga is symbolised by a geometrical figure. This one is the sacred Triangle and precedes Dhâranâ. The [triangle] is the sign of the high chelas, while another kind of triangle is that of high Initiates. It is the symbol “I” discoursed upon by Buddha and used by him as a symbol of the embodied form of Tathâgata when released from the three methods of the Prajñâ. Once the preliminary and lower stages passed, the disciple sees no more the [triangle] but the — the abbreviation of the —, the full Septenary. Its true form is not given here, as it is almost sure to be pounced upon by some charlatans and — desecrated in its use for fraudulent purposes.<\/p><p>[42] The star that burns overhead is the “the star of initiation.” The caste-mark of Śaivas, or devotees of the sect of Śiva, the great patron of all Yogins, is a black round spot, the symbol of the Sun now, perhaps, but that of the star of initiation, in Occultism, in days of old.<\/p><p>[43] The basis (upâdhi) of the ever unreachable ”flame,” so long as the ascetic is still in this life.<\/p>", "images": []}, {"pdf_page_index": 51, "pdf_page_number": 52, "label": "Footnotes", "html": "<p>[44] Dhyâna is the last stage before the final on this Earth unless one becomes a full mahatma. As said already in this state the Râja Yogi is yet spiritually conscious of Self, and the working of his higher principles. One step more, and he will be on the plane beyond the Seventh (or fourth according to some schools). These, after the practice of Pratyâhâra — a preliminary training, in order to control one’s mind and thoughts — count Dhâranâ, Dhyâna and Samâdhi and embraces the three under the generic name of Samyama.<\/p><p>[45] Samâdhi is the state in which the ascetic loses the consciousness of every individuality including his own. He becomes — the All.<\/p><p>[46] The ”four modes of truth” are, in Northern Buddhism, Ku ”suffering or misery”; Tu the assembling of temptations; Mu ”their destructions” and Tao, the “path.” The “five impediments” are the knowledge of misery, truth about human frailty, oppressive restraints, and the absolute necessity of separation from all the ties of passion and even of desires. The “Path of Salvation” — is the last one.<\/p><p>[47] At the portal of the “assembling” the King of the Mâras the Mahâ Mâra stands trying to blind the candidate by the radiance of his “Jewel.”<\/p><p>[48] This is the fourth “Path” out of the five paths of rebirth which lead and toss all human beings into perpetual states of sorrow and joy. These “paths” are but subdivisions of the One, the Path followed by Karma.<\/p>", "images": []}, {"pdf_page_index": 52, "pdf_page_number": 53, "label": "Footnotes", "html": "<p>[49] The two schools of Buddha’s doctrine, the esoteric and the exoteric, are respectively called the “Heart” and the “Eye” Doctrine. Bodhidharma called them in China — from whence the names reached Tibet — the Tsung-men (esoteric) and Kiau-men (exoteric school). It is so named, because it is the teaching which emanated from Gautama Buddha’s heart, whereas the “Eye” Doctrine was the work of his head or brain. The “Heart Doctrine” is also called “the seal of truth” or the “true seal,” a symbol found on the heading of almost all esoteric works.<\/p><p>[50] The ”tree of knowledge” is a title given by the followers of the Bodhidharma (Wisdom religion) to those who have attained the height of mystic knowledge — adepts. Nâgârjuna the founder of the Mâdhyamika School was called the “Dragon Tree,” Dragon standing as a symbol of Wisdom and Knowledge. The tree is honoured because it is under the Bodhi (wisdom) Tree that Buddha received his birth and enlightenment, preached his first sermon and died.<\/p><p>[51] “Secret Heart” is the esoteric doctrine.<\/p><p>[52] “Diamond Soul” “Vajrasattva,” a title of the supreme Buddha, the “Lord of all Mysteries,” called Vajradhara and Âdi-Buddha.<\/p><p>[53] Sat, the one eternal and Absolute Reality and Truth, all the rest being illusion.<\/p>", "images": []}, {"pdf_page_index": 53, "pdf_page_number": 54, "label": "Footnotes", "html": "<p>[54] From Shen-hsiu’s Doctrine, who teaches that the human mind is like a mirror which attracts and reflects every atom of dust, and has to be, like that mirror, watched over and dusted every day. Shen-hsiu was the sixth Patriarch of North China who taught the esoteric doctrine of Bodhidharma.<\/p><p>[55] The reincarnating Ego is called by the Northern Buddhists the “true man,” who becomes in union with his Higher-Self — a Buddha.<\/p><p>[56] “Buddha” means “Enlightened.”<\/p><p>[57] The exoteric Buddhism of the masses.<\/p><p>[58] The usual formula that precedes the Buddhist Scriptures, meaning, that that which follows is what has been recorded by direct oral tradition from Buddha and the Arhats.<\/p><p>[59] Immortality.<\/p><p>[60] Rathapâla the great Arhat thus addresses his father in the legend called Rathapâla Sûtrasanne. But as all such legends are allegorical (e.g. Rathapâla’s father has a mansion with seven doors) hence the reproof, to those who accept them literally.<\/p><p>[61] Brahman ascetics.<\/p><p>[62] The reincarnating Ego.<\/p><p>[63] True, divine Wisdom.<\/p><p>[64] The ”Higher Self” the “seventh” principle.<\/p><p>[65] Our physical bodies are called “Shadows” in the mystic schools.<\/p><p>[66] Buddha.<\/p><p>[67] A hermit who retires to the jungles and lives in a forest, when becoming a Yogi.<\/p><p>[68] Julai the Chinese name for Tathâgata, a title applied to every Buddha.<\/p>", "images": []}, {"pdf_page_index": 54, "pdf_page_number": 55, "label": "Footnotes", "html": "<p>[69] All the Northern and Southern traditions agree in showing Buddha quitting his solitude as soon as he had resolved the problem of life — i.e., received the inner enlightenment — and teaching mankind publicly.<\/p><p>[70] Every spiritual Ego is a ray of a “Planetary Spirit” according to esoteric teaching.<\/p><p>[71] “Personalities” or physical bodies called “shadows” are evanescent.<\/p><p>[72] Mind (Manas) the thinking Principle or Ego in man, is referred to “Knowledge” itself, because the human Egos are called Mânasa-putras the sons of (universal) Mind.<\/p><p>[73] Vide Part III. Glossary, paragraph 34 et seq.<\/p><p>[74] Ibid.<\/p><p>[75] The Shangna robe, from Shangnavasu of Râjagriha the third great Arhat or “Patriarch” as the Orientalists call the hierarchy of the 33 Arhats who spread Buddhism. “Shangna robe” means metaphorically, the acquirement of Wisdom with which the Nirvâna of destruction (of personality) is entered. Literally, the “initiation robe” of the Neophytes. Edkins states that this “grass cloth” was brought to China from Tibet in the Tong Dynasty. “When an Arhan is born this plant is found growing in a clean spot” says the Chinese as also the Tibetan legend.<\/p><p>[76] To ”practise the Pâramitâ Path” means to become a Yogi with a view of becoming an ascetic.<\/p><p>[77] “To-morrow” means the following rebirth or reincarnation.<\/p><p>[78] Precepts of the Prasanga School.<\/p><p>[79] “Great Journey” or the whole complete cycle of existences, in one “Round.”<\/p><p>[80] Mars.<\/p><p>[81] Mercury.<\/p>", "images": []}, {"pdf_page_index": 55, "pdf_page_number": 56, "label": "Footnotes", "html": "<p>[82] The Sun. Nyima, the Sun in Tibetan Astrology. Migmar or Mars is symbolized by an “Eye,” and Lhagpa or Mercury by a “Hand.”<\/p><p>[83] Buddha.<\/p><p>[84] Srotâpatti or “he who enters in the stream” of Nirvâna, unless he reaches the goal owing to some exceptional reasons, can rarely attain Nirvâna in one birth. Usually a Chela is said to begin the ascending effort in one life and end or reach it only in his seventh succeeding birth.<\/p><p>[85] Meaning the personal lower “Self.”<\/p><p>[86] Tîrthikas are the Brahmanical Sectarians “beyond” the Himalayas called “infidels” by the Buddhists in the sacred land, Tibet, and vice versa.<\/p><p>[87] Boundless Vision or psychic, superhuman sight. An Arhan is credited with “seeing” and knowing all at a distance as well as on the spot.<\/p><p>[88] Vide supra 22: Shangna plant.<\/p><p>[89] The ”living” is the immortal Higher Ego, and the “dead” — the lower personal Ego.<\/p><p>[90] Vide infra Part III. par. 34.<\/p><p>[91] The ”Secret Life” is life as a Nirmânakâya.<\/p><p>[92] The ”Open” and the “Secret Path” — or the one taught to the layman, the exoteric and the generally accepted, and the other the Secret Path — the nature of which is explained at initiation.<\/p><p>[93] Men ignorant of the Esoteric truths and Wisdom are called “the living Dead.”<\/p><p>[94] Vide infra Part III. 34.<\/p>", "images": []}, {"pdf_page_index": 56, "pdf_page_number": 57, "label": "Footnotes", "html": "<p>[95] Pratyeka Buddhas are those Bodhisattvas who strive after and often reach the Dharmakâya robe after a series of lives. Caring nothing for the woes of mankind or to help it, but only for their own bliss, they enter Nirvâna and — disappear from the sight and the hearts of men. In Northern Buddhism a “Pratyeka Buddha” is a synonym of spiritual Selfishness.<\/p><p>[96] Upâdhyâya is a spiritual preceptor, a Guru. The Northern Buddhists choose these generally among the “Naljor,” saintly men, learned in gotrabhû-ñâna and ñâna-dassana-suddhi teachers of the Secret Wisdom.<\/p><p>[97] Yâna — vehicle: thus Mahâyâna is the “Great Vehicle,” and Hînayâna, the “Lesser Vehicle,” the names for two schools of religious and philosophical learning in Northern Buddhism.<\/p><p>[98] Śrâvaka — a listener, or student who attends to the religious instructions. From the root “Śru.” When from theory they go into practice or performance of asceticism, they become Śramanas, “exercisers,” from Śrama, action. As Hardy shows, the two appellations answer to the words akoustikoi and asketai of the Greeks.<\/p><p>[99] Samtan (Tibetan), the same as the Sanskrit Dhyâna, or the state of meditation, of which there are four degrees.<\/p><p>[100] Pâramitâs, the six transcendental virtues; for the priests there are ten.<\/p>", "images": []}, {"pdf_page_index": 57, "pdf_page_number": 58, "label": "Footnotes", "html": "<p>[101] Srotâpatti — (lit.) “he who has entered the stream” that leads to the Nirvânic ocean. This name indicates the first Path. The name of the second is the Path of Sakridâgâmin, “he who will receive birth (only) once more.” The third is called Anâgâmin, “he who will be reincarnated no more,” unless he so desires in order to help mankind. The fourth Path is known as that of Rahat or Arhat. This is the highest. An Arhat sees Nirvâna during his life. For him it is no post-mortem state, but Samâdhi, during which he experiences all Nirvânic bliss. (How little one can rely upon the Orientalists for the exact words and meaning, is instanced in the case of three “alleged” authorities. Thus the four names just explained are given by R. Spence Hardy as: 1. Sowân; 2. Sakradâgâmi; 3. Anâgâmi, and 4. Arya. By the Rev. J. Edkins they are given as: 1. Srôtâpanna; 2. Sagardagam; 3. Anagamin, and 4. Arhan. Schlagintweit again spells them differently, each, moreover, giving another and a new variation in the meaning of the terms.)<\/p><p>[102] Knowledge, Wisdom.<\/p><p>[103] “Arrival at the shore” is with the Northern Buddhists synonymous with reaching Nirvâna through the exercise of the six and the ten Pâramitâs (virtues).<\/p><p>[104] A saint, an adept.<\/p><p>[105] The ”MASTER-SOUL” is Alaya, the Universal Soul or Âtman, each man having a ray of it in him and being supposed to be able to identify himself with and to merge himself into it.<\/p>", "images": []}, {"pdf_page_index": 58, "pdf_page_number": 59, "label": "Footnotes", "html": "<p>[106] Antahkarana is the lower Manas, the Path of communication or communion between the personality and the higher Manas or human Soul. At death it is destroyed as a Path or medium of communication, and its remains survive in a form as the Kâmarûpa — the “shell.”<\/p><p>[107] The Northern Buddhists, and all Chinamen, in fact, find in the deep roar of some of the great and sacred rivers the key-note of Nature. Hence the simile. It is a well-known fact in Physical Science, as well as in Occultism, that the aggregate sound of Nature — such as heard in the roar of great rivers, the noise produced by the waving tops of trees in large forests, or that of a city heard at a distance — is a definite single tone of quite an appreciable pitch. This is shown by physicists and musicians. Thus Prof. Rice (Chinese Music) shows that the Chinese recognized the fact thousands of years ago by saying that “the waters of the Hoang-ho rushing by, intoned the kung” called “the great tone” in Chinese music; and he shows this tone corresponding with the F, “considered by modern physicists to be the actual tonic of Nature.” Professor B. Silliman mentions it, too, in his Principles of Physics, saying that “this tone is held to be the middle F of the piano; which may, therefore, be considered the key-note of Nature.”<\/p>", "images": []}, {"pdf_page_index": 59, "pdf_page_number": 60, "label": "Footnotes", "html": "<p>[108] The Bons or Dugpas, the sect of the “Red Caps,” are regarded as the most versed in sorcery. They inhabit Western and little Tibet and Bhutan. They are all Tântrikas. It is quite ridiculous to find Orientalists who have visited the borderlands of Tibet, such as Schlagintweit and others, confusing the rites and disgusting practices of these with the religious beliefs of the Eastern Lamas, the “Yellow Caps,” and their Naljors or holy men. The following is an instance.<\/p><p>[109] Kshânti, “patience,” vide supra the enumeration of the golden keys.<\/p><p>[110] Dorje is the Sanskrit Vajra, a weapon or instrument in the hands of some gods (the Tibetan Dragshed, the Devas who protect men), and is regarded as having the same occult power of repelling evil influences by purifying the air as Ozone in chemistry. It is also a Mudrâ a gesture and posture used in sitting for meditation. It is, in short, a symbol of power over invisible evil influences, whether as a posture or a talisman. The Bons or Dugpas, however, having appropriated the symbol, misuse it for purposes of Black Magic. With the “Yellow Caps,” or Gelugpas, it is a symbol of power, as the Cross is with the Christians, while it is in no way more “superstitious.” With the Dugpas, it is like the double triangle reversed, the sign of sorcery.<\/p><p>[111] Virâga is that feeling of absolute indifference to the objective universe, to pleasure and to pain. “Disgust” does not express its meaning, yet it is akin to it.<\/p>", "images": []}, {"pdf_page_index": 60, "pdf_page_number": 61, "label": "Footnotes", "html": "<p>[112] Ahankâra — the “I” or feeling of one’s personality, the “I-am-ness.”<\/p><p>[113] “One who walks in the steps of his predecessors” or “those who came before him,” is the true meaning of the name Tathâgata.<\/p><p>[114] Samvriti is that one of the two truths which demonstrates the illusive character or emptiness of all things. It is relative truth in this case. The Mahâyâna school teaches the difference between these two truths — Paramârthasatya and Samvritisatya (Satya, “truth”). This is the bone of contention between the Mâdhyamikas and the Yogâchâras, the former denying and the latter affirming that every object exists owing to a previous cause or by a concatenation. The Mâdhyamikas are the great Nihilists and Deniers, for whom everything is parikalpita, an illusion and an error in the world of thought and the subjective, as much as in the objective universe. The Yogâchâras are the great spiritualists. Samvriti, therefore, as only relative truth, is the origin of all illusion.<\/p><p>[115] Lhamayin are elementals and evil spirits adverse to men and their enemies.<\/p><p>[116] The Higher Ego, or Thinking Self.<\/p><p>[117] Jñâna-Mârga is the “Path of Jñâna,” literally; or the Path of pure knowledge, of Paramârtha or (Sanskrit) Svasamvedana ”the self-evident or self-analysing reflection.”<\/p><p>[118] Vide Glossary of Part II., Number 4. “Diamond-Soul” or Vajradhara presides over the Dhyâni-Buddhas.<\/p><p>[119] Bhagavadgîtâ.<\/p>", "images": []}, {"pdf_page_index": 61, "pdf_page_number": 62, "label": "Footnotes", "html": "<p>[120] This is an allusion to a well-known belief in the East (as in the West, too, for the matter of that) that every additional Buddha or Saint is a new soldier in the army of those who work for the liberation or salvation of mankind. In Northern Buddhist countries, where the doctrine of Nirmânakâyas — those Bodhisattvas who renounce well-earned Nirvâna or the Dharmakâya vesture (both of which shut them out for ever from the world of men) in order to invisibly assist mankind and lead it finally to Paranirvâna — is taught, every new Bodhisattva or initiated great Adept is called the “liberator of mankind.” The statement made by Schlagintweit in his “Buddhism in Tibet” to the effect that Prulpai Ku or “Nirmânakâya” is “the body in which the Buddhas or Bodhisattvas appear upon earth to teach men” — is absurdly inaccurate and explains nothing.<\/p><p>[121] A reference to human passions and sins which are slaughtered during the trials of the novitiate, and serve as well-fertilized soil in which “holy germs” or seeds of transcendental virtues may germinate. Pre-existing or innate virtues, talents or gifts are regarded as having been acquired in a previous birth. Genius is without exception a talent or aptitude brought from another birth.<\/p>", "images": []}, {"pdf_page_index": 62, "pdf_page_number": 63, "label": "Footnotes", "html": "<p>[122] Titikshâ is the fifth state of Râja Yoga — one of supreme indifference; submission, if necessary, to what is called “pleasures and pains for all,” but deriving neither pleasure nor pain from such submission — in short, the becoming physically, mentally, and morally indifferent and insensible to either pleasure or pain.<\/p><p>[123] Sowanee is one who practices Sowan, the first path in Jñâna, a Srotâpatti.<\/p><p>[124] “Day” means here a whole Manvantara, a period of incalculable duration.<\/p><p>[125] Mount Meru, the sacred mountain of the Gods.<\/p><p>[126] In the Northern Buddhist symbology, Amitâbha or “Boundless Space” (Parabrahm) is said to have in his paradise two Bodhisattvas — Kwan-shi-yin and Tashishi — who ever radiate light over the three worlds where they lived, including our own (vide 27), in order to help with this light (of knowledge) in the instruction of Yogis, who will, in their turn, save men. Their exalted position in Amitâbha’s realm is due to deeds of mercy performed by the two, as such Yogis, when on earth, says the allegory.<\/p><p>[127] These three worlds are the three planes of being, the terrestrial, astral and the spiritual.<\/p><p>[128] Cycles of ages.<\/p><p>[129] The ”Guardian Wall” or the “Wall of Protection.” It is taught that the accumulated efforts of long generations of Yogis, Saints and Adepts, especially of the Nirmânakâyas — have created, so to say, a wall of protection around mankind, which wall shields mankind invisibly from still worse evils.<\/p>", "images": []}, {"pdf_page_index": 63, "pdf_page_number": 64, "label": "Footnotes", "html": "<p>[130] Sowan and Srotâpatti are synonymous terms.<\/p><p>[131] Mârga — “Path.”<\/p><p>[132] From the Sanskrit Arhat or Arhan.<\/p><p>[133] Kleśa is the love of pleasure or of worldly enjoyment, evil or good.<\/p><p>[134] Tanhâ, the will to live, that which causes rebirth.<\/p><p>[135] This ”compassion” must not be regarded in the same light as “God, the divine love” of the Theists. Compassion stands here as an abstract, impersonal law whose nature, being absolute Harmony, is thrown into confusion by discord, suffering and sin.<\/p><p>[136] In the Northern Buddhist phraseology all the great Arhats, Adepts and Saints are called Buddhas.<\/p><p>[137] A Bodhisattva is, in the hierarchy, less than a “perfect Buddha.” In the exoteric parlance these two are very much confused. Yet the innate and right popular perception, owing to that self-sacrifice, has placed a Bodhisattva higher in its reverence than a Buddha.<\/p>", "images": []}, {"pdf_page_index": 64, "pdf_page_number": 65, "label": "Footnotes", "html": "<p>[138] This same popular reverence calls “Buddhas of Compassion” those Bodhisattvas who, having reached the rank of an Arhat (i.e., having completed the fourth or seventh Path), refuse to pass into the Nirvânic state or “don the Dharmakâya robe and cross to the other shore,” as it would then become beyond their power to assist men even so little as Karma permits. They prefer to remain invisibly (in Spirit, so to speak) in the world, and contribute toward man’s salvation by influencing them to follow the Good Law, i.e., lead them on the Path of Righteousness. It is part of the exoteric Northern Buddhism to honour all such great characters as Saints, and to offer even prayers to them, as the Greeks and Catholics do to their Saints and Patrons; on the other hand, the esoteric teachings countenance no such thing. There is a great difference between the two teachings. The exoteric layman hardly knows the real meaning of the word Nirmânakâya — hence the confusion and inadequate explanations of the Orientalists. For example Schlagintweit believes that Nirmânakâya-body, means the physical form assumed by the Buddhas when they incarnate on earth — “the least sublime of their earthly encumbrances” (vide ”Buddhism in Tibet”) — and he proceeds to give an entirely false view on the subject. The real teaching is, however, this: —<\/p><p>The three Buddhic bodies or forms are styled: —<\/p><p>1. Nirmânakâya.2. Sambhogakâya.3. Dharmakâya.<\/p>", "images": []}, {"pdf_page_index": 65, "pdf_page_number": 66, "label": "Footnotes", "html": "<p>The first is that ethereal form which one would assume when leaving his physical he would appear in his astral body — having in addition all the knowledge of an Adept. The Bodhisattva develops it in himself as he proceeds on the Path. Having reached the goal and refused its fruition, he remains on Earth, as an Adept; and when he dies, instead of going into Nirvâna, he remains in that glorious body he has woven for himself, invisible to uninitiated mankind, to watch over and protect it.<\/p><p>Sambhogakâya is the same, but with the additional lustre of “three perfections,” one of which is entire obliteration of all earthly concerns.<\/p><p>The Dharmakâya body is that of a complete Buddha, i.e., no body at all, but an ideal breath: Consciousness merged in the Universal Consciousness, or Soul devoid of every attribute. Once a Dharmakâya, an Adept or Buddha leaves behind every possible relation with, or thought for this earth. Thus, to be enabled to help humanity, an Adept who has won the right to Nirvâna, “renounces the Dharmakâya body” in mystic parlance; keeps, of the Sambhogakâya, only the great and complete knowledge, and remains in his Nirmânakâya body. The esoteric school teaches that Gautama Buddha with several of his Arhats is such a Nirmânakâya, higher than whom, on account of the great renunciation and sacrifice to mankind there is none known.<\/p>", "images": []}, {"pdf_page_index": 66, "pdf_page_number": 67, "label": "Footnotes", "html": "<p>[139] Myalba is our earth — pertinently called “Hell,” and the greatest of all Hells, by the esoteric school. The esoteric doctrine knows of no hell or place of punishment other than on a man-bearing planet or earth. Avîchi is a state and not a locality.<\/p><p>[140] Meaning that a new and additional Saviour of mankind is born, who will lead men to final Nirvâna i.e., after the end of the life-cycle.<\/p><p>[141] This is one of the variations of the formula that invariably follows every treatise, invocation or Instruction. “Peace to all beings,” “Blessings on all that Lives,” &amp;c., &amp;c.<\/p>", "images": []}]</script>

<script>
const PAGES = JSON.parse(document.getElementById('pages-data').textContent);
const IMAGES = JSON.parse(document.getElementById('images-data').textContent);

let current = 0;

function imgSrc(file){
  return 'data:image/jpeg;base64,' + IMAGES[file];
}

function render(){
  const p = PAGES[current];
  document.getElementById('section-pill').textContent = 'Page ' + p.pdf_page_number;
  document.getElementById('eyebrow').textContent = 'Source: page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('page-title').textContent = p.label;
  document.getElementById('content').innerHTML = p.html;

  const figWrap = document.getElementById('figures');
  figWrap.innerHTML = '';
  p.images.forEach(im => {
    const card = document.createElement('div');
    card.className = 'figure-card';
    const img = document.createElement('img');
    img.src = imgSrc(im.file);
    img.alt = im.caption;
    img.addEventListener('click', () => openLightbox(img.src, im.caption));
    const cap = document.createElement('div');
    cap.className = 'figure-cap';
    cap.textContent = im.caption;
    card.appendChild(img);
    card.appendChild(cap);
    figWrap.appendChild(card);
  });

  document.getElementById('folio-label').textContent = 'Page ' + p.pdf_page_number + ' / ' + PAGES.length;
  document.getElementById('progress-label').textContent = 'Page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('progress-fill').style.width = (((current+1)/PAGES.length)*100).toFixed(1) + '%';

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === PAGES.length - 1;
  document.getElementById('next-btn').textContent = current === PAGES.length -1 ? 'End' : 'Next \u2192';

  document.getElementById('leaf').style.animation = 'none';
  void document.getElementById('leaf').offsetWidth;
  document.getElementById('leaf').style.animation = '';

  updateActiveTocItem();
  window.scrollTo({top:0, behavior:'smooth'});
  if (window.__afterRender) window.__afterRender();
}

function openLightbox(src, alt){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('prev-btn').addEventListener('click', () => {
  if (current > 0){ current--; render(); }
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (current < PAGES.length -1){ current++; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// ---------- TOC ----------
function buildToc(){
  const list = document.getElementById('toc-list');
  PAGES.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = 'toc-item';
    btn.dataset.idx = idx;
    btn.textContent = 'p.' + p.pdf_page_number + '  —  ' + p.label;
    btn.addEventListener('click', () => {
      current = idx;
      render();
      closeToc();
    });
    list.appendChild(btn);
  });
}
function updateActiveTocItem(){
  document.querySelectorAll('.toc-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === current);
  });
}
function openToc(){
  document.getElementById('toc-panel').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeToc(){
  document.getElementById('toc-panel').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('toc-toggle').addEventListener('click', openToc);
document.getElementById('toc-close').addEventListener('click', closeToc);
document.getElementById('scrim').addEventListener('click', closeToc);

buildToc();
render();

// ---------- Read aloud (prefers Indian English voices) ----------
(function(){
  const listenBtn = document.getElementById('listen-toggle');
  const bar = document.getElementById('listen-bar');
  const voiceSel = document.getElementById('voice-select');
  const rateSel = document.getElementById('rate-select');
  const playBtn = document.getElementById('listen-play');
  const stopBtn = document.getElementById('listen-stop');
  const autoChk = document.getElementById('listen-auto');
  const status = document.getElementById('listen-status');

  if (!('speechSynthesis' in window)) {
    listenBtn.style.display = 'none';
    return;
  }

  let voices = [];
  let listening = false;
  let paused = false;
  let gen = 0;

  function score(v){
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l.indexOf('en-in') === 0) return 3;
    if (l === 'en-gb') return 2;
    return 1;
  }

  function loadVoices(){
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
    voices = (en.length ? en : all).slice().sort((a, b) => score(b) - score(a));
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const isIndian = (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0;
      opt.textContent = v.name + ' (' + v.lang + ')' + (isIndian ? ' — Indian accent' : '');
      voiceSel.appendChild(opt);
    });
    const idx = voices.findIndex(v => (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0);
    voiceSel.value = idx >= 0 ? idx : 0;
    if (!listening) {
      status.textContent = idx >= 0
        ? 'Indian English voice ready.'
        : 'No Indian English voice found on this device — closest English voice selected.';
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function pageText(){
    const p = PAGES[current];
    const div = document.createElement('div');
    div.innerHTML = p.html;
    let t = (div.textContent || '').replace(/\s+/g, ' ').trim();
    (p.images || []).forEach(im => { t += ' Figure on this page: ' + im.caption + '.'; });
    return t;
  }

  function chunk(text){
    const parts = text.match(/[^.!?\u2026]+[.!?\u2026]+["')\]]*\s*/g) || [text];
    const out = [];
    let buf = '';
    parts.forEach(s => {
      if ((buf + s).length > 220) { if (buf) out.push(buf); buf = s; }
      else buf += s;
    });
    if (buf) out.push(buf);
    return out;
  }

  function speak(){
    const text = pageText();
    if (!text) { status.textContent = 'Nothing to read on this page.'; return; }
    const myGen = ++gen;
    speechSynthesis.cancel();
    const pieces = chunk(text);
    const v = voices[parseInt(voiceSel.value, 10)];
    pieces.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateSel.value);
      if (i === pieces.length - 1) {
        u.onend = () => {
          if (!listening || myGen !== gen) return;
          if (autoChk.checked && current < PAGES.length - 1) { current++; render(); }
          else setUi(false);
        };
      }
      speechSynthesis.speak(u);
    });
    status.textContent = 'Reading page ' + (current + 1) + ' of ' + PAGES.length + '…';
  }

  function setUi(on){
    listening = on;
    paused = false;
    playBtn.innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Read aloud';
    stopBtn.disabled = !on;
    if (!on) status.textContent = 'Stopped.';
  }

  window.__afterRender = function(){
    if (listening) speak();
  };

  setInterval(() => {
    if (listening && !paused && speechSynthesis.speaking) speechSynthesis.resume();
  }, 10000);

  listenBtn.addEventListener('click', () => bar.classList.toggle('open'));
  playBtn.addEventListener('click', () => {
    if (!listening) { setUi(true); speak(); return; }
    if (paused) { speechSynthesis.resume(); paused = false; playBtn.innerHTML = '&#10074;&#10074; Pause'; }
    else { speechSynthesis.pause(); paused = true; playBtn.innerHTML = '&#9654; Resume'; }
  });
  stopBtn.addEventListener('click', () => { gen++; speechSynthesis.cancel(); setUi(false); });
  voiceSel.addEventListener('change', () => { if (listening) speak(); });
  rateSel.addEventListener('change', () => { if (listening) speak(); });
})();

</script>

<script>
(function(){
  var NOTES = {};
  var CHMAP = [];
  try { NOTES = JSON.parse(document.getElementById('notes-data').textContent); } catch(e) {}
  try { CHMAP = JSON.parse(document.getElementById('chapter-map').textContent); } catch(e) {}
  var term = '', matchPages = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function pageText(p){ var d=document.createElement('div'); d.innerHTML=p.html; return d.textContent || ''; }

  // ---------- SEARCH ----------
  var bar = document.getElementById('search-bar');
  var input = document.getElementById('search-input');
  var info = document.getElementById('search-info');

  function clearMarks(){
    var c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(function(mk){
      var t = document.createTextNode(mk.textContent);
      mk.parentNode.replaceChild(t, mk);
    });
    c.normalize();
  }
  function highlight(){
    clearMarks();
    if (!term || term.length < 2) return;
    var c = document.getElementById('content');
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var t = term.toLowerCase();
    nodes.forEach(function(n){
      var txt = n.nodeValue, low = txt.toLowerCase(), idx = low.indexOf(t);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(txt.slice(pos, idx)));
        var mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = txt.slice(idx, idx + term.length);
        frag.appendChild(mk);
        pos = idx + term.length;
        idx = low.indexOf(t, pos);
      }
      frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function infoText(){
    if (!term || term.length < 2) { info.textContent = ''; return; }
    if (!matchPages.length) { info.textContent = 'No matches'; return; }
    var pos = matchPages.indexOf(current);
    info.textContent = matchPages.length + (matchPages.length > 1 ? ' pages' : ' page') +
      (pos >= 0 ? ' — match ' + (pos + 1) + ' of ' + matchPages.length : '');
  }
  function doSearch(){
    term = input.value.trim();
    matchPages = [];
    if (term.length >= 2){
      var t = term.toLowerCase();
      PAGES.forEach(function(p, i){ if (pageText(p).toLowerCase().indexOf(t) >= 0) matchPages.push(i); });
    }
    if (matchPages.length){ current = matchPages[0]; render(); }
    else { highlight(); infoText(); }
  }
  function step(d){
    if (!matchPages.length) return;
    var pos = matchPages.indexOf(current);
    if (pos < 0) pos = 0;
    pos = (pos + d + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }
  var searchT = null;
  input.addEventListener('input', function(){ clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ clearTimeout(searchT); doSearch(); } });
  document.getElementById('search-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('search-next').addEventListener('click', function(){ step(1); });
  document.getElementById('search-close').addEventListener('click', function(){
    bar.classList.remove('open'); term=''; matchPages=[]; highlight(); infoText();
  });
  document.getElementById('search-toggle').addEventListener('click', function(){
    var open = bar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) input.focus();
  });

  // ---------- NOTES ----------
  var panel = document.getElementById('notes-panel');
  var body = document.getElementById('notes-body');
  function showNotes(){
    var ch = null;
    for (var i = current; i >= 0; i--){
      if (CHMAP[i] && NOTES[CHMAP[i]]) { ch = CHMAP[i]; break; }
    }
    if (!ch){
      for (var j = current; j < CHMAP.length; j++){
        if (CHMAP[j] && NOTES[CHMAP[j]]) { ch = CHMAP[j]; break; }
      }
    }
    if (!ch){
      body.innerHTML = '<p class="notes-empty">No chapter notes available for this section.</p>';
      return;
    }
    var n = NOTES[ch];
    var h = '<h3>' + esc(ch) + '</h3><h4>Summary</h4><p>' + esc(n.s) + '</p>';
    if (n.p && n.p.length){
      h += '<h4>Key points</h4><ul>' + n.p.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body.innerHTML = h;
  }
  document.getElementById('notes-toggle').addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    bar.classList.remove('open');
    if (open) showNotes();
  });

  // hooks after every render
  var prevA = window.__afterRender;
  window.__afterRender = function(){
    if (prevA) prevA();
    highlight();
    infoText();
    if (panel.classList.contains('open')) showNotes();
  };
})();
</script>

<script>
(function(){
  if (window.__selSearch) return; window.__selSearch = true;
  var tip = document.createElement('div');
  tip.id = 'sel-search-tip';
  tip.innerHTML = '<button id="sel-search-btn" type="button">&#128269; Search DuckDuckGo</button>';
  document.body.appendChild(tip);
  var bar = document.createElement('div');
  bar.id = 'sel-search-bar';
  bar.innerHTML = '<span id="sel-search-msg">Search opened in a popup window.</span>' +
    '<button id="sel-search-close" type="button">&#10005; Close search window</button>';
  document.body.appendChild(bar);
  var popup = null, term = '', lastUrl = '';

  function hideTip(){ tip.classList.remove('show'); }
  function hideBar(){ bar.classList.remove('show'); }

  function showTipForSelection(){
    var sel = window.getSelection();
    var txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    if (txt.length >= 2 && txt.length <= 160){
      term = txt;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      var top = r.top - 46;
      if (top < 8) top = r.bottom + 10;
      var left = r.left + r.width / 2;
      left = Math.max(90, Math.min(window.innerWidth - 90, left));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.classList.add('show');
    } else {
      hideTip();
    }
  }

  document.addEventListener('mouseup', function(e){
    if (tip.contains(e.target) || bar.contains(e.target)) return;
    setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('keyup', function(e){
    if (e.shiftKey) setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!tip.contains(e.target)) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);

  document.getElementById('sel-search-btn').addEventListener('click', function(){
    if (!term) return;
    lastUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(term);
    popup = window.open(lastUrl, 'ddg_search_popup', 'width=920,height=700,menubar=no,toolbar=no,location=no,status=no');
    hideTip();
    var msg = document.getElementById('sel-search-msg');
    if (popup){
      msg.textContent = 'Search opened in a popup window.';
    } else {
      msg.innerHTML = 'Popup blocked — <a href="' + lastUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">open the search in a new tab</a>.';
    }
    bar.classList.add('show');
  });

  document.getElementById('sel-search-close').addEventListener('click', function(){
    if (popup && !popup.closed) popup.close();
    popup = null;
    hideBar();
  });
})();
</script>

<script>
(function(){
  if (window.__slChat) return; window.__slChat = true;
  var CFG_KEY = 'sl_llm_config';
  function loadCfg(){
    try { var raw = localStorage.getItem(CFG_KEY); if (raw) return JSON.parse(raw); } catch(e){}
    return { endpoint:'https://api.openai.com/v1/chat/completions', key:'', model:'gpt-4o-mini' };
  }
  var cfg = loadCfg();

  var fab = document.createElement('button');
  fab.id = 'sl-chat-fab'; fab.type = 'button'; fab.title = 'Library assistant';
  fab.textContent = '\uD83D\uDCAC';
  document.body.appendChild(fab);

  var panel = document.createElement('div');
  panel.id = 'sl-chat-panel';
  panel.innerHTML =
    '<div id="sl-chat-head"><span>\u2728 Library Assistant</span>' +
    '<span><button id="sl-chat-clear" type="button" title="Clear chat">\uD83D\uDDD1</button>' +
    '<button id="sl-chat-gear" type="button" title="LLM settings">\u2699</button>' +
    '<button id="sl-chat-x" type="button" title="Close">\u2715</button></span></div>' +
    '<div id="sl-chat-settings">' +
    '<b>LLM configuration (any OpenAI-compatible API)</b>' +
    '<input id="sl-cfg-endpoint" placeholder="Endpoint, e.g. https://api.openai.com/v1/chat/completions">' +
    '<input id="sl-cfg-key" type="password" placeholder="API key (stored only in this browser)">' +
    '<input id="sl-cfg-model" placeholder="Model, e.g. gpt-4o-mini">' +
    '<div class="row"><button id="sl-cfg-save" type="button">Save</button>' +
    '<button id="sl-cfg-test" type="button">Test</button><span id="sl-cfg-status"></span></div>' +
    '<div class="hint">Works with OpenAI, OpenRouter, Groq, Mistral, Ollama (http://localhost:11434/v1/chat/completions), LM Studio. Without a key I search this book locally and DuckDuckGo externally.</div>' +
    '</div>' +
    '<div id="sl-chat-body"></div>' +
    '<div id="sl-chat-inputrow"><input id="sl-chat-input" placeholder="Ask about this book, or the web\u2026">' +
    '<button id="sl-chat-send" type="button" title="Send">\u27A4</button></div>';
  document.body.appendChild(panel);

  var body = panel.querySelector('#sl-chat-body');
  var input = panel.querySelector('#sl-chat-input');
  var sendBtn = panel.querySelector('#sl-chat-send');
  var busy = false;

  function scrollBody(){ body.scrollTop = body.scrollHeight; }
  function addMsg(role, html){
    var d = document.createElement('div');
    d.className = 'sl-msg ' + role;
    d.innerHTML = html;
    body.appendChild(d); scrollBody();
    return d;
  }
  function esc(t){ var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  addMsg('bot', 'Namaste. Ask me anything \u2014 I can search <b>this book</b> page by page, answer with your configured LLM, or run an external DuckDuckGo search.');

  function pageText(p){
    var d = document.createElement('div'); d.innerHTML = p.html; return d.textContent || '';
  }

  function searchBook(q){
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    if (!terms.length) return [];
    var out = [];
    for (var i = 0; i < PAGES.length; i++){
      var txt = pageText(PAGES[i]).toLowerCase();
      var score = 0;
      for (var k = 0; k < terms.length; k++){
        var hits = txt.split(terms[k]).length - 1;
        if (hits) score += hits;
      }
      if (score) out.push({ i: i, score: score });
    }
    out.sort(function(a,b){ return b.score - a.score; });
    return out.slice(0, 5);
  }

  function snippet(i, q){
    var txt = pageText(PAGES[i]).replace(/\s+/g,' ');
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    var pos = -1;
    for (var k = 0; k < terms.length; k++){ pos = txt.toLowerCase().indexOf(terms[k]); if (pos >= 0) break; }
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 60);
    return (start ? '\u2026' : '') + txt.slice(start, start + 170) + '\u2026';
  }

  function goToPage(i){
    try { current = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch(e){ console.warn('jump failed', e); }
  }

  function callLlm(q, context){
    return fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: 'You are the assistant inside a spiritual book reader. Answer concisely. When book excerpts are provided, ground the answer in them and cite the page labels. If the question needs current external facts, say so and suggest an external search.' },
          { role: 'user', content: context ? 'Book excerpts:\n' + context + '\n\nQuestion: ' + q : q }
        ],
        temperature: 0.4
      })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error('LLM error ' + res.status + ': ' + t.slice(0,180)); });
      return res.json();
    }).then(function(data){
      var c = data.choices && data.choices[0] && data.choices[0].message;
      return (c && c.content || '(empty response)').trim();
    });
  }

  function handleSend(){
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    addMsg('user', esc(q));
    busy = true; sendBtn.disabled = true;
    var thinking = document.createElement('div');
    thinking.className = 'sl-thinking'; thinking.textContent = 'Thinking\u2026';
    body.appendChild(thinking); scrollBody();

    var hits = searchBook(q);
    var finish = function(){ busy = false; sendBtn.disabled = false; thinking.remove(); };

    function renderRefs(){
      if (!hits.length) return '';
      var h = '';
      hits.forEach(function(hit, n){
        h += '<button class="sl-ref" data-page="' + hit.i + '" type="button"><b>' + esc(PAGES[hit.i].label) +
             ' \u00b7 page ' + (hit.i + 1) + '</b><span>' + esc(snippet(hit.i, q)) + '</span>' +
             '<span class="go">Go to page \u2192</span></button>';
      });
      return h;
    }

    var done = function(html){ finish(); var m = addMsg('bot', html);
      m.querySelectorAll('.sl-ref').forEach(function(b){
        b.addEventListener('click', function(){ goToPage(parseInt(b.getAttribute('data-page'), 10)); });
      });
    };

    if (cfg.key){
      var ctx = hits.slice(0,3).map(function(hit){
        return '[' + PAGES[hit.i].label + ', page ' + (hit.i + 1) + '] ' + pageText(PAGES[hit.i]).replace(/\s+/g,' ').slice(0, 900);
      }).join('\n');
      callLlm(q, ctx).then(function(ans){ done(esc(ans) + renderRefs()); })
      .catch(function(err){ done(esc(String(err.message || err)) + renderRefs()); });
    } else if (hits.length){
      done('I found ' + hits.length + ' relevant page' + (hits.length > 1 ? 's' : '') + ' in this book. Tap one to jump there, or add an LLM API key in \u2699 Settings for a synthesized answer.' + renderRefs());
    } else {
      var url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      done('Nothing in this book matched. <a href="' + url + '" target="_blank" rel="noopener">Search the web for \u201c' + esc(q) + '\u201d on DuckDuckGo \u2197</a> \u2014 or add an LLM key in \u2699 Settings and I can answer directly.');
    }
  }

  fab.addEventListener('click', function(){ panel.classList.toggle('show'); });
  panel.querySelector('#sl-chat-x').addEventListener('click', function(){ panel.classList.remove('show'); });
  panel.querySelector('#sl-chat-clear').addEventListener('click', function(){ body.innerHTML = ''; addMsg('bot', 'Chat cleared. Ask me anything.'); });
  panel.querySelector('#sl-chat-gear').addEventListener('click', function(){
    var st = panel.querySelector('#sl-chat-settings');
    st.classList.toggle('show');
    panel.querySelector('#sl-cfg-endpoint').value = cfg.endpoint || '';
    panel.querySelector('#sl-cfg-key').value = cfg.key || '';
    panel.querySelector('#sl-cfg-model').value = cfg.model || '';
  });
  panel.querySelector('#sl-cfg-save').addEventListener('click', function(){
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    panel.querySelector('#sl-cfg-status').textContent = 'Saved.';
  });
  panel.querySelector('#sl-cfg-test').addEventListener('click', function(){
    var status = panel.querySelector('#sl-cfg-status');
    status.textContent = 'Testing\u2026';
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'Say OK' }], max_tokens: 5 })
    }).then(function(res){ status.textContent = res.ok ? 'Connected.' : 'Failed: HTTP ' + res.status; })
    .catch(function(err){ status.textContent = 'Failed: ' + err.message; });
  });
  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });
})();
</script>
<style id="sl-sel-css">
#sl-sel-tip{position:fixed;z-index:99999;display:none;align-items:center;gap:2px;padding:5px;background:#2E2A24;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);font:13px/1.2 system-ui,-apple-system,sans-serif}
#sl-sel-tip.show{display:flex}
#sl-sel-tip button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:#F7F1E3;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
#sl-sel-tip button:hover{background:#4A4234}
#sl-sel-tip .sl-sep{width:1px;height:18px;background:#55493A;margin:0 2px}
#sl-sel-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#2E2A24;color:#F7F1E3;padding:10px 18px;border-radius:999px;font:13px system-ui,-apple-system,sans-serif;z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:0 8px 22px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#sl-sel-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>
(function(){
  if (window.__slSelTools) return; window.__slSelTools = true;

  /* Compatibility shim: topic-based readers (e.g. Ponder on This) expose
     `topics` + `goTo(id)` instead of `PAGES` + `render()`. Build the PAGES
     interface so the embedded assistant's search and page jumps work there too. */
  try {
    if (typeof PAGES === 'undefined' && typeof topics !== 'undefined' && Array.isArray(topics)) {
      window.PAGES = topics.map(function(t){
        return {
          label: 'Topic ' + t.id + ' \u2014 ' + t.title,
          html: '<div>' + (t.matter || []).map(function(m){ return '<p>' + m.text + '</p>'; }).join('') + '</div>'
        };
      });
      window.render = function(){
        try { if (typeof goTo === 'function') goTo(topics[window.current || 0].id); } catch(e){}
      };
    }
  } catch(e){}

  var NOTES_KEY = 'sl_my_notes';

  var tip = document.createElement('div');
  tip.id = 'sl-sel-tip';
  tip.setAttribute('role', 'toolbar');
  tip.setAttribute('aria-label', 'Selection actions');
  tip.innerHTML =
    '<button type="button" data-act="ask">\u2728 Ask AI</button>' +
    '<span class="sl-sep"></span>' +
    '<button type="button" data-act="note">\uD83D\uDCDD Add to my note</button>';
  document.body.appendChild(tip);

  var toast = document.createElement('div');
  toast.id = 'sl-sel-toast';
  document.body.appendChild(toast);
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  var selText = '';

  function hideTip(){ tip.classList.remove('show'); }

  function insideUi(node){
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    while (el) {
      if (el.id === 'sl-chat-panel' || el.id === 'sl-sel-tip' ||
          el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return true;
      el = el.parentElement;
    }
    return false;
  }

  function showTip(){
    var sel = window.getSelection();
    var text = sel && !sel.isCollapsed ? sel.toString().replace(/\s+/g, ' ').trim() : '';
    if (text.length < 3 || insideUi(sel.anchorNode)) { hideTip(); return; }
    var rect;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch(e){ hideTip(); return; }
    if (!rect || (rect.width === 0 && rect.height === 0)) { hideTip(); return; }
    selText = text;
    tip.classList.add('show');
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = rect.left + rect.width / 2 - w / 2;
    var y = rect.top - h - 8;
    if (y < 6) y = Math.min(window.innerHeight - h - 6, rect.bottom + 8);
    x = Math.max(6, Math.min(window.innerWidth - w - 6, x));
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseup', function(){ setTimeout(showTip, 10); });
  document.addEventListener('touchend', function(){ setTimeout(showTip, 350); });
  document.addEventListener('mousedown', function(e){ if (!tip.contains(e.target)) hideTip(); });
  document.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideTip(); });

  /* Keep the text selection alive when the user taps a tooltip button */
  tip.addEventListener('mousedown', function(e){ e.preventDefault(); });
  tip.addEventListener('touchend', function(e){ e.preventDefault(); }, { passive: false });

  function askAi(text){
    var panel = document.getElementById('sl-chat-panel');
    var input = document.getElementById('sl-chat-input');
    var send = document.getElementById('sl-chat-send');
    if (!panel || !input || !send) return;
    panel.classList.add('show');
    var trimmed = text.length > 600 ? text.slice(0, 600) + '\u2026' : text;
    input.value = 'Explain this passage: \u201C' + trimmed + '\u201D';
    send.click();
    input.focus();
  }

  function currentLocation(){
    try {
      if (typeof PAGES !== 'undefined' && typeof current !== 'undefined' && PAGES[current]) {
        return PAGES[current].label || '';
      }
    } catch(e){}
    try {
      if (typeof topics !== 'undefined' && typeof currentId !== 'undefined') {
        var t = topics.find(function(x){ return x.id === currentId; });
        if (t) return 'Topic ' + t.id + ' \u2014 ' + t.title;
      }
    } catch(e){}
    return '';
  }

  function addNote(text){
    var notes = [];
    try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); } catch(e){}
    if (!Array.isArray(notes)) notes = [];
    notes.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      book: document.title,
      page: currentLocation(),
      text: text,
      url: location.pathname.split('/').pop(),
      ts: Date.now()
    });
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes.slice(0, 500))); } catch(e){}
    showToast('Saved to My Notes \u2014 view it on the library home page');
  }

  tip.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    var text = selText;
    hideTip();
    if (btn.getAttribute('data-act') === 'ask') askAi(text);
    else addNote(text);
  });
})();
</script>
