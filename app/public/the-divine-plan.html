<script id="pages-data" type="application/json">[{"pdf_page_index": 0, "pdf_page_number": 1, "html": "<h3 class=\"pdf-heading\">THE DIVINE PLAN<\/h3>\n<h3 class=\"pdf-heading\">by GEOFFREY A. BARBORKA<\/h3>\n<p class=\"empty-note\"><em>A facsimile-based excerpt from the original edition (1961), covering Chapter IX — The Doctrine of the Rounds — and Chapter X — The After-Death States (book pages 338 ff.). Text recovered by OCR from the scanned pages; diagram pages are preserved as facsimile images.<\/em><\/p>", "images": [], "label": "Title"}, {"pdf_page_index": 1, "pdf_page_number": 2, "html": "<p>fauna, and the highest animal, its crown—man, Change and vary according to the environments and climatic variations, not only with every Round, but every Root-Race likewise, as well as after every geological cataclysm that puts an end to, or produces a turning point in the latter. In the Sixth Root-Race the fossils of the Orang, the Gorilla, and the Chimpanzee will be those of extinct quadrumanous mammals; and new forms—though fewer and ever wider apart as ages pass on and the close of the Manvantara approaches—will develop from the ‘ cast off’ types of the human races as they revert once again to astral, out of the mire of physical, life. There were none before man, and they will be extiinct before the Seventh Race develops. ...<\/p>\n<p>“This will take place, of course, millions of years hence.” (II, 262-3 *) The human state is an essential stage on the ascent of the hierarchical Ladder of Life. Its successful consummation enables the Monad to cone tinue its spiralling journey into superior realms of Being. Each stage marks the unfoldment of the Divine Plan. * Vol, IIT, p, 265, 6 vol, ed.; IT, 274-5, 3rd ed,<\/p>", "images": [], "label": "Page 1"}, {"pdf_page_index": 2, "pdf_page_number": 3, "html": "<h3 class=\"pdf-heading\">CHAPTER IX<\/h3>\n<h3 class=\"pdf-heading\">THE DOCTRINE OF THE ROUNDS<\/h3>\n<p>As with the Doctrine of the Races, the law pertaining to the Doctrine of the Rounds is that of Eternal Motion. The law manifests on such a vast scale, however, that the time periods involved are of cosmic sweep, dwarfing all figures dealing with human events. The subject is of such magnitude that a detailed presentation can hardly be attempted. It can only be handled by means of a general outline, similar to the method that an artist uses when commencing to paint a picture: broad sweeps are made placing distinctive features on the canvas with no consideration given to details. Since a sequential account of the Rounds cannot be presented (for the simple reason that this has not been given), the decision was made to treat the subject by means of seven sections, listing them as follows:<\/p>\n<p>1. Inner Rounds<\/p>\n<h3 class=\"pdf-heading\">The Relation of Rounds and Races<\/h3>\n<h3 class=\"pdf-heading\">The Relation of Rounds and Spheres<\/h3>\n<h3 class=\"pdf-heading\">The Relation of Rounds and Watchers<\/h3>\n<h3 class=\"pdf-heading\">The Relation of Rounds and the After-Death States<\/h3>\n<h3 class=\"pdf-heading\">The Relation of Rounds and Principles<\/h3>\n<p>7, Outer Rounds These are but aspects of the Doctrine of the Rounds, subdivided in this manner simply for purposes of description. From the list it is quite apparent that the subject of the Rounds is closely connected and interrelated with the Doctrine of the Spheres and the Doctrine of the Races, therefore some repetition may be noticed. This is unavoidable because of the complex nature of the subject. Take, for example, one of the main postulates:<\/p>\n<h3 class=\"pdf-heading\">Everything in the metaphysical as in the physical Universe<\/h3>\n<p>is septenary. Hence every sidereal body, every planet, whether visible or invisible, is credited with six companion globes. The evolution of life proceeds on these seven globes or bodies from the Ist to the 7th in Rowunps or Seven Cycles.” (I, 158-9 *) Since the Doctrine of the Spheres and the Doctrine of the Races have already been covered, that of the Rounds may be commenced by clarifying the term. * Vol. I, p. 213, 6 vol, ed.; I, 182, 3rd ed.<\/p>", "images": [], "label": "Chapter IX"}, {"pdf_page_index": 3, "pdf_page_number": 4, "html": "<p>A Round signifies the circling of a Monad from the first globe of a Chain of globes to the last sphere of the chain, performing seven cycles on each globe. These seven cycles are equivalent to the Seven Root-Races (outlined in the Doctrine of the Races). The seven manifested globes of a Chain are enumerated with the first seven letters of the alphabet: Globe A, Globe B, Globe C, Globe D, Globe E, Globe F, Globe G. Seven Rounds or Seven Circuits of the septenary Chain of Globes are required to complete the Circle of Necessity comprising one Planetary Manvantara (or one planetary period of activity), The significance of the term **Monad”’ should be repeated. The word is applied to the immortal essence, the Pilgrim, which is undergoing the cyclic journey, termed the Circle of Necessity. In order to accomplish this journey, the Pilgrim dons a sheath or a vesture which is appropriate to the Kingdom of the Ladder of Life in which it manifests for a planetary period of activity (a planetary manvantara). The Ladder of Life is composed of ten rungs. On each rung of the Ladder is stationed one of the Kingdoms of Life, composed of Hosts or Classes of Monads. For instance, a Monad accomplishing the cyclic journey in the Mineral Kingdom—which represents the fourth rung on the Ladder of Life, or the lowest of the manifested kingdoms—accomplishes one Round when it has performed the circuit of the seven globes of the chain (Globe A to G sequentially).<\/p>\n<p>In the case of a human being, the Monad, the Pilgrim, is at present utilizing a sheath or vesture appropriate to the Human Kingdom for temporary manifestations. It appears on earth in a human body, a physical vehicle, for the period of a lifetime. The Pilgrim leaves the globe for a while, but returns to earth for another lifetime—and then another; ever travelling on the cyclic journey. The present station on the cyclic journey which the Human Monadic Host is making is the fourth lobe (Globe D) of the septenary chain. As explained in the Doctrine of the Races, the evolutionary development upon a globe is accomplished by means of seven major developmental stages, termed Root-Races, The fifth major developmental stage is in progress, therefore mankind is in the Fifth Root-Race, on the fourth globe.<\/p>\n<p>The execution of seven major developmental stages, or seven RootRaces, on one globe completes one Globe Round. Upon completion of one Globe Round the human Monadic Host moves on to the next station on its cyclic journey, that is, to the next globe of the series of seven, in order to accomplish seven major developmental stages in an advanced degree on that globe, which globe is also superior in degree. The next globe on the cyclic journey is Globe E. Following seven evolutionary steps or slages on Globe E, the Monadic Host will move on to Globe F. After seven developmental stages on Globe F the Human Life-Wave will transfer to Globe G, in order to complete the circuit. When seven Ropt-Races have been completed on cach one of the Seven Globes of the<\/p>", "images": [], "label": "Page 3"}, {"pdf_page_index": 4, "pdf_page_number": 5, "html": "<p>—one complete Planetary Round has been achieved.<\/p>\n<p>The Human Monadic Host is in process of performing its Fourth Circuit on its cyclic journey, so that it is on its Fourth Planetary Round of the Circle of Necessity. The journey on the Descending Arc (consisting of Globes A, B and C) has been completed, for seven developmental stages have been performed on each of the first three globes. The fourth globe, Globe D, represents the bottom of the arc and also the turning point commencing the Are of Ascent. The Fourth Planetary Round will be concluded when the Monadic Host ‘will have performed seven major developmental stages (or Seven Root-Races) on each of the globes of the Ascending Arc (Globes E, F, and G),.<\/p>\n<p>The Circle of Necessity will be consummated when seven complete circuits will have been accomplished on all the globes of the chain, that is, Seven Planetary Rounds, each Round consisting of Seven Root-Races on Seven Globes of the Chain. This constitutes the completion of a Day of Brahma, which is the equivalent of one Planetary Manvantara (one planetary period of activity), or one revolution of the Wheel (to use the (term of the Stanzas of Dzyan).<\/p>\n<p>While the term ‘‘ Round ” describes the cyclic character of the evolutional pilgrimage that is being executed, it should also be borne in mind that during each Round a different cyclical stage of evolution, or an advanced degree of development, is being accomplished.<\/p>\n<h3 class=\"pdf-heading\">Round repeats on 2 higher scale the evolutionary work of<\/h3>\n<p>the preceding Round.” (I, 187 *)<\/p>\n<p>For even the First Round on a Chain is more advanced in degree, inasmuch as it is on a higher plane, than the former Seventh Round completed on the previous Chain.<\/p>\n<p>Because these cyclical evolutionary stages are being performed from globe to globe within the series of seven globes of the planetary chain, they are termed ‘‘ Inner Rounds”’.<\/p>\n<p>* Vol. I, p. 238, 6 vol. ed.; 1, 209, 3rd ed.<\/p>", "images": [], "label": "Page 4"}, {"pdf_page_index": 5, "pdf_page_number": 6, "html": "<h3 class=\"pdf-heading\">DIAGRAMMATIC REPRESENTATION OF THE ROUNDS:<\/h3>", "images": [{"file": "diagram_04.jpg", "caption": "Diagram as printed in the original"}], "label": "Diagrammatic Representation Of The Rounds:"}, {"pdf_page_index": 6, "pdf_page_number": 7, "html": "<p>that the Seven Rounds are undertaken Dy all the of that 1s, by each one of the ten Classes of Monads or Kingdoms comprising the Ladder of Life. Each Class accomplishes each and every one of the Seven Rounds. To be sure, each Class or Kingdom experiences the circuit in a manner suitable to its own class, that is to say, the Monads utilize vestures and experience an evolutionary development appropriate to each Kingdom.<\/p>\n<p>In order not to confuse the mind with too many aspects in one diagram, the Seven Cosmic Planes are not depicted, although they may be very easily supplied simply by allocating the topmost globe (named Globe Z) to the First Cosmic Plane, and the bottom globe (Globe D) to Cosmic Plane Seven, and then placing two globes on each of the five remaining Cosmic Planes (regardless of the manner in which the globes are positioned).<\/p>\n<p>In The Secret Doctrine the First Round is described as commencing on Globe A, and continuing through the circuit of the remaining six globes in sequential manner. The reason for this is because both Globe A and Globe G (the seventh manifested globe) are situated on the first manifested plane (which is the Fourth Cosmic Plane—see S.D. I, 200 *). However, there are three planes superior to the planes of manifestation, which may be termed the planes of the ‘‘ Unmanifested * (for convenience and clarity), on which are stationed the Ariipa-lokas (literally the “‘ No-form Worlds<\/p>", "images": [], "label": "Page 6"}, {"pdf_page_index": 7, "pdf_page_number": 8, "html": "<p>to be drawn to the Fourth Round, it is therefore emphasized by means of the heaviest line. It is the Round that is now being accomplished and the Arc of Descent has brought the Human Life-Wave to Globe D (our Earth). Furthermore, the heavy line also indicates that it is the most material of the Rounds, or in other words, matter is predominant on the Fourth Round. It should also be remembered that a Globe Round is accom-<\/p>\n<h3 class=\"pdf-heading\">by means of the development of Seven Races on one Globe—the<\/h3>\n<p>even Races being equivalent to seven stages of development or advances in evolution; whereas a Planetary Round signifies the accomplishment of Seven Races on each one of the globes of the complete circuit.<\/p>\n<p>In recapitulation: the Human Life-Wave is undergoing its Fourth Round upon the Fourth Globe (of the seven manifested or Riipa-lokas), and it has reached its fifth developmental stage. It is therefore stated to be in the Fifth Race.<\/p>\n<p>As there are some pioneers in the forefront of human evolution who are undergoing their Fifth Planetary Cycle, the Fifth Round 4s indicated by means of an elliptical orbit, yet it takes place within the field of activity of the Fourth Round. In other words, the Fifth Round is also being accomplished in and on and through the series of all the globes of the<\/p>\n<p>The Sixth Round and the Seventh Round are indicated by means of dotted lines, conveying the idea that these Rounds will be undertaken in the far-flung aeons of the future. These Rounds in their tum will be accomplished in and on and through all the globes of the chain.<\/p>\n<h3 class=\"pdf-heading\">2. THE RELATION OF ROUNDS AND RACES<\/h3>\n<p>The use of the word “‘ in the title of this section is intended to include all the beings composing the Ten Classes of Monads, or Kingdoms, on the Ladder of Life. Each one of the ten classes is pursuing its evolutionary cycles on the globes of the planetary chain by means of the Rounds. ‘The reason for the use of the term is that all classes of monads must perform seven major developmental stages on each globe of the chain, irrespective of their status on the evolutionary Ladder of Life—that is irrespective of the Kingdom in which they are at present undergoing their evolutionary experiences. In the following citation, outlining the circuit, the evolutionary cycle is illustrated. by reference to the Human Kingdom; the opening words “the grand cycle” signify one Globe Round; the concluding words “‘ seven minor or the great ‘‘ Racial Cycles” stand for the seven Root-Races:<\/p>\n<h3 class=\"pdf-heading\">Grand Cycle includes the progress of mankind from the<\/h3>\n<p>appearance of primordial man of ethereal form. It runs through<\/p>\n<p>the inner cycles of his (mens) progressive evolution from the ethereal<\/p>\n<p>down to the semi-cthereal and purely physical: down to the<\/p>", "images": [], "label": "Page 7"}, {"pdf_page_index": 8, "pdf_page_number": 9, "html": "<p>continues running its course Gownward and then upward again,<\/p>\n<p>to meet at the culmination of a Round, when the manvantaric<\/p>\n<p>‘Serpent swallows its tail’ and seven minor cycles are passed.<\/p>\n<p>These are the great Racial Cycles.” (I, 642 *) The manvantaric serpent swallowing its tail represents one period of activity and the completion of one Round; also symbolizing the Descending Arc and the Ascending Arc.<\/p>\n<p>Such is a general description of what occurs during the period of one Round, although especially applicable to our present Round—ihe Fourth Round, as being the most material of the Rounds. It should be borne in mind, however, that each Round has its specific evolutionary status to be carried out. In the same way each globe has its distinctive condition to be accomplished.<\/p>\n<p>Of especial significance is the process that commences evolution on the first globe, Globe A, and on the First Round, representing the awakening of a Chain from its laya condition (a state where matter and spirit are homogeneous; complete rest). First to appear on the central core of the globe-to-be, ahead even of the lowest kingdom stationed on the tenth rung of the Ladder of Life—named the Third Elemental Kingdom—are the classes of the Dhyani-Chohanic Kingdoms which were not able to graduate from the Chain which had entered Pralaya (the period of complete rest— dissolution). Because of this “ failure’? they act as guardians or leaders of the Chain-to-be, which is a reimbodiment of the former Chain. These Classes remain in the spiritual realms, so to speak, of the first globe (Globe A) during this process of formation, although not entering into the material aspect of the globe. By thus remaining as a spiritual force, they provide the patterns or types for all the lower Kingdoms on the Ladder of Life, without actually entering into the evolutionary processes of these Classes, until the Seventh Class arrives. The Seventh Class is the Human Kingdom.<\/p>\n<p>When the Third Elemental Kingdom has performed its seven developmental stages—part of which consists in the formative process of the globe itself, albeit invisible to the physical eye—the majority of the hosts of these elemental beings leave the first globe, just as the leaders have done, entering the core of the second globe, in order to perform seven cycles on Globe B, as well as to aid in the building of the second sphere. In the previous section, the Doctrine of the Races, these seven cycles were compared to seven waves of effort which surge on from one globe to the next, carrying the life impulse to the next globe.<\/p>\n<p>Reference was made to the majority of the host of beings passing from a globe in order to carry the life impulse to a new globe. However, a minority is left behind upon the first globe, as well as subsequently upon each one of the globes as each Class of the Monadic Hosts advances from<\/p>\n<p>* Vol. II, p. 367, 6 vol. ed.; I, 703-4, 3rd ed.<\/p>", "images": [], "label": "Page 8"}, {"pdf_page_index": 9, "pdf_page_number": 10, "html": "<p>‘They are technically termed word literally meaning ~ remain~ders,” since the majority of their Class has moved on to another sphere. The purpose of the Sishtas is to remain on the globe providing future * seeds of life ’’ to the Monadic Host when it returns to that sphere on subsequent Rounds. Thus the highest and most evolved type achieved by means of the seven developmental stages carried out upon the globe is preserved. The Sishtas maintain the “remainder forms” intact, during the absence of the Life-Wave which carries the host of monads around the<\/p>\n<p>of the Chain, awaiting the time-period when the returning LifeWave will bring the life impulse to that sphere, and revivify the activities pertaining to the specific kingdom to which the Sishtas belong.<\/p>\n<p>It should be borne in mind that every one of the Ten Classes of Monads, or Kingdoms, leaves its own Sishtas on each one of the seven globes of a Chain each time that that Kingdom pursues its seven evolutionary developmental stages on each sphere during each Round. In this way the returning Life-Wave need not “ rebuild” a new form, but simply takes up the evolutionary stage at which it was dropped in the previous cycle.<\/p>\n<p>Disposing of the query that arises in regard to the “ sacrifice”. that the Sishtas make—with especial reference to the Human Kingdom. While in a way it is akin to a sacrifice to be left behind by the surging evolutionary stream of life, nevertheless compensations may be noted: (1) the Sishtas are in a quasi-Nirvanic condition and are not caught up in the evolutionary Whirl of activities; (2) consequently they are not creating ‘‘ new karma”; 3) the Sishtas are under the direct guardianship and watched over by the uperior Kingdoms on the Ladder of Life, which have their evolutionary cycles during the absence of the seven lower kingdoms to which the Sishtas belong.<\/p>\n<p>Returning to the entrance of the Classes of Monads at the commencement of a Chain. As the life impulse of the Third Elemental Kingdom surges on to Globe B, leaving its Sishtas on Globe A, the host of Monads comprising the Second Elemental Kingdom, awakening from their pralayic rest, enter the first globe in order to accomplish their seven developmental stages on Globe A. When the Third Elemental Kingdom has completed its seven waves of effort on Globe B, and surges on to carry the life impulse to the third globe, the Second Elemental Kingdom likewise has completed its seven waves of effort on Globe A and moves on to Globe B, leaving its ishtas and making room for the host of monads comprising the First Elemental Kingdom to enter Globe A. Then the class of monads forming the Third Elemental Kingdom achieve seven developmental stages on Globe C, depart from the third globe after leaving their Sishtas and carry the life impulse to Globe D; the Second Elemental Kingdom surges on to Globe C; the First Elemental Kingdom travels to Globe B; and the first of the manifested kingdoms, consisting of the host of monads in the<\/p>\n<h3 class=\"pdf-heading\">Kingdom situated on the fourth rung of the Ladder of Life,<\/h3>", "images": [], "label": "Page 9"}, {"pdf_page_index": 10, "pdf_page_number": 11, "html": "<p>Globe A,<\/p>\n<p>** The three evolutions completed: palpable globe begins to form,<\/p>\n<p>The mineral kingdom fourth in the whole series, but first in this<\/p>\n<p>stage [of manifested kingdoms] leads the way. Its deposits are at<\/p>\n<p>first vaporous, soft and plastic, only becoming hard and concrete in the<\/p>\n<p>seventh * —or seventh evolutionary development on Globe A. With the completion of its seven stages of unfoldment the Mineral Life-Wave transfers its energies to Globe B, leaving its Sishtas on the first globe, while the class of monads pertaining to the Plant Kingdom enter Globe A. Meanwhile the First Elemental Kingdom moves from the second globe to Globe C; the Second Elemental Kingdom pursues its way to Globe D; and the Third Elemental Kingdom commences the Ascending Arc by rising to Globe E. The Descending Arc consists of the passage from Globes A to D, the Ascending Arc comprises the circuit of Globes D to G. As soon as the monads of the Plant Kingdom have achieved their seven developmental stages on Globe A, the host of monads carries the life impulse to Globe B after leaving its Sishtas on the first globe. Then it becomes the turn of the monads using the vehicles of the Animal Kingdom to enter Globe A. In orderly sequence, the Mineral Kingdom moves on to Globe C; the First Elemental Kingdom descends to Globe D; the Second Elemental Kingdom commences its ascent by mounting to Globe E; and the Third Elemental Kingdom rises to Globe F. When the class of monads comprising the Animal Kingdom has accomplished its seven developmental stages on Globe A, the monadic host leaves its Sishtas on the first globe in order to commence its evolutionary phases on Globe B, and the seventh class on the Ladder of Life enters Globe A. This is the human host of monads, emerging from the inter-planetary pralayic period. The rhythmic circuit continues with the advent of the monads of the Animal Kingdom to Globe B; the Plant Kingdom transfers its vital energies to Globe C; the Mineral Kingdom descends to Globe D; the First Elemental Kingdom ascends to Globe E; the Second Elemental Kingdom mounts to Globe F; the Third Elemental Kingdom rises to Globe G.<\/p>\n<p>With the coming of the Human Life-Wave to Globe A (on the First Round) the Dhyani-Chohanic Classes which had preceded all the lower kingdoms arise from their inactive state and commence to function,<\/p>\n<p>**Then they become an active Force, and commingle with the<\/p>\n<p>Elementals, or progressed entities of the pure animal kingdom to<\/p>\n<p>develop little by little the full type of humanity. In this com-<\/p>\n<p>mingling they lose their high intelligence and spirituality of<\/p>\n<p>Devaship to regain them in the end of the seventh ring in the<\/p>\n<p>seventh round.” +<\/p>\n<p>* The Mahatma Letters to A. P. Sinnett, p. 94.<\/p>\n<p>t Mbid., p. 87.<\/p>", "images": [], "label": "Page 10"}, {"pdf_page_index": 11, "pdf_page_number": 12, "html": "<p>compact being he is destined to become on our earth. Evolving seven parent races with many offshoots of sub-races, he, like the preceding kingdoms completes his seven rings and is then transferred successively to each of the globes onward to Z. From the first man has all the seven principles included in him in germ but none are developed. .. . In each of the rounds he makes one of the principles develop fully.” * It should be borne in mind that the evolutionary process for the host of monads pertaining to the Human Kingdom during the First Round differs from that which occurs in the following Rounds. Observe the following:<\/p>\n<p>** Man, or rather that which becomes man, passes through all the forms and kingdoms during the first Round and through all the human shapes during the two following Rounds.”’ (I, 159-f) However, the monads pertaining to the Human Kingdom even during the First Round (and especially so during the following Rounds) are not of the same degree, evolutionally speaking, in fact:<\/p>\n<p>**The Monadic Host may be roughly divided into three: great classes:<\/p>\n<p>**1. The most developed Monads (the Lunar Gods or ‘ Spirits,’ called, in India, the Pitris), whose furiction it is to pass in the- first Round through the whole triple cycle of the mineral, vegetable, and animal kingdoms in their most ethereal, filmy, and rudimentary forms, in order to clothe themselves in, and assimilate, the nature of the newly formed chain. They are those who first reach the human form (if there can be any form in the realm of the almost subjective) on Globe A in the first Round. It is they, therefore, who lead and represent the human element during the second and third Rounds, and finally evolve their shadows at the beginning of the oom Round for the second class, or those who come behind<\/p>\n<p>**2. Those Monads that are the first to reach the human stage during the three and a half Rounds, and to become men.<\/p>\n<p>**3. The laggards; the Monads which are retarded, and which will not reach, by reason of Karmic impediments, the human stage at all during this cycle or Round.” (I, 174-5 f) The assertion that man has evolved through the patterns or types of the three lower kingdoms—although not in physical form or substance, since the first globe in the First Round is not a material globe and does * Op. cit., pp. 94-5. In regard to the of agreed to call the pamage of a monad frum globe A5\t1\t4\t2\t1\t12\t853\t1864\t23\t91\t81.052582\tto5\t1\t4\t2\t1\t13\t898\t1864\t77\t91\t91.615486\tglobe5\t1\t4\t2\t1\t14\t993\t1872\t59\t59\t36.765930\t*2Z {or op. cit, p80 t Vol. I, p. 214, 6 vol. ed.; I, 183, 3rd ed. t Vol. I, p. 227, 6 vol. ed.; I, 197, 3rd ed.<\/p>", "images": [], "label": "Page 11"}, {"pdf_page_index": 12, "pdf_page_number": 13, "html": "<p>the process which the human foetus still passes through in its intra-uterine life. This is clearly indicated in a Commentary upon the Stanzas of Dzyan:<\/p>\n<p>**The human foetus follows now in its transformations all the<\/p>\n<p>forms that the physical frame of man had assumed throughout the<\/p>\n<p>three Kalpas (Rounds) during the tentative efforts at plastic forma-<\/p>\n<p>tion around the monad by senseless, because imperfect, matter, in<\/p>\n<p>her blind wanderings. In the present age, the physical embryo is<\/p>\n<p>a plant, a reptile, an animal, before it finally becomes man, evolving<\/p>\n<p>within himself his own ethereal counterpart, in his (I, 184 *)<\/p>\n<p>_ To be sure, the process that has been described applies to what man now undergoes and thus has reference to man in the present, Fourth Round, not to man of the First Round. For<\/p>\n<p>**the ‘Man’ on Globe A during the First Round is no Man,<\/p>\n<p>but only his prototype or dimensionless image from the astral<\/p>\n<p>regions.” (I, 175 f)<\/p>\n<p>When the seven classes of monads on the Ladder of Life have completed their seven evolutionary stages on a globe and have left their Sishtas thereon—the seventh class of which is the Human Kingdom—the globe thus left enters into a stage of dormancy. This is often referred to as the inter-Round pralaya, although technically the term pralaya does not describe the condition, since the globe is not “‘ (the literal meaning of the term pralaya). In fact, the representatives of the Life-waves pertaining to the seven classes of monads (the Sishtas) still occupy and maintain the globe, although no longer continue in a state of activity, evolutionally speaking. The term has likewise been applied to the state of the globe, although this word, too, does not convey the meaning of a ‘“‘ sleeping sphere in the sense that the lower classes of the Life-waves are not pursuing their evolutionary activities on the globe.<\/p>\n<p>As the Human Kingdom completes its seven developmental.stages on each one of the globes of the Chain in sequence, leaving its Sishtas on each globe, each sphere passes into the state of dormancy. When the Human Life-wave concludes the seventh evolutionary stage on the seventh globe (Globe G) the complete chain of globes rests in a state of dormancy. An inter-Round Nirvana ensues, lasting for an interval equal to one tenth the time-period of the preceding Round-period of activity.<\/p>\n<p>The evolutionary process of the seven classes of monads is so adjusted that by the time the seventh class (the Human) has completed its seventh developmental stage on the last globe of the circuit, all the kingdoms will have finished their evolutionary stages on Globe G at approximately the<\/p>\n<p>* Vol. I, p. 235, 6 vol. ed.; I, 206, 3rd ed.<\/p>\n<p>t Vol. 1, p. 228, 6 vol. ed.; 1, 199, Srd ed.<\/p>", "images": [], "label": "Page 12"}, {"pdf_page_index": 13, "pdf_page_number": 14, "html": "<p>Retardation, operating as a fulcrum, so to speak, irom the lowest to the highest globe of the series, acting as acceleration on the Descending Arc and retardation on the Ascending Arc. Thus the classes on the lower rungs of the Ladder of Life respond to the Law of Acceleration on the Descending Arc, hastening their cyclic activities. The more highly evolved classes come under the sway of the Law of Acceleration on the superior globes of the Ascending Arc, whereas the less evolved kingdoms respond to the Law of Retardation on the Arc of Ascent.<\/p>\n<p>** When all kingdoms have reached globe Z they will not move forward to re-enter A in precedence of man, but under a law of retardation operative from the central point—or earth—to Z and which equilibrates a principle of acceleration in the descending arc —they will have just finished their respective evolution of genera and species, when man reaches his highest development on globe Z. —in The reason for it is found in the enormously greater time required by them to develop their infinite varieties as. compared with man; the relative speed of development in the rings therefore naturally increases as we go up the scale from the mineral. But these different rates are so adjusted by man stopping Jonger in the inter-planetary spheres of rest, for weal or woe—that all kingdoms finish their work simultaneously on the planet Z.” * When the time-period of the inter-Round Nirvana has run its course, Globe A responds to the thrill of life as the incoming monads recommence their evolutionary periods of activity. They follow the same sequence outlined for the First Round. But there is a difference in the Second Round. Since the “remainder-forms” have been preserved by the Sishtas, neither the globe nor the types need to be rebuilt or re-established. The incoming monadic hosts pick up the waiting forms of their respective: kingdoms and commence their new series of seven developmental stages on their Second Circuit, adjusting to the Second Round conditions prevailing for both spheres and monads.<\/p>\n<p>Beginning so early as with the 2nd round, Evolution proceeds already on quite a different plan. It is only during the Ist round that (heavenly) man becomes a human being on globe A (rebecomes) a mineral, an animal, on globe B and C, etc. The process changes entirely from the second round.’” (I, 159-60 f) When the seven classes of monads have performed their Secondary Circuit of seven developmental stages on each one of the seven globes of the Chain, following the process outlined for the First Round, they will have completed their Second Round, and the second inter-Round Nirvana will ensue. * The Mahatma Letters to A. P. Sinnett, pp. 95-6,: t Vol. I, p. 214, 6 vol. ed.; I, 183, Srd ed.<\/p>", "images": [], "label": "Page 13"}, {"pdf_page_index": 14, "pdf_page_number": 15, "html": "<p>takes place for the third time, developing [Third Round qualities for the spheres as well as the classes of monads. For, be it noted, each Round on the Descending Arc of the cycle of Rounds becomes more and more material. As outlined in the Doctrine of the Spheres, the fourth globe of the Chain is the most material of the spheres. As further explained in the Doctrine of the Races, the fourth major developmental stage is the most material of the Root-Races. Similarly in the cycle of the Rounds, the Fourth is the most material of the Rounds. Consequently the Third Round is more material than the Second Circuit, and preparatory stages for the Fourth Round become manifest in the Third. Nevertheless it should be remembered that even in the Third Round the most material aspect was not equivalent to matter in the Fourth Round. Thus all evolutionary development<\/p>\n<p>up to the Third Round is formless, as matter, and senseless, as consciousness.” (I, 24-7 *)<\/p>\n<p>The centres of consciousness (destined to develop into humanity as we know it) of the third Round arrived at a perception of the third Element, Water.” (I, 247 fT) Then, too, it was during the Third Round that man passed through the “‘ non-rational ” stage of existence. (Cf. II, 299 }) As to the progressive stages of man’s consciousness:<\/p>\n<p>** In the first round his consciousness on our earth is dull and but feeble and shadowy, something like that of an infant. When he reaches our earth in the second round he has become responsible in a degree, in the third he becomes so entirely. At every stage and every round his development keeps pace, with the globe on which he is.”’ § While considering the Third Round evolutionary stage, it should be pointed out that just as in the Fourth Round all the mammalian animals are regarded as “ off-throwings”’ from the original mammalian type, of which man is the fourth-round representative, so during the Third Round certain types came into being from the third-round type which man then represented.<\/p>\n<h3 class=\"pdf-heading\">Third Round terrestrial animal forms were just as much<\/h3>\n<p>referable to types thrown off by Third-Round man, as that new importation into our planet’s area—the mammalian stock—is to the Fourth Round Humanity of the Second Root-Race. The process * Vol. I, p. 292, 6 vol. ed.; I, 267, 3rd ed. t Vol. I, p. 297, 6 vol. ed.; I, 273, 3rd ed. t Vol. III, p. 300, 6 vol, ed.; II, 313, 3rd ed. § The Mahatma to A, P. Sinnett, p, 95,<\/p>", "images": [], "label": "Page 14"}, {"pdf_page_index": 15, "pdf_page_number": 16, "html": "<p>teristics OF the rourtn, Dut Of the inird NKound terrestrial lite. The diapason of type is run through in (II, 68-5 *)<\/p>\n<p>** It is correct to say that the man of this Manvantara, i.e., during the three preceding Rounds, has passed through all the kingdoms of nature. That he was ‘a stone, a plant, an animal’. But (a) these stones, plants, and animals were the prototypes, the filmy presentments of those of the Fourth Round; and (4) even those at the beginning of the Fourth Round were the astral shadows of the present, as the Occultists express it. And finally the forms and genera of neither man, animal, nor plant were what they became later. Thus the astral prototypes of the lower beings of the animal kingdom of the Fourth Round, which preceded (the of) Men, were the consolidated, though still very ethereal sheaths of the still more ethereal forms or models produced at the close of the Third Round on Globe D. ‘ Produced from the residue of the substance matter; from dead bodies of men and (other extinct) animals of the wheel before,’ or the previous Third Round—as §loka 28 tells us. Hence, while the nondescript ‘ animals’ that preceded the astral man at the beginning of this life-cycle on our Earth were still, so to speak, the progeny of the man of the Third Round, the mammalians of this Round owe their existence, in a great measure, to man again.” (II, 685 f) While these passages are dealing with the physical forms in which the monads manifest as sheaths, so to speak, according to their respective kingdoms, thus showing that man (or rather ‘‘ Heavenly Man,” that is Adam Kadmon, as the Kabbala expresses it, meaning the “ ideal type”’) is the repository of all physical forms,’ there is even a more tent reason for this attraction towards or affinity for man, which expressed in the enlightening words of a Commentary upon the Stanzas of Dzyan:<\/p>\n<p>*** Every form on earth, and every speck (atom) in Space strives in its efforts towards self-formation to follow the model placed for it in the “ Heaventy Man’. Its (the atom’s) involution and evolution, its external and internal growth and development, have all one and the same object—man; man, as the highest physical and ultimate form on this earth; the Monap, in its absolute totality and awakened condition—as the culmination of the divine incarnations on Earth.’” (I, 183 Even though stressing the fact that it is the Monad which is using the sheaths or vestures of the Class or Kingdom to which it is attached * Vol, IV, pp. 254-5, 6 vol, ed.; II, 723, 3rd ed. t Vol. III, p. 193, 6 vol, ed.; IT, 196-7, 3rd ed. t Vol. I, p. 235, 6 vol. ed.; I, 205-6, Srd ed.<\/p>", "images": [], "label": "Page 15"}, {"pdf_page_index": 16, "pdf_page_number": 17, "html": "<p>exactly what the status of the Monad 1s:<\/p>\n<p>** there is no such thing as a Monad (Jiva) other than divine, and consequently having been, or having to become, human. And the latter term [i.e., Human Monad] has to remain meaningless unless the difference is well understood. The Monad is a drop out of the shoreless Ocean beyond, or, to be correct, within the plane of primeval differentiation. It is divine in its higher and Auman in its lower condition—the adjectives ‘higher’ and ‘lower’ being used for lack of better words—and a monad it remains at all times, save in the Nirvanic state, under whatever conditions, or whatever external forms. As the Logos reflects the Universe in the Divine Mind, and the manifested Universe reflects itself in each of its Monads, as Leibnitz put it, repeating an Eastern teaching, so the Monap has, during the cycle of its incarnations, to reflect in itself every root-form of cach kingdom. Therefore, the Kabalists say correctly that ‘ Man becomes a stone, a plant, an animal, a man, a Spirit, and finally God. Thus accomplishing his cycle or circuit and returning to the point from which he had started as the heavenly Man.’ But by ‘Man’ the divine Monad is meant, and not the thinking Entity, much less his physical body.” (II, 185-6 *) After concluding the Third Circuit by performing seven developmental stages on each of the globes of the Ascending Arc (Globes, E, F and G), there occurred the inter-Round Nirvana. All was in readiness for the present Circuit, the Fourth Round.<\/p>\n<p>** Let us recapitulate.<\/p>\n<p>‘*The most developed Monads (the lunar) reach the human germ stage in the first Round; become terrestrial, though very ethereal human beings towards the end of the Third Round, remaining on it (the globe) through the ‘ obscuration’ period as the seed [Sishtas] for future mankind in the Fourth Round, and thus become the pioneers of Humanity at the beginning of this, the Fourth Round. Others reach the Human stage only during later Rounds, 7.e., in the second, third, or first half of the Fourth Round. And finally the most retarded of all, i.¢., those still occupying animal forms after the middle turning-point of the Fourth Round—will not become men at all during this Manvantara, They will reach to the verge of humanity only at the close of the seventh’ Round to be, in their turn, ushered into a new chain after pralaya—by older pioneers, the progenitors of humanity, or the Secd-Humanity (Sishta), viz., the men who will be at the head of all at the end of these Rounds.” (I, 182 ft) * Vol. IIT, p. 192, 6 vol. ed.; II, 196, 3rd ed. + Vol. I, pp, 233-4, 6 vol, ed.; I, 204-5, 3rd ed.<\/p>", "images": [], "label": "Page 16"}, {"pdf_page_index": 17, "pdf_page_number": 18, "html": "<h3 class=\"pdf-heading\">DB, G4) awalung the Monadic Host of the Human Kingdom as<\/h3>\n<p>it pursued the cyclic descent on this Fourth Round. Even now the “seeds of life’ for future mankind are ready, waiting on the globes of the Ascending Arc (Globes E, F, G). The account of the Root-Races of humanity, as described in the Doctrine of the Races, gives the story of the cyclic journcy on our globe alone (Globe D), outlining four and a half major developmental stages during the present Fourth Round. Before passing on to the next section, a brief descriptive outline of Man during the Four Rounds is available—a sort of bird’s-cye view:<\/p>\n<p>** Thus, as the teaching stands:<\/p>\n<p>*“* Man in the First Round and First Race on Globe D [see Note 1], our Earth, was an cthereal being (a Lunar Dhyani, as man), non-intclligent but super-spiritual; and correspondingly, on the law of analogy, in the First Race of the Fourth Round. ”<\/p>\n<p>Note 1. first ‘ Nature,” the first “ bedy,” the first “mind” on the first plane of perception, on the first Globe in the first Round, is what was meant.’ ”<\/p>\n<h3 class=\"pdf-heading\">Round. He (Man) is still gigantic and ethereal but<\/h3>\n<p>growing firmcr and more condensed in body, a more physical man. Yet still less intelligent than spiritual, for mind is a slower and more difficult evolution than is the, physical frame.’ ”<\/p>\n<h3 class=\"pdf-heading\">Round. He has now a perfectly concrete or compacted<\/h3>\n<p>body, at first the form of a giant-ape, and now more intelligent, or rather cunning, than spiritual. For, on the downward arc, he has now reached a point where his primordial spirituality is eclipsed and overshadowed by nascent [see note 2]<\/p>\n<p>Note 2. ‘“‘‘ Restore: he has now reached the point (by analogy, and as the Third Root-Race in the Fourth Round) where his (“the angel ”-man’s) primordial spirituality is eclipsed and overshadowed by nascent human mentality, and you have the true version on your thumb-nail.’ ”<\/p>\n<p>“*In the last half of the Third Round his gigantic stature decreases, and his body improves in texture, and he becomes a more rational being, though still more an ape than a Deva. (All this is almost exactly repeated in the third Root-Race of the Fourth Round.) ’” ““TV. Round. Intellect has an enormous development in this Round, The (hitherto) dumb races acquire our (present) human speech on this globe, on which, from the Fourth Race, language is perfected and knowledge increases. At this half-way point of the Fourth Round (as of the Fourth Root, or Atlantean, race) humanity passes the axial point of the minor Manvantara CYGCIS » a0<\/p>", "images": [], "label": "Page 17"}, {"pdf_page_index": 18, "pdf_page_number": 19, "html": "<p>ual decrease. (4, 100-7<\/p>\n<p>‘© These are the words of the Teacher—text, words and sentences in brackets, and explanatory footnotes.” (I, 189 f) One descriptive note regarding our Earth (Globe D) and Man during the First Round may be added:<\/p>\n<p>‘* As the solid Earth began by being a ball of liquid fire, of fiery dust and its protoplasmic phantom, so did man.” (I, 191 Or, perhaps in the clearer words of a Commentary:<\/p>\n<p>“The globe was ‘ fiery, cool and radiant as its ethereal men and animals during the first Round,’ says the Ccmmentary.” (I, 252 §) By the law of Analogy, during the Seventh Round the globe and man will once again attain this condition.<\/p>\n<h3 class=\"pdf-heading\">3. THE RELATION OF ROUNDS AND SPHERES<\/h3>\n<p>Just as the preceding section dealt with the status of the Classes of Monads during their cyclic journeys on the spheres of the planetary chain, so the present section will cover the subject of the status of the globes themselves during the passage of the Monadic Hosts through the sevenfold spheres, the completion of one circuit of the globes, from first to last, being termed one Round. The significance of the term “ status of the globes ” may be made plain by referring to the third postulate covering the teaching regarding the spheres. In the citation, Earth” signifies the fourth globe of the Earth Planetary Chain, also called ‘‘ Globe D.”<\/p>\n<p>**3. Our Earth, as the visible representative of iis invisible superior fellow globes, its ‘lords’ or ‘ principles,’ has to live, as have the others, through seven Rounds. During the first three, it forms and consolidates; during the fourth it settles and hardens; during the last three it gradually returns to its first ethereal form: it is spiritualized, so to say.” (I, 159 || ) At the outset it would be well to re-state the position of the spheres in their relation to the planes. The seven globes of the planetary chain are located on the four lowest Cosmic Planes in the following manner:<\/p>\n<p>Globes A and G on the Fourth Cosmic Plane<\/p>\n<p>Globes B and F on the Fifth Cosmic Plane<\/p>\n<p>Globes G and E on the Sixth Cosmic Plane<\/p>\n<p>Globe D (alone) on the Seventh Cosmic Plane The cyclic period of a Round is measured by the passage of the Classes of Monads on the spheres, and the descent and ascent through the planes * Vol. I, pp. 239-40, € vol. ed.; I, 211-2, 3rd 3d. Vol. I; pp. 240, 6 vol. ed.; I, 212, Srd ed. Vol. I, 242, 6 vol. ed.; if, 214,<\/p>\n<p>p. 297, 6 vol. ed.; 1, 273, ard ed Vout, 5.218, ed, 183, 3rd ed.<\/p>", "images": [], "label": "3. The Relation Of Rounds And Spheres"}, {"pdf_page_index": 19, "pdf_page_number": 20, "html": "<p>fLosts trom the rourtn to the seventh represents the first half of the Round-cycle and is termed a descent on the Arc of Matter (of the evolution of matter—during which spirit is involved) or the Descending Arc. The monadic Life-Waves thus accomplish one half of the Round-cycle by circling on Globes A, B, C and D. The journey of the Classes of Monads on the latter half of the Round-cycle is made by ascending from the Seventh Cosmic Plane, through the Sixth, the Fifth and back to the Fourth Plane, thus completing one Round. The mounting through the planes is termed an ascent on the Arc of Spirit (or an evolution of spirit, during which matter is involved) of the Ascending Arc. The Monadic Hosts complete the Round-cycle by circling on Globe E, F, and G.<\/p>\n<p>The status of the spheres in relation to the Rounds, that is to say the stages of progressive evolutionary development which the globes follow during the Rounds, comes under the same law which governs the Monadic Hosts, namely, an increase in materiality towards the middle point of the Round-cycle (Rounds 1, 2, 3 and one-half). Then a return to spirituality during the latter half of the Round-cycle (Rounds 4, 5, 6 and 7).<\/p>\n<p>** Now every ‘ Round’ (on the descending scale) is but a repeti-<\/p>\n<p>tion in a more concrete form of the Round which preceded it, as<\/p>\n<p>every globe—down to our fourth sphere (the actual earth)—is a<\/p>\n<p>grosser and more material copy of the more shadowy sphere which<\/p>\n<p>precedes it in their successive order, on the three higher planes.<\/p>\n<p>On its way upwards on the ascending arc, Evolution spiritualizes<\/p>\n<p>and etherealizes, so to speak, the general nature of all, bringing it<\/p>\n<p>on to a level with the plane on which the twin globe on the opposite<\/p>\n<p>side is placed; the result being, that when the seventh globe is<\/p>\n<p>reached (in whatever Round) the nature of everything that is<\/p>\n<p>evolving returns to the condition it was in at its starting point—<\/p>\n<p>plus, every time, a new and superior degree in the states of con-<\/p>\n<p>sciousness. Thus it becomes clear that the ‘origin of man,’<\/p>\n<p>so-called, on this our present Round, or life-cycle on this planet,<\/p>\n<p>must occupy the same place in the same order—save details based on<\/p>\n<p>local conditions and time—as in the preceding Round.” (I, 232-3 *)<\/p>\n<p>An explanation in regard to “‘ the descending scale.” It may be interpreted in two ways: (1) the progressive stages of the spheres on the downward or Descending Arc, or the Arc of Matter, representing the first Three and one half Rounds of the Seven Round cycle; (2) the passage of the Monadic Hosts through the Globes on the Descending Arc—Globes A, B, C and D. Similarly “on its way upwards on the ascending arc”: may refer to (1) the developmental stages of the globes upward on the Are of Spirit during the latter half of the Fourth Round as well as Rounds Five, Six and Seven; (2) the passage of the Life-Waves through the Globes on the Ascending Arc—Globes E, F and G. The “ twin globes” may<\/p>\n<p>* Vol. I, p. 278, 6 vol, ed.; 1, 253, 3rd ed.<\/p>", "images": [], "label": "Page 19"}, {"pdf_page_index": 20, "pdf_page_number": 21, "html": "<p>preceding Round ”’ is the Third Round. The Root-Races follow the same law, as explained in the Doctrine of the Races. Thus the First Root-Race of humanity was ethereal, each Race becoming more and more material as the cyclic journey progressed along the Descending Arc. One of the Stanzas of Dzyan gives the law —treferring specifically to the Earth—in symbolical manner:<\/p>\n<p>And after great throes she (the Earth) cast off her old three and put on her new seven skins, and stood in her first (Stanza I, gloka 4) The gloka was introduced with these words:<\/p>\n<p>** Archaic Scripture teaches that at the commencement of every local Kalpa, or Round, the earth is reborn: ‘as the human Fiva (monad), when passing into a new womb, gets re-covered with a new body, so does the Jiva of the Earth; it gets a more perfect and solid covering with each Round after re-emerging once more from the matrix of space into objectivity’ (Commentary). This process is attended, of course, by the throes of the new birth or geological convulsions.” (II, 46 *) This explanatory passage followed the loka:<\/p>\n<h3 class=\"pdf-heading\">Earth is said to cast off her old skins, because this<\/h3>\n<p>refers to the three preceding Rounds she has already passed through; the present being the fourth Round out of the seven. At the beginning of every new after a period of ‘ obscuration,’ the earth (as do also the other six ‘ earths ’) casts off, or is supposed to cast off, her old skins as the Serpent does: therefore she is called in the Aitareya-Brahmana the Sarpa Rajni, ‘ the Queen of the Serpents,’ and ‘the mother of all that moves’. The ‘ Seven Skins,’ in the first of which she now stands, refer to the seven geological changes which accompany and correspond to the evolution of the Seven Root-Races of Humanity.” (II, 47 f) With each progression on the Round-cycles along the Arc of Matter, each “‘skin”’ of the Earth becomes more material; with each advancing Round along the Arc of Spirit each ‘‘ becomes more ethereal. One’ short sentence describes the condition of the “‘ first of our Earth (Globe D) during the First Round:<\/p>\n<p>“The globe was ‘ fiery, cool and radiant as its ethereal men and animals during the first Round,’ says the Commentary.” (I, 252 The especial significance of this succinct sentence is that it refers to the state of the Earth during the First Round, manifesting but one Element* Vol. III, p. 58, 6 vol. ed.; II, 50, 3rd ed. t Vol. III, pp. 58-9, 6 vol. ed.; II, 50, 3rd ed. * Vol. I, p. 297, 6 vol, ed.; I, 273, 3rd ed.<\/p>", "images": [], "label": "Page 20"}, {"pdf_page_index": 21, "pdf_page_number": 22, "html": "<p>Principle is brought into evolutionary development in the course of one Round. The rationale of this teaching is to be found in a Commentary on the Stanzas of Dzyan, along with which the following teachings are included: (1) the origin of the Element-Principles (Tattvas) ; (2) the origin of manifested globes—and for that matter, all beings that have forms; (3) the origin of the ‘‘ Lives” which build all the forms; (4) the origin of comets; (5) the origin of a sevenfold: planetary system—our Earth (Bhiimi) is specifically referred to with “‘ her six sisters,” that is, the seven globes of the Earth-Chain. Before giving the citation it would be well to repeat the seven Tattvas (Element-Principles)—the Sanskrit names being followed by their English equivalents:<\/p>\n<p>1. Adi-tattva Original Element-Principle : “The One”<\/p>\n<p>2. Anupapadaka-tattva Parentless Element-Principle or The<\/p>\n<h3 class=\"pdf-heading\">Spiritual<\/h3>\n<p>3. Acther Element-Principle<\/p>\n<p>4. Taijasa or Tejas-tattva Fire Element-Principle<\/p>\n<p>5. Vayu-tattva Air Element-Principle<\/p>\n<p>6. Apas or Apas-tattva Water Element-Principle<\/p>\n<p>7. Prithivi-tattva Earth Element-Principle In the citation, the words placed in parentheses are H. P. B.’s explanatory comments, along with her question-marks. 1 crore is equivalent to 10 million.<\/p>\n<p>“*&#x27;The worlds, to the profane,’ says a Commentary, ‘ are built up of the known Elements. To the conception of an Arhat, these Elements are themselves collectively a divine Life; distributively, on the plane of manifestations, the numberless and countless crores of lives. Fire alone is One, on the plane of the One Reality: on that of manifested, hence illusive, being, its particles are fiery lives which live and have their being at the expense of every other life that they consume. Therefore they are named the ‘ DEvourRErs.’ . . . Every visible thing in this Universe was built by such Lives, from conscious and divine primordial man down to the unconscious agents that construct matter.’ . . . ‘From the One Lire formless and Uncreate, proceeds the Universe of lives. First was manifested from the Deep (Chaos) cold luminous fire (gaseous light?) which formed the curds in Space.’ (Irresolvable nebulae, perhaps?) . *... These fought, and a great heat was developed by the encountering and collision, which produced rotation. Then came the first manifested MATERIAL, Fire, the hot flames, the wanderers in heaven (comets); heat generates moist vapor; that forms solid water (?); then dry mist, then liquid mist, watery, that puts out the luminous brightness of the pilgrims (comets?) and forms solid watery wheels<\/p>\n<h3 class=\"pdf-heading\">lobes). Bhimi (the Earth) appears with six sisters.<\/h3>\n<p>ese produce by their continuous motion the inferior fire, heat,<\/p>", "images": [], "label": "Spiritual"}, {"pdf_page_index": 22, "pdf_page_number": 23, "html": "<p>WATER; and from the breath of all (atmospheric) Arr is born,<\/p>\n<p>These four are the four lives of the first four periods (Rounds) of<\/p>\n<p>Manvantara. The three last will follow.’” (1, 249-50 *)<\/p>\n<p>First as to the significance of the last two sentences: “‘ the four lives of the first four are the four Element-Principles to be developed during the first Four Rounds (numbered 4 to 7 preceding the citation): Fire, Air, Water, Earth Element-Principles. The Manvantara referred to is a Planetary Manvantara, equivalent to a period of activity of Seven Rounds. ‘‘ The three last will follow” refers to the three Rounds yet to be completed: Rounds Five, Six and Seven, bringing into development the remaining Tattvas (Element-Principles) : AkaSa-tattva during the Fifth Round; Anupapadaka-tattva during the Sixth Round; Adi-tattva during the Seventh Round; thus completing the Round-development of the Element-Principles in their relationship to the spheres or globes of the Earth-Chain. Attention is called to this observation, added in explanation of the Commentary:<\/p>\n<p>** This means that every new Round develops one of the Com-<\/p>\n<p>pound Elements, as now known to Science,—which rejects the<\/p>\n<p>primitive nomenclature, preferring to subdivide them into con-<\/p>\n<p>stituents. If Nature is the ‘ Ever-becoming’ on the manifested<\/p>\n<p>plane, then those Elements are to be regarded in the same light:<\/p>\n<p>they have to evolve, progress, and increase to the Manvantaric end.<\/p>\n<p>‘Thus the First Round, we are taught, developed but one Element,<\/p>\n<p>and a nature and humanity in what may be called one aspect of<\/p>\n<p>Nature.” (I, 250 ft)<\/p>\n<p>A question arises in regard to the development of Element-Principles in connection with the Rounds, which may be phrased in the following manner: Why is it that the Element-Principle of Fire is brought into development during the First Round, when it is classed as the fourth Element-Principle ?<\/p>\n<p>First of all, it should be borne in mind that the Element-Principles are produced emanationally, just as are the Lokas and Talas.¢ . Thus the second Tattva (Element-Principle) is emanated from the first—Adi-tattva; the third Element-Principle from the first and second—Anupapadakatattva; the fourth Tattva from the first, second and third—AkAga-tattva, Secondly, the importance of the Descending and Ascending Arcs in connection with the Round-cycles should also be held in mind: namely that the lowest point in the Arc of Descent occurs in the mid-point of the cycle of the Rounds, that is, during the Fourth Round. The emanational unfoldment of the Tattvas coincides with the lowest point in the Arc, so<\/p>\n<p>* Vol. I, pp. 294-5, 6 vol. ed.; I, 269-70, 3rd ed.<\/p>\n<p>t Vol. I, p. 295, 6 vol. ed.; I, 270, 3rd ed.<\/p>\n<p>t Described in “ The Septenary Law,&quot; Chapter VI, sections 2 and 3,<\/p>", "images": [], "label": "Page 22"}, {"pdf_page_index": 23, "pdf_page_number": 24, "html": "<p>Gao AD A © tuned S440 ea. ee Vy 2440-24 are situated the aripa globes (non-manifested globes)—during which period and on the ariipa globes, the emanation of the first three Tattvas occurs, thus bringing forth the fourth Tattva (Tejas-tattva), the Element-Principle of Fire, on the fourth cosmic plane. The suggestion is also offered that since the seven Tattvas are resultants from emanational unfoldment, each Tattva may be subdivided into, or is composed of, seven Element-Principles. In the same way the seven Principles of man’s constitution are emanational unfoldments and each principle is subdivided into seven ‘‘sub-principles”—known as the 49 Fires. Consequently the culmination of the Seven Rounds of cyclic development will bring forth into full evolution the 49 Element-Frinciples, and also the evolutionary unfoldment of the seven principles in man in their fullness—the 49 Fires.* Returning to the Commentary, a passage may be added in explanation of the activity of the Devourers,”’ described as the ‘“‘ fiery lives which live and have their being at the expense of every other life that they consume,”’ since it is through their agency that the globes were built. The earth,<\/p>\n<p>we are told, is built up for the first Round by the ‘ Devourers’ which disintegrate and differentiate the germs of other lives in the Elements; pretty much, it must be supposed, as in the present stage of the world, the aerobes do, when, undermining and loosening the chemical structure in an organism, they transform animal matter and generate substances that vary in their constitutions. . . .<\/p>\n<h3 class=\"pdf-heading\">the ‘ Devourers’ (in whom the men of science are<\/h3>\n<p>invited to see, with some show of reason, atoms of the Fire-Mist, if they will, as the Occultist will offer no objection to this); when the ‘ Devourers,’ we say, have differentiated ‘ the fire-atoms’ by a peculiar process of segmentation, the latter become life-germs, which aggregate according to the laws of cohesion and Then the life-germs produce lives of another kind, which work on the structure of our globes... .<\/p>\n<p>** Thus, in the first Round, the globe, having been built by the primitive fire-lives, i.e., formed into a sphere—had no solidity, nor qualifications, save a cold brightness, nor form nor color; it is only towards the end of the First Round that it developed one Element which from its inorganic, so to say, or simple Essence became now in our Round the fire we know throughout the system. The Earth * Cf. The Mahatma Letters to A. P. Sinnett,  “ Every clement having its seven principles and every principle its seven sub-princivles.”<\/p>", "images": [], "label": "Page 23"}, {"pdf_page_index": 24, "pdf_page_number": 25, "html": "<p>lejas-tattva, may be cited in order to illustrate the procedure accomplished by all the Tattvas. one Element-Principle for each Round. In the citation X equals “‘ the one eternal immutable principle ”’:<\/p>\n<p>“Take fire. D—the primal igneous principle resident in X—is the ultimate cause of every phenomenal manifestation of fire on all the globes of the chain. The proximate causes are the evoluted secondary agencies which severally control the seven descents of fire on each planet [globe]. . . ..D is a septenary compound of which the highest fraction is pure spirit. As we see it on our globe it is in its coarsest, most material condition, as gross in its way as is man in his physical encasement. In the next preceding globe to ours fire was less gross than here: on the one before that less still. And so the body of flame was more and more pure and spiritual, less and less gross and material on each antecedent planet [globe]. On the first of all in the manvantaric chain, it appeared as an almost pure objective shining—the Maha Buddhi, sixth principle of the eternal light. Our globe being at the bottom of the arc where matter exhibits itself in its grossest form along with spirit—when the fire element manifests itself on the globe next succeeding ours in the ascending arc it will be less dense than as we see it. Its spiritual quality will be identical with that which fire had on the globe preceding ours in the descending scale; the second globe of the ascending scale will correspond in quality with that of the second anterior globe to ours in the descending scale, etc. On each globe of the chain there are seven manifestations of fire of which the first in order will compare as to spiritual quality with the last manifestation on the next preceding planet [globe]: the process being reversed, as you will infer, with the opposite arc. The myriad specific manifestations of these six universal elements are in their turn but the offshoots, branches or branchlets of the one single primordial ‘ Tree of Life’. * Vol. I, pp. 302-3, 6 vol. ed.; I, 278-9, 3rd ed. The reason that this “‘ principle” is not named may be gathered from the following pas-sage in The Mahatma Letters to A.P. Sinnett, pp. 90-1 : 2 “there is but one element and it is impossible to comprehend our system before a correct conception of it is firmly fixed in one’s mind. ... This element then is the— to speak metaphysically—one sub-stratum or nent cause of all manifestations in the phenomenal universe. The ancients speak of the five cognizable elements of ether, air, water, fire, earth, and ofthe one incognizable element the uninitiates) the 6th principle of the universe—call it Purusha Sakti, while to speak of the seventh outside the sanctuary was punishable with death.” t The Mahatma Latisrs to A. P, Sinnatt, p. 92.<\/p>", "images": [], "label": "Page 24"}, {"pdf_page_index": 25, "pdf_page_number": 26, "html": "<p>Principle. Vayu-tattva, known as the Element of Air. It is called the second Element because of being the second tattva to be developed. However, as with the Element-Principle of Fire, that which was developed in the Second Round is not the Element of Air as we know it today. This is brought out in the citation:<\/p>\n<p>** The Second Round brings into manifestation the second element —Air, that element, the purity of which would ensure continuous life to him who would use it. There have been two occultists only in Europe who have discovered and even partially applied it in practice, though its composition has always been known among the highest Eastern Initiates.) The ozone of the modern chemists is poison compared with the real universal solvent which could never be thought of unless it existed in nature. ‘ From the second Round, Earth—hitherto a foetus in the matrix of Space—began its real existence: it had developed individual sentient life, its second principle. The second corresponds to the sixth (principle); the second is life continuous, the other, temporary.’ *’ (Commentary) (1, 260 *) The Third Round brings into the sixth tattva, Apastattva, known as the element of Water.<\/p>\n<h3 class=\"pdf-heading\">succession of primary aspects of Nature with which the<\/h3>\n<p>succession of Rounds is concerned, has to do, as already indicated, with the development of the ‘Elements’ (in the Occult sense)— Fire, Air, Water, Earth. We are only in the Fourth Round, and our catalogue so far stops short. The centres of consciousness (destined to develop into humanity as we know it) of the third Round arrived at a perception of the third Element, Water.” (I, 252-3 f) Our present Round, the Fourth, is bringing into development the seventh tattva to be emanated, Prithivi-tattva, the Element-Principle of Earth. Thus, Round<\/p>\n<h3 class=\"pdf-heading\">Fourth transformed the gaseous fluids and plastic form of<\/h3>\n<p>our globe into the hard, crusted, grossly material sphere we are living on. ‘Bhiimi’ has reached her fourth principle.” (I, 260 }) It should be stressed again that the Earth (Globe D) was in different states of physicality during each one of the Rounds. Even in the early<\/p>\n<p>of the Fourth Round our globe was still more ethereal than physical. his is brought out in dealing with the subject of characteristics and types * Vol. I, pp. 303-4, 6 vol. ed.; I, 280, 3rd ed. t Vol. I, pp. 296-7, 6 vol. ed.; I, 272-3, 3rd ed. t Vol. I, p, 304, 6 vol. ed; 1, 280, 3rd ed.<\/p>", "images": [], "label": "Page 25"}, {"pdf_page_index": 26, "pdf_page_number": 27, "html": "<p>transierred to the present, fourth Kound.<\/p>\n<p>** Occultism says: ‘ The astral prototypes of the mineral, vegetable and animal kingdoms up to man have taken that time (300 million years) to evolve, re-forming out of the cast-off materials of the preceding Round, which, though very dense and physical in their own cycle, are relatively ethereal as compared with the materiality of our present middle Round. At the expiration of these 300 million years, Nature, on the way to the physical and material, down the arc of descent, begins with mankind and works downwards, hardening or materializing forms as it proceeds. Thus the fossils found in strata, to which an antiquity, not of cighteen, but of many hundreds of millions of years, must be ascribed, belong in reality to forms of the preceding Round, which, while living, were far more ethereal than physical, as we know the physical. That we perceive and disinter them as tangible forms, is due to the process of materialization or crystallization referred to, which took place subsequently, at the beginning of the Fourth Round, and reached its maximum after the appearance of man, proceeding parallel with his physical evolution. This alone illustrates the fact that the degree of materiality of the Earth changes pari passu with that of its inhabitants. And thus man now finds, as tangible fossils, what were once the (to his present senses) ethereal forms of the lower<\/p>\n<h3 class=\"pdf-heading\">(II, 68 *)<\/h3>\n<p>The words of a Commentary described conditions of the Earth prior to the Fourth Round, going back, in fact, to a period of 120 million years, before which age the Earth had become cool and hard, albeit in a different degree of physicality and not in its present state,<\/p>\n<p>*** During the first seven crores of the Kalpa (70,000,000-years) the Earth and its two Kingdoms (mineral and vegetable), one already having achieved its seventh circle, the other, hardly nascent, are luminous and semi-ethereal, cold, lifeless, and In the eleventh crore the mother (Earth) grows opaque, and in the fourteenth the throes of adolescence take place. These convulsions of nature (geological changes) last until her twentieth crore of years, uninterruptedly, after which they become periodical, and at long intervals,’<\/p>\n<p>The last change took place nearly twelve crores of years ago (120,000,000). But the Earth with everything on her face had become cool, hard and settled ages earlier. (Commentary, xxii).”<\/p>\n<h3 class=\"pdf-heading\">(II, 312 T)<\/h3>\n<p>* Vol. III, p. 78, 6 vol. ed.; II, 72, 3rd ed. t Vol. ILI, pp. 312-3, 6 vol, ed.; II, 326, 3rd ed.<\/p>", "images": [], "label": "Page 26"}, {"pdf_page_index": 27, "pdf_page_number": 28, "html": "<p>OF man and the other Of nature, gocs on constantly during the evolutionary development of the Rounds. This cannot be repeated too often. As it is the principal theme of this section, another citation may help to emphasize the point. It also gives a sort of pre-view of what will occur in the later stages of this Round, as well as referring to the development of the next Element-Principle, during the next Round Fifth.<\/p>\n<p>“The elements, whether simple or compound, could not have remained the samc since the commencement of the evolution of our chain, Everything in the Universe progresscs steadily in the Great Cycle, while incessantly going up and down in the smaller cycles. Nature is never stationary during manvantara, as it is ever becoming, not simply being; and mineral, vegetable, and human life are always adapting their organisms to the then reigning Elements, and therefore those Elements were then fitted for them, as they are now for the life of present humanity. It will only be in the next, or fifth, Round that the fifth Element, Ether—the gross body of Akaga, if it can be called even that—will, by becoming a familiar fact of Nature to all men, as air is familiar to us now, cease to be as at present hypothetical, and also an ‘ agent’ for so many things. And only during that Round _ will those higher senses, the growth and development of which Aka§a subserves, be susceptible of
