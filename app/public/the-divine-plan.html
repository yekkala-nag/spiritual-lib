arpenters er laborers to carry out the plan. With materials of all kinds the n, or ‘‘ Builders,” make the plan visible, producing the form be sure, the Watchers are in absolute accord with the Divine One of their functions is to assist those who are on the lower rungs sadder of Life, so that they too may work in consonance with the Plan. As a of the Stanzas of Dzyan expresses it: ‘Then the Builders, having donned their first clothing, descend radiant earth, and reign over men—who are themselves.” anza VII, sloka 7) ‘The ‘ Watchers’ reign over man during the whole period of ya Yuga and the smaller subsequent yugas, down to the beginning the Third Root-Race; after which it is the Patriarchs, Heroes, 1 the Manes, the incarnated Dhydnis of a lower order... . And t [Secret] Doctrine says that the Dhyani-Buddhas of the two her groups, namely, the ‘ Watchers’ or the ‘ Architects,’ furnished /many and various races with divine kings and leaders. It is latter who taught humanity their arts and sciences, and the mer who revealed to the incarnated Monads that had just ken off their vehicles of the lower Kingdoms—and who had, refore, lost every recollection of their divine origin—the great ritual truths of the transcendental worlds. * Thus, as expressed in the Stanza, the Watchers descended on rth and reigned over men—‘ who are themselves.’ The reigning gs had finished their cycle on Earth and other worlds, in the ceding Rounds. In the future manvantaras they will have *n to higher systems than our planetary world; and it is the Elect our Humanity, the Pioneers on the hard and difficult path 1. I, pp. 210-1, 6 vol, ed.; I, 179-80, 3rd ed.<\/p>", "images": [], "label": "Page 28"}, {"pdf_page_index": 29, "pdf_page_number": 30, "html": "<p>(1, 266-7 *) Equivalent terms to Watchers arc: Rectors, Lords of Being, Seven Sublime Lords, Lhas and Dhyanis (of the Stanzas of Dzyan), Manus (of Hindu literature); and Dhyani-Buddhas (in the Northern Buddhistic scheme). The words of a Commentary called attention to this similarity in the usc of terms, at the same time stressing the function of these Beings. by referring to them as Informing Intclligences.<\/p>\n<p>Thus there is but onc Absolute Upadhi (basis) in the spiritual sensc, from, on, and in which, are built for Manvantaric purposes the countless basic centres on which procecd the Universal, cyclic, and individual Evolutions during the active period.’ ” The words ‘‘ basic centres”? were made equivalent to “‘ Spheres of Being,” or ‘‘ centres of life,” or again ‘centres of Being” (in the next following paragraph from the Commentary. ‘The active is. equivalent to a Manvantara. Continuing the Commentary:<\/p>\n<p>““* The informing Intclligences, which animate these various centres of Being, are referred to indiscriminately by men beyond the Great Range [i.e., Hindusthan] as the Manus, the Rishis, the Pitris, the Prajapatis, and so on; and as Dhyani-Buddhas, the Chohans, Melhas (fire-gods), Bodhisattvas, and others, on this side. The truly ignorant call them gods; the learned profane, the one God; and the wise, the Initiates, honor in them only the Manvan-taric manifestations of THat which neither our Creators (the Dhyan-Chohans) nor their creatures can ever discuss or know anything about. The is not to be defined, and no mortal or immortal has ever seen or comprehended it during the periods of Existence. The mutable cannot know the Immutable, nor can that which lives perceive Absolute (II, 34 f) Technically a Dhyani-Buddha, or Watcher, has governance of one Round; a Dhyani-Bodhisattva (also a Watcher) watches over a Globe; a Super-Terrestrial Bodhisattva watches over a Race and is assisted by two Manushya-Buddhas.<\/p>\n<h3 class=\"pdf-heading\">the Esoteric System, the watch successively over<\/h3>\n<p>one of the Rounds and the great Root-races of our planetary chain. They are, moreover, said to send their Bodhisattvas, the human correspondents of the Dhyani-Buddhas during every Round and Race. Out of the Seven Truths and Revelations, or rather revealed secrets, four only have been handed to us, as we are still in we Fourth Round, and the world also has only had four Buddhas, so far.... * Vol. I, pp. 309-10, 6 vol. ed.; I, 287-8, 3rd ed, t Vol. III, pp, 46-7, 6 vol. ed.; II, 37, 3rd ed.<\/p>", "images": [], "label": "Page 29"}, {"pdf_page_index": 30, "pdf_page_number": 31, "html": "<p>the Hindus and Buddhists, For a simular reason Lrenaeus insisted on the necessity of Four Gospels. But as every new Root-race at the head of a Round must have its revelation and revealers, the next Round will bring the Fifth, the following the Sixth, and so on,”<\/p>\n<h3 class=\"pdf-heading\">(I, 42 *)<\/h3>\n<p>In the Brahmanical scheme, as given in the Puranas and the Laws of mu, both the Races and the Rounds are under the guidance of Manus, nce the term is not specific, especially when it is stated that each Manu reates’? 7X7 Manus. In this case the Manus refer to the Races and y be explained in the following way. Each Round-Manu “ emanates chhaya his representative—to a globe (a Dhyani-Bodhisattva) ; o in turn emanates seven Manus, for each Race, and seven Manus for h Sub-Race—49 Manus. Then the Manus are described as watching over the Rounds. The sent ‘‘ Watcher,” named Vaivasvata, is stated to be the seventh Manu hough the present Round is the Fourth). The apparent confusion in ard to the seventh Manu, however, is easily explained, as may be scen the scriptures. In place of only seven Round-Manus, fourteen are imerated: seven are termed Root-Manus, seven are Seed-Manus. At beginning of a Round, on the first globe of the Chain (Globe A) comes Root-Manu; then at the close of the Round on the last globe of the ain (Globe G) the Seed-Manu appears. Thus the first Manu, the ot-Manu, represents the Manu watching over the Life-Waves during period of their activity on the seven globes—that is while performing ir seven stages of development on each globe during the Round-cycle, en the closing Manu, the Seed-Manu, takes over the watch, reigning + the Sishtas who remain on each of the seven globes of the Chain ing the period of dormancy (the resting period) between the Rounds. reality it is but one Watcher represented by two aspects: the state of ivity and the state of dormancy. ‘The idea is similar to the dual aspect the loka-talas. The loka represents the spirit-side and the tala, the tter-side: the two sides of one coin. Vaivasvata is regarded as the seventh Manu, presiding over the sent Round as the Root-Manu, because three Rounds have been fully npleted, with one Root-Manu and one Seed-Manu for each Round. e Fourth Round is still in process of development. The names of the fourteen Manus are enumerated in the Puranas. numbering a Root-Manu and a Seed-Manu for each Round, it will be n that the two aspects of a Manu (that is, watching over a period of ivity and a period of dormancy) govern the seven Round-periods, * Vol. I, pp. 114-5, 6 vol. ed.; 1, 73-4, 3rd ed.<\/p>", "images": [], "label": "Page 30"}, {"pdf_page_index": 31, "pdf_page_number": 32, "html": "<p>Svirochi (or Svarochisha)—on Globe G: Ist Secd-Manu ) Auttami —on Globe A: 2nd Root-Manu ‘Tiimasa —on Globe G: 2nd Raivata —on Globe A: 3rd Root-Manu . Chikshusha —on Globe G: 3rd Vaivasvata —on Globe A: 4ih Root-Manu) Sfiivarna —on Globe G: 4th Sccd-Manu § ROUND 4 Daksha Savarna —on Globe A: 5th Root-Manu Brahma Savarna —on Globe G: 5th aa ROUNDS Dharma Savarna —on Globe A: 6th Root-Manu ROUND 6 Rudra Sfvarna —on Globe G: 6th ct Rauchya —on Globe A: 7th Root-Manu ROUND 7 Bhautya —on Globe G: 7th<\/p>\n<h3 class=\"pdf-heading\">5. THE RELATION OF ROUNDS AND THE<\/h3>\n<h3 class=\"pdf-heading\">AFTER-DEATH STATES<\/h3>\n<p>It should be clear that the Doctrine of the Rounds deals with periods of cyclical activity to time-periods covering many millions of years. At first glance, then, it would seem incompatible with the main theme to consider what may be called an “ state, or condition, since that is what the post-mortem state is for one part of man’s ‘‘ Yet individualized as it is for one part, it is cosmic in scope for another portion of man’s being. After all, it may be remarked in passing, that unless the Doctrines of the Rounds and Races are thoroughly understood<\/p>\n<p>as an intellectual pursuit, but made something to live by, or, better yet, incorporated into the fibre of one’s being, so to speak—then both the afier-death state, as well as the phase of existence on carth, become solely individualized. For, since knowledge of the Round-cycles is lacking, man seems to be going “‘ against the current” of the Round activity, striving for his own ends, instead of working in harmony with the mighty, pulsating rhythms which in reality keep all life cycling on the Circle of Necessity. So one may be justified in adding parenthctically, that the first Nidana (the first bond which fetters man to carth-lifc) is indecd responsible for so much sorrow in the world—Avidya, or non-knowledge of the Divine Plan.<\/p>\n<p>It hardly seems necessary to make the statement that the Doctrine of the Rounds bases its teaching upon the Doctrine of Constant Renewal. Yet it cannot be repeated too often that it is the Monad which utilizes vehicle after vehicle for temporary appearances upon the globe on which the Human Life-Wave is functioning, in order to accomplish the Circle of Necessity. Nevertheless, a strange paradox exists: although it is necessary<\/p>", "images": [], "label": "5. The Relation Of Rounds And The"}, {"pdf_page_index": 32, "pdf_page_number": 33, "html": "<p>le of Necessity, thus continuing on the cycle of the Rounds, the of such vestures renders the Monad unable to contact other s of life (spheres) with which it has a close relationship (outlined Joctrine of the Spheres), in order that it may accomplish other<\/p>\n<p>It must wait for this close contact with other spheres until it is m the bond which holds it fast. This bond is the phase of existence fe on earth. Freedom from this fetter is achieved when another ‘existence is entered into—known as “‘ death.” Then the Monad ed to continue its cyclic journeys to other spheres—first of all to r globes of this planetary chain, then on to the other spheres with it is linked. So that other Rounds are continued during the ith state. s is the fundamental idea underlying the doctrine of Gilgilim, octrine may be utilized to explain the relationship of Rounds to r-death states: However, although Gilgillim was a teaching of ient Chaldaean Kabbala, it has been sadly misunderstood by 1 Kabbalists, in the same way that the Pythagorean of Metempsychosis has been misinterpreted and not understood &gt; who consider the literal meaning of words, without knowledge tent conveyed by the doctrines. st of all the Kabbalistic ideas on Metempsychosis should be borne . These are epitomized in the well-known Kabbalistic axiom: * th becomes a stone, the stone becomes a plant, the plant an animal, mal a man, the man a the spirit—God. This doctrine is linked with that of the Gilgilim, and it is obvious that the goal | by the axiom is only achieved by means of reincarnation, is a Hebrew word which may be translated as revolutions or<\/p>\n<p>conveying to Kabbalists the idea of the cycle of rebirths. That y the word itself means the revolutions or rounds which the Monad ake until attaining its goal—the goal having been given the namé lestine’”. However, medieval Kabbalists developed the concept ite a different form, not at all implied in the original Kabbala, ng the notion that when the bodies of Jews are buried in strange is Mackenzie’s Royal Masonic Cyclopaedia has it, there is within them ‘* a principle of Soul which cannot rest, until by a process called “whirling of the Soul” the immortal particle reaches once re the sacred Soil of the ‘* Promised Land”.’ . . . The process s supposed to be accomplished by a kind of metempsychosis, the chic spark being conveyed through bird, beast, fish; and the st minute insect.” (I, 568 ft) wever, the explanation of this portion of the doctrine of Gil ame that applies to the Pythagorean doctrine of Metempsychosis is axiom has been explained in Chapter V, “ The Doctrine of Continuous Change 4\t1\t3\t1\t2\t0\t0\t2018\t570\t38\t-1\t5\t1\t3\t1\t2\t1\t0\t2014\t27\t46\t58.195705\t1,5\t1\t3\t1\t2\t2\t35\t2020\t80\t36\t62.882015\tII,5\t1\t3\t1\t2\t3\t92\t2014\t27\t46\t91.429367\tp.5\t1\t3\t1\t2\t4\t130\t2014\t57\t46\t96.141655\t202,5\t1\t3\t1\t2\t5\t203\t2020\t12\t28\t96.816093\t65\t1\t3\t1\t2\t6\t230\t2014\t50\t46\t90.518143\tvol.5\t1\t3\t1\t2\t7\t295\t2014\t54\t46\t88.823959\tod.;5\t1\t3\t1\t2\t8\t360\t2019\t24\t33\t80.935936\tI,5\t1\t3\t1\t2\t9\t402\t2014\t53\t46\t96.208221\t621,5\t1\t3\t1\t2\t10\t471\t2014\t39\t46\t89.762100\t3rd5\t1\t3\t1\t2\t11\t525\t2014\t45\t46\t88.695312\ted.<\/p>", "images": [], "label": "Page 32"}, {"pdf_page_index": 33, "pdf_page_number": 34, "html": "<p>bodies of animals but<\/p>\n<p>‘The allegory relates to the atoms of the body, which have each to pass through every form before all reach the final state, which is the first starting point of the departure of every atom—its primitive laya State. But the primitive meaning of Gilgoolem, or * Revolution of Souls,’ was the idea of the re-incarnating Souls or Egos. ‘ All the Souls go into the gilgoolah,’ into a cyclic or revolving process; 1.€., they all proceed on the cyclic path of re-births. Some Kabalists interpret this doctrine to mean only a kind of purgatory for the souls of the wicked. But this is not so.” (I, 568 *) After the second sentence in the following citation, another author (Valentinus in his Esoteric Treatise on the Doctrine of Gilgul) is quoted, who gives another interpretation of the Kabbalistic doctrine:<\/p>\n<p>‘No ancient philosopher, not even the Jewish Kabalists, ever dissociated Spirit from matter or vice versa. Everything originated in the Ong, and, proceeding from the One, must finally return to the One. ‘ Light becomes heat, and consolidates into fiery particles; which, from being ignited, become cold, hard particles, round and smooth. And this is called Soul, imprisoned in its robe of matter’; Atoms and Souls having been synonymous in the language of the Initiates. The ‘ whirling Souls,’ Gilgoolem, a doctrine in which so many learned Jews have believed, had no other meaning esoterically. The learned Jewish Initiates never meant by the ‘ Promised land’ Palestine alone, but the same Wirvdna as the learned Buddhist and Brahman do—the bosom of the One, symbolized by that of Abraham, and by Palestine as its substitute on Earth.” (I, 568 f) It needs but the substitution of the word Monads for or Egos” and the addition of on the Spheres, to have the full explanation of the doctrine—namely, that the whirling of the Monad continues on the<\/p>\n<p>during the after-death states. This interpretation is borne out by © very next sentence:<\/p>\n<p>“The passage of the Sovut-Arom ‘through the Seven Planetary Chambers’ had the same metaphysical and also physical meaning.”<\/p>\n<h3 class=\"pdf-heading\">(I, 568 $)<\/h3>\n<p>As to the “‘ physical meaning.” This signifies the passage of the life-atoms (Jivanus), already referred to, through the lower seven kingdoms on the hierarchical Ladder of Life, the Human Host representing the seventh Kingdom on the Ladder. With the death of the body, the cohering force holding the life-atoms together into the mould or pattern of * Vol. II, p. 292, 6 vol. ed.; I, 621, 3rd ed. t Vol. IL, p. 291, 6 vol. ed.; I, 620, 3rd ed. t Vol. LI, p. 292, 6 vol, ed.; I, 621, 3rd ed.<\/p>", "images": [], "label": "Page 33"}, {"pdf_page_index": 34, "pdf_page_number": 35, "html": "<p>the Linga-sarira (the Model body) and the othwa-satira (the Body) as well as the dominating overseership of the Monad, no longer exerts its influence. Consequently the life-atoms are free to pursue their journeys, transmigrating (that is, passing from kingdom to kingdom) until they are attracted to their proper respective kingdoms. In regard to the metaphysical meaning: the “‘ Seven Planetary Chambers” have reference to chambers so named within the Great Pyramid: the Chamber of Saturn, the Chamber of Jupiter, the Chamber of Mars, the Chamber of Venus, the Chamber of Mercury, the Lunar Chamber, the Solar Chamber. As to the architectural symbology of the Pyramid itself: ** The apex is lost in the clear blue sky of the land of the Pharaohs, and typifies the primordial point lost in the unseen universe from whence started the first race of the spiritual prototypes of man.” * Observe the following passage, using the suggested changes (given previously) :<\/p>\n<p>** Fach mummy, from the moment that it was embalmed, lost its physical individuality in one sense; it symbolized the human race, Placed in such a way as was best calculated to aid the exit of the ‘ soul,’ the latter had to pass through the seven planetary chambers before it made its exit through the symbolical apex. Each chamber typified, at the same time, one of the seven sphcres, and one of the seven higher types of physico-spiritual humanity alleged to be above our own. Every 3,000 years, the soul, representative of its race, had to return to its primal point of departure before it underwent another evolution into a more perfected spiritual and physical transformation. We must go deep indeed into the abstruse metahysics of Oriental mysticism before we can realize fully the infinitude of the subjects that were embraced at one sweep by the majestic thought of its exponents.” f * Isis Unveiled, Vol. 1, pp. 296-7.<\/p>", "images": [], "label": "Page 34"}, {"pdf_page_index": 35, "pdf_page_number": 36, "html": "<p>relation of Rounds and Principles covers the [caching ee eee reference to the Human Kingdom—that one principle of the seven, of which man is constituted, is completely developed in one Round. As this is the Fourth Round, the fourth principle, Kama (the desire-principle) is undergoing its major developmental phases.<\/p>\n<p>“Tt is not in the course of natural law that man should become<\/p>\n<p>a perfect septenary being, before the seventh race in the seventh<\/p>\n<p>Round. Yet he has all these principles latent in him from his birth.<\/p>\n<p>Nor is it part of the evolutionary law that the Fifth principle<\/p>\n<p>(Manas), should receive its complete development before the Fifth<\/p>\n<p>Round. . . . Even in the coming seventh Race, at the close of this<\/p>\n<p>Fourth Round, while our four lower principles will be fully devel-<\/p>\n<p>oped, that of Manas will be only proportionately so.” (II,, 167 *)<\/p>\n<p>Expressed in a mystical symbol used in the Stanza of Dzyan, man is a Saptaparna (a “‘seven-leaved plant’); one parna is unfolded in each Round. As the word parna means a leaf, it may be said that a parna stands for one principle. In seven Rounds all the leaves will be unfolded.<\/p>\n<p>Another symbolical way of expressing this teaching is provided in a Commentary:<\/p>\n<h3 class=\"pdf-heading\">needs four flames and three fires to become one on<\/h3>\n<p>Earth, and he requires the essence of the forty-nine fires to be<\/p>\n<p>perfect.’”? (II, 57 f)<\/p>\n<p>In explanation. The Four Flames are represented by the perishable quaternary, the four lower principles: Sthila-Sarira (the physical body), Linga-Sarira (the model body), Prana (the life-principle), Kama (the desire-principle). The Three Fires stand for the imperishable triad, the three higher principles: Manas (the mind-principle); Buddhi (the dis¢eriminating principle) ; Atman (the universal principle). The “‘ essence of the forty-nine may be rendered as the seven principles subdivided into seven—the seven with the seven, 7X7=49. In other words, the « seven within the seven” stand for the seven principles with their septenary aspects, that is, each one of the seven principles consists of seven aspects: 7x7=49. In the words of a Commentary:<\/p>\n<h3 class=\"pdf-heading\">also with man and every “man” in man (every prin-<\/h3>\n<p>ciple).’” (II, 29 $)<\/p>\n<p>In order to elucidate what is meant by “every man in man,” the seventh principle, Atman, may be taken to illustrate the point: Within a<\/p>\n<p>* Vol, III, p. 175, 6 vol. ed.; II, 177, 3rd ed.<\/p>\n<p>t Vol. III, p. 67, 6 vol. ed.; 1, 60, 3rd ed.<\/p>\n<p>¢ Vol. p, 42, 6 vol. ed.; 11, 32, 3rd ed.<\/p>", "images": [], "label": "Page 35"}, {"pdf_page_index": 36, "pdf_page_number": 37, "html": "<h3 class=\"pdf-heading\">A DIAGRAMMATIC REPRESENTATION OF “EVERY ‘MAN’ IN MAN”<\/h3>\n<p>en cant of the seven principles of man. indicates<\/p>\n<h3 class=\"pdf-heading\">de esa Divine Man”—are placed seven<\/h3>\n<p>ee within each one of the seven Bg oar goer The complete dia~ should show each one of the seven principles as a large s ee ee ren of Ge seven large apheves : ° ‘every ‘man’inman”. In their they represent the 49 Fires,<\/p>", "images": [{"file": "diagram_35.jpg", "caption": "Diagram as printed in the original"}], "label": "Page 36"}, {"pdf_page_index": 37, "pdf_page_number": 38, "html": "<h3 class=\"pdf-heading\">Kenan Thus tt<\/h3>\n<p>each sphere representing an aspect of Atman. Thus there is the<\/p>\n<p>Sthila-garira aspect of Atman<\/p>\n<p>Linga-Sarira aspect of Atman<\/p>\n<p>Prana aspect of Atman<\/p>\n<p>Kama aspect of Atman<\/p>\n<p>Manas aspect of Atman<\/p>\n<p>Buddhi aspect of Atman<\/p>\n<p>Atman aspect of Atman<\/p>\n<p>Each principle may be listed in the same way, resulting in the forty-nine fires.<\/p>\n<p>In further explanation: although Atman is regarded as the seventh and the last principle to be completely developed, nevertheless it is the originating principle from the standpoint of emanation. That is to say, the seven principles are emanated from, or unrolled forth, from this universal principle. In the same manner the seven Element-Principles have been described as emanating from the originating Element-Principle, Kadi-tattva. Similarly, in the case of a universe, it emanates from, or issues forth, from its originating Central Point—its Atman or Paramatman.<\/p>\n<p>It has been repeatedly asserted that Atman is unable to function or manifest on the physical plane, but must make its presence apparent by means of its upadhi, which is the Buddhi-principle. Upadhi is generally rendered “4 vehicle,” but it may also be rendered “‘ since the literal meaning of the word is ‘‘ that which stands in the place of”, hence a “‘ veil”, or “ veil of spirit”, which Atman issues forth in order that it may shine through the emanation. However, even Buddhi is unable to manifest or function on the physical plane without its upadhi, Manas, which issues forth from From Atma-Buddhi-Manas is emanated Kama; from Atma-Buddhi-Manas-Kama issues forth Prana; from Atma-Buddhi Manas-K4ma-Prana ‘unrolls Linga-Sarira; lastly from Atma-Buddhi-Manas-K4ma-Prana-Linga-Sarifa is emanated Sthiila-Sarira. Because of this emanational “descent it should be clear that each principle partakes not only of its proximate emanating principle, but the whole series of principles. In so far as the evolutionary development of a principle in a Round is concerned,<\/p>\n<p>“it is sinyply this: every * Round’ brings about a new develop-<\/p>\n<p>ment and even an entire change in the mental, psychic, spiritual<\/p>\n<p>and physical constitution of man, all these principles evoluting on<\/p>\n<p>an ever ascending scale.” (I, 162 *)<\/p>\n<p>Another diagram serves to indicate the development of one principle for cach Round, as well as to represent the 49 Fires. On the left-hand side the Rounds are indicated; on the right-hand side the Principles, one for each Round. The principles are placed in emanational descent, 80<\/p>\n<p>Vol. I, p. 216, 6 vol. ed; I, 185, Srd ed.<\/p>", "images": [], "label": "Kenan Thus Tt"}, {"pdf_page_index": 38, "pdf_page_number": 39, "html": "<p>er Of ascent, pointing to the spiralling advance Or Clim) that 18 Under} en during the Circle of Necessity, one Round being equivalent to one ve of the spiralling ascent. Again, the seven principles are placed<\/p>\n<h3 class=\"pdf-heading\">STHOLA LINGA<\/h3>\n<h3 class=\"pdf-heading\">SARTRA RIRA = PRANA KAMA MANAS BUDDHI ATMAN<\/h3>\n<p>ROUND x te tr x  ATMAN<\/p>\n<h3 class=\"pdf-heading\">‘ROUND x * &amp; * *  BUDDHI<\/h3>\n<h3 class=\"pdf-heading\">x te vr vr * tr vy MANAS<\/h3>\n<h3 class=\"pdf-heading\">x w v * vr w KAMA<\/h3>\n<h3 class=\"pdf-heading\">ve * wt sx PRANA<\/h3>\n<h3 class=\"pdf-heading\">x * * w tr sx LINGA-SARIRA<\/h3>\n<h3 class=\"pdf-heading\">+ rt tt t od sx STHULA-SARTRA,<\/h3>\n<p>izontally, each principle being portrayed by seven “ stars” in columnar m, six stars being “‘ open,” the seventh one “‘ filled”. The “ filled star” each column serves to show the especial principle that is developed ing a Round. Since the Human Host of Monads is at present engaged in following Fourth Round, in the spiralling ascent, it will be apparent that the wth Principle, Kama, is undergoing its pre-eminent development, ce humanity is engaged in unfolding the fifth major developmental<\/p>\n<h3 class=\"pdf-heading\">being equivalent to what is termed the Fifth Root-Race—the<\/h3>\n<p>nas-aspect of the Kama principle is being stressed. During the Sixth se the Buddhi-aspect of the Kama principle will be brought forth into clopment. Then during the Seventh Race the Atman-aspect of | receive its pre-eminent unfoldment. During the Fifth Round the Manas-principle will be unfolded in all sevenfold aspects. In the diagram the stars” serve to indicate the six other ects of each Principle. The “ filled represents the fully developed nciple for the Round.<\/p>\n<p>evertheless, a word of caution relative to diagrammatic representa1s should be added. A diagram is useful to illustrate a specific point, at the same time the diagrammatic representation is apt to be misdling in regard to other aspects of the teaching. Thus it would be<\/p>\n<p>to regard the 49 Fires as being distinct and separable portions, from the other. All the 49 Fires interpenctrate each other, just as<\/p>", "images": [], "label": "Sthola Linga"}, {"pdf_page_index": 39, "pdf_page_number": 40, "html": "<p>this manner solely for purposes of study.<\/p>\n<p>In the case of the 49 Fires, thus portrayed in diagrammatic manner, the illustration serves to call attention to the fact that some of the Fires have been “lighted” or developed, particularly those that pertain to the lower principles. On the other hand the Fires of the higher principles await or unfoldment in future Rounds. In fact, all the Fires<\/p>\n<h3 class=\"pdf-heading\">to the superior Rounds are at present dormant. In so far as<\/h3>\n<p>is higher principles are concerned, man is still unenlightened. Nevertheless there is the possibility of effecting this enlightenment. Examples of this do appear on earth now and then.<\/p>\n<p>“© All such prematurely developed intellects (on the spiritual<\/p>\n<p>plane) in our Race are abnormal; they are those whom we call the<\/p>\n<p>‘ Fifth-Rounders’.” (II, 167 *)<\/p>\n<h3 class=\"pdf-heading\">FIFTH-ROUNDERS<\/h3>\n<p>Just what is meant by the term “ Fifth-Rounders”? The technical meaning signifies that the development of the fourth principle, Kama, has been completed in all its sevenfold aspects. That is to say, all the Fires. of Kama have been lit. Following this, the effort is being made to unfold, or develop the fifth principle, Manas, until all of its sevenfold aspects are brought into development. ‘This will be the developmental phase to be undertaken on the fifth cycling during the spiralling ascent of this planetary manvantara. In other words Manas will be fully develeped at the conclusion of the Fifth Round.<\/p>\n<p>Since humanity is proceeding on its fourth cycling of the spiralling ascent, the vast majority of the human race is engaged in developing Fourth Round phases. Fourth-Rounders are therefore predominant. Those referred to (in the citation) as “ prematurely developed intellects on the spiritual plane” are forerunners. They have forged ahead. They are called Fifth-Rounders. Thus the F ifth-Rounders exemplify the process of the unfolding of the higher aspect of the Manas-principle.<\/p>\n<p>“Thence it follows that those persons who, like Confucius and<\/p>\n<p>Plato, belonged psychically, mentally, and spiritually to the higher<\/p>\n<p>planes of evolution, were in our Fourth Round as the average man.<\/p>\n<p>will be in the Fifth Round, whose mankind is destined to find itself,<\/p>\n<p>on this scale of Evolution, immensely higher than is our present<\/p>\n<p>humanity.” (I, 162 f)<\/p>\n<p>A technical explanation of how the development of the Fifth-Rounders has been effected is available:<\/p>\n<p>* Vol. III, p. 175, 6 vol. ed.; II, 177, 3rd ed.<\/p>\n<p>Vol. 1, p. 216, 6 vol. ed.; 1. 185, 3rd ed.<\/p>", "images": [], "label": "Page 39"}, {"pdf_page_index": 40, "pdf_page_number": 41, "html": "<p>has but begun his first on Z and as A dies when he leaves it for B, etc., and as he must also remain in the inter-cyclic sphere after Z, as he has between every two planets until the impulse again thrills the chain, clearly no one can be more than one round ahead of his kind.” *<\/p>\n<h3 class=\"pdf-heading\">his seventh ring upon A” signifies completing the<\/h3>\n<p>enth major developmental phase, or the Race” upon the t globe of the terrestrial chain—globe A. ‘‘Z” has reference to the most sphere or globe of the chain. It will be noticed that the phrase d is that Globe A dies—not that it goes into pralaya. In so far as the nan life-wave is concerned, Globe A has finished its evolutionary cycle the Round, and continues its existence in a state of dormancy *‘ obscuration”), until the human life-wave returns to Globe A for next Round of cyclic development. The word “etc.” after Globe B<\/p>", "images": [], "label": "Page 40"}, {"pdf_page_index": 41, "pdf_page_number": 42, "html": "<p>The “‘inter-cyclic period” refers to the ef Rounds, known technically as the Sandhyas and (** dawns ” and The inter-cyclic period also refers to the interval following the completion of the seven Races on a globe and the inauguration of the Life-Wave on the next globe of the Chain. Another citation explains what is accomplished by the fore-runners of the human race: “The scheme with its septenary details would be incomprehensible to man had he not the power as the higher Adepts have proved of prematurely developing his 6th and 7th senses—those which will be the natural endowment of all in the corresponding rounds. Our Lord Buddha—a 6th round man—would not have appeared in our epoch, great as were his accumulated merits in previous rebirths but for a mystery... - Individuals cannot outstrip the humanity of their round any further than by one It was in connection with a question. regarding Fifth-Rounders that the celebrated remark was penned:<\/p>\n<p>“A few drops of rain do not make the Monsoon, though they presage it.” (I, 162 T) It is because of the interpenetration of the seven principles—that is to say, the “seven within the seven,” making the 49 Fires—that man is able to evoke his superior principles, which the Round development will unfold in the course of ages. Yet there is a way of speeding up the process. It is achieved by means of initiations.<\/p>\n<p>The chief object of our struggles and initiations is to achieve this union while yet on this earth. Those who will be successful have nothing to fear of during the fifth, sixth and seventh rounds.” The “union” referred to is a blending of “‘ the three into one—the sixth ”’. That is, blending the fourth, fifth and seventh principles—Kama, Manas and Atman—into the sixth principle, Buddhi. For—<\/p>\n<p>“The degrees of an Adept’s initiation mark the seven stages at which he discovers the secret of the sevenfold principles in nature and man and awakens his dormant § * The Mahatma Letters to A. P. Sinnett, p- 96. t Vol. I, p. 216, 6 vol. ed.; I, 185-6, 3rd ed. 4 The Mahatma Letters to A, P. Sinnett, p- 78. § p. 99.<\/p>", "images": [], "label": "Page 41"}, {"pdf_page_index": 42, "pdf_page_number": 43, "html": "<p>Admittedly, the subject of the Outer Rounds is in the nature of a sed book (to use a familiar expression) to many. This is so especially . distinction has not been made between the Inner Rounds and the ter Rounds. Nevertheless there is a precise meaning applicable to h term. That a distinction was required made clear by the<\/p>\n<p>who first presented the Esoteric Philosophy, as this passage icates:<\/p>\n<h3 class=\"pdf-heading\">may feel sure that neither M. nor I have contradicted<\/h3>\n<p>each other in our respective statements. He was speaking of the inner—I, of the outer Round.” * Wherein lies the difference ? A definition has been given for the Inner Rounds, namely, the passage he Monadic Hosts from globe to globe within the circuit of the seven bes of a planetary chain. Further clarification explained that the circuit of the seven globes sists of two phases: (1) the circling on the Descending Arc, constituting passage of the Life-Waves from Globes A to D; (2) the circling on the ending Arc, consisting of the passage of the Monadic Hosts from Globes o G. ‘Both phases are aspects of the Inner Rounds. The Outer Rounds may be defined as the passage of Monads from » planetary chain to another planetary chain and beyond . . . . thus icating that the circling is outside the “‘ Home” planetary chain. Since relationship has been shown to exist between the Monad and the en Sacred Planets (in the Doctrine of the Spheres), the passage of the mad to and from the members of this system would be a means of illing the obligations of the relationship (using the analogy of a family tlucidate the point), at the same time preserving the bond of attachment, is cyclic journey continues during the life of the Solar Logos, or during<\/p>\n<p>of a Solar Manvantara. In the Doctrine of the Spheres, under the section entitled The Doctrine Gyelic Journeys, the teaching was presented regarding the transference<\/p>\n<p>energy, termed the One Life-Force, from the pulsating heart of the lem to its members. The sun represents the heart and brain of the lem, while the planets are its arteries and veins. There is no need to @at the doctrine here,t but because of its importance and bearing upon subject of the Outer Rounds, a portion of a Commentary will now be eated;<\/p>\n<p>* (xxi) ‘The real substance of the concealed (Sun) is a nucleus of Mother substance. It is the heart and matrix of all the living * The Mahatma Letters to A. P. Sinnett, p. 392.<\/p>\n<h3 class=\"pdf-heading\">2 ade tat the whole ce ourneys be read over again<\/h3>\n<h3 class=\"pdf-heading\">oe ot the of dl hum ohne<\/h3>", "images": [], "label": "Page 42"}, {"pdf_page_index": 43, "pdf_page_number": 44, "html": "<p>ae. ee gl eee<\/p>\n<p>which proceed to spread on their cyclic journeys all the Powers<\/p>\n<p>that set in’ action the atoms in their functional duties, and the<\/p>\n<p>focus within which they again meet in their SEVENTH ESSENCE every<\/p>\n<p>eleventh year.’” (I, 290 *)<\/p>\n<p>This shows that there is a regular rhythmic pulsation between the: Janets and the sun: a flowing to the sun of the vital energy in order that it may be revitalized, as well as a streaming forth from the sun of this life essence. This represents a continuous circulation of life-force representative of the cyclic journeys of the Outer Rounds, as basic and fundamental as is the circuit of the Inner Rounds on the Circle of Necessity.<\/p>\n<p>The next phase of the Doctrine of the Outer Rounds deals with the ose of the Monads themselves. Just as it is necessary for the One ife-Force of the system to be revivified at its source by means of the circuit performed on the Outer Rounds, so is it equally needful for the Monads, as sparks from the Vital Flame (to use an analogy), to become “ re-charged ” from their originating Source. As presented in the section entitled The Relation of Rounds and the After-Death States, under the doctrine of (the Whirling of the Monads), the Monad “‘ had to return to its primal point of departure,” that is, return to its originating Source, “ before it underwent another evolution,” that is, before returning to earth in order to take on another vesture—or, as we say, become reborn on earth again. It was also: shown that the required cyclic journey necessitated a passage through the Seven Planetary Chambers,” that is, the Seven Spheres, or the Seven Sacred Planets. A passage will now be given indicating the cyclic journeys of the Outer Rounds. It is introduced by means of this sentence:<\/p>\n<p>‘The Planetary origin of the Monad (Soul) and of its faculties<\/p>\n<p>was taught by the Gnostics.” (I, 577 *)<\/p>\n<p>This aspect of the teaching was fully covered in the section entitled The Doctrine of the Relationship of the Monads to the System.t The word “faculties”? may also be rendered “ principles”, which was also considered. Continuing the citation:<\/p>\n<h3 class=\"pdf-heading\">its way to the Earth, as on its way back from the Earth,<\/h3>\n<p>each soul born in, and from, the ‘Boundless Light,’ had to pass<\/p>\n<p>through the seven planetary regions both ways.” (I, 577 $)<\/p>\n<p>The Gnostic term “ Boundless Light ” is indeed an excellent way of expressing the originating Source of the Monad. What could be more majestic than the splendour of that Flame which is inextinguishable and which encompasses infinitude! Observe the importance of the words<\/p>\n<p>* Vol. I, p. $31, 6 vol. ed.; 1, 310, 3rd ed.<\/p>\n<p>t Vol. IL, p. 300, 6 vol, ed.; I, 630, Srd ed.<\/p>\n<p>In Chapter VII, The Doctrine of the Spheres.<\/p>", "images": [], "label": "Page 43"}, {"pdf_page_index": 44, "pdf_page_number": 45, "html": "<p>nets on its departure from the earth—when the Monad is lberated n its bonds by means of that which is called “‘ death” on earth. Then en the return cyclic journey from the Boundless Light is made, the mad again passes through the Seven Sacred Planets on its way to take another vesture on Earth—to be born again, in order to take up the ‘rrupted Circle of Necessity occasioned by its departure on the Outer unds, Before giving the names of the Seven Sacred Planets as they were wn by the Gnostics, as recorded by the Christian Father, Origen,* entence calls attention to the fact that the original concept regarding Planetary Regents, or Dhydnis, has been altered in some religions, 0 was done is explained in a later paragraph, but may well be d first:<\/p>\n<p>**As usual, that which is and was from its beginning divine, pure, and spiritual in its earliest unity, became, by reason of its differentiation by the distorted prism of man’s conceptions, human and impure, as reflecting man’s own sinful nature.” (I, 577 f) Does not this account for the strange stories about the malpractices of ls and goddesses found in religions? But to return to the citation:<\/p>\n<h3 class=\"pdf-heading\">pure Dhyani and Devas of the oldest religions had become,<\/h3>\n<p>in course of time, with the Zoroastrians, the Seven Devs, the ministers of Ahriman, ‘each chained to his planet’; with the Brahmans, the Asuras and some of its Rishis—good, bad and indifferent; and among the Egyptian Gnostics it was Thoth (or Hermes) who was the chief of the seven whose names are given by Origen as Adonai, genius of the Sun; Tao [Iao] of the Moon; Eloi,<\/p>\n<p>iter; Sabao, of Mars; Qrai, of Venus; Astaphai, of Mercury;<\/p>\n<p>ldabaoth (Jehovah), of Saturn.” (I, 577 f) The interplay of the Outer Rounds and Inner Rounds, as the Monad<\/p>\n<p>its cyclic journeys, is a fascinating study. It demonstrates the monious working of the Divine Laws in consonance with the Divine h. It illustrates the fact that the Monad is ‘‘ at home” at any spot in Universe—since law and order prevail throughout the kosmos. This also brings out the truth of the hierarchical pattern upon which universe is builded (which was the theme of Chapter III). For, as f proceeds on the Circle of Necessity, he discovers that he is ever<\/p>\n<p>his horizon, ever extending his range of consciousness, as he<\/p>\n<p>to function in wider ranges of existence. * In his celebrated work Contra Celsum, Bk, VI, xxiv, xxxxviii. Vol, IL, p. $01, 6 vol. ed.; I, 631, 3rd ed, Vol. 11, pp. 300-1, 6 vol, ed.; I, 630-1; 3rd ed,<\/p>", "images": [], "label": "Page 44"}, {"pdf_page_index": 45, "pdf_page_number": 46, "html": "<p>DEERE: ee the sphere in which the Human Life-Wave is carrying on its major developmental stages—by means of the Seven Root-Races. Through his aconslong cyclical journey, Man has already learned to function in each one of the kingdoms on the Ladder of Life extending below his hierarchy, as the Monad has progressed up the rungs of the Ladder, one by one.<\/p>\n<p>‘As the Inner Rounds carry the Human Life-Wave from globe to globe of the planetary chain, Man learns through experience on each globe how to evolve on each sphere. For the most part, however, the cyclic journey on the Ascending Arc of the Inner Rounds that is being carried on during the after-death states—while the Human Life-Wave is carrying on its evolution on the present globe, Globe D—is being followed unconsciously. The state is similar to that which prevailed during the period when the human race was undergoing its development during the First and Second Races on this Fourth Round. That is to say, since the Manas-principle was not actively operating, Man was not consciously carrying on his evolution by means of self-directed efforts, therefore he<\/p>\n<h3 class=\"pdf-heading\">tan what te termed an unconscious state.<\/h3>", "images": [], "label": "Tan What Te Termed An Unconscious State."}, {"pdf_page_index": 46, "pdf_page_number": 47, "html": "<h3 class=\"pdf-heading\">CHAPTER X<\/h3>\n<h3 class=\"pdf-heading\">THE AFTER-DEATH STATES<\/h3>\n<p>has been established that Motion is eternal, irrespective of whether the ise is that of manifestation or non-manifestation. In a sense this is licable to the Monadic Essence—that part of man linked to immortality or its spheres of operation are not subject to finiteness. This forms one he keys to an understanding of the after-death states. Another key is tained in the Law of Periodicity: that periods of activity are followed periods of rest. These are two of the Divine Laws which encompass universe.<\/p>", "images": [], "label": "Chapter X"}, {"pdf_page_index": 47, "pdf_page_number": 48, "html": "<p>on the superior globes during the present Fourth Round, while the Human Host of Monads is carrying on its evolution on Globe D (in other words, functioning consciously while cycling on the Ascending Arc during the after-death states), such a one will have achieved the status of a Fifth-Rounder.<\/p>\n<p>Then, carrying the theme to its logical conclusion, when a FifthRounder will learn how to perform the Outer Rounds consciously, he will be well on his way towards acting in the capacity of a Sixth-Rounder.<\/p>", "images": [], "label": "Page 47"}, {"pdf_page_index": 48, "pdf_page_number": 49, "html": "<p>may be divided into two phases. (1) Ue aspect OF INC OM the after-death states. For that matter, a third phase may be<\/p>\n<h3 class=\"pdf-heading\">(3) the sleeping state, even though it includes the first two<\/h3>\n<p>wes. For in this state the vital bodily functions continue their operaus even though the “curtain of sleep has enwrapped the slumberer its folds. Then, associated with sleep is the state of dreaming (Svapna), tate of consciousness differing from that of the waking state (Jagrat). weover, there is a third state of consciousness known as Sushupti, the 1c of deep sleep. It is not akin either to the waking or the dreaming es. It is analagous to the after-death state of existence in that the death| part of man can function and be conscious on the planes superior to<\/p>\n<h3 class=\"pdf-heading\">world, However <script>
const PAGES = JSON.parse(document.getElementById('pages-data').textContent);
const IMAGES = JSON.parse(document.getElementById('images-data').textContent);

let current = 0;

function imgSrc(file){
  return 'data:image/jpeg;base64,' + IMAGES[file];
}

function render(){
  const p = PAGES[current];
  document.getElementById('section-pill').textContent = 'Page ' + p.pdf_page_number;
  document.getElementById('eyebrow').textContent = 'Source: page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('page-title').textContent = p.label;
  document.getElementById('content').innerHTML = p.html;

  const figWrap = document.getElementById('figures');
  figWrap.innerHTML = '';
  p.images.forEach(im => {
    const card = document.createElement('div');
    card.className = 'figure-card';
    const img = document.createElement('img');
    img.src = imgSrc(im.file);
    img.alt = im.caption;
    img.addEventListener('click', () => openLightbox(img.src, im.caption));
    const cap = document.createElement('div');
    cap.className = 'figure-cap';
    cap.textContent = im.caption;
    card.appendChild(img);

// ---------- Read aloud (prefers Indian English voices) ----------
(function(){
  const listenBtn = document.getElementById('listen-toggle');
  const bar = document.getElementById('listen-bar');
  const voiceSel = document.getElementById('voice-select');
  const rateSel = document.getElementById('rate-select');
  const playBtn = document.getElementById('listen-play');
  const stopBtn = document.getElementById('listen-stop');
  const autoChk = document.getElementById('listen-auto');
  const status = document.getElementById('listen-status');

  if (!('speechSynthesis' in window)) {
    listenBtn.style.display = 'none';
    return;
  }

  let voices = [];
  let listening = false;
  let paused = false;
  let gen = 0;

  function score(v){
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l.indexOf('en-in') === 0) return 3;
    if (l === 'en-gb') return 2;
    return 1;
  }

  function loadVoices(){
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
    voices = (en.length ? en : all).slice().sort((a, b) => score(b) - score(a));
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const isIndian = (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0;
      opt.textContent = v.name + ' (' + v.lang + ')' + (isIndian ? ' — Indian accent' : '');
      voiceSel.appendChild(opt);
    });
    const idx = voices.findIndex(v => (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0);
    voiceSel.value = idx >= 0 ? idx : 0;
    if (!listening) {
      status.textContent = idx >= 0
        ? 'Indian English voice ready.'
        : 'No Indian English voice found on this device — closest English voice selected.';
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function pageText(){
    const p = PAGES[current];
    const div = document.createElement('div');
    div.innerHTML = p.html;
    let t = (div.textContent || '').replace(/\s+/g, ' ').trim();
    (p.images || []).forEach(im => { t += ' Figure on this page: ' + im.caption + '.'; });
    return t;
  }

  function chunk(text){
    const parts = text.match(/[^.!?\u2026]+[.!?\u2026]+["')\]]*\s*/g) || [text];
    const out = [];
    let buf = '';
    parts.forEach(s => {
      if ((buf + s).length > 220) { if (buf) out.push(buf); buf = s; }
      else buf += s;
    });
    if (buf) out.push(buf);
    return out;
  }

  function speak(){
    const text = pageText();
    if (!text) { status.textContent = 'Nothing to read on this page.'; return; }
    const myGen = ++gen;
    speechSynthesis.cancel();
    const pieces = chunk(text);
    const v = voices[parseInt(voiceSel.value, 10)];
    pieces.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateSel.value);
      if (i === pieces.length - 1) {
        u.onend = () => {
          if (!listening || myGen !== gen) return;
          if (autoChk.checked && current < PAGES.length - 1) { current++; render(); }
          else setUi(false);
        };
      }
      speechSynthesis.speak(u);
    });
    status.textContent = 'Reading page ' + (current + 1) + ' of ' + PAGES.length + '…';
  }

  function setUi(on){
    listening = on;
    paused = false;
    playBtn.innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Read aloud';
    stopBtn.disabled = !on;
    if (!on) status.textContent = 'Stopped.';
  }

  window.__afterRender = function(){
    if (listening) speak();
  };

  // Chrome desktop occasionally stalls long speech queues — nudge it.
  setInterval(() => {
    if (listening && !paused && speechSynthesis.speaking) speechSynthesis.resume();
  }, 10000);

  listenBtn.addEventListener('click', () => bar.classList.toggle('open'));
  playBtn.addEventListener('click', () => {
    if (!listening) { setUi(true); speak(); return; }
    if (paused) { speechSynthesis.resume(); paused = false; playBtn.innerHTML = '&#10074;&#10074; Pause'; }
    else { speechSynthesis.pause(); paused = true; playBtn.innerHTML = '&#9654; Resume'; }
  });
  stopBtn.addEventListener('click', () => { gen++; speechSynthesis.cancel(); setUi(false); });
  voiceSel.addEventListener('change', () => { if (listening) speak(); });
  rateSel.addEventListener('change', () => { if (listening) speak(); });
})();

</script>

<script>
(function(){
  var NOTES = {};
  var CHMAP = [];
  try { NOTES = JSON.parse(document.getElementById('notes-data').textContent); } catch(e) {}
  try { CHMAP = JSON.parse(document.getElementById('chapter-map').textContent); } catch(e) {}
  var term = '', matchPages = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function pageText(p){ var d=document.createElement('div'); d.innerHTML=p.html; return d.textContent || ''; }

  // ---------- SEARCH ----------
  var bar = document.getElementById('search-bar');
  var input = document.getElementById('search-input');
  var info = document.getElementById('search-info');

  function clearMarks(){
    var c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(function(mk){
      var t = document.createTextNode(mk.textContent);
      mk.parentNode.replaceChild(t, mk);
    });
    c.normalize();
  }
  function highlight(){
    clearMarks();
    if (!term || term.length < 2) return;
    var c = document.getElementById('content');
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var t = term.toLowerCase();
    nodes.forEach(function(n){
      var txt = n.nodeValue, low = txt.toLowerCase(), idx = low.indexOf(t);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(txt.slice(pos, idx)));
        var mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = txt.slice(idx, idx + term.length);
        frag.appendChild(mk);
        pos = idx + term.length;
        idx = low.indexOf(t, pos);
      }
      frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function infoText(){
    if (!term || term.length < 2) { info.textContent = ''; return; }
    if (!matchPages.length) { info.textContent = 'No matches'; return; }
    var pos = matchPages.indexOf(current);
    info.textContent = matchPages.length + (matchPages.length > 1 ? ' pages' : ' page') +
      (pos >= 0 ? ' — match ' + (pos + 1) + ' of ' + matchPages.length : '');
  }
  function doSearch(){
    term = input.value.trim();
    matchPages = [];
    if (term.length >= 2){
      var t = term.toLowerCase();
      PAGES.forEach(function(p, i){ if (pageText(p).toLowerCase().indexOf(t) >= 0) matchPages.push(i); });
    }
    if (matchPages.length){ current = matchPages[0]; render(); }
    else { highlight(); infoText(); }
  }
  function step(d){
    if (!matchPages.length) return;
    var pos = matchPages.indexOf(current);
    if (pos < 0) pos = 0;
    pos = (pos + d + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }
  var searchT = null;
  input.addEventListener('input', function(){ clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ clearTimeout(searchT); doSearch(); } });
  document.getElementById('search-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('search-next').addEventListener('click', function(){ step(1); });
  document.getElementById('search-close').addEventListener('click', function(){
    bar.classList.remove('open'); term=''; matchPages=[]; highlight(); infoText();
  });
  document.getElementById('search-toggle').addEventListener('click', function(){
    var open = bar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) input.focus();
  });

  // ---------- NOTES ----------
  var panel = document.getElementById('notes-panel');
  var body = document.getElementById('notes-body');
  function showNotes(){
    var ch = null;
    for (var i = current; i >= 0; i--){
      if (CHMAP[i] && NOTES[CHMAP[i]]) { ch = CHMAP[i]; break; }
    }
    if (!ch){
      for (var j = current; j < CHMAP.length; j++){
        if (CHMAP[j] && NOTES[CHMAP[j]]) { ch = CHMAP[j]; break; }
      }
    }
    if (!ch){
      body.innerHTML = '<p class="notes-empty">No chapter notes available for this section.</p>';
      return;
    }
    var n = NOTES[ch];
    var h = '<h3>' + esc(ch) + '</h3><h4>Summary</h4><p>' + esc(n.s) + '</p>';
    if (n.p && n.p.length){
      h += '<h4>Key points</h4><ul>' + n.p.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body.innerHTML = h;
  }
  document.getElementById('notes-toggle').addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    bar.classList.remove('open');
    if (open) showNotes();
  });

  // hooks after every render
  var prevA = window.__afterRender;
  window.__afterRender = function(){
    if (prevA) prevA();
    highlight();
    infoText();
    if (panel.classList.contains('open')) showNotes();
  };
})();
</script>

(function(){

  var popup = null, term = '', lastUrl = '';

  function hideTip(){ tip.classList.remove('show'); }
  function hideBar(){ bar.classList.remove('show'); }

  function showTipForSelection(){
    var sel = window.getSelection();
    var txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    if (txt.length >= 2 && txt.length <= 160){
      term = txt;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      var top = r.top - 46;
      if (top < 8) top = r.bottom + 10;
      var left = r.left + r.width / 2;
      left = Math.max(90, Math.min(window.innerWidth - 90, left));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.classList.add('show');
    } else {
      hideTip();
    }
  }

  document.addEventListener('mouseup', function(e){
    if (tip.contains(e.target) || bar.contains(e.target)) return;
    setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('keyup', function(e){
    if (e.shiftKey) setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!tip.contains(e.target)) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);

  document.getElementById('sel-search-btn').addEventListener('click', function(){
    if (!term) return;
    lastUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(term);
    popup = window.open(lastUrl, 'ddg_search_popup', 'width=920,height=700,menubar=no,toolbar=no,location=no,status=no');
    hideTip();
    var msg = document.getElementById('sel-search-msg');
    if (popup){

    } else {
      msg.innerHTML = 'Popup blocked — <a href="' + lastUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">open the search in a new tab</a>.';
    }
    bar.classList.add('show');
  });

  document.getElementById('sel-search-close').addEventListener('click', function(){
    if (popup && !popup.closed) popup.close();
    popup = null;
    hideBar();
  });
})();
</script>

    body.appendChild(d); scrollBody();
    return d;
  }
  function esc(t){ var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  addMsg('bot', 'Namaste. Ask me anything \u2014 I can search <b>this book</b> page by page, answer with your configured LLM, or run an external DuckDuckGo search.');

  function pageText(p){
    var d = document.createElement('div'); d.innerHTML = p.html; return d.textContent || '';
  }

  function searchBook(q){
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    if (!terms.length) return [];
    var out = [];
    for (var i = 0; i < PAGES.length; i++){

      var score = 0;
      for (var k = 0; k < terms.length; k++){
        var hits = txt.split(terms[k]).length - 1;
        if (hits) score += hits;
      }
      if (score) out.push({ i: i, score: score });
    }
    out.sort(function(a,b){ return b.score - a.score; });
    return out.slice(0, 5);
  }

  function snippet(i, q){
    var txt = pageText(PAGES[i]).replace(/\s+/g,' ');
    var terms = q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){ return t.length > 2; });
    var pos = -1;
    for (var k = 0; k < terms.length; k++){ pos = txt.toLowerCase().indexOf(terms[k]); if (pos >= 0) break; }
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 60);
    return (start ? '\u2026' : '') + txt.slice(start, start + 170) + '\u2026';
  }

  function goToPage(i){
    try { current = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch(e){ console.warn('jump failed', e); }
  }

  function callLlm(q, context){
    return fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: 'You are the assistant inside a spiritual book reader. Answer concisely. When book excerpts are provided, ground the answer in them and cite the page labels. If the question needs current external facts, say so and suggest an external search.' },
          { role: 'user', content: context ? 'Book excerpts:\n' + context + '\n\nQuestion: ' + q : q }
        ],
        temperature: 0.4
      })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error('LLM error ' + res.status + ': ' + t.slice(0,180)); });
      return res.json();
    }).then(function(data){
      var c = data.choices && data.choices[0] && data.choices[0].message;
      return (c && c.content || '(empty response)').trim();
    });
  }

  function handleSend(){
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    addMsg('user', esc(q));
    busy = true; sendBtn.disabled = true;
    var thinking = document.createElement('div');
    thinking.className = 'sl-thinking'; thinking.textContent = 'Thinking\u2026';
    body.appendChild(thinking); scrollBody();

    var hits = searchBook(q);
    var finish = function(){ busy = false; sendBtn.disabled = false; thinking.remove(); };

    function renderRefs(){
      if (!hits.length) return '';
      var h = '';
      hits.forEach(function(hit, n){
        h += '<button class="sl-ref" data-page="' + hit.i + '" type="button"><b>' + esc(PAGES[hit.i].label) +
             ' \u00b7 page ' + (hit.i + 1) + '</b><span>' + esc(snippet(hit.i, q)) + '</span>' +
             '<span class="go">Go to page \u2192</span></button>';
      });
      return h;
    }

    var done = function(html){ finish(); var m = addMsg('bot', html);
      m.querySelectorAll('.sl-ref').forEach(function(b){
        b.addEventListener('click', function(){ goToPage(parseInt(b.getAttribute('data-page'), 10)); });
      });
    };

    if (cfg.key){
      var ctx = hits.slice(0,3).map(function(hit){
        return '[' + PAGES[hit.i].label + ', page ' + (hit.i + 1) + '] ' + pageText(PAGES[hit.i]).replace(/\s+/g,' ').slice(0, 900);
      }).join('\n');
      callLlm(q, ctx).then(function(ans){ done(esc(ans) + renderRefs()); })
      .catch(function(err){ done(esc(String(err.message || err)) + renderRefs()); });
    } else if (hits.length){
      done('I found ' + hits.length + ' relevant page' + (hits.length > 1 ? 's' : '') + ' in this book. Tap one to jump there, or add an LLM API key in \u2699 Settings for a synthesized answer.' + renderRefs());
    } else {
      var url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      done('Nothing in this book matched. <a href="' + url + '" target="_blank" rel="noopener">Search the web for \u201c' + esc(q) + '\u201d on DuckDuckGo \u2197</a> \u2014 or add an LLM key in \u2699 Settings and I can answer directly.');
    }
  }

  fab.addEventListener('click', function(){ panel.classList.toggle('show'); });
  panel.querySelector('#sl-chat-x').addEventListener('click', function(){ panel.classList.remove('show'); });
  panel.querySelector('#sl-chat-clear').addEventListener('click', function(){ body.innerHTML = ''; addMsg('bot', 'Chat cleared. Ask me anything.'); });
  panel.querySelector('#sl-chat-gear').addEventListener('click', function(){
    var st = panel.querySelector('#sl-chat-settings');
    st.classList.toggle('show');
    panel.querySelector('#sl-cfg-endpoint').value = cfg.endpoint || '';
    panel.querySelector('#sl-cfg-key').value = cfg.key || '';
    panel.querySelector('#sl-cfg-model').value = cfg.model || '';
  });
  panel.querySelector('#sl-cfg-save').addEventListener('click', function(){
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    panel.querySelector('#sl-cfg-status').textContent = 'Saved.';
  });
  panel.querySelector('#sl-cfg-test').addEventListener('click', function(){
    var status = panel.querySelector('#sl-cfg-status');
    status.textContent = 'Testing\u2026';
    cfg = {
      endpoint: panel.querySelector('#sl-cfg-endpoint').value.trim(),
      key: panel.querySelector('#sl-cfg-key').value.trim(),
      model: panel.querySelector('#sl-cfg-model').value.trim()
    };
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.key || '') },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'Say OK' }], max_tokens: 5 })
    }).then(function(res){ status.textContent = res.ok ? 'Connected.' : 'Failed: HTTP ' + res.status; })
    .catch(function(err){ status.textContent = 'Failed: ' + err.message; });
  });
  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });
})();
</script>
<style id="sl-sel-css">
#sl-sel-tip{position:fixed;z-index:99999;display:none;align-items:center;gap:2px;padding:5px;background:#2E2A24;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);font:13px/1.2 system-ui,-apple-system,sans-serif}
#sl-sel-tip.show{display:flex}
#sl-sel-tip button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:#F7F1E3;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
#sl-sel-tip button:hover{background:#4A4234}
#sl-sel-tip .sl-sep{width:1px;height:18px;background:#55493A;margin:0 2px}
#sl-sel-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#2E2A24;color:#F7F1E3;padding:10px 18px;border-radius:999px;font:13px system-ui,-apple-system,sans-serif;z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:0 8px 22px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#sl-sel-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>
(function(){
  if (window.__slSelTools) return; window.__slSelTools = true;

  /* Compatibility shim: topic-based readers (e.g. Ponder on This) expose
     `topics` + `goTo(id)` instead of `PAGES` + `render()`. Build the PAGES
     interface so the embedded assistant's search and page jumps work there too. */
  try {
    if (typeof PAGES === 'undefined' && typeof topics !== 'undefined' && Array.isArray(topics)) {
      window.PAGES = topics.map(function(t){
        return {
          label: 'Topic ' + t.id + ' \u2014 ' + t.title,
          html: '<div>' + (t.matter || []).map(function(m){ return '<p>' + m.text + '</p>'; }).join('') + '</div>'
        };
      });
      window.render = function(){
        try { if (typeof goTo === 'function') goTo(topics[window.current || 0].id); } catch(e){}
      };
    }
  } catch(e){}

  var NOTES_KEY = 'sl_my_notes';

  var tip = document.createElement('div');
  tip.id = 'sl-sel-tip';
  tip.setAttribute('role', 'toolbar');
  tip.setAttribute('aria-label', 'Selection actions');
  tip.innerHTML =
    '<button type="button" data-act="ask">\u2728 Ask AI</button>' +
    '<span class="sl-sep"></span>' +
    '<button type="button" data-act="note">\uD83D\uDCDD Add to my note</button>';
  document.body.appendChild(tip);

  var toast = document.createElement('div');
  toast.id = 'sl-sel-toast';
  document.body.appendChild(toast);
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  var selText = '';

  function hideTip(){ tip.classList.remove('show'); }

  function insideUi(node){
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    while (el) {
      if (el.id === 'sl-chat-panel' || el.id === 'sl-sel-tip' ||
          el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return true;
      el = el.parentElement;
    }
    return false;
  }

  function showTip(){
    var sel = window.getSelection();
    var text = sel && !sel.isCollapsed ? sel.toString().replace(/\s+/g, ' ').trim() : '';
    if (text.length < 3 || insideUi(sel.anchorNode)) { hideTip(); return; }
    var rect;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch(e){ hideTip(); return; }
    if (!rect || (rect.width === 0 && rect.height === 0)) { hideTip(); return; }
    selText = text;
    tip.classList.add('show');
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = rect.left + rect.width / 2 - w / 2;
    var y = rect.top - h - 8;
    if (y < 6) y = Math.min(window.innerHeight - h - 6, rect.bottom + 8);
    x = Math.max(6, Math.min(window.innerWidth - w - 6, x));
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseup', function(){ setTimeout(showTip, 10); });
  document.addEventListener('touchend', function(){ setTimeout(showTip, 350); });
  document.addEventListener('mousedown', function(e){ if (!tip.contains(e.target)) hideTip(); });
  document.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideTip(); });

  /* Keep the text selection alive when the user taps a tooltip button */
  tip.addEventListener('mousedown', function(e){ e.preventDefault(); });
  tip.addEventListener('touchend', function(e){ e.preventDefault(); }, { passive: false });

  function askAi(text){
    var panel = document.getElementById('sl-chat-panel');
    var input = document.getElementById('sl-chat-input');
    var send = document.getElementById('sl-chat-send');
    if (!panel || !input || !send) return;
    panel.classList.add('show');
    var trimmed = text.length > 600 ? text.slice(0, 600) + '\u2026' : text;
    input.value = 'Explain this passage: \u201C' + trimmed + '\u201D';
    send.click();
    input.focus();
  }

  function currentLocation(){
    try {
      if (typeof PAGES !== 'undefined' && typeof current !== 'undefined' && PAGES[current]) {
        return PAGES[current].label || '';
      }
    } catch(e){}
    try {
      if (typeof topics !== 'undefined' && typeof currentId !== 'undefined') {
        var t = topics.find(function(x){ return x.id === currentId; });
        if (t) return 'Topic ' + t.id + ' \u2014 ' + t.title;
      }
    } catch(e){}
    return '';
  }

  function addNote(text){
    var notes = [];
    try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); } catch(e){}
    if (!Array.isArray(notes)) notes = [];
    notes.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      book: document.title,
      page: currentLocation(),
      text: text,
      url: location.pathname.split('/').pop(),
      ts: Date.now()
    });
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes.slice(0, 500))); } catch(e){}
    showToast('Saved to My Notes \u2014 view it on the library home page');
  }

  tip.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    var text = selText;
    hideTip();
    if (btn.getAttribute('data-act') === 'ask') askAi(text);
    else addNote(text);
  });
})();
</script>
