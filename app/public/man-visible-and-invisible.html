hildren for those somewhat older than themselves is a very powerful factor in their progress, since it is usually an unmixed benefit, free from all associations connected with the lower animal nature. Even though such affection may seem transitory, and may change its object more than once as years roll on, it is nevertheless very real while it lasts, and it serves a noble purpose in preparing the vehicle to respond more readily to the stronger vibrations which are yet in the future—just as the unset blossom of the fruit-tree, which seems to come to nothing, in reality has its function, since it not only looks exceedingly beautiful at the time, but also helps to draw up the sap for the fruit that is to come.<\/p>\n<p><em>The Irritable Man<\/em><\/p>", "images": [], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 114, "pdf_page_number": 115, "html": "<p>We turn now to the consideration of the manner in which certain special types of character exhibit themselves in the bodies of the man. The case of the irritable man is a good specimen of these. His astral body will usually show a broad band of scarlet as one of its prominent features, as we see in Plate XVI.<\/p>\n<p>But what especially differentiates him from other men is the presence in all parts of the astral body of little floating flecks of scarlet, somewhat like notes of exclamation. These are the result of little accessions of vexation at the small worries which are constantly occurring in ordinary life. Every time any little trifle goes wrong— when his coffee is cold, when he misses his train, or when the baby upsets the ink-bottle—the irascible man gives vent to an impatient or angry exclamation, and a tiny scarlet flash shows the uncontrolled feeling. In some cases these little messengers of undisciplined temper fly outward toward the person who is supposed to be responsible for whatever has gone wrong; but in many others they simply remain floating within him, suspended in the matter of the astral body, and presenting the appearance shown in our illustration. These spots gradually fade away, but their places are taken by others, for the irritable man is never at a loss for subjects of annoyance.<\/p>\n<p><em>The Miser<\/em><\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.018.jpg", "caption": "Illustration from the original edition"}], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 115, "pdf_page_number": 116, "html": "<p>Another striking, but happily less common, spectacle, is that which is imaged for us in Plate XVII. The background differs somewhat from the ordinary astral body, for there is a total absence of devotion, and far less than the normal proportion of affection. Avarice, selfishness, deceit and adaptability (or perhaps, rather, cunning) are all intensified, but, on the other hand, there is very little sensuality. The most remarkable characteristic, however, is to be seen in the curious series of parallel horizontal lines which bar the oval, and give the impression that the man within is confined in a cage. These bars are of a deep brown color, almost burnt sienna, level and clearly marked as to their upper edge, but shading off into a sort of cloud below.<\/p>\n<p>This is an illustration of a confirmed miser, and naturally so extreme a case is not very common; but a large number of people seem to have some of the elements of the miser in their nature, and show them by an intensification of the color of avarice and by one or two such bars in the upper part of the astral body, though few are so completely confined as is this specimen. It is obvious that this man has shut himself away from the world, and that vibrations from without cannot readily affect him. Probably in this way be escapes some of the ordinary temptations of life, but he also makes himself impervious to the love and sympathy of his friends, and to all the higher religious feelings.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.019.jpg", "caption": "Illustration from the original edition"}], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 116, "pdf_page_number": 117, "html": "<p>Above all, his prison-bars prevent the passage of vibrations outward as well as inward, and be himself can pour out neither affection nor devotion. He is wrapped absolutely in his own selfishness, and is doing no good to any human being, and while that is his condition he can make no progress. This vice of avarice seems to have the effect of completely arresting development for the time, and it is very difficult to shake off when once it has gained a firm hold upon the personality.<\/p>\n<p><em>Deep Depression<\/em><\/p>\n<p>The astral body shown in Plate XVIII is in many ways similar to the last. Here, however, we have dull grey lines instead of the brown, and the whole effect is indescribably gloomy and depressing to the observer. It does not seem that in this case any qualities are necessarily absent; we have simply the ordinary colors of the body as a background, but all are veiled by these heavy weeping lines. Our picture represents a person during, a period of extreme depression, when he is as utterly isolated as was the miser, and naturally there are very many intermediate stages between this and the health astral body. A man may have only a few bars of depression, and even they may be but transient; or in slighter and less persistent cases, the heavy cloud may hardly have time to arrange itself in lines at all.<\/p>", "images": [], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 117, "pdf_page_number": 118, "html": "<p>Yet there are only too many who yield themselves to these feelings, and allow the fog of despair to close round them until all the world looks black; not realizing that in doing so they are not only seriously delaying their own evolution and losing manifold opportunities, but are also causing unnecessary suffering and injury to all those near to them. No psychic condition is more infectious than this feeling of depression; its vibrations radiate in all directions and introduce their slackening, deadening effects into every astral body within reach, whether the ego to which that astral body belongs is in incarnation or not. The man who gives way to despondency is thus a nuisance and a danger alike to the living and the dead, for in these days of overstrain and nervous worry most people find it very difficult to resist the contagion of these funereal vibrations.<\/p>", "images": [], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 118, "pdf_page_number": 119, "html": "<p>The only man who is proof against such dire influences is he who understands something of the purpose of life, who regards it from the philosophical and commonsense standpoint. Fortunately good influences can be spread abroad just as readily as evil ones, and the man who is wise enough to be happy will become it centre of happiness for others, a veritable sun, shedding light and Joy on all around him, and to this extent acting as a fellow-worker together with God, who is the source of all. In this way we may all of us help to break up these gloomy bars of depression, and set the soul within them free in the glorious sunlight of the divine love.<\/p>\n<p><em>The Devotional Type<\/em><\/p>\n<p>It will be useful for us to close our list of special cases among astral bodies by examining two very distinct types, from the comparison of which a good deal may be learnt. The first of these is illustrated in Plate XIX, and we may call him the devotional man. His characteristics present themselves through the medium of his colors, and we see that he possesses the faint touch of violet which implies the possibility of his response to the presentment of a high ideal.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.020.jpg", "caption": "Illustration from the original edition"}, {"file": "charles-webster-leadbeater_man-visible-and-invisible.021.jpg", "caption": "Illustration from the original edition"}], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 119, "pdf_page_number": 120, "html": "<p>His most prominent feature is the unusual development of the blue, showing strong religious feeling; but unfortunately only a very small proportion of this is the pure light blue of unselfish devotion, the majority being of a dark and somewhat muddy hue, suggesting the admixture of a good deal of desire for personal gain.<\/p>\n<p>The very small proportion of yellow tells us that he has very little intelligence to direct his devotion into reasonable channels, or to save him from degenerating into senseless bigotry. He has a fair proportion of affection and adaptability, though not of very high order; but the amount of sensuality manifested is much above the average, and deceit and selfishness are also very prominent. It is a remarkable fact that extreme sensuality and the devotional temperament are so frequently seen in association; it would suggest that there must be some hidden connection between them—or it may be simply that both are characteristic of a man who lives chiefly in his feelings, and is governed by them instead of trying to control them by reason. Another point to which attention should be paid is the irregularity in the distribution of the colors and the vagueness of their outline; they all melt into one another, and there are no clear lines of demarcation anywhere. This also is very expressive of the vagueness of the devotional man’s conceptions.<\/p>", "images": [], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 120, "pdf_page_number": 121, "html": "<p>It will be understood that in this case, as in all the others of this chapter, we are dealing merely with variants of the ordinary person. Consequently this is the astral body of an ordinary and non-intellectual religious man—not in the least that of the developed religious man whose devotion is evoked by full comprehension and guided by reason.<\/p>\n<p><em>The Scientific Type<\/em><\/p>", "images": [], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 121, "pdf_page_number": 122, "html": "<p>The observer can hardly fail to be struck by the contrast between the body illustrated in Plate XX and that which we have just described. In Plate XIX we see that the principal features are devotion (of a sort) and sensuality, and a very small modicum of intellect is shown; in Plate XX we have no devotion at all, and far less than the average amount of sensuality, but the intellect is developed to a very abnormal degree. Affection and adaptability are both somewhat small in quantity and poor in quality, being apparently overshadowed by the intellectual development, as the man is not yet sufficiently advanced to possess all these qualities equally in their higher forms. There is a good deal of selfishness and avarice, and a certain capability of jealousy is also apparent. But the great feature of this man is the large proportion of golden yellow, showing a well-developed intelligence directed principally to the attainment of knowledge. A huge cone of bright orange rising in the midst of it indicates the presence of much pride and ambition in connection with that knowledge, but still the shade of the yellow precludes the idea that the intellect is debased to merely selfish ends.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.022.jpg", "caption": "Illustration from the original edition"}], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 122, "pdf_page_number": 123, "html": "<p>It should be noticed also that the scientific and orderly habit of mind has a distinct influence upon the arrangement of the astral colors; they tend to fall into regular bands, and the lines of demarcation between them are decidedly more definite than in the previous illustration.<\/p>\n<p>It is evident that the bodies pictured in Plate XIX and XX give us examples of two varieties of unequal development; and while each has its good points, each also has decided disadvantages. We shall now proceed to the consideration of the vehicles of the more developed man who possesses all these various qualities to a much greater extent, but has them well balanced, so that each supports and strengthens the Other, instead of dominating or stifling it.<\/p>", "images": [], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 123, "pdf_page_number": 124, "html": "<h3 class=\"pdf-heading\">18. The Developed Man<\/h3>\n<p>The term “developed” is a relative one, so it will be well to explain exactly what is here meant by it. The vehicles illustrated under this heading are such as might be possessed by any pure-minded person who had definitely and intelligently “set his affection on things above, and not on things of earth”. They are not those of one already far advanced upon the path which leads to adeptship, for in that case we should find a considerable difference in size as well as in arrangement. But they do distinctly imply that the man of whom they are expressions is a seeker after the higher truth, one who has risen above mere earthly aims, and is living for an ideal. Among such some may be found who are especially advanced in one direction, and some in another; this is an evenly-balanced man—simply a fair average of those who are at the level which I describe.<\/p>\n<p>We may first examine Plate XXI, which represents for us his causal body. By comparing this with Plates V and VIII we shall see what the man’s progress has been, and how it is expressed in his appearance. We observe that by this time many beautiful qualities have been developed within him, for the glorious iridescent film is now filled with the most lovely colors, typifying for us the higher forms of love, devotion and sympathy, aided by an intellect refined and spiritualized, and by aspirations reaching ever toward the divine. Let me quote from <em>The Devachanic Plane,<\/em> the sixth of our theosophical manuals:<\/p>", "images": [], "label": "18. The Developed Man"}, {"pdf_page_index": 124, "pdf_page_number": 125, "html": "<p>Composed of matter inconceivably fine, delicate and ethereal, intensely alive and pulsating with living fire, the causal body becomes as its evolution proceeds a radiant globe of flashing colors, its high vibrations sending ripples of changing hues over its surface—hues of which earth knows nothing—brilliant, soft and luminous beyond the power of language to describe. Take the colors of an Egyptian sunset and add to them the wonderful softness of an English sky at eventide—raise these as high above themselves in light and translucency and splendour as they are above the colors given by a child’s paint-box—and even then none who have not seen can image the beauty of these radiant orbs which flash into the field of clairvoyant vision as it is lifted to the level of this supernal world.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.023.jpg", "caption": "Illustration from the original edition"}], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 125, "pdf_page_number": 126, "html": "<p>“All these causal bodies are filled with living fire drawn from a higher plane, with which the globe appears to be connected by a quivering thread of intense light, vividly recalling to the mind the words of the stanzas of Dzyan, The spark hangs from the flame by the finest thread of Fohat’; and as the soul grows and is able to receive more and more from the inexhaustible ocean of the Divine Spirit which pours down through the thread as a channel, the latter expands and gives wider passage to the flood, till on the next sub-plane it might be imaged as a waterspout connecting earth and sky, and higher still as itself a great globe through which rushes the living spring, until the causal body seems to melt into the inpouring light. Once more the stanza says it for us: ‘The thread between the watcher and his shadow becomes more strong and radiant with every change. The morning sunlight has changed into noonday glory. This is thy present wheel said the flame to the spark. Thou art myself, my image and my shadow. I have clothed myself in thee, and thou art my vahan to the day, “Be-with-us,” when thou shalt re-become myself and others, thyself and me.’”<\/p>", "images": [], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 126, "pdf_page_number": 127, "html": "<p>How hopeless it seems to try to represent all this glory on paper! Yet our artist has skilfully contrived to suggest that which no brush could paint, and however far even the cleverest physical image may be from that transcendent reality, it at least gives our imagination a starting-point from which we may try to build up a conception.<\/p>\n<p>We must not omit to notice one of the grandest characteristics of the developed man—his capacity to serve as a channel for higher force. It will be seen that from his causal body streams of this force pour out in various directions, for his attitude of unselfishness, of helpfulness and readiness to give, makes it possible for the divine strength to descend upon him in steady stream, and through him to reach many who are not yet strong enough to receive it directly.<\/p>", "images": [], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 127, "pdf_page_number": 128, "html": "<p>The crown of brilliant sparks which ascends from the tipper part of the body proclaims the activity of spiritual aspiration, and adds very greatly to the beauty and dignity of the man’s appearance. This rises constantly from the causal body, no matter how the lower man may be occupied on the physical plane: for when the soul of man is once awakened upon his own level, and is beginning to understand something of himself and his relation to the divine, he looks ever upwards towards the source from which he came, totally irrespective of any activities which he may at the same time be inspiring on lower planes. We must never forget how small and partial an expression of the Self even the noblest personality can be; so that as soon as the higher man begins to look round him, he finds almost unlimited possibilities opening before him, of which in this cramped physical life we can form no idea.<\/p>\n<p>This very upward rushing of spiritual aspiration, which makes so glorious a crown for our developed man, is itself the channel through which the divine power descends; so that the fuller and stronger his aspirations become, the larger is the measure of the grace from on high.<\/p>\n<p><em>His Mental Body<\/em><\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.024.jpg", "caption": "Illustration from the original edition"}], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 128, "pdf_page_number": 129, "html": "<p>It can hardly fail to strike the observer, as we come to deal with the more developed man, that his various vehicles are not only all of them greatly refined and improved, but they are also very much more like one another. Allowing for the difference between what we may call the octaves of the color—between the hues belonging to the lower and the higher levels of the mental plane—Plate XXII is almost a reproduction of Plate XXI; and the resemblance between Plates XXII and XXIII is perhaps even more marked, though in comparing them we have to remember that astral colors are again of a different octave from even the lower mental.<\/p>", "images": [], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 129, "pdf_page_number": 130, "html": "<p>Another useful comparison to make is that between Plates XXII, IX and VI, in order that we may see how the evolution from the primitive to the unselfish man shows itself in the mind-body. It will appear upon examination that pride, anger and selfishness have altogether disappeared, and that the remaining colors have not only so expanded as to fill the whole oval, but have also so improved in tone as to give quite a different impression. Every one of them is more refined and delicate, for all thought of self has vanished from them; and in addition has appeared the pure violet with the golden stars, which betokens the acquisition of new and greater qualities. The, power from above, which we saw radiating out through his causal body, acts also through the mental vehicle, though with somewhat less force. This is on the whole a very fine mental body, already well developed, and having within it every promise of rapid progress along the Path, when the time for that shall come.<\/p>\n<p><em>His Astral Body<\/em><\/p>", "images": [], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 130, "pdf_page_number": 131, "html": "<p>His astral body, which is pictured in Plate XXIII, Will at once be seen to resemble the mental vehicle very closely. It is, in fact, little more than a reflection of it in the grosser matter of the astral plane. This indicates that the man has his desires thoroughly under the control of the mind, and is no longer liable to be swept away from the firm base of reason by wild surges of emotion. He will no doubt still be subject to occasional irritability, and to undesirable cravings of various sorts. But he knows enough now to repress these manifestations, to maintain a struggle against them whenever they appear, instead of yielding to them. So though they may temporarily change his astral body, they will hardly make any permanent impression upon it as against the much stronger vibrations of his higher qualities.<\/p>\n<p>In exactly the same way, at a still later stage of progress, the mental body itself becomes a reflection of the causal, since the man learns to follow solely the promptings of the higher self, and to guide his reason exclusively by them.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.025.jpg", "caption": "Illustration from the original edition"}], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 131, "pdf_page_number": 132, "html": "<p>This illustration brings clearly before us an interesting fact connected with the yellow light, which signifies intellect. When this color is present in the oval, it invariably shows itself in the upper part of it, in the neighbourhood of the head; consequently it is the origin of the idea of the nimbus or glory round the head of a saint, since this yellow is much the most conspicuous of the colors of the astral body, and the one most easily perceived by anyone who is approaching the verge of clairvoyance. Also, even without astral sight it may occasionally be perceived; for when any person of some development is making a special effort of any kind, as, for example, in preaching or lecturing, the intellectual faculties are in unusual activity, and the yellow glow is therefore intensified.<\/p>", "images": [], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 132, "pdf_page_number": 133, "html": "<p>In some cases which I have seen, it has passed the bounds of physical visibility, and been seen by many who had no power of higher sight than that of this plane. In such a case, it is not that the astral vibration slackens until it sinks below the line which separates it from the physical, but that it becomes so much more vigorous than usual that it is able to arouse a sympathetic vibration even in the coarse and heavy matter of the physical plane. No doubt it was either from occasional glimpses of this phenomenon or from traditions derived from those who could see, that our mediaeval painters derived the idea of the glory round the head of the saint. It may be remembered that in the nimbus of the Christ a cross is usually drawn; and this also is strictly within the probabilities, from the point of view of occult investigation, for it has often been observed that in the auras of very highly developed persons various geometrical figures present themselves, signifying certain elevated and far-reaching thoughts. Some of these will be found among the illustrations given in <em>Thought-Forms.<\/em><\/p>", "images": [], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 133, "pdf_page_number": 134, "html": "<p>The student will find it useful to compare these illustrations carefully one with another; first, to examine each causal body in connection with the mental and astral bodies which are partial expressions of it, in order to understand the connection between these different vehicles; and second, to compare the three astral bodies in Plates VII, X, and XXIII, in order to understand how progress shows itself in the desire-body, which is naturally much the easiest of the various vehicles to see clairvoyantly, and in fact the only one which the ordinary psychically developed person is at all likely to see. The same comparison should be instituted between Plates VI, IX, and XXII, and also between Plates V, VIII, and XXI, to study the progress of the man as manifested in his higher bodies.<\/p>\n<p>Among our Theosophical literature we have many books which treat of the other side of all this evolution, and catalog the moral qualifications required at its various stages. This is a subject of the very deepest interest, though somewhat outside of the scope of this little work. Those who wish to study it should turn to <em>Invisible Helpers,<\/em><em> <\/em>Chapters XIX to XXI, and then read Annie Besant’s books <em>In the Outer Court<\/em> and <em>The Path of Discipleship.<\/em><\/p>", "images": [], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 134, "pdf_page_number": 135, "html": "<p>From those books some idea may be gained not only of the conditions of progress, but of its goal and of the glorious future that awaits us when we shall have fulfilled those conditions—when after many incarnations upon this grand old world of ours we shall at last have learnt the lessons which its physical life is meant to teach us. Then we shall have attained that “resurrection of the dead” after which St. Paul was so earnestly striving, for we shall be free alike from death and from birth, we shall have transcended the cycle of necessity, and shall be free for evermore—free to help our fellow-men along the path that we have trodden, until they also gain the light and the victory which is ours. For this attainment is for every man, and to reach it is only a question of time, however young a soul may be. There is for man no doubt about “salvation”, since there is nothing except his own error and ignorance from which any man needs to be saved; there is for him not even an “eternal hope”, but an eternal certainty. All shall attain, because that is God’s will for them, that is the sole object for which He called them into existence. Even already the world is progressing, and the powers are beginning to develop; and assuredly this morning sunrise shall increase into noonday glory. To the vistas of advancement that stretch before man, our keenest sight can see no end; we know only that they extend into splendours indescribable, illimitable and divine.<\/p>", "images": [], "label": "18. The Developed Man (cont.)"}, {"pdf_page_index": 135, "pdf_page_number": 136, "html": "<h3 class=\"pdf-heading\">19. The Health-Aura<\/h3>\n<p>Hitherto we have been dealing exclusively with those bodies of man which are connected with the higher planes, but our subject would not be completely treated if we omitted all reference to the minutely subdivided physical matter which is seen by clairvoyant sight to be part of the aura of man. Much of that matter is in the etheric state, and constitutes what is often called the etheric double. This is not in any sense a separate vehicle, but must be considered simply as part of the physical body. It is clearly visible to the clairvoyant as a mass of faintly luminous violet-grey mist, interpenetrating the denser part of the physical body, and extending very slightly beyond it, as will be seen in Plates XXIV and XXV. This etheric matter is the link between the astral and the physical, but it has also a very important function as the vehicle of the vital force on the physical plane.<\/p>", "images": [], "label": "19. The Health-Aura"}, {"pdf_page_index": 136, "pdf_page_number": 137, "html": "<p>This vital force is poured upon us from the sun, which is the source of life in this inner sense as well as by means of its light and heat in the outer world. The earth’s atmosphere is full of this force at all times, though it is in special activity in brilliant sunlight; and it is only by absorbing it that our physical bodies are able to live. The absorption of this vital energy is one of the functions of the etheric part of that organ which we call the spleen; and that organ possesses the curious property of specializing and transmuting the force as it passes through it, so that it presents a totally different appearance.<\/p>\n<p>The force itself is naturally invisible, like all other forces; but as it exists around us in the atmosphere it clothes itself in millions of tiny particles which are colorless though intensely active. After it has been absorbed into the human body through the spleen, however, these particles take on a beautiful pale rose color, and they flow in a constant stream over and through the whole body along the nerves, in the same manner as the blood-corpuscles flow along the arteries and veins, the brain being the centre of this nervous circulation. An attempt is made in our illustrations to represent the general appearance of this stream, but this must not of course be supposed to be an accurate map of the nervous system.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.026.jpg", "caption": "Illustration from the original edition"}], "label": "19. The Health-Aura (cont.)"}, {"pdf_page_index": 137, "pdf_page_number": 138, "html": "<p>It is evident that this flow is necessary to the proper working of the nerves, for when it is withdrawn there is no sensation. We know how a limb may be so numbed by cold as to be absolutely insensible to the touch; and the reason of such insensibility is that the vital force is no longer flowing through it. It might be supposed that it was rather due to the failure of the circulation of the blood, but those who have studied mesmerism are aware that one of the commonest experiments is to produce similar insensibility in a limb by magnetic passes. This does not at all interfere with the circulation of the blood, for the limb remains warm; but it does check the circulation of the subject’s life-fluid, and substitutes for it that of the magnetizer. The nerves of the subject are still there, and (so far as physical sight can see) in perfect working order; yet they do not perform their office of reporting to his brain, because the fluid which animates them is not connected with that brain, but with the brain of the operator.<\/p>", "images": [], "label": "19. The Health-Aura (cont.)"}, {"pdf_page_index": 138, "pdf_page_number": 139, "html": "<p>In a healthy man the spleen does its work in so generous a fashion that the specialized life-force is present in very large quantities, and is constantly radiating from the body in all directions. A man in perfect health, therefore, not only is able to impart some of it to another intentionally, but is also constantly though unconsciously shedding strength and vitality on those around him. On the other hand, a man who from weakness or other causes is unable to specialize for his own use a sufficient amount of the world’s life-force, sometimes, equally unconsciously, acts as a sponge and absorbs the already specialized vitality of any sensitive person who is unfortunate enough to come into contact with him, to his own temporary benefit, no doubt, but often to the injury of his victim. Probably most people have experienced this in minor degree, and have found that there is some one among their acquaintances after whose visits they always feel a quite unaccountable weariness and languor; and a similar lassitude is frequently felt by persons who attend spiritualistic seances without taking special precautions against the drain upon their vital force set up in the course of the manifestations.<\/p>", "images": [], "label": "19. The Health-Aura (cont.)"}, {"pdf_page_index": 139, "pdf_page_number": 140, "html": "<p>This radiation produces a striking effect upon the appearance of what we may call the purely physical part of the man’s aura. It is well known that tiny particles of dense physical matter are constantly being thrown off from man’s body, in insensible perspiration and in other ways; and these particles also are visible to clairvoyant sight as a faint grey mist. These particles are in many cases crystals, and therefore are seen in certain geometrical forms; for example, the tiny cubes of sodium chloride or common salt, are among the most frequent. This purely physical part of man’s surrounding is sometimes called the health-aura, from the fact that its condition is greatly affected by the health of the body from which it emanates. It is a faint bluish-white, almost colorless, and has the appearance of being striated; that is, it is full of, or perhaps it might rather be said to be composed of, an infinitude of straight lines radiating evenly in all directions from the pores of the body. That at least is the normal condition of these lines when the body is in perfect health; they are separate, orderly, and as nearly parallel as their radiation allows. But on the advent of disease there is an instant change, the lines in the neighborhood of the part affected becoming erratic, and lying about in all directions in the wildest confusion, or drooping like the stems of faded flowers.<\/p>", "images": [], "label": "19. The Health-Aura (cont.)"}, {"pdf_page_index": 140, "pdf_page_number": 141, "html": "<p>The reasons for this curious appearance is itself an interesting one. We find that the rigidity and parallelism of the lines of this health-aura are caused by the constant radiation of life-force from the healthy body; and as soon as this radiation ceases, the lines fall into the confused condition described above. As the patient recovers, the normal radiation of this magnetic form of vital energy is gradually resumed, and the lines of the health-aura are thereby combed into order once more. As long as the lines are firm and straight, and the force steadily radiates between them, the body seems to be almost entirely protected from the attack of evil physical influences, such as germs of disease, for example, such germs being repelled and carried away by the outrush of the life-force; but when from any cause through weakness, through wound or injury, through over-fatigue, through extreme depression of spirits, or through the excesses of an irregular life—an unusually large amount of vitality is required to repair damage or waste within the body, and there is consequently a serious diminution in the quantity radiated, this system of defence becomes dangerously weak, and it is comparatively easy for the deadly germs to effect an entrance.<\/p>", "images": [], "label": "19. The Health-Aura (cont.)"}, {"pdf_page_index": 141, "pdf_page_number": 142, "html": "<p>It may also be mentioned that it is possible by an effort of will to check this radiation of vitality at the outer extremity of its lines, and there to build it into a kind of wall or shell, which will be absolutely impervious to these germs—and, with a little further effort, impervious also to any kind of astral or elemental influence—so long as such effort of the will is maintained.<\/p>\n<p>Illustrations of this aura, showing its appearance in health and disease respectively will be found in Plates XXIV and XXV. It must be remembered that it is almost colorless, so that although it is physical matter, and so needs less-developed sight than the astral part of the aura, yet this latter is so much more conspicuous by reason of the brilliancy of its flashing colors and its constant movement, that it is very often seen at an earlier stage of the man’s progress than the other.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.027.jpg", "caption": "Illustration from the original edition"}], "label": "19. The Health-Aura (cont.)"}, {"pdf_page_index": 142, "pdf_page_number": 143, "html": "<h3 class=\"pdf-heading\">20. The Causal Body Of The Adept<\/h3>\n<p>Probably to those who cannot yet see any of the higher bodies of man, the illustrations given in this book will be to some extent suggestive and even illuminative, and it is in the hope that that may be so that it has been published. Yet those who can see, while recognizing to the full the painstaking care and skill of the artist, will all agree that even the lowest of these super-physical planes can never be adequately portrayed on paper or canvas. If this be true, as it assuredly is, how much more hopelessly impossible (if one may be pardoned the use of an improper but expressive phrase) must it be to try to represent the adept—the man who has attained the goal of humanity—who has become something more than man!<\/p>\n<p>In his case the size of the causal body has enormously increased, and shines with a sun-like splendour far beyond all imagination in its glorious loveliness. Of the beauty of form and color here no words can speak, for mortal language has no terms in which those radiant spheres may be described. Such a vehicle would be a separate study in itself, but one quite beyond the powers of any but those who are already far on the Path.<\/p>", "images": [], "label": "20. The Causal Body Of The Adept"}, {"pdf_page_index": 143, "pdf_page_number": 144, "html": "<p>This at least may be seen, that such a body is not only much larger than that of the ordinary man, but also has its colors differently arranged. These no longer move in whirling clouds, but are arranged in great concentric shells, yet penetrated everywhere by radiations of living light always pouring forth from him as a centre. The order of the colors differs according to the type to which the Adept belongs, so that there are several well-marked varieties amid their glory. Strangely enough, considering the recondite character of the subject, a tradition—a perfectly accurate tradition—of this fact has been preserved in many of the roughly-drawn pictures of the Lord Buddha which one sees upon temple walls in Ceylon. The Great Teacher is usually represented there surrounded by an aura; and the strange thing is that, though the coloring and general arrangement of those surroundings would be grotesquely inaccurate and even impossible if intended for that of an ordinary man, or even for that of an ordinary adept (if one may without irreverence use such an expression), yet it is a rough and material representation of the actual higher vehicle of the Adept of that particular type to which this Great One belongs. It is noteworthy also that the lines of the health-aura are drawn in some of these primitive pictures.<\/p>", "images": [], "label": "20. The Causal Body Of The Adept (cont.)"}, {"pdf_page_index": 144, "pdf_page_number": 145, "html": "<p>If it is impossible to attempt to illustrate the causal body of the Master; it may yet be worth while to give some idea of the relative size and appearance of that of one of his more advanced pupils—one who has attained that fourth stage of the path which in Oriental books is called that of the Arhat. (See <em>Invisible Helpers,<\/em> p. 172.) Such an endeavor has been made in Plate XXVI, but an effort of the imagination even greater than usual is necessary to complete the picture, by reason of the fact that the colors of this causal body have two characteristics which are irreconcilable here on the physical plane. They are distinctly more delicate and ethereal than any that have been previously described; yet at the same time they are far fuller, more brilliant, and more luminous. Until we can paint with fire instead of mere color, we shall find ourselves always on one horn or other of the dilemma; for if we attempt to represent the depth and richness of the color it must look dense and solid; if we try instead to give its marvellous transparency and luminosity, then the colors must be entirely lacking in the wonderful power and brilliance which is so prominent a characteristic of the glorious reality.<\/p>", "images": [], "label": "20. The Causal Body Of The Adept (cont.)"}, {"pdf_page_index": 145, "pdf_page_number": 146, "html": "<p>Since, however, an effort has been made in the case of the other causal bodies to give an idea of the transparent ovoid form, it seems better in this case to try to give the depth of color, its arrangement, and the relative size. This last can be brought into proportion only by the expedient of decreasing many times the size of the physical body in our picture; for if we retained the same scale as that previously employed, the causal body of the Arhat would need to be represented as some yards in length and breadth. Consequently we are compelled to reduce very much the drawing of the physical form, in order that the causal body, when drawn in proportion to it, may come within the size of even a double plate. But even at the best, such a drawing can only be regarded as a help to stimulate us in an effort to make a mental image—an image which may perchance be less hopelessly inadequate than the physical representation.<\/p>", "images": [], "label": "20. The Causal Body Of The Adept (cont.)"}, {"pdf_page_index": 146, "pdf_page_number": 147, "html": "<p>In examining this illustration we are at once struck by the magnificent development of the highest types of intellect, love and devotion, by the wealth of sympathy and of the highest spirituality which it displays. The outrush of the Divine influence which we saw in Plate XXI is enormously intensified here, for this man has become an almost perfect channel for the life and the power of the Logos. Not only in white light does the glory radiate from him, but all the colors of the rainbow play round him in ever-changing gleams like mother-of-pearl; so that there is something in that radiation to strengthen the highest qualities in every person who approaches him, no matter what those qualities may be. Thus none can come within the range of his influence without being the better for it: he shines upon all around him like the sun, for, like it, he has become a manifestation of the Logos.<\/p>\n<p>The mind-body and astral body connected with this have very little characteristic color of their own, but are reproductions of the causal body in so far as their lower octaves can express it. They have a lovely shimmering iridescence—a sort of opalescent, mother-of-pearl effect— which is far beyond either description or representation.<\/p>", "images": [], "label": "20. The Causal Body Of The Adept (cont.)"}, {"pdf_page_index": 147, "pdf_page_number": 148, "html": "<p>One thing at least we may perhaps hope that our study of these inner vehicles will do for us: it may help us to understand that it is this higher presentation of him which is the real man, and not that aggregation of physical matter crystallized in the midst of it, to which we in our blindness attach such undue importance. The very man himself—the divine trinity within—we may not see; but the more our sight and knowledge increase, the more nearly we approach that which veils itself in him; and if for the moment the highest vehicle of his which is perceptible to us is the causal body, then that is the nearest to a conception of the true man that our sight will at present give us. But if the same man be looked upon from the standpoint of the lower mental levels, naturally only so much of him can be seen as can be expressed in that mind-body which is the manifestation of the personality. Examining him on the astral plane, we find that an additional veil has descended, and only that lower part of him is visible which can find expression through the vehicle of desire. Here on the physical plane we are still worse off, since the true man is more effectually hidden from us than ever.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.028.jpg", "caption": "Illustration from the original edition"}], "label": "20. The Causal Body Of The Adept (cont.)"}, {"pdf_page_index": 148, "pdf_page_number": 149, "html": "<p>Perhaps the knowledge of this may lead us to form a somewhat higher opinion of our fellow-man, since we realize that he is always so much more than he seems to the physical eye. There is always the higher possibility in the background, and often an appeal to the better nature will arouse it from its latency, and bring it down into manifestation where all can see it. When we have studied the man as he is, it may be easier for us to pierce through the dense physical veil, and image the reality which is behind. Our faith in human nature may become greater when we realize how entirely it is part of the divine nature; and so we may be able to help our fellow-man the better, because we grasp the certainty that he and we are one.<\/p>", "images": [], "label": "20. The Causal Body Of The Adept (cont.)"}, {"pdf_page_index": 149, "pdf_page_number": 150, "html": "<p>If through us the divine light shines out more brightly, it is only in order that we may share that light with him; if we have gained a higher step upon the ladder, it is only that we may stretch out a helping hand to him. The more we understand this glorious scheme of evolution whose progress we have been studying in its outward manifestation, the more fully shall we see the true intention of the mighty self-sacrifice of the Logos; and so beautiful is this, so perfect beyond all thought of ours, that to see it once is to be devoted forever to its realization. To see it is to throw oneself into it, to strive for ever more to be one with it, even though in the very humblest capacity; for he who works with God is working for eternity and not for time, and in all the cons that lie before us his work can never fail.<\/p>\n<p>THE END<\/p>\n<p>↑ Back to top<\/p>", "images": [], "label": "20. The Causal Body Of The Adept (cont.)"}]</script>

<script id="notes-data" type="application/json">{"by C. W. LEADBEATER": {"s": "Author’s page — C. W. Leadbeater, theosophical clairvoyant and writer.", "p": ["Leadbeater was the leading clairvoyant investigator of the Adyar Society"]}, "1. How These Things Are Known": {"s": "Explains the basis of the book: direct clairvoyant observation of the subtler bodies, and the conditions under which such observation is reliable.", "p": ["The book rests on clairvoyant investigation", "Observations are checked and cross-verified", "The trained faculty, not fancy, is the instrument"]}, "2. The Planes Of Nature": {"s": "Maps the planes of nature — physical, astral, mental, and higher — as interpenetrating worlds of finer matter in which man simultaneously exists.", "p": ["The planes interpenetrate like worlds within worlds", "Each plane has its own order of matter", "Man has a body appropriate to every plane"]}, "3. Clairvoyant Sight": {"s": "Describes the clairvoyant faculty itself: what it sees, how it is developed, and its different grades.", "p": ["Clairvoyance is an extension of normal sight", "Its grades range from astral to buddhic vision", "Development requires purity and training"]}, "4. Man’s Vehicles": {"s": "Surveys man’s vehicles — physical, astral, mental, causal — the bodies through which the one self works on each plane.", "p": ["Each vehicle is built of the matter of its plane", "The self works through all of them at once", "The health of each body affects the others"]}, "5. The Trinity": {"s": "Presents the human trinity — spirit, intuition (buddhi), and intellect — the immortal triad that persists through incarnation.", "p": ["The immortal triad is atma-buddhi-manas", "It is the real man, the reincarnating ego", "The personality is its temporary mask"]}, "6. The Earlier Outpourings": {"s": "Describes the first and second life-outpourings from the logos, by which the matter of the planes is prepared and elemental essence is evolved.", "p": ["The first outpouring <script>
const PAGES = JSON.parse(document.getElementById('pages-data').textContent);
const IMAGES = JSON.parse(document.getElementById('images-data').textContent);

let current = 0;

function imgSrc(file){
  return 'data:image/jpeg;base64,' + IMAGES[file];
}

function render(){
  const p = PAGES[current];
  document.getElementById('section-pill').textContent = 'Page ' + p.pdf_page_number;
  document.getElementById('eyebrow').textContent = 'Source: page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('page-title').textContent = p.label;
  document.getElementById('content').innerHTML = p.html;

  const figWrap = document.getElementById('figures');
  figWrap.innerHTML = '';
  p.images.forEach(im => {
    const card = document.createElement('div');
    card.className = 'figure-card';
    const img = document.createElement('img');
    img.src = imgSrc(im.file);
    img.alt = im.caption;
    img.addEventListener('click', () => openLightbox(img.src, im.caption));
    const cap = document.createElement('div');
    cap.className = 'figure-cap';
    cap.textContent = im.caption;
    card.appendChild(img);
    card.appendChild(cap);
    figWrap.appendChild(card);
  });

  document.getElementById('folio-label').textContent = 'Page ' + p.pdf_page_number + ' / ' + PAGES.length;
  document.getElementById('progress-label').textContent = 'Page ' + p.pdf_page_number + ' of ' + PAGES.length;
  document.getElementById('progress-fill').style.width = (((current+1)/PAGES.length)*100).toFixed(1) + '%';

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === PAGES.length - 1;
  document.getElementById('next-btn').textContent = current === PAGES.length -1 ? 'End' : 'Next \u2192';

  document.getElementById('leaf').style.animation = 'none';
  void document.getElementById('leaf').offsetWidth;
  document.getElementById('leaf').style.animation = '';

  updateActiveTocItem();
  window.scrollTo({top:0, behavior:'smooth'});
  if (window.__afterRender) window.__afterRender();
}

function openLightbox(src, alt){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('prev-btn').addEventListener('click', () => {
  if (current > 0){ current--; render(); }
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (current < PAGES.length -1){ current++; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// ---------- TOC ----------
function buildToc(){
  const list = document.getElementById('toc-list');
  PAGES.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = 'toc-item';
    btn.dataset.idx = idx;
    btn.textContent = 'p.' + p.pdf_page_number + '  —  ' + p.label;
    btn.addEventListener('click', () => {
      current = idx;
      render();
      closeToc();
    });
    list.appendChild(btn);
  });
}
function updateActiveTocItem(){
  document.querySelectorAll('.toc-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === current);
  });
}
function openToc(){
  document.getElementById('toc-panel').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeToc(){
  document.getElementById('toc-panel').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('toc-toggle').addEventListener('click', openToc);
document.getElementById('toc-close').addEventListener('click', closeToc);
document.getElementById('scrim').addEventListener('click', closeToc);

buildToc();
render();

// ---------- Read aloud (prefers Indian English voices) ----------
(function(){
  const listenBtn = document.getElementById('listen-toggle');
  const bar = document.getElementById('listen-bar');
  const voiceSel = document.getElementById('voice-select');
  const rateSel = document.getElementById('rate-select');
  const playBtn = document.getElementById('listen-play');
  const stopBtn = document.getElementById('listen-stop');
  const autoChk = document.getElementById('listen-auto');
  const status = document.getElementById('listen-status');

  if (!('speechSynthesis' in window)) {
    listenBtn.style.display = 'none';
    return;
  }

  let voices = [];
  let listening = false;
  let paused = false;
  let gen = 0;

  function score(v){
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l.indexOf('en-in') === 0) return 3;
    if (l === 'en-gb') return 2;
    return 1;
  }

  function loadVoices(){
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
    voices = (en.length ? en : all).slice().sort((a, b) => score(b) - score(a));
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const isIndian = (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0;
      opt.textContent = v.name + ' (' + v.lang + ')' + (isIndian ? ' — Indian accent' : '');
      voiceSel.appendChild(opt);
    });
    const idx = voices.findIndex(v => (v.lang || '').toLowerCase().replace('_', '-').indexOf('en-in') === 0);
    voiceSel.value = idx >= 0 ? idx : 0;
    if (!listening) {
      status.textContent = idx >= 0
        ? 'Indian English voice ready.'
        : 'No Indian English voice found on this device — closest English voice selected.';
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function pageText(){
    const p = PAGES[current];
    const div = document.createElement('div');
    div.innerHTML = p.html;
    let t = (div.textContent || '').replace(/\s+/g, ' ').trim();
    (p.images || []).forEach(im => { t += ' Figure on this page: ' + im.caption + '.'; });
    return t;
  }

  function chunk(text){
    const parts = text.match(/[^.!?\u2026]+[.!?\u2026]+["')\]]*\s*/g) || [text];
    const out = [];
    let buf = '';
    parts.forEach(s => {
      if ((buf + s).length > 220) { if (buf) out.push(buf); buf = s; }
      else buf += s;
    });
    if (buf) out.push(buf);
    return out;
  }

  function speak(){
    const text = pageText();
    if (!text) { status.textContent = 'Nothing to read on this page.'; return; }
    const myGen = ++gen;
    speechSynthesis.cancel();
    const pieces = chunk(text);
    const v = voices[parseInt(voiceSel.value, 10)];
    pieces.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateSel.value);
      if (i === pieces.length - 1) {
        u.onend = () => {
          if (!listening || myGen !== gen) return;
          if (autoChk.checked && current < PAGES.length - 1) { current++; render(); }
          else setUi(false);
        };
      }
      speechSynthesis.speak(u);
    });
    status.textContent = 'Reading page ' + (current + 1) + ' of ' + PAGES.length + '…';
  }

  function setUi(on){
    listening = on;
    paused = false;
    playBtn.innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Read aloud';
    stopBtn.disabled = !on;
    if (!on) status.textContent = 'Stopped.';
  }

  window.__afterRender = function(){
    if (listening) speak();
  };

  setInterval(() => {
    if (listening && !paused && speechSynthesis.speaking) speechSynthesis.resume();
  }, 10000);

  listenBtn.addEventListener('click', () => bar.classList.toggle('open'));
  playBtn.addEventListener('click', () => {
    if (!listening) { setUi(true); speak(); return; }
    if (paused) { speechSynthesis.resume(); paused = false; playBtn.innerHTML = '&#10074;&#10074; Pause'; }
    else { speechSynthesis.pause(); paused = true; playBtn.innerHTML = '&#9654; Resume'; }
  });
  stopBtn.addEventListener('click', () => { gen++; speechSynthesis.cancel(); setUi(false); });
  voiceSel.addEventListener('change', () => { if (listening) speak(); });
  rateSel.addEventListener('change', () => { if (listening) speak(); });
})();

</script>

<script>
(function(){
  var NOTES = {};
  var CHMAP = [];
  try { NOTES = JSON.parse(document.getElementById('notes-data').textContent); } catch(e) {}
  try { CHMAP = JSON.parse(document.getElementById('chapter-map').textContent); } catch(e) {}
  var term = '', matchPages = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function pageText(p){ var d=document.createElement('div'); d.innerHTML=p.html; return d.textContent || ''; }

  // ---------- SEARCH ----------
  var bar = document.getElementById('search-bar');
  var input = document.getElementById('search-input');
  var info = document.getElementById('search-info');

  function clearMarks(){
    var c = document.getElementById('content');
    c.querySelectorAll('mark.search-hit').forEach(function(mk){
      var t = document.createTextNode(mk.textContent);
      mk.parentNode.replaceChild(t, mk);
    });
    c.normalize();
  }
  function highlight(){
    clearMarks();
    if (!term || term.length < 2) return;
    var c = document.getElementById('content');
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var t = term.toLowerCase();
    nodes.forEach(function(n){
      var txt = n.nodeValue, low = txt.toLowerCase(), idx = low.indexOf(t);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(txt.slice(pos, idx)));
        var mk = document.createElement('mark');
        mk.className = 'search-hit';
        mk.textContent = txt.slice(idx, idx + term.length);
        frag.appendChild(mk);
        pos = idx + term.length;
        idx = low.indexOf(t, pos);
      }
      frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function infoText(){
    if (!term || term.length < 2) { info.textContent = ''; return; }
    if (!matchPages.length) { info.textContent = 'No matches'; return; }
    var pos = matchPages.indexOf(current);
    info.textContent = matchPages.length + (matchPages.length > 1 ? ' pages' : ' page') +
      (pos >= 0 ? ' — match ' + (pos + 1) + ' of ' + matchPages.length : '');
  }
  function doSearch(){
    term = input.value.trim();
    matchPages = [];
    if (term.length >= 2){
      var t = term.toLowerCase();
      PAGES.forEach(function(p, i){ if (pageText(p).toLowerCase().indexOf(t) >= 0) matchPages.push(i); });
    }
    if (matchPages.length){ current = matchPages[0]; render(); }
    else { highlight(); infoText(); }
  }
  function step(d){
    if (!matchPages.length) return;
    var pos = matchPages.indexOf(current);
    if (pos < 0) pos = 0;
    pos = (pos + d + matchPages.length) % matchPages.length;
    current = matchPages[pos];
    render();
  }
  var searchT = null;
  input.addEventListener('input', function(){ clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ clearTimeout(searchT); doSearch(); } });
  document.getElementById('search-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('search-next').addEventListener('click', function(){ step(1); });
  document.getElementById('search-close').addEventListener('click', function(){
    bar.classList.remove('open'); term=''; matchPages=[]; highlight(); infoText();
  });
  document.getElementById('search-toggle').addEventListener('click', function(){
    var open = bar.classList.toggle('open');
    document.getElementById('notes-panel').classList.remove('open');
    if (open) input.focus();
  });

  // ---------- NOTES ----------
  var panel = document.getElementById('notes-panel');
  var body = document.getElementById('notes-body');
  function showNotes(){
    var ch = null;
    for (var i = current; i >= 0; i--){
      if (CHMAP[i] && NOTES[CHMAP[i]]) { ch = CHMAP[i]; break; }
    }
    if (!ch){
      for (var j = current; j < CHMAP.length; j++){
        if (CHMAP[j] && NOTES[CHMAP[j]]) { ch = CHMAP[j]; break; }
      }
    }
    if (!ch){
      body.innerHTML = '<p class="notes-empty">No chapter notes available for this section.</p>';
      return;
    }
    var n = NOTES[ch];
    var h = '<h3>' + esc(ch) + '</h3><h4>Summary</h4><p>' + esc(n.s) + '</p>';
    if (n.p && n.p.length){
      h += '<h4>Key points</h4><ul>' + n.p.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body.innerHTML = h;
  }
  document.getElementById('notes-toggle').addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    bar.classList.remove('open');
    if (open) showNotes();
  });

  // hooks after every render
  var prevA = window.__afterRender;
  window.__afterRender = function(){
    if (prevA) prevA();
    highlight();
    infoText();
    if (panel.classList.contains('open')) showNotes();
  };
})();
</script>

#sel-search-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99999;display:none;align-items:center;gap:10px;background:#2E2A24;color:#F7F1E3;border-radius:12px;padding:9px 14px;box-shadow:0 8px 24px rgba(0,0,0,.32);font:13px system-ui,-apple-system,sans-serif;max-width:92vw}

<script>
(function(){
  if (window.__selSearch) return; window.__selSearch = true;
  var tip = document.createElement('div');
  tip.id = 'sel-search-tip';
  tip.innerHTML = '<button id="sel-search-btn" type="button">&#128269; Search DuckDuckGo</button>';
  document.body.appendChild(tip);
  var bar = document.createElement('div');
  bar.id = 'sel-search-bar';
  bar.innerHTML = '<span id="sel-search-msg">Search opened in a popup window.</span>' +
    '<button id="sel-search-close" type="button">&#10005; Close search window</button>';
  document.body.appendChild(bar);
  var popup = null, term = '', lastUrl = '';

  function hideTip(){ tip.classList.remove('show'); }
  function hideBar(){ bar.classList.remove('show'); }

  function showTipForSelection(){
    var sel = window.getSelection();
    var txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    if (txt.length >= 2 && txt.length <= 160){
      term = txt;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      var top = r.top - 46;
      if (top < 8) top = r.bottom + 10;
      var left = r.left + r.width / 2;
      left = Math.max(90, Math.min(window.innerWidth - 90, left));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.classList.add('show');
    } else {
      hideTip();
    }
  }

  document.addEventListener('mouseup', function(e){
    if (tip.contains(e.target) || bar.contains(e.target)) return;
    setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('keyup', function(e){
    if (e.shiftKey) setTimeout(showTipForSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!tip.contains(e.target)) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);

  document.getElementById('sel-search-btn').addEventListener('click', function(){
    if (!term) return;
    lastUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(term);
    popup = window.open(lastUrl, 'ddg_search_popup', 'width=920,height=700,menubar=no,toolbar=no,location=no,status=no');
    hideTip();
    var msg = document.getElementById('sel-search-msg');
    if (popup){
      msg.textContent = 'Search opened in a popup window.';
    } else {
      msg.innerHTML = 'Popup blocked — <a href="' + lastUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">open the search in a new tab</a>.';
    }
    bar.classList.add('show');
  });

  document.getElementById('sel-search-close').addEventListener('click', function(){
    if (popup && !popup.closed) popup.close();
    popup = null;
    hideBar();
  });
})();
</script>
