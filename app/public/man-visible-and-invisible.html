<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Man Visible and Invisible</title>
<style>
/* ============ Design tokens ============
   Palette: parchment cream #F7F1E3, ink #2E2A24, gilt gold #B8963E,
            deep violet accent (devotion) #6B5691, rose accent (affection) #C1567B,
            soft border #E4D9BE
   Type: display "Cormorant Garamond" (Victorian book serif), body "EB Garamond",
         utility/caption "Cormorant" small caps
   Layout: single centered "book leaf" card, aurora/aura corner glow, page-turn transitions
   Signature: an animated soft-glowing aura halo behind the folio number, echoing the
   book's own theme of radiating thought-vibrations.
*/
:root{
  --parchment:#F7F1E3;
  --parchment-2:#EFE6CE;
  --ink:#2E2A24;
  --ink-soft:#5A5346;
  --gold:#B8963E;
  --gold-soft:#D8C186;
  --violet:#6B5691;
  --rose:#C1567B;
  --border:#E1D3AA;
  --card:#FFFDF6;
  --shadow: 0 20px 60px -20px rgba(60,45,10,0.35), 0 2px 10px rgba(60,45,10,0.08);
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #f3e8c9 0%, transparent 60%),
    radial-gradient(ellipse 900px 600px at 110% 110%, #ecdcc0 0%, transparent 55%),
    var(--parchment);
  color:var(--ink);
  font-family: "EB Garamond", "Cormorant Garamond", Georgia, serif;
  min-height:100vh;
  overflow-x:hidden;
}
@font-face{
  font-family:'Cinzel-fallback'; src:local('Georgia');
}
.app{
  max-width:980px;
  margin:0 auto;
  padding:28px 20px 60px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- Header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:12px;
}
.brand .glyph{
  width:40px;height:40px;border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #fff6df 0%, var(--gold-soft) 45%, var(--gold) 100%);
  box-shadow: 0 0 18px 2px rgba(184,150,62,0.45), inset 0 0 6px rgba(255,255,255,0.6);
  flex-shrink:0;
}
.brand h1{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-weight:600;
  font-size:1.35rem;
  letter-spacing:0.04em;
  margin:0;
  color:var(--ink);
}
.brand p{
  margin:0; font-size:0.8rem; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--ink-soft); font-family: Georgia, serif;
}
.progress-wrap{
  display:flex; align-items:center; gap:10px;
  font-size:0.82rem; color:var(--ink-soft); letter-spacing:0.04em;
}
.progress-bar{
  width:150px; height:5px; border-radius:3px; background:var(--parchment-2);
  overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,0.08);
}
.progress-fill{
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--gold-soft), var(--gold));
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ---------- Table of contents rail ---------- */
.toc-toggle{
  border:1px solid var(--border); background:var(--card); color:var(--ink);
  border-radius:8px; padding:7px 14px; font-family:inherit; font-size:0.85rem;
  letter-spacing:0.05em; cursor:pointer; box-shadow:var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.toc-toggle:hover{ transform: translateY(-1px); }
.toc-panel{
  position:fixed; top:0; right:-360px; width:340px; height:100%;
  background:var(--card); border-left:1px solid var(--border);
  box-shadow:-20px 0 50px rgba(60,45,10,0.18);
  z-index:50; transition:right .35s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; padding:24px 18px 40px;
}
.toc-panel.open{ right:0; }
.toc-panel h2{
  font-family:"Cormorant Garamond",serif; font-size:1.1rem; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--gold); margin:0 0 14px;
  border-bottom:1px solid var(--border); padding-bottom:10px;
}
.toc-close{
  position:absolute; top:16px; right:16px; background:none; border:none;
  font-size:1.3rem; color:var(--ink-soft); cursor:pointer; line-height:1;
}
.toc-section{
  margin-bottom:6px;
}
.toc-section-title{
  font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--violet); margin:16px 0 6px; font-weight:600;
}
.toc-item{
  display:block; width:100%; text-align:left; background:none; border:none;
  padding:6px 8px; font-family:"EB Garamond",serif; font-size:0.95rem;
  color:var(--ink); cursor:pointer; border-radius:6px;
  transition: background .15s ease;
}
.toc-item:hover{ background:var(--parchment-2); }
.toc-item.active{
  background: linear-gradient(90deg, rgba(184,150,62,0.16), transparent);
  color:var(--gold); font-weight:600;
}
.scrim{
  position:fixed; inset:0; background:rgba(40,30,10,0.25); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.scrim.show{ opacity:1; pointer-events:auto; }

/* ---------- The book leaf / page card ---------- */
.stage{
  flex:1;
  display:flex; align-items:flex-start; justify-content:center;
  position:relative;
}
.leaf{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  width:100%;
  padding:46px 54px 40px;
  position:relative;
  min-height:420px;
  animation: fadeIn .5s ease;
}
.leaf::before{
  content:"";
  position:absolute; inset:10px;
  border:1px solid rgba(184,150,62,0.28);
  border-radius:8px;
  pointer-events:none;
}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
@media (max-width:700px){
  .leaf{ padding:30px 20px 28px; }
}

.eyebrow{
  font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--violet); margin:0 0 6px; font-weight:600;
}
.leaf h2.page-title{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:2rem; font-weight:600; margin:0 0 22px; color:var(--ink);
  line-height:1.15; border-bottom:2px solid var(--gold-soft); padding-bottom:14px;
}
.leaf .content p{
  font-size:1.09rem; line-height:1.75; margin:0 0 1.1em; color:var(--ink);
  text-align:justify; hyphens:auto;
}
.leaf .content p.footnote{
  font-size:0.92rem; color:var(--ink-soft); font-style:italic;
  border-left:2px solid var(--gold-soft); padding-left:14px;
}
.leaf .content p.signature{
  text-align:right; font-style:italic; letter-spacing:0.05em; color:var(--ink-soft);
}
.leaf .content p.printer-line{
  text-align:center; font-size:0.85rem; color:var(--ink-soft); letter-spacing:0.06em;
}
.leaf .content h3.subhead{
  font-family:"Cormorant Garamond",serif; font-size:1.15rem; color:var(--violet);
  margin:22px 0 10px; letter-spacing:0.03em;
}
.leaf .content ol.principles{ padding-left:1.4em; }
.leaf .content ol.principles li{ margin-bottom:6px; font-size:1.05rem; }

/* Title page flourishes */
.book-title{
  font-family:"Cormorant Garamond",serif; text-align:center; font-size:2.6rem;
  letter-spacing:0.12em; margin:18px 0 6px; color:var(--ink);
}
.book-authors{
  text-align:center; font-size:1.05rem; letter-spacing:0.1em; font-weight:400;
  color:var(--violet); margin:0 0 26px;
}
.pub-line{ text-align:center; font-size:0.78rem; color:var(--ink-soft); letter-spacing:0.04em; }
.pub-house{ text-align:center; font-size:0.95rem; color:var(--ink-soft); margin:8px 0 26px; line-height:1.6; }
.print-table{ margin:0 auto 26px; font-size:0.9rem; color:var(--ink-soft); border-collapse:collapse; }
.print-table td{ padding:2px 10px; }
.printer-line{ text-align:center; font-size:0.85rem; color:var(--ink-soft); margin-top:20px; line-height:1.6; }

/* Colour key table */
.key-table{ overflow-x:auto; margin:18px 0; }
.key-table table{ border-collapse:collapse; width:100%; font-size:0.88rem; }
.key-table th, .key-table td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
.key-table th{ background:var(--parchment-2); color:var(--gold); width:28px; text-align:center; }
.caption-label{ text-align:center; letter-spacing:0.1em; text-transform:uppercase; font-size:0.85rem; color:var(--ink-soft); }

/* TOC / illustrations tables */
.toc-table, .toc-table.small{ width:100%; border-collapse:collapse; font-size:0.98rem; }
.toc-table td{ padding:5px 6px; border-bottom:1px dotted var(--border); }
.toc-table td:last-child{ text-align:right; color:var(--ink-soft); width:80px; }
.toc-table tr.indent td:first-child{ padding-left:22px; }
.toc-table tr.indent2 td:first-child{ padding-left:44px; font-style:italic; }
.toc-table.small td{ font-size:0.88rem; }
.illus-note{ margin-bottom:14px; }
.illus-note p{ font-size:0.85rem; color:var(--ink-soft); font-style:italic; }

/* ---------- Images / figure gallery ---------- */
.figures{
  display:flex; flex-wrap:wrap; gap:22px; margin:26px 0 10px; justify-content:center;
}
.figure-card{
  background:var(--parchment-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  max-width:360px;
  flex:1 1 260px;
  text-align:center;
  box-shadow: 0 8px 22px -12px rgba(60,45,10,0.25);
}
.figure-card img{
  max-width:100%; height:auto; border-radius:5px;
  border:1px solid rgba(0,0,0,0.08);
  background:#111;
  cursor:zoom-in;
  transition: transform .25s ease;
}
.figure-card img:hover{ transform:scale(1.015); }
.figure-cap{
  margin-top:9px; font-size:0.85rem; color:var(--ink-soft);
  font-style:italic; letter-spacing:0.02em;
}

/* Lightbox */
.lightbox{
  position:fixed; inset:0; background:rgba(20,15,5,0.82);
  display:none; align-items:center; justify-content:center; z-index:100;
  padding:30px;
}
.lightbox.open{ display:flex; }
.lightbox img{ max-width:100%; max-height:85vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.lightbox-close{
  position:absolute; top:22px; right:28px; background:none; border:none;
  color:#f6ecd2; font-size:2rem; cursor:pointer; line-height:1;
}

/* ---------- Footer nav ---------- */
nav.pager{
  position:sticky; bottom:0;
  margin-top:26px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:linear-gradient(180deg, rgba(247,241,227,0) 0%, var(--parchment) 30%);
  padding-top:18px;
}
.pager-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border); color:var(--ink);
  padding:11px 20px; border-radius:10px; font-family:inherit; font-size:0.95rem;
  cursor:pointer; box-shadow:var(--shadow); letter-spacing:0.02em;
  transition: transform .15s ease, opacity .15s ease;
}
.pager-btn:hover:not(:disabled){ transform:translateY(-2px); }
.pager-btn:disabled{ opacity:0.35; cursor:default; }
.pager-btn.next{ background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:#3a2c08; border:none; }
.folio{
  position:relative;
  font-family:"Cormorant Garamond",serif; font-size:0.95rem; color:var(--ink-soft);
  text-align:center; letter-spacing:0.05em;
}
.folio .halo{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:70px; height:70px; border-radius:50%;
  background: radial-gradient(circle, rgba(184,150,62,0.30) 0%, transparent 70%);
  animation: pulse 3.2s ease-in-out infinite;
  z-index:-1;
}
@keyframes pulse{
  0%,100%{ transform:translate(-50%,-50%) scale(0.9); opacity:0.5; }
  50%{ transform:translate(-50%,-50%) scale(1.25); opacity:0.9; }
}

@media (prefers-reduced-motion: reduce){
  .leaf{ animation:none; }
  .folio .halo{ animation:none; }
}

/* PDF-exact content classes */
.leaf .content h3.pdf-heading{
  font-family:"Cormorant Garamond",serif; font-size:1.2rem; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--violet); margin:20px 0 10px;
}
.leaf .content p.pdf-caption{
  font-size:0.92rem; letter-spacing:0.05em; text-transform:uppercase;
  color:var(--gold); text-align:center; font-weight:600; margin:16px 0 10px;
}
.leaf .content p.empty-note{
  text-align:center; color:var(--ink-soft); font-size:1rem; padding:30px 0;
}

/* section pill on top of card */
.section-pill{
  position:absolute; top:-13px; left:50px;
  background:linear-gradient(135deg, var(--violet), #8875ac);
  color:#fff; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:5px 14px; border-radius:20px; box-shadow:0 6px 14px -6px rgba(107,86,145,0.6);
}
@media (max-width:700px){
  .section-pill{ left:20px; }
}

/* ---------- Read aloud ---------- */
.listen-bar{
  display:none; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 18px; margin-bottom:16px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); font-family:Georgia, serif; font-size:0.85rem;
}
.listen-bar.open{ display:flex; }
.listen-bar button{
  font-family:inherit; font-size:0.85rem; padding:7px 14px; border-radius:999px;
  border:1px solid var(--gold); background:linear-gradient(180deg,#fffdf6,#f3ead2);
  color:var(--ink); cursor:pointer; letter-spacing:0.02em;
}
.listen-bar button:hover:not(:disabled){ background:var(--gold); color:#fff; }
.listen-bar button:disabled{ opacity:0.45; cursor:default; }
.listen-bar select{
  font-family:inherit; font-size:0.82rem; padding:6px 8px; border-radius:8px;
  border:1px solid var(--border); background:#fff; color:var(--ink);
  max-width:230px;
}
.listen-bar label{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); }
.listen-bar .status{ color:var(--ink-soft); font-style:italic; flex-basis:100%; }

.search-bar, .notes-panel { display:none; padding:10px 24px; background:#f8f3e7; border-bottom:1px solid #e3d8c3; align-items:center; gap:10px; flex-wrap:wrap; }
.search-bar.open, .notes-panel.open { display:flex; }
.search-bar input { flex:1; min-width:180px; padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; font-family:inherit; font-size:14px; color:#3a3227; }
.search-bar input:focus { outline:2px solid #b29a5b; }
.search-bar .sbtn { padding:7px 12px; border:1px solid #d8cbb0; border-radius:8px; background:#fffdf7; cursor:pointer; font-family:inherit; font-size:13px; color:#3a3227; }
.search-bar .sbtn:hover { background:#f0e7d3; }
#search-info { font-size:13px; color:#7a6c50; white-space:nowrap; }
mark.search-hit { background:#ffe9a8; color:inherit; padding:0 1px; border-radius:2px; }
.notes-panel { display:none; }
.notes-panel.open { display:block; }
#notes-body { max-width:820px; margin:0 auto; font-size:14.5px; line-height:1.65; color:#3a3227; }
#notes-body h3 { font-size:15px; margin:0 0 8px; color:#5c4a1e; letter-spacing:0.02em; }
#notes-body h4 { font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:#8a744a; margin:14px 0 6px; }
#notes-body p { margin:0 0 10px; }
#notes-body ul { margin:0; padding-left:20px; }
#notes-body li { margin-bottom:5px; }
#notes-body .notes-empty { color:#8a7c62; font-style:italic; }
</style>
</head>

<script id="pages-data" type="application/json">[{"pdf_page_index": 0, "pdf_page_number": 1, "html": "<h3 class=\"pdf-heading\">MAN VISIBLE AND INVISIBLE<\/h3>\n<h3 class=\"pdf-heading\">by C. W. LEADBEATER<\/h3>\n<p class=\"empty-note\"><em>First published 1902. Complete text presented as a reading edition in this library format.<\/em><\/p>", "images": [], "label": "Title"}, {"pdf_page_index": 1, "pdf_page_number": 2, "html": "<h3 class=\"pdf-heading\">1. How These Things Are Known<\/h3>\n<p>Man is a curiously complex being, and his evolution, past, present and future, is a study of perennial interest for all who can see and understand. Through what toilsome eternities of gradual development he has come to be what he is, to what round in the long ladder of his progress he has now attained, what possibilities of further progress the veil of the future conceals from us, these are questions to which few can be indifferent—questions which have been occurring all through the ages to everyone who has thought at all.<\/p>\n<p>In the Western world the answers given have been many and various. There has been much dogmatic assertion, based on differing interpretations of alleged revelation; there have been many ingenious speculations, the fruit in some cases of close metaphysical reasoning. But dogmatism meets us with a story which is on the face of it manifestly impossible, while speculation moves chiefly along entirely materialistic lines, and endeavors to arrive at a satisfactory result by ignoring half of the phenomena for which we have to account. Neither dogmatism nor speculation approaches the problem from a practical point of view, as a matter which can be studied and investigated like any other science.<\/p>", "images": [], "label": "1. How These Things Are Known"}, {"pdf_page_index": 2, "pdf_page_number": 3, "html": "<p>Theosophy comes forward with a theory based upon entirely different foundations. While in no way depreciating the knowledge to be gained either by study of the ancient scriptures or by philosophical reasoning, it nevertheless regards the constitution and the evolution of man as matters, not of speculation, but of simple investigation. When so examined, they prove to be parts of a magnificent scheme, coherent and readily comprehensible—a scheme which, while it agrees with and explains much of the old religious teaching, is yet in no way dependent on it, since it can be verified at every step by the use of the inner faculties which, though as yet latent in the majority of mankind, have already been brought into working order by a number among our students.<\/p>", "images": [], "label": "1. How These Things Are Known (cont.)"}, {"pdf_page_index": 3, "pdf_page_number": 4, "html": "<p>For the past history of man, this theory depends not only upon the concurrent testimony of the tradition of the earlier religions, but upon the examination of a definite record—a record which can be seen and consulted by anyone who possesses the degree of clairvoyance requisite to appreciate the vibrations of the finely subdivided matter upon which it is impressed. For its knowledge as to the future which awaits humanity, it depends, first, upon logical deduction from the character of the progress already made; second, on direct information supplied by men who have already reached those conditions which for most of us still constitute a more or less remote future; and third, on the comparison which anyone who has the privilege of seeing them may make between highly evolved men at various levels. We can imagine that a child who did not otherwise know the course of nature might reason that he would presently grow up and become a man, merely from the fact that he had already grown to a certain extent and in a certain way, and that he saw around him other children and young people at every stage of growth between his own and the adult level.<\/p>", "images": [], "label": "1. How These Things Are Known (cont.)"}, {"pdf_page_index": 4, "pdf_page_number": 5, "html": "<p>The study of the condition of man at the present time, of the immediate methods for his evolution, and of the effect upon that evolution of his thoughts, his emotions, his actions—all this is regarded by theosophical students as a matter of the application of well-known laws as a broad, general principle, and then of careful observation, of painstaking comparison of many cases in order to comprehend the detailed working of these laws. It is, in fact, simply a question of sight, and this book is published in the hope, first, that it may help earnest students who do not yet possess this sight to realize how the soul and its vehicles appear when examined by its means; and second, that the persons who are now beginning to exercise this vision more or less perfectly, may by it be helped to understand the <em>meaning<\/em> of what they see.<\/p>", "images": [], "label": "1. How These Things Are Known (cont.)"}, {"pdf_page_index": 5, "pdf_page_number": 6, "html": "<p>I am perfectly aware that the world at large is not yet convinced of the existence of this power of clairvoyant sight; but I also know that all who have really studied the question have found the evidence for it irresistible. If any intelligent person will read the authenticated stories quoted in my book <em>Clairvoyance,<\/em> and will then turn from them to the books from which they were selected, he will see at once that there is an overwhelming mass of evidence in favor of the existence of this faculty. To those who themselves can see, and are daily in the habit of exercising this higher vision in a hundred different ways, the denial of the majority that such sight is possible naturally seems ridiculous. For the clairvoyant the question is not worth arguing. If a blind man came up to us and assured us that there was no such thing as ordinary physical sight, and that we were deluded in supposing that we possessed this faculty, we in our turn should probably not feel it worth while to argue at great length in defense of our supposed delusion. We should simply say: “I certainly do see, and it is useless to try to persuade me that I do not; all the daily experiences of my life show me that I do; I decline to be argued out of my definite knowledge of positive facts.” Now this is precisely how the trained clairvoyant feels when ignorant people serenely pronounce that it is quite impossible that he should possess a power which he is at that very moment using to read the thoughts of those who deny it to him!<\/p>", "images": [], "label": "1. How These Things Are Known (cont.)"}, {"pdf_page_index": 6, "pdf_page_number": 7, "html": "<p>I am not attempting, therefore, in this book to prove that clairvoyance is a reality; I take that for granted, and proceed to describe what is seen by its means. Neither will I here repeat the details given in the little book which I have mentioned as to the methods of clairvoyance, but will confine myself to such brief statement of the broad principles of the subject as is absolutely necessary in order that this book shall be comprehensible to one who has not studied other theosophical literature.<\/p>", "images": [], "label": "1. How These Things Are Known (cont.)"}, {"pdf_page_index": 7, "pdf_page_number": 8, "html": "<h3 class=\"pdf-heading\">2. The Planes Of Nature<\/h3>\n<p>The first point which must be clearly comprehended is the wonderful complexity of the world around us—the fact that it includes enormously more than comes within the range of ordinary vision.<\/p>\n<p>We are all aware that matter exists in different conditions, and that it may be made to change its conditions by variation of pressure and temperature. We have the three well-known states of matter, the solid, the liquid, and the gaseous, and it is the theory of science that all substances can, under proper variation of temperature and pressure, exist in all these conditions.<\/p>\n<p>Occult chemistry shows us another and higher condition than the gaseous, into which also all substances known to us can be translated or transmuted; and to that condition we have given the name of etheric. We may have, for example, hydrogen in an etheric condition instead of as a gas; we may have gold or silver or any other element either as a solid, a liquid, or a gas, or in this other higher state which we call etheric.<\/p>", "images": [], "label": "2. The Planes Of Nature"}, {"pdf_page_index": 8, "pdf_page_number": 9, "html": "<p>In ordinary science we speak of an atom of oxygen, an atom of hydrogen, an atom of any of the substances which chemists call elements, the theory being that that is an element which cannot be further reduced, and that each of these elements has its atom—and an atom, as we may see from the Greek derivation of the word, means that which cannot be cut, or further subdivided. Occult science has always taught that all these so-called elements are not in the true sense of the word elements at all; that what we call an atom of oxygen or hydrogen can under certain circumstances be broken up. By repeating this breaking-up process it is found that there is one substance at the back of all substances, and different combinations of its ultimate units give us what in chemistry are called atoms of oxygen or hydrogen, gold or silver, lithium or platinum, etc. When these are all broken up we get back to a set of units which are all identical, except that some of them are positive and some negative.<\/p>", "images": [], "label": "2. The Planes Of Nature (cont.)"}, {"pdf_page_index": 9, "pdf_page_number": 10, "html": "<p>The study of these units and of the possibilities of their combination is in itself one of most enthralling interest. Even these, however, are found to be units only from the point of view of our physical plane; that is to say, there are methods by which even they can be subdivided, but when they are so broken up they give us matter belonging to a different realm of nature. Yet this higher matter also is not simple but complex; and we find that it also exists in a series of states of its own, corresponding very fairly to the states of physical matter which we call solid, liquid, gaseous, or etheric. Again, by carrying on our process of subdivision far enough we reach another unit—the unit of that realm of nature to which occultists have given the name of the astral world.<\/p>", "images": [], "label": "2. The Planes Of Nature (cont.)"}, {"pdf_page_index": 10, "pdf_page_number": 11, "html": "<p>Then the whole process may be repeated; for by further subdivision of that astral unit we find ourselves dealing with another still higher and more refined world, though a world which is still material. Once again we find matter existing in definitely marked conditions corresponding at that much higher level to the states with which we are familiar; and the result of our investigations brings us once again to a unit—the unit of this third great realm of nature, which in Theosophy we call the mental world. So far as we know, there is no limit to this possibility of subdivision, but there is a very distinct limit to our capability of observing it. However, we can see enough to be certain of the existence of a considerable number of these different realms, each of which is in one sense a world in itself, though in another and wider sense all are parts of one stupendous whole.<\/p>", "images": [], "label": "2. The Planes Of Nature (cont.)"}, {"pdf_page_index": 11, "pdf_page_number": 12, "html": "<p>In our literature these different realms of nature are frequently spoken of as planes, because in our study it is sometimes convenient to image them as one above another, according to the different degrees of density of the matter of which they are composed. It will be seen that in the accompanying diagram (Plate II) they are drawn in this way; but it must be very carefully borne in mind that this arrangement is merely adopted for convenience and as a symbol, and that it in no way represents the actual relations of these various planes. They must not be imagined as lying above one another like the shelves of a book-case, but rather as filling the same space and interpenetrating one another. It is a fact well known to science that even in the hardest substances no two atoms ever touch one another; always each atom has its field of action and vibration, and every molecule in turn has its larger field; so that there is always space between them under any possible circumstances. Every physical atom is floating in an astral sea—a sea of astral matter which surrounds it and fills every interstice in this physical matter. The mental matter in its turn interpenetrates the astral in precisely the same manner; so that all these different realms of nature are not in any way separated in space, but are all existing around us and about us here and now, so that to see them and to investigate them it is not necessary for us to make any movement in space, but only to open within ourselves the senses by means of which they can be perceived.<\/p>", "images": [], "label": "2. The Planes Of Nature (cont.)"}, {"pdf_page_index": 12, "pdf_page_number": 13, "html": "<h3 class=\"pdf-heading\">3. Clairvoyant Sight<\/h3>\n<p>This brings before us another very important consideration. All these varieties of finer matter exist not only in the world without, but they exist in man also. He has not only the physical body which we see, but he has also within him what we may describe as bodies appropriate to these various planes of nature, and consisting in each case of their matter. In man’s physical body there is etheric matter as well as the solid matter which is visible to us (see Plates XXIV and XXV); and this etheric matter is readily visible to the clairvoyant. In the same way a more highly developed clairvoyant, who is capable of perceiving the more refined astral matter, sees the man represented at that level by a mass of that matter, which is in reality his body or vehicle as regards that plane; and exactly the same thing is true with regard to the mental plane in its turn. The soul of man has not one body, but many bodies, for when sufficiently evolved he is able to express himself on all these different levels of nature, and he is therefore provided with a suitable vehicle of the matter belonging to each, and it is through these various vehicles that he is able to receive impressions from the world to which they correspond.<\/p>", "images": [], "label": "3. Clairvoyant Sight"}, {"pdf_page_index": 13, "pdf_page_number": 14, "html": "<p>We must not think of the man as creating these vehicles for himself in the course of his future evolutions, for every man possesses them from the beginning, though he is by no means conscious of their existence. We are constantly using to a certain extent this higher matter within ourselves, even though it be unconsciously. Every time that we think, we set in motion the mental matter within us, and a thought is clearly visible to a clairvoyant as a vibration in that matter, set up first of all within the man, and then affecting matter of the same degree of density in the world around him. But before this thought can be effective on the physical plane it has to be transferred from that mental-matter into astral matter; and when it has excited similar vibrations in that, the astral matter in its turn affects the etheric matter, creating sympathetic vibrations in it; and that in turn acts upon the denser physical matter, the grey matter of the brain.<\/p>", "images": [], "label": "3. Clairvoyant Sight (cont.)"}, {"pdf_page_index": 14, "pdf_page_number": 15, "html": "<p>So every time we think, we go through a much longer process than we know; just as every time we feel anything we go through a process of which we are quite unconscious. We touch some substance and feel that it is too hot, and we snatch away our hand from it instantaneously, as we think. But science teaches us that this process is not instantaneous, and that it is not the hand which feels, but the brain; that the nerves communicate the idea of intense beat to the brain, which at once telegraphs back along the nerve-threads the instruction to withdraw the hand; and it is only as a result of all this that the withdrawal takes place, though it seems to us to be immediate. The process has a definite duration, which can be measured by sufficiently fine instruments; the rate of its motion is perfectly well-defined and known to physiologists. Just in the same way thought appears to be an instantaneous process; but it is not, for every thought has to go through the stages which I have described. Every impression which we receive in the brain through the senses has to pass up through these various grades of matter before it reaches the real man, the ego, the soul within.<\/p>", "images": [], "label": "3. Clairvoyant Sight (cont.)"}, {"pdf_page_index": 15, "pdf_page_number": 16, "html": "<p>We have here a kind of system of telegraphy between the physical plane and the soul; and it is important to realize that this telegraph-line has intermediate stations. It is not only from the physical plane that impressions can be received; the astral matter within a man, for example, is not only capable of receiving a vibration from etheric matter and transmitting it to the mental matter, but it is also quite capable of receiving impressions from the surrounding matter of its own plane, and transmitting those through the mental body to the real man within. So the man may use his astral body as a means for receiving impressions from and observing the astral world which surrounds him; and in exactly the same way through his mental body he may observe and obtain information from the mental world. But in order to do either of these things, he must first learn how they are done; that is to say, he must learn to focus his consciousness in his astral body or in his mental body, just as it is now focussed in the physical brain. I have already treated this subject fully in my book <em>Clairvoyance,<\/em><em> <\/em>so that I need do no more than refer to it here.<\/p>", "images": [], "label": "3. Clairvoyant Sight (cont.)"}, {"pdf_page_index": 16, "pdf_page_number": 17, "html": "<p>It should always be remembered that all this is a matter of direct knowledge and certainty to those who are in the habit of studying it, although it is presented to the consideration of the world merely as a hypothesis—but even the man who approaches the subject for the first time must surely see that in suggesting this we are not in any way claiming faith in a miracle, but simply inviting investigation of a system. The higher grades of matter follow on in orderly sequence from those which we already know, so that though to some extent each plane may be regarded as a world in itself, it is yet also true that the whole is in reality one great world, which can be fully seen only by the highly developed soul.<\/p>", "images": [], "label": "3. Clairvoyant Sight (cont.)"}, {"pdf_page_index": 17, "pdf_page_number": 18, "html": "<p>To aid us in our grasp of this, let us take an illustration which, although impossible in itself, may yet be useful to us as suggesting rather startling possibilities. Suppose that instead of the sight which we now possess, we had a visual apparatus arranged somewhat differently. In the human eye we have both solid and liquid matter; suppose that both these orders of matter were capable of receiving separate impressions, but each only from that type of matter in the outside world to which it corresponded. Suppose also that among men some possessed one of these types of sight and some another. Consider how very curiously imperfect would be the concept of the world obtained by each of these two types of men. Imagine them as standing on the seashore; one being able to see only solid matter, would be utterly unconscious of the ocean stretched before him, but would see instead the vast cavity of the ocean-bed, with all its various inequalities, and the fishes and other inhabitants of the deep would appear to him as floating in the air above this enormous valley. If there were clouds in the sky they would be entirely invisible to him, since they are composed of matter in the liquid state; for him the sun would be always shining in the daytime, and he would be unable to comprehend why, on what to us is a cloudy day, its heat should be so much diminished; if a glass of water were offered to him, it would appear to him to be empty.<\/p>", "images": [], "label": "3. Clairvoyant Sight (cont.)"}, {"pdf_page_index": 18, "pdf_page_number": 19, "html": "<p>Contrast with this the appearance which would be presented before the eyes of the man who saw only matter in the liquid condition. He would indeed be conscious of the ocean, but for him the shore and the cliffs would not exist; he would perceive the clouds very clearly, but would see almost nothing of the landscape over which they were moving. In the case of the glass of water he would be entirely unable to see the vessel, and would therefore be quite unable to understand why the water should so mysteriously preserve the special shape given to it by the invisible glass. Imagine these two persons standing side by side, each describing the landscape as he saw it, and each feeling perfectly certain that there could be no other kind of sight but his in the universe, and that anyone claiming to see anything more or anything different must necessarily be either a dreamer or a deceiver!<\/p>", "images": [], "label": "3. Clairvoyant Sight (cont.)"}, {"pdf_page_index": 19, "pdf_page_number": 20, "html": "<p>We can smile over the incredulity of these hypothetical observers; but it is exceedingly difficult for the average man to realize that in proportion to the whole that is to be seen, his power of vision is very much more imperfect than either of theirs would be in relation to the world as he sees it. And he also is strongly disposed to hint that those who see a little more than be does must really be drawing upon their imagination for their alleged facts. It is one of the commonest of our mistakes to consider that the limit of our power of perception is also the limit of all that there is to perceive. Yet the scientific evidence is indisputable, and the infinitesimal proportion (as compared to the whole) of the groups of vibrations by which alone we can see or hear is a fact about which there can be no doubt. The clairvoyant is simply a man who develops within himself the power to respond to another octave out of the stupendous gamut of possible vibrations, and so enables himself to see more of the world around him than those of more limited perception.<\/p>", "images": [], "label": "3. Clairvoyant Sight (cont.)"}, {"pdf_page_index": 20, "pdf_page_number": 21, "html": "<h3 class=\"pdf-heading\">4. Man’s Vehicles<\/h3>\n<p>If we turn to Plate II we shall see there a diagram of these planes of nature, and we shall also observe the names which have been employed to designate the vehicles or bodies of man which correspond to them. It will be noticed that the names used in theosophical literature for the higher planes are derived from Sanskrit, for in Western philosophy we have as yet I no terms for these worlds composed of finer states of matter. Each of these names has its especial meaning, though in the case of the higher planes it indicates only how little we know of those conditions.<\/p>", "images": [], "label": "4. Man’s Vehicles"}, {"pdf_page_index": 21, "pdf_page_number": 22, "html": "<p>Nirvana has for ages been the term employed in the East to convey the idea of the highest conceivable spiritual attainment. To reach Nirvana is to pass beyond humanity, to gain a level of peace and bliss far above earthly comprehension. So absolutely is all that is earthly left behind by the aspirant who attains its transcendent glory, that some European Orientalists fell at first into the mistake of supposing that it was an entire annihilation of the man— an idea than which nothing could be more utterly the opposite of the truth. To gain the full use of the exalted consciousness of this exceedingly elevated spiritual condition is to reach the goal appointed for human evolution during this aeon or dispensation—to become an adept, a man who is something more than man. For the vast majority of humanity such progress will be attained only after cycles of evolution, but the few determined souls who refuse to be daunted by difficulties, who as it were take the kingdom of heaven by violence, may find this glorious prize within their reach at a much earlier period.<\/p>", "images": [], "label": "4. Man’s Vehicles (cont.)"}, {"pdf_page_index": 22, "pdf_page_number": 23, "html": "<p>Of the states of consciousness above this we naturally know nothing, except that they exist. Para signifies “beyond”, and “Maha” means great so all the information conveyed by the names of these conditions is that the first is “the plane beyond Nirvana”, and the second is “the greater plane beyond Nirvana”—showing that those Who bestowed these appellations thousands of years ago either possessed no more direct information than we have, or else, possessing it, despaired of finding any words in which it could be expressed.<\/p>\n<p>The name of Buddhi has been given to that principle or component part of man which manifests itself through the matter of the fourth plane, while the mental plane is the sphere of action of what we call the mind in man. It will be observed that this plane is divided into two parts, which are distinguished by a difference in color and the names of “rupa” and “arupa”, meaning respectively “having form” and “formless”. These are names given in order to indicate a certain quality of the matter of the plane; in the lower part of it the matter is very readily moulded by the action of human thought into definite forms, while on the higher division this does not occur, but the more abstract thought of that level expresses itself to the eye of the clairvoyant in Rashes or streams. A fuller account of this will be found in the book <em>Thought-forms,<\/em> where are portrayed many of the interesting figures created by the action of thoughts and emotions.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.004.jpg", "caption": "Illustration from the original edition"}], "label": "4. Man’s Vehicles (cont.)"}, {"pdf_page_index": 23, "pdf_page_number": 24, "html": "<p>The name “astral” is not of our choosing; we have inherited it from the medieval alchemists. It signifies “starry”, and is supposed to have been applied to the matter of the plane next above the physical because of the luminous appearance which is associated with the more rapid rate of its vibration. The astral plane is the world of passion, of emotion and sensation; and it is through man’s vehicle on this plane that all his feelings exhibit themselves to the clairvoyant investigator. The astral body of man is therefore continually changing in appearance as his emotions change, as we shall presently show in detail.<\/p>\n<p>In our literature certain tints have usually been employed to represent each of the lower planes, following a table of colors given by Madame Blavatsky in her monumental work <em>The Secret Doctrine;<\/em> but it should be clearly understood that these are employed simply as distinctive marks—that they are merely symbolical, and are not in any way intended to imply a preponderance of a particular hue in the plane to which it is applied. All known colors, and many which are at present unknown to us, exist upon each of these higher planes of nature; but as we rise from one stage to another, we find them ever more delicate and more luminous, so that they might be described as higher octaves of color. An attempt is made to indicate this in our illustrations of the various vehicles appropriate to these planes, as will be seen later.<\/p>", "images": [], "label": "4. Man’s Vehicles (cont.)"}, {"pdf_page_index": 24, "pdf_page_number": 25, "html": "<p>It will be noticed that the number of planes is seven, and that each of them in turn is divided into seven subplanes. This number seven has always been considered as holy and occult, because it is found to underlie manifestation in various ways. In the lower planes which are within the reach of our investigation the sevenfold subdivision is very clearly marked; and all indications seem to warrant the assumption that in those higher realms which are as yet beyond our direct observation a similar arrangement obtains, allowing for the difference of conditions.<\/p>\n<p>As man learns to function in these higher types of matter, he finds that the limitations of the lower life are transcended, and fall away one by one. He finds himself in a world of many dimensions, instead of one of three only; and that fact alone opens up a whole series of entirely new possibilities in various directions. The study of these additional dimensions is one of the most fascinating that can be imagined. Short of really gaining the sight of the other planes, there is no method by which so clear a conception of astral life can be obtained as by the realization of the fourth dimension.<\/p>", "images": [], "label": "4. Man’s Vehicles (cont.)"}, {"pdf_page_index": 25, "pdf_page_number": 26, "html": "<p>It is not my object at the moment to describe all that is gained by the wonderful extension of consciousness which belongs to these higher planes—indeed, I have done that already to some extent in a previous book. For the present we need refer only to one line of investigation—that connected with the constitution of man, and how he came to be what he is.<\/p>\n<p>The history of his earlier evolution can be obtained by examination of those ineffaceable records of the past from which all that has happened since the solar, system came into existence may be recovered, and caused to pass before the mind’s eye; so that the observer sees everything as though he had been present when it occurred, with the enormous additional advantage of being able to bold any single scene as long as may be required for careful examination, or to pass a whole century of events in review in a few moments if desired. This wonderful reflection of the divine memory cannot be consulted with perfect certainty below the mental plane, so for the ready reading of this earlier history it is necessary that the student shall at least have learnt to use with freedom the senses of his mental body; and if be is so fortunate as to have under his control the faculties of the still higher causal body, his task will be easier still. The question of these records has been more fully dealt with in Chapter VII of my little book on Clairvoyance, to which the reader may be referred for further details.<\/p>", "images": [], "label": "4. Man’s Vehicles (cont.)"}, {"pdf_page_index": 26, "pdf_page_number": 27, "html": "<h3 class=\"pdf-heading\">5. The Trinity<\/h3>\n<p>We must now endeavor to understand how man comes into existence amidst this wonderful system of the planes of nature, and in order to do that we shall find ourselves compelled to take an excursion into the domain of theology.<\/p>\n<p>When we search these records in order to discover the origin of man, what do we see? We find that man is the resultant of an elaborate and beautiful evolutionary scheme, and that in him three streams of divine life may be said to converge. One of the sacred scriptures of the world speaks of God as having made man in His own image—a statement which, when it is properly understood, is seen to embody a great occult truth. Religions agree in describing the Deity as threefold in His manifestation, and it will be found that the soul of man is also threefold.<\/p>", "images": [], "label": "5. The Trinity"}, {"pdf_page_index": 27, "pdf_page_number": 28, "html": "<p>It will, of course, be understood that we are speaking now not of the Absolute, the Supreme, and the Infinite (for of Him naturally we can know nothing, except that He is), but of that glorious Manifestation of Him who is the great Guiding Force or Deity of our own solar system—who is called in our philosophy the Logos of the system. Of Him is true all that we have ever heard predicated of the Deity—all that is good, the love, the wisdom, the power, the patience and compassion, the omniscience, the omnipresence, the omnipotence—all of this, and much more, is true of the Solar Logos, in whom, in very truth, we live and move and have our being. Unmistakable evidence of His action and His purpose surrounds us on every side as we study the life of the higher planes.<\/p>\n<p>As He shows Himself to us in His work the Solar Logos is undoubtedly triple—three and yet one, as religion has long ago told us.<\/p>", "images": [], "label": "5. The Trinity (cont.)"}, {"pdf_page_index": 28, "pdf_page_number": 29, "html": "<p>It is obviously impossible to picture this divine manifestation in any way, for it is necessarily entirely beyond our power either of representation or comprehension, yet a small part of its action may perhaps to some extent be brought within our grasp by the employment of certain simple symbols, such as those adopted in Plate II. It will be seen that on the seventh or highest plane of our system the triple manifestation of our Logos is imaged by three circles, representing His three aspects. Each of these aspects appears to have its own quality and power. In the First Aspect He does not manifest Himself on any plane below the highest, but in the Second He descends to the sixth plane, and draws round Himself a garment of its matter, thus making a quite separate and lower expression of Him. In the Third Aspect He descends to the upper portion, of the fifth plane, and draws round Himself matter of that level, thus making a third manifestation. It will be observed that these three manifestations on their respective planes are entirely distinct one from the other, and yet we have only to follow up the dotted lines to see that these separate persons are nevertheless in truth but aspects of the one. Quite separate, when regarded as persons, each on his own plane—quite unconnected diagonally, as it were; yet each having his perpendicular connection with himself at the level where these three are one.<\/p>", "images": [], "label": "5. The Trinity (cont.)"}, {"pdf_page_index": 29, "pdf_page_number": 30, "html": "<p>Thus we see a very real meaning in the insistence of the Church “that we worship one God in Trinity, and Trinity in Unity, neither confounding the persons nor dividing the substance”—that is to say, never confusing in our minds the work and functions of the three separate manifestations, each on his own plane, yet never for a moment forgetting the Eternal Unity of the substance”, that which lies behind all alike on the highest plane.<\/p>\n<p>It is instructive to notice here exactly the true meaning of this word person. It is compounded of the two Latin words per and sona, and therefore signifies “that through which the sound comes”—the mask worn by the Roman actor to indicate the part which he happened at the moment to be playing. Thus we very appropriately speak of the group of temporary lower vehicles which a soul assumes when he descends into incarnation as his personality Thus also these separate manifestations of the One on different planes are rightly thought of as persons.<\/p>", "images": [], "label": "5. The Trinity (cont.)"}, {"pdf_page_index": 30, "pdf_page_number": 31, "html": "<p>Thus we see how it can be said:—” There is one person of the Father, another of the Son, and another of the Holy Ghost; but the Godhead of the Father, of the Son, and of the Holy Ghost is all one—the glory equal, the majesty co-eternal.” Truly the manifestations are distinct, each on its own plane, and consequently one appears lower than another; yet we have only to look back to the seventh plane to realize that “in this Trinity none is afore or after other, none is greater or less than another, but the whole three Persons are co-eternal together and co-equal”. So also “every Person by himself is God and Lord and yet they are not three Lords, but one Lord”.<\/p>\n<p>See also how clear and luminous become many of the statements concerning the Second Aspect and HIS descent into matter. There is another and far wider meaning for this, as will be seen in Plate III, but what is true of that grander descent is true also of this, for when we think of the Aspect on the higher plane as the essential Godhead ensouling the manifestation in matter relatively lower, though still high above our ken, we see how He is “God, of the substance of his Father, begotten before the world; but man, of the substance of his Mother, born in the world”. For as an aspect of the divine He existed before the solar system, but His manifestation in the matter of the sixth plane took place during the life of that system.<\/p>", "images": [], "label": "5. The Trinity (cont.)"}, {"pdf_page_index": 31, "pdf_page_number": 32, "html": "<p>So, “although he be God and Man, yet he is not two, but one Christ; one, not by conversion of the Godhead into flesh, but by taking of the manhood into God.” One, that is, not only because of the essential Unity, but because of the glorious power of drawing back into Himself all that has been acquired by the descent into lower matter. But this belongs more especially to that greater descent illustrated for us in Plate III.<\/p>\n<p>The greatest schism which has ever occurred in the Christian Church was that between the Eastern and Western branches, the Greek Church and the Roman. The doctrinal reason alleged for it was the supposed corruption of the truth, by the introduction into the Creed of the word filioque at the Council of Toledo in the year 589.<\/p>\n<p>The question at issue was whether the Holy Ghost proceeded from the Father alone, or from the Father and the Son. Our diagram enables us to see what was the point at issue; and furthermore, it shows us, curiously enough, that both parties were right, and that if they had only clearly understood the matter—there need have been no schism at all.<\/p>", "images": [], "label": "5. The Trinity (cont.)"}, {"pdf_page_index": 32, "pdf_page_number": 33, "html": "<p>The Latin Church held, quite reasonably, that there could be no manifestation on the fifth plane of a Force which admittedly came from the seventh, without a passage through the intermediate sixth, so they declared that He proceeded from the Father and the Sun. The Greek Church, on the other hand, insisted absolutely on the distinctness of the Three Manifestations, and quite rightly protested against any theory of a procession from the First Manifestation through the Second such as would be typified in our diagram if we drew a diagonal line through the First, Second, and Third. The dotted line on the right of Plate II, showing how the Third Aspect descends through the planes and finally manifests on the Fifth, is of course the key to the true line of procession, and the absolute harmony of the two conflicting ideas.<\/p>\n<p>The wonderful way in which man is made in the image of God may be seen by comparing the triad of the human soul with the Trinity in manifestation above it. So astonishingly material have been the orthodox conceptions, that this text has literally been interpreted as referring to the physical body of man, and made to, mean that God created man’s body in a shape which He foresaw as that which Christ would choose to assume when He came on earth.<\/p>", "images": [], "label": "5. The Trinity (cont.)"}, {"pdf_page_index": 33, "pdf_page_number": 34, "html": "<p>A glance at Plate II shows us at once the true meaning of those words. Not the physical body of man, but the constitution of his soul, reproduces with marvellous exactitude the method of Divine manifestation. Just as three aspects of the Divine are seen on the seventh plane, so the Divine Spark of the spirit in man is seen to be triple in its appearance on the fifth plane. In both cases the Second Aspect is able to descend one plane lower, and to clothe itself in the matter of that plane; in both cases the Third Aspect is able to descend two planes and repeat the process. So in both cases, there is a Trinity in Unity, separate in its manifestations, yet one in the reality behind.<\/p>", "images": [], "label": "5. The Trinity (cont.)"}, {"pdf_page_index": 34, "pdf_page_number": 35, "html": "<p>Each of the three Aspects or Persons or Manifestations of the Logos has an especial part to play in the preparation and development of the soul of man. What these parts are we shall endeavor to make clear by the help of the diagram given on Plate III. The horizontal subdivisions indicate the planes, precisely as in Plate II, and above them will be seen three symbols belonging to the series described by Madame Blavatsky in <em>The Secret Doctrine.<\/em> The highest represents the First Aspect of the Logos, and bears only a central dot, signifying the primary manifestation in our system. The Second Aspect of the Logos is symbolized by a circle divided by a diameter, showing the dual manifestation which is always associated with the Second Person of any of the Trinities, while the lowest circle contains the Greek Cross, one of the most usual symbols of the Third Aspect.<\/p>", "images": [], "label": "5. The Trinity (cont.)"}, {"pdf_page_index": 35, "pdf_page_number": 36, "html": "<h3 class=\"pdf-heading\">6. The Earlier Outpourings<\/h3>\n<p>It is from this Third Aspect that the first movement towards the formation of the system comes. Previous to this movement we have in existence nothing but the atomic state of matter in each of the planes of nature, none of the aggregations or combinations which make up the lower subplanes of each having yet been formed. But into this sea of virgin matter (the true Virgin Maria) pours down the Holy Spirit, the Life-giver, as He is called in the Nicene Creed; and by the action of His glorious vitality the units of matter are awakened to new powers and possibilities of attraction and repulsion, and thus the lower subdivisions of each plane come into existence. It will be seen that this is symbolized in the diagram by a line descending from the lowest circle straight through all the planes, growing broader and darker as it comes, to show how the Divine Spirit becomes more and more veiled in matter as it descends, until many are quite unable to recognize it as divine at all. Yet the living force is nevertheless there, even when it is most strictly confined in the lowest of its forms.<\/p>", "images": [], "label": "6. The Earlier Outpourings"}, {"pdf_page_index": 36, "pdf_page_number": 37, "html": "<p>Into this matter thus vivified, the second great outpouring of the Divine Life descends. Thus the Second person of the Trinity takes form not of the “virgin” or unproductive matter alone, but of the matter which is already instinct and pulsating with the life of the Third Person, so that both the life and the matter surround Him as a vesture, and thus in very truth He is “incarnate of the Holy Ghost and the Virgin Mary”, which is the true rendering of a prominent passage in the Christian creed. (See <em>The Christian Creed.)<\/em><\/p>", "images": [], "label": "6. The Earlier Outpourings (cont.)"}, {"pdf_page_index": 37, "pdf_page_number": 38, "html": "<p>Very slowly and gradually this resistless flood pours down through the various planes and kingdoms, spending in each of them a period equal in duration to one entire incarnation of a planetary chain, a period which, if measured as we measure time, would cover many millions of years. This flood is symbolized in Plate III by the line which, starting from the second of the circles, sweeps down the left-hand side of the oval, gradually darkening as it approaches its nadir. After passing that point it commences its upward arc and rises through the physical, astral and lower mental planes until it meets the third great outpouring, which is typified by the line starting from the highest circle and forming the right-hand side of the great oval. Of this meeting we shall say more hereafter, but for the moment let us turn our attention to the descending arc. To aid us the better to comprehend this, let us turn to Plate IV. This diagram, though it looks so different, in fact corresponds very closely with Plate III; the variously colored column on the left is identical with the downward-sweeping curve on our left in Plate III, and all the pyramidal figures which make the rest of the diagram are simply representations of the earlier part of the upward curve on the right of Plate III, pictured at various stages of its growth.<\/p>", "images": [], "label": "6. The Earlier Outpourings (cont.)"}, {"pdf_page_index": 38, "pdf_page_number": 39, "html": "<p>It will be observed that at different stages of its descent it is called by special names. As a whole, it is often spoken of as monadic essence, more especially when clothed only in the ultimate matter of the various planes; but when on its downward course it energises in the matter of the higher part of the mental plane, it is known as the First Elemental Kingdom. After spending a whole chain-period in that evolution, it descends to the lower or rupa levels of the same plane, and there it ensouls the Second Elemental Kingdom for another chain-period. Its next aeon is spent on the astral level, where it is called the Third Elemental Kingdom, or very often simply elemental essence of the astral plane. At both of these stages it is very intimately connected with man, as it enters largely into the composition of his various vehicles, and influences his thought and action. This, however, is beside our present subject, and for a full description of this action of the “desire-elemental” and the “mental-elemental” upon man we must refer our readers to other Theosophical works. A chapter upon the desire-elemental will be found in <em>The Other Side of Death.<\/em><\/p>", "images": [], "label": "6. The Earlier Outpourings (cont.)"}, {"pdf_page_index": 39, "pdf_page_number": 40, "html": "<p>When this great life-wave of divine force reaches the lowest point of its destined course it is immersed in physical matter; and at this period, and for some time after it has begun its long upward journey, it is energizing or ensouling the mineral kingdom of the particular chain upon which it happens to be at the moment. At this stage it has sometimes been called “the mineral monad “, just as at later periods of its evolution it has been named “the vegetable monad” and “the animal monad”. But all these titles are somewhat misleading, because they seem to suggest that one great monad animates the entire kingdom.<\/p>\n<p>Even when this monadic essence first comes before us, in the earliest of the elemental kingdoms, it is already not one monad, but many—not one great life-stream but many parallel streams, each possessing characteristics of its own. The whole scheme tends increasingly toward differentiation, and as these streams descend from kingdom to kingdom they divide and subdivide more and more. It may be that there is a point before all this evolution at which we may think of the great outpouring as homogeneous, though no man has ever seen it in that condition; and at the conclusion of the first great stage of evolution it is finally divided into individualities, each man being a separate soul, though as yet an undeveloped soul.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.005.jpg", "caption": "Illustration from the original edition"}], "label": "6. The Earlier Outpourings (cont.)"}, {"pdf_page_index": 40, "pdf_page_number": 41, "html": "<p>Now at all points between these two extremes its condition is something intermediate; there is always subdivision, but it is not yet carried to the point of individualization. It must never be forgotten that we are dealing all the while with the evolution of the ensouling force or life, and not of the outward form; and this ensouling energy evolves by means of the qualities acquired in physical incarnation. In the vegetable kingdom, for example, we have not a soul for one plant, but one group-soul for an enormous, number of plants—perhaps in some cases for a whole, species. In the animal kingdom this subdivision has, proceeded much further, and though it may still be true among low forms of insect life that one soul animates many millions of bodies, in the case of the higher animals a comparatively small number of physical forms are the expression of one group-soul.<\/p>", "images": [], "label": "6. The Earlier Outpourings (cont.)"}, {"pdf_page_index": 41, "pdf_page_number": 42, "html": "<h3 class=\"pdf-heading\">7. The Animal Group-Soul<\/h3>\n<p>This idea of the group-soul seems to many students novel and difficult; perhaps an Oriental simile may help us to understand it more readily. They tell us that the group-soul is like the water in a bucket, while if we suppose a tumblerful of water withdrawn from that bucket, we shall have a representation of the soul of the single animal. The water in the glass is for the time quite separate from that in the bucket, and it takes the form of the glass which contains it. Suppose that we put into that glass a certain amount of coloring matter, so that the water in it acquires a distinctive hue of its own; that coloring matter will represent the qualities developed in the temporarily separated soul by the various experiences through which it passes.<\/p>\n<p>The death of the animal will be typified by pouring back the water from the glass into the bucket, when the coloring matter will at once spread through the whole of the water, tinting it faintly. In exactly the same way, whatever qualities have been developed during the life of the separated animal will be distributed through the whole group-soul after his death.<\/p>", "images": [], "label": "7. The Animal Group-Soul"}, {"pdf_page_index": 42, "pdf_page_number": 43, "html": "<p>It would be impossible to take again out of the bucket the same glass of water, but every glassful taken out afterwards will necessarily be colored by the matter brought in from that first glass. If it were possible to take out of the bucket exactly the same molecules of water, to reproduce the first glassful exactly, that would be a veritable reincarnation; but since that is not possible, we have instead the reabsorption of the temporary soul into the group-soul—a process in which, nevertheless, everything that has been gained by the temporary separation is carefully preserved.<\/p>\n<p>Not one glass at a time only, but many glasses simultaneously, are filled from each bucket; and each one of them brings back to the group-soul its own quota of evolved quality. Thus in time many different qualities are developed within each group-soul, and of course manifest themselves as inherent in every animal which is an expression of it. Hence come the definite instincts with which certain creatures are born. The duckling, the moment it is set free from the egg, seeks the water and can swim fearlessly, even though it may have been hatched by a hen which dreads water, and is terribly worried to find her charges rushing to what she supposes to be destruction. But that fragment of a group-soul which is functioning through the duckling knows perfectly well from previous experience that the water is its natural element, and the tiny body fearlessly carries out its behests.<\/p>", "images": [], "label": "7. The Animal Group-Soul (cont.)"}, {"pdf_page_index": 43, "pdf_page_number": 44, "html": "<p>All the while within each group-soul the tendency to further and further subdivision is steadily working. It manifests itself in a phenomenon, which, though upon a higher plane, has a curious resemblance to the way in which a cell divides. In the group-soul, which may be thought of as vividly animating a great mass of matter on the mental plane, a kind of scarcely perceptible film appears, as we might suppose a sort of barrier gradually to form itself across the bucket. The water at first filters through this barrier to some extent, but nevertheless the glasses of water taken out from one side of that barrier are always returned to the same side, so that by degrees the water on one side becomes differentiated from the water on the other, and then the barrier gradually densifies and becomes impenetrable, so that we have eventually two buckets instead of one.<\/p>\n<p>This process is constantly repeated, until by the time that we reach the really higher animals a comparatively small number of bodies is attached to each group-soul.<\/p>\n<p>It is found that the individualization which lifts an entity definitely from the, animal kingdom into the human, can take place only from certain types of animals. Only among domesticated creatures, and by no means among all classes of even those, does this, individualization occur.<\/p>", "images": [], "label": "7. The Animal Group-Soul (cont.)"}, {"pdf_page_index": 44, "pdf_page_number": 45, "html": "<p>It must of course be remembered that we are very little more than half through the evolution of this chain of worlds, and it is only at the end of this evolution that the animal kingdom is expected to attain humanity. Naturally, therefore, any animal which is now attaining or even approaching individualization must be very remarkably in advance of the others, and the number of such cases is consequently very small. Still they do occasionally occur, and they are of extreme interest to us as indicating the manner in which we ourselves came into existence in the remote past.<\/p>\n<p>The lunar animal kingdom, out of which we were individualized, was at a somewhat lower level than the animal kingdom of the present day; but the principle adopted seems to have been almost precisely the same.<\/p>", "images": [], "label": "7. The Animal Group-Soul (cont.)"}, {"pdf_page_index": 45, "pdf_page_number": 46, "html": "<h3 class=\"pdf-heading\">8. The Upward Curve<\/h3>\n<p>Before explaining this in detail we must refer once more to Plate IV. It will be remembered that the variously colored bands which occupy the principal part of this diagram are intended to signify various stages in the upward progress of the monadic essence. In its downward course, which is indicated by the column to the left of the diagram, it simply aggregates round itself the different kinds of matter on the various planes, evolving that matter by accustoming and adapting it to convey vibrations and impressions, and at the same time acquiring for itself the power to receive and respond readily to these impressions at their respective levels. But when it has reached the lowest point of its immersion in matter, and turns to begin the grand upward sweep of evolution towards divinity, its work then is somewhat different. Its object then is to develop its consciousness fully at these various levels, learning to control the bodies which it constructs from them, and to use them definitely as vehicles, so that they shall not only serve as bridges to carry impressions from without to the soul, but shall also enable that soul to express itself on their several planes through their instrumentality.<\/p>", "images": [], "label": "8. The Upward Curve"}, {"pdf_page_index": 46, "pdf_page_number": 47, "html": "<p>In this effort it naturally begins with the lowest matter, since its vibrations, though they are the largest and coarsest, are also the least powerful or penetrating, and therefore the easiest to control. Thus it happen that man, although possessing in a more or less latent condition so many higher principles, is yet at first for a long time fully conscious only in his physical body, and afterwards very gradually develops the consciousness in his astral vehicle, while in his mental body it comes at a still later stage.<\/p>\n<p>Turning to Plate IV, we see that we have a separate band or ribbon to represent each of the kingdoms. It will be noticed that in the band corresponding to the mineral kingdom we have the full width developed only in the denser part of the physical plane, and that in the part of the band which corresponds to etheric physical matter the band grows steadily narrower as we approach the higher planes. This of course indicates that in the mineral kingdom the control of the, soul over the higher part of the etheric matter is not yet perfectly developed. It will be noticed also that there is a small point of red, showing that a certain amount of consciousness is already working through astral matter— that is to say, that a certain amount of desire is already manifesting itself.<\/p>", "images": [], "label": "8. The Upward Curve (cont.)"}, {"pdf_page_index": 47, "pdf_page_number": 48, "html": "<p>It may seem strange to many people to speak of desire in connection with the mineral kingdom; but every chemist knows that in chemical affinity we have already a very distinct manifestation of preference on the part of various elements; and what is that but a commencement of desire? One element has so strong a desire for the company of another that it will instantly forsake, in order to join it, any other substance with which it may happen to be in association. Indeed, it is by means of our knowledge of these likes and dislikes of the various elements that we obtain various gases when we want them.<\/p>\n<p>For example, oxygen and hydrogen are combined in water, but if we throw sodium into the water we find that oxygen likes sodium better than hydrogen, and promptly deserts the latter to combine with the former; so we have a compound called sodium hydroxide instead of water, and the released hydrogen escapes. Or if we put zinc filings into diluted hydrochloric acid (which is hydrogen combined with chlorine) we find that the chlorine proceeds to abandon the hydrogen in order to join the zinc, so that zinc chloride remains, while hydrogen is given off and may be collected. So it will be seen that we are justified in speaking of the action of desire in the mineral kingdom.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.006.jpg", "caption": "Illustration from the original edition"}], "label": "8. The Upward Curve (cont.)"}, {"pdf_page_index": 48, "pdf_page_number": 49, "html": "<p>If we now look at the band which symbolizes the vegetable kingdom we shall see that it is of full width not only in the dense physical, but also in the etheric part. We shall see also that the point typifying desire is more fully developed, betokening a far greater capacity of utilizing the lower astral matter. Those who have studied botany will be aware that likes and dislikes (that is to say, forms of desire) are very much more prominent in the vegetable world than in the mineral, and that many plants exhibit a great deal of ingenuity and sagacity in attaining their ends, limited though these ends may be from our point of view.<\/p>\n<p>When we turn to the band representing the animal kingdom we find that consciousness has advanced much further. It will be noticed that the band is of full width not only through the whole of the physical plane, but in the lowest sub-plane of the astral as well, showing that the animal is capable to the fullest possible extent of experiencing the lower desires, although the rapid narrowing of the band as we reach the higher sub-planes proclaims that his capacity for the higher desires is much more limited. Still it does exist; and so it happens that in exceptional cases he may manifest an exceedingly high quality of affection or devotion.<\/p>", "images": [], "label": "8. The Upward Curve (cont.)"}, {"pdf_page_index": 49, "pdf_page_number": 50, "html": "<p>It will be observed also that the band representing the animal kingdom ends in a point of green, signifying that at this stage there is already a development of intelligence, employing mental matter for its manifestation. It used at one time to be supposed that reason was the quality which distinguished man from the animals—that he possessed this faculty, while they had only instinct. As regards the higher domestic animals, however, that is certainly a mistake; anyone who has kept a dog or a cat, and made a friend of him will surely have observed that such creatures undoubtedly do exercise the power of reason from cause to effect, although naturally the lines along which their reason can work are few and limited, and the faculty itself is far less powerful than ours. In the case of the average animal the point is quite correctly shown as embracing only the lowest variety of reason, acting in the matter of the lowest subdivision of the mental plane; but with the highly developed domestic animal the point might readily extend even to the highest of the four lower levels, though, of course, it would remain only a point, and by no means the full width of the band.<\/p>", "images": [], "label": "8. The Upward Curve (cont.)"}, {"pdf_page_index": 50, "pdf_page_number": 51, "html": "<h3 class=\"pdf-heading\">9. Human Consciousness<\/h3>\n<p>When we turn to the consideration of the band of color which represents humanity, we at once note several quite new features. In this case the band retains its full width not only through the whole of the physical plane, but also through the whole of the astral, showing that man is capable of all varieties of desire to the fullest possible extent, the highest as well as the lowest. It also exhibits the full width in the lowest level of the mental plane, indicating that, as far as that level is concerned, man’s reasoning faculty is fully developed. Higher than that, however, the development is not yet full; but an entirely new factor is introduced in the dark blue triangle on the higher mental plane, betokening the possession by the man of a causal <em>body<\/em> and a permanent reincarnating ego. This blue triangle corresponds to the other triangle in the circle which is seen in Plate III. In the great majority of mankind the point which denotes consciousness of any sort upon the higher mental levels does not rise beyond the third or lowest of them. It is only very gradually, as his development progresses, that the ego is able to raise his consciousness to the second or the first of these sub-planes.<\/p>", "images": [], "label": "9. Human Consciousness"}, {"pdf_page_index": 51, "pdf_page_number": 52, "html": "<p>It is not, of course, implied that the man can function consciously at these heights as yet. In the most primitive types, desire is still emphatically the most prominent feature, though the mental development has also proceeded to some extent. Such a man during life has a dim consciousness in his astral body while asleep, and after death he is very fully conscious and active on the lower astral sub-planes. In fact, that lower astral life usually forms nearly the whole of the interval between his incarnations, for as yet he has practically nothing of the life of the heaven-world. The consciousness of the man at this level is undoubtedly centred in quite the lower part of the astral body, and his life is principally governed by sensations connected with the physical plane.<\/p>\n<p>The ordinary man of our own civilization is still living almost entirely in his sensations, although the higher astral is coming into play; but still for him the prominent question which guides his conduct is not in the least what is right or reasonable to do, but simply what he himself desires to do. The more cultured and developed begin to govern desire by reason—that is to say, the centre of consciousness is gradually transferring itself from the higher astral to the lower mental. Slowly as man progresses, it moves up further still, and he begi
