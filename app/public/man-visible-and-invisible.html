ns to be dominated by principle rather than by interest and desire.<\/p>", "images": [], "label": "9. Human Consciousness (cont.)"}, {"pdf_page_index": 52, "pdf_page_number": 53, "html": "<p>To be able to use these different bodies as definite vehicles in which the soul can consciously function is another and still greater development. Any fairly advanced and cultured man has consciousness fully developed in the astral body, and is perfectly capable of employing it as a vehicle if he were only in the habit of doing so. But to do this a definite effort would be necessary. The enormous majority of men know nothing at all about the astral body or its uses, and so naturally make no effort of any kind. They have behind them the tradition of the immemorial custom of a long series of lives in which the astral faculties have not been used, for these faculties have been gradually and slowly growing inside a shell, somewhat as a chicken grows inside the egg. The shell is composed of the great mass of self-centred thought in which the ordinary man is so hopelessly entombed. Whatever may have been the thoughts chiefly engaging his mind during the day, he usually continues them when falling asleep, and is thus surrounded by so dense a wall of his own making that he practically knows nothing of what is going on outside. Occasionally, but very rarely, some violent impact from without, or some strong desire of his own from within, may tear aside this curtain of mist for the moment and permit him to receive some definite impression; but even then the fog closes in again almost immediately, and he dreams on unobservantly as before. It is obvious that this shell maybe broken in various ways.<\/p>", "images": [], "label": "9. Human Consciousness (cont.)"}, {"pdf_page_index": 53, "pdf_page_number": 54, "html": "<p><em>First<\/em>.—In the far-distant future the slow but sure evolution of the man will undoubtedly gradually dissipate the curtain of mist, so that he will become conscious by degrees of the mighty world of intensely active life which surrounds him.<\/p>\n<p><em>Second<\/em>.—The man himself, having learned the facts of the case, may by steady and persistent effort from within clear away the mist, and gradually overcome the inertia resulting from ages of inactivity. This is, of course, merely the hastening of the natural process, and will be in no way harmful if the man’s development is proceeding with equal rapidity along other lines. But if he should gain this awakening without having attained at the same time the strength, knowledge, and moral development which would naturally have preceded it, he would be liable to the double danger of misusing such powers as he might acquire, and of being overwhelmed by fear in the presence of forces which he could neither understand nor control.<\/p>\n<p><em>Third<\/em>.—It may happen that some accident, or some unlawful use of magical ceremonies, may so rend the veil that it may never be wholly closed; and then the man is left in the terrible condition so well described by Madame Blavatsky in her story of “A Bewitched Life”, or by Bulwar Lytton in his powerful novel Zanoni.<\/p>", "images": [], "label": "9. Human Consciousness (cont.)"}, {"pdf_page_index": 54, "pdf_page_number": 55, "html": "<p><em>Fourth<\/em>.—Some friend who knows the man thoroughly, and believes him capable of facing the dangers of the astral plane and doing good unselfish work there, may act upon this cloud-shell from without and rouse the man to definite action. Naturally the man who does this undertakes a very serious responsibility toward the man whom he thus arouses. The elder worker assumes this responsibility only when by long and intimate acquaintance he has become reasonably certain that the younger possesses in some measure all the qualifications mentioned in Chapter XIX of <em>Invisible Helpers;<\/em> but the need of helpers is so great that every aspirant may be absolutely certain that there will not be a day’s delay in arousing him as soon as he is seen to be ready. Meantime any who feel themselves overlooked have always the resource of adopting the second method to which I referred above; but before doing so they would be well advised to assure themselves absolutely and beyond any possibility of doubt that they possess the requisite development along other lines, as otherwise their fall will be speedy and certain.<\/p>", "images": [], "label": "9. Human Consciousness (cont.)"}, {"pdf_page_index": 55, "pdf_page_number": 56, "html": "<p>But a great deal of work may be done, and constantly is done, short of this full awakening. A man who falls asleep each night with the definite intention in his mind of doing a certain piece of work, will assuredly go and attempt to carry out his intention as soon as he is freed from his physical body; but having done his best in connection with that particular case, he is almost certain to let the fog close round him once more, imply because he has for ages been unaccustomed to initiate a fresh line of action when functioning apart from the physical brain. Many make a practice of thus ensuring that they may perform at least one helpful action each night; and of course in many cases the action is such as to occupy the whole of the time spent in sleep, so that they are practically exerting themselves to the fullest extent possible for them. We should also remember that it is by no means only during sleep that we can give effective help; the strong living thought can be sent out at any moment, and can never fail in producing its effect. But the difference between the one who has been definitely awakened and the one who has not, is that in the case of the former the curtain of mist has been for ever dissipated, while in the latter it merely opens for the time and then shuts down as impenetrably as before.<\/p>", "images": [], "label": "9. Human Consciousness (cont.)"}, {"pdf_page_index": 56, "pdf_page_number": 57, "html": "<h3 class=\"pdf-heading\">10. The Third Outpouring<\/h3>\n<p>In order to understand the formation of the soul in man there is another great factor which must be taken into account. This is the third outpouring of the divine life, which comes from the first aspect of the Logos, and makes within each man that distinctive “spirit of the man which goeth upward” in contradistinction to “the spirit of the beast which goeth downward which, being interpreted, means that while the soul of the animal pours back after the death of the body into the group-soul or block to which it belongs, the divine spirit in man cannot so fall back again, but rises ever onward and upward towards the divinity from which it came. This third wave of life is represented by the band on the right in Plate III, and it will be noticed that in this case the outpouring does not become darker or more materialized as it proceeds. It appears to be unable of itself to descend lower than the Buddhic plane, and there it hovers like a mighty cloud, waiting for an opportunity of effecting a junction with the second outpouring, which is slowly rising to meet it. Although this cloud seems to exercise a constant attraction upon the essence below it, yet the development which makes the union a possibility must be made from below.<\/p>", "images": [], "label": "10. The Third Outpouring"}, {"pdf_page_index": 57, "pdf_page_number": 58, "html": "<p>The illustration usually given in the East to help the neophyte to comprehend this process is that of the formation of the water-spout. There also we have a great cloud hovering above the sea, on the surface of which waves are constantly forming and moving. Presently a great finger is extended from the cloud—an inverted cone of violently whirling vapor. Underneath this a vortex is rapidly formed in the ocean, but instead of being a depression in its surface, as is the ordinary whirlpool, it is a whirling cone rising above that surface. Steadily the two draw closer and closer together, until they come so near that the power of attraction is strong enough to overleap the intervening space, and suddenly a great column of mingled water and vapor is formed where nothing existed before.<\/p>\n<p>In just the same way the group-souls of the animal kingdom are constantly throwing parts of themselves into incarnation, like the temporary waves on the surface of the sea, and the process of differentiation continues until at last a time comes when one of these waves rises high enough to enable the hovering cloud to effect a junction with it, and it is then drawn up into a new existence neither in the cloud nor in the sea, but between the two and partaking of the nature of both. Thus it is separated from the group-soul of which hitherto it has formed a part, and falls back again into the sea no more.<\/p>", "images": [], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 58, "pdf_page_number": 59, "html": "<p>Anyone who has made a friend of a really intelligent domestic animal will readily understand how this happens, for he will have seen the intense devotion manifested by the animal for the master whom he loves, and the great mental efforts which he makes to understand his master’s wishes and to please him. Obviously both the animal’s intellect and his power of affection and devotion will be enormously developed by these efforts; and the time will come when in this way he will raise himself so much above the general level of his group-soul that he will absolutely break away from it, and in doing so become a fit vehicle for this third outpouring, by the junction with which the individual is formed, which thereafter follows its own course of evolution back again to divinity.<\/p>", "images": [], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 59, "pdf_page_number": 60, "html": "<p>It is sometimes asked why, if the essence was divine in the beginning, and returns again to divinity at the end—if the human monad was all-wise and all-good when it started on its long journey through matter—it was necessary for it to go through all this evolution, including as it does much sorrow and suffering, simply to return to its source in the end. But this question is based on a complete misconception of the facts. When what is sometimes, though perhaps inappropriately, called the human monad came forth from the divine it was not a monad at all—still less an all-wise and all-good one. There was no sort of individualization in it—it was simply a mass of monadic essence. The difference between its condition when issuing forth and when returning is exactly like that between a great mass of shining nebulous matter and the solar system which is eventually formed out of it. The nebula is beautiful, no doubt, but vague and useless; the sun formed from it by slow evolution pours life and heat and light upon many worlds and their inhabitants.<\/p>", "images": [], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 60, "pdf_page_number": 61, "html": "<p>Or we may take another analogy. The human body is composed of countless millions of tiny particles, and some of them are constantly being thrown off from it. Suppose that it were possible for each of these particles to go through some kind of evolution by means of which it would in time become a human being, we should not say that because it had been in a certain sense human at the beginning of that evolution, it had therefore not gained anything when it reached the end. The essence comes forth as a mere outpouring of force, even though it be divine force; it returns in the form of thousands of millions of mighty adepts, each capable of himself developing into a Logos.<\/p>", "images": [], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 61, "pdf_page_number": 62, "html": "<p>It is this wonderful course of evolution that we shall try to represent to a certain extent in our series of illustrations, and though the most that we can do is to endeavour to portray the change which takes place in the various vehicles of the man as he develops, it is yet hoped that some idea of the progress may thus be conveyed to those who are as yet unable to see. There is one point in connection with the junction which we have been trying to describe which requires further explanation. A curious change has taken place in the position of the monadic essence. All the way through its long ages of evolution in all the previous kingdoms, it has invariably been the ensouling and energising principle—the force behind whatever forms it may have temporarily occupied. But now that which has hitherto been the ensouler becomes itself in turn the ensouled; from that monadic essence which was part of the animal group-soul is now formed the causal body—a splendid ovoid form of living light, into which the still more glorious light and life from above has descended, and by means of which that higher life is enabled to express itself as the human individuality.<\/p>", "images": [], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 62, "pdf_page_number": 63, "html": "<p>Nor should any think that it is an unworthy goal to reach as a result of so long and weary an evolution, thus to have become a vehicle of this last and grandest outpouring of the divine Spirit; for it must be remembered that without the preparation of this vehicle to act as the connecting link, the immortal individuality of man could never come into being. No fragment of the work which has been done through all these ages is lost, and nothing has been useless. For the upper triad thus formed becomes a transcendent unity, “not by conversion of the Godhead into flesh, but by taking of the manhood into God”. Without that long course of evolution this final consummation could never have been reached, that man should rise to the level of divinity, and that thus the very Logos Himself should be made more perfect, in that He has of His own offspring those upon whom that love which is the essence of His divine nature has for the first time been fully lavished, and by whom it can be returned.<\/p>", "images": [], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 63, "pdf_page_number": 64, "html": "<p>A stage of development much in advance of the ordinary man is typified for us by the band on the extreme right of the diagram in Plate IV. There we have the image of the highly spiritual man, whose consciousness has already evolved even beyond the causal body, so that he is able to function freely upon the Buddhic plane, and has also a consciousness (at least when out of the body) upon a plane still higher than that, as is hinted by the white point. It will be seen that in his case the centre of consciousness (denoted by the widest part of the ribbon) is not at all, as before, upon the physical and astral planes, but lies between the higher mental and the Buddhic. The higher mental and the higher astral are in him much more developed than their lower parts, and although he still retains his physical body, as is shown by the fact that the lower point of the band still reaches the lowest physical Emit, yet this is only a point, which means that he holds this physical form merely for the convenience of working in it, and not in any way because his thoughts and desires are fixed there. He has long ago transcended all karma which could bind him to incarnation; and if he now takes upon himself the vehicles of the lower planes, it is simply in order that through them he may be able to work for the good of humanity, and to pour out at these levels influence which otherwise could not descend thereto. For the vibrations of certain types of the divine force are in themselves too fine to be appreciated by the grosser essence of these lower planes; but if they descend to them through the channel of one whose vehicles at these levels are perfectly pure, then they can be appreciated even down here, and so their work may be done.<\/p>", "images": [], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 64, "pdf_page_number": 65, "html": "<p>When this causal body is newly formed it is transparent yet iridescent, like a gigantic soap-bubble, when viewed by the higher clairvoyant sight—that is to say, when examined at its own level by one who has fully developed the faculties of his own causal body, for it is only to such sight that it would be visible at all. But at this stage it also resembles the soap-bubble in being almost empty in appearance, for the divine force which is really contained within it has as yet had no time to develop its latent qualities by learning to vibrate in response to impacts from without, and consequently there is little color. What little there is comes because certain qualities have been already evolved within the group-soul of which that causal body previously formed a part, and it is in process of communicating these to the force within, so that there is already a certain vibration at the rates corresponding to these; and consequently faint indications of these rates of vibrations are even now observable within the form as dawning gleams of color. Plate V will give us some idea of its appearance at (or soon after) this stage, and it may be taken to represent the causal body of the primitive man. The grey shading at the left side of this illustration must not be taken as meaning any quality in the body; in fact it is not really present in it at all, but is introduced by the artist simply to give the effect of rotundity to the bubble.<\/p>", "images": [], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 65, "pdf_page_number": 66, "html": "<p>But although the man now possesses a causal body, he is very far from being sufficiently conscious to receive or respond to impressions at that level; and since the appointed method for the evolution of his latent qualities is, as has been said, by means of impacts from without, it is obviously necessary that he should descend far enough to meet such impacts as can affect him. Therefore it is that the method of progress destined for him is that by reincarnation—that is to say, by putting forth part of himself into these lower planes for the sake of the experience to be gained there and of the qualities which that experience develops, and then withdrawing back again into himself, bearing with him the results of his endeavour. Indeed, this putting forth of a part of himself into incarnation may be not inaptly likened to an investment; he expects, if all goes well, to reclaim not only the whole of his capital but also a considerable amount of interest, and he usually obtains this. But as with other investments, there is occasionally an opportunity of loss as well as of gain; for it is possible that some portion of that which he puts down may become so entangled with the lower matter through which it has to work, that it may be impossible wholly to reclaim it. The consideration of how this may happen hardly belongs to our present subject, but it will be found fully explained in <em>The Astral Plane.<\/em><\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.007.jpg", "caption": "Illustration from the original edition"}], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 66, "pdf_page_number": 67, "html": "<p>The soul puts himself down under the impulse of what in the East is called <em>Trishna,<\/em> the thirst for manifested existence, the desire to feel himself alive. He plunges about in the sea of matter, he strengthens self by selfishness, and shows himself to astral vision under the very unlovely guise depicted in Plate VII. Very gradually he learns that there is a higher evolution and that the strong shell of selfishness (which was necessary for the formation of a powerful centre) becomes a hindrance to the growth of that centre after it has once been formed, and so must be broken up and thrown aside, just as scaffolding must be removed when the building is finished, though it was necessary during its erection. Slowly through many incarnations his astral presentment develops from that of Plate VII to that of Plate X, and later still to that of Plate XXIII. We shall try to follow this evolution, and illustrate it at its different stages.<\/p>", "images": [], "label": "10. The Third Outpouring (cont.)"}, {"pdf_page_index": 67, "pdf_page_number": 68, "html": "<h3 class=\"pdf-heading\">11. How Man Evolves<\/h3>\n<p>He puts himself down first into the matter of the lower levels of the mental plane. Immediately, and in a certain sense automatically, a vesture of this matter is drawn round him, a vesture which is an exact expression of such qualities as already exist in him, so far at least as they can be expressed at that level.<\/p>\n<p>For it must never be forgotten that each stage in the descent means submission to limitation, and that consequently no expression of the soul upon any lower level can ever be a perfect expression. It is merely an indication of its qualities, just as a picture painted by an artist is a representation in two dimensions of a scene existing (or imagined as existing) in three dimensions. The picture represents the scene as nearly as it can be represented on a flat surface by means of perspective, but in reality almost every line and angle in it must of necessity be unlike the line or angle which it is intended to image. In exactly the same way the true quality as it exists in the soul cannot be expressed in matter of any lower level; the vibrations of the lower matter are altogether too dull and sluggish to represent it, the string is not sufficiently stretched to enable it to respond to the note which resounds from above. It can, however, be tuned to correspond with it in a lower octave, like a man’s voice singing in unison with a boy’s, expressing the same sound as nearly as the capabilities of the organism permit.<\/p>", "images": [], "label": "11. How Man Evolves"}, {"pdf_page_index": 68, "pdf_page_number": 69, "html": "<p>Thus the color which expresses a certain quality in the causal body will express it also in the mind body and even in the astral body, but the color will be less delicate, less luminous and ethereal as we descend. The difference between these octaves of color is very far greater than can be in any way represented upon paper or canvas; we can endeavor to image it only by stages or qualities, for even the next octave above the physical is entirely beyond the conception of our mind as long as it works under the limitation of the physical brain. The lowest astral colors may be thought of as dark and coarse, and they certainly are so as compared to the higher and purer hues, but at least they are luminous in their coarseness; they are not so much dark color in our ordinary sense of the word, as dimly-glowing fire.<\/p>", "images": [], "label": "11. How Man Evolves (cont.)"}, {"pdf_page_index": 69, "pdf_page_number": 70, "html": "<p>At each stage as we ascend we shall find that while the higher matter exhibits a splendid power of expression of the nobler qualities, it gradually loses the power to express some which are lower. The peculiarly unpleasant hue which represents coarse sensuality in the astral body is quite incapable of reproducing itself, in mental matter. It may be objected that this surely should not be so, as a man may undoubtedly have a sensual thought; but this idea does not seem accurately to represent the facts. A man may form a mental image which evokes sensual feeling in him, but the thought and the image will express themselves in astral matter, and not in mental. It will leave a very definite impression of its peculiar hue upon the astral body, but in the mental body it will intensify the colors which represent its concomitant mental evils of selfishness, conceit and deception. These in their turn will find no expression whatever in the resplendent glory of the causal body, but every intensification of them in the lower vehicle, every indulgence in them down here, tends somewhat to dim the luminosity of the colors representing the development of the opposite virtues in that higher existence which is so much nearer to reality.<\/p>", "images": [], "label": "11. How Man Evolves (cont.)"}, {"pdf_page_index": 70, "pdf_page_number": 71, "html": "<p>The process by which the colors are produced works always from below upward. The man feels some impact from without, and in response to it a wave of emotion of some sort is awakened within him. That means that for the moment, while the emotion endures, the particular type of vibration (which represents it) is predominant in the astral body, as will presently be shown in our illustrations. After a time the emotion dies down, and the color corresponding to it fades away—but not entirely. A certain proportion of the matter of the astral body is normally oscillating at the especial rate appropriate to that emotion, and every great outburst of it adds somewhat to this proportion.<\/p>", "images": [], "label": "11. How Man Evolves (cont.)"}, {"pdf_page_index": 71, "pdf_page_number": 72, "html": "<p>For example, men have within them a certain amount of irritability, which expresses itself in the astral body as a scarlet cloud. When the man manifests that irritability by some special outburst of temper the whole astral vehicle is temporarily suffused with scarlet. The fit of passion subsides, and the scarlet flush dies away, but it has left its traces behind, for there is a slight permanent addition to the size of the scarlet cloud of irascibility, and the whole matter of the astral body is a little more ready than before to respond to the vibration of anger when any opportunity offers. Naturally, exactly the same course is followed in the case of any other emotion, whether it be good or bad; and thus we see the clear manifestation in matter of the moral law, that every time we yield to a passion of any kind, we make it a little more difficult for ourselves to resist its next attack; while every successful effort at its repression makes the next victory a little easier.<\/p>", "images": [], "label": "11. How Man Evolves (cont.)"}, {"pdf_page_index": 72, "pdf_page_number": 73, "html": "<p>The comparatively permanent color in the astral body means a persistent vibration, which in course of time produces its due effect upon the mental body also, creating a vibration of similar character at that much higher level— provided that the vibration is of such a character as can be reproduced in that finer matter. It is by the same method of exciting sympathetic vibration that the higher qualities developed by the life on lower planes are gradually built into the causal body itself, though at that level, fortunately for us, only the effect of the loftier emotions can be recorded.<\/p>\n<p>So, in the course of his many lives, man develops within himself many qualities, some good, some evil; but while all good development is steadily stored up and accumulated within the causal body, that which is evil can express itself only through the lower vehicles, and so is comparatively impermanent. Under the mighty law of divine justice, every man receives absolutely the exact results of his own action, whether it be bad or good; but the evil necessarily works out its effects upon the lower planes, because it is only in the matter of those planes that its vibrations can be expressed, and it has no overtones capable of awakening a response in the causal body. Its force, therefore, is all expended at its own level, and it reacts in its entirety upon its creator in his astral and physical life, whether it be in this or in future incarnations.<\/p>", "images": [], "label": "11. How Man Evolves (cont.)"}, {"pdf_page_index": 73, "pdf_page_number": 74, "html": "<p>The good action or thought produces its results upon these lower planes too, but in addition to that it has the immensely higher and permanent effect upon the causal body which is so prominent a factor in the evolution of man. Thus, while all alike produce their results down here, and manifest them in the various temporary vehicles, it is the good qualities only which are retained as so much definite gain to the real man. The evil meets him again and again on his successive descents into incarnation, until he has vanquished it, and finally rooted out from his vehicles all tendency to respond to it—until, in fact, he is no longer liable to be swept away by any passion or desire, but has learnt to rule himself from within.<\/p>", "images": [], "label": "11. How Man Evolves (cont.)"}, {"pdf_page_index": 74, "pdf_page_number": 75, "html": "<h3 class=\"pdf-heading\">12. What His Bodies Show Us<\/h3>\n<p>This process of learning is a gradual one, and the earlier manifestations of the undeveloped man upon the lower planes are by no means beautiful to see. The primitive man whose causal body is represented in Plate V would be likely to possess such a mental body as is shown in Plate VI, and an astral body of the type given in Plate VII.<\/p>\n<p>It must be understood that all these bodies occupy the same space, and interpenetrate one another; so that in looking clairvoyantly at the primitive man we should observe his physical body surrounded by a luminous ovoid mist, but that mist would present to us the appearance of Plate V, Plate VI, or Plate VII according to the type of clairvoyance which we employed. Using our own astral senses, we should see his astral-body only, and should learn from that what passions or emotions or sensations he was at the moment experiencing, and to which of these he was in the habit of yielding himself frequently. This is the field of the manifestation of desire— the mirror in which every feeling is instantly reflected, in which even every thought which has in it anything that touches the personal self must express itself. From its material a bodily form is given to the dark elements which men create and set in motion by evil wishes and malicious feelings; from it also are bodied forth the beneficent elementals called into life by good wishes, gratitude and love.<\/p>", "images": [], "label": "12. What His Bodies Show Us"}, {"pdf_page_index": 75, "pdf_page_number": 76, "html": "<p>As might naturally be expected, there is little of permanence about its manifestations; its colors, its brilliance, the rate of its pulsations, are all changing from moment to moment. An outburst of anger will charge the whole astral body with deep-red flashes on a black ground; a sudden fright will instantaneously veil everything in a mist of ghastly, livid grey. Nevertheless, there will be moments when even this fluctuating astral vehicle is comparatively at rest, and it will then show a definite group of colors which retain more or less the same arrangement. Such a moment is that chosen for our illustration in Plate VII, and from this, as we shall presently see, a good deal of information about the man may be obtained.<\/p>\n<p>Using our mental sight, it would be the mental body of our primitive friend that we should perceive, and it would probably resemble that illustrated in Plate VI. As far as its colors are the same, this body would agree fairly with the astral in a condition of repose, but it would also be much more than this, for in it would appear whatever might be developed in the man of spirituality and intellectuality— not much yet, perhaps, in the case of our primitive man, but of considerable importance later on, as we shall see in due course. From this mental body we are therefore able to deduce what kind of man he is, and what sort of use he has made of his life so far in this incarnation.<\/p>", "images": [], "label": "12. What His Bodies Show Us (cont.)"}, {"pdf_page_index": 76, "pdf_page_number": 77, "html": "<p>But if we are fortunate enough to be able to apply to the problem the perfect power of vision exercised through our causal body, then what we see is the causal body of the primitive man, and from that we know how far his real life as a soul has advanced, and what progress the ego has made in its unfoldment toward divinity. It will be seen that, to the trained clairvoyant who is able to employ all these various degrees of sight in turn, the entire life of the man in all its stages lies open like a book; for on these higher planes no man can hide or disguise himself; what he truly is is seen to be by any unprejudiced spectator.<\/p>\n<p>Unprejudiced, I say; because we must never forget that each sees the other through the medium of his own vehicles, and so is somewhat in the position of one looking at a landscape through the colored glass. Until he has learnt to make allowance for this influence, he will be likely to consider as most prominent in the man, at whom he is looking just those characteristics to which he finds himself most ready to respond; but with a little careful practice he soon frees himself from the distortion produced by this personal equation, and is able to read clearly and accurately.<\/p>", "images": [], "label": "12. What His Bodies Show Us (cont.)"}, {"pdf_page_index": 77, "pdf_page_number": 78, "html": "<h3 class=\"pdf-heading\">13. Colors And Their Meaning<\/h3>\n<p>Before we can intelligently study the details of these various bodies, we must familiarize ourselves with the general meaning of the various shades of color in them, as shown in our frontispiece. It will be realized that an almost infinite variety is possible in their combination. I am endeavoring to give, as nearly as possible, the exact shade which expresses the unmixed emotion whose name is attached to it; but human emotions are hardly ever unmixed, and so we have constantly to classify or to analyse indeterminate hue in the formation of which many factors have played their part.<\/p>\n<p>Anger, for example, is represented by scarlet, and love by crimson and rose; but both anger and love are often deeply tinged with selfishness, and just so far as that is the case will the purity of their respective colors be dimmed by the hard brown-grey which is so characteristic of this vice. Or again, either of them may be mingled with pride, and that would instantly show itself by a tinge of deep orange. Many examples of such commingling, and of the resultant shades of color, will be seen as we continue our investigation; but our first endeavor must be to learn to read the meaning of the simpler hues. We will give here a list of some of these which are most common.<\/p>", "images": [], "label": "13. Colors And Their Meaning"}, {"pdf_page_index": 78, "pdf_page_number": 79, "html": "<p><em>Black<\/em>.—Thick black clouds in the astral body mark the presence of hatred and malice. When a person unhappily gives way to a fit of passionate anger, the terrible thought-forms of hate may generally be seen floating in his aura like coils of heavy, poisonous smoke.<\/p>\n<p><em>Red.<\/em>—Deep-red flashes, usually on a black ground, show anger; and this will be more or less tinged with brown as there is more or less of direct selfishness in the type of anger. What is sometimes called “noble indignation” on behalf of someone oppressed or injured may express itself in flashes of brilliant scarlet on the ordinary background of the aura.<\/p>\n<p>Lurid, sanguinary red—a color which is quite unmistakable, though not easy to describe—indicates sensuality.<\/p>\n<p><em>Brown<\/em>.—Dull brown-red, almost rust-color, means avarice; and it usually arranges itself in parallel bars across the astral body, giving a very curious appearance.<\/p>\n<p>Dull, hard brown-grey signifies selfishness, and is unfortunately one of the very commonest colors in the astral body.<\/p>\n<p>Greenish-brown, lit up by deep red or scarlet flashes, denotes jealousy, and in the case of the ordinary man there is nearly always a good deal of this color present when he is what is called “in love”.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 79, "pdf_page_number": 80, "html": "<p><em>Grey<\/em>.—Heavy leaden grey expresses deep depression, and where this is habitual its appearance is sometimes indescribably gloomy and saddening. This color also has the curious characteristic of arranging itself in parallel lines, as has that of avarice, and both give the impression that their unfortunate victim is imprisoned within a kind of astral cage.<\/p>\n<p>Livid grey, a most hideous and frightful hue, betokens fear.<\/p>\n<p><em>Crimson<\/em>.—This color is the manifestation of love, and is often the most beautiful feature in the vehicles of the average man. Naturally it varies greatly with the nature of the love. It may be dull, heavy, and deeply tinged with the brown of selfishness, if the so-called love occupies itself chiefly with the consideration of how much affection is received from somebody else, how much return it is getting for its investment. But if the love be of that kind that thinks never of itself at all, nor of what it receives, but only of how much it can give, and how entirely it can pour itself forth as a willing sacrifice for the sake of the loved one, then it will express itself in the most lovely rose-color; and when this rose-color is exceptionally brilliant and tinged with lilac, it proclaims the more spiritual love for humanity. The intermediate possibilities are countless; and the affection may of course be tinged in various other ways, as by pride or jealousy.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 80, "pdf_page_number": 81, "html": "<p><em>Orange<\/em>.—This color is always significant of pride or ambition, and has almost as many variations as the last-mentioned, according to the nature of the pride or the ambition. It is not infrequently found in union with irritability.<\/p>\n<p><em>Yellow<\/em>.—This is a very good color, implying always the possession of intellectuality. Its shades vary, and it may be complicated by the admixture of various other hues. Generally speaking, it has a deeper and duller tint if the intellect is directed chiefly into lower channels, most especially if the objects are selfish; but it becomes brilliantly golden, and rises gradually to a beautiful clear and luminous lemon or primrose yellow, as it is addressed to higher and more unselfish objects.<\/p>\n<p><em>Green<\/em>.—No color has more varied signification than this, and it requires some study to interpret it correctly. Most of its manifestations indicate a kind of adaptability, at first evil and deceitful, but eventually good and sympathetic.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 81, "pdf_page_number": 82, "html": "<p>Grey-green, a peculiar shade which signifies deceit and cunning, will be found very prominently in the astral bodies of most primitives. It is by no means rare among civilized men, who ought long ago to have passed the stage of evolution which it indicates. As the man advances, this hue improves into a bright emerald-green, which still means versatility, ingenuity, and quickness of resource, but no longer implies any evil intent in connection with these qualities. It indicates the power of “being all things to all men”, not now for the purpose of tricking or misleading them, but at first in order to please them, to obtain their praise or their favor, and later on, as understanding develops, for the purpose of helping and strengthening them. Eventually it becomes a lovely pale, luminous blue-green, such as may sometimes be seen in an exceptionally delicate sunset sky, and then it shows some of the grandest qualities of human nature, the deepest sympathy and compassion, with the power of perfect adaptability which only they can give. In its earlier development a bright apple-green seems always to accompany strong vitality.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 82, "pdf_page_number": 83, "html": "<p><em>Blue.<\/em>—Dark, clear blue usually betokens religious feeling, but this also varies according to the type of the feeling, its purity or bigotry, its selfishness or nobility. It is liable to be tinted by almost any of the qualities previously mentioned, so that we may have any shade from indigo on one side and rich deep violet on the other, down to a muddy grey-blue which is at the level of fetish-worship. The tinge of love or fear, of deceit or of pride, may mingle with the hue of religion, and thus there is a wide range of variation observable.<\/p>\n<p>Light blue marks devotion to a noble spiritual ideal, and gradually rises to a luminous lilac-blue, which typifies the higher spirituality, and is usually accompanied by sparkling golden stars, representing elevated spiritual aspirations.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 83, "pdf_page_number": 84, "html": "<p>It is easy to understand how almost infinite may be the combinations and modifications of all these hues, so that the most delicate gradation of character or the most evanescent of mingled feelings is expressed with the greatest accuracy. The general brilliance of the astral body, the comparative definiteness or indefiniteness of its outline, and the relative brightness of the different centres of force, are all points which have to be taken into consideration in reading the full meaning of what is seen. Another fact worth mentioning is that developed or developing psychical faculties show themselves by means of the colors which lie beyond the visible spectrum, so that it is impossible to picture them with physical hues. The ultra-violet tints denote the higher and purer developments, while gruesome combinations of the ultra-red reveal the wickedness of the dabbler in evil and selfish forms of magic. Occult advancement proclaims itself not only by these colors, but also by the greater luminosity of the various bodies, and by their increased size and more definite outline, as will presently be seen in our illustrations.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 84, "pdf_page_number": 85, "html": "<p>There is one other point to be mentioned in connection with our illustrations generally, before we take them up one by one for separate consideration. It will be noticed that the outline of the physical body is faintly marked inside each of the ovoids, in order to keep clearly before the reader the comparison in size between it and these mist-clouds; but it should be remembered that this is merely an indication and not a representation, and none must make the mistake of supposing that the astral and mental counterparts of the physical form are in reality as indefinite and unrecognizable. In a drawing made upon this plane it is impossible to give simultaneously all the aspects of a figure which belongs to a different realm of nature, and for that reason certain characteristics of these higher vehicles have in our illustrations been intentionally ignored or subordinated to the special purpose of this book, which is to explain how the evolution of man displays itself in the coloring of his various bodies.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 85, "pdf_page_number": 86, "html": "<p>No attempt, for example, has been made to show the appearance of the seven chakrams or centers of force, although these exist in all the vehicles, and would in some cases be exceedingly vivid and prominent. The artist has not essayed in any way to reproduce the wondrous opalescent hues of the surface film of each ovoid; he has depicted neither the dense cloud of thought-forms which closes round each man like a wall, nor the inner arrangement which so exactly imitates the physical shape; and it is this last which needs a few words of elucidation.<\/p>\n<p>If we glance with astral vision at our neighbour during his waking hours, we shall see him looking very much as usual, except that he will be surrounded by a slight luminous mist, in which by somewhat more intent observation, we may detect the play of many colors. How is it, it may be asked, that his face and limbs are perceptible to us, since we know that the astral matter of the vehicle which we are employing cannot respond to purely physical vibrations? The reply is that what is visible to us is not his physical body but its counterpart in astral matter; and we find that even when the man abandons his dense earthly form, whether temporarily in sleep or permanently in death, this counterpart still preserves the same appearance. Let us consider how this happens.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 86, "pdf_page_number": 87, "html": "<p>We have noticed in Plate II, that astral matter has its seven conditions or degrees of density, corresponding with those on the physical plane. There is more than a mere correspondence; there is an intense attraction. Every particle of solid physical matter is interpenetrated by and has for its counterpart certain particles of astral matter of the lowest subplane, which for convenience we may call “solid astral” matter—though that is in truth a contradiction in terms, for solidity in the ordinary sense of the word is certainly not a quality that could be predicated of any kind of astral substance. In the same way every liquid physical particle has for its counterpart “liquid astral” particles, and so on; and the counterparts are not readily separable.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 87, "pdf_page_number": 88, "html": "<p>When a man descends into incarnation he draws round himself matter of the various planes through which he passes. As he gathers his mental and astral material, it adopts that ovoid form which is the expression on these lower planes of the true shape of the causal body. Presently he finds himself surrounding a small physical body, and at once its attraction begins to affect the previously inchoate astral and mental matter. The vehement vibrations of these finer particles do not easily submit themselves to such control, but as the child-form grows its influence steadily increases, until the adult has usually over ninety per cent of the matter of his astral and mental bodies within the periphery of his fleshy tabernacle. I do not mean that the same particles always stay there, for every one of them is in rapid motion and is constantly passing in and out; but on the whole that proportion is maintained. Therefore when, with astral sight, we examine a friend) what we really see is a human form of very dense and solid-looking mist surrounded by an egg-shaped cloud of diaphanous mist; and as every feature of the familiar countenance is faithfully reproduced, the man is instantly recognizable.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 88, "pdf_page_number": 89, "html": "<p>Nor is this all. The phenomenon of habit comes into play, and the astral and mental particles, having become accustomed to that form, retain it even when the dense body which caused it is destroyed, so that there is no more difficulty in recognizing a man after death than before it. Temporary changes may take place, for the finer matter may be moulded by a passing thought; but as soon as the pressure of that constraining thought is withdrawn, it slips back again into its usual shape.<\/p>\n<p>There is a much slighter but more continuous thought-influence which sometimes very gradually produces a considerable change. No man habitually images himself as decrepit, infirm, bowed, or wrinkled; and so, although immediately after death his astral body may accurately reproduce all these characteristics, the unconscious influence of his own thought of himself slowly brings back to him something of the appearance of the prime of life. That is why a man who shows himself after death as an apparition sometimes impresses his friends as looking younger instead of older than when he died.<\/p>\n<p>A factor which has its share in helping to preserve the astral shape unchanged after death is the thought of others. When a man’s friends, whether living or dead, turn their thoughts upon him, they naturally think of him as they know him; but every such thought is a momentary moulding force, and in the aggregate the effect is considerable.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 89, "pdf_page_number": 90, "html": "<p>From all this the reader will realize that when he learns to see an astral body, he will find many other points to observe in it than are shown in our illustrations; and in particular he will notice that the counterpart of the physical form is not a mere faint outline, but probably the most prominent feature of all.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 90, "pdf_page_number": 91, "html": "<p>It is almost certain to be so for the untrained clairvoyant, since it is only in the rarest of cases that he has the astral sight perfectly developed. Naturally enough, that part of the faculty which usually opens first is the lowest, the nearest to the physical, and a man may often for very many years be able to see only the denser kinds of astral matter. But those, corresponding as they do to the materials of the physical body, are precisely the varieties which are most of all concentrated within the counterpart. Obviously, therefore, the surrounding ovoid of mist will seem to such a man much fainter in proportion and much less conspicuous than it really is—indeed he is quite likely to overlook it altogether. If his astral sight be rather above the ordinary level he may, as I said just now, see something of the colors by looking more intently—by making an effort corresponding to straining the eyes on the physical plane. The effect of such exertion is momentarily to raise the vibrations of his astral body, or more correctly to extend his faculty to somewhat higher vibrations, and so to bring within his purview more of the vehicle at which he is looking. A man who is properly trained in clairvoyance is of course taught how to use the power of sight on all the sub-planes, either separately or simultaneously as he wishes.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 91, "pdf_page_number": 92, "html": "<p>People often ask whether an astral body appears clothed, and if so, where it obtains its vestments. Since this finer matter can be modelled by thought, the man is as he thinks of himself, and it is easy for each person to clothe himself as he will. If his attention is entirely occupied with some other matter, his mind usually automatically reproduces some ordinary costume with which it is familiar, so that he will probably appear in whatever dress he wears most frequently. I know one friend who for a long time, without ever having considered the matter, used always to show himself upon the astral plane in evening dress—because, I suppose, late at night he naturally thought of himself in that costume. Another wore always the graceful yellow robe of the Buddhist monk; but I think that was intentional in the beginning, though no doubt afterwards it became a habit.<\/p>\n<p>The counterpart exists in mental matter as well as in astral, so through the heaven-life also the man retains to a considerable extent the appearance as well as the memory of his last personality. Even in the causal body there is also a human form—not that of any one incarnation, but a glorified blending of what is noblest in all of them—the Augoeides or heavenly man, through whom manifests the true ego; but conditions at that level are so different that it is hopeless to try to describe this.<\/p>", "images": [], "label": "13. Colors And Their Meaning (cont.)"}, {"pdf_page_index": 92, "pdf_page_number": 93, "html": "<h3 class=\"pdf-heading\">14. Early Stages Of Man’s Development<\/h3>\n<p>When we apply the information contained in Chapter XIII, to the consideration of the mind-body of a primitive man as shown in Plate VI, certain facts about the man at once become obvious. Although on the whole it is a very poor and undeveloped mind-body, yet some progress has already been made. The dull yellow at the top indicates a certain amount of intellect) but also shows by the muddiness of the color that it is applied exclusively to selfish ends. The devotion denoted by the grey-blue must be a fetish-worship, largely tinged with fear, and prompted by considerations of self-interest, while the muddy crimson on our left points to a commencement of affection which must as yet be principally selfish also. The band of dull orange implies pride, but of quite a low order; while the large dash of scarlet expresses a strong tendency to anger, which would evidently blaze out upon very slight provocation. The broad band of dirty green which occupies so great a portion of the body shows forth deceit, treachery and avarice—the latter quality manifesting itself in the brownish tint which is observable. At the bottom we notice a sort of deposit of mud color, suggesting general selfishness and the absence of any desirable quality.<\/p>", "images": [], "label": "14. Early Stages Of Man’s Development"}, {"pdf_page_index": 93, "pdf_page_number": 94, "html": "<p>It is just that absence of any well-defined higher quality which makes us certain that, in turning to the corresponding astral body (Plate VII), we shall find it almost entirely uncontrolled. Accordingly, we see how enormous a proportion of this vehicle of desire is occupied exclusively by sensuality, proclaimed by the very unpleasant brown-red which is almost blood-color.<\/p>\n<p>Deceit, selfishness and greed are conspicuous here, as might be expected, and fierce anger is also implied by the smears and blots of dull scarlet. Affection is scarcely indicated at all, and such intellect and religious feeling as appear are of the lowest possible kind.<\/p>", "images": [], "label": "14. Early Stages Of Man’s Development (cont.)"}, {"pdf_page_index": 94, "pdf_page_number": 95, "html": "<p>Another point which should be noticed is the irregularity of the outline of this astral body, the generally blurred effect, and the manner in which the colors are arranged. As we pass to the vehicles of the more evolved human beings we shall find a considerable improvement in this respect. The colors always to some extent intermingle and melt into one another, but nevertheless in the ordinary man they have a tendency to lie in more or less regular bands, while the outline of the body becomes fairly definite and regular. With the undeveloped man, however, all is ill-regulated and confused; he is obviously a creature of violent and often vicious impulses to which he instantly yields without the slightest effort to control them. A very unpleasant person altogether; yet every one of us has passed through this stage, and by the experience gained in it we have been enabled to rise out of it to something purer and nobler.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.008.jpg", "caption": "Illustration from the original edition"}], "label": "14. Early Stages Of Man’s Development (cont.)"}, {"pdf_page_index": 95, "pdf_page_number": 96, "html": "<p>It will be very necessary for us to bear constantly in mind, in our endeavor to realize the appearance of the various vehicles, that the particles of which they are composed are always in rapid motion. In certain cases, which will be specially mentioned in their turn, there are definite bands and clearly defined lines in these bodies; but in the vast majority the clouds of color not only melt into one another, but are all the while rolling over one another, and appearing and disappearing as they roll.<\/p>\n<p>Indeed, the surface of this luminous and brightly-colored mist resembles somewhat the surface of violently boiling water in the way in which the particles are seen to swirl about, to rise to the surface and sink back again, and constantly to change places with one another, so that the various colors by no means retain always the respective positions in which they are represented in our illustrations Yet it is nevertheless true that they gravitate toward the arrangement here portrayed—that though the yellow, the rose and the blue are not always to be found grouped exactly as depicted, yet in all their whirlings and rollings they remain near the upper part of the oval; they are always to be found near the head of the physical body, when they exist at all, while the colors which mark selfishness, avarice, deceit or hatred tend always to appear towards the bottom, and the great mass of sensual feeling floats usually between the two.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.009.jpg", "caption": "Illustration from the original edition"}, {"file": "charles-webster-leadbeater_man-visible-and-invisible.010.jpg", "caption": "Illustration from the original edition"}], "label": "14. Early Stages Of Man’s Development (cont.)"}, {"pdf_page_index": 96, "pdf_page_number": 97, "html": "<p>Each of these rates of vibration (which show themselves to us as colors) has its own special type of astral or mental matter in which it can operate most freely, and the average position of these colors in the ever-shifting mist-cloud depends in reality upon the respective specific gravity of its special matter. The whole, or almost the whole, of the matter in an astral body may be temporarily forced by a sudden rush of passion to vibrate at a certain rate; but all of it except that to which the vibration is natural will fall back into its ordinary rate when the force is removed.<\/p>\n<p>Naturally each man has his individual idiosyncrasies, and no two are exactly alike; but each illustration given represents a section of an average specimen of its class) and its various hues are shown in that part of the ovoid where they are usually to be found.<\/p>", "images": [], "label": "14. Early Stages Of Man’s Development (cont.)"}, {"pdf_page_index": 97, "pdf_page_number": 98, "html": "<h3 class=\"pdf-heading\">15. The Ordinary Person<\/h3>\n<p>Let us now examine the average “man in the street” in order that we may see what advancement has been made, and in what way it shows itself in the various vehicles. Looking with appropriate sight at the causal body of such a man, we shall find it at about the degree of development indicated in Plate VIII. It will be seen that there has been a distinct increase in the content of the great ovoid film; a certain amount of exceedingly delicate and ethereal color now exists within it, though it is still less than half filled. The general meaning of the colors is the same as at lower levels, although here they betoken qualities definitely and permanently acquired by the soul, and they are many octaves higher than the colors which represent the same qualities on inferior planes. It will be seen that something of the higher intellect, something of the power of true devotion and true unselfish love, has already been developed within the man; and whatever expression of this may be possible upon the lower planes will be his as a kind of stock-in-trade or inherent quality in every incarnation which the future holds in store for him. There is even already a faint tint of that exceedingly delicate violet which implies the capacity of love and devotion turned towards the highest ideal, and also a faint hint of the clear green of sympathy and compassion.<\/p>", "images": [], "label": "15. The Ordinary Person"}, {"pdf_page_index": 98, "pdf_page_number": 99, "html": "<p>Examining the mental body of the ordinary man as pictured in Plate IX we find that it already shows considerable improvement over that of the undeveloped man. It is not only that there is more in proportion of intellect, love and devotion, but that all of these characteristics have improved greatly in their quality. Though very far yet from being perfectly pure, they are certainly far better in tone than those in Plate VI. The proportion of pride is quite as high as before, but at least it is now pride at a higher level; if the man is still proud, it will be rather of such good qualities as he imagines himself to possess than merely of physical pre-eminence in brute force or in cruelty. There is still a good deal of the scarlet which marks liability to anger, but it is noticeable that it now takes a much lower place in the cloud, which means an improvement in the general quality of the matter of which this mind-body is composed.<\/p>", "images": [], "label": "15. The Ordinary Person (cont.)"}, {"pdf_page_index": 99, "pdf_page_number": 100, "html": "<p>The low type of green in the mental body of the undeveloped man (which denotes deceit very strongly tinged by avarice and selfishness) required for its vibrations a type of matter denser and coarser than that needed by the scarlet of anger. The decidedly better green which is exhibited in the mental body of the ordinary man needs for its vibration matter of a type somewhat less dense than the scarlet; and hence apparently the change of relative position. The green has now advanced to the suggestion of a certain amount of versatility and adaptability, rather than deceit or cunning. A large proportion of the mind is still occupied by the brown of selfish tendencies; but even this color will be seen to be a trifle warmer and less grim than before.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.011.jpg", "caption": "Illustration from the original edition"}], "label": "15. The Ordinary Person (cont.)"}, {"pdf_page_index": 100, "pdf_page_number": 101, "html": "<p>If we now turn to Plate X we shall find the astral body which corresponds to the mental body in Plate IX—the astral body of the ordinary man. It will be seen that this astral body agrees closely with its mental, though its colors are naturally somewhat coarser and it contains very decided indications of certain passions which cannot be expressed on the higher plane. Still it will be found much improved as compared with the astral body on Plate VII. There is less of sensuality, though that is still unfortunately one of the most prominent characteristics; but at least it is less utterly brutal and overpowering than it was. Selfishness is still very prominent, and the capability of deceit for personal ends is still undoubtedly present; but already the green seems to be dividing itself into two distinct qualities, showing that mere cunning is gradually becoming adaptability.<\/p>", "images": [], "label": "15. The Ordinary Person (cont.)"}, {"pdf_page_index": 101, "pdf_page_number": 102, "html": "<p>This drawing of the astral body represents not only the average quality of the type of man to which it belongs, but also its average condition when comparatively at rest. The astral body of any ordinary person is so very rarely at rest that we should gain but a very incomplete idea of the possibilities of its appearance if we omitted to consider it as it is when affected by sudden impulses or rushes of feeling. There are also certain more permanent attitudes of mind which produce modifications of the astral body that are sufficiently distinctive to be worthy of remark, and we shall now devote a few plates to illustrating these various effects.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.012.jpg", "caption": "Illustration from the original edition"}], "label": "15. The Ordinary Person (cont.)"}, {"pdf_page_index": 102, "pdf_page_number": 103, "html": "<h3 class=\"pdf-heading\">16. Sudden Emotions<\/h3>\n<p>Some of these produce most striking results in the astral body—results which are well worth careful study. It should be premised that every one of the illustrations this book is drawn from life. They are not given in somebody’s idea of how a man might look under certain conjectured conditions; they are the representation of the appearance presented by the vehicles of living persons under the circumstances described. They are the result, not of imagination, but of observation and careful reproduction. For instance, by turning to Plate XI, we shall see an attempt to picture the effect which is visible when a sudden wave of strong and perfectly pure affection sweeps over a person—the example chosen being that of a mother as she snatches up her baby and covers it with kisses. In a moment the astral body is thrown into violent agitation, and the original colors are for the time almost obscured. In this, as in all these cases, the astral body of the ordinary person, as given in Plate X, is taken as a basis or background, though during the passage of the violent emotion but little is seen of it. If the change introduced in Plate XI is analysed it will be found to consist of four separate parts.<\/p>", "images": [], "label": "16. Sudden Emotions"}, {"pdf_page_index": 103, "pdf_page_number": 104, "html": "<p>1. Certain coils or vortices of vivid color are to be seen, well-defined and solid-looking, and glowing with an intense light from within. Each of these is in reality a thought-form of intense affection, generated within the astral body, and about to be poured forth from it towards the object of the feeling. In the book <em>Thought Forms<\/em> will be found a drawing of one of these very coils as it flew through the air on its way to its goal. It will be observed that a certain modification of shape has been caused by the rapid motion, so that the spiral has become a projectile, somewhat resembling the head of a comet. It is difficult to depict these whirling clouds of living light, but their real appearance is indescribably lovely.<\/p>\n<p>2. The whole astral body is crossed by horizontal pulsating lines of crimson light, more difficult to represent accurately even than the thought-forms, by reason of the exceeding rapidity of their motion. The general effect, however, has been very happily caught by the artist.<\/p>\n<p>3. A kind of film of rose-color covers the surface of the whole astral body, so that all within is seen through it, as<\/p>\n<p>through tinted glass. In the drawing this shows only at the edges.<\/p>\n<p>4. A sort of crimson flush filling the entire astral body, tinging to some extent all the other hues, and here and there condensing itself into irregular floating wisps, like half formed cirrus clouds.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.013.jpg", "caption": "Illustration from the original edition"}], "label": "16. Sudden Emotions (cont.)"}, {"pdf_page_index": 104, "pdf_page_number": 105, "html": "<p>This magnificent display of astral fireworks usually lasts only a few seconds, and then the body rapidly resumes its normal condition. Yet every such rush of feeling produces its effect; it adds a little to the crimson in the higher part of the oval, and it makes it a little easier for the particles of the astral body to respond to the next wave of affection which comes. Transient though such an impulse may be, yet as it occurs again and again its effects are cumulative; and another point which must not be forgotten is the good influence upon others which is produced by the radiation of vivid vibrations of love and joy.<\/p>\n<p>Many true hearts will be the happier for knowing that one who sends a thought of intense affection to another actually gives something of himself—that a certain portion of astral matter passes from him to the loved one, charged so strongly with its own special rate of vibration that unless some determined preoccupation exists it cannot but reproduce itself, it cannot fail to set the astral body of the recipient swinging in harmony with it; and that means that love tends to kindle love, and therefore that to love a person is definitely to make him a better man than he would otherwise be.<\/p>\n<p><em>Devotion<\/em><\/p>", "images": [], "label": "16. Sudden Emotions (cont.)"}, {"pdf_page_index": 105, "pdf_page_number": 106, "html": "<p>Except that blue is everywhere substituted for crimson, Plate XII is almost identical with Plate XI. It illustrates a sudden accession of devotional impulse which surged over a nun while engaged in contemplation. All the four forms of manifestation which we noted in connection with the impulse of affection are also observable here—the whirling, gleaming coils, the rapidly-vibrating horizontal lines, the outer film, and the wisps of cloud—and their signification is precisely the same, substituting everywhere religious feeling for affection.<\/p>\n<p>So perfect an outburst of devotion is somewhat rare— much less common than a similarly perfect outrush of love. A surge of feeling of this nature, but generally without its definiteness or precision, may sometimes be seen to occur in the case of one who offers an act of adoration before an altar. Usually the parallel lines are less regular and less prominent, and the sharply-defined coils are altogether absent, their place being taken by shapeless clouds of blue vapor.<\/p>", "images": [], "label": "16. Sudden Emotions (cont.)"}, {"pdf_page_index": 106, "pdf_page_number": 107, "html": "<p>In the great majority of cases, devotion as a sentiment seems to be vague and ill-defined, and so fine a specimen as that given in our illustration is indeed rare. In this instance, when the coils passed out from the astral body they did not assume the form of round-headed projectiles, as in the case of the wave of affection, but instead became splendid upward-rushing spires. One of these also is given in Thought-Forms, and an attempt is there made to illustrate the marvellous outpouring of force from higher planes which is evoked by such an effort of devotion.<\/p>\n<p><em>Intense Anger<\/em><\/p>\n<p>Plate XIII is perhaps the most striking in appearance of the whole series, and even without any explanation it would of itself be an eloquent warning against the folly of yielding to a fit of passion. As in the previous cases, the ordinary background of the astral body is temporarily obscured by the rush of feeling, but now the strong and vivid thoughts are unfortunately those of malice and ill-will. They express themselves once more as coils or vortices, but this time as heavy, thunderous masses of sooty blackness, lit up from within by the lurid glow of active hatred. Less defined wisps of the same dark cloud are to be seen defiling the whole astral body, while the fiery arrows of uncontrolled anger shoot among them like flashes of lightning.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.014.jpg", "caption": "Illustration from the original edition"}, {"file": "charles-webster-leadbeater_man-visible-and-invisible.015.jpg", "caption": "Illustration from the original edition"}], "label": "16. Sudden Emotions (cont.)"}, {"pdf_page_index": 107, "pdf_page_number": 108, "html": "<p>A tremendous and truly awful spectacle; and the more fully it is understood the more terrible it appears. For this is the case of a man who is absolutely transported and beside himself with rage—a man who for the time being has utterly lost control of himself. Even should the discipline of education and custom still withhold him from outward violence, those terrible flashes are penetrating other astral bodies like swords, and the man is injuring those about him just as really as, though less visibly than, if he assaulted them on the physical plane.<\/p>\n<p>While he is thus a source of danger to others, he is utterly defenceless himself. For the moment passion has entirely controlled him; the desire—elemental is supreme, and the true man has temporarily lost hold of his vehicle. Under those circumstances another and stronger will may seize that which he has allowed to be wrested from him. In other words, at such a moment, when a man is transported with rage, he is liable to be seized and obsessed either by a dead man of similar nature or by some evil artificial elemental whose vibrations synchronize with those which are dominating him. Not only is he a danger to his fellows, but he is in appalling danger to himself.<\/p>", "images": [], "label": "16. Sudden Emotions (cont.)"}, {"pdf_page_index": 108, "pdf_page_number": 109, "html": "<p>The case selected for illustration is of course an extreme one, and such a condition does not usually last more than a few minutes. But everyone who falls into a passion exhibits these characteristics to some extent; and one cannot but feel that if men only knew how they appeared in the eyes of those who can see, when they yield themselves to those outbursts of anger, they would surely take far greater care to avoid them.<\/p>\n<p>The gust of passion passes away, but it leaves its mark behind. In the astral body of the average man there is always a certain amount of scarlet, which shows the capacity for anger, the possibility of being irritated; and each outburst of rage adds something to this, and predisposes the matter of the entire vehicle to respond somewhat more readily than before to these very undesirable vibrations.<\/p>\n<p>It must also be remembered that though the passion may be impermanent, the record of it remains for ever in the memory of nature; though the elemental created by an evil wish will cease to exist after a period proportioned to the strength of that wish, yet the living photograph of every instant of its life remains, and all the wide-spreading results of its actions during that life are charged with absolute justice to the karma of its creator.<\/p>\n<p><em>Fear<\/em><\/p>", "images": [], "label": "16. Sudden Emotions (cont.)"}, {"pdf_page_index": 109, "pdf_page_number": 110, "html": "<p>The effect of fear upon the astral body is very striking A sudden shock of terror will in an instant suffuse the entire body with a curious livid grey mist, while horizontal lines of the same hue appear, but vibrate with such violence as to be hardly recognizable as separate lines. The result is indescribably ghastly, and it is impossible to convey an adequate idea of it by illustration. Plate XIV gives such suggestion of it as can be put upon paper, but it can hardly depict the strange way in which all light fades out for the time from the body, and the whole grey mass quivers helplessly like a jelly.<\/p>\n<p>Such an appearance as this denotes deadly panic, and ordinarily soon passes away. A condition of permanent fear or extreme nervousness expresses itself in a much modified form of the same phenomena, but the peculiar tinge of grey, and the characteristic quiver, are invariable signs of this haunting presence.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.016.jpg", "caption": "Illustration from the original edition"}], "label": "16. Sudden Emotions (cont.)"}, {"pdf_page_index": 110, "pdf_page_number": 111, "html": "<h3 class=\"pdf-heading\">17. More Permanent Conditions<\/h3>\n<p>We have endeavored to illustrate the immediate effect of some of the sudden emotions which affect the outer vehicles of man, and to explain that, quickly as they pass, they are not without permanent results to the soul within. It remains for us to describe the way in which certain dispositions or types of character manifest themselves, so that it may be seen to what extent each of these modifies the progress of the man upon his upward path.<\/p>\n<p>There is one influence, however, which produces a considerable result in the lives of most men, which does not exactly belong to either of these categories. It is often sudden in its advent, and in most cases it is certainly not life-long in its duration; but still it does not fade away so rapidly as those which we have been considering. Nevertheless, in the life of such a man as is imaged in Plates VIII, IX, and X, it is usually the main event; indeed it is very frequently the one really bright spot in an existence which is otherwise monotonous, sordid and selfish—the only occasion on which such a personality is lifted temporarily out of himself and lives for a while on an altogether higher level.<\/p>\n<p>This sudden elevation comes to the person who, as it is commonly called, “falls in love”.<\/p>", "images": [], "label": "17. More Permanent Conditions"}, {"pdf_page_index": 111, "pdf_page_number": 112, "html": "<p>Into a life cramped and limited there suddenly shines a gleam from above, and the divine spark within glows brighter in response. Later, the man may lose it again, and descend once more into the murky light of common day; yet nothing can take away from him the experience, and the glory of the higher life has been to some extent revealed. He has at least passed through a phase when for a longer or shorter period self was dethroned, and another entity occupied the first Place in his world; and thus he learns, for the first time, one of the most valuable lessons in the whole course of his evolution. It will be Tons yet before that lesson is perfectly assimilated, yet even this first glimpse of it is of enormous importance to the ego, and its effect on the astral body is worthy of special notice.<\/p>\n<p>The transformation is unexpected and complete, as will be seen by comparing Plate X with Plate XV. The two bodies could not be recognized as belonging to the same person, so extraordinary is the alteration. It will be seen that certain qualities have altogether disappeared for the time, that others have been enormously increased, and that their relative positions have considerably changed.<\/p>", "images": [{"file": "charles-webster-leadbeater_man-visible-and-invisible.017.jpg", "caption": "Illustration from the original edition"}], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 112, "pdf_page_number": 113, "html": "<p>Selfishness, deceit and avarice have vanished, and the lowest part of the oval is now filled with a large development of animal passions. The green of adaptability has been replaced by the peculiar brownish-green of jealousy, and the extreme activity of this feeling is shown by the bright scarlet flashes of anger which permeate it.<\/p>\n<p>But the undesirable changes are more than counterbalanced by the splendid band of crimson which fills so large a part of the oval. This is for the time a dominant characteristic, and the whole astral body glows with its light. Under its influence the general muddiness of the ordinary body has disappeared, and the hues are all brilliant and clearly marked, good and bad alike. It is an intensification of the life in various directions.<\/p>\n<p>It will be noticed that the blue of devotion is also distinctly improved, and even (so much has the nature been temporarily elevated) a touch of pale violet appears at the summit of the ovoid, indicating a capacity of response to a really high and unselfish ideal. The yellow of intellect, however, has entirely vanished for the time—which I suppose would be considered by the cynical as characteristic of the condition!<\/p>", "images": [], "label": "17. More Permanent Conditions (cont.)"}, {"pdf_page_index": 113, "pdf_page_number": 114, "html": "<p>It seems scarcely possible that after all this brilliant development the man should sink back again into the condition indicated in Plate X, yet in the majority of cases this is what occurs, though naturally the amount of crimson has considerably augmented, and it is clearer in hue than before. This experience of being “in love” is assuredly a valuable one for the ego, and gives him a definite forward impulse, even though there may often be associated with it much that is undesirable.<\/p>\n<p>The intensely strong and unselfish affection often felt by c
